reference: environmental-statement
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: eia-development
        value: true
        description: Development listed in Schedule 1 of the EIA Regulations 2017.
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: All applications where the development is listed in Schedule 1 of the Town and Country Planning
  (Environmental Impact Assessment) Regulations 2017. Developments that are listed in Schedule 2 of the
  above regulations, either above or below the thresholds, may require an Environmental Statement if it
  is likely to have significant effects on the environment by virtue of factors such as nature, size and
  location.
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.3 (Environmental
  information). Schedule 2 development needs one only if a screening opinion finds likely significant
  effects, so that part is discretionary. The list's contents are for a screening request, not for the
  statement, so none are listed here.
