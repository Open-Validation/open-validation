reference: coastal-change-assessment
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - site:
      in:
      - coastal-erosion-zone
      description: In a vulnerable coastal area or a Coastal Change Management Area.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraphs 171 to 173
source-text: Development in vulnerable coastal areas or in areas identified as a Coastal Change Management
  Area.
must-include:
- item: The development will be safe over its planned lifetime and not have an unacceptable impact on
    coastal change
  level: must
- item: The character of the coast, including designations, is not compromised
  level: must
- item: The development provides wider sustainability benefits
  level: must
- item: The development does not hinder a continuous signed and managed route around the coast
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.9 (The
  water environment). The list calls it Coastal Change.
review-status: unverified
field-status: {}
