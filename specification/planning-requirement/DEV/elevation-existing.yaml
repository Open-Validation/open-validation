reference: elevation-existing
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings or structures are proposed.
    - condition:
        field: external-alterations
        value: true
        description: Existing buildings or structures would be altered.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing new or altered buildings or structures
must-include:
- item: All sides of the proposed/affected buildings or structure, including all window and door openings
  level: must
- item: Existing and proposed elevations (e.g. 1:50 or 1:100)
  level: must
- item: Major dimensions
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.1 (Plans,
  drawings and surveys). The list's text says 'These should:'.
review-status: unverified
field-status: {}
