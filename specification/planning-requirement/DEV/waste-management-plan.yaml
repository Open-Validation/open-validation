reference: waste-management-plan
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Devon Waste Plan policy W4; National Planning Policy for Waste
source-text: All applications for major development or applications that are likely to generate significant
  volumes of waste through development or operation phases
must-include:
- item: Sustainable procurement measures to minimise waste during construction
  level: must
  required-if: discretionary
- item: Types and quantities of waste from demolition and construction and how it will be managed in line
    with the waste hierarchy
  level: must
  required-if: discretionary
- item: Types and quantities of waste from the operational phase and how it will be managed in line with
    the waste hierarchy
  level: must
  required-if: discretionary
- item: Types and quantities of waste from the end-of-life phase and how it will be managed in line with
    the waste hierarchy
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.10 (Sustainable
  design and waste management). The list calls it a Waste Audit Statement (template in the Waste Management
  and Infrastructure SPD). 'Likely to generate significant volumes of waste' is a judgement, so that part
  is discretionary. The contents are 'where relevant to the proposal'.
review-status: unverified
field-status: {}
