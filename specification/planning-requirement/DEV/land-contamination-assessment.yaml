reference: land-contamination-assessment
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - discretionary
    - condition:
        field: sensitive-end-use
        value: true
        description: The application is for a sensitive use.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraphs 174, 183, 184 and 188; Devon Waste Plan policy W16
source-text: Applications where contamination could be an issue due to the previous use of the site (or
  adjacent to the site) or where the application is for a sensitive use
must-include:
- item: As a minimum, a Phase 1 Study based on desk-based research (historic maps etc.) and a site walkover
  level: must
- item: Risks to both human health and controlled waters
  level: must
- item: An initial risk assessment identifying potential sources of contamination, pathways and receptors,
    evaluating the risks and options for breaking pollutant linkages
  level: must
- item: A Phase 2 Report (site investigation and risk assessment), unless the initial assessment shows
    the risk can be reduced to an acceptable level
  level: must
  required-if: discretionary
- item: A remediation and verification strategy, where the Phase 2 report identifies remediation works
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.13 (Land
  and soil). The list calls it a Contaminated Land Assessment. Whether contamination could be an issue
  from previous uses is a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
