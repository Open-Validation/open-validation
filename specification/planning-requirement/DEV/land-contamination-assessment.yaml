reference: land-contamination-assessment
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination could be an issue due to the previous use of the site or adjacent land.
    - condition:
        field: sensitive-end-use
        value: true
        description: The application is for a sensitive use.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
source-text: Required where contamination could be an issue due to the previous use of the site or adjacent
  land, or where the application is for a sensitive use
confidence: medium
notes: 'Audit (wrong_trigger): the workbook carried the land stability report text. The list also asks
  for a Phase 2 report (see unmapped).'
review-status: unverified
field-status: {}
