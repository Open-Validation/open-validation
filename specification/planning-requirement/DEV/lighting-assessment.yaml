reference: lighting-assessment
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - condition:
      field: external-lighting
      value: true
      description: The proposal includes external lighting.
  - any:
    - condition:
        field: outside-urban-area
        value: true
        description: In the open countryside.
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraph 185; Devon Waste Plan policies W11, W12, W17 and W18
source-text: 'All applications that propose external lighting that: are in the open countryside would
  face residential properties would spill into a designated habitat or affect a protected species or would
  spill onto the transport network'
must-include:
- item: A layout plan
  level: must
- item: Mounting height
  level: must
- item: Beam orientation and spread
  level: must
- item: Design of lighting fixtures
  level: must
- item: Controls (movement sensors and/or timers where practical)
  level: must
- item: Hours of use
  level: must
- item: The area of any light spill, mitigating measures and the impact of light spill on receptors
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.16 (Lighting).
  The list calls it a Lighting Statement. Whether lighting would face homes or spill onto habitats or
  roads depends on the design, so those parts are discretionary.
review-status: unverified
field-status: {}
