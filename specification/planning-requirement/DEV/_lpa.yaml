submission-standards:
- item: No individual electronic document larger than 5 MB; large documents broken into manageable files
    (e.g. chapters)
  level: should
- item: Electronic file names reflect the plan or document names
  level: should
- item: Drawings oriented so that they appear correctly when viewed on screen
  level: should
- item: Plans and drawings legible, with clear labels and legends, distinguishing existing features to
    be retained or removed from proposed features
  level: should
- item: Plans at an appropriate scale with a scale bar and calibration scale, and a north point
  level: should
- item: Each plan has a unique drawing reference number and title, and a revision number when revised
  level: should
- item: Where an LVIA forms part of an Environmental Statement, one set of good quality hard copies of
    visualisations (e.g. photomontages) at the appropriate sheet size, in addition to electronic copies
  level: must
