reference: noise-assessment
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Will generate significant noise, alone or in combination.
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraph 185; Noise Policy Statement for England; Devon Waste Plan policies W11, W12 and
  W18
source-text: 'All applications that: will generate significant noise, either alone or in combination with
  other existing or proposed development or are within a noise sensitive area'
must-include:
- item: Baseline data on existing noise levels, including frequency analysis
  level: should
- item: Representative and free field sensitive receptors and measuring points, and why they are appropriate
  level: should
- item: Likely noise emissions during construction and operation (by phase) and their effects
  level: should
- item: How the design minimises and/or mitigates noise to avoid significant adverse impacts on health
    and quality of life
  level: should
- item: Cumulative impact scenarios where cumulative effects are possible
  level: should
- item: Impact of any residual increase in noise, in particular on protected areas of tranquillity such
    as AONBs
  level: should
- item: Whether the noise will affect wildlife and noise-sensitive ecological receptors and designated
    sites
  level: should
- item: A noise monitoring and mitigation/management scheme
  level: should
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.15 (Noise).
  The list calls it a Noise Impact Assessment. It gives no map of 'noise sensitive areas' (it describes
  areas sensitive to loss of tranquillity), so that part is discretionary. The contents are what assessments
  'should generally include'.
review-status: unverified
field-status: {}
