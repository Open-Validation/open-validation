reference: sustainable-drainage-strategy
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - ref: major-development
    - all:
      - condition:
          field: minor-development
          value: true
          description: Minor development.
      - condition:
          field: drainage-alterations
          value: true
          description: Alters the existing drainage arrangements (surface or foul water) or interrupts
            the natural drainage.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraphs 152 to 167; Devon Waste Plan policy W19
source-text: 'Applications for: major development; or minor development that proposes an: alteration to
  the existing drainage arrangements (surface water or foul water); and/or interruption to the natural
  drainage. A scheme will not be required if an FRA considers surface water drainage and proposes sustainable
  drainage systems.'
must-include:
- item: 'Major development: proposals for sustainable drainage systems to manage run-off, unless shown
    to be inappropriate'
  level: must
  required-if:
    ref: major-development
- item: Current surface water drainage for the site, including discharge routes, flow rates, volumes and
    amenity and ecology benefits
  level: must
- item: Surface water discharge as high up the drainage hierarchy as reasonably practicable (infiltration,
    surface water body, surface water sewer or highway drain, combined sewer), with justification
  level: must
- item: The sustainable drainage system and how it is designed in accordance with DCC SuDS guidance, including
    calculations and water quality, amenity and ecology benefits
  level: must
- item: Storage calculations using FEH rainfall data plus 10% for urban creep, with climate change allowances
    in accordance with Environment Agency / Defra mapping
  level: must
- item: Arrangements for maintaining the drainage system for the lifetime of the development
  level: must
- item: Measures during construction so as not to increase flood risk
  level: must
- item: How pollution to surface water will be avoided
  level: must
- item: Justification where sustainable drainage systems are shown to be inappropriate
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.9 (The
  water environment). The list calls it a Sustainable Drainage Scheme. It is not needed if the Flood Risk
  Assessment covers surface water drainage and proposes sustainable drainage.
review-status: unverified
field-status: {}
