reference: sustainability-statement
local-authority: DEV
required-if:
  application-type:
    in:
    - waste-dev
    - reg-3
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Climate Change Act 2008; Devon Carbon Plan; NPPF section 14; Devon Waste Plan policies W2, W4,
  W6 and W14
source-text: All applications (as relevant, proportionate, and specific to the development)
must-include:
- item: The carbon emissions associated with each stage of the development's lifecycle
  level: must
- item: How the design has minimised lifecycle carbon emissions during construction, operation, maintenance
    and end of life (decommissioning/restoration)
  level: must
- item: 'Construction: materials chosen to minimise embodied carbon; minimising energy and water use and
    using renewable energy; avoiding damage to carbon stores; landscaping or habitat creation to offset
    construction emissions'
  level: must
- item: 'Operation and maintenance: minimising energy use and maximising efficiency and renewable energy,
    including use of landform, layout, orientation, massing and planting; how Local Plan energy requirements
    will be met; minimising water use; offsetting annual emissions'
  level: must
- item: 'End of life: materials chosen for reuse or recycling; opportunities for renewable energy and
    landscaping to absorb carbon'
  level: must
- item: How sustainable drainage schemes have been incorporated
  level: must
- item: How impact on neighbouring properties will be minimised during construction and operation
  level: must
- item: How green infrastructure connections will be enhanced through landscaping and ecology and biodiversity
    provision
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.10 (Sustainable
  design and waste management). The list applies to waste development and the County Council's own (Regulation
  3) development, so 'all applications' is shown as those two types. The list calls it a Sustainable Design
  Statement. It may cross-refer to other documents that cover the same information.
review-status: unverified
field-status: {}
