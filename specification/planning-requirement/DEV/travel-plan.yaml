reference: travel-plan
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: pupil-increase
        operator: '>='
        value: 1
        description: A school development that increases pupil numbers.
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraph 113 and section 9; Devon Waste Plan policy W17
source-text: 'Applications for: school developments that result in an increase in pupil numbers; and/or
  developments which generate a significant amount of movement in sustainable and active travel modes
  or developments which generate any increase in motorised transport'
must-include:
- item: 'Schools: current and proposed numbers of pupils and staff'
  level: must
  required-if:
    condition:
      field: pupil-increase
      operator: '>='
      value: 1
      description: A school development that increases pupil numbers.
- item: 'Schools: staff travel patterns and current measures supporting active and sustainable staff travel'
  level: must
  required-if:
    condition:
      field: pupil-increase
      operator: '>='
      value: 1
      description: A school development that increases pupil numbers.
- item: 'Schools: current and proposed car and cycle/scooter parking (type, number, location) and how
    safe and convenient access will be provided, particularly for walking, cycling and scooting'
  level: must
  required-if:
    condition:
      field: pupil-increase
      operator: '>='
      value: 1
      description: A school development that increases pupil numbers.
- item: 'Schools: how sustainable travel will be increased and car journeys, congestion and inappropriate
    parking reduced'
  level: must
  required-if:
    condition:
      field: pupil-increase
      operator: '>='
      value: 1
      description: A school development that increases pupil numbers.
- item: 'Schools: an up-to-date School Travel Plan (or a commitment to provide one before use) where the
    development creates a significant amount of movement'
  level: should
  required-if: discretionary
  source-text: Where a school development will create a significant amount of movement (by any mode of
    transport) an up-to-date School Travel Plan should be provided with the application
- item: Details of the development's effects on health and wellbeing, assessing its health impacts (positive,
    negative and neutral)
  level: must
- item: Relates explicitly to the Transport Assessment or Statement, if one is required
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.8 (Transport
  and highways). For schools the list treats 20 pupils or 25% as a general guideline for 'significant'
  movement but decides case by case. For other development it refers to the Local Plan's trigger points,
  so those parts are discretionary.
review-status: unverified
field-status: {}
