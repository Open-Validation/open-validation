reference: site-investigation
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - discretionary
    - condition:
        field: distance-to-unstable-feature
        operator: <=
        value: 200
        description: Within 200 metres of cliffs, ridges, steep embankments, steep slopes or mining activities.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraphs 170, 178, 179 and 183
source-text: 'Applications: where the site or adjacent area is suspected or likely to be unstable or on
  land within 200 metres of cliffs, ridges or steep embankments, steep slopes or mining activities'
must-include:
- item: Assessment of local geology
  level: must
- item: Land stability history of the site
  level: must
- item: Site inspection
  level: must
- item: Some ground investigation, e.g. soil testing, slope stability analysis and reporting
  level: must
- item: Assessment of land stability risks
  level: must
- item: Mitigation measures
  level: must
- item: Effects of natural and manmade underground cavities and ground compression
  level: should
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.13 (Land
  and soil). The list calls it Geo-technical Data (Land Stability Report). Whether land is suspected to
  be unstable is a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
