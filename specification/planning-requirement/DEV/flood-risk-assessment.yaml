reference: flood-risk-assessment
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: Site of more than 1 hectare (Flood Zone 1).
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: Site of more than 1 hectare (Flood Zone 1).
    - site:
        in:
        - critical-drainage-area
        description: In a Critical Drainage Area.
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraphs 162 to 169; Devon Waste Plan policy W19
source-text: 'Required for proposals: in Flood Zones 2 and 3 of more than 1 hectare in Flood Zone 1 in
  a Critical Drainage Area in Flood Zone 1 or less than 1 hectare in Flood Zone 1 (including a change
  of use proposals to a more vulnerable class) where they could be affected by sources of flooding other
  than rivers and the sea, e.g. surface water drains, reservoirs'
must-include:
- item: Reference to the Strategic Flood Risk Assessment
  level: must
- item: Flood warning and flood evacuation procedures
  level: must
- item: Plans, including an outline of the development with identified areas for SuDS
  level: must
- item: Surveys
  level: must
- item: Assessment of flood risk and surface water run-off, including impacts off site
  level: must
- item: Flood management and protection measures
  level: must
- item: Evidence that the development will be safe for its lifetime, will not increase flood risk elsewhere
    and (where possible) will reduce flood risk overall
  level: must
- item: A sequential/exception test, with evidence on alternative sites at lower risk, if necessary
  level: must
  required-if: discretionary
- item: Surface water flood risk considered, with sustainable drainage systems wherever possible
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.9 (The
  water environment). Smaller Flood Zone 1 sites need one only where they could be affected by other sources
  of flooding, which is a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
