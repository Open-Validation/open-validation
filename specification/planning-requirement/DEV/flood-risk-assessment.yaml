reference: flood-risk-assessment
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - flood-risk-zone
        - critical-drainage-area
        description: The site is in Flood Zone 2 or 3, or in a Critical Drainage Area.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: More than 1 hectare in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: More than 1 hectare in Flood Zone 1.
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
source-text: 'Flood Risk Assessment Required for proposals: in Flood Zones 2 and 3 of more than 1 hectare
  in Flood Zone 1 in a Critical Drainage Area in Flood Zone 1 or less than 1 hectare in Flood Zone 1 (including
  a change of use proposals to a more vulnerable class) where they could be affected by sources of flooding
  other than rivers and the sea, e.g. surface water drains, reservoirs'
confidence: medium
notes: 'Audit (wrong_app_type): not only outline or prior approval (prior approvals are not covered).
  Sites under 1 ha affected by other flood sources are shown as discretionary.'
review-status: unverified
field-status: {}
