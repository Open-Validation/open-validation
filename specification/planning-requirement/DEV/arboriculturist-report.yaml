reference: arboriculturist-report
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on or off the site could be affected.
    - condition:
        field: hedgerows-affected
        value: true
        description: Hedges on or off the site could be affected.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: BS5837:2012; NPPF paragraphs 131, 174 and 180
source-text: An Arboricultural Survey and Tree Protection Plan will be required where the proposed development
  has the potential to affect trees or hedges on or off the site. A full Arboricultural Method Statement
  should be provided where the development is within the root protection area of a tree.
must-include:
- item: Undertaken by a suitably qualified arboriculturist, in accordance with BS5837:2012
  level: must
- item: Plan of all trees on the site (and hedgerows if appropriate), including adjacent trees that may
    be affected, identifying trees for retention, trees for removal and any trees covered by a Tree Preservation
    Order
  level: must
- item: Root protection areas of trees likely to be affected
  level: must
- item: Areas protected from construction operations, with the location of tree protection fencing
  level: must
- item: Survey and categorisation of trees scheduled for removal or that could be impacted, with their
    condition and the potential impact on their health
  level: must
- item: How trees and roots will be protected during construction
  level: must
- item: A full Arboricultural Method Statement showing the proposal is technically feasible
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: The development is within the root protection area of a tree.
  source-text: A full Arboricultural Method Statement should be provided where the development is within
    the root protection area of a tree.
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.6 (Landscape
  and trees). The list calls it an Arboricultural Survey and Tree Protection Plan.
review-status: unverified
field-status: {}
