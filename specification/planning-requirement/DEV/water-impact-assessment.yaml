reference: water-impact-assessment
local-authority: DEV
required-if:
  any:
  - all:
    - application-type:
        in:
        - waste-dev
    - any:
      - condition:
          field: earthworks
          value: true
          description: Involves significant ground works.
      - condition:
          field: dewatering-or-abstraction
          value: true
          description: Involves dewatering or abstraction.
      - condition:
          field: landfill-development
          value: true
          description: Proposes to infill land.
  - all:
    - application-type:
        in:
        - reg-3
    - ref: major-development
    - condition:
        field: earthworks
        value: true
        description: Involves significant ground works.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Devon Waste Plan policy W16; NPPF paragraphs 17 and 174
source-text: 'Waste applications that: involve significant ground works, dewatering, abstraction or propose
  to infill land Major Regulation 3 applications that involve significant ground works.'
must-include:
- item: Existing groundwater levels
  level: must
- item: Impacts of the development on existing water levels
  level: must
- item: Mitigation measures and management of those impacts
  level: must
- item: 'Within a groundwater source protection zone: a risk assessment of the impact on water quality
    and resources'
  level: must
  required-if:
    site:
      in:
      - source-protection-zone
      description: In a groundwater source protection zone.
- item: 'Within or affecting a wetland SSSI: potential water level changes on the SSSI'
  level: must
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      description: Within or affecting a wetland SSSI.
- item: 'Dewatering or abstraction: calculations of the extent and volumes of dewatering; topography,
    drainage, geology and borehole information including licensed and unlicensed abstractions; the natural
    water table, its depth, source catchments and characteristics'
  level: must
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Involves dewatering or abstraction.
- item: 'Dewatering or abstraction: evidence that third parties will not be affected, with mitigation
    where public or private water supplies, water bodies or watercourses could be affected'
  level: must
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Involves dewatering or abstraction.
- item: 'Dewatering or abstraction: methods of dewatering and water disposal, pollution control measures,
    drainage and flood control measures and monitoring measures'
  level: must
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Involves dewatering or abstraction.
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.9 (The
  water environment). The list calls it Hydrological and Hydrogeological Assessments. It may be necessary
  to monitor the existing water regime for at least 12 months before submitting.
review-status: unverified
field-status: {}
