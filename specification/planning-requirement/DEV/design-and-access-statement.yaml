reference: design-and-access-statement
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a conservation area or World Heritage Site.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace
            operator: '>'
            value: 100
            description: More than 100 sq m of floorspace.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Applications for: development within a conservation area or World Heritage Site consisting
  of 1 or more dwellings or floorspace of more than 100m2 or more major development ... However, the following
  applications are exempt from this requirement: waste development engineering or mining operations a
  material change of use amendments to conditions'
must-include:
- item: Details of the development's effects on health and wellbeing, assessing its health impacts (positive,
    negative and neutral)
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 2 (National
  Validation Requirements). Waste development is exempt, so only Regulation 3 applications are shown.
  Engineering or mining operations, a material change of use and amendments to conditions are also exempt.
  The health and wellbeing item is the council's addition to the national contents.
review-status: unverified
field-status: {}
