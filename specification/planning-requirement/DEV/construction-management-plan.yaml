reference: construction-management-plan
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - discretionary
    - condition:
        field: near-watercourse
        value: true
        description: In close proximity to a watercourse.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraphs 11, 184 and 185
source-text: 'Applications for which construction may result in a conflict, disturbance or significant
  impact on: neighbours other road users sensitive wildlife designations sensitive landscape designations
  or when in close proximity to a watercourse'
must-include:
- item: Timetable/programme of works
  level: should
- item: Traffic management, including routeing of vehicles and the number, frequency and size of vehicles
  level: should
- item: Days and hours of building operations and deliveries
  level: should
- item: Location of loading, unloading and storage of plant and materials, and the contractor compound
  level: should
- item: Boundary fencing/hoarding
  level: should
- item: Protection of trees, hedgerows, habitats and protected species during construction
  level: should
- item: Management of risks to nearby watercourses from soil/sediment run-off
  level: should
- item: Parking for site personnel, operatives and visitors
  level: should
- item: Wheel washing and dust control
  level: should
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.11 (Construction).
  The list calls it a Construction Management Scheme. Whether construction may cause conflict or significant
  impact is a judgement, so that part is discretionary. The contents are 'as appropriate'. The list allows
  it to be deferred to a condition if the applicant asks.
review-status: unverified
field-status: {}
