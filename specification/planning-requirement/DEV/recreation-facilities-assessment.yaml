reference: recreation-facilities-assessment
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - site:
      in:
      - open-space
      description: Affects a playing field (or land used as one in the last 5 years and still undeveloped),
        or land identified for playing field use in a development plan.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraphs 98 and 99
source-text: 'All applications that: affect a playing field affect land used for playing fields at any
  time in the last 5 years which remains undeveloped prejudice the use of all or any part of a playing
  field or include land which is identified for use as playing field in a development plan.'
must-include:
- item: Plans of existing and proposed marked playing pitches (winter and summer) including safety margins
  level: must
- item: What the playing field is used for, when and by whom
  level: must
- item: The amount of playing field affected and whether it is useable
  level: must
- item: A statement of need explaining why the development would justify the loss of the playing field
  level: must
- item: Alternative sites considered and why they were discounted
  level: must
- item: Whether the proposal meets one of Sport England's policy exceptions
  level: must
- item: Compliance with the district's Playing Pitch Strategy
  level: must
- item: Any ancillary facilities, e.g. floodlights
  level: must
- item: Specification of any Artificial Grass Pitch and the reason for the surface type
  level: must
- item: 'For any replacement playing field: how equivalent or better quality will be achieved and maintained,
    the programme of works and a management and monitoring plan'
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.7 (Open
  space, playing fields and public rights of way). The list calls it a Playing Field Assessment.
review-status: unverified
field-status: {}
