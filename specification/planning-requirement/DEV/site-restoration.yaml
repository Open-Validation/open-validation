reference: site-restoration
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
  - condition:
      field: landfill-development
      value: true
      description: Involves waste disposal.
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Devon Waste Plan policy W20; National Planning Policy for Waste
source-text: All applications involving waste disposal
must-include:
- item: The proposed restored landscape (landform, land cover, landscape features), how it relates to
    the surrounding contours and features and responds to the landscape character
  level: must
- item: How the proposals improve and connect with the green infrastructure network, including ecological
    requirements from the Wildlife Report and access for informal recreation
  level: must
- item: Management of emissions (including gases and liquids)
  level: must
- item: Phasing arrangements
  level: must
- item: A programme of aftercare and monitoring
  level: must
confidence: medium
notes: 'From the council''s list (published 4 May 2023, last updated 15 September 2025), section 3.19
  (Restoration and aftercare). The list calls it Restoration and Aftercare Scheme(s): a statement and
  plans.'
review-status: unverified
field-status: {}
