reference: location-plan
local-authority: DEV
required-if:
  application-type:
    in:
    - waste-dev
    - reg-3
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Application site clearly edged with a red line, including all land necessary to carry out the
    development (e.g. access from the public highway, car parking, landscaping)
  level: must
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: must
- item: Based on an up-to-date map showing at least two named roads where applicable and surrounding buildings/land
  level: must
- item: At an appropriate scale (typically 1:1250 or 1:2500), scaled to fit A4 or A3 paper wherever possible
  level: must
- item: A north point
  level: must
- item: A unique drawing reference number
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 2 (National
  Validation Requirements). The list applies to waste development and the County Council's own (Regulation
  3) development, so 'all applications' is shown as those two types. For extension of time, variation
  of a condition and reserved matters the red line should be the same as for the original application.
review-status: unverified
field-status: {}
