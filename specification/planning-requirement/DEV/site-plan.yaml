reference: site-plan
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications (where relevant)
must-include:
- item: Block plan of the site and existing and proposed site layout (e.g. 1:50 or 1:100)
  level: should
- item: Proposed finished floor and site levels, contours and heights of the site and adjacent land relating
    to OS datum, shown in metres Above Ordnance Datum (mAOD)
  level: should
  required-if: discretionary
- item: 'For waste proposals: a proposed working plan showing, as appropriate, areas to be excavated;
    railway lines, watercourses, services, buildings and trees to remain undisturbed; storage of topsoil
    and subsoil; screening and landscaping operations including screening bunds; and the location of fixed
    plant, stockpiles, buildings, offices, weighbridge and wheel washes'
  level: should
  required-if:
    application-type:
      in:
      - waste-dev
  source-text: In addition, plans for waste proposals should include a proposed working plan
- item: The proposal in context, including surrounding surface features and topography beyond the site
    boundary
  level: should
- item: All major dimensions, including distances from boundaries or key features
  level: should
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.1 (Plans,
  drawings and surveys). The list applies to waste development and the County Council's own (Regulation
  3) development, so 'all applications' is shown as those two types. Shown as discretionary because the
  list asks for plans 'as appropriate to the development being applied for'. The list's general drawing
  rules (labels, scale bar, north point, drawing number) are in the council's submission standards.
review-status: unverified
field-status: {}
