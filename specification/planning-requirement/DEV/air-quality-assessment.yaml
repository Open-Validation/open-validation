reference: air-quality-assessment
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - air-quality-management-area
        description: Within or adjacent to an Air Quality Management Area.
    - condition:
        field: direct-air-emissions
        value: true
        description: Will generate dust, PM10s, fumes, vapours, odour or other emissions to air (e.g.
          anaerobic digestors, combustion plants).
    - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraphs 184 and 186; Devon Waste Plan policy W18
source-text: 'For proposals that: require a Transport Assessment or Statement are within or adjacent to
  an Air Quality Management Area or will generate dust, PM10s, fumes, vapours, odour or any other emissions
  to the air for example anaerobic digestors and combustion plants'
must-include:
- item: 'For each issue: baseline conditions'
  level: must
- item: Relevant air quality concerns and any previous complaints
  level: must
- item: Scale and nature of the emissions the development will generate
  level: must
- item: Assessment methodology and any requirements for verifying air quality modelling
  level: must
- item: Activities or operations that will generate dust, odour, fumes, PM10 etc.
  level: must
- item: Sensitive locations and receptors, including ecological receptors (e.g. SSSIs)
  level: must
- item: Basis for assessing impact and determining significance
  level: must
- item: Construction phase impact
  level: must
- item: Measures that could improve air quality even where legal limits are not breached
  level: must
- item: Mitigation and management measures
  level: must
- item: Monitoring arrangements
  level: must
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.14 (Air
  quality). Proposals that need a Transport Assessment or Statement also need one; that is itself decided
  case by case, so that part is discretionary.
review-status: unverified
field-status: {}
