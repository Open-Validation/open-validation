source-text: 'further information Air Quality Assessment For proposals that: require a Transport Assessment
  or Statement are within or adjacent to an Air Quality Management Area or will generate dust, PM10s,
  fumes, vapours, odour or any other emissions to the air for example anaerobic digestors and combustion
  plants The Air Quality Assessment must focus on the issues specific to that proposal, for example, dust,
  odour, traffic pollution, bio-aerosols and other pollutants.'
