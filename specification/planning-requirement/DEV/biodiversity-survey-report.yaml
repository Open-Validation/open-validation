reference: biodiversity-survey-report
local-authority: DEV
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.devon.gov.uk/planning/document/validation-requirements-2/
policy: NPPF paragraphs 174 to 182; BS42020; Devon Waste Plan policy W11
source-text: Where the trigger table indicates that a Wildlife and/or Geology Report is required, it must
  be submitted with the application and be produced by a suitably qualified and experienced ecologist.
must-include:
- item: Produced by a suitably qualified and experienced ecologist
  level: must
- item: Report and surveys comply with DCC and Devon wildlife and geology guidance and national guidance
    such as BS42020
  level: must
- item: All information needed to determine the application, including survey information on protected
    and priority species
  level: must
- item: All proposed avoidance, mitigation, compensation and enhancement actions
  level: must
- item: The Wildlife Checklist, completed by the ecological consultant
  level: must
- item: 'Where lighting is proposed: confirmation from an ecological consultant that they are satisfied
    with the lighting proposal'
  level: must
  required-if:
    condition:
      field: external-lighting
      value: true
      description: The proposal includes lighting.
confidence: medium
notes: From the council's list (published 4 May 2023, last updated 15 September 2025), section 3.5 (Ecology).
  Whether a Wildlife and/or Geology Report is needed is decided by the council's Wildlife and Geology
  Trigger Table, which every application must include (see the unmapped list); the table can't be expressed
  as fields, so the report is shown as discretionary. Applications that may affect a SAC, SPA or Ramsar
  site must also give information for a Habitats Regulations Assessment, usually in this report.
review-status: unverified
field-status: {}
