reference: air-quality-assessment
local-authority: DUD
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: An area where air quality does not meet air quality objectives.
  - discretionary
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Black Country Core Strategy (2011) policy ENV8; Black Country Air Quality SPD (2016)
source-text: Developments within areas where air quality does not, or is unlikely to, meet air quality
  objectives (air quality hotspots).
must-include:
- item: Potential increased exposure of relevant receptors affected by the development
  level: should
- item: The individual and cumulative air quality impacts of existing and committed developments
  level: should
confidence: medium
notes: 'From the council''s list (published 1 November 2024), page 37. V30. Discretionary: areas ''unlikely
  to'' meet the objectives (''air quality hotspots'') beyond a declared air quality management area.'
review-status: unverified
field-status: {}
