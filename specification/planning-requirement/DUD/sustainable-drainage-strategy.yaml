reference: sustainable-drainage-strategy
local-authority: DUD
required-if:
  ref: major-development
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Dudley Borough Development Strategy (2017) policy S8
source-text: Sustainable Drainage – required for all major applications (10 or more dwellings, or 1000
  square metres or more of new floorspace). … All major planning applications must include details setting
  out how Sustainable Urban Drainage Systems (SUDS) are proposed to be incorporated in the scheme to alleviate
  sewer / flooding problems by preventing or minimising surface water entering the sewerage system and
  should clearly demonstrate that the scheme is consistent with the relevant planning policies. If this
  is not possible, justification will need to be submitted for why it would be impractical to do so.
must-include:
- item: How SuDS are incorporated to prevent or minimise surface water entering the sewerage system
  level: must
- item: That the scheme is consistent with the relevant planning policies
  level: should
- item: 'If SuDS are not possible: justification of why it would be impractical'
  level: must
confidence: medium
notes: From the council's list (published 1 November 2024), page 20-22. V17.
