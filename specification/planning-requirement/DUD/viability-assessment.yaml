reference: viability-assessment
local-authority: DUD
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 or more residential units.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The affordable housing proposed falls below the quantum required by policy (25%).
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Dudley Borough Development Strategy (2017) policy L3; NPPF section 5
source-text: All applications for 15 or more residential units where the amount of affordable housing
  proposed falls below the quantum required by policy.
must-include:
- item: A full financial appraisal of the scheme, detailing costs and income
  level: should
- item: How the affordable housing will be delivered and the proposed tenure mix
  level: should
- item: A link to the Affordable Housing Statement
  level: should
confidence: medium
notes: From the council's list (published 1 November 2024), page 29-30, 40. V23. The council may have
  it independently assessed at the applicant's cost. V33 (a non-mandatory supporting document) also asks
  for viability evidence with draft Section 106 heads of terms where obligations may affect viability.
review-status: unverified
field-status: {}
