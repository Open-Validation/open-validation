reference: section-existing
local-authority: DUD
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: The proposal changes site levels, existing levels across the site vary by more than 0.3
      m, or (householder) the site's relationship with a neighbouring site is affected by a change in
      ground level.
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing changes to site levels or where existing levels across the site
  vary more than 0.3 metres. … Where an application site itself and its relationship with a neighbouring
  site is affected by a change in ground level, sections should be provided
must-include:
- item: The proposals in relation to adjoining land and buildings
  level: must
- item: Cross section(s) through the proposed site and/or building(s), with a supplementary site plan
    showing where each section is taken from
  level: should
- item: Existing and finished levels, including foundations, retaining structures and how eaves relate
    to adjacent land and boundaries; how any encroachment on adjacent land is avoided
  level: should
- item: Existing site levels and finished floor levels (preferably differentiated by colour), related
    to a fixed datum point off site nearby or on a part of the site not affected by the works
  level: should
- item: At a scale of 1:20 or 1:100
  level: must
  required-if: discretionary
  source-text: section plans through the buildings/ land shall be provided at a scale of 1:20 or 1:100
    demonstrating existing and finished levels.
confidence: medium
notes: From the council's list (published 1 November 2024), page 6, 8, 15. V11 'Existing and Proposed
  Site Sections and Finished Floor and Site Levels', the householder 'Levels survey information' row and
  the plan standards in 2.3 (scale 1:20 or 1:100 'where there is a change in levels across a site, or
  between the application site and adjacent land'). For householder applications the sections should also
  show the effect on how the development will appear and any retaining structures or mitigation.
review-status: unverified
field-status: {}
