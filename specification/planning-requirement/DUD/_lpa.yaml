submission-standards:
- item: All plans uniquely referenced (individual drawing numbers)
  level: must
- item: One copy of forms, documents and plans if submitted by post
  level: must
- item: Plans drawn to an appropriate metric scale (e.g. 1:50, 1:100, 1:200 or 1:500), with a scale bar
    on all plans
  level: must
- item: Plans marked 'Do Not Scale' or with similar disclaimers are not accepted
  level: must
- item: Plans show the direction of North
  level: must
- item: Plans A4 or A3 size wherever possible
  level: should
- item: Information clear enough not to lose detail when scanned and viewed electronically (no faint lines)
  level: must
- item: No personal details (names) on submitted drawings
  level: should
- item: 'Major applications: coloured three-dimensional imagery of at least the main street elevation'
  level: should
