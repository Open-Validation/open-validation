reference: arboriculturist-report
local-authority: DUD
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: 'Trees, woodlands or hedgerows on or immediately adjacent to the site (householder: development
      that will affect trees on or off site).'
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Dudley Borough Development Strategy (2017) policy S22
source-text: All applications where any trees, woodlands or hedgerows are present on or immediately adjacent
  to the application site meeting the criteria set out in the guidance note … Householder applications
  involving development that will effect trees (on or offsite) should indicate the position, spread and
  Root Protection Areas of the tree(s) on the application plans.
must-include:
- item: A plan showing all trees on site and within 8 m of the proposed work
  level: must
- item: A list of trees to be removed and a schedule of any pruning to retained trees
  level: must
- item: 'Where trees are protected by a Tree Preservation Order or conservation area: a report in full
    accordance with BS5837'
  level: must
  required-if:
    site:
      in:
      - tree-preservation-zone
      - conservation-area
      description: Trees protected by a TPO or in a conservation area.
- item: A brief statement of the outcome of any advice sought from the council
  level: should
- item: 'Householder: the position, spread and Root Protection Areas of the trees on the application plans,
    with tree surveys to BS5837'
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published 1 November 2024), page 8, 37. V29 'Arboricultural report - Trees,
  Woodlands and Hedgerows' and the householder 'Tree surveys' row. The detailed criteria are in a council
  guidance note linked from the list.
review-status: unverified
field-status: {}
