reference: heritage-statement
local-authority: DUD
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - archaeological-priority-area
      description: Development affecting a designated or non-designated heritage asset or its setting
        (listed or locally listed buildings, conservation areas, scheduled monuments, registered parks
        or gardens, archaeological priority areas).
  - application-type:
      in:
      - lbc
  - discretionary
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: NPPF section 16
source-text: Will be required on any application (including those for Listed Building Consent) for development
  affecting a “Heritage Asset” … This will be required for applications which effect Designated or Non-Designated
  Heritage Assets including statutory listed buildings, locally listed buildings proposals in Conservation
  Areas, Areas of High Historic Townscape Value, Areas of High Historic Landscape Value, Archaeological
  Priority Areas or schemes which effect the setting of these heritage assets.
must-include:
- item: Prepared by an appropriate expert, proportionate to the significance of the asset
  level: should
- item: Reference to the Historic Environment Record (HER), as a minimum
  level: should
- item: The significance of the heritage assets affected, including any contribution made by their setting,
    and the impact of the proposal on that significance
  level: should
- item: Reference to NPPF section 16 'Conserving and enhancing the historic environment' (paragraphs 189-202)
  level: should
- item: 'Demolition or significant structural alteration of a listed building, or major alterations causing
    substantial harm or total loss: further justifying evidence, such as a marketing report and/or a structural
    survey'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published 1 November 2024), page 8, 34-36. V28 ''Heritage Statement
  and Archaeological Assessments'' and the householder checklist. Discretionary: the council''s local
  designations (Areas of High Historic Townscape, Landscape or Designed Landscape Value), which have no
  matching field.'
review-status: unverified
field-status: {}
