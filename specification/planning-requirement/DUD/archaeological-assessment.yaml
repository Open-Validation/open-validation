reference: archaeological-assessment
local-authority: DUD
required-if: discretionary
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: NPPF section 16
source-text: 'Applications for development that may affect archaeological remains should as a minimum
  include a Desk Based Assessment which shall refer to the Historic Environment Record (HER) and shall
  summarise the following: Justification for development affecting any Scheduled Ancient Monument or other
  archaeological remains of potential national or local importance, the historic development of the site
  and surrounding area, the nature, extent and significance of the above- and belowground remains known
  / likely to be present, the impact that the proposed development is likely to have on the significance
  of surviving assets.'
must-include:
- item: A desk-based assessment that refers to the Historic Environment Record (HER), as a minimum
  level: must
- item: Justification for development affecting any scheduled monument or other archaeological remains
    of national or local importance
  level: must
- item: The historic development of the site and surrounding area
  level: must
- item: The nature, extent and significance of the above- and below-ground remains known or likely to
    be present
  level: must
- item: The likely impact of the development on the significance of surviving assets
  level: must
confidence: medium
notes: 'From the council''s list (published 1 November 2024), page 35-36. V28. Discretionary: ''development
  that may affect archaeological remains'' has no defined area in the list; applicants should check the
  Historic Environment Record.'
