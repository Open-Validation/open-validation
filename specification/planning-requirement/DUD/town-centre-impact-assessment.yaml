reference: town-centre-impact-assessment
local-authority: DUD
required-if:
  all:
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 sq m gross floorspace of town centre uses.
    - discretionary
  - any:
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside (including on the edge of) an existing centre.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with an up to date development plan.
    - discretionary
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Black Country Core Strategy (2011) policy CEN7; NPPF paragraphs 86-90
source-text: a) over 2500m2 gross floorspace would be provided, or where in the opinion of the council,
  the proposal would be likely to have significant adverse implications; and b) is not in accordance with
  an up to date development plan and the proposal is outside (including on the edge) of an existing centre,
  or; is in an existing centre but would substantially increase the attraction of that centre.
confidence: medium
notes: 'From the council''s list (published 1 November 2024), page 33. V26 ''Impact Assessment for Town
  Centre Uses (Including Retailing, Leisure and / or Offices)''. Discretionary: ''in the opinion of the
  council'' significant adverse implications, and a proposal in an existing centre that ''would substantially
  increase the attraction of that centre''.'
review-status: unverified
field-status: {}
