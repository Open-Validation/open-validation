reference: affordable-housing-statement
local-authority: DUD
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 15
    description: 15 or more dwellings.
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Black Country Core Strategy (2011) policy HOU3; NPPF section 5
source-text: All applications for 15 or more dwellings.
must-include:
- item: Property type, number of bedrooms, size, tenure, location and number of the proposed affordable
    dwellings
  level: must
- item: 'Where provision is below the policy quantum (25%): reference to the viability assessment'
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Less than 25% affordable housing is proposed.
confidence: medium
notes: From the council's list (published 1 November 2024), page 29. V22. The Black Country Core Strategy
  seeks 25% affordable housing.
review-status: unverified
field-status: {}
