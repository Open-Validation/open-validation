reference: site-plan
local-authority: DUD
required-if:
  always: true
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: 'Existing and proposed layout of the site at a scale of 1:500 or 1:200 (householder: existing
    and proposed site plan at 1:500), including the positions of any buildings'
  level: must
- item: Details clearly and logically labelled, for example road and building names; where possible at
    least two named roads
  level: should
- item: The site boundaries
  level: must
- item: The type and height of any boundary treatment (e.g. walls, fences)
  level: must
- item: The position and height of any building or structure outside the site but within 10 metres of
    the boundary
  level: must
- item: The proposals in context with adjacent buildings, including property numbers where applicable
  level: must
- item: The direction of North
  level: must
- item: Parking and access arrangements, and the position and details of any trees which may be affected
  level: should
confidence: medium
notes: 'From the council''s list (published 1 November 2024), page 6, 8, 13. V7 (the cell''s opening sentence
  is garbled in the PDF: ''This is a plan at scale 1:500 or 1:200 that shows the existing and proposed
  layout...''), the plan standards in 2.3 and the householder checklist (''Existing and Proposed Site
  Plan (scale 1:500)'').'
review-status: unverified
field-status: {}
