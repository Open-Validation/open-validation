reference: daylight-sunlight-assessment
local-authority: DUD
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: storey-count
        operator: '>'
        value: 4
        description: Exceeding four storeys in height, where adjoining other developed land or public
          open spaces.
  - discretionary
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Dudley Borough Development Strategy (2017) policy L1
source-text: 'All applications involving: • creation of new buildings exceeding four storeys in height
  where adjoining other developed land or public open spaces, • where proposed buildings or extensions
  could lead to overshadowing of other proposed buildings or spaces within the same development site,
  • where the application site is itself subject to significant shading from adjoining buildings or trees.'
must-include:
- item: A daylight, vertical sky component, sunlight availability and shadow study assessed against the
    BRE criteria
  level: should
- item: Existing and expected levels of daylight, sunlight and overshadowing on neighbouring properties,
    and the mitigation measures
  level: should
confidence: medium
notes: 'From the council''s list (published 1 November 2024), page 53. V44. Discretionary: overshadowing
  of other buildings or spaces within the same site, and sites themselves subject to significant shading.
  The council will seek payment towards any consultant review. Listed under 4.3 ''Supporting documents
  (non-mandatory)'': the list says such information will often be needed to decide the application but
  its absence ''would not result in an application not being made valid''.'
review-status: unverified
field-status: {}
