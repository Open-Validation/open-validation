reference: elevation-existing
local-authority: DUD
required-if:
  any:
  - application-type:
      in:
      - hh
  - condition:
      field: new-build
      value: true
      description: The proposal includes new buildings.
  - condition:
      field: external-alterations
      value: true
      description: The proposal alters the exterior of an existing building.
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications proposing new buildings or alterations to the exterior of existing buildings.
must-include:
- item: The proposed works shown in relation to what is already there, preferably differentiated by colour
  level: must
- item: Existing and proposed building materials, and the style, materials and finish of windows and doors
  level: should
- item: Any blank elevations included
  level: should
- item: All elevations clearly and logically labelled (e.g. front or rear elevation), with titles that
    refer to their content
  level: must
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of the openings on each property'
  level: should
- item: 'Where an existing building is extended or altered: the whole of any existing elevation being
    extended or altered, not just part of it'
  level: must
- item: 'Householder: normally at a scale of 1:50 or 1:100'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published 1 November 2024), page 8, 14. V9, and the householder checklist
  ('Existing and Proposed Floor Plans & Elevations (normally to scale of 1:50 or 1:100)'). Existing elevations
  only where there is an existing building. The list places V9 under national requirements, though the
  guide (2.1) calls it local.
review-status: unverified
field-status: {}
