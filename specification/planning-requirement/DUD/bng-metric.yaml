reference: bng-metric
local-authority: DUD
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Environment Act 2021; Biodiversity Gain Requirements (Exemption) Regulations 2024
source-text: the pre-development biodiversity value of the on-site habitat on the date of application
  (or an earlier date) including the completed metric calculation (showing the calculations, the publication
  date and version of the biodiversity metric used to calculate that value);
must-include:
- item: The completed metric calculation, showing the calculations and the publication date and version
    of the biodiversity metric used
  level: must
- item: 'Where an earlier date is used: the proposed earlier date and the reasons for it'
  level: must
- item: Whether the on-site habitat's biodiversity value is lower because of degradation; where unauthorised
    degradation took place after 30 January 2020, the value immediately before it
  level: must
- item: Completed condition assessment forms for each habitat on site, where required
  level: must
confidence: medium
notes: From the council's list (published 1 November 2024), page 17. V13 (national requirement). Applies
  to major and minor applications that are not exempt; by law householder and other exempt applications
  don't need it, so the rule uses the biodiversity gain condition.
review-status: unverified
field-status: {}
