source-text: 16 V13 Biodiversity Net Gain Information In accordance with the National Planning Policy
  Framework (paragraphs 180 and 186) and Environment Act 2021 all major applications from February 2024
  and minor applications from April 2024, as defined in the Town and Country Planning Act, that do not
  qualify for exemption under the Biodiversity Gain Requirements (Exemption) Regulations 2024 will be
  required to meet a minimum of 10% gain biodiversity.
