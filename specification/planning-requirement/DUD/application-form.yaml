reference: application-form
local-authority: DUD
required-if:
  always: true
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: All sections and questions answered
  level: must
- item: Declaration signed and dated
  level: must
- item: Non-residential floorspace given as gross internal floorspace
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Development other than housing (employment, retail, leisure...).
- item: 'Retail development: net floorspace (net tradable area) also given'
  level: must
  required-if:
    condition:
      field: retail-floorspace
      operator: '>'
      value: 0
      description: Retail development.
- item: 'Mobile homes, gypsy, traveller or travelling showpeople plots or pitches: the description of
    the proposal gives the number of homes, plots or pitches'
  level: must
  required-if: discretionary
- item: 'Waste management development: made on a detailed planning application form, with the section
    on ''Industrial or Commercial Processes and Machinery'' completed in full'
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
- item: 'Mineral development: made on a detailed planning application form'
  level: should
  required-if:
    application-type:
      in:
      - mineral-app
      - mineral-extraction
confidence: medium
notes: From the council's list (published 1 November 2024), page 8, 10-11. V1, and the householder checklist
  ('Completed householder application form').
review-status: unverified
field-status: {}
