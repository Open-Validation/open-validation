reference: landscaping-plan
local-authority: DUD
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - site:
        in:
        - conservation-area
        - town-centre
        - local-centre
        - listed-building-setting
        - locally-listed-building
        - park-and-garden
        - local-nature-reserve
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: Within a conservation area or a town, district or local centre; affecting the setting
          of a listed or locally listed building or a registered park or garden; within or next to a Local
          Nature Reserve, SSSI or Site of Importance for Nature Conservation.
    - ref: major-development
    - discretionary
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Dudley Borough Development Strategy (2017) policy S7
source-text: All detailed applications (excluding shop fronts, advertisements, changes of use and householder
  applications) meeting the criteria set out in the adjacent guidance column. … Within a Conservation
  Area. Within a Town, District or Local Centre. Within or adjacent to transport corridors, including
  canals, railways, motorways and major roads. Water frontages where there is public access. Affecting
  the setting of a Listed Building, Building, Structure or Feature on the “Local List,” or a Registered
  Parks or Garden. Within or adjacent to Local Nature Reserves, Sites of Special Scientific Interest,
  Sites of Importance for Nature Conservation, parks, cemeteries or public open spaces. Major applications
  - 10 or more dwellings or new floorspace of 1000 square metres or more.
must-include:
- item: Full details of external layout and landscape proposals, fully integrated with proposals for ecological
    enhancement
  level: must
confidence: medium
notes: 'From the council''s list (published 1 November 2024), page 50. V41 ''Proposed Landscape Scheme''.
  Not needed where there is no open land visible from a public place, unless a heritage asset is affected.
  Discretionary: transport corridors, public water frontages, parks, cemeteries and public open spaces,
  which have no matching field. Listed under 4.3 ''Supporting documents (non-mandatory)'': the list says
  such information will often be needed to decide the application but its absence ''would not result in
  an application not being made valid''.'
review-status: unverified
field-status: {}
