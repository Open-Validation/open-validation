reference: floor-plan-existing
local-authority: DUD
required-if:
  any:
  - application-type:
      in:
      - hh
  - condition:
      field: building-works
      value: true
      description: The proposal creates new or amended floorspace or alters existing buildings.
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications that propose new or amended floorspace and/or proposals to alter existing
  buildings.
must-include:
- item: Details clearly and logically labelled, for example room names, showing all internal divisions
  level: must
- item: The proposal in detail, including any existing buildings or walls to be demolished
  level: must
- item: Existing building(s) and the proposed development, preferably differentiated by colour
  level: should
- item: 'Householder: normally at a scale of 1:50 or 1:100'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published 1 November 2024), page 8, 15. V10, and the householder checklist.
  Existing plans only where there is an existing building.
review-status: unverified
field-status: {}
