reference: water-impact-assessment
local-authority: DUD
required-if:
  any:
  - site:
      in:
      - source-protection-zone
      description: Groundwater Source Protection Zone 1 (see the Black Country Water Cycle Study).
  - discretionary
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Dudley Borough Development Strategy (2017) policy S8
source-text: Sites within a Groundwater Source Protection Zone 1 (refer to Black Country Water Cycle Study
  for details). Applications must include a risk assessment demonstrating that there would be no adverse
  effect on water resources, including aquifers. … Sites that are likely to have an impact on water quality
  Applications should demonstrate how the development will take measures to avoid, minimise or mitigate
  the impacts on water quality including inland surface waters, transitional water, coastal waters and
  groundwater.
must-include:
- item: 'Source Protection Zone 1: a risk assessment showing no adverse effect on water resources, including
    aquifers'
  level: must
  required-if:
    site:
      in:
      - source-protection-zone
      description: Groundwater Source Protection Zone 1.
- item: Measures to avoid, minimise or mitigate the impacts on water quality (inland surface waters, transitional
    and coastal waters and groundwater)
  level: should
confidence: medium
notes: 'From the council''s list (published 1 November 2024), page 21-22. V17 parts b) and c) (the ''Water
  Management Assessment''). Discretionary: sites ''likely to have an impact on water quality''.'
