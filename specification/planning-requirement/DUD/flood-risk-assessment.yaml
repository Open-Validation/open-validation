reference: flood-risk-assessment
local-authority: DUD
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site area of 1 hectare or more in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site area of 1 hectare or more in Flood Zone 1.
  - all:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zone 2 or 3.
    - condition:
        field: new-build
        value: true
        description: New development (excluding extensions at first floor or above).
  - site:
      in:
      - source-protection-zone
      description: Groundwater Source Protection Zone 1.
  - condition:
      field: near-watercourse
      value: true
      description: Containing or adjacent to a culverted watercourse, adjacent to a river corridor, its
        tributaries or the functional floodplain, or adjacent to or close to a waterway.
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Dudley Borough Development Strategy (2017) policy S8
source-text: 'Flood Risk Assessment –required for planning applications where the site area is 1 hectare
  or more in Flood Zone 1 and required for all planning applications for new developments (excluding extensions
  at first floor or above) located in Flood Zones 2 and 3. All applications for development in the particular
  areas identified in the adjacent guidance column … Planning applications on sites in particular areas:
  Sites within a Groundwater Source Protection Zone 1 … Sites containing or adjacent to a culverted watercourse
  … Sites adjacent to a river corridor, their tributaries or the functional floodplain … Sites adjacent
  to or in close proximity to a waterway'
must-include:
- item: Whether the development is likely to be affected by current or future flooding from any source
  level: must
- item: That the development is safe and where possible reduces flood risk overall
  level: must
- item: Whether it will increase flood risk elsewhere
  level: must
- item: The measures proposed to deal with these effects and risks
  level: must
- item: Design that reduces flood risk to the development and elsewhere, using sustainable drainage and,
    where necessary, flood resilience measures
  level: must
- item: How surface water flows will be reduced back to equivalent greenfield rates
  level: must
- item: 'Culverted watercourse: whether it is feasible to open it up, and that the development does not
    occur over culverts where there are deculverting strategies'
  level: should
  required-if:
    condition:
      field: near-watercourse
      value: true
      description: The site contains or adjoins a culverted watercourse.
- item: 'Adjacent to a river corridor, tributary or functional floodplain: how the development benefits
    the river by reinstating a natural channel and restoring the functional floodplain'
  level: should
  required-if:
    condition:
      field: near-watercourse
      value: true
      description: The site adjoins a river corridor, tributary or functional floodplain.
confidence: medium
notes: From the council's list (published 1 November 2024), page 20-23. V17 'Flood Risk Assessment, Sustainable
  Drainage Details and Water Management Assessment'. For sites near a waterway the list says the navigation
  authority or canal owner should have reviewed the FRA. Sustainable drainage is in sustainable-drainage-strategy;
  the Source Protection Zone 1 risk assessment and water quality are also in water-impact-assessment.
review-status: unverified
field-status: {}
