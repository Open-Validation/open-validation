reference: land-contamination-assessment
local-authority: DUD
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - change-of-use
      - lbc
      - demolition-con-area
      - advertising
  - any:
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves excavation, ground works or other ground disturbance.
    - condition:
        field: new-build
        value: true
        description: The proposal is not only a change of use or adaptation of existing buildings.
source-url: https://www.dudley.gov.uk/media/2lvh1ahe/planning_validation_checklist__-nov_2024-1.pdf
policy: Dudley Borough Development Strategy (2017) policy D3; NPPF paragraphs 189 and 190
source-text: 'All applications, except for: Householder applications, and/ or b) Changes of use or adaptation
  of existing buildings that do not involve any excavation, ground works or other operations which involve
  ground disturbance.'
must-include:
- item: A tier 1 preliminary risk assessment in line with the Land Contamination Risk Management (LCRM)
    guidance
  level: should
- item: The overall site objectives
  level: must
- item: A desk study and site walkover
  level: must
- item: An initial conceptual site model
  level: must
- item: Identified potential contaminant linkages
  level: must
- item: 'Where the preliminary assessment shows the site may be significantly contaminated or need extensive
    remediation: a tier 2 generic quantitative risk assessment'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published 1 November 2024), page 28. V21 'Land Contamination and Ground
  Gas Preliminary Risk Assessment'. The tier 2 assessment 'may need to be submitted', so it is shown as
  discretionary.
review-status: unverified
field-status: {}
