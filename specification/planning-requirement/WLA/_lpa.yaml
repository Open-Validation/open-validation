submission-standards:
- item: All plans and drawings at a standard identified metric scale, stating the paper size and showing
    at least two written dimensions
  level: must
- item: All plans have a date of issue and a separate drawing number
  level: must
- item: One set of documents and plans only (one copy if submitted electronically), unless otherwise agreed
  level: must
- item: Submit online via the Planning Portal or other electronic means; documents too large for the Portal
    preferably on CD or DVD
  level: should
- item: A note of how the fee has been calculated (or the reasons no fee is due, with any previous application
    reference)
  level: should
- item: The completed validation checklist for the application type submitted with the application
  level: should
