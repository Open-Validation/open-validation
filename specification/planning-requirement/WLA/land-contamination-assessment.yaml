reference: land-contamination-assessment
local-authority: WLA
required-if:
  any:
  - all:
    - condition:
        field: previously-developed-land
        value: true
        description: Operational development on previously developed (brownfield) land.
    - site:
        in:
        - contaminated-land
        description: The land is known or suspected to be contaminated.
  - site:
      in:
      - near-landfill-site
      description: Within 250 m of a current or former landfill site.
  - condition:
      field: sensitive-end-use
      value: true
      description: A particularly vulnerable use (e.g. schools, hospitals or care homes, family housing,
        day nurseries).
  - application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policy GN3
source-text: 'Thresholds: Operational development on previously developed (brownfield) land where the
  land is known or suspected to be contaminated All development within 250m of current or former landfill
  sites Where the proposed use would be particularly vulnerable (e.g., schools, hospitals or care homes,
  family housing, day nurseries).'
must-include:
- item: As a minimum, a Preliminary Risk Assessment establishing the level and risks of any potential
    contamination
  level: must
- item: 'Prior approval for change of use: the contamination risks on the site and how they will be mitigated'
  level: must
  required-if:
    application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 30, 95, Part 2 item 6 and the
  prior notification of change of use checklist.
review-status: unverified
field-status: {}
