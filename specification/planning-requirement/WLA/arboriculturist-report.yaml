reference: arboriculturist-report
local-authority: WLA
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or hedges within the site, or on adjacent land within 10 m of the development
        site.
  - all:
    - application-type:
        in:
        - consent-under-tpo
    - condition:
        field: tree-condition-reasons
        value: true
        description: The reasons relate to the health and/or safety of the tree(s).
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policy EN2
source-text: 'Tree survey: All development where trees or hedges are located within the proposed development
  site All development where there are trees or hedges on adjacent land within 10m of the development
  site AIA: Required where the proposal (including its associated access, services and earthworks) has
  the potential to affect trees (within or adjacent to the application site): That are subject to a Tree
  Preservation Order; That are within a Conservation Area; That have a notable amenity value; As part
  of a major development'
must-include:
- item: A tree survey, by a suitably qualified arboriculturist, showing which trees are to be retained
    and how they will be protected during construction
  level: must
- item: 'Arboricultural Impact Assessment: a survey of existing trees and hedgerows'
  level: must
  required-if:
    all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees or hedges within the site, or on adjacent land within 10 m of the development
          site.
    - any:
      - site:
          in:
          - tree-preservation-zone
          description: Trees subject to a Tree Preservation Order.
      - site:
          in:
          - conservation-area
          description: Trees within a Conservation Area.
      - ref: major-development
      - discretionary
- item: 'Arboricultural Impact Assessment: a method statement for work in relation to trees (including
    site preparation and earthworks)'
  level: must
  required-if:
    all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees or hedges within the site, or on adjacent land within 10 m of the development
          site.
    - any:
      - site:
          in:
          - tree-preservation-zone
          description: Trees subject to a Tree Preservation Order.
      - site:
          in:
          - conservation-area
          description: Trees within a Conservation Area.
      - ref: major-development
      - discretionary
- item: 'Arboricultural Impact Assessment: a tree constraints plan and a tree protection plan (with fencing,
    ground protection, and drainage, soakaway and service runs)'
  level: must
  required-if:
    all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees or hedges within the site, or on adjacent land within 10 m of the development
          site.
    - any:
      - site:
          in:
          - tree-preservation-zone
          description: Trees subject to a Tree Preservation Order.
      - site:
          in:
          - conservation-area
          description: Trees within a Conservation Area.
      - ref: major-development
      - discretionary
- item: All sections of BS 5837:2012 addressed
  level: must
  required-if:
    all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees or hedges within the site, or on adjacent land within 10 m of the development
          site.
    - any:
      - site:
          in:
          - tree-preservation-zone
          description: Trees subject to a Tree Preservation Order.
      - site:
          in:
          - conservation-area
          description: Trees within a Conservation Area.
      - ref: major-development
      - discretionary
- item: 'Works to a protected tree for health or safety reasons: a report by a tree professional'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - consent-under-tpo
    - condition:
        field: tree-condition-reasons
        value: true
        description: Health and/or safety reasons.
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 69-70, 88, Part 2 item 30 and
  the tree consent checklist. Trees of 'notable amenity value' are discretionary for the Arboricultural
  Impact Assessment.
