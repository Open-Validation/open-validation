reference: application-form
local-authority: WLA
required-if:
  always: true
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 1. The completed standard application form
must-include:
- item: Completed in its entirety, including the particulars specified or referred to on the form
  level: must
- item: 'Prior approval for a larger home extension: a written description giving how far the extension
    goes beyond the rear wall of the original house, its maximum height and eaves height (metric), and
    the addresses of adjoining premises'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
- item: 'Prior approval for a larger home extension: details of any window locations'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
- item: 'Prior approval for agricultural or forestry buildings: a description of the proposed building,
    including the use, design and external appearance, dimensions and materials'
  level: must
  required-if:
    application-type:
      in:
      - pa-build-agri-forest
- item: 'Prior approval for an agricultural or forestry road/access track: its dimensions, materials and
    means of construction'
  level: must
  required-if:
    application-type:
      in:
      - pa-road-agri-forest
- item: 'Approval of details reserved by condition: the planning permission reference and the number(s)
    and description of the condition(s) to be discharged'
  level: must
  required-if:
    application-type:
      in:
      - approval-condition
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 7, 92-108, Part 1 item 1 and
  the Appendix A checklists. Prior approval and discharge of condition requests need not use the standard
  form but must be in writing with the details listed.
review-status: unverified
field-status: {}
