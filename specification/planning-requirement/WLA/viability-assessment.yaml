reference: viability-assessment
local-authority: WLA
required-if:
  condition:
    field: affordable-housing-below-target
    value: true
    description: The applicant believes affordable housing provision will have a negative effect on the
      viability of the scheme.
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policies RS1 and RS2
source-text: 'If the applicant believes provision of affordable housing will have a negative effect on
  the viability of the scheme, they will need to submit a viability assessment containing the following
  information:'
must-include:
- item: Value of the land (2 or 3 different estate agents' valuations)
  level: must
- item: Abnormal development costs and construction costs
  level: must
- item: Price a Registered Provider will pay for the units, and open market value of the dwellings
  level: must
- item: Developer return
  level: must
- item: The percentage of affordable units which can be accommodated on the site
  level: must
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 20, Part 2 item 2 (Affordable
  Housing Statement). It will be reviewed by an independent consultant at the applicant's cost.
review-status: unverified
field-status: {}
