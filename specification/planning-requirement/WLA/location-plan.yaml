reference: location-plan
local-authority: WLA
required-if:
  application-type:
    in:
    - hh
    - full
    - outline-all
    - outline-some
    - lbc
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - pa-build-agri-forest
    - pa-road-agri-forest
    - pa-ecomms-network
    - pa-demo-building
    - hedgerow-removal
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include one copy of a location plan (unless submitted electronically)
  based on an up-to-date map at a scale of 1:1250 or 1:2500.
must-include:
- item: Based on an up-to-date map at a scale of 1:1250 or 1:2500
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear,
    and the direction of North
  level: must
- item: Application site edged clearly in red, including all land needed for the development (e.g. access
    from a public highway, visibility splays, landscaping, septic tanks, car parking and open areas around
    buildings)
  level: must
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: must
- item: 'Lawful development certificates: the land or building to which the use relates edged in red,
    with separate parcels/uses clearly shown, and other land owned or controlled outlined in blue'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
- item: 'Agricultural/forestry prior approval: the position of the building(s) or of the road/access track
    shown in red'
  level: must
  required-if:
    application-type:
      in:
      - pa-build-agri-forest
      - pa-road-agri-forest
- item: 'Hedgerow removal: a plan showing the location and length of the hedgerow(s) to be removed, at
    1:500, 1:1250 or 1:2500'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 9-10, 74-110, Part 1 item 6
  and the Appendix A checklists. Part 1 says 'All applications'; the application types are those whose
  checklists list a location plan (reserved matters, tree works, section 73, discharge of conditions,
  non-material amendment and prior approval for extensions or change of use do not).
review-status: unverified
