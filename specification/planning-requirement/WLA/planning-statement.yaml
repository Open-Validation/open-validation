reference: planning-statement
local-authority: WLA
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: Developments not in accordance with the development plan.
  - discretionary
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
source-text: 'Thresholds: a. All major development (over 10 dwellings, industrial/commercial development
  over 1000 sq m) b. Developments requiring a detailed understanding of policy and context c. Developments
  where “special circumstances” are put forward d. Developments not in accordance with the development
  plan.'
must-include:
- item: An overview of the issues and all relevant planning considerations, the context and need, and
    an assessment against national and local planning policies
  level: should
- item: How the proposal will contribute towards the goals of the West Lancashire Economic Development
    Strategy
  level: should
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 56-57, Part 2 item 23. Developments
  needing a detailed understanding of policy, or putting forward 'special circumstances', are discretionary.
review-status: unverified
field-status: {}
