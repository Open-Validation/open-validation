reference: town-centre-impact-assessment
local-authority: WLA
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Not in an existing centre as defined by the Local Plan.
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with an up to date development plan.
  - any:
    - condition:
        field: comparison-retail-floorspace
        operator: '>'
        value: 500
        description: New or increased comparison retail floorspace over 500 sq m gross.
    - condition:
        field: convenience-retail-floorspace
        operator: '>'
        value: 1000
        description: Supermarkets/superstores over 1,000 sq m gross.
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policy IF1
source-text: All planning applications for new or an increase in comparison retail floorspace over 500m2
  gross, or, in the case of supermarkets/superstores over 1000m2 gross not in an existing centre and not
  in accordance with an up to date development plan.
must-include:
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment area
  level: must
- item: The impact on town centre vitality and viability, including local consumer choice and trade, up
    to five years from the application (ten years for major schemes whose full impact will not be realised
    in five)
  level: must
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 35-37, Part 2 item 9 (Economic
  / Main Town Centre Uses Impact Statement). This is the Impact Assessment part of the Economic Statement;
  the Sequential Assessment, needed for all new main town centre uses outside a centre and not in accordance
  with the plan, has no id (see the unmapped list). Includes applications that create extra floorspace,
  internal alterations needing permission, and conditions changing the range of goods sold.
review-status: unverified
field-status: {}
