reference: section-proposed
local-authority: WLA
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: The application involves new buildings.
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
  - application-type:
      in:
      - pa-road-agri-forest
      - pa-ecomms-network
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: One copy (unless submitted electronically) of such plans drawn at a scale of 1:50 or 1:100,
  showing a cross section(s) through the proposed building(s). In all cases where a proposal involves
  a change in ground levels, illustrative drawings should be submitted to show both existing and finished
  site and floor levels … This will be required for all applications involving new buildings.
must-include:
- item: At a scale of 1:50 or 1:100, with cross section(s) through the proposed building(s)
  level: must
- item: 'Where ground levels change: existing and finished site and floor levels, details of foundations
    and eaves, and how encroachment onto adjoining land is avoided'
  level: should
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels.
- item: Existing site levels and finished floor levels related to a fixed datum point off site, and the
    proposals in relation to adjoining buildings
  level: must
- item: 'Agricultural/forestry road or access track: existing and proposed section at 1:50 showing road
    width, depth of excavation, material and finish colour'
  level: must
  required-if:
    application-type:
      in:
      - pa-road-agri-forest
- item: 'Telecommunications prior approval: a section through the structure at 1:10 or 1:20 showing its
    width'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 17-19, Part 2 item 1E, K and
  L. For householder development the levels may be evident from floor plans and elevations, but on sloping
  sites the list says it will be necessary to show how proposals relate to existing ground levels.
review-status: unverified
field-status: {}
