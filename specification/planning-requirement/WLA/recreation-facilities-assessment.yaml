reference: recreation-facilities-assessment
local-authority: WLA
required-if:
  site:
    in:
    - open-space
    description: Development of existing open space (e.g. public open space, amenity green space and playing
      fields, including disused and former playing field sites).
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policy EN3
source-text: 'Threshold: Applications relating to the development of existing open space (for example
  public open space, amenity green space and playing fields including disused and former playing field
  sites).'
must-include:
- item: Enough information to show compliance with Local Plan policy EN3, with reference to the Playing
    Pitch Strategy and Open Space Study
  level: should
- item: 'Playing fields: the size of the existing playing field and how much of it is affected'
  level: must
  required-if:
    condition:
      field: playing-field
      value: true
      description: The application involves playing fields.
- item: 'Playing fields: an existing site plan (at least 1:1000) showing the winter and summer pitches
    with safety margins'
  level: must
  required-if:
    condition:
      field: playing-field
      value: true
      description: The application involves playing fields.
- item: 'Playing fields: a proposed site plan showing the impact on the pitch layout and any realignment
    of pitches'
  level: must
  required-if:
    condition:
      field: playing-field
      value: true
      description: The application involves playing fields.
- item: 'Playing fields: information on alternative sport and recreation provision'
  level: must
  required-if:
    condition:
      field: playing-field
      value: true
      description: The application involves playing fields.
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 54, Part 2 item 21 (Open Space
  Assessment).
review-status: unverified
field-status: {}
