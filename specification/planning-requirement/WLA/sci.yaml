reference: sci
local-authority: WLA
required-if:
  any:
  - condition:
      field: departure-from-development-plan
      value: true
      description: The proposal constitutes a departure from the Development Plan.
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: Wind turbine development.
    - any:
      - condition:
          field: wind-turbine-count
          operator: '>'
          value: 2
          description: More than 2 turbines.
      - condition:
          field: turbine-hub-height
          operator: '>'
          value: 15
          description: The hub height of any turbine exceeds 15 metres.
  - discretionary
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: Council's Statement of Community Involvement; Planning and Compulsory Purchase Act 2004
source-text: 'Threshold: a. The proposal constitutes a departure from the Development Plan; b. The proposal
  is for wind turbine development involving more than 2 turbines or where the hub height of any turbine
  exceeds 15 metres (please refer to National Planning Practice Guidance for the minimum requirements);
  c. Developments with a significant public interest d. The pre-application advice has specified that
  one is necessary.'
must-include:
- item: How the applicant has complied with the Council's Statement of Community Involvement
  level: must
- item: How members of the local community were involved before submission
  level: must
- item: How the development has evolved in response to community involvement
  level: must
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 8, 62-63, Part 1 item 4(iii)
  and Part 2 item 26. Developments of significant public interest, or where pre-application advice asked
  for one, are discretionary.
review-status: unverified
field-status: {}
