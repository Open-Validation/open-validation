reference: lighting-assessment
local-authority: WLA
required-if:
  any:
  - all:
    - condition:
        field: external-lighting
        value: true
        description: The application involves the provision of external lighting (e.g. floodlights or
          security lighting).
    - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated adverts are proposed.
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policy GN3
source-text: 'Threshold: All applications which involve the provision of external lighting (e.g.. floodlights
  or security lighting) that may have an adverse impact on residential amenity, the character of the open
  countryside, ecology interests or a heritage asset. … Lighting Assessment (where illuminated adverts
  are proposed)'
must-include:
- item: Details of external lighting and the proposed hours when it would be switched on
  level: must
- item: A layout plan with beam orientation, levels of light spillage and a schedule of the equipment
  level: must
- item: Prepared by a recognised independent lighting consultant
  level: should
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 50, 87, Part 2 item 17 and the
  advertisement consent checklist. Whether lighting 'may have an adverse impact' is a judgement, so discretionary.
review-status: unverified
field-status: {}
