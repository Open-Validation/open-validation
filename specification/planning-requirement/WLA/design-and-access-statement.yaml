reference: design-and-access-statement
local-authority: WLA
required-if:
  all:
  - any:
    - ref: major-development
    - application-type:
        in:
        - lbc
    - all:
      - site:
          in:
          - conservation-area
          description: Any part of the development is in a Conservation Area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: The provision of one or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building or buildings with 100 sq m or more of floorspace.
  - condition:
      field: involves-change-of-use
      value: false
      description: Not a material change of use.
  - condition:
      field: engineering-operations
      value: false
      description: Not engineering or mining operations.
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Design and Access Statement are required for: All applications for major development … Listed
  Building Consent applications … Where any part of the development is in a designated area (Conservation
  Area), development consisting of: The provision of one or more dwellings; or The provision of a building
  or buildings where the floor space created by the development is 100sqm or more.'
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context of the development and how the design takes that context
    into account
  level: must
- item: The policy adopted as to access, and how access policies in local development documents have been
    taken into account
  level: must
- item: Any consultation undertaken on access, and what account has been taken of its outcome
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
- item: 'Listed building consent or other heritage assets: how the design takes account of the special
    architectural or historic importance of the asset, the physical features that justify its designation,
    and its setting'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        - conservation-area
        description: Applications relating to heritage assets.
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 11-12, Part 1 item 10. Not required
  for section 73 applications, engineering or mining operations, a material change of use, or waste development.
review-status: unverified
field-status: {}
