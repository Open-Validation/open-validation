reference: biodiversity-survey-report
local-authority: WLA
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Protected species are known or suspected to be present.
  - all:
    - site:
        in:
        - ramsar
        - special-protection-area
        - special-area-of-conservation
        description: An internationally important site (Ramsar, SPA, SAC).
    - discretionary
  - site:
      in:
      - site-of-special-scientific-interest
      - national-nature-reserve
      - local-nature-reserve
      - local-wildlife-site
      description: Within or adjacent to a designated site of nature and/or geological conservation importance
        (e.g. SSSI, NNR, LNR, LWS and LGS).
  - discretionary
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policy EN2
source-text: Given the rural nature of West Lancashire ecology surveys are required to be submitted as
  part of a wide variety of planning applications, for example, Where protected species are known or suspected
  to be present; If the proposal may result in a likely significant effect on an internationally important
  site (e.g. Ramsar, SPA’s, SAC’s) If proposal is within or adjacent to a designated site of nature and/or
  geological conservation importance (e.g. SSSI, NNR, LNR, LWS and LGS);
must-include:
- item: An assessment of the likely effects on habitats and species recorded in the locality
  level: must
- item: Mitigation measures to avoid adverse impacts
  level: must
- item: Where impacts cannot be reduced further, details of compensatory provision
  level: must
- item: Any impacts on geological interests
  level: should
- item: Surveys by suitably qualified and experienced persons using standard survey methods
  level: should
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 24-26, Part 2 item 4. The list
  gives these as examples and adds a long list of developments that 'may require specific surveys' (works
  to agricultural or other buildings and structures, lighting near woodland or water, trees, hedgerows,
  quarries, ponds within 500 m of major or 250 m of minor proposals, watercourses within 200 m, brownfield
  land, arable land), so the rest is discretionary. Where a European site could be affected a Habitats
  Regulations Assessment is needed (see the unmapped list).
review-status: unverified
field-status: {}
