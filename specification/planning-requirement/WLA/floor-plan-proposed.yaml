reference: floor-plan-proposed
local-authority: WLA
required-if: discretionary
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: One copy (unless submitted electronically) of existing and proposed floor plans at a scale
  of 1:50 or 1:100. Where existing buildings or walls are to be demolished these must be clearly shown.
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: must
- item: New buildings shown in context with adjacent buildings, including property numbers where applicable
  level: should
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 16, Part 2 item 1B. Part 2 says
  the plans are required 'Depending on the nature, scale and context of the development' without saying
  when, so discretionary.
review-status: unverified
field-status: {}
