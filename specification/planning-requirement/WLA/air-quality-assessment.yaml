reference: air-quality-assessment
local-authority: WLA
required-if:
  any:
  - condition:
      field: eia-development
      value: true
      description: All development requiring an Environmental Impact Assessment.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New homes.
    - site:
        in:
        - air-quality-management-area
        description: In or adjoining an Air Quality Management Area.
  - all:
    - condition:
        field: direct-air-emissions
        value: true
        description: Industrial development that causes emissions to air.
    - discretionary
  - discretionary
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policy GN3
source-text: 'Thresholds: All development requiring an Environmental Impact Assessment Developments which
  impact on existing Air Quality Management Areas (AQMAs) or would bring about the need for a new AQMA
  to be declared. Industrial development that causes significant emissions to air Development that causes
  a significant increase in traffic, congestion or heavy vehicles and major construction sites. If receptors
  are being introduced into an area of existing poor air quality i.e. new homes in or adjoining an AQMA
  or adjacent to an industrial development that causes significant emissions to air.'
must-include:
- item: The predicted change in air quality resulting from the development
  level: should
- item: Appropriate mitigation measures as necessary
  level: should
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 22-23, Part 2 item 3. The borough's
  one AQMA is near the Wigan Road/Moor Street/Stanley Street junction in Ormskirk. Impacts on an AQMA,
  'significant' emissions or traffic, and major construction sites are judgements, so discretionary.
review-status: unverified
field-status: {}
