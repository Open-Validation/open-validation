reference: noise-assessment
local-authority: WLA
required-if:
  any:
  - all:
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: Commercial/leisure development within or close to residential areas, new highway/rail
            development or development causing a significant increase in traffic.
      - condition:
          field: plant-equipment
          value: true
          description: New plant and machinery.
      - condition:
          field: noise-sensitive-use
          value: true
          description: New noise sensitive development in existing noisy areas.
    - discretionary
  - application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policy GN3
source-text: 'Threshold: Proposals that raise issues of potential noise disturbance (e.g. commercial/leisure
  development within or close to residential areas, new highway/rail developments or developments resulting
  in significant increase in traffic generation , new plant and machinery) and proposals for new noise
  sensitive development in existing noisy areas.'
must-include:
- item: The existing noise environment, the noise sources from or affecting the development, and mitigation
    measures
  level: should
- item: Sound power level and likely resultant noise level at the site boundary of all noise-producing
    machinery, and where it will be located
  level: should
- item: Delivery times and opening hours for commercial premises in noise sensitive areas, and waste collection
    details
  level: should
- item: 'Development adjoining (including below or above) homes: full details of sound insulation, entrances/exits
    and car parking'
  level: should
  required-if:
    condition:
      field: adjoins-residential-property
      value: true
      description: The development immediately adjoins residential premises.
- item: Prepared by a suitably qualified acoustician
  level: should
- item: 'Prior approval for change of use: the noise impacts and how they will be mitigated'
  level: must
  required-if:
    application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 53, 95, Part 2 item 20 and the
  prior notification of change of use checklist. Whether a proposal raises 'issues of potential noise
  disturbance' is a judgement, so discretionary.
review-status: unverified
field-status: {}
