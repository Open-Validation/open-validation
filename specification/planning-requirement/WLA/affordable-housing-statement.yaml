reference: affordable-housing-statement
local-authority: WLA
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 5 or more units.
    - condition:
        field: settlement-type
        value: small-rural-village
        description: Within a small rural village.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 15
        description: 15 or more units.
    - condition:
        field: settlement-type
        value: skelmersdale
        description: In Skelmersdale.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more units.
    - condition:
        field: settlement-type
        value: other
        description: Anywhere else in the borough (not a small rural village or Skelmersdale).
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policies RS1 and RS2
source-text: 'This statement is required as part of planning applications which provide affordable housing.
  Threshold: Residential development of: 5 or more units within small rural villages, 15 or more units
  in Skelmersdale and 10 or more units everywhere else'
must-include:
- item: How the required percentage of affordable housing will be achieved on site
  level: must
- item: The tenure and number of bedrooms of the proposed affordable units
  level: must
- item: Details of the Registered Provider / Housing Association who will manage the affordable units
  level: must
- item: The location of the affordable dwellings within the site shown on the drawings
  level: should
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 20-21, Part 2 item 2. The list
  notes that NPPF paragraph 63 supersedes the lower (8-9 dwelling) threshold in Policy RS2.
review-status: unverified
field-status: {}
