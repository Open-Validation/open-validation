reference: sustainable-drainage-strategy
local-authority: WLA
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - application-type:
        in:
        - full
        - outline-all
        - outline-some
        - reserved-matters
        - s73
        - pa-build-agri-forest
        - pa-road-agri-forest
  - condition:
      field: non-mains-drainage
      value: true
      description: Disposal of trade waste or of foul sewage effluent other than to the public sewer.
  - ref: major-development
  - discretionary
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policy GN3
source-text: 'Thresholds: All new buildings excluding householder developments. Development on sites where
  there is a known capacity issue. Most rural development Development involving the disposal of trade
  waste or the disposal of foul sewage effluent other than to the public sewer will require a more detailed
  foul drainage assessment For all Major Development (10 or more dwellings or site area nore than 0.5ha
  if number of dwellings is unknown; 1,000sqm or more building or 1ha or more site area) an additional
  SuDs proforma is required'
must-include:
- item: Details of both foul and surface water drainage
  level: must
- item: 'Major development: a completed North West SuDS Pro-Forma'
  level: must
  required-if:
    ref: major-development
- item: 'Full major applications: a full drainage strategy'
  level: must
  required-if:
    all:
    - ref: major-development
    - application-type:
        in:
        - full
- item: 'Major outline applications: a preliminary SUDS drainage proposal or indicative site drainage
    proposal'
  level: must
  required-if:
    all:
    - ref: major-development
    - application-type:
        in:
        - outline-all
        - outline-some
- item: 'Trade waste or non-mains foul disposal: a more detailed foul drainage assessment'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Foul or trade effluent not to the public sewer.
- item: 'Previously developed land: the current discharge rate (CIRIA SuDS Manual 2015, section 24.5),
    to show the required reduction in surface water run-off'
  level: should
  required-if:
    condition:
      field: previously-developed-land
      value: true
      description: Previously developed land.
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 33-34, Part 2 item 8 (Drainage
  Statement). Filed under MHCLG's retired 'sustainable-drainage-strategy' id. The types for 'all new buildings
  excluding householder developments' are those whose checklists list a Drainage Statement. Sites with
  a known capacity issue and 'most rural development' are shown as discretionary.
review-status: unverified
field-status: {}
