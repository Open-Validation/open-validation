reference: landscaping-plan
local-authority: WLA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-all
        - outline-some
        - reserved-matters
        - s73
        - pa-build-agri-forest
        - pa-road-agri-forest
    - condition:
        field: involves-change-of-use
        value: false
        description: Not a change of use.
    - discretionary
  - all:
    - application-type:
        in:
        - hedgerow-removal
    - discretionary
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policies GN3 and EN2
source-text: 'Threshold: All applications (except householder and changes of use) where existing or proposed
  landscaping would contribute to the acceptability of the proposed scheme.'
must-include:
- item: The main areas and types of planting and hard surfaces, existing and proposed
  level: must
- item: Where no landscaping is proposed, a justification of why a scheme is not required
  level: must
- item: 'Where landscaping is of material importance: a scaled plan with levels, paving treatment and
    materials, plant species, positions, numbers/densities with the area, and size and specification of
    the plants'
  level: must
  required-if: discretionary
- item: 'Where landscaping is of material importance: long-term maintenance and management proposals and
    a seven-year planting and maintenance schedule'
  level: must
  required-if: discretionary
- item: 'Hedgerow removal: details of replacement planting, where appropriate, with size, species and
    density, a schedule and a plan'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hedgerow-removal
    - discretionary
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 48-49, 110, Part 2 item 16 and
  the hedgerow removal checklist. Whether landscaping 'would contribute to the acceptability' is a judgement,
  so discretionary; the application types are those whose checklists list a landscaping scheme.
review-status: unverified
field-status: {}
