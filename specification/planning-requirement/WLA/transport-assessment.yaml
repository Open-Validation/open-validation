reference: transport-assessment
local-authority: WLA
required-if:
  any:
  - discretionary
  - application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policies GN3 and IF2
source-text: 'Thresholds: Development which would have significant transport implications'
must-include:
- item: Analysis of all existing and proposed trips by all modes, accessibility by all modes and the likely
    modal split
  level: must
- item: Measures to improve access by public transport, walking and cycling, reduce the need for parking
    and mitigate transport impacts
  level: must
- item: Loading areas and arrangements for manoeuvring, servicing and parking of vehicles
  level: must
- item: Existing transport conditions, how the development would affect them and measures proposed to
    overcome problems
  level: must
- item: 'Prior approval for change of use: the transport and highways impacts and how they will be mitigated'
  level: must
  required-if:
    application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 67-68, 95, Part 2 item 29 and
  the prior notification of change of use checklist. 'Significant transport implications' is not defined,
  so discretionary; a Transport Statement may be enough where impacts are limited.
review-status: unverified
field-status: {}
