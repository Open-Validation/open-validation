reference: elevation-existing
local-authority: WLA
required-if: discretionary
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: One copy (unless submitted electronically) of all existing and proposed elevations at a scale
  of 1:50 or 1:100 showing clearly the proposed works in relation to what is already there for any elevations
  that would be created or altered by the proposed development.
must-include:
- item: At a scale of 1:50 or 1:100, showing all elevations created or altered and the works in relation
    to what is already there
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors, where possible
  level: should
- item: Correspond exactly with the plan drawings
  level: must
- item: 'Where next to or close to an existing building: the relationship between the buildings and the
    positions of openings on each'
  level: must
- item: 'Boundary walls or fences: an elevation of the structure'
  level: must
  required-if:
    condition:
      field: new-boundary-treatment
      value: true
      description: The development relates to or includes boundary structures such as walls or fences.
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 17, Part 2 item 1C. Part 2 says
  the plans are required 'Depending on the nature, scale and context of the development' without saying
  when, so discretionary.
review-status: unverified
field-status: {}
