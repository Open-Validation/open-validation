reference: elevation-proposed
local-authority: WLA
required-if:
  any:
  - discretionary
  - application-type:
      in:
      - advertising
      - pa-ecomms-network
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: One copy (unless submitted electronically) of all existing and proposed elevations at a scale
  of 1:50 or 1:100 showing clearly the proposed works in relation to what is already there for any elevations
  that would be created or altered by the proposed development. … Advertisement Drawing(s) (at a scale
  of 1:50 or 1:100) Showing the dimensions of the sign, appearance (including colours of text and background)
  and, if applicable, details of method of external illumination.
must-include:
- item: At a scale of 1:50 or 1:100, showing all elevations created or altered and the works in relation
    to what is already there
  level: must
- item: Proposed building materials and the style, materials and finish of windows and doors, where possible
  level: should
- item: Correspond exactly with the plan drawings
  level: must
- item: 'Where next to or close to an existing building: the relationship between the buildings and the
    positions of openings on each'
  level: must
- item: 'Boundary walls or fences: an elevation of the structure'
  level: must
  required-if:
    condition:
      field: new-boundary-treatment
      value: true
      description: The development relates to or includes boundary structures such as walls or fences.
- item: 'Advertisements: drawing(s) at 1:50 or 1:100 showing the dimensions of the sign, its appearance
    (including colours of text and background) and any method of external illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: existing and proposed elevations (1:50 or 1:100) of the building showing the
    position of the signs, height above ground, any projection and any external illumination fixtures;
    existing signs being removed and replaced also shown'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements on a structure (pole, gantry, hoarding etc.): a proposed elevation of the structure
    at 1:50 or 1:100 showing height above ground'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - advertising
    - condition:
        field: freestanding-advert
        value: true
        description: The advertisement is fixed to a structure.
- item: 'Telecommunications prior approval: an elevation at 1:50 or 1:100 showing the height of the structure'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 17-19, Part 2 item 1C, J and
  L. Part 2 says the plans are required 'Depending on the nature, scale and context of the development'
  without saying when, so discretionary. Advertisement and telecommunications drawings are required for
  those application types.
review-status: unverified
field-status: {}
