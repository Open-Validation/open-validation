reference: heritage-statement
local-authority: WLA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - world-heritage-site
      description: Affecting designated heritage assets and/or their setting.
  - site:
      in:
      - locally-listed-building
      description: Affecting non-designated heritage assets and/or their setting.
  - discretionary
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: West Lancashire Local Plan 2012-2027 policy EN4
source-text: 'A Heritage Statement will be required for all proposals that have the potential to affect
  heritage assets … Thresholds: All applications affecting designated heritage assets and/or their setting
  Applications affecting non-designated assets and/or their setting.'
must-include:
- item: The significance of the heritage asset(s) affected, including the contribution of their setting
  level: must
- item: How the development will affect that significance
  level: must
- item: As a minimum, evidence that the Historic Environment Record (held by Lancashire County Council)
    has been consulted
  level: must
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 41-42, 85, Part 2 item 12 and
  the listed building consent checklist. Non-designated assets other than locally listed buildings (e.g.
  identified at pre-application or from the HER) are discretionary.
review-status: unverified
field-status: {}
