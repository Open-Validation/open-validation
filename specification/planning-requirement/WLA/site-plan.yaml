reference: site-plan
local-authority: WLA
required-if:
  application-type:
    in:
    - hh
    - full
    - outline-all
    - outline-some
    - reserved-matters
    - lbc
    - advertising
    - ldc-prospective-use
    - pa-extension
    - pa-ecomms-network
    - cho-agri-to-dwh
    - cho-commercial-to-dwh
    - cho-commercial-to-mixed
    - cho-sui-to-dwh
    - cho-agri-to-flexcom
    - cho-agri-to-school
    - cho-comm-to-school
    - cho-amusements-to-dwh
source-url: https://www.westlancs.gov.uk/media/548069/validation-criteria-checklist.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: One copy (unless submitted electronically) of both existing and proposed site plan must be
  submitted at a scale of 1:500, 1:200 or 1:100
must-include:
- item: Existing and proposed site plans at 1:500, 1:200 or 1:100 (separate existing and proposed plans
    preferred)
  level: must
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to boundaries
  level: must
- item: Buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: Public rights of way crossing or adjoining the site
  level: should
- item: Position of all trees on the site and on adjacent land
  level: should
- item: Extent and type of any hard surfacing; boundary treatment including walls or fencing where proposed
  level: should
- item: 'Outline applications: the area(s) where access points will be situated, even where access is
    reserved'
  level: must
  required-if:
    application-type:
      in:
      - outline-all
      - outline-some
- item: 'Advertisements: the position of all advertisements on the land or building(s)'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Prior approval for change of use or extension: the application site and the proposed development
    in relation to the existing buildings/dwellinghouse'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
- item: 'Block plan at 1:100 or 1:200 (may be combined with the site plan if titled as such and no greater
    than 1:200): site boundaries, the type and height of boundary treatment where a change is proposed,
    and buildings or structures on the other side of the boundaries where they could influence or be affected
    by the development'
  level: must
  required-if: discretionary
- item: 'Prior approval for an extension: a block plan to a metric scale showing the development in relation
    to the house and other buildings with written dimensions to all boundaries, adjoining premises on
    both sides and at the rear (with names/numbers), and any trees to be removed'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
- item: 'Prior approval for change of use: a block plan to a metric scale showing the land and buildings
    in relation to other buildings on the site and adjoining premises on both sides and at the rear'
  level: must
  required-if:
    application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
- item: 'New or altered vehicular/pedestrian access: the position and dimensions of the access arrangements
    on the block plan'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new or altered vehicular or pedestrian access.
- item: 'Telecommunications prior approval: a layout plan at 1:200 or 1:500 showing the position of the
    structure'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
confidence: medium
notes: From the council's list (Validation Criteria, December 2024), page 10, 16, 19, 74-103, Part 1 item
  7, Part 2 Plans A, L and M, and the checklists. The 'should' items are needed 'unless these would NOT
  influence or be affected by the proposed development'. The block plan (Part 2) is filed here; Part 2
  says the plans are required 'Depending on the nature, scale and context of the development', so the
  general block plan item is discretionary.
review-status: unverified
field-status: {}
