source-text: 'Site Plan One copy (unless submitted electronically) of both existing and proposed site
  plan must be submitted at a scale of 1:500, 1:200 or 1:100 and accurately show: a) the direction of
  North; b) the proposed development in relation to the site boundaries and other existing buildings on
  the site, with written dimensions including those to boundaries; and the following, unless these would
  NOT influence or be affected by the proposed development: c) all the buildings, roads and footpaths
  on land'
must-include:
- item: Scale of 1:500, 1:200 or 1:100
  level: must
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to boundaries
  level: must
- item: Any trees or hedges within the site or on adjacent land that could influence or be affected by
    the development (including street trees), identified and annotated
  level: must
