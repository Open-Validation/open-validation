reference: town-centre-impact-assessment
local-authority: MAV
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Development for a main town centre use not in a centre identified under policy SWDP10
      (including retail or leisure over 1,000 sq metres net outside those centres).
source-url: https://www.malvernhills.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents/Planning/Making%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP10
source-text: Such assessments are required with any planning application proposing - any development for
  main town centre use (see definition in NPPF) that is not in a centre identified under policy SWDP10;
  or - any retail or leisure development with over 1,000 sq metres (net) of new floorspace and on sites
  outside the centres defined under SWDP Policy 10.
must-include:
- item: Compliance with the sequential test (NPPF)
  level: must
- item: That the scale of development is appropriate to the location
  level: must
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Retail or leisure development of over 1,000 sq metres.
- item: Impact on town centre vitality and viability, including consumer choice and trade, up to five
    years ahead (ten for major schemes whose full impact takes longer)
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Retail or leisure development of over 1,000 sq metres.
confidence: medium
notes: From the council's list (published November 2025), page 17-18. The list is joint with Wychavon
  District Council. The list's 'Retail and Centres Impact Assessment'.
review-status: unverified
field-status: {}
