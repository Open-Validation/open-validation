reference: lighting-assessment
local-authority: MAV
required-if:
  any:
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Artificial external lighting.
    - discretionary
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting.
source-url: https://www.malvernhills.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents/Planning/Making%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policies SWDP21 and SWDP25
source-text: With applications that propose development including artificial external lighting that may:-
  - materially alter light levels outside the application site; or - affect residential amenities, impact
  on visual amenities, highway/railway safety or natural environment Also a Lighting Assessment will be
  required with all planning application proposing floodlighting.
must-include:
- item: Details of the external lighting and the hours it will be switched on
  level: must
- item: A lighting layout plan with beam orientation and a schedule of the equipment
  level: must
- item: Lighting levels and how the lighting may affect local amenity, intrinsically dark landscapes,
    nature conservation and highway/railway safety
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 12. The list is joint with Wychavon District
  Council. Whether lighting 'may' materially alter light levels or affect amenity is a judgement, so that
  part shows as discretionary.
review-status: unverified
field-status: {}
