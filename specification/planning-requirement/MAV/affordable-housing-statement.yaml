reference: affordable-housing-statement
local-authority: MAV
required-if:
  any:
  - all:
    - site:
        in:
        - designated-rural-area
        description: In a Designated Rural Area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: At least a single new dwelling.
  - discretionary
source-url: https://www.malvernhills.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents/Planning/Making%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP15
source-text: Where a development plan policy (having regard to national planning policy guidance) requires
  the provision of affordable housing or a contribution in lieu of affordable housing on a particular
  site. Under the provisions of policy SWDP15 this includes all planning applications proposing at least
  a single new dwelling in a Designated Rural Area.
must-include:
- item: Number of residential units, mix of units and proposed tenure, for the affordable and the open
    market housing
  level: must
- item: Any different levels or types of affordability or tenure clearly explained and marked on the site
    plan with house and room sizes
  level: should
- item: Where a financial contribution in lieu of on-site provision is proposed, that proposal and why
    it is acceptable
  level: should
confidence: medium
notes: From the council's list (published November 2025), page 2-3. The list is joint with Wychavon District
  Council. The list does not give the SWDP15 site thresholds, so apart from Designated Rural Areas it
  shows as discretionary.
review-status: unverified
field-status: {}
