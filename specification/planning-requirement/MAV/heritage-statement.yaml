reference: heritage-statement
local-authority: MAV
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      - listed-building
      - listed-building-setting
      - park-and-garden
      - battlefield
      - conservation-area
      description: 'Affects the significance (including setting) of a designated heritage asset: scheduled
        monument, listed building, registered park and garden, registered battlefield or conservation
        area.'
  - site:
      in:
      - locally-listed-building
      description: Affects a non-designated heritage asset.
  - discretionary
source-url: https://www.malvernhills.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents/Planning/Making%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP24
source-text: Any planning application or application seeking listed building consent which affects the
  significance of a designated or non - designated heritage asset, including its setting.
must-include:
- item: How the development affects the significance of any affected designated and non-designated heritage
    assets, including their setting, in proportion to the asset's importance
  level: must
- item: The relevant historic environment record consulted as a minimum
  level: must
- item: Heritage assets assessed using appropriate expertise where necessary
  level: should
confidence: medium
notes: From the council's list (published November 2025), page 9-10. The list is joint with Wychavon District
  Council. Non-designated heritage assets, including sites of archaeological interest, are only partly
  covered by fields, so the rule also shows as discretionary.
review-status: unverified
field-status: {}
