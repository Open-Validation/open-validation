reference: recreation-facilities-assessment
local-authority: MAV
required-if:
  condition:
    field: loss-of-open-space
    value: true
    description: The proposal would lose recreational buildings or land, without an improved or equivalent
      replacement facility, and is not for recreational and/or community purposes related to that use.
source-url: https://www.malvernhills.gov.uk/component/fileman/?view=file&routed=1&itemless=1&name=Local%20Area%20Requirements%20List%202025%20Final.pdf&folder=Documents/Planning/Making%20a%20Planning%20Application&container=fileman-files
policy: South Worcestershire Development Plan 2016 policy SWDP38
source-text: An open space assessment will therefore be required with all applications that propose the
  loss of recreational buildings or land and where:- - an improved or an equivalent replacement facility
  is not proposed; or - the development is not for recreational and/or community purposes related to the
  use of the open space or recreational buildings.
must-include:
- item: The impact of the development on the need for recreational facilities and open space in the area
  level: must
confidence: medium
notes: From the council's list (published November 2025), page 15. The list is joint with Wychavon District
  Council. The list's 'Open Space/Recreational facilities assessment'.
review-status: unverified
