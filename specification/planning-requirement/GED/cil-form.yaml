reference: cil-form
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
  - any:
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 100
        description: Net increase in residential floor area exceeding 100 sq m.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 100
        description: Net increase in retail floor area exceeding 100 sq m.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creates a new residential dwelling.
    - condition:
        field: residential-annexe
        value: true
        description: Creates a new residential annex.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: CIL forms -if floor area exceeds 100 sqm or results in the creation of a new residential
  dwelling / annex. … Where development would result in a net increase in residential or retail floor
  area exceeding 100 sqm, or would result in the creation of a new residential dwelling / annex, a completed
  Additional Information CIL Form 1 and Assumption of Liability CIL Form 2 should be submitted with the
  proposal.
must-include:
- item: Additional Information CIL Form 1
  level: must
- item: Assumption of Liability CIL Form 2
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 7, 10-14, 19, 40. Listed for householder,
  full (residential new build, residential conversions, commercial and change of use, but not agricultural
  development) and reserved matters applications.
review-status: unverified
field-status: {}
