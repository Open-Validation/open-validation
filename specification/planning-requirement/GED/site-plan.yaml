reference: site-plan
local-authority: GED
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - ldc-prospective-use
      - demolition-con-area
      - pip
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: freestanding-advert
        value: true
        description: The sign is not located on an existing building.
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Site layout plan / block plan. The site plan should be at a standard scale e.g. 1:200 or
  1:500. The site plan shall include the following:- … The direction north. … The proposed development
  in relation to the site boundaries and other existing buildings on the site, with written dimensions
  including those to the boundaries. … Site block plan if the sign is not located on an existing building.
must-include:
- item: A standard scale, e.g. 1:200 or 1:500
  level: should
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 7, 20-21, 23, 28, 34-35. National requirement
  for householder, listed building consent ('Site plan'), proposed-use lawful development certificates,
  relevant demolition in a conservation area ('Block plan') and permission in principle; a local requirement
  for adverts where the sign is not on an existing building. For non-material amendments the list's local
  requirement applies 'depending on the proposal', so it shows as discretionary.
review-status: unverified
field-status: {}
