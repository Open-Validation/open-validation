reference: habitat-baseline
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Town and Country Planning Act 1990 Schedule 7A (as inserted by Schedule 14 of the Environment
  Act 2021)
source-text: 'Where a planning application is subject to mandatory BNG, applicants should submit the information
  listed below. … A BNG report clearly setting out: … A baseline plan or plans showing all on-site habitats
  existing on the date of application (or earlier proposed date) including any irreplaceable habitat (if
  applicable), with labelled parcel references/hedgerows in UKHabs.'
must-include:
- item: Based on a survey by a suitably qualified ecologist (or, for the small sites metric only, a competent
    individual) using the latest UKHabs, at an appropriate time of year
  level: must
- item: 'BNG report: survey information (timings, surveyors and their experience/accreditations)'
  level: must
- item: 'BNG report: baseline habitat descriptions in UKHabs format, with justification and photographs
    (on-site, and off-site where off-site compensation is proposed)'
  level: must
- item: 'BNG report: any irreplaceable habitat on the land on the date of application (or an earlier date)'
  level: must
- item: 'BNG report: full habitat condition assessment results for each habitat parcel'
  level: must
- item: 'BNG report: statement of strategic significance (how the multiplier was applied, in line with
    local guidance)'
  level: must
- item: 'BNG report: the pre-development biodiversity value on the date of application (or an earlier
    date, with the reasons for that date)'
  level: must
- item: 'BNG report: how the BNG hierarchy and good practice principles have been followed'
  level: must
- item: 'BNG report: how the development will achieve at least 10% net gain (may be a draft Habitat Management
    and Monitoring Plan)'
  level: must
- item: Colour baseline plan(s) drawn to an identified scale with the direction of North, showing all
    on-site habitats (including any irreplaceable habitat) with labelled parcel references/hedgerows in
    UKHabs
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 10-17, 38-39. Listed for every full and outline
  sub-type ('See Information required for each Local Requirement'); applies where the application is subject
  to mandatory BNG, so householder and other exempt applications are exempt by law.
review-status: unverified
field-status: {}
