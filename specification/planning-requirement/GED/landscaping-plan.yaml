reference: landscaping-plan
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - discretionary
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policy 18
source-text: Landscaping details – any new development that is particularly sensitive from either an ecological
  or visual point of view. See LPD Policy 18.
must-include:
- item: Metric scale 1:500 for layout plans and 1:200 or 1:100 for planting schemes
  level: must
- item: Topographical site survey showing spot levels, contours, structures, walls, fences, existing trees
    (Root Protection Areas), significant shrubs and vegetation, service runs and easements, buildings
    on site and building edges off-site
  level: must
- item: Planting plan with positions, species/variety, density, maximum size at maturity, grille and guard
    specifications, weed control, slope stabilisation and protective measures
  level: must
- item: Implementation and management plans, including objectives and aftercare maintenance
  level: must
confidence: medium
notes: 'From the council''s list (adopted 22 May 2025), pages 10-17, 19, 51. Shown as ''check'': the trigger
  (''particularly sensitive from either an ecological or visual point of view'') is a judgement.'
review-status: unverified
field-status: {}
