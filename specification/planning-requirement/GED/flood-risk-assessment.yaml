reference: flood-risk-assessment
local-authority: GED
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site (in Flood Zone 1) is over 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site (in Flood Zone 1) is over 1 hectare.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: The proposal creates 10 or more dwellings.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Flood risk assessment Flood risk assessment All flood risk assessments must be written by
  a suitably qualified person and should include their name and qualifications.
must-include:
- item: Written by a suitably qualified person, with their name and qualifications
  level: must
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_trigger):
  the excerpt only gave the authorship rule. From the audit: Flood Zones 2/3, and in Flood Zone 1 sites
  over 1ha or 10+ dwellings (''Flood Zone 1 ... over 1 ha ... 10+ dwellings'').'
review-status: unverified
field-status: {}
