reference: structural-damage
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - condition:
      field: structural-damage-alleged
      value: true
      description: Felling because of structural damage to property.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Tree felling – be accompanied, as applicable, by appropriate evidence describing any structural
  damage to property or in relation to tree health or safety (to be provided by a relevant engineer, building/drainage
  surveyor or other appropriate expert).
must-include:
- item: Provided by a relevant engineer, building/drainage surveyor or other appropriate expert
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), page 32. National requirement for works to protected
  trees (the list has no local requirements for them).
review-status: unverified
field-status: {}
