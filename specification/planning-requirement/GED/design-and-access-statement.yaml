reference: design-and-access-statement
local-authority: GED
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: The property is within a conservation area.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Floor area proposed is 100 m² or more.
  - application-type:
      in:
      - lbc
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policy 28
source-text: Design and access statement (where the property is within a Conservation Area and floor area
  proposed is 100m² or more. See LPD Policy 28.) … Listed Building Design and Access Statement.
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 7, 20. Listed as a national requirement for
  householder applications (with this trigger) and for listed building consent. For full and outline applications
  the list refers to the national requirements on GOV.UK for the national documents; only the local requirements
  are listed per sub-type (residential new build, residential conversions, commercial/industrial/non-residential,
  change of use, agricultural development).
review-status: unverified
field-status: {}
