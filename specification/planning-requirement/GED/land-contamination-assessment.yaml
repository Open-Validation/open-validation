reference: land-contamination-assessment
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - site:
      in:
      - contaminated-land
      description: There may be the potential for contamination due to the former use of the land.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policy 7
source-text: Environmental Statement, including Land Contamination assessment where there may be the potential
  for contamination due to the former use of the land. See LPD Policy 7.
must-include:
- item: 'Phase I desktop study: purpose and aims, site location and layout plans, site history, site walkover'
  level: must
- item: 'Phase I: environmental setting (geology, hydrogeology, hydrology; mining/quarrying; EA information
    on abstraction, pollution incidents, water quality and landfill sites)'
  level: must
- item: 'Phase I: current/proposed site use and surrounding land uses, and review of any previous contamination
    studies or remediation'
  level: must
- item: 'Phase I: preliminary risk assessment with contaminant sources, pathways and receptors and a conceptual
    site model (diagrammatic and written)'
  level: must
- item: 'Phase I: recommendations for intrusive investigation where necessary'
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 10-17, 42-44. The list calls it 'Environmental
  statement (including contamination)', but its contents (Phase I desktop study, Phase II detailed investigation,
  Phase III remediation statement) are a land contamination assessment, not an EIA environmental statement.
  Phase II and III follow where the earlier phase recommends them.
review-status: unverified
field-status: {}
