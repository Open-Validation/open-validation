reference: town-centre-impact-assessment
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses and retail development not in an existing centre.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policy 52
source-text: Retail Impact Assessment – a Retail Impact Assessment is required for development proposals
  for retail uses of 500sqm or more (gross) and not within a defined Town or Local Centre. See LPD Policy
  52. … A Sequential Assessment is required for all proposed main town centre uses and retail development,
  not in an existing centre (area defined on a LPA proposal map).
must-include:
- item: 'Sequential test: no more suitable, viable and available sites in town centres, then edge-of-centre
    locations, before out-of-centre sites are considered'
  level: must
- item: 'Impact assessment: impact on existing, committed and planned public and private investment in
    centres in the catchment area'
  level: must
  required-if:
    condition:
      field: retail-floorspace
      operator: '>='
      value: 500
      description: Retail uses of 500 sq m or more (gross).
- item: 'Impact assessment: impact on town centre vitality and viability, including local consumer choice
    and trade'
  level: must
  required-if:
    condition:
      field: retail-floorspace
      operator: '>='
      value: 500
      description: Retail uses of 500 sq m or more (gross).
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 13-14, 18, 53. The list calls it 'Retail Impact
  Assessment'. The impact assessment is needed for retail of 500 sq m or more (gross) outside a defined
  town or local centre (commercial, change of use and outline); the sequential assessment for all main
  town centre uses outside an existing centre (change of use and outline lists).
review-status: unverified
field-status: {}
