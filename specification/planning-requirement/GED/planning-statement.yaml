reference: planning-statement
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: The application is not in accordance with the development plan.
    - discretionary
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Planning Statement - major planning applications, applications that are not in accordance
  with the development plan, proposals that require detailed policy consideration. … A written statement
  that further explains the planning proposal and how this complies with relevant planning policies.
must-include:
- item: Explains the proposal and how it complies with relevant planning policies
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 11-18, 53. 'Proposals that require detailed
  policy consideration' is a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
