reference: energy-statement
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Housing developments of 10 units or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Commercial development of 1 ha or more.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: Commercial development of 1,000 sq m and above.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Low Carbon Planning Guidance for Gedling Borough
source-text: Low Carbon Planning Guidance – statement of compliance – for housing developments of 10 units
  or more. See Low Carbon Planning Guidance for Gedling Borough. … Low Carbon Planning Guidance – statement
  of compliance – for commercial development of 1ha or more or 1,000sqm and above. … A written statement
  outlining how a development complies with the Council’s Low Carbon Planning Guidance.
must-include:
- item: How the development complies with the council's Low Carbon Planning Guidance
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 11-15, 17, 19, 51. The list calls it 'Low
  Carbon Planning Guidance – statement of compliance'. Residential sub-types, outline and reserved matters
  use the 10-unit housing threshold; commercial, change of use and agricultural sub-types use the commercial
  threshold.
review-status: unverified
field-status: {}
