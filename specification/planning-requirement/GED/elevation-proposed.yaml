reference: elevation-proposed
local-authority: GED
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - ldc-prospective-use
      - advertising
      - cho-agri-to-dwh
      - cho-sui-to-dwh
      - cho-commercial-to-dwh
      - pa-tmp-use-comm-film
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Detailed existing and proposed elevation and floorplan drawings at a standard scale e.g.
  1:100 or 1:50. These need to be accurate and it is advised to employ a professional architect or plan
  drawer. … Plans, elevations and sections of the building to show the alterations proposed (as relevant
  to the proposal). … Existing and proposed elevations. … Scaled existing and proposed elevations. … a
  floor plan indicating the dimensions and proposed use of each room, the position and dimensions of windows,
  doors and walls, and the elevations of the dwellinghouses.
must-include:
- item: A standard scale, e.g. 1:100 or 1:50
  level: should
- item: Accurate drawings
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 7, 20-21, 23, 24-27, 34. National requirement
  for householder, listed building consent and proposed-use lawful development certificates, and (with
  the floor plan) for the prior notifications that create dwellinghouses; a local requirement for advertisement
  consent. For non-material amendments the list's local requirement applies 'depending on the proposal',
  so it shows as discretionary.
review-status: unverified
field-status: {}
