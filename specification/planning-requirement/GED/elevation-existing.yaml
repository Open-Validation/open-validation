reference: elevation-existing
local-authority: GED
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - ldc-prospective-use
      - demolition-con-area
      - advertising
  - all:
    - application-type:
        in:
        - non-material-amendment
    - discretionary
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Detailed existing and proposed elevation and floorplan drawings at a standard scale e.g.
  1:100 or 1:50. These need to be accurate and it is advised to employ a professional architect or plan
  drawer. … Plans, elevations and sections of the building, as existing relevant to the proposed alteration.
  … Existing and proposed elevations. … Existing elevations plans. … Scaled existing and proposed elevations.
must-include:
- item: A standard scale, e.g. 1:100 or 1:50
  level: should
- item: Accurate drawings
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 7, 20-21, 23, 28, 34. National requirement
  for householder, listed building consent, proposed-use lawful development certificates and relevant
  demolition in a conservation area; a local requirement for advertisement consent. For non-material amendments
  the list's local requirement applies 'depending on the proposal', so it shows as discretionary.
review-status: unverified
field-status: {}
