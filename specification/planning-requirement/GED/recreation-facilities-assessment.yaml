reference: recreation-facilities-assessment
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - site:
      in:
      - open-space
      description: The development relates to an existing area of Protected Open Space or an Important
        Open Area within a conservation area.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policies 20, 22 and 28
source-text: Open Space Assessment – where the proposed development relates to an existing area of Protected
  Open Space or Important Open Areas within a conservation area. See LPD Policies 20, 22 and 28.
must-include:
- item: Clearly shows the open space, buildings or land are surplus to requirements and can no longer
    contribute as open space to a local or wider need
  level: must
- item: Sport-specific information in line with Annex B of Sport England's Playing Fields Policy
  level: must
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: The application affects playing field land.
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 11, 13, 17, 52. The list calls it 'Open Space
  Assessment'. Listed for residential new build and commercial full applications and for outline applications.
review-status: unverified
field-status: {}
