reference: sci
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - condition:
      field: pre-application-community-consultation
      value: true
      description: Pre-application consultation has taken place with the local community.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Statement of Community Involvement - all applications where pre-application consultation
  has taken place with the local community.
must-include:
- item: How, when and where consultation took place
  level: must
- item: A summary of the level and content of responses
  level: must
- item: Changes made to the scheme to take account of the responses
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 11-19, 53.
review-status: unverified
field-status: {}
