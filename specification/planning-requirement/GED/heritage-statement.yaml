reference: heritage-statement
local-authority: GED
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - locally-listed-building
        description: Within the setting of a listed building or scheduled ancient monument, within a conservation
          area, or a local interest building.
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - locally-listed-building
        - park-and-garden
        description: The development affects a heritage asset (designated or non-designated).
  - application-type:
      in:
      - lbc
      - demolition-con-area
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policies 26, 27, 28 and 31
source-text: Heritage Statement – if property is within the setting of a listed building, is within a
  conservation area, is within the setting of a scheduled ancient monument, is a local interest building.
  See LPD Policies 26, 27, 28 and 31. … Heritage Statement (including Historical, archaeological features
  and Scheduled Ancient Monuments) - any development affecting a heritage asset. See LPD Policy 26. …
  Heritage impact assessment. … Heritage Impact Assessment.
must-include:
- item: The special architectural and historic significance of the heritage asset (designated or non-designated)
    and its setting, including any other heritage assets affected
  level: must
- item: Reference to the submitted plans and supporting documents (for example historic maps or texts)
    for the significance of the parts to be affected
  level: should
- item: A description of the proposed works
  level: must
- item: The impact of the proposed works on the significance of the building(s) identified
  level: must
- item: Where harm is likely, proposed mitigation measures to reduce it; any enhancement or better revealing
    of significance highlighted
  level: must
- item: Any archaeological issues at the site
  level: must
confidence: medium
notes: 'From the council''s list (adopted 22 May 2025), pages 7-8, 10-15, 17, 20, 28, 50. Local requirement
  for householder, full and outline applications (the full-application wording varies slightly by sub-type:
  ''any new residential development'' / ''any residential conversions'' / ''any development'' affecting
  a heritage asset); the national ''Heritage impact assessment'' for listed building consent and relevant
  demolition in a conservation area.'
review-status: unverified
field-status: {}
