source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Aligned Core Strategy Policy 14
source-text: Travel Plan – for any developments in excess of 50 units. See ASC Policy 14. … (if floor
  space exceeds 800 sq m you will also need to provide a Travel Plan) … (if floor space exceeds 1500 sq
  m you will also need to provide a Travel Plan) … (if floor space exceeds 2500 sq m you will also need
  to provide a Travel Plan) … (if floor space exceeds 600 sq m you will also need to provide a Travel
  Plan) … (if floor space exceeds 500 sq m you will also need to provide a Travel Plan) … (if floor space
  exceeds 4000 sq m you will also need to provide a Travel Plan) … (if floor space exceeds 5000 sq m you
  will also need to provide a Travel Plan) … (if no. of bedrooms exceeds 100 you will also need to provide
  a Travel Plan) … (if no. of students exceeds 150 you will also need to provide a Travel Plan) … (over
  400 will trigger the need for a Travel Plan) … (over 80 will trigger the need for a Travel Plan) … (if
  floor space exceeds 1000 sq m you will also need to provide a Travel Plan)
must-include:
- item: Specific required outcomes, targets and measures
  level: should
- item: Clear future monitoring and management arrangements
  level: should
- item: Additional measures if the targets are not met
  level: should
- item: Evaluates benchmark travel data, forecast trips by all modes, existing travel habits in the area,
    proposals to reduce the need to travel and improved public transport
  level: should
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 11-18, 55-56, 59. The per-type lists cite
  'ASC Policy 14' (the Aligned Core Strategy). Appendix 1 gives Travel Plan thresholds by use (in the
  old use classes) for food retail over 800 sq m, non-food retail over 1,500 sq m, A2 and A3 over 2,500
  sq m, A4 over 600 sq m, A5 over 500 sq m, B1 over 2,500 sq m, B2 over 4,000 sq m, B8 over 5,000 sq m,
  hotels over 100 bedrooms, educational institutions over 150 students, other institutions over 400 residents,
  D1 over 1,000 sq m and D2 over 1,500 sq m; for housing it says over 80 dwellings, but the per-type lists'
  'in excess of 50 units' is lower and used here.
