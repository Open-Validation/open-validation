      - condition:
          field: floorspace
          operator: '>'
          value: 2500
          description: Over 2,500 sq m.
    - all:
      - condition:
          field: use-class
          value: general-industrial
          description: General industry (B2).
      - condition:
          field: floorspace
          operator: '>'
