reference: location-plan
local-authority: GED
required-if:
  application-type:
    in:
    - hh
    - pa-extension
    - lbc
    - ldc-existing-use
    - ldc-prospective-use
    - demolition-con-area
    - hedgerow-removal
    - consent-under-tpo
    - notice-trees-in-con-area
    - pip
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Site location plan:- … The application site must outlined in red (this is usually the boundaries
  to the site) and any land adjoining or close by owned by the applicant should be outlined in blue. …
  The plan must be to an identified scale (this is usually 1:1250) and show a north arrow. … The location
  plan should include adjacent road names. … Site location plan – does not have to be ordnance survey
  but must clearly show the location of the tree/s. … Site location plan identifying the hedgerow(s) to
  be removed.
must-include:
- item: Application site outlined in red (usually the site boundaries)
  level: must
- item: Any adjoining or nearby land owned by the applicant outlined in blue
  level: should
- item: An identified scale (usually 1:1250)
  level: must
- item: A north arrow
  level: must
- item: Adjacent road names
  level: should
- item: 'Tree works: need not be Ordnance Survey based but must clearly show the location of the tree(s)
    (for conservation-area notifications, relative to surrounding buildings and roads)'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Identifies the hedgerow(s) to be removed
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 7, 9, 20, 22-23, 28-29, 32-33, 35. National
  requirement listed under each application type; the contents are given for householder and householder
  prior notification applications. For full and outline applications the list refers to the national requirements
  on GOV.UK for the national documents; only the local requirements are listed per sub-type (residential
  new build, residential conversions, commercial/industrial/non-residential, change of use, agricultural
  development).
review-status: unverified
