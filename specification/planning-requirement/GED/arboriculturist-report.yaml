reference: arboriculturist-report
local-authority: GED
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: tree-works
          value: true
          description: Trees need to be removed or pruned.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedges need to be removed or pruned.
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees may be affected by the proposed development.
  - all:
    - application-type:
        in:
        - hedgerow-removal
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Mature trees are located within the hedgerow.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policy 18
source-text: Tree Survey/Arboricultural Implications – if any trees or hedges need to be removed or pruned
  as part of the proposed development. … Tree survey/Arboricultural implications - all applications where
  trees may be affected by the proposed development. … Tree survey/Arboricultural Implications – required
  where mature trees are located within the hedgerow. See LPD Policy 18.
must-include:
- item: All the information required by BS 5837:2012 (or any later update)
  level: must
- item: Location of all existing trees over 75 mm diameter at 1.5 m within, overhanging or near the site
    (smaller trees indicated), with reference numbers on the tree survey plan
  level: must
- item: Existing buildings, hard surfaces, water courses, overhead cables, underground services, ground
    levels, hedges (with woody species), soil types, wildlife and historical features
  level: must
- item: A Tree Constraints Plan, a Tree Protection Plan and an Arboricultural Impact Assessment
  level: must
- item: 'For each tree: species, height, stem diameter, Root Protection Area, canopy spread at four compass
    points, age class, condition, life expectancy, amenity value and British Standard category'
  level: must
- item: A full schedule of tree works, with disposal of arisings and precautions to protect Root Protection
    Areas and retained trees
  level: must
- item: A schedule listing all the trees or groups of trees
  level: must
- item: All surveyed trees clearly tagged on site
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 8, 11-18, 29, 56-57. The list calls it 'Tree
  survey/Arboricultural implications'.
review-status: unverified
field-status: {}
