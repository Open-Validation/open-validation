reference: biodiversity-survey-report
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - hedgerow-removal
  - any:
    - condition:
        field: protected-species
        value: true
        description: Protected or priority species are likely to be impacted.
    - site:
        in:
        - priority-habitat
        - site-of-special-scientific-interest
        - local-nature-reserve
        - local-wildlife-site
        description: Priority habitats or designated sites are likely to be impacted.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Ecology survey and report – where protected or priority species or habitats or designated
  sites are likely to be impacted by a development proposal. … Surveys must be carried out by a suitably
  qualified ecologist (a member of the Chartered Institute of Ecology and Environmental Management or
  similar) at the correct time of year, using methods that are appropriate for the species and the area.
  Surveys should be up to date and ideally from the most recent survey season.
must-include:
- item: Carried out by a suitably qualified ecologist (a CIEEM member or similar)
  level: must
- item: Carried out at the correct time of year, using methods appropriate for the species and the area
  level: must
- item: Up to date, ideally from the most recent survey season
  level: should
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 7-8, 10-17, 29, 37-38. Pages 37-38 set out,
  in line with Natural England's standing advice, when a bat survey is needed (buildings, trees, underground
  sites or flight lines with bat potential) and when a Preliminary Ecological Appraisal is needed (for
  example rural building conversions, development within 100 m of a designated site, sites with woodland,
  hedgerow, scrub or water bodies); depending on the appraisal, further surveys and an Ecological Impact
  Assessment may also be required for validation.
review-status: unverified
field-status: {}
