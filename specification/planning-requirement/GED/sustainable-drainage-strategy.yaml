reference: sustainable-drainage-strategy
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - ref: major-development
    - site:
        in:
        - flood-risk-zone
        description: In or adjacent to an area at risk of flooding.
    - discretionary
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policy 4
source-text: Drainage – Surface water drainage (including SuDS) – all major applications, applications
  in and adjacent to areas at risk of flooding. … Drainage – Surface water drainage (including SuDS) -
  where requested by the Local Planning Authority.
must-include:
- item: A metric scaled plan of the existing site
  level: must
- item: A metric scaled topographical level survey of the area to metres above ordnance datum (MAOD)
  level: must
- item: Metric scaled plans and drawings of the proposed site layout identifying the footprint of the
    area being drained (including all buildings, access roads and car parks)
  level: must
- item: Existing and proposed controlled discharge rate for a 1 in 1 year and a 1 in 100 year event (with
    an allowance for climate change), based on the estimated green-field runoff rate
  level: must
- item: The proposed storage volume (attenuation)
  level: must
- item: Information on proposed SuDS measures, with a design statement on how they manage surface water
    as close to its source as possible
  level: must
- item: Geological information including borehole logs, depth to water table and/or infiltration test
    results
  level: must
- item: Details of overland flow routes for exceedance events
  level: must
- item: A management plan for future maintenance and adoption of the drainage system for the lifetime
    of the development
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 10-17, 41-42. Retired MHCLG id used for the
  surface water drainage scheme. For change of use applications it is needed only 'where requested by
  the Local Planning Authority', so that part shows as discretionary.
review-status: unverified
field-status: {}
