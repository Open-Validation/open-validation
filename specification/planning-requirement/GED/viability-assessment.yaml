reference: viability-assessment
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant does not consider the scheme viable with the policy requirements and/or
        planning obligations.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Viability statement - Where applicants do not consider that development schemes would be
  viable in relation to the policy requirements and/or planning obligations made of them.
must-include:
- item: Schedule of gross and net internal floor areas
  level: must
- item: Land purchase price (with proof), date of purchase and estimated market value of the site
  level: must
- item: Schedules of development costs (normals and abnormals), with proof of abnormal costs
  level: must
- item: Reasons why full costs (including abnormals) were not reflected in the purchase price
  level: must
- item: Expected sale prices of dwellings/buildings (and the dates)
  level: must
- item: Intended profit level(s), including profit type
  level: must
- item: 'Affordable housing: the amount (%) that could be provided against a diminishing scale of profit
    levels, up to full provision'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The viability case relates to affordable housing.
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 11-18, 57-58. The list calls it 'Viability
  statement'. A separate fee covers the council's independent review.
review-status: unverified
field-status: {}
