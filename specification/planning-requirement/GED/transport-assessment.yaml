source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Transport Assessment – where development generates a significant amount of transport movements
  (see Appendix 1 for requirement thresholds) … All developments that generate significant amounts of
  transport movement should be supported by a Transport Statement or Transport Assessment. This includes:-
  … Food retail development with gross floor area (GFA) of 250 sq m or more … Non-food retail development
  (A1) with GFA of 800 sq m or more … Financial and professional services development (A2) with GFA of
  1000 sq m or more … Restaurant and cafes development(A3) with GFA of 300 sq m or more … Drinking establishments
  (A4) with GFA of 300 sq m or more … Hot food takeaway (A5) with GFA of 250 sq m or more … Offices and
  light industry (B1) with GFA of 1500 sq m or more … General industry development (B2) with GFA of 2500
  sq m or more … Storage and distribution (B8) with GFA of 3000 sq m or more … Hotels, guest and boarding
  houses (C1) where number of bedrooms exceeds 75 … Residential institutions (C2) hospitals, nursing homes
  etc. with over 30 beds. … Residential institutions (C2) in the case of educational institutions where
  no. of students exceeds 50 … or for other institutions where no. of residents exceed 250 … Residential
  development (C3) of 50 or more dwellings … For other forms of development not listed, please seek advice
  direct from Nottinghamshire County Council Highways Authority.
must-include:
- item: The proposed development and site layout, particularly transport access and layout across all
    modes
  level: should
- item: Existing public transport provision and current traffic flows on links and junctions in the study
    area
  level: should
- item: Travel characteristics of the development across all modes, and trips from committed development
  level: should
- item: Injury accident records near the site access for the most recent 3 years (5 years in a high accident
    area)
  level: should
- item: Parking facilities in the area and the development's parking strategy
  level: should
- item: Measures to improve accessibility and to mitigate the residual impacts of the development
  level: should
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 11-18, 54-55, 59. Appendix 1 sets the thresholds
  for a Transport Statement or Transport Assessment (still in the old use classes); other forms of development
  need advice from Nottinghamshire County Council Highways Authority, so that part shows as discretionary.
  The contents are what 'should be considered' when scoping the assessment.
