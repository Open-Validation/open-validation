reference: lighting-assessment
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting is proposed.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policy 32
source-text: Lighting assessment – Where floodlighting is proposed. See LPD Policy 32
must-include:
- item: Written by a suitably qualified person
  level: must
- item: Survey of the surrounding night environment and identification of critical view points
  level: must
- item: Existing lighting conditions established and calculated, with a summary of baseline measurements
    and/or calculations
  level: must
- item: Analysis of task lighting level recommendations and the environmental light control limits
  level: must
- item: Statement of new lighting design quality objectives
  level: must
- item: Calculated measurement of task working areas and of overspill areas
  level: must
- item: Obtrusive light calculation of property intrusion
  level: must
- item: Viewed source intensities including a nominal glare assessment
  level: must
- item: Direct upward light ratio
  level: must
- item: Comparison of design achievement with baseline values, and the designer's critique of final design
    constraints
  level: must
- item: View point visualisation and a virtual walkthrough of the illuminated site
  level: must
- item: Schedule of model reflection factors, and of luminaire mounting heights and aiming angles
  level: must
- item: Layout plan with beam orientation indication
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 13-15, 17, 19, 51. Listed for commercial/industrial,
  change of use and agricultural full applications, outline and reserved matters.
review-status: unverified
field-status: {}
