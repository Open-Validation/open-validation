reference: waste-management-plan
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: All new residential development.
    - discretionary
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
source-text: Site Waste Management Plan – all new residential development … Site Waste Management Plan
  – all developments where additional waste will be generated. … Details of bin storage areas as well
  as where the bins will be placed on collection day (this may be different to their storage areas). These
  should be shown on a scaled site plan.
must-include:
- item: Bin storage areas
  level: must
- item: Where bins will be placed on collection day
  level: must
- item: Shown on a scaled site plan
  level: should
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 11-18, 53. The list calls it 'Site Waste Management
  Plan', but the contents are bin storage and collection details. For non-residential development the
  trigger ('where additional waste will be generated') shows as discretionary.
