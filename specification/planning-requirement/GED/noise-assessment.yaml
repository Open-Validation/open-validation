reference: noise-assessment
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: The proposal is likely to generate significant noise.
    - condition:
        field: noise-sensitive-use
        value: true
        description: The proposal is likely to be affected by a nearby source of noise.
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policy 32
source-text: Noise assessment – Where proposals are likely to generate significant noise or be affected
  by a nearby source of noise. See LPD Policy 32.
must-include:
- item: Existing background noise levels measured over a 24-hour period, including the cumulative noise
    levels of all existing units
  level: must
- item: Proposed noise levels, including the cumulative noise levels of all proposed units
  level: must
- item: Any proposed measures to reduce noise from the development
  level: must
- item: The manufacturer's specification of any equipment to be installed, altered or replaced
  level: must
- item: The method used and examples of the calculations and assumptions made
  level: must
- item: Completed by a qualified acoustician
  level: must
confidence: medium
notes: From the council's list (adopted 22 May 2025), pages 13-15, 17, 52. Listed for commercial/industrial,
  change of use and agricultural full applications and for outline applications.
review-status: unverified
field-status: {}
