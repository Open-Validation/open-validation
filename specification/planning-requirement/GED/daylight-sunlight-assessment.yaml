reference: daylight-sunlight-assessment
local-authority: GED
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
  - discretionary
source-url: https://www.gedling.gov.uk/sites/default/files/2025-08/GBC%20Local%20Requirements%20List%20May%202025.docx
policy: Gedling Local Planning Document Policy 32
source-text: Daylight/Sunlight assessment – For a householder planning application this is a “45 degree
  line” shown on a block plan. … Daylight/Sunlight assessment – where proposals could impact on residential
  amenity. See LPD Policy 32.
must-include:
- item: 'A ''45 degree line'' on a block plan, drawn from neighbouring windows towards the proposal: from
    the centre of the window for single-storey and from its nearest edge for two-storey development'
  level: should
- item: In some cases, a daylight, vertical sky component, sunlight availability and shadow study, sufficient
    to determine existing and expected daylight, sunlight and overshadowing on neighbouring properties
    (BRE guidance recommended)
  level: should
confidence: medium
notes: 'From the council''s list (adopted 22 May 2025), pages 7, 10-15, 17, 40. Shown as ''check'': for
  householder applications it is listed among the local requirements ''depending on site constraints''
  with no trigger, and for full and outline applications the trigger is ''where proposals could impact
  on residential amenity''. The list says a 45 degree line may be sufficient in most cases.'
review-status: unverified
field-status: {}
