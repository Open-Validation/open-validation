reference: lighting-assessment
local-authority: KEC
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - any:
    - site:
        in:
        - listed-building
        - conservation-area
        - local-wildlife-site
        description: In the vicinity of a listed building, conservation area or Site of Importance for
          Nature Conservation.
    - application-type:
        in:
        - advertising
    - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policies CL1, CL2, CL3, CL5 and CL11
source-text: All applications involving provision of publicly accessible space, in the vicinity of residential
  property, a Listed Building or a Conservation Area, a Site of Importance for Nature Conservation or
  advertisements, where external lighting would be provided or made necessary by the development.
must-include:
- item: Details of external lighting and the proposed hours the lighting would be switched on
  level: must
- item: Layout plan with light spread and beam orientation if applicable (can be annotated on the plans)
  level: must
- item: Diagram showing the intensity of illumination
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 14, 38 (Section Two and Note 24). Publicly
  accessible space and the vicinity of residential property show as discretionary.
review-status: unverified
field-status: {}
