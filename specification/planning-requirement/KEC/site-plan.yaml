reference: site-plan
local-authority: KEC
required-if:
  always: true
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: At a scale of 1:200 (householder applications) or 1:500 (other applications)
  level: must
- item: Direction of north
  level: must
- item: Proposed development in relation to the site boundaries and other existing buildings on site,
    with written dimensions including those to the site boundaries
  level: must
- item: All neighbouring buildings, roads and footpaths on land adjoining the site, including all points
    of access
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 5, 22 (Section One and Note 3).
review-status: unverified
field-status: {}
