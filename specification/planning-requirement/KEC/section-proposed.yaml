reference: section-proposed
local-authority: KEC
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground or floor levels.
  - condition:
      field: height-change
      value: true
      description: A change in height.
  - condition:
      field: basement
      value: true
      description: Lower ground floors or basements, with lightwells and garden levels.
  - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Where a proposal involves a change in ground or floor levels, a change in height, on sloping
  sites,or sites involving different levels such as lower ground floors or basements, with lightwells
  and garden levels often best shown in section.
must-include:
- item: Drawings at a scale of 1:50 or 1:100 (1:50 often preferable) showing cross-sections through the
    proposed buildings
  level: must
- item: Existing site levels and finished floor levels, related to a fixed datum point off-site
  level: must
- item: The proposals in relation to adjoining buildings
  level: must
- item: Scale bar showing lengths of 1m and 10m, and key dimensions
  level: must
- item: Paper (print) size and the scale at that print size, and the direction of north
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 7, 22-23 (Section One and Note 4). Sloping
  sites and other sites with different levels show as discretionary.
review-status: unverified
field-status: {}
