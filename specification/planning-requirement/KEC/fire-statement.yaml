reference: fire-statement
local-authority: KEC
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: A building is 18 metres or more tall.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: A building has 7 or more storeys.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: The building contains 2 or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: The building contains educational accommodation.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
confidence: medium
notes: 'From the audit (missing_requirement): Fire statement for majors and Gateway One developments.
  The Gateway One branch uses the national definition of a relevant building.'
review-status: unverified
field-status: {}
