reference: fire-statement
local-authority: KEC
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: London Plan policies D5 and D12; Article 9A, Town and Country Planning (Development Management
  Procedure) (England) Order 2015
source-text: Major applications and development requiring Gateway One approval by the Building Safety
  Regulator
must-include:
- item: A standalone document defining the fire safety objectives and performance requirements, and the
    methods by which they will be met
  level: should
- item: Produced by a third party, suitably qualified assessor
  level: must
- item: Meets London Plan policy D12
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 10 March 2023), page 13, 34 (Section Two and Note 19). 'Gateway
  One' development is shown with the statutory thresholds (Article 9A of the DMPO, which the list links
  to).
review-status: unverified
field-status: {}
