reference: bng-metric
local-authority: KEC
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: Environment Act 2021; London Plan policy G6; RBKC Greening SPD
source-text: Calculation of biodiversity net gain should be made using the latest Defra metric or agreed
  equivalent to quantify the baseline and post- development biodiversity value of the development site.
must-include:
- item: Baseline and post-development biodiversity value of the site, using the latest Defra metric or
    an agreed equivalent
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 27 (Note 12). The list (written before
  mandatory biodiversity net gain began in February 2024) says all developments should achieve at least
  10% net gain; the rule follows the law, so householder and other exempt applications are exempt.
