submission-standards:
- item: Drawings formatted for printing at A3 or smaller; drawings needing A2, A1 or A0 are not accepted
    online (send hard copies by post)
  level: must
- item: Maximum single attachment 5MB; maximum application size 25MB (Planning Portal)
  level: must
- item: Drawings attached as PDF files; .jpg, .doc and .xls also accepted for non-drawings
  level: must
- item: Submit all necessary documents in one go, with drawings categorised by type as on the Planning
    Portal
  level: must
- item: All drawings, reports and supporting information clearly titled, with unique reference numbers
    and labelled revision references
  level: should
- item: All plans, elevations and sections drawn to an identified scale, with a scale bar and a north
    arrow
  level: must
- item: Information is published online; discuss any exceptional non-disclosure with the council before
    submitting
  level: must
