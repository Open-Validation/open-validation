reference: construction-management-plan
local-authority: KEC
required-if:
  any:
  - ref: major-development
  - condition:
      field: basement
      value: true
      description: New or enlarged basement.
  - condition:
      field: structural-demolition
      value: true
      description: Substantial demolition.
  - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policies CL7 and CT1; RBKC Basements SPD; RBKC Transport and Streets SPD; London
  Plan policies T4 and T7
source-text: All developments that include new or enlarged basements. ... Major applications. All developments
  including basements and those with the potential to cause disruption during construction including substantial
  demolition.
must-include:
- item: Construction Method Statement (CMS) as set out in the Basements SPD
  level: must
  required-if:
    condition:
      field: basement
      value: true
      description: New or enlarged basement.
- item: Construction Traffic Management Plan (CTMP) prepared using the council's CTMP proforma
  level: should
- item: Enough detail to show construction traffic and activity would not harm pedestrian, cycle, vehicular
    and road safety, affect bus or other transport operations, significantly increase congestion or unreasonably
    inconvenience people living, working and visiting nearby
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 12, 31-32 (Section Two and Notes 14 and
  15). Combines the list's Construction Method Statement (basements) and Construction Traffic Management
  Plan. Other developments with the potential to cause disruption show as discretionary.
review-status: unverified
field-status: {}
