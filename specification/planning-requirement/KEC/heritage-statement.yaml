reference: heritage-statement
local-authority: KEC
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - condition:
        field: structural-demolition
        value: true
        description: Substantial or total loss of a building.
    - site:
        in:
        - conservation-area
        description: In a conservation area.
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      description: Works affecting the setting of a listed building or conservation area.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: Planning (Listed Buildings and Conservation Areas) Act 1990; RBKC Local Plan policies CL1, CL2,
  CL3 and CL4
source-text: A Listed building consent applications. Applications for substantial or total loss of a building
  in a conservation area. Applications for works affecting the setting of a listed building or conservation
  area.
must-include:
- item: Heritage Impact Assessment with a schedule of works to the listed building, analysis of their
    impact on its significance, and justification for the works and the methodology
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Contextual and detailed photographs of the building as existing, showing features to be altered
    or removed
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Historic evidence (plans or photographs) to support any reinstatement of lost or damaged features
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Elevations and sections at 1:20 or less for alterations, replacement or installation of windows,
    doors and shopfronts (features such as architraves, glazing bars and mouldings at 1:5 or less)
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Detailed specification of all proposed materials, with samples where appropriate
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Details of any underfloor heating, tanking, recessed downlighters or new service or drainage runs
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Written statement with plans showing historic features, an analysis of significance (archaeology,
    history and character), justification for the works and their impact on the listed building, its setting,
    adjacent listed buildings or the conservation area
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 14, 36-37 (Section Two and Note 22).
review-status: unverified
field-status: {}
