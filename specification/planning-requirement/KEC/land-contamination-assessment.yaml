reference: land-contamination-assessment
local-authority: KEC
required-if:
  any:
  - condition:
      field: sensitive-end-use
      value: true
      description: A proposed use particularly vulnerable to contamination (residential, nurseries, schools,
        hospitals, play areas).
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected on site or in the surrounding area.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policy CE7; National Planning Policy Framework; Mayor of London's Contaminated
  Land Process note (2020)
source-text: All applications (including change of use) for a proposed use that will be particularly vulnerable
  to the presence of contamination, OR for any development (including change of use) where contamination
  is known OR contamination is suspected on site and/or in the surrounding area, an appropriate land contamination
  assessment prepared by a competent person needs to be submitted with the application.
must-include:
- item: At least a Preliminary Risk Assessment (PRA) prepared by a competent person
  level: must
- item: Site Investigation, Quantitative Risk Assessment and Remediation Strategy with a Verification
    plan, depending on the site, end use and potential for contamination
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 10 March 2023), page 14, 37-38 (Section Two and Note 23).
review-status: unverified
field-status: {}
