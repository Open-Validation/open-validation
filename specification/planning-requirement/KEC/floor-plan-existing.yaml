reference: floor-plan-existing
local-authority: KEC
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: The proposal creates new floorspace.
  - condition:
      field: building-works
      value: true
      description: The proposal changes the floor plans of a property.
  - condition:
      field: involves-change-of-use
      value: true
      description: Change of use, where floor plans are needed to show the extent of the use.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications that involve the creation of new floorspace or changes to the floor plans
  of a property
must-include:
- item: Drawings at a scale of 1:50 or 1:100 showing each relevant floor or part floor, roof, and means
    of access
  level: must
- item: Existing buildings or walls to be demolished clearly shown (hatching or colour, and annotation)
  level: should
- item: 'For change of use: floor plans, annotated where helpful, showing the extent of the existing and
    proposed use within the land or building'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The proposal is a change of use.
- item: Scale bar showing lengths of 1m and 10m, and key dimensions
  level: must
- item: Paper (print) size and the scale at that print size, and the direction of north
  level: must
- item: Clearly titled and dated
  level: should
confidence: medium
notes: From the council's list (published 10 March 2023), page 6, 22-23 (Section One and Note 4).
review-status: unverified
field-status: {}
