reference: daylight-sunlight-assessment
local-authority: KEC
required-if: discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policy CL5; BRE 'Site Layout Planning for Daylight and Sunlight'
source-text: All applications where there is potential for a material impact upon the current levels of
  sunlight / daylight enjoyed by occupants of adjoining properties, gardens, or amenity space. Consider
  also where the application site itself is subject to impact from adjoining buildings or features, or
  where one part of the development is affected by another part of the same development.
must-include:
- item: Daylight, vertical sky component (VSC), sunlight availability and shadow study, assessed against
    the BRE guide
  level: should
- item: Impacts on existing and new buildings, gardens and open spaces
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 12, 32 (Section Two and Note 16). Shown
  as discretionary because it depends on whether there is potential for a material impact.
review-status: unverified
field-status: {}
