reference: biodiversity-survey-report
local-authority: KEC
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: The proposal impacts protected species, whether scheduled or not, including refurbishment
        works affecting species using the building such as swifts or bats.
  - site:
      in:
      - local-wildlife-site
      - open-space
      - priority-habitat
      - special-area-of-conservation
      - site-of-special-scientific-interest
      description: Affects a Site of Importance for Nature Conservation, other Local Green Space (park
        or open space), priority habitat, SAC or SSSI.
  - condition:
      field: near-watercourse
      value: true
      description: Affects a waterbody.
  - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: London Plan policy G6; RBKC Local Plan policies CR5 and CE4; RBKC Greening SPD; RBKC Biodiversity
  Action Plan; Environment Act 2021
source-text: Required if a proposal impacts biodiversity, particularly protected species, whether scheduled
  or not, affects any Site of Importance for Nature Conservation (Local Site) or any other Local Green
  Space (park or open space), priority habitat, waterbody or green corridor. This includes refurbishment
  works which may impact species using the existing building, such as swifts or bats.
must-include:
- item: Prepared by CIEEM registered consultants holding any relevant protected species licences, with
    evidence of each consultant's qualifications
  level: should
- item: Existing habitats and wildlife features (including trees) on and adjacent to the development
  level: should
- item: Presence or likely absence of protected species on and near the development
  level: should
- item: Location of any designated Site of Importance for Nature Conservation or other statutory designated
    site
  level: should
- item: Other local habitats and wildlife features nearby, including parks, open spaces, woodlands, gardens,
    communal gardens and garden squares
  level: should
- item: The likely impacts, and measures proposed to mitigate or compensate for them
  level: should
- item: Up-to-date surveys using recognised methodology and good practice, by a CIEEM-registered ecologist;
    habitat surveys preferably using UKHab
  level: must
- item: Ecological Constraints and Opportunities Plan (ECOP) and a balance table of habitats lost and
    gained (BS 42020:2013)
  level: must
  required-if:
    ref: major-development
- item: Geological survey, assessment and mitigation report where river and stream sections, underground
    tunnels, buried geological interest or road, rail and canal cuttings are affected
  level: must
  required-if:
    condition:
      field: geodiversity-interest
      value: true
      description: The development affects geological features.
confidence: medium
notes: From the council's list (published 10 March 2023), page 11, 27-31 (Section Two and Note 12). Green
  corridors and any other impact on biodiversity show as discretionary. The report may be waived if the
  council confirms in writing at pre-application stage that it is not needed, or a risk assessment shows
  no protected species are present or affected.
review-status: unverified
field-status: {}
