reference: design-and-access-statement
local-authority: KEC
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Development in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings where the floor space created is 100 square metres or more.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Design and Access Statements are required for: 1. development which is ‘major’ development,
  as defined in article 2 of the Town and Country Planning (Development Management Procedure (England)
  Order 2015; 2. all applications for listed building consent 3. development in a conservation area, consisting
  of: • one or more dwellinghouses; or • a building or buildings where the floor space created by the
  development is 100 square metres or more.'
must-include:
- item: The design principles and concepts that have been applied to the development
  level: must
- item: The steps taken to appraise the context of the development and how the design takes that context
    into account
  level: must
- item: The approach taken to access, and how relevant local access policies have been taken into account
  level: must
- item: What consultation has been undertaken on access, and what account has been taken of the outcome
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
- item: Access for the emergency services, including circulation routes and safe and dignified emergency
    evacuation for all building users
  level: should
- item: 'For outline applications where access is reserved: the location of points of access to the site
    and the principles that will inform the access arrangements'
  level: must
  required-if:
    application-type:
      in:
      - outline
      - outline-some
      - outline-all
confidence: medium
notes: From the council's list (published 10 March 2023), page 8, 23-24 (Section One and Note 6). The
  table only says 'see Note 6 for details'. A DAS is not required for section 73 applications or for a
  material change of use of existing buildings or land.
review-status: unverified
field-status: {}
