reference: design-and-access-statement
local-authority: KEC
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The proposal creates 100 square metres or more of floorspace.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
confidence: medium
notes: 'From the audit (missing_requirement): required for listed building consent and in conservation
  areas for 1+ dwellings or 100 sqm+, but not for s73 applications or pure changes of use. The major-development
  branch is the national rule, not something the audit quotes.'
review-status: unverified
field-status: {}
