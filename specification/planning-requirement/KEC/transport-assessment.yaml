reference: transport-assessment
local-authority: KEC
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policy CT1; RBKC Transport and Streets SPD (2016); London Plan
source-text: 'Major applications. Applications that have an impact on transport, for example: changes
  of use or extensions to places such as educational buildings, places of worship and community facilities.'
must-include:
- item: Based on TfL's current Transport Assessment Guidance
  level: should
confidence: medium
notes: From the council's list (published 10 March 2023), page 18, 46 (Section Two and Note 37). Other
  applications with a transport impact show as discretionary. Note 37 says a full Transport Assessment
  is likely for 30 or more homes, commercial developments over 1,000 sq m GFA, schools of any size, hotels
  with 50 or more beds and restaurants with more than 100 seats or over 200 sq m GFA; a shorter Transport
  Statement is needed for low-trip schemes.
