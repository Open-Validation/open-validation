reference: location-plan
local-authority: KEC
required-if:
  always: true
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Up-to-date map at a scale of 1:1250 or 1:2500
  level: must
- item: Application site clearly edged with a red line, including all land required for the proposed development
  level: must
- item: Any other land within the control or ownership of the applicant, adjacent or close to the site,
    edged with a blue line
  level: should
- item: Where possible, at least two named roads and surrounding buildings identified by road and building
    number
  level: should
confidence: medium
notes: From the council's list (published 10 March 2023), page 4, 21 (Section One and Note 2).
review-status: unverified
field-status: {}
