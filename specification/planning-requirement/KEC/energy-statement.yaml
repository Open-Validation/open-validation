reference: energy-statement
local-authority: KEC
required-if:
  ref: major-development
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: London Plan policies SI 2 and SI 3; RBKC Local Plan policy CE1; RBKC Greening SPD
source-text: Major applications.
must-include:
- item: How the development will contribute towards energy and carbon reduction targets, produced in line
    with the GLA's energy assessment guidance
  level: should
- item: Whole Life-Cycle Carbon Assessment and Circular Economy Statement
  level: should
- item: BREEAM assessment certified by an accredited assessor
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-residential major development.
- item: Why it is not possible to retain and improve the existing building
  level: should
  required-if:
    condition:
      field: structural-demolition
      value: true
      description: The proposal involves substantial demolition of a building.
confidence: medium
notes: From the council's list (published 10 March 2023), page 13, 34 (Section Two and Note 18). The list
  calls it an Energy Strategy.
review-status: unverified
field-status: {}
