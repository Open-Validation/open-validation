reference: sustainability-statement
local-authority: KEC
required-if:
  ref: major-development
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: National Planning Policy Framework; London Plan; RBKC Greening SPD
source-text: Major applications
must-include:
- item: The sustainability principles of the proposal, including positive and negative environmental,
    social and economic considerations, with regard to the energy statement
  level: must
- item: BREEAM assessment certified by an accredited assessor
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-residential major development.
- item: Assessment showing major residential development meets the London Plan carbon reduction requirements
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Major residential development.
confidence: medium
notes: From the council's list (published 10 March 2023), page 17, 43 (Section Two and Note 33).
review-status: unverified
field-status: {}
