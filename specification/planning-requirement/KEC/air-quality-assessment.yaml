reference: air-quality-assessment
local-authority: KEC
required-if:
  ref: major-development
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: London Plan policies SI 1 and SI 2; RBKC Local Plan policy CE5; RBKC Air Quality SPD (2009); Mayor
  of London's Control of Dust and Emissions during Construction and Demolition SPG (2014)
source-text: Major and large-scale developments.
must-include:
- item: Air quality and dust assessment, including an air quality neutral assessment and a dust assessment
  level: should
- item: 'Where the development is likely to increase emissions: a detailed emissions assessment with proposals
    to reduce or mitigate them, including an air quality and dust management plan and a low emission strategy'
  level: should
  required-if: discretionary
- item: The strategy for reducing emissions from all areas of the development, including transport, heating
    and energy use
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 10, 26 (Section Two and Note 10). Note
  10 says major development as defined in the London Plan. It may be included in an EIA.
review-status: unverified
field-status: {}
