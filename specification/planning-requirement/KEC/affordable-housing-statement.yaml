reference: affordable-housing-statement
local-authority: KEC
required-if:
  any:
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 650
      description: Residential floorspace proposed exceeds 650 sq m gross internal area (GIA).
  - condition:
      field: affordable-housing-proposed
      value: true
      description: The proposal includes affordable housing.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: London Plan policies H4, H5 and H6; RBKC Local Plan policy CH2; Mayor of London's Affordable Housing
  and Viability SPD (2017); RBKC Planning Contributions SPD (2019); RBKC Community Housing SPD (2020)
source-text: Affordable housing statement for all applications for residential development where the floorspace
  proposed exceeds the Council’s threshold of 650 sq m gross internal area (GIA) residential floorspace.
  In other cases where the proposal includes affordable housing.
must-include:
- item: Full description of the affordable housing offer, explaining what provision is to be made
  level: should
- item: Location, number and mix of the affordable housing units, with habitable rooms, bedrooms and floorspace
    (GIA) of each unit
  level: should
- item: Total residential floorspace (GEA)
  level: should
confidence: medium
notes: From the council's list (published 10 March 2023), page 10, 26 (Section Two and Note 9).
review-status: unverified
field-status: {}
