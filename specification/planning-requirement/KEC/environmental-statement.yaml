policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: National requirement - A Statutory requirement in certain cases of large-scale development.
  Major projects such as nuclear power stations, chemical installations, motorways, railway lines and
  ports are all ‘Schedule 1’ development and always require an EIA. For other large projects, covered
  by Schedule 2, the local planning authority has a responsibility to determine whether EIA is required
  through the ‘Screening’ process.
