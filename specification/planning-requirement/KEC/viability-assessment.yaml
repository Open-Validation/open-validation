reference: viability-assessment
local-authority: KEC
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The affordable housing offer fails to meet the relevant policies.
  - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: London Plan policies H4, H5 and H6; Mayor of London's Affordable Housing and Viability SPD (2017);
  National Planning Policy Guidance on Viability
source-text: Where the affordable housing offer fails to meet the relevant policies, you will be required
  to submit a Financial Viability Assessment. ... If you intend to use viability to justify failure to
  meet policy requirements, you must also provide a viability report to support your application.
must-include:
- item: Prepared in line with the approach to viability assessment in the National Planning Practice Guidance
  level: must
- item: Prepared on the basis that it will be made publicly available
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 26, 38 (Notes 9 and 25). Other cases where
  viability is used to justify not meeting policy (Note 25, marketing and use viability) show as discretionary.
review-status: unverified
field-status: {}
