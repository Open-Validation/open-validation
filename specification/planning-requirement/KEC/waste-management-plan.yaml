reference: waste-management-plan
local-authority: KEC
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use.
    - condition:
        field: food-or-drink-use
        value: true
        description: To a restaurant, bar or takeaway.
  - condition:
      field: dwelling-subdivision
      value: true
      description: Conversion of a property.
  - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policy CE3
source-text: Major applications. ... Major applications. Other applications that will have an impact on
  the generation of waste and an increase in demand, for example – conversion of properties, changes of
  use to restaurants, bars and takeaways.
must-include:
- item: 'Site Waste Management Plan for demolition, excavation and construction waste: type and volume
    of material to be demolished or excavated, opportunities for reuse and recovery, and how off-site
    disposal will be minimised and managed'
  level: must
  required-if:
    ref: major-development
- item: What kind of waste the site produces, how it will be disposed of (reuse, recycle, landfill), the
    waste carrier and its registration number, and the address and environmental permit or exemption number
    of the receiving site
  level: must
  required-if:
    ref: major-development
- item: Refuse and recycling storage that is well designed, functional and accessible and allows for ease
    of collection
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 16, 42 (Section Two and Note 31). Combines
  the list's Site Waste Management Plan (major applications) and Waste Storage and Collection Details.
  Other applications that increase waste show as discretionary.
review-status: unverified
field-status: {}
