reference: archaeological-assessment
local-authority: KEC
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      description: In an Archaeological Priority Area (APA).
  - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policy CL4; National Planning Policy Framework
source-text: All developments in Archaeological Priority Areas (APAs).
must-include:
- item: Desk-based assessment in line with the National Planning Policy Framework
  level: must
- item: Field evaluation report, if advised at pre-application enquiry
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 10 March 2023), page 11, 27, 37 (Section Two and Notes 11 and
  22). Outside APAs (small developments, and major developments) applicants are advised to ask the Greater
  London Archaeological Advisory Service whether a desk-based assessment is needed, so that part shows
  as discretionary.
review-status: unverified
field-status: {}
