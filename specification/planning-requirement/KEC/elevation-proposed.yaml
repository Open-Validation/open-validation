reference: elevation-proposed
local-authority: KEC
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: The proposal creates new floorspace.
  - condition:
      field: external-alterations
      value: true
      description: The proposal changes external aspects of the property.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications that involve the creation of new floorspace or changes to external aspects
  of the property
must-include:
- item: Drawings at a scale of 1:50 or 1:100 (1:50 often preferable), illustrating all relevant external
    parts
  level: must
- item: Existing and proposed elevations shown beside each other if possible
  level: should
- item: 'Where a proposed elevation adjoins or is close to another building: the relationship between
    the buildings, with the relative positions of openings, parapets and levels on each property'
  level: should
- item: Blank elevations included for clarity
  level: should
- item: Scale bar showing lengths of 1m and 10m, and key dimensions
  level: must
- item: Paper (print) size and the scale at that print size, and the direction of north
  level: must
- item: Clearly titled and dated
  level: should
- item: Where roofs, parapets or building lines are raised or extended, the line of the existing shown
    as a dotted or coloured line
  level: should
- item: For listed buildings, 1:20 details (or larger) as appropriate
  level: should
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
confidence: medium
notes: From the council's list (published 10 March 2023), page 5, 22-23 (Section One and Note 4).
review-status: unverified
field-status: {}
