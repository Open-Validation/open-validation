reference: flood-risk-assessment
local-authority: KEC
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or greater in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or greater in Flood Zone 1.
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3.
  - site:
      in:
      - critical-drainage-area
      description: Development in a Critical Drainage Area.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policy CE2; National Planning Policy Framework
source-text: All development proposals of 1 hectare or greater in Flood Zone 1, all proposals for new
  developments located in Flood Zones 2 and 3, and Critical Drainage Areas which are at risk from surface
  water and sewer flooding.
must-include:
- item: Assessment of the risks of all forms of flooding to and from the development, and how they will
    be managed, taking climate change into account
  level: must
- item: Sequential test, and the exception test where needed
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: Development in Flood Zone 2 or 3.
confidence: medium
notes: From the council's list (published 10 March 2023), page 13, 35 (Section Two and Note 20). Includes
  change of use to a more vulnerable use.
review-status: unverified
field-status: {}
