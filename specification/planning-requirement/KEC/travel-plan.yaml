reference: travel-plan
local-authority: KEC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 30
      description: 30 residential units or more.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: Commercial developments of more than 1,000 sq m gross floor area.
  - condition:
      field: school-expansion
      value: true
      description: Schools (of any size).
  - all:
    - condition:
        field: food-or-drink-use
        value: true
        description: Restaurant.
    - any:
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 200
          description: More than 200 sq m GFA.
      - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policy CT1; RBKC Transport and Streets SPD (2016); London Plan policy T4
source-text: 30 residential units or more, commercial developments of more than 1000m2 (10,758ft2) gross
  floor area (GFA), or schools (of any size) and restaurants with more than 100 seats or more than 200m2
  (2152ft2) GFA.
must-include:
- item: Produced in line with TfL's current travel plan guidance
  level: should
confidence: medium
notes: From the council's list (published 10 March 2023), page 18, 46-47 (Section Two and Note 37). Restaurants
  with more than 100 seats show as discretionary (no seat field). Note 37 gives higher Travel Plan thresholds
  (80 homes, commercial over 2,500 sq m, retail of 1,000 sq m or more, hotels with 50 or more beds, schools)
  than the table; the rule follows the table.
review-status: unverified
field-status: {}
