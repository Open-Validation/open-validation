reference: noise-assessment
local-authority: KEC
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Noise generating development, including new places of entertainment.
  - condition:
      field: plant-equipment
      value: true
      description: Installation of plant, motors, filters or other machinery, including air conditioning
        units and air source heat pumps.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Residential and noise sensitive developments.
  - condition:
      field: basement
      value: true
      description: Basement developments.
  - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policy CL5; RBKC Noise SPD; National Planning Policy Guidance on Noise
source-text: 'Any application that involves noise generating development including new development and
  changes of use that may involve the installation of plant, motors or filters, and/or other machinery
  including air conditioning units and air source heat pumps on residential or commercial properties.
  ... Noise surveys and reports will generally be required for developments including: 1. Building services
  and other external plant 2. Residential and noise sensitive developments 3. Basement developments 4.
  New places of entertainment 5. Where there are increases in road traffic'
must-include:
- item: Prepared by a competent acoustician, normally a member of the Institute of Acoustics
  level: should
- item: Results of noise surveys determining the range of ambient and background noise levels, with time
    periods and parameters measured in line with the Noise SPD
  level: should
- item: Noise assessments, predictions and calculations
  level: should
- item: Recommendations and specifications of any works needed to comply with the Noise SPD
  level: should
- item: Noise control works shown on the application drawings; for external attenuation equipment (acoustic
    enclosures or screens), its location, size and visual impact
  level: should
- item: Noise measurement surveys carried out in line with BS 4142:2019
  level: should
confidence: medium
notes: From the council's list (published 10 March 2023), page 10, 25 (Section Two and Note 8). The list
  calls it an Acoustic Report. Increases in road traffic show as discretionary.
review-status: unverified
field-status: {}
