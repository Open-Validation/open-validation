reference: planning-statement
local-authority: KEC
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: Development contrary to policies of the development plan.
  - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: National Planning Policy Framework; London Plan; RBKC Local Plan
source-text: Major developments proposals contrary to policies of the development plan/ Local Development
  Framework (LDF), and any other situation where approach to certain policies, or rationale behind certain
  details or approaches, or links to other sites/previous permissions etc, need to be explained.
must-include:
- item: How the proposal relates to national and regional guidance, the development plan (London Plan
    and Local Plan) and adopted SPDs
  level: should
- item: Any benefits and harm from the development, and how any harm would be addressed or mitigated
  level: should
- item: 'Consultations with the council, the community and statutory consultees before submission: how
    they took place, their outcomes and how issues were dealt with'
  level: should
- item: Why the application departs from pre-application advice, where it does
  level: should
  required-if: discretionary
- item: 'For loss of retail, commercial or social and community uses: market and other economic information
    weighed against environmental and social benefits, showing harm will not be caused'
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: Loss of a retail, commercial or social and community use.
confidence: medium
notes: From the council's list (published 10 March 2023), page 16, 40 (Section Two and Note 28). Other
  situations needing explanation (including pre-application advice, Certificates of Lawfulness and proposals
  balancing competing policies) show as discretionary.
review-status: unverified
field-status: {}
