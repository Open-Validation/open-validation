reference: arboriculturist-report
local-authority: KEC
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees on the site or on adjacent land (including street trees) that could influence or
      be affected by the development.
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policy CR6; RBKC Trees and Development SPD
source-text: Where there are trees within the application site, or on land adjacent to the application
  site, that could influence, or be affected by, the development (including street trees) and during the
  construction of that development.
must-include:
- item: Land survey (preferably 1:100 or 1:200) showing all relevant site features, the location of all
    trees, hedgerows and shrubs over 2m tall and/or 7.5cm stem diameter at 1.5m, spot heights, and trees
    on adjoining land within half a tree height of the boundary
  level: should
- item: Tree survey by a suitably qualified arboriculturist meeting section 4.4 of BS 5837:2012, with
    all trees numbered on the land survey plan
  level: should
- item: 'Species details for each tree: species, height, stem diameter, crown spread to the four compass
    points, crown base height, age class, condition, management recommendations and BS 5837 retention
    category'
  level: should
- item: Arboricultural Method Statement (AMS)
  level: should
- item: Landscaping or tree planting scheme
  level: should
confidence: medium
notes: From the council's list (published 10 March 2023), page 18, 47-48 (Section Two and Note 38). The
  list calls it Tree Survey/Arboricultural Implications.
review-status: unverified
field-status: {}
