reference: landscaping-plan
local-authority: KEC
required-if:
  any:
  - all:
    - condition:
        field: landscaping-works
        value: true
        description: Significant works to outdoor areas (not change of use or alterations to existing
          buildings).
    - discretionary
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development.
    - condition:
        field: loss-of-open-space
        value: true
        description: Results in a loss of private open space.
  - all:
    - ref: major-development
    - discretionary
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: London Plan policies D8 and G7; RBKC Local Plan policy CR6; RBKC Trees and Development SPD; RBKC
  Greening SPD
source-text: Applications that involve significant works to outdoor areas (apart from change of uses &
  alterations to existing buildings). Minor developments which contain a significant element of landscaping
  or that result in a loss of private open space. Major proposals with an element of public realm (even
  where provided on private land).
must-include:
- item: Details of hard and soft landscaping (can be shown on the plans)
  level: must
- item: New trees and shrubs shown in position, by species, size and density
  level: should
confidence: medium
notes: From the council's list (published 10 March 2023), page 16, 41 (Section Two and Note 29). 'Significant'
  works or landscaping and major proposals with an element of public realm show as discretionary.
review-status: unverified
field-status: {}
