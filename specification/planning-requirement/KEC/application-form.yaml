reference: application-form
local-authority: KEC
required-if:
  always: true
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: All relevant questions completed, with 'Not Applicable' or N/A where a question does not apply
  level: must
- item: Description of development full and accurate
  level: must
- item: Ownership Certificate (A, B, C or D as applicable), signed and dated, with notice served on all
    owners where Certificate B is completed
  level: must
- item: Agricultural Holdings Certificate (part a) signed if the site is not an agricultural holding),
    signed and dated
  level: must
- item: Declaration signed and dated
  level: must
confidence: medium
notes: From the council's list (published 10 March 2023), page 4, 20-21 (Section One and Note 1). The
  Agricultural Holdings Certificate is not needed for advertisement consent only applications.
review-status: unverified
field-status: {}
