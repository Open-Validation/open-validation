reference: town-centre-impact-assessment
local-authority: KEC
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Leisure and tourism development outside a designated town centre.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 sq m gross floorspace.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail development not within an existing town centre.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 400
        description: More than 400 sq m of additional retail floorspace (gross external).
source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
policy: RBKC Local Plan policies CK2, CK3, CF1, CF2, CF3 and CF4
source-text: Applications for leisure and tourism developments over 2,500 square metres gross floorspace
  outside of designated town centre. Applications which include the creation of more than 400 sq m of
  additional retail floorspace (gross external) when not within an existing town centre.
must-include:
- item: Needs assessment, including quantitative and qualitative need, justifying the development
  level: should
- item: The sequential approach that led to the site being selected (not needed for extensions under 200
    sq m)
  level: should
- item: Impact on the vitality and viability of existing centres
  level: should
confidence: medium
notes: From the council's list (published 10 March 2023), page 17, 45 (Section Two and Note 35). Additional
  office floorspace does not need one.
review-status: unverified
field-status: {}
