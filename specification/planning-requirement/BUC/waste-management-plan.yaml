reference: waste-management-plan
local-authority: BUC
required-if:
  any:
  - ref: major-development
  - condition:
      field: minor-development
      value: true
      description: 'Minor development: 1-9 dwellings, under 1,000 sq m of floorspace, or a site under
        1 hectare.'
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: NPPW paragraph 9
source-text: It is needed for all minor and major applications.
must-include:
- item: A vehicle tracking plan for refuse vehicles showing access to every roadway
  level: must
- item: Storage location of the appropriate number of bins on each property (red dot)
  level: must
- item: Collection or emptying location for the bins (blue dot)
  level: must
- item: An outside route (not through the property) from bin storage to collection point for each property
  level: must
- item: Roads that are private or not being adopted by Buckinghamshire Council clearly marked
  level: must
- item: The pull distance for crews and residents
  level: must
- item: 'Communal bin stores: location, capacity for the number of properties, crew collection points
    and distance to the furthest property'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. The waste
  and recycling strategy.
review-status: unverified
field-status: {}
