source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/plans-and-diagrams-to-submit-with-your-planning-application/
policy: NPPF paragraphs 124 to 132; Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended)
source-text: These are needed for all applications.
must-include:
- item: At a scale of 1:100 or 1:50 with a scale bar
  level: must
- item: A unique reference number
  level: must
- item: The proposed buildings in context with adjacent buildings
  level: must
- item: Bin and cycle storage, for flats and non-residential uses (such as offices)
  level: must
  required-if: discretionary
- item: Measured volume of gross external area, for extended or replaced dwellings or outbuildings in
    the Green Belt
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: Extended or replaced dwellings or outbuildings in the Green Belt.
  source-text: show measured volume of gross external area (for extended or replaced dwellings or outbuildings
    in the green belt)
