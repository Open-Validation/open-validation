reference: location-plan
local-authority: BUC
required-if:
  always: true
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/plans-and-diagrams-to-submit-with-your-planning-application/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: It is needed for all applications.
must-include:
- item: At a scale of 1:1250 or 1:2500 with a scale bar
  level: must
- item: A unique reference number
  level: must
- item: An up-to-date base map
  level: must
- item: Roads or buildings on land adjoining the site (preferably labelling at least two roads)
  level: must
- item: The application site outlined clearly in red, including land needed for access from a public highway,
    visibility splays, landscaping, car parking and open areas around buildings
  level: must
- item: Any adjoining land owned by the applicant outlined in blue
  level: must
- item: Only one red line boundary per submission
  level: must
- item: Not drawn on a Land Registry plan
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Plans and diagrams'.
review-status: unverified
field-status: {}
