reference: biodiversity-survey-report
local-authority: BUC
required-if: discretionary
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: 'NPPF paragraphs 174 to 177; Aylesbury Vale: NE1 (VALP); Chiltern: CS24 (CDCCS); South Bucks:
  CP9 (SBDCCS); Wycombe: DM11 DM13 DM14 (DSA), CP10 DM34 (WDLP)'
source-text: This is required when the Ecology and Trees checklist has indicated a report is required.
must-include:
- item: Summary of the findings of any ecology surveys carried out on the site (such as a preliminary
    ecological appraisal or bat survey)
  level: must
- item: Assessment of the wildlife present on the site
  level: must
- item: Suggested improvements for biodiversity
  level: must
- item: Assessment of the proposal against local and national planning policy
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. The ecology
  report. Shown as discretionary because it depends on the answers to the council's Ecology and Trees
  checklist (needed with every application; no matching id, see the unmapped list), whose triggers are
  not set out on the page. The list predates mandatory biodiversity net gain and has no BNG requirement.
