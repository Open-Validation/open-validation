reference: section-proposed
local-authority: BUC
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: Alterations to ground levels, including raised or sunken patios, decking and steps.
  - all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: Listed building works that change or alter floor levels.
      - condition:
          field: roof-space-room
          value: true
          description: Conversion of a loft into a habitable room.
      - condition:
          field: basement
          value: true
          description: Conversion of a basement into a habitable room.
  - discretionary
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/plans-and-diagrams-to-submit-with-your-planning-application/
policy: 'NPPF paragraphs 124 to 132 and 189; Aylesbury Vale: GP53 GP59 (AVDLP), BE1 (VALP); Chiltern:
  CS4 CS22 (CDCCS), LB1-LB4 CA1-CA4 (CDCLP); South Bucks: C6 (SBDCLP), CP8 (SBDCCS); Wycombe: DM31 CP11
  (WDLP); Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)'
source-text: 'This is needed for all proposals that involve alterations to ground levels, including raised
  or sunken patios, decking, steps, and so on. ... They are needed for all applications for listed building
  consent involving: the change or alteration of floor levels conversion of loft or basement into habitable
  room'
must-include:
- item: Site sections at 1:100 or 1:50 with a scale bar (1:200 for larger sites)
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Changes to ground levels.
- item: A unique reference number
  level: must
- item: Levels in the context of adjoining areas, referenced to an identified off-site OS datum point
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Changes to ground levels.
- item: How encroachment onto adjoining land is avoided, where the proposal includes eaves, foundations
    or retaining structures
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Changes to ground levels.
- item: The floor to ceiling level within a building, and any voids
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Changes to ground levels.
- item: 'Listed building internal sections: at 1:50 or 1:20 with a scale bar, showing the proposed works
    in relation to the existing structure'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: Listed building works that change or alter floor levels.
      - condition:
          field: roof-space-room
          value: true
          description: Conversion of a loft into a habitable room.
      - condition:
          field: basement
          value: true
          description: Conversion of a basement into a habitable room.
- item: 'Listed building internal sections: a schedule of works and method statement'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: Listed building works that change or alter floor levels.
      - condition:
          field: roof-space-room
          value: true
          description: Conversion of a loft into a habitable room.
      - condition:
          field: basement
          value: true
          description: Conversion of a basement into a habitable room.
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Plans and diagrams'. Covers both 'Site
  sections or levels' and, for listed building consent, 'Internal sections'. The council's discretion
  covers hilly areas such as High Wycombe or steep sites, and listed building works such as conversions,
  building regulations upgrades or works affecting internal characteristics.
review-status: unverified
field-status: {}
