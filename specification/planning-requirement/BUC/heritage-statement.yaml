reference: heritage-statement
local-authority: BUC
required-if:
  any:
  - site:
      in:
      - listed-building
      - scheduled-monument
      - park-and-garden
      - battlefield
      - conservation-area
      - archaeological-priority-area
      - protected-wreck-site
      - world-heritage-site
      - locally-listed-building
      description: 'Contains a designated or non-designated heritage asset: listed building, scheduled
        monument, registered park and garden or battlefield, conservation area, archaeological notification
        area, protected wreck site, world heritage site or locally listed building.'
  - site:
      in:
      - listed-building-setting
      description: Affects the setting of a heritage asset.
  - discretionary
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: 'NPPF paragraphs 184 to 202; Aylesbury Vale: BE1 (VALP); Chiltern: CS4 CS22 (CDCCS), LB1-LB4 CA1-CA4
  (CDCLP); South Bucks: C6 (SBDCLP), CP8 (SBDCCS); Wycombe: DM31 CP11 (WDLP)'
source-text: This is required for applications that contain designated or non-designated heritage assets
  (see below). ... Proposals affecting the setting of heritage assets or non-designated heritage assets
  will need to be supported by a Heritage Statement.
must-include:
- item: On the council's heritage statement template
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. Also called
  a Statement of Heritage Significance or Heritage Impact Assessment. The setting of non-designated assets
  and curtilage listed buildings is shown as the council's discretion.
review-status: unverified
field-status: {}
