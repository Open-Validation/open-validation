reference: design-and-access-statement
local-authority: BUC
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building with a floorspace of 100 square metres or more.
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended); section 10 of the Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: 'This is required for: all major applications all listed building consent applications applications
  in a conservation area for one or more dwelling(s) or a building with a floorspace of 100 square meters
  or more'
must-include:
- item: The design principles and concepts applied
  level: must
- item: The appraisal of the site and how it is reflected in the design
  level: must
- item: The national and local policy approach to access, and how specific access issues have been addressed
  level: must
- item: Any consultation undertaken and the issues that arose
  level: must
- item: How planning policies are met, if no separate Planning Statement is submitted
  level: should
- item: How crime prevention measures have been designed in (or in a separate Crime Prevention Strategy)
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'.
review-status: unverified
field-status: {}
