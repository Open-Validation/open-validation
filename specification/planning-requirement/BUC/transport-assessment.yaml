- item: Information on the proposed development and surrounding areas, and the planning context
  level: must
- item: Road collision history on the surrounding road network
  level: must
- item: Proposed access arrangements for all modes of transport
  level: must
- item: Current and proposed traffic flows on links and at junctions
  level: must
- item: 'Travel changes due to the development: trip generation, trip distribution and, where appropriate,
    junction modelling'
  level: must
- item: A cumulative assessment taking into account other planning applications under consideration
  level: must
- item: Existing and proposed public transport provision, including phasing where appropriate
  level: must
- item: Parking facilities in the area and the parking strategy of the development
  level: must
- item: Measures to improve accessibility and reduce the need to travel, and to mitigate residual impacts
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. 'Transport
  assessments and statements'. The table (old use classes) gives a Transport Statement from the lower
  threshold and a Transport Assessment from the higher one. The thresholds are guidelines; other proposals
  that generate significant transport movements (and other uses) are shown as the council's discretion.
