policy: 'NPPF paragraph 111; Aylesbury Vale: T4, T5 (VALP); Chiltern: CS6 CS7 (CDCCS), TR2 TR3 (CDCLP);
  South Bucks: CP7 (SBDCCS); Wycombe: DM2 (DSA); Buckinghamshire Highways Development Management Guidance'
source-text: They are required for applications that meet Buckinghamshire Highways DM's guideline thresholds.
  There may be other proposals where you will need to submit this (see below).
