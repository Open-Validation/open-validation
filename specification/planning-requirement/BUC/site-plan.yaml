- item: A unique reference number
  level: must
- item: An up-to-date base map
  level: must
- item: The direction of North
  level: must
- item: 'Where relevant: buildings, roads, footpaths (including public rights of way), trees on or adjoining
    the site, hard surfacing, and boundary treatment including walls or fencing'
  level: must
