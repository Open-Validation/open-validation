reference: arboriculturist-report
local-authority: BUC
required-if: discretionary
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: 'NPPF paragraphs 174 to 177; Aylesbury Vale: NE8 (VALP); Chiltern: CS24 (CDCCS), TW2 TW3 TW6 CA5
  GB30 (CDCLP); South Bucks: CP9 (SBDCCS), L10 (SBDCLP); Wycombe: CP10 DM34 (WDLP), DM11 DM13 DM14 (DSA);
  Buckinghamshire Minerals and Waste Local Plan: Policy 18'
source-text: This is required when the Ecology and Trees checklist has indicated a report is required.
must-include:
- item: Summary of the findings of any arboricultural work on the site (such as an arboricultural impact
    assessment or tree protection plan)
  level: must
- item: 'Detail as set out in Table B.1 of BS5837:2012: tree survey; tree retention or removal plan; retained
    trees and Root Protection Areas on the layout plan; strategic hard and soft landscape design including
    new tree planting; Arboricultural Impact Assessment'
  level: must
- item: Existing and proposed levels, tree protection plan, arboricultural method statement (heads of
    terms) and special engineering details within the RPA, where relevant
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. The trees
  report. Shown as discretionary because it depends on the answers to the council's Ecology and Trees
  checklist, whose triggers are not set out on the page.
review-status: unverified
