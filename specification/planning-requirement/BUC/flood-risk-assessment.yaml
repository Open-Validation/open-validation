reference: flood-risk-assessment
local-authority: BUC
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Over 1 hectare in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Over 1 hectare in Flood Zone 1.
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: 'NPPF paragraphs 155 to 165; Aylesbury Vale: I4 (VALP); Chiltern: CS4 (CDCCS), GC10 (CDCLP); South
  Bucks: CP13 (SBDCCS); Wycombe: DM39 CP12 (WDLP)'
source-text: 'It is needed for applications in flood zone areas 2 or 3 or has over 1 hectare in flood
  zone 1. ... This is needed for applications in flood zone areas 2 or 3 for: new dwelling(s) non-residential
  schemes over 250 square meters'
must-include:
- item: The risk of all forms of flooding to or from the development
  level: must
- item: How the flood risks will be managed
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Design of surface water management systems (including SuDS)
  level: must
- item: Safe access to and from the development in flood risk areas
  level: must
- item: 'Sequential Test: the site chosen and why, within the agreed area of search'
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New dwelling(s).
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 250
          description: Non-residential schemes over 250 square metres.
  source-text: The Sequential Test forms part of a Flood Risk Assessment.
- item: 'Sequential Test: ''reasonably available'' alternative sites considered (name, address, Local
    Plan allocation, constraints, estimated capacity), with supporting documents'
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New dwelling(s).
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 250
          description: Non-residential schemes over 250 square metres.
- item: 'Sequential Test: the status of the Local Plan, a flood risk comparison of the sites, and a conclusion
    with evidence of approaches to landowners'
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New dwelling(s).
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 250
          description: Non-residential schemes over 250 square metres.
- item: 'Exception test, where the Sequential Test shows no reasonably available lower-risk sites: sustainability
    benefits outweigh flood risk; safe for its lifetime without increasing flood risk elsewhere'
  level: must
  required-if:
    all:
    - all:
      - site:
          in:
          - flood-risk-zone
          description: In Flood Zone 2 or 3.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: New dwelling(s).
        - condition:
            field: floorspace-non-residential
            operator: '>'
            value: 250
            description: Non-residential schemes over 250 square metres.
    - discretionary
confidence: medium
notes: 'From the council''s list (in effect from 1 April 2020), page ''Supporting information''. The ''Flooding:
  Sequential Test flood risk'' requirement (new dwellings or non-residential schemes over 250 sq m in
  Flood Zones 2 or 3) is recorded here because the list says it forms part of the FRA.'
review-status: unverified
field-status: {}
