reference: sustainable-drainage-strategy
local-authority: BUC
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: minor-development
        value: true
        description: 'Minor development: 1-9 dwellings, under 1,000 sq m of floorspace, or a site under
          1 hectare.'
    - condition:
        field: dwelling-count
        operator: '>='
        value: 3
        description: Minor applications of 3 or more dwellings.
  - site:
      in:
      - surface-water-flood-risk
      description: Affected by medium or high surface water flood risk.
  - condition:
      field: near-watercourse
      value: true
      description: The site contains an ordinary watercourse.
  - site:
      in:
      - groundwater-flood-risk
      description: Affected by medium or high groundwater flood risk.
  - site:
      in:
      - critical-drainage-area
      description: In a critical drainage area.
  - discretionary
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: 'NPPF paragraph 163; Aylesbury Vale: I4 (VALP); Chiltern: CS4 (CDCCS), GC10 (CDCLP); South Bucks:
  CP13 (SBDCCS); Wycombe: DM39 CP12 (WDLP)'
source-text: 'This is required for: all major applications all minor applications of 3 or more dwellings
  applications affected by medium or high surface water flood risk, or contains an ordinary watercourse
  (see below) ... If your proposal is affected by medium or high groundwater flood risk, is located within
  the Burnham Beeches catchment zone* (Chiltern and South Bucks only), is located in a critical drainage
  area, or has been subject of a Section 19 Flood Investigation Area, you will need to submit a SuDS statement.'
must-include:
- item: Details of the SuDS measures proposed (e.g. rainwater recycling, infiltration devices, filter
    strips and drains, porous pavements, basins and ponds)
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. The SuDS
  statement; it can form part of the Flood Risk Assessment. The Burnham Beeches catchment zone (Chiltern
  and South Bucks) and Section 19 Flood Investigation Areas have no map field yet, so they are shown as
  the council's discretion.
review-status: unverified
field-status: {}
