reference: environmental-statement
local-authority: BUC
required-if:
  condition:
    field: eia-development
    value: true
    description: EIA development (Schedule 1, or Schedule 2 likely to have significant environmental effects).
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: It is required for all proposals defined under Schedule 1 of the 2017 regulations on legislation.gov.uk.
  ... There may be other proposals where you will need to submit this (see below).
must-include:
- item: An Environmental Statement as defined in parts 1 and 2 of Schedule 4 of the Regulations
  level: must
- item: Description of the development, including the site, design and size
  level: must
- item: Measures to avoid, reduce and if possible remedy significant adverse effects
  level: must
- item: Data to identify and assess the main effects on the environment
  level: must
- item: The main alternatives studied and the reasons for the choice
  level: must
- item: A non-technical summary
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. Proposals
  in sensitive areas and development likely to have significant effects on the environment are also likely
  to need EIA.
review-status: unverified
field-status: {}
