reference: elevation-proposed
local-authority: BUC
required-if:
  always: true
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/plans-and-diagrams-to-submit-with-your-planning-application/
policy: NPPF paragraphs 124 to 132; Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended); Town and Country Planning (Control of Advertisements) (England) Regulations
  2007
source-text: It is needed for all applications. ... This is needed for all advertisement consent.
must-include:
- item: At a scale of 1:100 or 1:50 with a scale bar
  level: must
- item: A unique reference number
  level: must
- item: All sides of the proposal
  level: must
- item: The proposed works shown in relation to the existing, using colour or hatching
  level: must
- item: Materials and style, where possible
  level: should
- item: Bin and cycle storage, for flats and non-residential uses (such as offices)
  level: must
  required-if: discretionary
  source-text: show bin and cycle storage (for flats and non-residential, such as offices)
- item: Relative heights or levels in the street context, where relevant (such as hilly areas)
  level: must
  required-if: discretionary
- item: 'Advertisements: the advertisement size, siting, materials and colours, and how they will be fixed'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: height above the ground and extent of projection'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: method and colour(s) of any illumination or luminance'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: a cross-section through all signs, including any supporting structures or walls'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: dimensions matching the answers in the application form'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Plans and diagrams'. The advertisement
  drawings (needed for all advertisement consent applications) are recorded here as proposed elevations.
review-status: unverified
