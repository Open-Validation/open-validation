reference: air-quality-assessment
local-authority: BUC
required-if:
  any:
  - all:
    - site:
        in:
        - air-quality-management-area
        description: In an Air Quality Management Area.
    - application-type:
        in:
        - full
        - outline
        - mineral-app
        - mineral-extraction
        - waste-dev
  - all:
    - ref: major-development
    - site:
        in:
        - air-quality-screening-area
        description: 'In a settlement with an AQMA: Aylesbury, Chesham, Iver Parish, High Wycombe or Marlow.'
  - all:
    - ref: major-development
    - condition:
        field: eia-development
        value: true
        description: The major application requires an EIA.
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - waste-dev
  - discretionary
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: 'NPPF paragraph 181; Aylesbury Vale: NE5 (VALP); Chiltern: CS4 CS25 CS26 (CDCCS); Wycombe: CP12
  DM20 DM33 (WDLP), DM2 (DSA); Wycombe Air Quality SPD'
source-text: 'This is required for: all proposals in an Air Quality Management Area (AQMA) (excluding
  householders) major applications in settlements with an AQMA (see below) major applications that require
  an EIA all minerals and waste applications There may be other proposals where you will need to submit
  this (see below).'
must-include:
- item: Baseline details
  level: must
- item: The assessment methodology
  level: must
- item: The construction phase impact
  level: must
- item: The development impact
  level: must
- item: The proposed mitigation measures
  level: must
confidence: medium
notes: 'From the council''s list (in effect from 1 April 2020), page ''Supporting information''. Settlements
  with an AQMA: Aylesbury, Chesham, Iver Parish, High Wycombe and Marlow. The council''s discretion covers
  other proposals, for example HGV routing through AQMAs or industrial processes that release direct emissions
  into the air.'
review-status: unverified
field-status: {}
