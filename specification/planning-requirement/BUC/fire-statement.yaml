reference: fire-statement
local-authority: BUC
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: Town and Country Planning (Development Management Procedure and Section 62A Applications) (England)
  (Amendment) Order 2021
source-text: 'This is required for all proposals or developments (unless an exemption applies) involving:
  provision of one or more relevant buildings (see below) development of an existing relevant building
  development within the curtilage of a relevant building'
must-include:
- item: On the relevant GOV.UK form or template
  level: must
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How local fire safety policies have been taken into account
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. A relevant
  building contains 2 or more dwellings or educational accommodation and is 18m or more in height or 7
  or more storeys.
review-status: unverified
field-status: {}
