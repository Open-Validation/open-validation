reference: site-restoration
local-authority: BUC
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - mineral-extraction
      - waste-dev
  - condition:
      field: ground-disturbance
      value: true
      description: Minerals and waste development that disturbs the ground.
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: 'NPPF paragraphs 204 and 209; NPPW paragraph 207; Buckinghamshire Minerals and Waste Local Plan:
  Policies 16 and 25'
source-text: This is needed for applications for minerals and waste development that involve the disturbance
  of the ground.
must-include:
- item: The approach to restoration, with phasing and direction of working and progressive restoration
  level: must
- item: 'For each working phase: site layout plans showing enabling infrastructure, temporary and permanent
    mitigation, and voids, stockpiles and waste materials, with cross sections'
  level: must
- item: Restoration materials and soils, the final landform, and existing and proposed contours with cross
    sections
  level: must
- item: A landscape scheme showing the proposed land use, access, routes and rights of way, and landscape
    features
  level: must
- item: A statement of existing and proposed Agricultural Land Classification, where agricultural land
    is affected
  level: must
  required-if: discretionary
- item: Aftercare for at least 5 years, in management and maintenance specifications and schedules
  level: must
confidence: medium
notes: 'From the council''s list (in effect from 1 April 2020), page ''Supporting information''. ''Mineral
  and waste: restoration strategy and aftercare''.'
review-status: unverified
field-status: {}
