reference: affordable-housing-statement
local-authority: BUC
required-if:
  any:
  - all:
    - condition:
        field: former-district
        value: aylesbury-vale
        description: Site in the Aylesbury Vale local area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 11
          description: 11 or more dwellings.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.3
          description: A site of 0.3 hectares or more.
  - all:
    - any:
      - condition:
          field: former-district
          value: chiltern
          description: Site in the Chiltern local area.
      - condition:
          field: former-district
          value: south-bucks
          description: Site in the South Bucks local area.
    - any:
      - all:
        - site:
            in:
            - area-of-outstanding-natural-beauty
            description: In the Chilterns AONB (National Landscape).
        - condition:
            field: dwelling-count
            operator: '>='
            value: 5
            description: 5 or more self-contained homes in the AONB.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more self-contained homes.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: A site of 0.5 hectares or more.
  - all:
    - condition:
        field: former-district
        value: wycombe
        description: Site in the Wycombe local area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings (gross).
      - condition:
          field: housing-floorspace
          operator: '>'
          value: 1000
          description: More than 1,000 square metres of residential floorspace.
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: 'NPPF paragraph 83; Aylesbury Vale: H1 H2 (VALP); Chiltern: CS8 (CDCCS); South Bucks: CP3 (SBDCCS);
  Wycombe: DM24 (WDLP)'
source-text: 'This is required for applications meeting affordable housing thresholds (see below). ...
  Aylesbury Vale area: developments of 11 or more dwellings, OR site area of 0.3 hectares or more Chiltern
  area: developments of 5 or more self-contained homes in the AONB and (or) 10 or more self-contained
  homes and (or) site area is 0.5 hectares or more South Bucks area: developments of 5 or more self-contained
  homes in the AONB and (or) 10 or more self-contained homes and (or) site area is 0.5 hectares or more
  Wycombe area: developments of 10 or more dwellings (gross) or more than 1,000 square meters of residential
  floorspace'
must-include:
- item: On the council's affordable housing form template
  level: should
- item: Whether affordable homes or financial contributions will be delivered
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. The affordable
  housing form. Thresholds differ by local (former district) area.
review-status: unverified
field-status: {}
