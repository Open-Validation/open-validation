reference: affordable-housing-statement
local-authority: BUC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: Aylesbury Vale area - 11 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.3
      description: Aylesbury Vale area - a site of 0.3 hectares or more.
  - all:
    - site:
        in:
        - area-of-outstanding-natural-beauty
        description: Chiltern/South Bucks area - in the Chilterns AONB.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: Chiltern/South Bucks area - 5 or more homes in the AONB.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Chiltern/South Bucks and Wycombe areas - 10 or more homes.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Chiltern/South Bucks area - a site of 0.5 hectares or more.
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 1000
      description: Wycombe area - more than 1,000 square metres.
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
source-text: required for applications meeting affordable housing thresholds
confidence: low
notes: 'Audit (wrong_trigger): the workbook quoted the rationale. The thresholds depend on the former
  district area (AV 11+ dwellings or 0.3ha+; Chiltern/South Bucks 5+ homes in the AONB, 10+ homes or 0.5ha+;
  Wycombe 10+ dwellings or more than 1,000 sq m). The rule lists every area''s threshold, so check which
  area the site is in. Applies to outline schemes too.'
review-status: unverified
field-status: {}
