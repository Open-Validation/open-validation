reference: water-impact-assessment
local-authority: BUC
required-if:
  any:
  - site:
      in:
      - source-protection-zone
      description: In a Source Protection Zone or Drinking Water Safeguard Zone (surface water and groundwater).
  - all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - waste-dev
    - condition:
        field: dewatering-or-abstraction
        value: true
        description: Minerals and waste development where dewatering is proposed.
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: 'NPPF paragraph 170; Wycombe: DM38 (WDLP); Buckinghamshire Minerals and Waste Local Plan: Policies
  16; Landfill (England and Wales) Regulations 2002 (as amended)'
source-text: It is needed for all proposals located within a Source Protection Zone and Drinking Water
  Safeguard Zone (surface water and groundwater). ... This is needed for applications for minerals and
  waste development where dewatering is proposed.
must-include:
- item: 'Water environment assessment: the existing water environment at and near the site, how the site
    will be served by infrastructure, the risk to the water environment, mitigation, and ongoing monitoring'
  level: must
  required-if:
    site:
      in:
      - source-protection-zone
      description: In a Source Protection Zone or Drinking Water Safeguard Zone.
- item: 'Hydrological and hydrogeological assessment: topography, drainage, geology and borehole information;
    the natural water table; effects on third parties, water supplies and wetland SSSIs; dewatering and
    water disposal methods; pollution control; drainage and flood control; monitoring'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-app
        - mineral-extraction
        - waste-dev
    - condition:
        field: dewatering-or-abstraction
        value: true
        description: Dewatering is proposed.
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. Covers the
  'Water environment assessment' (which can form part of the Utilities or SuDS statement) and the minerals
  and waste 'Hydrological and hydrogeological assessment'.
review-status: unverified
field-status: {}
