source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/supporting-information/
policy: 'NPPF paragraph 111; Aylesbury Vale: T4, T5 (VALP); Chiltern: CS6 CS7 (CDCCS), TR2 TR3 (CDCLP);
  South Bucks: CP7 (SBDCCS); Wycombe: DM2 (DSA); Buckinghamshire Highways Development Management Guidance'
source-text: It is required for applications that meet Buckinghamshire Highways DM's guideline thresholds.
  There may be other proposals where you will need to submit this (see below).
must-include:
- item: A description of the development, the nature of the development and forecast trips for all modes
  level: must
- item: Existing travel habits and, where possible, a baseline survey of residents, staff or visitors
  level: must
- item: A named travel plan coordinator
  level: must
- item: Realistic objectives and a clear action plan of measures to encourage sustainable transport
  level: must
- item: A S.M.A.R.T target to reduce single occupancy car use by at least 10% within the first 5 years
    of occupation
  level: must
- item: A commitment to monitor and review the Travel Plan
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 'Supporting information'. The travel
  plan thresholds match the Transport Assessment thresholds (the table's 'C1 Hotels 100 homes or more'
  is read as 100 bedrooms). Other proposals are shown as the council's discretion.
