reference: roof-plan-existing
local-authority: BUC
required-if:
  condition:
    field: roof-alteration
    value: true
    description: The proposal alters a roof or involves new works to a roof.
source-url: https://www.buckinghamshire.gov.uk/planning-building-and-environment/applications-permission-and-advice/how-to-prepare-a-valid-planning-application/plans-and-diagrams-to-submit-with-your-planning-application/
policy: NPPF paragraphs 124 to 132; Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended)
source-text: It is needed for proposals that involve alterations or new works to a roof.
must-include:
- item: At a scale of 1:100 or 1:50 with a scale bar
  level: must
- item: A unique reference number
  level: must
- item: Relevant details such as roofing materials, location of materials, plant, flues and chimneys
  level: must
