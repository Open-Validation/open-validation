reference: elevation-existing
local-authority: GRA
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application involves building works (including changes of use).
  - application-type:
      in:
      - advertising
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: Required for all applications that involve building works (including changes of use)
must-include:
- item: At an appropriate scale, usually 1:50 or 1:100 for householder and minor applications
  level: must
- item: All elevations affected, including blank elevations (annotated where no external changes are proposed)
  level: must
- item: The full elevation of the building (for flats in a larger converted property, the entire elevation
    of the building)
  level: must
- item: The relationship to neighbouring buildings, with the positions of windows and doors on all buildings
  level: must
- item: 'For advertisement consent: the existing elevation at no less than 1:100, or a clear photograph(s)
    of the existing building'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: This applies to all Applications for Express Consent.
confidence: medium
notes: 'From the council''s list (in effect from 1 April 2020), page 6-7. Advertisement consent drawings:
  page 7.'
review-status: unverified
field-status: {}
