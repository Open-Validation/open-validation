reference: town-centre-impact-assessment
local-authority: GRA
required-if:
  any:
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Leisure, entertainment or more intensive sports and recreation outside Gravesend
          Town Centre, or retail outside the Gravesend Primary Shopping Area.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2499
        description: Proposals which exceed 2,499 sq m floorspace.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Any of the above uses outside the centre.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Proposing less than 2,500 sq m, not in accordance with the Local Plan.
  - all:
    - condition:
        field: loss-of-use
        value: true
        description: A change of use from retail to other non-town centre uses within the town centre.
    - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policies CS07, CS08 and CS09
source-text: 'Proposals which exceed 2,499 sq. m. floorspace, involving either: Leisure, entertainment
  facilities, more intensive sports, and recreation outside of Gravesend Town Centre, Retail uses outside
  of the Gravesend Primary Shopping Area Any of the above uses, if proposing less than 2,500 sq. m. which
  are not in accordance with the Local Plan.'
must-include:
- item: The impact on existing, committed and planned public and private investment in Gravesham town
    centre or centres in the catchment area
  level: must
- item: The impact on Gravesham Town Centre vitality and viability, including local consumer choice and
    trade in the town centre and the wider retail catchment
  level: must
- item: A sequential test considering the availability, suitability and viability of all sequentially
    preferable sites
  level: must
- item: 'For a change of use from retail to other non-town centre uses within the town centre: evidence
    that the retail use is no longer required, including marketing of the premises for up to a year'
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: A change of use from retail to other non-town centre uses within the town centre.
  source-text: Where applications propose a change of use from retail to other non-town centre uses within
    the town centre, an assessment in support of the proposal will need to be submitted to demonstrate
    that the retail use is no longer required. This should include details of marketing of the premises
    for up to a year.
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 17. Listed as 'Retail/Leisure Impact
  Assessment and the Sequential Test'. 'Not in accordance with the Local Plan' is shown as a departure
  from the development plan. The retail loss assessment inside the town centre is shown with the council's
  discretion, as the list does not say it is the same document.
review-status: unverified
field-status: {}
