reference: transport-assessment
local-authority: GRA
required-if: discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: 'Gravesham Local Plan Core Strategy Policy CS11; Kent County Council SPG 4: Vehicle Parking Standards'
source-text: For applications for developments that generate significant amounts of transport movement
  or significant transport implications. (Refer to Kent County Council SPG 4, page 9 for detailed Transport
  Assessment thresholds) (Thresholds for Transport Statements shall be set at half the Transport Assessment
  threshold)
must-include:
- item: Baseline and future years traffic assessment
  level: must
- item: Multi-modal trip analysis
  level: must
- item: Highway safety and capacity analysis
  level: must
- item: Parking assessment
  level: must
- item: Walking, cycling and public transport assessment
  level: must
- item: Measures to minimise the impact of the development
  level: must
- item: Road safety audit
  level: must
- item: Travel Plan
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 19-20. The thresholds are in Kent County
  Council's SPG 4, not in the list, so it is shown as discretionary. For smaller schemes generating relatively
  few trips a Transport Statement is enough, without analysis of the wider network.
review-status: unverified
field-status: {}
