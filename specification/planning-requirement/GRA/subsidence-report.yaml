reference: subsidence-report
local-authority: GRA
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: If the reason for the works is based on alleged damage to the property by subsidence a report
  by an engineer or surveyor, to include a description of damage, vegetation, monitoring data, soil, roots,
  and repair proposals as well as a report from an Arboriculturist to support the tree work proposals
  will be required
must-include:
- item: 'A report by an engineer or surveyor: description of damage, vegetation, monitoring data, soil,
    roots and repair proposals'
  level: must
- item: A report from an arboriculturist supporting the tree work proposals
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 21. Needed where works to a protected
  tree are justified by subsidence damage; there is no field for the reason for the works, so it is shown
  as discretionary.
review-status: unverified
field-status: {}
