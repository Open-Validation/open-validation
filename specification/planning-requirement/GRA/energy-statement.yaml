reference: energy-statement
local-authority: GRA
required-if:
  any:
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Commercial development involving 1000 sq m or more.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Residential sites of 0.5 ha.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 dwellings upwards.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Conversion of existing buildings.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: To residential use.
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policy CS18
source-text: For applications of Commercial development involving 1000m2 or more or Residential sites
  of 0.5ha or 10 dwellings upwards
must-include:
- item: 'For new build development: how the development will, pre and post construction, address energy
    and water consumption, reduce transport impacts and use sustainably sourced materials'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New build development.
  source-text: 'Applications for all new build development (residential and non-residential development):
    evidence demonstrating how the proposed development will, both pre & post construction address energy
    and water consumption, reduce transport impacts and use of sustainably sourced materials'
- item: 'For new build development: how the building will reduce the CO2 emissions of the entire scheme'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New build development.
- item: 'For conversions of existing buildings to residential use: energy efficiency measures and how
    they will be delivered'
  level: must
  required-if:
    all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Conversion of existing buildings.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: To residential use.
  source-text: 'For all applications proposing the conversion of existing buildings to residential use:
    A statement demonstrating energy efficiency measures and details of how these will be delivered as
    far as practically possible within the scale of the development proposed'
- item: 'For large-scale extensions and conversions of non-residential buildings: energy efficiency measures,
    how they will be delivered and the BREEAM level that would be achieved'
  level: must
  required-if: discretionary
  source-text: 'For all applications proposing the large-scale extension of existing buildings and applications
    for the conversion of non-residential buildings: A statement demonstrating energy efficiency measures
    and details of how these will be delivered as far as practically possible within the scale of the
    development proposed and the BREEAM level that would be achieved'
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 10-11. Listed as 'Energy / Sustainability
  Assessment' (it also covers water, transport and materials). The list adds paragraphs for 'all' conversions
  to residential use and for large-scale extensions and conversions of non-residential buildings, which
  may apply below the headline thresholds; 'large-scale' has no threshold, so those cases are shown as
  discretionary. Waste and recycling (same section) is in waste-management-plan.
review-status: unverified
field-status: {}
