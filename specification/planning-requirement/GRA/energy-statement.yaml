reference: energy-statement
local-authority: GRA
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New-build commercial floorspace.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1,000 square metres or more of commercial floorspace.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A residential site of 0.5 hectares or more.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A conversion.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The conversion creates residential units.
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
confidence: medium
notes: 'From the audit (missing_requirement): Energy / Sustainability Assessment for new-build commercial
  schemes of 1,000 sq m or more, residential sites of 0.5ha or more or 10+ dwellings, conversions to residential,
  and large non-residential extensions or conversions (no size given, so shown as officer discretion).
  Its waste and recycling provision part applies to all applications.'
review-status: unverified
field-status: {}
