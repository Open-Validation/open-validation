reference: section-proposed
local-authority: GRA
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Proposals for new and altered buildings.
  - condition:
      field: change-in-ground-levels
      value: true
      description: Changes in ground levels, or sloping sites.
  - discretionary
  - application-type:
      in:
      - s73
      - non-material-amendment
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: Proposals for new and altered buildings and/or changes in ground levels, or on sloping sites
  or involving roof level accommodation.
must-include:
- item: At 1:50 or 1:100
  level: must
- item: Cross sections through the site and buildings, with existing site levels and finished floor levels
    related to a fixed datum point off-site
  level: must
- item: The proposals in relation to neighbouring buildings
  level: must
- item: Sections through a building include all floors, including the basement, loft / roof space and
    any terraces
  level: must
- item: 'For major applications, and shopfronts in Conservation Areas: typical window joinery / sections,
    entrances and balconies at 1:10 or 1:5'
  level: should
  required-if:
    any:
    - ref: major-development
    - all:
      - condition:
          field: shopfront
          value: true
          description: A shopfront.
      - site:
          in:
          - conservation-area
          description: Within a Conservation Area.
  source-text: For major applications and shopfronts within Conservation Areas, plans at 1:10 or 1:5 should
    be provided to show typical window joinery / sections, entrances, and balconies.
- item: 'For amendment applications: a full update or revision of the originally approved plans where
    changes occur, annotated or marked up to highlight the proposed changes'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: A full update or revision of the originally approved plans where changes occur, including
    proposed plans, elevations, and sections, being annotated or marked up to highlight the proposed changes
- item: 'For amendment applications: copies of the originally approved plans for information'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: copies of the originally approved plans / elevations / sections for information
- item: 'For amendment applications: all information and clarifications originally included on the approved
    plans'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: Plans must include all information and clarifications originally included on the approved
    plans
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 7. For householder development and
  works to flats the levels may be evident from floor plans and elevations, but sloping sites need sections;
  this is shown as discretionary. For section 73 and non-material amendments, revised plans are needed
  only where the approved plans change (page 7).
review-status: unverified
field-status: {}
