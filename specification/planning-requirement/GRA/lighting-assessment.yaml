reference: lighting-assessment
local-authority: GRA
required-if:
  all:
  - any:
    - condition:
        field: external-lighting
        value: true
        description: External lighting is provided or made necessary by the development.
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting is provided or made necessary by the development.
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policy CS19
source-text: 'Where external lighting or floodlighting is provided or made necessary by development in:
  a publicly accessible location the vicinity of residential property, listed buildings or conservation
  areas the vicinity of sites of importance for wildlife and nature conservation or the open countryside;
  and sites adjacent to a public highway.'
must-include:
- item: A layout plan with the number, type, location, size, column heights, intensity and beam orientation
    of lights, and a schedule of the equipment
  level: must
- item: 'For outdoor floodlighting: a lux contour plan, with details of any directional hoods and other
    mitigation equipment'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: Outdoor floodlighting is proposed.
- item: The proposed hours of operation of the lighting
  level: must
- item: The potential impact on wildlife
  level: must
- item: Any potential impact on the visibility and appreciation of the night sky
  level: must
- item: The impact on residential properties or other sensitive receptors, with reference to the Institute
    of Lighting Professionals' Guidance Notes for the Reduction of Obtrusive Light
  level: must
- item: Prepared by a lighting specialist
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 13-14. Whether a site is 'in the vicinity
  of' homes, heritage assets, wildlife sites or open countryside, or publicly accessible, is a judgement,
  so the location part is shown as discretionary.
review-status: unverified
field-status: {}
