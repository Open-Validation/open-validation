reference: telecommunications-report
local-authority: GRA
required-if:
  condition:
    field: telecommunications-development
    value: true
    description: Telecommunications applications.
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policy CS10
source-text: This applies to all Telecommunications applications.
must-include:
- item: The area of search
  level: must
- item: A technical justification for the proposed development
  level: must
- item: An appraisal of suitable sites, including the possibility of erecting antennae on existing buildings,
    masts or structures
  level: must
- item: The outcome of consultations with interested organisations, such as nearby schools or, within
    a statutory zone around an aerodrome or technical site, the operator
  level: must
- item: A signed declaration that the equipment and installation is designed in full accordance with the
    International Commission on Non-Ionising Radiation Protection requirements
  level: must
- item: All information needed to meet the criteria of the Code of Best Practice on Mobile Phone Network
    Development in England (July 2013)
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 19. Listed as 'Telecommunications Development
  Statement'.
review-status: unverified
field-status: {}
