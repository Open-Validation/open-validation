reference: arboriculturist-report
local-authority: GRA
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: The development affects trees, on site or on adjoining / neighbouring land.
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: For applications that propose development affecting trees, including on site or on adjoining
  / neighbouring land, or works to trees
must-include:
- item: The species, position and canopy spread of trees, accurately shown on a site plan
  level: must
- item: Trees to be felled (with replanting proposals or the reasons for not replanting), retained or
    affected by the development
  level: must
- item: Trees within adjacent properties that may be affected
  level: must
- item: Measures to protect retained trees during construction
  level: should
  required-if: discretionary
  source-text: A statement in relation to the measures to be adopted during construction works to protect
    those trees shown to be retained on the submitted drawings may also be necessary.
- item: Prepared by a qualified arboriculturist, following BS5837:2012
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 20-21. Listed as 'Tree Survey & Report'.
  For applications for works to trees, see sketch-plan, condition-of-trees, structural-damage and subsidence-report.
review-status: unverified
field-status: {}
