reference: site-plan
local-authority: GRA
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - demolition-con-area
      - ldc
      - prior-approval
  - condition:
      field: shopfront
      value: false
      description: Not for shopfronts.
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The following applies to all applications, except for window replacements, shopfronts, and
  advertisements.
must-include:
- item: A block plan of the existing site at 1:100, 1:200 or 1:500, with a scale bar on the drawing
  level: must
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: All the buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: The position of all trees (existing and proposed) on the site, and those on adjacent land that
    could influence or be affected by the development
  level: must
- item: The extent and type of any hard surfacing (existing and proposed)
  level: must
- item: Boundary treatment, including walls or fencing, where this is proposed
  level: must
- item: 'For outline applications: the use or uses proposed and any distinct development zones within
    the site'
  level: should
  required-if:
    application-type:
      in:
      - outline
  source-text: The use or uses proposed for the development and any distinct development zones within
    the site
- item: 'For outline applications: the amount of development proposed for each use'
  level: should
  required-if:
    application-type:
      in:
      - outline
  source-text: The amount of development proposed for each use
- item: 'For outline applications: an indicative layout with the approximate location of buildings, routes
    and open spaces'
  level: should
  required-if:
    application-type:
      in:
      - outline
  source-text: An indicative layout with the approximate location of buildings, routes and open spaces
    and, where appropriate, separate development zones proposed within the site boundary
- item: 'For outline applications: an indication of the upper and lower limits for height, width and length
    of each building'
  level: should
  required-if:
    application-type:
      in:
      - outline
  source-text: An indication of the upper and lower limits for height, width, and length of each building
    within the site boundary
- item: 'For outline applications: the area or areas where access points to the development will be situated,
    even if access is reserved'
  level: must
  required-if:
    application-type:
      in:
      - outline
  source-text: an application for outline planning permission must also indicate the area or areas where
    access points to the development will be situated, even if access has been reserved.
- item: 'For outline applications proposing ranges of built form size: parameter plans illustrating the
    range clearly'
  level: should
  required-if:
    application-type:
      in:
      - outline
  source-text: Where development within identified ranges of built form size is proposed, parameter plans
    should be provided to illustrate that range clearly
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 4-5. The list's 'block plan'. Window
  replacements are also excluded but have no field. The outline items (use, amount, layout, scale, access,
  parameter plans) are listed as the minimum information for outline applications without naming a drawing;
  they are shown on the block plan.
review-status: unverified
field-status: {}
