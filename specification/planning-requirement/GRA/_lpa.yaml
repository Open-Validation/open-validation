local-authority: GRA
name: Gravesham Borough Council
region: South East
type: District
review-status: unverified
validation-list:
  url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
  date: 2020-04-01
  date-basis: 'page 3: ''The Local Requirements within this List come into effect on the 1 April 2020''
    (consulted 25 November 2019 to 3 January 2020); cover: reformatted for accessibility, ''The content
    is still as per the 2020 published validation list'' (PDF created 19 February 2024). The council''s
    ''Validation checklist'' and ''Apply for planning permission'' pages link only this list (checked
    2026-11-05)'
  status: outdated
submission-standards:
- item: All drawings (excluding supplementary renders or sketches) include a title and drawing number,
    with the revision number as necessary
  level: must
- item: All drawings state the print (paper) size
  level: must
- item: All drawings at a recognised scale (1:50, 1:100, 1:200, 1:500, 1:1250 or 1:2500), with a scale
    bar and the scale at that print size identified (e.g. 1:50 at A3)
  level: must
- item: The wording "do not scale" not used, unless in the form 'do not scale, except for planning purposes'
  level: should
- item: Drawings show the proposed development in relation to the site boundaries and other existing buildings
    on the site
  level: must
- item: Neighbouring properties and neighbouring windows always shown on plans, elevations and sections
    (existing and proposed)
  level: must
- item: Existing and proposed ground levels always shown for extensions or new buildings
  level: must
- item: Where demolition is proposed, its extent clearly hatched and shown on a separate set of drawings
  level: should
- item: For major applications, existing and proposed plans on separate drawings (unless amendments are
    proposed); householder and minor applications may show both on the same plans
  level: must
- item: Documents submitted electronically as PDFs, with embedded documents of one size only (e.g. A4
    or A3)
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the council''s only and current local list. Its date is wrong: it comes from
    PDF metadata, while the text says this is the 2020 list in force from 1 April 2020. The extraction
    misses many local requirements (Air Quality, Flood Risk Assessment, Contamination, Noise, Energy,
    Planning Statement and others) and the drawing requirements for adverts, amendments and LBC, and many
    of its triggers are garbled fragments or attached to the wrong application type. Fixed 2026-11-05:
    every file was rewritten from the council''s latest list.'
