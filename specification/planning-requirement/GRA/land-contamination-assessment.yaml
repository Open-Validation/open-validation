reference: land-contamination-assessment
local-authority: GRA
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected (e.g. previous commercial, industrial or similar
        potentially contaminative uses).
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use is sensitive (including new build or change of use to residential,
        healthcare, leisure or educational use).
  - site:
      in:
      - near-landfill-site
      description: Within 250 metres of a former landfill site.
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policies CS02 and CS19
source-text: 'This applies to applications Where: Contamination is known or suspected (e.g., where the
  site has previously included commercial, industrial, or similar potentially contaminative uses) or The
  proposed use is sensitive (including new build or change of use to residential, healthcare, leisure,
  or educational use) or If the site is within 250 metres of a former landfill site or other potentially
  contaminated land'
must-include:
- item: In all cases, a preliminary risk assessment (PRA) as a Phase 1 Desk Top Study
  level: must
- item: A description of the site and the scope of the site inspection
  level: must
- item: A full review of historical land use and the potential for contamination, contaminant type and
    characteristics
  level: must
- item: Details of consultation with the relevant regulatory authorities
  level: must
- item: An outline Conceptual Site Model (CSM) identifying potential risks
  level: must
- item: If appropriate, a proposed site investigation strategy based on the desk study
  level: must
  required-if: discretionary
- item: 'On highly contaminated sites: a Phase 2 intrusive survey and environmental risk assessment, reporting
    all site investigation, sampling and results, risks to receptors and a proposed remediation strategy
    with timetable'
  level: must
  required-if: discretionary
  source-text: Phase 2 – Intrusive survey on highly contaminated sites, an environmental risk assessment
    to assess the potential for the presence of contamination, associated risks and potential of site
    to be designated as contaminated land.
- item: Undertaken by a competent and qualified person
  level: must
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 12-13. 'Within 250 metres of other
  potentially contaminated land' is covered by the contaminated-land designation. Which sites are 'highly
  contaminated' is a judgement.
review-status: unverified
field-status: {}
