reference: elevation-proposed
local-authority: GRA
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application involves building works (including changes of use).
  - application-type:
      in:
      - advertising
  - application-type:
      in:
      - s73
      - non-material-amendment
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: Required for all applications that involve building works (including changes of use)
must-include:
- item: At an appropriate scale, usually 1:50 or 1:100 for householder and minor applications
  level: must
- item: All elevations affected, including blank elevations (annotated where no external changes are proposed)
  level: must
- item: The full elevation of the building (for flats in a larger converted property, the entire elevation
    of the building)
  level: must
- item: The relationship to neighbouring buildings, with the positions of windows and doors on all buildings
  level: must
- item: 'For advertisement consent: elevations of all proposed adverts on the building, pole or hoarding'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: This applies to all Applications for Express Consent.
- item: 'For advertisement consent: a drawing of each advert at 1:20, noting all colours and materials'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For advertisement consent: sections of all proposed adverts at 1:20, showing the building and
    how the signage would be affixed'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For advertisement consent: details of any illumination, including internal illumination, and
    whether it would be static or moving / revolving'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For advertisement consent: the height of lettering'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For amendment applications: a full update or revision of the originally approved plans where
    changes occur, annotated or marked up to highlight the proposed changes'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: A full update or revision of the originally approved plans where changes occur, including
    proposed plans, elevations, and sections, being annotated or marked up to highlight the proposed changes
- item: 'For amendment applications: copies of the originally approved plans for information'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: copies of the originally approved plans / elevations / sections for information
- item: 'For amendment applications: all information and clarifications originally included on the approved
    plans'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: Plans must include all information and clarifications originally included on the approved
    plans
confidence: medium
notes: 'From the council''s list (in effect from 1 April 2020), page 6-7. Advertisement consent drawings:
  page 7. For section 73 and non-material amendments, revised plans are needed only where the approved
  plans change (page 7).'
review-status: unverified
field-status: {}
