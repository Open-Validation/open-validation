reference: noise-assessment
local-authority: GRA
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Potentially noise generating development (e.g. industrial and commercial uses, pubs
        and clubs) in the vicinity of existing noise sensitive uses, or of areas of wildlife protection
        and tranquil areas.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive uses (e.g. residential, schools and hospitals) proposed in the vicinity
        of existing noise generating uses.
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policy CS19
source-text: 'This applies for applications for all development involving: potentially noise generating
  developments e.g., industrial, and commercial uses, pubs and clubs, proposed in the vicinity of existing
  noise sensitive uses e.g., residential, schools and hospitals noise sensitive uses proposed in the vicinity
  of existing noise generating uses mixed use applications comprising both noise generating and noise
  sensitive uses noise generating uses proposed in the vicinity of areas of wildlife protection and tranquil
  areas.'
must-include:
- item: Existing background noise / vibration levels, with monitoring sufficient to account for worst-case
    scenarios
  level: must
- item: Predicted noise / vibration levels using accepted acoustic calculations / modelling, and the impact
    assessed against relevant standards / guidance
  level: must
- item: How the development will be designed, located and controlled to mitigate impacts (the 'Agent of
    Change' principle), aiming to achieve at least the target values in relevant British Standards and
    guidance
  level: must
- item: Regard to any air quality mitigation scheme / requirements, so that both work together
  level: must
- item: 'Where commercial and residential units are above or below each other: the level of sound insulation
    provided by the separating construction'
  level: must
  source-text: Where commercial and residential are proposed to be developed above or below the other,
    include an assessment of the level of sound insulation provided by the construction that separates
    the commercial and residential unit(s).
- item: Carried out by a suitably qualified acoustic consultant
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 15. Listed as 'Noise and Vibration
  Impact Assessment'. Mixed-use schemes with both kinds of use are caught by either condition.
review-status: unverified
field-status: {}
