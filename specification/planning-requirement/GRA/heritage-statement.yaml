reference: heritage-statement
local-authority: GRA
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      description: Development with the potential to impact designated heritage assets (listed buildings,
        conservation areas, scheduled monuments, historic parks and gardens) and their settings.
  - site:
      in:
      - locally-listed-building
      description: Development with the potential to impact non-designated heritage assets.
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policies CS19 and CS20
source-text: Development which has the potential to impact designated and non – designated heritage assets
  and their settings.
must-include:
- item: A description of the significance of the asset and the contribution of its setting to that significance
  level: must
- item: A schedule of, and justification for, the proposed works
  level: must
- item: An assessment / heritage impact statement of the impact of the proposals on the asset's significance
  level: must
- item: 'For archaeological assets: a desk-based assessment and, where necessary, the results of a field
    evaluation'
  level: must
  required-if:
    site:
      in:
      - archaeological-priority-area
      description: Archaeological assets (including non-scheduled archaeological sites).
  source-text: in the case of archaeological assets, the provision of a desk-based assessment and, where
    necessary, the results of a field evaluation
- item: A structural survey / plan if demolition is proposed or there is a threat to the structural integrity
    of a listed building
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition is proposed.
    - all:
      - site:
          in:
          - listed-building
          description: A listed building.
      - condition:
          field: structural-alteration
          value: true
          description: A threat to its structural integrity.
- item: How harm will be minimised and the significance preserved and enhanced
  level: must
- item: Detail proportionate to the importance of the heritage asset
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 11-12. Non-designated assets 'positively
  identified as having a degree of heritage significance during the pre-application or application process'
  are shown as discretionary. Archaeology is covered here; the list has no separate archaeology requirement.
review-status: unverified
field-status: {}
