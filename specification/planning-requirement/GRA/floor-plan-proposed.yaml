reference: floor-plan-proposed
local-authority: GRA
required-if:
  condition:
    field: building-works
    value: true
    description: The application involves building works (including changes of use).
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: 'Plans and Elevations Page 5 of 23 In addition to the Location Plan and Block Plan as referred
  to above, all drawings (excluding supplementary renders or sketches) must include: a title and drawing
  number (with the relevant revision number as necessary) the print (paper) size. a recognised scale (1:50,
  1:100, 1:200, 1:500, 1:1250 or 1:2500), and including a scale bar and identifying the relevant scale
  at that print size (eg.1:50 at A3 or 1:100 at A3) - the wording “do not scale” should not be use'
must-include:
- item: The proposed building, including each floor and the roof
  level: must
- item: All floors, including floors where no changes are proposed
  level: must
- item: The site boundary and the outline of any existing neighbouring buildings
  level: must
- item: Any existing buildings or walls to be demolished
  level: must
- item: Cycle parking arrangements, annotated with the number of cycle stands
  level: must
- item: Internal storage and proposed refuse storage facilities
  level: must
- item: A full update of the originally approved plans, annotated or marked up to highlight the proposed
    changes
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: A full update or revision of the originally approved plans where changes occur, including
    proposed plans, elevations, and sections, being annotated or marked up to highlight the proposed changes
confidence: low
notes: '''1b. Floor Plans'' applies to "Applications that involve building works (including changes of
  use)" (audit, wrong_app_type). The must-include items come from drawing-standard text the workbook captured
  in fragments; check them against the list. The amendment item is from ''Drawings relating to Amendment
  Applications'' ("applicable to Minor Material (section 73) Amendments or Non-material Amendments (section
  96a)").'
review-status: unverified
