reference: floor-plan-proposed
local-authority: GRA
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application involves building works (including changes of use).
  - application-type:
      in:
      - s73
      - non-material-amendment
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: Applications that involve building works (including changes of use)
must-include:
- item: At an appropriate scale, usually 1:50 or 1:100 for householder and minor applications
  level: must
- item: All floors, including floors where no changes are proposed
  level: must
- item: The site boundary and the outline of any existing neighbouring buildings
  level: must
- item: The proposed building, including each floor and the roof
  level: must
- item: Cycle parking arrangements, annotated with the number of cycle stands
  level: must
- item: Internal storage and proposed refuse storage facilities
  level: must
- item: 'For new residential accommodation, including conversions: room sizes and overall unit sizes (Gross
    Internal Area)'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential accommodation, including conversions.
  source-text: Applications proposing new residential accommodation, including conversions, must state
    room sizes and overall unit sizes on the plans (Gross Internal Area).
- item: 'For amendment applications: a full update or revision of the originally approved plans where
    changes occur, annotated or marked up to highlight the proposed changes'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: A full update or revision of the originally approved plans where changes occur, including
    proposed plans, elevations, and sections, being annotated or marked up to highlight the proposed changes
- item: 'For amendment applications: copies of the originally approved plans for information'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: copies of the originally approved plans / elevations / sections for information
- item: 'For amendment applications: all information and clarifications originally included on the approved
    plans'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: Plans must include all information and clarifications originally included on the approved
    plans
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 6-7. For section 73 and non-material
  amendments, revised plans are needed only where the approved plans change (page 7).
review-status: unverified
field-status: {}
