reference: viability-assessment
local-authority: GRA
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
  - all:
    - ref: major-development
    - discretionary
  - condition:
      field: loss-of-use
      value: true
      description: The loss of a public house (including a change of use).
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition.
    - site:
        in:
        - listed-building
        - locally-listed-building
        - scheduled-monument
        description: Of a designated or undesignated heritage asset.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing proposed on site is less than the policy requirement.
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policies CS10, CS12, CS13 and CS16
source-text: Major residential development Any other major development where the deliverability of the
  scheme as designed needs to be understood Any application proposing the loss of a public house (including
  a change of use) Any application proposing the demolition of or substantial harm to a designated or
  undesignated heritage asset Any application where the viability of the existing use is relevant
must-include:
- item: 'Where applicable: a scheme layout plan, and the Land Registry title with a Statement of Ownership
    giving the purchase price and the conditions of purchase and build'
  level: should
- item: Linked to the required Planning Obligations Statement
  level: must
- item: 'The assumptions, reflecting the standardised inputs in PPG: gross development value, build costs
    (QS schedule), residual values, use classes, unit sizes, affordable housing tenure / values / percentage
    / mix, fees and marketing, developer profit, itemised planning obligations, capital contributions,
    end users, cash flow and programme, yields / rents, development finance, Existing Use Value report
    and lease terms'
  level: must
- item: A solicitor's undertaking to meet the Council's costs of having the statement independently reviewed
  level: must
- item: 'If the applicant considers the viability information should not be disclosed: an additional statement
    titled ''Financial Viability Appraisal – Exceptional Circumstances'' explaining why'
  level: must
  source-text: If you consider that your financial viability information should not be disclosed, then
    you must submit an additional statement titled ‘Financial Viability Appraisal – Exceptional Circumstances’
    detailing why you consider the FVA should not be made publicly available.
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 8, 22-23. Listed as 'Viability Assessment
  / Appraisal'. The affordable housing shortfall trigger is from the Affordable Housing Statement section
  (page 8). Deliverability, 'substantial harm' to a heritage asset and whether the viability of the existing
  use is relevant are judgements, so they are shown as discretionary. A pub is shown as a loss of use.
review-status: unverified
field-status: {}
