reference: planning-statement
local-authority: GRA
required-if:
  ref: major-development
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: This applies to all applications of major development
must-include:
- item: A list of all supporting documents
  level: must
- item: A description of the site and surroundings
  level: must
- item: A description and explanation of the proposed development
  level: must
- item: How it accords with relevant national and local policy, standards, guidelines and supplementary
    guidance
  level: must
- item: Consultations with the local planning authority, the wider community and statutory consultees
    at pre-application stage, and what account has been taken of them
  level: must
- item: Any other materially relevant information not included in other submission documents or in a Design
    and Access Statement
  level: must
- item: 'Where special circumstances form part of the justification: those circumstances clearly set out,
    with relevant, verifiable evidence'
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 16.
review-status: unverified
