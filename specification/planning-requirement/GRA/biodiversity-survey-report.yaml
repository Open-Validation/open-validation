reference: biodiversity-survey-report
local-authority: GRA
required-if:
  any:
  - ref: major-development
  - condition:
      field: protected-species
      value: true
      description: Development likely to have a biodiversity impact on protected species.
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: This applies to applications for Major development and other development likely to have a
  biodiversity impact on statutory and non-statutory designated sites of importance for nature conservation,
  protected species natural or semi-natural vegetation / habitat such as trees & scrub, woodland, hedgerow,
  ponds, and water courses. It is likely to be required on overgrown previously developed sites if they
  have become vegetated.
must-include:
- item: A bat survey, for proposals involving demolition of buildings or alterations or other impacts
    on roofs or lofts
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition of buildings.
    - condition:
        field: roof-alteration
        value: true
        description: Alterations or other impacts on roofs or lofts.
  source-text: Proposals that involve the demolition of buildings or alterations or other impacts on roofs
    or lofts will require a bat survey.
- item: Surveys carried out by a suitably qualified ecologist following best practice, in suitable weather,
    with sufficient effort and at the correct time of year
  level: must
- item: Likely impact, mitigation and opportunities for enhancement, to demonstrate a Biodiversity Net
    Gain
  level: should
- item: A Preliminary Ecological Appraisal (PEA), and an Ecological Impact Assessment (EcIA) if further
    surveys or mitigation are required
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 9. 'Likely to have a biodiversity impact'
  on designated sites or habitats is a judgement, so it is shown as discretionary.
review-status: unverified
field-status: {}
