reference: sustainable-drainage-strategy
local-authority: GRA
required-if:
  any:
  - ref: major-development
  - condition:
      field: footprint-increase
      value: true
      description: Minor developments which will increase site coverage requiring connection to existing
        or new utility services infrastructure.
  - condition:
      field: near-watercourse
      value: true
      description: Any development affecting a water course.
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policies CS12 and CS19
source-text: For applications of major developments & minor developments which will increase site coverage
  requiring connection to existing or new utility services infrastructure, including electricity and gas
  supplies, water supply, foul and surface water disposal systems and any development affecting a water
  course. Drainage assessments will generally be required in all instances where a Floor Risk Assessment
  is also required.
must-include:
- item: The location and spare capacity of existing infrastructure
  level: must
- item: The proposed point of connection to existing systems, including high speed broadband
  level: must
- item: Where an increase in capacity is required and what measures that will involve
  level: must
- item: Where utility diversions will be required
  level: must
- item: That the relevant service and utility providers have been consulted
  level: must
- item: Details of surface water management systems, including sustainable urban drainage systems
  level: must
- item: That service routes avoid, as far as possible, damage to trees and archaeological remains
  level: must
  required-if: discretionary
- item: A drainage strategy reflecting the development proposal (site, area, type of development, general
    arrangement and layout), with all its elements inside the red line boundary
  level: must
- item: 'For non-mains foul drainage: the foul drainage assessment form'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: The development proposes non-mains foul drainage.
  source-text: Use the foul drainage assessment form for development proposes non mains foul drainage
    systems.
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 21. Listed as 'Utilities, Sewage and
  Surface Water Drainage Strategy / Assessment' (one document covering utilities and drainage). Drainage
  assessments are 'generally' needed wherever a Flood Risk Assessment is, shown as discretionary.
review-status: unverified
field-status: {}
