reference: flood-risk-assessment
local-authority: GRA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In flood zone 2 or 3, including minor development and change of use.
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: More than 1 hectare in flood zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: More than 1 hectare in flood zone 1.
  - site:
      in:
      - critical-drainage-area
      description: In an area within flood zone 1 which has critical drainage problems as notified by
        the Environment Agency.
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policy CS18
source-text: 'Applications of Development either: In flood zone 2 or 3 including minor development and
  change of use More than 1 hectare (ha) in flood zone 1 Less than 1 ha in flood zone 1, including a change
  of use in development type to a more vulnerable class (for example from commercial to residential),
  where they could be affected by sources of flooding other than rivers and the sea (for example surface
  water drains, reservoirs) In an area within flood zone 1 which has critical drainage problems as notified
  by the Environment Agency'
must-include:
- item: Undertaken by a suitably qualified specialist
  level: must
- item: The risks of all forms of flooding to and from the development, identified and assessed
  level: must
- item: How these risks will be managed, taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: The design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: must
- item: Safe access to and from the development
  level: must
- item: An Exceptions Test, for developments which fail the Sequential Test
  level: must
  source-text: Developments which fail the Sequential Test will need to undertake an Exceptions Test to
    provide a safe environment.
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 11. Sites under 1 ha in flood zone
  1 that 'could be affected' by other sources of flooding are shown as discretionary.
review-status: unverified
field-status: {}
