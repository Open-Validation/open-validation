reference: design-and-access-statement
local-authority: GRA
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Within a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Erection of one or more houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Erection of a building or buildings with 100 sq m or more floorspace.
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The following applies to all ‘major’ applications, listed building consent applications
  or where within a Conservation Area and comprises: a) erection of one or more houses, or b) erection
  of a building(s) with a 100m2 or more floorspace'
must-include:
- item: Proportionate to the scale of the development, and visual (diagrams, sketches, plans and photographs)
    to explain how the proposals evolved
  level: should
- item: The design principles and concepts that have been applied
  level: must
- item: The steps taken to appraise the context of the development and how its design takes that context
    into account
  level: must
- item: The access approach proposed, and how policies relating to access have been considered
  level: must
- item: What consultation has been undertaken on access and what account has been taken of it, and how
    any specific access issues have been addressed
  level: must
- item: The outcome of any formal Design Reviews undertaken
  level: should
- item: 'For outline applications with scale and/or layout reserved: the design approach and design intent
    for future reserved matters applications'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'In a Conservation Area: reference to the Conservation Area and to any statutory listing or designation'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Within a Conservation Area.
- item: 'For listed buildings: how the historical and architectural importance of the building, in its
    physical features and setting, has been considered in the design'
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 4-5.
review-status: unverified
field-status: {}
