reference: waste-management-plan
local-authority: GRA
required-if:
  always: true
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policy CS18
source-text: All applications should set out how waste collection and recycling facilities will be provided.
must-include:
- item: How waste collection and recycling facilities will be provided
  level: should
- item: 'For larger major developments (50 plus homes, or 5,000 sq m upwards of new commercial floorspace):
    evidence that the waste collecting authority has been consulted on the final form of the facilities'
  level: should
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50 plus homes.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 5000
        description: 5,000 sq m upwards of new commercial floorspace.
  source-text: Larger scale major development s (50 plus homes, or 5,000m2 upwards of new commercial floorspace)
    should demonstrate that the relevant waste collecting authority has been consulted on the final form
    of facilities proposed.
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 11. The 'Waste & Recycling' part of
  the Energy / Sustainability Assessment section. The list says all applications 'should' set this out.
review-status: unverified
field-status: {}
