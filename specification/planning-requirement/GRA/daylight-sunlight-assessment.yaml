reference: daylight-sunlight-assessment
local-authority: GRA
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policy CS19
source-text: 'This applies to applications for Major development: where there is a potential adverse impact
  upon the current levels of sunlight and daylight enjoyed by neighbouring properties, including associated
  gardens or amenity space where the site is subject to potential adverse impact from adjoining buildings
  or features; or where one part of the development is affected by another part of the same development.'
must-include:
- item: The impacts on existing properties and sites with extant planning permissions, showing adequate
    daylight, sunlight and overshadowing amenity
  level: must
- item: 'Following the BRE guidance ''Site layout planning for daylight and sunlight: A guide to good
    practice'' (2011)'
  level: should
- item: An overshadowing study, with shadow diagrams at different times of day and throughout the year
  level: must
- item: 'For applications proposing buildings: an assessment of Vertical Sky Component (VSC) and Average
    Daylight Factor (ADF)'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The application proposes buildings.
- item: Diagrams as relevant and a non-technical summary of the conclusions
  level: must
- item: Prepared by a suitably qualified professional
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 9-10. Each case depends on a 'potential
  adverse impact', so it is shown as discretionary within major development.
review-status: unverified
field-status: {}
