reference: application-form
local-authority: GRA
required-if:
  always: true
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The following applies to all applications.
must-include:
- item: Completed in full, signed and dated
  level: must
- item: A concise, clear description of the development that accurately reflects all aspects of the proposal
    requiring planning permission
  level: should
- item: Extensions to flats applied for on the full planning application form, not the householder form
  level: must
  source-text: Applications for extensions to flats need to be on full planning application forms (not
    householder forms) and failure to use the correct forms will delay the application and make it invalid.
- item: One ownership certificate (A, B, C or D), with Notice 1 (Certificate B), Notices 1 and 2 (Certificate
    C) or Notice 2 (Certificate D)
  level: must
- item: 'Where the pavement in front of the site is inside the red line and not owned by the applicant:
    Certificate B, with notice served on the Highways Authority'
  level: must
  source-text: Please note, that if the pavement in front of the site is included in the red line, please
    complete Certificate B and serve notice on the Highways Authority if you are not the owner of the
    pavement.
- item: The Agricultural Holdings Certificate, even if the application is for a non-agricultural use
  level: must
  source-text: You must complete the Agricultural Holdings Certificate - even if your application is for
    a non- agricultural use
- item: The appropriate fee
  level: must
  source-text: Appropriate fee is required for all planning applications.
- item: 'For works to a tree covered by a Tree Preservation Order: the reasons for the works'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
  source-text: Applications for works to a tree covered by a Tree Preservation Order must include reasons
    for the works.
- item: 'For works to trees: details of the proposed works, with pruning expressed in metres (crown thinning
    may be a percentage)'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  source-text: 'Details of the proposed works to the tree(s) are required: Pruning works must be expressed
    in metres, except for crown thinning, that can be expressed as a percentage.'
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 3, 5, 20-21. Includes the ownership
  and agricultural holdings certificates and the fee (page 5). The tree works items come from the Tree
  Survey & Report section (pages 20-21).
