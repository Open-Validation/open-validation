reference: air-quality-assessment
local-authority: GRA
required-if:
  any:
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: Introduces sensitive receptors, e.g. dwellings, schools and hospitals.
    - site:
        in:
        - air-quality-management-area
        description: Into an area of existing poor air quality.
  - discretionary
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policy CS19
source-text: 'This applies to applications where development that may increase levels of air pollution,
  particularly where it would: Lead to a significant increase in congestion or HGV movements Include significant
  amounts of car parking Emit dust Introduce sensitive receptors, e.g., dwellings, schools, and hospitals,
  into an area of existing poor air quality.'
must-include:
- item: A description of baseline conditions and how these could change
  level: must
- item: The assessment methods and any requirements around verification of air quality modelling
  level: must
- item: The basis for assessing impact and determining its significance
  level: must
- item: Impacts on areas with existing poor air quality / sensitive locations
  level: must
- item: Impacts on the amenity and health of occupiers and neighbours
  level: must
- item: Impacts on Gravesham's Air Quality Action Plan
  level: must
- item: Proposed remedial or mitigation measures, including during construction
  level: must
- item: Carried out by a suitably qualified air quality consultant
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 8-9. 'May increase levels of air pollution',
  'significant' congestion, HGV movements or parking and dust have no thresholds, so they are shown as
  discretionary. 'Area of existing poor air quality' is shown as an air quality management area.
review-status: unverified
field-status: {}
