reference: sketch-plan
local-authority: GRA
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: For applications that propose development affecting trees, including on site or on adjoining
  / neighbouring land, or works to trees
must-include:
- item: A plan of the site clearly showing the position of the tree(s), annotated T1, T2 etc, in relation
    to buildings and a named road (can be hand drawn for smaller sites)
  level: must
- item: 'For large sites with numerous trees: a plan showing only the trees subject to the proposed works'
  level: should
  required-if: discretionary
- item: Photographs of the tree(s), and a colour coded plan
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 20-21. The Tree Survey & Report section's
  requirements for applications for works to trees.
review-status: unverified
field-status: {}
