reference: affordable-housing-statement
local-authority: GRA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: 15 or more dwellings.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 3
        description: 3 or more dwellings.
    - site:
        in:
        - rural-area
        description: In the rural area.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Sites of 0.5 hectares or more (urban or rural area).
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Gravesham Local Plan Core Strategy Policy CS16
source-text: 'This is required for residential developments of: 15 or more dwellings or Sites of 0.5 hectares
  or more in the urban area, or 3 or more dwellings, or Sites of 0.5 hectares or more in the rural area'
must-include:
- item: Number of residential units
  level: must
- item: Number of affordable units
  level: must
- item: Mix of units, with numbers of habitable rooms and/or bedrooms and the floorspace of habitable
    areas
  level: must
- item: Tenure of units
  level: must
- item: A plan showing the location of the affordable units, with habitable rooms / bedrooms and floorspace
    of habitable areas
  level: must
- item: Details of any Registered Social Landlords acting as partners in the development
  level: must
- item: 'Where affordable housing is below the policy requirement: a justification, with a Viability Assessment
    / Appraisal'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing proposed on site is less than the policy requirement.
  source-text: If the level of affordable housing proposed on site is less than the policy requirement,
    this will need to be justified and will require a Viability Assessment / Appraisal accompany the Statement.
- item: 'Where off-site provision or a financial contribution is offered: draft heads of terms'
  level: should
  source-text: If, subject to agreement with the Council, off-site provision or a financial contribution
    is offered for development to be provided elsewhere, draft heads of terms should ideally be submitted.
confidence: medium
notes: 'From the council''s list (in effect from 1 April 2020), page 8. The list reads as two pairs: urban
  area 15+ dwellings or 0.5 ha, rural area 3+ dwellings or 0.5 ha. Housing-only thresholds, so only residential
  site area.'
review-status: unverified
field-status: {}
