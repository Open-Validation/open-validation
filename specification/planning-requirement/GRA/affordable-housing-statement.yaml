reference: affordable-housing-statement
local-authority: GRA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: The proposal is for 15 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: The residential site is 0.5 hectares or more.
  - all:
    - site:
        in:
        - rural-area
        description: The site is in the rural area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 3
        description: The proposal is for 3 or more dwellings.
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
source-text: 'Affordable Housing Statement This is required for residential developments of: 15 or more
  dwellings or Sites of 0.5 hectares or more in the urban area, or 3 or more dwellings, or Sites of 0.5
  hectares or more in the rural area Statements should include information on affordable and market housing
  including: Number of residential units'
must-include:
- item: Number of residential units
  level: must
confidence: medium
notes: The workbook guessed Full planning ('INFERRED'); the excerpt gives the thresholds. The list of
  contents is cut off after the first item.
review-status: unverified
field-status: {}
