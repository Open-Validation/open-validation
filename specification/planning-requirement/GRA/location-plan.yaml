reference: location-plan
local-authority: GRA
required-if:
  always: true
source-url: https://www.gravesham.gov.uk/downloads/file/382/local-validation-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The following applies to all applications.
must-include:
- item: Identifies the land to which the application relates, with properties numbered or named so the
    exact location is clear
  level: must
- item: Drawn to an identified metric scale of 1:1250 or 1:2500, with a scale bar on the drawing
  level: must
- item: The direction of North
  level: must
- item: All land necessary to carry out the development, for example access from a public highway, visibility
    splays, landscaping, car parking and open areas around buildings
  level: must
- item: Site outlined in red, with a blue line around any other land owned by the applicant close to or
    adjoining the site
  level: must
- item: Based on an up-to-date map
  level: must
- item: At least two named roads and surrounding buildings, wherever possible
  level: should
confidence: medium
notes: From the council's list (in effect from 1 April 2020), page 3-4.
review-status: unverified
field-status: {}
