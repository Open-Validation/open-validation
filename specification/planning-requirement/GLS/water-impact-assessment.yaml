reference: water-impact-assessment
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: dewatering-or-abstraction
        value: true
        description: Dewatering is proposed or the proposals affect the water table and movement of water
          under or around the site.
    - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) policies DM01, DM05 and MR01; Saved Waste Local Plan (2004) policy
  WLP33
source-text: 'Any development: • involving materials or processes that could result in pollution of the
  water environment; and • where dewatering is proposed or proposals affect the water table and movement
  of water under or around the site. Unless the Environment Agency has provided written confirmation that
  such information would not be required.'
must-include:
- item: The calculation of the extent and volumes of dewatering, in accordance with the 'Assessing impacts
    on water quality' guidance in PPG Water supply, wastewater and water quality
  level: must
  required-if:
    condition:
      field: dewatering-or-abstraction
      value: true
      description: Dewatering is proposed.
- item: Involvement of a qualified hydro-geologist
  level: should
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 27. 'Hydrological or Hydro-geological Assessment'. The list's Appendices 1 (minerals), 2 (waste)
  and 3 (Regulation 3) checklists all name it, so it applies to all three application types. The two bullets
  are joined by 'and' but each describes a risk to the water environment; dewatering or effects on the
  water table are shown as a trigger and the pollution risk (no threshold) as discretionary. Not needed
  where the Environment Agency has confirmed so in writing.
review-status: unverified
field-status: {}
