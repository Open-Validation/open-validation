reference: arboriculturist-report
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees are within the site or close enough to influence or be affected by the development
          (including street trees), or trees and hedges with a stem diameter over 75 mm at 1.5 m within
          or bounding the site are affected.
    - condition:
        field: veteran-trees
        value: true
        description: An Aged or Veteran Tree is on site or within close proximity.
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Town and Country Planning Act 1990, Sections 197 and 198
source-text: 'Any development where: • trees are within the site; • trees are in close proximity to the
  site that could influence or be affected by the development (including street trees); • trees and hedges
  growing within or bounding a site, with a stem diameter greater than 75 millimetres when measured at
  1.5 metres above ground level, which are affected by the proposals; and/ or • an Aged or Veteran Tree
  is on site or within close proximity.'
must-include:
- item: Identification and detail of any trees with Tree Preservation Orders (TPO)
  level: must
- item: Prepared by a suitably qualified arboriculturalist in accordance with BS5837
  level: should
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 41-42. 'Tree survey / Arboricultural Statement'. The list's Appendices 1 (minerals), 2 (waste)
  and 3 (Regulation 3) checklists all name it, so it applies to all three application types. The list
  adds that the district council's validation checklist sets its own requirements for survey information,
  arboricultural impact assessment and method statement.
review-status: unverified
field-status: {}
