reference: landscaping-plan
local-authority: GLS
required-if:
  application-type:
    in:
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Mineral Local Plan policies DM09 and MR01; Waste Core Strategy (2012) policies WCS14, WCS17
source-text: Any development unless the Planning Authority has provided written confirmation that one
  would not be required. Pre-application advice may be sought from the Planning Development Management
  Team.
must-include:
- item: Proposals for long-term maintenance and landscape management, clear and specific and referencing
    suitable methods of mitigation
  level: must
- item: Proposed finished ground levels or contours; means of enclosure; car parking layouts; other vehicle
    and pedestrian access and circulation areas; hard surfacing materials; structures and ancillary objects
  level: must
- item: Planting plans, written specifications, and schedules of plants noting species, plant sizes and
    proposed numbers/planting densities
  level: must
- item: A maintenance regime including replacement planting
  level: must
- item: Existing vegetation to be retained, with measures for its protection during construction and/or
    demolition
  level: must
- item: Consideration of local amenity and biodiversity values
  level: must
- item: Review mechanisms for the aftercare
  level: must
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 40-41. 'Landscaping and After-care Scheme'. The list's Appendices 1 (minerals), 2 (waste) and 3
  (Regulation 3) checklists all name it, so it applies to all three application types. Not needed where
  the Planning Authority has confirmed so in writing.
review-status: unverified
field-status: {}
