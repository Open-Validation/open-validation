reference: sci
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: A boundary is shared with a sensitive use receptor.
    - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: GCC's Statement of Community Involvement
source-text: 'Any development where: • a boundary is shared with a sensitive use receptor; and/ or • the
  development is expected to have significant effects on the local community, e.g. a large mineral or
  waste proposal. Pre-application advice may be sought from the Planning Development Management Team on
  the scale, nature and type of development which will require a Statement of Pre-application Engagement.'
must-include:
- item: How the requirements for pre-application community consultation in GCC's Statement of Community
    Involvement have been complied with
  level: must
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 24. 'Statement of Pre-application Engagement or Consultation'. The list's Appendices 1 (minerals),
  2 (waste) and 3 (Regulation 3) checklists all name it, so it applies to all three application types.
  'Significant effects on the local community' has no threshold, so it shows as discretionary.
review-status: unverified
field-status: {}
