reference: construction-management-plan
local-authority: GLS
required-if:
  application-type:
    in:
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Highways Act (1980)
source-text: Any development unless the Highways Authority has indicated that one would not be required.
  Pre-application advice may be sought from the Highways Authority (see Appendix 4).
must-include:
- item: 24 hour emergency contact number
  level: must
- item: Hours of operation
  level: must
- item: Parking of vehicles of site operatives and visitors, including access and movement for existing
    occupiers of neighbouring properties during construction
  level: must
- item: Routes for construction traffic
  level: must
- item: Locations for loading/unloading and storage of plant, waste and construction materials
  level: must
- item: Methods of preventing mud being carried onto the highway
  level: must
- item: Measures to protect vulnerable road users (cyclists and pedestrians)
  level: must
- item: Any necessary temporary traffic management measures
  level: must
- item: Arrangements for turning vehicles
  level: must
- item: Arrangements to receive abnormal loads or unusually large vehicles
  level: must
- item: Methods of communicating the plan to staff, visitors and neighbouring residents and businesses
  level: must
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 14. 'Construction Management Plan (as opposed to a Construction Environmental Management Plan (CEMP))'.
  The list's Appendices 1 (minerals), 2 (waste) and 3 (Regulation 3) checklists all name it, so it applies
  to all three application types. Not needed where the Highways Authority has said so.
review-status: unverified
field-status: {}
