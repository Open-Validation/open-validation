reference: flood-risk-assessment
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) policy DM04; Waste Core Strategy (2012) policy WCS12
source-text: All developments will need to consider flood risk in accordance with Planning Practice Guidance.
must-include:
- item: A site-specific FRA prepared by a suitably qualified person in accordance with national guidance
    on flood risk and coastal change
  level: should
confidence: medium
notes: 'From the council''s list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 25. The list''s Appendices 1 (minerals), 2 (waste) and 3 (Regulation 3) checklists all name it,
  so it applies to all three application types. The list sets no trigger of its own: every development
  must consider flood risk ''in accordance with Planning Practice Guidance'', so when an FRA is needed
  follows national policy and it shows as discretionary.'
review-status: unverified
field-status: {}
