  notes: 'Neither the current-version status nor the contents could be verified live because the shared
    WebFetch budget ran out. A search found nothing newer than this February 2024 BNG-addendum checklist.
    Grokbot''s own excerpts show it treated a county minerals/waste/Reg 3 list like a district list. It
    ignored the Reg 3 and minerals appendices, attached many triggers to the wrong requirement or cut
    them to fragments, and dropped several named requirements (e.g. Waste Minimisation Statement, Hydrogeological
    Assessment, Geodiversity, Green Belt). Fixed 2026-11-05: every file was rewritten from the council''s
    latest list.'
