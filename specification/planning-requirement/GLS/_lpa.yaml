  status: outdated
submission-standards:
- item: An application will only be considered valid where it meets both the national and local validation
    requirements
  level: must
- item: Online submissions meet the national standards for the online submission of planning documents
    (Planning Portal)
  level: must
- item: 'Applications not submitted electronically: one original copy of the application form, plans and
    documents'
  level: must
- item: 'EIA development: at least three hard copies of the Environmental Statement, unless electronic
    copies are submitted'
  level: must
- item: Redacted versions for publicity may be required where the location of protected species is given
  level: should
- item: Avoid including personal details or other personal data (GDPR, Data Protection Act 2018) in supporting
    documents; everything except the applicant's telephone numbers and email addresses may be published
  level: should
