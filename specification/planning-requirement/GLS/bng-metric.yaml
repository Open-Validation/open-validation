reference: bng-metric
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Environment Act 2021; Article 7 of the Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: All developments where Biodiversity Net Gain is a mandatory requirement. All applicants should
  submit a BNG Statement outlining whether the development they are seeking planning permission for, if
  granted, would be subject to the biodiversity gain condition or not. Any considered exemptions must
  be explained applying the acceptable reasons set out in Planning Practice Guidance for Biodiversity
  Net Gain. This is the starting point for establishing the necessity for a Biodiversity Net Gain Plan.
must-include:
- item: The pre-development and post-development biodiversity values, plus where relevant the value of
    any registered off-site gain allocated and of any biodiversity credits purchased, calculated with
    the most up-to-date statutory Defra (Natural England) Biodiversity Metric
  level: must
- item: Minimum Biodiversity Net Gain Plan information as set out in Article 7 of the DMPO 2015
  level: must
- item: A copy of the Biodiversity Metric that is readable in Microsoft Excel
  level: must
- item: Evidence that Gloucestershire Nature Recovery Network mapping (and, when adopted, the Gloucestershire
    Local Nature Recovery Strategy) has been employed in the consideration of BNG outcomes
  level: must
  required-if: discretionary
  source-text: In addition, and where relevant, evidence must be provided showing that Gloucestershire
    Nature Recovery Network mapping, and when adopted, the Gloucestershire Local Nature Recovery Strategy
    (GLNRS) have been employed in the consideration of BNG outcomes.
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 2-3. The February 2024 BNG addendum's revised 'Biodiversity Net Gain Plan' row (it replaces the
  row on page 35). The appendix checklists predate it and don't list it, but it applies to all three application
  types. The BNG Statement every applicant must submit has no MHCLG id (see the unmapped list). Exempt
  development (householder, de minimis and the other statutory exemptions) is exempt by law, so the trigger
  is the biodiversity gain condition. The Nature Recovery Network evidence is needed 'where relevant',
  so it shows as discretionary.
review-status: unverified
field-status: {}
