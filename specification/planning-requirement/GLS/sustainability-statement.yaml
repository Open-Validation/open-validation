reference: sustainability-statement
local-authority: GLS
required-if:
  application-type:
    in:
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
source-text: Any development.
must-include:
- item: A description of the potential impacts in terms of climate change, energy use or energy production
    and sustainability, appropriate to the proposal's scale and complexity
  level: must
- item: How energy minimisation and carbon dioxide reduction will be incorporated into the development
  level: must
- item: BREEAM 'Very Good' as a minimum and an award under CEEQUAL (encouraged)
  level: should
  source-text: Development will be encouraged to achieve Building Research Establishment Environmental
    Assessment Method (BREEAM) rating ‘Very Good’ as a minimum standard and also obtain an award under
    the Civil Engineering Environmental Quality Assessment and Award Scheme (CEEQUAL).
- item: An outline of sustainable development issues, assessing water use, energy consumption, sustainable
    construction and waste management
  level: should
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 9-10. The list's Appendices 1 (minerals), 2 (waste) and 3 (Regulation 3) checklists all name it,
  so it applies to all three application types. The list cites the NPPF only.
review-status: unverified
field-status: {}
