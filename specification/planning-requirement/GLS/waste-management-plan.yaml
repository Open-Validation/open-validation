reference: waste-management-plan
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - discretionary
    - condition:
        field: demolition
        value: true
        description: Demolition or removal of existing permanent or temporary buildings, with the waste
          transported off site.
    - ref: major-development
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) policy SR01; Waste Core Strategy (2012) policy WCS2; Waste Minimisation
  in Development Projects SPD (GCC, 2006)
source-text: 'Any development: • where excavations are proposed as part of or as a consequence of the
  development and will be transported off site; • involving demolition/ removal of existing permanent
  or temporary buildings is proposed and will be transported off site; and/or • which meets the requirements
  for major development, set out in GCC’s Waste minimisation in development projects SPD. Unless the Minerals
  and Waste Planning Authority has confirmed in writing that one would not be required.'
must-include:
- item: Produced in accordance with GCC's Waste Minimisation in Development Projects SPD
  level: should
- item: Use of secondary or recycled aggregates in the proposed development
  level: should
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 45-46. 'Waste Minimisation Statement'. The list's Appendices 1 (minerals), 2 (waste) and 3 (Regulation
  3) checklists all name it, so it applies to all three application types. Excavated material to be taken
  off site has no field here and shows as discretionary. Major development is as the SPD defines it. Not
  needed where the Minerals and Waste Planning Authority has confirmed so in writing.
review-status: unverified
field-status: {}
