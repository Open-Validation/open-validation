reference: biodiversity-survey-report
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Wildlife & Countryside Act; Conservation of Habitats and Species Regulations (as amended); Minerals
  Local Plan (2020) policy DM06; Waste Core Strategy (2012) policy WCS15; Saved Waste Local Plan policy
  25
source-text: Any development where there is potential for impact on biodiversity that is adverse or beneficial
  or both, unless Natural England (NE) or the Planning Authority has confirmed in writing that such information
  would not be required.
must-include:
- item: Carried out by a suitably qualified person in accordance with CIEEM guidelines and British Standards
    BS42020 and BS 8683
  level: should
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 35-37. 'Preliminary Ecological Appraisal or Ecological Impact Assessment'. The list's Appendices
  1 (minerals), 2 (waste) and 3 (Regulation 3) checklists all name it, so it applies to all three application
  types. 'Potential for impact on biodiversity' has no threshold, so it shows as discretionary.
review-status: unverified
field-status: {}
