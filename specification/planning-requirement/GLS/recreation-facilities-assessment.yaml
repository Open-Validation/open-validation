reference: recreation-facilities-assessment
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: The development involves the loss of playing fields.
    - condition:
        field: new-open-space
        value: true
        description: The development involves the provision of playing fields.
    - site:
        in:
        - open-space
        description: The site is within or adjoining an area of designated or proposed open space or playing
          fields, common land or village greens.
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Open/green space, recreation and amenity policies in local councils' Local Plans
source-text: Any development involving the loss or provision of playing fields; and/or is within or adjoining
  an area of designated or proposed open space/playing fields, common land or village greens.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the application
    site
  level: must
  required-if:
    site:
      in:
      - open-space
      description: The development is within open space.
  source-text: Development proposals within open spaces must be accompanied by plans showing any areas
    of existing or proposed open space within or adjoining the application site.
- item: Evidence linked to the relevant local council's Playing Pitch Strategy
  level: should
- item: Any evidence that the land or buildings are surplus to local requirements, including a needs assessment
  level: must
  required-if: discretionary
  source-text: Any such evidence, including a needs assessment, must accompany the planning application.
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 7-8. 'Open Space/ Playing Field Assessment'. The list's Appendices 1 (minerals), 2 (waste) and
  3 (Regulation 3) checklists all name it, so it applies to all three application types. The surplus-land
  evidence is needed only where the applicant relies on it (no up-to-date Playing Pitch Strategy), so
  that item shows as discretionary.
review-status: unverified
field-status: {}
