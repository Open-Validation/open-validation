reference: travel-plan
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) Policy DM03; Waste Core Strategy (2012) Policy WSC19
source-text: Any development that has the potential for significant traffic and travel-related implications.
must-include:
- item: Prepared by a suitably qualified person in accordance with relevant guidance
  level: should
- item: Options for walking or cycling, as required by Active Travel England
  level: must
  required-if:
    any:
    - condition:
        field: floorspace
        operator: '>='
        value: 7500
        description: 7,500 sq m of floorspace or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 5
        description: A site area of five hectares or more.
  source-text: For those applications equal to or exceeding 7,500m2 of floorspace or an area of five hectares
    will have to consider options for walking or cycling as required by Active Travel England.
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 13. The list's Appendices 1 (minerals), 2 (waste) and 3 (Regulation 3) checklists all name it,
  so it applies to all three application types. 'Potential for significant traffic' has no threshold,
  so it shows as discretionary.
review-status: unverified
field-status: {}
