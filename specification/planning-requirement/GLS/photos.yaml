reference: photos
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: demolition
        value: true
        description: The development involves the demolition of an existing building or structure.
    - site:
        in:
        - conservation-area
        - area-of-outstanding-natural-beauty
        - listed-building
        description: The development affects a conservation area, AONB (National Landscape) or a listed
          building.
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
source-text: Any development involving the demolition of an existing building or structure; or affecting
  a conservation area, AONB or a listed building, unless the Development Management Planning team has
  advised that the application does not require any form of visual aid in order to consider the planning
  merits of a proposal.
must-include:
- item: The location where the photographs have been taken
  level: must
- item: Images captured at a suitable size, with a high enough resolution and clarity to convey their
    purpose without ambiguity
  level: should
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 8. 'Photographs and/ or photomontages'. The list's Appendices 1 (minerals), 2 (waste) and 3 (Regulation
  3) checklists all name it, so it applies to all three application types. Not needed where the Development
  Management Planning team has advised that no visual aid is required.
review-status: unverified
field-status: {}
