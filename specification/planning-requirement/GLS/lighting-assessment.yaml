reference: lighting-assessment
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: external-lighting
      value: true
      description: The development includes external lighting.
  - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) DM01, DM02, DM06, DM08, DM09 and DM11; Waste Core Strategy (2012) policies
  WCS10, WCS14, WCS15, WCS16 and WCS17; Saved Waste Local Plan (2004) policy WLP33
source-text: Any development including external lighting, which may have an impact upon the locality’s
  amenity or biodiversity value. Examples include proposals within the vicinity of residential properties,
  aerodromes, listed buildings or conservation areas, open countryside, Dark Sky Discovery Sites or features
  that could be used by roosting or commuting bats.
must-include:
- item: Layout plans showing the number, type, location and height of any lighting, including on columns
    and/or buildings
  level: must
- item: Plans showing light spread/spill patterns and intensity (points or contours in lux)
  level: must
- item: Proposed hours of use
  level: must
- item: Potential for impacts on ecological features and nocturnal species such as bats or dormice
  level: must
- item: Potential impacts on nearby residential properties, listed buildings and conservation areas
  level: must
- item: Proposed mitigation measures
  level: must
- item: Measures for unforeseen impacts and monitoring
  level: must
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 22-23. 'Lighting scheme (including light pollution assessment)'. The list's Appendices 1 (minerals),
  2 (waste) and 3 (Regulation 3) checklists all name it, so it applies to all three application types.
  Whether the lighting 'may have an impact upon the locality's amenity or biodiversity value' is a judgement
  (the examples are not exhaustive), so that part shows as discretionary.
review-status: unverified
field-status: {}
