reference: transport-assessment
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: parking-spaces
        operator: '>'
        value: 0
        description: Additional parking is proposed.
    - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) Policy DM03; Waste Core Strategy (2012) policy WSC19
source-text: Any development where there is likely to be a significant/ additional impact upon the existing
  transport network, and/or where additional parking is proposed. See PPG Transport Assessments and relevant
  Local Plans for thresholds, where applicable.
must-include:
- item: Prepared by a suitably qualified person in accordance with relevant guidance
  level: should
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 12. The list's Appendices 1 (minerals), 2 (waste) and 3 (Regulation 3) checklists all name it,
  so it applies to all three application types. A likely significant impact on the transport network has
  no threshold in the list (it points to PPG and the district Local Plans), so it shows as discretionary.
  'WSC19' is as printed (the Waste Core Strategy's policy WCS19).
review-status: unverified
field-status: {}
