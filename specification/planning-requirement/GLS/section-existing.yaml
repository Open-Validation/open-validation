reference: section-existing
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: The development involves any change in ground levels.
    - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Schedule 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: Any development which involves any change in ground levels or where topography or relationship
  of distinctive features is important to the proposal.
must-include:
- item: Existing and proposed site levels
  level: must
- item: How proposed buildings and/or other structures relate to the existing site levels and neighbouring
    development and/or land
  level: must
- item: Levels related to a fixed datum point off site
  level: should
- item: Drawn to an accurate standard metric scale
  level: should
- item: Finished floor and site levels
  level: should
- item: Transverse and longitudinal cross sections
  level: should
confidence: medium
notes: 'From the council''s list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 6-7. ''Cross-section drawing(s): existing and proposed''. The list''s Appendices 1 (minerals),
  2 (waste) and 3 (Regulation 3) checklists all name it, so it applies to all three application types.
  Where topography or distinctive features matter (no threshold given) it shows as discretionary. The
  drawing requirements are ''should'' in the list.'
review-status: unverified
field-status: {}
