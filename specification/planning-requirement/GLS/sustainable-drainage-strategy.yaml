reference: sustainable-drainage-strategy
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) policy DM04; Waste Core Strategy (2012) WCS12
source-text: Any development likely to significantly increase or change patterns of surface water run-off.
  Pre-application advice may be sought from the Lead Local Flood Authority
must-include:
- item: Prepared in accordance with DEFRA's Sustainable drainage systems non-statutory technical standards
    by a suitably qualified person
  level: should
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 27. 'Surface Water Drainage Strategy' (retired MHCLG id, used for drainage strategies). The list's
  Appendices 1 (minerals), 2 (waste) and 3 (Regulation 3) checklists all name it, so it applies to all
  three application types. 'Likely to significantly increase or change' run-off has no threshold, so it
  shows as discretionary.
review-status: unverified
field-status: {}
