reference: environmental-statement
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: eia-development
      value: true
      description: Development prescribed in Schedule 1 or 2 of the EIA Regulations 2017, unless a screening
        opinion has found that no EIA is required.
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: Any development which is prescribed in Schedule 1 or 2 of TCP (EIA) Regs 2017. Unless a screening
  opinion has been provided and it has been determined that no EIA is required.
must-include:
- item: The information specified in Regulation 18(3), meeting the requirements set out in Regulation
    18(4)
  level: must
- item: Any additional information specified in Schedule 4 of the EIA Regulations 2017 relevant to the
    specific characteristics of the development and the environmental features likely to be significantly
    affected
  level: must
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 7. The list's Appendices 1 (minerals), 2 (waste) and 3 (Regulation 3) checklists all name it, so
  it applies to all three application types. Hard-copy submissions need at least three copies of an Environmental
  Statement (see submission-standards in _lpa.yaml).
review-status: unverified
field-status: {}
