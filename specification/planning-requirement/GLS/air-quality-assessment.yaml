reference: air-quality-assessment
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - air-quality-management-area
        description: The site lies within or adjoining an Air Quality Management Area.
    - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) policy DM01; Waste Core Strategy (2012) policies WCS3, WCS4, WCS5,
  WCS6, WCS7, WCS8, WCS9, WCS10 and WCS18; Saved Waste Local Plan (2004) policy WLP37
source-text: 'Any development which: • lies within or adjoining an Air Quality Management Area; • would
  have the potential to impact on air quality; • would have a significant impact upon highways including
  HGV movements, increase in congestion and car parking, and dust emissions; and • introduces “sensitive
  receptors”, e.g. dwellings, schools, hospitals, sites of nature conservation importance, into an area
  of poor or significantly reduced air quality.'
must-include:
- item: A scheme prepared in accordance with national guidance and standards, detailing how the application
    will limit its impact on the surrounding environment
  level: must
- item: A Dust Management Plan showing how the applicant will minimise the impact of dust on the surrounding
    area
  level: should
  required-if: discretionary
  source-text: Any application that has the potential to generate increased dust should also include a
    Dust Management Plan and will need to indicate how the applicant will minimise the impact of dust
    on the surrounding area.
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 15-16. 'Air Quality Impact Assessment'. The list's Appendices 1 (minerals), 2 (waste) and 3 (Regulation
  3) checklists all name it, so it applies to all three application types. The other bullets (potential
  to impact on air quality, significant highway impacts, sensitive receptors in poor air quality) have
  no thresholds, so they show as discretionary.
review-status: unverified
field-status: {}
