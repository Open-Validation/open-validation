reference: daylight-sunlight-assessment
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) policy DM01; Waste Core Strategy (2021) Policy WCS17; Saved Waste Local
  Plan (2004) policy WLP37
source-text: Any development where there would be a potential impact on existing daylight/sunlight on
  adjoining properties including associated gardens or amenity space.
must-include:
- item: Prepared by a suitably qualified person in accordance with British Standards
  level: should
- item: An assessment of any adjoining waterway, to ensure there is no undue overshadowing
  level: should
  required-if:
    condition:
      field: near-watercourse
      value: true
      description: The site adjoins a waterway.
  source-text: Where appropriate, this should include an assessment of any adjoining waterway to ensure
    there is no undue overshadowing to the waterway.
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 17-18. The list's Appendices 1 (minerals), 2 (waste) and 3 (Regulation 3) checklists all name it,
  so it applies to all three application types. 'Potential impact' has no threshold, so it shows as discretionary.
  'Waste Core Strategy (2021)' is as printed.
review-status: unverified
field-status: {}
