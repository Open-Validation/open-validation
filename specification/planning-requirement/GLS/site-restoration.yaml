reference: site-restoration
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - application-type:
        in:
        - mineral-app
    - condition:
        field: landfill-development
        value: true
        description: The development involves landfill or land raising.
    - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) policies DM06, DM07, DM09 and MR01; Waste Core Strategy (2012) policies
  WCS4 and WCS8
source-text: Any development of a temporary* nature involving the disturbance of land and/or particularly
  when development involves mineral working, landfill or land raising proposals. *i.e. the temporary use
  (working) of land, although over a long period of time. Afterwards, land should be restored to its previous
  land use or an approved alternative scheme.
must-include:
- item: A statement and plans prepared in accordance with national guidance for the restoration and aftercare
    of minerals sites
  level: must
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 44. 'Restoration Scheme' (retired MHCLG id 'site-restoration'). The list's Appendices 1 (minerals),
  2 (waste) and 3 (Regulation 3) checklists all name it, so it applies to all three application types.
  Mineral working is read as a minerals application; other temporary development disturbing land has no
  threshold and shows as discretionary. Aftercare can be part of the Restoration Scheme or a separate
  Landscaping and Aftercare Scheme.
review-status: unverified
field-status: {}
