reference: land-contamination-assessment
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: previously-developed-land
        value: true
        description: The development is on brownfield land.
    - site:
        in:
        - contaminated-land
        description: There is reason to suspect prior contamination of the site or neighbouring land,
          e.g. former industrial uses, former landfill sites or former mineral tips.
    - site:
        in:
        - near-landfill-site
        description: The development is within 250 metres of a former landfill site.
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: 'Environmental Protection Act 1990: Part 2A; Waste Core Strategy (2012) policy WSC8'
source-text: Any development on brownfield land or where there is reason to suspect prior contamination
  of the application site or neighbouring land due to previous operations, such as (but not limited to)
  the existence of former industrial uses, the presence of former landfill sites, and former mineral tips.
  Any developments within 250 metres of a former landfill site will need to include a risk assessment
  of landfill gas migration.
must-include:
- item: A Phase 1 Contamination Risk Assessment in accordance with PPG Land affected by contamination
  level: should
- item: Phase 2 reports, if identified through the Phase 1 report, in accordance with BS10175:2011 + A1:2013
  level: must
  required-if: discretionary
- item: A risk assessment of landfill gas migration
  level: must
  required-if:
    site:
      in:
      - near-landfill-site
      description: Within 250 metres of a former landfill site.
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 30. The list's Appendices 1 (minerals), 2 (waste) and 3 (Regulation 3) checklists all name it,
  so it applies to all three application types. Where no contamination is suspected, applicants are expected
  to give evidence (such as historic maps and planning history) of why a Phase 1 assessment is not required.
  The Phase 2 item applies only where the Phase 1 report identifies the need, so it shows as discretionary.
review-status: unverified
field-status: {}
