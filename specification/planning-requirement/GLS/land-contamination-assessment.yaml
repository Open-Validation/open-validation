reference: land-contamination-assessment
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: previously-developed-land
        value: true
        description: Development on brownfield land.
    - site:
        in:
        - contaminated-land
        description: There is reason to suspect contamination of the site or neighbouring land from previous
          uses.
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
source-text: Land Contamination Assessment Any development on brownfield land or where there is reason
  to suspect prior contamination of the application site or neighbouring land due to previous operations,
  such as (but not limited to) the existence of former industrial uses …
