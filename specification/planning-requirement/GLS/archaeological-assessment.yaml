reference: archaeological-assessment
local-authority: GLS
required-if:
  application-type:
    in:
    - mineral-app
    - waste-dev
    - reg-3
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Planning (Listed Buildings and Conservation Areas) Act 1990; Ancient Monuments and Archaeological
  Areas Act 1979; Minerals Local Plan (2020) policy DM08; Waste Core Strategy (2012) policy WCS16
source-text: Any development unless the County Council’s Archaeologist has confirmed in writing that the
  development will not affect known archaeological or historical features or remains on, adjacent to or
  near to the application site.
must-include:
- item: Prepared by a suitably qualified person in accordance with relevant guidance
  level: should
confidence: medium
notes: 'From the council''s list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 43. ''Heritage and Archaeological Statement'': one statement covering both, so it is filed under
  heritage-statement and archaeological-assessment. The list''s Appendices 1 (minerals), 2 (waste) and
  3 (Regulation 3) checklists all name it, so it applies to all three application types. Not needed where
  the County Council''s Archaeologist has confirmed in writing that no known archaeological or historical
  features or remains will be affected.'
