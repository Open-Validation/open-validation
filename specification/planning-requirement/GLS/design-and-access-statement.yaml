reference: design-and-access-statement
local-authority: GLS
required-if:
  any:
  - all:
    - application-type:
        in:
        - reg-3
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            - world-heritage-site
            description: Within a designated area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: Building(s) with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: new-build
        value: true
        description: The waste development involves the construction of a new building.
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Article 2 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; Waste Core Strategy (2012) policy WCS17
source-text: 'Any developments for: • major development, as defined in legislation; • listed building
  consent; and/or • within a designated area, which consists of: one or more dwellings; or building(s)
  with a floor space of 100 square metres or more. Not required for minerals and waste development, unless
  a waste development involves the construction of a new building. In this instance a statement setting
  out design principles is required.'
must-include:
- item: How the proposed development is a suitable response to the site and its setting
  level: must
- item: That the proposal can be adequately accessed by prospective users
  level: must
- item: A statement setting out design principles
  level: must
  required-if:
    all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: new-build
        value: true
        description: A waste development constructing a new building.
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 45. Appendices 2 (waste) and 3 (Regulation 3) list it; Appendix 1 (minerals) doesn't. It could
  form part of the Supporting Statement.
review-status: unverified
field-status: {}
