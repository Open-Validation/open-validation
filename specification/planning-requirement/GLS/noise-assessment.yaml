reference: noise-assessment
local-authority: GLS
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: The development is likely to generate additional noise or vibration above existing
          background levels which may harm the nearest sensitive property, environmental designation or
          protected species.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: A change of use or new built development that will result in a mineral or waste development
          adjacent to housing or other noise sensitive premises.
    - condition:
        field: noise-sensitive-use
        value: true
        description: A sensitive development that needs protection itself.
    - discretionary
source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
policy: Minerals Local Plan (2020) policy DM01; Waste Core Strategy (2012) policies WCS3, WCS4, WCS5,
  WCS6, WCS7, WCS8, WCS9, WCS10 and WCS18; Saved Waste Local Plan (2004) policy WLP37
source-text: 'Any development which is likely to either: • generate additional noise (or vibrations) levels
  above existing background levels which may have a detrimental impact on the nearest sensitive property,
  environmental designation, or populations of protected and priority species; • be for a change of use
  or new built development that will result in a mineral or waste development adjacent to housing or other
  noise sensitive premises; • be for mineral extraction which involves blasting, or developments involving
  the crushing of rock or other materials; • be a sensitive development that needs protection itself;
  and/or • be within a noise sensitive area.'
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: A BS4142 noise assessment
  level: should
  required-if:
    condition:
      field: near-noise-sensitive-use
      value: true
      description: A minerals or waste premises adjacent to noise sensitive premises.
  source-text: Applications for proposals for minerals or waste premises adjacent to noise sensitive premises
    should undertake a BS4142 noise assessment
- item: A BS5228 assessment, as agreed with the Planning Authority
  level: should
  required-if: discretionary
  source-text: in some cases a BS5228 assessment as agreed with the Planning Authority.
confidence: medium
notes: From the council's list (adopted September 2023, reissued February 2024 with the BNG addendum),
  page 21-22. 'Noise and Vibration Impact Assessments'. The list's Appendices 1 (minerals), 2 (waste)
  and 3 (Regulation 3) checklists all name it, so it applies to all three application types. Mineral extraction
  with blasting or rock crushing, and sites within a noise sensitive area, have no field here and show
  as discretionary.
review-status: unverified
field-status: {}
