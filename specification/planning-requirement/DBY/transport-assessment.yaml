reference: transport-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - condition:
        field: new-vehicle-access
        value: true
        description: A new or amended site access.
    - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 9 paragraph 113; Derby and Derbyshire Waste Local Plan (March 2005) policies W2 and
  W8; Derby and Derbyshire Minerals Local Plan (April 2000) policy MP5
source-text: 'All proposals which would generate significant amounts of new or additional traffic or include
  the provision of a new or amended site access. The form and detail required will depend on the significance
  of the transport implications. 3.120 In determining whether a Transport Assessment (TA) or Transport
  Statement (TS) will be needed for a proposed development, the following will be taken into consideration:
  • the TA/TS policies (if any) of the Local Plan; • the scale of the proposed development and its potential
  for additional trip generation (smaller applications with limited impacts may not need a TA/TS); • existing
  intensity of transport use and the availability of public transport; • proximity to nearby environmental
  designations or sensitive areas; • impact on other priorities/ strategies (such as promoting walking
  and cycling); • the cumulative impacts of multiple developments within a particular area; and • whether
  there are particular types of impacts around which to focus the Transport Assessment or Statement (e.g.
  assessing traffic generated at peak times). 3.121 A TA/TS may still be required for smaller developments
  i.e. extensions to schools where the location is sensitive i.e. where there is the potential for increased
  conflicts between motorised and non-motorised users. Children, elderly people and people with disabilities
  are vulnerable road users.'
must-include:
- item: All existing and proposed vehicular and pedestrian movements to and from the site
  level: should
- item: Vehicle manoeuvring, parking, loading and servicing areas delineated
  level: should
- item: Existing and proposed employee numbers and vehicle and cycle parking spaces (particularly for
    schools)
  level: should
  required-if: discretionary
- item: The likely modal split of journeys to and from the site
  level: should
- item: Measures to improve access by public transport, walking and cycling, reduce parking need and mitigate
    transport impacts
  level: should
- item: A Travel Plan (see LR14)
  level: should
- item: 'Transport Statement: previous, present and proposed vehicle movements (size and type of vehicles),
    means of access, hours of operation and parking provision'
  level: should
confidence: medium
notes: From the council's list (published February 2022), page 46-47. LR13 'Transport Assessment or Statement'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. 'Significant' traffic generation and smaller developments in sensitive
  locations (e.g. school extensions) have no threshold, so they show as discretionary. The list asks for
  a Transport Assessment or a Transport Statement depending on the transport implications.
review-status: unverified
field-status: {}
