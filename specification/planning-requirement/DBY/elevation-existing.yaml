reference: elevation-existing
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings, structures, plant or machinery.
    - condition:
        field: plant-equipment
        value: true
        description: New plant or machinery.
    - condition:
        field: external-alterations
        value: true
        description: A change to the appearance of an existing building.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Proposals involving new buildings, structures, plant and machinery, or which would involve
  a change to the appearance of an existing building etc.
must-include:
- item: A drawing reference number and title
  level: must
- item: Drawn to a scale of 1:50 or 1:100, showing all sides of the proposals (including blank elevations)
  level: must
- item: The proposed works in relation to what is already there
  level: must
- item: The dimensions of the building in metric measurements
  level: must
- item: All external materials and finishes, with colour (BS or RAL code)
  level: must
- item: Position and materials of doors and windows
  level: must
- item: Any adjacent buildings and structures
  level: must
confidence: medium
notes: From the council's list (published February 2022), page 16, 18. LR1.2 'Elevation Plans (Existing
  and Proposed)'. The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters)
  all name it, so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73
  and reserved matters applications on them. LR1 says drawings should always show the existing situation.
review-status: unverified
field-status: {}
