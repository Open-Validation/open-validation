reference: ecology-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - local-wildlife-site
        - local-nature-reserve
        description: Statutorily or locally designated sites of ecological interest.
    - site:
        in:
        - priority-habitat
        description: Areas of priority habitat.
    - condition:
        field: protected-species
        value: true
        description: Protected or notable species.
    - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 15 paragraphs 174-188; Derby and Derbyshire Waste Local Plan (March 2005) policies
  W5 and W6; Derby and Derbyshire Minerals Local Plan (April 2000) policies MP1, MP4 and MP6; Environment
  Act 2021; section 40 Natural Environment and Rural Communities Act 2006
source-text: 'All applications which have the potential to affect sites or features with an ecological,
  geological or biodiversity based interest including: • Statutorily or locally designated sites of ecological
  interest; • Areas of priority habitat or other habitat of potentially significant value; • Protected
  or notable species and other species referred to in the NPPF.'
must-include:
- item: Surveys of the ecological interest of the site and surrounding area
  level: must
- item: An assessment of potential impacts, mitigation proposals and long-term maintenance and management
  level: must
- item: Any proposals for biodiversity enhancement / net gain
  level: should
- item: The mitigation hierarchy followed (avoid, mitigate, or as a last resort compensate)
  level: should
- item: An Ecological Impact Assessment (EcIA)
  level: should
  required-if:
    ref: major-development
- item: A Preliminary Ecological Appraisal
  level: should
  required-if:
    condition:
      field: minor-development
      value: true
      description: Development that is not major.
- item: Surveys by competent persons, at an appropriate time of year and in suitable weather, using nationally
    recognised methods
  level: must
- item: Surveys ordinarily no more than two years old
  level: should
- item: Where surveys are not considered necessary, a statement explaining why
  level: should
confidence: medium
notes: From the council's list (published February 2022), page 28-29. LR7 'Ecology / Nature Conservation
  Statement'. The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters)
  all name it, so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73
  and reserved matters applications on them. Habitat 'of potentially significant value' and the need agreed
  at pre-application stage show as discretionary.
review-status: unverified
field-status: {}
