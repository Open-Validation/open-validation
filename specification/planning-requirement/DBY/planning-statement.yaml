reference: planning-statement
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - condition:
      field: eia-development
      value: false
      description: Not accompanied by an Environmental Statement.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Most applications except those accompanied by an Environmental Statement under the Town and
  Country Planning (Environmental Impact Assessment) Regulations 2017 (the EIA Regulations).
must-include:
- item: The need for the proposed development, proportionate and specific to it
  level: must
- item: An assessment of conformity with the national and local planning policies of direct relevance
  level: must
- item: Where the development does not comply with development plan policies, a justification of need
    and the overriding reasons why it should go ahead
  level: must
- item: How the proposal achieves sustainable development (economic, social and environmental issues)
  level: should
- item: Outline details of any wider development or redevelopment plans at the site (e.g. a Master Plan)
  level: should
  required-if:
    all:
    - application-type:
        in:
        - reg-3
    - discretionary
- item: Existing and proposed pupil and staff numbers, and car parking for staff and visitors
  level: should
  required-if:
    condition:
      field: pupil-increase
      operator: '>'
      value: 0
      description: Development on a school site that increases pupil capacity.
confidence: medium
notes: From the council's list (published February 2022), page 22. LR2 'Planning / Supporting Statement'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. The master plan item applies to County Council developments 'where appropriate'.
review-status: unverified
field-status: {}
