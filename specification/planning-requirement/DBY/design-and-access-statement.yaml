reference: design-and-access-statement
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - ref: major-development
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
source-text: 'DESIGN AND ACCESS STATEMENT (DAS) Types of Application that Require this Information: 2.28
  Subject to the exceptions, a DAS is required for any planning application in the categories listed below
  (only those parts relevant to County Matter applications are included): major development, which includes:
  a) the provision of a building or buildings where the floor space to be created by the development is
  1,000 square metres or more; or b) development carried out on a site having an area of 1 hectar'
confidence: medium
notes: The council's list asks for a DAS for major development (only the parts relevant to County Matter
  applications are included).
