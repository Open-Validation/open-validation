reference: design-and-access-statement
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - reg-3
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: Any part of the development is in a World Heritage Site or conservation area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: Buildings creating 100 square metres or more of floor space.
  - condition:
      field: engineering-operations
      value: false
      description: Not engineering or mining operations.
  - condition:
      field: involves-change-of-use
      value: false
      description: Not a material change in use of the land or buildings.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Subject to the exceptions, a DAS is required for any planning application in the categories
  listed below (only those parts relevant to County Matter applications are included): • major development,
  which includes: a) the provision of a building or buildings where the floor space to be created by the
  development is 1,000 square metres or more; or b) development carried out on a site having an area of
  1 hectare or more. • where any part of the development is in a designated area*, where the proposed
  development consists of: a) the provision of one or more dwellings; or b) a building or buildings where
  the floor space created by the development is 100 square metres or more. * For the purpose of DAS, a
  ‘designated area’ means a World Heritage Site or conservation area. 2.29 A DAS is not required to be
  submitted if the proposed development is: • for permission to develop land without compliance with conditions
  previously attached, made pursuant to section 73 of the Act; • engineering or mining operations; • of
  a kind referred to in article 20(1)(b) or (c) of the DMPO– these refer to time limits; • for a material
  change in use of the land or buildings; • for development which is waste development.'
must-include:
- item: The design principles and concepts applied to the proposed development
  level: must
- item: The steps taken to appraise the context of the development and how the design takes that context
    into account
  level: must
- item: The applicant's approach to access and how relevant Local Plan policies have been taken into account
  level: must
- item: Any consultation undertaken on access issues and how its outcome informed the development
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
confidence: medium
notes: From the council's list (published February 2022), page 13-14. NR5. The list excludes s73 applications,
  engineering or mining operations, time-limit applications under article 20(1)(b) or (c), material changes
  of use and waste development, so in practice it applies to the County Council's own (Regulation 3) development.
