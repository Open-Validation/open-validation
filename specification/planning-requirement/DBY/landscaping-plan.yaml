reference: landscaping-plan
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - condition:
      field: landscaping-works
      value: true
      description: New or replacement landscaping is proposed.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; NPPF chapter
  15 paragraph 174a; Derby and Derbyshire Waste Local Plan (March 2005) policy W7; Derby and Derbyshire
  Minerals Local Plan (April 2000) policies MP1 and MP4
source-text: All proposals where new or replacement landscaping is proposed as part of the development.
  3.99 Note - this requirement is focused on those proposals where the form of landscaping is an integral
  part of the information required to determine an application. In other cases it may be possible to defer
  landscaping schemes to post-determination by condition.
must-include:
- item: A plan of the location and type of vegetation to be removed or retained
  level: should
- item: The location of any new soft or hard landscaping
  level: should
- item: Opportunities for biodiversity enhancement proposed as part of the development
  level: should
- item: A statement of the species, numbers and sizes of all new planting, including any seeding mixes
  level: should
- item: Long-term maintenance and after-care (generally 5 years, up to 10 years for mineral developments)
  level: should
confidence: medium
notes: From the council's list (published February 2022), page 39. LR9 'Landscaping Scheme'. The list's
  validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it, so it is
  shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved matters
  applications on them. The list says landscaping may be shown as an indicative master plan, with details
  by condition, where not essential (to be agreed before submission).
review-status: unverified
field-status: {}
