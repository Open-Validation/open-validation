reference: flood-risk-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development proposals of 1 hectare or greater in Flood Zone 1.
    - site:
        in:
        - flood-risk-zone
        description: New development in Flood Zones 2, 3a and 3b (including minor development and change
          of use).
    - site:
        in:
        - critical-drainage-area
        description: An area within Flood Zone 1 with critical drainage problems notified by the Environment
          Agency.
    - all:
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: Development or a change of use to a more vulnerable class.
      - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 14 paragraphs 153-173; Derby and Derbyshire Waste Local Plan (March 2005) policies
  W5, W6 and W9; Derby and Derbyshire Minerals Local Plan (April 2000) policies MP1 and MP4
source-text: 'Site-Specific Flood Risk Assessment is required for the following types of development/application:
  • All development proposals of 1 hectare or greater in Flood Zone 1 (as identified by the Environment
  Agency); • All development proposals for new development in Flood Zones 2, 3a and 3b (including minor
  development and change of use); • All development proposals in an area within Flood Zone 1 which has
  critical drainage problems (as notified to the local planning authority by the Environment Agency);
  • Where proposed development or a change of use to a more vulnerable class may be subject to other sources
  of flooding.'
must-include:
- item: How flood risk will be managed now and over the development's lifetime, taking climate change
    into account and the vulnerability of its users
  level: should
- item: Compliance with the PPG's Site-Specific Flood Risk Assessment checklist
  level: should
- item: The Sequential and Exception Tests, where appropriate (not for minor development)
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published February 2022), page 24-25. LR4. The list's validation checklist
  forms A (outline/full), B (s73) and C (reserved matters) all name it, so it is shown for minerals, oil
  and gas, waste and Regulation 3 applications and for s73 and reserved matters applications on them.
  Development that may be subject to other sources of flooding shows as discretionary.
review-status: unverified
field-status: {}
