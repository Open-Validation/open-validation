reference: site-plan
local-authority: DBY
required-if:
  application-type:
    in:
    - mineral-app
    - extraction-oil-gas
    - waste-dev
    - reg-3
    - s73
    - reserved-matters
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Most development and change of use proposals. Exceptions where block plans are not necessary
  should be agreed at pre-application discussions.
must-include:
- item: Drawn at an identified metric scale (e.g. 1:200 or 1:500, or such scale as appropriate)
  level: should
- item: A drawing reference number and title
  level: should
- item: The direction of North
  level: should
- item: The proposed development in relation to the site boundaries, with written dimensions including
    those to the boundaries
  level: should
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: must
  required-if: discretionary
- item: All public rights of way crossing or adjoining the site
  level: must
  required-if:
    condition:
      field: affects-public-right-of-way
      value: true
      description: A public right of way crosses or adjoins the site.
- item: The position of all trees and hedgerows on the site, and those on adjacent land that could influence
    or be affected by the development
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or hedgerows on or near the site.
- item: The extent and type of any hard surfacing
  level: must
  required-if:
    condition:
      field: hard-surfacing
      value: true
      description: Hard surfacing is proposed.
- item: Boundary treatment, including walls or fencing, where proposed
  level: must
  required-if:
    condition:
      field: new-boundary-treatment
      value: true
      description: New boundary treatment is proposed.
- item: Connection points for foul and surface water and any culverted watercourses within the site (where
    known)
  level: must
  required-if: discretionary
- item: The position and extent of any playing fields
  level: must
  required-if:
    condition:
      field: playing-field
      value: true
      description: The site contains or adjoins playing fields.
confidence: medium
notes: From the council's list (published February 2022), page 16-17. LR1.1 'Site / Block Plans'. The
  list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it, so
  it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. Items c) to i) are 'required to be shown where they influence or could
  be affected by the proposed development'; the two with no clear trigger show as discretionary.
review-status: unverified
field-status: {}
