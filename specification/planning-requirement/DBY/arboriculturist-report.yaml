reference: arboriculturist-report
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - condition:
        field: tree-works
        value: true
        description: Felling or pruning of existing trees and hedges on the site.
    - condition:
        field: hedgerows-affected
        value: true
        description: Felling or pruning of hedges.
    - condition:
        field: tree-rpa-encroachment
        value: true
        description: Works (excavations, storage of materials, movement of heavy plant and vehicles) which
          could affect tree or hedgerow root systems.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 12 paragraph 131 and chapter 15 paragraphs 174-180(c)
source-text: All applications which involve the felling and pruning of existing trees and hedges on a
  site, or involve works (excavations, storage of materials and movement of heavy plant and vehicles)
  which could affect tree or hedgerow root systems.
must-include:
- item: 'A tree survey of existing trees on the site: location, species, size, condition and spread'
  level: must
- item: How the development would affect trees on or next to the site, with justification for any trees
    to be felled
  level: must
- item: Methods to protect trees during construction and operation
  level: must
- item: Proposals for replacement planting
  level: must
- item: An assessment of the potential of trees to be removed or pruned to support roosting bats
  level: must
confidence: medium
notes: From the council's list (published February 2022), page 27. LR6 'Tree / Arboricultural Statement'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them.
review-status: unverified
field-status: {}
