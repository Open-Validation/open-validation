reference: recreation-facilities-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of open space, sports and recreation facilities or green infrastructure.
    - condition:
        field: affects-playing-field
        value: true
        description: Loss of, or impact on, school playing fields.
    - condition:
        field: new-open-space
        value: true
        description: Provision of open space, sports and recreation facilities.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: National Planning Policy for Waste
source-text: Countywide - mainly focused in town and villages. All applications involving the loss, or
  provision of, open space, sports and recreation facilities (including school playing fields)/ green
  infrastructure. This mainly affects developments by the County Council at existing school sites or for
  the provision of new facilities.
must-include:
- item: 'Details of the facility to be lost: use, size and condition'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of a facility.
- item: An assessment of the facilities to be retained against current standards
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of a facility.
- item: Justification of why the facility is no longer required
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of a facility.
- item: Details of any replacement facility, including construction and future maintenance
  level: should
- item: Existing and proposed summer and winter sports pitch layouts, with a justification for the development
    and its location
  level: should
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: County Council school development that involves the loss of, or impact on, school playing
        fields.
confidence: medium
notes: From the council's list (published February 2022), page 63. LR25 'Recreation / Open Space Statement'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. The list cites the National Planning Policy for Waste as its driver.
review-status: unverified
field-status: {}
