reference: noise-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Development which generates noise and/or vibration that could cause a loss of amenity
          for residents and other sensitive uses nearby.
    - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 15 paragraph 185a and chapter 17 paragraphs 204g-205c; National Planning Policy for
  Waste; Derby and Derbyshire Waste Local Plan (March 2005) policy W6; Derby and Derbyshire Minerals Local
  Plan (April 2000) policy MP1
source-text: 'All developments which generate noise and/or vibration to a level that could potentially
  cause a loss of amenity for residents within the vicinity and other noise and vibration sensitive uses
  including but not limited to educational establishments, hospitals, care homes, offices and public recreation
  areas. 3.146 The types of development that have the potential to generate noise include: mineral extraction
  sites (including ancillary mineral related development); oil and gas sites including exploratory wellsites;
  waste sites; new road infrastructure, or modifications to existing road infrastructure; sports pitches
  and multi use games areas (MUGAs); mechanical plant for schools, or any other type of development; construction
  from any site and other industrial uses. 3.147 The types of development that have potential to generate
  vibration include: mineral extraction sites (including ancillary mineral related development); oil and
  gas sites including exploratory wellsites; some waste sites; and some constructions works including
  piling, tunnelling, blasting and use of vibratory plant and equipment.'
must-include:
- item: Prepared by a suitably qualified and experienced acoustician
  level: should
- item: Existing noise levels in the area
  level: should
- item: Noise sources from the development and the level of noise likely to be generated
  level: should
- item: Noise and/or vibration sensitive receptors in the area
  level: should
- item: Mitigation measures to prevent or minimise noise and/or vibration
  level: should
- item: A regime to monitor and record noise and vibration during construction, use and operation (including
    from associated HGV traffic)
  level: should
confidence: medium
notes: From the council's list (published February 2022), page 52. LR17 'Noise and / or Vibration Assessments'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. The list names mineral sites, oil and gas sites, waste sites, road schemes,
  sports pitches and MUGAs, mechanical plant, construction and other industrial uses as types that can
  generate noise; whether the level could cause a loss of amenity is a judgement, so it also shows as
  discretionary.
review-status: unverified
field-status: {}
