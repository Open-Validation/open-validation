reference: environmental-statement
local-authority: DBY
required-if:
  condition:
    field: eia-development
    value: true
    description: Likely to have significant effects on the environment and meets the thresholds/criteria
      of the EIA Regulations 2017.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: An Environmental Statement will be required if your proposal is likely to have significant
  effects on the environment and meets the thresholds/ criteria set out in The Town and Country Planning
  (Environmental Impact Assessment) Regulations 2017 (the EIA Regulations).
must-include:
- item: The likely significant effects of the development on the environment
  level: must
- item: The proposed mitigation measures
  level: must
- item: Regard to possible cumulative effects with existing or approved development
  level: should
- item: Prepared by a competent expert, with a statement of the qualifications of the relevant professionals
  level: must
confidence: medium
notes: From the council's list (published February 2022), page 76. LR34. A screening opinion (and a scoping
  opinion) can be requested from the County Council.
review-status: unverified
field-status: {}
