reference: lighting-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: external-lighting
      value: true
      description: Proposals including external lighting.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
source-text: Proposals including external lighting
must-include:
- item: The type of lighting, including its height above ground and power rating
  level: must
- item: Drawings showing the spread of the light and how it will be kept from extending beyond the site
  level: should
confidence: medium
notes: 'Audit (wrong_app_type): LR23 Lighting Assessment. Part of its text was misfiled under listed building
  consent.'
review-status: unverified
field-status: {}
