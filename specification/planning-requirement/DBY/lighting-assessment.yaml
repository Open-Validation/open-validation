reference: lighting-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - condition:
      field: external-lighting
      value: true
      description: External lighting is included in the development.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 15 paragraph 185c; Derby and Derbyshire Waste Local Plan (March 2005) policy W6;
  Derby and Derbyshire Minerals Local Plan (April 2000) policy MP1
source-text: All proposals where external lighting is included in the development. This includes external
  lighting at mineral and waste management facilities and at county council establishments (e.g. schools,
  particularly if involving floodlighting).
must-include:
- item: Location and type of the proposed external lighting, with its height above ground and power rating
  level: must
- item: Proposed hours of use and the means of controlling the hours of illumination
  level: must
- item: Drawings showing the spread of light and how it is kept within the site
  level: must
- item: Impact on sensitive biodiversity features and protected species such as bats
  level: must
  required-if: discretionary
- item: Impact on listed buildings or conservation areas, including their setting
  level: must
  required-if:
    site:
      in:
      - listed-building
      - conservation-area
      description: Listed buildings or conservation areas could be affected.
confidence: medium
notes: From the council's list (published February 2022), page 61. LR23. The list's validation checklist
  forms A (outline/full), B (s73) and C (reserved matters) all name it, so it is shown for minerals, oil
  and gas, waste and Regulation 3 applications and for s73 and reserved matters applications on them.
review-status: unverified
field-status: {}
