reference: water-impact-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - condition:
        field: ground-disturbance
        value: true
        description: Ground disturbance that could affect the water table and the movement of water under
          and around the site.
    - condition:
        field: dewatering-or-abstraction
        value: true
        description: Dewatering or abstraction affecting the water table.
    - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 14 paragraphs 152-169; Derby and Derbyshire Waste Local Plan (March 2005) policies
  W4, W5 and W6; Derby and Derbyshire Minerals Local Plan (April 2000) policies MP1 and MP4
source-text: All developments which involve disturbance to the ground that could affect the water table
  and the movement of water under and around the site or involves the use of materials and processes that
  could result in pollution of the water environment.
must-include:
- item: An assessment of the water environment around the site and the development's impact on the movement
    of water and its quality
  level: must
- item: Mitigation measures to prevent pollution and avoid affecting the riparian rights of others
  level: must
confidence: medium
notes: From the council's list (published February 2022), page 43. LR11 'Hydrology / Hydrogeology Statement'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. Use of materials and processes that could pollute the water environment
  shows as discretionary.
review-status: unverified
field-status: {}
