reference: sustainable-drainage-strategy
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - condition:
      field: building-works
      value: true
      description: New development (e.g. new buildings, extensions, hard surfaced areas such as car parks
        and playgrounds).
  - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 14 paragraphs 168-169; Derby and Derbyshire Waste Local Plan (March 2005) policy
  W6
source-text: For all applications for new development (e.g. new buildings, extensions, hard surfaced areas
  such as car parks and playgrounds) where there are concerns about the capacity of wastewater infrastructure,
  applicants will be asked to provide information about how the proposed development will be drained and
  wastewater dealt with.
must-include:
- item: How surface and foul waters from the development will be managed
  level: must
- item: Details of the existing drainage system, where connecting to it
  level: must
  required-if:
    condition:
      field: drainage-alterations
      value: true
      description: The development connects to the existing drainage system.
- item: 'Details of any new infrastructure or servicing: type (including SuDS), nature, design, specification
    and location'
  level: must
- item: A fuller foul drainage assessment, with the method of storage, treatment and disposal
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Disposal of trade waste or foul sewage effluent other than to the public sewer.
confidence: medium
notes: From the council's list (published February 2022), page 26. LR5 'Foul and Surface Water Drainage
  Details'. The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all
  name it, so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and
  reserved matters applications on them. Required 'where there are concerns about the capacity of wastewater
  infrastructure' (no threshold given), so it shows as discretionary. The list says full details may sometimes
  be deferred to a condition.
review-status: unverified
field-status: {}
