reference: sci
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Derbyshire County Council Planning Services Statement of Community Involvement 2021; section 18
  Planning and Compulsory Purchase Act 2004; NPPF paragraphs 39-42; Localism Act 2011
source-text: It is good practice to engage with the community at an early stage of any proposed development
  but especially most ‘major’ developments as defined in the DMPO. 3.35 Exceptions would include small
  scale proposals where the potential impact would be limited in scale and area. For example, small scale
  changes on an existing waste or minerals development.
must-include:
- item: Who was consulted
  level: should
- item: What information was provided and how
  level: should
- item: Any public consultation events held
  level: should
- item: A summary of any responses
  level: should
- item: How responses have been taken into account
  level: should
- item: A conclusion on the effect of the consultation on the final proposal
  level: should
confidence: medium
notes: From the council's list (published February 2022), page 23. LR3 'Statement of Community Involvement
  / Pre-application Engagement'. The list's validation checklist forms A (outline/full), B (s73) and C
  (reserved matters) all name it, so it is shown for minerals, oil and gas, waste and Regulation 3 applications
  and for s73 and reserved matters applications on them. The list calls engagement good practice, 'especially
  most major developments', with no firm trigger, so it shows as discretionary.
review-status: unverified
