reference: archaeological-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 16 paragraphs 189-208; Derby and Derbyshire Minerals Local Plan (April 2000) policy
  MP4; Derby and Derbyshire Waste Local Plan (March 2005) policy W5
source-text: Where a site on which development is proposed includes or has the potential to include heritage
  assets with archaeological interest, an appropriate desk-based assessment should be submitted. Where
  necessary, a field evaluation (field walking, trial trenching, boreholes and geophysical surveys) should
  be carried out. The results should be incorporated into the assessment and should inform proposals by
  the applicant for researching, recording or preserving the heritage feature to be disturbed.
must-include:
- item: An appropriate desk-based assessment
  level: should
- item: A field evaluation (field walking, trial trenching, boreholes and geophysical surveys), where
    necessary
  level: should
  required-if: discretionary
- item: Proposals for researching, recording or preserving the heritage feature to be disturbed
  level: should
confidence: medium
notes: From the council's list (published February 2022), page 60. Part of LR22 'Heritage Impact Assessment'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. Whether a site has the potential to include archaeological interest has
  no defined trigger, so it shows as discretionary.
review-status: unverified
field-status: {}
