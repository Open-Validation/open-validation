reference: floor-plan-existing
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: New buildings or extensions that create additional floorspace.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All proposals for new buildings and/or the extension of existing buildings that would create
  additional floorspace.
must-include:
- item: A drawing reference number and title
  level: must
- item: Drawn to a scale of 1:50 or 1:100
  level: must
- item: The proposed works in relation to what is already there
  level: must
- item: New walls to be created or existing walls to be lost
  level: must
- item: Position of window and door openings
  level: must
- item: Uses of the floorspace
  level: must
  required-if: discretionary
  source-text: Uses of the floorspace, where appropriate.
confidence: medium
notes: From the council's list (published February 2022), page 16, 19. LR1.3 'Floor Plans (Existing and
  Proposed)'. The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters)
  all name it, so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73
  and reserved matters applications on them. Existing plans apply where there is an existing building.
review-status: unverified
field-status: {}
