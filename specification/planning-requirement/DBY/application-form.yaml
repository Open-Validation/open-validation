reference: application-form
local-authority: DBY
required-if:
  application-type:
    in:
    - mineral-app
    - extraction-oil-gas
    - waste-dev
    - reg-3
    - s73
    - reserved-matters
    - approval-condition
    - non-material-amendment
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All planning applications (with certain exceptions) submitted to Derbyshire County Council.
must-include:
- item: 'For mineral-related development (except onshore oil and gas): Derbyshire County Council''s Mineral
    Application Form'
  level: must
  required-if:
    application-type:
      in:
      - mineral-app
  source-text: All applications for mineral-related development (except for on-shore oil and gas development)
    will need to be supported by a completed copy of Derbyshire County Council’s Mineral Application Form
- item: 'For onshore oil and gas development: the standard national application form'
  level: must
  required-if:
    application-type:
      in:
      - extraction-oil-gas
- item: For approval of details reserved by condition, a letter may be used instead of a 1APP form; it
    must identify the permission reference number and the condition(s) to which the submission relates
  level: must
  required-if:
    application-type:
      in:
      - approval-condition
confidence: medium
notes: From the council's list (published February 2022), page 8. NR1 'Completed Application Form'. A
  section 96A non-material amendment uses the Planning Portal form. The list gives no further detail of
  the 'certain exceptions'.
review-status: unverified
field-status: {}
