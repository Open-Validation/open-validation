reference: sustainability-statement
local-authority: DBY
required-if:
  application-type:
    in:
    - mineral-app
    - extraction-oil-gas
    - waste-dev
    - reg-3
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 14 paragraphs 153-158; Planning and Compulsory Purchase Act 2004; Planning and Energy
  Act 2008; Climate Change Act 2008 (2050 Target Amendment) Order 2019; Environment Act 2021
source-text: All mineral and waste developments for new sites, extensions to existing sites and ancillary
  development. Information should also be provided for all County Council development applications proportionate
  to the scale of the development proposed.
must-include:
- item: A sustainability appraisal of the elements of the proposal that address sustainable development,
    including adaptation to and mitigation of climate change
  level: should
- item: How sustainable design and construction have been addressed, including reducing energy use and
    greenhouse gas emissions and use of renewable or low carbon energy
  level: should
- item: Climate change adaptation and mitigation measures during operation and restoration
  level: should
- item: How the design seeks to meet BREEAM 'outstanding', 'excellent' or 'very good' standards (or another
    recognised standard agreed at pre-application stage)
  level: should
- item: A recognised quality regime, with post-construction monitoring and reporting, so 'as built' energy
    and GHG performance matches the specification
  level: must
confidence: medium
notes: From the council's list (published February 2022), page 71-72. LR31 'Climate Change / Energy Statement
  / Renewable Energy / Sustainability Statement' (one combined statement). Required for all mineral and
  waste developments; for County Council development, proportionate to its scale.
review-status: unverified
field-status: {}
