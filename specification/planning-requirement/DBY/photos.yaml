reference: photos
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - site:
        in:
        - listed-building
        - conservation-area
        description: Development affecting listed buildings or conservation areas.
    - application-type:
        in:
        - mineral-app
        - extraction-oil-gas
    - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Applications where the development would result in a significant change in the appearance
  of a building or landscape. This includes development affecting Listed Buildings and conservation areas,
  mineral developments, major remediation schemes and waste management developments with substantial new
  buildings, structures or high storage facilities.
must-include:
- item: Photographs of the building or area in its current state
  level: must
- item: Photomontages to demonstrate the change
  level: must
- item: The date each photograph was taken, clearly annotated
  level: should
confidence: medium
notes: From the council's list (published February 2022), page 21. LR1.5 'Photographs and Photomontages'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. Mineral developments and development affecting listed buildings or conservation
  areas are named; other 'significant change' (including major remediation and large waste buildings)
  shows as discretionary.
review-status: unverified
field-status: {}
