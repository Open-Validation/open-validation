reference: land-contamination-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - site:
        in:
        - contaminated-land
        description: Contaminated land or buildings/structures are known to exist.
    - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 15 paragraphs 183-188
source-text: All applications for development where contaminated land or buildings/structures are known
  or suspected to exist.
must-include:
- item: 'Site investigation information (a risk assessment): whether contamination exists, its nature
    and extent, the risks and to whom/what (the receptors)'
  level: must
- item: The potential sources, pathways and receptors (pollutant linkages) and an evaluation of the risks
  level: must
- item: 'For works to school buildings known or suspected to contain asbestos: a desk top study as a minimum,
    and a site investigation where the desk top study shows it is critical to the decision'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - reg-3
    - discretionary
  source-text: Planning applications involving any works to school buildings known, or suspected, to contain
    asbestos should be indicated as such in the planning application and should include, as a minimum,
    a desk top study. If the desk top study identifies that further investigation is critical to the determination
    of an application (i.e. could not be the subject of a planning condition) a site investigation will
    be required to validate the planning application.
confidence: medium
notes: From the council's list (published February 2022), page 44. LR12 'Contaminated Land Assessment'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. Suspected contamination shows as discretionary.
review-status: unverified
