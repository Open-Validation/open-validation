reference: heritage-statement
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - site:
        in:
        - world-heritage-site
        - scheduled-monument
        - listed-building
        - listed-building-setting
        - conservation-area
        description: Development directly affecting designated heritage assets or their setting.
    - application-type:
        in:
        - mineral-app
        - extraction-oil-gas
    - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 16 paragraphs 189-208; Derby and Derbyshire Minerals Local Plan (April 2000) policy
  MP4; Derby and Derbyshire Waste Local Plan (March 2005) policy W5; World Heritage Convention 1972; Planning
  (Listed Buildings and Conservation Areas) Act 1990
source-text: 'All applications for development that would directly affect designated and non-designated
  heritage assets or affect the setting of such assets, or has the potential to impact on features of
  archaeological interest. 3.173 Heritage assets include World Heritage Sites (Derwent Valley Mills World
  Heritage Site), Scheduled Ancient Monuments, Listed Buildings and Conservation Areas as examples. 3.174
  The following are examples of developments when a Heritage Impact Assessment would be required: • Applications
  affecting a Conservation Area or the setting of a Listed Building or a world heritage site; • Mineral
  workings; • Other developments involving excavations and disturbance to the ground in areas of potential
  Archaeological interest.'
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting
  level: must
- item: An assessment of the impact of the proposal on the heritage asset, its justification and any measures
    to minimise impacts
  level: must
- item: Consultation of the Derbyshire Historic Environment Record (HER), with its information and advice
    recorded
  level: should
- item: Reference to the listing description for a listed building or structure
  level: should
  required-if:
    site:
      in:
      - listed-building
      description: A listed building or structure is affected.
- item: How the development would conserve or enhance the Outstanding Universal Value of the Derwent Valley
    Mills World Heritage Site
  level: should
  required-if:
    site:
      in:
      - world-heritage-site
      description: In the Derwent Valley Mills World Heritage Site.
confidence: medium
notes: From the council's list (published February 2022), page 59-60. LR22 'Heritage Impact Assessment'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. Mineral workings are named as needing one. Non-designated assets and areas
  of potential archaeological interest show as discretionary; the list says the need can be confirmed
  at pre-application stage.
