reference: heritage-statement
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - site:
        in:
        - world-heritage-site
        - scheduled-monument
        - listed-building
        - listed-building-setting
        - conservation-area
        - locally-listed-building
        - archaeological-priority-area
        description: Development directly affecting designated or non-designated heritage assets or their
          setting, or features of archaeological interest.
    - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
source-text: All applications for development that would directly affect designated and non-designated
  heritage assets or affect the setting of such assets, or has the potential to impact on features of
  archaeological interest. 3.173 Heritage assets include World Heritage Sites (Derwent Valley Mills World
  Heritage Site), Scheduled Ancient Monuments, Listed Buildings and Conservation Areas as examples.
confidence: medium
notes: 'Audit (wrong_app_type): the workbook put this under listed building consent, which a county council
  does not determine.'
review-status: unverified
field-status: {}
