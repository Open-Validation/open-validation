submission-standards:
- item: All drawings and plans at an identified standard metric scale, with a drawing reference number
    and title clearly annotated
  level: should
- item: Any revisions to drawings clearly referenced
  level: should
- item: Drawings show the existing situation at the site ('as existing' drawings) as well as the proposal
  level: should
- item: A completed validation checklist (form A, B or C) for the type of application, showing where each
    item can be found in the application documents
  level: must
