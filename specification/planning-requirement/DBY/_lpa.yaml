    from February 2022. The council''s ''Pre-planning and planning application forms'' page (https://www.derbyshire.gov.uk/environment/planning/planning-applications/making-a-planning-application/planappforms/pre-planning-planning-application-forms-index.aspx),
    checked 2026-11-06, still links this PDF as the local list and validation checklists, with no newer
    list or consultation; MHCLG''s register has no entry for the County.'
