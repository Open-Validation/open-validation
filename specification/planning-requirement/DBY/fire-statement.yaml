reference: fire-statement
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building of seven or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
source-text: must include a Fire Statement in the supporting information.
