reference: fire-statement
local-authority: DBY
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: Seven or more storeys.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Fire Safety and High Rise Residential Buildings (from 1 August 2021), MHCLG (June 2021); Town
  and Country Planning (Development Management Procedure) (England) Order 2015
source-text: From 1 August 2021 planning applications in respect of buildings containing two or more dwellings
  or educational accommodation and of a height of 18 metres or more, or seven or more storeys, must include
  a Fire Statement in the supporting information.
must-include:
- item: The fire safety principles, concepts and approach applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and how it was taken into account
  level: must
- item: How fire safety policies in relevant local development documents have been taken into account
  level: must
confidence: medium
notes: From the council's list (published February 2022), page 74. LR32.1 'Fire Safety and High Rise Residential
  Buildings'. Follows the national rule.
review-status: unverified
field-status: {}
