reference: location-plan
local-authority: DBY
required-if:
  application-type:
    in:
    - mineral-app
    - extraction-oil-gas
    - waste-dev
    - reg-3
    - reserved-matters
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'All planning applications submitted to Derbyshire County Council. Exceptions: • Applications
  for removal or variation of condition(s) following grant of planning permission (Section 73); • Applications
  for approval of details reserved by condition(s); • Applications for non-material amendments following
  the grant of planning permission (Section 96A).'
must-include:
- item: Based on an up-to-date metric scale Ordnance Survey map
  level: should
- item: A drawing reference number
  level: must
- item: At a scale of 1:1250 or 1:2500, or 1:5000 or 1:10000 for large sites
  level: should
- item: The direction of north
  level: should
- item: Enough roads (at least two named roads) and/or buildings on adjoining land to show the exact location
  level: should
- item: The application site edged clearly in red, including all land needed for the development (e.g.
    access from a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: Any other land owned or controlled by the applicant close to or adjoining the site edged in blue
  level: should
confidence: medium
notes: From the council's list (published February 2022), page 9. NR2. Not required for s73 applications,
  approval of details reserved by condition or non-material amendments. The list words the plan contents
  as 'should'.
review-status: unverified
field-status: {}
