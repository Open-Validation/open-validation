reference: travel-plan
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - condition:
        field: new-school
        value: true
        description: A new school.
    - condition:
        field: school-expansion
        value: true
        description: A significant extension to a school.
    - condition:
        field: existing-travel-plan
        value: true
        description: A proposal at a County Council establishment that would affect the provisions of
          an existing Travel Plan.
    - condition:
        field: new-vehicle-access
        value: true
        description: Accompanied by a Transport Assessment / Statement (new or amended site access).
    - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: NPPF chapter 9 paragraph 113; Derbyshire Local Transport Plan 2011-2026 (LTP3) chapter 8
source-text: All applications which are accompanied by a Transport Assessment/ Transport Statement (TA/TS)
  (see LR13 above). 3.129 Any proposal which would generate significant new travel movements in or near
  to Air Quality Management Areas, or is proposed in other locations where there are opportunities to
  promote the use of public transport, walking and cycling. Any proposal at a County Council establishment
  that would affect the provisions of an existing Travel Plan. 3.130 A Travel Plan will be required for
  all planning applications for significant extensions to or new schools. The Travel Plan should consider
  access for vehicles and pedestrians, staff parking, parking provision for visitors and parking, manoeuvring
  and unloading space for service vehicles.
must-include:
- item: Specific outcomes, targets and measures
  level: should
- item: Future monitoring and management arrangements and a timetable
  level: should
- item: Additional measures if the targets are not met
  level: should
- item: All journeys resulting from the development by anyone who may need to visit or stay
  level: should
- item: 'For schools: access for vehicles and pedestrians, staff parking, visitor parking, and parking,
    manoeuvring and unloading space for service vehicles'
  level: should
  required-if:
    any:
    - condition:
        field: new-school
        value: true
        description: A new school.
    - condition:
        field: school-expansion
        value: true
        description: A significant extension to a school.
confidence: medium
notes: From the council's list (published February 2022), page 48. LR14. The list's validation checklist
  forms A (outline/full), B (s73) and C (reserved matters) all name it, so it is shown for minerals, oil
  and gas, waste and Regulation 3 applications and for s73 and reserved matters applications on them.
  Required with every Transport Assessment or Statement (LR13). Significant new travel in or near Air
  Quality Management Areas and other locations with opportunities for sustainable travel show as discretionary.
