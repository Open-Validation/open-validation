reference: air-quality-assessment
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - all:
      - site:
          in:
          - air-quality-management-area
          description: Inside or adjacent to a designated Air Quality Management Area.
      - discretionary
    - condition:
        field: direct-air-emissions
        value: true
        description: Processes or activities releasing emissions to air of substances or particles potentially
          damaging to human health and the environment.
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Environment Act 1995 Part IV; NPPF chapters 15 and 17 (paragraph 211c); National Planning Policy
  for Waste; Derby and Derbyshire Waste Local Plan (March 2005) policy W6; Derby and Derbyshire Minerals
  Local Plan (April 2000) policy MP1
source-text: All proposals inside or adjacent to a designated AQMA where the development itself could
  result in the designation of an AQMA, or where the development would conflict with the aims and objectives
  of the AQMA. 3.157 All developments which involve processes or activities that would result in the release
  of emissions to air of substances or particles that would be potentially damaging to human health and
  the environment, or that would give rise to a received risk to human life.
must-include:
- item: The air quality of the area
  level: must
- item: The scale and nature of emissions from the proposal
  level: must
- item: The potential impact on people and the environment
  level: must
- item: Measures to prevent or minimise those impacts
  level: must
- item: Focused on the issues specific to the proposal (e.g. dust, odour, traffic pollution, bio-aerosols)
  level: must
- item: Baseline conditions, likely impact, any modelling or assessment undertaken, and mitigation and
    management
  level: must
confidence: medium
notes: From the council's list (published February 2022), page 55. LR19 'Air Quality Assessment and Emissions'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. In or next to an AQMA it is needed where the development could itself
  lead to an AQMA or conflict with its aims, which is a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
