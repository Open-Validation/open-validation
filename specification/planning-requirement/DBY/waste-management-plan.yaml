reference: waste-management-plan
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - condition:
      field: ground-disturbance
      value: true
      description: Ground excavations to enable the development to proceed (e.g. excavations for foundations).
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: National Planning Policy for Waste
source-text: All development involving ground excavations to enable the development to proceed (e.g. excavations
  for foundations). This requirement does not normally apply to mineral developments.
must-include:
- item: An estimate of the amount and type of waste or excess material generated by the ground works
  level: must
- item: How the material is to be disposed of or used within the development
  level: must
confidence: medium
notes: From the council's list (published February 2022), page 62. LR24 'Waste Management Statement'.
  The list's validation checklist forms A (outline/full), B (s73) and C (reserved matters) all name it,
  so it is shown for minerals, oil and gas, waste and Regulation 3 applications and for s73 and reserved
  matters applications on them. It does not normally apply to mineral developments, so mineral and oil
  and gas applications are left out.
review-status: unverified
field-status: {}
