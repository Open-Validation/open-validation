reference: biodiversity-survey-report
local-authority: DBY
required-if:
  all:
  - application-type:
      in:
      - mineral-app
      - extraction-oil-gas
      - waste-dev
      - reg-3
      - s73
      - reserved-matters
  - any:
    - condition:
        field: protected-species
        value: true
        description: The development could affect legally protected, notable or conservation priority
          species.
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - site-of-special-scientific-interest
        - national-nature-reserve
        - local-wildlife-site
        - local-nature-reserve
        description: The development could affect internationally, nationally, regionally or locally designated
          sites.
    - site:
        in:
        - priority-habitat
        description: The development could affect priority habitats (s.41 NERC Act 2006).
    - discretionary
source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
policy: Derby and Derbyshire Waste Local Plan (March 2005) policies W5 and W6; Derby and Derbyshire Minerals
  Local Plan (April 2000) policies MP1, MP4 and MP6; Conservation of Habitats and Species Regulations
  2017; Wildlife and Countryside Act 1981; section 40 Natural Environment and Rural Communities Act 2006;
  Environment Act 2021
source-text: 'All applications which have the potential to affect legally protected species, notable species
  or conservation priority species. 3.67 All applications where an initial ecological survey or preliminary
  ecological appraisal has identified that additional surveys for protected and notable species may be
  required. 3.68 Surveys should also be undertaken where an ecological consultant, Local Authority ecologist,
  Local Wildlife Trust, or other suitably qualified ecologist or body indicates the possible presence
  of such species. … All applications which have the potential to affect: 1) Designated sites including:
  • Internationally designated sites; • Nationally designated sites; • Regionally and locally designated
  sites. 2) Priority habitats (Habitats of Principal Importance for Biodiversity under S.41 of the Natural
  Environment and Rural Communities (NERC) Act 2006).'
must-include:
- item: 'Protected species survey: which species are present and their approximate numbers'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected or notable species.
- item: 'Protected species survey: a map of their distribution and use of the area, site, structure or
    feature'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected or notable species.
- item: Protected and notable species surveys no more than two seasons old
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected or notable species.
- item: 'Designated sites / priority habitats: the habitats and features present on and around the site,
    their extent, and a map of their distribution'
  level: should
- item: Potential direct and indirect impacts; where harm is likely, evidence of alternatives considered
    and how effects will be avoided, mitigated or compensated
  level: must
- item: Sufficient information to inform a Habitats Regulations Assessment (submitting the applicant's
    own HRA is advised)
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      description: A European site (SAC, SPA or Ramsar site) may be affected.
confidence: medium
notes: From the council's list (published February 2022), page 30-34. LR7.1 'Protected and Notable Species
  Surveys' and LR7.2 'Ecological Surveys for Developments with the Potential to Affect Designated Sites
  or Priority Habitats'. The list's validation checklist forms A (outline/full), B (s73) and C (reserved
  matters) all name it, so it is shown for minerals, oil and gas, waste and Regulation 3 applications
  and for s73 and reserved matters applications on them. Surveys asked for by a preliminary appraisal
  or an ecologist show as discretionary. A full survey may not be needed where Natural England, the council's
  ecologist or the Wildlife Trust confirm in writing that designated sites and priority habitats are not
  affected. The list has no separate biodiversity net gain requirement.
review-status: unverified
field-status: {}
