reference: archaeological-assessment
local-authority: OXO
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - archaeological-priority-area
          description: Within the City Centre Archaeological Area.
      - discretionary
  - all:
    - application-type:
        in:
        - pa-ecomms-network
    - condition:
        field: ground-disturbance
        value: true
        description: Development involving below-ground impact.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036
source-text: Additional details relating to archaeology are also required within the Heritage Assessment,
  as well as a full archaeological desk-based assessment (where appropriate), for developments within
  the City Centre Archaeological Area, on allocated sites where identified, or elsewhere where archaeological
  deposits and features are suspected to be present. … For development that involves below-ground impact
  within and outside the City Centre Area of Archaeological Interest
confidence: medium
notes: From the council's list (published August 2021), page 12, 48, 61. Allocated sites where identified
  and sites where archaeology is suspected are shown as discretionary. Electronic communications prior
  notifications with below-ground impact need an Archaeological Evaluation. Outline and reserved matters
  applications need the full-application documents for the matters considered at that stage ('as applicable').
review-status: unverified
field-status: {}
