reference: energy-statement
local-authority: OXO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: new-build
      value: true
      description: New build development.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New build residential development (except householder).
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1,000 m2 or more of non-residential floor space.
    - all:
      - condition:
          field: housing-type
          value: student
          description: Student accommodation.
      - condition:
          field: housing-floorspace
          operator: '>='
          value: 1000
          description: 1000 m2 or more of student accommodation.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036 policy RE1
source-text: For all new-build residential development (except householder) and new build non-residential
  development over 1000m2. … Required for developments involving new build residential dwellinghoues,
  1000 m2 or more of student accommodation; or 1,000 m2 or more of non-residential floor space
confidence: medium
notes: From the council's list (published August 2021), page 11, 56. The local list says non-residential
  'over 1000m2'; Appendix 1 says '1,000 m2 or more', which is used. Outline and reserved matters applications
  need the full-application documents for the matters considered at that stage ('as applicable').
review-status: unverified
field-status: {}
