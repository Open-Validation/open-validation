reference: heritage-statement
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - listed-building
          - conservation-area
          - scheduled-monument
          - park-and-garden
          - world-heritage-site
          - battlefield
          description: The development would directly affect the significance of a designated heritage
            asset.
      - site:
          in:
          - listed-building-setting
          description: The development is within the setting of a designated heritage asset.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036 section 6.0; National Planning Policy Framework
source-text: If the development would affect the significance of any designated heritage asset either
  directly or by being within its setting
must-include:
- item: Identification of, and impact on, views of Oxford's historic buildings and skyline, and on the
    setting of any heritage assets affected
  level: must
- item: Description of the history of the development of the site and its context (more than repeating
    the list entry)
  level: must
- item: Assessment of the heritage significance of the place and of the impact of the proposals on it
  level: must
- item: Justification for any harmful impacts
  level: must
- item: Archaeology details, and a full archaeological desk-based assessment where appropriate, within
    the City Centre Archaeological Area, on allocated sites where identified, or where archaeological
    deposits are suspected
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - archaeological-priority-area
          description: In the City Centre Archaeological Area.
      - discretionary
confidence: medium
notes: 'From the council''s list (published August 2021), page 6, 12, 21, 56-57. The council calls it
  a Heritage Assessment (Heritage Statement in Appendix 1). Listed building consent: national-list item.
  Outline and reserved matters applications need the full-application documents for the matters considered
  at that stage (''as applicable'').'
review-status: unverified
field-status: {}
