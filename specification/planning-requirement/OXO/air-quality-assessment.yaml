reference: air-quality-assessment
local-authority: OXO
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - lbc
    - discretionary
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036; Oxford City Council Air Quality Planning Application Guidance
source-text: For all Major developments and developments that will generate a substantial increase in
  vehicular movements, and/or significant demolition, construction or earthworks and/or that propose to
  introduce new receptors into an air quality hot spot area.
must-include:
- item: A dust assessment, as part of the air quality assessment, for developments involving significant
    demolition
  level: must
  required-if:
    condition:
      field: structural-demolition
      value: true
      description: The development involves significant demolition.
  source-text: Required as part of the Air Quality Assessment for developments involving significant demolition.
confidence: medium
notes: From the council's list (published August 2021), page 9-10, 22, 59. Traffic increases, significant
  demolition, construction or earthworks and new receptors in an air quality hot spot have no thresholds,
  so they are shown as discretionary. The listed building consent checklist omits 'all Major developments'.
  Outline and reserved matters applications need the full-application documents for the matters considered
  at that stage ('as applicable').
review-status: unverified
field-status: {}
