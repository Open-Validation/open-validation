  url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
  date: 2021-08
  date-basis: 'Cover: ''August 2021'' (PDF created 20 August 2021). Still the list linked as ''List of
    National and Local Planning Application Requirements'' from the council''s ''Apply for planning permission''
    page (https://www.oxford.gov.uk/making-planning-application/apply-planning-permission) and its downloads
    page (download/294) in November 2026; no newer list or consultation was found. The file/1658 address
    that MHCLG''s register gives now serves an unrelated Technical Advice Note (Sustainable Design and
    Construction, June 2022). Used with the council''s Drawing Standards (August 2021, https://www.oxford.gov.uk/downloads/file/1093/planning-application-drawing-standards)
    for submission standards. More than 2 years old, so outdated.'
  status: outdated
submission-standards:
- item: All plans and drawings to 1:50 or 1:100 scale (unless otherwise stated), indicating the plan number,
    paper size and a linear scale bar with at least two measurements (e.g. 0m-5m)
  level: must
- item: For major applications submitted electronically, two paper copies as well; otherwise one paper
    copy of the documents unless submitted electronically
  level: must
- item: Plans accurately drawn to a conventional metric scale, with the scale stated on the drawing
  level: must
- item: No 'Not to Scale' or 'Do Not Scale' disclaimers
  level: should
- item: Each plan has a title box with the address, proposal, drawing title, date, scale and drawing number
  level: should
- item: Revisions identified with a new drawing number, with the date and details of the revision
  level: should
- item: A separate schedule of drawings, plans and documents with drawing numbers and titles
  level: should
- item: Plans based on Ordnance Survey maps carry the Ordnance Survey copyright notice
  level: should
