reference: design-and-access-statement
local-authority: OXO
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - conservation-area
        description: The site is in a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Development for one or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Floor space created is greater than 100m2.
  - application-type:
      in:
      - lbc
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036, Appendix 6.1; Town and Country Planning (Development Management Procedure)
  (England) Order 2015, article 9
source-text: 'Design and Access Statement, if required, which complies with the requirements set out in
  Appendix 6.1 of the Oxford Local Plan 2036. … Design and Access Statement for development which is:
  … Major development (excluding material change of use); … When the site is in a Conservation Area and
  development is for one or more dwelling houses or the floor space created is greater than 100m2 (excluding
  material change of use).'
must-include:
- item: Complies with the requirements in Appendix 6.1 of the Oxford Local Plan 2036
  level: must
confidence: medium
notes: From the council's list (published August 2021), page 5, 8, 18-19, 21. The cases are spelled out
  in the outline section; householder, full and listed building consent sections say 'if required'. Listed
  building consent applications need one by law. Not needed for a material change of use.
review-status: unverified
field-status: {}
