reference: landscaping-plan
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - pa-build-agri-forest
      - hedgerow-removal
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: landscaping-works
        value: true
        description: Alterations to existing landscaping are proposed or existing landscaping would be
          impacted.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036 section 5.0
source-text: Where alterations to existing landscaping are proposed or existing landscaping would be impacted
  by the proposal.
must-include:
- item: Detailed landscaping proposals, including detailed planting plans and schedules, following the
    design concept in the Design and Access Statement (if required)
  level: must
- item: Retention and protection of existing trees and other vegetation during construction, where practicable
  level: should
- item: Proposals for long term maintenance and landscape management
  level: must
- item: 'Where loss of habitat is required: how a measurable net gain in biodiversity will be achieved'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published August 2021), page 12, 36, 50, 57. The council calls it Landscaping
  Details. Always needed for agricultural prior approvals and hedgerow removal notices. Outline and reserved
  matters applications need the full-application documents for the matters considered at that stage ('as
  applicable').
review-status: unverified
field-status: {}
