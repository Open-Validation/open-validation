reference: location-plan
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - pip
      - pa-build-agri-forest
      - pa-ecomms-network
      - consent-under-tpo
      - hedgerow-removal
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Location Plan at 1:1250 or 1:2500 scale showing: … If the application relates to only part
  of the original site.'
must-include:
- item: At 1:1250 or 1:2500 scale
  level: must
- item: North point
  level: must
- item: Application site outlined in red and any other land in the applicant's ownership outlined in blue
  level: must
- item: At least two road names
  level: must
- item: Identifies the tree or trees the application relates to
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
- item: The location and length of the hedgerow(s) to be removed (preferably at 1:2500)
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
confidence: medium
notes: From the council's list (published August 2021), page 5-50. National list item for most application
  types. For a variation of condition it is needed only if the application relates to part of the original
  site (shown as discretionary).
review-status: unverified
field-status: {}
