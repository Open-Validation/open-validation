reference: land-contamination-assessment
local-authority: OXO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected.
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed use would be particularly sensitive.
    - discretionary
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036 policy RE9
source-text: contamination is known or suspected, … the proposed use would be particularly sensitive,
  … contamination may present a risk to the surrounding environment.
confidence: medium
notes: From the council's list (published August 2021), page 6, 12, 22-23, 55. A risk to the surrounding
  environment is shown as discretionary. Outline and reserved matters applications need the full-application
  documents for the matters considered at that stage ('as applicable').
review-status: unverified
field-status: {}
