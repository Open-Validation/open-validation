reference: biodiversity-survey-report
local-authority: OXO
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
    - any:
      - condition:
          field: greenfield-site
          value: true
          description: A greenfield site.
      - discretionary
  - all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: greenfield-site
          value: true
          description: A greenfield site.
      - discretionary
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - lbc
    - any:
      - condition:
          field: protected-species
          value: true
          description: The site has the potential to support rare, notable or protected species and habitats.
      - discretionary
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036; Oxford City Council Technical Advice Note – Biodiversity
source-text: 'An ecological survey and assessment will be required for Major developments on greenfield
  sites or brownfield sites that have become vegetated. A Biodiversity Calculator must be included. The
  survey may also be required where: … The site has the potential to support rare, notable or protected
  species and habitats … There is a reasonable probability that species or habitats of nature conservation
  importance will be present.'
must-include:
- item: The features of conservation interest, the potential impact of the development, measures to avoid,
    mitigate or compensate those impacts, and a statement of the residual impact
  level: must
- item: A Biodiversity Calculator
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
confidence: medium
notes: From the council's list (published August 2021), page 9, 22, 55-56. Brownfield sites that have
  become vegetated and a 'reasonable probability' of species or habitats are shown as discretionary. The
  listed building consent list doesn't limit the greenfield trigger to major development. Outline and
  reserved matters applications need the full-application documents for the matters considered at that
  stage ('as applicable').
review-status: unverified
field-status: {}
