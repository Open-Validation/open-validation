reference: planning-statement
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - full
      - lbc
      - s73
      - pa-build-agri-forest
      - pa-ecomms-network
      - hedgerow-removal
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036
source-text: All applications. … All applications – to explain the reasoning for removing or varying the
  condition(s).
must-include:
- item: The context and need for the development and how it accords with relevant national, regional and
    local planning policies
  level: must
- item: The reasoning for removing or varying the condition(s)
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: Details of consultations with the local planning authority and community/statutory consultees
    before submission
  level: should
confidence: medium
notes: From the council's list (published August 2021), page 13, 17, 23, 36, 49, 50, 60-61. Outline and
  reserved matters applications need the full-application documents for the matters considered at that
  stage ('as applicable').
review-status: unverified
field-status: {}
