reference: site-plan
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - non-material-amendment
      - pa-build-agri-forest
      - pa-extension
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
      - cho-commercial-to-dwh
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: site-layout-change
        value: true
        description: The change to the development results in changes to the site layout.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Block Plan at 1:100 or 1:200 scale showing: … If the change to the development results in
  changes to the site layout. … A plan indicating the site and showing the proposed development with an
  identified scale and north point'
must-include:
- item: 'At 1:100 or 1:200 scale (prior approvals: an identified scale)'
  level: must
- item: North point
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements, unless they
    would not influence or be affected by the development
  level: must
- item: All public rights of way crossing or adjoining the site, unless they would not influence or be
    affected by the development
  level: must
- item: The position of all trees on the site and on adjacent land, unless they would not influence or
    be affected by the development
  level: must
- item: The extent and type of hard surfacing, unless it would not influence or be affected by the development
  level: must
- item: Boundary treatment including walls or fencing where proposed
  level: must
- item: 'For a larger home extension: the proposed development and any existing enlargement of the original
    dwellinghouse it will join'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
confidence: medium
notes: 'From the council''s list (published August 2021), page 5-46. The council calls it a Block Plan
  (prior approvals: a plan indicating the site and the proposed development). The council''s Drawing Standards
  (August 2021) call it a Site Layout Plan.'
review-status: unverified
field-status: {}
