reference: affordable-housing-statement
local-authority: OXO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Residential development on a site with capacity for 10 or more units.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.25
        description: Residential development on a site of 0.25 hectares or greater.
    - all:
      - condition:
          field: housing-type
          value: student
          description: Student accommodation.
      - condition:
          field: bedroom-count
          operator: '>='
          value: 25
          description: 25 or more bedrooms (or 10 or more self-contained student units).
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036 policy H2
source-text: For residential developments with sites with capacity for 10 or more units and student accommodation
  of 25 or more bedrooms (or 10 or more self-contained student units). … Residential developments on sites
  with capacity of 10 or more dwellings, or which have an area of 0.25 hectares or greater.
confidence: medium
notes: From the council's list (published August 2021), page 9, 55. Outline and reserved matters applications
  need the full-application documents for the matters considered at that stage ('as applicable').
review-status: unverified
field-status: {}
