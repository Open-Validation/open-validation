reference: elevation-proposed
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - advertising
      - ldc-prospective-use
      - pa-build-agri-forest
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
      - non-material-amendment
      - cho-commercial-to-dwh
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: The change to the development results in changes to the approved elevations.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications. … If the change to the development results in changes to the approved elevations.
  … These should show details of each advertisement - for illuminated adverts detail includes the level
  of luminance/wattage.
must-include:
- item: Drawn at 1:50 or 1:100, with the plan number, paper size and a linear scale bar with at least
    two measurements (e.g. 0m-5m)
  level: must
- item: Details of each advertisement; for illuminated adverts the level of luminance/wattage
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: Advertisement size, siting, materials and colours, height above ground, extent of projection and
    method and colour(s) of illumination
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: Detail drawings of the proposed signs at 1:5, 1:10 or 1:20 with a scale bar
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Drawings of the proposed signs to a scale of 1:5, 1:10 or 1:20 and including a scale bar
    are required for all applications.
- item: 'For enlargement of a dwellinghouse (Class AA): a plan showing the position and dimensions of
    the proposed windows, with an identified scale'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
confidence: medium
notes: From the council's list (published August 2021), page 6, 13, 16, 17, 23-25, 28, 33, 36, 38-46,
  51-52. Outline and reserved matters applications need the full-application documents for the matters
  considered at that stage ('as applicable'). The full telecommunications approval checklist (section
  13) is a full application with a shorter list.
review-status: unverified
field-status: {}
