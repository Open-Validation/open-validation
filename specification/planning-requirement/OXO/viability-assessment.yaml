reference: viability-assessment
local-authority: OXO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The applicant wishes to show the site is not viable at the level of affordable housing
        required by Policy H2.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036 policy H2
source-text: Where an applicant wishes to demonstrate that a site is not economically viable at the level
  of affordable housing required by Policy H2 of the Oxford Local Plan 2036.
must-include:
- item: Information from a professionally qualified source, where necessary
  level: must
- item: Based on reasonable and realistic assumptions
  level: must
confidence: medium
notes: From the council's list (published August 2021), page 14, 58.
review-status: unverified
field-status: {}
