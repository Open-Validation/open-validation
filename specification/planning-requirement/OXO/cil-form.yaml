reference: cil-form
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - pip
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Development greater than 100m2 in area.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Community Infrastructure Levy Regulations 2010; Oxford City Council CIL Charging Schedule
source-text: All applications. … If development is greater than 100m2 in area … A completed Community
  Infrastructure Levy form to establish whether the development may be liable to pay the Community Infrastructure
  Levy (CIL), and to calculate the CIL charge if the development is liable.
confidence: medium
notes: From the council's list (published August 2021), page 6, 9, 20, 29, 35, 38-43, 46, 52.
review-status: unverified
field-status: {}
