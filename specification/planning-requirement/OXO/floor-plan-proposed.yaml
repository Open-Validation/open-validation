reference: floor-plan-proposed
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - ldc-prospective-use
      - pa-build-agri-forest
      - non-material-amendment
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
      - cho-commercial-to-dwh
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: floor-layout-change
        value: true
        description: The change to the development results in changes to the approved floor plans.
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications. … If the change to the development results in changes to the approved floor
  plans. … A plan showing the proposed floor plans of the development with an identified scale, north
  point, dimensions and proposed use of each room, the position and dimensions of windows, doors and walls
must-include:
- item: Drawn at 1:50 or 1:100, with the plan number, paper size and a linear scale bar with at least
    two measurements (e.g. 0m-5m)
  level: must
- item: 'For prior approvals of new dwellings: identified scale, north point, dimensions and proposed
    use of each room, and the position and dimensions of windows, doors and walls'
  level: must
  required-if:
    application-type:
      in:
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
      - cho-commercial-to-dwh
- item: 'For commercial to residential (Class MA): the total floor space in square metres of each dwelling
    house'
  level: must
  required-if:
    application-type:
      in:
      - cho-commercial-to-dwh
confidence: medium
notes: From the council's list (published August 2021), page 7, 13, 16, 17, 23, 28, 33-34, 36, 38-46,
  51. Outline and reserved matters applications need the full-application documents for the matters considered
  at that stage ('as applicable'). The full telecommunications approval checklist (section 13) is a full
  application with a shorter list.
review-status: unverified
field-status: {}
