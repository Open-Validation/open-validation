reference: noise-assessment
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: The development is close to existing sources of noise.
      - condition:
          field: noise-generating-use
          value: true
          description: The proposal will generate significant noise levels.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036
source-text: Where developments are close to existing sources of noise or the proposal will generate significant
  noise levels. … Acoustic report All applications.
confidence: medium
notes: From the council's list (published August 2021), page 12, 48, 62. Electronic communications prior
  notifications need an acoustic report. Outline and reserved matters applications need the full-application
  documents for the matters considered at that stage ('as applicable').
review-status: unverified
field-status: {}
