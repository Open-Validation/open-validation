reference: elevation-existing
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - advertising
      - ldc-prospective-use
      - pa-build-agri-forest
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-terr-dwh
      - pa-flats-de-dwh
      - pa-demo-replace-dwh
  - all:
    - application-type:
        in:
        - outline
        - reserved-matters
    - discretionary
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications. … A plan showing the existing and proposed elevations of the building with
  an identified scale and north point
must-include:
- item: Drawn at 1:50 or 1:100, with the plan number, paper size and a linear scale bar with at least
    two measurements (e.g. 0m-5m)
  level: must
confidence: medium
notes: From the council's list (published August 2021), page 6, 13, 23, 24, 28, 33, 36, 38-43, 46, 51.
  Outline and reserved matters applications need the full-application documents for the matters considered
  at that stage ('as applicable'). The full telecommunications approval checklist (section 13) is a full
  application with a shorter list.
review-status: unverified
field-status: {}
