reference: bng-metric
local-authority: OXO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Environment Act 2021; Oxford Local Plan 2036
source-text: A Biodiversity Calculator must be included.
confidence: medium
notes: From the council's list (published August 2021), page 9. The 2021 list asks for a Biodiversity
  Calculator with the ecological survey for major development on greenfield or vegetated brownfield sites.
  Statutory biodiversity net gain (from 2024) now applies to all development subject to the biodiversity
  gain condition; householder and other exempt applications are exempt by law, so it is shown that way.
