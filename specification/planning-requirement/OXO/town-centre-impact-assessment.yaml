reference: town-centre-impact-assessment
local-authority: OXO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and leisure development outside centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 350
      description: 350m2 (gross) or more of retail and leisure floorspace.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036
source-text: For retail and leisure development outside centres which are 350m2 (gross) or more, except
  for sites within Areas of Change and Site Allocations as defined within the Oxford Local Plan 2036.
confidence: medium
notes: From the council's list (published August 2021), page 13. The council calls it a Retail Impact
  Assessment. Not needed for sites in Areas of Change and Site Allocations. Outline and reserved matters
  applications need the full-application documents for the matters considered at that stage ('as applicable').
review-status: unverified
field-status: {}
