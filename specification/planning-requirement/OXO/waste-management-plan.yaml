reference: waste-management-plan
local-authority: OXO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036
source-text: To identify the volume and type of material to be removed and/or excavated, opportunities
  for the reuse and recovery of materials and to demonstrate how off-site disposal of waste will be minimised
  and managed
must-include:
- item: Volume and type of material to be removed and/or excavated
  level: must
- item: Opportunities for the reuse and recovery of materials
  level: must
- item: How off-site disposal of waste will be minimised and managed
  level: must
confidence: medium
notes: From the council's list (published August 2021), page 14, 58. The council calls it Waste Management
  Details. The list gives its purpose but no trigger, so it is shown as discretionary. Outline and reserved
  matters applications need the full-application documents for the matters considered at that stage ('as
  applicable').
