reference: arboriculturist-report
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - hedgerow-removal
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - lbc
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Development within 15 metres of the stem of any tree on or next to the site with
          a stem diameter of 150mm or more at 1.5 metres above ground.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036 policy G8; BS5837:2012
source-text: For any proposals involving development within 15 metres of the stem of any tree(s) within
  the application site or adjacent to it, that have a stem diameter of 150 millimetres or more measured
  at 1.5 metres above ground level
must-include:
- item: In accordance with BS5837:2012 (or superseding version)
  level: must
- item: A plan showing the position and true crown spread of the tree(s) and their Root Protection Areas
  level: must
- item: An Arboricultural Implications Assessment if appropriate
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published August 2021), page 6, 9, 22, 50, 54. Called an Arboricultural
  Assessment/Tree Survey in the householder list. Required for all hedgerow removal notices. Outline and
  reserved matters applications need the full-application documents for the matters considered at that
  stage ('as applicable').
review-status: unverified
field-status: {}
