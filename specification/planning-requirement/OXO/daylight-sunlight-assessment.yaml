reference: daylight-sunlight-assessment
local-authority: OXO
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - discretionary
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036 policies H14 and RE7 and Appendix 3.7
source-text: 'Where there is a potential adverse impact upon the current levels of sunlight or daylight
  enjoyed by adjoining properties. Also required for new residential developments. This should include:'
must-include:
- item: The impact of the proposal on neighbouring sites
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: The performance of internal amenity within the proposed development
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: The performance of external amenity within the proposed development
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
confidence: medium
notes: From the council's list (published August 2021), page 6, 10, 55. An impact on neighbours' daylight/sunlight
  has no threshold, so it is shown as discretionary; new residential development always needs one. Outline
  and reserved matters applications need the full-application documents for the matters considered at
  that stage ('as applicable').
review-status: unverified
field-status: {}
