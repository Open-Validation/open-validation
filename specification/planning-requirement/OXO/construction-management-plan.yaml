reference: construction-management-plan
local-authority: OXO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 20
        description: 20 dwellings or more.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: 500m2 or more of non-residential floorspace.
    - discretionary
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036
source-text: 'For developments of: … 20 dwellings or more; … 500m2 or more of non-residential floorspace;
  or … any size in a location where construction activities are likely to have a significant impact on
  the adjacent or surrounding road network.'
confidence: medium
notes: From the council's list (published August 2021), page 9-10. Developments of any size where construction
  is likely to have a significant impact on the road network are shown as discretionary. Outline and reserved
  matters applications need the full-application documents for the matters considered at that stage ('as
  applicable').
review-status: unverified
field-status: {}
