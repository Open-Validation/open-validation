reference: telecommunications-report
local-authority: OXO
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: telecommunications-development
        value: true
        description: An application for full telecommunications approval.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Code of Best Practice on Mobile Phone Network Development
source-text: Telecommunications Development Statement All applications.
must-include:
- item: Alternative sites rejected, with the justification, including existing masts, structures and other
    buildings in the search area
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: 'Health and Radiation Impact Analysis: expected microwave and other radiation and how it relates
    to the ICNIRP guidelines'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: Map showing the site's relationship to schools and other telecommunication equipment nearby
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: Signed declaration that the equipment and installation fully complies with the ICNIRP requirements
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: Supplementary Information Template (Annex F of the Code of Best Practice on Mobile Phone Network
    Development)
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: Technical information including the frequency, modulation characteristics, power output and height
    of the proposed antenna
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
confidence: medium
notes: 'From the council''s list (published August 2021), page 34, 48-49, 61. Full telecommunications
  approval: Telecommunications Development Statement. Electronic communications prior notification: the
  separate items listed, all required.'
review-status: unverified
field-status: {}
