reference: recreation-facilities-assessment
local-authority: OXO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - open-space
        description: Development within open spaces.
    - condition:
        field: new-open-space
        value: true
        description: New open space is proposed.
source-url: https://www.oxford.gov.uk/downloads/file/1092/list-of-national-and-local-planning-application-requirements
policy: Oxford Local Plan 2036
source-text: For development within open spaces or with new open space proposed.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the application
    site
  level: must
confidence: medium
notes: From the council's list (published August 2021), page 12, 60. The council calls it an Open Space
  Assessment. Outline and reserved matters applications need the full-application documents for the matters
  considered at that stage ('as applicable').
review-status: unverified
field-status: {}
