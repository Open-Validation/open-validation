reference: photos
local-authority: RUT
required-if:
  all:
  - condition:
      field: openings-only
      value: true
      description: A window and door application (replacement windows, doors or roof lights only).
  - discretionary
source-url: https://www.rutland.gov.uk/sites/default/files/2023-12/Window%20and%20Door%20desired%20document%20guidance.odt
source-text: Photographs of existing instead of elevational drawing … If existing are modern, only photos
  required. If existing are historical, elevation drawings required. … Y Clear photos can be provided
  instead of existing elevational plans
must-include:
- item: Clear photographs of the existing windows/doors
  level: must
confidence: medium
notes: From the council's list (its 'Apply for planning permission' web page, checked 6 November 2026),
  'Window and Door Desired Document Requirements' (linked document, one page). For window and door applications,
  photos replace existing elevation drawings where the existing windows/doors are modern (and may always
  do so for a certificate of lawfulness); whether they are modern or historic is not a recorded field,
  so it shows as discretionary. Photos are also part of the Design and Access Statement and Heritage Impact
  Assessment checklists.
review-status: unverified
field-status: {}
