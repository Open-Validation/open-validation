reference: floor-plan-proposed
local-authority: RUT
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - full
      - pa-extension
  - all:
    - application-type:
        in:
        - ldc
        - approval-condition
    - discretionary
source-url: https://www.rutland.gov.uk/planning-building-control/planning/apply-planning-permission
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor plans (existing and proposed) | Yes … Specific to application … Existing and Proposed
  Floor Plans are required in order to demonstrate the proposed changes to the building and the impact
  the development will have on the outline and the internal layout
must-include:
- item: Each floor affected by the development (ground floor outline; first floor if affected); for a
    large building, enough floor area to show the impact
  level: must
- item: At a scale of 1:50 or 1:100
  level: must
- item: Internal layout
  level: must
- item: Adjacent buildings, if affected by the development
  level: must
- item: Position and size of all existing and proposed windows and doors
  level: must
- item: Matches the proposed elevations
  level: must
confidence: medium
notes: 'From the council''s list (its ''Apply for planning permission'' web page, checked 6 November 2026),
  Householder, Listed building, Full application and larger home extension tables; checklist from the
  linked ''Existing and Proposed Floor Plans Guidance'' sheet (one page). Sheet: https://www.rutland.gov.uk/sites/default/files/2022-11/Existing%20and%20Proposed%20Floor%20Plans%20Guidance.pdf.
  Certificates of lawful development and discharge of conditions: ''Specific to application'', so discretionary.
  For window and door applications the council''s separate ''Window and Door Desired Document Requirements''
  (https://www.rutland.gov.uk/sites/default/files/2023-12/Window%20and%20Door%20desired%20document%20guidance.odt)
  apply instead: photos can replace existing elevations where the existing windows/doors are modern, and
  floor plans are not needed if the position is clear from the elevations.'
review-status: unverified
field-status: {}
