reference: design-and-access-statement
local-authority: RUT
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Buildings (or a householder floor area increase) of 100 m2 or more.
  - all:
    - application-type:
        in:
        - lbc
        - approval-condition
    - discretionary
source-url: https://www.rutland.gov.uk/planning-building-control/planning/apply-planning-permission
confidence: medium
notes: 'From the audit (missing_requirement): householder only where the floor area increase is over 100
  m2 in a conservation area; full applications for buildings of 100 m2+, one or more dwellings in a conservation
  area, and major applications; listed building consent depending on complexity; discharge of conditions
  as specific to the condition.'
review-status: unverified
field-status: {}
