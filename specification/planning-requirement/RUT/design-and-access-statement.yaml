reference: design-and-access-statement
local-authority: RUT
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Increase in floor area over 100 square metres.
  - all:
    - application-type:
        in:
        - full
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            description: In a conservation area.
        - any:
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: Building(s) with floorspace of 100 square metres or more.
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
source-url: https://www.rutland.gov.uk/planning-building-control/planning/apply-planning-permission
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Only if increase in floor area over 100 metres squared in a conservation area … Yes (relevant
  to the complexity of the works) … Building(s) if the floorspace is 100 metres squared or more, one or
  more dwellings in a conservation area and major applications
must-include:
- item: Details of all proposed works
  level: must
- item: Why the works are being undertaken
  level: must
- item: The design principles taken into account
  level: must
- item: How access to the site has been taken into account, if applicable (for listed buildings, unless
    the works only affect the interior)
  level: must
- item: Photographs of the existing site and examples of the proposed works, if applicable
  level: must
- item: 'Listed buildings: how the design takes account of the building''s special architectural or historic
    importance, the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the council''s list (its ''Apply for planning permission'' web page, checked 6 November 2026),
  Householder, Listed building and Full application tables; checklist from the linked ''Design and Access
  Statements and Heritage Impact Assessments'' sheet (one page). Sheet: https://www.rutland.gov.uk/sites/default/files/2022-11/Possible%20Design%20and%20Access%20Statements%20-%20Heritage%20Impact%20Assessments.pdf.
  The Full application wording is read as the national rule (100 sq m or more of floorspace or one or
  more dwellings in a conservation area, or major development); read literally, the 100 sq m part might
  apply outside conservation areas too.'
review-status: unverified
field-status: {}
