source-url: https://www.rutland.gov.uk/planning-building-control/planning/apply-planning-permission
source-text: Sectional drawings (windows and doors) | Yes … If submitting an application for replacement
  windows, doors or roof lights for Listed Buildings, we will require cross sectional drawings and elevations.
must-include:
- item: Horizontal and vertical frame cross-sections of all new windows and doors at 1:5 or 1:2
  level: must
- item: Cross-section at 1:1 showing the glazing bar detail
