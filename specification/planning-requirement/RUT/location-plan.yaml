reference: location-plan
local-authority: RUT
required-if:
  application-type:
    in:
    - hh
    - consent-under-tpo
    - notice-trees-in-con-area
    - lbc
    - ldc
    - full
    - pa-extension
source-url: https://www.rutland.gov.uk/planning-building-control/planning/apply-planning-permission
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location plan | Yes … A location plan is needed so that the location of the application is
  clear.
must-include:
- item: To a scale of 1:1250 or 1:2500
  level: must
- item: Direction of north
  level: must
- item: Proposed development to scale
  level: must
- item: Proposed development (application site) clearly outlined in red
  level: must
- item: Other land in the applicant's ownership outlined in blue
  level: must
- item: Based on an up-to-date map, identifying sufficient roads and/or buildings on adjoining land to
    make the exact location clear
  level: should
confidence: medium
notes: 'From the council''s list (its ''Apply for planning permission'' web page, checked 6 November 2026),
  every table except Discharge of conditions (''Location plan: No''); checklist from the linked ''Location
  Plan Guidance'' sheet (one page). Sheet: https://www.rutland.gov.uk/sites/default/files/2022-11/Location%20Plan%20Guidance.docx'
review-status: unverified
field-status: {}
