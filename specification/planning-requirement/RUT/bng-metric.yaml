reference: bng-metric
local-authority: RUT
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.rutland.gov.uk/planning-building-control/planning/bng-biodiversity-net-gain
policy: Environment Act 2021
source-text: 'All planning applications not exempt from biodiversity net gain will need to submit the
  following additional documents (as a minimum) in order to validate the application: … A completed relevant
  biodiversity metric calculations sheet'
must-include:
- item: Sent as an XLS file, not XLSM
  level: must
- item: 'Major development: the statutory biodiversity metric'
  level: should
  required-if:
    ref: major-development
- item: 'Non-major development: the statutory metric or the small sites metric; the small sites metric
    is not used where priority habitats (excluding some hedgerows and arable field margins), protected
    sites or European protected species are present'
  level: must
confidence: medium
notes: 'From the council''s BNG page (checked 6 November 2026), ''Providing documentation with your application''.
  Rule follows the law: householder, permitted development, de minimis, self and custom build and the
  other listed exemptions are exempt; an exempt application must say on the form which exemption applies.'
review-status: unverified
