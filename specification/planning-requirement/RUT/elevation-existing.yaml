reference: elevation-existing
local-authority: RUT
required-if:
  any:
  - application-type:
      in:
      - hh
      - lbc
      - full
      - pa-extension
  - all:
    - application-type:
        in:
        - ldc
        - approval-condition
    - discretionary
source-url: https://www.rutland.gov.uk/planning-building-control/planning/apply-planning-permission
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Elevations (existing and proposed) | Yes … Specific to application … Existing and proposed
  Elevations are required in order to illustrate the changes which are proposed and the impact the development
  will have on the external appearance of the building.
must-include:
- item: Each affected elevation (north, south, east and west sides, if affected)
  level: must
- item: At a scale of 1:50 or 1:100
  level: must
- item: Position and size of all existing windows and doors
  level: must
- item: Adjacent buildings to scale, if affected by the development
  level: must
- item: Matches the existing floor plans
  level: must
- item: 'Listed building windows/doors: existing individual elevations of all affected windows and doors
    at 1:20'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: architectural-detailing
        value: true
        description: New or replacement windows, doors or roof lights.
confidence: medium
notes: 'From the council''s list (its ''Apply for planning permission'' web page, checked 6 November 2026),
  Householder, Listed building, Full application and larger home extension tables; checklist from the
  linked ''Existing and Proposed Elevational drawings Guidance'' sheet (one page). Sheets: https://www.rutland.gov.uk/sites/default/files/2022-11/Existing%20and%20Proposed%20Elevational%20drawings%20Guidance.pdf;
  https://www.rutland.gov.uk/sites/default/files/2026-03/Cross%20Sections%20and%20Drawings%20Required%20for%20Window%20and%20Doors.pdf.
  Certificates of lawful development and discharge of conditions: ''Specific to application'', so discretionary.
  For window and door applications the council''s separate ''Window and Door Desired Document Requirements''
  (https://www.rutland.gov.uk/sites/default/files/2023-12/Window%20and%20Door%20desired%20document%20guidance.odt)
  apply instead: photos can replace existing elevations where the existing windows/doors are modern, and
  floor plans are not needed if the position is clear from the elevations.'
review-status: unverified
field-status: {}
