reference: site-plan
local-authority: RUT
required-if:
  any:
  - application-type:
      in:
      - hh
      - ldc
      - full
      - pa-extension
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: Needed to show the position of external works (not for internal works only).
source-url: https://www.rutland.gov.uk/planning-building-control/planning/apply-planning-permission
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Block plan | Yes … Block Plan | Not if internal works only. Yes if required to show position
  of external works.
must-include:
- item: Ordnance Survey map of the site
  level: must
- item: To a scale of 1:500 or 1:200
  level: must
- item: Direction of north
  level: must
- item: Proposed development to scale, and its position on the site / on the building
  level: must
- item: Adjacent neighbours
  level: must
- item: Buildings and trees on the site
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: should
confidence: medium
notes: 'From the council''s list (its ''Apply for planning permission'' web page, checked 6 November 2026),
  Householder, Certificate of lawful development, Full application and larger home extension tables (''Block
  plan: Yes''), Listed building table; checklist from the linked ''Block Plan Guidance'' sheet (one page).
  The council calls it a Block Plan (aka Site Plan). Not needed for discharge of conditions. Sheet (dated
  6 November 2026): https://www.rutland.gov.uk/sites/default/files/2026-11/Block%20Plan%20Guidance.pdf'
review-status: unverified
field-status: {}
