reference: site-plan
local-authority: RUT
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - ldc
      - pa-extension
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: The listed building works include external works.
source-url: https://www.rutland.gov.uk/planning-building-control/planning/apply-planning-permission
confidence: medium
notes: 'From the audit (missing_requirement): a block plan is always required for householder and full
  applications, larger home extension prior approvals and lawful development certificates, and for listed
  building consent where there are external works.'
review-status: unverified
field-status: {}
