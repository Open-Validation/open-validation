reference: biodiversity-survey-report
local-authority: AMB
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      - national-nature-reserve
      description: The development is within a SSSI, Local Wildlife Site or nature reserve.
  - condition:
      field: protected-species
      value: true
      description: There is the potential for the presence of protected species.
  - condition:
      field: demolition
      value: true
      description: The development involves full or partial demolition of existing structures.
  - condition:
      field: involves-change-of-use
      value: true
      description: The development involves full or partial conversion of existing structures.
  - discretionary
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF; Wildlife and Countryside Act 1981; Protection of Badgers Act 1992; Amber Valley Borough
  Local Plan 2006 (saved policies) EN12 and EN13
source-text: All applications where the development is likely to have an adverse impact on biodiversity
  and protected species. … Where the development is located within a SSSI, Local Wildlife Site, nature
  reserve or there is the potential for the presence of protected species or the development involves
  full or partial demolition or conversion of existing structures or extensive vegetation clearance.
must-include:
- item: Survey work by a qualified ecologist at the appropriate time of year, time of day and/or night
    and on the required number of occasions for the species involved
  level: must
- item: The findings of the survey(s)
  level: must
- item: The nature and extent of any impact on biodiversity and/or protected species
  level: must
- item: Mitigating measures to be undertaken and compensation for any loss
  level: must
confidence: medium
notes: From the council's list (updated April 2012), page 1-2. Extensive vegetation clearance and other
  adverse impacts show as 'check'. The list cites saved policies of the 2006 Local Plan, since replaced
  by the Amber Valley Local Plan 2022-2040.
review-status: unverified
field-status: {}
