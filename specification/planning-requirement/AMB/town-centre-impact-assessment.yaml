reference: town-centre-impact-assessment
local-authority: AMB
required-if:
  any:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses that are not in a centre, including extensions to retail and
        leisure uses that exceed 200 sq m gross floorspace.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail and leisure developments over 2,500 sq m gross floorspace.
  - discretionary
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF; Amber Valley Borough Local Plan 2006 (saved policies) TC1 and TC2
source-text: Applications for retail and leisure uses where the proposals relate to development that falls
  under the criteria as detailed in the NPPF. Sequential Assessments are required for the development
  of main town centre uses that are not in a centre, including extensions to retail and leisure uses that
  exceed 200sqm gross floorspace. Impact assessments are required for retail and leisure developments
  over 2,500 sqm gross floorspace and for such developments below 2,500 sqm that would be likely to have
  a significant impact on other centres. … Impact assessments are also required for developments in an
  existing centre which would substantially increase the attraction of the centre to an extent that the
  development could have an impact on other centres.
must-include:
- item: 'Sequential assessment: the site assessed for availability, suitability and viability; all in-centre
    options assessed; that no town centre site could accommodate the development; flexibility'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses that are not in a centre, including extensions to retail and
        leisure uses that exceed 200 sq m gross floorspace.
- item: Impact assessment focused on the first 5 years after implementation, proportionate to the scale
    and nature of the proposal, with transparent, justified, realistic and consistent assumptions
  level: should
confidence: medium
notes: From the council's list (updated April 2012), page 13-14. Listed as 'Retail Impact Assessment'
  (sequential and impact assessments). Smaller schemes likely to have a significant impact, and in-centre
  schemes that would substantially increase a centre's attraction, show as 'check'. The list cites saved
  policies of the 2006 Local Plan, since replaced by the Amber Valley Local Plan 2022-2040.
review-status: unverified
field-status: {}
