reference: archaeological-assessment
local-authority: AMB
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      - archaeological-priority-area
      - historic-environment-record
      description: The site includes heritage assets with archaeological interest.
  - discretionary
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF; Amber Valley Borough Local Plan 2006 (saved policies) EN23 to EN33
source-text: Where an application site includes, or has the potential to include, heritage assets with
  archaeological interest an appropriate desk based assessment and, where necessary a field evaluation
  will be required.
must-include:
- item: An appropriate desk based assessment
  level: must
- item: A field evaluation, where necessary
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated April 2012), page 6-7. Part of the Heritage Statement item. Sites
  with 'potential' for archaeological interest show as 'check'; applicants should contact the county's
  Development Control Archaeologist at pre-application stage. The list cites saved policies of the 2006
  Local Plan, since replaced by the Amber Valley Local Plan 2022-2040.
review-status: unverified
