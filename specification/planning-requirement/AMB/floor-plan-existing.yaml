notes: From the council's 'Application for planning permission' checklist (undated; PDF created February
  2011), linked from its validation page. Listed under 'other plans and drawings or information necessary
  to describe the subject of the application'; the householder and reserved matters checklists list the
  same plans. The 2012 list's 'Other Plans' item (page 11) adds that, for all operational development,
  other plans are 'likely to include' these depending on the nature and scale of the proposal, and that
  all plans should be to scale.
