reference: design-and-access-statement
local-authority: AMB
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with floorspace of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=6ab8827d824c4be18ea378a8714c34fc
policy: Town and Country Planning (Development Management Procedure) (England) Order
source-text: Design and access statement, if required
confidence: medium
notes: From the council's 'Application for planning permission' checklist (undated; PDF created February
  2011), linked from its validation page. The checklist says only 'if required', so the national rule
  is shown (major development; one or more dwellings or 100 sq m or more in a conservation area; listed
  building consent).
review-status: unverified
field-status: {}
