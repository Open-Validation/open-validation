reference: recreation-facilities-assessment
local-authority: AMB
required-if:
  condition:
    field: loss-of-open-space
    value: true
    description: Loss of existing playing fields, parks or informal open spaces.
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF; Amber Valley Borough Local Plan 2006 (saved policies) LC3
source-text: All applications where the proposals involve the loss of existing playing fields, parks and
  informal open spaces. … Development proposals on existing playing fields, parks and informal open spaces.
must-include:
- item: That there is no demand for their continued use, currently or in the foreseeable future, or that
    they will be replaced by alternative facilities at least as accessible and at least equivalent in
    size, usefulness, attractiveness and quality
  level: must
confidence: medium
notes: From the council's list (updated April 2012), page 10. Listed as 'Open Space Assessment'. The list
  cites saved policies of the 2006 Local Plan, since replaced by the Amber Valley Local Plan 2022-2040.
