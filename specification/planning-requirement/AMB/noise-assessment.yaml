reference: noise-assessment
local-authority: AMB
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Sensitive development proposals (i.e. residential) located adjacent to existing sources
        of noise pollution.
  - discretionary
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF; Amber Valley Borough Local Plan 2006 (saved policies) EN16
source-text: All applications where the proposals are either are likely to result in a material increase
  in the levels of noise pollution of an area as a result of the development or for developments that
  would be located adjacent to existing sources of noise pollution. … Sensitive development proposals
  (i.e. residential) that would be located adjacent to existing sources of noise pollution.
must-include:
- item: Existing noise levels from all sources and likely future predicted noise levels
  level: must
- item: Modelling of noise levels expected as a result of the development
  level: must
- item: Where appropriate, mitigation measures to reduce noise levels or the impact of existing noise
    to appropriate levels
  level: should
confidence: medium
notes: From the council's list (updated April 2012), page 9. A material increase in noise shows as 'check'.
  The list cites saved policies of the 2006 Local Plan, since replaced by the Amber Valley Local Plan
  2022-2040.
review-status: unverified
field-status: {}
