reference: environmental-statement
local-authority: AMB
required-if:
  condition:
    field: eia-development
    value: true
    description: Development under Schedule 1 of the EIA Regulations, or Schedule 2 development likely
      to have a significant impact on the environment.
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2011; Circular 02/99
source-text: All applications where the development is likely to have a significant impact on the environment.
  … All major development proposals that fall under Schedule 1 of the stated legislation and possibility
  for development that falls under Schedule 2 of the stated legislation. Where such development falls
  under Schedule 2 a screening opinion should first be sought.
must-include:
- item: Survey work by a suitably qualified or competent person, at the appropriate time of year and on
    the required occasions where necessary
  level: must
- item: The findings of the survey(s), the nature and extent of any impact on the environment, and the
    mitigating and compensating measures
  level: must
- item: Comprehensive coverage of all issues identified in the scoping process (a scoping opinion should
    be sought)
  level: should
confidence: medium
notes: From the council's list (updated April 2012), page 3-4. Listed as 'Environmental Impact Assessment'.
  The list cites the 2011 EIA Regulations, since replaced by the 2017 Regulations.
review-status: unverified
field-status: {}
