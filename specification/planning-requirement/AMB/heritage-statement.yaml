reference: heritage-statement
local-authority: AMB
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - scheduled-monument
    - park-and-garden
    - locally-listed-building
    - world-heritage-site
    description: The development is located within or adjacent to a heritage asset.
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF; Amber Valley Borough Local Plan 2006 (saved policies) EN23 to EN33
source-text: All applications where the development is likely to have an impact (positive or negative)
  on a heritage asset or it’s setting. … Where the development is located within or adjacent to a Heritage
  Asset.
must-include:
- item: Description of the significance of the heritage assets affected and the contribution of their
    setting to that significance
  level: must
- item: Consultation of the Derbyshire Historic Environment Record (HER)
  level: must
- item: Assessment of the heritage assets using appropriate expertise where necessary
  level: should
confidence: medium
notes: From the council's list (updated April 2012), page 6-7. For minor development the list says the
  assessment can be within the Design and Access Statement. The list cites saved policies of the 2006
  Local Plan, since replaced by the Amber Valley Local Plan 2022-2040.
review-status: unverified
field-status: {}
