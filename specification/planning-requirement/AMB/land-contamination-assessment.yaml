reference: land-contamination-assessment
local-authority: AMB
required-if:
  site:
    in:
    - contaminated-land
    description: Land that may be contaminated as a result of previous or historic uses, or by such uses
      on adjacent land.
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF; Amber Valley Borough Local Plan 2006 (saved policies) EN18
source-text: All applications for proposals that involve the development on land that may be contaminated
  as a result of previous or historic uses, or by such uses on adjacent land. … When the application site
  may be contaminated as a result of previous or historic uses, or by such uses on adjacent land.
must-include:
- item: The potential for contamination in relation to the existing use and circumstances of the land
    and the proposed new use
  level: must
- item: The possibility of finding contamination during the development
  level: must
- item: Proper assessment of the potential for contamination and any risks, with any necessary remediation
    and management measures
  level: should
confidence: medium
notes: From the council's list (updated April 2012), page 7. The list cites saved policies of the 2006
  Local Plan, since replaced by the Amber Valley Local Plan 2022-2040.
review-status: unverified
field-status: {}
