reference: arboriculturist-report
local-authority: AMB
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: Sites affected by Tree Preservation Orders.
  - condition:
      field: tree-removal
      value: true
      description: Loss of existing trees.
  - condition:
      field: hedgerows-affected
      value: true
      description: Loss of or potential damage to existing hedgerows.
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees located within or immediately adjacent to the site.
    - discretionary
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF; Amber Valley Borough Local Plan 2006 (saved policies) EN8 and EN9; Trees and Development
  SPD Note
source-text: All applications where the proposals are likely to result in the loss of or potential damage
  to existing trees or hedgerows or on sites affected by Tree Preservation Orders. … Where trees or hedgerows
  are located either within or immediately adjacent to the site.
must-include:
- item: A survey of all existing trees and hedgerows on and adjacent to the site
  level: must
- item: An assessment of the expected impact of the development on these features
  level: must
- item: A scheme for replacement planting, if appropriate
  level: should
- item: A plan identifying the location of all the assessed landscape features
  level: should
- item: Work undertaken by a qualified arboriculturist
  level: should
confidence: medium
notes: From the council's list (updated April 2012), page 18. Listed as 'Tree Survey / Arboricultural
  Report'. Potential damage to trees on or next to the site shows as 'check'. The list cites saved policies
  of the 2006 Local Plan, since replaced by the Amber Valley Local Plan 2022-2040.
review-status: unverified
field-status: {}
