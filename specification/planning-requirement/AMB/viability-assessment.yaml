reference: viability-assessment
local-authority: AMB
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: It is not intended to enter into planning obligations at the level indicated within the
      relevant saved local plan policies.
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF; CIL Regulations; Corporate Viability Policy
source-text: All applications where it is not intended to enter into planning obligations at the level
  indicated within the relevant saved local plan policies.
must-include:
- item: Evidence of the impact of full provision on the viability of the development
  level: must
- item: Submitted in accordance with the Council's Corporate Viability Policy
  level: should
- item: Undertaken by an independent expert, with sensitivity testing
  level: should
- item: A policy compliant scheme assessed first, with further assessments as necessary
  level: must
confidence: medium
notes: From the council's list (updated April 2012), page 19. The list says the applicant should fund
  the assessment. The list cites saved policies of the 2006 Local Plan, since replaced by the Amber Valley
  Local Plan 2022-2040.
