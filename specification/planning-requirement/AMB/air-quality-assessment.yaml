reference: air-quality-assessment
local-authority: AMB
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: The development is located in or adjacent to an Air Quality Management Area (AQMA).
  - discretionary
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF; Amber Valley Borough Local Plan 2006 (saved policies) EN16
source-text: All applications that could have a significant adverse impact upon existing levels of air
  quality or when the proposal would be exposed to poor levels of air quality. … Where the development
  is located in or adjacent to any Air Quality Management Areas (AQMAs) or other areas where air quality
  is likely to be poor or when the proposal is likely to have a significant adverse impact upon existing
  levels of air quality where the development in itself could result in the designation of an AQMA.
must-include:
- item: Assessment of existing air quality
  level: must
- item: Modelling of the air quality impact of the proposed use
  level: must
- item: Where appropriate, mitigation measures to reduce air pollution or the impact of poor air quality
    on the proposed use
  level: should
confidence: medium
notes: From the council's list (updated April 2012), page 1. Shown partly as 'check' because the other
  triggers depend on a judgement of significant impact or poor air quality. The list cites saved policies
  of the 2006 Local Plan, since replaced by the Amber Valley Local Plan 2022-2040.
review-status: unverified
field-status: {}
