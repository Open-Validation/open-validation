reference: flood-risk-assessment
local-authority: AMB
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: 'Flood Zone 1: operational development of 1 hectare or greater.'
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: 'Flood Zone 1: operational development of 1 hectare or greater.'
  - all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3 (a and b).
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
  - condition:
      field: watercourse-culverting
      value: true
      description: Culverting or control of flow of any river or stream (all operational development).
source-url: https://info.ambervalley.gov.uk/docarc/docviewer.aspx?docGuid=e517c87aff3c4a37a58c135887d836f1
policy: NPPF and its Technical Guidance; Amber Valley Borough Local Plan 2006 (saved policies) EN15
source-text: All applications, in accordance with PPS25, where the proposed development is likely to have
  an impact on flood risk. … - Flood Zone 1 - operation development of 1 hectare or greater - Flood Zone
  2 & 3 – all scales of operational development except householder development and non residential extensions
  with a footprint of less than 250 square metres, and - Culverting or control flow of any river or stream
  – all operational development.
must-include:
- item: Assessment of the risks of all forms of flooding to and from the development, taking climate change
    into account, to inform the sequential approach
  level: must
- item: Measures to mitigate any impact
  level: must
- item: The consideration and incorporation of sustainable drainage systems (SUDS)
  level: must
- item: 'Within Flood Zones 2 and 3, for operational development (except householder development and non-residential
    extensions under 250 sq m footprint) and all changes of use to a more vulnerable use: information
    showing the site has been sequentially tested in line with the EA''s Sequential Test Standing Advice
    and the NPPF'
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: In Flood Zone 2 or 3 (a and b).
    - any:
      - application-type:
          in:
          - full
          - outline
          - reserved-matters
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: Change of use to a more vulnerable use.
- item: 'Where needed only because of culverting or flow control: design details of the culvert or flow
    control structure'
  level: must
  required-if:
    condition:
      field: watercourse-culverting
      value: true
      description: Culverting or flow control.
confidence: medium
notes: From the council's list (updated April 2012), page 4-5. Non-residential extensions with a footprint
  under 250 sq m in Flood Zones 2 and 3 are exempt (no field for this, so check the footprint). The householder
  checklist (2011) also names a flood risk assessment 'e.g. for applications in Environment Agency Flood
  Zone relating to basements or rear extensions', but the 2012 list excludes householder development.
  The list cites saved policies of the 2006 Local Plan, since replaced by the Amber Valley Local Plan
  2022-2040.
review-status: unverified
field-status: {}
