source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies C3
source-text: To be provided with any application for development that could have significant transport
  implications.
must-include:
- item: Level of detail reflecting the scale of the project
  level: should
- item: The transport aspects of the application
  level: must
- item: Accessibility of the site by all modes of transport
  level: must
  required-if: discretionary
- item: Likely modal split of journeys to and from the site
  level: must
  required-if: discretionary
- item: Proposed measures to improve access by public transport, walking and cycling
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 54. Listed in
  the checklists for: outline, reserved matters, full, technical details consent and prior approval (change
  of use, new development, temporary use; as ''Transport Statement/ Assessment''). ''Significant transport
  implications'' is a judgement, so discretionary.'
