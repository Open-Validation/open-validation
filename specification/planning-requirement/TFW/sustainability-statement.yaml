reference: sustainability-statement
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - hh
      - outline
      - reserved-matters
      - full
      - technical-details-consent
  - any:
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use of a building.
    - condition:
        field: new-build
        value: true
        description: New development.
    - condition:
        field: building-works
        value: true
        description: New development (works).
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies NE 1, ER 1
source-text: To be provided where the proposal includes the change of use of a building and/or new development.
must-include:
- item: The council's Climate Change Checklist, completed
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 39. Listed in
  the checklists for: householder, outline, reserved matters, full, technical details consent. The local
  document is the ''Climate Change Checklist'' (a council template).'
review-status: unverified
field-status: {}
