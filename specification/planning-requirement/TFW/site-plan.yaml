reference: site-plan
local-authority: TFW
required-if:
  application-type:
    in:
    - hh
    - outline
    - reserved-matters
    - full
    - technical-details-consent
    - lbc
    - demolition-con-area
    - ldc-existing-use
    - ldc-prospective-use
    - pa-extension
    - pa-storey
    - pa-flats-de-blocks
    - pa-flats-de-comm
    - pa-flats-terr-comm
    - pa-flats-de-dwh
    - pa-flats-terr-dwh
    - pa-build-agri-forest
    - pa-ecomms-network
    - pa-tmp-school-vacant-comm
    - pa-tmp-use-comm-film
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Site Layout Plans or Block Plans should: Be at an identified standard metric scale, usually
  1:500 or 1:200;'
must-include:
- item: At an identified standard metric scale, usually 1:500 or 1:200
  level: must
- item: A North point and a scale bar
  level: must
- item: The proposed development in relation to the site boundaries, including the connection to the adopted
    highway within the red line, and other existing buildings on site, with dimensions including those
    to the boundaries
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: Position of all trees on the site and on adjacent land
  level: should
- item: Extent and type of any hard surfacing
  level: should
- item: Boundary treatment, including walls or fencing, where proposed
  level: must
- item: 'Lawful development certificates: the site layout prior to development and as built (existing
    use) or existing and proposed (proposed use)'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
confidence: medium
notes: From the council's list (April 2026), page 33. The 'should' items are marked '(where appropriate)'
  in the list. Listed in the householder, outline, reserved matters, full, technical details consent,
  listed building, relevant demolition, LDC and prior approval (new development, temporary use) checklists.
review-status: unverified
field-status: {}
