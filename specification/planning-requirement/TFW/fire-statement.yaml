reference: fire-statement
local-authority: TFW
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Relevant buildings are those which: contain two or more dwellings or educational accommodation
  and meet the height condition of 18m or more in height, or 7 or more storeys'
confidence: medium
notes: From the council's list (April 2026), pages 34-35. Covers new relevant buildings, development of
  an existing relevant building, or development in its curtilage. In the full, reserved matters, technical
  details consent and prior approval (new development) checklists.
review-status: unverified
field-status: {}
