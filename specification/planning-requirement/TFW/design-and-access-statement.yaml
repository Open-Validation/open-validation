reference: design-and-access-statement
local-authority: TFW
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - listed-building
      description: The development is a listed building.
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Within a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Floor space created of 100 square metres or more.
source-url: https://www.telford.gov.uk/planning-and-building-control/planning-applications-and-advice-appeals-enforcement-and-guidance/what-you-need-to-submit-with-your-planning-application/
source-text: 'Design and access statements are required for planning applications where the development:
  is major development is a listed building is within a conservation area or World Heritage Site and is
  for one or more dwellings or for building or buildings where the floor space created is 100 square metres
  or more.'
confidence: medium
notes: 'The council''s page restates the national rule (audit: a national, not local, requirement).'
review-status: unverified
field-status: {}
