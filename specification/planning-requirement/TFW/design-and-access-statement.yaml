reference: design-and-access-statement
local-authority: TFW
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: A designated area (such as a conservation area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Floor space created of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; National Planning
  Practice Guidance
source-text: 'Design and Access Statements are required to be submitted with the following types of application:
  The development is a major development; or The development is in a designated area (such as a conservation
  area) where the proposed development consists of the following: The provision of one or more dwellinghouses;
  or The provision of a building or buildings where the floor space created by the development is 100
  square metres or more; or Applications for listed building consent.'
confidence: medium
notes: From the council's list (April 2026), page 34.
review-status: unverified
field-status: {}
