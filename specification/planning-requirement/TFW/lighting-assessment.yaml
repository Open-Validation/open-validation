reference: lighting-assessment
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - outline
      - reserved-matters
      - full
      - technical-details-consent
      - advertising
  - condition:
      field: external-lighting
      value: true
      description: External lighting provided or made necessary by the development.
  - any:
    - condition:
        field: adjoins-residential-property
        value: true
        description: In the vicinity of residential property.
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        description: In the vicinity of a listed building or a conservation area.
    - condition:
        field: outside-urban-area
        value: true
        description: Open countryside.
    - discretionary
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies BE 1
source-text: To be provided where external lighting would be provided or made necessary by the development
  where proposals involve the provision of publicly accessible developments, in the vicinity of residential
  property, a listed building or a conservation area, or open countryside.
must-include:
- item: A layout plan with beam orientation
  level: must
- item: A schedule of equipment in the design
  level: must
- item: Details of the proposed lighting
  level: must
- item: Proposed hours when the lighting would be switched on
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 46. Listed in
  the checklists for: outline, reserved matters, full, technical details consent and advertisement. ''Publicly
  accessible developments'' shows as discretionary.'
review-status: unverified
field-status: {}
