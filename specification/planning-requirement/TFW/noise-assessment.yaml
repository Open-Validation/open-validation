reference: noise-assessment
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - outline
      - reserved-matters
      - full
      - technical-details-consent
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
      - pa-extension
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-de-dwh
      - pa-flats-terr-dwh
      - pa-build-agri-forest
      - pa-ecomms-network
      - pa-tmp-school-vacant-comm
      - pa-tmp-use-comm-film
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Development that raises issues of noise disturbance to occupants of nearby buildings.
    - all:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Noise-sensitive development.
      - discretionary
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies EC 6, BE 1, BE 2, ER 1, ER 6
source-text: To be provided with applications for developments that raise issues of disturbance by noise
  to the occupants of nearby existing buildings, and for developments that are considered to be noise
  sensitive and which are close to existing sources of noise.
must-include:
- item: Current noise conditions (background and cumulative noise levels)
  level: must
- item: Proposed noise levels
  level: must
- item: Any proposed measures to reduce noise
  level: must
- item: System specification of any proposed equipment
  level: must
- item: Recommended mitigation
  level: must
  required-if: discretionary
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 47. Listed in
  the checklists for: outline, reserved matters, full, technical details consent and prior approval (change
  of use, new development, temporary use). Whether a site is ''close to existing sources of noise'' is
  a judgement, so discretionary.'
review-status: unverified
field-status: {}
