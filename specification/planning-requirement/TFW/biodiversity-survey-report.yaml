reference: biodiversity-survey-report
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - hh
      - outline
      - reserved-matters
      - full
      - technical-details-consent
      - lbc
      - demolition-con-area
      - advertising
      - hedgerow-removal
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
      - pa-extension
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-de-dwh
      - pa-flats-terr-dwh
      - pa-build-agri-forest
      - pa-ecomms-network
      - pa-tmp-school-vacant-comm
      - pa-tmp-use-comm-film
  - any:
    - condition:
        field: protected-species
        value: true
        description: Protected species may be affected.
    - discretionary
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies NE1, NE 2
source-text: To be provided where a proposed development may have an impact on wildlife, habitats and
  biodiversity.
must-include:
- item: A Preliminary Ecological Appraisal or Ecological Impact Assessment and associated detailed species
    surveys by an experienced, appropriately licensed ecologist in line with national guidance
  level: must
- item: A UKHabitats habitat map of the site
  level: must
- item: Potential impacts on existing biodiversity, including works such as demolition, engineering and
    construction
  level: must
- item: Any mitigation and/or compensation measures
  level: must
- item: 'Where European Protected Species are present: the approach to licensing, mitigation shown on
    site plans and reasonable avoidance measures'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: European Protected Species present.
- item: 'Where designated sites are affected: proposals to avoid harm'
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: Development affects internationally, nationally or locally designated sites.
- item: Long-term maintenance and management of landscaping and habitats provided or kept on site
  level: must
  required-if: discretionary
- item: Report less than 24 months old (18-24 months subject to an ecologist's judgement)
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 38. Listed in
  the checklists for: householder, outline, reserved matters, full, technical details consent, listed
  building, relevant demolition, advertisement with listed building consent, hedgerow removal and prior
  approval (change of use, new development, temporary use). ''May have an impact'' is a judgement, so
  discretionary. The council may also ask for the statutory metric for BNG-exempt development.'
review-status: unverified
field-status: {}
