source-text: To be provided with any application for development that could have significant transport
  implications.
must-include:
- item: Evaluation of benchmark travel data, including trip generation
  level: must
- item: Impact of the development, including trip generation
  level: must
- item: Existing travel habits in the surrounding area
  level: must
- item: Proposals to reduce the need for travel
  level: must
- item: Proposed improvements to public transport services
  level: must
