reference: elevation-existing
local-authority: TFW
required-if:
  any:
  - application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
      - advertising
  - all:
    - application-type:
        in:
        - hh
        - outline
        - reserved-matters
        - full
        - technical-details-consent
        - lbc
        - demolition-con-area
        - pa-extension
        - pa-storey
        - pa-flats-de-blocks
        - pa-flats-de-comm
        - pa-flats-terr-comm
        - pa-flats-de-dwh
        - pa-flats-terr-dwh
        - pa-build-agri-forest
        - pa-ecomms-network
        - pa-tmp-school-vacant-comm
        - pa-tmp-use-comm-film
    - any:
      - condition:
          field: new-build
          value: true
          description: New buildings.
      - condition:
          field: external-alterations
          value: true
          description: External alterations.
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Elevation drawings should: Be at a scale of 1:50 or 1:100; Include a scale bar; Include
  all affected existing elevations; Include all affected proposed elevations including any blank elevations;'
must-include:
- item: At a scale of 1:50 or 1:100, with a scale bar
  level: must
- item: All affected existing and proposed elevations, including any blank elevations
  level: must
- item: Proposed building materials and finish, including windows and doors
  level: should
- item: Where an elevation adjoins or is close to another building, the relationship between the buildings
    and the positions of openings on each property
  level: should
confidence: medium
notes: From the council's list (April 2026), page 33. 'Detailed drawings e.g elevations (where applicable)'
  is in the householder, full, reserved matters, technical details consent, listed building, relevant
  demolition and prior approval checklists; the outline checklists list it without '(where applicable)';
  LDCs need elevations prior to development and as built (existing) or existing and proposed (proposed);
  advertisement consent lists a detailed drawing as a local requirement.
review-status: unverified
field-status: {}
