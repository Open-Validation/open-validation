reference: land-contamination-assessment
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - outline
      - reserved-matters
      - full
      - technical-details-consent
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
      - pa-extension
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-de-dwh
      - pa-flats-terr-dwh
      - pa-build-agri-forest
      - pa-ecomms-network
      - pa-tmp-school-vacant-comm
      - pa-tmp-use-comm-film
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known.
    - discretionary
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies BE 10
source-text: To be provided where contamination is known or suspected.
must-include:
- item: Proportionate but sufficient site investigation information (a risk assessment) by a competent
    person
  level: must
- item: The nature and extent of contamination, and the risks it may pose and to which receptors
  level: must
- item: Potential sources, pathways and receptors, with the risks evaluated
  level: must
- item: Any remediation or site investigation required
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 44. Listed in
  the checklists for: outline, reserved matters, full, technical details consent and prior approval (change
  of use, new development, temporary use). ''Suspected'' contamination is a judgement, so discretionary.'
review-status: unverified
field-status: {}
