policy: Telford & Wrekin Local Plan policies BE 1
source-text: To be provided where there is potential adverse impact upon the current levels of sunlight/daylight
  enjoyed by adjoining properties or buildings including amenity space. It is also recommended that a
  Daylight/sunlight assessment is provided where new dwellings are proposed.
must-include:
- item: Current daylight/sunlight levels (only where there are adjacent properties)
  level: must
  required-if: discretionary
- item: Drawings showing the impact on neighbouring properties' daylight/sunlight
  level: must
  required-if: discretionary
- item: Drawings showing daylight/sunlight levels on site
  level: must
  required-if: discretionary
confidence: medium
