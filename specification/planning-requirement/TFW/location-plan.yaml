source-text: 'Site Location Plans should: Be at a scale of 1:1250 or 1:2500 and scaled to A4 or A3 paper
  size;'
must-include:
- item: At a scale of 1:1250 or 1:2500, scaled to A4 or A3 paper size
  level: must
- item: A North point and a scale bar
  level: must
- item: Enough roads and/or buildings on adjoining land, including at least two street names
  level: must
- item: All land needed to carry out the development edged with a red line
  level: must
- item: Any other land owned by the applicant close to or adjoining the site edged with a blue line
  level: must
- item: 'Advertisement consent: the position of the advertisements'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Site Location Plan showing position of the advertisements
