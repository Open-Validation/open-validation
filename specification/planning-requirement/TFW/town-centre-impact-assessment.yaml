reference: town-centre-impact-assessment
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - outline
      - reserved-matters
      - full
      - technical-details-consent
  - any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 0
        description: A town centre use is proposed.
    - condition:
        field: loss-of-use
        value: true
        description: Loss of a town centre use.
  - discretionary
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies EC 5, EC 6, EC 7, EC 8
source-text: To be provided with applications proposing a town centre use, or the loss of a town centre
  use (where required by the Local Plan).
must-include:
- item: Details of the proposed use
  level: must
- item: Sequential Test (where applicable under policy EC 8)
  level: must
  required-if: discretionary
- item: Retail Impact Assessment (where applicable under the local thresholds in policy EC 8)
  level: must
  required-if: discretionary
- item: Appropriate marketing information
  level: must
  required-if: discretionary
- item: Assessment of impact on the town centre
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 54. Listed in
  the checklists for: outline, reserved matters, full, technical details consent. ''Where required by
  the Local Plan'' is discretionary; the list does not repeat the EC 8 thresholds.'
review-status: unverified
field-status: {}
