reference: floor-plan-proposed
local-authority: TFW
required-if:
  any:
  - application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - hh
        - outline
        - reserved-matters
        - full
        - technical-details-consent
        - lbc
        - demolition-con-area
        - pa-extension
        - pa-storey
        - pa-flats-de-blocks
        - pa-flats-de-comm
        - pa-flats-terr-comm
        - pa-flats-de-dwh
        - pa-flats-terr-dwh
        - pa-build-agri-forest
        - pa-ecomms-network
        - pa-tmp-school-vacant-comm
        - pa-tmp-use-comm-film
        - cho-agri-to-dwh
        - cho-commercial-to-dwh
        - cho-commercial-to-mixed
        - cho-sui-to-dwh
        - cho-agri-to-flexcom
        - cho-agri-to-school
        - cho-comm-to-school
        - cho-amusements-to-dwh
    - any:
      - condition:
          field: floorspace-change
          value: true
          description: New or changed floorspace.
      - condition:
          field: floor-layout-change
          value: true
          description: Changes to the floor layout.
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use (prior approval).
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Floor Plans should: Include roof plans (where appropriate); Be at a scale of 1:50 or 1:100;
  Include a scale bar; Include existing and proposed floor plans;'
must-include:
- item: At a scale of 1:50 or 1:100, with a scale bar
  level: must
- item: Existing and proposed floor plans
  level: must
- item: Any proposed demolition, including existing buildings or walls, clearly indicated
  level: must
- item: New buildings in context with adjacent building(s), including property numbers or names
  level: should
- item: Roof plans where appropriate
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (April 2026), page 33. Part of 'Detailed drawings'; the prior approval
  change of use checklist lists 'Detailed drawings e.g floor plans'.
review-status: unverified
field-status: {}
