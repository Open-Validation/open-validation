reference: sustainable-drainage-strategy
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - outline
      - reserved-matters
      - full
      - technical-details-consent
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Employment development.
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies ER 12; Telford & Wrekin SuDS handbook
source-text: To be provided with proposals for residential or employment development.
must-include:
- item: The relevant council proforma for Major or Minor Surface Water Drainage, completed
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 53. Listed in
  the checklists for: outline, reserved matters, full, technical details consent. The local document is
  the council''s SuDS proforma; the id is MHCLG''s retired SuDS id.'
review-status: unverified
field-status: {}
