reference: arboriculturist-report
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - hh
      - outline
      - reserved-matters
      - full
      - technical-details-consent
      - demolition-con-area
      - hedgerow-removal
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees, hedgerows or woodland on or close to the site likely to influence or be affected
          by the development.
    - condition:
        field: hedgerows-affected
        value: true
        description: Hedgerows on or close to the site affected.
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies NE 1, NE 2; BS5837
source-text: To be provided with all planning applications where trees, hedgerows or woodlands are either
  present on the proposal site or are in close proximity to it and are likely to influence or be affected
  by the development.
must-include:
- item: Shadowing Plan showing the impact of trees on the development
  level: must
- item: Identification of all trees/hedgerows/woodland and an assessment of their condition
  level: must
- item: Description of works for each tree/hedgerow/woodland
  level: must
- item: Information on trees to be retained and their protection during construction
  level: must
- item: Hedgerow Assessment under the Hedgerow Regulations (1997)
  level: must
  required-if:
    condition:
      field: hedgerows-affected
      value: true
      description: Hedgerow removal is proposed.
- item: Evidence supporting the removal of trees protected by a TPO
  level: must
  required-if:
    all:
    - site:
        in:
        - tree-preservation-zone
        description: TPO trees.
    - condition:
        field: tree-removal
        value: true
        description: Trees to be removed.
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 55. Listed in
  the checklists for: householder, outline, reserved matters, full, technical details consent, relevant
  demolition and hedgerow removal.'
review-status: unverified
field-status: {}
