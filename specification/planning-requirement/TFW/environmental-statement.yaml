reference: environmental-statement
local-authority: TFW
required-if:
  condition:
    field: eia-development
    value: true
    description: EIA development under the 2017 EIA Regulations.
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017; Telford & Wrekin
  Local Plan policies NE 1, BE 1, BE 10
source-text: The Town and Country Planning (Environmental Impact Assessment) Regulations 2017 sets out
  the circumstances in which an Environmental Impact Assessment (EIA) is required.
must-include:
- item: 'A description of the development: site, design, size and other relevant features'
  level: must
- item: A description of the likely significant effects on the environment
  level: must
- item: Features or measures to avoid, prevent, reduce and if possible offset significant adverse effects
  level: must
- item: The reasonable alternatives studied and the main reasons for the option chosen
  level: must
- item: A non-technical summary
  level: must
- item: Any additional Schedule 4 information relevant to the development, meeting regulation 18(4) and
    (5)
  level: must
confidence: medium
notes: From the council's list (April 2026), page 34. In the outline, full and technical details consent
  checklists (national) and the reserved matters checklist (local).
