- item: At a scale of 1:50 or 1:100, with a scale bar
  level: must
- item: Cross section(s) through the proposed building(s)
  level: must
- item: Existing and finished ground levels, including how the proposal sits within the site and the relative
    levels of existing and proposed buildings
  level: must
  required-if:
    condition:
