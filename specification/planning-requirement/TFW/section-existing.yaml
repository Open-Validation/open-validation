policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Sectional drawings should: Be at a scale of 1:50 or 1:100; Include a scale bar; Include
  cross section(s) through the proposed building(s); and Include existing and finished ground levels where
  the proposal involves changes in levels'
