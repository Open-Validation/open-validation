reference: photos
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - hh
      - outline
      - reserved-matters
      - full
      - technical-details-consent
      - lbc
      - demolition-con-area
      - advertising
      - consent-under-tpo
      - notice-trees-in-con-area
      - hedgerow-removal
  - any:
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolishing an existing building.
    - site:
        in:
        - conservation-area
        - listed-building
        description: Development affecting a conservation area or a listed building.
    - discretionary
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies BE 1
source-text: It is recommended that all applications for development are accompanied by photographs. Photographs/photomontages
  should be provided if the proposal involves the demolition of an existing building or development affecting
  a conservation area or a listed building.
must-include:
- item: All views where the proposal is or will be publicly visible
  level: must
- item: The existing site and buildings
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 50. Listed in
  the checklists for: householder, outline, reserved matters, full, technical details consent, listed
  building, relevant demolition, advertisement, tree works and hedgerow removal. Recommended for all development,
  so otherwise discretionary.'
review-status: unverified
field-status: {}
