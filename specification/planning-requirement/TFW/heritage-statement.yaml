reference: heritage-statement
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - hh
      - outline
      - reserved-matters
      - full
      - technical-details-consent
      - lbc
      - demolition-con-area
      - advertising
  - any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - conservation-area
        - park-and-garden
        - world-heritage-site
        description: Within a conservation area, a registered park or garden or World Heritage Site.
    - site:
        in:
        - locally-listed-building
        - historic-environment-record
        description: Affecting a building of local interest or non-designated heritage asset, including
          those of archaeological potential.
    - site:
        in:
        - listed-building-setting
        description: Would affect the setting of a designated or non-designated heritage asset.
    - discretionary
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies BE 3, BE 4, BE 5, BE 6, BE 7, BE 8
source-text: To be provided for all applications for listed building consent; for all planning applications
  within a conservation area, a registered park or garden or World Heritage Site; for all planning applications
  affecting a building of local interest or non-designated heritage asset including those of archaeological
  potential; or where the site would affect the setting of any designated or non-designated heritage asset.
must-include:
- item: Identification of heritage assets, having consulted the Historic Environment Record
  level: must
- item: 'Statement of significance: architectural, historic or archaeological values, including contribution
    to setting and to any wider designated area'
  level: must
- item: Photographs illustrating the relevant features of the building or site
  level: must
- item: 'Heritage impact assessment: why the works are proposed, their impact, and how the design protects
    significance, with any alternatives considered'
  level: must
- item: Mitigation strategy where harm is identified
  level: must
  required-if: discretionary
- item: 'Larger scale development in the Ironbridge Gorge World Heritage Site: an assessment of the impact
    on its Outstanding Universal Value'
  level: must
  required-if:
    all:
    - site:
        in:
        - world-heritage-site
        description: Ironbridge Gorge World Heritage Site.
    - discretionary
- item: May be part of the Design and Access Statement, but clearly identified in the document title
  level: should
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 42. Listed in
  the checklists for: householder, outline, reserved matters, full, technical details consent, listed
  building, relevant demolition and advertisement. Effects on the setting of a non-designated asset are
  a judgement, so the rule also shows as discretionary.'
review-status: unverified
field-status: {}
