reference: recreation-facilities-assessment
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - outline
      - reserved-matters
      - full
      - technical-details-consent
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of open space.
    - all:
      - condition:
          field: new-open-space
          value: true
          description: Open space provision required by Local Plan policy (usually major residential schemes).
      - discretionary
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies NE 3, NE 4, NE 5
source-text: To be provided with applications for development that will result in the loss of open space
  or where the provision of open space is required by Local Plan policy.
must-include:
- item: 'Loss of open space: size of the open space and area lost; plan of sports or play provision; proposed
    site plan showing the impact; correspondence on replacement provision; and an assessment of whether
    the site is surplus (where the council has no up-to-date assessment)'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Loss of open space.
- item: 'New open space: plan of its location; layout including play facilities; delivery timescale; future
    maintenance; a safety risk assessment where play is near SuDS features; and any financial contribution
    in the Heads of Terms'
  level: must
  required-if:
    condition:
      field: new-open-space
      value: true
      description: Open space provision required.
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 49. Listed in
  the checklists for: outline, reserved matters, full, technical details consent. Whether policy requires
  open space provision is a judgement, so discretionary.'
review-status: unverified
field-status: {}
