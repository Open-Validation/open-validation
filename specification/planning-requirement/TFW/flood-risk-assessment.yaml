reference: flood-risk-assessment
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - hh
      - outline
      - reserved-matters
      - full
      - technical-details-consent
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
      - pa-extension
      - pa-storey
      - pa-flats-de-blocks
      - pa-flats-de-comm
      - pa-flats-terr-comm
      - pa-flats-de-dwh
      - pa-flats-terr-dwh
      - pa-build-agri-forest
      - pa-ecomms-network
      - pa-tmp-school-vacant-comm
      - pa-tmp-use-comm-film
  - any:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zones 2 and 3.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: 'Flood Zone 1: a site of 1 hectare or more.'
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: 'Flood Zone 1: a site of 1 hectare or more.'
    - site:
        in:
        - critical-drainage-area
        description: Land the Environment Agency has identified as having critical drainage problems.
    - site:
        in:
        - future-flood-risk
        description: Land identified in a strategic flood risk assessment as at increased flood risk in
          future.
    - all:
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: Development would introduce a more vulnerable use.
      - discretionary
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies ER 12
source-text: 'A site-specific Flood Risk Assessment (FRA) should be provided for all development in Flood
  Zones 2 and 3. In Flood Zone 1, a FRA should accompany all proposals involving: sites of 1 hectare or
  more; land which has been identified by the Environment Agency as having critical drainage problems;
  land identified in a strategic flood risk assessment as being at increased flood risk in future; or
  land that may be subject to other sources of flooding, where its development would introduce a more
  vulnerable use.'
must-include:
- item: Identification and assessment of the risks of all forms of flooding to and from the development
  level: must
- item: How flood risks will be managed, taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Design details of surface water management systems, including SuDS
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 41. Listed in
  the checklists for: householder, outline, reserved matters, full, technical details consent and prior
  approval (change of use, new development, temporary use). Land ''that may be subject to other sources
  of flooding'' is a judgement, so discretionary. The council publishes a minor development FRA proforma
  and guidance.'
review-status: unverified
field-status: {}
