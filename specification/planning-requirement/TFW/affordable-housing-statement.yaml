reference: affordable-housing-statement
local-authority: TFW
required-if:
  all:
  - application-type:
      in:
      - outline
      - reserved-matters
      - full
      - technical-details-consent
  - any:
    - ref: major-development
    - condition:
        field: rural-exception-housing
        value: true
        description: An affordable rural exception scheme (policy HO 11).
source-url: https://www.telford.gov.uk/media/cwxd0g43/local-validation-list-2026-report-final.pdf
policy: Telford & Wrekin Local Plan policies HO 4, HO 5, HO 6 and HO 11
source-text: To be provided where a major development is proposed; or where the proposal is submitted
  as an affordable rural exception (Local Plan Policy HO 11)
must-include:
- item: Number of residential units and mix of units
  level: must
- item: Number of habitable rooms or the floor space of the units
  level: must
- item: Levels/types of affordability or tenure
  level: must
- item: Any Registered Social Landlords acting as partners
  level: must
- item: Compliance with First Homes
  level: must
  required-if: discretionary
- item: Location of affordable units
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (adopted April 2022, current version April 2026), page 37. Listed in
  the checklists for: outline, reserved matters, full, technical details consent.'
review-status: unverified
field-status: {}
