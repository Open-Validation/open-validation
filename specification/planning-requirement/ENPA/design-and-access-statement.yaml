reference: design-and-access-statement
local-authority: ENPA
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Development within a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The provision of one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings where the floorspace created is 100sqm or more.
source-url: https://www.exmoor-nationalpark.gov.uk/__data/assets/pdf_file/0025/195631/Local-List-October-26.pdf
source-text: 'A Design and Access Statement must be submitted for the following types of planning application:
  1) Development categorised as "major"; (usually 10 or more houses or where the floorspace exceeds 1,000sqm)
  etc1. 2) Development within a Conservation Area where the applications is for i) ii) the provision of
  one or more dwellinghouse, or the provision of a building or buildings where the floorspace created
  is 100sqm or more.'
confidence: low
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. From the audit
