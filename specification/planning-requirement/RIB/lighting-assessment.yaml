reference: lighting-assessment
local-authority: RIB
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: New external lighting.
  - discretionary
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
source-text: When required? Planning applications which include new external lighting near established
  residential properties, heritage assets, protected wildlife areas and countryside areas.
must-include:
- item: Plans showing the location of the lighting, adjacent sensitive (residential, heritage, wildlife)
    receptors, site boundaries and measured luminance
  level: must
- item: Specifications, including equipment design and lux levels to determine glare, intensity and spill,
    with recommendations to control them
  level: must
- item: Risk assessment for crime and disorder and impact on light sensitive premises
  level: must
- item: Schedule of installation
  level: must
- item: Hours of illumination / schedule of use
  level: must
confidence: medium
notes: 'From the council''s list (adopted 29 May 2025), section 3.0 (Documents), page 27. Discretionary:
  ''near'' residential properties, heritage assets, protected wildlife areas and countryside areas has
  no distance in the list.'
review-status: unverified
field-status: {}
