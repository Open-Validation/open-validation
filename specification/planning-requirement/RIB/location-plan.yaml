reference: location-plan
local-authority: RIB
required-if:
  always: true
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: As a minimum applicants will need to submit a Location Plan that shows the application site
  in relation to the surrounding area
must-include:
- item: Based on an up-to-date map, typically at 1:1250 or 1:2500
  level: should
- item: Scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: Application site edged clearly in red, including all land needed for the development (access from
    a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: should
- item: At least two named roads wherever possible, with buildings numbered or named if needed to identify
    the site
  level: should
- item: Plans at other scales where the development needs them (e.g. showing the extent of an agricultural
    holding owned by the applicant)
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 29 May 2025), sections 2.0 and 3.0, page 5, 12. Not needed for
  applications under section 73 or 73A(2)(c) of the 1990 Act (footnote 1). The list words every point
  as 'should'.
review-status: unverified
field-status: {}
