reference: section-proposed
local-authority: RIB
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New building(s).
  - condition:
      field: footprint-increase
      value: true
      description: Extensions to building(s).
  - condition:
      field: upper-floor-extension
      value: true
      description: Extensions to building(s) at upper floors.
  - condition:
      field: height-change
      value: true
      description: Roof lifts.
  - condition:
      field: basement
      value: true
      description: Habitable rooms in basements.
  - condition:
      field: roof-space-room
      value: true
      description: Habitable rooms in roof spaces.
  - condition:
      field: raised-platform
      value: true
      description: Decking area(s).
  - site:
      in:
      - listed-building
      description: Alterations to listed buildings.
  - all:
    - condition:
        field: engineering-operations
        value: true
        description: Engineering operations such as hard surfacing or retaining wall structures.
    - condition:
        field: change-in-ground-levels
        value: true
        description: The works require ground level alterations, or the site has differing ground levels.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: Listed building consent where elevational changes are proposed.
  - condition:
      field: shopfront
      value: true
      description: A new shopfront or an alteration to an existing shopfront.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required? All applications which propose new building(s), extensions to building(s),
  decking area(s) and/or other engineering operations. Scale? Typically 1:200 or 1:500. The plans should
  include finished floor levels where new buildings, floor level changes to existing buildings or extensions
  to buildings in Flood Zones 2 or 3 are proposed. Where no change in ground level is being proposed then
  fixed datum points included on existing and proposed site layout plans would be acceptable. Sectional
  Drawings (Existing and Proposed) When required? All applications which propose new building(s), extensions
  to building(s) including roof lifts, habitable rooms in basements and/or roof spaces, decking area(s)
  and alterations to listed buildings. Also applications which propose engineering operations not listed
  above (e.g. hard surfacing, retaining wall structures) which require ground level alterations or are
  on a site with differing ground levels.
must-include:
- item: Typically at 1:50 or 1:100
  level: should
- item: Cross section(s) through the proposed development and adjacent built form
  level: must
- item: Existing and proposed finished floor and site levels, related to a fixed datum point off site
    wherever possible
  level: should
- item: Details of foundations and eaves and how encroachment onto adjoining land is to be avoided, where
    possible
  level: should
- item: 'Listed building consent with elevational changes: section details (typically 1:20) of each affected
    elevation showing eaves, guttering/rainwater goods, soffits/overhangs, window/door reveals, the proposed
    window/door framing profiles/systems and materials, and any internal alterations (e.g. panelling,
    fireplaces, plaster moulding)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: Elevational changes are proposed.
  source-text: When required? Applications for Listed Building Consent where elevational changes are proposed
- item: 'Shopfront: a section of the proposed shopfront at 1:1 or 1:2, showing the projection of any signage,
    canopies and roller shutters'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: A new shopfront or an alteration to an existing shopfront.
  source-text: When required? Any application which includes a new shopfront or an alteration to an existing
    shopfront
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Plans), page 14-15.
