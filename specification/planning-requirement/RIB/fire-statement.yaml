reference: fire-statement
local-authority: RIB
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: Seven or more storeys.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: developers are now required to submit a fire statement for “relevant buildings1” setting
  out fire safety considerations specific to the development. ... Relevant buildings contain two or more
  dwellings or educational accommodation and meet the height condition of 18 metres or more in height,
  or seven or more storeys.
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect), with the particulars
    it specifies
  level: must
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How fire safety policies in relevant local development documents have been considered
  level: must
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 2.0 (National Requirements), item 6, page
  7.
review-status: unverified
field-status: {}
