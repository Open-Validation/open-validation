reference: sketch-plan
local-authority: RIB
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: When required? applications for works to trees subject to a tree preservation order (TPO)
  or notification of proposed works to trees in a conservation area ... A sketch plan clearly identifying
  the trees subject to the application. The sketch plan should also include the site boundaries, adjacent
  properties (including house names/ numbers), the position of the trees in relation to nearby buildings,
  and any other trees on the site (clearly marked that they are not subject to the application). All individual
  trees/ groups of trees should be numbered.
must-include:
- item: The trees subject to the application clearly identified
  level: must
- item: Site boundaries and adjacent properties (including house names/numbers)
  level: should
- item: The position of the trees in relation to nearby buildings
  level: should
- item: Any other trees on the site, clearly marked as not subject to the application
  level: should
- item: All individual trees / groups numbered
  level: should
- item: 'Where individual trees in a woodland or group cannot be identified: their approximate location
    marked'
  level: should
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), Tree Works Application,
  page 38. Uses MHCLG's retired 'sketch-plan' id. Photographs can also be used to identify the trees.
