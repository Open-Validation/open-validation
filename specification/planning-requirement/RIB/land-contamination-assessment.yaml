reference: land-contamination-assessment
local-authority: RIB
required-if:
  all:
  - condition:
      field: sensitive-end-use
      value: true
      description: A use particularly sensitive to contamination (housing, schools, care homes, hospitals,
        children's play areas, allotments).
  - condition:
      field: ground-disturbance
      value: true
      description: The development involves breaking into the ground.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-august-2023
source-text: Land Contamination Statement When required? For planning applications which involve uses
  that are particularly sensitive to contamination e.g. housing, schools, care homes, hospitals, children’s
  play areas, allotments where the development involves breaking into the ground.
must-include:
- item: Photographic evidence (colour site photos, dated, with a brief description of where they were
    taken, aerial photographs, maps)
  level: must
- item: Details of any evidence of contamination (e.g. stained ground, vegetation die back, raised land
    levels)
  level: must
confidence: low
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The photographic evidence
  items were in the workbook's Photographs row.
review-status: unverified
field-status: {}
