reference: land-contamination-assessment
local-authority: RIB
required-if:
  all:
  - condition:
      field: sensitive-end-use
      value: true
      description: Uses particularly sensitive to contamination, e.g. housing, schools, care homes, hospitals,
        children's play areas, allotments.
  - condition:
      field: ground-disturbance
      value: true
      description: The development involves breaking into the ground.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: National Planning Policy Framework
source-text: When required? For planning applications which involve uses that are particularly sensitive
  to contamination e.g. housing, schools, care homes, hospitals, children’s play areas, allotments where
  the development involves breaking into the ground.
must-include:
- item: The former uses / known history of the site and its surroundings
  level: must
- item: The site's current condition
  level: must
- item: 'Photographic evidence: colour site photos, dated, with a brief description of where they were
    taken, plus aerial photographs and maps'
  level: must
- item: Details of any evidence of contamination (e.g. stained ground, vegetation die back, raised land
    levels)
  level: must
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 26. Where contamination
  sources are evident, a Phase 1 desk study and/or Phase 2 site investigation will normally be a pre-commencement
  condition; applicants may submit them with the application instead.
review-status: unverified
field-status: {}
