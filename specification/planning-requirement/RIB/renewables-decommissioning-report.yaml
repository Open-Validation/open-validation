reference: renewables-decommissioning-report
local-authority: RIB
required-if:
  condition:
    field: wind-turbine
    value: true
    description: All wind energy applications.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
source-text: When required? All wind energy applications ... An indication of how decommissioning will
  be undertaken shall be provided. For all single wind turbines over a height of 40m (or multiple turbines
  of any height), the Council will expect that evidence is provided to demonstrate that a bond has been
  put in place with the Local Authority to cover the entire costs of decommissioning and removing the
  wind turbine(s) from site once they have reached the end of their 25 year operational period. This should
  be done through a Unilateral Undertaking.
must-include:
- item: An indication of how decommissioning will be undertaken
  level: must
- item: 'For single turbines over 40m or multiple turbines of any height: evidence of a bond with the
    council, through a unilateral undertaking, covering the full cost of decommissioning and removal after
    the 25-year operating period'
  level: should
  required-if:
    any:
    - condition:
        field: wind-turbine-count
        operator: '>'
        value: 1
        description: Multiple turbines.
    - condition:
        field: building-height
        operator: '>'
        value: 40
        description: A single turbine over 40m high.
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), Wind Energy Applications,
  page 41.
review-status: unverified
field-status: {}
