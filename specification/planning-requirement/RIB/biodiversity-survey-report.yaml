reference: biodiversity-survey-report
local-authority: RIB
required-if:
  any:
  - condition:
      field: involves-change-of-use
      value: true
      description: Conversion of existing buildings.
  - condition:
      field: demolition
      value: true
      description: Demolition.
  - condition:
      field: roof-alteration
      value: true
      description: Work affecting roof spaces.
  - condition:
      field: roof-space-room
      value: true
      description: Work affecting roof spaces.
  - condition:
      field: tree-removal
      value: true
      description: Removal of trees.
  - condition:
      field: hedgerows-affected
      value: true
      description: Removal of hedgerows.
  - site:
      in:
      - local-wildlife-site
      - site-of-special-scientific-interest
      - special-protection-area
      - special-area-of-conservation
      - ramsar
      - ancient-woodland
      description: Development impacting on Biological Heritage Sites, SSSI, SPA, SAC, Ramsar sites, or
        ancient woodland and its buffer zone.
  - condition:
      field: near-woodland
      value: true
      description: Development impacting on woodland areas.
  - condition:
      field: pond-on-or-near-site
      value: true
      description: Development impacting on a water body, pond, ditch or similar feature.
  - condition:
      field: geodiversity-interest
      value: true
      description: Development impacting on a Geological Heritage Site.
  - condition:
      field: protected-species
      value: true
      description: Potential to affect protected and priority species.
  - site:
      in:
      - priority-habitat
      description: Potential to affect protected and priority habitats.
  - discretionary
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Ribble Valley Core Strategy 2008-2028 Key Statement EN4 and policy DME3
source-text: When required? All developments that have the potential to affect protected and priority
  species or protected and priority habitats, including:- ... This is not an exhaustive list.
must-include:
- item: Details of the appointed ecologist demonstrating their competence (licence, or other evidence
    of knowledge and experience)
  level: must
- item: 'When the surveys were undertaken or updated: within 24 months before the validation date'
  level: must
- item: A detailed method, including desktop information (a search of local records including the Lancashire
    Environment Record Network) and surveys at appropriate times of year, in suitable weather, using recognised
    techniques
  level: must
- item: Detailed results of the desktop/survey findings and an evaluation of the ecological interest
  level: must
- item: An assessment of likely direct and indirect impacts, during construction and afterwards
  level: must
- item: Proposals to avoid, mitigate or compensate for any ecological impacts
  level: must
- item: 'For European Protected Species likely to need a Natural England licence: information to assess
    the proposal against the three Habitats Regulations licensing tests'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: European Protected Species (e.g. bats, otters, great crested newts) are likely to be
        affected.
- item: 'Where harm is likely: how alternative designs or locations were considered, and how adverse effects
    will be avoided, mitigated or compensated'
  level: must
- item: 'Where development could affect an SSSI, SPA, SAC or Ramsar site: information to inform the council''s
    Appropriate Assessment (Habitats Regulations Assessment), typically including construction and demolition
    details'
  level: must
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      - special-protection-area
      - special-area-of-conservation
      - ramsar
      description: Development could affect a national or international designated site.
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents) and Appendix A, page 19,
  21, 42. Appendix A (pages 42-48) adds tables of the development types that trigger a protected species
  survey (e.g. conversion of agricultural or pre-1914 buildings, floodlighting, tree work, works within
  200m of water, wind turbines), the priority habitats, and survey seasons, with exceptions where the
  council or Natural England has confirmed in writing that no assessment is needed. Where bat roosts are
  possible but no survey is offered, the council may ask for photographs or an ecologist's confirmation.
  The list is not exhaustive, so the trigger also shows as discretionary. It also expects one integral
  bird nesting box per new dwelling and bat roosting provision.
review-status: unverified
field-status: {}
