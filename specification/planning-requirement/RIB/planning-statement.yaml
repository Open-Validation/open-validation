reference: planning-statement
local-authority: RIB
required-if:
  ref: major-development
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
source-text: When required? All major planning applications. Also useful for some minor planning applications
  where the development is likely to be controversial or to enable the case for the development to be
  put forward.
must-include:
- item: An assessment of the site and its context
  level: must
- item: A description of the development proposal
  level: must
- item: An assessment of the planning policy context
  level: must
- item: An appraisal of the proposed development against relevant planning policies affecting the site
  level: must
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 30. For minor applications
  the list only calls it 'useful', so it is not shown as required.
review-status: unverified
