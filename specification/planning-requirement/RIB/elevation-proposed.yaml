reference: elevation-proposed
local-authority: RIB
required-if:
  any:
  - condition:
      field: external-alterations
      value: true
      description: Elevation change is proposed.
  - condition:
      field: advert-on-existing-building
      value: true
      description: Adverts are to be fixed onto a building.
  - condition:
      field: shopfront
      value: true
      description: A new shopfront or an alteration to an existing shopfront.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required? All applications where elevation change is proposed including where adverts
  are to be fixed onto a building
must-include:
- item: Typically at 1:50 or 1:100
  level: should
- item: All sides of the proposal that are visible (even in part)
  level: must
- item: Dimensions of the proposal annotated on the plan
  level: should
- item: 'Where the elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each property'
  level: should
- item: 'All proposed architectural detailing: eaves, guttering/rainwater goods, soffits/overhangs, window/door
    framing profiles (and surrounds) and any transitions in materials'
  level: must
- item: All elevations clearly dimensioned, including eaves and ridge heights and building extents
  level: must
- item: 'Shopfront: existing and proposed shopfront elevations at 1:10 or 1:20'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: A new shopfront or an alteration to an existing shopfront.
- item: 'Air conditioning, extraction and filtration equipment: elevations with its written dimensions
    and design'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: The application requires air conditioning or extraction and filtration equipment.
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Plans), page 13, 15-16.
review-status: unverified
field-status: {}
