local-authority: RIB
name: Ribble Valley Borough Council
region: North West
type: District
review-status: unverified
validation-list:
  url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
  date: 2025-05-29
  date-basis: 'Cover: ''Adopted 29 May 2025''; the council''s Validation Checklist page (https://www.ribblevalley.gov.uk/planning-buildings/validation-checklist-planning-applications)
    says the updated version was ''adopted by Committee on 29th May 2025'' and is used for all applications
    received after that date. On 2026-11-06 that page linked only this file (download page 257, file 3789,
    PDF created 5 June 2025) and carried a ''December 2025 Update'' suspending the Sustainable Drainage
    Pro-Forma at validation for major applications; no newer list or consultation was found. It replaces
    the August 2023 list.'
  status: current
submission-standards:
- item: Plans and drawings drawn to an identified scale, accurately showing the direction of north (where
    appropriate)
  level: must
- item: A linear scale bar, especially for electronic submissions
  level: should
- item: Plans provided at the stated scale including the paper size (e.g. 1:500 at A1)
  level: should
- item: Dimensions of the proposal annotated onto the plans
  level: should
- item: Plans scaled to fit onto A4 or A3 paper wherever possible
  level: should
- item: Plans submitted for illustrative purposes clearly marked 'Illustrative'
  level: should
- item: Documents containing commercially sensitive or personal information submitted twice, one copy
    redacted for publication (an executive summary at least will be published)
  level: should
- item: 'Paper applications: only 1 copy required'
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link points to the current May 2025 checklist; only the List date is off (should
    be 2025-05-29). The extraction is poor: tab_items are mostly boilerplate, coal mining is assigned
    to exactly the application types the source exempts, DAS and other items are wrongly put under s73,
    many triggers are garbled, and about 10 document and 7 plan requirements are missing, including Green
    Belt, Odour, Retail tests, Telecoms, Tree Works and Wind Energy. Fixed 2026-11-05: every file was
    rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: July 2026 decision for Lancashire, Blackburn with Darwen and Blackpool paused
