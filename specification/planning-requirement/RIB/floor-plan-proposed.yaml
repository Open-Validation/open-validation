reference: floor-plan-proposed
local-authority: RIB
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: The application includes new buildings.
  - condition:
      field: building-works
      value: true
      description: The application includes alterations to buildings.
  - condition:
      field: involves-change-of-use
      value: true
      description: The application changes the use of any space within a building.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required? All applications which include new buildings, alterations to buildings or
  changes to the use of any space within a building
must-include:
- item: Typically at 1:50 or 1:100
  level: should
- item: Existing buildings or walls to be demolished clearly shown
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: Existing buildings or walls are to be demolished.
- item: Dimensions of the proposal annotated on the plan
  level: should
- item: 'For a new external access ramp: the position and gradient of the ramp, with a plan of any handrails/barriers
    and anti-skating measures'
  level: must
  required-if:
    condition:
      field: external-access-ramp
      value: true
      description: The application includes a new external access ramp.
  source-text: When required? Any application which includes a new external access ramp Floor plans shall
    detail the position and gradient of the ramp along with a plan detailing any handrails/ barriers and
    anti-skating measures.
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Plans), page 13, 15.
review-status: unverified
field-status: {}
