reference: protected-landscape-assessment
local-authority: RIB
required-if:
  all:
  - site:
      in:
      - area-of-outstanding-natural-beauty
      description: Within the AONB (Forest of Bowland National Landscape).
  - discretionary
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: National Planning Policy Framework (AONB major development test)
source-text: When required? Major development within the AONB
must-include:
- item: The need for the development, including any national considerations, and the impact of permitting
    or refusing it on the local economy
  level: must
- item: The cost of, and scope for, developing outside the designated area or meeting the need in some
    other way
  level: must
- item: Any detrimental effect on the environment, the landscape and recreational opportunities, and the
    extent to which it could be moderated
  level: must
confidence: medium
notes: 'From the council''s list (adopted 29 May 2025), section 3.0 (Documents), page 18. Discretionary:
  whether a proposal is major development for this test is a matter for the council, taking into account
  its nature, scale and setting (footnote 1), not the DMPO thresholds. Contact the council before applying
  if unsure.'
review-status: unverified
field-status: {}
