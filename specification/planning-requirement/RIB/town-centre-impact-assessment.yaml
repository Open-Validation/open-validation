reference: town-centre-impact-assessment
local-authority: RIB
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: A main town centre use not proposed within an existing centre (and not in accordance
      with an up-to-date Local Plan).
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: National Planning Policy Framework; Ribble Valley Core Strategy 2008-2028 policy DMR1
source-text: When required? A sequential test is required for any main town centre use that is not proposed
  within an existing centre (and not in accordance with an up-to-date Local Plan). An exception to this
  is any small-scale1 rural office or other small scale rural development (as set out within the NPPF).
  The subsequent impact assessment is required for retail and leisure development outside of town centres
  (and not in accordance with an up-to-date Local Plan) if the development is over 1,000m² (200m² in the
  case of extensions to existing premises)
must-include:
- item: 'Sequential test: sites assessed for availability, suitability and viability; all in-centre options
    assessed before less central sites; no town centre sites available'
  level: must
- item: 'Edge of centre sites: flexibility on scale, format, car parking and disaggregation'
  level: must
- item: 'Impact assessment (retail and leisure over 1,000 sq m, or 200 sq m for extensions): impact on
    existing, committed and planned investment in centres in the catchment, and on town centre vitality
    and viability up to five years (ten for major schemes)'
  level: must
  required-if:
    any:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 1000
        description: Retail and leisure development over 1,000 sq m.
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 200
          description: Extensions to existing premises over 200 sq m.
      - condition:
          field: footprint-increase
          value: true
          description: An extension to existing premises.
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 31. Small-scale rural
  offices and other small-scale rural development are exempt from the sequential test; whether a proposal
  is small-scale is a matter for the council. The 200 sq m threshold for extensions is the local threshold
  in Core Strategy policy DMR1.
review-status: unverified
field-status: {}
