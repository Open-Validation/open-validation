source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-august-2023
source-text: Act 13 Roof Plans (Existing and Proposed) When required? all applications where new roof
  details are proposed Scale? typically smaller than the scale used for the floor plan(s) (i.e. 1:50/
  1:100/ 1:200) Such plans are required to show the shape of the roof and shall also include details such
  as the roofing material, vents and their location where necessary.
