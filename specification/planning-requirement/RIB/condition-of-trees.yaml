reference: condition-of-trees
local-authority: RIB
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: When required? applications for works to trees subject to a tree preservation order (TPO)
  or notification of proposed works to trees in a conservation area ... Sufficient evidence to support
  the case for works to trees, typically in the form of a report from an arboriculturist (or other expert)
  or diagnostic information. This may include details of the condition of the trees and/ or the damage
  they are causing or details on the presence and impact of pests, diseases or fungi
must-include:
- item: Evidence supporting the case for the works, typically a report from an arboriculturist (or other
    expert) or diagnostic information
  level: must
- item: 'Where relevant: the condition of the trees, the damage they are causing, or the presence and
    impact of pests, diseases or fungi'
  level: should
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 37-38.
review-status: unverified
field-status: {}
