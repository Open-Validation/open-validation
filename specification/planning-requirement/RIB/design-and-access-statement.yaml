reference: design-and-access-statement
local-authority: RIB
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Development in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Provides one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Provides a building or buildings creating 100 sq m or more of floor space.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: In accordance with the DMPO, a Design and Access Statement is a national requirement for
  the following types of applications:- ... Major development ... Listed Building Consent ... Development
  in a conservation area consisting of either (i) the provision of one or more dwellinghouses; or (ii)
  the provision of a building or buildings where the floor space created by the development is 100 square
  metres or more.
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context of the development and how the design takes that context
    into account
  level: must
- item: The policy adopted as to access, and how access policies in relevant local development documents
    have been taken into account
  level: must
- item: What consultation, if any, has been undertaken on access, and what account has been taken of it
  level: must
- item: How any specific issues which might affect access to the development have been addressed
  level: must
- item: Any alternative options considered and discounted
  level: must
- item: Levels
  level: should
  source-text: Levels should also be considered in design and access statements.
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 2.0 (National Requirements), item 5, page
  6-7. Not required for section 73 applications, engineering or mining operations, or a material change
  of use of land or buildings. The 'Levels' item is from the sectional drawings guidance (page 14).
review-status: unverified
field-status: {}
