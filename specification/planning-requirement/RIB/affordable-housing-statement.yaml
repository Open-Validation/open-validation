reference: affordable-housing-statement
local-authority: RIB
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Housing scheme.
  - discretionary
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Ribble Valley Core Strategy 2008-2028 policy DMH1
source-text: When required? For housing schemes which require an element of affordable housing in accordance
  with Policy DMH1 of the Adopted Core Strategy
must-include:
- item: How the required percentage of affordable housing will be achieved on site
  level: must
- item: The tenure mix of the affordable units
  level: must
- item: The types and sizes of the affordable units, including number of bedrooms and internal space standards
  level: must
- item: The Registered Provider / Housing Association who will manage the affordable units (if applicable)
  level: must
- item: How the split responds to local needs
  level: should
confidence: medium
notes: 'From the council''s list (adopted 29 May 2025), section 3.0 (Documents), page 17. Discretionary:
  the list gives no threshold, only ''housing schemes which require an element of affordable housing''
  under Policy DMH1. A relaxation of DMH1 may be considered if a viability assessment shows the scheme
  would be unviable.'
review-status: unverified
field-status: {}
