reference: viability-assessment
local-authority: RIB
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: The application would fail to provide the necessary infrastructure (affordable housing,
      public open space, sport or leisure facilities, education contributions, off-site highway improvements).
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: National Planning Policy Framework; RICS guidance note 'Assessing viability in planning under
  the National Planning Policy Framework 2019 for England'
source-text: When required? Where an application is submitted which would fail to provide the necessary
  infrastructure provision (affordable housing/ public open space, sport or leisure facilities/ education
  contributions/ off-site highway improvements if required)
must-include:
- item: Value of the land (2 or 3 different estate agents' valuations)
  level: must
- item: Abnormal development costs
  level: must
- item: Construction costs
  level: must
- item: Price the Registered Provider will pay for the units (for affordable housing)
  level: must
  required-if:
    condition:
      field: affordable-housing-proposed
      value: true
      description: Affordable housing is proposed.
- item: Open market value of the dwellings / value of the development
  level: must
- item: Developer return
  level: must
- item: Details of the proposed obligations / specific elements of the scheme to be included (e.g. open
    space)
  level: must
- item: 'Up to three scenarios: no obligations; fully policy-compliant obligations; the scheme as proposed'
  level: should
- item: In accordance with the RICS guidance note 'Assessing viability in planning under the NPPF 2019
    for England' (1st edition, March 2021) or any amendment
  level: must
- item: Two copies where commercially sensitive, one redacted for publication, with an executive summary
    at least
  level: should
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 22-23. An independent
  auditor is appointed at the applicant's cost in all cases.
review-status: unverified
field-status: {}
