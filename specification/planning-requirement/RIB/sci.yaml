reference: sci
local-authority: RIB
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: Installation for harnessing wind power.
    - any:
      - condition:
          field: wind-turbine-count
          operator: '>'
          value: 2
          description: More than 2 turbines.
      - condition:
          field: turbine-hub-height
          operator: '>'
          value: 15
          description: Hub height of any turbine exceeds 15 metres.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required? Planning applications for major development ... where there is likely to be
  significant public interest in the proposals. Any development involving an installation for the harnessing
  of wind power for energy production where (a) the development ... involves the installation of more
  than 2 turbines; or (b) the hub height of any turbine exceeds 15 metres
must-include:
- item: How the applicant engaged with relevant sections of the community in shaping the proposal
  level: must
- item: Responses to the consultation received, and how they have been taken into account
  level: must
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 31. Major development
  shows as discretionary because it applies only where there is likely to be significant public interest.
  The wind turbine part is a DMPO requirement (not for section 73 applications).
review-status: unverified
field-status: {}
