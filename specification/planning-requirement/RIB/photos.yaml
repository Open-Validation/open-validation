reference: photos
local-authority: RIB
required-if:
  all:
  - condition:
      field: bng-exemption-claimed
      value: true
      description: The applicant claims an exemption from biodiversity net gain under the de minimis rule.
  - discretionary
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Planning Practice Guidance (Biodiversity net gain)
source-text: Where the applicant is claiming an exemption based on the de minimis rule, and where this
  exemption is not clear on the submitted plans or supporting documents, the Council will request evidence
  in the form of recent photographs of the land in question ... to support this claim.
must-include:
- item: Recent photographs of the land in question, to support the de minimis exemption claim
  level: must
confidence: medium
notes: 'From the council''s list (adopted 29 May 2025), section 3.0, Biodiversity Net Gain (BNG), page
  18. Discretionary: the council asks for photographs only where the exemption is not clear on the plans
  or documents. If the photographs are inconclusive it will ask for confirmation of the de minimis exemption
  from a suitably qualified ecologist. If the council is unclear about the reason for any BNG exemption
  claim, the application will be made invalid. A custom and self-build exemption needs a unilateral undertaking
  before permission is issued (not a validation requirement).'
review-status: unverified
field-status: {}
