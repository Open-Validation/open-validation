source-text: Heritage Statement When required? For planning applications which involve a Listed Building,
  Scheduled Monument, Registered Park or Garden, impact on the setting of a Listed Building, involve work
  within a Conservation Area and/or involve work to a local heritage asset (e.g. as identified by a local
  list or through the pre-application process).
