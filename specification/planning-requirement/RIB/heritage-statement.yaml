reference: heritage-statement
local-authority: RIB
required-if:
  any:
  - site:
      in:
      - listed-building
      - scheduled-monument
      - park-and-garden
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      description: Involves a Listed Building, Scheduled Monument, Registered Park or Garden, the setting
        of a Listed Building, work in a Conservation Area, or a locally listed heritage asset.
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: A wind energy application.
    - discretionary
  - discretionary
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
source-text: When required? For planning applications which involve a Listed Building, Scheduled Monument,
  Registered Park or Garden, impact on the setting of a Listed Building, involve work within a Conservation
  Area and/or involve work to a local heritage asset (e.g. as identified by a local list or through the
  pre-application process).
must-include:
- item: The significance of any heritage asset(s) affected, including the contribution of their setting,
    proportionate to their importance
  level: must
- item: The relevant historic environment record consulted, as a minimum, with the asset(s) assessed using
    appropriate expertise where necessary
  level: must
- item: An assessment of the impact of the proposal
  level: must
- item: The sources considered and the expertise consulted
  level: must
- item: 'Wind energy: the impact of the turbine(s) on significant cultural, recreational or heritage assets,
    including sub-surface archaeology, within at least ten times turbine height (under 40m total height)
    or 5km of the site boundary (40m or above)'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 25-26. Local heritage
  assets identified through the pre-application process are shown as discretionary. The wind energy part
  is from 'Wind Energy Applications' (page 39); the council may ask for assets outside the radius.
review-status: unverified
field-status: {}
