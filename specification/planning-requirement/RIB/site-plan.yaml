reference: site-plan
local-authority: RIB
required-if:
  always: true
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required? Every application
must-include:
- item: Existing and proposed site layout plans, typically at 1:200 or 1:500
  level: should
- item: The proposed development in relation to the site boundaries, existing buildings on site and adjacent
    built development, with written dimensions including those to the boundaries and adjacent built form
  level: should
- item: All buildings, roads, footways, public rights of way or watercourses crossing or adjoining the
    site
  level: should
- item: The position of all trees on site or immediately adjoining it, where affected by the development
  level: should
- item: The extent and type of any hard surfacing, including parking
  level: should
- item: The location of any new or altered boundary treatments
  level: should
- item: The extent of curtilages where residential development is proposed
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
- item: Location of all air conditioning, extraction and filtration equipment
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: The application requires air conditioning or extraction and filtration equipment.
  source-text: A site plan and roof plan are required to detail the location of all equipment
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Plans), page 13, 16. Not needed for
  applications under section 73 or 73A(2)(c) of the 1990 Act (footnote 1). The list says the plans 'should
  accurately show' these points.
review-status: unverified
field-status: {}
