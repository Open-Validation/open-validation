reference: bng-metric
local-authority: RIB
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended
  by the Biodiversity Gain Town and Country Planning (Modifications and Amendments) (England) Regulations
  2024)
source-text: 'any application for planning permission must be accompanied by the following information
  relating to the biodiversity gain condition:'
must-include:
- item: Completed biodiversity metric calculation tool(s) showing the pre-development biodiversity value
    of the onsite habitat on the date of application (or an earlier proposed date)
  level: must
- item: The biodiversity value(s) and the publication date of the metric tool used
  level: must
- item: If an earlier date is proposed, the reasons for it
  level: must
  required-if: discretionary
- item: 'If activities reducing onsite biodiversity value have been carried out: a statement saying so,
    the date immediately before they were carried out, and supporting evidence'
  level: must
- item: A description of any irreplaceable habitat on the land on that date
  level: must
confidence: medium
notes: 'From the council''s list (adopted 29 May 2025), section 2.0 (National Requirements), item 7, page
  7, 9. Shown with the biodiversity gain condition, as the law sets: householder and other exempt applications
  are exempt. Not required for section 73 applications. If you believe the condition would not apply,
  you must say so and give your reasons.'
review-status: unverified
field-status: {}
