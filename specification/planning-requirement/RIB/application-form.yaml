reference: application-form
local-authority: RIB
required-if:
  always: true
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, articles 13
  and 14; Town and Country Planning Act 1990, section 65(5)
source-text: A completed standard application form is available to view and download via the Planning
  Portal. ... all applications for planning permission (except for approval of reserved matters) must
  include a declaration by the applicant with regards to ownership of the application site and whether
  the site is an agricultural holding.
must-include:
- item: Ownership certificate (A, B, C or D) and agricultural land declaration, except for approval of
    reserved matters
  level: must
- item: 'Where the site includes land in the public highway: ownership certificate B, C or D, with notice
    served on Lancashire County Council as local highway authority'
  level: must
- item: 'Where non-mains drainage pipework crosses land outside the applicant''s ownership: that land
    in the red edge where possible, and certificate B, C or D with notice served on its owner(s)'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: The proposal connects to non-mains drainage.
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 2.0 (National Requirements), items 1-2,
  page 4-5.
review-status: unverified
field-status: {}
