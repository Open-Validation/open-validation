reference: arboriculturist-report
local-authority: RIB
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within or adjacent to the site that the proposal could affect.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedgerows within or adjacent to the site that the proposal could affect.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: BS 5837:2012 Trees in relation to design, demolition and construction
source-text: When required? Proposals which have the potential to impact on trees or hedgerows (either
  within the application site or adjacent to the application site) shall be accompanied by an Arboricultural
  Impact Assessment (AIA).
must-include:
- item: A survey of existing trees and hedgerows within/adjacent to the site, with species, height and
    canopy diameter, shown on a tree constraints plan
  level: must
- item: Which trees and hedgerows will be retained and which removed, with a tree retention and removal
    plan
  level: must
- item: 'For retained trees and hedgerows: a method statement (site preparation and earthworks) and a
    tree / root protection plan'
  level: must
- item: Clear justification for any trees and hedgerows to be removed
  level: must
- item: Produced by an appropriately qualified arboriculturalist; works to conform to BS 5837 (2012)
  level: must
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 37. Where the applicant
  thinks no AIA is needed but trees may be within influencing distance, the council may ask for photographs
  at validation to decide.
review-status: unverified
field-status: {}
