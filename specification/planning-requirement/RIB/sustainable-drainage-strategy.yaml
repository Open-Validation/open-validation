reference: sustainable-drainage-strategy
local-authority: RIB
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Within Flood Zone 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Within Flood Zone 1 and more than 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Within Flood Zone 1 and more than 1 hectare.
  - site:
      in:
      - future-flood-risk
      - surface-water-flood-risk
      description: Within Flood Zone 1 and under 1 ha, where NaFRA2 mapping shows current or future flood
        risk from rivers and the sea, or surface water flooding.
  - site:
      in:
      - groundwater-flood-risk
      description: Within Flood Zone 1 and under 1 ha, where the Ribble Valley SFRA shows the site could
        be affected by flooding from other sources.
  - site:
      in:
      - critical-drainage-area
      description: Within Flood Zone 1 and under 1 ha, where the SFRA identifies critical drainage problems
        notified by the Environment Agency.
  - ref: major-development
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required? any development requiring a Flood Risk Assessment (as set out above), or in
  any other case, all major development with surface water drainage
must-include:
- item: How rainwater will first be used as a resource and source control promoted
  level: must
- item: 'Surface water discharged according to the hierarchy: infiltration; surface water body; surface
    water sewer or highway drain; combined sewer, with clear evidence why preferable options were discounted'
  level: must
- item: How the sustainable drainage components will be constructed, managed and maintained for the lifetime
    of the development
  level: must
- item: 'Outline applications: ground conditions (infiltration rates, flow routes); existing and proposed
    surface water drainage with runoff rates and volumes (hydraulic calculations and software used); flood
    risks from rivers, coast, surface water and groundwater; SuDS components'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'Full applications, in addition: proposed drainage arrangements, outfalls, design storm calculations
    (1 in 1, 1 in 30, 1 in 100 year plus climate change), storage, discharge restriction, pollution prevention
    and any off-site works; runoff not exceeding greenfield rate; exceedance routes; compliance with the
    hierarchy; justification where SuDS are not appropriate; multifunctional benefits; implementation
    timetable and phasing; adoption, maintenance and management; water quality controls'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: 'How foul water is to be drained, considering in order: public sewer, package treatment plant,
    septic tank, cesspool'
  level: must
- item: 'Trade waste or non-mains foul disposal: a fuller foul drainage assessment, including storage,
    treatment and disposal and the site''s suitability'
  level: must
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Disposal of trade waste or foul sewage other than to the public sewer.
- item: 'Changes to or replacement of the existing foul system, or a new system: scale plans (location
    plan, cross sections/elevations and specification) with drainage details that will achieve Building
    Regulations approval'
  level: must
  required-if:
    condition:
      field: drainage-alterations
      value: true
      description: The development changes or replaces the existing system or creates a new one.
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 33-35. Uses MHCLG's
  retired id for a drainage strategy. The separate Sustainable Drainage Pro-Forma (page 35) is not requested
  at validation for major applications submitted after November 2025, until an updated pro-forma is produced
  (council web page, December 2025 update).
review-status: unverified
field-status: {}
