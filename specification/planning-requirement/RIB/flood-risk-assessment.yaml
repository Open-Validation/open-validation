reference: flood-risk-assessment
local-authority: RIB
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Within Flood Zone 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Within Flood Zone 1 and more than 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Within Flood Zone 1 and more than 1 hectare.
  - site:
      in:
      - future-flood-risk
      - surface-water-flood-risk
      description: Within Flood Zone 1 and under 1 ha, where NaFRA2 mapping shows current or future flood
        risk from rivers and the sea, or surface water flooding.
  - site:
      in:
      - groundwater-flood-risk
      description: Within Flood Zone 1 and under 1 ha, where the Ribble Valley SFRA shows the site could
        be affected by flooding from other sources.
  - site:
      in:
      - critical-drainage-area
      description: Within Flood Zone 1 and under 1 ha, where the SFRA identifies critical drainage problems
        notified by the Environment Agency.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: National Planning Policy Framework; Planning Practice Guidance (Flood risk and coastal change)
source-text: 'When required? A site-specific flood risk assessment (FRA) is required for development proposals:
  ... within flood zone 2 or 3 including minor development and change of use ... within flood zone 1 and
  more than 1 hectare (ha) ... within flood zone 1 and less than 1 ha, where the National Flood Risk Assessment
  2 mapping (NAFRA2) identifies the site at current or future flood risk from rivers and the sea, and
  from surface water flooding ... Within flood zone 1 and less than 1 ha, where the Ribble Valley Strategic
  Flood Risk Assessment (SFRA) shows that the site could be affected by flooding from rivers or sea in
  the future (e.g. because of climate change) or from other sources (for example surface water flood risk,
  reservoirs) ... within flood zone 1 and less than 1ha, where the Ribble Valley SFRA identifies critical
  drainage problems as notified by the Environment Agency (NB: there are no such notifications presently)'
must-include:
- item: All sources of flood risk and climate change, and whether the development will increase flood
    risk elsewhere
  level: must
- item: Measures to address flood impacts on or from the development, why and how they are appropriate,
    and how residual risk is managed
  level: must
- item: Opportunities to reduce the causes and impact of flooding, including sustainable drainage systems
  level: should
- item: Safe access and escape routes to and from areas at risk of flooding
  level: should
- item: 'Householder applications in a flood zone: a simple flood risk assessment (Environment Agency
    standing advice)'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Sequential Test, where any building, access and escape route, land-raising or other vulnerable
    element will be in Flood Zone 2 or 3, or in Flood Zone 1 at increased or other risk (NaFRA2 or SFRA);
    not for minor development (changes of use other than to caravan, camping, chalet or mobile home sites,
    householder development, non-residential extensions under 250 sq m) or where already done through
    the Local Plan
  level: must
  required-if:
    any:
    - site:
        in:
        - flood-risk-zone
        description: Within Flood Zone 2 or 3, including minor development and change of use.
    - site:
        in:
        - future-flood-risk
        - surface-water-flood-risk
        - groundwater-flood-risk
        - critical-drainage-area
        description: Flood Zone 1 at increased or other flood risk (NaFRA2 or SFRA).
- item: Exception Test, if the Sequential Test is passed and the development is highly vulnerable in Flood
    Zone 2, essential infrastructure in Flood Zone 3a or 3b, or more vulnerable in Flood Zone 3a
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 23-24. The Exception
  Test item shows as discretionary because flood vulnerability classes are not modelled. There is no Flood
  Zone 3b in Ribble Valley at present.
review-status: unverified
field-status: {}
