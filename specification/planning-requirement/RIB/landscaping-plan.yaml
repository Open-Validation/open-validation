reference: landscaping-plan
local-authority: RIB
required-if:
  all:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Housing development.
  - any:
    - application-type:
        in:
        - full
    - all:
      - application-type:
          in:
          - reserved-matters
      - any:
        - condition:
            field: reserved-matters-sought
            value: appearance
            description: Design/appearance is being considered.
        - condition:
            field: reserved-matters-sought
            value: layout
            description: Layout is being considered.
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required? All major applications (as defined by the GDPO) for housing development where
  design/appearance and/or layout is being considered.
must-include:
- item: All existing trees and those to be removed
  level: must
- item: All existing and/or proposed ground cover planting
  level: must
- item: Size, species, density and position of proposed trees
  level: must
- item: All existing and proposed hardstanding/parking areas
  level: must
- item: Permeable materials on a permeable base for driveways, or drainage within the site so that surface
    water does not drain onto the highway
  level: must
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Additional Plans for specific development
  types), page 15. The list also asks for a Materials Plan and a Boundary Treatment Plan for these schemes
  (see the council's unmapped items). 'Major' is as defined by the GDPO (the list's words).
review-status: unverified
field-status: {}
