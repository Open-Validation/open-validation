reference: noise-assessment
local-authority: RIB
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Proposals likely to generate noise.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Located close to noise sensitive areas (e.g. residential areas, international/national
          conservation sites).
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Proposals likely to generate significant noise (e.g. heavy industry), regardless
          of location.
    - discretionary
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development such as housing.
    - discretionary
  - condition:
      field: wind-turbine
      value: true
      description: All wind energy applications (noise and shadow flicker).
source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
source-text: When required? Proposals which are likely to generate noise located close to noise sensitive
  areas (e.g. close to residential areas and International / Nationally designated conservation sites);
  proposals which are likely to generate significant noise (e.g. heavy industry) regardless of their location;
  and proposals for noise sensitive development such as housing in a location with existing noise emissions
  (e.g. adjacent to an industrial/ commercial area, railway line, motorway or busy A-road).
must-include:
- item: The levels of noise expected to be created and methods for mitigating any impact, or measures
    to protect noise sensitive development from noise
  level: must
- item: Details of any noise mitigation deemed necessary (e.g. acoustic fencing)
  level: must
- item: 'New residential housing (including conversions to residential): to BS8233:2014'
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential housing.
- item: 'Commercial / industrial activities with noise from equipment, plant, flues/fans or delivery vehicles:
    to BS4142:2014+A1:2019'
  level: should
  required-if:
    condition:
      field: noise-generating-use
      value: true
      description: Commercial or industrial noise sources.
- item: 'Wind energy: a plan of occupied buildings within ten times turbine height, site-specific noise
    assessments to ETSU-R-97, and a shadow flicker report for occupied properties and bridleway users
    in that radius'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: A wind energy application.
confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 29, 40. Noise sensitive
  development 'in a location with existing noise emissions' and 'significant noise' have no measure in
  the list, so they show as discretionary. The wind energy part is from 'Wind Energy Applications' (page
  40).
review-status: unverified
field-status: {}
