source-url: https://www.ribblevalley.gov.uk/downloads/file/3789/adopted-validation-checklist-may-2025
source-text: 'When required? All developments which generate significant amounts of transport movement
  shall be accompanied by a Transport Statement or Assessment and Travel Plan. Typically the thresholds
  are as follows, in addition to applications for wind power: ... Food retail GFA >250 <800sq.m >800sq.m
  ... Non-food retail GFA >800 <1500sq.m >1500sq.m ... Dwelling houses Unit >50 <80 units >80 units ...
  Any development which it is considered would have a significant impact on the highway network'
