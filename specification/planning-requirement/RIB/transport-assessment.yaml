confidence: medium
notes: From the council's list (adopted 29 May 2025), section 3.0 (Documents), page 36. The thresholds
  come from the list's table (Transport Statement at the lower band, Transport Assessment and Travel Plan
  at the higher one); the list says they are 'for guidance purposes and should not be read as absolutes',
  and adds 'any development which it is considered would have a significant impact on the highway network',
  so the rule also shows as discretionary. Early pre-application consultation with Lancashire County Council
  as highway authority is recommended. The wind energy part is from 'Wind Energy Applications' (page 38).
