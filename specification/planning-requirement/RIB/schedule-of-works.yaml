source-text: When required? Any application for Listed Building Consent A Method Statement should be submitted
  for replacement, repair or renovation of any historic fabric including works to historic fabric (e.g.
  window/door/roof repairs, re- rendering) and specifications of any joinery/masonry.
must-include:
- item: A method statement for the replacement, repair or renovation of historic fabric
  level: should
- item: Specifications of any joinery/masonry
  level: should
