reference: roof-plan-proposed
local-authority: GRE
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: The application alters or enlarges the roof, or adds a new roof.
  - condition:
      field: new-build
      value: true
      description: The application creates new floors, including the roof.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required - all applications that involve the alteration and enlargement of existing
  floors within a building (including the roof) and/or the creation of new floors (including the roof).
must-include:
- item: At a scale of 1:50 or 1:100 with a scale bar (1:200 may be acceptable for major applications)
  level: must
- item: Direction of North
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 15. From the 'Existing and proposed floor and
  roof plans' section.
review-status: unverified
field-status: {}
