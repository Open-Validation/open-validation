reference: floor-plan-proposed
local-authority: GRE
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application alters or enlarges existing floors within a building (including the
        roof) or creates new floors.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: The application is for a change of use.
    - discretionary
  - application-type:
      in:
      - lbc
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required - all applications that involve the alteration and enlargement of existing
  floors within a building (including the roof) and/or the creation of new floors (including the roof).
must-include:
- item: At a scale of 1:50 or 1:100 with a scale bar (1:200 may be acceptable for major applications)
  level: must
- item: Direction of North
  level: must
- item: Details of the existing buildings
  level: must
- item: The proposed building, including each floor and the roof
  level: must
- item: All floors, including floors with no changes (for householder applications, a statement confirming
    unchanged floors will remain unchanged)
  level: must
- item: The site boundary and the outline of any existing neighbouring buildings
  level: must
- item: Any existing buildings or walls to be demolished
  level: must
- item: 'For new residential accommodation (including conversions): the use of each room, each room size
    and overall unit sizes'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates new residential accommodation, including by conversion.
  source-text: applications proposing new residential accommodation, including conversions, must state
    the use of each room, each room size and overall unit sizes on the plans.
- item: 'For Listed Building Consent and shopfronts: clearly show any proposed changes to the layout'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - condition:
        field: shopfront
        value: true
        description: Shopfronts in a Conservation Area or to a Listed Building.
confidence: medium
notes: From the council's list (published June 2025), page 15, 70, 75, 78. For a change of use, floor
  plans are needed 'where it is necessary to indicate the extent of the use and its relationship to adjacent
  development', so that part shows as discretionary.
review-status: unverified
field-status: {}
