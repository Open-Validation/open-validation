reference: biodiversity-survey-report
local-authority: GRE
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: new-build
          value: true
          description: New building(s) for any use.
      - condition:
          field: residential-extension
          value: true
          description: Extensions.
      - condition:
          field: involves-change-of-use
          value: true
          description: Change of use.
    - any:
      - site:
          in:
          - local-wildlife-site
          - site-of-special-scientific-interest
          description: Part of or next to a site designated for its biodiversity value.
      - condition:
          field: protected-species
          value: true
          description: The site provides potential suitable habitats for protected species.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies OS4, OS(f) and OS(g); London Plan policies G4, G5, G6 and
  G7; Greener Greenwich SPD
source-text: • any major development • any new building(s) for any type of use including residential and
  non-residential, extensions and change of use where it is part of or next to a site designated for its
  biodiversity value or provides potential suitable habitats for protected species
must-include:
- item: Preliminary Ecological Appraisal of existing ecological conditions
  level: must
- item: Extended Phase 1 Habitat Survey identifying biodiversity interests and/or protected species, with
    recommendations for managing/mitigating impact and post-development enhancement
  level: must
- item: Up-to-date surveys carried out at the appropriate time of year by a suitably qualified ecologist,
    following IEEM best practice
  level: must
- item: The biodiversity mitigation hierarchy applied (avoid, minimise and mitigate on site, then off-site
    compensation)
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 25-26. The list says applicants may also submit
  the biodiversity metric.
review-status: unverified
field-status: {}
