reference: sustainable-drainage-strategy
local-authority: GRE
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.25
          description: Land over 0.25 ha.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.25
          description: Land over 0.25 ha.
    - site:
        in:
        - critical-drainage-area
        description: In an area the Royal Borough's Surface Water Management Plan identifies as at risk
          of surface water flooding.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies E2 and E3; London Plan policy SI 13; Flood and Water Management
  Act 2010
source-text: • all major applications • developments on land over 0.25ha in area and in areas identified
  in the Royal Borough’s Surface Water Management Plan to be at risk of surface water flooding.
must-include:
- item: Assessment (site layout, topography, geology) of how surface water will be controlled as near
    to its source as possible
  level: must
- item: Drainage strategy (with FRA where applicable, drainage layout and calculations) showing the development
    does not flood or increase flooding downstream
  level: must
- item: SuDS following the London Plan surface water hierarchy, with evidence that the most sustainable
    strategy is proposed
  level: must
- item: 'Where infiltration SuDS are proposed: feasibility shown by intrusive geotechnical surveys (infiltration
    rates, groundwater levels, contamination)'
  level: must
  required-if: discretionary
- item: 'Where discharging to a watercourse or sewer: evidence that rates are restricted to greenfield
    values and there is adequate downstream capacity, and ''in principle'' agreement from the water company
    for sewer discharge'
  level: must
  required-if: discretionary
- item: 'Where part of a larger permitted site: that the approved drainage scheme is not compromised'
  level: must
  required-if: discretionary
- item: Maintenance plan for the lifetime of the development
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 59-60. Sustainable Drainage System (SuDS Strategy).
  Works affecting an ordinary watercourse also need the council's Ordinary Watercourse Consent.
review-status: unverified
field-status: {}
