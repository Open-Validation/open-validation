reference: heritage-statement
local-authority: GRE
required-if:
  any:
  - site:
      in:
      - world-heritage-site
      - conservation-area
      - listed-building
      - scheduled-monument
      - park-and-garden
      description: 'Designated heritage assets: the Maritime Greenwich World Heritage Site, Conservation
        Areas, Listed Buildings, Scheduled Monuments, Registered Parks and Gardens.'
  - site:
      in:
      - locally-listed-building
      description: Non-designated heritage assets such as Locally Listed Buildings.
  - site:
      in:
      - listed-building-setting
      description: The development could affect the setting of a designated heritage asset.
  - site:
      in:
      - archaeological-priority-area
      description: Archaeological heritage assets; sites within Areas of High Archaeological Potential
        (AHAPs).
  - application-type:
      in:
      - lbc
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies DH3, DH4, DH(h), DH(i), DH(j) and DH(m); London Plan policies
  HC1, HC2 and HC3
source-text: 'All applications involving: • designated heritage assets: The Maritime Greenwich World Heritage
  Site, Conservation Areas, Listed Buildings, Scheduled Monuments, Registered Parks and Gardens • non-designated
  heritage assets such as Locally Listed Buildings • where a development is not a designated heritage
  asset, but it could affect the setting of a designated heritage asset. For example a new house which
  is next to a listed building. • Archaeological Heritage Assets • sites within Areas of High Archaeological
  Potential (AHAPs)'
must-include:
- item: Description of the significance of the heritage assets affected, including the contribution of
    their setting
  level: must
- item: Assessment of the impact of the proposals on the assets' significance
  level: must
- item: How the proposal will preserve and enhance the heritage asset and its setting
  level: must
- item: Evidence that the Greater London Historic Environment Record (GLHER) has been consulted, as a
    minimum
  level: must
- item: 'Where heritage assets with archaeological interest may be present: a desk-based archaeological
    assessment, and a field evaluation where necessary'
  level: must
  required-if: discretionary
- item: 'Within an AHAP: assessment of the impact on archaeological remains and measures for recording,
    interpretation and protection'
  level: must
  required-if:
    site:
      in:
      - archaeological-priority-area
      description: Within an Area of High Archaeological Potential.
- item: 'Where there are major works and/or a number of alterations to a listed building: a full schedule
    of works with a method statement (see schedule-of-works)'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2025), page 45-46, 70, 75, 78. Heritage Impact Assessment.
  Also listed in the householder/flats, Listed Building Consent and shopfront checklists. Applications
  are not validated where the impact on heritage assets cannot be adequately understood.
review-status: unverified
field-status: {}
