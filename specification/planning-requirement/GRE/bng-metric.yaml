reference: bng-metric
local-authority: GRE
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the general biodiversity gain condition (not exempt).
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Environment Act 2021
source-text: All applications unless exempt (See list of exemptions here) Where development would be subject
  to the general biodiversity gain condition, the application must be accompanied by the minimum information
  as set out in Article 7 of The Town and Country Planning (Development Management Procedure) (England)
  Order 2015
must-include:
- item: Statement as to whether the applicant believes the permission would be subject to the biodiversity
    gain condition
  level: must
- item: Pre-development biodiversity value of the onsite habitat on the date of application (or an earlier
    date), with the completed metric calculation tool, its publication date and version
  level: must
- item: 'Where an earlier date is used: the proposed date and the reasons for it'
  level: must
  required-if: discretionary
- item: Statement on whether the onsite biodiversity value is lower because of activities carried on ('degradation'),
    with supporting evidence if so
  level: must
- item: Description of any irreplaceable habitat on the land on the date of application (or earlier date)
  level: must
- item: 'Where significant onsite enhancements are proposed: a draft Habitat Management and Monitoring
    Plan'
  level: should
  required-if: discretionary
- item: 'Where an off-site biodiversity gain site is proposed: draft heads of terms for the section 106
    obligations'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2025), page 18-19. The list says 'All applications unless
  exempt'; shown with the biodiversity-gain-condition field because householder and other exempt applications
  are exempt by law. The two 'should' items are what the list says applicants 'are encouraged' to provide.
review-status: unverified
field-status: {}
