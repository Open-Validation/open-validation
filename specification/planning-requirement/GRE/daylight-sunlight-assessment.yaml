reference: daylight-sunlight-assessment
local-authority: GRE
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies H5, DH1 and DH(b); Greenwich Urban Design Guidance SPD
  2023; London Plan policies D6 and D9
source-text: • all major applications • all applications for tall buildings • any application where there
  is a potential adverse impact upon the current levels of sunlight/daylight enjoyed by adjoining properties
  or building(s), including associated gardens or amenity space • any application for development that
  may themselves be adversely affected by adjoining sites or where one part of the proposed development
  may be impacted upon by another part of the development • all new residential dwellings in a restricted
  setting • backland and infill sites
must-include:
- item: 'Follows the BRE guide ''Site layout planning for daylight and sunlight: A guide to good practice''
    (2022), with an overshadowing study and shadow diagrams at different times of day and year'
  level: must
- item: Diagrams as relevant and a non-technical summary of the conclusions
  level: must
- item: Undertaken by a suitably qualified professional using the relevant BRE guidelines and criteria
  level: must
confidence: medium
notes: 'From the council''s list (published June 2025), page 28-29. Shown as discretionary for everything
  except major applications: the list gives no height for ''tall buildings'' and the other triggers (potential
  adverse impact, restricted settings, backland and infill sites) are judgements.'
review-status: unverified
field-status: {}
