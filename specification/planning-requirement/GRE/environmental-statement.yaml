reference: environmental-statement
local-authority: GRE
required-if:
  condition:
    field: eia-development
    value: true
    description: Schedule 1 development, or Schedule 2 development likely to have significant environmental
      effects.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: 'Required for developments that: is listed within Schedule 1 of the Town and Country Planning
  (Environmental Impact Regulations) 2017 (as amended); or is listed within Schedule 2 of the Regulations
  and likely to have a significant effect on the environment.'
must-include:
- item: 'For non-material (s96a) and minor material (s73) amendments to EIA development: details from
    a suitably qualified consultant showing the changes have been screened and their impacts assessed,
    likely an addendum to the Environmental Statement'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: For applications for Non-Material Amendments (s96a) and Minor Material Amendments (s73)
    for proposals that were originally EIA development, further details will be necessary (from a suitably
    qualified consultant) to show that the proposed changes to the scheme have been screened
confidence: medium
notes: From the council's list (published June 2025), page 34-35. The list gives the Schedule 2 urban
  development thresholds (over 1 ha of non-dwelling urban development, more than 150 dwellings, or over
  5 ha overall) for screening.
review-status: unverified
