reference: energy-statement
local-authority: GRE
required-if:
  ref: major-development
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policy E1; London Plan policies SI 2, SI 3 and SI 4
source-text: • All major applications
must-include:
- item: Prepared in line with GLA guidance on energy assessments, showing how the energy hierarchy has
    been applied, how overheating risk is mitigated and the feasibility of decentralised energy
  level: must
- item: Non-technical summary committing to key measures and CO2 reductions for each stage of the energy
    hierarchy (be lean, be clean, be green, be seen), for domestic and non-domestic elements
  level: must
- item: 'Where the zero carbon target is not met on-site: provision for offsetting the shortfall through
    a payment to the council''s carbon offset fund'
  level: must
  required-if: discretionary
- item: Baseline energy demand and CO2 emissions, with evidence of the calculation (unregulated energy
    also quantified)
  level: must
- item: Regulated CO2 emissions at each stage of the energy hierarchy
  level: must
- item: How the energy system was selected (London Plan policy SI 2 order of preference) and how the cooling
    hierarchy (policy SI 4) has been applied
  level: must
- item: Site-specific feasibility of all renewable technologies, with equipment location and estimated
    output
  level: must
- item: Feasibility of connecting to current or future district heat/power networks
  level: must
- item: Explanation of where and why the development does not meet identified standards, if needed
  level: must
- item: Carbon Emissions Reporting Spreadsheet in xls format
  level: must
- item: Commitment to monitor and report energy performance and CO2 emissions after construction (renewable/low
    carbon technologies for 5 years; 'Be Seen')
  level: must
- item: Whole Life-Cycle Carbon Assessment and actions to reduce life-cycle carbon emissions (currently
    for applications referable to the Mayor)
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2025), page 32-33. Energy Statement / Strategy.
review-status: unverified
field-status: {}
