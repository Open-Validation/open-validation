reference: fire-statement
local-authority: GRE
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: A building is 18 metres or more tall.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: A building has 7 or more storeys.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: The building contains 2 or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: The building is an education building.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
source-text: Fire Statement (Major applications)
confidence: medium
notes: 'Audit (missing_requirement): besides the Fire Statement for majors, non-major schemes with 2+
  dwellings or education buildings that are 18m+ or 7+ storeys need a Fire Statement, Planning Fire Safety
  Strategy or Reasonable Exception Statement. The householder checklist also asks for a fire statement
  for minors.'
review-status: unverified
field-status: {}
