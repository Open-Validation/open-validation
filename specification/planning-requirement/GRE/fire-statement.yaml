reference: fire-statement
local-authority: GRE
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
  - all:
    - application-type:
        in:
        - outline
    - condition:
        field: minor-development
        value: true
        description: Non-major development (major outline applications are exempt).
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: involves-change-of-use
        value: true
        description: Listed Building Consent for a change of use.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: London Plan policy D12
source-text: When required • All major applications ... All non-major developments should provide either
  a - Planning Fire Safety Strategy (PFSS) or a - Reasonable Exception Statement (RES), if it is considered
  that parts or all of policy D12A of the London Plan are not relevant.
must-include:
- item: 'Major: the building''s construction (methods, products and materials, with manufacturers'' details)'
  level: must
  required-if:
    ref: major-development
- item: 'Major: means of escape for all building users, including disabled users, and the evacuation strategy'
  level: must
  required-if:
    ref: major-development
- item: 'Major: features reducing the risk to life (fire alarms, passive and active fire safety measures)
    and their management and maintenance'
  level: must
  required-if:
    ref: major-development
- item: 'Major: access for fire service personnel and equipment (water supplies, firefighting lifts, stairs
    and lobbies, suppression and smoke ventilation) and its maintenance'
  level: must
  required-if:
    ref: major-development
- item: 'Major: provision within the curtilage for fire appliances to reach the building'
  level: must
  required-if:
    ref: major-development
- item: 'Major: how future modifications will not compromise the base build fire safety measures'
  level: must
  required-if:
    ref: major-development
- item: 'Major: a clearly identified section at the start giving evidence that the author is a competent
    fire engineer (Engineering Council IEng or CEng and MIFireE), with relevant training and experience'
  level: must
  required-if:
    ref: major-development
- item: 'Non-major: a Planning Fire Safety Strategy identifying outside space for fire appliances and
    an evacuation assembly point, fire safety features, construction minimising fire spread, means of
    escape and evacuation strategy, and firefighting access and equipment; or a Reasonable Exception Statement
    where policy D12A is not relevant'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - hh
    - condition:
        field: minor-development
        value: true
        description: Non-major development.
- item: 'Reasonable Exception Statement only for householder proposals (or schemes with no new units,
    lifts, external material changes or changes to communal evacuation areas): a covering letter saying
    current fire safety measures are appropriate and unaffected, or the mitigation needed'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - hh
    - condition:
        field: minor-development
        value: true
        description: Non-major development.
- item: 'For Listed Building Consent for a change of use: a fire safety strategy'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Fire safety strategy, sound proofing strategy (for changes of use)
confidence: medium
notes: From the council's list (published June 2025), page 36-38, 70, 75. Major applications are exempt
  for outline permission, section 73 applications, and certain changes of use of or within the curtilage
  of a relevant building. The non-major section names building refurbishments and buildings of two or
  more dwellings or educational accommodation 18m or more high or over 7 storeys, then says all non-major
  developments need a PFSS or an RES. The householder checklist lists 'Fire statement (minors)'.
review-status: unverified
field-status: {}
