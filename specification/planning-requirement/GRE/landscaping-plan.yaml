reference: landscaping-plan
local-authority: GRE
required-if:
  any:
  - ref: major-development
  - condition:
      field: landscaping-works
      value: true
      description: New areas of open space, play space and landscape provision; alterations to a front
        garden in a Conservation Area or to the garden of a Listed Building.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings, including flat conversions.
    - condition:
        field: external-space
        value: true
        description: Garden space is provided.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies DH1, OS(f) and OS4; London Plan policies D3, D4 and G5
source-text: • all major applications • all applications for new areas of open space, play space and landscape
  provision • all applications for flat conversions where garden space is provided • all applications
  for new dwellings where garden space is provided • any proposal including alterations to a front garden
  for householders in Conservation Areas or alterations to the garden for Listed Buildings.
must-include:
- item: 'Minor: plans of hard and soft landscaping for all parts of the site where no buildings are proposed'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor applications.
- item: 'Minor: cycle and car parking and refuse storage'
  level: should
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor applications, where appropriate.
- item: 'Major: indicative hard and soft landscaping plan for all parts of the site without buildings,
    with site features, existing landscaping to be retained and any species of nature conservation interest'
  level: must
  required-if:
    ref: major-development
- item: 'Major: location of biodiversity mitigation/enhancement measures identified in the Habitat Report'
  level: must
  required-if:
    ref: major-development
- item: 'Major: site levels, gradients and any earthworks'
  level: must
  required-if:
    ref: major-development
- item: 'Major: indicative hard landscaping materials'
  level: must
  required-if:
    ref: major-development
- item: 'Major: location of bicycle and/or refuse storage'
  level: must
  required-if:
    ref: major-development
- item: 'Major: public open space for schemes of 50 units or more in areas of public open space deficiency'
  level: must
  required-if:
    all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50 units or more.
    - discretionary
- item: 'Major: private amenity space and its size per unit, and the type of provision (garden, balcony)'
  level: must
  required-if:
    ref: major-development
- item: 'Major: quantum of communal amenity space and children''s playspace'
  level: must
  required-if:
    ref: major-development
- item: Long-term maintenance and landscape management, ecological benefits, climate change adaptation,
    approach to trees and sustainable drainage
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 47-48. Landscaping Strategy. Public open space
  deficiency areas have no mapped field, so that item is partly discretionary.
review-status: unverified
field-status: {}
