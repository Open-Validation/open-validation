    on 2026-11-05'
  status: current
submission-standards:
- item: Maximum file size 10MB per attachment; larger documents broken down into parts and labelled appropriately
  level: must
- item: All documents of a quality that is easily readable in digital form, whether scanned or submitted
    digitally
  level: must
- item: All drawings include a title and drawing number (with the revision number as necessary)
  level: must
- item: All drawings state the print (paper) size and the scale at that print size (e.g. 1:50 at A3)
  level: must
- item: All drawings include a scale bar of 10 metres highlighting each metre (5 metres acceptable for
    householder and minor applications)
  level: must
- item: All plans to a recognisable metric scale (e.g. 1:50, 1:100, 1:200, 1:1250)
  level: must
- item: Drawings show the proposed development in relation to the site boundaries and other existing buildings
    on the site
  level: must
- item: For major applications, existing and proposed plans on separate drawings (householder and minor
    applications may combine them)
  level: must
- item: No 'do not scale' or similar wording on plans
  level: must
- item: Drawings and documents logged with the drawing number, plan name and description when submitted
    on the Planning Portal
  level: should
- item: For householder applications and lawful development certificates, measurements (depth, width,
    height) shown on the drawings
  level: should
