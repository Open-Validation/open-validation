reference: waste-management-plan
local-authority: GRE
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New build developments.
  - condition:
      field: involves-change-of-use
      value: true
      description: Conversions and changes of use.
  - ref: major-development
  - discretionary
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: London Plan policies SI 8 and D6
source-text: • all new build developments or conversions and changes of use • any application which has
  the potential to increase the levels of waste generated ... • all major residential and commercial proposals
must-include:
- item: Storage space for waste and recyclable material for seven days
  level: must
- item: Waste and recycling storage marked on the plans, with access routes for collection vehicles and
    safe stopping locations
  level: must
- item: 'Major: estimated volumes and types of waste produced'
  level: must
  required-if:
    ref: major-development
- item: 'Major: size and location of waste and recycling storage areas'
  level: must
  required-if:
    ref: major-development
- item: 'Major: how waste and recycling is delivered to the stores'
  level: must
  required-if:
    ref: major-development
- item: 'Major: the proposed collection point (if applicable) and how waste is moved there'
  level: must
  required-if:
    ref: major-development
- item: 'Major: access and manoeuvring space for refuse collection vehicles (swept path analysis may be
    required)'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published June 2025), page 56-57, 69. Combines the Refuse and Recycling
  Statement and the Waste Management Strategy (major residential and commercial proposals). 'Potential
  to increase the levels of waste generated' is a judgement, so that part shows as discretionary.
review-status: unverified
field-status: {}
