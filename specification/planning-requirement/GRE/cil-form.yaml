reference: cil-form
local-authority: GRE
required-if:
  any:
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use from non-residential to residential.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: Net additional gross internal area of 100 sq m or more (including extensions).
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The creation of a new dwelling, irrespective of size.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Community Infrastructure Levy Regulations 2010; Royal Greenwich CIL
source-text: 'When required - all applications proposing: • a change of use from non-residential to residential
  • Net additional Gross Internal Area that is 100 sqm or above (including extensions) • The creation
  of a new residential dwelling, irrespective of size.'
must-include:
- item: 'A completed Form 1: CIL Additional Information form (in particular parts 6 and 7)'
  level: must
- item: A completed Local floor space information form
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 17. Conversions of a single dwelling into two
  or more dwellings are not liable for CIL unless the development also includes an extension (of any size).
review-status: unverified
field-status: {}
