reference: flood-risk-assessment
local-authority: GRE
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or greater (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or greater (Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2 or 3, including domestic extensions and change of use to residential.
  - site:
      in:
      - surface-water-flood-risk
      description: Surface water flooding shown as 0.3m or deeper.
  - discretionary
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies E2 and E3; London Plan policies GG6 and SI 12; NPPF
source-text: '• all developments on sites of 1 hectare or greater in Flood Zone 1 • all developments located
  in Flood Zones 2 and 3, including domestic extensions and change of use to residential • all developments
  where surface water flooding is shown as 0.3m or deeper, within 100m of a sewer flooding incident or
  within 250m of a groundwater flooding incident • other developments will require a Flood Risk Assessment
  only when they: · have an adverse effect on a watercourse, floodplain or its flood defences; · would
  impede access to flood defence and management facilities; or · where the cumulative impact of such developments
  would have a significant effect on local flood storage capacity or flood flows.'
must-include:
- item: Flood risk from all sources, plus an allowance for climate change
  level: must
- item: Estimated flood level for the development over its lifetime, taking climate change into account
    (1 in 100 river / 1 in 200 tidal plus climate change)
  level: must
- item: Finished floor levels
  level: must
- item: Flood resistance, resilience and emergency plans
  level: must
- item: Supporting plans and drawings, and any other information the Environment Agency standing advice
    requires
  level: must
- item: 'Where flood defences are present: the residual risk if they are breached or overtopped'
  level: must
  required-if: discretionary
- item: 'For minor development: as a minimum, that the development will be safe for its users for its
    lifetime without increasing flood risk elsewhere, and is sufficiently flood resistant and resilient'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development.
- item: Undertaken by a suitably qualified specialist
  level: should
- item: Mitigation incorporated into the plans (e.g. finished floor levels, SuDS, living roofs)
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 39-42. Sites within 100m of a sewer flooding
  incident or 250m of a groundwater flooding incident, and the 'other developments' (effects on watercourses,
  flood defences or flood storage), have no mapped field yet, so they show as discretionary.
review-status: unverified
field-status: {}
