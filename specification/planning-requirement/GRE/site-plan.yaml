reference: site-plan
local-authority: GRE
required-if:
  any:
  - condition:
      field: footprint-increase
      value: true
      description: The footprint of an existing building is being enlarged.
  - condition:
      field: new-build
      value: true
      description: A new building is being constructed.
  - application-type:
      in:
      - hh
      - s73
      - non-material-amendment
  - all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: footprint-change
          value: true
          description: The building footprint is altering.
      - condition:
          field: landscaping-works
          value: true
          description: Changes to the landscaping are proposed.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required – all applications when the footprint of an existing building is being enlarged
  or a new building is being constructed. ... Block plan at 1:100 or 1:200 showing site boundaries (if
  building footprint is altering or changes to the landscaping are proposed)
must-include:
- item: At a scale of at least 1:200 or 1:500 (1:100 or 1:200 for Listed Building Consent)
  level: must
- item: The existing and proposed situation
  level: must
- item: Direction of North
  level: must
- item: At least the properties on either side and to the front or rear, with existing and proposed features
  level: must
- item: Where the site contains more than one building, the building(s) the application relates to are
    identified
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published June 2025), page 13, 70, 75, 77. The Block Plan section sets
  the footprint/new-building trigger; the householder (and works to a flat) checklist and the Section
  96a/Section 73 checklist list a Block Plan for every such application, and the Listed Building Consent
  checklist only where the footprint alters or landscaping changes. For lawful development certificates
  and larger home extension prior approvals a block plan is only 'suggested', not required.
review-status: unverified
field-status: {}
