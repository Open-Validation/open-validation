reference: town-centre-impact-assessment
local-authority: GRE
required-if:
  any:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses (Class E and sui generis) outside the major, district and local
        centres and neighbourhood parades.
  - all:
    - site:
        in:
        - shopping-frontage
        description: Within a primary, secondary or local shopping frontage (ground floor only).
    - condition:
        field: loss-of-use
        value: true
        description: A non-retail use is proposed.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: NPPF; Royal Greenwich Core Strategy policies TC1, TC(a) and TC(b); London Plan policies E9, SD6,
  SD7 and SD8
source-text: • applications for main town centre uses (Class E commercial, business and service and Class
  Sui Generis) of located outside of the major, district and local centres and neighbourhood parades.
  • applications for non-retail uses with within primary, secondary or local shopping frontages (ground
  floor only).
must-include:
- item: 'Out of centre: a sequential test of alternative sites in town centres, local centres, neighbourhood
    parades and edge-of-centre locations'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Out of centre location.
- item: 'Out of centre, 2,500 sq m gross floorspace and above: an impact assessment on the vitality and
    viability of town and local centres'
  level: must
  required-if:
    all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Out of centre location.
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 2500
        description: 2,500 sq m gross floorspace and above.
confidence: medium
notes: From the council's list (published June 2025), page 57. Retail Statement/Retail Impact Assessment.
review-status: unverified
field-status: {}
