reference: planning-statement
local-authority: GRE
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: departure-from-development-plan
      value: true
      description: Development which is a departure from the development plan.
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - ref: major-development
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
source-text: • all applications except householders, extensions to flats, Advertisement Consent, Prior
  Approvals, Lawful Development Certificates, Discharge of Conditions • any development which is a departure
  from the development plan. • all applications for non-material and minor material amendments where the
  originally approved scheme was a major development.
must-include:
- item: The relevant development plan policies, including the London Plan, with commentary on how the
    proposal accords with them (a bare list of policies is not valid)
  level: must
- item: 'For non-material and minor material amendments: how the proposals have changed, a list of the
    approved plans and what replaces each, and a schedule of the works proposed'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
- item: Assessment and justification of any loss of community facilities (e.g. doctor's surgery, amenity/play
    space, community halls)
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: The proposal would lose a community facility.
- item: 'Where a Marketing Report is required: an overview of the marketing exercise and the case for
    the proposed loss'
  level: should
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: Loss of vacant employment, Class E or community floorspace.
confidence: medium
notes: From the council's list (published June 2025), page 55-56. Full applications for extensions to
  flats are excepted, as are householder applications.
review-status: unverified
field-status: {}
