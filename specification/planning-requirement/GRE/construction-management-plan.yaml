reference: construction-management-plan
local-authority: GRE
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies E(a), E(c), IM4 and IM(a); London Plan policies D13, D14,
  SI 1, T2, T4 and T7; Greener Greenwich SPD
source-text: • all major applications and others likely to have a detrimental impact on air quality during
  the demolition and or construction phase or would introduce additional dust and or plant and machinery
  emissions to an area of existing poor air quality. • all major applications and others likely to have
  a detrimental noise impact during demolition and or construction • all major applications and others
  likely to have a significant impact on traffic congestion or pedestrian safety. • any application where
  loading activities associated with the construction phase of a development would cause congestion or
  obstruction on the public highway - particularly where temporary closures are required on the highway
  or where safe and legal loading can’t take place off the public highway. • where significant excavation
  is proposed, or large elements are to be delivered.
must-include:
- item: Plan to scale identifying site access points and where safe and legal loading can take place
  level: must
- item: How deliveries could be managed to reduce vehicle movements and use more sustainable modes
  level: must
- item: Site entrances and exits, wheel washing, hard standing, stockpiles, hoardings (location, height,
    type), dust suppression, water supplies and nearest neighbouring receptors
  level: must
- item: Vehicle routing to the nearest Strategic Road Network, avoiding schools, residential areas and
    high streets where possible
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 29. Demolition and/or Construction Management
  and Logistics Plan (draft). Required for all major applications; for others it depends on likely impacts,
  so that part shows as discretionary.
review-status: unverified
field-status: {}
