reference: schedule-of-works
local-authority: GRE
required-if:
  all:
  - any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Works to a listed building.
  - discretionary
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies DH3 and DH(h); London Plan policy HC1
source-text: Where there are major works and/or a number of alterations proposed to a listed building
  (including repairs), a full schedule of the works will need to accompany the heritage impact assessment
  and shall include a method statement explaining the principles for the works.
must-include:
- item: A method statement explaining the principles for the works
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 46, 75. From the Heritage Impact Assessment
  section and the Listed Building Consent checklist ('Schedule of works (for major works and/or a number
  of alterations)'). Shown as discretionary because 'major works and/or a number of alterations' has no
  threshold.
