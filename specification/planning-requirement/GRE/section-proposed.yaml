reference: section-proposed
local-authority: GRE
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application alters or enlarges existing floors (including the roof) or creates
        new floors.
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels, or the site slopes.
  - ref: major-development
  - condition:
      field: involves-change-of-use
      value: true
      description: The application is for a change of use.
  - application-type:
      in:
      - lbc
  - application-type:
      in:
      - advertising
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required – all applications that involve the alteration and enlargement of existing
  floors within a building (including the roof) and/or the creation of new floors (including the roof);
  where a proposal involves changes to ground levels; or, for any application on a sloping site, or any
  major application, change of use.
must-include:
- item: At a scale of 1:50 or 1:100 with a scale bar (1:200 may be acceptable for major applications)
  level: must
- item: Cross sections through the site and buildings, with existing site levels and finished floor levels
    related to a fixed datum point off-site
  level: must
- item: Foundations and eaves levels
  level: must
- item: The proposals in relation to existing site levels and to adjoining buildings
  level: must
- item: 'For advertisement consent: sections of all proposed adverts at 1:20 showing the building, how
    they are fixed to it and the extent of projection'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For shopfronts in a Conservation Area or to a Listed Building: proposed section of the shopfront
    at 1:10 or 1:20'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: Shopfronts in a Conservation Area or to a Listed Building.
confidence: medium
notes: From the council's list (published June 2025), page 15, 70, 75, 76, 78. Sections section plus the
  Listed Building Consent, advertisement and shopfront checklists.
review-status: unverified
field-status: {}
