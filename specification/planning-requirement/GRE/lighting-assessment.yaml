reference: lighting-assessment
local-authority: GRE
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: External lighting is proposed.
  - any:
    - discretionary
    - condition:
        field: floodlighting
        value: true
        description: Outdoor sports facilities (including MUGAs) with external lighting.
    - condition:
        field: protected-species
        value: true
        description: The site/area could be used by bats and/or other protected species.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policy E(a)
source-text: 'All proposals involving: • the provision of public realm where external lighting is proposed
  • outdoor sports facilities (including MUGAs) where external lighting is proposed • where external lighting
  is proposed and there is the potential for the site/area to be used by bats and/or other protected species'
must-include:
- item: Layout plan with beam orientation, a schedule of equipment and the intensity of illumination
  level: must
- item: Directional hoods or other mitigation
  level: must
- item: Hours of operation and time of any automatic cut-off
  level: must
- item: Lux contour plan where outdoor floodlighting is proposed
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: Outdoor floodlighting is proposed.
- item: Possible effects on light-sensitive wildlife such as bats
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 49. 'Provision of public realm' has no field,
  so that part shows as discretionary.
review-status: unverified
field-status: {}
