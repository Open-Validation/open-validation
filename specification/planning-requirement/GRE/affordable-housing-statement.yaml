reference: affordable-housing-statement
local-authority: GRE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential development on a site capable of providing 10 or more homes.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Residential site of 0.5 hectares or more.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policy H3; London Plan policies S1, GG4, D5, H4, H5, H6 and H7;
  Planning Obligations (S106) SPD
source-text: Proposals for residential development on sites capable of providing 10 or more homes or residential
  sites of 0.5ha or more.
must-include:
- item: Schedule of market housing and each type of affordable housing, by units, habitable rooms and
    floor area (GIA and GEA where possible)
  level: must
- item: Total affordable provision as a percentage of all residential provision, and each affordable tenure
    as a percentage of affordable provision, by units, habitable rooms and floor area
  level: must
- item: Location of the affordable units on a plan to scale, identifying tenure type, size and layout
  level: must
- item: Clear and full explanation of the levels or types of affordability or tenure for different units,
    including rent levels and other costs such as service charges
  level: must
- item: Details of any discussions with affordable housing providers and of any Registered Providers acting
    as partners
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 21-22. Can be a chapter in the Design and Access
  or Planning Statement. See also viability-assessment.
review-status: unverified
field-status: {}
