reference: land-contamination-assessment
local-authority: GRE
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major application with a residential element.
  - site:
      in:
      - contaminated-land
      description: The site is known to be, or is likely to have been, in contaminated uses.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policy E(e); London Plan policies SD1 and E7
source-text: • All major planning applications with a residential element • Any applications where the
  site is known to be or likely to have been in contaminated uses
must-include:
- item: Preliminary Risk Assessment meeting current guidance, e.g. the Model Procedures for the Management
    of Land Contamination (CLR 11) and BS 10175:2011+A2:2017
  level: must
- item: Regard to the potential for unexploded ordnance
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 47. Land Contamination – Preliminary Risk Assessment.
review-status: unverified
field-status: {}
