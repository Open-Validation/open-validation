reference: archaeological-assessment
local-authority: GRE
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      description: Within an Area of High Archaeological Potential (Figure 4 of the Core Strategy).
  - condition:
      field: ground-disturbance
      value: true
      description: Groundworks are proposed.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policy DH(m); London Plan policy HC1
source-text: All applications within an Area of High Archaeological Potential (illustrated in Figure 4
  of the Core Strategy) where groundworks are proposed.
must-include:
- item: Results of an archaeological evaluation
  level: should
  required-if:
    any:
    - condition:
        field: basement
        value: true
        description: New basements or extensions to basements.
    - condition:
        field: earthworks
        value: true
        description: Other extensive groundworks.
  source-text: Where such proposals include new basements, extensions to basements or other extensive
    groundworks, the results of an archaeological evaluation should be included.
confidence: medium
notes: From the council's list (published June 2025), page 24. Archaeological Desk Based Assessment. See
  also heritage-statement (archaeological heritage assets).
review-status: unverified
field-status: {}
