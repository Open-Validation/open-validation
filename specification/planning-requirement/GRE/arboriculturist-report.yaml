reference: arboriculturist-report
local-authority: GRE
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within the site or on adjacent land (including street trees) that would be affected.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies OS(f) and OS(g); London Plan policy G7
source-text: all applications where there are trees within the application site or on land adjacent and
  would be affected by the development (including street trees). Such trees need to be categorised as
  described in British Standards 5837 (2012).
must-include:
- item: Prepared by a qualified arboriculturist, in line with BS 5837 (2012), with trees categorised as
    BS 5837 describes
  level: must
- item: Species, spread, roots and position of existing trees
  level: must
- item: Trees to be felled, and trees affected (including on adjacent sites) with protection measures
    during construction
  level: must
- item: Tree survey, tree constraints plan, Arboricultural Implications Assessment and Arboricultural
    Method Statement with a Tree Protection Plan
  level: must
- item: 'Implications Assessment: tree/building relationships at the end of the project, demolition and
    construction issues, where protection is needed (special foundations in root protection areas, storage,
    worker facilities), trees retained and felled, protective fencing and ground protection'
  level: must
- item: 'Where trees are removed: adequate replacement based on the value of the trees lost (e.g. i-Tree
    or CAVAT)'
  level: should
  required-if:
    condition:
      field: loss-of-habitat-features
      value: true
      description: Trees are to be removed.
confidence: medium
notes: From the council's list (published June 2025), page 64-66. Tree Survey / Arboricultural Report.
  Also listed in the householder/flats checklist where trees are affected.
review-status: unverified
field-status: {}
