reference: elevation-proposed
local-authority: GRE
required-if:
  any:
  - condition:
      field: external-alterations
      value: true
      description: The application changes an external part of the building.
  - condition:
      field: new-boundary-treatment
      value: true
      description: The application changes boundary walls, gates or fences.
  - application-type:
      in:
      - lbc
      - advertising
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required - all applications that involve changes to any external part of the building,
  including to boundary walls, gates and fences
must-include:
- item: At a scale of 1:50 or 1:100 with a scale bar (1:200 may be acceptable for major applications)
  level: must
- item: All elevations, including blank elevations (for householder applications, a statement confirming
    unchanged elevations will remain unchanged)
  level: must
- item: The full elevation of the building (for flats in a larger converted property, the entire elevation
    of the building, not just the flat)
  level: must
- item: Relationship to neighbouring buildings, with the positions of windows and doors on all buildings
  level: must
- item: No other proposed work that has not been carried out and is not part of the application
  level: should
- item: No existing or proposed trees, hedges or boundary fences drawn in front of the elevation
  level: should
- item: 'For Listed Building Consent: proposed external elevations at 1:50 or 1:100 clearly showing any
    proposed changes, and internal elevations at 1:10 or 1:20 as necessary'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For advertisement consent: elevations or a computer-generated image of all proposed adverts on
    the building, pole or hoarding, including height above ground'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For advertisement consent: a drawing of each advert at 1:20 noting all colours and materials'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For advertisement consent: details of any illumination (external or internal), its colour and
    method'
  level: must
  required-if:
    condition:
      field: illuminated
      value: true
      description: The advertisement is illuminated.
- item: 'For shopfronts in a Conservation Area or to a Listed Building: proposed elevation of the shopfront
    at 1:10 or 1:20'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: The proposal is a shopfront in a Conservation Area or to a Listed Building.
confidence: medium
notes: From the council's list (published June 2025), page 13-14, 70, 75, 76, 78. Elevations section,
  plus the householder/flats, Listed Building Consent, advertisement consent and shopfront checklists.
review-status: unverified
field-status: {}
