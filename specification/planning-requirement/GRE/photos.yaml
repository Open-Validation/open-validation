reference: photos
local-authority: GRE
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - conservation-area
      - world-heritage-site
      description: Development affecting a Conservation Area and/or a World Heritage Site.
  - application-type:
      in:
      - hh
      - lbc
      - ldc-proposed-work-lb
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
source-text: • all major applications • applications for development affecting conservation areas and/or
  a World Heritage Site, Listed Building Consent or Certificate of Lawfulness for works to a listed building
must-include:
- item: Verified views with 3D visualisations/CGI images/renders showing the development in its context
    (details agreed with officers at pre-application stage)
  level: must
  required-if: discretionary
- item: 'For listed buildings: photographs dated and numbered, cross-referenced to the drawings, showing
    where works are proposed (inside and outside) and the building''s relationship to its surroundings'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
        - ldc-proposed-work-lb
    - site:
        in:
        - listed-building
        description: Works to a listed building.
- item: 'For householder applications and works to flats: photographs of the site and surroundings'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Photographs of the site and surroundings
confidence: medium
notes: From the council's list (published June 2025), page 54, 70, 75, 76. Photographs and Photomontages.
  The householder/flats checklist lists photographs of the site and surroundings; the Listed Building
  Consent checklist asks for photographs of all areas where changes are proposed. Verified views are discretionary
  because the list says the details should be agreed with officers.
review-status: unverified
field-status: {}
