reference: noise-assessment
local-authority: GRE
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Noise generating sources, plant or machinery, or noise generating activities.
  - condition:
      field: plant-equipment
      value: true
      description: Flue/ventilation extraction systems are proposed.
  - condition:
      field: noise-sensitive-use
      value: true
      description: The development is noise sensitive or close to existing sources of noise and/or vibration.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies H5 and E(a); London Plan policies D13 and D14
source-text: 'Any application that: • includes noise generating sources; plant and or machinery or noise
  generating activities, • proposes flue/ventilation extraction systems (in such cases a Ventilation/Extraction
  Statement will be required as well). • are themselves noise sensitive or close to existing sources of
  noise and/or vibration.'
must-include:
- item: Prepared by a qualified acoustician, in line with British Standards and World Health Organisation
    guidelines
  level: must
- item: Existing noise levels measured over 24 hours, including background noise
  level: must
- item: Proposed noise levels or outputs
  level: should
- item: Measures proposed to reduce noise (e.g. design, orientation, insulation)
  level: must
- item: Examples of the calculations and assumptions made
  level: must
- item: Measuring equipment and calibration certificate
  level: must
- item: 'For sites adjoining a main line railway: a vibration assessment'
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 51-53. The list names noise-sensitive uses
  (homes, student accommodation, care homes, hotels, schools, hospitals) and noise-generating uses (rail,
  pubs/bars/music venues, leisure, B8 logistics, wharves, B2 industry, sports facilities and others).
  Proposed noise levels are asked for 'where appropriate'.
review-status: unverified
field-status: {}
