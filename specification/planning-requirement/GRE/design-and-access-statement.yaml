reference: design-and-access-statement
local-authority: GRE
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Within a Conservation Area and/or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 sq m or more of floorspace.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'When required – any application for: • Major developments (those which involve the creation
  of 10 or more residential units; residential development on a site of 0.5 hectares or more; development
  on a site of at least 1 hectare; or the provision of a building or buildings where the floor space to
  be created by the development is 1,000 square metres or more) • one or more dwellings or a building
  or buildings where the floorspace created is 100sq.m or more within a Conservation Area and / or World
  Heritage Site'
must-include:
- item: Proportionate to the scale of the development, and very visual (diagrams, sketches, plans and
    photographs)
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 16-17. The list repeats the national contents
  of a Design and Access Statement (design principles, context, access policy, consultation on access,
  specific access issues); they are not repeated here.
review-status: unverified
field-status: {}
