reference: design-and-access-statement
local-authority: GRE
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 sqm or more of floorspace.
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
source-text: 'Portal website Design and Access Statement Local Validation Requirements List – 2025 When
  required – any application for: Major developments (those which involve the creation of 10 or more residential
  units; residential development on a site of 0.5 hectares or more; development on a site of at least
  1 hectare; or the provision of a building or buildings where the floor space to be created by the development
  is 1,000 square metres or more)'
confidence: medium
notes: 'Audit (wrong_trigger): the excerpt was cut off and left out the conservation area / World Heritage
  Site trigger (one or more dwellings or 100 sqm+ floorspace).'
review-status: unverified
field-status: {}
