reference: air-quality-assessment
local-authority: GRE
required-if:
  any:
  - ref: major-development
  - condition:
      field: biomass-or-chp
      value: true
      description: Biomass boilers, biomass or gas-fired combined heat and power (CHP), or another source
        of significant dust or chemicals.
  - discretionary
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policy E(c); London Plan policies GG3, SI 1 and SI 2; Greener Greenwich
  SPD
source-text: '• All major development • Minor developments that are likely to have a significant impact
  on air quality or would introduce exposure to an area of existing poor air quality. • If your proposals
  include any of the following, you will need to submit an Air Quality Assessment although you should
  take advice from Planning Officers and/or Air Quality Officer as part of duty planner and pre-application
  discussions: · proposals that will result in increased traffic movement including congestion, or a change
  in traffic volumes and/or vehicle speed · proposals that would significantly alter the traffic composition
  in an area, such as bus stations, HGV parks and new road layouts · proposals that include new car, coach
  or lorry parks. · developments which may affect vulnerable users i.e. schools, nurseries and those associated
  with the elderly, sensitive areas or areas of poor air quality. · developments including biomass boilers,
  biomass or gas-fired combined heat and power (CHP) or any such other source of significant dust or chemicals
  · developments which would introduce new residents into an area of existing poor air quality'
must-include:
- item: Assessment of current air quality in the area
  level: must
- item: Potential pollutant sources from the development during construction and operation
  level: must
- item: Pollutants that may be emitted and which objectives they may impinge on
  level: must
- item: Impact assessment, with pollutant concentrations predicted at suitable receptors and a comparison
    of with- and without-development scenarios for the first year of occupation
  level: must
- item: Mitigation measures, incorporated into the building design, including measures for air quality
    in external play spaces for infants and children
  level: must
- item: An Air Quality Neutral Assessment, written to GLA guidance, showing compliance with London Plan
    policy SI 1
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 units or more.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: 1,000 sq m or more of floorspace.
  source-text: An Air Quality Neutral Assessment is also required for developments that are:10 units or
    more or 1000 square meters or more of floor space to demonstrate compliance with Policy SI 1 of the
    London Plan.
confidence: medium
notes: 'From the council''s list (published June 2025), page 22-23. Shown partly as discretionary: minor
  developments ''likely to have a significant impact'', traffic changes, new car parks, vulnerable users
  and new residents in areas of poor air quality have no threshold or mapped area, and the list says to
  take officers'' advice.'
review-status: unverified
field-status: {}
