reference: elevation-existing
local-authority: GRE
required-if:
  any:
  - condition:
      field: external-alterations
      value: true
      description: The application changes an external part of the building.
  - condition:
      field: new-boundary-treatment
      value: true
      description: The application changes boundary walls, gates or fences.
  - application-type:
      in:
      - lbc
      - advertising
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When required - all applications that involve changes to any external part of the building,
  including to boundary walls, gates and fences
must-include:
- item: At a scale of 1:50 or 1:100 with a scale bar (1:200 may be acceptable for major applications)
  level: must
- item: All elevations, including blank elevations (for householder applications, a statement confirming
    unchanged elevations will remain unchanged)
  level: must
- item: The full elevation of the building (for flats in a larger converted property, the entire elevation
    of the building, not just the flat)
  level: must
- item: Relationship to neighbouring buildings, with the positions of windows and doors on all buildings
  level: must
- item: No other proposed work that has not been carried out and is not part of the application
  level: should
- item: No existing or proposed trees, hedges or boundary fences drawn in front of the elevation
  level: should
- item: 'For window replacements: existing elevations, or high-quality titled photographs each showing
    the entire elevation and clearly showing the style and glazing pattern of the existing windows; each
    window to be replaced identified by a number or letter'
  level: must
  required-if:
    condition:
      field: external-alterations
      value: true
      description: The application replaces windows.
  source-text: Existing elevations or high-quality photographs of existing elevations. • If submitting
    photographs, each photograph must have a title e.g. Document 1 – front elevation, Document 2 – rear
    elevation, etc. Photographs must show each entire elevation where one or more windows are proposed
    to be replaced.
- item: 'For advertisement consent: existing elevation(s) at no less than 1:100, or a clear photograph
    of the existing building(s)'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For Listed Building Consent: existing external elevations at 1:50 or 1:100, and internal elevations
    at 1:10 or 1:20 as necessary'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the council''s list (published June 2025), page 13-14, 70, 74, 75, 76, 78. Elevations section,
  plus the per-type checklists: householder/flats, window replacements, Listed Building Consent, advertisement
  consent and shopfronts in Conservation Areas or to a Listed Building (existing and proposed elevations
  at 1:50 or 1:100).'
review-status: unverified
field-status: {}
