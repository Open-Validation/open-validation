reference: location-plan
local-authority: GRE
required-if:
  always: true
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required – all applications
must-include:
- item: At a recognisable scale, normally 1:1250
  level: must
- item: Application site outlined in red, with a blue line around any other land owned by the applicant
    close to or adjoining the site
  level: must
- item: Direction of North
  level: must
- item: Street number/name of the application property and its neighbours
  level: must
- item: All buildings, roads and footpaths on land adjoining the site
  level: must
- item: Red line includes all land needed to carry out the development (e.g. access from a public highway,
    visibility splays, landscaping, car parking, open land around the building)
  level: must
- item: Where the site contains more than one building, the building(s) the application relates to are
    identified
  level: must
  required-if: discretionary
- item: Public rights of way crossing or adjoining the site
  level: should
- item: Position of all trees on the site and on adjacent land
  level: should
confidence: medium
notes: From the council's list (published June 2025), page 12-13. The 'should' items are what the list
  says the plan should include 'unless these would not influence or be affected by the proposed development'.
  The per-application-type checklists (pages 70-79) list a Site Location Plan for every type.
review-status: unverified
field-status: {}
