reference: viability-assessment
local-authority: GRE
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The scheme fails to meet affordable housing policy on viability grounds (including
        S73 applications).
  - discretionary
source-url: https://www.royalgreenwich.gov.uk/sites/default/files/2025-07/Local_Validation_List_2025.pdf
policy: Royal Greenwich Core Strategy policies H3, EA(a) and EA(b); London Plan policies GG4, H5 and DF1;
  Planning Obligations Guidance SPD; GLA Affordable Housing and Viability SPG 2017
source-text: • applications that fail to meet policy requirements for affordable housing, where the justification
  is on the grounds of financial viability, including S73 applications. • applications which do not follow
  the Fast-Track Route, as set out at Policy H5 of the London Plan • any other major development where
  the deliverability of the scheme as designed needs to be understood • any application where the viability
  of the existing use is relevant
must-include:
- item: 'Where affordable housing policy cannot be met: evidence that affordable housing has been maximised
    as far as viable'
  level: must
- item: Un-redacted, submitted for publication with the other application documents
  level: must
- item: A residual land value and a benchmark land value
  level: must
- item: Evidence for all values and costs, including the benchmark land value
  level: must
- item: All assumptions identified and justified
  level: must
- item: A viability model capable of full interrogation by the council and its advisors
  level: must
confidence: medium
notes: From the council's list (published June 2025), page 67-68. Schemes outside the Fast-Track Route,
  majors whose deliverability needs to be understood and schemes where existing-use viability is relevant
  show as discretionary.
review-status: unverified
field-status: {}
