reference: biodiversity-survey-report
local-authority: TRF
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - any:
    - site:
        in:
        - special-protection-area
        - special-area-of-conservation
        - site-of-special-scientific-interest
        - local-wildlife-site
        description: Development within, adjacent to, or likely to affect a designated site (European
          Site, SSSI, Site of Biological Importance).
    - condition:
        field: demolition
        value: true
        description: The proposal involves demolition.
    - discretionary
source-url: https://www.trafford.gov.uk/sites/default/files/2025-06/planning-application-validation-checklist-january-2025.pdf
source-text: 'ECOLOGICAL AND BIODIVERSITY SURVEY (INCLUDING PROTECTED SPECIES SURVEYS) Threshold – Requirement
  for Full and Outline or Householder planning applications for the following: Development (including
  householder) within, adjacent to, or likely to affect a designated site (European Site, Site of Special
  Scientific Interest, Site of Biological Importance)'
confidence: medium
notes: 'From the audit (wrong_app_type): the survey also covers roofspace works and demolition. The excerpt
  gives only the first trigger, so roofspace works and the rest are shown as officer discretion.'
review-status: unverified
field-status: {}
