reference: affordable-housing-statement
local-authority: TRF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Housing developments of 10 or more units (15 or more in 'cold' market locations).
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A site area of 0.5 hectares or more ('hot' and 'moderate' market locations).
source-url: https://www.trafford.gov.uk/sites/default/files/2025-06/planning-application-validation-checklist-january-2025.pdf
source-text: AFFORDABLE HOUSING STATEMENT Threshold – Requirement for Full or Outline planning applications
  for housing developments proposing 10 or more residential units or where the site has an area of 0.5
  hectares or more in “hot” market locations (Altrincham and open countryside) and “moderate” market locations
  (Sale, Urmston and Stretford) and 15 or more residential units in “cold” market locations (Partington,
  Carrington and Old Trafford).
confidence: medium
notes: 'Audit (wrong_app_type): Full or Outline, not Outline only. The market-location thresholds can''t
  be expressed as fields; in ''cold'' locations (Partington, Carrington, Old Trafford) the threshold is
  15 units.'
review-status: unverified
field-status: {}
