  notes: Grokbot's link is to Trafford's current list, the Application Validation Checklist adopted January
    2025; it works and the date is right. The extraction is poor. It misses about 15 local requirements,
    including the Green Belt Impact Statement, Design Code Compliance Statement, Façade Design Analysis,
    Accommodation Schedule, Materials Schedule, Digital Connectivity, Heat Network and Housing Needs.
    It ignores the checklist's per-application-type lists, so Householder, Reserved Matters, NMA and other
    types are largely empty. Many triggers come from the wrong section, and SuDS pro-forma form fields
    are listed as drawing standards.
