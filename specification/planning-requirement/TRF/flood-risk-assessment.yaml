reference: flood-risk-assessment
local-authority: TRF
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2 or 3.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: A site of 1 hectare or more in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: A site of 1 hectare or more in Flood Zone 1.
    - all:
      - site:
          in:
          - critical-drainage-area
          description: The site is in a Critical Drainage Area.
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 0.5
            description: The site measures 0.5ha or more.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 0.5
            description: The site measures 0.5ha or more.
    - discretionary
source-url: https://www.trafford.gov.uk/sites/default/files/2025-06/planning-application-validation-checklist-january-2025.pdf
source-text: Flood Risk Assessment – Where a site measures 0.5ha or more within Critical Drainage Areas
  as identified in the Council’s Strategic Flood Risk Assessment
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the checklist threshold is Flood Zone 3 or 2, sites of
  1ha or more in Flood Zone 1, 0.5ha or more in Critical Drainage Areas, and Canal Hazard Zones (no field;
  shown as officer discretion), for Full and Outline applications, not listed building consent.'
review-status: unverified
field-status: {}
