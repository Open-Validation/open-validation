reference: fire-statement
local-authority: TRF
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.trafford.gov.uk/sites/default/files/2025-06/planning-application-validation-checklist-january-2025.pdf
source-text: 'Fire Statement – required for all applications for full planning permission which involve:
  Provision of one or more relevant buildings, or'
confidence: medium
notes: '''Relevant buildings'' as defined in the DMPO (18m+ or 7+ storeys with 2+ dwellings or educational
  accommodation). The excerpt is cut off after ''or''.'
review-status: unverified
field-status: {}
