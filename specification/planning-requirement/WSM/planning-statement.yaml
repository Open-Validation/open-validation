reference: planning-statement
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: NPPF; London Plan 2021; Westminster City Plan 2019-2040
source-text: Required for • all major applications; ... • where planning obligations are required • Recommended
  for minor development including changes of use, certificates of lawfulness.
must-include:
- item: The context and need for the development, and how it accords with the NPPF, London Plan, City
    Plan, neighbourhood plan policies and other guidance or SPDs
  level: should
- item: Pre-application consultation with the council, the community and statutory consultees, its outcome
    and how the proposals changed in response
  level: should
- item: A statement of the proposed Heads of Terms, where planning obligations will be needed
  level: should
  required-if: discretionary
- item: A full site by site schedule of existing and proposed floorspace, where land use swaps are proposed
  level: must
  required-if: discretionary
- item: Whether the application falls within Schedule 1 or Schedule 2 of the Town and Country Planning
    (Discharge of Local Planning Authority Functions) (England) Regulations 2026
  level: should
confidence: medium
notes: From the council's list (published July 2026), page 24-25 (L32). Applications needing planning
  obligations show as discretionary; it is only recommended for minor development.
review-status: unverified
field-status: {}
