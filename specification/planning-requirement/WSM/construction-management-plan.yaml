reference: construction-management-plan
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - demolition-con-area
      - outline
      - s73
      - approval-condition
  - any:
    - condition:
        field: basement
        value: true
        description: Development involving basement excavation (Checklist B).
    - discretionary
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Westminster City Plan 2019-2040 Policies 37, 41 and 50; Code of Construction Practice
source-text: Required for • all development involving basement excavation (Checklist B); and • all other
  Level 1and Level 2 development as defined in the CoCP (Checklist A).
must-include:
- item: Signed Appendix A checklist from the Code of Construction Practice (Checklist B for basements,
    Checklist A for other Level 1 and Level 2 development)
  level: must
confidence: medium
notes: From the council's list (published July 2026), page 17 (L15 Code of Construction Practice (CoCP),
  Signed Appendix A Checklist). Level 1 and Level 2 development is defined in the Code of Construction
  Practice, so it shows as discretionary.
