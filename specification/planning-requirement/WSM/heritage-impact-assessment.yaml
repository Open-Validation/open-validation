  - application-type:
      in:
      - hh
      - full
      - demolition-con-area
      - lbc
      - s73
      - outline
      - reserved-matters
  - site:
      in:
      - world-heritage-site
      description: Proposals that may affect the Westminster World Heritage Site.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
