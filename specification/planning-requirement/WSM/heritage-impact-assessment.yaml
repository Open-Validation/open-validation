source-text: HIA required where proposals may affect the ... Westminster World Heritage Site.
must-include:
- item: Follows the Guidance and Toolkit for Impact Assessments in a World Heritage Context
  level: should
confidence: medium
notes: From the council's list (published July 2026), page 21-22 (L25). A separate HIA is for development
  with the potential to impact on the Outstanding Universal Value of the World Heritage Site. MHCLG has
  retired this id into heritage-statement.
review-status: unverified
