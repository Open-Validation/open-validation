reference: sustainability-statement
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: Creates new floorspace.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Westminster City Plan 2019-2040 Policies 42, 43 and 44; Environment SPD (2026)
source-text: Required for all applications which create new floorspace.
must-include:
- item: How the design addresses the sustainable design principles in City Plan Policy 42D and related
    policies 38B, 40, 43 and 44
  level: should
- item: A clear overarching summary of the sustainability and retrofit requirements, what the statement
    covers and cross-references to other documents
  level: must
- item: Sustainability and Retrofit Reporting Checklist
  level: should
  required-if: discretionary
- item: If within the Design and Access Statement, a clearly identified separate section
  level: should
confidence: medium
notes: From the council's list (published July 2026), page 27-28 (L40 Sustainable Design Statement (SDS)
  and Sustainability and Retrofit First Reporting Checklist). The checklist is for larger or more complex
  proposals (shown as discretionary). Householders can use the council's simple template.
review-status: unverified
field-status: {}
