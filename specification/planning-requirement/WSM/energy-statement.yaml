reference: energy-statement
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - ref: major-development
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: London Plan 2021 Policies SI2 and SI4; Westminster City Plan 2019-2040 Policy 40; Environment
  SPD (2026)
source-text: Required for major development.
must-include:
- item: How the development will be net zero carbon following the Mayor's energy hierarchy, and how any
    residual emissions will be offset
  level: must
- item: Cooling Strategy showing how internal overheating and reliance on air conditioning will be reduced
    (London Plan cooling hierarchy)
  level: must
- item: Prepared following the Mayor's latest Energy Assessment Guidance, with the GLA Carbon Emissions
    Reporting Spreadsheet and the 'Be Seen' Reporting Spreadsheet
  level: must
- item: BRUKL outputs and TER/DER worksheets
  level: should
confidence: medium
notes: From the council's list (published July 2026), page 19 (L21 Energy Strategy (including Cooling
  Strategy)).
review-status: unverified
field-status: {}
