reference: affordable-housing-statement
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Creates a new home.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Westminster City Plan 2019-2040 Policy 13; London Plan 2021 Policy H5; Planning Obligations and
  Affordable Housing SPD
source-text: Required if proposal creates a new home
must-include:
- item: Whether the scheme is 'major' or 'small-scale' residential development
  level: should
- item: Information about both the market housing and the affordable housing provision
  level: should
- item: Proposed tenure, unit mix and design of the on-site affordable housing
  level: should
confidence: medium
notes: From the council's list (published July 2026), page 13 (L8).
review-status: unverified
field-status: {}
