reference: town-centre-impact-assessment
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses outside the CAZ and the town centre hierarchy.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: NPPF Section 7; Westminster City Plan 2019-2040 Policy 18; London Plan 2021 Policy SD7
source-text: Required where main town centre uses are proposed outside of the CAZ and the town centre
  hierarchy; Impact Assessment required for new, or extensions to existing, edge or out- of-centre development
  for retail, leisure and office uses that do not accord with the Development Plan.
confidence: medium
notes: From the council's list (published July 2026), page 26 (L36 Sequential Test and Impact Assessment).
  The impact assessment part only applies to retail, leisure and office uses that do not accord with the
  Development Plan.
review-status: unverified
field-status: {}
