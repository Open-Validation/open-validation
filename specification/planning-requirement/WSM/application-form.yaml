reference: application-form
local-authority: WSM
required-if:
  always: true
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications
must-include:
- item: Signed and dated
  level: must
- item: Completed Ownership certificate A, B, C or D, as appropriate
  level: must
- item: Completed Agricultural holdings certificate (whether or not the site includes an agricultural
    holding)
  level: must
- item: Data required by the GLA Planning London Datahub, as set out on the Planning Portal 1APP form
  level: should
- item: Biodiversity Net Gain statement confirming whether the BNG general condition applies or, if exempt,
    the reasons for the exemption
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
confidence: medium
notes: From the council's list (published July 2026), page 5, 7 (N1 and N6). The BNG statement on the
  application form (N6) is listed for full, outline, reserved matters and removal/variation of conditions;
  householder forms include it automatically.
review-status: unverified
field-status: {}
