reference: land-contamination-assessment
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - demolition-con-area
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: basement
        value: true
        description: Basement development.
    - site:
        in:
        - contaminated-land
        description: The site is known or suspected to be contaminated.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Westminster City Plan 2019-2040 Policy 37; National Planning Policy Guidance - Contamination
source-text: Required for • all applications for basement development; • if application site is known
  to be or is suspected of being contaminated.
must-include:
- item: Radon Assessment
  level: should
  required-if:
    condition:
      field: basement
      value: true
      description: Basement development.
confidence: medium
notes: From the council's list (published July 2026), page 17 (L16 Contaminated Land Assessment).
review-status: unverified
field-status: {}
