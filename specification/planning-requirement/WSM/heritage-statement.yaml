reference: heritage-statement
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - demolition-con-area
      - lbc
      - s73
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - world-heritage-site
        - scheduled-monument
        - park-and-garden
        description: Affects designated heritage assets (World Heritage Site, scheduled monuments, listed
          buildings, conservation areas, registered parks and gardens) or their settings.
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Sections 66 and 72, Planning (Listed Buildings and Conservation Areas) Act 1990; Westminster City
  Plan 2019-2040 Policy 44; London Plan 2021 Policies HC1 and HC2
source-text: Required if proposal affects heritage assets ... or their settings.
must-include:
- item: Proportionate to the nature of the proposal; if within the Design and Access Statement, a clearly
    identified separate section on heritage
  level: should
- item: 'For retrofit proposals: cross-reference to the Sustainable Design Statement or Retrofit Plan,
    and how the Environment SPD advice has been considered'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2026), page 21-22 (L25 Heritage Statement/Heritage Impact
  Assessment). Non-designated heritage assets (unlisted buildings of merit, statues and open spaces of
  heritage significance) show as discretionary.
review-status: unverified
field-status: {}
