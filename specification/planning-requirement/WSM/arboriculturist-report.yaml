reference: arboriculturist-report
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - demolition-con-area
      - outline
      - reserved-matters
      - s73
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Likely to affect trees within the site or on adjacent land, including street trees.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: London Plan 2021 Policy G7; Westminster City Plan 2019-2040 Policies 38 and 50
source-text: Required if proposal is likely to affect trees within the application site or on land adjacent
  to the site (including street trees).
must-include:
- item: Prepared by a qualified arboriculturist following BS 5837:2012 (or any later version)
  level: must
- item: Details of tree protection measures
  level: must
confidence: medium
notes: From the council's list (published July 2026), page 29 (L44 Tree Survey/Arboricultural Assessment
  (incl. details of tree protection measures)).
review-status: unverified
field-status: {}
