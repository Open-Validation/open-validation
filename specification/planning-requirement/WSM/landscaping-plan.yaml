reference: landscaping-plan
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - ref: major-development
    - condition:
        field: basement
        value: true
        description: Basement development extending below garden land.
    - discretionary
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: London Plan 2021 Policies D8, G5 and G7; Westminster City Plan 2019-2040 Policies 38 and 48; Environment
  SPD
source-text: Required for • major development, • basement development extending below garden land, • development
  creating new public realm and private space or resulting in the loss of existing landscaping. Where
  new green roofs and walls are proposed landscaping details/ management plan should be provided.
must-include:
- item: Any hard landscaping and boundary treatment
  level: must
- item: Tree and shrub sizes, species, numbers and planting densities
  level: must
- item: Any green features or spaces, such as green walls, green roofs and rain gardens
  level: must
- item: Management and maintenance arrangements
  level: must
- item: 'Green roof or wall management plan: substrate depth and specification, number, size, species
    and density of planting, maintenance regime and irrigation'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2026), page 22 (L26 Landscaping/Replacement Planting Strategy
  and landscaping details). New public realm or private space, loss of existing landscaping and new green
  roofs or walls show as discretionary.
review-status: unverified
field-status: {}
