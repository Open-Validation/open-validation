reference: design-and-access-statement
local-authority: WSM
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Development in a designated area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of new floorspace.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - listed-building
        - conservation-area
        description: The house is a listed building or in a conservation area.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
source-text: major development; development in a designated area ... 100m2 or more of new floorspace;
  all applications for listed building consent … Design and Access Statement and/or Heritage Statement
  Required where you live in a listed building or if your property is located within a conservation area
  .
confidence: medium
notes: 'Audit (wrong_trigger): the Full planning row carried the Foul Sewage and Utilities trigger. The
  householder wording (Design and Access Statement and/or Heritage Statement) is from the council''s householder
  page.'
