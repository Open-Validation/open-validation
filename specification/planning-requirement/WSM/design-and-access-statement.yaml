reference: design-and-access-statement
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - lbc
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a designated area (a conservation area or World Heritage Site).
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Would create one or more dwelling houses.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: Would create 100 sq m or more of new floorspace.
    - application-type:
        in:
        - lbc
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  Section 10, Planning (Listed Buildings and Conservation Areas) Act 1990; London Plan 2021 policies D4,
  D5 and SI5; Westminster City Plan 2019-2040 Policy 42
source-text: 'Required for: • major development ... • development in a designated area ... which would
  create one or more dwelling houses or 100m2 or more of new floorspace; and • all applications for listed
  building consent.'
must-include:
- item: How it meets London Plan, City Plan and any made neighbourhood plan policies, where relevant
  level: should
- item: Supported by photographs, maps and drawings
  level: should
- item: A separate statement or paragraph on access and inclusive design, having regard to London Plan
    Policy D5 and City Plan Policy 42 (and Policy 16 where relevant)
  level: must
- item: If sustainable design information is included, a clearly identified section showing where the
    L40 sustainable design requirements are addressed
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2026), page 6 (N4). A designated area is a conservation
  area or World Heritage Site (footnote 4).
review-status: unverified
field-status: {}
