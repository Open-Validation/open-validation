reference: flood-risk-assessment
local-authority: WSM
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or greater.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or greater.
  - condition:
      field: basement
      value: true
      description: Basement development.
  - site:
      in:
      - flood-risk-zone
      description: Development in Flood Zones 2 and 3.
  - site:
      in:
      - critical-drainage-area
      description: Development within a Surface Water Flood Risk Management Zone.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
source-text: 'Flood Risk Assessment (FRA) 20 (Including Sustainable Drainage where not covered by separate
  Sustainable Drainage Strategy) Required for: 1. all development of 1 hectare or greater; 2. all basement
  development; 3. all development in Flood Zones 2 and 3 as defined by the Environment Agency; and 4.
  all development within a Surface Water Flood Risk Management Zone where there may be…'
confidence: medium
notes: 'Applies to householder applications too (the householder page: basement excavation, Flood Zones
  2 and 3, or a Surface Water Flood Risk Management Zone).'
review-status: unverified
field-status: {}
