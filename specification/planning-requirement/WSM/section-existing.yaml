reference: section-existing
local-authority: WSM
required-if:
  condition:
    field: building-works
    value: true
    description: Physical alterations are proposed.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications where physical alterations, and/ or a change of use are proposed.
  ... Exact plans required will vary depending on the nature of the proposals but typically would include
  - existing and proposed floor plans (including roof plans where relevant), elevations and sections.
must-include:
- item: Drawn to an identified scale (e.g. 1:50, 1:100); plans show the direction of North
  level: must
- item: Labelled appropriately (naming conventions), with a linear scale bar on each drawing
  level: should
- item: Demolition plans, sections and elevations with areas to be demolished hatched in red, showing
    the existing footprint and elevations compared to proposed and which walls are to be demolished
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: Demolition is proposed.
- item: 'For replacement windows or doors: existing and proposed sections showing the glazing bar pattern,
    with larger scale section details of glazing bars, beading or spacing between panes'
  level: must
  required-if:
    condition:
      field: external-alterations
      value: true
      description: Replacement windows or doors.
confidence: medium
notes: From the council's list (published July 2026), page 10-12 (L1 plans, drawings and information (also
  L3 listed buildings and L4 advertisements)). The list says exact plans vary but typically include sections.
review-status: unverified
field-status: {}
