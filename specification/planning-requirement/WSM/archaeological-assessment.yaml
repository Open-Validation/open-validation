reference: archaeological-assessment
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - all:
      - ref: major-development
      - condition:
          field: ground-disturbance
          value: true
          description: Includes excavation or ground works.
      - site:
          in:
          - archaeological-priority-area
          description: Within an Archaeological Priority Area (APA) Tiers 1-3.
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: Includes excavation or ground works.
      - site:
          in:
          - archaeological-priority-area
          description: Within an Archaeological Priority Area (APA) Tiers 1-2.
    - discretionary
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: NPPF para 207; Westminster City Plan 2019-2040 Policy 44; London Plan 2021 Policy HC1
source-text: Required for • major development including excavation / ground works within an Archaeological
  Priority Area (APA) Tiers 1-3; and • development including excavation / ... ground works, within an
  APA Tiers 1-2. • may be required for other development within APAs
must-include:
- item: Desk-based assessment prepared by an IFA registered or other suitably qualified organisation or
    individual
  level: should
- item: Field evaluation, in some circumstances
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2026), page 14-15 (L11). Other development within APAs,
  where advised by the Greater London Archaeology Advisory Service, shows as discretionary.
review-status: unverified
field-status: {}
