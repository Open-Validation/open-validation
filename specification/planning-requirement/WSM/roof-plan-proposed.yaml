  - condition:
      field: building-works
      value: true
      description: Physical alterations are proposed.
  - condition:
      field: roof-alteration
      value: true
      description: Roof plans where relevant (works to the roof).
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all applications where physical alterations, and/ or a change of use are proposed.
  ... Exact plans required will vary depending on the nature of the proposals but typically would include
  - existing and proposed floor plans (including roof plans where relevant), elevations and sections.
must-include:
- item: Drawn to an identified scale (e.g. 1:50, 1:100); plans show the direction of North
  level: must
- item: Labelled appropriately (naming conventions), with a linear scale bar on each drawing
  level: should
confidence: medium
notes: From the council's list (published July 2026), page 10 (L1). 'Where relevant' is read as works
  affecting the roof.
