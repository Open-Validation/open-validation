reference: cil-form
local-authority: WSM
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - s73
    - non-material-amendment
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Community Infrastructure Levy Regulations 2010 (as amended)
source-text: Required for all applications.
must-include:
- item: CIL Additional Information Form 1
  level: must
- item: All parts of the form completed, including the tables at parts 6 and 7
  level: must
  required-if:
    condition:
      field: cil-liable
      value: true
      description: The application is CIL liable.
- item: CIL Form 2 (Assumption of Liability)
  level: should
- item: Existing and proposed floor plans with measured internal areas (GIA, measured to the latest RICS
    Code of Measuring Practice) and a CIL Statement
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published July 2026), page 12 (L7). Non-material amendments only where
  floorspace or uses change. The case officer may ask for the major-application information on non-major
  applications.
review-status: unverified
field-status: {}
