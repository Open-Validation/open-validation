reference: biodiversity-survey-report
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - demolition-con-area
      - outline
      - reserved-matters
      - s73
  - any:
    - site:
        in:
        - local-wildlife-site
        description: On or close to a designated Site of Importance for Nature Conservation (SINC).
    - condition:
        field: protected-species
        value: true
        description: May impact protected or priority species.
    - site:
        in:
        - priority-habitat
        description: May impact priority habitats.
    - discretionary
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Westminster City Plan 2019-2040 Policy 38; London Plan 2021 Policy G6; Environment SPD (2026)
source-text: Required i. if the proposed development is on or close to a designated Site of Importance
  for Nature Conservation (SINC), and/ or ii. where development may impact on biodiversity particularly
  protected or priority species or habitats or another local green space, waterbody or ecological feature.
must-include:
- item: Preliminary Ecological Appraisal (PEA) in line with CIEEM guidance, including a GIGL data search
  level: should
- item: Any follow-up surveys or reports identified as necessary in the PEA, provided at validation stage
  level: must
confidence: medium
notes: 'From the council''s list (published July 2026), page 15-16 (L12 Biodiversity Survey/Ecological
  Report). Other local green space, waterbodies and ecological features show as discretionary. Footnote
  14 lists development that may trigger (ii): within 50m of woodland, water, hedgerows or tree lines;
  bridges, tunnels, cellars and similar; floodlighting; felling or lopping veteran or large trees; derelict
  land, allotments, railway land; buildings where protected species are known (demolition, roof, loft
  or cellar works); and development subject to mandatory BNG. All major applications should have undertaken
  a PEA.'
review-status: unverified
field-status: {}
