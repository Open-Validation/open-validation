reference: viability-assessment
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Residential development that does not include the policy compliant affordable housing
        provision or contribution, justified on viability grounds.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Westminster City Plan 2019-2040 Policy 13; London Plan 2021 Policies H4, H8, H11, H13, H15 and
  H16
source-text: Required for all residential development ... where this generates a requirement to provide
  affordable housing, does not include the necessary policy compliant provision/financial contribution
  and this is being justified on viability grounds.
must-include:
- item: Prepared having regard to the Mayor's Affordable Housing and Viability SPG and draft Affordable
    Housing LPG
  level: should
- item: Methodology in line with the latest RICS guidance on viability
  level: should
confidence: medium
notes: From the council's list (published July 2026), page 13 (L9 Affordable Housing Viability Assessment).
  Includes estate regeneration, build to rent, older persons, student and shared living housing.
review-status: unverified
field-status: {}
