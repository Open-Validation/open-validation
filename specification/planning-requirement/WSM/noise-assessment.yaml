reference: noise-assessment
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: plant-equipment
        value: true
        description: Proposals for external plant and equipment.
    - condition:
        field: noise-sensitive-use
        value: true
        description: New noise sensitive development (e.g. residential) in areas with high noise levels.
    - discretionary
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Westminster City Plan 2019-2040 Policy 37; London Plan 2021 Policies D13 and D14; Environment
  SPD
source-text: Required for all development that • includes proposals for external plant and equipment;
  • could affect noise sensitive receptors ... or tranquil open spaces; • could cause existing nearby
  uses to have to curtail their activities (agent of change principle); and • for new noise sensitive
  development (e.g. residential) in areas with high noise levels.
must-include:
- item: Refers to BS 4142:2019 and BS 8233:2014 (or the latest versions)
  level: should
confidence: medium
notes: From the council's list (published July 2026), page 23-24 (L29 Noise Impact Assessment (Acoustic
  report)). Effects on noise sensitive receptors or tranquil open spaces and the agent of change show
  as discretionary.
review-status: unverified
field-status: {}
