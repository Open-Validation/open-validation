reference: fire-statement
local-authority: WSM
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: A building is 18 metres or more tall.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: A building has 7 or more storeys.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: The building contains 2 or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: The building contains educational accommodation.
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
source-text: 'Fire Statement Gateway One Required for all applications which involve: provision of one
  or more relevant buildings5, or'
confidence: medium
notes: 'Audit (wrong_trigger, missing_requirement): the Gateway One trigger was cut off (''relevant buildings''
  as defined nationally); from the audit, a London Plan Fire Statement (L22) is also required for all
  major development.'
review-status: unverified
field-status: {}
