reference: fire-statement
local-authority: WSM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - all:
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 2
            description: Two or more dwellings.
        - condition:
            field: educational-accommodation
            value: true
            description: Educational accommodation.
      - any:
        - condition:
            field: building-height
            operator: '>='
            value: 18
            description: 18m or more in height.
        - condition:
            field: storey-count
            operator: '>='
            value: 7
            description: 7 or more storeys.
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - ref: major-development
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015;
  London Plan 2021 Policy D12
source-text: 'Required for all applications which involve: • provision of one or more relevant buildings
  ... or • development of an existing relevant building or development within the curtilage of a relevant
  building. ... Required for all major development.'
must-include:
- item: Planning Gateway One fire statement on the Government's standard template
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18m or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
- item: 'For major development: an independent fire strategy addressing London Plan Policy D12, produced
    by a third party, suitably qualified assessor'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published July 2026), page 7, 20 (N5 Fire Statement - Gateway One, and
  L22 Fire Statement - London Plan). Combines the national Gateway One fire statement (relevant buildings)
  and the London Plan fire statement (all major development, whether or not it is a relevant building).
review-status: unverified
field-status: {}
