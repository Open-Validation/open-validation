reference: photos
local-authority: WSM
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - demolition-con-area
        - lbc
        - advertising
        - outline
        - reserved-matters
        - s73
        - approval-condition
    - any:
      - all:
        - ref: major-development
        - discretionary
      - condition:
          field: demolition
          value: true
          description: Involves the demolition of an existing building.
      - site:
          in:
          - conservation-area
          - listed-building
          description: Affects a conservation area or a listed building.
  - application-type:
      in:
      - ldc-existing-use
      - consent-under-tpo
      - notice-trees-in-con-area
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Westminster City Plan 2019-2040 Policies 44 and 45
source-text: Required for • large redevelopment schemes • if the proposal involves the demolition of an
  existing building/ affects a conservation area or a listed building. • to support Lawful Development
  Certificate for An Existing Use or Activity. • works affecting trees subject to a TPO or notifications
  of trees works in conservation areas. Useful in all cases
must-include:
- item: Photographic record of the existing building or structures on the site, showing all spaces and
    features affected
  level: should
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition of an existing building.
    - site:
        in:
        - conservation-area
        - listed-building
        description: Affects a conservation area or listed building.
- item: Dated and numbered, and cross-referenced to the plans and drawings
  level: should
- item: Context photographs and accurate visual representations showing the impact on the building and
    the street scene
  level: should
- item: Verified views where LVMF or significant views are affected
  level: should
  required-if:
    site:
      in:
      - protected-view
      description: LVMF or other significant views are affected.
confidence: medium
notes: From the council's list (published July 2026), page 11 (L2 Photographs and Accurate Visual Representations/3D
  Models). 'Large redevelopment schemes' show as discretionary within major development.
review-status: unverified
field-status: {}
