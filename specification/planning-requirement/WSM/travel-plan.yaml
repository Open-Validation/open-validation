reference: travel-plan
local-authority: WSM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: mayor-referable
        value: true
        description: Referable to the Mayor of London (Mayor of London Order 2008).
    - condition:
        field: school-expansion
        value: true
        description: New and expanded education facilities.
    - discretionary
source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
policy: Westminster City Plan 2019-2040 Policy 28; London Plan 2021 Policy T4
source-text: In addition, a Travel Plan is required for applications referrable to the Mayor and in other
  limited circumstance for example schemes for new and expanded education facilities
confidence: medium
notes: From the council's list (published July 2026), page 29 (L43). Other limited circumstances, normally
  agreed at pre-application stage, show as discretionary.
review-status: unverified
