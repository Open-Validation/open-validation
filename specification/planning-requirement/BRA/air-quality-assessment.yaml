source-text: 'If your application is for one of these types of planning permission, you need to submit
  an air quality assessment if your proposed development may: be exposed to poor air quality result in
  emissions which reduce air quality'
confidence: medium
notes: From the council's list (updated February 2020), 'Air quality assessment' record of the online
  Planning validation requirements directory. Listed for all 21 application types in the directory, so
  no application-type limit is shown. 'May be exposed to' or 'may result in' poor air quality is a judgement
  (the guidance points to sites near employment areas, roads, railways and town centres), so it is discretionary.
  The Environmental Health team advises on scope.
