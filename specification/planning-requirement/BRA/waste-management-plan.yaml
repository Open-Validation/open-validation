reference: waste-management-plan
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
      - ldc
      - change-of-use
      - approval-condition
      - non-material-amendment
      - outline
      - pip
      - s73
      - reserved-matters
      - technical-details-consent
  - any:
    - condition:
        field: waste-storage-facilities
        value: true
        description: Includes bin storage.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: A new dwelling.
source-url: https://www.braintree.gov.uk/directory-record/6471/refuse-plan
policy: Braintree District Local Plan 2013-2033 policies LPP52
source-text: 'If your application is for one of these types of planning permission, you need to submit
  an amenity garden plan if your proposal includes: includes bin storage is for a new dwelling'
must-include:
- item: Bin storage, which may be shown on the block plan; a separate bin storage plan for major development
  level: must
- item: Collection points
  level: must
- item: Confirmation that refuse vehicles can function within the development
  level: must
- item: Scale of 1:100, 1:200 or 1:500
  level: must
- item: Tracked route of a 26 tonne refuse freighter around the development
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated February 2020), 'Refuse plan' record of the online Planning validation
  requirements directory. The record's trigger sentence says 'amenity garden plan' by mistake, but it
  is the refuse plan (refuse strategy) record. The freighter tracking is listed without saying when it
  applies (it matters only where vehicles enter the site), so it is discretionary.
review-status: unverified
field-status: {}
