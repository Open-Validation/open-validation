reference: lighting-assessment
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - advertising
      - full
      - ldc
      - change-of-use
      - demolition-con-area
      - approval-condition
      - lbc
      - non-material-amendment
      - outline
      - pip
      - prior-approval
      - s73
      - reserved-matters
      - technical-details-consent
  - condition:
      field: external-lighting
      value: true
      description: The development incorporates or needs lighting.
source-url: https://www.braintree.gov.uk/directory-record/6429/lighting-assessment
policy: Braintree District Local Plan 2013-2033 policies LPP77; Braintree External Lighting Supplementary
  Planning Document
source-text: If your application is for one of these types of planning permission, you need to submit
  a lighting assessment if your proposed development incorporates or needs lighting. You do not have to
  submit a lighting assessment if you are a making an application for Householder planning consent .
must-include:
- item: How the lighting will be energy efficient and dark sky compliant
  level: must
- item: Luminaires, mounting heights and beam angles
  level: must
- item: Light spill
  level: must
- item: Times of operation
  level: must
confidence: medium
notes: 'From the council''s list (updated February 2020), ''Lighting assessment'' record of the online
  Planning validation requirements directory. Every type except householder. Examples given: street lighting
  on major developments and specialist lighting such as sports pitches or floodlighting.'
review-status: unverified
field-status: {}
