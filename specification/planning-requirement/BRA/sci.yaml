reference: sci
local-authority: BRA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.5
      description: More than 0.5 hectares where the number of dwellings isn't given.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: 100 square metres or more of floor space created.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Site of 1 hectare or more.
source-url: https://www.braintree.gov.uk/directory-record/6445/planning-statement-and-statement-of-community-involvement
policy: Braintree District Council Statement of Community Involvement 2021
source-text: 'Mandatory requirement You must always submit a statement of community involvement if your
  application: Is to build 10 or more dwellings Is for an area of more than 0.5 hectares if the number
  of dwellings isn’t given Is to create 100 square metres or more of floor space Is for a site of 1 hectare
  or more We do not need a statement of community involvement for some developments such as large agricultural
  buildings in the open countryside.'
confidence: medium
notes: From the council's list (updated February 2020), 'Planning statement and statement of community
  involvement' record of the online Planning validation requirements directory. Some developments, such
  as large agricultural buildings in the open countryside, are exempt; the duty planner advises.
