reference: section-proposed
local-authority: BRA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - ldc
        - change-of-use
        - demolition-con-area
        - approval-condition
        - hh
        - lbc
        - non-material-amendment
        - outline
        - pip
        - prior-approval
        - s73
        - reserved-matters
        - technical-details-consent
    - any:
      - condition:
          field: site-level-change
          operator: '>'
          value: 1000
          description: Changes to site levels of more than one metre.
      - discretionary
      - condition:
          field: earthworks
          value: true
          description: The proposal includes engineering operations.
      - condition:
          field: new-build
          value: true
          description: The proposal is for a new building.
  - all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: roof-space-room
          value: true
          description: Works at upper floor levels creating accommodation beneath the roof.
      - condition:
          field: advert-on-existing-building
          value: true
          description: Attaching new signage to the listed building.
      - condition:
          field: solar-panels
          value: true
          description: Attaching solar panels to the listed or curtilage listed building.
source-url: https://www.braintree.gov.uk/directory-record/6480/site-levels
policy: Braintree District Local Plan 2013-2033 policies LPP1, LPP52, LPP36, SP7, LPP53, LPP55, LPP56,
  LPP57, LPP58, LPP59
source-text: 'If your application is for one of these types of planning permission, you need to submit
  site levels if your proposal: is to make changes to site levels of more than one metre is for a site
  where existing vary by more than one metre includes engineering operations is for a new building You
  do not have to submit site levels for household and commercial extensions. … You need to submit listed
  building section drawings if your application for listed building consent includes: works at upper floor
  levels, where accommodation is being created beneath the roof. For example within the attic of a house,
  or the creation of first floor accommodation within a barn conversion attaching new signage to a listed
  building. Your listed building section drawings must show how you will attach the sign attaching solar
  panels to the listed building or any curtilage listed building. This should provide details of the projection
  and fixings.'
must-include:
- item: Cross section(s) through the proposed building(s) and site
  level: must
- item: Drawn to an appropriate metric scale, for example 1:50 or 1:100
  level: must
- item: Existing and proposed levels related to a fixed point nearby that the works will not affect
  level: must
- item: The proposals in relation to adjoining land and buildings
  level: must
- item: 'Where ground levels change: existing and finished levels, foundations, retaining structures,
    how eaves relate to adjacent land and boundaries, and how encroachment on adjacent land will be avoided'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels.
- item: 'Listed building signage: how the sign will be attached'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building solar panels: projection and fixings'
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (updated February 2020), 'Site levels' record of the online Planning validation
  requirements directory. Mapped from the 'Site levels' record, which asks for cross sections showing
  existing and proposed levels. A site whose existing levels vary by more than one metre has no matching
  field, so that part is discretionary. Not needed for household and commercial extensions. The outline
  and reserved matters pages also ask for 'Existing and proposed sections' on the same level tests. Also
  covers the 'Listed building section drawings' record (https://www.braintree.gov.uk/directory-record/6431/listed-building-section-drawings);
  the solar-panels field is new (first used by BRA). The listed building consent page lists 'Listed building
  sections' among the documents always required.
review-status: unverified
field-status: {}
