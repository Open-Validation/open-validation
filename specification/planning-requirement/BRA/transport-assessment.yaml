reference: transport-assessment
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - approval-condition
      - non-material-amendment
      - outline
      - pip
      - prior-approval
      - s73
      - reserved-matters
      - technical-details-consent
  - discretionary
source-url: https://www.braintree.gov.uk/directory-record/6500/transport-assessment
policy: Essex County Council Development Management Policies (Feb 2011) DM13; Braintree District Local
  Plan 2013-2033 policies LPP1, LPP42, LPP43, LPP20, SP5, LPP2, SP7, LPP52, LPP78, SP6
source-text: You can find out from Appendix B of the Essex County Council Development Management Policies
  (Feb 2011) if you need to submit a travel assessment with your application. If your proposal is for
  a small scale development, you can submit a simplified transport statement. You can also submit a transport
  statement if your proposal has limited transport issues.
must-include:
- item: Accessibility to the site by all modes of transport
  level: must
- item: Modal split of journeys
  level: must
- item: Measures to improve access by public transport, walking and cycling and to mitigate transport
    impact
  level: must
- item: Peak time vehicle movements to and from the development
  level: must
- item: Scope agreed with the Highway Authority (and with the Highways Agency for development on a trunk
    road)
  level: must
confidence: medium
notes: From the council's list (updated February 2020), 'Transport assessment' record of the online Planning
  validation requirements directory. The thresholds are in Appendix B of Essex County Council's Development
  Management Policies, which the list only refers to, so this is discretionary.
review-status: unverified
field-status: {}
