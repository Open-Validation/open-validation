reference: roof-plan-proposed
local-authority: BRA
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - ldc
        - demolition-con-area
        - approval-condition
        - lbc
        - non-material-amendment
        - outline
        - pip
        - prior-approval
        - s73
        - technical-details-consent
    - condition:
        field: roof-alteration
        value: true
        description: Development on the roof or altering a roof line (or a condition about the roof line).
source-url: https://www.braintree.gov.uk/directory-record/6477/roof-plan
policy: Braintree District Local Plan 2013-2033 policies LPP1, LPP36, LPP52, SP7
source-text: 'If your application is for one of these types of planning permission, you need to submit
  a roof plan if your proposal is to: carry out a development that is located on the roof carry out a
  development that relates to alteration to a roof line amend a condition that refers to amending a roof
  line discharge a condition that refers to amending a roof line remove or vary a condition that refers
  to amending a roof line'
confidence: medium
notes: From the council's list (updated February 2020), 'Roof plan' record of the online Planning validation
  requirements directory. The application-type pages list a roof plan as always required for householder,
  agricultural, commercial, residential conversion/new build, reserved matters and proposed-use LDC applications
  (full covers agricultural, commercial and residential), so those types are shown without a test; for
  other types the roof test on the document page applies. A new conservatory's product specification may
  include a scaled roof plan.
review-status: unverified
field-status: {}
