reference: viability-assessment
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - approval-condition
      - non-material-amendment
      - outline
      - pip
      - s73
      - reserved-matters
      - technical-details-consent
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Not policy compliant for affordable housing.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: Not policy compliant for open space or any other required contribution.
source-url: https://www.braintree.gov.uk/directory-record/6502/viability-appraisals
policy: Braintree District Local Plan 2013-2033 policies LPP1, LPP52, LPP11, LPP10, LPP61, LPP9, LPP12,
  LPP15, SP7, LPP50, LPP78, SP6
source-text: You must submit a viability appraisal if your application is for a development that doesn’t
  meet our policies on; affordable housing open space any other required contribution
must-include:
- item: Drawn up by a suitably qualified professional
  level: must
- item: Open book approach
  level: must
- item: Development costs and revenue in detail
  level: must
confidence: medium
notes: From the council's list (updated February 2020), 'Viability appraisals' record of the online Planning
  validation requirements directory. The applicant pays for the council's independent review.
review-status: unverified
field-status: {}
