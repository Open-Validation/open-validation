reference: design-and-access-statement
local-authority: BRA
required-if:
  any:
  - ref: major-development
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more houses.
    - site:
        in:
        - conservation-area
        - listed-building-setting
        description: In a conservation area or the setting of a listed building.
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: new-build
        value: true
        description: New building(s).
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Floor space created greater than 100 square metres.
  - application-type:
      in:
      - lbc
source-url: https://www.braintree.gov.uk/directory-record/6411/design-and-access-statement
policy: Planning (Listed Buildings and Conservation Areas) Regulations 1990, section 3A; Town and Country
  Planning (Development Management Procedure) (England) Order 2015
source-text: 'If your application is for one of these types of planning permission, you need to submit
  a design and access statement if your proposal is for: a major development one or more houses within
  a conservation area or setting of a listed building new building(s) within a conservation area where
  the floor space created is greater than 100 square metres listed build consent. … You do not need to
  submit a design and access statement is if you are applying for: permission to develop land without
  compliance with conditions previously attached, made under to section 73 of the Planning (Listed Buildings
  and Conservation Areas) Regulations 1990 a material change in the use of land or buildings apart from
  conversions to residential use'
must-include:
- item: Design principles and concepts applied to the development
  level: must
- item: Steps taken to appraise the context and how the design takes it into account
  level: must
- item: The policy adopted for access, and how access policies in local development documents have been
    taken into account
  level: must
- item: Any consultation on access, and how its outcomes were used
  level: must
- item: How specific issues that might affect access have been addressed
  level: must
- item: 'Listed building consent: the special architectural or historic interest, the physical features
    that justify the designation, and the building''s setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (updated February 2020), 'Design and access statement' record of the online
  Planning validation requirements directory. Not needed for s73 applications or for changes of use other
  than conversion to homes. The reserved matters page lists it among the documents always required; the
  residential and householder pages add development in a World Heritage Site.
review-status: unverified
field-status: {}
