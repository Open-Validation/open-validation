reference: section-existing
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
      - ldc
      - change-of-use
      - demolition-con-area
      - approval-condition
      - hh
      - lbc
      - non-material-amendment
      - outline
      - pip
      - prior-approval
      - s73
      - reserved-matters
      - technical-details-consent
  - any:
    - condition:
        field: site-level-change
        operator: '>'
        value: 1000
        description: Changes to site levels of more than one metre.
    - discretionary
    - condition:
        field: earthworks
        value: true
        description: The proposal includes engineering operations.
    - condition:
        field: new-build
        value: true
        description: The proposal is for a new building.
source-url: https://www.braintree.gov.uk/directory-record/6480/site-levels
policy: Braintree District Local Plan 2013-2033 policies LPP1, LPP52, LPP36, SP7
source-text: 'If your application is for one of these types of planning permission, you need to submit
  site levels if your proposal: is to make changes to site levels of more than one metre is for a site
  where existing vary by more than one metre includes engineering operations is for a new building You
  do not have to submit site levels for household and commercial extensions.'
must-include:
- item: Cross section(s) through the proposed building(s) and site
  level: must
- item: Drawn to an appropriate metric scale, for example 1:50 or 1:100
  level: must
- item: Existing and proposed levels related to a fixed point nearby that the works will not affect
  level: must
- item: The proposals in relation to adjoining land and buildings
  level: must
- item: 'Where ground levels change: existing and finished levels, foundations, retaining structures,
    how eaves relate to adjacent land and boundaries, and how encroachment on adjacent land will be avoided'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels.
confidence: medium
notes: From the council's list (updated February 2020), 'Site levels' record of the online Planning validation
  requirements directory. Mapped from the 'Site levels' record, which asks for cross sections showing
  existing and proposed levels. A site whose existing levels vary by more than one metre has no matching
  field, so that part is discretionary. Not needed for household and commercial extensions. The outline
  and reserved matters pages also ask for 'Existing and proposed sections' on the same level tests.
review-status: unverified
field-status: {}
