reference: arboriculturist-report
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - outline
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: May affect trees or hedges.
    - site:
        in:
        - conservation-area
        description: Development in a conservation area.
    - discretionary
source-url: https://www.braintree.gov.uk/directory-record/6501/tree-assessment
policy: Braintree District Local Plan 2013-2033 policies LPP1, LPP63, LPP65, LPP67, LPP52, SP7
source-text: If your application is for one of these types of planning permission, you need to submit
  a tree assessment if your proposal; will potentially affect any trees or hedges is for development in
  a conservation area is primarily concerned with new residential or commercial use
must-include:
- item: Survey and appraisal of trees on the site and adjoining land, by a qualified arboriculturist,
    to BS 5837:2012
  level: must
- item: Trees to be felled and retained marked on a scaled plan
  level: must
- item: Schedule with amenity value, species, size, age and condition of each tree
  level: must
- item: Tree constraints plan with root protection areas and canopy spread
  level: must
- item: Landscape impact and new planting for larger applications
  level: must
  required-if: discretionary
- item: Arboricultural method statement with tree work schedules, long-term maintenance and a Tree Protection
    Plan
  level: must
confidence: medium
notes: 'From the council''s list (updated February 2020), ''Tree assessment'' record of the online Planning
  validation requirements directory. Types: agricultural, commercial, householder, outline, residential
  and telecoms. ''Primarily concerned with new residential or commercial use'' is not defined, so that
  part is discretionary; the householder page asks for it only for works to protected trees.'
review-status: unverified
field-status: {}
