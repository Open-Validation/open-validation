reference: floor-plan-proposed
local-authority: BRA
required-if:
  any:
  - application-type:
      in:
      - full
      - ldc-prospective-use
      - change-of-use
      - approval-condition
      - hh
      - lbc
      - outline-some
  - all:
    - application-type:
        in:
        - ldc-existing-use
        - non-material-amendment
        - s73
    - discretionary
source-url: https://www.braintree.gov.uk/directory-record/6419/existing-and-proposed-floor-plans
policy: Braintree District Local Plan 2013-2033 policies LPP1, LPP52
source-text: 'Mandatory requirement You must submit existing and proposed floor plans when you are making
  an application for: … Conditional requirement Depending on the details of your application, you may
  have to complete a form when you are submitting an application for: Lawful development certificate for
  an existing development Non-material amendment Removal or variation of conditions'
must-include:
- item: Drawn to an appropriate metric scale, for example 1:50 or 1:100
  level: must
- item: Proposed openings shown clearly to match the elevations
  level: must
- item: Existing buildings shown in relation to proposed buildings, where relevant
  level: must
- item: Walls or buildings to be demolished shown clearly
  level: must
- item: 'Change of use with internal alterations: existing and proposed room layouts'
  level: must
  required-if:
    application-type:
      in:
      - change-of-use
confidence: medium
notes: 'From the council''s list (updated February 2020), ''Existing and proposed floor plans'' record
  of the online Planning validation requirements directory. Mandatory types: agricultural, proposed-use
  LDC, change of use, commercial, discharge of conditions, householder, listed building consent, outline
  with some matters reserved, residential conversion/new build. For existing-use LDC, non-material amendment
  and s73 the list gives no test, so those are discretionary. Not needed where the floor plan would not
  change, for example re-roofing or replacement windows.'
review-status: unverified
field-status: {}
