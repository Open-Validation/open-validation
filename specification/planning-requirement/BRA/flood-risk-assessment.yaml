reference: flood-risk-assessment
local-authority: BRA
required-if:
  any:
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: One hectare or greater in flood zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: One hectare or greater in flood zone 1.
  - site:
      in:
      - flood-risk-zone
      description: Any development in flood zones 2 and 3.
  - discretionary
source-url: https://www.braintree.gov.uk/directory-record/6420/flood-risk-assessment
policy: Braintree District Local Plan 2013-2033 policies LPP63, LPP78
source-text: 'You must always submit a flood risk assessment if your application is for: A development
  of one hectare greater in flood zone 1 Any development in flood zones 2 and 3 Any development in an
  area the Environment Agency Internal Drainage Boards have indicated may have drainage problems'
confidence: medium
notes: From the council's list (updated February 2020), 'Flood risk assessment' record of the online Planning
  validation requirements directory. Contents follow the Environment Agency's Flood Risk Standing Advice.
  Areas the Environment Agency or Internal Drainage Boards say may have drainage problems have no matching
  field, so that part is discretionary.
