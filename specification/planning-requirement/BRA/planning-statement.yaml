reference: planning-statement
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - s73
  - any:
    - condition:
        field: departure-from-development-plan
        value: true
        description: Departs from the development plan.
    - condition:
        field: eia-development
        value: true
        description: EIA development.
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.braintree.gov.uk/directory-record/6445/planning-statement-and-statement-of-community-involvement
policy: Braintree District Local Plan 2013-2033 policies LPP61
source-text: 'If your application is for one of these types of planning permission, you need to submit
  a planning statement if your proposal: is for a major development within or next to residential areas
  departs from the development plan such as a house outside of the town or development boundary is for
  a use falling outside of a specific designation. For example, any use within an employment area that
  does not fall within use class B1, B2 and B8 is an EIA development requires notification to the Secretary
  of State is a minor development or other proposal that is likely to attract significant community interest
  is a complex proposal that needs describing is to vary or remove conditions'
confidence: medium
notes: 'From the council''s list (updated February 2020), ''Planning statement and statement of community
  involvement'' record of the online Planning validation requirements directory. Types: agricultural,
  change of use, outline, removal/variation of conditions, residential conversion/new build and telecoms.
  Major development next to homes, uses outside a designation, Secretary of State notification, significant
  community interest and complex proposals have no matching field, so they are discretionary.'
