reference: land-contamination-assessment
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: sensitive-end-use
        value: true
        description: Residential, allotments, play areas, playing fields, mixed use with vulnerable uses,
          nurseries, crèches or schools.
    - site:
        in:
        - contaminated-land
        description: Land which is or may be affected by contamination.
source-url: https://www.braintree.gov.uk/directory-record/6409/contamination-risk-assessment
policy: Environmental Protection Act 1990 Part 2A; Braintree District Local Plan 2013-2033 policies LPP70
source-text: 'If your application is for one of these types of planning permission, you need to submit
  a contamination risk assessment if your proposal is for or includes: any type of residential developments
  (houses, flats, nursing homes etc.) allotments children''s play areas playing fields mixed use developments
  including vulnerable end uses e.g. residential nurseries and crèches schools land which is or may be
  affected by contamination'
must-include:
- item: 'Phase 1 report: desk study, site walkover and initial risk assessment'
  level: must
confidence: medium
notes: 'From the council''s list (updated February 2020), ''Contamination risk assessment'' record of
  the online Planning validation requirements directory. Types: agricultural, commercial, outline and
  reserved matters, residential conversion/new build and telecoms.'
review-status: unverified
field-status: {}
