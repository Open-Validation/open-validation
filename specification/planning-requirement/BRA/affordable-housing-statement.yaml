reference: affordable-housing-statement
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - site:
          in:
          - rural-area
          description: In the rural areas.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
    - all:
      - condition:
          field: outside-main-town
          value: false
          description: In Braintree, Witham or Halstead.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 15
            description: 15 or more dwellings.
        - condition:
            field: site-area-residential
            operator: '>='
            value: 0.5
            description: A site of 0.5 hectares or more.
source-url: https://www.braintree.gov.uk/directory-record/6394/affordable-housing-statement
policy: Braintree District Local Plan 2013-2033 policies SP1, SP2, LPP32, LPP16, LPP20, LPP22
source-text: 'You need to submit an affordable housing statement if you are making an application for
  residential new build and your proposal is for: 10 or more dwellings in rural areas 15 or more dwellings
  in Braintree, Witham, or Halstead A site of 0.5 hectares or more in Braintree, Witham, or Halstead'
must-include:
- item: Percentage of affordable housing units, and how it relates to the 30 and 40 per cent policy requirements
  level: must
- item: Size mix by number of bedrooms of affordable and open market units
  level: must
- item: Tenure mix, with an explanation
  level: must
- item: Any registered social landlords proposed as partners
  level: must
- item: Plan showing the location of the affordable units and their number of bedrooms
  level: must
- item: Detailed explanation of any financial contribution
  level: must
- item: Any proposed management charges on the affordable units
  level: must
confidence: medium
notes: From the council's list (updated February 2020), 'Affordable housing statement' record of the online
  Planning validation requirements directory. Residential new build is shown as full and outline.
review-status: unverified
field-status: {}
