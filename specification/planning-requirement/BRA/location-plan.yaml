reference: location-plan
local-authority: BRA
required-if:
  application-type:
    in:
    - advertising
    - full
    - ldc
    - change-of-use
    - demolition-con-area
    - hh
    - lbc
    - outline
    - pip
    - prior-approval
    - reserved-matters
source-url: https://www.braintree.gov.uk/directory-record/6432/location-plan
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Braintree District
  Local Plan 2013-2033 policies LPP1, LPP52
source-text: 'You must submit a location plan if you are making an application for: … You do not have
  to submit a location plan if you are making an application for: Discharge of conditions Non-material
  amendment Removal or variation of conditions Technical details consent'
must-include:
- item: Up-to-date map at a metric scale of 1:1250 or 1:2500
  level: must
- item: Application site edged in red; any other adjoining land owned or controlled by the applicant edged
    in blue
  level: must
- item: All land needed to carry out the development (access from a public highway, visibility splays,
    landscaping, car parking, open areas around the building) inside the red line
  level: must
- item: A large area around the site, with at least two named roads, house names or numbers, and surrounding
    buildings notated
  level: must
- item: Scale bar and plan size
  level: must
confidence: medium
notes: From the council's list (updated February 2020), 'Location plan' record of the online Planning
  validation requirements directory. Removal or variation of conditions is listed both as needing and
  as not needing a location plan; it is left out here.
review-status: unverified
field-status: {}
