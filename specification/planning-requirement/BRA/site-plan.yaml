reference: site-plan
local-authority: BRA
required-if:
  application-type:
    in:
    - advertising
    - full
    - ldc
    - change-of-use
    - demolition-con-area
    - hh
    - lbc
    - outline
    - pip
    - prior-approval
    - reserved-matters
    - technical-details-consent
source-url: https://www.braintree.gov.uk/directory-record/6479/site-and-block-plan
policy: Braintree District Local Plan 2013-2033 policies LPP1, LPP52, SP7
source-text: 'You must submit a site and block plan when you are making an application for:'
must-include:
- item: Up-to-date map at a metric scale of 1:200 or 1:500
  level: must
- item: Plans of the site as it is now and as it will be after the development
  level: must
- item: Direction of North and a scale bar
  level: must
- item: Note stating whether the plan is enlarged from an Ordnance Survey map or drawn from a survey
  level: must
- item: Proposed development with dimensions, position and distance to the site boundaries
  level: must
- item: Existing buildings, their dimensions and distance to the boundaries, and which are retained
  level: must
- item: Buildings immediately adjacent to the site
  level: must
- item: Position of all existing trees on the site, which are retained, trees immediately adjacent to
    the site, and proposed trees
  level: must
- item: All public rights of way crossing the site
  level: must
- item: All roads and footpaths on adjoining land, including access arrangements (unless not affected)
  level: must
- item: Site boundaries, with the type and height of boundary treatment
  level: must
- item: Access roads, turning areas and car parking bays, with dimensions
  level: must
  required-if: discretionary
- item: Drainage runs
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated February 2020), 'Site and block plan' record of the online Planning
  validation requirements directory. Access/parking and drainage runs are asked for 'where relevant' /
  'where appropriate', so they are discretionary. The application-type pages also list an 'Existing and
  proposed site plan' as always required for agricultural, commercial, householder, residential, reserved
  matters, telecoms and proposed-use LDC applications.
review-status: unverified
field-status: {}
