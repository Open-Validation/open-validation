reference: photos
local-authority: BRA
required-if:
  any:
  - application-type:
      in:
      - advertising
  - ref: major-development
  - all:
    - application-type:
        in:
        - ldc
        - change-of-use
        - approval-condition
        - hh
    - discretionary
source-url: https://www.braintree.gov.uk/directory-record/6443/photographs-and-photomontages
policy: Braintree District Local Plan 2013-2033 policies LPP1, LPP52
source-text: Mandatory required You must submit photographs if you are making an application for advertising
  consent . You must submit photographs and a photomontage if you are making an application for a major
  development. … If your application is for one of these types of planning permission, you need to submit
  supporting evidence and photos.
must-include:
- item: 'Advertisements: the sign shown in its proposed location'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: scale details of the sign'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Major development: photomontage of the finished development'
  level: should
  required-if:
    ref: major-development
- item: Photographs labelled with an explanation of what they show
  level: must
confidence: medium
notes: From the council's list (updated February 2020), 'Photographs and photomontages' record of the
  online Planning validation requirements directory. Also uses the 'Supporting information/photos' record
  (https://www.braintree.gov.uk/directory-record/6482/supporting-information-photos), which says 'depending
  on the details' supporting evidence and photos are needed for advertisement, LDC, change of use, discharge
  of conditions and householder applications, so those are discretionary. Photos are optional for other
  types. The demolition and listed building consent pages list supporting information and photos as always
  required.
review-status: unverified
field-status: {}
