reference: telecommunications-report
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
  - condition:
      field: telecommunications-development
      value: true
      description: A telecommunications application.
source-url: https://www.braintree.gov.uk/directory-record/6499/telecommunications-supporting-information-
policy: Braintree District Local Plan 2013-2033 policies LPP46, LPP78, SP6
source-text: You must always submit a telecommunication supporting information if your application is
  for; Telecommunication You do not have to submit telecommunication supporting information if your proposal
  is covered by permitted development or needs prior approval.
must-include:
- item: Confirmation that the development is by or for a telecommunications operator
  level: must
- item: Evidence that 3 to 5 other sites were considered and why they were discounted
  level: must
- item: Evidence that use of an existing mast, building or structure was considered
  level: must
- item: Statement that the base station will meet ICNIRP guidelines when operational
  level: must
- item: Frequency and modulation characteristics, and power output in relation to the antenna
  level: must
confidence: medium
notes: From the council's list (updated February 2020), 'Telecommunications supporting information' record
  of the online Planning validation requirements directory. Not needed for permitted development or prior
  approval.
review-status: unverified
field-status: {}
