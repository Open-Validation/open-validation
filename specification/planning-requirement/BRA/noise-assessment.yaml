reference: noise-assessment
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: A development that may result in noise emissions.
    - condition:
        field: noise-sensitive-use
        value: true
        description: A noise-sensitive use that may be exposed to noise, including new homes near industrial
          or commercial premises or places of entertainment.
    - all:
      - condition:
          field: entertainment-leisure-use
          value: true
          description: New entertainment premises.
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: Near existing residential property.
    - condition:
        field: plant-equipment
        value: true
        description: New air conditioning or condenser units.
    - discretionary
source-url: https://www.braintree.gov.uk/directory-record/6435/noise-impact-assessment
policy: Braintree District Local Plan 2013-2033 policies LPP70, LPP52, LPP42, LPP63, LPP2, LPP20, LPP78,
  SP7, SP6, SP5
source-text: 'If your application is for one of these types of planning permission, you need to submit
  a noise impact assessment f your proposal is for: a development that may result in noise emissions any
  use which is sensitive to noise and may be exposed to noise a sites located near existing sources of
  noise, such as an employment area, road, railway lines, in a town centre a new residential property
  near to existing industrial or commercial premises where industrial noise is the dominant source a new
  entertainment premises near to existing residential property a new residential property near to places
  of entertainment includes a proposal to install new air conditioning or condenser units'
confidence: medium
notes: 'From the council''s list (updated February 2020), ''Noise impact assessment'' record of the online
  Planning validation requirements directory. Types: agricultural, change of use, commercial, outline
  and residential conversion. A site near existing noise sources has no matching field, so that part is
  discretionary. Where only an extraction or condenser unit needs assessing, the manufacturer''s sound
  power or sound pressure level may be enough.'
review-status: unverified
field-status: {}
