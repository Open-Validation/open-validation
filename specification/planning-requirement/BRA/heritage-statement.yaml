reference: heritage-statement
local-authority: BRA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - scheduled-monument
      description: Affects a listed building or a scheduled ancient monument.
  - discretionary
source-url: https://www.braintree.gov.uk/directory-record/6424/heritage-statement
policy: Braintree District Local Plan 2013-2033 policies LPP52, LPP53, LPP55, LPP56, LPP57, LPP58, LPP59
source-text: You must submit a heritage statement when you are making an application for listed building
  consent You will have to submit a heritage statement when you are making any planning application for
  a development that affects; a listed building an archaeological site , including developments with a
  reasonable probability of finding archaeological remains a scheduled ancient monument
must-include:
- item: Design principles and concepts applied to the proposed works
  level: must
- item: How they take account of the special architectural or historic importance of the building, the
    physical features that justify its listing, and its setting
  level: must
- item: 'Where works affect the outside: the access policy adopted (including alternatives considered),
    how it respects the building''s significance and setting, consultation on access, and how specific
    access issues are addressed'
  level: must
  required-if:
    condition:
      field: external-alterations
      value: true
      description: The works include work to the outside of the property.
confidence: medium
notes: From the council's list (updated February 2020), 'Heritage statement' record of the online Planning
  validation requirements directory. An archaeological site, or a 'reasonable probability of finding archaeological
  remains', is checked on the council's interactive guide and has no matching field, so that part is discretionary.
review-status: unverified
field-status: {}
