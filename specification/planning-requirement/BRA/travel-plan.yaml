reference: travel-plan
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - condition:
          field: staff-count
          operator: '>'
          value: 50
          description: Commercial development employing more than 50 people.
      - discretionary
    - condition:
        field: school-expansion
        value: true
        description: A new school or an extension to an existing school.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential new build.
source-url: https://www.braintree.gov.uk/directory-record/6413/draft-travel-plan
policy: Essex County Council Development Management Policies DM10; Braintree District Local Plan 2013-2033
  policies LPP42, LPP43, SP6, SP5, LPP78
source-text: Commercial, industrial and non-residential , where the proposed development will employ more
  than 50 people and have a significant impact on the highway Commercial, industrial and non-residential
  , where the proposed development is for a new school or an extension to an existing school Residential
  new build If your proposal is for up to 249 dwellings , you need to submit a travel information pack
  If your proposal is for 250 or more dwellings, you need to submit a full residential travel plan
must-include:
- item: Ways of reducing car use and increasing public transport, walking and cycling
  level: must
- item: Implementation strategy
  level: must
- item: Range of measures and incentives to encourage alternative modes
  level: must
- item: Full residential travel plan (not just a travel information pack)
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 250
      description: 250 or more dwellings.
confidence: medium
notes: From the council's list (updated February 2020), 'Draft travel plan' record of the online Planning
  validation requirements directory. 'Significant impact on the highway' is a judgement, so the more-than-50-staff
  test is discretionary. Up to 249 dwellings need a travel information pack.
review-status: unverified
field-status: {}
