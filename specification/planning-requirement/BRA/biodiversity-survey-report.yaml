policy: Braintree District Local Plan 2013-2033 policies LPP63, LPP64, LPP65, LPP67
source-text: You must complete and submit a Biodiversity checklist if your application is for a development
  that; is within the Impact Risk Zone within a Site of Special Scientific Interest within 100m of a national
  nature reserve or local nature reserve triggers a financial contribution (RAMS) has a local wildlife
  site, special roadside verge or priority habitat within 100m has protected or priority species located
  on or adjacent the site involves a conversion, modification, demolition or removal of buildings (including
  hotels, schools, hospitals, churches, commercial premises and derelict buildings … If your biodiversity
  checklist identifies that an ecological survey and assessment is needed, you must submit these before
  we can validate your application.
confidence: medium
notes: 'From the council''s list (updated February 2020), ''Ecological surveys and impact assessment''
  record of the online Planning validation requirements directory. A two-stage process: the biodiversity
  checklist (pro forma, sent to unmapped) decides whether a full ecological survey and assessment is needed,
  so the survey itself is discretionary. An exemption can be asked for where pre-application advice said
  it is not needed, or where evidence shows no protected or priority species or habitats. The list (updated
  February 2020) does not mention biodiversity net gain, so no BNG file is written.'
