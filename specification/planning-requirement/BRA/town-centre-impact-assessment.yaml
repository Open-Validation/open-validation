reference: town-centre-impact-assessment
local-authority: BRA
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - pip
      - s73
      - reserved-matters
      - technical-details-consent
  - any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 2500
        description: Retail and leisure development over 2,500 square metres gross.
    - discretionary
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Other town centre uses in an edge or out of centre location.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with the local development plan.
source-url: https://www.braintree.gov.uk/directory-record/6476/retail-impact-assessment
policy: Braintree District Local Plan 2013-2033 policies LPP1, LPP52, LPP11, LPP12, LPP14, LP10, LPP9,
  SP7
source-text: 'If your application is for one of these types of planning permission, you need to submit
  a retail impact assessment if your proposed development is for: a retail and leisure development over
  2,500 square metres gross floor space a retail and leisure development less than 2,500 square metres
  floor space that is likely to have a significant impact on shopping centres other town centre uses when
  they are in an edge of centre or out of centre location and not in accordance with the local development
  plan.'
confidence: medium
notes: From the council's list (updated February 2020), 'Retail impact assessment' record of the online
  Planning validation requirements directory. Smaller schemes 'likely to have a significant impact on
  shopping centres' are a judgement, so discretionary. The separate sequential assessment is sent to unmapped.
review-status: unverified
field-status: {}
