reference: elevation-proposed
local-authority: BRA
required-if:
  any:
  - application-type:
      in:
      - advertising
      - full
      - hh
      - ldc-prospective-use
      - lbc
      - outline-all
  - all:
    - application-type:
        in:
        - change-of-use
        - approval-condition
        - ldc-existing-use
        - non-material-amendment
        - outline-some
        - s73
    - any:
      - condition:
          field: new-build
          value: true
          description: The proposal includes new buildings.
      - condition:
          field: external-alterations
          value: true
          description: The proposal alters the exterior of existing buildings.
source-url: https://www.braintree.gov.uk/directory-record/6418/existing-and-proposed-elevations
policy: Braintree District Local Plan 2013-2033 policies LPP1, LPP52
source-text: 'Mandatory requirement You must submit existing and proposed elevations when you are making
  an application for: … Depending on the details of your application, you may have to submit existing
  and proposed elevations when you are making an application for: Change of use Discharge of conditions
  Certificate of lawful use for an existing development Non-material amendment Outline permission some
  matters reserved Removal or variation of conditions If your application is for one of these types of
  planning permission, you need to submit existing and proposed elevations if your proposal includes new
  buildings or alterations to the exterior of existing buildings.'
must-include:
- item: Drawn to an appropriate metric scale, for example 1:50 or 1:100
  level: must
- item: Proposed works shown clearly in relation to what is already there, with the height of buildings
    above ground level
  level: must
- item: Existing and proposed building materials, and the style, materials and finish of windows and doors
  level: must
  required-if: discretionary
- item: Blank elevations included, if only to show that this is the case
  level: must
- item: Relationship with adjoining or nearby buildings, with the positions of openings on each property
  level: must
- item: Solar panels shown on the building from all relevant elevations, or how free-standing panels will
    appear (front, side(s) and rear)
  level: must
  required-if:
    condition:
      field: solar-panels
      value: true
      description: The proposal includes solar panels.
- item: 3D visualisation of the 'true elevation' (axonometric, photomontage or model)
  level: should
  required-if:
    condition:
      field: new-build
      value: true
      description: The application is for a new building.
- item: 'Advertisements: drawing at 1:50 or 1:100 showing the advertisement size, siting, materials and
    colours'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: height of the advert above ground'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: extent of projection and the method and colours of any illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: 'From the council''s list (updated February 2020), ''Existing and proposed elevations'' record
  of the online Planning validation requirements directory. Mandatory types: advertisement, agricultural,
  commercial, householder, proposed-use LDC, listed building consent, outline with all matters reserved,
  residential conversion/new build and telecoms (full = agricultural, commercial, residential and telecoms).
  Removal or variation of conditions is listed under both headings, so it is shown with the conditional
  types.'
review-status: unverified
field-status: {}
