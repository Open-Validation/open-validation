reference: fire-statement
local-authority: HAR
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A height of at least 18m.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: At least seven storeys.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Applications proposing two or more dwellings, educational accommodation, or buildings with
  a height of at least 18m or at least seven storeys.
must-include:
- item: Consultation on fire safety and what account has been taken of responses
  level: must
- item: Principles, concepts and approach to fire safety applied to the development
  level: must
- item: Specific technical fire safety complexities
  level: must
- item: How issues affecting fire safety have been addressed
  level: must
- item: Plans and details of the arrangements for emergency and fire service access
  level: must
- item: Other considerations as required by the government template
  level: must
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 19. 'Fire Safety Statement',
  major applications only. Shown as the national rule (two or more dwellings or educational accommodation,
  in a building of 18m or 7 storeys), which the list's wording summarises.
review-status: unverified
field-status: {}
