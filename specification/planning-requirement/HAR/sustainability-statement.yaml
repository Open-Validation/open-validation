reference: sustainability-statement
local-authority: HAR
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: minor-development
          value: true
          description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
            ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m
            or a site under 1 ha.'
      - application-type:
          in:
          - change-of-use
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The application proposes residential development.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policy PL3 (paragraphs 13.20 to 13.22)
source-text: All applications. … Applications proposing residential development.
must-include:
- item: As per paragraphs 13.20 to 13.22 of the Harlow Local Development Plan
  level: must
- item: The Harlow and Gilston Garden Town Sustainability Guidance and Checklist completed at the relevant
    stage(s)
  level: must
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 35. All major applications
  (★); minor and change of use applications proposing residential development. Reserved matters, minor
  material amendment, non-material amendment and variation of condition applications need it only if it
  was not addressed at an earlier stage or has become relevant.
review-status: unverified
field-status: {}
