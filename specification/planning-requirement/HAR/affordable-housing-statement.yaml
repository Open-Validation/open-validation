reference: affordable-housing-statement
local-authority: HAR
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The application proposes residential development.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policies H5, H8 and H9; Affordable and Specialist Housing SPD
source-text: Applications proposing residential development.
must-include:
- item: As per paragraph 2.22 of the council's Affordable and Specialist Housing SPD
  level: must
- item: 'For 50 or more dwellings: the provision of self-build and custom-build housing plots'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: 50 or more dwellings.
- item: The proportion and location of proposed M4(2) adaptable and accessible housing
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 5. 'Affordable and Specialist
  Housing Statement', for major and minor applications. Reserved matters, minor material amendment, non-material
  amendment and variation of condition applications need it only if it was not addressed at an earlier
  stage or has become relevant.
review-status: unverified
field-status: {}
