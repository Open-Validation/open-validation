reference: landscaping-plan
local-authority: HAR
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: minor-development
          value: true
          description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
            ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m
            or a site under 1 ha.'
      - application-type:
          in:
          - change-of-use
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The application proposes residential development.
      - condition:
          field: external-space
          value: true
          description: The application includes external amenity space or public realm.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policy PL8
source-text: All applications. … Applications proposing new residential development. … Applications including
  external amenity space or public realm. … Landscape plan, showing the treatment of all spaces within
  the site not covered by buildings.
must-include:
- item: Hard and soft landscaping for all parts of the site where no buildings are proposed, indicating
    site features and those to be retained
  level: must
- item: Size and species of plants and trees, and hard landscaping materials
  level: must
- item: Site levels, gradients and any earthworks
  level: must
- item: Storage areas for bicycles and/or refuse
  level: must
- item: Boundary treatments and SuDS
  level: must
- item: Location and area of porous paving where hard standings are proposed
  level: must
  required-if:
    condition:
      field: hard-surfacing
      value: true
      description: Hard standings are proposed.
- item: A management plan/stewardship arrangements for communal landscaping or public realm areas
  level: must
confidence: medium
notes: 'From the council''s list (Main Validation Checklist, August 2026), page 28, 32. ''Landscaping
  Scheme'': all major applications (★); minor and change of use applications proposing new homes or including
  external amenity space or public realm. The ''Plans and Drawings'' element also asks for a landscape
  plan. Reserved matters, minor material amendment, non-material amendment and variation of condition
  applications need it only if it was not addressed at an earlier stage or has become relevant.'
review-status: unverified
field-status: {}
