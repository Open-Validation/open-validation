reference: sci
local-authority: HAR
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
  - condition:
      field: pre-application-community-consultation
      value: true
      description: Community involvement was undertaken.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
source-text: Applications where community involvement was undertaken.
must-include:
- item: How the pre-application consultation requirements in the council's Statement of Community Involvement
    have been complied with
  level: must
- item: How the views of the local community and other stakeholders, such as statutory consultees, have
    been sought and considered
  level: must
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 34. 'Statement of Applicant’s
  Community Involvement'. Reserved matters, minor material amendment, non-material amendment and variation
  of condition applications need it only if it was not addressed at an earlier stage or has become relevant.
review-status: unverified
field-status: {}
