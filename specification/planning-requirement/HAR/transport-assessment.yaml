reference: transport-assessment
local-authority: HAR
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
            ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m
            or a site under 1 ha.'
      - application-type:
          in:
          - change-of-use
    - discretionary
  - all:
    - application-type:
        in:
        - advertising
        - prior-approval
    - discretionary
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policies IN1 and IN2
source-text: Applications that generate significant travel movements.
must-include:
- item: Travel characteristics of the proposal, led by a transport vision
  level: must
- item: Measures to meet the Harlow and Gilston Garden Town modal shift target and mitigate harm
  level: must
- item: Measures to improve accessibility, e.g. footpath and cycle path links; proposed access for all
    modes
  level: must
- item: Existing and proposed local public transport provision
  level: must
- item: Classification of the local road network, critical links and junctions, and traffic flow data
  level: must
- item: Parking in the area, the parking strategy and a parking survey, depending on parking stress
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 4, 37. 'Transport Assessment/Statement'.
  'Significant travel movements' has no threshold, so it shows as discretionary (a Statement can be agreed
  where issues are limited). Advertisement and prior approval applications need it 'if the proposal would
  cause ... transport ... impacts'.
review-status: unverified
field-status: {}
