reference: land-contamination-assessment
local-authority: HAR
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
  - site:
      in:
      - contaminated-land
      description: A site where contamination is known or suspected.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policy PL10
source-text: Applications on sites where contamination is known or suspected.
must-include:
- item: As per paragraph 13.70 of the Harlow Local Development Plan
  level: must
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 27. 'Land Contamination
  Preliminary Risk Assessment'. Reserved matters, minor material amendment, non-material amendment and
  variation of condition applications need it only if it was not addressed at an earlier stage or has
  become relevant.
review-status: unverified
field-status: {}
