    national legislation changes'' (PDF created 5 August 2026). It is the checklist linked from the council''s
    ''Make a planning application'' page (https://www.harlow.gov.uk/planning-and-building-control/planning-permission/make-planning-application)
    in November 2026, alongside the Householder validation checklist web page (https://www.harlow.gov.uk/planning-and-building-control/planning-permission/submitting-householder-planning-application),
