  status: current
submission-standards:
- item: Drawings show a title and drawing number (with the revision number as necessary) and the direction
    of north
  level: must
- item: Drawings at an identified metric scale, with a scale bar showing a length of 1 metre and 10 metres,
    and key dimensions
  level: must
- item: Drawings state which paper size the scale applies to (e.g. 1:200 at A3)
  level: must
- item: Householder plans and drawings at 1:50 or 1:100, in metric measurements, showing the existing
    situation and the proposal
  level: must
- item: Documents larger than 10MB split into separate files
  level: should
- item: Plans grouped by type within multipage PDF documents
  level: should
- item: A list of submitted drawings and documents, to assist validation
  level: should
