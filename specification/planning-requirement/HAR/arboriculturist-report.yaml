reference: arboriculturist-report
local-authority: HAR
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
            ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m
            or a site under 1 ha.'
      - application-type:
          in:
          - change-of-use
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees within the site, or on adjacent land (including street trees) that would
            be influenced or affected.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedgerows within the site, or on adjacent land that would be affected.
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees within the site, or on adjacent land (including street trees) that would
            be influenced or affected.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedgerows within the site, or on adjacent land that would be affected.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policy PL7
source-text: 'Applications where there are tree(s) or hedgerow(s) within the application site, or where
  there are tree(s) or hedgerow(s) on land adjacent that would be influenced or affected by the proposal
  (including street trees). … In addition, you must submit a supporting trees and hedges report which
  details:'
must-include:
- item: Species, spread, roots and locations of trees and hedgerows on the site, and those on adjoining
    land that would be affected
  level: must
- item: Tree/building and hedgerow/building relationships, and how trees and hedgerows will be affected
    or removed
  level: must
- item: The effect on biodiversity related to affected trees and hedgerows
  level: must
- item: Operations likely to threaten retained trees and hedgerows during construction
  level: must
- item: Protective fencing and ground protection, special foundations within root protection areas, storage
    of materials and worker facilities
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
- item: Measures to protect retained trees and hedgerows, and future maintenance of new ones
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
- item: Locations (on a scaled plan) of any new trees and hedges
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Prepared by a qualified arboriculturist
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 39. 'Tree and Hedgerow Report'.
  For householder applications the page says 'You may need the assistance of a qualified arboriculturist'.
  Householder applications follow the council's Householder validation checklist web page (https://www.harlow.gov.uk/planning-and-building-control/planning-permission/submitting-householder-planning-application).
