reference: design-and-access-statement
local-authority: HAR
required-if:
  any:
  - ref: major-development
  - all:
    - any:
      - condition:
          field: minor-development
          value: true
          description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
            ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m
            or a site under 1 ha.'
      - application-type:
          in:
          - change-of-use
    - site:
        in:
        - conservation-area
        - listed-building
        - locally-listed-building
        description: In a Conservation Area and/or involving a listed building or locally listed building.
  - application-type:
      in:
      - lbc
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policies PL1 and IN1
source-text: 'All applications. … Applications in a Conservation Area and/or involving a listed building
  or locally listed building. … Listed Building Consent: Design and Access Statement and Heritage Statement'
must-include:
- item: How the design principles and concepts have considered the Harlow Design Guide and Harlow Local
    Development Plan policies
  level: must
- item: Steps taken to appraise the context of the development and how its design considers that context
  level: must
- item: Provisions for sustainable access, including links to public transport, cycleways, footways, public
    rights of way and bridleways
  level: must
- item: Results and outcomes of consultations on access, and how access issues have been addressed
  level: must
- item: How improved or new open spaces are accessible to all
  level: must
- item: How parking areas (car and bicycle) accord with the Essex County Council Parking Guidance
  level: must
- item: How the design approach will be addressed in future reserved matters applications
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: How the historical and architectural importance, physical features and setting of the area or
    building has been considered in the design
  level: must
  required-if:
    site:
      in:
      - conservation-area
      - listed-building
      - locally-listed-building
      description: In a Conservation Area and/or involving a listed building or locally listed building.
- item: 'In the Town Centre: compliance with the Town Centre Masterplan Framework SPD'
  level: must
  required-if:
    site:
      in:
      - town-centre
      description: The proposal is in the Town Centre.
- item: How the existing landscape has been considered, including a Landscape Visual Impact Assessment
    and/or a Character Assessment
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 4, 14-15. All major applications
  (★, including listed building consent applications, which should follow as many of the details as relevant);
  minor and change of use applications in a conservation area or involving a listed or locally listed
  building. Reserved matters, minor material amendment, non-material amendment and variation of condition
  applications need it only if it was not addressed at an earlier stage or has become relevant.
review-status: unverified
field-status: {}
