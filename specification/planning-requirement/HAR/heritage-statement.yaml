reference: heritage-statement
local-authority: HAR
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
            ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m
            or a site under 1 ha.'
      - application-type:
          in:
          - change-of-use
    - any:
      - site:
          in:
          - conservation-area
          - listed-building
          - listed-building-setting
          - locally-listed-building
          - scheduled-monument
          - archaeological-priority-area
          description: 'Development affecting a heritage asset or its setting: in a Conservation Area
            and/or involving listed buildings, locally listed buildings, archaeological remains or Scheduled
            Ancient Monuments.'
      - discretionary
  - all:
    - application-type:
        in:
        - advertising
        - prior-approval
    - discretionary
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        - listed-building
        - locally-listed-building
        description: In a Conservation Area and/or involving a listed building or locally listed building.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policy PL12
source-text: 'Applications proposing development that affects a heritage asset or its setting. … Applications
  within Conservation Areas and/or involving listed buildings, locally listed buildings, archaeological
  remains or Scheduled Ancient Monuments. … Applications formulating the design of the East of Harlow
  Garden Community. … For proposals within conservation areas or involving listed buildings or locally
  listed buildings, you must provide a heritage statement which details:'
must-include:
- item: How the proposal complements or mitigates any harm to the historic character and architectural
    interest of affected buildings or their setting
  level: must
- item: The significance of the heritage assets affected, the contribution of their setting, and the impact
    of the proposal on that significance, in detail proportionate to the asset's importance
  level: must
- item: 'For major works and/or a number of alterations to a listed building (including repairs): a full
    schedule of works with a method statement'
  level: must
  required-if:
    all:
    - site:
        in:
        - listed-building
        description: A listed building.
    - discretionary
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 4, 26. All three main types
  and all listed building consent applications. 'Applications formulating the design of the East of Harlow
  Garden Community' shows as discretionary, as does advertisement and prior approval applications 'if
  the proposal would cause heritage ... impacts'. Householder applications follow the council's Householder
  validation checklist web page (https://www.harlow.gov.uk/planning-and-building-control/planning-permission/submitting-householder-planning-application).
review-status: unverified
field-status: {}
