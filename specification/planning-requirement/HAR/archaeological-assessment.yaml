reference: archaeological-assessment
local-authority: HAR
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
  - any:
    - site:
        in:
        - archaeological-priority-area
        description: On or adjacent to a site of known archaeological interest.
    - discretionary
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policy PL12
source-text: Applications for proposals on or adjacent to sites of known archaeological interest, or sites
  believed to possess potential archaeological significance.
must-include:
- item: Desk-based assessment
  level: must
- item: An archaeological field evaluation
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 7. Sites 'believed to possess
  potential archaeological significance' is a judgement, so that part shows as discretionary; the field
  evaluation is 'where appropriate'. Reserved matters, minor material amendment, non-material amendment
  and variation of condition applications need it only if it was not addressed at an earlier stage or
  has become relevant.
review-status: unverified
field-status: {}
