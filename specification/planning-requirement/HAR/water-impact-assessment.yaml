reference: water-impact-assessment
local-authority: HAR
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
  - site:
      in:
      - source-protection-zone
      description: In a Source Protection Zone or aquifer.
  - discretionary
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policy PL11
source-text: Applications proposing development involving high risk activities in Special Protection Zones
  (SPZs) or aquifers.
must-include:
- item: Whether the development would threaten water quality, and the mitigation measures or management
    strategy to deal with the risk
  level: must
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 44. 'Water Quality Risk
  Assessment'. High risk activities include those involving hazardous substances such as pesticides, oils,
  petrol and diesel; the list gives no fixed test, so that part shows as discretionary. 'Special Protection
  Zones (SPZs)' here means groundwater source protection zones. Reserved matters, minor material amendment,
  non-material amendment and variation of condition applications need it only if it was not addressed
  at an earlier stage or has become relevant.
review-status: unverified
field-status: {}
