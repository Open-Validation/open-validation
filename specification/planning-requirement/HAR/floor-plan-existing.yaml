reference: floor-plan-existing
local-authority: HAR
required-if:
  any:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floor-layout-change
        value: true
        description: The proposal changes the layout of any floors or creates additional floors in the
          house.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
source-text: 'All applications. … Floor plans, showing: … If your proposal changes the layout of any floors
  or creates additional floors in your house, you must provide floor plans for each affected floor.'
must-include:
- item: Existing and proposed floor plans at 1:50 or 1:100 scale
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
- item: Position and size of wheelchair units proposed
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
- item: Room sizes and overall unit sizes when proposing new residential accommodation, including conversions
  level: must
  required-if:
    all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
            ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m
            or a site under 1 ha.'
      - application-type:
          in:
          - change-of-use
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential accommodation, including conversions.
- item: Relationship to adjacent development, e.g. where changing the use of part of a floor or building
  level: must
  required-if:
    any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
- item: Each affected floor, showing all rooms and their use, and features such as walls, windows and
    doors
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 31-32. 'Plans and Drawings'
  is required for all major, minor and change of use applications (★). Householder applications follow
  the council's Householder validation checklist web page (https://www.harlow.gov.uk/planning-and-building-control/planning-permission/submitting-householder-planning-application).
review-status: unverified
field-status: {}
