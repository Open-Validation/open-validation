reference: section-existing
local-authority: HAR
required-if:
  any:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: change-in-ground-levels
        value: true
        description: A house on a large slope, or a proposal with a change in ground level such as creating
          steps.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
source-text: 'All applications. … Sections, showing finished floor and site levels at 1:50 or 1:100 scale
  (and where levels are shown, they must relate to a fixed datum point off site). … For houses on large
  slopes, or for proposals where there is a change in ground level such as creating steps, you must provide
  section drawings and a site levels plan which must show:'
must-include:
- item: Finished floor and site levels at 1:50 or 1:100 scale, related to a fixed datum point off site
  level: must
  required-if:
