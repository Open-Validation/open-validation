reference: sustainable-drainage-strategy
local-authority: HAR
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
  - condition:
      field: suds-incorporated
      value: true
      description: SuDS are incorporated into the proposal.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policy PL11
source-text: Applications where SuDS are incorporated into the proposal.
must-include:
- item: The most sustainable option from the SuDS hierarchy
  level: must
- item: Multiple benefits, including management of flood risk and surface water pollution, amenity and
    biodiversity
  level: must
- item: Runoff rates in line with the non-statutory technical standards for sustainable drainage
  level: must
- item: Appropriate attenuation taking climate change into account
  level: must
- item: Arrangements for future maintenance and management
  level: must
- item: Consideration of national guidance on natural flood management
  level: must
- item: Compliance with the Lead Local Flood Authority's principles and standards for SuDS
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 36. 'Sustainable Drainage
  Systems (SuDS) Scheme'. This MHCLG id is retired but is the closest match. Reserved matters, minor material
  amendment, non-material amendment and variation of condition applications need it only if it was not
  addressed at an earlier stage or has become relevant.
review-status: unverified
field-status: {}
