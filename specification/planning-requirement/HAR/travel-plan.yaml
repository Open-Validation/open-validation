reference: travel-plan
local-authority: HAR
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
            ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m
            or a site under 1 ha.'
      - application-type:
          in:
          - change-of-use
    - discretionary
  - all:
    - application-type:
        in:
        - advertising
        - prior-approval
    - discretionary
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policies IN1 and IN3
source-text: Applications where a Transport Statement or Assessment is required.
must-include:
- item: Existing travel habits in the surrounding area
  level: must
- item: Forecast trips by all modes, including visitors and residents
  level: must
- item: Proposals to provide or enhance public transport services and facilities, and to increase their
    use
  level: must
- item: Explicit outcomes, targets and measures, with monitoring and management arrangements
  level: must
- item: Additional measures if targets are not met
  level: must
- item: A Transport Review Group, if necessary
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 38. Needed whenever a Transport
  Statement or Assessment is.
review-status: unverified
field-status: {}
