reference: daylight-sunlight-assessment
local-authority: HAR
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
  - discretionary
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policy PL2
source-text: Applications where there is a potential adverse impact upon the current levels of daylight/sunlight
  available to adjoining building(s), including associated gardens or amenity space. … Applications for
  proposals that may be adversely affected by adjoining sites, or where at least part of the proposal
  may be impacted upon by another part of the proposal or by existing buildings.
must-include:
- item: 'Overshadowing study: shadow diagrams at hourly intervals on 21 December, 21 March and 21 June,
    existing and proposed'
  level: must
- item: 'For single aspect units: the available daylight to those units'
  level: must
  required-if:
    condition:
      field: single-aspect-units
      value: true
      description: The proposal includes single aspect units.
- item: Assessment of the Vertical Sky Component (VSC) and Average Daylight Factor (ADF)
  level: must
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 12. Major and minor applications.
  'Potential adverse impact' is a judgement, so it shows as discretionary. Reserved matters, minor material
  amendment, non-material amendment and variation of condition applications need it only if it was not
  addressed at an earlier stage or has become relevant.
review-status: unverified
field-status: {}
