reference: construction-management-plan
local-authority: HAR
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
  - any:
    - condition:
        field: highway-obstruction
        value: true
        description: Loading activities in the construction phase would cause congestion or obstruction
          on the public highway, particularly where temporary closures are needed or safe and legal loading
          cannot take place off the highway.
    - discretionary
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
source-text: Applications proposing development where loading activities associated with the construction
  phase would cause congestion or obstruction on the public highway, particularly where temporary closures
  are required on the highway or where safe and legal loading cannot take place off the public highway.
must-include:
- item: A plan identifying the site access points and where safe and legal loading can take place
  level: must
- item: How deliveries could be managed to reduce vehicle movements and use more sustainable modes
  level: must
- item: A Construction Logistics Plan (construction phase assessment, construction traffic levels, vehicle
    routing, traffic management, road cleaning, security and access control, waste management, number
    and times of deliveries)
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 10. 'Construction Method
  Statement'. Whether loading 'would cause congestion' is a judgement, so it also shows as discretionary;
  the Construction Logistics Plan depends 'on the scale of the development or particular sensitivities
  of the site'. Reserved matters, minor material amendment, non-material amendment and variation of condition
  applications need it only if it was not addressed at an earlier stage or has become relevant.
review-status: unverified
field-status: {}
