reference: waste-management-plan
local-authority: HAR
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
  - condition:
      field: bins-beyond-collection-distance
      value: true
      description: Refuse storage areas and/or bin storage points are more than 10m (four-wheeled bins)
        or 15m (two-wheeled bins) from the public highway.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policies H2, H3, H10 and IN2
source-text: Applications where refuse storage areas and/or bin storage points are proposed to be located
  away from the public highway by more than 10m (for four-wheeled bins) or 15m (for two-wheeled bins).
must-include:
- item: Plan showing refuse storage areas and/or bin storage points
  level: must
- item: Access for collection vehicles and crews, including bin wheeling distance
  level: must
- item: Private collection arrangements
  level: must
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 42. 'Waste Collection Plan'.
  Reserved matters, minor material amendment, non-material amendment and variation of condition applications
  need it only if it was not addressed at an earlier stage or has become relevant.
review-status: unverified
field-status: {}
