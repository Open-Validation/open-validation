reference: bng-metric
local-authority: HAR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Environment Act 2021; Harlow Local Development Plan policies PL7 and WE4
source-text: All applications, except where an exemption applies*.
must-include:
- item: 'Compliance with the BNG requirements on the Planning Portal: pre-development biodiversity value,
    date of the onsite pre-development biodiversity value calculation, degradation details, irreplaceable
    habitats'
  level: must
- item: A complete biodiversity metric calculation
  level: must
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 9. 'Biodiversity Net Gain
  (BNG) Information' (updated August 2026). Exemptions include sites of 0.2 hectares or less, the 'de
  minimis' rule, most temporary development and development fulfilling a BNG condition for another development;
  householder and other exempt applications are exempt by law, so it is shown with the biodiversity gain
  condition.
review-status: unverified
field-status: {}
