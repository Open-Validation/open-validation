reference: planning-statement
local-authority: HAR
required-if:
  any:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
  - all:
    - application-type:
        in:
        - change-of-use
    - site:
        in:
        - conservation-area
        description: Within a Conservation Area.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: Within a conservation area.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policy PL1
source-text: All applications. … Applications within a Conservation Area. … For proposals within conservation
  areas, you must provide a planning statement which details how you have considered any relevant character
  appraisals and accorded with any relevant management plans.
must-include:
- item: How the application accords with relevant Harlow Local Development Plan policies and the Harlow
    Design Guide, adopted SPDs and Harlow and Gilston Garden Town documents, with commentary (not just
    a list of policies)
  level: must
  required-if:
    any:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
            ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m
            or a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
- item: 'In a Conservation Area: how relevant Character Appraisals were considered and Management Plans
    accorded with'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Within a Conservation Area.
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 30. Required for all major
  and minor applications (★) and for change of use applications in a conservation area. 'Submissions which
  just list the policies without providing the required commentary will not be considered as valid.' Householder
  applications follow the council's Householder validation checklist web page (https://www.harlow.gov.uk/planning-and-building-control/planning-permission/submitting-householder-planning-application).
