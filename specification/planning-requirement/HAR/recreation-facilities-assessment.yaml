reference: recreation-facilities-assessment
local-authority: HAR
required-if:
  all:
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
          ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m or
          a site under 1 ha.'
    - application-type:
        in:
        - change-of-use
  - condition:
      field: loss-of-open-space
      value: true
      description: Development within open spaces or Green & Blue Infrastructure assets.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policies L1 and L2; Harlow GI & Open Spaces SPD
source-text: Applications proposing development within open spaces or Green & Blue Infrastructure assets.
must-include:
- item: Amount and type of open space and/or G&BI assets lost
  level: must
- item: Mitigation or compensatory provision to offset the loss, including financial contributions
  level: must
- item: Demonstration that the assets lost are surplus to local requirements, with calculations using
    the Harlow GI & Open Spaces SPD standards
  level: must
- item: 'Where a facility is being lost: evidence of suitable marketing'
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: A facility is being lost.
- item: 'Where development may meet an exception to Sport England''s Playing Fields Policy: compliance
    with Sport England''s checklist of recommended requirements'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 24. 'Green & Blue Infrastructure
  (G&BI) and Open Space Loss Assessment'. Reserved matters, minor material amendment, non-material amendment
  and variation of condition applications need it only if it was not addressed at an earlier stage or
  has become relevant.
review-status: unverified
field-status: {}
