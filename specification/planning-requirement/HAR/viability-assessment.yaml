reference: viability-assessment
local-authority: HAR
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: At least 11 dwellings.
    - condition:
        field: affordable-housing-below-target
        value: true
        description: A reduction of the minimum affordable housing provision (30%), or no agreement with
          the council.
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>'
        value: 50
        description: More than 50 dwellings.
    - discretionary
  - all:
    - any:
      - ref: major-development
      - condition:
          field: minor-development
          value: true
          description: 'Minor development as the list defines it: 1 to 9 dwellings (or a site under 0.5
            ha), a gypsy/traveller site of fewer than 10 pitches, or other floorspace under 1,000 sq m
            or a site under 1 ha.'
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: Required infrastructure cannot be provided, or a viability assessment is justified
          in relation to planning obligations.
source-url: https://www.harlow.gov.uk/sites/default/files/documents/Main%20validation%20checklist.pdf
policy: Harlow Local Development Plan policies H8, H9, L3 and IN6
source-text: Applications proposing at least 11 dwellings, where there is a reduction of the minimum affordable
  housing provision (30%) or non-agreement between the applicant and the Council. … Applications proposing
  more than 50 dwellings, where the required provision of fully serviced plots for self or custom build
  housing would not be achievable to show that the inclusion of such plots will render the scheme unviable.
  … Applications where required infrastructure cannot be provided. … Applications where the submission
  of a viability assessment has been justified in relation to planning obligations.
must-include:
- item: As per policy IN6 of the Harlow Local Development Plan
  level: must
confidence: medium
notes: From the council's list (Main Validation Checklist, August 2026), page 40. Whether self-build plots
  'would not be achievable' is the applicant's case, so that part shows as discretionary. Viability assessments
  are published in full on validation unless the council accepts a confidentiality request.
review-status: unverified
field-status: {}
