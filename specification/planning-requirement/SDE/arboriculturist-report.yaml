reference: arboriculturist-report
local-authority: SDE
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - consent-under-tpo
      - notice-trees-in-con-area
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within the site, or on adjacent land, that could influence or be affected by
        the development (including street trees).
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
source-text: For proposals where there are trees within the application site, or on land adjacent to it
  that could influence or be affected by the development (including street trees).
must-include:
- item: Which trees are to be retained and how they will be protected during construction works
  level: must
- item: Prepared by a suitably qualified and experienced arboriculturist
  level: should
- item: Position, size, age, species, height and spread of each tree, with an assessment of its condition
    and any appropriate remedial measures
  level: should
confidence: medium
notes: From the council's list (published January 2025), Validation Table page 8, and supporting document
  page 7. The table's row is 'Tree survey/ report/ protection measures/ Arboricultural impact assessment',
  marked for major, minor, householder and tree applications.
review-status: unverified
field-status: {}
