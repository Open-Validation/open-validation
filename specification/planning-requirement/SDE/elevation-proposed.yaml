reference: elevation-proposed
local-authority: SDE
required-if:
  all:
  - any:
    - application-type:
        in:
        - hh
        - full
        - outline
        - lbc
        - advertising
        - ldc
        - prior-approval
    - all:
      - application-type:
          in:
          - reserved-matters
      - discretionary
    - all:
      - application-type:
          in:
          - s73
      - condition:
          field: amends-approved-plans
          value: true
          description: The condition to be removed or varied relates to an approved plan.
    - application-type:
        in:
        - non-material-amendment
  - any:
    - condition:
        field: building-works
        value: true
        description: The proposal involves building works or alterations.
    - condition:
        field: external-alterations
        value: true
        description: The proposal includes external alterations.
    - application-type:
        in:
        - advertising
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: X – as necessary to determine the matters reserved … X – If the condition to be removed or
  varied relates to an approved plan – changes to plans should be clearly annotated/detailed … X - changes
  to plans should be clearly annotated/detailed … x – plans needed to substantiate certificate … x – sufficient
  to demonstrate compliance with the relevant section of the GPDO
must-include:
- item: Critical dimensions and a recognised metric scale marked on the plan, including distances to site
    boundaries and heights of buildings
  level: must
- item: 'Section 73 and non-material amendments: changes to the plans clearly annotated/detailed'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
- item: Heights from ground level to eaves and to roof ridges, and heights of any roof additions (e.g.
    lanterns)
  level: must
confidence: medium
notes: From the council's list (published January 2025), Validation Table page 1-4, and supporting document
  page 2. The national table has one 'Drawings' column; it is written here as floor plans and elevations,
  needed where relevant to the works. For reserved matters it is 'as necessary to determine the matters
  reserved' (discretionary); for certificates and prior approvals, the plans needed to substantiate the
  certificate or show compliance with the GPDO.
review-status: unverified
field-status: {}
