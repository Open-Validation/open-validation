reference: heritage-statement
local-authority: SDE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
  - all:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - park-and-garden
        - scheduled-monument
        description: Related to, or impacting on the setting of, heritage assets (listed buildings and
          structures, historic parks and gardens, scheduled ancient monuments).
    - discretionary
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
source-text: x - if in a conservation area … The scope and degree of detail necessary in a Heritage Statement
  will vary according to the particular circumstances of each application.
must-include:
- item: 'Listed building consent: a schedule of works to the listed building(s)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed building consent: analysis of the significance of the archaeology, history and character
    of the building/structure, the principles of and justification for the works, and their impact on
    its special character, its setting and the setting of adjacent listed buildings'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Applications related to or impacting on the setting of heritage assets: plans showing historic
    features on or next to the site (listed buildings and structures, historic parks and gardens, scheduled
    ancient monuments), with an analysis of significance and the justification for and impact of the works'
  level: must
  required-if:
    site:
      in:
      - listed-building
      - listed-building-setting
      - park-and-garden
      - scheduled-monument
      description: Related to or impacting on the setting of heritage assets.
- item: 'Conservation area: an assessment of the impact of the development on the character and appearance
    of the area'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: The site is in a conservation area.
confidence: medium
notes: From the council's list (published January 2025), Validation Table page 1-2, and supporting document
  page 4. The national table marks it for all major and listed building applications, and for householder
  and minor applications 'if in a conservation area'. The supporting document's guide also covers applications
  related to or impacting on the setting of heritage assets; as the table doesn't mark those, that part
  shows as discretionary. A structural survey may be needed for listed building consent (see unmapped).
review-status: unverified
field-status: {}
