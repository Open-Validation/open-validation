reference: noise-assessment
local-authority: SDE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: The proposal raises issues of disturbance.
    - condition:
        field: noise-sensitive-use
        value: true
        description: A noise-sensitive development in a noise-sensitive area (e.g. housing on major roads).
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
source-text: For proposals that raise issues of disturbance or are considered to be a noise sensitive
  development in what are considered noise sensitive areas.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
confidence: medium
notes: From the council's list (published January 2025), Validation Table page 7, and supporting document
  page 5.
review-status: unverified
field-status: {}
