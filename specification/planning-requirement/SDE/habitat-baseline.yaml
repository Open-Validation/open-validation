reference: habitat-baseline
local-authority: SDE
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
policy: Environment Act 2021; Biodiversity Gain Requirements (Irreplaceable Habitat) Regulations 2024
source-text: A description of any irreplaceable habitat (as set out in column 1 of the Schedule to the
  Biodiversity Gain Requirements (Irreplaceable Habitat) Regulations 2024) on the land to which the application
  relates, that exists on the date of application, (or an earlier date); and plan(s), drawn to an identified
  scale and showing the direction of North, showing onsite habitat existing on the date of application
  (or earlier proposed date), including any irreplaceable habitat (if applicable), Should also be submitted.
must-include:
- item: A description of any irreplaceable habitat on the land on the date of application (or an earlier
    date)
  level: must
- item: Plan(s) drawn to an identified scale, showing the direction of North and the onsite habitat existing
    on the date of application (or earlier proposed date), including any irreplaceable habitat
  level: must
confidence: medium
notes: 'From the council''s list (published January 2025), Validation Table page 4, and supporting document
  page 1. Rule follows the law (householder and other exempt development is exempt): the tables mark it
  for major, minor and section 73 applications ''unless exempt'', and for section 73 unless the original
  permission came before the BNG requirement.'
