reference: bng-metric
local-authority: SDE
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.southderbyshire.gov.uk/assets/attach/13526/Validation-lists-supporting-document-Jan-25.docx
policy: Environment Act 2021
source-text: A Biodiversity Net Gain metric must be submitted and this should be in the form of both an
  Excel spreadsheet and in PDF form. A BNG metric is only valid if condition assessments are supplied
  with the excel spreadsheet and that metric does not contain any errors.
must-include:
- item: Submitted both as an Excel spreadsheet and in PDF form
  level: must
- item: Condition assessments supplied with the Excel spreadsheet; the metric contains no errors
  level: must
- item: Not screenshots of the Excel metric
  level: must
- item: A document outlining the process taken in completing the metric
  level: should
- item: Condition assessment surveys carried out at the appropriate time of year
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), Validation Table page 4, and supporting document
  page 1. Rule follows the law (householder and other exempt development is exempt): the tables mark it
  for major, minor and section 73 applications ''unless exempt'', and for section 73 unless the original
  permission came before the BNG requirement. Where the proposal is claimed to be exempt this must be
  made clear in the submission.'
review-status: unverified
