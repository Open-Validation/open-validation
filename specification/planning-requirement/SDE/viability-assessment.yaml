reference: viability-assessment
local-authority: SDE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The level of affordable housing falls below that required by Development Plan policies.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: Financial contributions fall below those required by Development Plan policies.
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
source-text: Where the level of affordable housing or financial contributions fall below that required
  by Development Plan policies; an ‘open book’ viability appraisal
must-include:
- item: An 'open book' appraisal using the latest BCIS build costs and property values relevant to the
    locale
  level: must
- item: Profit levels reflecting the risk of the site and the tenure mix proposed
  level: should
- item: An undertaking by the applicant to cover the council's costs of engaging the district valuer
  level: must
confidence: medium
notes: From the council's list (published January 2025), Validation Table page 9, and supporting document
  page 7. Major applications only.
review-status: unverified
field-status: {}
