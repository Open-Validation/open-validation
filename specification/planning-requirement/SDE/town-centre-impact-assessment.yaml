reference: town-centre-impact-assessment
local-authority: SDE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure, office or food and drink development outside of town centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Over 1,000 m2.
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
policy: South Derbyshire Local Plan Part 2 Policy RTL1
source-text: For applications which propose retail, leisure, office or food and drink development outside
  of town centres, Policy RTL1 of the Local Plan Part 2 requires an impact assessment if the development
  is over 1,000m2.
confidence: medium
notes: From the council's list (published January 2025), Validation Table page 8-9, and supporting document
  page 5. The supporting document cites Policy RTL1 of the Local Plan Part 1. The sequential assessment
  in the same row is listed as unmapped.
review-status: unverified
field-status: {}
