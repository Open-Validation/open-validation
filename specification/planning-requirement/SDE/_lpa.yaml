submission-standards:
- item: All plans and drawings have critical dimensions and a recognised metric scale marked on them,
    including distances to site boundaries and heights of buildings (eaves, ridge and roof additions),
    and the width and length of new buildings and extensions
  level: must
- item: Plans received without critical dimensions are not checked further until they are provided
  level: must
- item: Changes to plans (section 73 and non-material amendments) clearly annotated/detailed
  level: must
- item: Biodiversity metric submitted as both an Excel spreadsheet and a PDF; screenshots of the metric
    are not valid
  level: must
