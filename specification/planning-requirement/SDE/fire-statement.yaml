reference: fire-statement
local-authority: SDE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Contains two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Contains educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: A building 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: A building of seven or more storeys.
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: battery-energy-storage
        value: true
        description: Battery energy storage system (BESS) scheme.
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: X - Buildings a) that are 18 metres or more in height or b) that contain seven or more storeys
  • Containing a) two or more dwellings or b) educational accommodation … Required for all BESS applications
  to demonstrate how fire risk has been considered and plans in place to reduce risk.
must-include:
- item: 'BESS: nearest hydrant location and open water source'
  level: must
  required-if:
    condition:
      field: battery-energy-storage
      value: true
      description: BESS scheme.
- item: 'BESS: site access for fire appliances, i.e. number of proposed access roads to the site'
  level: must
  required-if:
    condition:
      field: battery-energy-storage
      value: true
      description: BESS scheme.
- item: 'BESS: size of the site and number of containers storing batteries, with the containers annotated
    on the site plan'
  level: must
  required-if:
    condition:
      field: battery-energy-storage
      value: true
      description: BESS scheme.
- item: 'BESS: firefighting provisions (engineered solutions such as sprinklers/drenchers) on site and
    within the containers'
  level: must
  required-if:
    condition:
      field: battery-energy-storage
      value: true
      description: BESS scheme.
- item: 'BESS: fire strategy for each site'
  level: must
  required-if:
    condition:
      field: battery-energy-storage
      value: true
      description: BESS scheme.
- item: 'BESS: full contact details of the responsible person at each site (where possible for each phase)'
  level: must
  required-if:
    condition:
      field: battery-energy-storage
      value: true
      description: BESS scheme.
- item: 'BESS: security measures on site (manned, unmanned or remotely monitored by CCTV)'
  level: must
  required-if:
    condition:
      field: battery-energy-storage
      value: true
      description: BESS scheme.
confidence: medium
notes: From the council's list (published January 2025), Validation Table page 1-2, 6, and supporting
  document page 2-3. Combines the national Fire Statement (minor and major applications) and the local
  'Fire Safety Statement' / 'Fire Risk Statement' for battery energy storage (BESS) schemes, outline and
  full.
review-status: unverified
field-status: {}
