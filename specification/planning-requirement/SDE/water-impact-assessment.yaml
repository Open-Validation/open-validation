reference: water-impact-assessment
local-authority: SDE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - site:
      in:
      - nutrient-neutrality-area
      description: In the River Mease catchment.
  - any:
    - condition:
        field: impermeable-area-increase
        operator: '>'
        value: 0
        description: Will increase surface water runoff.
    - condition:
        field: overnight-accommodation
        value: true
        description: Results in additional overnight stays within the catchment (e.g. new dwellings),
          generating additional foul water.
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
policy: Conservation of Habitats and Species Regulations 2017 (River Mease Special Area of Conservation)
source-text: For applications in the River Mease catchment that will increase surface water runoff and/or
  result in additional overnight stays within the catchment of the River Mease (thus generating additional
  foul water emissions).
must-include:
- item: The foul and surface water mitigation strategy, showing how the development would achieve Nutrient
    Neutrality
  level: must
- item: 'Additional overnight stays: a nutrient budget using the latest River Mease Nutrient Calculator
    from Natural England'
  level: must
  required-if:
    condition:
      field: overnight-accommodation
      value: true
      description: Additional overnight stays.
- item: Bespoke mitigation measures to achieve Nutrient Neutrality, where appropriate
  level: must
- item: 'Non-mains drainage: siting and specification of the proposed tank and location of the outfall,
    including proximity to watercourses (Annex F of the 16 March 2022 Natural England guidance)'
  level: should
  required-if:
    condition:
      field: non-mains-drainage
      value: true
      description: Non-mains drainage proposed.
- item: 'Additional surface water runoff: a nutrient budget calculation'
  level: should
  required-if:
    condition:
      field: impermeable-area-increase
      operator: '>'
      value: 0
      description: Increases surface water runoff.
- item: 'Soakaway: its location and evidence of porosity/infiltration testing'
  level: must
  required-if:
    condition:
      field: soakaways-proposed
      value: true
      description: A soakaway is proposed.
confidence: medium
notes: From the council's list (published January 2025), Validation Table page 7, and supporting document
  page 6. The list calls it 'River Mease – foul / surface water Mitigation Strategy'.
review-status: unverified
field-status: {}
