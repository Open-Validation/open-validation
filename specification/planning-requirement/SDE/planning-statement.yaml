source-text: For major applications, to set out the application and its compliance with relevant policy
  from the development plan. For applications to remove or vary conditions, NMAs, certificates and prior
  notifications, to set out the changes proposed, evidence to demonstrate lawfulness and/ or compliance
  with the relevant legislation, as necessary. In other cases, to add explanation to support the proposal
  e.g. statement of need for tourism and commercial development in rural areas.
