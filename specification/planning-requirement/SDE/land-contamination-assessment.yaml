reference: land-contamination-assessment
local-authority: SDE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - contaminated-land
          description: Site known to be contaminated.
      - condition:
          field: industrial-site
          value: true
          description: Site previously in use for industrial processes.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
source-text: Phase I contamination assessment for development on sites known to be contaminated, or which
  have been previously in use for industrial processes. In some cases the Phase I may identify the need
  for Phase II investigations to be conducted, and these should be done prior to submission of the application.
  May be required for a prior approval application depending on the nature of the proposal and historical
  use of the site.
must-include:
- item: Phase I contamination assessment
  level: must
- item: Any Phase II investigations identified by the Phase I, done before the application is submitted
  level: should
- item: Where contamination is identified, the proposed remediation measures
  level: must
confidence: medium
notes: From the council's list (published January 2025), Validation Table page 6, and supporting document
  page 4-5. The supporting document describes this for 'major' applications, but the table marks major
  and minor applications; the table is followed here.
review-status: unverified
field-status: {}
