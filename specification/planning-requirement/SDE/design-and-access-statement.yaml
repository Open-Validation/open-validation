reference: design-and-access-statement
local-authority: SDE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Additional floorspace over 100 square metres.
