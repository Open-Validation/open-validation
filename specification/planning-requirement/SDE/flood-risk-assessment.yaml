reference: flood-risk-assessment
local-authority: SDE
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare.
