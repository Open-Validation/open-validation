reference: flood-risk-assessment
local-authority: SDE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - flood-risk-zone
          description: Located in Flood Zone 2 or 3 as designated by the Environment Agency.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Development proposals of 1 hectare or greater in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Development proposals of 1 hectare or greater in Flood Zone 1.
      - site:
          in:
          - critical-drainage-area
          description: Areas which have critical drainage problems.
      - site:
          in:
          - surface-water-flood-risk
          - groundwater-flood-risk
          description: Development could be affected by sources of flooding other than rivers.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
policy: NPPF
source-text: Required for all proposals for new development other than householder development located
  in Flood Zones 2 and 3 as designated by the Environment Agency. Also required for all planning applications
  for development proposals of 1 hectare or greater in Flood Zone 1. Required for development proposals
  of less than 1 hectare in Flood Zone 1 where development could be affected by sources of flooding other
  than rivers or in areas which have critical drainage problems. May be required for a prior approval
  application depending on the nature of the proposal and its location relative to flood risk
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development and shows
    how they will be managed, taking climate change into account
  level: should
- item: Opportunities to reduce the probability and consequences of flooding
  level: should
- item: Design of surface water management systems, including Sustainable Drainage Systems (SuDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
- item: Sequential Test and Exception Test, where needed
  level: should
- item: Prepared in consultation with the Environment Agency
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), Validation Table page 6, and supporting document
  page 3. The table''s row is ''Flood Risk Assessment / Sequential Assessment''. Prior approvals: ''may
  be required'' (discretionary).'
review-status: unverified
field-status: {}
