reference: biodiversity-survey-report
local-authority: SDE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: protected-species
          value: true
          description: May affect protected species (e.g. demolition of older buildings or roof spaces,
            removal of trees, scrub or hedgerows, alterations to watercourses).
      - discretionary
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
policy: South Derbyshire Local Plan Part 1 (2016) Policy BNE3
source-text: Required for development which may have impacts on wildlife and biodiversity. This is in
  accordance with Policy BNE3 of the Local Plan Part 1. … Updated ecological information may be required
  where applying to remove, vary or discharge a condition depending on the nature of the condition and
  the age of the original reports
must-include:
- item: Existing biodiversity interests and the possible impacts on them
  level: should
- item: Information supporting any proposed mitigation and/or compensation measures
  level: must
- item: Any further protected species and habitat surveys highlighted by a Preliminary Ecological Appraisal
    (e.g. bat emergence surveys) done before the application is submitted
  level: should
- item: Reports no more than 3 years old (or as set out by the report's author)
  level: must
confidence: medium
notes: From the council's list (published January 2025), Validation Table page 5-6, and supporting document
  page 2. 'May have impacts on wildlife and biodiversity' is a judgement beyond the protected species
  cases the supporting document names, so it also shows as discretionary; updated information for section
  73 applications depends on the condition and age of reports.
review-status: unverified
field-status: {}
