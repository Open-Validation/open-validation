reference: transport-assessment
local-authority: SDE
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - ref: major-development
  - discretionary
source-url: https://www.southderbyshire.gov.uk/assets/attach/13525/Validation-Table-Jan-25.docx
policy: NPPF
source-text: For all major development that have significant transport implications and if the proposal
  is likely to generate significant amounts of movement.
must-include:
- item: Accessibility to the site by all modes of transport, and the likely modal split of journeys to
    and from the site
  level: should
- item: Proposed measures to improve access by public transport, walking and cycling, to reduce the need
    for parking, and to mitigate transport impacts
  level: should
confidence: medium
notes: 'From the council''s list (published January 2025), Validation Table page 8, and supporting document
  page 6. The table''s row is ''Transport Assessment / Travel Plan'', major only. ''Significant transport
  implications'' is a judgement: discretionary within major development.'
review-status: unverified
field-status: {}
