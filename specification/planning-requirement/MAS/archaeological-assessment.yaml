reference: archaeological-assessment
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - lbc
      - demolition-con-area
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - site:
        in:
        - historic-environment-record
        - scheduled-monument
        description: Development known to be on or adjacent to a heritage asset of archaeological interest.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policy HE1; NPPF Part 16
source-text: Archaeology Assessment Applications for major development; Applications for development known
  to be on or adjacent to a heritage asset of archaeological interest;
must-include:
- item: As a minimum, an archaeological desk-based assessment
  level: must
- item: Where appropriate, the results of a suitable field evaluation assessing the character, date, condition
    and extent of any archaeological remains
  level: must
  required-if: discretionary
- item: The full Historic Environment Record consulted as part of the assessment
  level: must
- item: Where necessary, provision for further archaeological mitigation work (excavation, recording and
    interpretation of remains)
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted August 2024), page 18-19. Table Two (2.14). Application types
  are those ticked in the Table Three checklist matrix (page 29-31). The matrix column 'Development in
  a Conservation Area' is shown as demolition-con-area and 'Telecommunications Application' as pa-ecomms-network.
review-status: unverified
field-status: {}
