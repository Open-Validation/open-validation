reference: section-proposed
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - hh
      - lbc
      - demolition-con-area
      - full
      - reserved-matters
      - pa-ecomms-network
  - condition:
      field: adjacent-level-difference
      operator: '>'
      value: 1
      description: A substantial level difference (in excess of 1 m) between the site and the adjacent
        property/land.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: These plans should only be submitted with an application where there is a substantial level
  difference between the site and the adjacent property/land (i.e in excess of 1m).
must-include:
- item: How proposed buildings relate to existing site levels and neighbouring development
  level: must
- item: Existing and proposed floor levels
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 9. Table One (1.12), 'Existing and proposed
  site sections and finished floor levels'. The list adds that these are unlikely to be needed for many
  householder applications. Application types are those ticked in the Table Three checklist matrix (page
  29-31). The matrix column 'Development in a Conservation Area' is shown as demolition-con-area and 'Telecommunications
  Application' as pa-ecomms-network.
review-status: unverified
field-status: {}
