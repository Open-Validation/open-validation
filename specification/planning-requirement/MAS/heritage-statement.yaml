reference: heritage-statement
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - lbc
      - demolition-con-area
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      - scheduled-monument
      description: Will or may impact designated heritage assets and/or their settings (including conservation
        areas, locally listed buildings, non-designated assets and scheduled ancient monuments).
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policy HE1; NPPF Part 16
source-text: Heritage Statement All development proposals which will/may impact designated Heritage Assets
  and/or their settings (including conservation areas, locally listed buildings. Non designated assets
  and Scheduled Ancient Monuments).
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting,
    proportionate to the asset's importance
  level: should
- item: Where relevant, supported by photographs, phasing plans, historic photographs or drawings, historic
    maps and other relevant sources
  level: should
- item: Justification and mitigation for any harm to the significance of a designated heritage asset,
    and any avoidance, mitigation or enhancement measures
  level: should
confidence: medium
notes: From the council's list (adopted August 2024), page 18-19. Table Two (2.14), 'Heritage Statement
  / Archaeology Assessment'. The list adds that a structural survey may be needed for demolition and landscape
  plans may be helpful. Application types are those ticked in the Table Three checklist matrix (page 29-31).
  The matrix column 'Development in a Conservation Area' is shown as demolition-con-area and 'Telecommunications
  Application' as pa-ecomms-network.
review-status: unverified
field-status: {}
