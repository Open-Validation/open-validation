reference: town-centre-impact-assessment
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 500
      description: Retail and leisure development over 500 sq m (net).
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Proposed in an edge of centre or out of centre location.
  - condition:
      field: site-allocation
      value: false
      description: Not allocated in the Local Plan.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policies RT1-RT9; NPPF Part 7
source-text: Retail Impact Test Retail and leisure developments over 500 sqm (net) which are proposed
  in edge of centre and out of centre locations and which are not allocated in the Local Plan.
must-include:
- item: A retail impact assessment in accordance with planning practice guidance
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 25. Table Two (2.25), 'Retail Impact Assessment
  and/or Sequential Test'. The floorspace condition stands for retail and leisure floorspace only. It
  will be assessed by a third party at the applicant's expense. The Sequential Test is listed as unmapped.
  Application types are those ticked in the Table Three checklist matrix (page 29-31).
review-status: unverified
field-status: {}
