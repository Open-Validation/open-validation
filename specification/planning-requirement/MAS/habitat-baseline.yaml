reference: habitat-baseline
local-authority: MAS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development would be subject to the biodiversity gain condition (not exempt).
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: Where an applicant believes the development would be subject to the biodiversity gain condition,
  the application must be accompanied by minimum information set out in Article 7
must-include:
- item: Drawn to an identified scale and showing the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or earlier proposed date), including any irreplaceable
    habitat
  level: must
confidence: medium
notes: 'From the council''s list (adopted August 2024), page 9. Table One (1.13): ''plan(s), drawn to
  an identified scale and showing the direction of North, showing onsite habitat existing on the date
  of application''. Shown for applications subject to the biodiversity gain condition, as the law sets.'
review-status: unverified
field-status: {}
