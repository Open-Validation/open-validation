reference: location-plan
local-authority: MAS
required-if:
  always: true
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Table One - sets out a list of national validation requirements for planning applications.
  These are required with all applications.
must-include:
- item: Based on an up-to-date map
  level: must
- item: At an identified standard metric scale (typically 1:1250 or 1:2500), scaled to fit onto A4 or
    A3 paper wherever possible
  level: should
- item: Sufficient roads and/or buildings on land adjoining the site to make its exact location clear
  level: should
- item: Application site edged clearly with a red line, including all land needed to carry out the development
    (for example access from a public highway, visibility splays, landscaping, car parking and open areas
    around buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (adopted August 2024), page 6. Table One (1.4). The list uses 'should'
  for the plan contents. The matrix (page 29) does not tick the two lawful development certificate columns,
  but Table One says the national requirements apply to all applications.
