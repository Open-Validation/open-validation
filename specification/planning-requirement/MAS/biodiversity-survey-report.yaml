reference: biodiversity-survey-report
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - national-nature-reserve
        - local-nature-reserve
        - local-wildlife-site
        description: On or adjacent to statutory or non-statutory nature conservation sites (including
          Local Wildlife Sites), or within 400m of the possible potential Sherwood Forest Special Protection
          Area.
    - condition:
        field: semi-natural-habitat-impact
        value: true
        description: There are natural habitats present on the site.
    - condition:
        field: protected-species
        value: true
        description: There is the possibility that protected species could be nearby.
    - condition:
        field: demolition
        value: true
        description: Demolition of a structure (bat survey report).
    - condition:
        field: roof-alteration
        value: true
        description: Significant alterations to the roof and/or loft space (bat survey report).
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Conversion of an agricultural building (bat survey report).
    - condition:
        field: tree-works
        value: true
        description: Large trees to be removed or significantly pruned (survey for bat roost potential).
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policy NE2; NPPF Part 15
source-text: An Ecological Impact Assessment (EcIA) should be submitted where a development is taking
  place on or adjacent to statutory or non-statutory nature conservation sites (including Local Wildlife
  Sites), there are natural habitats present on the site or there is the possibility that protected species
  could be nearby. Where a proposal involves the demolition of a structure or significant alterations
  to the roof and/or loft space, or the conversion of an agricultural building, then the application must
  be accompanied by a bat survey report. Large trees to be removed or significantly pruned must also be
  surveyed for bat roost potential. Bat surveys can therefore be required on applications that do not
  require an EcIA. A risk based assessment will be required for developments within 400m of the possible
  potential Special Protection Area
must-include:
- item: Follows the CIEEM Guidance on Ecological Impact Assessment and BS 42020
  level: should
- item: The CIEEM EcIA checklist completed
  level: should
- item: Protected species surveys submitted in full and referenced within the EcIA, where protected species
    may be present
  level: must
- item: All protected species survey work up to date and completed before submission
  level: must
- item: Evaluation of features, likely impacts, and mitigation, compensation and enhancement measures
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 13-14. Table Two (2.7), 'Ecological Surveys
  / Reports'. Bat surveys can be required on applications that do not need an EcIA. The 'possible potential
  SPA' around Sherwood Forest is not a designated SPA; the list asks for a risk-based assessment within
  400m of it. Application types are those ticked in the Table Three checklist matrix (page 29-31).
