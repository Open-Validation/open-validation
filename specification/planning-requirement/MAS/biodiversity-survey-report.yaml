reference: biodiversity-survey-report
local-authority: MAS
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - priority-habitat
      description: The site is on or next to a statutory or non-statutory nature conservation site, or
        contains natural habitats.
  - condition:
      field: protected-species
      value: true
      description: Protected species could be on or near the site.
  - condition:
      field: demolition
      value: true
      description: The proposal involves demolition of a structure (bat survey).
  - condition:
      field: roof-alteration
      value: true
      description: Significant alterations to the roof or loft space (bat survey).
  - site:
      in:
      - special-protection-area
      description: The site is within 400m of the possible potential Sherwood Forest Special Protection
        Area.
  - discretionary
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
source-text: Where a proposal involves the demolition of a structure or significant alterations to the
  roof and/or loft space, or the conversion of an agricultural building, then the application must be
  accompanied by a bat survey report. … A risk based assessment will be required for developments within
  400m of the possible potential Special Protection Area
must-include:
- item: A bat survey report
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition of a structure.
    - condition:
        field: roof-alteration
        value: true
        description: Significant alterations to the roof or loft space.
    - discretionary
- item: A risk-based assessment
  level: must
  required-if:
    site:
      in:
      - special-protection-area
      description: Within 400m of the possible potential Sherwood Forest SPA.
confidence: medium
notes: 'Audit (wrong_trigger): item 2.7 asks for an EcIA, a bat survey and a risk-based SPA assessment.
  Officer discretion covers agricultural building conversions and large trees to be removed or significantly
  pruned (bat survey). Sherwood Forest is a possible potential SPA, not a designated one.'
