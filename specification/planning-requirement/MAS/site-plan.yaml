reference: site-plan
local-authority: MAS
required-if:
  application-type:
    in:
    - hh
    - lbc
    - demolition-con-area
    - advertising
    - consent-under-tpo
    - full
    - outline
    - reserved-matters
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Table One - sets out a list of national validation requirements for planning applications.
  These are required with all applications.
must-include:
- item: Block plan of the site (e.g. at a scale of 1:200)
  level: should
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: 'Unless they would not influence or be affected by the development: all buildings, roads and footpaths
    on adjoining land including access arrangements; public rights of way crossing or adjoining the site;
    the position of all trees on the site and on adjacent land; the extent and type of any hard surfacing;
    and boundary treatment including walls or fencing where proposed'
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 7. Table One (1.5). Application types are those
  ticked in the Table Three checklist matrix (page 29-31). The matrix column 'Development in a Conservation
  Area' is shown as demolition-con-area and 'Telecommunications Application' as pa-ecomms-network.
review-status: unverified
