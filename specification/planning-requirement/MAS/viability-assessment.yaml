reference: viability-assessment
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The scheme does not propose to meet all policy requirements (such as affordable housing
        or education) because doing so would make it unviable.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policies H4 and IN9; NPPF Part 4
source-text: Where schemes are not proposing to meet all policy requirements, such as affordable housing,
  education etc. As meeting all policy requirements would make them unviable.
must-include:
- item: Prepared in accordance with Planning Practice Guidance, RICS guidance and the NPPF
  level: must
- item: Prepared with professional integrity by a suitably qualified practitioner
  level: should
- item: An executive summary setting out the key findings clearly for members of the public
  level: must
- item: Prepared on the basis that it will be made publicly available, other than in exceptional circumstances
  level: should
confidence: medium
notes: From the council's list (adopted August 2024), page 27. Table Two (2.32). Application types are
  those ticked in the Table Three checklist matrix (page 29-31).
review-status: unverified
field-status: {}
