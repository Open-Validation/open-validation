reference: design-and-access-statement
local-authority: MAS
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Development in a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: A building or buildings with floor space of 1000 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A design and access statement (DAS) is required for: Applications for major development;
  Applications for development in a designated area (Conservation Area) where the proposed development
  consists of: One or more dwellings; or – A building or buildings with a floor space of 1000 square meters
  or more; Applications for listed building consent.'
confidence: medium
notes: From the council's list (adopted August 2024), page 7. Table One (1.6), the national rule. The
  matrix (page 29) also ticks householder, conservation-area and all full, outline and reserved matters
  columns; the rule follows the wording of Table One.
review-status: unverified
field-status: {}
