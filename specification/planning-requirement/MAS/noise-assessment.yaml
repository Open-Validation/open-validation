reference: noise-assessment
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: The development would generate significant levels of noise or vibration in relation
          to residential and commercial properties.
    - condition:
        field: noise-sensitive-use
        value: true
        description: A noise sensitive use in proximity to a known noise source.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policy P7
source-text: Instances where the development would generate significant levels of noise or vibration in
  relation to residential and commercial properties, or it proposes a noise sensitive use in proximity
  to a known noise source.
must-include:
- item: The source and the impact, with any mitigation needed to reduce disturbance from noise or vibration
    to acceptable levels
  level: must
- item: Prepared by a suitably qualified acoustician
  level: should
- item: Demonstrates sufficient sound insulation (or other mitigation) to avoid harm to amenity
  level: should
confidence: medium
notes: From the council's list (adopted August 2024), page 21. Table Two (2.19), 'Noise Impact Assessment'.
  Application types are those ticked in the Table Three checklist matrix (page 29-31).
review-status: unverified
field-status: {}
