reference: noise-assessment
local-authority: MAS
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development would generate significant levels of noise or vibration near residential
        or commercial properties.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise-sensitive use in proximity to a known noise source.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
source-text: Instances where the development would generate significant levels of noise or vibration …
  or it proposes a noise sensitive use in proximity to a known noise source.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: 'Audit (missing_requirement): item 2.19.'
review-status: unverified
field-status: {}
