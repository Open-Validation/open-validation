reference: arboriculturist-report
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: tree-removal
          value: true
          description: Works to fell a tree.
      - site:
          in:
          - tree-preservation-zone
          - conservation-area
          description: A protected tree (TPO or tree in a Conservation Area).
    - site:
        in:
        - tree-preservation-zone
        description: A development proposal may have an impact on a TPO tree.
    - ref: major-development
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policies P2 and NE2
source-text: Where works are required to a fell a protected tree (TPO or tree in Conservation Area). Where
  a development proposal may have an impact on a TPO tree. All major development schemes.
must-include:
- item: A tree survey by an arboricultural specialist showing the distribution of trees on site and the
    works proposed
  level: must
- item: An arboricultural impact assessment showing how the development will co-exist with the trees (e.g.
    level changes, service installation, hard surfacing, material storage, future shadowing)
  level: must
- item: Tree root protection zones clearly marked on a scaled plan
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 27. Table Two (2.31), 'Tree survey and/or associated
  Arboricultural Impact Assessment'. Application types are those ticked in the Table Three checklist matrix
  (page 29-31).
review-status: unverified
field-status: {}
