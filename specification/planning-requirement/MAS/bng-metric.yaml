reference: bng-metric
local-authority: MAS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development would be subject to the biodiversity gain condition (not exempt).
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; Mansfield District Local Plan 2013-2033 Policy NE2
source-text: Where an applicant believes the development would be subject to the biodiversity gain condition,
  the application must be accompanied by minimum information set out in Article 7
must-include:
- item: A statement whether the applicant considers any permission would be subject to the biodiversity
    gain condition
  level: must
- item: The pre-development biodiversity value(s) on the date of application or an earlier proposed date;
    where an earlier date is used, that date and the reasons for it
  level: must
- item: A completed copy of the statutory biodiversity metric calculation tool showing the pre-development
    value of the onsite habitat, including the publication date of the metric used
  level: must
- item: A statement whether activities that result in loss of onsite biodiversity value ('degradation')
    have been carried out before that date and, where they have, the date immediately before, the value
    on that date, the completed metric and any supporting evidence
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or earlier
    date)
  level: must
- item: For minor development the Small Sites Metric may be used instead, except where it is not appropriate
    (for example European protected species, priority habitats, statutory protected sites or habitats
    not in the statutory metric are present)
  level: should
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development.
- item: The metric showing the anticipated post-development biodiversity value of the site, to the extent
    this is known (local requirement, within the BNG Statement)
  level: should
  source-text: A completed copy of the relevant biodiversity metric tool showing the anticipated post-development
    biodiversity value of the site to the extent that this is known.
confidence: medium
notes: 'From the council''s list (adopted August 2024), page 9-10, 12. Table One (1.13 major, 1.14 minor)
  and Table Two (2.3). Shown for applications subject to the biodiversity gain condition, as the law sets:
  householder and other exempt applications are exempt. The BNG Statement itself (2.3) is listed as unmapped.'
review-status: unverified
field-status: {}
