reference: planning-statement
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: employment-site-non-employment-use
        value: true
        description: Alternative uses proposed on allocated employment sites (Policy E3).
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of open space (Policy IN3).
    - condition:
        field: allotment-land
        value: true
        description: Development on allotment land (Policy IN5).
    - condition:
        field: entertainment-leisure-use
        value: true
        description: Proposals for leisure and visitor facilities (Policy RT11).
    - condition:
        field: loss-of-use
        value: true
        description: Loss of existing facilities (e.g. pub, church, community centres) (Policy IN7).
    - condition:
        field: affects-playing-field
        value: true
        description: Development affecting playing field land.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 (all planning policies, including E3, IN3, IN5, IN7 and
  RT11)
source-text: All Major Developments. Alternative uses proposed on allocated employment sites (Policy E3).
  Development proposals involving the loss of open space (Policy IN3). Development on allotment land (Policy
  IN5). Proposals for leisure and visitor facilities (Policy RT11). Development proposals that involved
  the loss of existing facilities (e.g. pub, church community centres…) (Policy IN7). Development affecting
  playing field land.
must-include:
- item: The context and need for the proposed development
  level: must
- item: How the proposed development accords with relevant national and local policies
  level: must
- item: How the application has been informed by local community engagement and any amendments that resulted
    from it
  level: must
- item: 'For the listed policy cases: the specific information needed to address the relevant Local Plan
    policy requirements'
  level: must
- item: 'For development affecting playing fields: the information in Sport England''s checklist (Appendix
    A)'
  level: should
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Development affecting playing field land.
confidence: medium
notes: From the council's list (adopted August 2024), page 22. Table Two (2.20), 'Planning Statement including
  Statement of Community Involvement'. Application types are those ticked in the Table Three checklist
  matrix (page 29-31).
review-status: unverified
field-status: {}
