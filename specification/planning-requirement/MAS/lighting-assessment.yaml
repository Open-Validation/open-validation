reference: lighting-assessment
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: external-lighting
        value: true
        description: External lighting is proposed.
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting is proposed.
  - any:
    - condition:
        field: adjoins-residential-property
        value: true
        description: Site adjacent to residential properties.
    - condition:
        field: outside-urban-area
        value: true
        description: Outside the urban boundary.
    - site:
        in:
        - conservation-area
        - listed-building
        description: Adjacent to or within a Conservation Area, or adjacent to or on a Listed Building.
    - site:
        in:
        - town-centre
        description: Buildings within the town centres.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policies P7, NE3 and HE1
source-text: If floodlighting or external lighting is proposed on a site adjacent to residential properties,
  outside the urban boundary, adjacent or within a Conservation Area or adjacent/on a Listed Building
  and buildings within the town centres.
must-include:
- item: A technical specification
  level: must
- item: A layout plan / lighting orientation plan, with beam orientation
  level: must
- item: A schedule of the equipment in the design
  level: must
- item: Hours of operation
  level: must
- item: Details of lighting spill, including a polar luminance diagram based on vertical luminance at
    the nearest sensitive premises
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 15. Table Two (2.9), 'External Lighting Scheme'.
  The list says the scheme can often be conditioned and may not hold up validation. Application types
  are those ticked in the Table Three checklist matrix (page 29-31).
review-status: unverified
field-status: {}
