reference: lighting-assessment
local-authority: MAS
required-if:
  all:
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting is proposed.
    - condition:
        field: external-lighting
        value: true
        description: External lighting is proposed.
  - any:
    - condition:
        field: outside-urban-area
        value: true
        description: The site is outside the urban boundary.
    - site:
        in:
        - conservation-area
        - listed-building
        - listed-building-setting
        description: The site is in or next to a conservation area, or on or next to a listed building.
    - discretionary
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
source-text: If floodlighting or external lighting is proposed on a site adjacent to residential properties,
  outside the urban boundary, adjacent or within a Conservation Area or adjacent/on a Listed Building
  and buildings within the town centres.
must-include:
- item: Hours of operation and details of lighting spill, including a polar luminance diagram based on
    vertical luminance at the nearest sensitive premises
  level: must
confidence: medium
notes: 'Audit (wrong_trigger, duplicate): item 2.9; the workbook quoted the ecology sentence and filed
  the luminance diagram text as an advertisement row. Officer discretion covers sites next to homes and
  in the town centres.'
review-status: unverified
field-status: {}
