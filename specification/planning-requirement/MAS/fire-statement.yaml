reference: fire-statement
local-authority: MAS
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings (multi-occupied residential building).
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended
  2021)
source-text: Multi-occupied residential buildings of 18 metres or more in height, or 7 or more storeys,
  must be accompanied by a Fire Statement completed by an expert.
must-include:
- item: Completed by an expert
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 8. Table One (1.7). Shown with the national
  rule (two or more dwellings or educational accommodation, and 18 m or 7 storeys).
review-status: unverified
field-status: {}
