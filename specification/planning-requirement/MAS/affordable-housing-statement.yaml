reference: affordable-housing-statement
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Site area of 0.5 hectares or more.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policy H4; NPPF paragraph 65
source-text: Planning applications for sites of 10 or more dwellings or where the site area is 0.5 hectares
  or more.
must-include:
- item: Demonstrates compliance with Policy H4 (Affordable Housing), including parts 4 and 5
  level: should
confidence: medium
notes: From the council's list (adopted August 2024), page 12. Table Two (2.1). It can be contained within
  the Planning Statement. Application types are those ticked in the Table Three checklist matrix (page
  29-31).
review-status: unverified
field-status: {}
