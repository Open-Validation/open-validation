reference: land-contamination-assessment
local-authority: MAS
required-if:
  any:
  - condition:
      field: industrial-site
      value: true
      description: New development on former petrol filling stations, former landfill sites or former
        industrial sites.
  - condition:
      field: sensitive-end-use
      value: true
      description: Development with a vulnerable end user (e.g. residential development).
  - site:
      in:
      - contaminated-land
      description: Known contamination issues associated with the site or the surrounding sites (e.g.
        a former industrial use).
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policy NE3
source-text: New developments on former petrol filling stations, former landfill sites and former industrial
  sites. Development with a vulnerable end user (e.g. residential development). Development if there are
  known contamination issues associated with the site or the surrounding sites (eg if site or surroundings
  had a former industrial use).
must-include:
- item: As a minimum, a desk study and site walkover report
  level: must
- item: 'The stages needed: desk top study; site investigation / detailed investigation; remediation strategy
    / validation report (including a method for dealing with unforeseen contamination during excavation
    and construction)'
  level: should
- item: Investigation of all previous and future uses for potential to contaminate groundwater (much of
    the district is on a principal aquifer)
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 20. Table Two (2.15). The matrix (page 30)
  ticks no application type for this item, so no type restriction is shown.
review-status: unverified
field-status: {}
