reference: land-contamination-assessment
local-authority: MAS
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: A former petrol filling station, landfill or industrial site, or a site with known
        contamination on or around it.
  - condition:
      field: sensitive-end-use
      value: true
      description: Development with a vulnerable end user (e.g. residential development).
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
source-text: New developments on former petrol filling stations, former landfill sites and former industrial
  sites. Development with a vulnerable end user (e.g. residential development).
must-include:
- item: As a minimum, a desk study and site walkover report
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): item 2.15; the must-include item is the audit''s summary.'
review-status: unverified
field-status: {}
