reference: waste-management-plan
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development (including changes of use).
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1
        description: Commercial development (including changes of use).
  - discretionary
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policies P1 and P2
source-text: All applications for residential or commercial development (including changes of use) that
  will have an impact on the generation of waste.
must-include:
- item: The location of bin storage
  level: must
- item: The size of bins and the design and materials of any proposed bin enclosure
  level: must
confidence: medium
notes: From the council's list (adopted August 2024), page 25. Table Two (2.26), 'Site Waste Management'.
  Shown with 'discretionary' because whether the development 'will have an impact on the generation of
  waste' is a judgement. Application types are those ticked in the Table Three checklist matrix (page
  29-31).
review-status: unverified
field-status: {}
