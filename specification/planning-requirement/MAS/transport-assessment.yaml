source-text: All developments that will generate significant amounts of movement will be required to provide
  a travel plan, and the application should be supported by a transport statement or transport assessment.
must-include:
- item: Existing public transport provision
  level: must
- item: Measures to mitigate the residual impacts of development, such as improvements to the public transport
    network, bus stops and infrastructure
  level: must
- item: Locations of bus stops and walk distances, including isochrone plans
  level: must
