reference: flood-risk-assessment
local-authority: MAS
required-if:
  any:
  - ref: major-development
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or greater (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or greater (Flood Zone 1).
  - site:
      in:
      - critical-drainage-area
      description: A site under 1 hectare with critical drainage problems.
  - all:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2 or 3.
    - condition:
        field: new-build
        value: true
        description: New built development.
  - discretionary
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
source-text: 'All Major Developments; All developments in Floodzone 1 when: - The site is 1 hectare or
  greater … All new built development within Flood Zones 2 and 3.'
must-include:
- item: Flood risk sequential test / exception test as set out in NPPF & PPG
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
confidence: medium
notes: 'Audit (wrong_trigger): item 2.10. Officer discretion covers Flood Zone 1 sites under 1 ha changing
  to a more vulnerable use.'
review-status: unverified
field-status: {}
