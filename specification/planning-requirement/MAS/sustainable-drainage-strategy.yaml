reference: sustainable-drainage-strategy
local-authority: MAS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or greater.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Site of 1 hectare or greater.
    - site:
        in:
        - critical-drainage-area
        description: Site less than 1 hectare with critical drainage problems.
    - all:
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: Change of use to a more vulnerable class.
      - site:
          in:
          - surface-water-flood-risk
          description: Can be affected by sources of flooding other than rivers and sea (e.g. surface
            water, drains).
    - all:
      - site:
          in:
          - flood-risk-zone
          description: Flood Zones 2 and 3.
      - condition:
          field: new-build
          value: true
          description: New built development.
source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
policy: Mansfield District Local Plan 2013-2033 Policies CC2 and CC3; Mansfield SuDS SPD
source-text: 'All Major Developments; All developments in Floodzone 1 when: The site is 1 hectare or greater;
  The site is less than 1 hectare but has critical drainage problems; The site is less than 1 hectare
  and includes the change of use of development type to a more vulnerable class where they can be affected
  by sources of flooding other than rivers and sea (e.g. surface water, drains); All new built development
  within Flood Zones 2 and 3.'
must-include:
- item: Any SuDS drawn up in accordance with the council's SuDS SPD
  level: should
confidence: medium
notes: 'From the council''s list (adopted August 2024), page 16. Table Two (2.10): the list asks for a
  ''Flood Risk Assessment and Drainage Strategy'' as one item, with surface water management including
  SuDS. Application types are those ticked in the Table Three checklist matrix (page 29-31).'
review-status: unverified
field-status: {}
