reference: air-quality-assessment
local-authority: EXE
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: car-free
        value: false
        description: The development is not car-free residential development.
  - site:
      in:
      - air-quality-management-area
      description: The site is within 20 metres of the Air Quality Management Area.
source-url: https://exeter.gov.uk/media/2dphlnlo/ecc-final-local-list-july-2024.pdf
policy: Core Strategy Policy CP11; Local Plan First Review Policy EN3
source-text: All applications for major development, except car-free residential development, must be
  supported by an Air Quality Assessment (AQA), addressing the air quality impacts of both the construction
  and operational phases of the development on human health and ecological receptors.
must-include:
- item: The air quality impacts of both the construction and operational phases on human health and ecological
    receptors
  level: must
confidence: low
