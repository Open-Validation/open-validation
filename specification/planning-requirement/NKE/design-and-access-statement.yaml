reference: design-and-access-statement
local-authority: NKE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal consists of one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The proposal consists of a building or buildings with a floor space of 100 square
            metres or more.
source-url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
source-text: 'Design and Access Statement … Required for the following: … Applications for major development
  … Applications for development in a conservation area, where the proposed development consists of one
  or more dwellings; or a building or buildings with a floor space of 100 square metres or more. [Listed
  building consent list:] Design and Access Statement Required for all listed building consents'
