reference: flood-risk-assessment
local-authority: NKE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - flood-risk-zone
          description: In Flood Zone 2 or 3 (including minor development and change of use).
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: Site of more than 1 hectare (Flood Zone 1).
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: Site of more than 1 hectare (Flood Zone 1).
      - site:
          in:
          - critical-drainage-area
          description: In Flood Zone 1 with critical drainage problems notified by the Environment Agency.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
policy: National Planning Policy Framework; Planning Practice Guidance (flood risk)
source-text: 'You need to do a flood risk assessment for most developments within one of the flood zones.
  This includes developments: • in flood zone 2 or 3 including minor development and change of use • more
  than 1 hectare (ha) in flood zone 1 • less than 1 ha in flood zone 1, including a change of use in development
  type to a more vulnerable class (for example from commercial to residential), where they could be affected
  by sources of flooding other than rivers and the sea (for example surface water drains, reservoirs)
  ... in an area within flood zone 1 which has critical drainage problems as notified by the Environment
  Agency'
must-include:
- item: Sequential and exception test evidence, where applicable
  level: must
confidence: medium
notes: From the council's list (adopted May 2024, in force 20 May 2024), Full Applications list page 4;
  Outline Applications list page 3. Wording from the Outline Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Outline%20Applications%20Validation%20List.pdf)
  as quoted. Category 3 on the Full and Outline lists. Sites under 1 ha in Flood Zone 1 where a change
  to a more vulnerable use could be affected by other sources of flooding are shown as discretionary (no
  mapped designation is named). The Householder and Outline lists also ask for 'Any other report/survey
  from the Central Lincolnshire ‘full’ validation checklist relevant to the scale, nature and location
  of development', so householder and outline applications are included as discretionary.
review-status: unverified
field-status: {}
