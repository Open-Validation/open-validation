reference: location-plan
local-authority: NKE
required-if:
  application-type:
    in:
    - full
    - outline
    - hh
    - lbc
source-url: https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Full%20Applications%20Validation%20List.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site Location Plan 1:1250 or 1:2500 scale
must-include:
- item: At a scale of 1:1250 or 1:2500
  level: must
- item: Based on an up-to-date map, identifying sufficient roads and/or buildings on adjoining land to
    make the exact location of the site clear
  level: must
- item: Application site edged clearly with a red line, including all land necessary to carry out the
    development (e.g. access from a public highway, visibility splays, landscaping, car parking and open
    areas around buildings)
  level: should
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (adopted May 2024, in force 20 May 2024), Full Applications list page 2;
  Householder Applications list page 1; Listed Building Consent Applications list page 1; Outline Applications
  list page 2. Wording from the Householder Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Householder%20Applications%20Validation%20List.pdf),
  the Listed Building Consent Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Listed%20Building%20Consent%20Applications%20Validation%20List.pdf),
  the Outline Applications list (https://www.n-kesteven.gov.uk/sites/default/files/2024-05/Outline%20Applications%20Validation%20List.pdf)
  as quoted. Required on all four lists. The contents come from the lists' plans footnote; its scale bar,
  north point and dimension rules are in the council's submission standards.
