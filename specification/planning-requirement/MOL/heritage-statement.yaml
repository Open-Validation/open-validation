reference: heritage-statement
local-authority: MOL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: operational-development
        value: true
        description: Not a change of use only (there is operational development).
  - application-type:
      in:
      - lbc
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition of a Non-Designated Heritage Asset.
    - site:
        in:
        - locally-listed-building
        description: A Non-Designated Heritage Asset.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy EN6; NPPF Section 16
source-text: All types of application for planning permission except where the proposal involves a change
  of use only, ie. there would be no operational development ... Where the HER shows a heritage asset
  on the site or on a site adjacent to the site. ... All applications for Listed ... building Consentor
  the demolition of a Non-Designated Heritage Asset
must-include:
- item: Evidence that the Historic Environment Record (HER) has been consulted
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: The unique reference number given by the HER consultation
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline
- item: A description of the significance of any heritage assets affected, including the contribution
    made by their setting, proportionate to the assets' importance
  level: must
  required-if:
    any:
    - site:
        in:
        - historic-environment-record
        description: The HER shows a heritage asset on the site or on an adjacent site.
    - application-type:
        in:
        - lbc
    - all:
      - condition:
          field: demolition
          value: true
          description: Demolition of a Non-Designated Heritage Asset.
      - site:
          in:
          - locally-listed-building
          description: A Non-Designated Heritage Asset.
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 26-27. Item
  22. The HER is held by Surrey County Council.
review-status: unverified
field-status: {}
