reference: bng-metric
local-authority: MOL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Environment Act 2021; Biodiversity Gain (Town and Country Planning) (Modifications and Amendments)
  (England) Regulations 2024; Mole Valley Local Plan 2020-2039 Policies EN5 and EN9
source-text: All development excluding exemptions ... A completed Statutory Metric (as opposed to just
  baseline info)
must-include:
- item: A completed statutory metric, not just the baseline
  level: must
- item: The whole metric as an Excel spreadsheet
  level: should
- item: Unpopulated tabs not deleted, even if not relevant to the application
  level: must
- item: 'Input tabs: background details, baseline and (where appropriate) post-development biodiversity
    values, and details of any irreplaceable habitats present'
  level: must
- item: Draft post-development biodiversity values where net gain is to be provided entirely on-site or
    on linked off-site land
  level: must
  required-if: discretionary
- item: Results tabs, including trading summaries
  level: must
- item: Condition assessment sheets used for the metric, as an appendix to the Biodiversity Statement
  level: should
- item: Habitats in the metric clearly referenced and matching the habitats in the habitat plans and other
    documents
  level: must
- item: Any caveats or justification explained in the metric's 'Assessor comments' field
  level: must
- item: The metric's 'off-site' tab completed with all data fields filled in
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Biodiversity net gain is to be provided on linked off-site land.
confidence: medium
notes: From the council's Biodiversity Net Gain Validation Checklist (v1 2026, created 8 September 2026),
  page 2-3. Also LVR item 7, page 9. Both lists say 'All development excluding exemptions'; shown with
  the biodiversity-gain-condition field because householder and other exempt applications are exempt by
  law. The LVR (item 7, page 9-10) excludes s73A retrospective permissions, s73 permissions whose original
  permission was granted or applied for before 12 February 2024, and the statutory exemptions (de minimis,
  householder, small self-build, biodiversity gain sites, high speed rail); permission in principle is
  out of scope. Exempt applications give an exemption statement with evidence instead. The draft post-development
  values are needed unless the gain is bought as statutory credits; there is no field for that, so the
  item shows as discretionary.
review-status: unverified
field-status: {}
