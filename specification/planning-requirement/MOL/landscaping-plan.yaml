reference: landscaping-plan
local-authority: MOL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
  - all:
    - application-type:
        in:
        - outline
    - ref: major-development
    - discretionary
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: minor-development
        value: true
        description: Minor development (1-9 dwellings, or under 1,000 sq m / under 1 ha).
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policies EN4, EN5, EN7, EN8, EN9, EN13 and S2; NPPF Sections
  8 and 12
source-text: All types of major application for full planning permission. All major outline applications
  for planning permission where landscaping is to be considered. All types of minor application for planning
  permission (excluding Householder). Applications under S73 of the Act (including minor material amendments)
  where the subject of the application affects landscaping proposals or potential
must-include:
- item: As a minimum, an indicative landscaping strategy
  level: must
- item: The principles of the scheme in terms of landscape, spatial integration and post-development pressure
  level: should
- item: Areas of proposed hard and soft landscaping, with the locations of all features
  level: must
- item: Soft landscaping using predominantly native species, identifying the type, species, size and quantities
    of planting
  level: should
- item: Trees or vegetation to be retained clearly identified on the plans
  level: must
- item: 'Hard landscaping details: materials (brand, colour etc), enclosures (including walls and fences)
    and permeability of materials'
  level: should
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 11. For major
  outline applications it is needed only 'where landscaping is to be considered' (not reserved), shown
  as discretionary. S73 applications (including minor material amendments) are included only where the
  variation affects this topic; there is no field for what a variation affects, so that part shows as
  discretionary.
review-status: unverified
field-status: {}
