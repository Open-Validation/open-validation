reference: cil-form
local-authority: MOL
required-if:
  all:
  - any:
    - all:
      - condition:
          field: new-build
          value: true
          description: New build residential floorspace.
      - condition:
          field: housing-floorspace
          operator: '>'
          value: 0
          description: New build residential floorspace.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new dwellings, through conversion or new build.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 0
        description: New retail floorspace, through conversion or new build.
  - condition:
      field: cil-liable
      value: true
      description: There is a CIL charge.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy D1; Community Infrastructure Levy Regulations 2010
source-text: All types of application for new build ... residential floorspace and proposals ... for one
  or more new dwellings either through conversion or new build. ... All types of application for new build
  ... retail floorspace either through ... conversion or new build. ... when there is a CIL charge.
must-include:
- item: The Additional Information Request Form (CIL Form 1)
  level: must
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 39. Items
  35 (residential) and 36 (retail).
review-status: unverified
field-status: {}
