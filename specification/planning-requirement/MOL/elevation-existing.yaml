reference: elevation-existing
local-authority: MOL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - demolition-con-area
      - ldc
      - prior-approval
  - site:
      in:
      - green-belt
      - rural-area
      description: Within the Green Belt or the Countryside beyond the Green Belt.
  - any:
    - all:
      - condition:
          field: demolition
          value: true
          description: Replacement of one or more dwellings or buildings.
      - condition:
          field: new-build
          value: true
          description: Replacement of one or more dwellings or buildings.
    - condition:
        field: building-works
        value: true
        description: Extensions to dwellings or buildings.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All types of application for the replacement of one or more dwellings or buildings. ... All
  applications for the extensions to dwellings or buildings Within the Green Belt and Countryside beyond
  the Green Belt
must-include:
- item: A scale drawing of all elevations of any existing dwelling/building being replaced, separate from
    the plans of the proposed dwelling/building
  level: must
- item: Volume calculations for the existing dwelling/building and the proposed increase/decrease
  level: must
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 34. Item
  30 (Plan and Drawing Requirements).
review-status: unverified
field-status: {}
