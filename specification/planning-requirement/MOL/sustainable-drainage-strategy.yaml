reference: sustainable-drainage-strategy
local-authority: MOL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - critical-drainage-area
          description: In a Local Critical Drainage Area shown on the Local Plan policies map.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 3
            description: A net increase of 3 or more residential units.
        - any:
          - condition:
              field: site-area-residential
              operator: '>='
              value: 0.25
              description: A site of 0.25 ha or more.
          - condition:
              field: site-area-non-residential
              operator: '>='
              value: 0.25
              description: A site of 0.25 ha or more.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy INF3; NPPF Section 14
source-text: All types of major applications for ... planning permission, All types of application for
  planning permission involving a net increase of 3 or more residential units or 0.25ha in size in Local
  Critical Drainage Areas.
must-include:
- item: A completed Sustainable Drainage Strategy, proportionate to the nature and scale of the proposal
  level: must
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 20. Item
  15 (Sustainable drainage systems).
review-status: unverified
field-status: {}
