reference: air-quality-assessment
local-authority: MOL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - ref: major-development
      - any:
        - any:
          - condition:
              field: convenience-retail-floorspace
              operator: '>'
              value: 800
              description: Food retail over 800 sq m.
          - condition:
              field: comparison-retail-floorspace
              operator: '>'
              value: 1500
              description: Non-food retail over 1,500 sq m.
          - all:
            - condition:
                field: use-class
                value: financial-professional-services
                description: Financial and professional services over 2,500 sq m.
            - condition:
                field: floorspace
                operator: '>'
                value: 2500
                description: Financial and professional services over 2,500 sq m.
          - all:
            - condition:
                field: use-class
                value: drinking-establishment
                description: Drinking establishment over 600 sq m.
            - condition:
                field: floorspace
                operator: '>'
                value: 600
                description: Drinking establishment over 600 sq m.
          - all:
            - condition:
                field: use-class
                value: hot-food-takeaway
                description: Fast food over 500 sq m.
            - condition:
                field: floorspace
                operator: '>'
                value: 500
                description: Fast food over 500 sq m.
          - all:
            - condition:
                field: use-class
                value: business
                description: B1 (business) over 2,500 sq m.
            - condition:
                field: floorspace
                operator: '>'
                value: 2500
                description: B1 (business) over 2,500 sq m.
          - condition:
              field: industrial-floorspace
              operator: '>'
              value: 4000
              description: General industry over 4,000 sq m.
          - condition:
              field: warehousing-floorspace
              operator: '>'
              value: 5000
              description: Storage or distribution over 5,000 sq m.
          - all:
            - condition:
                field: use-class
                value: hospital-nursing-home
                description: C2 hospital or nursing home.
            - condition:
                field: residential-capacity
                operator: '>'
                value: 50
                description: Over 50 beds.
          - all:
            - condition:
                field: use-class
                value: residential-education
                description: C2 residential education.
            - condition:
                field: residential-capacity
                operator: '>'
                value: 150
                description: Over 150 students.
          - all:
            - condition:
                field: use-class
                value: institutional-hostel
                description: C2 institutional hostel.
            - condition:
                field: residential-capacity
                operator: '>'
                value: 400
                description: Over 400 residents.
          - condition:
              field: dwelling-count
              operator: '>'
              value: 50
              description: C3 over 50 units.
          - all:
            - condition:
                field: use-class
                value: former-d1
                description: Former D1 uses (clinics, health centres, creches, day nurseries, schools,
                  museums, public halls, exhibition halls, places of worship) over 1,000 sq m.
            - condition:
                field: floorspace
                operator: '>'
                value: 1000
                description: Former D1 uses (clinics, health centres, creches, day nurseries, schools,
                  museums, public halls, exhibition halls, places of worship) over 1,000 sq m.
          - all:
            - condition:
                field: use-class
                value: former-d2
                description: Cinema, concert halls, bingo halls (previous D2 uses) over 1,500 sq m.
            - condition:
                field: floorspace
                operator: '>'
                value: 1500
                description: Cinema, concert halls, bingo halls (previous D2 uses) over 1,500 sq m.
        - any:
          - all:
            - ref: major-development
            - condition:
                field: parking-spaces
                operator: '>'
                value: 100
                description: Major development with more than 100 parking spaces.
          - discretionary
    - condition:
        field: warehousing-floorspace
        operator: '>='
        value: 500
        description: B8 storage and distribution floorspace of 500 sq m or more.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy EN12; NPPF Section 15
source-text: All types of major applications for planning permission where a Transport Assessment is required
  All areas of the District All types of application for All areas of the B8 storage and distribution
  District use class with a floorspace of 500m2 or more.
must-include:
- item: An air quality assessment determining the significance of the predicted impact on local air quality
  level: must
- item: Carried out by an air quality consultant
  level: should
- item: An emissions mitigation assessment, unless agreed in writing with the Air Quality Officer
  level: must
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 25. Item
  20. 'Where a Transport Assessment is required' uses the Transport Assessment thresholds from items 26
  (see transport-assessment).
review-status: unverified
field-status: {}
