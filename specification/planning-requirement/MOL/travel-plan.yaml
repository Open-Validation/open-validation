reference: travel-plan
local-authority: MOL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: convenience-retail-floorspace
        operator: '>'
        value: 800
        description: Food retail over 800 sq m.
    - condition:
        field: comparison-retail-floorspace
        operator: '>'
        value: 1500
        description: Non-food retail over 1,500 sq m.
    - all:
      - condition:
          field: use-class
          value: financial-professional-services
          description: Financial and professional services over 2,500 sq m.
      - condition:
          field: floorspace
          operator: '>'
          value: 2500
          description: Financial and professional services over 2,500 sq m.
    - all:
      - condition:
          field: use-class
          value: drinking-establishment
          description: Drinking establishment over 600 sq m.
      - condition:
          field: floorspace
          operator: '>'
          value: 600
          description: Drinking establishment over 600 sq m.
    - all:
      - condition:
          field: use-class
          value: hot-food-takeaway
          description: Fast food over 500 sq m.
      - condition:
          field: floorspace
          operator: '>'
          value: 500
          description: Fast food over 500 sq m.
    - all:
      - condition:
          field: use-class
          value: business
          description: B1 (business) over 2,500 sq m.
      - condition:
          field: floorspace
          operator: '>'
          value: 2500
          description: B1 (business) over 2,500 sq m.
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 4000
        description: General industry over 4,000 sq m.
    - condition:
        field: warehousing-floorspace
        operator: '>'
        value: 5000
        description: Storage or distribution over 5,000 sq m.
    - all:
      - condition:
          field: use-class
          value: hospital-nursing-home
          description: C2 hospital or nursing home.
      - condition:
          field: residential-capacity
          operator: '>'
          value: 50
          description: Over 50 beds.
    - all:
      - condition:
          field: use-class
          value: residential-education
          description: C2 residential education.
      - condition:
          field: residential-capacity
          operator: '>'
          value: 150
          description: Over 150 students.
    - all:
      - condition:
          field: use-class
          value: institutional-hostel
          description: C2 institutional hostel.
      - condition:
          field: residential-capacity
          operator: '>'
          value: 400
          description: Over 400 residents.
    - condition:
        field: dwelling-count
        operator: '>'
        value: 50
        description: C3 over 50 units.
    - all:
      - condition:
          field: use-class
          value: former-d1
          description: Former D1 uses (clinics, health centres, creches, day nurseries, schools, museums,
            public halls, exhibition halls, places of worship) over 1,000 sq m.
      - condition:
          field: floorspace
          operator: '>'
          value: 1000
          description: Former D1 uses (clinics, health centres, creches, day nurseries, schools, museums,
            public halls, exhibition halls, places of worship) over 1,000 sq m.
    - all:
      - condition:
          field: use-class
          value: former-d2
          description: Cinema, concert halls, bingo halls (previous D2 uses) over 1,500 sq m.
      - condition:
          field: floorspace
          operator: '>'
          value: 1500
          description: Cinema, concert halls, bingo halls (previous D2 uses) over 1,500 sq m.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy INF1; NPPF para 117
source-text: 'All types of application for planning ... permission for (use class): ... - Food retail
  over 800sqm - Non-food retail over 1,500sqm - Financial & Professional Services over 2,500sqm - Drinking
  establishment over 600sqm - Fast food over 500sqm - B1 over 2,500sqm - General Industry over 4,000sqm
  - Storage or distribution over 5,000sqm - C2 (hospitals/nursing homes) over 50 beds - C2 (residential
  education) over 150 students - C2 (institutional hostels) over 400 residents - C3 over 50 units (Former
  D1 uses) - Clinics/ healthcentres/ crèches/ day-nurseries/ schools/ museums/ public halls/ exhibition
  halls/ places of worship over 1,000sqm - Cinema, concert halls, bingo halls (previous D2 uses) over
  1,500sqm'
must-include:
- item: Follows Surrey County Council's 'Travel Plans Good Practice Guide'
  level: must
- item: A draft Section 106 agreement to secure the Travel Plan
  level: must
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 29. Item
  26 asks for a 'Transport Assessment and Travel Plan' at these thresholds; the second row (more than
  100 parking spaces and so on) asks only for a Transport Assessment. The list cites the Guide as July
  2010 in one place and July 2018 in another.
review-status: unverified
field-status: {}
