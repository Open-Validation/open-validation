reference: affordable-housing-statement
local-authority: MOL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more housing units proposed.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: A housing site of 0.5 ha or more.
      - all:
        - site:
            in:
            - designated-rural-area
            description: In a rural area (Housing Act 1985 s157).
        - condition:
            field: dwelling-count
            operator: '>='
            value: 6
            description: 6 or more housing units proposed in a rural area.
      - condition:
          field: affordable-housing-led
          value: true
          description: An application for 100% affordable housing.
      - condition:
          field: rural-exception-housing
          value: true
          description: An application for a rural exception site.
      - discretionary
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy H3; NPPF para 65 and Annex 2
source-text: All applications for planning permission for housing where the number of units proposed is
  10 or more, or the site has an area 0.5ha or more. • In rural areas where the number of units proposed
  is 6 or more. Proposals for group of people specific needs (such as purpose-built accommodation for
  older persons) Applications under S73 of the Act (including minor material amendments) where the subject
  of the application affects affordable housing provision. ... Applications for 100% affordable housing
  ... Applications for rural exception sites
must-include:
- item: Number, mix and tenure of affordable units, saying if the application is for a Build to Rent scheme
  level: must
- item: The policy requirements, whether they are met, and if not, why not
  level: must
- item: Plans showing the location of the affordable units
  level: must
- item: Floorspace provision for each unit type
  level: must
- item: The proposed Registered Provider (if known)
  level: should
- item: Details of all contact with Mole Valley's Housing department
  level: must
- item: Heads of terms for the S106 agreement
  level: must
- item: Vacant Building Credit calculation and evidence
  level: must
  required-if: discretionary
- item: Viability assessment
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 4. 'Rural
  areas' are shown as the Housing Act 1985 s157 designated rural areas, which the list links to. 'Proposals
  for group of people specific needs (such as purpose-built accommodation for older persons)' has no threshold,
  so it shows as discretionary. Vacant Building Credit and viability are asked for 'if relevant'. S73
  applications (including minor material amendments) are included only where the variation affects this
  topic; there is no field for what a variation affects, so that part shows as discretionary.
review-status: unverified
field-status: {}
