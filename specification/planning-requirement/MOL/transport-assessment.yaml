source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy INF1; NPPF para 117
source-text: 'All types of application for planning ... permission for (use class): ... - Food retail
  over 800sqm - Non-food retail over 1,500sqm - Financial & Professional Services over 2,500sqm - Drinking
  establishment over 600sqm - Fast food over 500sqm - B1 over 2,500sqm - General Industry over 4,000sqm
  - Storage or distribution over 5,000sqm - C2 (hospitals/nursing homes) over 50 beds - C2 (residential
  education) over 150 students - C2 (institutional hostels) over 400 residents - C3 over 50 units (Former
  D1 uses) - Clinics/ healthcentres/ crèches/ day-nurseries/ schools/ museums/ public halls/ exhibition
  halls/ places of worship over 1,000sqm - Cinema, concert halls, bingo halls (previous D2 uses) over
  1,500sqm ... All types of major application for planning permission where there are more than 100 parking
  spaces are proposed; Developments located in areas where there is poor or substandard existing transport
  infrastructure; Developments involving the large-scale import or export of materials, plant or products
  by road; Developments involving substantial numbers of heavy goods vehicle movements. ... All types
  of application for planning permission for: ... - Food retail between 250 & 800sqm ... - Non-food retail)
  between 800 & 1,500sqm - Financial & Professional Services between 1,000 and 2,500sqm - Food & Drink
  (mainly on the premises) between 300 and 2,500sqm - Public House, wine bar, drinking establishment between
  300 and 600sqm - Hot Food Takeaway between 250 and 500sqm - Business (office, research and development
  and light industrial process) between 1,500 and 2,500sqm - General Industry between 2,500 and 4000sqm'
