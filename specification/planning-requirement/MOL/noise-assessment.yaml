reference: noise-assessment
local-authority: MOL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Adjacent to an 'A' classified road or a railway, or near a motorway or the A24/A25
            with speed limits of 50mph or more, or within the 2032 57dB LAeq(16hour) noise contour for
            Gatwick Airport.
    - condition:
        field: noise-generating-use
        value: true
        description: Uses in Use Class E(d) (gymnasium), E(g)(iii) (general industrial processes) or F2
          (sports and recreation), or sui generis bars and drinking establishments.
    - condition:
        field: plant-equipment
        value: true
        description: For or incorporating air conditioning units, extraction units or air source heat
          pumps.
    - condition:
        field: food-or-drink-use
        value: true
        description: Uses in Class E(b), or a drinking establishment with food and catering.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy EN12; NPPF Section 15
source-text: All types of application for planning permission for residential development Applications
  where development is adjacent to an ‘A’ classified road or a railway, or in the vicinity of a motorway
  or A24/A25 with speed limits of 50MPH or greater or within the area bounded by the 2032 57dB LAeq(16hour)
  noise contour for Gatwick Airport ... All types of application for planning permission for uses falling
  within Use Class E(d)(gymnasium) and E(g)(iii) (general industrial processes) or F2 (Sports and recreation)
  or sui generis bars and drinking establishments All areas of the District All types of application for
  planning permission for or incorporating air conditioning units, extraction units or air source heat
  pumps ... uses falling within class Eb or drinking establishment with food and catering
must-include:
- item: A noise impact assessment with its methodology and data, assessing intrusive noise levels on future
    sensitive receptors in line with existing industry standards
  level: must
  required-if:
    all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Adjacent to an 'A' classified road or a railway, or near a motorway or the A24/A25
          with speed limits of 50mph or more, or within the 2032 57dB LAeq(16hour) noise contour for Gatwick
          Airport.
- item: In sensitive or harsh locations, suitable consideration of LAmax
  level: must
  required-if:
    all:
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development.
      - condition:
          field: noise-sensitive-use
          value: true
          description: Adjacent to an 'A' classified road or a railway, or near a motorway or the A24/A25
            with speed limits of 50mph or more, or within the 2032 57dB LAeq(16hour) noise contour for
            Gatwick Airport.
    - discretionary
- item: A noise impact assessment with its methodology and data, assessing the potential impacts of high
    levels of intrusive noise and vibration generated within the scheme
  level: must
  required-if:
    condition:
      field: noise-generating-use
      value: true
      description: Uses in Use Class E(d) (gymnasium), E(g)(iii) (general industrial processes) or F2
        (sports and recreation), or sui generis bars and drinking establishments.
- item: Noise targets and mitigation/control measures, based on a reasonable worst case scenario rather
    than a proposed occupier
  level: must
  required-if:
    condition:
      field: noise-generating-use
      value: true
      description: Uses in Use Class E(d) (gymnasium), E(g)(iii) (general industrial processes) or F2
        (sports and recreation), or sui generis bars and drinking establishments.
- item: 'Larger commercial installations: as a minimum a desk study identifying the impact on relevant
    sensitive receptors, with plans and elevations sufficient to identify adverse impacts'
  level: must
  required-if:
    all:
    - condition:
        field: plant-equipment
        value: true
        description: For or incorporating air conditioning units, extraction units or air source heat
          pumps.
    - discretionary
- item: 'Small schemes: a schedule of the plant manufacturers'' noise and vibration performance details,
    with block plans and elevations identifying sensitive neighbouring receptors'
  level: must
  required-if:
    all:
    - condition:
        field: plant-equipment
        value: true
        description: For or incorporating air conditioning units, extraction units or air source heat
          pumps.
    - discretionary
- item: A noise impact assessment with suitable noise targets for operational hours
  level: must
  required-if:
    condition:
      field: food-or-drink-use
      value: true
      description: Uses in Class E(b), or a drinking establishment with food and catering.
- item: A scheme of odour mitigation and design showing intake and exhaust, with supporting plans
  level: must
  required-if:
    condition:
      field: food-or-drink-use
      value: true
      description: Uses in Class E(b), or a drinking establishment with food and catering.
- item: Manufacturers' noise and vibration performance details, where available
  level: should
  required-if:
    condition:
      field: food-or-drink-use
      value: true
      description: Uses in Class E(b), or a drinking establishment with food and catering.
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 23-24. Item
  19 (Noise Impact Assessments). 'Larger' and 'small' plant schemes and 'sensitive or harsh locations'
  are not defined, so those items show as discretionary.
