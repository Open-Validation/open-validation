reference: flood-risk-assessment
local-authority: MOL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - flood-risk-zone
          description: In Flood Zones 2, 3 and 3b.
      - any:
        - condition:
            field: site-area-residential
            operator: '>'
            value: 1
            description: In Flood Zone 1 with a site area over 1 ha.
        - condition:
            field: site-area-non-residential
            operator: '>'
            value: 1
            description: In Flood Zone 1 with a site area over 1 ha.
      - all:
        - site:
            in:
            - surface-water-flood-risk
            - groundwater-flood-risk
            description: Flood Zone 1 land that may be subject to other (non-fluvial) sources of flooding,
              on a site under 1 ha.
        - condition:
            field: involves-change-of-use
            value: true
            description: The development introduces a more vulnerable use (increases the vulnerability
              classification).
      - site:
          in:
          - future-flood-risk
          description: Flood Zone 1 land the district's Strategic Flood Risk Assessment shows will be
            at increased risk of flooding during its lifetime.
      - site:
          in:
          - critical-drainage-area
          description: Flood Zone 1 land Surrey County Council (Lead Local Flood Authority) identify as
            vulnerable to particular flooding and drainage issues.
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy INF3; NPPF Section 14 and Annex 3
source-text: All applications for planning permission. Flood Zones 2, 3and 3b ... All types of application
  for planning permission where the site area exceeds 1ha. Flood Zone 1 ... Applications under S73 of
  the Act (including minor material amendments) where the subject of the application affects flooding
  matters previously proposed as part of the development. ... development introducing a more vulnerable
  use (increases the ... vulnerable classification) where ... the site is less than 1ha ... Flood Zone
  1 and on land that may be subject to other (nonfluvial) sources of flooding ... Flood Zone 1 and on
  land the strategic flood risk assessment (SFRA) for the district shows will be at increased risk of
  ... Flood Zone 1 and on land Surrey County Council (the Lead Local Flood Authority) identify as vulnerable
  to particular flooding and drainage issues.
must-include:
- item: Meets the requirements of the NPPG Flood Risk and Coastal Change
  level: must
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 19-20. Item
  14. The council's 'vulnerable to particular flooding and drainage issues' areas are shown with the critical-drainage-area
  designation. S73 applications (including minor material amendments) are included only where the variation
  affects this topic; there is no field for what a variation affects, so that part shows as discretionary.
review-status: unverified
field-status: {}
