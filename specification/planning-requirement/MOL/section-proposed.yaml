reference: section-proposed
local-authority: MOL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - demolition-con-area
      - ldc
      - prior-approval
  - condition:
      field: operational-development
      value: true
      description: New operational development.
  - any:
    - condition:
        field: site-level-change
        operator: '>'
        value: 500
        description: A structure more than 500mm above or below natural ground level.
    - condition:
        field: change-in-ground-levels
        value: true
        description: A change in levels on the site of more than 1 in 50.
  - discretionary
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All types of application for new ... operational development on sloping ... land (sloping
  land is defined as any situation where a structure would be more than 500mm above or below the natural
  ground level or where there is a change in levels on a site in excess of 1 in 50.
must-include:
- item: Cross-sections through the building
  level: must
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 34. Item
  30. On sloping land cross-sections through the building must be provided 'where the height of land adjacent
  to the external walls of proposed buildings is above or below the ground floor level'; there is no field
  for that, so it shows as discretionary. The existing and proposed spot-height survey drawings asked
  for on sloping land are listed as unmapped.
review-status: unverified
field-status: {}
