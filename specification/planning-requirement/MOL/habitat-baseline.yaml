reference: habitat-baseline
local-authority: MOL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Environment Act 2021; Biodiversity Gain (Town and Country Planning) (Modifications and Amendments)
  (England) Regulations 2024; Mole Valley Local Plan 2020-2039 Policies EN5 and EN9
source-text: All development excluding exemptions ... The baseline and proposed habitat plans (as opposed
  to just baseline habitat plan)
must-include:
- item: A UK Habitat Classification (UKHab) baseline plan accompanying the metric, with habitats clearly
    referenced to match the BNG statement and metric
  level: must
- item: A shapefile of the plans, where possible
  level: should
- item: Off-site land identified on a site plan, with a baseline ecological assessment of that land
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Biodiversity net gain is to be provided on linked off-site land.
confidence: medium
notes: From the council's Biodiversity Net Gain Validation Checklist (v1 2026, created 8 September 2026),
  page 1, 3. Also LVR item 7, page 9. Both lists say 'All development excluding exemptions'; shown with
  the biodiversity-gain-condition field because householder and other exempt applications are exempt by
  law. The LVR (item 7, page 9-10) excludes s73A retrospective permissions, s73 permissions whose original
  permission was granted or applied for before 12 February 2024, and the statutory exemptions (de minimis,
  householder, small self-build, biodiversity gain sites, high speed rail); permission in principle is
  out of scope. Exempt applications give an exemption statement with evidence instead.
review-status: unverified
field-status: {}
