reference: energy-statement
local-authority: MOL
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development.
  - all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (1-9 dwellings, or under 1,000 sq m / under 1 ha).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Minor residential development.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy EN13
source-text: All types of Major residential developments ... All types of minor residential development
must-include:
- item: Plans and technical information on the on-site carbon dioxide savings set out in EN13
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development.
- item: Where this cannot be met on site, a commitment in the planning obligations strategy to pay the
    carbon off-set contribution or deliver equivalent CO2 reduction measures elsewhere
  level: must
  required-if:
    all:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
    - discretionary
- item: How the development will be zero-carbon ready (EN13), including any renewable energy technology
    and environmentally friendly heating; can be included in the Planning Statement
  level: must
  required-if:
    all:
    - condition:
        field: minor-development
        value: true
        description: Minor development (1-9 dwellings, or under 1,000 sq m / under 1 ha).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Minor residential development.
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 32. Item
  28 (Energy Assessment). Residential development is shown as one or more new dwellings.
review-status: unverified
field-status: {}
