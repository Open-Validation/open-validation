reference: land-contamination-assessment
local-authority: MOL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: ground-disturbance
        value: true
        description: Operational development with any ground disturbance or potential changes to the groundwater
          regime.
    - site:
        in:
        - contaminated-land
        description: The previous use of the land or adjacent land could have resulted in contamination
          (e.g. industrial processes, car repairs, car parks, petrol filling stations, chemical storage
          including on farms), or hard standing and historic infilling are likely.
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy EN12; NPPF paragraphs 196-200 and Annex 2
source-text: All Major and minor applications for planning permission for operational development where
  there would be any ground disturbance or potential changes to the groundwater regime. Required where
  the previous use of the land or adjacent land could have resulted in contamination, e.g from industrial
  processes, car repairs, car parks, petrol filling stations or storage of chemicals (including on farms)
  or
must-include:
- item: A desk study report, including the findings of a site walkover, sufficient to conclude whether
    contamination is likely to be present
  level: must
- item: 'If contamination is suspected: a preliminary risk assessment with a conceptual model of the pollutant
    linkages and the proposed means of breaking any identified linkages'
  level: should
  required-if: discretionary
- item: 'If the desk study identifies a high risk of significant contamination (such as landfill or former
    industrial works): a detailed initial schedule of future intrusive investigation, sufficient to identify
    significant pollutant linkages'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 22. Item
  17 (Contaminated Land Investigation). The later items depend on what the desk study finds, so they show
  as discretionary. S73 applications (including minor material amendments) are included only where the
  variation affects this topic; there is no field for what a variation affects, so that part shows as
  discretionary.
review-status: unverified
field-status: {}
