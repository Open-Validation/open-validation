reference: archaeological-assessment
local-authority: MOL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - archaeological-priority-area
        description: Within defined Areas of High Archaeological Potential or County Sites of Archaeological
          Importance.
    - any:
      - condition:
          field: site-area-residential
          operator: '>'
          value: 0.4
          description: A site larger than 0.4 ha.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 0.4
          description: A site larger than 0.4 ha.
    - site:
        in:
        - scheduled-monument
        description: Affecting the site or setting of a Scheduled Ancient Monument.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy EN6; NPPF Section 16
source-text: All types of application for planning permission Sites within defined Areas of High Archaeological
  Potential or County Sites of Archaeological Importance. Development proposals for sites larger than
  0.4ha in area. Proposals affecting the site or setting of a Scheduled Ancient Monument
must-include:
- item: An assessment of the archaeological value of the site, including the sources used
  level: must
- item: As a minimum a desk-based assessment, with a field assessment if necessary
  level: must
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 27. Item
  23.
review-status: unverified
field-status: {}
