reference: arboriculturist-report
local-authority: MOL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on or overhanging the site, or a potential impact on trees identified on the
        application form.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Requirement within the '1APP' planning application form; Mole Valley Local Plan 2020-2039 Policies
  EN4 and EN9
source-text: All types of major and minor ... applications for planning ... permission, and change of
  use if formation of hardstanding is proposed, where there are trees on or overhanging the site and/or
  where a potential impact on trees has been identified on the application form
must-include:
- item: A tree survey schedule
  level: must
- item: A Tree Protection Plan (TPP)
  level: must
- item: An Arboricultural Implications Assessment (AIA)
  level: must
- item: Arboricultural Method Statements (AMS) where the AIA identifies the need
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 12. A change
  of use is included only if it forms hardstanding.
review-status: unverified
field-status: {}
