reference: design-and-access-statement
local-authority: MOL
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Major residential development.
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floorspace of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'All types of Major residential developments, or applications in a Conservation Area for:
  • one or more dwellings or • a building or buildings with a floorspace of 100 square metres or more
  • applications for Listed Building Consent (see below) ... Applications for Listed Building Consent'
must-include:
- item: The design principles and concepts applied to the proposed development
  level: must
- item: The steps taken to appraise the context of the development and how the design takes it into account
  level: must
- item: The approach to access and how relevant Local Plan policies have been taken into account
  level: must
- item: Any consultation on access issues and how it informed the development
  level: must
- item: How any specific issues which might affect access have been addressed
  level: must
- item: 'For listed building consent: how the design principles take account of the building''s special
    architectural or historic importance, the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For listed building consent (unless the works only affect the interior): the approach to access,
    including alternatives considered, and how it takes account of those matters'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - discretionary
- item: A single combined statement where a planning application is submitted in parallel with listed
    building consent
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 35-36. Items
  31 and 32. The list asks for a statement for major residential development rather than all major development.
  The access item for listed building consent does not apply where the works only affect the interior;
  there is no field for that.
review-status: unverified
field-status: {}
