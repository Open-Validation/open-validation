reference: recreation-facilities-assessment
local-authority: MOL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - demolition-con-area
      - ldc
      - prior-approval
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: The proposal involves a loss of open space.
    - site:
        in:
        - open-space
        description: The proposal involves a change to an open space.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policies EN10 and EN11; NPPF paragraphs 103 and 107
source-text: All types of applications involving ... a loss of or change to an open ... space.
must-include:
- item: A statement addressing the criteria in policy EN10, or EN11 if a Local Green Space is involved
  level: must
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 12. Item
  10 (Open Space Impact Assessment). Open space is as defined in annex 2 of the NPPF.
review-status: unverified
field-status: {}
