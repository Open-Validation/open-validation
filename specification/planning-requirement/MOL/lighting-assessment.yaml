reference: lighting-assessment
local-authority: MOL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - advertising
    - any:
      - condition:
          field: external-lighting
          value: true
          description: The proposal includes lighting.
      - condition:
          field: illuminated
          value: true
          description: The advertisement is illuminated.
  - all:
    - application-type:
        in:
        - approval-condition
    - condition:
        field: external-lighting
        value: true
        description: A condition of a planning permission requires details of lighting.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policies EC7, EN1, EN2, EN4, EN5, EN6, EN9 and EN12; NPPF para
  198
source-text: All types of application for planning permission or advertisement consent including lighting
  or where details of lighting is required by condition of a grant of planning permission All types of
  application for planning permission or advertisement consent where the lighting units are proposed at
  a height of 2m or above
must-include:
- item: The number, type, location (on a scaled plan) and intensity of the installation, including hours
    of illumination
  level: must
- item: A lighting impact study showing the extent and amount of illumination on the ground, and an analysis
    of light spillage outside the site and/or into the sky
  level: must
  required-if:
    condition:
      field: lighting-unit-height
      operator: '>='
      value: 2
      description: Lighting units at a height of 2m or above.
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 23. Item
  18.
review-status: unverified
field-status: {}
