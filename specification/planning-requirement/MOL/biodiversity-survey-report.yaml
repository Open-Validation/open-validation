reference: biodiversity-survey-report
local-authority: MOL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - hh
        - lbc
        - demolition-con-area
        - ldc
        - prior-approval
    - condition:
        field: protected-species
        value: true
        description: The council's Ecology Checklist has 'yes' answers showing surveys are needed.
  - all:
    - application-type:
        in:
        - full
        - outline
        - hh
        - demolition-con-area
        - ldc
        - prior-approval
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          - national-nature-reserve
          - special-area-of-conservation
          - local-wildlife-site
          description: 'Within or adjacent to a designated site: SAC, SSSI, NNR, SNCI or LNR.'
      - condition:
          field: geodiversity-interest
          value: true
          description: Within or adjacent to a Regionally Important Geodiversity Site (RIGS).
  - all:
    - application-type:
        in:
        - full
        - outline
        - hh
        - lbc
        - demolition-con-area
        - ldc
        - prior-approval
    - site:
        in:
        - special-area-of-conservation
        description: Within 1.5km of the Mole Gap to Reigate Escarpment SAC.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy EN9; NPPF para 187 and Section 15
source-text: 'All types of application where the completion of the Ecology Checklist indicates that surveys
  are required. ... Where, having completed the Ecology Checklist, there are any ‘yes’ answers those relevant
  surveys must be submitted. ... All types of application on a site within or adjacent to designated sites
  will be required to provide a thorough assessment of their impacts on the recognised nature conservation
  interests, having regard to the status of the site, its designated interest features and its sensitivity
  to change. With the exception of: applications / notifications for temporary location of a mobile home
  if outside the designated area, changes of use where there is no operational development, telecommunication
  development outside of the designated area, replacement buildings of the same footprint, advertisements,
  listed building consent applications. ... All types of application on a site within 200m of the Special
  Area of Conservation (SAC) ... All types of application on a site within ... Within 1.5km of the'
must-include:
- item: The surveys the Ecology Checklist shows are needed, and any surveys already carried out
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: The Ecology Checklist has 'yes' answers.
- item: Surveys and reports no older than 12-18 months at submission
  level: should
- item: Copies of pre-application advice from Natural England and/or information setting out the impact
    on the designated site and the mitigation proposed
  level: must
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      - national-nature-reserve
      description: Within or adjacent to a Site of Special Scientific Interest or National Nature Reserve.
- item: A suitable survey assessing the impacts on the recognised nature conservation interests, having
    regard to the site's status, designated interest features and sensitivity to change
  level: must
  required-if:
    any:
    - site:
        in:
        - local-wildlife-site
        - special-area-of-conservation
        description: Within or adjacent to a SAC, SNCI or LNR.
    - condition:
        field: geodiversity-interest
        value: true
        description: Within or adjacent to a RIGS.
- item: A Great Crested Newt survey
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      description: Within 200m of the Mole Gap to Reigate Escarpment SAC.
- item: 'A bat habitat assessment: habitats suitable for foraging and commuting bats from the SAC (such
    as deciduous woodland, mature treelines, species rich pasture or river corridors) must be preserved
    unless surveys show they are not used by bats'
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      description: Within 1.5km of the Mole Gap to Reigate Escarpment SAC.
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 5-7. Combines
  items 3 (Ecological Surveys and Reports), 4 (Impact on Designated Sites) and 5 (Mole Gap to Reigate
  Escarpment SAC). The Ecology Checklist itself is a separate form (not an MHCLG document type). The designated-sites
  part excludes temporary mobile homes, telecommunications outside the designated area, changes of use
  with no operational development, same-footprint replacement buildings, advertisements and listed building
  consent.
review-status: unverified
field-status: {}
