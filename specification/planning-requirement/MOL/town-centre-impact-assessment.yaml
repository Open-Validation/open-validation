reference: town-centre-impact-assessment
local-authority: MOL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - demolition-con-area
      - ldc
      - prior-approval
  - condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 800
      description: New retail or leisure premises of 800 sq m or more.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Outside defined town centres.
source-url: https://www.molevalley.gov.uk/planning-building/submitting-a-planning-application/
policy: Mole Valley Local Plan 2020-2039 Policy EC3; NPPF paragraphs 8, 38, 84, 90 and 94
source-text: All types of application for the ... formation of new retail or leisure premises outside
  of ... premises with a floor area of ... 800sqm or more.
must-include:
- item: A retail impact assessment in line with paragraph 94 of the NPPF, the NPPG Town Centres and Retail,
    and Local Plan Policy EC3
  level: must
confidence: medium
notes: From the council's list (updated 10 July 2026; in force since 10 November 2025), page 18. Item
  12. The town-centre-use-floorspace field stands for the retail or leisure floor area. The sequential
  test (the other half of item 12) has no MHCLG id and is listed as unmapped.
review-status: unverified
field-status: {}
