reference: photos
local-authority: WYR
required-if:
  any:
  - condition:
      field: bng-exemption-claimed
      value: true
      description: The applicant claims an exemption from biodiversity net gain under the de minimis rule.
  - all:
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development is subject to the biodiversity gain condition.
    - application-type:
        in:
        - full
        - outline
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended
  by the Biodiversity Gain Town and Country Planning (Modifications and Amendments) (England) Regulations
  2024); Planning Practice Guidance
source-text: Where the applicant is claiming an exemption based on the de minimis rule, the Council will
  expect evidence to be provided supporting this contention. This must include recent and dated photographic
  evidence of the land in question. ... Photographic evidence, including aerial where appropriate, of
  habitat types and condition across the proposed development site and the off-site location where this
  is applicable.
must-include:
- item: 'De minimis exemption claims: recent and dated photographs of the land in question'
  level: must
  required-if:
    condition:
      field: bng-exemption-claimed
      value: true
      description: A de minimis exemption is claimed.
- item: 'Biodiversity Gain Statement (full and outline): photographs, including aerial where appropriate,
    of habitat types and condition across the site and any off-site location'
  level: must
  required-if:
    all:
    - condition:
        field: biodiversity-gain-condition
        value: true
        description: The development is subject to the biodiversity gain condition.
    - application-type:
        in:
        - full
        - outline
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (WR.6) and Appendix 2, page 18,
  46.
review-status: unverified
field-status: {}
