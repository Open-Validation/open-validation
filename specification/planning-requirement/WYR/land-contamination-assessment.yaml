reference: land-contamination-assessment
local-authority: WYR
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Land subject to or adjacent to previous industrial use.
  - condition:
      field: sensitive-end-use
      value: true
      description: Uses particularly sensitive to contamination, e.g. housing, schools, hospitals, children's
        play areas, public open space, allotments.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policy CDMP1; National Planning Policy Framework
source-text: On a precautionary basis, the possibility of contamination should be assumed when considering
  individual planning applications in relation to all land subject to or adjacent to previous industrial
  use and also where uses are being considered that are particularly sensitive to contamination – e.g.
  housing, schools, hospitals, children’s play areas, public open space, allotments, and highly sensitive
  groundwater used for potable supply, etc. ... For validation purposes, the minimum information that
  will be accepted at the application stage is a Phase I / Desk Study, including a site reconnaissance
  and Preliminary Risk Assessment.
must-include:
- item: As a minimum, a Phase 1 / Desk Study including site reconnaissance and a Preliminary Risk Assessment
  level: must
- item: A commercial environmental search
  level: must
- item: Desk top study (environmental data search / historical map review)
  level: must
- item: Site reconnaissance (photographic evidence of a walk over survey / description)
  level: must
- item: A preliminary risk assessment with an initial conceptual site model; an environmental data search
    alone is not sufficient
  level: must
- item: 'Where the conceptual site model identifies potential pollutant linkages: recommendations for
    further investigation'
  level: must
- item: Carried out by a competent person in accordance with established procedures such as BS 10175 (2011)
  level: must
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.19, page
  29, 31. Sensitive end uses on existing residential or greenfield sites may be exempt from a Phase 1
  report if enough information on former uses and current condition is given (use the council's form);
  not for 10 or more dwellings or sites of 0.5 ha or more, and changes of use to a more sensitive use
  (including barn conversions) are unlikely to qualify.
review-status: unverified
field-status: {}
