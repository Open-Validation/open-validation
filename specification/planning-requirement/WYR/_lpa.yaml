submission-standards:
- item: Plans labelled and at an appropriate metric scale (location plan usually 1:1250 or 1:2500; site
    layout plans usually 1:200 or 1:500; elevations, sections and floor plans usually 1:50 or 1:100)
  level: must
- item: Plans which state that they should not be scaled from will not be accepted
  level: must
- item: Location plan scaled to fit onto A3 or A4 paper when possible
  level: should
- item: Documents with sensitive personal or commercial details clearly marked 'confidential'
  level: must
- item: 'Paper applications: only one paper copy required (electronic submissions need no paper copies)'
  level: should
