reference: heritage-statement
local-authority: WYR
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - conservation-area
      - park-and-garden
      - world-heritage-site
      - locally-listed-building
      description: Potential to affect Scheduled Monuments, Listed Buildings, Conservation Areas, Registered
        Parks and Gardens, World Heritage Sites or locally listed heritage assets.
  - discretionary
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policy CDMP5
source-text: A Heritage Statement is required for any development which has the potential to affect any
  heritage asset.
must-include:
- item: How the development will affect the significance of any heritage assets, including their setting,
    and any harm or loss of significance
  level: must
- item: As a minimum, the relevant historic environment record consulted and the heritage asset(s) assessed
    using appropriate expertise where necessary
  level: should
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.17, page
  28. Local heritage assets identified through the pre-application process or the Historic Environment
  Record show as discretionary. Reference should be made to Policy CDMP5's criteria.
review-status: unverified
field-status: {}
