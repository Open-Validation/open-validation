reference: protected-landscape-assessment
local-authority: WYR
required-if:
  any:
  - site:
      in:
      - area-of-outstanding-natural-beauty
      description: Within the boundary of the Forest of Bowland AONB.
  - discretionary
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policy SP5
source-text: An AONB Statement is required when a development is within the boundary of the AONB or is
  in the vicinity and could pose significant harm to the AONB. The AONB statement should address all issues
  listed under Policy SP5.
must-include:
- item: How the development will protect the character, appearance and setting of the Forest of Bowland
    AONB
  level: must
- item: The need for the development, including any national considerations, and the impact of permitting
    or refusing it on the local economy
  level: should
- item: The cost and scope for developing elsewhere outside the AONB
  level: should
- item: Any detrimental effects on the environment, the landscape and recreational opportunities, and
    the extent to which they could be moderated
  level: should
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.4, page
  15-16. The list calls it an AONB Statement. Development 'in the vicinity' that 'could pose significant
  harm' has no distance, so it shows as discretionary.
review-status: unverified
field-status: {}
