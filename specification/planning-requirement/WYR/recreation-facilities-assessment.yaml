reference: recreation-facilities-assessment
local-authority: WYR
required-if:
  site:
    in:
    - open-space
    description: Affects parks or gardens, amenity greenspace, natural and semi-natural green space, children's
      and young people's play areas, allotments, or outdoor sports facilities including playing pitches.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policies CDMP3, CDMP4 and HP9; National Planning
  Policy Framework
source-text: 'A GIIA is required when a proposal affects any of the below: ... Parks or Gardens. ... Amenity
  Greenspace. ... Natural and semi-natural green space. ... Children and young people''s play areas. ...
  Allotments. ... Outdoor sports facilities including playing pitches'
must-include:
- item: 'Where green infrastructure is lost: the form and function of the land, including whether it is
    surplus to requirements on clear evidence'
  level: should
- item: Whether the loss would be replaced by equivalent or better provision in quantity and quality in
    a suitable location
  level: should
- item: Whether the development is for alternative sports and recreational provision whose benefits clearly
    outweigh the loss
  level: should
- item: 'Where new green infrastructure is proposed in residential development: how it complies with Policy
    HP9 and the council''s guidance, including key design principles and accessible play space'
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: Residential development of 11 or more dwellings (net).
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.16, page
  27-28. The list calls it a Green Infrastructure Impact Assessment (GIIA). It is also needed where development
  would indirectly affect the form and function of green infrastructure.
review-status: unverified
field-status: {}
