reference: affordable-housing-statement
local-authority: WYR
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: 10 or more residential dwellings.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policies HP2 and HP3
source-text: An AHS will be required where the proposal provides for 10 or more residential dwellings.
must-include:
- item: The overall number of proposed residential units; on full applications, the location of the proposed
    dwellings including the affordable units shown by tenure
  level: should
- item: The affordable housing provision as a percentage of the overall number of units
  level: should
- item: The tenure mix of the affordable units (e.g. social, intermediate)
  level: should
- item: The affordable unit types and size
  level: should
- item: The affordable unit space standards
  level: should
- item: Any Registered Providers acting as development partners
  level: should
- item: 'If no on-site affordable housing is offered: a reasoned justification'
  level: must
- item: 'If the reason for no provision, or provision below Policy HP3, is viability: a detailed financial
    appraisal'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing below Policy HP3, or none, on viability grounds.
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.1, page
  13-14.
review-status: unverified
field-status: {}
