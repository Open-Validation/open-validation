reference: coastal-change-assessment
local-authority: WYR
required-if:
  site:
    in:
    - coastal-erosion-zone
    description: Within a Coastal Change Management Area shown on the adopted Policies Map.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policy SP4 part (7)
source-text: A Coastal Change Management Area Statement is required for all development within a Coastal
  Change Management Area, as shown on the adopted Policies Map.
must-include:
- item: That the development accords with the permitted uses in Policy SP4 part (7)
  level: must
- item: That it will be safe from coastal flood and erosion risk over its planned lifetime and will not
    have an unacceptable impact on coastal change
  level: must
- item: That the character of the coast, including designations, is not compromised
  level: must
- item: That the development provides wider sustainability benefits
  level: must
- item: That it does not hinder the creation and maintenance of a continuous signed and managed route
    around the coast
  level: must
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.9, page
  21. The list calls it a Coastal Change Management Area Statement.
review-status: unverified
field-status: {}
