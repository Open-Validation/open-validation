reference: location-plan
local-authority: WYR
required-if:
  always: true
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Every application must include an up-to-date location plan at an appropriate metric scale,
  usually 1:1250 or 1:2500.
must-include:
- item: Up to date, at an appropriate metric scale (usually 1:1250 or 1:2500)
  level: must
- item: Scaled to fit onto A3 or A4 paper when possible
  level: should
- item: A red edge around all of the application site, including all land needed for the development (access
    from a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: A blue edge around any other land in the applicant's ownership
  level: should
- item: The direction of North
  level: should
- item: Sufficient roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 1 (National Requirements), NR.3, page
  7.
review-status: unverified
field-status: {}
