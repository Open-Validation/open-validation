reference: lighting-assessment
local-authority: WYR
required-if:
  all:
  - condition:
      field: external-lighting
      value: true
      description: The development introduces lighting.
  - discretionary
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policy CDMP1
source-text: A lighting assessment will be required where the proposed development involves the introduction
  of lighting near established residential properties, heritage assets, protected wildlife areas and countryside
  areas.
must-include:
- item: Details of all external lights and when they will be used
  level: must
- item: External lighting unit specifications, including design and lux values
  level: should
- item: Operational times / schedule of use
  level: should
- item: Beam orientation
  level: should
- item: Site location plan and site boundaries
  level: should
- item: Meets the Institute of Lighting Professionals' Guidance for the Reduction of Obtrusive Light (GN01:2011)
    and shows how light spillage, glare and nuisance are avoided
  level: should
confidence: medium
notes: 'From the council''s list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.21, page
  32. Discretionary: lighting ''near'' residential properties, heritage assets, protected wildlife areas
  and countryside areas has no distance in the list.'
review-status: unverified
field-status: {}
