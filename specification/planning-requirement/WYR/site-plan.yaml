reference: site-plan
local-authority: WYR
required-if:
  always: true
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The Site Layout Plans (existing and proposed) must be at an appropriate metric scale, usually
  1:200 or 1:500 and it should accurately show;
must-include:
- item: Existing and proposed, at an appropriate metric scale, usually 1:200 or 1:500
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on site,
    with written dimensions including those to the boundaries
  level: should
- item: All buildings, roads, footways and public rights of way that may cross or adjoin the site
  level: should
- item: The position of all trees on or immediately adjoining the site, where affected by the development
  level: should
- item: The extent and type of any hard surfacing, including any parking
  level: should
- item: The location of any new or altered boundary treatments
  level: should
- item: The direction of North
  level: should
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 1 (National Requirements), NR.4, page
  8.
review-status: unverified
field-status: {}
