reference: design-and-access-statement
local-authority: WYR
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Development in a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Provides one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Provides a building(s) creating 100 sq m of floor space or more.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: A Design and Access Statement is a national requirement for the following types of applications;
  ... Any Major Development which is categorised as a development containing either 10 dwellings or more;
  outline sites of 0.5 hectares or larger where the number of dwellings is not known; new building(s)
  with a floor space of 1000sq.m or greater; or development carried out on a site having an area of 1
  hectare or more. ... Listed Building Consent. ... Development in either a Conservation Area or a World
  Heritage Site consisting of either; the provision of one or more dwellinghouses, or the provision of
  a building(s) where the floor space created by the development is 100 sq. m or greater.
must-include:
- item: How design and access considerations have influenced the evolution of the proposed development
  level: should
- item: Any alternative options considered and discounted
  level: should
- item: The key aspects in Article 9 of the DMPO 2015, considering the 10 characteristics of well-designed
    places in the National Design Guide (context, identity, built form, movement, nature, public spaces,
    uses, homes and buildings, resources, lifespan)
  level: should
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 1 (National Requirements), NR.7, page
  9. Not required for section 73 applications, engineering and mining operations or waste development,
  or material change of use.
review-status: unverified
field-status: {}
