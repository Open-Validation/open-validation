reference: design-and-access-statement
local-authority: WYR
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
source-text: 10+ dwellings; outline 0.5ha+; 1,000 sqm+; 1ha+; LBC; CA/WHS 1+ dwellings or 100 sqm+
confidence: medium
notes: 'Audit (wrong_trigger): the workbook''s excerpt was cut off at ''for the following types of applications;''.
  The source-text is the audit''s summary of NR.7, which restates the national thresholds.'
review-status: unverified
field-status: {}
