    - condition:
        field: class-eg-floorspace
        operator: '>'
        value: 2500
        description: Business (E(g)) cumulative gross floor space over 2,500 sq m.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 100
        description: 100 or more residential units.
- item: 'Transport Assessment: existing and predicted trip generation, methods of transport, junction
