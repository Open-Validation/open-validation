reference: transport-assessment
local-authority: WYR
required-if:
  any:
  - any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 1000
        description: New or extended development with cumulative gross floor space over 1,000 sq m (E(a)).
    - all:
      - condition:
          field: use-class
          value: former-d2
          description: Assembly/Leisure (D2).
      - condition:
          field: floorspace
          operator: '>'
          value: 1000
          description: Cumulative gross floor space over 1,000 sq m.
    - condition:
        field: class-eg-floorspace
        operator: '>'
        value: 2500
        description: Business (E(g)) cumulative gross floor space over 2,500 sq m.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 100
        description: 100 or more residential units.
  - discretionary
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policy CDMP6; National Planning Policy Framework
source-text: 'A transport assessment including a travel plan is required when a proposal exceeds any of
  the following thresholds: ... New or Extended Developments with a cumulative gross floor space of 1000
  square metres (E(a) use class) or Assembly/Leisure (D2 use class). ... New or Extended Developments
  with a cumulative gross floor space of 2500 square metres for business (E(g) Use Class). ... A development
  of 100 or more residential units. ... Transport statements are generally smaller documents and can be
  submitted where a formal TA is not required but where the information regarding the impact of the development
  on the highway network or highway safety measures would be material planning consideration.'
must-include:
- item: 'A full Transport Assessment at the thresholds: 1,000 sq m E(a) or D2; 2,500 sq m E(g); 100 or
    more homes'
  level: must
  required-if:
