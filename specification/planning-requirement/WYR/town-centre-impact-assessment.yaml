reference: town-centre-impact-assessment
local-authority: WYR
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: A main town centre use on the edge of or outside a centre.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policy EP5 parts (3) and (5)
source-text: A sequential test is required for any proposal of a main town centre use where the location
  is on the edge or outside of the centre. The subsequent impact assessment is necessary for; ... 500
  square metres of gross new retail floor space. ... 2,500 square metres of gross new leisure floor space.
must-include:
- item: That all sites have been assessed for availability, suitability and viability
  level: must
- item: That all in-centre options have been thoroughly assessed before less central sites
  level: must
- item: That there are no centre / edge of centre sites to accommodate the development
  level: must
- item: 'Edge of centre sites: flexibility on floor space, format, car parking and disaggregation'
  level: should
- item: 'Impact assessment (500 sq m gross new retail or 2,500 sq m gross new leisure floorspace): impact
    on existing, committed and planned investment in centres in the catchment, and on centre vitality
    and viability, including consumer choice and trade, for at least the next 5 years'
  level: must
  required-if:
    any:
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 500
        description: 500 sq m of gross new retail floorspace.
    - all:
      - condition:
          field: use-class
          value: leisure
          description: Leisure development.
      - condition:
          field: floorspace
          operator: '>='
          value: 2500
          description: 2,500 sq m of gross new leisure floorspace.
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.28, page
  37.
review-status: unverified
field-status: {}
