reference: noise-assessment
local-authority: WYR
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Introduces an activity which emits noise.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: To a noise sensitive location such as a residential area.
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Introduces noise sensitive development such as housing to a location with existing
          noise emissions, or residential development close to a railway, the M6 or another busy road.
    - discretionary
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Demonstrably associated with the generation of noise, e.g. heavy industry.
    - discretionary
  - discretionary
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policy CDMP1 part (a)
source-text: 'A noise and vibration impact assessment will be required: ... If the proposal will introduce
  an activity which emits noise to a noise sensitive location such as a residential area, or will introduce
  a noise sensitive development such as housing to a location with existing noise emissions such as an
  industrial / commercial area. ... Where the proposal is demonstrably associated with the generation
  of noise, for example heavy industry. ... Where the proposal could/would result in the generation/transmission
  of vibration. ... Where the proposal is for residential development close to an existing infrastructure
  such as a railway line or the M6, or any other busy road where noise will naturally arise. ... Where
  the proposal is in or adjacent to, a European or nationally designated natural conservation site and
  that by nature of the method of construction or its operation would generate noise and vibration.'
must-include:
- item: That the proposal will not have an unacceptable level of noise or vibration impact on residential
    properties
  level: should
- item: The impact on future occupiers of the site and/or on existing noise sensitive receptors
  level: should
- item: 'New residential housing (including conversions to residential): to BS8233:2014'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential housing.
- item: 'Commercial / industrial noise from equipment, plant, flues/fans or delivery vehicles: to BS4142:2014+A1:2019'
  level: must
  required-if:
    condition:
      field: noise-generating-use
      value: true
      description: Commercial or industrial noise sources.
- item: 'Construction vibration: to BS5228-1:2009+A1:2019 (or BS7385-2:1993 where piling is the only source);
    vibration from operations affecting existing receptors: to BS 6472-1'
  level: must
  required-if: discretionary
- item: Carried out by an appropriately qualified person
  level: must
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.24, page
  33-34. Noisy locations, vibration and noisy works near designated nature sites have no measure, so they
  show as discretionary.
review-status: unverified
field-status: {}
