reference: sustainable-drainage-strategy
local-authority: WYR
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Within Flood Zones 2, 3a or 3b (including change of use and minor development).
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: 'Flood Zone 1: site area of 1 hectare or more.'
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: 'Flood Zone 1: site area of 1 hectare or more.'
  - site:
      in:
      - future-flood-risk
      description: Flood Zone 1 where the Wyre SFRA shows risk of flooding from rivers or sea in the future.
  - site:
      in:
      - critical-drainage-area
      description: Flood Zone 1 with critical drainage problems.
  - all:
    - site:
        in:
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: Land subject to other sources of flooding (surface water, groundwater or reservoirs).
    - any:
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: A change of use to a more vulnerable type of development.
      - condition:
          field: new-build
          value: true
          description: Proposed new development.
  - ref: major-development
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policy CDMP2; National Planning Policy Framework
source-text: In accordance with the National Planning Practice Guidance, a sustainable drainage strategy
  will be required for any development requiring a Flood Risk Assessment (as set out above), or in any
  other case for major category development.
must-include:
- item: How surface water will be managed sustainably, with evidence such as infiltration results and
    drainage calculations, proportionate to the development
  level: must
- item: How the sustainable drainage components will be constructed, managed and maintained for the development's
    lifetime
  level: must
- item: 'Outline drainage strategy: ground conditions (infiltration rates, flow routes); existing and
    proposed surface water drainage with runoff rates and volumes (hydraulic calculations and software);
    flood risks from rivers, coast, surface water and groundwater; SuDS components'
  level: must
  required-if:
    application-type:
      in:
      - outline
      - full
      - reserved-matters
- item: 'Full and reserved matters, in addition: proposed drainage arrangements, outfalls, design storm
    calculations (1 in 1, 1 in 30, 1 in 100 year plus climate change), storage, discharge restriction,
    pollution prevention and off-site works; runoff not exceeding greenfield rate; exceedance routes;
    compliance with the surface water hierarchy; justification where SuDS are not appropriate; multifunctional
    benefits; implementation timetable and phasing; adoption, maintenance and management with access and
    easements; water quality controls'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.32, page
  39-40. Uses MHCLG's retired id for a drainage strategy. Major applications also need a SuDS pro-forma
  (see the council's unmapped items).
review-status: unverified
field-status: {}
