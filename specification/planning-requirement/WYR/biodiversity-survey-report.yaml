reference: biodiversity-survey-report
local-authority: WYR
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Potential to affect notable habitat or species protected by the Habitats Regulations,
        the Wildlife and Countryside Act 1981, the NERC Act 2006 (section 41) or the Protection of Badgers
        Act 1992.
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      - site-of-special-scientific-interest
      - national-nature-reserve
      - local-wildlife-site
      - local-nature-reserve
      description: The development may directly or indirectly affect international, national or locally
        designated sites.
  - site:
      in:
      - priority-habitat
      description: Potential to affect priority habitats.
  - discretionary
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policies SP2, CDMP4 and EP12
source-text: Applicants should include a biodiversity report for all developments that have the potential
  to affect notable habitat or species protected by the Conservation of Habitats and Species (Amendment)
  (EU Exit) Regulations 2019, the Wildlife and Countryside Act 1981 (as amended), the Natural Environment
  and Rural Communities Act 2006 (Section 41) or the Protection of Badgers Act 1992, or any future protective
  legislation including impacts arising from water quality, air quality, light emission and noise generation
  as well as loss or damage to habitats.
must-include:
- item: Desktop information and surveys for protected and priority species and habitats that could be
    affected
  level: must
- item: By an appropriately qualified person, at appropriate times of the year, in suitable weather and
    using recognised techniques; surveys within the 18 months before the validation date
  level: must
- item: An assessment of the possible effects on notable habitats and species recorded in the locality
  level: must
- item: Avoidance and mitigation measures needed to avoid adverse impacts on notable habitats and species
  level: must
- item: 'Where impacts cannot be avoided or mitigated: compensatory provision to offset the harm'
  level: should
- item: Potential impacts on notable geological interests, such as Limestone Pavements
  level: must
- item: A bat survey where the development is likely to disturb an existing roof structure within 100m
    of freshwater or woodland, or involves conversion or disturbance of any kind to an existing barn,
    farmhouse, stable or church
  level: should
  required-if:
    any:
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Conversion or disturbance of an existing barn, farmhouse or stable.
    - discretionary
- item: A great crested newt survey where development is within 250m of a pond or lake (District Level
    Licensing may remove the need)
  level: should
  required-if: discretionary
- item: An otter and water vole survey where the site includes natural watercourses or is within 50m of
    a main river or 25m of a stream bank
  level: should
  required-if: discretionary
- item: 'Where the proposal has implications for Natura 2000 / National Site Network sites: sufficient
    information for the council''s Habitats Regulations Assessment'
  level: must
  required-if:
    site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      description: Could affect a designated European / National Site Network site.
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.5, page
  16-17. 'Potential to affect' protected habitat or species, and the species surveys' distances to water
  and woodland, have no mapped trigger, so they show as discretionary.
review-status: unverified
field-status: {}
