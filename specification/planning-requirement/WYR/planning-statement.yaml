reference: planning-statement
local-authority: WYR
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Planning and Compulsory Purchase Act 2004, section 38(6)
source-text: A planning statement is required for all major applications where relevant to the proposal.
  It is also recommended for developments not in accordance with the development plan and some minor applications
  which may be controversial or to enable the case for development to be put forward.
must-include:
- item: What the proposed development is
  level: should
- item: An appraisal of the development against the national and local planning policies affecting the
    site
  level: should
- item: An overview of the issues raised, referring to all relevant planning considerations
  level: should
- item: A redacted copy for public viewing if the statement includes sensitive information
  level: must
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.26, page
  36. Discretionary because the list says 'where relevant to the proposal'. It is only 'recommended' for
  departures and controversial minor applications.
review-status: unverified
field-status: {}
