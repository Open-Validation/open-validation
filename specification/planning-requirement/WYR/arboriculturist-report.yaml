reference: arboriculturist-report
local-authority: WYR
required-if:
  all:
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The proposal could affect trees within or immediately adjacent to the site.
    - condition:
        field: hedgerows-affected
        value: true
        description: The proposal could affect field or roadside hedgerows within or immediately adjacent
          to the site.
  - any:
    - site:
        in:
        - tree-preservation-zone
        description: Subject to a tree preservation order.
    - site:
        in:
        - conservation-area
        description: Within a conservation area.
    - discretionary
    - ref: major-development
    - condition:
        field: ground-disturbance
        value: true
        description: Within influencing distance of demolition or construction activities.
    - condition:
        field: demolition
        value: true
        description: Within influencing distance of demolition.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policies CDMP3 and CDMP4; Town and Country Planning
  Act 1990 sections 197-198; BS 5837:2012
source-text: An AIA is required where any part of the proposal has the potential to affect any trees or
  hedgerows (field or roadside), both within and immediately adjacent to the proposal site that are; ...
  Subject to a tree preservation order. ... Within a conservation area. ... Perceived to have a significant
  public amenity value. ... A part of a major development. ... Within influencing distance of demolition
  or construction activities.
must-include:
- item: A survey of existing trees and hedgerows
  level: must
- item: A method statement for how the work will be carried out in relation to any trees (including site
    preparation and earthworks)
  level: must
- item: A tree constraints plan
  level: must
- item: A tree protection plan
  level: must
- item: 'Major developments: all retained trees/hedgerows and new or compensatory planting set out in
    a proposed landscaping plan included with the AIA'
  level: must
  required-if:
    ref: major-development
- item: Produced by an appropriately qualified arboriculturalist; works to conform to BS 5837 (2012)
  level: must
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.34, page
  42. Trees of 'significant public amenity value' have no mapped trigger, so that part shows as discretionary.
review-status: unverified
field-status: {}
