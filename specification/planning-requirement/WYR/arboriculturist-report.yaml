reference: arboriculturist-report
local-authority: WYR
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: Trees on or near the site are protected by a TPO.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees (including those in a conservation area or on a major development site) are within
        influencing distance of the development.
  - discretionary
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
source-text: The Arboricultural Implications Assessment (AIA) is a statement that must include a survey
  of existing trees and hedgerows, a method statement indicating how the work will be carried out in relation
  to any trees including site preparation and earth works, a tree constraints plan and a tree protection
  plan.
must-include:
- item: A survey of existing trees and hedgerows
  level: must
- item: A method statement indicating how the work will be carried out in relation to any trees, including
    site preparation and earth works
  level: must
- item: A tree constraints plan
  level: must
- item: A tree protection plan
  level: must
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_trigger):
  from the audit, WR.34 applies to trees under a TPO, in a conservation area, of significant amenity value
  (shown as officer discretion), on major development, or within influencing distance. It can also apply
  to householder schemes.'
