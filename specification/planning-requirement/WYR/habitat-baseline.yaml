reference: habitat-baseline
local-authority: WYR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended
  by the Biodiversity Gain Town and Country Planning (Modifications and Amendments) (England) Regulations
  2024); Planning Practice Guidance
source-text: 'any application for planning permission must be accompanied by the following information
  relating to the biodiversity gain condition: ... vii). a plan showing the location, on the date referred
  to in paragraph (i)(aa) or (bb) (as applicable), of – (aa). the onsite habitat included in the calculations
  referred to in paragraph (i), and (bb). any irreplaceable habitat.'
must-include:
- item: The onsite habitat included in the metric calculations, on the date of application (or earlier
    date), and any irreplaceable habitat
  level: must
- item: 'Full and outline applications: an appropriate, clearly annotated colour plan of the pre-development
    habitat types and condition within the red line boundary'
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
  source-text: An appropriate and clearly annotated colour plan of the pre-development habitat types and
    condition within the red line boundary of the proposal.
confidence: medium
notes: 'From the council''s list (Version 2.1, October 2024), section 1 (NR.9) and Appendix 2, page 11,
  46. Shown with the biodiversity gain condition, as the law sets: householder and other exempt applications
  are exempt. Not required for section 73 applications. If you believe the condition would not apply,
  you must say so and give your reasons; the council treats an unclear exemption claim as invalid.'
review-status: unverified
field-status: {}
