reference: bng-metric
local-authority: WYR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended
  by the Biodiversity Gain Town and Country Planning (Modifications and Amendments) (England) Regulations
  2024); Planning Practice Guidance
source-text: 'any application for planning permission must be accompanied by the following information
  relating to the biodiversity gain condition: ... In relation to the submitted BNG metric, the following
  must be complied with:'
must-include:
- item: Completed biodiversity metric showing the pre-development biodiversity value of the onsite habitat
    on the date of application (or an earlier proposed date), with the values and the publication date
    of the metric
  level: must
- item: If an earlier date is proposed, the reasons for it
  level: must
  required-if: discretionary
- item: 'If activities reducing onsite biodiversity value have been carried out: a statement saying so,
    the date immediately before, and supporting evidence'
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
- item: 'The correct metric: the statutory metric, or the statutory small sites metric; the large-site
    statutory metric where a small site needs an off-site solution'
  level: must
- item: The fully completed metric (baseline, or baseline and post-development), not a summary
  level: must
- item: Submitted as an editable Excel document; PDFs of the metric and summaries are not accepted
  level: must
- item: The latest statutory version of the metric
  level: must
- item: Area module, and linear trees and hedgerows and watercourses modules where relevant, with fully
    completed condition sheets
  level: must
- item: The name of the person completing the metric
  level: must
- item: No errors ('red flags'), other than those caused by not completing the post-development calculation
  level: must
confidence: medium
notes: 'From the council''s list (Version 2.1, October 2024), section 1 (NR.9) and section 2 (WR.6), page
  10, 19. Shown with the biodiversity gain condition, as the law sets: householder and other exempt applications
  are exempt. Not required for section 73 applications. If you believe the condition would not apply,
  you must say so and give your reasons; the council treats an unclear exemption claim as invalid.'
review-status: unverified
field-status: {}
