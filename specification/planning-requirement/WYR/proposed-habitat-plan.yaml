reference: proposed-habitat-plan
local-authority: WYR
required-if:
  all:
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
  - application-type:
      in:
      - full
      - outline
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended
  by the Biodiversity Gain Town and Country Planning (Modifications and Amendments) (England) Regulations
  2024); Planning Practice Guidance
source-text: All outline and full applications subject to the statutory BNG condition must include a Biodiversity
  Gain Statement. ... For on-site habitat creation and/or enhancement, an appropriate annotated plan of
  the proposed habitat types and condition mapped against the layout of the proposed development.
must-include:
- item: 'For on-site habitat creation and/or enhancement: the proposed habitat types and condition mapped
    against the layout of the proposed development'
  level: must
- item: 'For off-site BNG solutions: annotated plans of the pre-intervention and proposed post-intervention
    habitat types and condition within the site boundary'
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: An off-site BNG solution is proposed.
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (WR.6) and Appendix 2, page 18,
  46. Part of the Biodiversity Gain Statement (see the council's unmapped items). For outline applications
  the plan is needed where the information is known.
review-status: unverified
field-status: {}
