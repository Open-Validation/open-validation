reference: air-quality-assessment
local-authority: WYR
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: In, or within 500m of, an existing Air Quality Management Area.
  - condition:
      field: convenience-retail-floorspace
      operator: '>'
      value: 1000
      description: Food retail over 0.2 ha (1,000 sq m gross floor space).
  - condition:
      field: office-floorspace
      operator: '>'
      value: 2500
      description: Office development over 0.8 ha (2,500 sq m gross floor space).
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Housing development over 1.0 ha.
  - condition:
      field: dwelling-count
      operator: '>'
      value: 80
      description: Housing development over 80 units.
  - condition:
      field: traffic-movements-peak-hour
      operator: '>'
      value: 60
      description: An increase of more than 60 vehicle movements per hour.
  - condition:
      field: parking-spaces
      operator: '>'
      value: 300
      description: Significantly increasing car parking provision (more than 300 spaces).
  - condition:
      field: biomass-or-chp
      value: true
      description: Introduction or extension of Biomass, CHP, combustion or industrial installations.
  - condition:
      field: dust-generation
      value: true
      description: Developments likely to result in significant dust emissions.
  - all:
    - condition:
        field: hcv-movements
        value: true
        description: HGV movements.
    - discretionary
  - all:
    - condition:
        field: use-class
        value: intensive-livestock-poultry
        description: Poultry establishments over 400,000 birds (mechanical ventilation), 200,000 (natural
          ventilation) or 100,000 turkeys, with relevant exposure within 100m.
    - discretionary
  - discretionary
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policies SP8 and CDMP1
source-text: 'An AQA will be required for: ... Any Development in, or within 500m of an existing Air Quality
  Management Area ... Food Retail development >0.2HA (1000m2 gross floor space) ... Office Development
  >0.8Ha (2500m2 gross floor space) ... Housing Development >1.0 Ha or >80 units ... Any large scale retail
  / leisure development ... Development likely to lead to an increase of >60 vehicle movements per hour
  ... Development significantly increasing car parking provision (>300 spaces or 25% increase) ... Introduction
  of / extension of existing Biomass / CHP / Combustion / Industrial Installations ... Developments likely
  to result in significant dust emissions ... It should however be noted that the above list is not exhaustive.'
must-include:
- item: The existing air quality in the locality, the air pollution arising from the development, and
    how the impact will be fully mitigated
  level: must
- item: The likely changes in air quality or exposure to air pollution, in relation to health-based air
    quality standards and objectives
  level: must
- item: 'Normally, screening and where appropriate dispersion modelling: existing baseline; future baseline
    without the development; future with the development; significance of the effects; cumulative impact'
  level: should
confidence: medium
notes: 'From the council''s list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.3, page
  14-15. Discretionary parts: large scale retail/leisure; congestion or traffic changes of +/-5% or 10%
  AADT or peak flows, or changes in vehicle speeds; significant changes in traffic composition (HGVs);
  a 25% increase in parking; significant change in air quality or homes in areas of poor air quality;
  poultry units by bird numbers; construction impacts on receptors; and cumulative impacts (the list is
  ''not exhaustive'').'
review-status: unverified
field-status: {}
