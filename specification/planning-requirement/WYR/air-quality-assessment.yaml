  - site:
      in:
      - air-quality-management-area
      description: The site is within 500m of an Air Quality Management Area.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 80
      description: Housing of 80 or more units.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Housing on a site over 1 hectare.
  - condition:
      field: parking-spaces
      operator: '>'
      value: 300
      description: More than 300 extra parking spaces.
