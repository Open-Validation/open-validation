reference: waste-management-plan
local-authority: WYR
required-if:
  condition:
    field: waste-storage-facilities
    value: true
    description: The proposed development will result in the need for waste disposal.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policies SP2 and CDMP3
source-text: A refuse statement is required for any proposed development that will result in the need
  for waste disposal. Additionally for major developments, details of how refuse vehicles will access
  and service the site would be desirable.
must-include:
- item: The volumes and nature of waste the development will create, and how it will be stored, collected
    and removed
  level: must
- item: The type and capacity of refuse bins and recycling containers
  level: should
- item: The position of any bins on site, including any screening
  level: should
- item: Where possible, how refuse vehicles and staff will access and service the site
  level: should
- item: 'Major developments: how refuse vehicles will access and service the site'
  level: should
  required-if:
    ref: major-development
- item: 'Where roads will not be adopted by the highway authority: how waste will be collected from the
    site'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.27, page
  36-37. The list calls it a Refuse and Recycling Statement.
review-status: unverified
field-status: {}
