reference: flood-risk-assessment
local-authority: WYR
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Within Flood Zones 2, 3a or 3b (including change of use and minor development).
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: 'Flood Zone 1: site area of 1 hectare or more.'
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: 'Flood Zone 1: site area of 1 hectare or more.'
  - site:
      in:
      - future-flood-risk
      description: Flood Zone 1 where the Wyre SFRA shows risk of flooding from rivers or sea in the future.
  - site:
      in:
      - critical-drainage-area
      description: Flood Zone 1 with critical drainage problems.
  - all:
    - site:
        in:
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: Land subject to other sources of flooding (surface water, groundwater or reservoirs).
    - any:
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: A change of use to a more vulnerable type of development.
      - condition:
          field: new-build
          value: true
          description: Proposed new development.
source-url: https://www.wyre.gov.uk/downloads/file/2093/wbc-local-validation-checklist-2024-
policy: Wyre Local Plan 2011-2031 (partial update 2022) policy CDMP2; National Planning Policy Framework
  section 14
source-text: 'An FRA is required for all development (including change of use): ... Within Flood Zones
  2, 3a or 3b ... Within Flood Zone 1 where: ... the site area is 1 hectare or more; or ... the most up-to-date
  Wyre Strategic Flood Risk Assessment (SFRA) shows that it will be at risk of flooding from rivers or
  sea in the future (for example because of climate change); or ... the site is less than 1 hectare, including
  a change of use to a more vulnerable type of development (for example commercial to residential), and
  is on land that is subject to other sources of flooding (e.g., surface water (including critical drainage
  areas identified in the SFRA), groundwater or reservoirs.'
must-include:
- item: The extent of flood risk from all sources, taking climate change into account, and whether the
    development will increase flood risk elsewhere
  level: should
- item: Measures to address flood impacts, why and how they are appropriate, how flood risk will be controlled
    and mitigated, and how residual risk is managed
  level: should
- item: Opportunities to reduce the causes and impact of flooding, including sustainable drainage, and
    safe access and escape routes
  level: should
- item: 'The evidence needed to pass the Sequential Test, where required: Flood Zones 2, 3a or 3b, or
    Flood Zone 1 at future risk from rivers or sea or at risk from other sources; not for changes of use
    (other than to caravan, camping, chalet or mobile home sites), householder development or non-residential
    extensions under 250 sq m'
  level: must
  required-if:
    any:
    - site:
        in:
        - flood-risk-zone
        description: Within Flood Zones 2, 3a or 3b (including change of use and minor development).
    - site:
        in:
        - future-flood-risk
        - surface-water-flood-risk
        - groundwater-flood-risk
        - critical-drainage-area
        description: Flood Zone 1 at future risk from rivers or sea, or at risk from other sources.
- item: The evidence to address the Exception Test, if the Sequential Test is passed, for 'highly vulnerable'
    development in Flood Zone 2, 'more vulnerable' in Flood Zone 3a, or 'essential infrastructure' in
    Flood Zone 3a or 3b
  level: must
  required-if: discretionary
- item: 'Follows the NPPG ''site specific flood risk assessment: checklist'' and government guidance'
  level: should
confidence: medium
notes: From the council's list (Version 2.1, October 2024), section 2 (Wyre Requirements), WR.15, page
  24, 26. The Exception Test item shows as discretionary because flood vulnerability classes are not modelled.
  The council's Flood Risk Sequential Test guidance (v1.2) explains how the test is applied in Wyre.
review-status: unverified
field-status: {}
