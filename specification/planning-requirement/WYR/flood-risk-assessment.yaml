  Strategic Flood Risk Assessment (SFRA) shows that it will be at risk of flooding from rivers or sea
  in the future (for example because of climate change); or the site is less than 1 hectare, including
  a change of use to a more vulnerable type of development (for example commercial to residential), and
  is on lan…'
