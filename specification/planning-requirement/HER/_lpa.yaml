validation-list:
  url: https://www.hertsmere.gov.uk/planning-building-control/planning-applications/apply-for-planning-permission
  date: ''
  date-basis: 'Hertsmere has no local validation list, so there is no list date. Checked 2026-11-06: the
    ''Apply for planning permission'' page says the requirements ''are set out in the National Validation
    Requirements'' and lists only the fee, form, ownership certificate, scaled PDF plans, the CIL form
    and (in the Shenley Neighbourhood Plan area) a checklist that ''will form part of our local validation
    requirements in due course''; the hedgerow removal page says ''we are working on a Local List, please
    submit your application in accordance with national requirements''. The old Householder Local List
    PDF (October 2016, PDF metadata) is still on the server and is what planning.data.gov.uk entity 20297
    points to (with no web page), but no council page links it. No other list was found in the site map
    of 158 planning pages or by web search'
  status: national-only
submission-standards:
- item: Plans to a recognised metric scale, including a scale bar, and in PDF format
  level: must
- item: 'Paper applications: only one paper copy required'
  level: must
- item: Financial Viability Assessments are published in full; any proposed redactions are set out at
    submission and considered by the council within 10 working days
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: false
  issues-open: 0
  notes: 'Grokbot''s link works but leads to an undated, legacy householder-only checklist that the current
    planning pages do not link, and no current comprehensive local list was found. Several householder
    triggers are garbled or wrong (e.g. landscaping, heritage), and items such as site sections/levels
    and the Shenley Neighbourhood Plan checklist were missed. Fixed 2026-11-05: every file was rewritten
    from the council''s latest list.'
