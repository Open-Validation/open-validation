reference: cil-form
local-authority: HER
required-if: discretionary
source-url: https://www.hertsmere.gov.uk/planning-building-control/planning-applications/apply-for-planning-permission
policy: Community Infrastructure Levy Regulations 2010; Hertsmere CIL Charging Schedule
source-text: Completed Community Infrastructure Levy Additional Information form (where necessary)
must-include:
- item: Floor plans showing how the floorspace has been calculated, existing (where appropriate) and proposed;
    where an existing building is to be demolished (or partly retained), its floor plans
  level: should
  required-if:
    condition:
      field: cil-liable
      value: true
      description: The development is liable for CIL.
  source-text: If your application is CIL liable, please provide floor plans showing how the floorspace
    has been calculated, as this will help us process your application more efficiently. This should include
    existing (where appropriate) and proposed plans. If an existing building is to be demolished (or partly
    retained) please provide the floor plans so we can include existing floorspace in the CIL calculation.
confidence: medium
notes: 'Hertsmere publishes no local validation list (checked 2026-11-06): its ''Apply for planning permission''
  page says the requirements ''are set out in the National Validation Requirements'', and its hedgerow
  page says ''we are working on a Local List, please submit your application in accordance with national
  requirements''. From the ''Apply for planning permission'' page (undated) and the ''CIL Procedures and
  Forms'' page (https://www.hertsmere.gov.uk/planning-building-control/infrastructure-and-delivery/cil-procedures-forms),
  which says: ''In order for the council to identify whether your development is liable for CIL, you must
  send us an Additional Information form (Form 1).'' Neither page gives a threshold, and the application
  page says ''where necessary'', so the trigger shows as discretionary. Hertsmere charges CIL.'
