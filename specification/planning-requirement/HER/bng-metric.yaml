reference: bng-metric
local-authority: HER
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.hertsmere.gov.uk/planning-building-control/planning-advice/biodiversity-net-gain
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: Where an applicant believes the development would be subject to the biodiversity gain condition,
  the application must be accompanied by minimum information set out in Article 7 of The Town and Country
  Planning (Development Management Procedure) (England) Order 2015
must-include:
- item: The completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat on the date of application (or proposed earlier date), including the publication date of the
    biodiversity metric used
  level: must
- item: 'Where activities have reduced onsite biodiversity value (''degradation''): the date immediately
    before they were carried out, the pre-development value on that date, the completed metric calculation
    tool and any available supporting evidence'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Activities before the application date reduced onsite biodiversity value.
confidence: medium
notes: 'Hertsmere publishes no local validation list (checked 2026-11-06): its ''Apply for planning permission''
  page says the requirements ''are set out in the National Validation Requirements'', and its hedgerow
  page says ''we are working on a Local List, please submit your application in accordance with national
  requirements''. From the council''s ''Biodiversity Net Gain'' page (undated), section ''National Validation
  Requirements'', which repeats the national rule (DMPO article 7). The page lists the exemptions (householder
  applications, variations of permission, developments below the threshold, self-build and others), so
  the file follows the law: it applies only where the biodiversity gain condition applies.'
