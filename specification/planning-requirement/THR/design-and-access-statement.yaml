reference: design-and-access-statement
local-authority: THR
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a Conservation Area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 square metres or more of floorspace.
source-url: https://www.thurrock.gov.uk/make-planning-application/information-to-be-submitted-with-all-planning-applications
source-text: 'You may also need to provide a design and access statement, unless your application: • relates
  to a material change in use of land or buildings • relates to engineering or mining operations • is
  a householder development where no part of the property is within a site of special scientific interest
  or a conservation area'
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Information to be submitted with
  all planning applications'. The page says you 'may also need' one and links the national Planning Practice
  Guidance on validation requirements, so the national triggers (article 9 of the Development Management
  Procedure Order 2015) are shown.
review-status: unverified
field-status: {}
