reference: section-existing
local-authority: THR
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The application involves a change in ground levels, or development is proposed next
        to ground levels that are changing.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: You will only need to provide this with applications that involve a change in ground levels
  or where the development is proposed next to ground levels that are changing. ... Sections may be needed
  for roof alterations or when a new storey is added. They may also be needed when there are topographic
  differences either within the site or between the site and the surrounding area.
must-include:
- item: Drawn at a scale of 1:50 or 1:100
  level: must
- item: On sloping sites, how the proposals relate to current ground levels where ground levels may be
    modified
  level: must
- item: Where a proposal involves a change in ground levels, both existing and finished levels
  level: must
- item: Floor levels, building height and relationship to site boundaries
  level: must
- item: How proposed buildings relate to existing site levels and neighbouring development
  level: must
- item: Existing site levels and finished floor levels, related to a fixed datum point off site and in
    relation to adjoining buildings
  level: must
- item: 'Householder: a small plan key showing the position and direction of the section cut'
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: 'Householder: a section through all key features in the proposal (for example new stairs or an
    altered roof)'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Householder: where ground level changes are proposed, how the site will change in relation to
    the existing topography, road, public footpaths and other access arrangements'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Detailed information for specific
  application types'; 'Existing and proposed site sections and finished floor and site levels'. The householder
  items come from the Householder planning applications guide ('elevations and sections', https://www.thurrock.gov.uk/householder-planning-applications/plans-and-drawings-%E2%80%93-elevations-and-sections),
  which says sections 'may be needed' for roof alterations, a new storey or differences in levels, so
  that part is discretionary.
review-status: unverified
field-status: {}
