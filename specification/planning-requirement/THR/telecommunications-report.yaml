reference: telecommunications-report
local-authority: THR
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - condition:
      field: telecommunications-development
      value: true
      description: An application for approval of telecommunications development.
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: You will only need to provide specialist telecommunications information with applications
  for approval of telecommunications developments.
must-include:
- item: The proposal
  level: must
- item: The area of search
  level: must
- item: Details of any consultation undertaken
  level: must
- item: Details of the proposed structure
  level: must
- item: Technical justification
  level: must
- item: A signed declaration that the equipment and installation fully comply with the ICNIRP radio frequency
    public exposure guidelines
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Detailed information for specific
  application types'; 'Telecommunications development'.
review-status: unverified
field-status: {}
