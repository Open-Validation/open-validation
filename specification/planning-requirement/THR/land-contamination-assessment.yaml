reference: land-contamination-assessment
local-authority: THR
required-if:
  any:
  - ref: major-development
  - condition:
      field: eia-development
      value: true
      description: The application requires an environmental impact assessment.
  - site:
      in:
      - contaminated-land
      description: The site is known to have potential contamination issues.
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: You will only need to provide this with major applications – especially on brownfield sites
