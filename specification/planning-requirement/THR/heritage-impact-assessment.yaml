reference: heritage-impact-assessment
local-authority: THR
required-if:
  all:
  - application-type:
      in:
      - hh
  - site:
      in:
      - listed-building
      description: A householder application for a listed building.
source-url: https://www.thurrock.gov.uk/householder-planning-applications/other-documentation
source-text: Any householder application for a listed building will be incomplete unless you submit a
  Heritage Impact Assessment.
must-include:
- item: A description of all features of architectural, historic, or social merit
  level: should
- item: A discussion of how the proposal will affect those features
  level: should
- item: All measures taken to mitigate against any impact
  level: should
confidence: medium
notes: 'From the council''s list (web pages, last updated 22 May 2026), ''Householder planning applications
  guide: Other documentation''. The guide says the assessment is ''often divided into'' these three parts
  and that the Historic England listing alone is not enough.'
review-status: unverified
field-status: {}
