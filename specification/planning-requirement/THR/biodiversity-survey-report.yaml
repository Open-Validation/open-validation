reference: biodiversity-survey-report
local-authority: THR
required-if: discretionary
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: You will only need to provide this with applications where the type and location of development
  are such that the impact on biodiversity may be significant and existing information is lacking or inadequate.
  ... If you intend to build a shed on a far corner of the garden that has been left to grow wild for
  many years, however, protected species may have moved in and an investigative ecological survey should
  be completed by a qualified person.
must-include:
- item: An assessment of the impact of the proposed development on wildlife
  level: should
- item: Proposals for mitigation or compensation measures, including the protection of habitats and provision
    of new habitats
  level: should
- item: An assessment of existing structures or potential natural habitats where they are to be removed
    or affected by the proposals
  level: must
- item: Householder ecological survey completed by a qualified person
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: 'From the council''s list (web pages, last updated 22 May 2026), ''Detailed information for specific
  application types''; ''Biodiversity survey and report''. Discretionary: needed where the impact on biodiversity
  ''may be significant'' and existing information is lacking; the council''s biodiversity checklist (see
  the unmapped list) shows whether a report is needed. The Householder planning applications guide (''Other
  documentation'', https://www.thurrock.gov.uk/householder-planning-applications/other-documentation)
  adds an investigative ecological survey for building on a long-wild part of a garden.'
review-status: unverified
field-status: {}
