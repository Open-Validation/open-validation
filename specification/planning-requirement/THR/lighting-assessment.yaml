reference: lighting-assessment
local-authority: THR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: external-lighting
      value: true
      description: You propose to incorporate external lighting.
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: You will only need to provide this with applications – except for householder developments
  – where you propose to incorporate external lighting.
must-include:
- item: A layout plan showing how beams of light will be orientated
  level: must
- item: The proposed equipment design
  level: must
- item: Light spillage beyond the property boundary
  level: must
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Detailed information for specific
  application types'; 'Lighting assessment'. 'Except for householder developments' is shown as full, outline
  and reserved matters applications.
review-status: unverified
field-status: {}
