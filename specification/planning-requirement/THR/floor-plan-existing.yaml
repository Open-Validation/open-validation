reference: floor-plan-existing
local-authority: THR
required-if:
  all:
  - application-type:
      in:
      - hh
  - condition:
      field: building-works
      value: true
      description: The proposal replaces or alters a building and would change the floor plan.
source-url: https://www.thurrock.gov.uk/householder-planning-applications/plans-and-drawings-%E2%80%93-floors
source-text: Existing and proposed floor plans are both needed for replacement or altered buildings unless
  the proposed development would not change the floor plan – for example, re-roofing or replacement windows.
must-include:
- item: Scale (usually 1:100 or 1:50) shown clearly, both in text and as a scale bar
  level: must
- item: Each page has a unique plan number
  level: must
- item: A north arrow if the floor plan has been rotated from its true orientation
  level: must
- item: Any new storey, or existing storeys affected by the proposal, shown clearly and named ("ground
    floor", "first floor" and so on)
  level: must
- item: The walls and closest windows of affected neighbouring properties on the ground floor plan, where
    the proposal is on a row of terraced or semi-detached houses or on or very near a boundary
  level: must
  required-if: discretionary
- item: Finished floor levels, usually relative to a fixed reference point
  level: must
- item: The total area of an extension, outbuilding or any additional floors
  level: should
confidence: medium
notes: 'From the council''s list (web pages, last updated 22 May 2026), ''Householder planning applications
  guide: Plans and drawings - floors''. The council''s list gives floor plans only in its householder
  guide. The neighbouring-walls item depends on the property being terraced, semi-detached or ''very near''
  a boundary, so it is shown as discretionary.'
review-status: unverified
field-status: {}
