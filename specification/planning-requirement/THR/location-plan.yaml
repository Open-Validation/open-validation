reference: location-plan
local-authority: THR
required-if:
  always: true
source-url: https://www.thurrock.gov.uk/make-planning-application/information-to-be-submitted-with-all-planning-applications
source-text: For your planning application to be valid you must send us the following items as a minimum.
  ... This shows the site area and its surrounding context, and can be bought either as part of the application
  process or separately.
must-include:
- item: Usually drawn at 1:1250 for urban sites, or 1:2500 for rural sites
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: Scale bar printed clearly on the plan
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: At least two cross streets visible and labelled
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: The site (house and garden) edged in red
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Any other land owned by the applicants edged in blue
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: An arrow pointing north
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Information to be submitted with
  all planning applications'. The drawing contents come from the Householder planning applications guide
  ('Plans and drawings - site location', https://www.thurrock.gov.uk/householder-planning-applications/plans-and-drawings-%E2%80%93-site-location),
  so they are shown for householder applications.
review-status: unverified
field-status: {}
