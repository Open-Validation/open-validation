reference: arboriculturist-report
local-authority: THR
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: Trees protected by a tree preservation order, on or adjoining the site, may be affected.
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on or adjoining the site may be affected.
  - discretionary
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: 'An arboriculture statement is needed for applications where: preserved trees, either on
  or adjoining the site, may be affected by your proposal where it is proposed that a number of trees
  on site shall be removed Preserved trees are those that are either: the subject of a tree preservation
  order within a conservation area Your arboriculture statement should include: a tree survey a tree protection
  plan an arboriculture method statement, if development takes place within a root protection area'
must-include:
- item: A tree survey
  level: must
- item: A tree protection plan
  level: must
- item: An arboriculture method statement, if development takes place within a root protection area
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): this is for development proposals (Full, Householder, Outline), not applications
  for works to trees. "Where a number of trees on site shall be removed" has no field and is shown as
  officer discretion.'
review-status: unverified
field-status: {}
