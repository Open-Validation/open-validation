reference: arboriculturist-report
local-authority: THR
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees within or adjacent to the development site that could influence or
        be affected by the proposals.
  - condition:
      field: tree-removal
      value: true
      description: A number of trees on site are to be removed.
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: 'You will only need to provide this where there are trees within – or adjacent to – the development
  site that could influence or be affected by your proposals. ... An arboriculture statement is needed
  for applications where: • preserved trees, either on or adjoining the site, may be affected by your
  proposal • where it is proposed that a number of trees on site shall be removed ... You will need to
  submit a tree survey and impact assessment with your application if: • there are any protected trees
  within falling distance of your proposal • you are building within the root protection area of a protected
  tree'
must-include:
- item: A tree survey
  level: must
- item: 'Arboriculture statement: a tree protection plan'
  level: should
  required-if:
    any:
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Preserved trees (subject to a TPO or within a conservation area) on or adjoining
          the site may be affected.
    - condition:
        field: tree-removal
        value: true
        description: A number of trees on site are to be removed.
- item: An arboriculture method statement, if development takes place within a root protection area
  level: should
  required-if: discretionary
- item: 'Householder: an impact assessment, where there are protected trees within falling distance of
    the proposal or building within the root protection area of a protected tree'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: Preserved trees (subject to a TPO or within a conservation area) on or adjoining
          the site may be affected.
    - discretionary
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Detailed information for specific
  application types'; 'Tree survey'. The householder items come from the Householder planning applications
  guide ('Other documentation', https://www.thurrock.gov.uk/householder-planning-applications/other-documentation).
  Root protection areas and falling distance have no mapped field, so those items are discretionary.
review-status: unverified
field-status: {}
