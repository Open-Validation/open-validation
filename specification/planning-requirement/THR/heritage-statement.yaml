reference: heritage-statement
local-authority: THR
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - locally-listed-building
      description: The development is likely to affect a designated or non-designated heritage asset.
  - discretionary
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: You will only need to provide this with applications for listed building consent, or conservation
  area consent, or developments likely to affect designated or non-designated heritage assets.
must-include:
- item: A description of the asset
  level: must
- item: An evaluation of the importance and significance of the asset
  level: must
- item: How the proposal will affect the asset
  level: must
- item: Supporting photographs, phasing plans, historic photographs or drawings, historic maps and other
    sources, where relevant
  level: should
  required-if: discretionary
- item: Amount of information proportionate to the significance of the asset and the scale of works proposed
  level: should
confidence: medium
notes: 'From the council''s list (web pages, last updated 22 May 2026), ''Detailed information for specific
  application types''; ''Heritage statement''. Partly discretionary: non-designated heritage assets other
  than locally listed buildings have no mapped designation. ''Conservation area consent'' is shown as
  demolition in a conservation area.'
review-status: unverified
field-status: {}
