reference: site-plan
local-authority: THR
required-if:
  always: true
source-url: https://www.thurrock.gov.uk/make-planning-application/information-to-be-submitted-with-all-planning-applications
source-text: 'Site plan, sometimes called a block plan This shows the proposed development in detail and
  can be purchased from Planning Portal: buy a planning map.'
must-include:
- item: Existing trees
  level: must
  source-text: Existing trees must be shown on the site plan and drawings submitted with all applications.
- item: Existing and proposed parking, cycle storage and access arrangements for vehicles and pedestrians
  level: must
  required-if:
    condition:
      field: parking-change
      value: true
      description: The application is likely to result in a loss or gain of parking provision.
  source-text: 'Your site plan must show existing and proposed: • parking • cycle storage • access arrangements
    for vehicles and pedestrians'
- item: Existing and proposed site layout plans
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Usually drawn at a scale not less than 1:500
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: Scale bar printed clearly
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: An arrow pointing north
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Any easements, rights of way and covenant areas
  level: should
  required-if:
    application-type:
      in:
      - hh
- item: All buildings, roads and footpaths on land within or adjoining the site
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: All boundary structures
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: The extent and type of any hard surfacing, such as parking
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: The position of all trees
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Clear annotations explaining all features shown
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Grade levels on both the existing and proposed layout plans
  level: should
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: change-in-ground-levels
        value: true
        description: The development would affect ground levels.
- item: 'Householder parking: existing and proposed dropped kerbs, vehicle crossovers and car parking
    spaces, at a stated scale (commonly 1:500 or 1:200) with a scale bar and north point (may be combined
    with the site layout plans)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: parking-change
          value: true
          description: A change is proposed to existing parking.
      - discretionary
  source-text: Existing and proposed parking plans are needed where a change is proposed to existing parking,
    such as spaces being added or built over, or where additional bedrooms are proposed.
- item: 'Householder parking: the location and heights of any boundary treatments to the front or side
    of the house, as existing and as proposed, if they are to be altered'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: new-boundary-treatment
        value: true
        description: Front or side boundary treatments are to be altered.
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Information to be submitted with
  all planning applications'. Trees and the parking/access item come from the 'Detailed information for
  specific application types' page (Tree survey; Parking and access arrangements). The householder items
  come from the Householder planning applications guide ('site layout', https://www.thurrock.gov.uk/householder-planning-applications/plans-and-drawings-%E2%80%93-site-layout;
  'parking', https://www.thurrock.gov.uk/householder-planning-applications/plans-and-drawings-%E2%80%93-parking).
  Householder parking plans are also needed 'where additional bedrooms are proposed', which has no mapped
  field, so that part is discretionary.
review-status: unverified
field-status: {}
