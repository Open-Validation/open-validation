reference: elevation-proposed
local-authority: THR
required-if:
  all:
  - application-type:
      in:
      - hh
  - condition:
      field: external-alterations
      value: true
      description: The development would affect or change the elevations.
source-url: https://www.thurrock.gov.uk/householder-planning-applications/plans-and-drawings-%E2%80%93-elevations-and-sections
source-text: Drawings of existing and proposed elevations are needed unless the development would not
  affect or change them – for example, the creation of a parking space.
must-include:
- item: Scale (usually 1:100 or 1:50) shown clearly, both in text and as a scale bar
  level: must
- item: Each page has a unique plan number
  level: must
- item: Every side that is changed, or from which the change may be seen
  level: must
- item: Elevations that are not changing labelled "existing no change"
  level: should
- item: Each drawing clearly labelled with the direction it faces (for example 'N' or 'SE' elevation)
  level: must
- item: Details of finishes and materials (on the elevations or a separate annotated drawing), matching
    the application form
  level: should
- item: The windows on the affected elevations of the neighbouring property, where the change is on a
    row of terraced or semi-detached houses or on or very near a boundary
  level: should
  required-if: discretionary
- item: The level of each floor and the ridge height
  level: must
  required-if:
    condition:
      field: upper-floor-extension
      value: true
      description: Additional floors are proposed.
confidence: medium
notes: 'From the council''s list (web pages, last updated 22 May 2026), ''Householder planning applications
  guide: Plans and drawings - elevations and sections''. The council''s list gives elevations only in
  its householder guide.'
review-status: unverified
field-status: {}
