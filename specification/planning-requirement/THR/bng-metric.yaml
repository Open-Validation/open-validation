reference: bng-metric
local-authority: THR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.thurrock.gov.uk/make-planning-application/biodiversity-net-gain
source-text: 'Unless covered within GOV.UK: BNG exempt developments, BNG requirements are mandatory for
  new planning applications: ... This metric must be completed by an ecologist. ... All areas must be
  measured and included in the metric, including woods, meadows, bare ground, arable farmland, hardstanding,
  lawns, flowerbeds, and so on.'
must-include:
- item: Completed by an ecologist, using the statutory biodiversity metric
  level: must
- item: All areas of the site measured and included in the metric (woods, meadows, bare ground, arable
    farmland, hardstanding, lawns, flowerbeds and so on)
  level: must
- item: No irreplaceable habitats included in the BNG process
  level: must
confidence: medium
notes: 'From the council''s list (web pages), ''Biodiversity net gain'' page (last updated 14 February
  2024). BNG is mandatory unless the development is exempt, so this follows the law: householder and other
  exempt applications don''t need it. Irreplaceable habitats in Thurrock currently include ancient woodland,
  Spartina saltmarsh swards and Mediterranean saltmarsh scrub.'
review-status: unverified
field-status: {}
