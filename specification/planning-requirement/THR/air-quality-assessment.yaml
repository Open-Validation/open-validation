reference: air-quality-assessment
local-authority: THR
required-if:
  all:
  - site:
      in:
      - air-quality-management-area
      description: Within the Air Quality Management Area.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more residential units.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: 500 square metres of non-residential floor space.
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: You will only need to provide this with applications for developments of 10 or more residential
  units, or 500 square metres of non-residential floor space within the Air Quality Management Area.
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Detailed information for specific
  application types'; 'Air quality impact assessment'. Read as both thresholds applying within the Air
  Quality Management Area.
review-status: unverified
field-status: {}
