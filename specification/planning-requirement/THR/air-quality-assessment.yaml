reference: air-quality-assessment
local-authority: THR
required-if:
  all:
  - site:
      in:
      - air-quality-management-area
      description: The site is within the Air Quality Management Area.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: The proposal creates 10 or more homes.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: The proposal creates 500 square metres or more of non-residential space.
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: Air quality impact assessment - 10+ homes, or 500 sq m+ non-residential space, within the
  Air Quality Management Area
confidence: medium
notes: 'Audit (missing_requirement): quoted from the ''Overview of information for specific application
  types'' page.'
review-status: unverified
field-status: {}
