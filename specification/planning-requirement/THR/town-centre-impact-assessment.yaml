reference: town-centre-impact-assessment
local-authority: THR
required-if:
  any:
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Retail or leisure development over 2,500 square metres.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail or leisure development not in a central location and not in accordance with
        the development plan.
  - discretionary
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: Retail or leisure impact assessment You will only need to provide this with applications
