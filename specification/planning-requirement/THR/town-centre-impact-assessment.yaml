reference: town-centre-impact-assessment
local-authority: THR
required-if:
  any:
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 2500
      description: Retail or leisure developments over 2,500 square metres.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Not in a central location.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with a development plan.
  - discretionary
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: You will only need to provide this with applications for retail or leisure developments over
  2,500 square metres, or likely to have a significant impact on smaller centres, or when they are not
  in a central location, nor in accordance with a development plan.
must-include:
- item: Impacts on existing, committed and planned public and private investment in centres in the catchment
    area
  level: should
- item: Impacts on town centre vitality and viability, including consumer choice
  level: should
- item: Impacts on allocated sites outside town centres being developed in accordance with the development
    plan
  level: should
- item: Impacts on trade and turnover, both in centres and the wider area
  level: should
- item: If in or on the edge of a town centre, how the development is of appropriate scale
  level: should
- item: Any locally important impacts on centres
  level: should
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Detailed information for specific
  application types'; 'Retail or leisure impact assessment'. The 2,500 sq m threshold covers retail and
  leisure floorspace. Schemes 'likely to have a significant impact on smaller centres' are a judgement,
  so that part is discretionary.
review-status: unverified
field-status: {}
