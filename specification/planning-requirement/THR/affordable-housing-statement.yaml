reference: affordable-housing-statement
local-authority: THR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: New residential development with capacity for 10 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: The total development area is 0.5 hectares or larger.
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
policy: Thurrock Core Strategy (affordable housing requirements)
source-text: You will only need to provide this with applications for new residential development where
  there is capacity for 10 or more dwellings, or the total development area is 0.5 hectares or larger.
must-include:
- item: How you propose to meet the affordable housing requirements of the Core Strategy
  level: must
- item: The number and size of residential units
  level: must
- item: The mix of units (tenure)
  level: must
- item: Plans showing the location of units
  level: must
- item: A detailed explanation of the financial contribution
  level: must
  required-if: discretionary
  source-text: a detailed explanation of the financial contribution, when requested
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Detailed information for specific
  application types'; 'Affordable housing statement / viability statement'. The list names it 'Affordable
  housing statement / viability statement'; it asks for no separate viability assessment.
review-status: unverified
field-status: {}
