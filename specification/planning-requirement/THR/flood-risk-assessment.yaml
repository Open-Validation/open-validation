reference: flood-risk-assessment
local-authority: THR
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All new developments within flood zones 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site is more than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site is more than 1 hectare in flood zone 1.
source-url: https://www.thurrock.gov.uk/make-planning-application/detailed-information-for-specific-application-types
source-text: You will only need to provide this with applications for developments on sites of more than
  1 hectare in flood zone 1, and all new developments within flood zones 2 or 3. ... You must to submit
  a flood risk assessment with your proposal if your property is within flood zones 2 or 3.
must-include:
- item: The risks of all forms of flooding to and from the development
  level: should
- item: How flood risks will be managed
  level: should
- item: Opportunities to reduce the probability and consequences of flooding
  level: should
- item: The need for safe access to and from the development in the event of flooding
  level: should
- item: The design of surface water management systems, including sustainable drainage
  level: should
- item: Account taken of climate change
  level: should
confidence: medium
notes: From the council's list (web pages, last updated 22 May 2026), 'Detailed information for specific
  application types'; 'Flood risk assessment'. The Householder planning applications guide ('Other documentation')
  says the same for householder proposals in flood zones 2 or 3.
review-status: unverified
field-status: {}
