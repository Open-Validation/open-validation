reference: design-and-access-statement
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a designated area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Creating one or more dwellings.
        - condition:
            field: floorspace-non-residential
            operator: '>='
            value: 100
            description: Creating 100 sq m or more of non-residential floorspace.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9;
  Newham Local Plan (2018) SP1-SP9
source-text: All major development (except a material change of use, waste development, engineering or
  mining operations) Applications in a designated area that create one or more dwellings or 100 sq. m+
  of non-residential floor-space
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the context and how the design takes it into account (including agent
    of change, Policies SP8 and J2)
  level: must
- item: The approach to access and how relevant policies (SP2, SP3, INF2, SP8), access constraints and
    consultation on access have been taken into account
  level: must
- item: 'Access covering interior design and management and the Equality Act 2010: approaches, parking
    and servicing, entrances, circulation, surface materials, facilities, wayfinding and means of escape,
    where relevant'
  level: must
- item: Photographs and montages
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
confidence: medium
notes: From the council's list (published December 2024), page 5 and 9-10. 'Designated area' is read as
  a conservation area or World Heritage Site. Photographs and montages are expected for major development
  or where the appearance of an area changes significantly (a judgement). The PAR doesn't name application
  types for this document, so it is applied to planning applications (householder, full, outline, reserved
  matters, change of use and s73).
review-status: unverified
field-status: {}
