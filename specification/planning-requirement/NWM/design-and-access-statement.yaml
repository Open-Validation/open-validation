reference: design-and-access-statement
local-authority: NWM
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The scheme is in a designated area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The scheme creates a dwelling.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 100
          description: The scheme creates 100 square metres or more of non-residential floorspace.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: All major development (except a material change of use, waste development, engineering or
  mining operations)
confidence: medium
notes: 'Audit (wrong_trigger, amended): the ''applies to'' thresholds were missing. Major development
  excludes material change of use, waste development, engineering or mining operations. The PAR also says
  "it is considered necessary in relation to Development Plan requirements irrespective of scheme size;
  the length and detail of a DAS can be tailored accordingly."'
review-status: unverified
field-status: {}
