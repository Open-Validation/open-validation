reference: elevation-proposed
local-authority: NWM
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - s73
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: Elevations (1:50/100 unless otherwise agreed) All existing and proposed elevations, showing
  all windows/doors.
must-include:
- item: At 1:50 or 1:100 (unless otherwise agreed), showing all windows and doors
  level: must
- item: Details of materials and finishes for all proposed elevations (not needed for major development,
    where materials are often approved later)
  level: must
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the position of openings on each property'
  level: should
confidence: medium
notes: From the council's list (published December 2024), page 4. The PAR doesn't name application types
  for this document, so it is applied to planning applications (householder, full, outline, reserved matters,
  change of use and s73).
review-status: unverified
field-status: {}
