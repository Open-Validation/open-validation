reference: affordable-housing-statement
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: A site with the capacity for 10 or more residential units.
    - condition:
        field: educational-accommodation
        value: true
        description: A student housing proposal.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) H1, H2; London Plan (2021) H4-H7
source-text: Applications for housing on sites with the capacity for 10 or more residential units (includes
  FUL/OUT/COU/REM applications); and All student housing proposals
must-include:
- item: The proportion of market (private rented and market sale) and affordable housing
  level: must
- item: The mix of unit sizes (habitable rooms and/or bedrooms for each unit)
  level: must
- item: The tenure mix of the affordable housing
  level: must
- item: Any Registered Social Landlords acting as partners
  level: must
- item: Availability of any subsidy for the affordable housing
  level: must
- item: 'Where off-site provision is proposed: why on-site provision is inappropriate (Policy H2.1d)'
  level: must
- item: Confirmation that Private Rented Sector units don't replace the need for family and affordable
    housing on site
  level: must
- item: Assessment on a unit basis (Policy H2), not per habitable room
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 6 and 19. The trigger uses the dwelling
  count for 'sites with the capacity for 10 or more units'.
review-status: unverified
field-status: {}
