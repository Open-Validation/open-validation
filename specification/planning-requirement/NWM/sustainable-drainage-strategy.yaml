reference: sustainable-drainage-strategy
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - ref: major-development
    - any:
      - all:
        - site:
            in:
            - flood-risk-zone
            description: Flood Zone 2 or 3.
        - application-type:
            in:
            - full
            - outline
            - reserved-matters
            - change-of-use
            - s73
        - any:
          - condition:
              field: footprint-increase
              value: true
              description: The development increases the size of buildings.
          - condition:
              field: involves-change-of-use
              value: true
              description: A change of use.
      - any:
        - condition:
            field: site-area-residential
            operator: '>'
            value: 1
            description: Development of more than 1 ha (in Flood Zone 1).
        - condition:
            field: site-area-non-residential
            operator: '>'
            value: 1
            description: Development of more than 1 ha (in Flood Zone 1).
      - condition:
          field: more-vulnerable-use-change
          value: true
          description: A change to a more vulnerable use on a site under 1 ha in Flood Zone 1.
      - site:
          in:
          - critical-drainage-area
          description: Within a Critical Drainage Area (Flood Zone 1).
    - site:
        in:
        - critical-drainage-area
        description: Within a local Critical Drainage Area (Policy SC3).
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SC3, SP9; London Plan (2021) SI12, SI13
source-text: All majors Applications requiring an Flood Risk Assessment Any development within a local
  Critical Drainage Area (see Policy SC3)
must-include:
- item: The Lead Local Flood Authority's Drainage Pro-forma, completed
  level: must
- item: Before and after development run-off rates, and water quality impacts (including any Water Framework
    Directive compliance assessment)
  level: must
- item: Following the London Plan drainage hierarchy and maximising SuDS, with ownership, management and
    maintenance arrangements
  level: must
- item: Greenfield run-off
  level: must
  required-if:
    any:
    - ref: major-development
    - site:
        in:
        - critical-drainage-area
        description: Within a Critical Drainage Area.
confidence: medium
notes: From the council's list (published December 2024), page 8 and 30. The PAR calls it 'Surface Water
  Drainage Strategy (SWDS)'. The PAR doesn't name application types for this document, so it is applied
  to planning applications (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
field-status: {}
