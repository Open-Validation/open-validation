reference: sustainability-statement
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New residential development of one unit or more.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 500
        description: Non-residential schemes of 500 sq m and above.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SC1-SC5, INF2-INF4, INF6, INF9
source-text: Major residential schemes and non-residential schemes of 500 sq.m and above
must-include:
- item: How the proposal meets the sustainable design requirements of the Development Plan (notably SC1
    to SC5 and INF2)
  level: must
- item: Relevant BREEAM requirements (Policy SC1)
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 500
      description: Non-residential schemes.
confidence: medium
notes: From the council's list (published December 2024), page 7 and 27. The PAR doesn't name application
  types for this document, so it is applied to planning applications (householder, full, outline, reserved
  matters, change of use and s73).
review-status: unverified
field-status: {}
