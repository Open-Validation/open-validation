reference: location-plan
local-authority: NWM
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - s73
    - lbc
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Location Plan (1:1250 or 1:2500 unless otherwise agreed) All applications must include copies
  of a location plan based on an up-to-date map.
must-include:
- item: Based on an up-to-date map at 1:1250 or 1:2500 (unless otherwise agreed)
  level: must
- item: At least two named roads and existing surrounding buildings, wherever possible
  level: should
- item: Properties numbered or named so the exact location of the site is clear
  level: should
- item: The full extent of the site outlined in red, including all land needed for the development (such
    as access, landscaping, car parking and open areas around buildings)
  level: must
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 3.
review-status: unverified
field-status: {}
