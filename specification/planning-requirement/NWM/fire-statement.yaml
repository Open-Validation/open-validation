reference: fire-statement
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - ref: major-development
    - all:
      - any:
        - condition:
            field: building-height
            operator: '>='
            value: 18
            description: 18 m or more in height.
        - condition:
            field: storey-count
            operator: '>='
            value: 7
            description: 7 or more storeys.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 2
            description: 2 or more dwellings.
        - condition:
            field: educational-accommodation
            value: true
            description: Educational accommodation.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: London Plan (2021) D5, D12; Town and Country Planning (Development Management Procedure) (England)
  Order 2015, article 9A
source-text: All Majors All proposals that are subject to Planning Gateway One – applications containing
  2 or more dwellings or educational accommodation and meet the height condition of 18m or more in height,
  or 7 or more storeys.
must-include:
- item: Produced by a third party suitably qualified assessor
  level: must
- item: Covers the entire development within the red line, not just the building
  level: must
- item: In the prescribed format for Planning Gateway One
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 m or more.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: 2 or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
confidence: medium
notes: From the council's list (published December 2024), page 8 and 34. The PAR doesn't name application
  types for this document, so it is applied to planning applications (householder, full, outline, reserved
  matters, change of use and s73).
review-status: unverified
field-status: {}
