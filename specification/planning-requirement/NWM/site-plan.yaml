reference: site-plan
local-authority: NWM
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - s73
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: Site / Block Plan (1:100/200/500 unless otherwise agreed) Existing and proposed, showing
  direction of North. Must show the proposed development in relation to existing buildings on and adjoining
  the site, areas and boundaries of site, including detail of access points, trees and hard- surfacing
  (e.g. parking spaces, driveways, footpaths).
must-include:
- item: Existing and proposed, at 1:100, 1:200 or 1:500 (unless otherwise agreed)
  level: must
- item: Direction of North
  level: must
- item: The proposed development in relation to existing buildings on and adjoining the site
  level: must
- item: Areas and boundaries of the site, with access points, trees and hard surfacing (e.g. parking spaces,
    driveways, footpaths)
  level: must
- item: A pre-existing block plan
  level: must
  required-if:
    condition:
      field: retrospective
      value: true
      description: An application for retrospective permission.
confidence: medium
notes: From the council's list (published December 2024), page 4. The plans are in the PAR's national
  requirements without application types. The PAR doesn't name application types for this document, so
  it is applied to planning applications (householder, full, outline, reserved matters, change of use
  and s73).
review-status: unverified
field-status: {}
