reference: bng-metric
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Environment Act 2021
source-text: 'Biodiversity Net Gain Mandatory requirements: All FUL and OUT planning applications and
  s73 minor material amendments. … Completed Statutory Biodiversity Metric or Small Site Metric Calculation
  Tool.'
must-include:
- item: A statement as to whether the applicant believes permission would be subject to the BNG condition
  level: must
- item: The completed Statutory Biodiversity Metric or Small Site Metric (small site metric for minor
    applications only), completed by a 'competent person'
  level: must
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or an
    earlier date), with the metric calculations, publication date and version
  level: must
- item: 'Where an earlier date is proposed: the date and the reasons for it'
  level: must
- item: Confirmation whether degradation activities were carried out before the application date and,
    where they were, a statement, the date immediately before, the value on that date, the metric calculations
    and any evidence
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 5, 14 and 15-16. The PAR says BNG applies
  to all full, outline and s73 minor material amendment applications; exempt development (for example
  householder and de minimis) is exempt by law.
review-status: unverified
field-status: {}
