reference: noise-assessment
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - all:
      - condition:
          field: plant-equipment
          value: true
          description: Commercial or industrial development with associated plant, or new plant on existing
            commercial/industrial development.
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: Could disturb local noise sensitive development.
    - condition:
        field: noise-sensitive-use
        value: true
        description: New noise sensitive development close to existing noise sources (London City Airport,
          railways, main roads).
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SP8
source-text: 'Noise: where (i) a commercial or industrial development is proposed with associated plant
  that could cause disturbance to local noise sensitive developments; (ii) new plant is proposed on an
  existing industrial or commercial development close to a noise sensitive development; (iii) new noise
  sensitive development is proposed close to existing noise sources, such as London City Airport, railways
  and main roads.'
must-include:
- item: A noise and vibration impact assessment by a suitably qualified acoustic consultant
  level: must
- item: Reference to relevant British Standards
  level: should
confidence: medium
notes: From the council's list (published December 2024), page 8 and 32. Part of the PAR's 'Pollution
  Management Statement'. The PAR doesn't name application types for this document, so it is applied to
  planning applications (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
field-status: {}
