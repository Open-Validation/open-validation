reference: habitat-baseline
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Environment Act 2021
source-text: A Biodiversity Plan, drawn to an identified scale which must show the direction of North,
  showing onsite habitat existing on the date of application (or an earlier date), including any irreplaceable
  habitat.
must-include:
- item: Drawn to an identified scale with the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or an earlier date), including any irreplaceable
    habitat
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 16. The PAR says BNG applies to all full,
  outline and s73 minor material amendment applications; exempt development (for example householder and
  de minimis) is exempt by law.
review-status: unverified
field-status: {}
