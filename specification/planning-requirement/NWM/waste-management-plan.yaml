reference: waste-management-plan
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - condition:
        field: new-build
        value: true
        description: All new-build.
    - ref: major-development
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Creates a new residential use.
        - discretionary
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SC1, SC2, INF3, SP8; London Plan (2021) SI7, SI8
source-text: All new-build All Major developments Any COU that either (i) creates a new residential use,
  or (ii) gives rise to more commercial waste or a change in the way waste is managed
must-include:
- item: How waste (refuse and recycling) will be managed on site
  level: must
- item: 'A detailed Waste Management Strategy: operational waste arising, the waste hierarchy, London
    Plan and Local Plan requirements, the completed checklist, reduction/recycling/sorting/storage/disposal,
    CD&E waste and vehicle movements'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published December 2024), page 8 and 31. The PAR calls it 'Waste Management
  Strategy/Checklist'. A change of use that gives rise to more commercial waste or changes how waste is
  managed shows as discretionary. The PAR doesn't name application types for this document, so it is applied
  to planning applications (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
field-status: {}
