reference: air-quality-assessment
local-authority: NWM
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - s73
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SP2, SP9, SC2, SC5; London Plan (2021) SI1
source-text: 'Air Quality: All development.'
must-include:
- item: Confirmation the development is air quality neutral, following London Plan definitions and guidance
  level: must
  required-if:
    ref: major-development
- item: Confirmation the scheme won't increase particulate matter (PM) or nitrogen dioxide (NO2)
  level: must
  required-if:
    site:
      in:
      - air-quality-management-area
      description: A smaller scheme within an Air Quality Management Area.
- item: How the development will comply with the Non-Road Mobile Machinery Low Emission Zone and reduce
    demolition and construction emissions
  level: must
- item: Reference to Newham's Air Quality Action Plan, the Mayor's Air Quality Strategy and the Air Quality
    Standards Regulations 2010
  level: should
confidence: medium
notes: From the council's list (published December 2024), page 8 and 32. Part of the PAR's 'Pollution
  Management Statement'. The PAR doesn't name application types for this document, so it is applied to
  planning applications (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
field-status: {}
