reference: planning-statement
local-authority: NWM
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - change-of-use
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: All FUL, OUT, REM and COU applications
must-include:
- item: How the proposal addresses the policy context, including the Policies Map designations and allocations
    and the Spatial Policy for the area
  level: must
- item: Expected phasing of the development, for larger schemes
  level: should
  required-if: discretionary
- item: A non-technical summary for a wider (non-professional) audience
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published December 2024), page 5 and 9. For minor developments it can
  be part of the Design and Access Statement.
review-status: unverified
field-status: {}
