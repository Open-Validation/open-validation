reference: planning-statement
local-authority: NWM
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - change-of-use
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: All FUL, OUT, REM and COU applications
must-include:
- item: A Managed Release / Transition Statement, cross-referencing the Employment Strategy as necessary,
    where industrial or employment land or floorspace would be released or lost
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: Release of SIL/industrial land under Policy J2, or loss of employment floorspace in
        LMUAs, non-released LILs/SILs, or non-designated employment sites over 0.1ha or 1,000 sq m.
  source-text: Managed Release/Transition Statement Within the Planning Statement, cross-referencing Employment
    Strategy as necessary
confidence: medium
notes: 'Audit (wrong_trigger / wrong_app_type): the workbook used the Managed Release text as the trigger
  and placed it under Full planning only.'
review-status: unverified
field-status: {}
