reference: landscaping-plan
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - condition:
        field: external-space
        value: true
        description: The scheme involves outside space within the red line boundary.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Felling of, works to, or construction near mature trees, and trees subject to a Tree
          Preservation Order.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SP2, SP3, SP5, SC4, INF6, INF7
source-text: 'Landscaping Statement: All schemes that involve outside space within the red line boundary
  and felling/works to/construction in the vicinity of mature trees & those subject to a Tree Protection
  Order.'
must-include:
- item: Site survey and analysis, location of existing and proposed vegetation, and location and detail
    of hard landscaping, justified for suitability, interest and sustainability
  level: must
- item: Protection of existing vegetation during construction
  level: must
- item: Long-term maintenance and management, showing drainage and other subterranean services don't conflict
    with planting/protections
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 5 and 15. The PAR calls it 'Landscaping
  Statement'; in most cases it sits within the DAS. The PAR doesn't name application types for this document,
  so it is applied to planning applications (householder, full, outline, reserved matters, change of use
  and s73).
review-status: unverified
field-status: {}
