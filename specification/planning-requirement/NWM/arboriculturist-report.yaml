reference: arboriculturist-report
local-authority: NWM
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - change-of-use
        - s73
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The application affects mature trees.
  - application-type:
      in:
      - consent-under-tpo
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: 'BS5837: Trees in relation to design, demolition and construction'
source-text: 'Applications affecting mature trees/TPO applications should provide:'
must-include:
- item: A tree survey with the potential impact of construction on affected trees and the issues an Arboricultural
    Method Statement must address
  level: must
- item: Prepared by a suitably qualified and experienced arboriculturist in accordance with BS5837
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 17.
review-status: unverified
field-status: {}
