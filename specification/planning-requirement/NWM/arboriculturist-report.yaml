reference: arboriculturist-report
local-authority: NWM
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Works near mature trees.
  - site:
      in:
      - tree-preservation-zone
      description: Works near trees protected by a TPO.
  - discretionary
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
must-include:
- item: A tree survey with details of the potential impact of the construction project on affected trees
    and the issues an Arboricultural Method Statement needs to address
  level: must
- item: Prepared by a suitably qualified and experienced arboriculturist in accordance with BS5837
  level: should
confidence: medium
notes: 'Audit (wrong_trigger): should follow the Landscaping Statement trigger, outdoor space within the
  red line (shown as officer discretion) or works near mature or TPO trees.'
review-status: unverified
field-status: {}
