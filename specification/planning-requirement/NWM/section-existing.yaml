reference: section-existing
local-authority: NWM
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: Section drawings should be provided to confirm finished floor levels (in both proposed and
  existing schemes) and aid understanding of a proposal where helpful. … In small Householder schemes
  where there are no changes to floor levels, sections may not be necessary.
must-include:
- item: At 1:50 or 1:100 (unless otherwise agreed)
  level: must
- item: Finished floor levels, existing and proposed
  level: should
- item: Levels of surrounding/adjoining land and buildings
  level: should
- item: Pre-existing sections and site levels
  level: must
  required-if:
    condition:
      field: retrospective
      value: true
      description: An application for retrospective permission.
confidence: medium
notes: From the council's list (published December 2024), page 4. Small householder schemes with no change
  to floor levels may not need sections, so householder shows as discretionary.
review-status: unverified
field-status: {}
