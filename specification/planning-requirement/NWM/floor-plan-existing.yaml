reference: floor-plan-existing
local-authority: NWM
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - s73
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: Floor Plans (1:50/100 unless otherwise agreed) Existing and proposed floor plans, labelled
  clearly.
must-include:
- item: At 1:50 or 1:100 (unless otherwise agreed), labelled clearly
  level: must
- item: Where existing buildings or walls are to be demolished
  level: must
- item: The use and layout of all existing floors
  level: must
- item: Pre-existing floor plans
  level: must
  required-if:
    condition:
      field: retrospective
      value: true
      description: An application for retrospective permission.
confidence: medium
notes: From the council's list (published December 2024), page 4. The PAR doesn't name application types
  for this document, so it is applied to planning applications (householder, full, outline, reserved matters,
  change of use and s73).
review-status: unverified
field-status: {}
