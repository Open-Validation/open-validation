reference: travel-plan
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - ref: major-development
    - site:
        in:
        - sustainable-transport-opportunity-area
        - congestion-zone
        description: In or adjacent to a Sustainable Transport Opportunity Area or a Congestion Zone (Local
          Plan figure 6.1).
    - condition:
        field: use-class
        value: f1
        description: F1 uses, including extensions.
    - condition:
        field: use-class
        value: e-e-f
        description: E(e) and E(f) uses, including extensions.
    - discretionary
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) INF2; London Plan (2021) T4
source-text: All major applications Development in or adjacent to an Sustainable Transport Opportunity
  Area, or a Congestion Zone (refer to figure 6.1 pg 191 of the Local Plan) All F1, E(e)&(f) uses, including
  extensions. Minor applications likely to have significant transport implications
must-include:
- item: How the proposal will manage sustainable levels of movement, reducing vehicle impacts and promoting
    public transport, walking and cycling
  level: must
- item: 'A strategy for implementation: travel plan co-ordinator, management arrangements and timetable'
  level: should
- item: Targets and arrangements for monitoring implementation
  level: should
- item: A strategy for marketing and promoting it to occupiers, visitors and users
  level: should
confidence: medium
notes: From the council's list (published December 2024), page 7 and 26. Minor applications 'likely to
  have significant transport implications' show as discretionary. The PAR doesn't name application types
  for this document, so it is applied to planning applications (householder, full, outline, reserved matters,
  change of use and s73).
review-status: unverified
field-status: {}
