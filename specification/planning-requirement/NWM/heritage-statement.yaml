reference: heritage-statement
local-authority: NWM
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - locally-listed-building
      - conservation-area
      description: Works to listed, locally listed or non-designated heritage assets, or in or next to
        a Conservation Area.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: The site is in an Archaeological Priority Area.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves ground disturbance.
  - discretionary
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: Planning applications in Conservation Areas or adjacent to them
confidence: medium
notes: 'From the audit (missing_requirement): Heritage / Character / Place-making Asset Statement for
  LBC; works to listed, locally listed or identified non-designated heritage assets; ground disturbance
  in Archaeological Priority Areas or significant ground disturbance elsewhere (shown as officer discretion);
  applications in or next to Conservation Areas. Applies to householder schemes too.'
review-status: unverified
field-status: {}
