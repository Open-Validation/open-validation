reference: heritage-statement
local-authority: NWM
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - change-of-use
        - s73
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - locally-listed-building
          description: Affects a nationally listed or locally listed building.
      - discretionary
      - site:
          in:
          - conservation-area
          description: In or adjacent to a conservation area.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SP5
source-text: Listed Building Consent applications Applications affecting any nationally listed, locally
  listed or other non- designated character/place-making asset identified at pre-application stage … Planning
  applications in Conservation Areas or adjacent to them
must-include:
- item: 'For listed building consent: a schedule of works, an analysis of the significance of archaeology,
    history and character, the principles of and justification for the works and their impact on the building,
    its setting and adjacent listed buildings, and photographs and photomontages'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: A structural survey, where the works involve substantial demolition
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - discretionary
- item: 'For applications related to or affecting the setting of heritage/character assets: plans of historic
    features, analysis of significance, justification and impact, and photographs and photomontages'
  level: must
  required-if:
    any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - locally-listed-building
        description: Affects a heritage asset or its setting.
    - discretionary
- item: An assessment of the impact on the character and appearance of the conservation area
  level: must
  required-if:
    all:
    - site:
        in:
        - conservation-area
        description: In or adjacent to a conservation area.
    - discretionary
- item: 'For demolition in a conservation area: structural information, an analysis of the building''s
    character and appearance, justification for the demolition, and photographs and photomontages'
  level: must
  required-if:
    all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: demolition
        value: true
        description: Demolition.
confidence: medium
notes: From the council's list (published December 2024), page 5 and 14. The PAR calls it 'Heritage/Character/Place-making
  Asset Statement'. Other non-designated assets are 'identified at pre-application stage', so they show
  as discretionary. The archaeology part is in archaeological-assessment. The PAR doesn't name application
  types for this document, so it is applied to planning applications (householder, full, outline, reserved
  matters, change of use and s73).
review-status: unverified
field-status: {}
