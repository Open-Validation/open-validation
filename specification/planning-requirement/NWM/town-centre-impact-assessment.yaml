reference: town-centre-impact-assessment
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - all:
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 300
          description: Retail development of more than 300 sq m.
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside designated town and local centres.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with the Development Plan (not in site allocations or Policy
            INF5).
    - discretionary
    - all:
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 2500
          description: Leisure development of more than 2,500 sq m.
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Outside town centres.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with the Development Plan.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) INF5; London Plan (2021) SD6-SD8
source-text: Retail development of more than 300 square metres outside designated town and local centres
  not in accordance with the Development Plan (i.e. not provided in site allocations or Policy INF5).
  Retail development above capacities (‘need’) calculated in the latest Town Centre and Retail Study.
  Leisure development of more than 2500 sq. m outside town centres not in accordance with the Development
  Plan (i.e. not provided in site allocations or Policy INF5).
must-include:
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment
  level: must
- item: The impact on town centre vitality and viability, including consumer choice and trade, up to five
    years from the application
  level: must
- item: Impact up to ten years where the full impact will not be realised in five years
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published December 2024), page 7 and 24. The PAR calls it 'Retail/Leisure
  Impact Assessment'. Retail 'above capacities' depends on the council's Town Centre and Retail Study,
  so that part shows as discretionary. The PAR doesn't name application types for this document, so it
  is applied to planning applications (householder, full, outline, reserved matters, change of use and
  s73).
review-status: unverified
field-status: {}
