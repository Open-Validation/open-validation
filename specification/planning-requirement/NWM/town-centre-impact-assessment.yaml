reference: town-centre-impact-assessment
local-authority: NWM
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail or leisure outside centres, not in accordance with the Development Plan.
  - any:
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 300
        description: Retail floorspace over 300 square metres.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 2500
        description: Leisure floorspace over 2,500 square metres.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
confidence: medium
notes: 'From the audit (missing_requirement): Retail / Leisure Impact Assessment for retail over 300 sq
  m or leisure over 2,500 sq m outside centres where not in accordance with the Development Plan.'
