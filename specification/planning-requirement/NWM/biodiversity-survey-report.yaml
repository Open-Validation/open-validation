reference: biodiversity-survey-report
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development of one unit or more.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 500
        description: Non-residential above 500 sq m GIA.
    - ref: major-development
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SC4; London Plan (2021) G5
source-text: 'Biodiversity Statement: All new residential housing proposals; non- residential above 500sq.
  m GIA (mostly FUL or OUT); All Major developments'
must-include:
- item: Plans of existing biodiversity habitats or features (including buildings-based) and an evaluation
    of their significance
  level: must
- item: How the proposal protects connectivity between habitats and avoids or mitigates impacts on trees,
    hedging, soft landscaping and other features
  level: must
- item: That the opportunity to enhance biodiversity has been maximised (soft landscaping, nesting and
    roosting habitats, non-native species management, SINCs)
  level: must
- item: The London Plan Policy G5 Urban Greening Factor calculation
  level: must
- item: Technical detail on the efficacy of green roofs (depth and variation of substrate)
  level: must
- item: The potential need for a Water Framework Directive compliance assessment
  level: must
- item: The multi-functionality of biodiversity (landscaping, flood reduction, pollution management, food
    growing)
  level: must
- item: A Bat and Nesting Birds Survey
  level: should
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition of buildings.
    - condition:
        field: structural-alteration
        value: true
        description: Significant alterations to buildings.
confidence: medium
notes: From the council's list (published December 2024), page 5 and 15-17. The PAR calls it 'Biodiversity
  Statement'. The PAR doesn't name application types for this document, so it is applied to planning applications
  (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
field-status: {}
