reference: roof-plan-existing
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: Roof alterations.
    - condition:
        field: new-build
        value: true
        description: New roofs.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: Roof Plans (1:100 unless otherwise agreed) Required only where new roofs and or roof alterations
  are proposed.
must-include:
- item: At 1:100 (unless otherwise agreed)
  level: must
- item: Pre-existing roof plans
  level: must
  required-if:
    condition:
      field: retrospective
      value: true
      description: An application for retrospective permission.
confidence: medium
notes: From the council's list (published December 2024), page 4. The list says 'Roof Plans', so both
  existing and proposed are shown. The PAR doesn't name application types for this document, so it is
  applied to planning applications (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
field-status: {}
