reference: lighting-assessment
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - condition:
      field: external-lighting
      value: true
      description: The proposal (including changes to open space) includes or makes necessary external
        lighting.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SP8, SP5, SP3
source-text: All proposals (including changes to open space) that include or make necessary external lighting.
must-include:
- item: Purpose, location, type, number and intensity of lighting, hours of use, direction and spread
    (including spillage) and outcomes (security, wayfinding, efficiency, neighbour and biodiversity impact)
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 8 and 31. The PAR doesn't name application
  types for this document, so it is applied to planning applications (householder, full, outline, reserved
  matters, change of use and s73).
review-status: unverified
field-status: {}
