reference: telecommunications-report
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - condition:
      field: telecommunications-development
      value: true
      description: Radiation is likely to be emitted, e.g. telecoms equipment.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: 'Radiation: Where radiation is likely to be emitted by a development, e.g. telecoms equipment.'
must-include:
- item: A certificate / declaration that levels are within ICNIRP guidelines
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 8 and 33. Part of the PAR's 'Pollution
  Management Statement'. The PAR doesn't name application types for this document, so it is applied to
  planning applications (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
field-status: {}
