reference: energy-statement
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - discretionary
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SC1, SC2, INF4; London Plan (2021) SI 2, SI 3
source-text: All development (as per thresholds in Policies SC1 and SC2)
must-include:
- item: How the proposal meets Local Plan Policies SC1 and SC2 and the London Plan Policy SI 2 CO2 targets
  level: must
- item: Any requirements for connection to heat networks (SC2, INF4, London Plan SI 3)
  level: must
- item: Carbon off-setting contributions where targets are not met on site
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 7 and 29. The PAR calls it 'Energy Assessment'.
  The thresholds are in Policies SC1 and SC2, which the PAR doesn't repeat, so it shows as discretionary.
  The PAR doesn't name application types for this document, so it is applied to planning applications
  (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
