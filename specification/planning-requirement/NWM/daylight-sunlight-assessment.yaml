reference: daylight-sunlight-assessment
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development of one unit or more.
    - discretionary
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SP3, SP8, H1; London Plan (2021) D3, D6
source-text: All new residential development of one unit or more Any proposal for building works / operations
  that may impact on the current levels of sunlight / daylight enjoyed by adjoining properties, including
  within gardens, amenity spaces, waterways.
must-include:
- item: Following the BRE methodology (BR209 2022)
  level: must
- item: Impacts on existing properties and sites with live planning permissions, and the likely success
    of lighting within the development
  level: must
- item: Diagrams and calculations of 'Vertical Sky Component' and 'Average Daylight Factor' where relevant
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 8 and 31. Possible impacts on neighbours'
  light have no measure, so that part shows as discretionary. The PAR doesn't name application types for
  this document, so it is applied to planning applications (householder, full, outline, reserved matters,
  change of use and s73).
review-status: unverified
field-status: {}
