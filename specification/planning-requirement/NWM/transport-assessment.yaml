reference: transport-assessment
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - discretionary
    - all:
      - application-type:
          in:
          - full
          - outline
          - reserved-matters
          - change-of-use
          - s73
      - any:
        - all:
          - condition:
              field: use-class
              value: shop
              description: E(a) display or retail sale of goods other than hot food.
          - condition:
              field: floorspace
              operator: '>='
              value: 1000
              description: 1,000 sq m or greater.
        - all:
          - any:
            - condition:
                field: use-class
                value: restaurant-cafe
                description: E(b) restaurants/cafes.
            - condition:
                field: use-class
                value: hot-food-takeaway
                description: Sui generis takeaways.
            - condition:
                field: use-class
                value: drinking-establishment
                description: Drinking establishments.
          - condition:
              field: floorspace
              operator: '>='
              value: 750
              description: 750 sq m or greater.
        - all:
          - any:
            - condition:
                field: use-class
                value: business
                description: E(g) uses.
            - condition:
                field: use-class
                value: general-industrial
                description: B2.
            - condition:
                field: use-class
                value: storage-distribution
                description: B8.
          - condition:
              field: floorspace
              operator: '>='
              value: 2500
              description: 2,500 sq m or greater.
        - all:
          - condition:
              field: hotel-development
              value: true
              description: C1 hotels/boarding and guest houses.
          - condition:
              field: bedroom-count
              operator: '>='
              value: 50
              description: 50 beds or greater.
        - condition:
            field: dwelling-count
            operator: '>='
            value: 30
            description: 'C3 dwellinghouses: 30 units and above.'
        - all:
          - condition:
              field: use-class
              value: healthcare
              description: E(e) healthcare.
          - condition:
              field: staff-count
              operator: '>='
              value: 50
              description: 50 staff or greater.
        - all:
          - condition:
              field: use-class
              value: higher-further-education
              description: F1(a) higher/further education.
          - condition:
              field: floorspace
              operator: '>='
              value: 2500
              description: 2,500 sq m.
        - all:
          - condition:
              field: use-class
              value: former-d2
              description: Formerly D2 (E(d), cinemas, music and concert halls, bingo halls, dance halls).
          - condition:
              field: floorspace
              operator: '>='
              value: 1000
              description: 1,000 sq m or greater.
