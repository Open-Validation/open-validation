notes: From the council's list (published December 2024), page 7 and 25. The PAR calls it 'Transport Assessment/Statement
  (TA/TS)'. Whether a development has transport implications is a judgement, so the Transport Statement
  shows as discretionary; the TA thresholds are listed. Museums/galleries (100,000 visitors a year), places
  of worship (200 members) and other sui generis uses ('case by case') are also TA thresholds but have
  no field here. The PAR doesn't name application types for this document, so it is applied to planning
  applications (householder, full, outline, reserved matters, change of use and s73).
