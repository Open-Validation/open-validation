reference: construction-management-plan
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - discretionary
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: A Construction Logistics Plan (CLP) is required for all schemes where significant levels
  of construction form part of the proposal – predominately major developments, but also smaller schemes
  on a case-by-case basis where construction impacts are sufficiently significant.
must-include:
- item: The freight implications of the construction phase (TfL Construction Logistics Plan guidance)
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 25. The PAR asks for a Construction Logistics
  Plan, a standalone document for major developments. 'Significant levels of construction' is a judgement,
  so it shows as discretionary. The PAR doesn't name application types for this document, so it is applied
  to planning applications (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
field-status: {}
