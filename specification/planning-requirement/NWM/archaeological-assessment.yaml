reference: archaeological-assessment
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: Disturbance of ground.
      - site:
          in:
          - archaeological-priority-area
          description: In an Archaeological Priority Area.
    - all:
      - ref: major-development
      - condition:
          field: ground-disturbance
          value: true
          description: Significant disturbance of ground (major developments/infrastructure works).
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) SP5
source-text: All applications involving a disturbance of ground in an Archaeological Priority Area, or
  otherwise involving significant disturbance of ground (major developments/infrastructure works)
must-include:
- item: Existing archaeological information
  level: must
- item: A method statement on how archaeological investigation will occur and be recorded
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 5 and 14. Part of the PAR's Heritage/Character/Place-making
  Asset Statement. The PAR doesn't name application types for this document, so it is applied to planning
  applications (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
field-status: {}
