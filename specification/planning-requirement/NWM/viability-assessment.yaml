reference: viability-assessment
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Below policy-compliant levels of on-site affordable and/or family housing are proposed.
    - all:
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 500
          description: 500 sq m or more of non-residential development.
      - condition:
          field: breeam-below-target
          value: true
          description: Proposing BREEAM levels that are not policy compliant (policy SC1).
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Newham Local Plan (2018) H1, H2, SC1
source-text: Any application where below policy-compliant levels of on-site affordable and/or family housing
  are proposed. Any 500 sq. m plus of non-residential development proposing BREEAM levels that are not
  policy compliant (see policy SC1).
must-include:
- item: An independent assessment conforming to the London Borough Viability Protocol
  level: must
- item: In 'Argus Developer' format or a certified bespoke model, in both PDF and editable electronic
    format
  level: must
- item: An undertaking to fund the Council's independent scrutiny of the appraisal
  level: must
- item: Assessment on a unit basis (Policy H2) with locally relevant benchmark data
  level: must
- item: 'For PRS/Build-to-Rent: two appraisals (''Build for Rent'' and ''Build for Sale'')'
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 6 and 20. The PAR calls it 'Viability Appraisal'.
  Appraisals are published without redaction. The PAR doesn't name application types for this document,
  so it is applied to planning applications (householder, full, outline, reserved matters, change of use
  and s73).
review-status: unverified
field-status: {}
