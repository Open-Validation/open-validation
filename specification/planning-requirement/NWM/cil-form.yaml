reference: cil-form
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - any:
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: New buildings or extensions creating 100 sq m or more of GIA.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Creating a dwelling (even below 100 sq m) by new build or change of use.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Community Infrastructure Levy Regulations 2010; Newham CIL Charging Schedule
source-text: Applications for new buildings or extensions which involve the creation of 100 sq. m or more
  of gross internal floor-space (GIA) Applications that create a dwelling (even where below 100 sq.m GIA)
  via new build or change of use
confidence: medium
notes: From the council's list (published December 2024), page 6 and 20. The PAR calls it 'CIL Assessment'
  (the Planning Application Additional Information Requirement Form). The PAR doesn't name application
  types for this document, so it is applied to planning applications (householder, full, outline, reserved
  matters, change of use and s73).
review-status: unverified
field-status: {}
