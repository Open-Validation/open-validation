reference: floor-plan-proposed
local-authority: NWM
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - change-of-use
    - s73
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: Floor Plans (1:50/100 unless otherwise agreed) Existing and proposed floor plans, labelled
  clearly. … A3/A5 proposals must show routing of extraction ducting.
must-include:
- item: At 1:50 or 1:100 (unless otherwise agreed), labelled clearly
  level: must
- item: The use and layout of all floors of the proposed development
  level: must
- item: Routing of extraction ducting
  level: must
  required-if:
    any:
    - condition:
        field: use-class
        value: restaurant-cafe
        description: A3 (restaurant/cafe) proposal.
    - condition:
        field: use-class
        value: hot-food-takeaway
        description: A5 (hot food takeaway) proposal.
confidence: medium
notes: From the council's list (published December 2024), page 4. The PAR doesn't name application types
  for this document, so it is applied to planning applications (householder, full, outline, reserved matters,
  change of use and s73).
review-status: unverified
field-status: {}
