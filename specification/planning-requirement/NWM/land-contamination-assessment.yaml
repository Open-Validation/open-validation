reference: land-contamination-assessment
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - change-of-use
      - s73
  - site:
      in:
      - contaminated-land
      description: Historical land use suggests contamination is likely or known to exist.
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
source-text: 'Contamination: where historical land use suggests contamination is likely to or known to
  exist.'
must-include:
- item: 'A Phase 1 risk assessment: desk-top study of historical land use, site walk-over and a conceptual
    model of pollution linkages and risk'
  level: must
- item: A Phase 2 investigation (generic risk assessment and remediation options) where a potential risk
    is identified
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published December 2024), page 8 and 32-33. Part of the PAR's 'Pollution
  Management Statement'. The PAR doesn't name application types for this document, so it is applied to
  planning applications (householder, full, outline, reserved matters, change of use and s73).
review-status: unverified
field-status: {}
