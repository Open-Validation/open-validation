reference: environmental-statement
local-authority: NWM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - approval-condition
  - condition:
      field: eia-development
      value: true
      description: EIA development (Schedule 1 always; Schedule 2 may be).
source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: 'The Town and Country Planning (Environmental Impact Assessment) Regulations 2017 set out
  the circumstances in which an EIA is required (Schedule 1: always required, Schedule 2: may be required).
  Usually applies to FUL and OUT, but may also apply to reserved matters (REM) and discharge of conditions.'
must-include:
- item: A non-technical summary
  level: must
- item: The information in Schedule 4 of the EIA Regulations 2017
  level: must
- item: Hard copies (number agreed with the council) and discs at validation, with details of where the
    public can buy copies
  level: must
confidence: medium
notes: From the council's list (published December 2024), page 7 and 28.
review-status: unverified
field-status: {}
