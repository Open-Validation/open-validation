reference: elevation-proposed
local-authority: EAT
required-if:
  always: true
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Town and Country
  Planning (Control of Advertisements) (England) Regulations 2007
source-text: 'As a minimum these should include: • Existing and proposed elevations drawn to a metric
  scale of 1:50 or 1:100.'
must-include:
- item: Drawn to a metric scale of 1:50 or 1:100
  level: must
- item: 'For advertisement consent: drawing(s) of the proposed advertisement at 1:50 or 1:100 showing
    its size, siting, materials and colours, height above ground, extent of projection and the method
    and colour(s) of any illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: A drawing(s) of the proposed advertisement will be required (at a scale of 1:50 or 1:100)
    that shows the advertisement size, siting, materials and colours to be used, the height of the advertisement
    above ground, the extent of projection and details of the method and colour(s) of illumination (if
    applicable).
confidence: medium
notes: From the council's list (published February 2026), section 2 (National Validation Criteria), page
  6, 8. 'Other Plans and Drawings' and 'Application for Advertisement Consent'. The list says these are
  the minimum national requirements 'for the majority of planning applications' and that 'some of the
  requirements listed are not relevant to all application types'.
