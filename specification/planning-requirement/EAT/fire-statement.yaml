reference: fire-statement
local-authority: EAT
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
source-text: 'sought. 13 Fire Statement Required for full planning applications for development relating
  to a ‘relevant’ building, which is a building that: Contains two or more dwellings or educational accommodation
  and'
confidence: medium
notes: The excerpt is cut off after 'educational accommodation and'; the height/storey limb is the national
  definition of a relevant building.
review-status: unverified
field-status: {}
