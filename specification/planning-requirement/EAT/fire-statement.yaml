reference: fire-statement
local-authority: EAT
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
  (as amended 2021)
source-text: 'Required for full planning applications for development relating to a ‘relevant’ building,
  which is a building that: • Contains two or more dwellings or educational accommodation and • Meets
  the height condition of 18m or more in height, or 7 or more storeys.'
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  13, page 20-21. Includes new relevant buildings, development of an existing one and development in its
  curtilage. Not required for outline or section 73 applications.
review-status: unverified
field-status: {}
