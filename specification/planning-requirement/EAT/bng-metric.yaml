reference: bng-metric
local-authority: EAT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition (not exempt).
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Town and Country Planning Act 1990 Schedule 7A (Environment Act 2021); Eastleigh Borough Local
  Plan (2016-2036) policy DM11
source-text: 'Required for the following types of applications: • Full planning applications • Outline
  planning applications Required for: • A net increase of 1 or more dwellings; • New commercial / leisure
  buildings; • Any development impacting habitat of an area 25m2 or above, or 5m2 or above for linear
  habitats such as hedgerows. Excludes householder applications.'
must-include:
- item: Pre and post development biodiversity value quantified using the statutory Biodiversity Metric
    or Small Sites Metric, with an explanation of the condition scores
  level: must
- item: Plans of the site pre and post development, and of any areas proposed for off-site mitigation
    or compensation
  level: must
- item: Excel copies of the completed metrics
  level: must
- item: How at least 10% biodiversity net gain will be achieved, on site first, then partly or wholly
    off site
  level: must
- item: That the trading rules have been adhered to
  level: must
- item: That the mitigation hierarchy has been followed
  level: must
- item: That the proposals maximise connectivity of the proposed habitat with habitat in the wider area,
    including through green and blue infrastructure such as SuDS
  level: must
- item: How the net gain habitats will be implemented, managed, maintained, monitored and funded for at
    least 30 years
  level: must
- item: Surveys and assessments carried out by qualified ecologists following best practice guidance
  level: must
confidence: medium
notes: 'From the council''s list (published February 2026), section 3 (Local Validation Requirements),
  item 8, page 15-16. ''Biodiversity: Biodiversity Net Gain Strategy''. The list asks for it for full
  and outline applications with a net increase of 1 or more dwellings, new commercial / leisure buildings,
  or habitat impacts of 25 sq m (5 m linear) or more; the rule follows the law, using the biodiversity
  gain condition, because householder and other exempt applications (including de minimis habitat impacts)
  are exempt by law. If habitat is cleared before an application, the baseline is its value immediately
  before the clearance.'
review-status: unverified
field-status: {}
