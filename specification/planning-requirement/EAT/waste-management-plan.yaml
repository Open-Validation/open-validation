reference: waste-management-plan
local-authority: EAT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: New commercial development.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policy DM1; Domestic Waste and Recycling Policy (November
  2023)
source-text: For all new residential and commercial development.
must-include:
- item: The location of refuse storage facilities and arrangements for collection
  level: should
- item: 'Where a refuse vehicle must enter the site: a plan showing sufficient turning facilities'
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  35, page 37. 'Refuse and recyclable storage details/Strategy'; detail proportionate to the scale of
  development.
review-status: unverified
field-status: {}
