reference: lighting-assessment
local-authority: EAT
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: The installation of floodlighting.
  - condition:
      field: external-lighting
      value: true
      description: The installation of external lighting.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policies DM1, DM11
source-text: Any proposal which involves the installation of floodlighting or external lighting.
must-include:
- item: A layout plan showing the location and siting of the lighting
  level: should
- item: A plan showing the beam orientation
  level: should
- item: Hours of use
  level: should
- item: Size, height and level of luminance
  level: should
- item: Type of equipment/lighting (e.g. colour temperature)
  level: should
- item: A lux contour plan showing horizontal and vertical luminance at periodic heights
  level: should
- item: Impact on neighbouring amenity, roads/highway safety, the character of the area and wider landscape,
    and ecological habitats and species, where applicable
  level: should
- item: Why the lighting is necessary and any mitigation measures
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  22, page 29-30. The assessment should be proportionate.
review-status: unverified
field-status: {}
