reference: noise-assessment
local-authority: EAT
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: A noise generating development (including fixed plant and machinery) in the vicinity
        of existing noise sensitive developments or uses.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise sensitive use in the vicinity of an existing noise generating use (transport,
        industrial, commercial or entertainment).
  - discretionary
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policies DM8, DM11
source-text: Where a noise generating development (including fixed plant and machinery) is proposed in
  the vicinity of existing noise sensitive developments or uses; or mixed use developments; or where a
  noise sensitive use is proposed in the vicinity of an existing noise generating use, such as transport
  (road, rail, air), or industrial, commercial or entertainment uses. Where the demolition or construction
  may give rise to noise or vibration impacts.
must-include:
- item: The existing noise baseline
  level: should
- item: All significant sources of noise
  level: should
- item: All relevant noise sensitive receptors
  level: should
- item: Likely short and long term impacts assessed against agreed criteria, and whether significant adverse
    or adverse impacts are likely
  level: should
- item: How good acoustic design will avoid, mitigate and minimise adverse impacts on sensitive receptors
    (people and wildlife)
  level: should
- item: The potential to improve the acoustic environment
  level: should
- item: 'Where mitigation is proposed: the attenuation measures, their performance and how this will be
    verified'
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  25, page 32-33. 'Noise Assessment (including vibration)'. Mixed use developments and demolition or construction
  that 'may' cause noise or vibration are shown as discretionary. The contents are what an assessment
  'will be expected to' do.
review-status: unverified
field-status: {}
