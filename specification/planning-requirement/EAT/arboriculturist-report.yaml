reference: arboriculturist-report
local-authority: EAT
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees will be removed or impacted by development, above or below ground, including
        offsite.
  - condition:
      field: loss-of-habitat-features
      value: true
      description: Hedgerows will be removed or impacted by development.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policies DM1, DM11; Trees and Development SPD; BS 5837:2012
source-text: Required for all applications where trees or hedgerows will be removed or impacted by development,
  both above and below ground level, and offsite.
must-include:
- item: All trees on site identified, both those to be retained and those to be removed
  level: must
- item: An assessment of the impact, with methods of protection and mitigation during construction, or
    justification for removals and replacement planting under the Tree Replacement Policy
  level: must
- item: A Tree Protection Plan and Arboricultural Method Statement, where required
  level: should
- item: Prepared by a competent and experienced arboriculturist
  level: must
- item: Following the Trees and Development SPD and BS 5837 (2012)
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  46, page 43-44. 'Tree Survey and Arboricultural Impact Assessment (British Standard 5837 compliant).
  Tree Protection Plan and Arboricultural Method Statement'.
review-status: unverified
field-status: {}
