reference: town-centre-impact-assessment
local-authority: EAT
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Situated outside of existing centres.
  - any:
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 350
        description: Retail development of 350sqm or more net additional floor area.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Leisure development over 2,500sqm.
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with the Local Plan.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policies DM21, DM36
source-text: Applications for retail development of equal or greater than 350sqm net additional floor
  area, or leisure development over 2,500sqm that will be situated outside of existing centres which are
  not in accordance with the Local Plan.
must-include:
- item: Impact on existing, committed and planned public and private investment in centres in the catchment
    area
  level: must
- item: Impact on town centre vitality and viability, including local consumer choice and trade, over
    the first five years
  level: must
- item: 'For major schemes: impact assessed up to ten years from the application'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  37, page 38. 'Retail and Leisure – Impact Assessment'. The sequential test (item 36) is in the council's
  unmapped rows.
review-status: unverified
field-status: {}
