reference: land-contamination-assessment
local-authority: EAT
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Land where contamination is known or suspected to exist.
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use/users is/are vulnerable to land contamination.
  - site:
      in:
      - near-landfill-site
      description: Within 250 metres of a currently licensed or historic landfill site.
  - all:
    - condition:
        field: ground-disturbance
        value: true
        description: The development could introduce, affect or cause the movement of contaminants within
          the ground.
    - discretionary
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policy DM8; Land contamination risk management (LCRM)
source-text: Development on land where contamination is known or suspected to exist. The proposed use/users
  is/are vulnerable to land contamination. The development is within 250 metres of a currently licensed
  or historic landfill site. The development could introduce, affect or cause the movement of contaminants
  within the ground.
must-include:
- item: In accordance with the national Land Contamination Risk Management (LCRM) guidance
  level: should
- item: Site investigations in accordance with BS10175:2011+A2:2017 and BS 8576:2013
  level: should
- item: 'Site characterisation: desk study and/or site investigations identifying previous use and contaminant,
    pathway and receptor linkages, with a conceptual site model'
  level: should
- item: Risk assessment of the risks to proposed and existing receptors
  level: should
- item: 'Remediation scheme: appropriate risk management measures to reduce risks to acceptable levels'
  level: should
- item: Carried out by a competent person
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  19, page 26-27. Whether a development 'could' move contaminants depends on judgement, so that part is
  shown as discretionary. Applicants are advised to agree the scope with the council's Pollution Team
  first.
review-status: unverified
field-status: {}
