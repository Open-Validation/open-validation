reference: transport-assessment
local-authority: EAT
required-if:
  any:
  - discretionary
  - condition:
      field: parking-standards-departure
      value: true
      description: The development deviates from adopted parking standards.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policy DM13
source-text: All development that will generate vehicle movements likely to have an adverse impact on
  traffic conditions beyond the immediate vicinity of the development, and for development which deviates
  from adopted parking standards.
must-include:
- item: Analysis of all existing and proposed trips by all modes generated by the site
  level: should
- item: Accessibility to the site by all modes and the likely modal split of journeys
  level: should
- item: Measures to improve access by public transport, walking and cycling, reduce parking need and mitigate
    transport implications
  level: should
- item: Loading areas and arrangements for manoeuvring, servicing and parking of vehicles clearly identified
  level: should
- item: Existing transport conditions, how the development would affect them, and measures to overcome
    any issues (e.g. junction modelling, road safety analysis)
  level: should
- item: 'For relatively small transport implications: a Transport Statement with a similar assessment
    of existing and proposed conditions, without detailed analysis of the wider network'
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  44, page 42. 'Transport Assessment or Transport Statement'. Whether vehicle movements are 'likely to
  have an adverse impact' beyond the immediate vicinity depends on judgement, so it is shown as discretionary.
review-status: unverified
field-status: {}
