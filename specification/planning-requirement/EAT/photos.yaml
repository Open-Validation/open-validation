reference: photos
local-authority: EAT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - condition:
      field: building-works
      value: true
      description: Existing buildings or structures on site are to be affected by the works.
  - discretionary
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policy DM11; NERC Act 2006 section 40
source-text: Applicants are also advised to provide photographs of existing buildings and structures on
  site that are to be affected by the proposed works to assess their potential for accommodating protected
  species.
must-include:
- item: Roofs, flashings, fascias, soffits, hanging tiles, areas around windows and interiors of loft
    spaces and roofs
  level: should
- item: The building(s) in context, showing any surrounding land and vegetation that may be affected
  level: should
confidence: medium
notes: 'From the council''s list (published February 2026), section 3 (Local Validation Requirements),
  item 6, page 12-13. Part of ''Biodiversity: Biodiversity Checklist and Photographs'', for householder,
  full and outline applications. Applicants are ''advised'' to provide the photographs, so they show as
  discretionary. The HBIC Biodiversity Checklist itself is in the council''s unmapped rows.'
review-status: unverified
field-status: {}
