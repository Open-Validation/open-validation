reference: construction-management-plan
local-authority: EAT
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policies DM1, DM8, DM11, DM13; BS 5228
source-text: All major development proposals. Any application where demolition, construction or landscaping
  work has the potential to affect a watercourse, wildlife habitat or an adjacent site. This could include
  impacts due to pollution, sediment, dust, surface water runoff, lighting, noise, vegetation clearance,
  or soil compaction.
must-include:
- item: Procedures and measures to minimise impacts on the local area and environment during construction,
    including highway and environmental impacts
  level: should
- item: Reference to codes of practice including BS 5228 and the IAQM's 'Assessment of dust from demolition
    and construction'
  level: should
- item: Phasing and timings of demolition
  level: should
- item: Contractor parking and delivery arrangements
  level: should
- item: Access and egress arrangements and traffic routing
  level: should
- item: Location of temporary buildings, compounds, plant and storage areas
  level: should
- item: Type and number of plant and equipment
  level: should
- item: Measures to prevent dirt and dust being transferred onto the highway
  level: should
- item: Measures to prevent adverse noise and vibration impacts
  level: should
- item: Measures to prevent pollution to protected watercourses
  level: should
- item: Method statements for preventing harm to protected species, habitats and biodiversity
  level: should
- item: Timings for specialists to oversee ecological protection measures
  level: should
- item: Locations of exclusion zones, protective barriers and signage
  level: should
- item: A programme and methodology for monitoring and auditing site emissions and impacts, including
    an Environmental Management System
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  10, page 17-18. 'Construction Environmental Management Plan (CEMP) and/ or Construction Traffic Management
  Plan (DRAFT)'. Non-major work with 'the potential to affect' a watercourse, habitat or adjacent site
  depends on judgement, so it is shown as discretionary. The contents are what 'could be included'.
review-status: unverified
field-status: {}
