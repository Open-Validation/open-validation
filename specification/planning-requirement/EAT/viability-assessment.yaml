reference: viability-assessment
local-authority: EAT
required-if:
  any:
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The developer considers that certain planning obligations cannot be met because of
        the scheme's financial viability.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Affordable housing is not proposed, or is proposed below the policy requirement.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policies DM28, DM38
source-text: Required in circumstances where a developer considers that certain planning obligations cannot
  be met due to the impact on the financial viability of the scheme.
must-include:
- item: Follows the recommended approach in national planning guidance, including standardised inputs
  level: must
- item: Made publicly available
  level: must
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  47, page 44. 'Viability Assessment / Financial Appraisal'. The affordable housing trigger is from item
  2 (page 10). The applicant pays for independent review.
review-status: unverified
field-status: {}
