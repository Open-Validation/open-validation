reference: location-plan
local-authority: EAT
required-if:
  always: true
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A plan based on an up-to-date map should be submitted, which clearly identifies the land
  to which the application relates.
must-include:
- item: Based on an up-to-date map
  level: should
- item: At an identified standard metric scale (typically 1:1250 or 1:2500)
  level: should
- item: Direction of North
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location clear
  level: should
- item: 'Where the plan is from the Ordnance Survey: the OS licence number'
  level: should
- item: Application site clearly outlined in red, including all land needed for the development such as
    access from a public highway
  level: should
- item: Any other land close to or adjoining the site in the applicant's ownership outlined in blue
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 2 (National Validation Criteria), page
  6. The list says these are the minimum national requirements 'for the majority of planning applications'
  and that 'some of the requirements listed are not relevant to all application types'.
review-status: unverified
field-status: {}
