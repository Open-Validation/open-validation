  status: current
submission-standards:
- item: Ordnance Survey plans bear a valid Ordnance Survey licence number
  level: must
- item: All plans accurately drawn to a conventional metric scale such as 1:50 or 1:100, with a scale
    bar
  level: must
- item: No disclaimers such as 'do not scale' on plans and drawings (except perspective drawings or artists'
    impressions)
  level: must
- item: All proposed elevations shown with the corresponding existing elevations, both at the same metric
    scale
  level: should
- item: All elevations clearly labelled with their orientation
  level: must
- item: All plans individually numbered; any drawing amended during the application clearly states its
    revision number
  level: must
- item: Submitted electronically via the Planning Portal; a paper copy only in exceptional circumstances,
    as the original plus one copy
  level: should
- item: Amended plans or documents uploaded to the Planning Portal clearly labelled as amendments, with
    the case officer told by email
  level: should
- item: Personal or sensitive data in a separate document clearly marked as confidential, not cross-referenced
    in public documents
  level: should
