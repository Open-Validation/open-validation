reference: archaeological-assessment
local-authority: EAT
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      description: An area where there is known to be the potential for below ground archaeology.
  - condition:
      field: ground-disturbance
      value: true
      description: Groundworks are proposed.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policy DM12
source-text: Where groundworks are proposed in an area where there is known to be the potential for below
  ground archaeology.
must-include:
- item: Identifies and assesses the significance of any archaeological resource within the development
    area
  level: must
- item: Desk based assessment prepared to the Chartered Institute for Archaeologists' standards and guidance
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  5, page 11. 'Archaeological Impact Assessment'.
review-status: unverified
field-status: {}
