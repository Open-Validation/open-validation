reference: air-quality-assessment
local-authority: EAT
required-if:
  any:
  - all:
    - site:
        in:
        - air-quality-management-area
        description: In or near an area where air quality is already known to be poor, e.g. an AQMA.
    - condition:
        field: sensitive-end-use
        value: true
        description: Sensitive development.
  - discretionary
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: 'Eastleigh Borough Local Plan (2016-2036) policy DM8; IAQM ''Guidance on land-use planning and
  development control: Planning for air quality'' (2017, v1.2)'
source-text: Development which, during the construction and operational phases, could lead to an adverse
  effect on air quality (e.g. through alteration in the traffic volume and flow, or introduction of new
  point sources of pollution such as a combustion plant), in or near to an area where it is already known
  to be poor; e.g. • Air Quality Management Area (AQMA); • Development which may affect an existing, or
  give rise to a new AQMA, or; • development which may affect sensitive habitats or designated sites of
  importance for biodiversity. Sensitive development in or near an area where air quality is already known
  to be poor, e.g. an AQMA.
must-include:
- item: 'Consistent with IAQM advice and guidance, in particular ''Guidance on land-use planning and development
    control: Planning for air quality 2017 v1.2'''
  level: should
- item: Baseline conditions and any air quality concerns affecting the area, and how these could change
    with and without the development
  level: should
- item: Identified sensitive receptors and habitats, including designated sites of importance for biodiversity
  level: should
- item: The assessment methods and any requirements for verification of air quality modelling
  level: should
- item: The basis for assessing impacts and determining their significance
  level: should
- item: Where relevant, cumulative or in-combination effects of several developments
  level: should
- item: Construction phase impacts
  level: should
- item: Acceptable mitigation measures to reduce or remove adverse effects
  level: should
- item: Measures that could deliver improved air quality even where legal limits are not breached
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  4, page 10-11. Development that 'could lead to an adverse effect' or 'may affect' an AQMA or sensitive
  habitats depends on judgement, so it is shown as discretionary; sensitive development in or near an
  AQMA is the clear part. The contents are what 'a typical air quality assessment consists of'.
review-status: unverified
field-status: {}
