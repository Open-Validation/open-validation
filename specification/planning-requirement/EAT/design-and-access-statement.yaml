reference: design-and-access-statement
local-authority: EAT
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: In a designated area (World Heritage Site or Conservation Area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100sqm or more.
  - application-type:
      in:
      - lbc
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Design and Access Statements must be provided for: • Applications for major development
  as defined in article 2 of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (as amended); • Applications for development in a designated area (World Heritage Site or
  Conservation Area), where the proposal consists of: - One or more dwellings; or - A building or buildings
  with a floor space of 100sqm or more; • Applications for listed building consent.'
confidence: medium
notes: From the council's list (published February 2026), section 2 (National Validation Criteria), page
  7. It must not be used as a substitute for drawings or other required material.
review-status: unverified
field-status: {}
