reference: biodiversity-survey-report
local-authority: EAT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        description: A nationally or internationally designated habitat.
    - site:
        in:
        - local-wildlife-site
        description: A locally designated nature conservation habitat.
    - condition:
        field: protected-species
        value: true
        description: A protected or notable species.
    - site:
        in:
        - priority-habitat
        description: A priority habitat.
    - condition:
        field: geodiversity-interest
        value: true
        description: Features of geodiversity and soils interest.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policy DM11; Biodiversity SPD (December 2009); NERC Act
  2006 section 40; Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations
  2017; Protection of Badgers Act 1992
source-text: 'Required for the following types of applications: • Householder applications • Full planning
  applications • Outline planning applications; • Where any development may affect: - a nationally or
  internationally designated habitat. - a locally designated nature conservation habitat. - a protected
  or notable species - a priority habitat (also see Biodiversity Net Gain Strategy below) - features of
  geodiversity and soils interest.'
must-include:
- item: An ecological report with ecological survey details, an assessment of impacts and plans showing
    the location of significant wildlife habitats or features
  level: must
- item: 'Where mitigation, enhancement and/or compensation is proposed: information, including plans,
    supporting it'
  level: must
- item: 'Where a Preliminary Ecological Assessment identifies that Phase 2 surveys are necessary: those
    surveys'
  level: must
- item: 'For more than one dwelling: proposals for long term maintenance and management of habitats and
    features'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: More than one dwelling.
- item: 'Where works such as demolition of older buildings or roof spaces, removal of trees, scrub or
    hedgerows, or alterations to watercourses may affect protected species: an impact assessment and any
    mitigation proposals for those species'
  level: must
- item: 'Where the great crested newt district licensing approach is used: a NatureSpace certificate or
    report for the site'
  level: must
- item: 'For more than one dwelling: enough information for the council to undertake a Habitats Regulations
    Assessment of effects on internationally important sites'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: More than one dwelling.
- item: Any potential features of geodiversity and soils interest identified
  level: must
- item: Surveys and assessments carried out by qualified ecologists following best practice guidance
  level: should
confidence: medium
notes: 'From the council''s list (published February 2026), section 3 (Local Validation Requirements),
  item 7, page 13-15. ''Biodiversity: Ecological Surveys and Assessment''. The Biodiversity Checklist
  is used to decide whether surveys are needed.'
review-status: unverified
field-status: {}
