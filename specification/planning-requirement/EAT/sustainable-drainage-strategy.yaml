reference: sustainable-drainage-strategy
local-authority: EAT
required-if:
  all:
  - condition:
      field: new-build
      value: true
      description: New development (excluding residential extensions and changes of use).
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: New commercial development.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policies DM5, DM6; CIRIA SuDS Manual
source-text: All new residential and commercial development (excluding residential extensions and changes
  of use).
must-include:
- item: A drainage strategy and plans showing how sustainable drainage is integrated into the development
    and its green-blue infrastructure
  level: must
- item: Sustainable drainage elements such as interception, attenuation, storage and treatment capacities
  level: must
- item: How the four pillars of SuDS have been achieved
  level: must
- item: Adoption and provisions for future maintenance of the systems
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  41, page 40. 'Sustainable Drainage Details and Strategy'. The council's water quality standards are
  more stringent than the CIRIA manual.
review-status: unverified
field-status: {}
