reference: site-plan
local-authority: EAT
required-if:
  always: true
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A site plan should be submitted that accurately shows the proposed development in relation
  to the site boundaries and other buildings on the site, with written dimensions (including those to
  the site boundaries) being shown.
must-include:
- item: The proposed development in relation to the site boundaries and other buildings on the site, with
    written dimensions including those to the boundaries
  level: should
- item: Direction of North
  level: should
- item: At an identified standard metric scale (typically 1:200 or 1:500)
  level: should
- item: All buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site and on adjacent land
  level: should
- item: On-site car parking arrangements
  level: should
- item: The extent and types of any hard surfacing
  level: should
- item: Boundary treatment, including walls or fencing, where proposed
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 2 (National Validation Criteria), page
  6. 'Block Plan'. The adjoining-land, rights of way, trees, parking, surfacing and boundary items are
  needed 'unless these would NOT influence or be affected by the proposed development'. The list says
  these are the minimum national requirements 'for the majority of planning applications' and that 'some
  of the requirements listed are not relevant to all application types'.
review-status: unverified
field-status: {}
