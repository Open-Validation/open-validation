reference: sustainability-statement
local-authority: EAT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Developments involving the provision of new dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 500
      description: Non-residential development above 500sqm floor space measured externally (including
        extensions).
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policies DM2, DM3
source-text: All developments involving the provision of new dwellings. All non-residential developments
  above 500sqm of floor space measured externally (including extensions to existing buildings).
must-include:
- item: How the proposal complies with the sustainability principles and requirements of Policies DM2
    and DM3
  level: must
- item: A predicted mains water consumption of no more than 110 litres/person/day
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
- item: BREEAM 'excellent' (or equivalent)
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>'
      value: 500
      description: Non-residential development above 500sqm.
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  42, page 41. 'Sustainability Report'. The 19% emissions improvement in Policy DM2 no longer applies.
review-status: unverified
field-status: {}
