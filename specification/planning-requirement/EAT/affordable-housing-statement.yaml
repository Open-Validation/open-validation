reference: affordable-housing-statement
local-authority: EAT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more residential dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A site of 0.5ha capable of accommodating 10 or more dwellings.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policies DM28, DM29; Affordable Housing SPD (July 2009)
source-text: For proposals of 10 or more residential dwellings or sites of 0.5ha capable of accommodating
  10 or more dwellings.
must-include:
- item: The site area, total number of dwellings, and the mix of dwelling type and size of both the open
    market and affordable housing
  level: must
- item: For the affordable housing, the number of persons each dwelling is designed to accommodate
  level: should
- item: How the requirements of the Local Plan and the Affordable Housing SPD have been met
  level: must
- item: How the different tenures are to be accommodated, including any First Homes provision
  level: must
- item: How the affordable housing is to be distributed on the site
  level: must
- item: Confirmation that all affordable housing will be built to the Policy DM28 and DM29 provisions
    for accessible and adaptable dwellings
  level: must
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  2, page 9-10. Where affordable housing is not proposed, or is below the policy level, a Viability Assessment
  is required.
review-status: unverified
field-status: {}
