reference: flood-risk-assessment
local-authority: EAT
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or more within Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or more within Flood Zone 1.
  - site:
      in:
      - critical-drainage-area
      description: Land identified by the Environment Agency as having critical drainage problems.
  - site:
      in:
      - flood-risk-zone
      description: All new developments located in Flood Zones 2 and 3.
  - site:
      in:
      - future-flood-risk
      description: Land identified in a Strategic Flood Risk Assessment as being at increased flood risk
        in future.
  - all:
    - site:
        in:
        - surface-water-flood-risk
        description: Land that may be subject to other sources of flooding.
    - discretionary
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policy DM5
source-text: 'A Flood Risk Assessment is required for: • Developments on a site of 1 hectare or more within
  Flood Zone 1 or on land which has been identified by the Environment Agency as having critical drainage
  problems; • All new developments located in Flood Zones 2 and 3; • Land identified in a Strategic Flood
  Risk Assessment as being at increased flood risk in future; • Land that may be subject to other sources
  of flooding, where its development would introduce a more vulnerable use.'
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  14, page 22. Other sources of flooding apply only 'where its development would introduce a more vulnerable
  use', which cannot be shown with a field, so that part is shown as discretionary.
review-status: unverified
field-status: {}
