reference: heritage-statement
local-authority: EAT
required-if:
  site:
    in:
    - listed-building
    - conservation-area
    - listed-building-setting
    - locally-listed-building
    - scheduled-monument
    - park-and-garden
    description: Affects a listed building; is within or adjacent to a Conservation Area; or could impact
      on a heritage asset (including locally listed buildings and non-designated heritage assets) or its
      setting.
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policy DM12
source-text: 'A heritage statement is required if the proposal: • Affects a listed building; • Is located
  within or adjacent to a Conservation Area; or • Could potentially impact upon a heritage asset or its
  setting, or is adjacent to a heritage setting. Note that a heritage asset would include locally listed
  buildings and non- designated heritage assets.'
must-include:
- item: A desk-based assessment and, where necessary, a field evaluation
  level: should
- item: The significance of the heritage asset and the contribution of its setting
  level: should
- item: The impact of the development on that significance, how the development will sustain or enhance
    the asset, and clear justification for any harm
  level: should
- item: Steps to minimise or negate any negative impact on the asset's significance or setting
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  18, page 25. The statement should be proportionate to the asset and the impact.
review-status: unverified
field-status: {}
