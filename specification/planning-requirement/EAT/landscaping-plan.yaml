reference: landscaping-plan
local-authority: EAT
required-if:
  any:
  - condition:
      field: landscaping-works
      value: true
      description: Replacement landscaping is proposed.
  - condition:
      field: loss-of-habitat-features
      value: true
      description: The development would result in the loss of plants, trees or habitats that require
        replacement / compensation.
  - discretionary
source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
policy: Eastleigh Borough Local Plan (2016-2036) policies DM1, DM11
source-text: 'Required for applications whereby: • replacement landscaping is proposed; • where it is
  expected or has been determined through pre- application discussions that landscaping will be necessary
  to make the proposal acceptable in planning terms. • where a development would result in the loss of
  plants, trees or habitats that require replacement / compensation.'
must-include:
- item: A plan or plans detailing the proposed landscaping
  level: should
- item: Details of all hard and soft landscaping areas
  level: should
- item: Planting and maintenance specifications
  level: should
- item: A management plan for landscaped areas and the aftercare period, including replacement of plants
    that die or are removed
  level: should
- item: Tree pit details
  level: should
- item: Details of services within the landscaped areas
  level: should
- item: A boundary treatments plan
  level: should
confidence: medium
notes: From the council's list (published February 2026), section 3 (Local Validation Requirements), item
  20, page 28. 'Landscaping details and Management Plan'. Landscaping expected or agreed at pre-application
  stage is shown as discretionary. For outline applications and non-major development (excluding changes
  of use) an indicative landscape plan is acceptable for validation. A Landscape and Ecological Management
  Plan may be required for some applications.
review-status: unverified
field-status: {}
