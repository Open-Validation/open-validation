submission-standards:
- item: All plans, information and photographs submitted as PDF files, no larger than 10 MB
  level: must
- item: Plans state the print paper size and the relevant scale (for example A3 at 1:200), and include
    key dimensions
  level: must
- item: Plans on A3 or A4 paper where appropriate, uploaded in the correct orientation
  level: must
- item: 'Correct fee paid: the application cannot progress until it is received'
  level: must
