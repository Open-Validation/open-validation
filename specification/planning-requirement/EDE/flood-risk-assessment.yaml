reference: flood-risk-assessment
local-authority: EDE
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or more (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or more (Flood Zone 1).
  - site:
      in:
      - critical-drainage-area
      description: Development in a critical drainage area.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use to a more vulnerable class (for example from commercial to residential).
    - site:
        in:
        - surface-water-flood-risk
        description: Land in Flood Zone 1 that could be affected by sources of flooding other than rivers
          and the sea (for example surface water drains, reservoirs).
  - site:
      in:
      - flood-risk-zone
      description: All development in Flood Zones 2 and 3, including minor development and changes of
        use.
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies EN21 and EN22
source-text: All development of 1 hectare of more in Flood Zone 1; Development in a critical drainage
  areas; less than 1 ha in flood zone 1, including a change of use in development type to a more vulnerable
  class (for example from commercial to residential), where they could be affected by sources of flooding
  other than rivers and the sea (for example surface water drains, reservoirs; All development in Flood
  Zones 2 and 3 including minor development and changes of use.
must-include:
- item: By a suitably qualified person
  level: must
- item: Identifies and assesses the risks of all forms of flooding to and from the development
  level: should
- item: How flood risks will be managed, taking climate change into account
  level: should
- item: A Sequential and Exception Test as set out in the NPPF, if necessary
  level: should
- item: Opportunities to reduce the probability and consequences of flooding
  level: should
- item: Use and details of Sustainable Drainage Systems (SuDS)
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 22. The surface water flood risk designation
  stands for 'other sources of flooding' in the list's example (surface water drains, reservoirs). Like
  every report in section 3, the list adds that requests 'will be proportionate to the nature and scale
  of the development proposals and will only be requested where the Local Planning Authority consider
  it relevant, necessary and material to the application in question'.
review-status: unverified
field-status: {}
