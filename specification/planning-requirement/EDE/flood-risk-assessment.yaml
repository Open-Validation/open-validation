reference: flood-risk-assessment
local-authority: EDE
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All development in Flood Zones 2 and 3, including minor development and changes of
        use.
  - site:
      in:
      - critical-drainage-area
      description: Development in a Critical Drainage Area.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or more in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or more in Flood Zone 1.
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: Less than 1 hectare in Flood Zone 1, including a change to a more vulnerable use.
    - discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
