reference: elevation-proposed
local-authority: EDE
required-if: discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: These drawings should accurately show what a building/structure looks like from the outside.
  Applications will usually require both existing and proposed elevations.
must-include:
- item: Scale of 1:100 or 1:50, with a scale bar at the appropriate scale
  level: must
- item: Clearly annotated 'existing' and 'proposed', with buildings to be demolished clearly identified
  level: must
- item: Every elevation (front, sides and rear), stating the direction each faces, for example front (north)
  level: must
- item: The whole of the existing building(s) to be altered or extended, so the relationship of the new
    building/extension can be seen in full
  level: must
- item: The property boundary and part of adjoining properties, with the position of their openings
  level: must
- item: Type and colour of finishing materials for walls, roof, windows, doors etc. (or a note that they
    match the existing)
  level: must
- item: Not simple line drawings
  level: must
- item: New doors, openings, windows, shopfronts, panelling, fireplaces, plaster mouldings or other decorative
    details to listed buildings detailed on a scaled plan of not less than 1:20
  level: should
  required-if:
    site:
      in:
      - listed-building
      description: The proposal affects a listed building.
- item: 'Replacement windows: details/elevations and sections through casements, frames and glazing bars
    at 1:2/1:5, including methods of opening and finishes'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: replacement-windows
        description: Listed building consent for replacement windows.
- item: 'Shopfronts: drawings or photographs in elevation of the shopfront, and details/sections through
    display areas, doorway, frames, fascia and cornice and glazing bars at 1:2/1:5, including methods
    of opening and finishes'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: shopfront
        description: Listed building consent for a shopfront.
- item: 'Shopfronts: details of any new signage, including materials, finishes and any illumination'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: shopfront
        description: Listed building consent for a shopfront.
- item: 'New flues, vents, extractors or chimneys: plans/elevations or photomontage showing their exact
    location, and details including dimensions'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: flues-vents
        description: Listed building consent for new flues, vents, mechanical ventilation, extractors
          or chimneys.
confidence: medium
notes: From the council's list (adopted 7 October 2022), pages 10, 53-54. The list gives no trigger beyond
  'Applications will usually require both existing and proposed elevations', so the requirement shows
  as discretionary. Section 4 adds details for listed building consent works.
review-status: unverified
field-status: {}
