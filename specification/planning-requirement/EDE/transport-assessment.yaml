reference: transport-assessment
local-authority: EDE
required-if:
  all:
  - ref: major-development
  - discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies TC2, TC4, TC7 and TC9
source-text: All major development where there are likely to be significant transport implications.
must-include:
- item: By a suitably qualified person, detailing all existing and proposed commercial and residential
    vehicular and pedestrian movements to and from the site
  level: must
- item: Loading areas and arrangements for manoeuvring, servicing and parking of vehicles clearly identified
  level: should
- item: Existing transport conditions, how the development would affect them, and measures proposed to
    overcome any problems
  level: must
- item: 'For major proposals: accessibility to the site by all modes of transport and the likely modal
    split of journeys'
  level: should
- item: Measures to improve access by public transport, walking and cycling, to reduce the need for parking
    and to mitigate transport impacts
  level: should
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 47. 'Transport Statement/Assessment'. 'Likely
  to be significant transport implications' has no measure, so it shows as discretionary within major
  development. Like every report in section 3, the list adds that requests 'will be proportionate to the
  nature and scale of the development proposals and will only be requested where the Local Planning Authority
  consider it relevant, necessary and material to the application in question'.
review-status: unverified
field-status: {}
