reference: schedule-of-works
local-authority: EDE
required-if:
  any:
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: thatching
        description: Listed building consent for thatching.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: re-roofing
        description: Listed building consent for re-roofing in slate or tiles.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: replacement-windows
        description: Listed building consent for replacement windows.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: render
        description: Listed building consent for render.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: shopfront
        description: Listed building consent for a shopfront.
  - all:
    - all:
      - application-type:
          in:
          - lbc
      - condition:
          field: listed-building-works
          value: internal-alterations
          description: Listed building consent for internal alterations.
    - discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies D1 and EN9
source-text: 'The further information detailed should be included with listed building applications that
  comprise the following works:'
must-include:
- item: 'Thatching: details of the thatcher and details/method statement of the thatching'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: thatching
        description: Listed building consent for thatching.
- item: 'Re-roofing (slate/tiles): schedule of works including method of fixing, roof ventilation and
    insulation'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: re-roofing
        description: Listed building consent for re-roofing in slate or tiles.
- item: 'Replacement windows: schedule of windows specifying repairs or replacement'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: replacement-windows
        description: Listed building consent for replacement windows.
- item: 'Render: schedule of works including the mix (proportions of lime/sand and additives), method
    of application and finishes'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: render
        description: Listed building consent for render.
- item: 'Shopfronts: schedule of works specifying areas of repair or replacement'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: shopfront
        description: Listed building consent for a shopfront.
- item: 'Internal alterations: details of new joinery (doors, architraves, skirtings, picture rails, staircases,
    balustrades etc.)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: internal-alterations
        description: Listed building consent for internal alterations.
- item: 'Internal alterations: schedule of repairs where appropriate (plaster repairs, decorative features,
    flooring etc.)'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: internal-alterations
        description: Listed building consent for internal alterations.
confidence: medium
notes: From the council's list (adopted 7 October 2022), pages 53-54. Section 4. For internal alterations
  the list asks for a schedule of repairs 'where appropriate', so that part shows as discretionary. The
  heritage statement for works to a listed building should also include 'a written schedule of works to
  the heritage asset' (page 29).
review-status: unverified
field-status: {}
