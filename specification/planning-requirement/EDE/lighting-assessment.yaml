reference: lighting-assessment
local-authority: EDE
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: The proposal includes floodlighting.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: The proposal includes external lighting.
    - discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies D1 and EN14
source-text: All applications including/for floodlighting, or a significant amount of external lighting.
must-include:
- item: By a suitably qualified person, giving details of the external lighting when switched on
  level: must
- item: A layout plan with beam orientation
  level: must
- item: A schedule and details of the equipment and its design
  level: must
- item: Expected levels of luminance and glare
  level: must
- item: A light contour diagram based on a layout of the site in context, showing projected lux levels
    within and around the site, designed to protect the dark sky
  level: must
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 33. 'Lighting Report'. 'A significant amount
  of external lighting' has no measure, so it shows as discretionary. Like every report in section 3,
  the list adds that requests 'will be proportionate to the nature and scale of the development proposals
  and will only be requested where the Local Planning Authority consider it relevant, necessary and material
  to the application in question'.
review-status: unverified
field-status: {}
