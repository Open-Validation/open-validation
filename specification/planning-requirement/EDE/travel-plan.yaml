reference: travel-plan
local-authority: EDE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 200
      description: 'Large scale major: 200 or more dwellings.'
  - condition:
      field: site-area-residential
      operator: '>='
      value: 4
      description: 'Large scale major: residential site area of 4 hectares or more.'
  - condition:
      field: floorspace
      operator: '>='
      value: 10000
      description: 'Large scale major: 10,000 sq m or more of floorspace.'
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 2
      description: 'Large scale major: a site of 2 hectares or more.'
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 Strategy 5B
source-text: All large scale major planning applications.
must-include:
- item: A draft travel plan by a suitably qualified person, showing how the transport implications will
    be managed to ensure the minimum environmental and social impact
  level: should
- item: How new occupiers or users will use alternative means of travel to the private car
  level: should
- item: Targets and arrangements for monitoring
  level: should
confidence: medium
notes: 'From the council''s list (adopted 7 October 2022), page 48. ''Large scale major'' uses the list''s
  own definition (page 14): 200 or more dwellings or a residential site of 4 ha or more; 10,000 sq m or
  more, or a site of 2 ha or more. Like every report in section 3, the list adds that requests ''will
  be proportionate to the nature and scale of the development proposals and will only be requested where
  the Local Planning Authority consider it relevant, necessary and material to the application in question''.'
review-status: unverified
field-status: {}
