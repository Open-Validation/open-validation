reference: cil-form
local-authority: EDE
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: A chargeable residential use.
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 0
          description: A chargeable retail use.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Over 100 square metres of new floorspace.
  - application-type:
      in:
      - ldc
  - all:
    - application-type:
        in:
        - s73
    - discretionary
  - all:
    - condition:
        field: involves-change-of-use
        value: true
        description: A conversion or change of use.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: To residential.
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 0
          description: To retail.
  - all:
    - condition:
        field: residential-annexe
        value: true
        description: A residential annexe.
    - condition:
        field: new-build
        value: true
        description: The annexe is new build.
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
source-text: Householder applications over 100sqm …; Reserved Matters applications following outline permission
  …; Applications for lawful development certificates; Application for a variation of condition if additional
  chargeable floorspace is proposed; … New build annexes
confidence: medium
notes: 'Audit (wrong_app_type): the workbook had Full planning only (''Full applications for chargeable/CIL
  liable uses (residential and retail)''). The s73 case (additional chargeable floorspace) is shown as
  officer discretion.'
review-status: unverified
field-status: {}
