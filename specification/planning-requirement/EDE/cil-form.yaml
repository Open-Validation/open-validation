reference: cil-form
local-authority: EDE
required-if:
  any:
  - condition:
      field: cil-liable
      value: true
      description: CIL liable development, including full and reserved matters applications for residential
        and retail uses, conversions and changes of use to residential or retail, and variations of condition
        adding chargeable floorspace.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Householder application with over 100 sq m of new build floorspace.
  - application-type:
      in:
      - ldc
  - all:
    - condition:
        field: residential-annexe
        value: true
        description: A residential annexe.
    - condition:
        field: new-build
        value: true
        description: Newly built (not a conversion).
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: Community Infrastructure Levy Regulations 2010; East Devon CIL Charging Schedule
source-text: Full applications for chargeable/CIL liable uses (residential and retail); Householder applications
  over 100sqm of new build floorspace; Reserved Matters applications following outline permission for
  chargeable/CIL liable uses (residential and retail); Conversions of buildings to residential or retail
  use; Applications for lawful development certificates; Application for a variation of condition if additional
  chargeable floorspace is proposed; Changes of use of to residential and/or retail; New build annexes;
  Any other development that is CIL liable.
must-include:
- item: The relevant additional information form(s) completed in full, signed and dated
  level: must
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 19. 'Community Infrastructure Levy – Additional
  Information Requirement Form'.
review-status: unverified
field-status: {}
