reference: affordable-housing-statement
local-authority: EDE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major residential or mixed-use development of 10 or more dwellings.
  - condition:
      field: rural-exception-housing
      value: true
      description: Residential development on a rural exception site.
  - condition:
      field: existing-affordable-housing
      value: true
      description: Development of an existing affordable housing site.
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 Strategies 34 and 35; Affordable Housing SPD
source-text: Major planning applications for residential or mixed-use development of 10 or more dwellings;
  Residential development on rural exception sites; Development of existing affordable housing sites.
must-include:
- item: The number of residential units existing and proposed
  level: should
- item: The mix of units, with numbers of habitable rooms and bedrooms and the floorspace of habitable
    areas
  level: should
- item: A plan or clear description of the location of the affordable units
  level: should
- item: A clear and full explanation of any different levels or types of affordability or tenure
  level: should
- item: 'Exception sites (Strategy 35): housing need evidence supporting the affordable housing proposed'
  level: should
  required-if:
    condition:
      field: rural-exception-housing
      value: true
      description: A rural exception site.
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 17. The statement can form part of the Design
  and Access Statement or Heads of Terms. Like every report in section 3, the list adds that requests
  'will be proportionate to the nature and scale of the development proposals and will only be requested
  where the Local Planning Authority consider it relevant, necessary and material to the application in
  question'.
review-status: unverified
field-status: {}
