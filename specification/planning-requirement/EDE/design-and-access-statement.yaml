reference: design-and-access-statement
local-authority: EDE
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 square metres or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://eastdevon.gov.uk/media/3724737/validation-checklist-document-oct-22.pdf
source-text: 'Design and Access Statement (where required) 2.14 Design and Access Statements are required
  for the following: • • • 2.15 Planning Permission for major development Planning Permission for development
  in a conservation area or world heritage site consisting of the provision of one or more dwelling houses
  or the provision of a building(s) where the floor space created is 100 square metres or more Applications
  for Listed Building Consent.'
confidence: medium
notes: The workbook's excerpt looks garbled; re-read the council's list. The council's list repeats the
  national rules (para 2.15).
