reference: design-and-access-statement
local-authority: EDE
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a conservation area or world heritage site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwelling houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 sq m or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Planning Permission for major development Planning Permission for development in a conservation
  area or world heritage site consisting of the provision of one or more dwelling houses or the provision
  of a building(s) where the floor space created is 100 square metres or more Applications for Listed
  Building Consent.
must-include:
- item: 'For listed building consent: a brief explanation of how the design has taken into account the
    historic and special architectural importance of the building, the physical features that justify
    its listing and its setting; any specific issues arising because the building is listed; and, if inclusive
    design is not possible, why'
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted 7 October 2022), pages 8-9. Section 2 (National Requirements),
  paragraphs 2.14 to 2.16. The list also repeats the national (DMPO) contents of a Design and Access Statement,
  which are not repeated here.
review-status: unverified
field-status: {}
