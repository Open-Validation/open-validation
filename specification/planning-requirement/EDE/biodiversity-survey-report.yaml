reference: biodiversity-survey-report
local-authority: EDE
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - local-wildlife-site
      description: The site is in or near a designated site (SSSI, SAC, LNR etc.).
  - condition:
      field: demolition
      value: true
      description: Site clearance, or demolition of older buildings or works to roof spaces.
  - discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
source-text: 'Biodiversity Survey and Report Required for the following types of application/development:
  Where there is a reasonable likelihood that any important biodiversity or geological conservation feature
  may be present or nearby and where they are likely to be affected by the proposal.'
must-include:
- item: Any further surveys identified by a Phase 1 Ecological Survey (or similar report) as needed before
    commencement
  level: must
  source-text: Where a Phase 1 Ecological Survey (or similar Ecological Report) identifies the need for
    further surveys before commencement of development, these further surveys will be required for validation
    purposes.
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the workbook split this between an unmapped ''Biodiversity
  Checklist'' row and this one. From the audit: the list also names designated sites and site clearance
  / demolition of older buildings or roof spaces, and it applies to householder and listed building works
  too.'
review-status: unverified
field-status: {}
