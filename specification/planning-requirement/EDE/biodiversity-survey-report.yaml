reference: biodiversity-survey-report
local-authority: EDE
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - national-nature-reserve
      - local-wildlife-site
      description: In or next to a SSSI, Special Area of Conservation, National Nature Reserve, Site of
        Nature Conservation Interest, Local Nature Reserve or Wildlife Network Site.
  - condition:
      field: loss-of-habitat-features
      value: true
      description: Site clearance or removal of trees or hedgerows.
  - condition:
      field: demolition
      value: true
      description: Demolition of older buildings or roof spaces.
  - discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 Strategy 47
source-text: Where there is a reasonable likelihood that any important biodiversity or geological conservation
  feature may be present or nearby and where they are likely to be affected by the proposal. In or adjacent
  to a Site of Special Scientific Interest (SSSI). In or adjacent to a Site of Nature Conservation Interest
  (SNCI). In or adjacent to a National Nature Reserve (NNR). In or adjacent to a Local Nature Reserve
  (LNR). In or adjacent to a Wildlife Network Site (WNS). In or adjacent to a Special Area of Conservation
  (SAC) Proposals involving site clearance, removal of trees, removal of hedgerows, demolition of older
  buildings or roof spaces.
must-include:
- item: By a suitably qualified ecological consultant, carried out at an appropriate time of year and
    within a year of the date of the application
  level: must
- item: Existing nature conservation interest of the site and adjacent land, and the possible impacts
    on the habitats and species present
  level: should
- item: Information supporting any proposed mitigation and/or compensation measures
  level: must
- item: 'Where works may affect protected or notable species: use of the site by those species, potential
    impacts and mitigation'
  level: must
- item: Any further surveys that a Phase 1 Ecological Survey (or similar report) says are needed before
    commencement
  level: must
  source-text: Where a Phase 1 Ecological Survey (or similar Ecological Report) identifies the need for
    further surveys before commencement of development, these further surveys will be required for validation
    purposes.
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 18. 'A reasonable likelihood that any important
  biodiversity or geological conservation feature may be present' shows as discretionary. 'Older buildings'
  is not defined. The list predates statutory biodiversity net gain and does not mention it. Like every
  report in section 3, the list adds that requests 'will be proportionate to the nature and scale of the
  development proposals and will only be requested where the Local Planning Authority consider it relevant,
  necessary and material to the application in question'.
review-status: unverified
field-status: {}
