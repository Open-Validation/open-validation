reference: sustainable-drainage-strategy
local-authority: EDE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Residential development of 10 or more units.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Other development of 1,000 sq m or more floorspace.
  - site:
      in:
      - critical-drainage-area
      description: Development within a Critical Drainage Area.
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies D1 and EN22
source-text: Residential development of 10 or more units and other development of 1000sqm or more floorspace;
  Development within Critical Drainage Areas.
must-include:
- item: Description of the type of development
  level: must
- item: Location plan at an appropriate scale with a grid reference, showing geographical features, street
    names, watercourses or other water bodies nearby
  level: must
- item: Site plan showing the red line boundary and any land under the applicant's control
  level: must
- item: Site survey showing the existing topography
  level: must
- item: Assessment of all existing flood risks to the site, including from sewer networks, groundwater,
    overland surface water flows, reservoirs, ponds, canals and other watercourses
  level: must
- item: Non-technical summary of the proposed surface water drainage management system
  level: must
- item: Calculations of the current and proposed surface water runoff from the site
  level: must
- item: Calculations of the surface water attenuation storage volume required for the 1 in 100 (+40% allowance
    for climate change) year rainfall event
  level: must
- item: Evidence that the site has an agreed point of discharge
  level: must
- item: Evidence that the drainage hierarchy has been followed (infiltration or soakaway; watercourse
    or highway ditch; surface water sewer or highway drain; combined sewer, with written permission where
    needed), with robust explanations of the viability of each
  level: must
- item: Explanations of flood risk mitigation measures for the entire site
  level: must
- item: Explanation of the likely surface water drainage management system for the site
  level: must
- item: Plans of the proposed site layout showing that the surface water drainage system is practical
    and sustainable
  level: must
- item: Plans showing viable surface water attenuation storage locations within the site
  level: must
- item: Detailed operation and maintenance plan and timetable for the surface water drainage system over
    the lifetime of the development
  level: must
- item: Details of proposed community signage and engagement activities relevant to the surface water
    drainage system
  level: must
confidence: medium
notes: From the council's list (adopted 7 October 2022), pages 43-45. The list gives the same contents
  for outline and for other applications. The strategy can be combined with the FRA and should form part
  of the Green Infrastructure Plan/Framework if one is needed. Like every report in section 3, the list
  adds that requests 'will be proportionate to the nature and scale of the development proposals and will
  only be requested where the Local Planning Authority consider it relevant, necessary and material to
  the application in question'.
review-status: unverified
field-status: {}
