reference: land-contamination-assessment
local-authority: EDE
required-if:
  all:
  - any:
    - site:
        in:
        - contaminated-land
        description: Contamination is known or suspected on the site, or the site is near such land.
    - discretionary
  - condition:
      field: ground-disturbance
      value: true
      description: Ground works are proposed.
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policy EN16
source-text: All applications where contamination is known or suspected or the development site is in
  the vicinity of such land, and ground works are proposed.
must-include:
- item: By a suitably qualified person, determining whether contaminated land exists, its nature, the
    risks it may pose to the development, and whether remedial measures can reduce it to an acceptable
    level
  level: must
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 30. 'Suspected' contamination also shows
  as discretionary. Like every report in section 3, the list adds that requests 'will be proportionate
  to the nature and scale of the development proposals and will only be requested where the Local Planning
  Authority consider it relevant, necessary and material to the application in question'.
review-status: unverified
field-status: {}
