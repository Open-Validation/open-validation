reference: floor-plan-proposed
local-authority: EDE
required-if: discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: These drawings should accurately show the layout of the building. Applications will usually
  require both existing and proposed floor plans.
must-include:
- item: Scale of 1:100 or 1:50, with a scale bar at the appropriate scale
  level: must
- item: Clearly annotated 'existing' and 'proposed'
  level: must
- item: All floor levels, including any basement or rooms in a roof being constructed, altered, extended
    or demolished, with each floor clearly labelled (e.g. ground floor, first floor)
  level: must
- item: The use of each room, and the position, thickness and size of window and door openings, walls,
    partitions and chimneys
  level: must
- item: Direction of north
  level: must
- item: Anything to be demolished
  level: must
- item: Any encroachment (e.g. foundations) onto an adjoining property clearly shown and annotated, if
    the building is near a boundary
  level: must
- item: Not simple line drawings
  level: must
- item: 'Internal alterations: plans of the proposed layout, including the location of the room(s) in
    relation to the rest of the property'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: internal-alterations
        description: Listed building consent for internal alterations.
confidence: medium
notes: From the council's list (adopted 7 October 2022), pages 10-11, 54. The list gives no trigger beyond
  'Applications will usually require both existing and proposed floor plans', so the requirement shows
  as discretionary.
review-status: unverified
field-status: {}
