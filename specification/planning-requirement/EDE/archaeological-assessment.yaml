reference: archaeological-assessment
local-authority: EDE
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      description: The proposal is likely to affect a Scheduled Monument.
  - discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies EN6 and EN7
source-text: Applications where there is potential for archaeological implications; Where a proposal is
  likely to affect a Scheduled Monument; or As advised by the County Archaeologist.
must-include:
- item: By a suitably qualified person
  level: must
- item: A desk-based assessment of all known records for the area, to gauge the archaeological potential
    of the site
  level: should
- item: How any archaeological potential will be protected from development
  level: should
- item: Reports of any necessary geophysical survey or field excavation, recording any features and deposits
  level: should
- item: Clarification of any work required on site before or after planning
  level: should
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 16. 'Archaeology Assessment'. 'Potential
  for archaeological implications' and 'As advised by the County Archaeologist' show as discretionary;
  the list advises speaking to the County Archaeologist. Like every report in section 3, the list adds
  that requests 'will be proportionate to the nature and scale of the development proposals and will only
  be requested where the Local Planning Authority consider it relevant, necessary and material to the
  application in question'.
review-status: unverified
field-status: {}
