source-text: Screening and Scoping Opinions can be submitted to determine if applications require an Environmental
  Impact Assessment. Where an EIA have been required for an outline application a subsequent EIA may be
  required for the related Reserve Matters application and where developments are phased, updates to the
  Environmental Statements may be required.
