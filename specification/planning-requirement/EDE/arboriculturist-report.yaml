reference: arboriculturist-report
local-authority: EDE
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within falling distance of the development, or trees or hedges to be removed or
      pruned to carry out the development.
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
source-text: 'Tree Survey/Arboricultural Impact Assessment & Method Statements Required for the following
  types of application/development: Householder applications - Where there are trees within falling distance
  of the proposed development and/or where trees or hedges will need to be removed or pruned in order
  to carry out the development, a Tree Survey and AIA information in accordance with BS 5837:2012 or any
  superseding standard will be required.'
must-include:
- item: Tree Survey and AIA information in accordance with BS 5837:2012
  level: must
- item: Survey findings shown on the existing and proposed site plans, or on a single plan at a scale
    no smaller than 1:200
  level: should
  source-text: Depending on the number of trees and scale of development details could be annotated on
    existing and proposed site plans, or take the form of a single plan at an appropriate scale (no smaller
    than 1:200) with the finding of the survey included.
confidence: medium
notes: 'Audit (wrong_app_type): the workbook had Householder only. The list also covers ''Major Full,
  Outline or Reserve Matters applications'' and minor applications; the audit doesn''t give their wording,
  so the householder trigger is used for all.'
review-status: unverified
field-status: {}
