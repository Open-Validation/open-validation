reference: arboriculturist-report
local-authority: EDE
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees within falling distance of the proposed development, or trees to be removed
            or pruned.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedges to be removed or pruned to carry out the development.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees on the site or in close proximity to the site boundary.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedges on the site.
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies D1, D2 and D3
source-text: Householder applications - Where there are trees within falling distance of the proposed
  development and/or where trees or hedges will need to be removed or pruned in order to carry out the
  development, a Tree Survey and AIA information in accordance with BS 5837:2012 or any superseding standard
  will be required. ... Full, Outline or Reserve Matters Minor applications - For development proposals
  on sites with trees and/or hedges, or where trees are in close proximity to the site boundary, a Tree
  Survey and AIA in accordance with BS 5837:2012 or any superseding standard will be required.
must-include:
- item: Tree Survey and Arboricultural Impact Assessment in accordance with BS 5837:2012 or any superseding
    standard
  level: must
- item: By a suitably qualified arboriculturist, assessing the impact on trees during and after construction,
    including any mitigation
  level: must
- item: Species, spread, roots and position of the trees, with an accurate scaled site plan
  level: should
- item: A plan of any trees to be felled, new tree planting and how retained trees will be protected during
    construction
  level: should
- item: 'Where details are shown on a plan instead of a report: annotated existing and proposed site plans,
    or a single plan (A3 for householder applications) no smaller than 1:200 with the survey findings
    in the plan text'
  level: must
- item: 'Where retained trees or hedges could be damaged by the development: a Tree Protection Plan (TPP)
    and Arboricultural Method Statement (AMS) in accordance with BS 5837:2012, showing the location and
    specification of the tree protection measures'
  level: must
  source-text: Where trees or hedges will be retained and could be damaged by carrying out the proposed
    development, there will be a requirement to produce a TPP and AMS in accordance with BS 5837:2012
    or any superseding standard.
- item: 'Major applications: a standalone document incorporating the TPP, AMS and Site Monitoring Log'
  level: should
  required-if:
    ref: major-development
- item: An Arboricultural Method Statement where works are proposed within Root Protection Areas
  level: should
confidence: medium
notes: From the council's list (adopted 7 October 2022), pages 49-50. 'Tree Survey/Arboricultural Impact
  Assessment & Method Statements'. The list sets out the same trigger for minor and major full, outline
  and reserved matters applications; for more complex minor schemes 'a standalone Arboricultural report
  may be more appropriate'. Like every report in section 3, the list adds that requests 'will be proportionate
  to the nature and scale of the development proposals and will only be requested where the Local Planning
  Authority consider it relevant, necessary and material to the application in question'.
review-status: unverified
