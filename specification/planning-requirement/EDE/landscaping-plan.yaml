reference: landscaping-plan
local-authority: EDE
required-if:
  any:
  - discretionary
  - all:
    - ref: major-development
    - application-type:
        in:
        - full
    - condition:
        field: landscaping-works
        value: true
        description: Strategic landscaping forms part of the proposal or is needed to mitigate its impacts
          (including major housing and employment development and solar farms).
  - all:
    - ref: major-development
    - application-type:
        in:
        - outline
    - condition:
        field: landscaping-works
        value: true
        description: Landscaping is being applied for (not reserved) at outline stage.
  - condition:
      field: minor-development
      value: true
      description: A minor application (fewer than 10 dwellings or a residential site under 0.5 ha; under
        1,000 sq m or a site under 1 ha).
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies D1, D2, D3, EN5, EN22, RC2 and TC4
source-text: 'This plan should show existing and proposed landscaping including existing and proposed
  tree planting and hard landscaping such as patios and paths. Usually an existing and proposed plan is
  required. ... all major full applications where strategic landscaping forms part of the proposal or
  is required to mitigate the impacts of development including Major Housing and Employment development
  and Solar Farms; all major outline applications where Landscaping is being discharged. ... For: Minor
  applications we will require a Green Infrastructure Plan showing the existing and proposed boundary
  treatment(s) and boundary planting types as seen ... from the public realm or as experienced by neighbouring
  properties detailing how this relates to the development and any adjoining uses and green infrastructure.'
must-include:
- item: Position and canopy spread of existing trees, with how they will be protected during construction
  level: must
- item: Any trees to be felled or cut back
  level: must
- item: Existing landscaping, including hard surfacing
  level: must
- item: All new hard and soft landscaping, including size, species and density of planting
  level: must
- item: Position and extent of natural or made features such as banks/terracing, ditches, ponds or watercourses
  level: must
- item: 'New tree planting: planting pit design, tree specifications (species, size and nursery production
    system), planting methodology, irrigation and maintenance, in line with the latest BS 8545'
  level: must
- item: 'Green Infrastructure Plan (major applications): open space on the site; connections to surrounding
    land; how it relates to the FRA and incorporates SuDS features'
  level: should
  required-if:
    ref: major-development
- item: 'Green Infrastructure Plan (major applications): site topography and levels; soil testing results;
    cross-sections of proposed banks, including materials'
  level: should
  required-if:
    ref: major-development
- item: 'Green Infrastructure Plan (major applications): root protection areas of existing trees; number
    of new plants; tree planting pits; existing and proposed boundary treatment'
  level: should
  required-if:
    ref: major-development
- item: 'Outline applications with landscaping reserved: a Green Infrastructure framework setting out
    the principles (key open space, links and routes, SuDS, planting areas), how it responds to existing
    site conditions and how it integrates with the masterplan and layout'
  level: must
  required-if:
    all:
    - ref: major-development
    - application-type:
        in:
        - outline
- item: 'Minor applications: existing and proposed boundary treatment(s) and boundary planting types as
    seen from the public realm or by neighbours, and how they relate to the development and adjoining
    uses'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: A minor application.
confidence: medium
notes: From the council's list (adopted 7 October 2022), pages 12, 25-26. Combines 'Landscape Plans and
  Details' (page 12) and the 'Green Infrastructure Plan' (pages 25-26). The landscape plan has no trigger
  beyond 'Usually an existing and proposed plan is required', so that part shows as discretionary. The
  Green Infrastructure Plan items apply 'where necessary'. 'Minor' is the list's own definition (page
  13). Like every report in section 3, the list adds that requests 'will be proportionate to the nature
  and scale of the development proposals and will only be requested where the Local Planning Authority
  consider it relevant, necessary and material to the application in question'.
review-status: unverified
field-status: {}
