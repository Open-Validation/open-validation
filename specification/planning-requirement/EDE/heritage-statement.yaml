reference: heritage-statement
local-authority: EDE
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      - battlefield
      - conservation-area
      description: The proposal affects a listed or locally listed building (or its curtilage), a scheduled
        monument, historic park, garden or battlefield, or a conservation area.
  - discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies D1, EN9 and EN10
source-text: Applications for planning permission affecting a nationally or locally listed building, heritage
  asset or its curtilage; Applications for Listed Buildings; Planning applications affecting a Conservation
  Area or its setting.
must-include:
- item: Statement of significance of the heritage asset, including any contribution made by its setting,
    proportionate to the asset's importance
  level: must
  source-text: 'A complete Statement must include: ... Statement of significance of the heritage asset
    Details of the proposal Analysis of the impact of the proposal on the significance (including a statement
    of need & statement of impact)'
- item: Details of the proposal
  level: must
- item: Analysis of the impact of the proposal on the significance, including a statement of need and
    a statement of impact
  level: must
- item: The relevant historic environment record consulted and the heritage assets assessed using appropriate
    expertise where necessary
  level: should
- item: 'For works to a listed building: a written schedule of works to the heritage asset, a Statement
    of Significance (if not separate) and an assessment of any impact on adjacent listed buildings'
  level: should
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: Works to a listed building.
- item: 'For applications in a conservation area: an analysis of the character and appearance of the building/structure,
    the principles of and justification for the proposed demolition, and its impact on the special character
    of the area'
  level: should
  required-if:
    site:
      in:
      - conservation-area
      description: The site is in a conservation area.
- item: 'For works related to or affecting the setting of heritage assets: an assessment of the impact
    on the heritage assets and how this has been addressed'
  level: should
- item: 'Thatching: justification for any change of materials or ridge details'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: thatching
        description: Listed building consent for thatching.
- item: 'Re-roofing, render or internal alterations: justification for the works'
  level: must
  required-if:
    any:
    - all:
      - application-type:
          in:
          - lbc
      - condition:
          field: listed-building-works
          value: re-roofing
          description: Listed building consent for re-roofing in slate or tiles.
    - all:
      - application-type:
          in:
          - lbc
      - condition:
          field: listed-building-works
          value: render
          description: Listed building consent for render.
    - all:
      - application-type:
          in:
          - lbc
      - condition:
          field: listed-building-works
          value: internal-alterations
          description: Listed building consent for internal alterations.
- item: 'Replacement windows: justification explaining why the window(s) are beyond repair, with comparative
    quotes for repair and replacement'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: replacement-windows
        description: Listed building consent for replacement windows.
- item: 'Shopfronts: justification explaining why the shopfront is beyond repair, with comparative quotes
    for its replacement'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: shopfront
        description: Listed building consent for a shopfront.
- item: 'New flues, vents, extractors or chimneys: justification showing all other options have been explored
    (for example using existing chimneys)'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: flues-vents
        description: Listed building consent for new flues, vents, mechanical ventilation, extractors
          or chimneys.
confidence: medium
notes: From the council's list (adopted 7 October 2022), pages 8-9, 29, 53-55. Section 2 (Statement of
  Significance for listed building consent and proposals affecting a heritage asset), the local Heritage
  Statement (page 29) and section 4 (Additional local validation guidance for listed building consents).
  The list defines heritage assets as listed buildings, conservation areas, scheduled monuments, historic
  parks, gardens and battlefields, plus non-designated assets such as locally listed buildings and other
  historic buildings 'as determined by the Local Authority'; non-designated assets and the setting of
  a conservation area show as discretionary. The statement can be part of the Design and Access Statement
  if clearly identified. Like every report in section 3, the list adds that requests 'will be proportionate
  to the nature and scale of the development proposals and will only be requested where the Local Planning
  Authority consider it relevant, necessary and material to the application in question'.
review-status: unverified
field-status: {}
