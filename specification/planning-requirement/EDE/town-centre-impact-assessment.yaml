reference: town-centre-impact-assessment
local-authority: EDE
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use outside an existing town centre area defined by the Local Plan.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 500
      description: Over 500 sq m.
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policy E11
source-text: Proposals for main town centre uses that are in excess of 500sqm and are not in an existing
  town centre area as defined by the Adopted Local Plan.
must-include:
- item: By a suitably qualified person, assessing the impact on matters including the vitality and viability
    of the town centre, proportionate to the scale and nature of the proposal
  level: must
- item: The need for the development, whether it is of an appropriate scale, that there are no sites closer
    to a centre, that there are no unacceptable impacts on existing centres, and whether locations are
    accessible
  level: should
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 46. 'Retail Impact Assessment'. Like every
  report in section 3, the list adds that requests 'will be proportionate to the nature and scale of the
  development proposals and will only be requested where the Local Planning Authority consider it relevant,
  necessary and material to the application in question'.
review-status: unverified
field-status: {}
