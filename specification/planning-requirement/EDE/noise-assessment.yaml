reference: noise-assessment
local-authority: EDE
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: A use involving activities that may generate significant levels of noise.
  - all:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development next to major road/transport infrastructure or other
          significant sources of noise.
    - discretionary
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies D1 and EN14
source-text: For uses that involve activities that may generate significant levels of noise; For noise
  sensitive development adjacent to major road/transport infrastructure and other significant sources
  of noise
must-include:
- item: By a suitably qualified person
  level: should
- item: The existing noise environment, and the noise sources from the development or likely to affect
    it
  level: should
- item: Any mitigation measures
  level: should
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 35. 'Other significant sources of noise'
  has no measure, so the noise-sensitive part also shows as discretionary. Like every report in section
  3, the list adds that requests 'will be proportionate to the nature and scale of the development proposals
  and will only be requested where the Local Planning Authority consider it relevant, necessary and material
  to the application in question'.
review-status: unverified
field-status: {}
