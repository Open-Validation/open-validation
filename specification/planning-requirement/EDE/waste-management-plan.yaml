reference: waste-management-plan
local-authority: EDE
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 200
      description: 'Large scale major: 200 or more dwellings.'
  - condition:
      field: site-area-residential
      operator: '>='
      value: 4
      description: 'Large scale major: residential site area of 4 hectares or more.'
  - condition:
      field: floorspace
      operator: '>='
      value: 10000
      description: 'Large scale major: 10,000 sq m or more of floorspace.'
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 2
      description: 'Large scale major: a site of 2 hectares or more.'
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 policies D1 and EN14
source-text: All large scale major planning applications.
must-include:
- item: How waste at the construction stage, and waste produced as a result of the proposal, will be dealt
    with
  level: must
confidence: medium
notes: 'From the council''s list (adopted 7 October 2022), page 40. ''Site Waste Management Plan''. ''Large
  scale major'' uses the list''s own definition (page 14): 200 or more dwellings or a residential site
  of 4 ha or more; 10,000 sq m or more, or a site of 2 ha or more. Like every report in section 3, the
  list adds that requests ''will be proportionate to the nature and scale of the development proposals
  and will only be requested where the Local Planning Authority consider it relevant, necessary and material
  to the application in question''.'
review-status: unverified
field-status: {}
