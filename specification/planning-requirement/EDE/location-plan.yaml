reference: location-plan
local-authority: EDE
required-if:
  always: true
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include copies of a location plan based on an up-to-date Ordnance Survey
  Plan (please detail the license number on the plan) which is centered around the application site showing
  clear reference points such as road/street names and neighbouring properties.
must-include:
- item: Based on an up-to-date Ordnance Survey plan, with the licence number and an up-to-date copyright
  level: must
- item: Centred on the application site, showing clear reference points such as road/street names and
    neighbouring properties
  level: must
- item: Standard metric scale of 1:1250 with the scale clearly stated (1:2500 accepted in rural areas
    with no immediate reference points)
  level: must
- item: At least A4 size
  level: should
- item: Development site edged clearly with a red line
  level: must
- item: Red line includes all land needed to carry out the development, for example access to the public
    highway, visibility splays, areas around buildings and car parks
  level: should
- item: 'Where the site is detached from the public highway: the red line includes the means of access
    connecting the site to the public highway'
  level: must
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: must
- item: Direction of North, and enough roads and buildings to make the exact location of the site clear
  level: should
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 7. Section 2 (National Requirements), paragraphs
  2.8 to 2.11.
review-status: unverified
field-status: {}
