reference: viability-assessment
local-authority: EDE
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: The proposal does not offer the full policy compliant planning obligations.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The applicant considers the proposal would not be viable with the affordable housing
        contribution.
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: East Devon Local Plan 2013-2031 Strategies 34, 35 and 50
source-text: If the proposal is not offering the full policy compliant planning obligations, the application
  will need to be supported by a viability appraisal demonstrating why the proposal cannot meet the policy
  compliant obligations. ... If you feel that the proposal would not be viable with the inclusion of the
  affordable housing contribution, please provide a Heads of Terms along with a viability appraisal demonstrating
  why the proposal would not be viable with an affordable housing contribution.
must-include:
- item: Demonstrates why the proposal cannot meet the policy compliant obligations
  level: must
confidence: medium
notes: From the council's list (adopted 7 October 2022), pages 27, 51. From 'Heads of Terms' (page 27,
  all major development) and 'Unilateral Undertaking' (page 51).
review-status: unverified
field-status: {}
