reference: section-existing
local-authority: EDE
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: The site is on sloping or uneven land or adjoins land at a different level, or changes
      to ground levels are proposed.
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: These drawings should detail ground levels and cross sections and should accompany all applications
  on sloping or uneven land, sites adjoining land at a different level, or where changes to the ground
  level are proposed as part of the application.
must-include:
- item: 'Site levels plan: existing and proposed levels on the site, clearly showing any differences from
    adjoining land'
  level: must
- item: 'Site levels plan: spot ground levels plotted against a fixed and identifiable datum, usually
    Above Ordnance Datum (AOD)'
  level: must
- item: 'Site levels plan: finished floor levels of all buildings, and the location and extent of any
    trees and their root protection areas'
  level: must
- item: 'Sections: finished floor and ridge levels of buildings'
  level: must
- item: 'Sections: existing and proposed ground levels, showing cut and fill where proposed'
  level: must
- item: Sections through the land at 1:200 or 1:500, and through the building (for example where raised
    decks or patios are proposed) at 1:50 or 1:100
  level: must
- item: 'Sections: relationships to existing and proposed buildings and trees within and next to the site'
  level: must
- item: A plan showing the points through which the sections are taken, with the direction of North
  level: must
confidence: medium
notes: From the council's list (adopted 7 October 2022), page 11. 'Existing and Proposed Site Sections,
  Finished Floor and Site Levels'.
review-status: unverified
field-status: {}
