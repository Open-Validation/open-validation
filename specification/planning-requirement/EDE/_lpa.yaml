  status: outdated
submission-standards:
- item: All plans and drawings accurate, using a conventional metric scale such as 1:100 or 1:50; scales
    such as 1:75 are not accepted
  level: must
- item: Where more than one scale is used on a page, the scale of each drawing clearly indicated
  level: must
- item: All plans and drawings include a scale bar(s) at the appropriate scale(s)
  level: must
  source-url: https://eastdevon.gov.uk/planning/planning-permission/apply-for-planning-permission/general-validation-advice/
- item: Every plan based on Ordnance Survey maps (including copies) shows the licence number and an Ordnance
    Survey copyright notice no more than a year old
  level: must
- item: All existing and proposed layout plans show the direction of North
  level: must
- item: No disclaimers such as 'Do Not Scale' or 'Not To Scale' (perspectives excluded)
  level: must
- item: Annotations at a size that is clear and easy to read
  level: should
- item: Existing and proposed boundary treatment fully annotated
  level: should
- item: Documents covering more than one topic clearly titled to show this, e.g. 'Design and Access Statement
    and Flood Risk Assessment'
  level: should
- item: 'Good practice (not assessed for validation): A3 plans where possible; key measured dimensions;
    existing and proposed drawings side by side at the same scale; a plan schedule, updated with amendments;
    the location plan on a separate sheet; a title box with address, drawing title, scale, number and
    revision; amendments highlighted and dated, at the original scale'
  level: should
