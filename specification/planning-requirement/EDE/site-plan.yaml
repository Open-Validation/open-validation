reference: site-plan
local-authority: EDE
required-if:
  always: true
source-url: https://eastdevon.gov.uk/media/pugbu2ns/validation-checklist-document-oct-22-v2.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A site plan is required to show a detailed layout of the whole site and the relationship
  of the proposed works within the boundary of the site, nearby roads and neighbouring buildings and land.
  Most applications will require an existing and proposed site plan.
must-include:
- item: Existing and proposed site plans (most applications)
  level: should
- item: Ordnance Survey based, at a standard metric scale of 1:500 or 1:200
  level: should
- item: Up to date, showing the scale of the plan with a scale bar
  level: should
- item: Direction of North
  level: should
- item: Proposed development in relation to the site boundaries and other existing buildings on the site
  level: should
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: Vehicular and pedestrian access arrangements to and within the site
  level: should
- item: Species, position and spread of all trees on the site and of trees on adjacent land that overhang
    the site
  level: should
- item: Extent and type of any hard surfacing, such as car parking spaces
  level: should
- item: Boundary treatment, including wall/fence heights, and landscaping
  level: should
- item: Any buildings to be demolished
  level: should
- item: Any refuse storage areas
  level: should
- item: Natural features, including hedgerows, banks, ponds and watercourses
  level: should
confidence: medium
notes: From the council's list (adopted 7 October 2022), pages 7-8. Section 2 (National Requirements),
  paragraphs 2.12 and 2.13. The list puts the site plan among the plans every application must include
  ('This is considered to comprise a location plan and a site plan'). The contents are 'should' because
  the list says the plan 'should be up to date and accurately show' them.
review-status: unverified
field-status: {}
