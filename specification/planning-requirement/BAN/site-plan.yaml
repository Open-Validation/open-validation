reference: site-plan
local-authority: BAN
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - advertising
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-fish-struct
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The block plan (2 copies) should be drawn at an identified standard metric scale (1:500).
  It should show the proposed development in relation to the site boundaries and other existing buildings
  on the site, with metric dimensions specified including those to the boundaries.
must-include:
- item: Drawn at an identified standard metric scale (1:500)
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with metric dimensions including those to the boundaries
  level: should
- item: The direction of north
  level: should
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: All public rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site and on adjacent land
  level: should
- item: The extent and type of any hard surfacing
  level: should
- item: The boundary treatment, including walls or fencing, where proposed
  level: should
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Lawful Development Certificate (existing)'
  (ApplicationTypeId=13); 'Lawful Development Certificate (proposed)' (ApplicationTypeId=14). The adjoining-land
  items apply 'unless they would NOT influence or be affected by the proposed development'. For lawful
  development certificates the block plan is marked conditional (LC) with no trigger given, so it is shown
  as discretionary. Reserved matters plans include a block plan at 1:200 or 1:500 showing all site boundaries.
review-status: unverified
field-status: {}
