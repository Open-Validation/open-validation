    found
  status: outdated
submission-standards:
- item: All plans have a scale bar, key metric dimensions (distance from the site boundaries and size
    of the building), the original paper size and a north point
  level: must
- item: Plans clearly and consistently show existing and proposed works; discrepancies between plans (e.g.
    a window on a floor plan missing from the elevation) make the application invalid
  level: must
- item: 'No ''do not scale'' disclaimers: all plans and drawings must be able to be scaled from'
  level: must
- item: Ordnance Survey plans used only under licence; Land Registry plans, Google Maps and screen shots
    of plans are not acceptable
  level: must
- item: A3 size plans preferable; plans larger than A1 not accepted
  level: should
- item: Plans, drawings and documents in PDF format where possible
  level: should
- item: 'Paper submissions: 2 copies of each plan'
  level: should
- item: Signatures on application forms and certificates up to date; CIL form dated on or after the application
    date
  level: must
