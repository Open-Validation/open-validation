reference: landscaping-plan
local-authority: BAN
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
  - all:
    - application-type:
        in:
        - s73
        - pa-build-agri-forest
        - pa-road-agri-forest
        - pa-fish-struct
    - discretionary
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Basingstoke and Deane Local Plan 2011-2029 policy EM1; Landscape, Biodiversity and Trees SPD
source-text: For all full planning and outline applications and reserved matters where landscaping has
  not already been approved. Proposals to include details of proposals, long term maintenance and landscape
  management.
must-include:
- item: Details of the landscaping proposals, long term maintenance and landscape management
  level: must
- item: Existing and proposed levels, to show the impact on the landscape
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The existing site levels will change.
confidence: medium
notes: 'From the council''s list (undated web pages, one per application type, read 5 November 2026),
  pages ''Application for planning permission'' (ApplicationTypeId=2); ''Reserved matters'' (ApplicationTypeId=5);
  ''Removal or variation of a condition'' (ApplicationTypeId=6); ''Agricultural prior notification: building''
  (ApplicationTypeId=15). Reserved matters only where landscaping has not already been approved, and variation
  of condition and agricultural prior notifications list it as conditional with no trigger, so these are
  shown as discretionary. The householder wording (trees, hedges and landscape features affected) is not
  on the householder page itself.'
review-status: unverified
field-status: {}
