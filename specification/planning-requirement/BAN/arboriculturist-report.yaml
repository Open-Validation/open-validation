reference: arboriculturist-report
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - consent-under-tpo
      - notice-trees-in-con-area
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or hedgerows would be lost or affected by the development.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: BS 5837:2012; Basingstoke and Deane Local Plan 2011-2029 policy EM1; Landscape, Biodiversity and
  Trees SPD
source-text: Required for all applications where trees or hedgerows are proposed to be lost or would be
  affected by the development.
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Householder application' (ApplicationTypeId=1);
  'Outline, all matters reserved' (ApplicationTypeId=3); 'Outline, some matters reserved' (ApplicationTypeId=4);
  'Reserved matters' (ApplicationTypeId=5); 'Tree works' (ApplicationTypeId=11). Listed as 'Tree Survey/Arboricultural
  Implications'.
