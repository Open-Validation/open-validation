reference: land-contamination-assessment
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - contaminated-land
        description: Land known or suspected to be contaminated (all or part of the site).
    - condition:
        field: sensitive-end-use
        value: true
        description: A use particularly vulnerable to contamination, such as housing with gardens, schools
          and nurseries, or allotments.
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of a currently licensed or historic landfill site.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: National Planning Policy Framework (February 2019) Section 15; Basingstoke and Deane Local Plan
  2011-2029 policy EM12
source-text: 'Development on: ... land which is known to be contaminated ... land where contamination
  is suspected for all or part of the site ... Development for: ... A proposed use that would be particularly
  vulnerable to the presence of contamination for example ... housing with gardens ... schools and nurseries
  ... allotments ... Or within 250 metres of a currently licensed or historic landfill site.'
must-include:
- item: Enough information to determine the existence, nature and risks of contamination and whether they
    can be reduced to an acceptable level
  level: should
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4).
review-status: unverified
field-status: {}
