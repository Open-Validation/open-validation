reference: daylight-sunlight-assessment
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: building-height
      operator: '>'
      value: 4
      description: Buildings higher than 4 metres.
  - condition:
      field: distance-to-residential-boundary
      operator: <=
      value: 2
      description: Within 2 metres of the common boundary with a neighbouring residential property.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Basingstoke and Deane Local Plan 2011-2029 policy EM10
source-text: An assessment will be required if the proposed development involves the construction of buildings
  higher than 4 metres within 2 metres of the common boundary with any neighbouring residential property
  unless, given the orientation and relationship with the neighbouring property(s), there would be no
  impact.
must-include:
- item: Proportionate to the potential impact
  level: should
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4); 'Reserved matters' (ApplicationTypeId=5). Not
  needed where orientation and relationship to the neighbour mean there would be no impact.
review-status: unverified
field-status: {}
