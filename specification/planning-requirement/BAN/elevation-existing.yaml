reference: elevation-existing
local-authority: BAN
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - pa-build-agri-forest
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
  - application-type:
      in:
      - advertising
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 2 copies Scale 1:100/1:50. All plans to clearly and consistently show existing and proposed
  works.
must-include:
- item: Scale 1:100 or 1:50
  level: must
- item: Clearly and consistently show existing and proposed works
  level: must
- item: A scale bar, key metric dimensions (distance of the development from the site boundaries and size
    of the building), the original paper size and a north point
  level: must
- item: 'For advertisements: existing and proposed elevations at 1:50 or 1:100'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: 'From the council''s list (undated web pages, one per application type, read 5 November 2026),
  pages ''Application for planning permission'' (ApplicationTypeId=2); ''Advertisement'' (ApplicationTypeId=10);
  ''Lawful Development Certificate (existing)'' (ApplicationTypeId=13); ''Agricultural prior notification:
  building'' (ApplicationTypeId=15); ''Telecommunications prior notification'' (ApplicationTypeId=18).
  Mandatory for householder, full planning and listed building consent; mandatory local items for agricultural
  building and telecommunications prior notifications. Marked conditional (LC) with no trigger for lawful
  development certificates, and for reserved matters only ''as are necessary to deal with the matters
  reserved'', so both are shown as discretionary. Outline applications need only ''other plans and drawings
  or information necessary to describe the subject of the application'' (unmapped). Advertisement consent
  needs existing and proposed elevations.'
review-status: unverified
field-status: {}
