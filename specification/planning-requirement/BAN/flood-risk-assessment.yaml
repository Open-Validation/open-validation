reference: flood-risk-assessment
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Development of 1 hectare or greater in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development of 1 hectare or greater in Flood Zone 1.
    - site:
        in:
        - flood-risk-zone
        description: New development (including minor development and change of use) in Flood Zone 2 or
          3.
    - site:
        in:
        - surface-water-flood-risk
        description: Site has a record of localised or groundwater flooding in the SFRA.
    - site:
        in:
        - critical-drainage-area
        description: Site in or upstream of a critical drainage area.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: National Planning Policy Framework (February 2019) Section 14; Basingstoke and Deane Local Plan
  2011-2029 policy EM7
source-text: 'A Flood Risk Assessment (FRA) will be required for: ... development proposals of 1 hectare
  or greater in Flood Zone 1 ... all proposals for new development (including minor development and change
  of use) located in Flood Zones 2 and 3 as designated by the Environment Agency. ... sites that have
  a record of localised or groundwater flooding from the SFRA ... sites in critical drainage areas and
  upstream of critical drainage areas'
must-include:
- item: Risks of all forms of flooding to and from the development, and how they will be managed, taking
    climate change into account
  level: should
- item: Opportunities to reduce the probability and consequences of flooding
  level: should
- item: Design of surface water management systems, including sustainable drainage systems
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4). In a critical drainage area, development creating
  over 25 sq m of non-porous surface is likely to need an online assessment instead of a formal FRA (guidance,
  not a validation requirement).
review-status: unverified
field-status: {}
