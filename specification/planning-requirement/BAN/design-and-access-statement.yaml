reference: design-and-access-statement
local-authority: BAN
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more dwellinghouses.
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: A building or buildings creating 100 sq m or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Major application (except applications which are solely for engineering or mining operations,
  a material change of use of land or buildings, or variation of condition application) ... Applications
  of one or more dwellinghouses in a conservation area ... Applications consisting of the provision of
  a building or buildings where the floorspace created by the development is 100 square metres or more
  in a conservation area ... All applications for listed building consent
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Listed building consent' (ApplicationTypeId=9);
  'Householder and Listed Building' (ApplicationTypeId=22). Major applications solely for engineering
  or mining operations, a material change of use or a variation of condition are excepted.
review-status: unverified
field-status: {}
