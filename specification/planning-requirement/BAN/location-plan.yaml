reference: location-plan
local-authority: BAN
required-if:
  application-type:
    in:
    - hh
    - pa-extension
    - full
    - outline
    - reserved-matters
    - s73
    - lbc
    - advertising
    - ldc
    - pa-ecomms-network
    - pip
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 2 copies of a plan which identifies the land to which the application relates drawn to an
  identified standard metric scale (typically 1:1250 or 1:2500 for larger sites)
must-include:
- item: Drawn to an identified standard metric scale (typically 1:1250 or 1:2500 for larger sites)
  level: must
- item: The direction north
  level: should
- item: Sufficient roads and/or buildings on land adjoining the application site
  level: should
- item: The application site boundary and all land needed to carry out the development (including access
    from the road) outlined in red
  level: should
- item: A blue line around any other land owned by the applicant close to or adjacent to the property
  level: should
- item: 'Ordnance Survey map: not a Land Registry document, not used for multiple applications, shows
    OS Crown copyright and the correct licence number, not a photocopy or screen grab, and hand-drawn
    maps not copied from OS mapping'
  level: should
- item: 'For advertisements: the location of the site by reference to at least two named roads, the proposed
    position of the advertisement and the direction of North'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Householder application' (ApplicationTypeId=1);
  'Advertisement' (ApplicationTypeId=10). Listed (as Location Plan, Householder Location Plan or within
  Advertisement drawings) on the pages for householder, householder prior approval, full, outline, reserved
  matters, variation of condition, listed building consent, advertisement, both lawful development certificates,
  telecommunications prior notification and permission in principle. The list says the plan 'should show'
  its contents, so they are shown as 'should'.
review-status: unverified
field-status: {}
