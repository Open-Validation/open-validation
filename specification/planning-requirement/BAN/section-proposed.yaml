reference: section-proposed
local-authority: BAN
required-if:
  all:
  - any:
    - application-type:
        in:
        - hh
        - full
        - lbc
    - all:
      - application-type:
          in:
          - ldc-prospective-use
          - reserved-matters
      - discretionary
  - condition:
      field: change-in-ground-levels
      value: true
      description: The site is not level.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed site sections and finished floor and site levels (for example at a
  scale of 1:50 or 1:100) if the site is not level, if the site is level written confirmation of this
must-include:
- item: Existing and proposed site sections with finished floor and site levels
  level: must
- item: For example at a scale of 1:50 or 1:100
  level: should
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Lawful Development Certificate (proposed)'
  (ApplicationTypeId=14); 'Reserved matters' (ApplicationTypeId=5). If the site is level, written confirmation
  of this is needed instead. Conditional (LC, no trigger) for proposed-use lawful development certificates
  and needed for reserved matters only where relevant to the matters reserved, so shown as discretionary.
review-status: unverified
field-status: {}
