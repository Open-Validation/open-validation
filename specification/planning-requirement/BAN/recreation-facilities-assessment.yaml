reference: recreation-facilities-assessment
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of existing public or private open space.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: National Planning Policy Framework (February 2019) Section 8; Basingstoke and Deane Local Plan
  2011-2029 policies CN7, CN8 and EM5; Green Infrastructure Strategy; Landscape, Biodiversity and Trees
  SPD
source-text: Any development involving loss of existing public or private open space.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the site
  level: should
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4). Listed as 'Open Space Assessment'.
review-status: unverified
field-status: {}
