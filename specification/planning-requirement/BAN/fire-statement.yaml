reference: fire-statement
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The relevant building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The relevant building contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Relevant buildings are defined as containing two or more dwellings or educational accommodation
  and meet the height condition of 18metres or more in height, or 7 or more storeys.
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Reserved matters' (ApplicationTypeId=5).
  Covers the provision of relevant buildings, development of an existing relevant building and development
  within its curtilage; changes of use that stop a building being a relevant building are exempt.
review-status: unverified
field-status: {}
