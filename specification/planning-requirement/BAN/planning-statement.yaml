reference: planning-statement
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Farm diversification, or reuse of agricultural buildings.
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New residential development.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Policies of the Basingstoke and Deane Local Plan 2011-2029 and relevant Supplementary Planning
  Documents
source-text: 'Required for: ... farm diversification proposals ... proposals for reuse of agricultural
  buildings ... For major planning applications for new residential development details are required of
  the proposed provision for new pedestrian routes and access opportunities for residents, both within
  the proposed development and to form linkages to the wider path network beyond the application site.'
must-include:
- item: 'For major residential development: the proposed new pedestrian routes and access within the development
    and links to the wider path network'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development.
- item: 'For more than 10 dwellings or industrial sites over 1,500 sq m: comments on crime prevention
    through environmental design, using the council''s Crime Prevention form'
  level: should
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: More than 10 dwellings.
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 1500
        description: Industrial sites over 1,500 sq m.
- item: 'For farm diversification and reuse of farm buildings: reference to the council''s guidance (Heritage
    SPD Appendix A)'
  level: should
  required-if:
    condition:
      field: agricultural-building-reuse
      value: true
      description: Farm diversification, or reuse of agricultural buildings.
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4); 'Reserved matters' (ApplicationTypeId=5); 'Removal
  or variation of a condition' (ApplicationTypeId=6). The Construction Statement part is under sustainability-statement.
review-status: unverified
field-status: {}
