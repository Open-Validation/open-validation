reference: lighting-assessment
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - advertising
  - condition:
      field: external-lighting
      value: true
      description: Significant external lighting, for example flood lighting, lit car parking areas or
        new street lighting.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: National Planning Policy Framework (February 2019) Section 15; Basingstoke and Deane Local Plan
  2011-2029 policies EM1 and EM10; ILE Guidance Notes for the Reduction of Obtrusive Light (2005)
source-text: Where significant external lighting is proposed, for example flood lighting, lit areas of
  car parking, new street lighting.
must-include:
- item: Details of the external lighting and the hours when it would be switched on
  level: should
- item: A layout plan with beam orientation
  level: must
- item: A schedule of the equipment in the design
  level: must
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4); 'Reserved matters' (ApplicationTypeId=5); 'Advertisement'
  (ApplicationTypeId=10).
review-status: unverified
field-status: {}
