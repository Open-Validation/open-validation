reference: heritage-statement
local-authority: BAN
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - scheduled-monument
          - park-and-garden
          - archaeological-priority-area
          description: Archaeological or historical features or remains may be affected (heritage assets,
            their setting, or an Area of Archaeological Potential).
      - discretionary
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: National Planning Policy Framework (February 2019) Section 16; Basingstoke and Deane Local Plan
  2011-2029 policy EM11; Heritage SPD
source-text: Where archaeological or historical features or remains may be affected.
must-include:
- item: 'For listed building consent: a schedule of works, an analysis of the significance of archaeology,
    history and character of the building, and the principles of and justification for the works and their
    impact on its special character and setting'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'For proposals related to or affecting the setting of heritage assets: plans showing historic
    features on or next to the site, an analysis of significance, and the justification for and impact
    of the works'
  level: should
  required-if:
    site:
      in:
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      description: Related to or affecting the setting of heritage assets.
- item: 'Within or adjacent to a conservation area: an assessment of the impact on the character and appearance
    of the area'
  level: should
  required-if:
    site:
      in:
      - conservation-area
      description: Within or adjacent to a conservation area.
- item: An assessment of existing archaeological information
  level: should
  required-if:
    all:
    - condition:
        field: ground-disturbance
        value: true
        description: Disturbance of ground.
    - any:
      - site:
          in:
          - archaeological-priority-area
          description: Within an Area of Archaeological Potential.
      - ref: major-development
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4); 'Listed building consent' (ApplicationTypeId=9);
  'Householder and Listed Building' (ApplicationTypeId=22). Mandatory for listed building consent (LM);
  conditional for full and outline. Whether features 'may be affected' outside mapped heritage assets
  is the council's judgement, shown as discretionary.
review-status: unverified
field-status: {}
