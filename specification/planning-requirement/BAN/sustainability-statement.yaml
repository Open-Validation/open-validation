reference: sustainability-statement
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New homes, including replacement dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: New non-residential development of 1,000 sq m gross floor area or more.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Basingstoke and Deane Local Plan 2011-2029 policies EM8, EM9 and EM10
source-text: 'In relation to Water Consumption a Construction Statement is required for: a) New homes
  (including replacement dwellings) meet a water efficiency standard of 110 litres or less per person
  per day; b) New non-residential development of 1000sqm gross floor area or more meet the BREEAM ‘excellent’
  standards for water consumption.'
must-include:
- item: How the development has been designed to incorporate renewable energy and the impacts of climate
    change to achieve BREEAM 'very good'
  level: must
- item: 'New homes: a water efficiency standard of 110 litres or less per person per day'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New homes, including replacement dwellings.
- item: 'New non-residential development of 1,000 sq m or more: BREEAM ''excellent'' standards for water
    consumption'
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: New non-residential development of 1,000 sq m gross or more.
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4); 'Reserved matters' (ApplicationTypeId=5). Listed
  as 'Planning Statement - Construction Statement'.
review-status: unverified
field-status: {}
