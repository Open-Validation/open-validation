reference: town-centre-impact-assessment
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use providing additional floorspace, not in an existing centre and
        not in accordance with an up to date local plan.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: National Planning Policy Framework (February 2019) Section 7; Planning Practice Guidance (Ensuring
  the vitality of town centres); Basingstoke and Deane Local Plan 2011-2029 policy EP3
source-text: 'Where the proposed development is not in an existing centre and not in accordance with an
  up to date local plan, the following will be required: ... (i) An impact assessment for retail, office
  and leisure proposals with a floor area greater than 250sq metres (gross) will be required; ... (ii)
  A sequential test, except for small scale rural offices or other small scale rural development'
must-include:
- item: An impact assessment
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 250
      description: Retail, office and leisure proposals over 250 sq m (gross).
- item: A sequential test (except for small scale rural offices or other small scale rural development)
  level: must
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4). Also applies where internal alterations need
  planning permission and to applications varying conditions on the range of goods.
review-status: unverified
field-status: {}
