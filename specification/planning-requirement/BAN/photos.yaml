reference: photos
local-authority: BAN
required-if:
  any:
  - application-type:
      in:
      - lbc
      - pa-demo-building
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition of an existing building.
      - site:
          in:
          - conservation-area
          - listed-building
          - listed-building-setting
          description: Development affecting a conservation area or a listed building.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Planning Practice Guidance; Basingstoke and Deane Local Plan 2011-2029 policy EM11
source-text: Photographs should be provided if the proposal involves the demolition of an existing building
  or development affecting a conservation area or a listed building. ... Required for any heritage related
  application. Otherwise strongly encouraged as part of Design and Access statement.
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Listed building consent' (ApplicationTypeId=9);
  'Prior notification of demolition' (ApplicationTypeId=19); 'Householder and Listed Building' (ApplicationTypeId=22).
  Mandatory local item for listed building consent and prior notification of demolition; conditional for
  full, outline and reserved matters.
