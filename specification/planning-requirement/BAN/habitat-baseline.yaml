reference: habitat-baseline
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The permission would be subject to the biodiversity gain condition.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Schedule 7A, Town and Country Planning Act 1990
source-text: 'Where the development is subject to the Biodiversity Gain Condition the statement should
  contain the following: ... a plan, drawn to an identified scale which must show the direction of North,
  showing onsite habitat existing on the date of application (or and earlier date), including any irreplaceable
  habitat'
must-include:
- item: Drawn to an identified scale
  level: must
- item: Shows the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or an earlier date)
  level: must
- item: Any irreplaceable habitat
  level: must
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4). Part of the 'Biodiversity Net Gain Statement'
  (mandatory national item). Shown with the biodiversity gain condition because householder and other
  exempt development are exempt by law.
review-status: unverified
field-status: {}
