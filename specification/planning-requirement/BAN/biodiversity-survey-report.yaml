reference: biodiversity-survey-report
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - local-wildlife-site
        description: Likely to affect a local, national or European designated site.
    - condition:
        field: protected-species
        value: true
        description: Likely to impact on a designated protected species.
    - condition:
        field: demolition
        value: true
        description: Demolition of older buildings.
    - condition:
        field: roof-alteration
        value: true
        description: Alterations to roof spaces.
    - condition:
        field: agricultural-building-reuse
        value: true
        description: Conversion or alteration of barns.
    - condition:
        field: loss-of-habitat-features
        value: true
        description: Removal of, or effect on, trees, scrub, hedgerows or ponds.
    - condition:
        field: near-watercourse
        value: true
        description: Alterations to water courses.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: National Planning Policy Framework (February 2019) Section 15; Circular 06/2005; Basingstoke and
  Deane Local Plan 2011-2029 policies EM1 and EM4; Landscape, Biodiversity and Trees SPD; Natural Environment
  and Rural Communities Act 2006
source-text: 'Any development likely to affect a local, national or European designated site, or likely
  to impact on a designated protected species. ... This includes proposals for: ... demolition of older
  buildings*, ... alterations to roof spaces*, ... conversion or alteration to barns*, ... the removal
  of, or would affect, trees, scrub, hedgerows, ponds ... alterations to water courses'
must-include:
- item: Existing biodiversity interests and possible impacts on them
  level: should
- item: How an overall net gain in biodiversity will be provided
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: The proposal will have an impact on biodiversity.
- item: Where appropriate, plans showing significant wildlife habitats or features and the location of
    habitats of protected and Section 41 (NERC Act) species
  level: should
- item: 'For development likely to affect designated areas: assessment of impacts and proposals for mitigation
    and/or compensation, which may include long term maintenance and management'
  level: must
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      - special-area-of-conservation
      - special-protection-area
      - local-wildlife-site
      description: Likely to affect an area designated for its biodiversity interest.
- item: Survey and impact assessment work by a suitably qualified ecologist, including Hampshire Biodiversity
    Information Centre data and following CIEEM guidance
  level: should
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4); 'Reserved matters' (ApplicationTypeId=5). The
  application will not be registered until a survey and report, or information showing protected species
  or habitats would not be affected (for example a completed biodiversity checklist), is submitted.
review-status: unverified
field-status: {}
