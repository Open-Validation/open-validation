reference: telecommunications-report
local-authority: BAN
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: telecommunications-development
        value: true
        description: Telecommunications development.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: National Planning Policy Framework (February 2019) Section 10; GPDO 2015 Schedule 2 Part 16; Code
  of best practice on mobile network development in England (2016)
source-text: 'Required for all telecommunications applications and prior notifications where the following
  is required:'
must-include:
- item: A signed declaration that the equipment and installation fully complies with the ICNIRP requirements,
    with the site type (micro or macro)
  level: must
- item: Area of search
  level: must
- item: 'Details of the proposed structure: type, dimensions, height of existing building, size of equipment
    housing and materials'
  level: must
- item: A map showing the relationship of the site to schools and other telecommunication equipment nearby
  level: must
- item: A statement explaining the reasons for the choice of design
  level: must
- item: 'Technical information: frequency, modulation characteristics, power output and antenna height'
  level: must
- item: 'Technical justification: the purpose of the site and why the development is required'
  level: must
- item: Alternative sites rejected and why (including existing masts, structures and buildings in the
    search area), or an explanation if none were considered
  level: must
- item: Visual impact assessment where relevant
  level: must
- item: Confirmation whether the council's mast register and/or industry site database has been checked
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Details of annual rollout and pre-application discussions with the council
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Details of all consultations carried out and copies of written comments, including with schools
    or colleges and the CAA, Secretary of State for Defence or aerodrome operator where relevant
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Acoustic report where relevant
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Evidence that notice of the development was given under A.3(1) of Part 16 of Schedule 2 to the
    GPDO 2015
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: 'For a mast within 3 km of an aerodrome: evidence that the CAA, Secretary of State for Defence
    or aerodrome operator was notified under A.3(2)'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Telecommunications prior notification'
  (ApplicationTypeId=18). Conditional local item on the full planning page and mandatory on the telecommunications
  prior notification page, which also has the national 'Telecommunications requirements' (notice evidence).
review-status: unverified
field-status: {}
