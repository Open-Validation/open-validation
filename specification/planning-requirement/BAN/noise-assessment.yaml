reference: noise-assessment
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Noisy uses, including all B2 applications.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development, for example housing near a motorway or industrial site.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: National Planning Policy Framework (February 2019) Section 15; Basingstoke and Deane Local Plan
  2011-2029 policy EM12
source-text: Noisy uses, including all B2 applications ... Noise sensitive developments, for example housing
  located near to a source of noise, such as motorway, industrial site.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4).
review-status: unverified
field-status: {}
