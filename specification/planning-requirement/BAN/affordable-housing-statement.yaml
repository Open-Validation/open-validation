reference: affordable-housing-statement
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: National Planning Policy Framework (February 2019) Section 5; Basingstoke and Deane Local Plan
  2011-2029 policy CN1; Affordable Housing SPD
source-text: The provision of affordable housing is required by BDLP 2011-2029 Policy CN1.
must-include:
- item: Numbers of residential units, the mix of units with habitable rooms and/or bedrooms or floor space,
    and plans showing the location of units
  level: should
- item: Different levels or types of affordability or tenure clearly and fully explained
  level: should
- item: Details of any Registered Social Landlords acting as partners in the development
  level: should
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4); 'Reserved matters' (ApplicationTypeId=5). The
  trigger is wherever policy CN1 requires affordable housing; the list gives no threshold, so it is shown
  as discretionary.
review-status: unverified
field-status: {}
