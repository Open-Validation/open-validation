reference: environmental-statement
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: eia-development
      value: true
      description: Schedule 1 project, or a Schedule 2 project needing EIA (EIA Regulations 2017).
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: Required for all Schedule 1 and some Schedule 2 projects as defined by the Town and Country
  Planning (Environmental Impact Assessment) Regulations 2017. To be provided in the form set out in Schedule
  4.
must-include:
- item: In the form set out in Schedule 4 of the EIA Regulations 2017
  level: must
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4). Where EIA is not required the council may still
  require environmental information.
review-status: unverified
field-status: {}
