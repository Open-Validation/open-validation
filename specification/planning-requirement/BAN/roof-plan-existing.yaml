reference: roof-plan-existing
local-authority: BAN
required-if:
  all:
  - any:
    - application-type:
        in:
        - hh
        - full
        - lbc
    - all:
      - application-type:
          in:
          - ldc-prospective-use
          - reserved-matters
      - discretionary
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: Significant extensions to roof forms (not conservatories or sheds).
    - condition:
        field: new-build
        value: true
        description: New buildings (not conservatories or sheds).
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for all planning applications involving significant extensions to roof forms and
  new buildings.
must-include:
- item: Scale 1:100 or 1:50
  level: must
- item: Clearly and consistently show existing and proposed works
  level: must
- item: A scale bar, key metric dimensions (distance of the development from the site boundaries and size
    of the building), the original paper size and a north point
  level: must
- item: The shape of the roof, materials, vents and location
  level: must
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Householder application' (ApplicationTypeId=1);
  'Lawful Development Certificate (proposed)' (ApplicationTypeId=14). Not required for conservatories
  or sheds.
review-status: unverified
field-status: {}
