reference: bng-metric
local-authority: BAN
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The permission would be subject to the biodiversity gain condition.
source-url: https://www.basingstoke.gov.uk/rte.aspx?ApplicationTypeId=2&id=1329
policy: Schedule 7A, Town and Country Planning Act 1990
source-text: 'Where the development is subject to the Biodiversity Gain Condition the statement should
  contain the following: ... the pre-development biodiversity value of the onsite habitat on the date
  of application (or an earlier date) including the completed metric calculation tool used showing the
  calculations, the publication date and version of the biodiversity metric used to calculate that value;'
must-include:
- item: The publication date and version of the biodiversity metric used
  level: must
- item: 'Where an earlier date is used: the proposed date and the reasons for it'
  level: must
- item: A statement confirming whether the onsite habitat value is lower because of degradation, with
    supporting evidence if so
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: From the council's list (undated web pages, one per application type, read 5 November 2026), pages
  'Application for planning permission' (ApplicationTypeId=2); 'Outline, all matters reserved' (ApplicationTypeId=3);
  'Outline, some matters reserved' (ApplicationTypeId=4). Part of the 'Biodiversity Net Gain Statement'
  (mandatory national item). The statement of whether the condition applies is unmapped. Shown with the
  biodiversity gain condition because householder and other exempt development are exempt by law.
review-status: unverified
field-status: {}
