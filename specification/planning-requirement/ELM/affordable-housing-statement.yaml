reference: affordable-housing-statement
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: A net increase in residential units.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Elmbridge Core Strategy 2011 Policies CS19 and CS21; NPPF; Developer Contributions SPD (2012)
source-text: Applications for residential schemes resulting in a net increase in residential units.
must-include:
- item: Confirmation of the financial contribution to be made
  level: must
- item: The total number of residential units and of affordable units
  level: must
- item: The proposed tenure mix of the affordable units
  level: must
- item: The size of units by habitable rooms and/or bedrooms, or floor space
  level: must
- item: Plans showing the location of units and their habitable rooms/bedrooms and/or floor space
  level: must
- item: Details of any Registered Providers acting as partners
  level: should
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Affordable
  Housing Statement'' on the Full Planning application page; also listed on: Full Planning application;
  Outline Planning application; Permission in Principle - Technical Details. Since 23 July 2025 the council
  gives more weight to national policy (NPPF paragraph 65) than to Policy CS21 for small sites of 1-9
  units.'
review-status: unverified
field-status: {}
