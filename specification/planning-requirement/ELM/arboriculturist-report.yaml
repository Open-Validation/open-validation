reference: arboriculturist-report
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - demolition-con-area
      - full
      - hh
      - notice-trees-in-con-area
      - outline
      - technical-details-consent
      - s73
      - consent-under-tpo
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees could influence or be affected by the development, especially trees protected
        by a TPO or in a conservation area, on the site or neighbouring properties.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: BS 5837:2012; NPPF; Elmbridge Development Management Plan 2015 Policies DM2, DM6 and DM21; Elmbridge
  Core Strategy 2011 Policies CS14 and CS15
source-text: Applications must be supplied with supporting arboricultural information where trees could
  influence or be affected by the proposed development and related operations. Especially sites and neighbouring
  properties containing trees protected by Tree Preservation Orders and/or Conservation Areas.
must-include:
- item: Tree survey
  level: must
- item: Arboricultural impact assessment
  level: must
- item: Tree protection information and a tree protection plan
  level: must
- item: Arboricultural method statement
  level: must
- item: To BS 5837:2012 and produced by a suitably qualified and experienced professional
  level: must
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Arboricultural
  Information'' on the Full Planning application page; also listed on: Demolition in a Conservation Area;
  Full Planning application; Householder application; Tree Works: Trees in a Conservation Area; Outline
  Planning application; Permission in Principle - Technical Details; Variation or Removal of Conditions;
  Tree Works: Trees subject to a Tree Preservation Order. The list calls it ''Arboricultural Information''.
  Site plans must also show all trees on and next to the site.'
review-status: unverified
field-status: {}
