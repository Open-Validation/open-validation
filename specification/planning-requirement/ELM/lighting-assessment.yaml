reference: lighting-assessment
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
  - any:
    - condition:
        field: external-lighting
        value: true
        description: External lighting would be provided or made necessary by the development.
    - condition:
        field: illuminated
        value: true
        description: Illuminated adverts.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Elmbridge Development Management Plan 2015 Policy DM5; Elmbridge Core Strategy 2011 Policy CS27
source-text: Proposals where external lighting would be provided or made necessary by the development.
  The impact of illuminated adverts on such areas should also be assessed.
must-include:
- item: Details of external lighting
  level: must
- item: Proposed hours of use
  level: must
- item: Layout plan with beam orientation and light spillage
  level: must
- item: Schedule of the equipment
  level: must
- item: Expected impact on neighbouring properties and roads
  level: must
- item: Proposed measures to mitigate or compensate for the impacts
  level: must
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Lighting
  Assessment'' on the Full Planning application page; also listed on: Full Planning application; Outline
  Planning application; Permission in Principle - Technical Details.'
review-status: unverified
field-status: {}
