reference: bng-metric
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - demolition-con-area
      - full
      - outline
      - technical-details-consent
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: Subject to the biodiversity gain condition (not exempt, e.g. householder, self or custom
        build, de minimis).
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Schedule 7A of the Town and Country Planning Act 1990 (Environment Act 2021); Biodiversity Gain
  Requirements (Exemptions) Regulations 2024; Elmbridge Core Strategy 2011 Policies CS13, CS14 and CS15;
  Elmbridge Development Management Plan 2015 Policy DM21
source-text: All applications except those exempt from BNG requirements.
must-include:
- item: 'Biodiversity statement: whether the applicant believes the biodiversity gain condition applies;
    the pre-development biodiversity value on the date of application (or an earlier date, with reasons);
    whether the value is lower because of degradation, with evidence; and any irreplaceable habitat'
  level: must
- item: The completed metric calculation tool, with the publication date and version of the metric used
    (the Small Sites Metric may be used for small sites where allowed)
  level: must
- item: A 'post intervention' metric calculation using the Biodiversity Metric 4.0 (or later), showing
    how at least a 10% gain is met and whether on site, off site or by statutory credits
  level: must
- item: 'A technical BNG report: methodology including habitat condition results, justification following
    the mitigation hierarchy, and caveats, assumptions or limitations'
  level: must
- item: A copy of the metric in Excel format, with no tabs deleted and the 'off-site' tab completed with
    all date fields
  level: must
- item: Completed by a competent person
  level: must
- item: Habitats damaged by unauthorised activities after 30 January 2020 included at their former type
    and condition
  level: must
- item: 'If BNG is provided off site: the off-site land on a site plan, the caveats/justification explained,
    and a baseline ecological assessment of that land with the proposed enhancements'
  level: must
  required-if:
    condition:
      field: off-site-biodiversity-gain
      value: true
      description: Biodiversity gain is to be provided off site.
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Biodiversity
  net gain (BNG)'' on the Full Planning application page; also listed on: Demolition in a Conservation
  Area; Full Planning application; Outline Planning application; Permission in Principle - Technical Details.
  The local BNG requirements took effect from 6 January 2025.'
review-status: unverified
field-status: {}
