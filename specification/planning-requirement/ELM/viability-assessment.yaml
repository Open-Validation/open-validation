reference: viability-assessment
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - s73
      - mod-discharge-s106
  - condition:
      field: affordable-housing-below-target
      value: true
      description: A reduced affordable housing offer (only in exceptional circumstances).
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: NPPF; Developer Contributions SPD (2012); Elmbridge Core Strategy 2011 Policies CS19 and CS21
source-text: A reduced affordable housing offer and viability assessment should only be submitted under
  exceptional circumstances.
must-include:
- item: What has changed since the council's viability review for the Core Strategy and why it prevents
    full payment
  level: must
- item: Executive summary
  level: must
- item: Basis on which S106 costs have been calculated (including the completed CIL Liability Calculations
    Sheet)
  level: must
- item: Build costs and market evidence
  level: must
- item: Benchmark Land Value or Alternative Use Value
  level: must
- item: Viability appraisal with cash flow projections (including an active electronic version)
  level: must
- item: Evidence for any assumptions above the standard ones (e.g. site acquisition costs, profit levels)
  level: must
- item: A commitment to pay for independent scrutiny of the assessment
  level: must
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Viability
  Assessment'' on the Full Planning application page; also listed on: Full Planning application; Outline
  Planning application; Permission in Principle - Technical Details; Variation or Removal of Conditions;
  Deed of Variation. Viability cannot be contested after registration; the assessment is published.'
review-status: unverified
field-status: {}
