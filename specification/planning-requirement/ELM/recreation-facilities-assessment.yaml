reference: recreation-facilities-assessment
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - s73
  - any:
    - site:
        in:
        - open-space
        description: The proposal may affect existing designated and protected open space in the Local
          Plan.
    - condition:
        field: new-open-space
        value: true
        description: The proposal provides new public communal open space.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: NPPF; Elmbridge Development Management Plan 2015 Policy DM20; Elmbridge Core Strategy 2011 Policies
  CS14, CS16 and CS17
source-text: Proposals that may affect existing designated and protected open space as specified within
  the Local Plan Where there is a provision of new, public communal open space
must-include:
- item: 'For new homes: the open space to be provided in relation to the number and type of dwellings'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development.
- item: 'For development on open space: evidence that the land or buildings are no longer needed for that
    purpose, are not economically viable and have no local demand'
  level: must
  required-if:
    site:
      in:
      - open-space
      description: Development on open space.
- item: Plans showing any existing or proposed open space within or next to the site
  level: must
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Open
  Space Assessment'' on the Full Planning application page; also listed on: Full Planning application;
  Outline Planning application; Permission in Principle - Technical Details; Variation or Removal of Conditions.'
review-status: unverified
field-status: {}
