policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'All applications require an ownership certificate, except the following: Applications for
  Advertisement Consent Applications for Lawful Development Certificates (existing or proposed) Applications
  for Non-Material Amendments Applications for Prior Approval Applications for Reserved Matters Applications
  for works to trees Confirmation of Compliance with Conditions Prior Notifications'
must-include:
- item: All sections and questions answered
  level: must
- item: The declaration signed and dated
  level: must
- item: Full contact details of the applicant and/or agent (where appropriate)
  level: must
- item: Ownership certificate (A, B, C or D) signed and dated no more than 21 days before the application
    is received, with notice served on everyone with an interest in the site (including where guttering
    or foundations go over the boundary)
  level: must
  required-if:
    application-type:
      in:
      - full
      - hh
      - outline
      - technical-details-consent
      - pip
      - lbc
      - demolition-con-area
      - s73
- item: 'For a new vehicular access onto a public road (owned by Surrey County Council) or a private road:
    Certificate B with notice served on the County Council or the road owner(s)'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new vehicular access onto a public or private road.
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Application
  Form and Ownership Certificates'' on the Full Planning application page; also listed on: Advertisement
  Consent; Approval of details reserved by Condition; Approval of Reserved Matters; Demolition in a Conservation
  Area; Full Planning application; Householder application; Lawful Development Certificate; Listed Building
  Consent; Non-Material Amendments; Tree Works: Trees in a Conservation Area; Outline Planning application;
  Permission in Principle - Technical Details; Variation or Removal of Conditions; Tree Works: Trees subject
  to a Tree Preservation Order; Permission in Principle; Telecommunications application. The source-text
  is the ownership certificate criteria; the form itself is needed for every type listed. A fee section
  is on most pages; fees are not a requirement file.'
