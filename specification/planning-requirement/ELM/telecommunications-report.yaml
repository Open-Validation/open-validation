reference: telecommunications-report
local-authority: ELM
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: telecommunications-development
        value: true
        description: Telecommunications and aerial infrastructure.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=19
policy: Elmbridge Development Management Plan 2015 Policy DM16; Code of Practice on Mobile Network Development
  (2002)
source-text: All applications relating to telecommunications and aerial infrastructure.
must-include:
- item: Area of search and details of any consultation
  level: must
- item: Details of the proposed structure and technical information (frequency, modulation characteristics,
    power output, antenna height)
  level: must
- item: 'Technical justification: the purpose of the site and why the development is needed'
  level: must
- item: Alternative sites rejected with justification (including existing masts, structures and buildings
    in the search area), or an explanation if none were considered
  level: must
- item: A Visual Impact Assessment and an Acoustic Report where relevant
  level: should
  required-if: discretionary
- item: Photographs and photomontages where the development involves demolition or affects a conservation
    area or listed building
  level: must
  required-if:
    site:
      in:
      - conservation-area
      - listed-building
      description: Demolition, or development affecting a conservation area or listed building.
- item: A signed declaration that the equipment and installation fully comply with the ICNIRP radio frequency
    public exposure guidelines
  level: must
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Telecommunications
  Supporting Information'' on the Telecommunications application page; also listed on: Telecommunications
  application. The ''Telecommunications application'' page covers telecoms proposals; it is mapped to
  prior approval for electronic communications and to full applications for telecommunications.'
review-status: unverified
field-status: {}
