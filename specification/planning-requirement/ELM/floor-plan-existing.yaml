reference: floor-plan-existing
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - demolition-con-area
      - full
      - hh
      - ldc
      - lbc
      - non-material-amendment
      - outline
      - technical-details-consent
      - s73
  - condition:
      field: building-works
      value: true
      description: New or amended floor space, or alterations to existing buildings.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Elmbridge Development Management Plan 2015 Policy DM2
source-text: All applications proposing new or amended floor space and/or proposals to alter existing
  buildings.
must-include:
- item: An appropriate metric scale, for example 1:50 or 1:100
  level: must
- item: Precise dimensions of the footprint of any new dwelling and any extension
  level: must
- item: Proposed openings that accord with the elevations
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: must
- item: 'For change of use with internal alterations: the existing and proposed layout of rooms'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: A change of use with internal alterations.
- item: The whole floor of the dwelling rather than only part
  level: must
- item: The proposed ground floor footprint matches the proposed site plan
  level: must
- item: Existing buildings in relation to proposed buildings (with property numbers where applicable),
    and the relationship to adjoining buildings and their openings
  level: should
- item: Scale plans showing any demolition and the existing and proposed floors, to calculate CIL liability
  level: must
- item: 'For variations of approved plans: the variations clear, with the drawing number a revision of
    the original'
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: Not marked 'do not scale', 'approximate' or any similar phrase
  level: must
- item: 'For non-material amendments and variations of condition: the amendments highlighted on the plan'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Existing/Proposed
  Floor Plans'' on the Full Planning application page; also listed on: Demolition in a Conservation Area;
  Full Planning application; Householder application; Lawful Development Certificate; Listed Building
  Consent; Non-Material Amendments; Outline Planning application; Permission in Principle - Technical
  Details; Variation or Removal of Conditions.'
review-status: unverified
field-status: {}
