reference: location-plan
local-authority: ELM
required-if:
  any:
  - application-type:
      in:
      - advertising
      - demolition-con-area
      - full
      - hh
      - ldc
      - lbc
      - outline
      - technical-details-consent
      - prior-approval
      - pip
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: NPPF; Elmbridge Development Management Plan 2015 Policy DM12
source-text: 'All applications except for: Reserved Matters applications - only if the layout is not reserved
  Works to Trees in a Conservation Area or Subject to a Tree Preservation Order Variation of Conditions
  applications'
must-include:
- item: Based on an up-to-date map, typically at 1:1250 or 1:2500, showing the direction of north
  level: must
- item: 'Enough roads and/or buildings on adjoining land to make the exact location clear: at least 2
    named roads and surrounding buildings, site centred, with properties named or numbered'
  level: must
- item: The application site edged clearly in red, including all land needed (access from a public highway,
    visibility splays, landscaping, car parking and open areas around buildings)
  level: must
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: must
- item: Based on a site survey (with a surveyor's statement that Ordnance Survey information has not been
    used) or on Ordnance Survey information bearing a valid licence number
  level: must
- item: 'For advertisement consent: the proposed position clearly identifiable'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Location
  Plan'' on the Full Planning application page; also listed on: Advertisement Consent; Approval of Reserved
  Matters; Demolition in a Conservation Area; Full Planning application; Householder application; Lawful
  Development Certificate; Listed Building Consent; Tree Works: Trees in a Conservation Area; Outline
  Planning application; Permission in Principle - Technical Details; Prior Approval; Prior Notification;
  Tree Works: Trees subject to a Tree Preservation Order; Permission in Principle; Telecommunications
  application. Reserved matters shows as ''check'': it is not needed where the layout is not reserved.
  The tree works pages list a location plan, but the section''s own text excludes tree works, so they
  are left out.'
review-status: unverified
field-status: {}
