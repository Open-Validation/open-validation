reference: site-plan
local-authority: ELM
required-if:
  any:
  - application-type:
      in:
      - reserved-matters
      - demolition-con-area
      - full
      - hh
      - ldc
      - lbc
      - non-material-amendment
      - notice-trees-in-con-area
      - outline
      - technical-details-consent
      - s73
      - consent-under-tpo
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - advertising
    - discretionary
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Elmbridge Development Management Plan 2015 Policy DM2
source-text: 'All applications except: Advertisements where the sign is located on an existing building'
must-include:
- item: An identified standard metric scale (for example 1:100, 1:200 or 1:500) and the direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings, with
    written dimensions including those to the boundaries
  level: must
- item: 'Unless they would not influence or be affected by the development: buildings, roads and footpaths
    on adjoining land including access; public rights of way; all trees on the site and adjacent land
    (including street trees); hard surfacing; proposed boundary treatment'
  level: must
- item: Existing and proposed buildings to be retained or removed; an existing site plan where any part
    of the site is to be demolished
  level: must
- item: Where there are trees on site, which are to be retained and which removed
  level: must
- item: Existing and proposed car and cycle parking, new accesses, turning areas and parking bays (with
    dimensions where relevant)
  level: must
- item: 'For outbuildings or structures separate from the main building: annotated dimensions to nearby
    buildings'
  level: must
  required-if:
    condition:
      field: outbuilding
      value: true
      description: An outbuilding or structure separate from the main building.
- item: Visibility splays annotated where there are new or altered highway accesses or junctions, or street
    furniture
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: New or altered highway accesses or junctions.
- item: 'For advertisements: the location of the advert(s) and distances in metres to 2 fixed structures/buildings'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: Relationship to adjoining or nearby buildings and the positions of openings on each property
  level: should
- item: Not marked 'do not scale', 'approximate' or any similar phrase
  level: must
- item: 'For non-material amendments and variations of condition: the amendments highlighted on the plan'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Existing/Proposed
  Site Plan'' on the Full Planning application page; also listed on: Advertisement Consent; Approval of
  Reserved Matters; Demolition in a Conservation Area; Full Planning application; Householder application;
  Lawful Development Certificate; Listed Building Consent; Non-Material Amendments; Tree Works: Trees
  in a Conservation Area; Outline Planning application; Permission in Principle - Technical Details; Variation
  or Removal of Conditions; Tree Works: Trees subject to a Tree Preservation Order; Telecommunications
  application. Adverts show as ''check'' because a site plan is not needed where the sign is on an existing
  building. Also listed on the High Hedge page (no application type).'
review-status: unverified
field-status: {}
