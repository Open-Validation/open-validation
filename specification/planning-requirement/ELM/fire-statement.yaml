reference: fire-statement
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Town and Country Planning (Development Management Procedure and Section 62A Applications) (England)
  (Amendment) Order 2021
source-text: 'An application for planning permission for development which involves: the provision of
  one or more relevant buildings, or development of an existing relevant building or development within
  the curtilage of a relevant building'
must-include:
- item: On the form published by the Secretary of State
  level: must
- item: The fire safety principles, concepts and approach applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and how it was taken into account
  level: must
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Fire
  Statement'' on the Full Planning application page; also listed on: Full Planning application. A relevant
  building contains two or more dwellings or educational accommodation and is 18 m or more or 7 or more
  storeys. Exempt: outline, section 73, and some changes of use.'
review-status: unverified
field-status: {}
