reference: archaeological-assessment
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - demolition-con-area
      - full
      - hh
      - lbc
      - outline
      - technical-details-consent
      - s73
  - any:
    - site:
        in:
        - archaeological-priority-area
        description: Affects an Area of High Archaeological Potential.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.4
        description: A site over 0.4 hectares.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.4
        description: A site over 0.4 hectares.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: NPPF; Elmbridge Development Management Plan 2015 Policy DM12
source-text: An Archaeological Assessment should be included with the Heritage Statement for applications
  affecting an Area of High Archaeological Potential or for applications for the development of sites
  over 0.4 hectares in size.
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Heritage
  Statement'' on the Full Planning application page; also listed on: Demolition in a Conservation Area;
  Full Planning application; Householder application; Listed Building Consent; Outline Planning application;
  Permission in Principle - Technical Details; Variation or Removal of Conditions. Included with the Heritage
  Statement.'
review-status: unverified
field-status: {}
