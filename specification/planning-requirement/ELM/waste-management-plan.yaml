reference: waste-management-plan
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
      - lbc
      - non-material-amendment
      - outline
      - technical-details-consent
      - s73
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor development.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Elmbridge Development Management Plan 2015 Policy DM9
source-text: All minor and major applications should include details of refuse provision including recycling
  facilities.
must-include:
- item: Plans and elevations at a metric scale of 1:50
  level: must
- item: Refuse and recycling storage points and the access routes for collection vehicles on the proposed
    site plan
  level: must
- item: Precise dimensions of the footprint of the store(s) on a floor or site plan
  level: must
- item: Elevations of the stores with their height and materials
  level: must
- item: Not marked 'do not scale', 'approximate' or any similar phrase
  level: must
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Refuse/Recycling
  Plan'' on the Full Planning application page; also listed on: Full Planning application; Listed Building
  Consent; Non-Material Amendments; Outline Planning application; Permission in Principle - Technical
  Details; Variation or Removal of Conditions. The list calls it a ''Refuse/Recycling Plan''.'
review-status: unverified
field-status: {}
