reference: section-existing
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - advertising
      - demolition-con-area
      - full
      - hh
      - ldc
      - lbc
      - non-material-amendment
      - outline
      - technical-details-consent
      - s73
  - condition:
      field: change-in-ground-levels
      value: true
      description: The site slopes, neighbouring land is at a different height, or land levels are to
        be changed.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Elmbridge Development Management Plan 2015 Policy DM2
source-text: On sites where there are existing (and/or proposed) changes in land levels, i.e. where a
  site is sloping, where neighbouring land is at a different height or where land levels are proposed
  to be changed, drawings of sections through the site showing the relationship to adjoining properties
  or land is required.
must-include:
- item: Drawn at 1:50 or 1:100, showing the proposed works in relation to what is there and the height
    of buildings above ground level
  level: must
- item: Sections through the site showing the relationship to adjoining properties or land
  level: must
- item: 'Where ground levels change: existing and finished levels, with foundations and eaves, and how
    encroachment onto adjoining land is avoided'
  level: must
- item: Existing site levels and finished floor levels related to a fixed off-site datum point, and the
    proposals in relation to adjoining buildings
  level: must
- item: Not marked 'do not scale', 'approximate' or any similar phrase
  level: must
- item: 'For non-material amendments and variations of condition: the amendments highlighted on the plan'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Existing/Proposed
  Sections'' on the Full Planning application page; also listed on: Advertisement Consent; Demolition
  in a Conservation Area; Full Planning application; Householder application; Lawful Development Certificate;
  Listed Building Consent; Non-Material Amendments; Outline Planning application; Permission in Principle
  - Technical Details; Variation or Removal of Conditions. Not needed for a change of use with no external
  alterations (except in a conservation area or for a listed building).'
review-status: unverified
field-status: {}
