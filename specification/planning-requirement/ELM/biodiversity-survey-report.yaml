reference: biodiversity-survey-report
local-authority: ELM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: The application is a full, non-domestic application.
  - condition:
      field: roof-alteration
      value: true
      description: Domestic works that disturb the roof or roof structure, including loft conversions.
  - application-type:
      in:
      - lbc
      - outline
      - reserved-matters
      - s73
      - ldc-prospective-use
  - site:
      in:
      - conservation-area
      - listed-building
      description: The application is in a conservation area or affects a listed building.
  - site:
      in:
      - priority-habitat
      description: Priority Habitat is a constraint on the site.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?requesttype=parseTemplate&template=PlanningValidCheckListStart.tmplt
must-include:
- item: Protected species survey where protected species are likely to be present
  level: must
  required-if: discretionary
- item: Surveys no more than 18 months old
  level: must
confidence: medium
notes: 'From the audit (missing_requirement): "Biodiversity/Ecological Assessment" is required for full
  non-domestic applications; domestic works disturbing the roof or roof structure, including loft conversions;
  works within a church curtilage; conservation area and listed building applications; LDCs for proposed
  use; outline and reserved matters; applications to vary or remove a condition; and sites where Priority
  Habitat is a constraint. Works within a church curtilage have no field and are not in the rule. Read
  from the High Hedge page; not verified by Grok.'
review-status: unverified
field-status: {}
