reference: biodiversity-survey-report
local-authority: ELM
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - technical-details-consent
      - s73
      - lbc
      - ldc-prospective-use
      - demolition-con-area
      - notice-trees-in-con-area
  - all:
    - application-type:
        in:
        - hh
        - full
        - ldc
    - condition:
        field: roof-alteration
        value: true
        description: Domestic works that remove or disturb the roof or roof structure, including loft
          conversions.
  - condition:
      field: church-curtilage
      value: true
      description: Works within the curtilage of a church.
  - site:
      in:
      - priority-habitat
      description: Priority habitat is a constraint on the site.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Natural Environment and Rural Communities Act 2006; Circular 06/2005; Elmbridge Core Strategy
  2011 Policies CS13, CS14 and CS15; Elmbridge Development Management Plan 2015 Policy DM21
source-text: Full applications, which are not domestic Domestic works which involve the removal or disturbance
  to the roof or roof structure including loft conversions Works within the curtilage of a church Conservation
  area applications Listed building applications Lawful development certificates for proposed use Outline
  applications Reserved matters applications Applications to vary or remove a condition Application sites
  where ‘Priority Habitat’ is a constraint
must-include:
- item: 'Where protected species are likely to be affected: an up-to-date Protected Species Survey and
    Assessment, carried out no more than 18 months before submission'
  level: must
- item: By competent persons at an appropriate time of year, in suitable weather, using nationally recognised
    methods
  level: must
- item: Records which species are present and their (approximate) numbers
  level: must
- item: Maps their distribution and use of the area, site, structure or feature
  level: must
- item: Identifies direct and indirect impacts during and after construction
  level: must
- item: 'Where harm is likely: how alternative designs or locations were considered, and how effects are
    avoided, mitigated or compensated'
  level: must
- item: Any further surveys the assessment identifies, submitted before the application can be registered
    as valid
  level: must
- item: How species numbers are likely to change after development
  level: should
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Biodiversity/Ecological
  Assessment'' on the Full Planning application page; also listed on: Demolition in a Conservation Area;
  Full Planning application; Householder application; Lawful Development Certificate; Listed Building
  Consent; Tree Works: Trees in a Conservation Area; Outline Planning application; Permission in Principle
  - Technical Details; Variation or Removal of Conditions; Tree Works: Trees subject to a Tree Preservation
  Order. Full applications are listed ''which are not domestic''; domestic full applications are caught
  by the roof works limb. ''Conservation area applications'' is read as the conservation area consent
  types. A full survey may not be needed where the council has said so in writing at pre-application stage
  or where protected species are clearly absent or unaffected (evidence required). Also listed on the
  High Hedge page.'
review-status: unverified
field-status: {}
