reference: air-quality-assessment
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
  - any:
    - site:
        in:
        - air-quality-management-area
        description: In or next to an Air Quality Management Area.
    - discretionary
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Elmbridge Development Management Plan 2015 Policy DM5; NPPF; Air Quality (England) (Amendment)
  Regulations 2002
source-text: 'Where the development (except Householders): Is in or adjacent to an Air Quality Management
  Area (AQMA) Could result in the designation of an AQMA Will generate emissions, for example odours and/or
  dust Is likely to lead to an increase in traffic, congestion or HGV movements Involves proposals for
  industrial processes where there are direct emissions to the air Involves proposals for new mineral
  sites or extensions to existing sites'
must-include:
- item: Existing baseline, future baseline without the development, and future air quality with the development
  level: must
- item: The air quality standards and objectives, methodology and input data (traffic, emissions, meteorological
    data)
  level: must
- item: All modelling results with an assessment of their significance, including construction impacts,
    exceedances, verification and effects on sensitive habitats
  level: must
- item: 'Where there is a negative impact: mitigation measures to minimise or offset emissions'
  level: must
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Air Quality
  Assessment'' on the Full Planning application page; also listed on: Full Planning application; Outline
  Planning application; Permission in Principle - Technical Details. Apart from an AQMA, the triggers
  (emissions, traffic increase, industrial processes, mineral sites) have no threshold, so they show as
  ''check''.'
review-status: unverified
field-status: {}
