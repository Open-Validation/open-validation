reference: design-and-access-statement
local-authority: ELM
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - technical-details-consent
    - any:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 3
          description: Three or more dwellings.
      - all:
        - site:
            in:
            - conservation-area
            description: In a conservation area.
        - any:
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: Other built development of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; National Design
  Guide
source-text: 'A Design and Access Statement is required for: major development developments of three or
  more dwellings the provision of one or more dwellings in a Conservation Area other built development
  with a floor space of 100sqm or more in a Conservation Area applications for Listed Building Consent'
must-include:
- item: Refers to the National Design Guide and the 10 characteristics of well-designed places
  level: should
- item: Presented as a visual document with supporting text, proportionate to the proposal
  level: should
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Design
  and Access Statement'' on the Full Planning application page; also listed on: Demolition in a Conservation
  Area; Full Planning application; Listed Building Consent; Outline Planning application; Permission in
  Principle - Technical Details; Variation or Removal of Conditions. Exceptions: a change of use without
  operational development, engineering or mining, adverts, tree works, waste development and applications
  to amend conditions (so variation of condition is left out although its page lists the section).'
review-status: unverified
field-status: {}
