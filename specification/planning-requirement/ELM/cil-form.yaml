reference: cil-form
local-authority: ELM
required-if:
  application-type:
    in:
    - demolition-con-area
    - full
    - hh
    - lbc
    - non-material-amendment
    - outline
    - technical-details-consent
    - prior-approval
    - s73
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Community Infrastructure Levy (CIL) charging schedule; Developer Contributions SPD
source-text: 'All applicants will need to submit with their planning application: CIL Additional information
  form Existing and proposed floor plans If there is a CIL charge the following will also be required:
  A completed copy of the Planning Contribution and CIL Liability Calculation sheet is encouraged Assumption
  of Liability form Calculations of any additional floor space'
must-include:
- item: CIL Additional Information form, with existing and proposed floor plans
  level: must
- item: 'If there is a CIL charge: an Assumption of Liability form and calculations of any additional
    floor space'
  level: must
  required-if:
    any:
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: 100 sq m or more of new build gross internal area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new houses or flats.
- item: 'If there is a CIL charge: the Planning Contribution and CIL Liability Calculation sheet'
  level: should
  required-if:
    any:
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: 100 sq m or more of new build gross internal area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new houses or flats.
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Community
  Infrastructure Levy (CIL)'' on the Full Planning application page; also listed on: Demolition in a Conservation
  Area; Full Planning application; Householder application; Listed Building Consent; Non-Material Amendments;
  Outline Planning application; Permission in Principle - Technical Details; Prior Approval; Variation
  or Removal of Conditions. The levy may be payable on net additional floorspace of 100 sq m or more of
  new build, or on any new house or flat.'
