reference: flood-risk-assessment
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - outline
      - technical-details-consent
      - s73
  - any:
    - site:
        in:
        - flood-risk-zone
        description: New development (including householder, minor and change of use) in Flood Zone 2
          or 3.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: A site of 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: A site of 1 hectare or more.
    - site:
        in:
        - surface-water-flood-risk
        description: Within 5 m of an area of medium to high surface water flooding.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: NPPF; Elmbridge Core Strategy 2011 Policy CS26; Elmbridge Development Management Plan 2015 Policies
  DM6, DM13 and DM22; Elmbridge Flood Risk SPD (2016)
source-text: Development proposals of 1 ha or greater in Flood Zone 1 and all proposals for new development
  (including householder applications, minor developments and change of use) located in Flood Zones 2
  and 3 should be accompanied by a Flood Risk Assessment (FRA). All development proposals including householder
  applications, minor developments and proposals within 5m of an area of medium to high surface water
  flooding.
must-include:
- item: Flood risk from all sources, current and future
  level: must
- item: How the development will be made safe for its lifetime and the measures proposed
  level: must
- item: Safe access and exit during a flood and safe refuge, including evacuation in advance of extreme
    events
  level: must
- item: Evidence that flood risk elsewhere is not increased (flow not impeded, flood storage not reduced)
  level: must
- item: Evidence for the Sequential and Exception Tests where needed
  level: must
- item: Prepared by a suitably qualified person, e.g. a drainage engineer
  level: should
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Flood
  Risk Assessment'' on the Full Planning application page; also listed on: Full Planning application;
  Householder application; Outline Planning application; Permission in Principle - Technical Details;
  Variation or Removal of Conditions. The Flood Risk Sequential Test in the same section is recorded separately
  (unmapped).'
review-status: unverified
field-status: {}
