reference: land-contamination-assessment
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Any new residential development.
    - discretionary
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: NPPF; Elmbridge Development Management Plan 2015 Policy DM5
source-text: Planning applications where new, or redevelopment is proposed or on land that is known to
  be, or suspected to be, affected by contamination may require a contaminated land assessment. An assessment
  is always required for any new residential development.
must-include:
- item: A desk-based evaluation including a full history of the site
  level: must
- item: A site walkover
  level: must
- item: A conceptual site model (assessment of the risks)
  level: must
- item: Carried out by a suitably qualified, competent person, to current best practice and published
    standards (e.g. BS 10175, CLR 11)
  level: must
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Contaminated
  Land Assessment'' on the Full Planning application page; also listed on: Full Planning application;
  Outline Planning application; Permission in Principle - Technical Details; Variation or Removal of Conditions.
  Other cases ''may require'' one (contaminated or suspected land, extensions on or near landfill, changes
  of end use), so they show as ''check''.'
review-status: unverified
field-status: {}
