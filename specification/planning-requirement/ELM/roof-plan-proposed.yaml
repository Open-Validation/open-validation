reference: roof-plan-proposed
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - demolition-con-area
      - full
      - hh
      - ldc
      - lbc
      - non-material-amendment
      - outline
      - technical-details-consent
      - s73
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: roof-alteration
        value: true
        description: Alterations or extensions that include works to the roof.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Elmbridge Development Management Plan 2015 Policy DM2
source-text: All applications for new buildings and for alterations or extensions that include works to
  the roof.
must-include:
- item: An appropriate metric scale, normally not less than 1:200
  level: must
- item: Proposed materials and design of features (such as chimneys and roof lights), matching the elevations
  level: must
- item: The shape of the roof, including any areas cut away or to be used for balconies or seating
  level: must
- item: Existing buildings in relation to proposed buildings (with property numbers where applicable)
  level: should
- item: Not marked 'do not scale', 'approximate' or any similar phrase
  level: must
- item: 'For non-material amendments and variations of condition: the amendments highlighted on the plan'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Existing/Proposed
  Roof Plans'' on the Full Planning application page; also listed on: Demolition in a Conservation Area;
  Full Planning application; Householder application; Lawful Development Certificate; Listed Building
  Consent; Non-Material Amendments; Outline Planning application; Permission in Principle - Technical
  Details; Variation or Removal of Conditions.'
review-status: unverified
field-status: {}
