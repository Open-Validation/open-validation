reference: elevation-existing
local-authority: ELM
required-if:
  any:
  - application-type:
      in:
      - advertising
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - demolition-con-area
        - full
        - hh
        - ldc
        - lbc
        - non-material-amendment
        - outline
        - technical-details-consent
        - s73
    - any:
      - condition:
          field: external-alterations
          value: true
          description: External alterations are proposed (not needed for a vehicle crossover).
      - site:
          in:
          - conservation-area
          - listed-building
          description: A change of use in a conservation area or of a listed building.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: Elmbridge Development Management Plan 2015 Policy DM2
source-text: 'Elevations are required for all applications except those listed below as exceptions: Change
  of use where no external alterations are proposed (except for sites within a Conservation Area or if
  the site is a Listed Building) Vehicle crossover'
must-include:
- item: Drawn at 1:50 or 1:100, showing the proposed works in relation to what is there and the height
    of buildings above ground level
  level: must
- item: Elevations where there is a visible change
  level: must
- item: Existing and proposed materials of windows, doors, walls and roofs
  level: must
- item: Any blank elevations, including party walls
  level: must
- item: The height of all new buildings and structures, and any increase in ridge height, annotated
  level: must
- item: Where a proposed elevation joins or is close to another building, the relationship between the
    buildings and the positions of openings on each
  level: should
- item: 'For a change of use with no external alterations: confirmation of this in writing'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: A change of use with no external alterations.
- item: 'For advertisement consent: the height from ground level to the lowest part of the sign, and any
    projection from the building with dimensions'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: Not marked 'do not scale', 'approximate' or any similar phrase
  level: must
- item: 'For non-material amendments and variations of condition: the amendments highlighted on the plan'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Existing/Proposed
  Elevations'' on the Full Planning application page; also listed on: Advertisement Consent; Demolition
  in a Conservation Area; Full Planning application; Householder application; Lawful Development Certificate;
  Listed Building Consent; Non-Material Amendments; Outline Planning application; Permission in Principle
  - Technical Details; Variation or Removal of Conditions; Telecommunications application.'
review-status: unverified
field-status: {}
