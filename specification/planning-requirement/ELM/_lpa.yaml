submission-standards:
- item: Applications submitted online via the Planning Portal (one copy electronically or by post)
  level: should
- item: Plans drawn to an identified metric scale; plans marked 'do not scale', 'approximate' or similar
    will be returned as unacceptable
  level: must
- item: Ordnance Survey based plans bear a valid licence number; site survey plans carry a surveyor's
    statement that Ordnance Survey information has not been used
  level: must
- item: If the fee is paid on the council's website, the receipt number is submitted with the application
  level: should
