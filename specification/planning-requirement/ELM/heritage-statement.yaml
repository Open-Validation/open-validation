reference: heritage-statement
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - demolition-con-area
      - full
      - hh
      - lbc
      - outline
      - technical-details-consent
      - s73
  - any:
    - site:
        in:
        - listed-building
        - listed-building-setting
        - scheduled-monument
        - park-and-garden
        - conservation-area
        - archaeological-priority-area
        - locally-listed-building
        description: The application affects a heritage asset or its setting (listed buildings, scheduled
          monuments, registered parks and gardens, conservation areas, archaeological sites, locally listed
          buildings).
    - discretionary
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: NPPF; Elmbridge Development Management Plan 2015 Policy DM12
source-text: A Heritage Statement is required for all applications that affect a Heritage Asset or works
  affecting the setting of a Heritage Asset. These include statutory listed buildings, scheduled monuments,
  registered parks and gardens, conservation areas, archaeological sites, locally listed buildings and
  buildings or assets identified as heritage assets during the pre-application or application process.
must-include:
- item: Follows the Elmbridge Advice on Producing a Heritage Statement
  level: must
- item: Detail proportionate to the significance of the asset and the impact
  level: must
- item: A structural survey and/or condition survey, in some circumstances
  level: should
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Heritage
  Statement'' on the Full Planning application page; also listed on: Demolition in a Conservation Area;
  Full Planning application; Householder application; Listed Building Consent; Outline Planning application;
  Permission in Principle - Technical Details; Variation or Removal of Conditions. Assets identified during
  the pre-application or application process show as ''check''.'
