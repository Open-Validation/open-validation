reference: town-centre-impact-assessment
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - s73
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail or other main town centre uses in an edge-of-centre or out-of-centre location.
  - condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 2500
      description: 2,500 sq m of retail or other main town centre uses.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: NPPF; Elmbridge Core Strategy 2011 Policy CS18
source-text: If the proposal involves the location of 2,500sqm of retail or other main town centre uses
  in an edge-of-centre or out-of-centre location then a retail impact assessment is required.
must-include:
- item: The impact on existing, committed and planned investment in centres in the catchment, and on town
    centre vitality and viability, including consumer choice and trade
  level: must
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Retail
  Impact Assessment'' on the Full Planning application page; also listed on: Full Planning application;
  Outline Planning application; Permission in Principle - Technical Details; Variation or Removal of Conditions.
  The sequential assessment in the same section is recorded separately (unmapped).'
review-status: unverified
field-status: {}
