reference: noise-assessment
local-authority: ELM
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - technical-details-consent
      - s73
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Changes of use to Class A3, A4, A5, D1 or D2; new industrial development near homes;
          minerals and waste; energy generation including wind turbines.
    - condition:
        field: noise-sensitive-use
        value: true
        description: New homes next to classified roads, railways or industrial uses (except B1), or near
          licensed premises and cultural venues.
source-url: https://emaps.elmbridge.gov.uk/ebc_planning_noftr.aspx?template=PlanningValidCheckListDetails.tmplt&requestType=parseTemplate&AppTypID%3APARAM=5
policy: NPPF; Noise Policy Statement for England; Environmental Protection Act 1990; Elmbridge Development
  Management Plan 2015 Policy DM5
source-text: 'Any application that raises issues of disturbance for adjoining occupiers, is considered
  noise sensitive development or in a noise sensitive area (for example residential housing, school etc):'
must-include:
- item: Prepared by a suitably qualified acoustician who is a member of the Institute of Acoustics or
    Association of Noise Consultants
  level: must
- item: Potential noise sources and their effect on amenity and environmental receptors
  level: must
- item: Existing and proposed noise levels and measures to reduce noise
  level: must
- item: Manufacturers' specifications of equipment to be installed, altered or replaced
  level: must
- item: The method used, with examples of calculations and assumptions
  level: must
- item: Mitigation proposals where adverse impacts are found
  level: must
- item: A vibration survey next to a railway line or other significant vibration source
  level: should
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (online checklist, revised effective 6 January 2025), section ''Noise
  and Vibration Impact Assessment'' on the Full Planning application page; also listed on: Full Planning
  application; Outline Planning application; Permission in Principle - Technical Details; Variation or
  Removal of Conditions.'
review-status: unverified
field-status: {}
