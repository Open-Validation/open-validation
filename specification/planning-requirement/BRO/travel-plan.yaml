source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: When a Transport Assessment is required. • When a travel plan would help address a particular
  local traffic problem associated with the planning application, which might otherwise have to be refused
  on local traffic grounds. • When the development is likely to have an adverse affect on sensitive locations
  (eg. heritage and conservation areas or air quality management zones). • When the development is likely
  to exacerbate on-street parking in the locality. • When the development is likely to exacerbate local
  congestion and safety problems. • When the development is in an area where there are local initiatives
  or targets set out in the development plan or local transport plan for the reduction of road traffic,
  or the promotion of public transport, walking and cycling. (Applies particularly to offices, industry,
  health and education uses). • For a major development comprising jobs, shopping, leisure or services.
  … The table below details the thresholds for Transport Assessment and Travel Plan requirements Lower
  thresholds may apply where increases in traffic congestion may result in low air quality or where an
  air quality management area exists … Proposed Use (gross floor area) Food Retail (A1) Greater than 800m2
  Non Food Retail (A1) 800-1,500sq.m Greater than 1,500 m2 Financial/Professional (A2) Greater than 2,500
  m2 Restaurants/Cafes (A3) Greater than 2,500 m2 Drinking Establishments (A4) Greater than 600 m2 Hot
  Food Takeaway (A5) Greater than 500 m2 Business (B1) Greater than 2,500 m2 General Industry (B2) Greater
  than 4,000 m2 Storage/Distribution Greater than 5,000 m2 Hotels (C1) Greater than 100 bedrooms Dwelling
  Houses (C3) Greater than 100 units Hospitals (C2) Greater than 50 beds Hostels (C2) Greater than 400
  residents Assembly/Leisure (D2) Greater than 1,500 m2
confidence: medium
notes: From the council's list (published January 2025), page 31. A travel plan is needed whenever a transport
  assessment is (same table). The other circumstances (a local traffic problem, sensitive locations such
  as conservation areas or air quality management zones, on-street parking, congestion and safety, local
  initiatives or targets) and the lower thresholds that 'may apply' near poor air quality are matters
  of judgement, so they show as discretionary. The matrix (pages 9-12) marks it '?' ('may be needed')
  for these application types; it is shown for them only when the trigger applies. The list is shared
  by Broadland District Council and South Norfolk Council (same file for both).
