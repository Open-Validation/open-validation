reference: affordable-housing-statement
local-authority: BRO
required-if:
  all:
  - application-type:
      in:
      - full
      - non-material-amendment
      - outline
      - s73
      - reserved-matters
  - any:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: site-area-residential
          operator: '>='
          value: 0.5
          description: Housing on a site of 0.5 hectares or more.
    - condition:
        field: exception-site-housing
        value: true
        description: An exception housing scheme of any scale outside defined development boundaries.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: Major housing applications (10 or more dwellings, or a site having an area of 0.5 hectares
  or more) whether or not affordable housing is proposed to be included, • All exception housing schemes
  of any scale outside defined development boundaries.
must-include:
- item: The policy compliant level of affordable housing provision, including housing mix and tenure,
    taking account of up-to-date housing needs for the area
  level: must
- item: 'Where a policy compliant scheme is not proposed: clear justification for the reduced amount of
    affordable housing'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: A policy compliant scheme is not proposed.
- item: Supported by a viability assessment where viability is all or part of the justification
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Viability is used to justify a reduced amount.
confidence: medium
notes: From the council's list (published January 2025), page 13. The matrix (pages 9-12) marks it '?'
  ('may be needed') for these application types; it is shown for them only when the trigger applies. The
  list is shared by Broadland District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
