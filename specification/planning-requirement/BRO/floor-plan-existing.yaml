reference: floor-plan-existing
local-authority: BRO
required-if:
  all:
  - application-type:
      in:
      - approval-condition
      - change-of-use
      - full
      - ldc-existing-use
      - ldc-prospective-use
      - lbc
      - non-material-amendment
      - outline
      - prior-approval
      - s73
      - reserved-matters
  - condition:
      field: building-works
      value: true
      description: The application is for the erection, rebuilding or alteration of a building.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: Floor plans are required showing the existing and proposed layout of the development and
  the nature of the proposed uses (required on all applications that are for erection, rebuilding or alteration
  of a building).
must-include:
- item: Scale clearly indicated, 1:50 or 1:100
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 7, 9. The matrix marks floor plans '?' (may
  be needed) for these types; the text says they are required for the erection, rebuilding or alteration
  of a building. The householder list asks only for proposed floor plans. The list is shared by Broadland
  District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
