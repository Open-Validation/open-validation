reference: floor-plan-proposed
local-authority: BRO
required-if:
  any:
  - all:
    - application-type:
        in:
        - approval-condition
        - change-of-use
        - full
        - ldc-existing-use
        - ldc-prospective-use
        - lbc
        - non-material-amendment
        - outline
        - prior-approval
        - s73
        - reserved-matters
    - condition:
        field: building-works
        value: true
        description: The application is for the erection, rebuilding or alteration of a building.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: Floor plans are required showing the existing and proposed layout of the development and
  the nature of the proposed uses (required on all applications that are for erection, rebuilding or alteration
  of a building). … Where appropriate, floor plans are required showing the proposed layout of the development
  and the nature of the proposed uses.
must-include:
- item: The proposed layout of the development and the nature of the proposed uses
  level: must
- item: Scale clearly indicated, 1:50 or 1:100
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 7, 9. Householder wording from the Householder
  Local Validation List (https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-householder.pdf),
  page 4. For householder applications floor plans are needed 'where appropriate', so that part shows
  as discretionary. The list is shared by Broadland District Council and South Norfolk Council (same file
  for both).
review-status: unverified
field-status: {}
