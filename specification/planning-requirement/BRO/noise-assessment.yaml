reference: noise-assessment
local-authority: BRO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Noise from the development could negatively impact on the neighbouring occupants.
    - condition:
        field: noise-sensitive-use
        value: true
        description: The development is noise sensitive and close to potential sources of noise.
    - ref: major-development
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: Applications where the noise from the development could negatively impact on the neighbouring
  occupants. • Applications that are considered to be noise sensitive and are close to potential sources
  of noise • Major applications which include a Construction Environmental Management Plan (CEMP).
must-include:
- item: Noise and vibration impact assessment prepared by a suitably qualified acoustician
  level: should
- item: Sound insulation and other mitigation measures included in the design
  level: should
- item: 'Air source heat pumps (where not permitted development, or across a new residential development):
    assessment to BS4142 (MCS020 not acceptable)'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Air source heat pumps are proposed (not permitted development, or across a new residential
        development).
confidence: medium
notes: From the council's list (published January 2025), page 25. 'Major applications which include a
  CEMP' is shown as major development, since the list asks for a CEMP with all major developments. The
  matrix (pages 9-12) marks it '?' ('may be needed') for these application types; it is shown for them
  only when the trigger applies. The list is shared by Broadland District Council and South Norfolk Council
  (same file for both).
review-status: unverified
field-status: {}
