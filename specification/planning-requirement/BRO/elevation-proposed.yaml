reference: elevation-proposed
local-authority: BRO
required-if:
  any:
  - application-type:
      in:
      - hh
      - advertising
  - all:
    - application-type:
        in:
        - approval-condition
        - change-of-use
        - full
        - ldc-existing-use
        - ldc-prospective-use
        - lbc
        - non-material-amendment
        - outline
        - prior-approval
        - s73
        - reserved-matters
    - discretionary
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: Elevational drawings of the existing and proposed development are required. … Y = always
  needed ? = may be needed. … Elevational drawings of the proposed development are required.
must-include:
- item: All elevations affected by the proposed development (front, back and both sides where applicable)
  level: should
- item: Scale clearly indicated, 1:50 or 1:100
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 6, 9. Householder wording from the Householder
  Local Validation List (https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-householder.pdf),
  page 4. The matrix marks elevations 'Y' (always needed) for advertisement consent and '?' (may be needed,
  no trigger given) for the other types listed, so those show as discretionary. The list is shared by
  Broadland District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
