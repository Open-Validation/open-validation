reference: viability-assessment
local-authority: BRO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: An economic viability case is advanced to support a non-policy compliant proposal.
    - condition:
        field: planning-obligations-shortfall
        value: true
        description: An economic viability case is advanced to support a non-policy compliant proposal.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: All development where the applicant/agent is advancing an economic viability case to support
  the acceptability of a non-policy compliant proposal
must-include:
- item: Follows the recommended approach in national planning guidance, including standardised inputs
  level: must
- item: Gross development value
  level: must
- item: 'All development costs: build, abnormal, infrastructure, the full cost of planning standards,
    policies and obligations (including CIL), finance, professional, project management, sales and legal
    costs'
  level: must
- item: Land value
  level: must
- item: Competitive return to developers and land owners
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 33. Viability assessments will be made publicly
  available and may be verified independently. The matrix (pages 9-12) marks it '?' ('may be needed')
  for these application types; it is shown for them only when the trigger applies. The list is shared
  by Broadland District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
