reference: waste-management-plan
local-authority: BRO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings (except householder).
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use of a building.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: All developments including new buildings (except householder) or change of use of a building.
must-include:
- item: Means of on site storage, location of storage areas, bin collection points and recycling facilities
    (including 'bring banks')
  level: should
- item: Proposed route of the refuse collection vehicles
  level: should
- item: Any Site Waste Management Plan (SWMP), draft SWMP, or (outline applications only) the principles
    of a future SWMP
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 35. Listed under 'Additional Supporting
  Documents' (supplementary). The list also says SWMPs are compulsory where development exceeds £300,000
  in costs; there is no field for build cost. The matrix (pages 9-12) marks it '?' ('may be needed') for
  these application types; it is shown for them only when the trigger applies. The list is shared by Broadland
  District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
