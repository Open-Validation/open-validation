reference: location-plan
local-authority: BRO
required-if:
  application-type:
    in:
    - hh
    - advertising
    - approval-condition
    - change-of-use
    - full
    - ldc-existing-use
    - ldc-prospective-use
    - lbc
    - outline
    - prior-approval
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: National requirements - These documents are mandatory as part of each application type as
  described in the Planning Act and other relevant planning legislation. … Y = always needed ? = may be
  needed.
must-include:
- item: Shows the application property/site and all adjoining properties
  level: must
- item: At least two named roads
  level: should
- item: Scale 1:1250 (building in an urban area) or 1:2500 (building in a rural area), with the north
    arrow clearly indicated
  level: should
- item: Application site, including access to the highway, outlined in red; any adjoining land in the
    same ownership outlined in blue
  level: should
- item: Not in breach of copyright
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 6, 9. The matrix marks the site location
  plan 'Y' (always needed) for advertisement consent, approval of details reserved by condition, change
  of use, full, both lawful development certificates, listed building consent, outline, prior notification
  and tree works, and leaves it blank for non-material amendments, s73 and reserved matters. The householder
  list (page 3) asks for it with the same content but says the red line 'must' be shown. The list is shared
  by Broadland District Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
