reference: town-centre-impact-assessment
local-authority: BRO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail, leisure or office development outside of town centres.
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with the Development Plan.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Over 2,500 sq m.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
policy: National Planning Policy Framework
source-text: 'BDC: Applications within the Broadland district, for retail, leisure and office development
  outside of town centres, which are not in accordance with the Development Plan will require a Retail
  Assessment if the development is over 2,500sq.m.'
must-include:
- item: How the NPPF sequential test requirements have been met
  level: must
- item: 'Where the sequential test is not met: the likely impacts on the vitality and viability of town
    centres, as the NPPF requires, with mitigation measures for any adverse impacts'
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 27. The list calls it a Retail Impact Assessment
  and gives separate thresholds for Broadland (BDC, used here) and South Norfolk (SNC). The matrix (pages
  9-12) marks it '?' ('may be needed') for these application types; it is shown for them only when the
  trigger applies. The list is shared by Broadland District Council and South Norfolk Council (same file
  for both).
review-status: unverified
field-status: {}
