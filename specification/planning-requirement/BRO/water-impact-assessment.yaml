reference: water-impact-assessment
local-authority: BRO
required-if:
  all:
  - application-type:
      in:
      - change-of-use
      - full
      - outline
      - s73
      - reserved-matters
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: All new residential development.
must-include:
- item: How the development meets the 110 litres per person per day requirement in Part G of the building
    regulations
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 34. The list calls it a Water Efficiency
  Statement. The matrix (pages 9-12) marks it '?' ('may be needed') for these application types; it is
  shown for them only when the trigger applies. The list is shared by Broadland District Council and South
  Norfolk Council (same file for both).
review-status: unverified
field-status: {}
