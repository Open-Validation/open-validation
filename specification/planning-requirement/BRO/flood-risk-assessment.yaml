reference: flood-risk-assessment
local-authority: BRO
required-if:
  site:
    in:
    - flood-risk-zone
    description: The site is within an area at risk of flooding.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-householder.pdf
source-text: Flood risk assessment and drainage strategy If the site is within an area at risk of flooding
  a Flood Risk Assessment (FRA) will be required to demonstrate how flood risk from all sources of flooding
  to the development itself and flood risk to others will be managed now and in the future, taking climate
  change into account
must-include:
- item: How flood risk from all sources to the development itself, and to others, will be managed now
    and in the future, taking climate change into account
  level: must
confidence: medium
notes: The Full planning excerpt gave no trigger; the householder list's trigger is used for all types.
