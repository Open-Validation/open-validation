reference: habitat-baseline
local-authority: BRO
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
policy: Article 7, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Where you, as the applicant, believes the development would be subject to the biodiversity
  gain condition, the application must be accompanied by minimum information set out in Article 7 … scaled
  plan(s), showing the direction of North, showing onsite habitat existing on the date of application
  (or earlier proposed date), including any irreplaceable habitat (if applicable)
must-include:
- item: Scaled plan(s), showing the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or earlier proposed date), including any irreplaceable
    habitat
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 8, 9. Required by law only where the biodiversity
  gain condition applies (householder and other exempt applications are exempt), so the rule is the biodiversity
  gain condition. The matrix marks the BNG condition statement 'Y' for full and outline and '?' for change
  of use and s73, and the metric '?' for change of use, full and s73. The rest of the Biodiversity Gain
  (Planning) Condition Statement is listed as unmapped. The list is shared by Broadland District Council
  and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
