reference: energy-statement
local-authority: BRO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 500
        description: 500 dwellings or more.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 50000
        description: More than 50,000 sq m of non-residential floorspace.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: 500 dwellings or more than 50,000sq.m of non-residential floorspace.
must-include:
- item: How the scheme will provide at least 10% of its energy from decentralised, renewable or low carbon
    sources
  level: must
- item: Whether or not there is viable and practicable scope for exceeding that minimum percentage
  level: must
- item: How the scheme has used any available local economies of scale to maximise energy from decentralised
    and renewable or low carbon sources
  level: must
- item: The elements of the scheme that address sustainable development issues, including positive environmental,
    social and economic implications
  level: should
- item: That all viable and practicable steps have been taken to maximise sustainable construction
  level: should
- item: Accessibility and parking provision, linked with any Transport Assessment
  level: should
- item: How water efficiency is maximised
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 19. The list calls it an Energy Statement
  / Sustainability Appraisal. The matrix (pages 9-12) marks it '?' ('may be needed') for these application
  types; it is shown for them only when the trigger applies. The list is shared by Broadland District
  Council and South Norfolk Council (same file for both).
review-status: unverified
field-status: {}
