reference: biodiversity-survey-report
local-authority: BRO
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Impacts on a protected species are likely.
  - site:
      in:
      - priority-habitat
      description: Impacts on a Biodiversity Action Plan (BAP) habitat are likely.
  - condition:
      field: loss-of-habitat-features
      value: true
      description: The proposal involves the loss of a tree or trees, removal of a hedge or the filling
        in of any natural pond or ditch.
source-url: https://www.southnorfolkandbroadland.gov.uk/asset-library/making-a-planning-application-2025-amends.pdf
source-text: 'Ecology Impact Assessment Where impacts upon a protected species or Biodiversity Action
  Plan (BAP) habitat are likely to result from a development, surveys must be provided to support a planning
  application and where necessary include proposals for long term mitigation of the protected species
  or BAP habitat within the site.


  Householder: Ecology survey A basic ecology survey will be required for any proposal that involves the
  loss of a tree/s, removal of a hedge or the filling in of any natural pond or ditch.'
must-include:
- item: Proposals for long term mitigation of the protected species or BAP habitat within the site, where
    necessary
  level: must
confidence: medium
notes: The householder list's basic ecology survey trigger and the non-householder list's protected species
  / BAP habitat trigger, combined.
review-status: unverified
field-status: {}
