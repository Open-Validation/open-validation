source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: 'Where the following reasons are stated: -1. Condition of the tree(s) - e.g. it is diseased,
  or you have fears that it might break or fall - 2. Alleged damage to property - e.g. subsidence or damage
  to drains or drives. You are required to provide written arboricultural advice or other diagnostic information
  from an appropriate expert as stated in the application guidance notes.'
confidence: medium
notes: From the council's list (published January 2026), page 47. Tree Works applications (Section 4).
  Needed when the reason for the works is the tree's condition or alleged damage to property; shown as
  discretionary because no field records the stated reason.
