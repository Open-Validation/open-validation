reference: heritage-statement
local-authority: CHA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      description: The site is in a conservation area, the property is a listed building, or the proposal
        affects a heritage asset or its setting.
  - discretionary
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/Validation%20requirements%20for%20Planning%20Applications.pdf
source-text: Heritage Statement A heritage statement is required if your application site falls within
  a conservation area, your property is a listed building, or your proposal impacts a heritage asset or
  its setting.
confidence: medium
notes: Also listed in the Householder guide (audit, wrong_app_type). Other heritage assets are shown as
  officer discretion.
