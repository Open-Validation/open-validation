reference: heritage-statement
local-authority: CHA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
        - outline
        - reserved-matters
        - s73
    - site:
        in:
        - conservation-area
        - listed-building
        - locally-listed-building
        description: The application affects a conservation area, listed building or locally listed building.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: NPPF paragraph 207; Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: All applications affecting a conservation area, listed building or locally listed building
  … A heritage statement is required if your application site falls within a conservation area, your property
  is a listed building, or your proposal impacts a heritage asset or its setting.
must-include:
- item: The significance of the heritage asset affected
  level: must
- item: The contribution the setting of the heritage asset makes to its significance
  level: must
- item: The principles of and justification for the proposed works
  level: must
- item: The impact of the proposal on the significance of the heritage asset
  level: must
- item: The sources considered
  level: should
- item: The expertise consulted
  level: should
- item: The steps taken to avoid or minimise any adverse impacts on the significance of the building
  level: should
confidence: medium
notes: From the council's list (published January 2026), pages 8, 15, 26. Can be part of the design and
  access statement where one is required; otherwise a separate written statement. For householder applications
  'impacts a heritage asset or its setting' is shown as discretionary. Not needed for advertisement consent
  or lawful development certificates (Quick Summary Guide).
review-status: unverified
field-status: {}
