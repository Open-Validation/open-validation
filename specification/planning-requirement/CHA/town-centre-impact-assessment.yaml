reference: town-centre-impact-assessment
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and leisure development outside town centres.
  - condition:
      field: departure-from-development-plan
      value: true
      description: The proposal is not in accordance with an up-to-date plan.
  - discretionary
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Charnwood Local Plan policy T1; NPPF paragraphs 94-95
source-text: Applications for retail and leisure development outside town centres, which are not in accordance
  with an up-to-date plan if over the relevant thresholds.
confidence: medium
notes: From the council's list (published January 2026), pages 20, 40. Called the Retail impact assessment.
  The list does not give 'the relevant thresholds' (it refers to the NPPF and PPG), so that part is discretionary.
review-status: unverified
field-status: {}
