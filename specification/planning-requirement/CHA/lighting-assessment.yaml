reference: lighting-assessment
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: external-lighting
        value: true
        description: The proposal involves the installation of floodlighting or other external lighting
          that has the potential to impact on existing light sensitive uses.
    - discretionary
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: NPPF paragraph 198; Gov.uk guidance on light pollution
source-text: If your proposal is in the vicinity of an existing light source and that light source has
  the potential to impact on the use proposed. Or. Your proposal involves the installation of floodlighting
  or other external lighting and that lighting has the potential to impact on existing light sensitive
  uses
must-include:
- item: Hours of operation
  level: must
- item: Light spillage
  level: must
- item: Light levels
  level: must
- item: Column heights
  level: must
- item: Layout plan with beam orientation
  level: must
- item: Equipment design
  level: must
- item: Mitigation measures if required to meet current light guidelines
  level: must
- item: Details of any timers or automatic switch-off/on
  level: must
confidence: medium
notes: From the council's list (published January 2026), pages 19, 37. Called the Light impact assessment.
  A proposal in the vicinity of an existing light source that 'has the potential to impact on the use
  proposed' is shown as discretionary.
review-status: unverified
field-status: {}
