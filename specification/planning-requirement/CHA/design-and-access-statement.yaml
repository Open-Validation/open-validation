reference: design-and-access-statement
local-authority: CHA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - s73
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: The site is in a designated area (a world heritage site or a conservation area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9 and
  article 11(2)(c)
source-text: 'Applications for major development Applications for development in a designated area*, where
  the proposed development consists of: o One or more dwellings; or o A building or buildings with a floor
  space of 100 square metres or more Applications for listed building consent *For the purposes of design
  and access statements, a designated area means a world heritage site or a conservation area'
must-include:
- item: Explains the design principles and concepts applied to the proposed development
  level: must
- item: Demonstrates the steps taken to appraise the context of the development and how the design takes
    that context into account
  level: must
- item: Explains the applicant's approach to access and how relevant local plan policies have been taken
    into account
  level: must
- item: Details any consultation on access issues and how its outcome has informed the development
  level: must
- item: Explains how any specific issues which might affect access to the development have been addressed
  level: must
- item: A townscape scene, where relevant for the proposal
  level: should
- item: A sustainable construction and energy statement, where relevant for the proposal
  level: should
confidence: medium
notes: From the council's list (published January 2026), pages 10, 15, 28. The Householder Application
  Guide says a householder statement is only needed 'in a conservation area where the proposal exceeds
  100sqm'.
review-status: unverified
field-status: {}
