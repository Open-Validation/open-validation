reference: design-and-access-statement
local-authority: CHA
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a designated area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The proposal creates 100 square metres or more of floorspace.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
confidence: medium
notes: 'Audit (wrong_trigger): the workbook carried the Tree Survey excerpt. From the audit: major development,
  dwellings or 100 sqm+ in a designated area, and LBC; the Householder guide lists it in conservation
  areas over 100 sqm.'
review-status: unverified
field-status: {}
