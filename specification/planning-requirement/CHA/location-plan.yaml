reference: location-plan
local-authority: CHA
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - outline
    - s73
    - advertising
    - lbc
    - ldc
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 11(2)(a)
  and article 7(1)(c)(i)
source-text: All Applications apart from Reserved Matters
must-include:
- item: Based on an up-to-date map, including the map licence number when necessary
  level: should
- item: At 1:1250 or scaled to fit onto A4 or A3 paper
  level: should
- item: Identifies at least one named road and any buildings or land adjoining the site
  level: should
- item: Application site outlined with a continuous red line, including all land needed to carry out the
    development and access from the public highway
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (published January 2026), pages 7, 14, 24.
review-status: unverified
field-status: {}
