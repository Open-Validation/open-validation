reference: arboriculturist-report
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
      - lbc
      - ldc
  - condition:
      field: trees-on-or-near-site
      value: true
      description: 'There are trees at the site that could be affected by the proposed development (householder:
        trees with a diameter greater than 75 mm within influencing distance).'
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Charnwood Local Plan policy EV7; Town and Country Planning (Tree Preservation) (England) Regulations
  2012; BS 5837:2012
source-text: If there are trees at the site that could be affected by the proposed development. … For
  trees with a diameter greater than 75 mm within influencing distance of the proposed development a Tree
  Survey/Report will be required.
must-include:
- item: Species, spread, roots and position of trees
  level: must
- item: Which trees are to be felled and which are to be retained
  level: must
- item: Which trees will be affected in any way by the proposed development
  level: must
- item: The measures that will be used to protect them during construction
  level: must
- item: 'In line with BS 5837:2012: a tree survey'
  level: must
- item: A tree constraints plan
  level: must
- item: An arboricultural implications assessment
  level: must
- item: An arboricultural method statement, including a tree protection plan
  level: must
- item: Prepared by a qualified arboriculturist with professional indemnity insurance
  level: should
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (published January 2026), pages 10, 15, 27. Called the Tree Survey. Not
  needed for advertisement consent (Quick Summary Guide).
review-status: unverified
field-status: {}
