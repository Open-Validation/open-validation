submission-standards:
- item: All plans include critical dimensions and are drawn to a recognisable, annotated, metric scale
  level: must
- item: Plans titled and numbered, identifying revisions, and annotated with dimensions and a scale bar
  level: should
- item: A schedule of drawings is encouraged with all applications, especially major applications
  level: should
- item: Documents and drawings labelled clearly with the title and drawing number
  level: should
- item: 'Emailed applications: documents attached as PDFs; emails and individual documents must not exceed
    20 MB'
  level: must
- item: Personal or sensitive personal data submitted in a separate document so it can be marked confidential
  level: should
- item: Plans indicate the paper size of the original and allow for scaling; plans marked 'Do not scale'
    are not accepted
  level: must
