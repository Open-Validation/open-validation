reference: land-contamination-assessment
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - site:
      in:
      - contaminated-land
      description: Land which could potentially be contaminated as a result of current or historic use.
  - any:
    - condition:
        field: operational-development
        value: true
        description: The proposal is to re-develop the land.
    - condition:
        field: involves-change-of-use
        value: true
        description: The proposal would significantly change the use of the land.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7(1)(b)
  and article 11(2)(a); National Planning Practice Guidance
source-text: If your proposal is to re-develop or significantly change the use of a piece of land which
  could potentially be contaminated as a result of current or historic use.
must-include:
- item: A Phase 1 contaminated land assessment
  level: must
- item: A Phase 2 assessment, including a remediation strategy as required, if the Phase 1 assessment
    says one is needed
  level: must
  required-if: discretionary
- item: A verification report for any remediation completed
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published January 2026), pages 18, 34. Called the Contaminated land assessment;
  linked to section 15 (Existing Use) of the application form.
review-status: unverified
field-status: {}
