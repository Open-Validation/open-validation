reference: land-contamination-assessment
local-authority: CHA
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New-build development.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
  - site:
      in:
      - contaminated-land
      description: The land could be contaminated as a result of current or historic use.
