reference: schedule-of-works
local-authority: CHA
required-if:
  all:
  - site:
      in:
      - listed-building
      description: The works are to a listed building.
  - any:
    - condition:
        field: structural-alteration
        value: true
        description: Structural alterations to a listed building.
    - condition:
        field: demolition
        value: true
        description: Demolition of a listed building.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: Structural alterations to a listed building or demolition of a listed building
must-include:
- item: 'Where any part of the building (including ceilings, partitions, fixtures and fittings) is to
    be removed: the location, extent and character of the items, shown on the existing elevations, plans
    and sections and cross-referenced to the schedule'
  level: must
- item: 'Where major repair works are proposed: a supplementary schedule of works and a method statement
    explaining the principle'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published January 2026), pages 20, 41. The Quick Summary Guide marks it
  'Always Required' for listed building consent.
review-status: unverified
field-status: {}
