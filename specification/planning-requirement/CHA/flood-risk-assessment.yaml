reference: flood-risk-assessment
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - any:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2 or 3.
    - site:
        in:
        - critical-drainage-area
        description: The site is in Flood Zone 1 in an area with critical drainage problems as notified
          by the Environment Agency.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Charnwood Local Plan policy CC1; Environment Agency flood risk standing advice
source-text: If the site is located within flood zones 2 or 3. Or. In an area within flood zone 1 which
  has critical drainage problems as notified by the Environment Agency
must-include:
- item: Site address
  level: should
- item: A description of the development
  level: should
- item: An assessment of the flood risk from all sources of flooding, plus an allowance for climate change
  level: should
- item: The estimated flood level for the development, considering the impacts of climate change over
    its lifetime
  level: should
- item: Details of the finished floor levels
  level: should
- item: Details of flood resistance and resilience plans
  level: should
- item: Any supporting plans and drawings
  level: should
- item: Any other information the relevant standing advice says to include
  level: should
confidence: medium
notes: From the council's list (published January 2026), pages 10, 15, 27. For householder applications
  the council has a householder FRA proforma for most minor flood risk situations. Not needed for advertisement,
  listed building consent or lawful development certificate applications (Quick Summary Guide).
review-status: unverified
field-status: {}
