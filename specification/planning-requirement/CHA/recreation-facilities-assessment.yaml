reference: recreation-facilities-assessment
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
      - condition:
          field: loss-of-open-space
          value: true
          description: There would be a loss of open space, including playing fields.
    - condition:
        field: loss-of-open-space
        value: true
        description: The development includes the loss of all or any part of a playing field.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Charnwood Local Plan policy EV9; Open Spaces Strategy 2018-2036; NPPF paragraphs 103-108
source-text: All major residential developments where there would be a loss of open space, including playing
  fields. All development that includes the loss of all or any part of a playing field
must-include:
- item: Relevant local and national planning policy on open spaces and how the development addresses it
  level: should
- item: Open spaces in the area and the site's relationship to them
  level: should
- item: Supply and demand for the type of development proposed
  level: should
- item: Any remediation to compensate the local community for the loss of the space
  level: should
confidence: medium
notes: From the council's list (published January 2026), pages 20, 40. Called the Open Space assessment;
  the list says it 'will typically address' these points.
review-status: unverified
field-status: {}
