reference: sci
local-authority: CHA
required-if:
  all:
  - condition:
      field: wind-turbine
      value: true
      description: The development involves an installation for harnessing wind power for energy production.
  - any:
    - condition:
        field: wind-turbine-count
        operator: '>'
        value: 2
        description: The development involves the installation of more than two turbines.
    - condition:
        field: turbine-hub-height
        operator: '>'
        value: 15
        description: The hub height of any turbine exceeds 15 metres.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: 'Planning Practice Guidance (renewable and low carbon energy: compulsory pre-application consultation)'
source-text: Any development involving an installation for the harnessing of wind power for energy production
  where- a) the development involves the installation of more than two turbines b) the hub height of any
  turbine exceeds 15 metres
confidence: medium
notes: From the council's list (published January 2026), pages 20, 42. Called the Statement of community
  involvement (SCI).
review-status: unverified
field-status: {}
