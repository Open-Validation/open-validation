reference: landscaping-plan
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: external-space
      value: true
      description: The application includes external space.
  - discretionary
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Charnwood Local Plan policies DS4 and EV1; NPPF paragraph 135
source-text: Applications that include external space, outline, full, and reserved matters where necessary.
must-include:
- item: Trees and hedges to be removed, clearly differentiating retained existing trees/hedges from those
    proposed
  level: should
- item: Details of the planting of trees and/or shrubs, surface materials, boundary screen walls and fences
  level: must
- item: Materials
  level: must
- item: Species
  level: must
- item: Tree and plant sizes, numbers and planting densities
  level: must
- item: Levels, gradients and any earthworks required
  level: must
- item: Proposed timing of implementation
  level: must
- item: Proposals for long-term maintenance and landscape management
  level: should
confidence: medium
notes: From the council's list (published January 2026), pages 19, 37. Called the Landscaping scheme;
  it can be part of a Landscape and Visual Assessment (LVIA). Shown as discretionary because the list
  says 'where necessary'.
review-status: unverified
field-status: {}
