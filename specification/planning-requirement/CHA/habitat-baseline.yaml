source-text: Where a proposed development would result in >25sqm of change to area habitats, or >5m of
  hedgerow habitats or watercourse habitats … supported by a scale plan showing north and the extant of
  onsite habitat. … This should be accompanied by a scale habitat plan which uses UKHAB types
