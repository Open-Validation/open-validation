reference: affordable-housing-statement
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major development (schemes for 10 or more dwellings).
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Charnwood Local Plan policy H4; National Planning Policy Framework
source-text: Major development (schemes for 10 or more dwellings)
must-include:
- item: The mix of private and affordable units, with numbers of bedrooms, the floor space of habitable
    areas and how many people can be housed in each property
  level: must
- item: A clear and full explanation of any different levels or types of affordability or tenure for different
    units
  level: must
- item: The proposed mix of tenure
  level: must
- item: Shows how the development meets the threshold in the council's Development Plan
  level: must
- item: The location of the affordable units and the number of habitable rooms and/or bedrooms, and/or
    their floor space, shown on the floor plans
  level: should
confidence: medium
notes: From the council's list (published January 2026), pages 17, 31.
review-status: unverified
field-status: {}
