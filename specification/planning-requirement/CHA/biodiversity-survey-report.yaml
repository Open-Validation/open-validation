reference: biodiversity-survey-report
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: protected-species
        value: true
        description: The development is likely to affect species protected under the Wildlife and Countryside
          Act 1981, the Conservation of Habitats and Species Regulations 2010 or the Protection of Badgers
          Act 1992.
    - site:
        in:
        - priority-habitat
        description: The development is likely to affect habitats/species of principal importance (section
          41 of the NERC Act 2006) or in the Leicester, Leicestershire and Rutland Biodiversity Action
          Plan.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Charnwood Local Plan policy EV6; Charnwood Biodiversity Planning Guidance (May 2022)
source-text: 'Where a proposed development is likely to affect: • Species protected under the Wildlife
  and Countryside Act 1981 (as amended), the Conservation of Habitats and Species Regulations 2010 , the
  Protection of Badgers Act 1992 • Habitats/species of principal importance listed under Section 41 of
  the Natural Environment and Rural Communities Act 2006 or in the Leicester, Leicestershire and Rutland
  Biodiversity Action plan'
must-include:
- item: Undertaken by competent persons with suitable qualifications and experience, at an appropriate
    time of year, in suitable weather and using nationally recognised survey methods where available
  level: must
- item: Records which species are present and identifies their numbers (may be approximate)
  level: must
- item: Maps their distribution and use of the area, site, structure or feature (for example feeding,
    shelter and breeding)
  level: must
- item: Identifies and describes potential impacts likely to harm the protected species and/or their habitats,
    direct and indirect, during construction and afterwards
  level: must
- item: 'Where harm is likely: how alternative designs or locations have been considered'
  level: must
  required-if: discretionary
- item: 'Where harm is likely: how adverse effects will be avoided wherever possible'
  level: must
  required-if: discretionary
- item: 'Where harm is likely: how unavoidable impacts will be mitigated or reduced'
  level: must
  required-if: discretionary
- item: 'Where harm is likely: how impacts that cannot be avoided or mitigated will be compensated'
  level: must
  required-if: discretionary
- item: 'Where harm is likely: how species numbers are likely to change after development'
  level: must
  required-if: discretionary
- item: 'Where harm is likely: how features or habitats used by protected species can be enhanced, restored
    or added to'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published January 2026), pages 10, 15-16, 29. Called the Ecological Assessment
  (Protected Species Assessment). For householder applications it is 'only required in exceptional circumstances
  when a protected species will be impacted', e.g. older timber-framed buildings that could hold bats.
review-status: unverified
field-status: {}
