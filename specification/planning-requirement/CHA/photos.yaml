reference: photos
local-authority: CHA
required-if:
  any:
  - all:
    - condition:
        field: demolition
        value: true
        description: The proposal involves the demolition of an existing building.
    - site:
        in:
        - conservation-area
        description: The building is in a conservation area.
  - site:
      in:
      - listed-building
      description: Works to a listed building, including internal works.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: If the proposal involves the demolition of an existing building in a conservation area or
  a listed building [including internal works to a listed building].
must-include:
- item: Dated and numbered
  level: must
- item: Cross-referenced to the drawings
  level: must
- item: Showing the building, its surrounding area and the areas where the works/alterations are proposed
  level: must
confidence: medium
notes: From the council's list (published January 2026), pages 20, 40. The Quick Summary Guide marks photographs
  'Often Required' for listed building consent and 'Not Required' for the other columns.
review-status: unverified
field-status: {}
