reference: site-plan
local-authority: CHA
required-if:
  application-type:
    in:
    - hh
    - full
    - change-of-use
    - outline
    - reserved-matters
    - s73
    - advertising
    - lbc
    - ldc
    - pa-extension
    - pa-storey
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 11(2)(a)
  and article 7(1)(c)(ii)
source-text: All Applications … The site plan should be drawn at 1:500 or 1:200 scale. … a plan indicating
  the site and showing the proposed development (and any existing enlargement of the original dwellinghouse
  to which the enlarged part will be joined); … a plan which is drawn to an identified scale and shows
  the direction of north, indicating the site and showing the proposed development;
must-include:
- item: Drawn at 1:500 or 1:200
  level: should
- item: Direction of north
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on site
  level: should
- item: Written dimensions, including those to the boundaries
  level: should
- item: All buildings, roads and footpaths on adjoining land, including access arrangements, unless they
    would not influence or be affected by the development
  level: should
- item: All public rights of way crossing or adjoining the site, unless they would not influence or be
    affected by the development
  level: should
- item: The position of all trees on the site and on adjacent land, unless they would not influence or
    be affected by the development
  level: should
- item: The extent and type of any hard surfacing, unless it would not influence or be affected by the
    development
  level: should
- item: Boundary treatment, including walls or fencing, where proposed
  level: should
- item: 'Larger home extension: the site, the proposed development and any existing enlargement of the
    original dwellinghouse it will be joined to'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
- item: 'Additional storeys: drawn to an identified scale and showing the direction of north, the site
    and the proposed development'
  level: must
  required-if:
    application-type:
      in:
      - pa-storey
confidence: medium
notes: From the council's list (published January 2026), pages 8, 14, 25, 48. Called the Site Plan/Block
  Plan. The prior approval plans come from Section 4 (larger home extensions and additional storeys).
review-status: unverified
field-status: {}
