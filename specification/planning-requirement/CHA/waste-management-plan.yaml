reference: waste-management-plan
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: waste-storage-facilities
        value: true
        description: New development which would result in the need for new bin storage or recycling facilities.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
    - discretionary
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: National Planning Policy Framework section 12
source-text: All new development which would result in the need for new bin storage or recycling facilities
  … All residential development and other applications that will have an impact on the generation of waste.
must-include:
- item: A scaled plan showing the location of bin stores
  level: must
- item: Details of the materials, design and type of enclosure
  level: must
- item: Elevations with dimensions
  level: should
- item: Details of collection arrangements
  level: must
- item: Tracking details for a waste vehicle
  level: must
confidence: medium
notes: 'From the council''s list (published January 2026), pages 17, 20, 33, 41. Combines two items in
  the list: ''Bin stores/recycling facilities'' and ''Site waste management plan''. ''Other applications
  that will have an impact on the generation of waste'' is shown as discretionary.'
review-status: unverified
field-status: {}
