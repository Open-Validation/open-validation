reference: noise-assessment
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - change-of-use
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: The development is close to existing sources of noise.
    - condition:
        field: noise-generating-use
        value: true
        description: The proposal will generate significant noise levels.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: NPPF paragraph 198; Gov.uk guidance on noise
source-text: Where development is close to existing sources of noise, or the proposal will generate significant
  noise levels.
must-include:
- item: Prepared by a qualified acoustician
  level: must
- item: Mitigation measures if required to meet current noise guidelines
  level: must
confidence: medium
notes: From the council's list (published January 2026), pages 19, 39. Called the Noise impact assessment.
review-status: unverified
field-status: {}
