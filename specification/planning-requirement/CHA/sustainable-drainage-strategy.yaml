reference: sustainable-drainage-strategy
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - ref: major-development
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Charnwood Local Plan policy CC2; NPPF paragraphs 170-182
source-text: All major development
must-include:
- item: Details of the implementation, adaptation, maintenance and management of the sustainable drainage
    system
  level: must
- item: The arrangements for adoption by any public body or statutory undertaker, or other arrangements
    to secure the system's effective operation throughout its lifetime
  level: must
- item: 'If the development does not include SuDS: evidence that such measures are not feasible and details
    of how drainage will be dealt with, including during construction'
  level: must
confidence: medium
notes: From the council's list (published January 2026), pages 21, 43. Called Sustainable urban drainage
  systems (SUDS). The lead local flood authority has a checklist of the information it needs.
review-status: unverified
field-status: {}
