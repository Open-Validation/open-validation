reference: bng-metric
local-authority: CHA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Charnwood Local Plan policy EV6; Charnwood Biodiversity Planning Guidance (May 2022)
source-text: Where a proposed development would result in >25sqm of change to area habitats, or >5m of
  hedgerow habitats or watercourse habitats
must-include:
- item: Uses the Statutory Biodiversity Metric
  level: must
- item: Pre-development value
  level: must
- item: Assessment completion date
  level: must
- item: Version of the metric used
  level: must
- item: If the date of assessment is earlier than the application date, an explanation of the reason for
    choosing that date
  level: must
- item: Where there is a net loss requiring a biodiversity offsetting payment, the full cost of any offsetting
  level: must
- item: Surveys undertaken by competent persons at an appropriate time of year, in suitable conditions
    and using a nationally recognised methodology
  level: should
confidence: medium
notes: 'From the council''s list (published January 2026), pages 16, 30. Called the Biodiversity Impact
  Calculation Spreadsheet. The council''s trigger (more than 25 sq m of area habitat or 5 m of hedgerow
  or watercourse habitat changed) is the statutory de minimis exemption, so the file uses the biodiversity
  gain condition: householder and other exempt applications are exempt by law.'
review-status: unverified
field-status: {}
