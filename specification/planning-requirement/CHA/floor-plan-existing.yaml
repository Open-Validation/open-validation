reference: floor-plan-existing
local-authority: CHA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - lbc
        - ldc
        - reserved-matters
        - s73
    - condition:
        field: operational-development
        value: true
        description: Operational development takes place.
  - application-type:
      in:
      - change-of-use
  - all:
    - application-type:
        in:
        - full
        - ldc
        - reserved-matters
        - s73
    - condition:
        field: involves-change-of-use
        value: true
        description: The application is for a change of use.
  - all:
    - application-type:
        in:
        - outline
    - discretionary
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 11(2)(a)
  and article 7(1)(c)(ii)
source-text: All applications where operational development takes place and all changes of use
must-include:
- item: Drawn at a minimum scale of 1:50 or 1:100
  level: must
- item: Titled and numbered, identifying revisions
  level: should
- item: Annotated with dimensions and a scale bar
  level: should
- item: Shows the proposed works in relation to what is already there, highlighting any structures to
    be demolished
  level: should
confidence: medium
notes: 'From the council''s list (published January 2026), pages 8, 14, 25. Outline applications show
  as discretionary: the Quick Summary Guide marks floor plans ''Sometimes Required'' for outline. Not
  needed for advertisement consent.'
review-status: unverified
field-status: {}
