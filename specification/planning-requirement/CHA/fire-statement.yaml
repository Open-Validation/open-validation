reference: fire-statement
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: The building is 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: The building has 7 or more storeys.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9A
  and article 11(2)(ca)
source-text: 'Required only on buildings that: • Contain two or more dwellings or educational accommodation
  • Are 18m or more in height, or 7 more storeys'
must-include:
- item: The principles, concepts and approach relating to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: What consultation has been undertaken on fire safety, and what account has been taken of it
  level: must
- item: How policies on fire safety in relevant local development documents have been considered
  level: must
confidence: medium
notes: From the council's list (published January 2026), pages 18, 36.
review-status: unverified
field-status: {}
