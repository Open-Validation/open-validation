reference: elevation-existing
local-authority: CHA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
        - lbc
        - ldc
        - reserved-matters
        - s73
    - condition:
        field: operational-development
        value: true
        description: Operational development takes place.
  - application-type:
      in:
      - advertising
      - pa-storey
  - all:
    - application-type:
        in:
        - outline
    - discretionary
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 11(2)(a)
  and article 7(1)(c)(ii)
source-text: 'All applications where operational development takes place. … a plan which is drawn to an
  identified scale and shows: (i) the existing and proposed elevations of the dwellinghouse, and (ii)
  the position and dimensions of the proposed windows.'
must-include:
- item: Drawn at a minimum scale of 1:50 or 1:100
  level: must
- item: Titled and numbered, identifying revisions
  level: should
- item: Annotated with dimensions and a scale bar
  level: should
- item: Shows the proposed works in relation to what is already there, highlighting any structures to
    be demolished
  level: should
confidence: medium
notes: From the council's list (published January 2026), pages 8, 14, 25, 48. The Quick Summary Guide
  marks elevations 'Always Required' for advertisement consent and 'Sometimes Required' for outline (shown
  as discretionary). Prior approval for additional storeys needs existing and proposed elevations (Section
  4).
review-status: unverified
field-status: {}
