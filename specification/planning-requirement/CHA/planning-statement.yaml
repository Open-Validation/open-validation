reference: planning-statement
local-authority: CHA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - change-of-use
        - outline
        - reserved-matters
        - s73
    - ref: major-development
  - application-type:
      in:
      - reserved-matters
      - s73
      - non-material-amendment
  - all:
    - application-type:
        in:
        - hh
        - full
        - change-of-use
        - outline
    - discretionary
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: National Planning Policy Framework; Planning Practice Guidance
source-text: All major applications and when there is specific need to justify the works proposed in an
  application … Required only where there is a need to justify the use of specific rooms or explain special
  circumstances of specific development. … Statement clearly explaining the proposed amendment
must-include:
- item: Explains the principles of and justification for the proposed works
  level: should
- item: Explains how the proposed development accords with policies in the local plan
  level: should
- item: Details of any pre-application consultation carried out
  level: should
- item: How the reserved matters accord with the plans in the outline approval and meet the conditions
    attached to the outline permission
  level: should
  required-if:
    application-type:
      in:
      - reserved-matters
- item: A schedule of changes clearly showing the full extent of all changes across the site
  level: should
  required-if:
    application-type:
      in:
      - s73
- item: Clearly explains the proposed amendment
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
confidence: medium
notes: From the council's list (published January 2026), pages 11, 16, 29, 47. The Quick Summary Guide
  marks the planning statement 'Always Required' for major, reserved matters and variation of condition
  applications. For other applications it depends on whether there is a specific need to justify the works
  (discretionary). For a non-material amendment, Section 4 asks for a statement explaining the amendment.
review-status: unverified
field-status: {}
