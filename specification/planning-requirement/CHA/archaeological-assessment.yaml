reference: archaeological-assessment
local-authority: CHA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - site:
      in:
      - archaeological-priority-area
      description: The site is within an archaeological alert area.
  - condition:
      field: ground-disturbance
      value: true
      description: The proposal involves disturbance of previously undisturbed ground.
source-url: https://www.charnwood.gov.uk/files/documents/validation_requirements_for_planning_applications/1A%20Local%20Validation%20List%202026%20FINAL%20PDF.pdf
policy: Charnwood Local Plan policy EV6
source-text: If your proposals involve a disturbance of previously undisturbed ground within an archaeological
  alert area
must-include:
- item: An archaeological desk-based assessment
  level: must
- item: A field evaluation report, where necessary
  level: must
  required-if: discretionary
- item: A written statement explaining the principles and justification for the works and the impact on
    archaeological features
  level: must
confidence: medium
notes: From the council's list (published January 2026), pages 17, 32.
review-status: unverified
field-status: {}
