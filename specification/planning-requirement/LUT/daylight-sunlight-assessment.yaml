reference: daylight-sunlight-assessment
local-authority: LUT
required-if:
  any:
  - condition:
      field: storey-count
      operator: '>'
      value: 4
      description: Buildings exceeding four storeys in height where adjoining other developed land or
        public open spaces.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policy LLP25 (High Quality Design)
source-text: 'Statements will be required in support of all applications involving: • buildings exceeding
  four storeys in height where adjoining other developed land or public open spaces • where proposed buildings
  or extensions could lead to overshadowing of other proposed buildings or spaces within the same development
  site • where the application site is itself subject to significant shading from adjoining buildings
  or trees'
must-include:
- item: Daylight, vertical sky component, sunlight availability and shadow study assessed against the
    BRE criteria
  level: should
- item: Existing and expected levels of daylight, sunlight and overshadowing on neighbouring properties
  level: must
- item: Measures to mitigate the expected impact
  level: must
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 14. Overshadowing of other
  buildings or spaces within the same site, and sites that are themselves significantly shaded, are shown
  as discretionary (no field).
review-status: unverified
field-status: {}
