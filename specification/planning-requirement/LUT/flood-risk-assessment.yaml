reference: flood-risk-assessment
local-authority: LUT
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development proposals of one hectare or greater.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development proposals of one hectare or greater.
  - site:
      in:
      - flood-risk-zone
      description: New development in flood zones 2 and 3.
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP25, LLP36 (Flood Risk) and LLP37
source-text: Flood Risk Assessments will be required in Luton for all development proposals of one hectare
  or greater and all proposals for new development located in flood zones 2 and 3.
must-include:
- item: The flood risk to property and people now and with climate change, from all sources, and how it
    will be managed
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: must
- item: Design of surface water management systems, including SuDS, with surface water discharge reduced
    to the greenfield run-off rate of 5 l/s/ha from all impermeable areas
  level: must
- item: Safe access to and from the development in areas at risk of flooding
  level: must
- item: Flood compensation storage for displaced flood water in zone 3 and 3b
  level: must
  required-if:
    site:
      in:
      - flood-risk-zone
      description: In flood zone 3.
- item: A surface water drainage strategy, for all new development including a single dwelling
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New development, including a single dwelling.
  source-text: Surface Water Drainage Strategy must be set out within the FRA for all new development
    applications, including a single dwelling.
- item: Prepared in consultation with the council, statutory consultees and the LLFA, referring to the
    Local Plan, Surface Water Management Plan, Local Flood Risk Management Strategy, SFRAs and land drainage
    byelaws
  level: should
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 19-20. The flood risk sequential
  test (major development in flood zones 2 and 3) is listed separately (see unmapped). The list says a
  surface water drainage strategy 'must be set out within the FRA for all new development applications,
  including a single dwelling'; that is shown as an item, not as a trigger for an FRA.
review-status: unverified
field-status: {}
