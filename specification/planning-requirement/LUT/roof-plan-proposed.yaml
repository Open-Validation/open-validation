reference: roof-plan-proposed
local-authority: LUT
required-if:
  any:
  - condition:
      field: roof-alteration
      value: true
      description: Roof alterations are proposed.
  - condition:
      field: new-build
      value: true
      description: A roof would be created by the development.
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required only where roof alterations are proposed. ... Roof plans should be provided for
  any roof that would be created or altered by the proposed development
must-include:
- item: The shape and materials of the roof (the roofing material to be used)
  level: must
- item: 'At 1:100 (householder checklist: 1:50 or 1:100)'
  level: should
- item: Its location
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 9. Householder checklist (v1.0,
  March 2025), page 4.
review-status: unverified
field-status: {}
