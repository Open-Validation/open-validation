reference: floor-plan-existing
local-authority: LUT
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New development.
  - condition:
      field: building-works
      value: true
      description: Existing buildings altered by the proposed development.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Existing and proposed floor plans (scale 1:50/100). All floor plans must be clearly labelled.
  ... Floor plans should be provided for: • new development • existing buildings altered by the proposed
  development'
must-include:
- item: At 1:50 or 1:100, clearly labelled
  level: must
- item: Existing buildings or walls to be demolished clearly shown
  level: must
- item: All dimensions in metric (length, width and height on each floor) and boundary lines on all sides
  level: must
- item: New buildings shown in context with adjacent buildings (with property numbers) and all boundary
    lines
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New buildings.
- item: Any shared party wall clearly shown
  level: must
  required-if: discretionary
  source-text: Where there is a shared party wall it must be clearly demonstrated on the floor plan
- item: 'For vehicle crossovers or change of use of a grass verge: a photograph of the front of the property
    including the verge, and full dimensions of the works'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: Vehicle crossovers or change of use of a grass verge.
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 9. Householder checklist (v1.0,
  March 2025), page 4. The PAR gives no trigger; the householder checklist asks for floor plans for new
  development and existing buildings altered, 'depending on the nature of the proposal', so other cases
  are discretionary.
review-status: unverified
field-status: {}
