reference: bng-metric
local-authority: LUT
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The statutory biodiversity gain condition applies (the development is not exempt).
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/biodiversity-net-gain-planning-applications-requirements-2025.pdf
policy: Town and Country Planning Act 1990 Schedule 7A (inserted by Environment Act 2021 Schedule 14)
source-text: 'All planning applications which are not exempt from BNG conditions will be required to submit:'
must-include:
- item: The pre-development biodiversity value(s), on the date of application or an earlier proposed date
  level: must
- item: 'Where an earlier date is proposed: that date and the reasons for it'
  level: must
  required-if: discretionary
- item: The completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat, including the publication date of the metric used
  level: must
- item: 'For major applications: the Statutory Biodiversity Metric, completed by a suitably qualified
    and competent person'
  level: must
  required-if:
    ref: major-development
  source-text: A Statutory Biodiversity Metric must be completed for all major applications
- item: 'For minor applications: the Small Sites Metric, completed by a competent person (only where no
    priority habitats, statutory protected sites or European protected species are on site)'
  level: must
  required-if:
    condition:
      field: minor-development
      value: true
      description: Minor development.
  source-text: A Small Sites Metric (SSM) must be completed by a competent person for all minor development
    proposals
- item: 'Where onsite biodiversity value has been lost through activities before the application date
    (degradation): a statement saying so, the date before the activities, the earlier pre-development
    value, the completed metric and any supporting evidence'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Activities have reduced the onsite biodiversity value.
confidence: medium
notes: From the council's Biodiversity Net Gain Planning Applications Requirements (BNG PAR, v1.1, April
  2025), pages 5-8 (Appendix A), which the PAR (page 10) and the validation guidance page go with. Shown
  with biodiversity-gain-condition because householder and other exempt applications are exempt by law;
  the application must state any exemption. Confirmation that the condition applies and the self-build
  declaration are listed separately (see unmapped).
review-status: unverified
field-status: {}
