reference: fire-statement
local-authority: LUT
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: Seven or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A fire statement (FS) must be submitted in support of a planning application for dwellings
  or for educational accommodation that would result in a form of development that either is 18 metres
  in height or has seven or more storeys.
must-include:
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How fire safety policies in local development documents have been taken into account
  level: must
- item: Completed using the government's template
  level: must
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 10.
review-status: unverified
field-status: {}
