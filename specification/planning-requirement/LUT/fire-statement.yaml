reference: fire-statement
local-authority: LUT
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: The development is 18 metres in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: The development has seven or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The development is for dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The development is for educational accommodation.
