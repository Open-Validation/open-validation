reference: location-plan
local-authority: LUT
required-if:
  always: true
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications must include copies of a Location Plan based on an up-to-date map.
must-include:
- item: Based on an up-to-date map
  level: must
- item: At a scale of 1:1250 or 1:500
  level: should
- item: At least two named roads and surrounding buildings, with properties numbered or named
  level: should
- item: Application site outlined in red, including all land needed to carry out the development (access
    from a public highway, landscaping, car parking and open areas around buildings)
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, outlined in blue
  level: should
- item: 'For householder applications: typically at 1:1250 or 1:2500, with enough roads and/or buildings
    on adjoining land'
  level: should
  required-if:
    application-type:
      in:
      - hh
  source-text: typically be at a scale of 1:1250 or 1:2500
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 8. Householder checklist (v1.0,
  March 2025), page 2. One copy is required unless notified otherwise.
review-status: unverified
field-status: {}
