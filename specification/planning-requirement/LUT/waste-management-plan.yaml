reference: waste-management-plan
local-authority: LUT
required-if:
  any:
  - ref: major-development
  - condition:
      field: food-or-drink-use
      value: true
      description: New or expanded food/drink outlets (Class E and/or Sui Generis).
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP1, LLP25 and LLP37
source-text: All applications for major development should be supported by a Site Waste Management Plan
  (SWMP). ... SWMPs will also be required to be submitted in support of all applications proposing new
  or expanded food/drink outlets (Class E and/or Sui Generis).
must-include:
- item: 'For communal bin stores in residential development: the dimensions and location of the store,
    number of general waste bins, cleaning and water access points, recycling bins for dry recyclables
    and glass, and space for a separate food waste bin'
  level: must
  required-if: discretionary
  source-text: If, within residential development, communal bin stores are proposed, developers need to
    show clearly the dimensions of the bins store, location, number of general waste bins, cleaning and
    points of water access/cleaning stations, recycling bins for dry recyclables and glass and additional
    space for separate food waste bin.
- item: 'For food/drink outlets: impacts on the wider area (for example litter) and mitigation such as
    bins and litter control'
  level: must
  required-if:
    condition:
      field: food-or-drink-use
      value: true
      description: Food or drink outlets.
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 26-27. The list calls it a
  Site Waste Management Plan (SWMP). Communal bin stores have no field, so that item is discretionary.
review-status: unverified
field-status: {}
