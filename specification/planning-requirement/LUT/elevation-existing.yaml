reference: elevation-existing
local-authority: LUT
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: external-alterations
      value: true
      description: Elevations created or altered by the development.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Existing and proposed elevations (scale 1:50/100). All sides. ... show the proposed works
  in relation to what is already there, for any elevations that would be created or altered by the development
  proposal
must-include:
- item: At 1:50 or 1:100, showing all sides
  level: must
- item: Details of windows, doors, materials and finishes
  level: must
- item: Full height dimensions, including where the roof is raised
  level: must
- item: Roof lights, dormers, and any street furniture where crossovers are proposed (lamp posts, bus
    stops, trees, utility boxes, road markings)
  level: must
- item: 'Where an elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each'
  level: should
  required-if: discretionary
- item: Existing and proposed street scene elevations where the development materially changes how the
    site or buildings relate to adjacent sites or buildings (for example an additional storey, demolition
    and rebuild, or a change in roof form)
  level: must
  required-if:
    any:
    - condition:
        field: height-change
        value: true
        description: An additional storey or increased roof height.
    - discretionary
  source-text: Where a development would result in a material change to how the site and/or building(s)
    relate to either the adjacent site(s) and/or building(s), existing and proposed street scene elevations
    will be required (for example, additional storey, demolition and rebuild, change in roof form, etcetera.).
- item: 'For walls, fences or gates: length and all height dimensions'
  level: must
  required-if:
    condition:
      field: new-boundary-treatment
      value: true
      description: Wall, fence or gate proposals.
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 9. Householder checklist (v1.0,
  March 2025), page 4. The PAR gives no trigger; the householder checklist asks for elevations created
  or altered by the development, 'depending on the nature of the proposal'.
review-status: unverified
field-status: {}
