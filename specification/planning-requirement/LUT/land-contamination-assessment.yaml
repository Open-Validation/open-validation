reference: land-contamination-assessment
local-authority: LUT
required-if:
  any:
  - all:
    - site:
        in:
        - contaminated-land
        description: The site is previously contaminated.
    - site:
        in:
        - source-protection-zone
        description: Located in a source protection zone.
    - condition:
        field: floorspace
        operator: '>'
        value: 250
        description: Over 250 square metres in floor area.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policy LLP38 (Pollution and Contamination)
source-text: If the proposed site is previously contaminated and located in a source protection zone then
  a desk top study should be submitted with your planning application when over 250 square metres in floor
  area.
must-include:
- item: A Preliminary Risk Assessment, such as a site walkover or conceptual model (the Environment Agency's
    minimum)
  level: must
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 22. The list calls it a Land
  Contamination Assessment (desktop study). Where contamination is known or suspected elsewhere, a desktop
  study 'may be required', shown as discretionary.
review-status: unverified
field-status: {}
