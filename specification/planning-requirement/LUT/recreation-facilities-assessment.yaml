reference: recreation-facilities-assessment
local-authority: LUT
required-if:
  all:
  - site:
      in:
      - open-space
      description: A change of use or development on designated open space.
  - condition:
      field: loss-of-open-space
      value: true
      description: Results in a net loss of open space.
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP25 and LLP27 (Open Space and Natural Greenspace)
source-text: Where a change of use/development is proposed on designated open space and results in a net
  loss of open space, a sequential test to demonstrate there are no suitable and available alternative
  sites will be required.
must-include:
- item: A sequential test showing there are no suitable and available alternative sites
  level: must
- item: Site selection criteria and area of search agreed with the council before the test
  level: should
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 25. The list calls it an Open
  Space Assessment (Sequential Test).
review-status: unverified
field-status: {}
