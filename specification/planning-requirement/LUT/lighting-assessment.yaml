reference: lighting-assessment
local-authority: LUT
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
    - any:
      - site:
          in:
          - conservation-area
          - listed-building-setting
          description: Minor (non-householder) erection, change of use or redevelopment of buildings in
            a conservation area and/or the setting of a listed building.
      - site:
          in:
          - open-space
          description: Within and/or adjacent to open space.
      - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP25, LLP28, LLP29 and LLP30
source-text: All applications proposing major development, and applications for minor development (non-
  householder) for the erection, change of use or redevelopment of buildings within a conservation area
  and/or setting of a listed building and/or within and/or adjacent to open space/ecologically sensitive
  areas shall be accompanied by a Lighting Assessment (LA),
must-include:
- item: Average and minimum lux levels throughout the site
  level: must
- item: Confirmation of the relevant ILE guidance
  level: must
- item: Location, type, number and intensity of lighting, and the hours it would be switched on
  level: should
- item: As a minimum, a layout plan showing beam orientation and a schedule of the equipment
  level: must
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 24. 'Ecologically sensitive
  areas' is shown as discretionary. A more detailed lighting study may be needed for sports grounds or
  development close to housing, nature conservation areas or in a rural area.
review-status: unverified
field-status: {}
