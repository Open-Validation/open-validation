validation-list:
  url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
  date: 2024-01
  date-basis: 'Cover: ''Version: 1.2 (published) Last updated: January 2024'' (page footers still say
    ''February 2023''). The council''s ''Planning application forms, biodiversity and validation guidance''
    pages (checked 2026-11-06) link it as ''Planning Application Requirements (PAR) 2025'', uploaded May
    2026, with the householder validation checklist (v1.0, March 2025) and the BNG planning application
    requirements (v1.1, April 2025); no newer PAR, draft or consultation was found. The ''2025'' label
    is not a revision date, and the PAR''s own date is more than 2 years old, so outdated.'
  status: outdated
submission-standards:
- item: Drawings as single plans (not multiple pages), each attached separately as a PDF rather than tif,
    jpeg, doc or xls files
  level: should
- item: Plans with unique plan numbers (a 4-digit number is recommended, for example H004) and labelled
    correctly (existing, proposed, pre-existing)
  level: should
- item: Photographs are not accepted unless part of a tree application
  level: must
- item: All plans to scale, with the site address clearly stated on the plan
  level: must
- item: A scale bar, with the paper size the drawing can be scaled to
  level: must
  required-if:
    ref: major-development
- item: 'For non-major applications: drawings clearly show all external dimensions'
  level: should
- item: 'For major applications: a fee calculation provided'
  level: must
  required-if:
    ref: major-development
- item: Drawings titled with a description and drawing number (for example 'H001 - Proposed first floor
    plan')
  level: should
- item: Drawings at an identified standard metric scale, named and numbered logically
  level: should
- item: No signatures or other personal data on documents, plans and reports (submission is treated as
    consent to publish them)
  level: should
- item: Only one set of application documents, unless the council asks for more
  level: should
- item: Where a required document is not considered necessary, a statement explaining why
  level: should
audit:
