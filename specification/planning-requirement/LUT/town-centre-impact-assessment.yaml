source-text: Retail Impact Assessment (RIA) LLP2 – Spatial Development Strategy LLP21 – Centre Hierarchy
  LLP22 – Primary and Secondary Area and Frontages LLP23 – District and Neighbourhood Areas and Shopping
  Parades Applications proposing retail and leisure development over 1,000 square metres and situated
  outside of identified centres within the Policies Map of the Luton Local Plan 2011 to 2031 shall be
  accompanied by a Retail Impact Assessment (RIA) as defined within Section 7 of the NPPF.
