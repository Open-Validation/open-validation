reference: town-centre-impact-assessment
local-authority: LUT
required-if:
  any:
  - all:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 1000
        description: Retail and leisure development over 1,000 square metres.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Situated outside the identified centres on the Policies Map.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP2, LLP21, LLP22 and LLP23
source-text: Applications proposing retail and leisure development over 1,000 square metres and situated
  outside of identified centres within the Policies Map of the Luton Local Plan 2011 to 2031 shall be
  accompanied by a Retail Impact Assessment (RIA) as defined within Section 7 of the NPPF. Smaller applications
  for development that is likely to have a significant impact upon existing centres may also be required
  to undertake an RIA.
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 26. The list calls it a Retail
  Impact Assessment (RIA). Smaller developments likely to have a significant impact on centres are shown
  as discretionary.
review-status: unverified
field-status: {}
