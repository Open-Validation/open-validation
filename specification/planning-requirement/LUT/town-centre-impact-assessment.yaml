  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and leisure development outside the identified centres on the Policies Map.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 1000
      description: Over 1,000 square metres.
