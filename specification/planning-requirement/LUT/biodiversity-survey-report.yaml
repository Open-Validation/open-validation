reference: biodiversity-survey-report
local-authority: LUT
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - open-space
      description: Applications relating directly to areas of open space.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP25, LLP27, LLP28 (Biodiversity and Natural Conservation)
  and LLP29 (Landscape and Geological Conservation)
source-text: All applications proposing major development and applications relating directly to areas
  of open space and/or of ecological sensitivity shall be accompanied by an Ecological Assessment.
must-include:
- item: Existing biodiversity interests and possible impacts on them
  level: must
- item: Information supporting any proposed mitigation and/or compensation measures
  level: must
  required-if: discretionary
- item: Plans showing significant wildlife habitats or features and the location of habitats of protected
    species
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 15-16. The list calls it an
  Ecological Assessment. 'Ecological sensitivity' is shown as discretionary. A preliminary protected species
  survey for roof or loft alterations is asked for before determination, not for validation.
