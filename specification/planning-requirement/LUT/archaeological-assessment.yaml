reference: archaeological-assessment
local-authority: LUT
required-if:
  any:
  - site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      description: Land of known or suspected archaeological significance (including Archaeological Notification
        Areas).
  - condition:
      field: near-watercourse
      value: true
      description: Land adjacent to the River Lea.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policy LLP30 (Historic Environment)
source-text: Applications affecting land of known or suspected archaeological significance, including
  any land adjacent to the River Lea, should be accompanied by an Archaeological Desktop Study
must-include:
- item: Undertaken by a suitably qualified individual or organisation
  level: should
- item: Scope agreed with the council's archaeological advisors
  level: should
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 14. The list calls it an Archaeological
  Survey (desktop study). 'Suspected' significance is shown as discretionary.
review-status: unverified
field-status: {}
