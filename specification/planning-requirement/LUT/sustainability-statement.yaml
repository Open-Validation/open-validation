reference: sustainability-statement
local-authority: LUT
required-if:
  ref: major-development
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP1, LLP25 and LLP37
source-text: Major schemes should provide a Sustainability Statement outlining the elements of the scheme
  that address sustainable development issues, including the environmental, social and economic implications.
must-include:
- item: 'Building design: materials, energy and water use, carbon emissions, waste minimisation and recycling,
    and features to address future temperature rises (with regard to BRE guidance)'
  level: should
- item: 'Resource use: sustainable natural resources (including water) and a green procurement strategy
    for construction'
  level: should
- item: Greenspace incorporating wildlife corridors
  level: should
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 28. The contents are what the
  statement 'may include'.
