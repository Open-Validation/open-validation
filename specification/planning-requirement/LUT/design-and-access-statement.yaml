reference: design-and-access-statement
local-authority: LUT
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a designated area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with floor space of 100 square metres or more.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: Any part of the house or its curtilage is in a conservation area.
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement must accompany: • applications for major development, as defined
  in article 2 of the Town and Country Planning (Development Management Procedure (England) Order 2015;
  • applications for development in a designated area, where the proposed development consists of: • one
  or more dwellings; or • a building or buildings with a floor space of 100 square metres or more ...
  This is only required for a householder application where any part of the dwelling house or its curtilage
  falls within a conservation area.'
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 8. Householder checklist (v1.0,
  March 2025), page 3. Luton's designated areas are its conservation areas.
review-status: unverified
field-status: {}
