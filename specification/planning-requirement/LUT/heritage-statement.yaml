reference: heritage-statement
local-authority: LUT
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - locally-listed-building
      description: Development within a conservation area, or within the setting of a statutory or locally
        listed building.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: LLP25, LLP30
source-text: Applications proposing development within a conservation area, within the setting of either
  a statutory or locally listed building or directly adjacent to the River Lea shall be accompanied by
  a Heritage Statement (HS) that is proportionate to the significance of the development and/or the significance
  of the relevant heritage asset.
confidence: medium
notes: 'Audit (wrong_app_type): not only listed building consent; ''Also required for demolition in conservation
  areas''. Sites directly adjacent to the River Lea are shown as officer discretion.'
