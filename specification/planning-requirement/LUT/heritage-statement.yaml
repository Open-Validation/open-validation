reference: heritage-statement
local-authority: LUT
required-if:
  any:
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - locally-listed-building
      description: Development within a conservation area, or within the setting of a statutory or locally
        listed building.
  - condition:
      field: near-watercourse
      value: true
      description: Development directly adjacent to the River Lea.
  - site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      description: Development affecting known archaeological sites or in an Archaeological Notification
        Area.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP25 (High Quality Design) and LLP30 (Historic Environment)
source-text: Applications proposing development within a conservation area, within the setting of either
  a statutory or locally listed building or directly adjacent to the River Lea shall be accompanied by
  a Heritage Statement (HS) that is proportionate to the significance of the development and/or the significance
  of the relevant heritage asset.
must-include:
- item: 'For demolition in a conservation area: the evidence and justification required by NPPF paragraphs
    193 to 195'
  level: must
  required-if:
    all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - condition:
        field: demolition
        value: true
        description: Demolition is proposed.
  source-text: Applications for demolition within conservation areas should also include the supporting
    evidence and justification required by paragraph 193 to 195 of the National Planning Policy Framework.
- item: 'For listed buildings: a schedule of works, an analysis of the history and character of the building
    (photographic, map, archival and fabric evidence), and the principles of and justification for the
    works and their impact on its special character and setting'
  level: must
  required-if:
    site:
      in:
      - listed-building
      - listed-building-setting
      description: Applications that affect listed buildings.
- item: A photographic record of the site context and the spaces and features affected
  level: should
- item: An assessment of the architectural, historical or other significance of the asset
  level: should
- item: An assessment of the impact on significance, a justification for the works and any mitigation
  level: should
- item: 'For archaeological sites: the results of a desk-based study using the Central Bedfordshire and
    Luton Historic Environment Record, the significance of heritage assets with archaeological interest
    and the impact on them, and on the setting of scheduled monuments or registered parks and gardens'
  level: must
  required-if:
    site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      description: Known archaeological sites or Archaeological Notification Areas.
  source-text: 'For applications that affect known archaeological sites or lie within Archaeological Notification
    Areas (ANAs), heritage statements should include:'
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 20-21. Householder checklist
  (v1.0, March 2025), page 5. A statement may also be requested if the council identifies a non-designated
  heritage asset, shown as discretionary. The list says applications for consent will not be validated
  without it. A structural survey may be needed for substantial demolition (see unmapped).
review-status: unverified
