reference: transport-assessment
local-authority: LUT
required-if:
  any:
  - condition:
      field: parking-change
      value: true
      description: The development has implications for car parking.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP1, LLP25, LLP31 (Sustainable Transport Strategy) and LLP32
  (Parking)
source-text: Any proposed development that will have implications for transportation in terms of car parking
  or traffic movements should be accompanied by a Transport Statement (TS) or Transport ... Assessment
  (TA). The coverage and detail of the TS or TA
must-include:
- item: 'For smaller schemes (Transport Statement): existing site conditions and the proposed parking,
    access points, servicing, access to public transport and cycle parking'
  level: must
- item: 'For major proposals (Transport Assessment): a more detailed appraisal of existing site conditions'
  level: must
  required-if:
    ref: major-development
- item: Measures to improve access by public transport, walking and cycling, reduce parking need and mitigate
    transport impacts
  level: should
- item: Electric vehicle charging points and cycle parking, maintenance and cleaning facilities considered
  level: should
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 28-29. Traffic implications
  have no threshold in the list (it points to Appendix 7 of the Local Plan), so shown as discretionary
  next to parking changes.
review-status: unverified
field-status: {}
