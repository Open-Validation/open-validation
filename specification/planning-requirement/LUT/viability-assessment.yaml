reference: viability-assessment
local-authority: LUT
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: On-site affordable housing is not proposed to be met, and this is known at submission.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: Necessary developer contributions are not proposed to be met, and this is known at
        submission.
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP16 (Affordable Housing) and LLP39 (Infrastructure and Developer
  Contributions)
source-text: A Financial Viability Appraisal (FVA) is required for any application where the provision
  of on-site affordable housing and all necessary developer contributions are not proposed to be met by
  the planning application and this is known at the point of submission.
must-include:
- item: An open book assessment, for publication on the planning register, with locally relevant benchmark
    data
  level: must
- item: A written assurance to cover all reasonable costs of the council's independent scrutiny
  level: must
- item: Details of costs attributed to the development compared with those submitted to other local planning
    authorities in the south east / surrounding London
  level: must
- item: The names of the applicants, agents, consultants, parent or holding companies, development managers
    and other interested parties
  level: must
- item: A second, redacted version with an explanation of why the redaction is appropriate under the Freedom
    of Information tests
  level: must
  required-if:
    condition:
      field: viability-confidentiality-claimed
      value: true
      description: The appraisal contains commercially sensitive information.
  source-text: If however, the document contains any commercially sensitive information, a second version
    of the document should also be submitted.
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 18. The list calls it a Financial
  Viability Appraisal (FVA).
review-status: unverified
field-status: {}
