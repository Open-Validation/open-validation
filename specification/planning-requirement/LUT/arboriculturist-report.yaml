reference: arboriculturist-report
local-authority: LUT
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees may be affected on the site, on the street or on adjoining sites.
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP25 (High Quality Design) and LLP27 (Open Space and Natural
  Greenspace)
source-text: Proposals where trees may be affected on the application site, on the street or on adjoining
  sites should identify which trees are to be retained and the means of protecting these trees during
  construction.
must-include:
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: A tree survey setting out the health and longevity of trees to be removed
  level: must
  required-if:
    condition:
      field: tree-removal
      value: true
      description: Trees are to be removed.
  source-text: Where trees are proposed to be removed as a result of the development, a tree survey should
    be provided setting out the health and longevity of the tree(s).
- item: Prepared by a suitably qualified and experienced arboriculture professional
  level: should
- item: Survey information, protection plan and method statement following BS5837
  level: should
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 13. Householder checklist (v1.0,
  March 2025), page 5. The householder checklist calls it 'Tree survey / arboricultural implications'.
review-status: unverified
field-status: {}
