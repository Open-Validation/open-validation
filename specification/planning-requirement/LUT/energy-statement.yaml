reference: energy-statement
local-authority: LUT
required-if:
  ref: major-development
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP1, LLP25 and LLP37 (Climate Change, Carbon and Waste Reduction
  and Sustainable Energy)
source-text: An ERA should be provided in support of all major applications.
must-include:
- item: How the energy hierarchy has been taken into account in the design and layout
  level: must
- item: How the proposal will meet the applicable carbon reduction targets, and efficient use of all resources
  level: must
- item: Predicted energy demand and the degree to which the development meets energy efficiency standards
  level: should
- item: Measures to maximise energy efficiency and reduce carbon dioxide emissions (design, orientation,
    passive solar gain, energy supply, renewable energy, heating, ventilation, controls, materials)
  level: should
- item: Renewable energy production, reduced energy and water demand, best use of resources, mitigation
    against wastage, and management and maintenance of climate change measures
  level: should
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 17. The list calls it an Energy
  and Resource Assessment (ERA).
review-status: unverified
field-status: {}
