reference: landscaping-plan
local-authority: LUT
required-if:
  ref: major-development
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP25, LLP27 and LLP29
source-text: All applications proposing major development should be accompanied by landscaping details
  and include proposals for long term maintenance and landscape management.
must-include:
- item: Site survey and site analysis
  level: must
- item: A plan showing existing and proposed shrubs and trees, indicating which are retained and which
    removed
  level: must
- item: Landscape design proposals and a planting plan
  level: must
- item: Hard landscaping details such as structures, surfaces and ancillary objects
  level: must
- item: How retained vegetation will be protected during construction
  level: must
- item: A maintenance and management plan, with proposals for long-term maintenance
  level: must
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 23. The list calls it a Landscaping
  Scheme.
review-status: unverified
field-status: {}
