reference: site-plan
local-authority: LUT
required-if:
  always: true
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Scale 1:100/200/500, showing direction of north. Existing and proposed. Showing the proposed
  development in relation to existing buildings on and adjoining the site, areas and boundaries of site,
  including details of access points, trees and hard surfacing (for example, parking spaces, driveways,
  footpaths).
must-include:
- item: At 1:100, 1:200 or 1:500, with the direction of north
  level: must
- item: Existing and proposed
  level: must
- item: The proposed development in relation to existing buildings on and adjoining the site, and the
    site's areas and boundaries
  level: must
- item: Access points, trees and hard surfacing (parking spaces, driveways, footpaths)
  level: must
- item: 'For householder applications: written dimensions, including to the boundaries'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: the proposed development in relation to the site boundaries and other existing buildings
    on the site, with written dimensions including those to the boundaries
- item: 'For householder applications: buildings, roads and footpaths on adjoining land, public rights
    of way, trees on and next to the site, hard surfacing and proposed boundary treatment, unless they
    would not influence or be affected by the development'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 9. Householder checklist (v1.0,
  March 2025), page 2. Listed under 'National planning requirements' with no trigger, so shown for all
  applications. The householder checklist gives its scale as 'typically 1:1250 or 1:2500'.
review-status: unverified
field-status: {}
