reference: affordable-housing-statement
local-authority: LUT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 11
      description: 11 or more new residential units.
  - all:
    - condition:
        field: dwelling-count
        operator: <=
        value: 10
        description: 10 or fewer new dwellings.
    - condition:
        field: housing-floorspace
        operator: '>'
        value: 1000
        description: With a combined floorspace of more than 1,000 square metres.
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policy LLP16 (Affordable Housing)
source-text: Proposals for 11 or more new residential units or on sites of 10 or less new dwellings that
  have a combined floorspace of more than 1,000 square metres must provide an Affordable Housing Statement
  setting out how this planning policy requirement will be met.
must-include:
- item: The percentage of affordable housing offered and where in the development it will be
  level: should
- item: 'For a commuted payment: how the quantum is calculated against the council''s adopted policies'
  level: must
  required-if: discretionary
  source-text: If the affordable housing offer is to be provided as a commuted payment, details of how
    the quantum is calculated against the council’s adopted policies shall be provided.
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 12. Details of the registered
  social housing provider can also be included.
review-status: unverified
field-status: {}
