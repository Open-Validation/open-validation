reference: section-proposed
local-authority: LUT
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The development involves a change in ground levels.
  - condition:
      field: roof-space-room
      value: true
      description: Works that go into the roof space.
  - condition:
      field: footprint-increase
      value: true
      description: Ground floor extensions.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Where development involves a change in ground levels (scale 1:50/100) or if any of the elevations
  are obscured from view by existing structures. Sections are always required for any works that go into
  roof space and ground floor extensions.
must-include:
- item: At 1:50 or 1:100
  level: must
- item: How proposed buildings relate to existing site levels and finished floor levels, and to adjoining
    buildings
  level: should
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 10. 'Sections / Site levels'.
  Elevations obscured from view by existing structures are shown as discretionary. The list does not ask
  for existing sections separately.
review-status: unverified
field-status: {}
