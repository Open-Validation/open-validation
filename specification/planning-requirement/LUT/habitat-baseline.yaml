reference: habitat-baseline
local-authority: LUT
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The statutory biodiversity gain condition applies (the development is not exempt).
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/biodiversity-net-gain-planning-applications-requirements-2025.pdf
policy: Town and Country Planning Act 1990 Schedule 7A (inserted by Environment Act 2021 Schedule 14)
source-text: plan(s), drawn to an identified scale and showing the direction of North, showing onsite
  habitat existing on the date of application (or earlier proposed date), including any irreplaceable
  habitat (if applicable).
must-include:
- item: Drawn to an identified scale, showing the direction of north
  level: must
- item: Onsite habitat existing on the date of application (or earlier proposed date)
  level: must
- item: A description of any irreplaceable habitat on the land, shown on the plan
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: Irreplaceable habitat on the site.
confidence: medium
notes: From the council's BNG PAR (v1.1, April 2025), page 8 (Appendix A). Shown with biodiversity-gain-condition
  because exempt applications are exempt by law.
review-status: unverified
field-status: {}
