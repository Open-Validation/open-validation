reference: air-quality-assessment
local-authority: LUT
required-if:
  any:
  - ref: major-development
  - condition:
      field: sensitive-end-use
      value: true
      description: A sensitive use (for example residential, schools, nurseries, hospitals, offices, allotments)
        is introduced or intensified.
  - site:
      in:
      - air-quality-management-area
      description: In or near an Air Quality Management Area.
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP31 (Sustainable Transport Strategy), LLP32 (Parking) and
  LLP38 (Pollution and Contamination)
source-text: Schemes that may impact on air quality by virtue of the nature of the uses proposed, the
  associated transport generation or their location in or near to an Air Quality Management Area (AQMA)
  should provide an Air Quality Assessment. This is for all major planning applications, or where a sensitive
  use (for example residential, schools, nurseries, hospitals, offices, allotments, etc) will either be
  introduced or intensified.
confidence: medium
notes: 'From the council''s list (PAR v1.2, last updated January 2024), page 12. Luton has three AQMAs:
  two next to the M1 corridor and one around the A505 town centre ring.'
review-status: unverified
field-status: {}
