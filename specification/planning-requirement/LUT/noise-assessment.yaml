reference: noise-assessment
local-authority: LUT
required-if:
  any:
  - ref: major-development
  - condition:
      field: noise-generating-use
      value: true
      description: The proposal would generate noise disturbance issues for adjoining occupants.
  - discretionary
source-url: https://www.luton.gov.uk/sites/default/files/2026-05/planning-application-requirements-2025.pdf
policy: Luton Local Plan 2011-2031 policies LLP25 and LLP38
source-text: A Noise Impact Assessment should be submitted for all major development applications and/or
  where the proposal would generate noise disturbance issues for adjoining occupants and for developments
  where noise pollution is already poor and could have an adverse impact on the proposed development.
must-include:
- item: Whether noise is an issue
  level: must
- item: Mitigation measures to protect the inhabitants of the development from existing noise pollution
  level: must
confidence: medium
notes: From the council's list (PAR v1.2, last updated January 2024), page 24. Development where noise
  pollution is already poor is shown as discretionary (no field).
review-status: unverified
field-status: {}
