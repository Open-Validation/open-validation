reference: sustainable-drainage-strategy
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - site:
        in:
        - critical-drainage-area
        description: A site within a critical drainage area.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policy SI 13
source-text: All major applications and all sites within a critical drainage area
must-include:
- item: Surface water discharged as close to greenfield run-off rates as possible, following the SuDS
    hierarchy with a preference for green features
  level: must
- item: Detailed site layout at an identified scale and a topographical survey
  level: must
- item: Plans, drawings and specification of the SuDS, including hard construction, soft landscaping and
    planting
  level: must
- item: Calculations of discharge and greenfield run-off rates and storage capacity
  level: must
- item: Ground investigations if infiltration is proposed or ruled out
  level: must
- item: Any off-site works with consents, and the maintenance regime and who is responsible
  level: must
- item: The Royal Borough of Kingston SuDS Proforma completed
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 48-50. The list calls it 'Drainage Strategy
  and Sustainable Urban Drainage Systems (SuDS) Report'. The main list covers planning applications without
  naming types, so it is applied to full, outline and reserved matters applications; householder triggers
  come from the Householder Local List.
review-status: unverified
field-status: {}
