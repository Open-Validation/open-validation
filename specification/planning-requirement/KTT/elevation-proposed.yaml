reference: elevation-proposed
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
  - any:
    - condition:
        field: external-alterations
        value: true
        description: Changes to the external appearance of a building.
    - condition:
        field: new-build
        value: true
        description: A new building.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications that involve changes to the external appearance of a building or that proposes
  a new building.
must-include:
- item: Drawn at 1:50 or 1:100 with a scale bar that refers to the paper size
  level: must
- item: All windows and doors, and materials/finishes for all proposed elevations
  level: must
- item: 'Key dimensions: external height, width, depth and distance from boundaries'
  level: must
- item: The extent of any demolition, internal and external
  level: must
- item: Direction of north, with each drawing naming its aspect (north, south, east, west)
  level: must
- item: 'Where it adjoins or is close to another building: the relationship between the buildings and
    the relative positions of openings, parapets and levels'
  level: must
- item: Blank elevations included
  level: should
- item: A unique drawing number and a clear label (e.g. 'Existing Ground Floor Plan')
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 16-17 (Householder Local List page 15-16). The
  main list covers planning applications without naming types, so it is applied to full, outline and reserved
  matters applications; householder triggers come from the Householder Local List.
review-status: unverified
field-status: {}
