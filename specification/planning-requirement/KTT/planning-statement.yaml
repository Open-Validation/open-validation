reference: planning-statement
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: NPPF; London Plan; Kingston development plan
source-text: All major applications
must-include:
- item: An assessment of how the development accords with national, regional and local policies, with
    commentary (not just a list) addressing the current development plan
  level: must
- item: An overview of the conclusions of the other submitted documents and a robust conclusion
  level: must
- item: 'Where a marketing assessment is required: an overview of it and why the loss is acceptable'
  level: must
  required-if:
    condition:
      field: loss-of-use
      value: true
      description: A loss of use needing marketing evidence.
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 78-79. The main list covers planning applications
  without naming types, so it is applied to full, outline and reserved matters applications; householder
  triggers come from the Householder Local List.
review-status: unverified
field-status: {}
