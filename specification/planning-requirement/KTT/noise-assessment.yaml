reference: noise-assessment
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Noise generating development (e.g. pubs, bars, nightclubs, industrial).
    - condition:
        field: plant-equipment
        value: true
        description: Installation of plant, motors, filters or other machinery, including air conditioning
          units and air source heat pumps.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive uses (homes, care homes, schools) near noise generating uses.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policy D13 Agent of Change; NPPG Noise
source-text: 'All applications that involve noise generating development including development and changes
  of use that involve the installation of plant, motors or filters, and/or other machinery including air
  conditioning units and air source heat pumps on residential or commercial properties. And / or All applications
  that would result in noise sensitive uses being located near to: Noise generating uses'
must-include:
- item: Carried out by a qualified person
  level: must
- item: Description of the site and surroundings, and of the use and its noise emissions
  level: must
- item: Noise and/or vibration survey details and full results
  level: must
- item: Assessment criteria to the relevant British Standard, and a subjective description of the noise/vibration
    sources
  level: must
- item: Assessment and calculations
  level: must
- item: Construction and demolition phase assessment
  level: must
- item: Conclusions and details of mitigation required
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 29-31. The list calls it 'Acoustic and Vibration
  - Impact Assessment'. The main list covers planning applications without naming types, so it is applied
  to full, outline and reserved matters applications; householder triggers come from the Householder Local
  List.
review-status: unverified
field-status: {}
