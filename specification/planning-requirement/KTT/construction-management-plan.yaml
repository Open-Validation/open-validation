reference: construction-management-plan
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: earthworks
        value: true
        description: Substantial demolition or excavation works.
    - condition:
        field: basement
        value: true
        description: Any basement or subterranean development.
    - discretionary
    - all:
      - ref: major-development
      - condition:
          field: external-alterations
          value: true
          description: Major development involving external works.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policy T7; Control of Dust and Emissions SPG
source-text: All applications that include 1. Substantial demolition / excavation works proposed 2. Any
  basement and subterranean developments 3. Sites in confined locations or near sensitive receptors. 4.
  All major development that involves external works
must-include:
- item: Size, number, routing and manoeuvring of construction vehicles, holding areas, and a site layout
    plan with tracking to turn and exit in forward gear
  level: must
- item: Parking for site operatives and visitors, with access for neighbouring occupiers
  level: must
- item: Loading/unloading and storage of plant and materials, and skips on the highway
  level: must
- item: Any suspension of pavement, roadspace, bus stops or parking bays, and highway licences and traffic
    orders needed
  level: must
- item: Security hoardings and wheel washing facilities
  level: must
- item: Scheme for recycling/disposing of demolition, excavation and construction waste
  level: must
- item: Measures to control noise, vibration and dust, including working hours (BS 5228 and GLA best practice)
  level: must
- item: Phasing, programming and timing, with a 24-hour emergency contact number
  level: must
- item: Written with the Arboricultural Method Statement, to BS 5837:2012, where applicable
  level: should
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 42-45. The list calls it 'Construction Management
  Plan (including site waste management plan) (CEMP) (outline)'. 'Confined locations or near sensitive
  receptors' shows as 'check'. The main list covers planning applications without naming types, so it
  is applied to full, outline and reserved matters applications; householder triggers come from the Householder
  Local List.
review-status: unverified
field-status: {}
