reference: archaeological-assessment
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - ref: major-development
      - site:
          in:
          - archaeological-priority-area
          description: In an Archaeological Priority Area.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.5
        description: A site greater than 0.5 ha, in an APA or not.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.5
        description: A site greater than 0.5 ha, in an APA or not.
    - all:
      - site:
          in:
          - archaeological-priority-area
          description: A minor application in a Tier 1 or Tier 2 Archaeological Priority Area.
      - discretionary
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policy HC1; NPPF
source-text: All major applications in any Archaeological Priority Area (APA), and all sites that are
  greater than 0.5ha whether in an APA or not.* *And some minor applications in Tier 1 and Tier 2 Archaeological
  Priority Areas.
must-include:
- item: At least a desk-based archaeological assessment
  level: must
- item: A field evaluation where needed
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 36-37. 'Some minor applications' in Tier 1 and
  2 APAs show as 'check'; GLAAS can advise. The main list covers planning applications without naming
  types, so it is applied to full, outline and reserved matters applications; householder triggers come
  from the Householder Local List.
review-status: unverified
field-status: {}
