reference: archaeological-assessment
local-authority: KTT
required-if:
  any:
  - all:
    - ref: major-development
    - site:
        in:
        - archaeological-priority-area
        description: The site is in an Archaeological Priority Area.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.5
      description: The site is greater than 0.5 hectares.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 0.5
      description: The site is greater than 0.5 hectares.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
source-text: Archaeological Assessment All major applications in any Archaeological Priority Area (APA),
  and all sites that are greater than 0.5ha whether in an APA or not.
confidence: medium
review-status: unverified
field-status: {}
