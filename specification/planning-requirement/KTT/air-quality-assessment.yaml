reference: air-quality-assessment
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: GLA Air Quality Neutral and Air Quality Positive guidance; NPPG Air Quality
source-text: All major applications
must-include:
- item: Current air quality, whether the development increases exposure to poor air quality, and pollutant
    sources during construction and operation
  level: must
- item: That existing businesses nearby would not be unreasonably affected
  level: must
- item: An Air Quality Neutral (and Positive) assessment
  level: must
- item: A commitment to keep an inventory of Non Road Mobile Machinery during construction
  level: must
- item: Where applicable, a damage cost assessment and contribution in the draft Heads of Terms
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 35-36. The main list covers planning applications
  without naming types, so it is applied to full, outline and reserved matters applications; householder
  triggers come from the Householder Local List.
review-status: unverified
field-status: {}
