reference: town-centre-impact-assessment
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail and leisure development outside town centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Over 2,500 sq m gross floor space.
  - condition:
      field: departure-from-development-plan
      value: true
      description: Not in accordance with an up-to-date plan.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: NPPF
source-text: All applications that include retail and leisure developments over 2,500 sqm gross floor
  space outside town centres, which are not in accordance with an up-to-date plan.
must-include:
- item: The impact on existing, committed and planned public and private investment in centres in the
    catchment
  level: must
- item: The impact on town centre vitality and viability, including consumer choice and trade
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 81. The list calls it 'Retail Impact Assessment'.
  The main list covers planning applications without naming types, so it is applied to full, outline and
  reserved matters applications; householder triggers come from the Householder Local List.
review-status: unverified
field-status: {}
