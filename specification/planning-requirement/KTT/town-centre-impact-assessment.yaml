reference: town-centre-impact-assessment
local-authority: KTT
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: The site is out of centre.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 2500
      description: 2,500 square metres or more of retail or town centre floorspace.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
source-text: 'Retail Impact Assessments should include an assessment of: a. the impact of the proposal
  on existing, committed and planned public and private investment in a centre or centres in the catchment
  area of the proposal; and b. the impact of the proposal on town centre vitality and viability, including
  local consumer choice and trade in the town centre and the wider retail catchment (as applicable to
  the scale and nature of the scheme).'
confidence: low
notes: 'Audit (wrong_trigger): the workbook missed the 2,500 sqm out-of-centre threshold; the exact wording
  needs checking in the list.'
