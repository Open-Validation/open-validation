reference: application-form
local-authority: KTT
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
    - lbc
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: All sections completed in full, including data required by the GLA planning data standard
  level: must
- item: A description that includes all proposed elements
  level: must
- item: The correct ownership certificate (A, B, C or D) signed, with notice served on other owners and
    agricultural tenants
  level: must
- item: Certificate B where the proposal encroaches onto adjoining land, or for works to a flat (notifying
    everyone with an interest in the whole block)
  level: must
  source-text: this certificate will need to be served if the proposals encroach onto adjoining land or
    if you submit an application for works to a flat / apartment you will need to complete Certificate
    B and notify all other persons who have an interest in the whole block of flats / apartments
- item: 'For listed building consent: an ownership certificate (no agricultural declaration)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 7-9 (Householder Local List page 6-8). The list
  calls it 'Application Form including Ownership Certificate'. A new vehicle crossover needs the pavement
  in the red line with notice served on the council. The main list covers planning applications without
  naming types, so it is applied to full, outline and reserved matters applications; householder triggers
  come from the Householder Local List.
review-status: unverified
