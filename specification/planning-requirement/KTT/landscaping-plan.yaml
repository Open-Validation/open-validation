reference: landscaping-plan
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policies G1, G7 and S4
source-text: All major applications
must-include:
- item: Hard and soft landscaping plans
  level: must
- item: Number, species, location and girth of trees proposed; number, species and planting densities
    of plants
  level: must
- item: Bicycle and refuse areas, children's playspace, benches/seating
  level: must
- item: Permeability of surfaces and location of SuDS
  level: must
- item: A 5 year management plan, provided separately from the Design and Access Statement
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 69-70. The list calls it 'Landscaping scheme
  (including 5 year management plan)'. The main list covers planning applications without naming types,
  so it is applied to full, outline and reserved matters applications; householder triggers come from
  the Householder Local List.
review-status: unverified
field-status: {}
