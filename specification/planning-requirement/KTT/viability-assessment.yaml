reference: viability-assessment
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Major residential development.
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Less than 35% affordable housing is proposed (50% on public land).
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Chapter 4 Housing; Affordable Housing and Viability SPG
source-text: All major applications for residential development where less than 35% affordable housing
  is proposed (50% on public land) must be supported by a full Financial Viability Appraisal (FVA) for
  independent assessment.
must-include:
- item: A fully working, testable software model (preferably Argus Developer)
  level: must
- item: An executive summary report explaining the inputs, assumptions, findings and conclusions
  level: must
- item: 'A full Financial Viability Assessment: development value, scheme details and programme, affordable
    housing values, build and other costs, developer profit, benchmark land value, planning contributions,
    development finance'
  level: must
- item: An appraisal inputs summary sheet in Excel format
  level: must
- item: A statement of objectivity, impartiality and reasonableness; confirmation of instructions and
    no conflicts of interest; and a no contingent fee statement
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 32-35. Not needed if the scheme meets the threshold
  level without public subsidy, the tenure split, other policy requirements and has sought grant. Published,
  and reviewed externally at the applicant's cost. The main list covers planning applications without
  naming types, so it is applied to full, outline and reserved matters applications; householder triggers
  come from the Householder Local List.
review-status: unverified
field-status: {}
