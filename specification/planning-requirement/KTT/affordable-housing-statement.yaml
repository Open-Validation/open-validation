reference: affordable-housing-statement
local-authority: KTT
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal is for residential development.
  - discretionary
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
source-text: Affordable Housing Statement All major applications for residential development And / or
  (This can be included within the Planning Statement) In other cases where the proposal includes affordable
  housing
must-include:
- item: A schedule of all units proposed, including tenure and percentage split, bedrooms and bedspaces,
    size, storeys, habitable rooms and accessibility standard
  level: must
confidence: medium
notes: '''In other cases where the proposal includes affordable housing'' is shown as officer discretion.'
review-status: unverified
field-status: {}
