reference: affordable-housing-statement
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
    - condition:
        field: housing-type
        value: affordable
        description: The proposal includes affordable housing.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Chapter 4 Housing
source-text: All major applications for residential development And / or In other cases where the proposal
  includes affordable housing
must-include:
- item: 'A schedule of all units: tenure and percentage split, bedrooms and bedspaces, size, storeys,
    habitable rooms, accessibility standard, floor level and plot number'
  level: must
- item: The types of affordable housing, with rent levels and other costs (e.g. service charges) showing
    affordability
  level: must
- item: Plans showing the location, layout (including furniture and activity zones) and type of each affordable
    home
  level: must
- item: If reduced affordable housing is offered, why
  level: must
- item: Details of discussions with Registered Providers and the council's Housing Enabling Team
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 31-32. It can be included in the Planning Statement.
  The main list covers planning applications without naming types, so it is applied to full, outline and
  reserved matters applications; householder triggers come from the Householder Local List.
review-status: unverified
field-status: {}
