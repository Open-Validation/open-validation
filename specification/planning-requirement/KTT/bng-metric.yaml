reference: bng-metric
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: Subject to the general biodiversity gain condition.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015; NPPG Biodiversity Net Gain
source-text: All major applications
must-include:
- item: A statement as to whether the applicant believes the biodiversity gain condition would apply
  level: must
- item: The pre-development biodiversity value on the date of application (or an earlier date, with reasons),
    with the completed metric calculation tool, its publication date and version
  level: must
- item: Whether the value is lower because of degradation, with evidence
  level: must
- item: A description of any irreplaceable habitat
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 51-52. The list calls it 'Biodiversity Gain
  Plan'. The list asks for it with 'All major applications'; by law it is needed wherever the biodiversity
  gain condition applies (householder and other exempt applications are exempt), so the rule uses that
  condition. Where the applicant thinks the condition does not apply, a statement of the exemption or
  transitional provision is needed. The main list covers planning applications without naming types, so
  it is applied to full, outline and reserved matters applications; householder triggers come from the
  Householder Local List.
review-status: unverified
field-status: {}
