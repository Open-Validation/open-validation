reference: roof-plan-existing
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
  - any:
    - condition:
        field: roof-alteration
        value: true
        description: Changes to the roof of a building.
    - condition:
        field: new-build
        value: true
        description: A new building.
    - condition:
        field: footprint-increase
        value: true
        description: An extension.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications that involve changes to the roof of a building or that propose a new building
  / extension.
must-include:
- item: At 1:50, 1:100 or 1:200 with a scale bar that refers to the paper size
  level: must
- item: The shape of the roof, roofing materials and features such as chimney positions, extensions or
    windows
  level: must
- item: A unique drawing number and a clear label (e.g. 'Existing Ground Floor Plan')
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 15-16 (Householder Local List page 14-15). The
  main list covers planning applications without naming types, so it is applied to full, outline and reserved
  matters applications; householder triggers come from the Householder Local List.
review-status: unverified
field-status: {}
