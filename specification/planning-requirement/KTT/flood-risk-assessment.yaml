reference: flood-risk-assessment
local-authority: KTT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: A site of 1 hectare or greater in Flood Zone 1.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: A site of 1 hectare or greater in Flood Zone 1.
      - site:
          in:
          - flood-risk-zone
          - surface-water-flood-risk
          description: In Flood Zone 2 or 3, or subject to surface water flood risk.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        - surface-water-flood-risk
        - critical-drainage-area
        description: In Flood Zone 2 or 3, subject to surface water flood risk, or in a Critical Drainage
          Area.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policy SI 12; NPPF; Kingston Strategic Flood Risk Assessment
source-text: All applications, other than Housholder applications, on sites of 1 hectare or greater in
  Flood Zone 1 and for all proposals located in Flood Zone 2 or 3 or subject to Surface Water Flood Risk
  as designated by the Environment Agency. ... All Householder applications located in Flood Zone 2 or
  3 / subject to Surface Water Flood Risk / or fall within a Critical Drainage Area
must-include:
- item: 'For householders: on the standard Environment Agency form'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: A site-specific FRA identifying the sources of flooding and the risk to and from the development,
    how it will be managed and mitigated, taking climate change into account
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: A Flood Evacuation Management Plan where a safe and dry means of escape cannot be provided
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Topographical survey of the existing and proposed site, with contours showing surface water flow
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Areas of permeable and impermeable land, existing and proposed
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Informed by a suitably qualified specialist, with mitigation incorporated into the plans
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: The conclusions of the Sequential and Exception Tests
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 60-61 (Householder Local List page 31-32). The
  householder version is the 'Flood Risk Assessment Form'. A site is in a flood zone if any part of the
  red line area is. The main list covers planning applications without naming types, so it is applied
  to full, outline and reserved matters applications; householder triggers come from the Householder Local
  List.
review-status: unverified
field-status: {}
