reference: fire-statement
local-authority: KTT
required-if:
  always: true
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
must-include:
- item: Gateway One fire statement on the Secretary of State's form
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: A building is 18 metres or more tall.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: A building has 7 or more storeys.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
  source-text: Fire statements must be submitted on a form published by the Secretary of State (or a form
    to similar effect) and contain the particulars specified or referred to in the form
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted form contents. From the audit: a London Plan fire statement
  for all applications (also on the Householder list), and a Gateway One statement for buildings of 18m+
  or 7+ storeys with 2+ dwellings.'
review-status: unverified
field-status: {}
