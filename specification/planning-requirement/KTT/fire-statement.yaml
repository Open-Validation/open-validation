reference: fire-statement
local-authority: KTT
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policy D12; Article 9A of the Town and Country Planning (Development
  Management Procedure) (England) Order 2015
source-text: All applications ... Legislation requires that a Fire Statement is to be submitted with an
  application for planning permission
must-include:
- item: A Fire Statement meeting London Plan Policy D12, or a Reasonable Exception Statement (Form 4)
    justifying why parts of the policy are not relevant (generally only for householder applications and
    applications creating no dwellings or commercial units, no lifts, no change to external materials
    or communal evacuation areas)
  level: must
- item: 'For relevant buildings (18 m or more, or 7 or more storeys, with two or more dwellings or educational
    accommodation): the Gateway One fire statement on the Secretary of State''s form, covering fire safety
    principles for each building, site layout, emergency vehicle access and water supplies, consultation,
    and relevant local policies'
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18 metres or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
- item: The Government's Fire Statement Form for all major development
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (adopted 1 May 2024), page 21-22 and 58-60 (Householder Local List page
  30-31). The list has two rows: ''Fire Statement Gateway One'' (national) and ''Fire Statement (London
  Plan)'' (local, all applications). The main list covers planning applications without naming types,
  so it is applied to full, outline and reserved matters applications; householder triggers come from
  the Householder Local List.'
review-status: unverified
field-status: {}
