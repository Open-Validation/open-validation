    the same two lists (main and householder) were still the ones linked on 2026-11-05'
  status: outdated
submission-standards:
- item: Submitted electronically via the Planning Portal, all documents in one go
  level: should
- item: No drawing that needs printing larger than A3
  level: must
- item: Maximum single attachment 5 MB and maximum application 25 MB
  level: must
- item: Drawings attached as PDF files (other documents may be .jpg, .doc or .xls)
  level: must
- item: Drawings categorised by type as presented on the Portal
  level: must
- item: All plans and drawings accurately drawn to a conventional metric scale (such as 1:1250, 1:500,
    1:200, 1:100) and true to the stated scale
  level: must
- item: A scale bar that refers to the paper size (for example 1:100 on A3); no 'not to scale' or 'do
    not scale' disclaimers, except on perspective drawings or images
  level: must
- item: Key dimensions annotated on floor plans, site plans, elevations and section / level plans
  level: must
- item: Plans fully annotated (for example boundary fences labelled) with distances from boundaries
  level: must
- item: All plans include a north arrow
  level: must
- item: Neighbouring properties and development depicted accurately
  level: must
- item: All plans on the same paper size
  level: should
- item: Each drawing in a separate PDF, titled with its drawing number; not one combined PDF
  level: should
- item: Title box on each drawing with the address and proposal, drawing title, date, scale and drawing
    number, with revisions clearly identified
  level: should
- item: No personal or sensitive data on drawings or documents (phone numbers, emails, signatures, car
    registrations, faces)
  level: should
- item: Consented but unbuilt development shown as proposed (with its reference), not as existing
  level: must
audit:
  status: audited
