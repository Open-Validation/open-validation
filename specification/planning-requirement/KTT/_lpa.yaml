  notes: 'Grokbot''s reference link points to the Section 3 tick-box checklist DOCX, not the Validation
    Local List PDF (February 2024, adopted 1 May 2024), and its date comes from the upload folder. The
    extraction misses about 20 local requirements, including the Heritage Statement and the outline, reserved
