reference: recreation-facilities-assessment
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: loss-of-open-space
      value: true
      description: The loss of open space (predominantly undeveloped land, public or private).
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policies G3 and G4
source-text: All applications that propose the loss of open space
must-include:
- item: Existing open space in the vicinity
  level: must
- item: Open space lost (sq m), open space proposed (sq m) and its type
  level: must
- item: Any necessary mitigation, such as contributions to routes to or improvements of existing open
    space
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 75-76. The list calls it 'Open Space Assessment'.
  The main list covers planning applications without naming types, so it is applied to full, outline and
  reserved matters applications; householder triggers come from the Householder Local List.
review-status: unverified
field-status: {}
