reference: cil-form
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
  - condition:
      field: floorspace
      operator: '>'
      value: 100
      description: New build development over 100 sq m (internal), including residential extensions and
        annexes.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Community Infrastructure Levy Regulations 2010 (as amended)
source-text: All applications that include new build development over 100 sqm (internal), including residential
  extensions and annexes.
must-include:
- item: CIL Additional Information Form 1
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 10 (Householder Local List page 8). The main
  list covers planning applications without naming types, so it is applied to full, outline and reserved
  matters applications; householder triggers come from the Householder Local List.
review-status: unverified
field-status: {}
