reference: site-plan
local-authority: KTT
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications ... All Housholder applications
must-include:
- item: Proposed block plan at 1:500 with a scale bar that refers to the paper size, labelled 'Block Plan'
  level: must
- item: 'Block plan: the proposed development (hatched or highlighted), boundaries, existing structures
    on site (sheds, outbuildings, extensions), landscape features, trees, fences or walls on site and
    adjoining sites'
  level: must
- item: 'Block plan: car parking, cycle parking and waste storage areas, and utility manholes'
  level: must
- item: 'Block plan: direction of north and key dimensions, including distances to boundaries and the
    depth and width of the extension'
  level: must
- item: Existing and proposed site plans at 1:200 or 1:500, each with the direction of north and a scale
    bar that refers to the paper size, labelled 'Existing Site Plan' / 'Proposed Site Plan'
  level: must
- item: 'Site plans: the existing/proposed buildings in relation to the site boundaries and other buildings;
    neighbouring buildings, roads and footpaths; access arrangements; all trees and hedges on and next
    to the site; public rights of way'
  level: must
- item: 'Site plans: annotated distances to boundaries'
  level: must
- item: A unique drawing number and a clear label (e.g. 'Existing Ground Floor Plan')
  level: must
confidence: medium
notes: 'From the council''s list (adopted 1 May 2024), page 11-14 (Householder Local List page 10-12).
  The list has three rows: Proposed Block Plan, Existing Site Plan and Proposed Site Plan. The main list
  covers planning applications without naming types, so it is applied to full, outline and reserved matters
  applications; householder triggers come from the Householder Local List.'
review-status: unverified
field-status: {}
