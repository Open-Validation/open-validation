reference: heritage-statement
local-authority: KTT
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      description: The proposal affects a designated or non-designated heritage asset.
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: The site is in an Archaeological Priority Area.
    - condition:
        field: ground-disturbance
        value: true
        description: The proposal involves ground disturbance.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
must-include:
- item: Schedule of works
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the audit (missing_requirement, wrong_app_type): proposals affecting designated or non-designated
  heritage assets or ground disturbance in an APA, with a schedule of works for listed buildings. Also
  on the Householder list.'
review-status: unverified
field-status: {}
