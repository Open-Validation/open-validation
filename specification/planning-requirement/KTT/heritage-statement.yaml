reference: heritage-statement
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
  - any:
    - site:
        in:
        - listed-building
        - conservation-area
        - world-heritage-site
        - park-and-garden
        - scheduled-monument
        - locally-listed-building
        - local-character-area
        description: The proposal affects the significance of a designated or non-designated heritage
          asset (listed building, conservation area, World Heritage Site, registered park or garden, scheduled
          monument, locally listed building, Local Area of Special Character).
    - all:
      - site:
          in:
          - archaeological-priority-area
          description: Within an Archaeological Priority Area.
      - condition:
          field: ground-disturbance
          value: true
          description: The proposal disturbs the ground.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policy HC1; NPPF; Historic England Advice Note 12
source-text: 'All applications where the proposal: affects the significance of designated and non-designated
  heritage assets; or involves disturbance of ground within an Archaeological Priority Area.'
must-include:
- item: The significance of the heritage assets affected, including the contribution of their setting
  level: must
- item: How this has informed the proposals
  level: must
- item: The impact on significance and the level of harm (if any)
  level: must
- item: Photographs of affected assets and photomontages of the proposal within the affected view, where
    relevant
  level: should
- item: The sources considered, the expertise consulted and the steps taken to avoid or minimise adverse
    impacts
  level: must
- item: 'For works to a listed building, as relevant: schedule of external/internal works, demolition
    plans at 1:50 minimum with photographs, building services strategies and material specification'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 66-67 (Householder Local List page 32-34). The
  main list covers planning applications without naming types, so it is applied to full, outline and reserved
  matters applications; householder triggers come from the Householder Local List.
review-status: unverified
field-status: {}
