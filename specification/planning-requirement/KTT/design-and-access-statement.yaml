reference: design-and-access-statement
local-authority: KTT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a conservation area or affecting a World Heritage Site.
    - any:
      - all:
        - application-type:
            in:
            - full
            - outline
            - reserved-matters
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: Creating one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Creating floorspace of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications for major development (see definition above); All applications in Conservation
  Areas or affecting World Heritage Sites, Where the proposal is creating one or more dwellings ... or
  Creating floorspace of 100 sqm or more. Applications for Listed Building Consent
must-include:
- item: The design principles and concepts applied, and the steps taken to appraise the context and how
    the design takes it into account
  level: must
- item: The approach to access, how relevant Local Plan policies have been taken into account, consultation
    on access and how specific access issues have been addressed
  level: must
- item: 'For listed building consent: how the design takes account of the building''s special architectural
    or historic importance, its physical features and its setting; access (unless works are only internal)
    including alternatives considered; and consultation undertaken'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the council''s list (adopted 1 May 2024), page 18-21 (Householder Local List page 17-18).
  Householders: only the conservation area/World Heritage Site and 100 sq m limb applies. A parallel planning
  and listed building application should have one combined statement. The main list covers planning applications
  without naming types, so it is applied to full, outline and reserved matters applications; householder
  triggers come from the Householder Local List.'
review-status: unverified
field-status: {}
