reference: design-and-access-statement
local-authority: KTT
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: The site is in a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal creates one or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The proposal creates 100 square metres or more of floorspace.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted drawing guidance. From the audit: majors, 1+ dwellings
  or 100 sqm+ in a conservation area or World Heritage Site, and listed building consent.'
review-status: unverified
field-status: {}
