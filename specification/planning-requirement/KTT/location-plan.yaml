reference: location-plan
local-authority: KTT
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: A recognised scale, for example 1:1250 or 1:2500, with a scale bar that refers to the paper size
    (for example 1:1250 on A4)
  level: must
- item: Direction of north
  level: must
- item: At least two named roads (where possible)
  level: must
- item: All surrounding buildings, roads and footpaths on adjoining land, and neighbouring properties
    with their numbers
  level: must
- item: A red line around all land required for the development, including access to the public highway
    (for a new crossover, the pavement)
  level: must
- item: A blue line around all other land owned by the applicant close to or adjoining the site
  level: must
- item: Based on an up-to-date Ordnance Survey map; land registry maps not accepted
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 10-11 (Householder Local List page 9). The list
  calls it a 'Site Location Plan'. The main list covers planning applications without naming types, so
  it is applied to full, outline and reserved matters applications; householder triggers come from the
  Householder Local List.
review-status: unverified
field-status: {}
