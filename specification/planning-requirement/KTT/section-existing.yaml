reference: section-existing
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: A change in ground levels, or development next to changing ground levels.
    - condition:
        field: renewable-energy-development
        value: true
        description: Installation of renewable energy technologies such as solar panels or air source
          heat pumps.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications that involve a change in the ground levels or where development is proposed
  next to changing ground levels ... All applications that involve the installation of Renewable Energy
  technologies including Solar Panels, Air Source Heat Pumps etc
must-include:
- item: 'Site levels and sections at 1:50 or 1:100: floor levels, building height and relationship to
    site boundaries, and direction of north (site levels plan)'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels.
- item: How proposed buildings relate to existing site levels and neighbouring development, with existing
    and proposed site levels and finished floor levels related to a fixed datum point off site
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels.
- item: Sections through the building including all floors (basement, loft space, roof and terraces)
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels.
- item: Renewable energy sections at 1:10 or 1:20 showing the height of the technology from the roof or
    ground
  level: must
  required-if:
    condition:
      field: renewable-energy-development
      value: true
      description: Renewable energy technologies.
- item: A scale bar that refers to the paper size
  level: must
- item: A unique drawing number and a clear label (e.g. 'Existing Ground Floor Plan')
  level: must
confidence: medium
notes: 'From the council''s list (adopted 1 May 2024), page 17-18 and 22-23 (Householder Local List page
  16-17 and 19). The list has two rows: ''Site Levels and Sections'' and ''Renewable Energy Sections''.
  The main list covers planning applications without naming types, so it is applied to full, outline and
  reserved matters applications; householder triggers come from the Householder Local List.'
review-status: unverified
field-status: {}
