reference: transport-assessment
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - discretionary
    - condition:
        field: class-e-floorspace
        operator: '>='
        value: 100
        description: Operational development or change of use providing 100 sq m or more of Class E floorspace.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policies T4, T5, T6 and D8; TfL Transport Assessment Guidance
source-text: A Transport Assessment (TA) should be submitted as part of any major development and any
  planning application where the proposed development has significant transport implications. ... Any
  proposal for operational development or change of use of premises to provide 100 sqm or more floorspace
  in use classes E
must-include:
- item: 'For major proposals: accessibility by all modes, likely modal split, and measures to improve
    public transport, walking and cycling, reduce parking need and mitigate impacts, based on TfL guidance'
  level: must
  required-if:
    ref: major-development
- item: 'A transport statement as a minimum: the PTAL, expected trip generation, access to public transport
    and sustainable modes, and expected impact on parking'
  level: must
- item: A parking survey where parking stress requires it
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 89-91. The list has a 'Transport Assessment'
  row and a 'Transport statement' row (schools, nurseries, hospitals, places of worship, 100 sq m or more
  of Class E, and other minor development with transport impacts). 'Significant transport implications'
  and the use-based cases show as 'check'. The main list covers planning applications without naming types,
  so it is applied to full, outline and reserved matters applications; householder triggers come from
  the Householder Local List.
review-status: unverified
field-status: {}
