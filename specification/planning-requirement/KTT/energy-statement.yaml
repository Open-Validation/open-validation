reference: energy-statement
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policies SI 2, SI 3 and SI 4; GLA 2022 Energy Assessment guidance
source-text: All major applications
must-include:
- item: Submitted at application stage, following the GLA 2022 Energy Assessment guidance and Carbon Emissions
    Reporting Spreadsheet (version 2)
  level: must
- item: The energy hierarchy and heating hierarchy, with at least a 35% on-site carbon reduction beyond
    Part L 2021 (at least 10% from energy efficiency for residential, 15% for non-residential), and how
    any shortfall is offset
  level: must
- item: Overheating mitigation through passive design, with dynamic overheating modelling using CIBSE
    guidance
  level: must
- item: Energy Use Intensity and space heating demand
  level: must
- item: Prioritised connection to district heat networks (with correspondence), commitment to a site-wide
    heat network and single energy centre, and low carbon/renewable plant and renewable technologies
  level: must
- item: How energy performance will be monitored post-construction ('be seen')
  level: must
- item: Any carbon offset contribution with calculations, also in the draft Heads of Terms
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 52-56. The list calls it 'Energy assessment
  and Overheating Mitigation'. The main list covers planning applications without naming types, so it
  is applied to full, outline and reserved matters applications; householder triggers come from the Householder
  Local List.
review-status: unverified
field-status: {}
