reference: land-contamination-assessment
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - site:
        in:
        - contaminated-land
        description: Contaminated land, or a site previously used for industrial processes.
    - ref: major-development
    - site:
        in:
        - open-space
        description: On or adjoining public open space.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Part IIA of the Environmental Protection Act 1990; GLA Practice Note on contaminated and polluted
  sites
source-text: All applications on contaminated land, sites previously used for industrial processes, major
  development and those on or adjoining public open space.
must-include:
- item: Carried out by a competent and qualified person
  level: must
- item: A description of the site and the scope of the inspection
  level: must
- item: A full review of historical land use and the potential for contamination
  level: must
- item: Contaminant type and characteristics
  level: must
- item: Consultation with the relevant regulatory authorities
  level: must
- item: An outline Conceptual Site Model identifying potential risks
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 67-68. A householder application is unlikely
  to need one if the land has been remediated (evidence needed). The main list covers planning applications
  without naming types, so it is applied to full, outline and reserved matters applications; householder
  triggers come from the Householder Local List.
review-status: unverified
field-status: {}
