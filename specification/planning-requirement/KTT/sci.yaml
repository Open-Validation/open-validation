reference: sci
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Royal Borough of Kingston upon Thames Statement of Community Involvement
source-text: All major applications and sensitive schemes where significant public interest is likely.
must-include:
- item: 'An engagement plan: the communities to be engaged (using demographic data), how (digital, print,
    face to face), and how gaps will be addressed'
  level: must
- item: How local views were sought and taken into account
  level: must
- item: The number and type of engagements and the number of attendees
  level: must
- item: Engagement with the wider community before submission, not only pre-application engagement with
    the council
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 84-85. 'Sensitive schemes' show as 'check'.
  The main list covers planning applications without naming types, so it is applied to full, outline and
  reserved matters applications; householder triggers come from the Householder Local List.
review-status: unverified
field-status: {}
