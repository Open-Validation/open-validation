reference: arboriculturist-report
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - hh
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees have the potential to be impacted.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policies G1, G5 and G7; BS 5837:2012
source-text: All applications where trees have the potential to be impacted.
must-include:
- item: A tree survey with an assessment of tree quality
  level: must
- item: An arboricultural impact assessment with a tree retention/removal plan
  level: must
- item: CAVAT values for any trees to be lost
  level: must
- item: An arboricultural method statement and tree protection plan to BS 5837:2012 where the impacts
    require tree protection or special working methods in root protection areas
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 92 (Householder Local List page 36). The list
  calls it 'Tree Survey, Arboricultural Method Statement and Arboricultural Impact Assessment (including
  Tree Protection Plan)'. The main list covers planning applications without naming types, so it is applied
  to full, outline and reserved matters applications; householder triggers come from the Householder Local
  List.
review-status: unverified
field-status: {}
