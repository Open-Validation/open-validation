reference: lighting-assessment
local-authority: KTT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - condition:
        field: external-lighting
        value: true
        description: Lighting likely to be visible off site (light spill), particularly floodlighting.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: external-lighting
        value: true
        description: External lighting.
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: NPPG Light Pollution; Bat Conservation Trust guidance
source-text: All applications that include lighting likely to be visible off site (i.e. light spill),
  particularly proposals involving flood lighting. ... All Householder applications that include external
  lighting.
must-include:
- item: 'For householders: plans/drawings showing that any lighting would not be visible off site'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Type, location and direction of external lighting, with height and power rating
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Measures to minimise light spill, and its extent (by lux drawing if appropriate)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Proposed hours of use and means of control
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Impact on biodiversity and any mitigation
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 70 (Householder Local List page 34). The main
  list covers planning applications without naming types, so it is applied to full, outline and reserved
  matters applications; householder triggers come from the Householder Local List.
review-status: unverified
field-status: {}
