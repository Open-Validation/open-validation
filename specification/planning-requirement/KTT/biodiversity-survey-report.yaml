reference: biodiversity-survey-report
local-authority: KTT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: London Plan (March 2021) Policies G1-G9; NPPG Biodiversity
source-text: All major applications
must-include:
- item: A suitable ecological appraisal (usually an Ecological Impact Assessment), unless in exceptional
    circumstances
  level: must
- item: Any additional species-specific surveys it recommends, submitted at validation
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 50-51. The list calls it 'Ecology (Biodiversity/Geodiversity)
  Surveys and Reports'. The main list covers planning applications without naming types, so it is applied
  to full, outline and reserved matters applications; householder triggers come from the Householder Local
  List.
