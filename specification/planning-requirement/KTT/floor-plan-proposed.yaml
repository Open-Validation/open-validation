reference: floor-plan-proposed
local-authority: KTT
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
source-url: https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications
must-include:
- item: Drawn at 1:50 or 1:100 with a scale bar that refers to the paper size
  level: must
- item: Key dimensions, including distance from boundaries and the depth and width of the extension
  level: must
- item: All internal measurements and the Gross Internal Area (GIA)
  level: must
- item: Direction of north
  level: must
- item: Each relevant floor or part floor, the roof and means of access; walls or buildings to be demolished
    clearly shown
  level: must
- item: Proposed plans in context with the site boundary and adjacent buildings
  level: must
- item: 'For change of use: the extent of the existing and proposed use'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: A change of use.
- item: Existing floor plans show the arrangement when the application is submitted
  level: must
- item: A unique drawing number and a clear label (e.g. 'Existing Ground Floor Plan')
  level: must
confidence: medium
notes: From the council's list (adopted 1 May 2024), page 14-15 (Householder Local List page 13-14). The
  main list covers planning applications without naming types, so it is applied to full, outline and reserved
  matters applications; householder triggers come from the Householder Local List.
review-status: unverified
field-status: {}
