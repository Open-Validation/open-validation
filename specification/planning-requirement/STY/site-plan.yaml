reference: site-plan
local-authority: STY
required-if:
  condition:
    field: external-alterations
    value: true
    description: The proposal includes extensions or external ground works (not change of use only, or
      where no external building works are proposed).
source-url: https://www.southtyneside.gov.uk/media/11624/Validation-of-planning-applications-in-Tyneside/pdf/Tyneside_Validation_Checklist_update_2026-_Final_Version.pdf?m=1793114791407
source-text: Site Plan (Existing and Proposed) All planning applications that include extensions or external
  ground works (i.e. excluding applications for change of use only or where no external building works
  are proposed) shall include existing and proposed site plans at a standard metric scale (1:100 or 1:200),
  unless otherwise requested and agreed with the Local Planning Authority.
must-include:
- item: Both existing and proposed site plans
  level: must
- item: A standard metric scale (1:100 or 1:200), unless otherwise agreed
  level: must
