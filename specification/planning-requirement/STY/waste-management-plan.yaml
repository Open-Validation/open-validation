reference: waste-management-plan
local-authority: STY
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal involves new dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: The proposal creates new or increased commercial floorspace.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use that needs new or enhanced waste storage.
source-url: https://www.southtyneside.gov.uk/media/11624/Validation-of-planning-applications-in-Tyneside/pdf/Tyneside_Validation_Checklist_update_2026-_Final_Version.pdf?m=1793114791407
source-text: Waste Management Plan When is this required? 94 Planning applications involving new dwellings,
  new and increased commercial floorspace and changes of use applications that require new or enhanced
  waste storage provision.
confidence: medium
notes: '''Waste Management Plan When is this required? Planning applications involving new dwellings,
  new and increased commercial floorspace and changes of use applications that require new or enhanced
  waste storage provision.'''
review-status: unverified
