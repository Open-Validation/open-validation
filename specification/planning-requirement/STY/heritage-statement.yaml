reference: heritage-statement
local-authority: STY
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - conservation-area
      description: The proposal is in or affects a conservation area.
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: The proposal affects a designated or non-designated heritage asset.
source-url: https://www.southtyneside.gov.uk/media/11624/Validation-of-planning-applications-in-Tyneside/pdf/Tyneside_Validation_Checklist_update_2026-_Final_Version.pdf?m=1793114791407
source-text: 'Heritage Statement When is this required? A Heritage Statement is required for: Listed Building
  Consent applications; … Other applications in conservation areas, including demolition'
must-include:
- item: For heritage assets on the Heritage at Risk Register, how the asset will be brought into repair
    and, where possible, reuse
  level: must
  source-text: Applications which affect heritage assets included on the Heritage at Risk Register will
    be required to demonstrate how they will bring that heritage asset into repair, and where possible,
    reuse.
confidence: medium
notes: 'From the audit (wrong_app_type): a Heritage Statement also covers demolition in conservation areas;
  the Gateshead audit adds major applications in or affecting conservation areas and non-designated heritage
  assets (Note 19). The Full planning row came from the 2019 list. The Heritage at Risk sentence was in
  the workbook''s photographs row.'
review-status: unverified
