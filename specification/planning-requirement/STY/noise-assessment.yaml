reference: noise-assessment
local-authority: STY
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development may create additional noise (including Class B2 uses).
  - condition:
      field: noise-sensitive-use
      value: true
      description: The development would be sensitive to the prevailing acoustic environment.
  - condition:
      field: plant-equipment
      value: true
      description: New or replacement industrial plant or machinery is proposed.
  - discretionary
source-url: https://www.southtyneside.gov.uk/media/11624/Validation-of-planning-applications-in-Tyneside/pdf/Tyneside_Validation_Checklist_update_2026-_Final_Version.pdf?m=1793114791407
source-text: A noise impact assessment prepared by a suitably qualified acoustician must support applications
  that either raise issues of disturbance due to the nature of the proposed development or are considered
  to be noise sensitive developments.
confidence: medium
notes: 'The workbook put this text on the odour row; the noise row carried kitchen-extraction text. The
  Class B2 and plant/machinery cases are from the joint list''s trigger, as extracted for Gateshead. From
  the audit (missing_requirement): a vibration survey for development next to rail or Metro lines, and
  an acoustic assessment for air source heat pumps, are also required.'
review-status: unverified
