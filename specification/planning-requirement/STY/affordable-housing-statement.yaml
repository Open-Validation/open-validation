reference: affordable-housing-statement
local-authority: STY
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: The proposal creates 15 or more dwellings.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Housing on a site of 0.5 hectares or more.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: The proposal creates 11 or more dwellings.
    - site:
        in:
        - rural-area
        description: The site is in one of the urban fringe villages.
source-url: https://www.southtyneside.gov.uk/media/11624/Validation-of-planning-applications-in-Tyneside/pdf/Tyneside_Validation_Checklist_update_2026-_Final_Version.pdf?m=1793114791407
source-text: 'South Tyneside: 11+ units in the urban fringe villages …, 15+ units elsewhere, or housing
  on sites of 0.5 ha or more. … The title must state the document is/includes an affordable housing statement
  The document can be included within the Design and Access or Planning Statement Guidance This statement
  should clearly identify the following points: Is affordable housing to be provided? If not, then what
  is the justification? (i.e. financial viability)'
must-include:
- item: The title states that the document is or includes an affordable housing statement
  level: must
- item: Whether affordable housing is to be provided and, if not, the justification (e.g. financial viability)
  level: should
- item: Whether it will be provided on site, off site or by a financial contribution
  level: should
confidence: medium
notes: 'From the audit (wrong_trigger): South Tyneside''s thresholds (requirement 12, quoted by the audit).
  ''Urban fringe villages'' is mapped to the rural-area designation; check which villages the list names.
  The third must-include item is from the same joint-list text as extracted for North Tyneside.'
review-status: unverified
field-status: {}
