reference: biodiversity-survey-report
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - s73
      - lbc
      - hedgerow-removal
      - pa-demo-building
  - condition:
      field: protected-species
      value: true
      description: The development may have impacts on wildlife and biodiversity.
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
policy: Broxtowe Part 2 Local Plan (2019) Policy 31
source-text: Required for development which may have impacts on wildlife and biodiversity. … Certain proposals
  which include work such as the demolition of older buildings or roof spaces, removal of trees, scrub,
  hedgerows or alterations to water courses may affect protected species and will need to provide information
  on them, any potential impacts for them and any mitigation proposals for such impacts.
must-include:
- item: Existing biodiversity interests and possible impacts on them
  level: must
- item: Information supporting any proposed mitigation and/or compensation measures
  level: must
- item: Where appropriate, plans showing significant wildlife habitats or features and the location of
    habitats of protected species
  level: should
- item: 'Development in the countryside affecting areas designated for biodiversity: assessment of impacts
    and proposals for long-term maintenance and management'
  level: should
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - local-nature-reserve
      description: Areas designated for their biodiversity interests.
confidence: medium
notes: From the council's list (revised October 2024), pages 2-3, 12. Ticked for Major, Minor and Householder.
  Listed on most application-type checklists (householder, planning permission, outline, reserved matters,
  s73, listed building consent, hedgerow removal, prior notification of demolition).
review-status: unverified
field-status: {}
