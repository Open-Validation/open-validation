reference: sustainability-statement
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - s73
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor development (less than 10 dwellings; office, retail and industrial up to 1,000
          sq m or a site up to 1 hectare).
  - condition:
      field: building-works
      value: true
      description: New buildings, conversions and extensions.
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
policy: Aligned Core Strategy (2014) Policy 1; Broxtowe Part 2 Local Plan (2019) Policy 15
source-text: For planning applications proposing new buildings, conversions and extensions, Broxtowe Borough
  Council requires the submission of a report detailing how the proposed development incorporates energy
  efficiency best practice measures in its design, layout and orientation.
must-include:
- item: How the development incorporates energy efficiency best practice in its design, layout and orientation
  level: must
- item: Specific measures to minimise water and energy use and the generation of waste
  level: should
- item: Provision of micro renewables and sustainable drainage
  level: should
- item: 'Major residential: a statement and/or plans showing at least 10% of dwellings meet M4(2) (accessible
    and adaptable dwellings)'
  level: should
  required-if:
    all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential scheme.
confidence: medium
notes: From the council's list (revised October 2024), pages 4, 13. The list calls it 'Energy Efficiency
  / Sustainability Statement'. Ticked for Major and Minor.
review-status: unverified
field-status: {}
