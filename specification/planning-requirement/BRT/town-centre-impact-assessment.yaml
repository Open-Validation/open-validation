reference: town-centre-impact-assessment
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - s73
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail, leisure, office or food and drink development outside of town centres.
  - condition:
      field: town-centre-use-floorspace
      operator: '>'
      value: 2500
      description: Over 2,500 sq m.
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
policy: Broxtowe Part 2 Local Plan (2019) Policy 13
source-text: For applications which propose retail, leisure, office or food and drink development outside
  of town centres, the Part 2 Local Plan (Policy 13) requires an impact assessment if the development
  is over 2,500m2
confidence: medium
notes: From the council's list (revised October 2024), pages 11, 16. The list calls it 'Impact assessment
  of retail, leisure, office or food and drink development outside town centres'; ticked for Major.
review-status: unverified
field-status: {}
