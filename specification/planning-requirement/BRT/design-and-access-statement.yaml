reference: design-and-access-statement
local-authority: BRT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline-some
        - outline-all
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Buildings where the floor space is 100 square metres or more.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.broxtowe.gov.uk/media/mqife2sv/01-national-statutory-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: These must accompany applications for development or works that are … ‘Major’ development
  … In a conservation area … of one or more dwellings … of buildings where the floor space is 100 square
  metres or more … Listed building consent
must-include:
- item: Proportionate to the complexity of the development
  level: must
- item: The design principles and concepts applied to the development
  level: must
- item: The site and context and how the design takes it into account
  level: must
- item: The approach to access and how it takes account of policies on it
  level: must
- item: The consultations undertaken on access and what account has been taken of the outcome
  level: must
- item: How specific issues affecting access have been addressed
  level: must
confidence: medium
notes: From the council's National Statutory Requirements checklist (01, revised October 2026). Not needed
  for s73 applications, renewals, non-material amendments, material changes of use, TPO or advert consents
  or discharge of conditions. The reserved matters checklist lists it as a local requirement ('may include'),
  so it shows as discretionary there. For listed building consent it can be combined with the Heritage
  Statement.
review-status: unverified
field-status: {}
