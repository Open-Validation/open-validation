reference: habitat-baseline
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - s73
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the biodiversity gain condition.
source-url: https://www.broxtowe.gov.uk/media/mqife2sv/01-national-statutory-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 Article 7
source-text: The pre-development biodiversity value of the onsite habitat on the date of application (or
  an earlier date) … A plan, drawn to an identified scale which must show the direction of North, showing
  onsite habitat existing on the date of application (or and earlier date), including any irreplaceable
  habitat.
must-include:
- item: Plan drawn to an identified scale showing the direction of North
  level: must
- item: On-site habitat existing on the date of application (or an earlier date), including any irreplaceable
    habitat
  level: must
- item: Where an earlier date is used, the proposed date and the reasons for it
  level: must
- item: A statement on whether the on-site value is lower because of degradation, with supporting evidence
    if so
  level: must
- item: A description of any irreplaceable habitat on the land
  level: must
confidence: medium
notes: 'From the council''s National Statutory Requirements checklist (01, revised October 2026). National
  minimum BNG information (DMPO Article 7). Follows the law: only development subject to the biodiversity
  gain condition.'
review-status: unverified
field-status: {}
