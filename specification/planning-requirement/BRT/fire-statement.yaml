reference: fire-statement
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: Seven or more storeys.
source-url: https://www.broxtowe.gov.uk/media/mqife2sv/01-national-statutory-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, Article 9A
source-text: A Fire Statement must accompany applications for planning permission for the provision or
  development of, or within the curtilage of … that are 18 metres or more in height or … that contain
  seven or more storeys … two or more dwellings or … educational accommodation
must-include:
- item: On the form published by the Secretary of State, with the particulars it asks for about fire safety
    design principles, concepts and standards
  level: must
confidence: medium
notes: From the council's National Statutory Requirements checklist (01, revised October 2026). Not required
  for outline applications, s73 applications or certain material changes of use.
review-status: unverified
field-status: {}
