source-text: ‘Major’ applications need to be supported by a statement setting out how the applicant has
  complied with the requirements for pre-application consultation set out in the local planning authority’s
  adopted statement of community involvement and demonstrating that the views of the local community have
  been sought and taken into account in the formulation of development proposals.
must-include:
- item: How the applicant has complied with the pre-application consultation requirements of the council's
    Statement of Community Involvement (revised 2022)
  level: must
- item: That the views of the local community were sought and taken into account
  level: must
