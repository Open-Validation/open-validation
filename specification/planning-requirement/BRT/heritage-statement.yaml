reference: heritage-statement
local-authority: BRT
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline-some
        - outline-all
        - reserved-matters
        - s73
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - locally-listed-building
        - park-and-garden
        description: The development has the potential to impact on a designated or non-designated heritage
          asset.
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
source-text: Where development would have the potential to impact on a designated or non- designated heritage
  asset
must-include:
- item: 'Listed building consent: a schedule of works to the listed building(s)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Analysis of the significance of the archaeology, history and character of the building/structure
  level: must
- item: The principles of and justification for the proposed works, and their impact on the special character
    of the listed building/structure, its setting and the setting of adjacent listed buildings
  level: must
- item: Plans showing historic features on or next to the site, including listed buildings and structures,
    historic parks and gardens and scheduled ancient monuments
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
        - outline-some
        - outline-all
        - reserved-matters
        - s73
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - locally-listed-building
        - park-and-garden
        description: Related to or impacting on the setting of heritage assets.
- item: 'In a conservation area: an assessment of the impact on the character and appearance of the area'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Within a conservation area.
confidence: medium
notes: From the council's list (revised October 2024), pages 6, 14. The list calls it 'Heritage Impact
  Assessment (including Historical, Archaeological features and Scheduled Ancient Monuments)'; ticked
  for Major, Minor and Householder, and listed on the listed building consent checklists. A structural
  survey may also be needed for listed building consent (see unmapped).
review-status: unverified
field-status: {}
