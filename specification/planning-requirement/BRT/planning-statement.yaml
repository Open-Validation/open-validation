source-text: Such statements would be beneficial for most applications, and are required for ‘major’ applications,
  although the content could be amalgamated with the Design & Access Statement. … Should include an assessment
  of how the proposed development accords with relevant local and national planning policies.
must-include:
- item: An assessment of how the development accords with relevant local and national planning policies
  level: must
- item: The context and need for the development
  level: should
- item: The business case for the development, where necessary
  level: should
- item: 'Prior notification of demolition: method statement, hours of operation, machinery, location of
    plant/stockpiles and proposals to mitigate noise, dust etc.'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
  source-text: Planning Statement (including method statement, hours of operation, details of machinery
    to be used, location of plant/stockpiles and proposals to mitigate noise, dust etc)
confidence: medium
notes: From the council's list (revised October 2024), pages 9, 15. Ticked for Major. Listed as 'Planning
  Statement/Business Case' ('may include') on almost every application-type checklist, so other applications
  show as discretionary. The demolition contents come from checklist 24.
