reference: arboriculturist-report
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - s73
      - lbc
      - pa-demo-building
      - hedgerow-removal
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within the site, or on adjacent land, that could influence or be affected by
        the development (including street trees).
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
source-text: For proposals where there are trees within the application site, or on land adjacent to it
  that could influence or be affected by the development (including street trees).
must-include:
- item: Prepared by a suitably qualified and experienced arboriculturist
  level: must
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: Survey information, protection plan and method statement following BS5837
  level: should
- item: Position, size, age, species, height and spread of each tree, an assessment of its condition and
    any remedial measures
  level: must
- item: Remedial works following BS 3998
  level: should
confidence: medium
notes: From the council's list (revised October 2024), pages 11, 16. The list calls it 'Tree survey/Arboricultural
  implications'; ticked for Major, Minor and Householder.
review-status: unverified
field-status: {}
