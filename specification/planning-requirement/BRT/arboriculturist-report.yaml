source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
source-text: Checklist 02 Tree survey/Arboricultural implications Where there are trees within the application
  site, or on land adjacent to it that could influence or be affected by the development (including street
  trees), information will be required on which trees are to be retained and on the means of protecting
  these trees during construction works.
must-include:
- item: Which trees are to be retained
  level: must
- item: How retained trees will be protected during construction
  level: must
