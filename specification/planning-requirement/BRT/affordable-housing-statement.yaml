reference: affordable-housing-statement
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more dwellings proposed (major residential).
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
policy: Broxtowe Part 2 Local Plan (2019) Policy 15
source-text: Policy 15 of the Broxtowe Part 2 Local Plan (2019) requires the provision of ‘affordable
  housing’ on all housing sites where 10 or more dwellings are proposed (that is, a major application).
  … Required for all residential developments where more than 10 dwellings are proposed.
must-include:
- item: The locations of any affordable housing and any market housing in the development (information
    and plans)
  level: must
- item: The numbers of residential units and the mix of units, with numbers of habitable rooms and/or
    bedrooms
  level: must
- item: Different levels or types of affordability or tenure fully explained
  level: should
- item: Details of any Registered Social Landlords acting as partners
  level: should
confidence: medium
notes: From the council's list (revised October 2024), pages 2, 12. Ticked for Major only. The table says
  'more than 10 dwellings' but the text and Policy 15 say '10 or more' (a major application); 10 or more
  is used. It can be included in the Design and Access Statement and shown on plan, and affordable housing
  should be part of the draft Heads of Terms. Listed on the outline and reserved matters checklists. Each
  application-type checklist says its local requirements 'may include some or all of the following'; the
  table on pages 12-16 sets the Major / Minor / Householder bands and triggers.
review-status: unverified
field-status: {}
