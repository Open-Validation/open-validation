reference: land-contamination-assessment
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - s73
  - any:
    - ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Minor development (less than 10 dwellings; office, retail and industrial up to 1,000
          sq m or a site up to 1 hectare).
  - any:
    - site:
        in:
        - contaminated-land
        description: Sites known to be contaminated.
    - condition:
        field: industrial-site
        value: true
        description: Sites previously in use for industrial processes.
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
source-text: For development on sites known to be contaminated, or which have been previously in use for
  industrial processes.
must-include:
- item: Where contamination is identified, the proposed remediation measures
  level: must
confidence: medium
notes: From the council's list (revised October 2024), pages 6-7, 14. Ticked for Major and Minor (the
  page 7 text says 'major' applications). Investigations may need a site investigation, desk top study,
  detailed invasive investigation and remediation strategy and validation report.
review-status: unverified
field-status: {}
