reference: elevation-existing
local-authority: BRT
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - all:
    - application-type:
        in:
        - s73
        - ldc-existing-use
        - ldc-prospective-use
        - pa-build-agri-forest
    - discretionary
source-url: https://www.broxtowe.gov.uk/media/mqife2sv/01-national-statutory-requirements.pdf
source-text: 'elevations and sections when façades would be created or altered, or when ground levels
  would change. … Elevations at a scale of 1:50 or 1:100 should include: … Existing and proposed elevations
  (e.g. at a scale of 1:50 or 1:100)'
must-include:
- item: A scale of 1:50 or 1:100
  level: should
- item: All sides of the proposal, including blank or internal ones
  level: should
- item: Labels showing the compass direction each faces
  level: should
- item: Materials and finish of walls, doors and windows
  level: should
- item: Relationship with the adjoining building and openings
  level: should
confidence: medium
notes: From the council's National Statutory Requirements checklist (01, revised October 2026). National
  requirement on the householder, full, reserved matters and listed building consent checklists. Checklist
  01 says other drawings are needed 'when' the relevant parts are created or altered. The s73, lawful
  development certificate and agricultural building prior notification checklists list them as local requirements
  ('may include'), so those show as discretionary.
review-status: unverified
field-status: {}
