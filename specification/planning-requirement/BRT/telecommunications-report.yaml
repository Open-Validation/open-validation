reference: telecommunications-report
local-authority: BRT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: telecommunications-development
        value: true
        description: Mast and antenna development by mobile phone network operators.
  - all:
    - application-type:
        in:
        - pa-ecomms-network
    - discretionary
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
source-text: Planning applications for mast and antenna development by mobile phone network operators
  should be accompanied by a range of supplementary information including the area of search, details
  of any consultation undertaken, details of the proposed structure, and technical justification and information
  about the proposed development.
must-include:
- item: Area of search
  level: must
- item: Details of any consultation undertaken
  level: must
- item: Details of the proposed structure
  level: must
- item: Technical justification and information about the proposed development
  level: must
- item: Signed declaration that the equipment and installation fully comply with the ICNIRP public exposure
    guidelines
  level: must
- item: Alternative sites rejected (including existing masts, structures and buildings in the search area)
    with the reasons, or an explanation if none were considered
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: Map showing the site's relationship to schools and other telecommunications equipment nearby
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: Supplementary Information Template (Annex F of the Code of Best Practice on Mobile Phone Network
    Development)
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: 'Technical information: frequency, modulation characteristics, power output and antenna height'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: Visual impact assessment
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
confidence: medium
notes: From the council's list (revised October 2024), pages 10, 16. Not ticked in the table but set out
  on pages 10 and 16. The prior notification checklist (22, revised September 2015) lists its items as
  'may include', so it shows as discretionary there.
review-status: unverified
field-status: {}
