reference: section-proposed
local-authority: BRT
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - lbc
  - all:
    - application-type:
        in:
        - s73
        - pa-build-agri-forest
    - discretionary
source-url: https://www.broxtowe.gov.uk/media/mqife2sv/01-national-statutory-requirements.pdf
source-text: 'elevations and sections when façades would be created or altered, or when ground levels
  would change. Sections may be omitted for minor or householder development on relatively flat sites
  where levels are sufficiently evident from floor plans and elevations. … Sections at a scale of 1:50
  or 1:100 should include: … Existing and proposed site sections and finished floor and site levels (e.g.
  at a scale of 1:50 or 1:100)'
must-include:
- item: A scale of 1:50 or 1:100
  level: should
- item: Cross-sections through all proposed buildings
  level: should
- item: Labels relating to a section line shown on plans
  level: should
- item: Changes in ground levels with a fixed datum
  level: should
- item: Foundations, floor, windows and eaves levels
  level: should
- item: Relationship of internal levels to adjoining land, and to neighbouring land and buildings
  level: should
confidence: medium
notes: From the council's National Statutory Requirements checklist (01, revised October 2026). Sections
  may be omitted for minor or householder development on relatively flat sites where levels are evident
  from the floor plans and elevations. National requirement on the householder, full, reserved matters
  and listed building consent checklists. Checklist 01 says other drawings are needed 'when' the relevant
  parts are created or altered. The s73, lawful development certificate and agricultural building prior
  notification checklists list them as local requirements ('may include'), so those show as discretionary.
