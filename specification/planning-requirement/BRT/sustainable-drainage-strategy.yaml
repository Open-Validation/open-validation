reference: sustainable-drainage-strategy
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - s73
  - ref: major-development
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
source-text: Required for all major applications and should include a description of the type, quantities
  and means of disposal of any trade waste or effluent.
must-include:
- item: Type, quantities and means of disposal of any trade waste or effluent
  level: must
- item: Details of the existing drainage system on the drawings if connecting to it
  level: must
- item: Satisfactory percolation tests where soakaways are used
  level: must
- item: 'Where the existing system changes or a new one is created: scale plans of the new foul drainage
    (location plan, cross sections/elevations and specification)'
  level: must
- item: Drainage details that will achieve Building Regulations approval and show compliance with the
    SuDS hierarchy
  level: must
confidence: medium
notes: From the council's list (revised October 2024), pages 5, 14. The list calls it 'Drainage Strategy';
  ticked for Major. Retired MHCLG id used. The outline (all matters reserved) checklist names it 'Foul
  Sewerage Assessment'.
review-status: unverified
field-status: {}
