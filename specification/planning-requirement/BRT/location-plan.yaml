policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: This must be based on an up-to-date map at a scale of 1:1250 or 1:2500. Plans should show
  two named roads and surrounding buildings. The properties shown should be numbered or named so the location
  is clear. The application site should be edged in red. It should include all land necessary to carry
  out the proposed development – for example, land required for access from a public highway, visibility
  splays, landscaping, car parking, any drainage infrastructure and open areas around buildings. A blue
  line may be drawn around other land owned by the applicant, close to or adjoining the site. … A plan
  which clearly shows the location and length of the hedgerow(s) to be removed (if possible, please provide
  a plan to a scale of 1:2500.
must-include:
- item: Based on an up-to-date map at a scale of 1:1250 or 1:2500
  level: must
- item: Two named roads and surrounding buildings
  level: should
- item: Properties numbered or named so the location is clear
  level: should
- item: Application site edged in red, including all land needed to carry out the development (access,
    visibility splays, landscaping, car parking, drainage infrastructure, open areas around buildings)
  level: should
- item: Any other land owned by the applicant close to or adjoining the site edged in blue
  level: should
- item: 'Hedgerow removal: the location and length of the hedgerow(s) to be removed, preferably at 1:2500'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
confidence: medium
notes: 'From the council''s National Statutory Requirements checklist (01, revised October 2026). Each
