reference: photos
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - s73
      - lbc
      - advertising
      - ldc-existing-use
      - pa-build-agri-forest
      - pa-demo-building
      - approval-condition
  - any:
    - condition:
        field: demolition
        value: true
        description: The proposal involves the demolition of an existing building.
    - site:
        in:
        - conservation-area
        - listed-building
        description: Development affecting a conservation area or a listed building.
    - discretionary
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
source-text: Photographs should be provided if the proposal involves the demolition of an existing building
  or development affecting a conservation area or a listed building.
must-include:
- item: 'Listed buildings: the whole building and its setting and/or the section affected by the proposals'
  level: must
  required-if:
    application-type:
      in:
      - hh
      - lbc
  source-text: Photographs/photomontages showing the whole building and its setting and/or the particular
    section of the building affected by the proposals
confidence: medium
notes: From the council's list (revised October 2024), page 8. Not in the table; 'Photographs/photomontages'
  are listed ('may include') on most application-type checklists, so other cases show as discretionary.
  Photomontages help show how large developments fit the street scene.
review-status: unverified
field-status: {}
