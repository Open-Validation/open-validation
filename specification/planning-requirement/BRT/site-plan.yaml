reference: site-plan
local-authority: BRT
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - lbc
  - all:
    - application-type:
        in:
        - s73
        - ldc-existing-use
        - ldc-prospective-use
    - discretionary
source-url: https://www.broxtowe.gov.uk/media/mqife2sv/01-national-statutory-requirements.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A site, layout, or block plan is required in all cases … Site, layout or block plans at
  a recognised scale preferably one of 1:200 or 1:500 should include: … Block plan of the site (e.g. at
  a scale of 1:100 or 1:200) showing any site boundaries'
must-include:
- item: 'A recognised scale, preferably 1:200 or 1:500 (application-type checklists: e.g. 1:100 or 1:200)'
  level: should
- item: The direction of North, the scale and a scale bar
  level: should
- item: The proposed development and retained buildings
  level: should
- item: Written dimensions to the site boundaries
  level: should
- item: Neighbouring buildings, roads and footpaths
  level: should
- item: Access arrangements and public rights of way
  level: should
- item: All trees on, affecting or influenced by the site
  level: should
- item: The extent and type of any hard surfacing
  level: should
- item: Boundary treatments where these are proposed
  level: should
confidence: medium
notes: From the council's National Statutory Requirements checklist (01, revised October 2026). National
  requirement for householder, full, outline, reserved matters and listed building consent checklists.
  For s73 applications it is a local requirement ('may include'), and lawful development certificate checklists
  list a site survey plan ('may include'), so those show as discretionary.
review-status: unverified
field-status: {}
