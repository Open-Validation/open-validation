    - discretionary
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
source-text: For all major development and all proposals that have significant transport implications.
must-include:
- item: Coverage and detail reflecting the scale of the development and its transport implications
  level: must
- item: 'Major proposals: accessibility by all modes, likely modal split, and measures to improve access
