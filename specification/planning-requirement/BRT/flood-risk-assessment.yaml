reference: flood-risk-assessment
local-authority: BRT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - reserved-matters
      - s73
  - any:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zones 2 and 3 as designated by the Environment Agency.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Development proposals of 1 hectare or greater in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Development proposals of 1 hectare or greater in Flood Zone 1.
    - site:
        in:
        - critical-drainage-area
        description: Areas which have critical drainage problems.
    - site:
        in:
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: Development could be affected by sources of flooding other than rivers.
source-url: https://www.broxtowe.gov.uk/media/tshlsx4i/02-additional-information-on-broxtowe-borough-council-local-validation-requirements.pdf
source-text: Required for all proposals for new development located in Flood Zones 2 and 3 as designated
  by the Environment Agency. Also required for all planning applications for development proposals of
  1 hectare or greater in Flood Zone 1. Required for development proposals of less than 1 hectare in Flood
  Zone 1 where development could be affected by sources of flooding other than rivers or in areas which
  have critical drainage problems.
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development and how
    they will be managed, taking climate change into account
  level: must
- item: Opportunities to reduce the probability and consequences of flooding
  level: should
- item: Design of surface water management systems, including SuDS
  level: should
- item: Safe access to and from the development in areas at risk of flooding
  level: should
- item: 'Householder and other minor extensions in a flood zone: the council''s Householder Flood Risk
    Assessment Form'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: Flood Zones 2 and 3 as designated by the Environment Agency.
  source-text: Please complete and return with your application if your property falls within a flood
    zone
confidence: medium
notes: From the council's list (revised October 2024), pages 4-5, 13. Ticked for Major, Minor and Householder.
  The householder form comes from the 'Validation requirements' web page (https://www.broxtowe.gov.uk/for-you/planning/submit-a-planning-application/validation-requirements/).
review-status: unverified
field-status: {}
