source-text: Flood Risk Assessment A Flood Risk Assessment (FRA) will be required for planning applications
  for development proposals of 1 hectare or greater in Flood Zone 1, less than 1 hectare in Flood Zone
  1 where development could be affected by sources of 4 Broxtowe Borough Council Validation Checklist
  02 flooding other than rivers or in areas which have critical drainage problems and all proposals for
  new development located in Flood Zones 2 and 3 as designated by the Environment Agency.
