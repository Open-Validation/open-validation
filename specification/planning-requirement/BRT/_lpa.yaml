submission-standards:
- item: Critical dimensions and a recognised metric scale marked on all plans and drawings (heights to
    eaves, ridges and roof additions; width and length of new buildings and extensions; distances to site
    boundaries, the nearest neighbouring structure and the public highway where relevant); without them
    no further checks are made
  level: must
- item: Each plan and drawing has a unique number so it can be identified on the decision notice
  level: must
- item: Revisions identified sequentially (e.g. Rev. A, B, C or 1, 2, 3)
  level: should
- item: Drawings show the existing situation and the proposed development separately; demolitions may
    be indicated (e.g. cross-hatched) on existing drawings
  level: should
