reference: noise-assessment
local-authority: BRT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
        - reserved-matters
        - s73
    - ref: major-development
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: The proposal raises issues of disturbance.
      - condition:
          field: noise-sensitive-use
          value: true
          description: A noise sensitive development in a noise sensitive area (e.g. housing on major
            roads).
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline-some
        - outline-all
        - reserved-matters
        - s73
    - discretionary
source-url: https://www.broxtowe.gov.uk/media/rxrltydw/06-application-for-planning-permission.pdf
source-text: For proposals that raise issues of disturbance or are considered to be a noise sensitive
  development in what are considered noise sensitive areas. … Noise impact assessment – for major planning
  applications, but recommended for minor applications where there are obvious external noise sources
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (revised October 2024), pages 7, 14. Ticked for Major. The planning permission
  checklist (06) says it is 'recommended for minor applications where there are obvious external noise
  sources', and the householder checklist lists it as 'may include', so those show as discretionary.
review-status: unverified
field-status: {}
