reference: daylight-sunlight-assessment
local-authority: KHL
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development (one or more dwellings).
  - discretionary
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policies 14, 21, 22 and 23; SPD 7
source-text: New residential development and when daylight / sunlight issues are important and cannot
  be appraised via standard plans, to be advised on a case by case basis.
must-include:
- item: Daylight, sunlight and shadowing to adjoining properties and the proposed building at different
    times of the day/year
  level: must
- item: Overheating of south-facing single aspect rooms considered
  level: should
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 17. Shown
  as residential development plus the council's discretion ('case by case').
review-status: unverified
field-status: {}
