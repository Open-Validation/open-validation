reference: biodiversity-survey-report
local-authority: KHL
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
  - condition:
      field: potential-roost-features
      value: true
      description: Works to buildings likely to be used by bats.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policy 44; Conservation of Habitats and Species Regulations 2017
  (as amended); Wildlife and Countryside Act 1981 (as amended); Natural Environment and Rural Communities
  Act 2006; ODPM Circular 06/2005 paragraphs 98 and 99; NPPF paragraph 174
source-text: All new build development other than householder and minor extensions, and works to buildings
  likely to be used by bats.
must-include:
- item: Evaluation of the site's biodiversity value together with mitigation to replace it with a net
    gain
  level: should
- item: Undertaken by a suitably qualified ecologist
  level: should
- item: Surveys up to date (for some species, e.g. bats, only possible at certain times of year)
  level: must
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 10. The
  list's item is 'Biodiversity / ecological impact assessment'. Householder and minor extensions are excluded,
  so the new-build part is limited to full, outline and reserved matters applications. The list does not
  mention biodiversity net gain metrics.
review-status: unverified
field-status: {}
