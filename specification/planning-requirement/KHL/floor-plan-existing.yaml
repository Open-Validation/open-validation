reference: floor-plan-existing
local-authority: KHL
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: footprint-increase
      value: true
      description: An extension to a building.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policies 14, 21, 22 and 23
source-text: All applications for new buildings, extensions and changes of use.
must-include:
- item: Drawn to a scale of 1:50 or 1:100
  level: should
- item: Accurately plots the internal layout
  level: should
- item: Existing buildings or walls to be demolished clearly shown
  level: should
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 5.
review-status: unverified
field-status: {}
