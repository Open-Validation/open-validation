reference: heritage-statement
local-authority: KHL
required-if:
  any:
  - site:
      in:
      - listed-building
      - locally-listed-building
      - conservation-area
      - park-and-garden
      - scheduled-monument
      description: Likely to affect a designated heritage asset (a listed building, including buildings
        on the Local Heritage List, a conservation area, a registered historic park/garden or a scheduled
        monument).
  - site:
      in:
      - listed-building-setting
      description: Might impact upon the setting of one of these assets.
  - discretionary
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policies 14 and 15; NPPF
source-text: Applications which are likely to affect a designated heritage asset (e.g. a Listed Building
  (inc. buildings on the Local Heritage List), a Conservation Area, a Registered Historic Park/Garden
  or a Scheduled Monument) or which might impact upon the setting of one of these assets. On occasions,
  it may also be required in respect to a nondesignated heritage asset as advised by the Planning Service.
  The Heritage Statement may be combined with the DAS where appropriate.
must-include:
- item: A description of the elements that contribute to the significance of any heritage assets likely
    to be affected (as a minimum the relevant HER record accessed)
  level: must
- item: An assessment of the contribution the setting makes to that significance
  level: must
- item: An assessment of the likely impact of the proposals on those elements
  level: must
- item: Photographs to illustrate the case
  level: must
- item: 'For listed building consent: a written statement with a schedule of works, an analysis of the
    significance of archaeology, history and character of the building/structure, the principles of and
    justification for the works and their impact on its special character, its setting and the setting
    of adjacent listed buildings'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'Within or adjacent to a conservation area: reference to the relevant Character Appraisal'
  level: should
  required-if:
    site:
      in:
      - conservation-area
      description: Within or adjacent to a conservation area.
- item: 'For demolition of a heritage asset: a written statement with a structural survey, an analysis
    of the character and appearance of the building/structure, and justification for the demolition and
    its impact on the special character of the area'
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Demolition of a heritage asset.
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 11-12. Non-designated
  heritage assets are shown as the council's discretion ('as advised by the Planning Service').
review-status: unverified
field-status: {}
