reference: viability-assessment
local-authority: KHL
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development (one or more dwellings).
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Arguments for a reduced level of provision are proposed.
  - discretionary
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policy 21 (provision of adaptable dwellings) and affordable housing
  requirements
source-text: New residential development where arguments for a reduced level of provision are proposed.
  Also where harm to heritage assets is predicted and justification on viability grounds is sought.
must-include:
- item: Carried out by a suitably qualified person
  level: should
- item: Scope and methodology agreed with the Council before the application is submitted
  level: should
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 8. Viability
  justification for predicted harm to heritage assets is shown as the council's discretion (no map field
  for it). The council may seek costs for independent verification.
review-status: unverified
field-status: {}
