reference: arboriculturist-report
local-authority: KHL
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within the site, or on land adjacent to it, that could influence or be affected
        by the development (including street trees).
  - application-type:
      in:
      - consent-under-tpo
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policy 45; Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: Where there are trees within the application site, or on land adjacent to it that could influence
  or be affected by the development (including street trees). information will be required on which trees/
  are to be removed and those to be retained and the means of protecting them during construction. It
  also applies to applications to fell or lop protected trees
must-include:
- item: Which trees are to be removed and which retained
  level: must
- item: The means of protecting retained trees during construction
  level: must
- item: An assessment of the trees' health
  level: must
- item: Prepared by a suitably qualified arboriculturist
  level: should
- item: Branches or parts of trees to be removed highlighted, where possible
  level: should
  required-if:
    application-type:
      in:
      - consent-under-tpo
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 10. The
  list's item is 'Tree survey / arboricultural implications assessment'.
review-status: unverified
field-status: {}
