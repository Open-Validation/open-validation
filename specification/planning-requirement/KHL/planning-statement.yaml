reference: planning-statement
local-authority: KHL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
  - condition:
      field: departure-from-development-plan
      value: true
      description: An exception to planning policy requires explanation.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Normally only required on complex full or outline applications, or if an exception to planning
  policy requires explanation.
must-include:
- item: Concentrates on the policies and matters critical to assessment of the application and explains
    how policy compliance is achieved
  level: should
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 7. 'Complex'
  full or outline applications are shown as the council's discretion.
review-status: unverified
field-status: {}
