reference: noise-assessment
local-authority: KHL
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Proposals likely to cause noise disturbance to occupiers of nearby buildings.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive developments close to existing noise sources (e.g. residential next
        to industry or bars).
  - discretionary
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policy 49
source-text: Proposals likely to cause noise disturbance to occupiers of nearby buildings. Developments
  close to main roads or rail lines. Noise sensitive developments close to existing noise sources (eg.
  residential next to industry or bars)
must-include:
- item: Prepared by an independent acoustician in accordance with industry standards
  level: should
- item: Mitigation proposals where required
  level: should
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 16. 'Close
  to main roads or rail lines' gives no distance, so it is shown as the council's discretion.
review-status: unverified
field-status: {}
