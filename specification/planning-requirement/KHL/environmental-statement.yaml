    field: eia-development
    value: true
    description: EIA development (Schedule 1, or Schedule 2 where a screening opinion has identified a
      need for EIA).
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Town and Country
  Planning (Environmental Impact Assessment) Regulations 2017
source-text: A scoping opinion is required for EIA needed under Schedule 1 of the Regs or where a screening
  opinion has identified a need for an EIA for Schedule 2 development. This should be in the form identified
  in Article 15 of the Regs. The Environmental Impact Assessment or Statement will include detailed assessment
  of the matters identified in the scoping opinion.
must-include:
- item: Detailed assessment of the matters identified in the scoping opinion
  level: must
