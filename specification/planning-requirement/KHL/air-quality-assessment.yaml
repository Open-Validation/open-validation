reference: air-quality-assessment
local-authority: KHL
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development (one or more dwellings).
    - site:
        in:
        - air-quality-management-area
        description: Within the Air Quality Management Area (local plan map 13.1).
  - site:
      in:
      - special-area-of-conservation
      description: Within 200m of the Humber Estuary Special Area of Conservation (SAC).
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policy 47
source-text: Residential development within the Air Quality Monitoring Area (AQMA) – see local plan map
  13.1. Development within 200m of the Humber Estuary Special Area of Conservation (SAC).
must-include:
- item: Scope agreed before the application is submitted
  level: should
- item: The site, the proposal and the area in which impacts will be assessed
  level: must
- item: Existing air quality
  level: must
- item: Impact on air quality, individually and cumulatively with current permissions and development
    under construction
  level: must
- item: Mitigation measures
  level: must
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 16.
review-status: unverified
field-status: {}
