reference: air-quality-assessment
local-authority: KHL
required-if:
  any:
  - all:
    - site:
        in:
        - air-quality-management-area
        description: The site is in the Air Quality Management Area (Local Plan map 13.1).
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
  - site:
      in:
      - special-area-of-conservation
      description: The development is within 200m of the Humber Estuary SAC.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
confidence: medium
notes: 'From the audit (missing_requirement): residential in the AQMA (Local Plan map 13.1), or development
  within 200m of the Humber Estuary SAC.'
