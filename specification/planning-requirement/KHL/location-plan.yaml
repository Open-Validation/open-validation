reference: location-plan
local-authority: KHL
required-if:
  always: true
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Plan at 1:1250 scale to identify the location of the site. The site should be edged in red
  and any other adjoining land in the applicants ownership or control edged in blue. Access roads should
  be included other than the public highway. The plan should include a north point.
must-include:
- item: Drawn at 1:1250 scale
  level: must
- item: Site edged in red
  level: should
- item: Any other adjoining land in the applicant's ownership or control edged in blue
  level: should
- item: Access roads included (other than the public highway)
  level: should
- item: North point
  level: should
confidence: medium
notes: From the council's list (published December 2024), National Validation Requirements, page 1.
review-status: unverified
field-status: {}
