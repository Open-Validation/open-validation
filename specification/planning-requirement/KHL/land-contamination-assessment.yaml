reference: land-contamination-assessment
local-authority: KHL
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected (e.g. industrial sites).
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use would be particularly vulnerable (e.g. housing, schools, nurseries
        or allotments).
  - discretionary
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policy 48
source-text: Where contamination is known or suspected (e.g. industrial sites etc.) and/or the proposed
  use would be particularly vulnerable (e.g. housing, schools, nurseries or allotments) or there are sensitive
  receptors, such as watercourses or aquifers, which might be affected.
must-include:
- item: The likelihood of land contamination being present, its nature and the potential risk to the proposed
    development
  level: must
- item: What further measures are required to make the site suitable for the proposed use
  level: must
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 15. Sensitive
  receptors such as watercourses or aquifers are shown as the council's discretion.
review-status: unverified
field-status: {}
