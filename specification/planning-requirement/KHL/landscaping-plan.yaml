reference: landscaping-plan
local-authority: KHL
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - condition:
      field: landscaping-works
      value: true
      description: Applications providing new planting or landscape proposals.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policies 14, 21 and 23
source-text: Most major applications … Applications providing new planting or landscape proposals
must-include:
- item: Extent of existing and proposed planting areas, and the type of planting within them
  level: must
- item: Locations of new trees
  level: must
- item: Areas and type of hard surfacing
  level: must
- item: Location and nature of boundary treatments
  level: must
- item: Earthworks / ground level changes
  level: must
- item: Management and maintenance plans
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 11. Covers
  the list's 'Landscape strategy plan / assessment' (most major applications, shown as major plus the
  council's discretion) and 'Landscape plans' (new planting or landscape proposals). The landscape statement
  may form part of the Design and Access Statement.
review-status: unverified
field-status: {}
