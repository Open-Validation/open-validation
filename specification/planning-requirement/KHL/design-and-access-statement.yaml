reference: design-and-access-statement
local-authority: KHL
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Any part of the development is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 square metres or more of floor space.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Required for:‐ (i) major development; (ii)where any part of the development is in a conservation
  area, development consisting of— ‐ the provision of one or more dwellinghouses; or ‐the provision of
  a building or buildings where the floor space created by the development is 100 square metres or more.
must-include:
- item: Explains the design rationale, including how it fits into the immediate site context
  level: should
- item: Photographs/drawings to explain the rationale
  level: should
- item: Explains how the development can be accessed by all users
  level: should
confidence: medium
notes: From the council's list (published December 2024), National Validation Requirements, page 2.
review-status: unverified
field-status: {}
