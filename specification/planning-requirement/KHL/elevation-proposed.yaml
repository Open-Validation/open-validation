reference: elevation-proposed
local-authority: KHL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: new-build
        value: true
        description: New buildings.
  - condition:
      field: external-alterations
      value: true
      description: Changes to elevations are proposed (e.g. insertion of new windows).
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policies 14, 21, 22 and 23
source-text: All full applications for new buildings or where changes to elevations are proposed (eg.
  insertion of new windows)
must-include:
- item: Drawn to a scale of 1:50 or 1:100
  level: should
- item: The proposed works in relation to what is already there, including any adjoining properties
  level: should
- item: All side views of the proposal, including building materials and the style, materials and finish
    of windows and doors
  level: should
- item: Blank elevations included
  level: must
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 5.
review-status: unverified
field-status: {}
