reference: town-centre-impact-assessment
local-authority: KHL
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: A main town centre use (retail, leisure or office) outside a centre.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
source-text: Sequential test and impact assessment (Retail / leisure / office uses) See the NPPG, and
  NPPF for further guidance on both the Sequential Test and Impact Assessments.
must-include:
- item: Sequential test
  level: must
- item: Impact assessment
  level: must
  required-if:
    any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 900
        description: More than 900 square metres of retail floorspace.
    - discretionary
confidence: medium
notes: 'Audit (wrong_trigger): the workbook labelled this a flood sequential test. From the audit: an
  impact assessment above 900 sqm retail, 1,000 sqm offices and 2,500 sqm leisure (the office and leisure
  thresholds are shown as officer discretion).'
review-status: unverified
field-status: {}
