reference: town-centre-impact-assessment
local-authority: KHL
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Town centre uses (notably retail, leisure and offices) located outside the city centre
      or a designated centre.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policy 9; NPPF
source-text: Town centre uses, (notably retail, leisure and offices) located outside of the city centre
  or a designated centre usually require a Sequential Test. An Impact Assessment is additionally required
  for such proposals exceeding:‐ Retail ‐ 900sqm Offices ‐ 1,000sqm Leisure ‐ 2,500sqm
must-include:
- item: Sequential Test
  level: must
- item: Impact Assessment
  level: must
  required-if:
    any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 900
        description: Retail over 900 sq m.
    - condition:
        field: office-floorspace
        operator: '>'
        value: 1000
        description: Offices over 1,000 sq m.
    - all:
      - condition:
          field: use-class
          value: leisure
          description: Leisure use.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 2500
          description: Over 2,500 sq m.
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 9. The list's
  item is 'Sequential test and impact assessment (Retail / leisure / office uses)'.
review-status: unverified
field-status: {}
