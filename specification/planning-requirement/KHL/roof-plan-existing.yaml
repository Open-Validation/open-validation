reference: roof-plan-existing
local-authority: KHL
required-if:
  all:
  - any:
    - condition:
        field: new-build
        value: true
        description: New buildings.
    - condition:
        field: footprint-increase
        value: true
        description: An extension to a building.
  - condition:
      field: flat-roof
      value: false
      description: Not required for flat roofs.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policies 14, 21, 22 and 23
source-text: New buildings and extensions (not required for flat roofs)
must-include:
- item: Drawn at a scale of 1:100 or 1:200 showing roof planes and ridges
  level: must
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 6.
review-status: unverified
field-status: {}
