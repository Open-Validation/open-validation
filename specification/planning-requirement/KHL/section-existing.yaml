reference: section-existing
local-authority: KHL
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: Changes in site levels are proposed, or there are existing variations in land level relative
      to adjacent land.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policies 14, 21, 22 and 23
source-text: Applications proposing changes in site levels, or where there are existing variations in
  land level relative to adjacent land.
must-include:
- item: Drawn at a scale of 1:100 or 1:200
  level: should
- item: Cross section(s) through proposed buildings/site
  level: should
- item: Existing and finished levels (related to a fixed datum point) of the land and buildings, including
    neighbouring land/buildings
  level: should
  required-if:
    condition:
      field: site-level-change
      operator: '>='
      value: 1
      description: A change in ground levels is proposed.
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 5. The list's
  item is 'Existing and proposed site sections, finished floor and site levels'.
review-status: unverified
field-status: {}
