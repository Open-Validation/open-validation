reference: site-plan
local-authority: KHL
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New buildings.
  - condition:
      field: site-layout-change
      value: true
      description: Site layout changes.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policies 14, 21, 22 and 23
source-text: All applications involving new buildings and /or site layout changes. If none, an existing
  layout plan should be sufficient.
must-include:
- item: Drawn at 1:100 or 1:200 scale
  level: must
- item: The direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions
  level: must
- item: New buildings shown in the context of adjacent buildings
  level: should
- item: Specific details of the site and proposal, e.g. parking layout, buildings to be demolished/retained,
    existing trees/hedges, surface materials
  level: must
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 4. The list
  asks for existing and proposed site/block plans; where there are no new buildings or layout changes
  an existing layout plan should be sufficient.
review-status: unverified
field-status: {}
