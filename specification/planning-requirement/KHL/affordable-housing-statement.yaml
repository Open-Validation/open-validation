reference: affordable-housing-statement
local-authority: KHL
required-if:
  any:
  - all:
    - any:
      - condition:
          field: housing-market-area
          value: zone-1
          description: In Housing Market Zone 1.
      - condition:
          field: housing-market-area
          value: zone-2
          description: In Housing Market Zone 2.
      - condition:
          field: housing-market-area
          value: zone-3
          description: In Housing Market Zone 3.
      - condition:
          field: housing-market-area
          value: zone-4
          description: In Housing Market Zone 4.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 15
        description: 15 or more dwellings.
  - all:
    - condition:
        field: housing-market-area
        value: zone-5
        description: In Housing Market Zone 5.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: 11 or more dwellings.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Hull Local Plan 2016 to 2032 policy 21; Affordable Housing SPD 15
source-text: 'New residential development as follows: In Housing Market Zone 1,2,3 and 4 (15 or more dwellings);
  In Housing Market Zone 5 (11 or more dwellings).'
confidence: medium
notes: From the council's list (published December 2024), Local Validation Requirements, page 8. The list
  refers to SPD 15 Appendix 1 for what the statement must contain.
review-status: unverified
field-status: {}
