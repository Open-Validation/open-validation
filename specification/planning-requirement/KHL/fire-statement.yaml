reference: fire-statement
local-authority: KHL
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.hull.gov.uk/downloads/file/3598/validation-checklist
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Required for new buildings, conversion inc. prior approval applications, or outline applications,
  for two or more dwellings or educational accommodation and meet the height condition: 18m or more in
  height, or 7 or more storeys'
confidence: medium
notes: From the council's list (published December 2024), National Validation Requirements, page 3. Follows
  the national rule; the council's text also covers conversions and prior approvals.
review-status: unverified
field-status: {}
