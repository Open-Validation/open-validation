reference: town-centre-impact-assessment
local-authority: ADU
required-if:
  any:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses outside a town centre and not in accordance with an up-to-date
        Local Plan.
  - all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail development outside the Primary Shopping Area.
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 1000
        description: Net sales floorspace of 1,000 sq m or more.
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
policy: NPPF
source-text: Where an application is submitted for main town centre uses outside of a town centre and
  not in accordance with an up-to-date Local Plan, it should be accompanied by a sequential test. ...
  In Adur, an impact assessment will be required for any proposed retail development outside of the Primary
  Shopping Area with a net sales floorspace of 1,000sqm or more.
must-include:
- item: Sequential test
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Main town centre uses outside a town centre and not in accordance with an up-to-date
        Local Plan.
- item: Impact assessment
  level: must
  required-if:
    all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail development outside the Primary Shopping Area.
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 1000
        description: Net sales floorspace of 1,000 sq m or more.
confidence: medium
notes: From the council's list (last updated June 2020), section 25 (Town Centre Uses - Sequential Test
  and Impact Assessment), page 8. The 2,500 sq m impact threshold in the same section applies to Worthing
  only.
review-status: unverified
field-status: {}
