reference: flood-risk-assessment
local-authority: ADU
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development proposals of 1ha or greater (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development proposals of 1ha or greater (Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zones 2 and 3, including householder development.
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
policy: NPPF; Environment Agency flood risk standing advice
source-text: Planning applications for development proposals of 1ha or greater in Flood Zone 1 and all
  proposals for new development located in Flood Zones 2 and 3 should be accompanied with a Flood Risk
  Assessment (FRA); ... This includes requirements for householder developments in Flood Zones 2 and 3,
  and water-compatible, less vulnerable or more vulnerable development up to 1ha in Flood Zone 2.
must-include:
- item: 'Householder sites: the council''s Householder Flood Risk Assessment form'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: If a householder site is within or partly within an Environment Agency flood zone, it must
    be accompanied by a Householder Flood Risk Assessment form available on the Councils’ website or by
    post on request.
confidence: medium
notes: From the council's list (last updated June 2020), section 8 (Flood Risk Assessment and Exceptions
  and Sequential Tests), page 4. Also Appendix 1, Supporting Information, page 2. The section heading
  also names the exception and sequential tests but the list gives no further detail. The Lead Local Flood
  Authority reviews major applications for local flood risk.
