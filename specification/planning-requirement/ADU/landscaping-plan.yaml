reference: landscaping-plan
local-authority: ADU
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: Five or more dwellings.
    - all:
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 1000
          description: Business, commercial and leisure development of more than 1,000 sq m gross.
      - condition:
          field: new-build
          value: true
          description: Excluding conversions of existing buildings.
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
source-text: All full planning applications for five or more dwellings or business, commercial and leisure
  developments of more than 1,000sqm gross (excluding conversions of existing buildings) must be accompanied
  by full landscaping details in the form of drawing/s and schedule/s.
must-include:
- item: Full landscaping details in the form of drawing(s) and schedule(s)
  level: must
confidence: medium
notes: From the council's list (last updated June 2020), section 13 (Landscaping Details), page 6.
review-status: unverified
field-status: {}
