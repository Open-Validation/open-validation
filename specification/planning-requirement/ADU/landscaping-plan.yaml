reference: landscaping-plan
local-authority: ADU
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: The proposal is for five or more dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: Business, commercial or leisure development of more than 1,000sqm gross (excluding
          conversions of existing buildings).
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
source-text: Landscaping Details All full planning applications for five or more dwellings or business,
  commercial and leisure developments of more than 1,000sqm gross (excluding conversions of existing buildings)
  must be accompanied by full landscaping details in the form of drawing/s and schedule/s.
must-include:
- item: Full landscaping details in the form of drawings and schedules
  level: must
confidence: medium
review-status: unverified
field-status: {}
