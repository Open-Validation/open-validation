reference: land-contamination-assessment
local-authority: ADU
required-if:
  all:
  - site:
      in:
      - contaminated-land
      description: Land that may be affected by contamination.
  - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
source-text: 'Applications for development on land that may be affected by contamination should, where
  appropriate, be accompanied by a preliminary risk assessment which has identified: all previous uses
  of the site and surrounding sites potential contaminants associated with those uses a conceptual model
  of the site indicating sources, pathways and receptors potential risks arising from contamination at
  the site'
must-include:
- item: Preliminary risk assessment
  level: should
- item: All previous uses of the site and surrounding sites
  level: should
- item: Potential contaminants associated with those uses
  level: should
- item: A conceptual model of the site indicating sources, pathways and receptors
  level: should
- item: Potential risks arising from contamination at the site
  level: should
confidence: medium
notes: From the council's list (last updated June 2020), section 12 (Land Contamination Assessment), page
  6. 'Where appropriate' is shown as 'check', and the list says 'should', so the contents are 'should'.
review-status: unverified
field-status: {}
