reference: arboriculturist-report
local-authority: ADU
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within the site or on adjacent land could be affected by the development.
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Development within the root protection zone (BS 5837:2012) of a tree.
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: The tree is subject to a Tree Preservation Order or is within a designated Conservation
          Area.
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
policy: BS 5837:2012
source-text: Required in all cases where trees within the application site or on land adjacent to it could
  be affected by the development. In addition, an arboricultural statement produced by a qualified arboriculturalist
  will be required to support any planning application which proposes any development within the root
  protection zone (as defined by BS 5837:2012) of a tree subject to a Tree Preservation Order or within
  a designated Conservation Area.
must-include:
- item: Tree survey
  level: must
- item: Arboricultural statement produced by a qualified arboriculturalist
  level: must
  required-if:
    all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Development within the root protection zone (BS 5837:2012) of a tree.
    - site:
        in:
        - tree-preservation-zone
        - conservation-area
        description: The tree is subject to a Tree Preservation Order or is within a designated Conservation
          Area.
- item: Plan accurately plotting all relevant trees and a schedule of their species
  level: should
confidence: medium
notes: From the council's list (last updated June 2020), section 27 (Tree Survey), page 9. During processing
  the council may also ask for an arboricultural statement on unprotected trees with amenity or ecological
  value. Full guidance on the survey, protection plan and method statement is in BS 5837:2012.
