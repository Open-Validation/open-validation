reference: site-plan
local-authority: ADU
required-if:
  always: true
source-url: https://www.adur-worthing.gov.uk/media/Media,136954,smxx.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A proposed block plan to an accurate scale of 1:200 or 1:500 must be submitted clearly showing
  the position of the proposal/s to scale and annotated in writing if necessary.
must-include:
- item: Accurate scale of 1:200 or 1:500, with a north point
  level: must
- item: Position of the proposal(s) to scale, annotated in writing if necessary
  level: must
- item: Existing and proposed parking layouts to scale, where the application has parking issues
  level: must
  required-if: discretionary
- item: Existing and proposed block plans at 1:200 showing parking provision
  level: should
  required-if:
    application-type:
      in:
      - full
  source-text: All full planning applications should be accompanied by existing and proposed block plans
    to a scale of 1:200 showing parking provision.
- item: Distance between the new dwelling(s) and all boundaries, annotated in writing
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New dwelling(s), in outline or full applications.
  source-text: All applications, including those for new dwelling/s, whether in outline form or full planning
    permission, must as a minimum include a drawing showing the distance between the new dwelling/s and
    all boundaries annotated in writing for the avoidance of doubt.
confidence: medium
notes: From the council's list (Appendix 1, last updated September 2019), Drawings, page 1. Also from
  the main list, section 16 (Parking Provision), page 7. Parking provision should normally follow West
  Sussex County Council's parking standards; an on-street parking capacity survey may be required where
  on-site provision is below them. 'Parking issues' is shown as 'check'. An accurate existing site survey
  is preferred, and required for major and larger applications (unmapped).
review-status: unverified
field-status: {}
