reference: transport-assessment
local-authority: ADU
required-if: discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
policy: West Sussex County Council Transport Assessment Methodology
source-text: 'A Transport Statement (accompanied by a Travel Plan Statement) or a Transport Assessment
  (accompanied by a Full Travel Plan) will be required where the size of development exceeds the thresholds
  defined for each type of development in the West Sussex County Council (WSCC) Transport Assessment Methodology,
  and must comply fully with this guidance:'
must-include:
- item: Complies fully with the WSCC Transport Assessment Methodology
  level: must
- item: Considers the availability of public transport over a 24 hour period
  level: should
confidence: medium
notes: From the council's list (last updated June 2020), section 26 (Transport Issues), page 8. Shown
  as 'check' because the thresholds are in the WSCC methodology, not in the list. A Stage 1 Road Safety
  Audit is required for some major applications (unmapped).
