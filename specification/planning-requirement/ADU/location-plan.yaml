reference: location-plan
local-authority: ADU
required-if:
  always: true
source-url: https://www.adur-worthing.gov.uk/media/Media,136954,smxx.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: An A4 up-to-date Ordnance Survey (OS) extract plan showing the existing site (and not the
  proposed development) with sufficient area to include more than one road name to an accurate scale of
  1:1250 must be provided for all applications.
must-include:
- item: A4 up-to-date Ordnance Survey extract showing the existing site (not the proposed development)
  level: must
- item: Enough area to include more than one road name
  level: must
- item: Accurate scale of 1:1250, with a scale bar
  level: must
- item: Application site boundary outlined in red; adjoining land in the applicant's control outlined
    in blue
  level: must
- item: The user's OS Licence Agreement number
  level: must
- item: North point
  level: must
confidence: medium
notes: From the council's list (Appendix 1, last updated September 2019), Drawings, page 1.
review-status: unverified
field-status: {}
