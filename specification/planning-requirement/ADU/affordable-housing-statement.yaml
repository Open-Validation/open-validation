required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: 10 or more dwellings.
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
policy: Adur Local Plan 2017; NPPF; Adur Interim Affordable Housing Position Statement
source-text: The Adur Local Plan 2017 states that in Adur, on sites of 11 (gross) or more dwellings, 30%
  affordable housing will be sought (preferably on-site). ... Following a review of the Council’s position,
  from 8th April 2020, Adur District Council will use the NPPF threshold of 10 dwellings for seeking affordable
  housing contributions.
confidence: medium
