reference: biodiversity-survey-report
local-authority: ADU
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Development which may have an impact on any protected species of flora or fauna.
  - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
source-text: A survey and report are required for any proposed development which may have an impact on
  any protected species of flora or fauna or have an adverse impact on biodiversity or geological features.
  This could include development which involves the removal of vegetation (e.g. trees, shrubs, hedgerows),
  alteration to water courses, the demolition of older buildings or any works within the roofs of buildings.
confidence: medium
notes: From the council's list (last updated June 2020), section 3 (Biodiversity Survey and Report), page
  3. The onus is on the developer to decide whether there is a significant impact, so the examples (removal
  of vegetation, watercourses, demolition of older buildings, works in roofs) and impacts on biodiversity
  or geological features are shown as 'check'. ALGE guidance gives indicative thresholds.
