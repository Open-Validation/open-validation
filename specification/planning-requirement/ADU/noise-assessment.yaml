reference: noise-assessment
local-authority: ADU
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: Raises issues of disturbance by noise to occupants of nearby existing buildings.
    - discretionary
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development close to existing sources of noise (e.g. railway, major
        roads, industrial sites).
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
policy: 'Planning Noise Advice Document: Sussex'
source-text: Applications for developments that raise issues of disturbance by noise to the occupants
  of nearby existing buildings, and for developments that are considered to be noise sensitive and which
  are close to existing sources of noise (e.g. railway, major roads, industrial sites), should be supported
  by a Noise Impact Assessment prepared by a suitably qualified acoustician.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (last updated June 2020), section 15 (Noise Impact Assessment), page 6.
  Whether a proposal raises noise issues is shown as 'check'.
review-status: unverified
field-status: {}
