submission-standards:
- item: Only recognised metric scales and dimensions
  level: must
- item: All drawings include a scale bar and annotated metric dimensions so their accuracy can be checked
  level: should
- item: Drawings marked 'Do Not Scale' are not accepted (an email confirming they can be scaled for planning
    purposes is adequate)
  level: must
- item: All elevations annotated with their orientation (north, south, east, west)
  level: must
- item: Drawings in bold, not greyscale
  level: must
- item: All drawings clearly numbered; amendments carry revision letters or numbers
  level: should
- item: Householder drawings preferably no larger than A3
  level: should
- item: Supporting information with signatures supplied as a copy without personal information, or with
    electronic signatures
  level: should
- item: 'Major applications: at least two hard copies of each document sent promptly after an online submission'
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is still Adur''s operative list (joint Adur & Worthing list, last updated June
    2020), and the date is correct. A draft Adur-only list went to consultation in July 2026. The extraction
    is poor: about 9 local requirements are missing (Air Quality, Affordable Housing, Foul Sewerage, Contamination,
    Noise, Refuse, Shoreham Harbour, Town Centre Uses, Road Safety Audit), Daylight/Sunlight is wrongly
    listed as a requirement, most triggers are fragments, and nearly everything is guessed into Full planning.
    Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
notes: 'Adur still uses the joint 2020 Adur & Worthing list; council page says ''A new validation document
