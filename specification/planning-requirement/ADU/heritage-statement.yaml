reference: heritage-statement
local-authority: ADU
required-if:
  any:
  - site:
      in:
      - listed-building
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - locally-listed-building
      description: The site is or contains a heritage asset.
  - all:
    - site:
        in:
        - listed-building-setting
        description: In the setting of a heritage asset.
    - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
policy: NPPF paragraph 189 (as quoted in the list)
source-text: ‘In determining applications, local planning authorities should require an applicant to describe
  the significance of any heritage assets affected, including any contribution made by their setting.
  The level of detail should be proportionate to the assets’ importance and no more than is sufficient
  to understand the potential impact of the proposal on their significance. As a minimum the relevant
  historic environment record [HER] should have been consulted and the heritage assets assessed using
  appropriate expertise where necessary.
must-include:
- item: The significance of any heritage assets affected, including any contribution made by their setting
  level: must
- item: The relevant historic environment record consulted, as a minimum
  level: must
confidence: medium
notes: From the council's list (last updated June 2020), section 10 (Heritage Statement), page 5. The
  list quotes the NPPF rather than giving its own triggers; whether a heritage asset's setting is affected
  is shown as 'check'. Applicants are advised to discuss proposals in heritage sensitive areas with a
  duty planning officer or the conservation officer first.
review-status: unverified
field-status: {}
