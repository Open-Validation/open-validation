reference: archaeological-assessment
local-authority: ADU
required-if:
  all:
  - site:
      in:
      - archaeological-priority-area
      - historic-environment-record
      description: Any indication of archaeology on the site (for example a West Sussex Archaeological
        Notification Area).
  - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
policy: NPPF paragraph 189 (as quoted in the list)
source-text: Developers must provide a report using the HER if there is any indication of archaeology
  on an application site.
must-include:
- item: A report using the Historic Environment Record (HER)
  level: must
- item: An appropriate desk-based assessment and, where necessary, a field evaluation, where the site
    includes or may include heritage assets with archaeological interest
  level: must
  required-if: discretionary
  source-text: Where a site on which development is proposed includes, or has the potential to include,
    heritage assets with archaeological interest, local planning authorities should require developers
    to submit an appropriate desk-based assessment and, where necessary, a field evaluation’.
confidence: medium
notes: From the council's list (last updated June 2020), sections 10 (Heritage Statement) and 11 (Historic
  Environment Record), page 5. Shown with 'check' because the thresholds for an HER search are in separate
  guidance linked to the Archaeological Notification Areas, not in the list.
review-status: unverified
field-status: {}
