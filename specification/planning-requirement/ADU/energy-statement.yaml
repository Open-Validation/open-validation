reference: energy-statement
local-authority: ADU
required-if:
  ref: major-development
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
policy: Adur Local Plan 2017 policy 19; Adur Sustainable Energy SPD (August 2019); Shoreham Harbour Joint
  Area Action Plan
source-text: Policy 19 of the Adur Local Plan requires all new major development within Adur to incorporate
  renewable/low carbon energy production equipment to provide at least 10% of predicted energy requirements.
  A statement should be submitted which demonstrates the proposal’s contribution to reducing carbon dioxide
  emissions through an energy efficient design of the site, buildings and services; the use of decentralised
  energy, heating and cooling and on-site renewable technologies.
must-include:
- item: Renewable/low carbon energy production equipment providing at least 10% of predicted energy requirements
  level: must
- item: The proposal's contribution to reducing carbon dioxide emissions through energy efficient design
    of the site, buildings and services
  level: must
- item: Use of decentralised energy, heating and cooling, and on-site renewable technologies
  level: must
confidence: medium
notes: From the council's list (last updated June 2020), section 7 (Energy/Sustainability Statement),
  page 4.
