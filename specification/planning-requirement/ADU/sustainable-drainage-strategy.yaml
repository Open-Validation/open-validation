reference: sustainable-drainage-strategy
local-authority: ADU
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>'
      value: 2
      description: Development over two dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: Development over 1,000 sq m of commercial floor space.
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: Areas at risk of fluvial or pluvial flooding.
  - all:
    - condition:
        field: hard-surfacing
        value: true
        description: An increase in impermeable area.
    - discretionary
source-url: https://www.adur-worthing.gov.uk/media/Media,99591,smxx.pdf
policy: West Sussex LLFA policy for the management of surface water (November 2018); NPPF
source-text: 'A surface water drainage strategy will be required for: all development over two dwellings
  or 1,000sqm of commercial floor space all applications within areas at risk of fluvial or pluvial flooding
  all applications for an increase in impermeable area within areas not served by public surface water
  sewers'
must-include:
- item: Site-specific drainage strategy showing compliance with West Sussex County Council's sustainable
    drainage policies
  level: must
- item: In accordance with the council's Surface Water Drainage Supplementary Guidance Notes and Surface
    Water Drainage Checklist
  level: should
- item: Maintenance manual
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>'
      value: 5
      description: Developments over five properties.
- item: Drainage system informed by winter ground water monitoring and winter infiltration testing
  level: must
confidence: medium
notes: From the council's list (last updated June 2020), section 23 (Sustainable Drainage Systems), page
  7-8. 'Areas not served by public surface water sewers' is shown as 'check' (no field for it yet). Major
  developments should incorporate SuDS unless clearly inappropriate.
review-status: unverified
field-status: {}
