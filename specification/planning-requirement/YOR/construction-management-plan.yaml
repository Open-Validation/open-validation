reference: construction-management-plan
local-authority: YOR
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policies ENV1, ENV2 and T1
source-text: All major applications and others likely to have a detrimental impact on air quality during
  the ... demolition and or construction phase or would introduce additional dust and or plant and machinery
  emissions to an area of existing poor air quality; • All major applications and others likely to have
  a detrimental noise impact during demolition and or construction; • All major applications and others
  likely to have a significant impact on traffic congestion or pedestrian safety;
must-include:
- item: A plan (to scale) identifying site access points and where safe and legal loading can take place
  level: must
- item: How deliveries could be managed to reduce vehicle movements and use more sustainable modes, where
    possible
  level: must
- item: Location of site entrance(s), exit(s), wheel washing areas, hard standing, stockpiles, hoardings
    (location, height, type), dust suppression measures, water supplies and nearest neighbouring receptors
  level: must
- item: Proposed vehicle routing to the nearest Strategic Road Network avoiding schools, residential areas
    and high streets wherever possible
  level: must
- item: A site-specific dust risk assessment in line with IAQM guidance, with mitigation commensurate
    with the risk
  level: must
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 31-32. 'Demolition
  and/or Construction Environment Management Plan - Draft'. Discretionary for non-major applications.
review-status: unverified
field-status: {}
