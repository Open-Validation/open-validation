reference: viability-assessment
local-authority: YOR
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The application fails to meet the affordable housing policy on viability grounds (including
        S73 amendments that materially alter the economics).
  - discretionary
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policies H7 and H10
source-text: Applications that fail to meet policy requirements for affordable housing, where the justification
  ... is on the grounds of financial viability, including S73 applications where amendments sought would
  materially alter the economic circumstances of the scheme; • Any other major development where the deliverability
  of the scheme as designed needs to be understood; and • Any application where the viability of the existing
  use is relevant.
must-include:
- item: Demonstrates affordable housing has been maximised as far as is viable
  level: must
- item: Un-redacted, for publication with the other application documents
  level: must
- item: A residual land value and a benchmark land value
  level: must
- item: Evidence for all values and costs, including the benchmark land value
  level: must
- item: All assumptions identified and justified
  level: must
- item: A model capable of full interrogation by the council and its advisors
  level: must
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 49-50. The
  other two triggers are discretionary. Independent review is at the applicant's cost.
review-status: unverified
field-status: {}
