reference: transport-assessment
local-authority: YOR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Major residential development of 10 or more units (a Transport Statement for 10 to
        49 units, a Transport Assessment for over 50).
  - all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial development (including retail).
  - discretionary
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: NPPF paragraph 117; City of York Local Plan policy T7
source-text: Major applications for over 50 residential units; ... • Major applications for commercial
  development (including retail); and • All applications for schools and nurseries, hospitals, places
  of worship and other uses where the ... proposed development is likely to have significant transport
  implications. ... all major applications proposing residential development of 10 plus units but less
  than 50; and • all applications where traffic, parking and travel implications will be increased.
must-include:
- item: 'Transport Assessment: the proposed development (location, site history, scale, supporting transport
    infrastructure, parking, provision for non-motorised users)'
  level: must
- item: 'Transport Assessment: quantitative and qualitative assessment of existing conditions (walking,
    cycling, public transport, highway) and a review of traffic collision data'
  level: must
- item: 'Transport Assessment: future conditions, assessment methodology (area, periods, traffic data,
    trip generation and distribution, junction/network assessments)'
  level: must
- item: 'Transport Assessment: access and sustainable transport measures, mitigation of all impacts and
    planning obligations'
  level: must
- item: Car parking (including car club parking and electric vehicle charging points) and cycle parking
    to LTN 1/20 as a minimum
  level: must
- item: 'Transport Assessment: a Travel Plan'
  level: must
- item: 'Transport Statement: expected trip generation and implications for the highway network; access
    to public transport and sustainable modes; impact on parking and parking strategy; how vehicle dominance
    is reduced and pedestrian/cycle permeability improved'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: <
      value: 50
      description: Residential development of fewer than 50 units.
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 46-47. Covers
  both the 'Transport Assessment' and the 'Transport Statement' items. The schools/hospitals and 'traffic,
  parking and travel implications will be increased' triggers are discretionary.
review-status: unverified
field-status: {}
