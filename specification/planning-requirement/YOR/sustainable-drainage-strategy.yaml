reference: sustainable-drainage-strategy
local-authority: YOR
required-if:
  any:
  - ref: major-development
  - condition:
      field: minor-development
      value: true
      description: Minor applications.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>='
        value: 50
        description: Householder development of 50 sq m or more.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policies DP2 and ENV5
source-text: All major and minor applications, excluding householder development of less than 50m2 and
  change of use applications.
must-include:
- item: An assessment in line with the CYC SUDS guidance for developers (August 2018); section 4.5 for
    minor developments over 50 sq m
  level: must
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 45-46. 'Sustainable
  Drainage System (SUDS Strategy)'. Change of use applications are excluded.
review-status: unverified
field-status: {}
