reference: affordable-housing-statement
local-authority: YOR
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 5
    description: Residential development of 5 or more homes.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy H10
source-text: Residential development of 5 or more homes.
must-include:
- item: 'Sites of 5-14 dwellings: the gross internal floor area of the dwellings'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: <=
      value: 14
      description: Sites of 5 to 14 dwellings.
- item: 'Sites of 5-14 dwellings: heads of terms for an off-site financial contribution in line with the
    formula in policy H10'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: <=
      value: 14
      description: Sites of 5 to 14 dwellings.
- item: 'Sites of 15 or more dwellings: the total number of all proposed residential units'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Sites of 15 or more dwellings.
- item: 'Sites of 15 or more dwellings: the affordable provision as a percentage of all residential units'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Sites of 15 or more dwellings.
- item: 'Sites of 15 or more dwellings: the tenure mix of the affordable units and the percentage split'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Sites of 15 or more dwellings.
- item: 'Sites of 15 or more dwellings: affordable units, numbers of bedrooms and property types across
    all tenures, showing a representative mix'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Sites of 15 or more dwellings.
- item: 'Sites of 15 or more dwellings: the affordable unit space standards and floor areas (sq m)'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Sites of 15 or more dwellings.
- item: 'Sites of 15 or more dwellings: metric scaled plans showing the location of affordable units within
    the site'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Sites of 15 or more dwellings.
- item: 'Sites of 15 or more dwellings: any Registered Providers acting as development partners'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Sites of 15 or more dwellings.
- item: 'Sites of 15 or more dwellings: the different levels or types of affordability or tenure proposed
    for different units, clearly and fully explained'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 15
      description: Sites of 15 or more dwellings.
- item: Confirmation that a legal agreement will be entered into to abide by the terms of policy H10
  level: should
- item: Details of any discussions with Registered Providers
  level: should
- item: 'Where a Viability Assessment is submitted: based on and referring back to the Local Plan Viability
    Assessment, with evidence of what has changed since'
  level: should
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: A Viability Assessment accompanies the application.
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 19-20. Can
  be provided within the Planning Statement. For outline applications some details may be unknown.
review-status: unverified
field-status: {}
