reference: archaeological-assessment
local-authority: YOR
required-if:
  any:
  - all:
    - site:
        in:
        - archaeological-priority-area
        description: Site is in one of York's Areas of Archaeological Importance.
    - condition:
        field: ground-disturbance
        value: true
        description: The application requires groundworks.
  - discretionary
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy D6
source-text: All applications affecting archaeological features and deposits; • Applications within the
  Areas of Archaeological Importance requiring groundworks; • Applications on land which is known to have
  archaeological interest, or an archaeological assessment has been requested as part of pre-application
  advice; • Applications which may have an impact on the character or setting of a designated asset e.g.
  Listed Building, Conservation Area, Scheduled Monument, WHS, Registered Parks and Gardens and Registered
  Battlefield.
must-include:
- item: Undertaken by a competent person to the professional standards of the Chartered Institute for
    Archaeologists
  level: must
- item: The significance of the site and its setting, and whether and to what degree the proposals will
    harm the historic environment
  level: must
- item: Potential for previously unrecorded archaeological remains
  level: must
- item: Wider visual impacts on historic buildings, upstanding archaeological monuments and historic landscapes
  level: must
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 21-22. 'Archaeological
  Desk Based Assessment'. Discretionary beside the Areas of Archaeological Importance because the other
  triggers depend on known interest, pre-application advice or possible impacts.
review-status: unverified
field-status: {}
