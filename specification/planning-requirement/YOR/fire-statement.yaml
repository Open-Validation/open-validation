reference: fire-statement
local-authority: YOR
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
  (as amended)
source-text: 'A Planning Gateway One Fire Statement must be included for all applications for full planning
  permission which involve: • Provision of one or more relevant buildings; • Development of an existing
  relevant building; or • Development within the curtilage of a relevant building.'
must-include:
- item: Submitted on the form published by the Secretary of State (or a form to similar effect)
  level: must
confidence: medium
notes: From the council's list (published December 2025), National Validation Requirements, page 15-16.
  Relevant buildings contain two or more dwellings or educational accommodation and are 18 m or more in
  height, or 7 or more storeys.
review-status: unverified
field-status: {}
