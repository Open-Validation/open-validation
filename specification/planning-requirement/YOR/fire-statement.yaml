reference: fire-statement
local-authority: YOR
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-for-planning-and-other-applications
source-text: 'Fire Statement: full planning applications involving relevant buildings ... 18m+ or 7+ storeys'
confidence: medium
notes: 'Audit (wrong_app_type): filed under listed building consent with the LBC Design and Access Statement
  text.'
review-status: unverified
field-status: {}
