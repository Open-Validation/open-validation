reference: daylight-sunlight-assessment
local-authority: YOR
required-if: discretionary
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy D1
source-text: any application where there is a potential adverse impact upon the current levels of sunlight/daylight
  enjoyed by adjoining properties or building(s), including associated gardens or amenity space; and •
  any application for development that may themselves be adversely affected by adjoining sites or where
  one part of the proposed development may be impacted upon by another part of the development;
must-include:
- item: An assessment in line with BRE 'Site layout planning for daylight and sunlight' (BR209) 2022,
    including an overshadowing study with shadow diagrams at different times of day and year
  level: must
- item: Diagrams as relevant and a non-technical summary of the conclusions
  level: must
