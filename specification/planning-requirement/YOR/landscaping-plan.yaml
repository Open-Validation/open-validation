reference: landscaping-plan
local-authority: YOR
required-if:
  any:
  - ref: major-development
  - condition:
      field: new-open-space
      value: true
      description: The application provides new areas of open space, play space or landscape provision.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy D2
source-text: • All major applications; • All applications for new areas of open space, play space and
  landscape provision;
must-include:
- item: Indicative plan of hard and soft landscaping for all parts of the site where no buildings are
    proposed, with relevant site features, existing features to be retained and any species of nature
    conservation interest
  level: must
- item: Location of proposed biodiversity mitigation/enhancement measures, as identified in the habitat
    report
  level: must
  required-if: discretionary
- item: Site levels, gradients and any earthworks
  level: must
- item: Indicative hard landscaping materials
  level: must
- item: Location of bicycle and/or refuse storage areas
  level: must
- item: Identified areas of public open space, for applications of 50 units or more in areas of public
    open space deficiency
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: 50 units or more in an area of public open space deficiency.
- item: Private amenity space and size per unit and the type of provision (e.g. garden, balcony)
  level: must
- item: The quantum of any communal amenity space and children's playspace
  level: must
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 40. 'Landscaping
  Strategy'. Detail proportionate to the scale of development; can be within the Design and Access or
  Planning Statement.
review-status: unverified
field-status: {}
