reference: arboriculturist-report
local-authority: YOR
required-if:
  condition:
    field: trees-on-or-near-site
    value: true
    description: Trees within the site, or on adjacent land, would be affected (including street trees).
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy GI4
source-text: All applications where there are trees within the application site, or on land adjacent,
  that would be affected by the development (including street trees).
must-include:
- item: Prepared by a qualified arboriculturist, in line with BS 5837 (2012)
  level: must
- item: Existing species, spread, roots and position of trees
  level: must
- item: Trees to be felled
  level: must
- item: Trees affected (including on adjacent sites) and how they will be protected during construction
  level: must
- item: A tree survey, tree constraints plan, Arboricultural Implications Assessment and Arboricultural
    Method Statement with a Tree Protection Plan
  level: must
- item: The AIA shows all trees to be retained and felled, where protective fencing and ground protection
    go, and landscaping areas to be fenced against soil compaction
  level: must
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 48-49. 'Tree
  Survey / Arboricultural Report'.
review-status: unverified
field-status: {}
