reference: noise-assessment
local-authority: YOR
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The application includes noise generating sources or activities.
  - condition:
      field: plant-equipment
      value: true
      description: The application includes plant, machinery or flue/ventilation extraction systems.
  - condition:
      field: noise-sensitive-use
      value: true
      description: The development is noise sensitive and close to existing sources of noise and/or vibration.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policies D1 and ENV2
source-text: 'Any application that: ... • includes noise generating sources; plant and or machinery or
  noise generating activities; • proposes flue/ventilation extraction systems (in such cases a Ventilation/Extraction
  Statement will be required as well); and • are themselves noise sensitive and close to existing sources
  of noise and/or vibration.'
must-include:
- item: Existing background noise/vibration level over a 24-hour period
  level: must
- item: Predicted noise/vibration levels
  level: must
- item: Any acoustic mitigation needed to meet the required levels or protection
  level: must
- item: Undertaken by a suitably qualified acoustician
  level: must
- item: Demonstrates compliance with relevant British Standards and WHO guidelines
  level: must
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 42. 'Noise
  Impact Assessment'.
review-status: unverified
field-status: {}
