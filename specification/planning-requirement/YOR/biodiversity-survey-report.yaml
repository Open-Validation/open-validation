reference: biodiversity-survey-report
local-authority: YOR
required-if:
  any:
  - all:
    - any:
      - condition:
          field: new-build
          value: true
          description: New building(s) for any use.
      - condition:
          field: footprint-increase
          value: true
          description: An extension.
      - condition:
          field: involves-change-of-use
          value: true
          description: A change of use.
    - discretionary
  - site:
      in:
      - site-of-special-scientific-interest
      - sssi-impact-risk-zone
      description: Site is in a SSSI or a relevant SSSI Impact Risk Zone.
  - site:
      in:
      - special-area-of-conservation
      - special-protection-area
      - ramsar
      description: Site is in a European designated wildlife site (SAC, SPA, Ramsar) or its relevant Impact
        Risk Zone.
  - condition:
      field: irreplaceable-habitat
      value: true
      description: The proposal is within, or likely to affect, irreplaceable habitat (ancient woodland,
        ancient/veteran trees, lowland fen, blanket bog).
  - site:
      in:
      - local-wildlife-site
      - local-nature-reserve
      description: Site is within or adjoining a SINC or Local Nature Reserve.
  - site:
      in:
      - priority-habitat
      description: Development within habitats identified in the City of York Biodiversity Action Plan.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy GI2
source-text: Any development for new building(s) for any type of use including residential and non- residential,
  extensions and change of use where it is part of, or next to, a site designated for its biodiversity
  value or provides potential suitable habitats for protected species recorded in the vicinity of the
  site; • If proposal is a development within a Site of Special Scientific Interest (SSSI) or relevant
  SSSI Impact Risk Zone; • If proposal is a development within European Designated wildlife sites (Special
  Area of Conservation (SAC), Special Protection Areas (SPA) and Ramsar) or relevant their Impact Risk
  Zone (See Habitat Regulation Assessment (HRA) section); ... If a proposal is within, or likely to affect,
  irreplaceable habitat such as ancient woodland or ancient/veteran trees, lowland fen and blanket bog;
  • If proposal is within or adjoining a designated nature conservation site (Site of Importance for Nature
  Conservation (SINC), Local Nature Reserve (LNR)); and • Development within habitats identified in the
  City of York Biodiversity Action Plan (BAP)
must-include:
- item: As a minimum, a Preliminary Ecological Appraisal (PEA) carried out to current CIEEM guidance by
    qualified professionals
  level: must
- item: The PEA identifies where further surveys for specific habitats and/or species are required, and
    those surveys are provided
  level: should
- item: 'Where development could affect roosting bats: as a minimum an initial bat roost assessment; presence/absence
    surveys in season where buildings, trees or structures offer roosting potential'
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: The development has the potential to impact roosting bats.
- item: 'Where ponds and ditches are on or within 500 m and suitable great crested newt habitat would
    be affected: an initial assessment of all ponds and ditches, including a Habitat Suitability Index
    (HSI) assessment, and any presence/absence surveys needed'
  level: must
  required-if:
    condition:
      field: pond-on-or-near-site
      value: true
      description: Ponds or ditches are present on or within 500 m of the site.
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 22-24. 'Biodiversity
  and Ecology Report'. Protected species surveys will not be conditioned. The first trigger is discretionary
  because it depends on suitable habitat or a nearby designated site.
review-status: unverified
field-status: {}
