reference: travel-plan
local-authority: YOR
required-if:
  any:
  - site:
      in:
      - strategic-allocation
      description: All strategic sites.
  - discretionary
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: NPPF paragraph 117; strategic site policies; City of York Local Plan policy T7
source-text: All strategic sites; ... • Other development which is likely to have significant transport
  implications (such as employment sites, schools, nurseries and hotels) or where there is no parking,
  or a low level of car parking ... proposed;
must-include:
- item: 'Residential and small-scale single-occupier non-residential development: a full Travel Plan'
  level: must
- item: 'Multiple-occupier non-residential schemes or the non-residential part of a mixed-use scheme:
    a framework Travel Plan with a commitment by individual occupiers'
  level: must
  required-if:
    condition:
      field: mixed-use
      value: true
      description: Multiple-occupier non-residential or mixed-use scheme.
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 48. Other
  developments are discretionary ('likely to have significant transport implications').
review-status: unverified
field-status: {}
