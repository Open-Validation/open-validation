reference: bng-metric
local-authority: YOR
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development would be subject to the biodiversity gain condition.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy GI2; Environment Act 2021; Article 7, Town and Country Planning
  (Development Management Procedure) (England) Order 2015 (as amended)
source-text: • Any major development; and • Any development on small sites unless exemptions apply (see
  government guidance for details of BNG exemptions
must-include:
- item: Confirmation that the applicant believes the development would be subject to the biodiversity
    gain condition
  level: must
- item: The completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat on the date of application (or proposed earlier date)
  level: must
- item: 'Where an earlier date is proposed: that date and the reasons for it'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: The applicant proposes an earlier date.
- item: A statement on whether activities before that date lost onsite biodiversity value ('degradation')
    and, where they did, the date before them, the value then, the metric and any supporting evidence
  level: must
- item: A description of any irreplaceable habitat on the land on the date of application (or earlier
    date)
  level: must
- item: 'Where a self-build exemption is claimed: a supporting statement'
  level: must
  required-if:
    condition:
      field: bng-exemption-claimed
      value: true
      description: The developer claims the self-build exemption.
- item: A statement on how a minimum 10% net gain will be achieved (onsite, offsite or statutory credits)
    and how the biodiversity gain hierarchy is followed
  level: should
- item: A draft Biodiversity Net Gain Plan and a draft/interim Habitat Management and Monitoring Plan
    (HMMP)
  level: should
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 24-26. Exempt
  developments (including householder applications) are exempt by law, so this follows the biodiversity
  gain condition rather than the list's 'any development' wording.
review-status: unverified
field-status: {}
