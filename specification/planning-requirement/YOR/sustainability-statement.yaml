reference: sustainability-statement
local-authority: YOR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development of 1 or more dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: New non-residential development with a total internal floor area of 1000 sq m or more.
  - condition:
      field: involves-change-of-use
      value: true
      description: Conversion to residential use or a non-residential change of use.
  - site:
      in:
      - strategic-allocation
      description: Strategic sites.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policies CC2 and CC3
source-text: Applications for new residential development of 1 or more dwellings; ... • New non-residential
  development with a total internal floor area of 1000m2 or more; • Applications for conversion to residential
  use or non-residential changes of use; and • Strategic sites.
must-include:
- item: How the energy hierarchy has been applied, how climate resilience adaptation is incorporated and
    how water efficiency will be achieved
  level: must
- item: 'Major developments: feasibility and viability of connecting to an existing decentralised energy
    network, or future network opportunities'
  level: must
  required-if:
    ref: major-development
- item: 'Residential: a performance summary of CO2 emissions (kgCO2/m²) for the BER and TER and the percentage
    reduction (SAP version 10), including reductions from energy efficiency'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
- item: 'Non-residential over 1,000 sq m, conversions/changes of use and strategic sites: a BREEAM Pre-Assessment
    Checklist (targeted credits and rating) or a BREEAM Design Stage Assessment Certificate'
  level: must
  required-if:
    any:
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: Non-residential development over 1,000 sq m.
    - condition:
        field: involves-change-of-use
        value: true
        description: Conversion or change of use.
    - site:
        in:
        - strategic-allocation
        description: Strategic sites.
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 45. 'Sustainability
  and Energy Statement'.
review-status: unverified
field-status: {}
