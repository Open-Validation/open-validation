reference: sustainability-statement
local-authority: YOR
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: Non-residential development of 1,000 sq m or more.
  - condition:
      field: involves-change-of-use
      value: true
      description: Conversions and changes of use.
  - site:
      in:
      - strategic-allocation
      description: Strategic sites.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-for-planning-and-other-applications
confidence: medium
notes: 'From the audit (missing_requirement): Sustainability and Energy Statement - new residential, non-residential
  1,000 sq m+, conversions/changes of use, strategic sites.'
review-status: unverified
field-status: {}
