reference: section-proposed
local-authority: YOR
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: The application creates new floorspace.
  - condition:
      field: internal-works
      value: true
      description: The application changes the floor plans of a property (including roof level).
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground or floor levels, or the site slopes.
  - condition:
      field: tall-building
      value: true
      description: The application is for a tall building.
  - application-type:
      in:
      - lbc
  - application-type:
      in:
      - advertising
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications that involve the creation of new or changes to the floor plans of a property
  (including roof level); where a proposal involves changes to ground or floor levels; or, for any application
  on a sloping site or tall building
must-include:
- item: At a scale of 1:50 or 1:100 (1:200 may be acceptable for major applications)
  level: must
- item: Cross sections through the site and buildings, with existing site levels and finished floor levels
    related to a fixed datum point off-site
  level: must
- item: Details of foundations and eaves levels
  level: must
- item: The proposals in relation to existing site levels and adjoining buildings
  level: must
- item: 'Major applications: plans at 1:10 or 1:20 showing typical window sections, entrances and balconies
    (where applicable)'
  level: must
  required-if:
    ref: major-development
- item: 'Advertisement consent: sections of all proposed adverts at 1:20 showing the building, how they
    would be fixed to it and the extent of projection'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Sections of all proposed adverts at a scale of 1:20 showing the building and how they would
    be fixed to it, extent of projection
confidence: medium
notes: From the council's list (published December 2025), National Validation Requirements and Requirements
  for common application types, page 13-14, 54.
review-status: unverified
field-status: {}
