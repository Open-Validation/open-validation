reference: lighting-assessment
local-authority: YOR
required-if:
  any:
  - all:
    - condition:
        field: external-lighting
        value: true
        description: External lighting is proposed.
    - discretionary
  - all:
    - condition:
        field: external-lighting
        value: true
        description: External lighting is proposed.
    - condition:
        field: new-open-space
        value: true
        description: The proposal provides public realm.
  - condition:
      field: floodlighting
      value: true
      description: Outdoor sports facilities (including MUGAs) where external lighting is proposed.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: External lighting is proposed.
    - condition:
        field: protected-species
        value: true
        description: The site/area has the potential to be used by bats and/or other protected species.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policies ENV2 and GI2
source-text: 'All proposals involving: ... • any developments in which external lighting may result in
  a loss of amenity to nearby residents or impact on the surrounding area (when adjacent to darker areas);
  • the provision of public realm where external lighting is proposed; • outdoor sports facilities (including
  MUGAs) where external lighting is proposed; and • where external lighting is proposed and there is the
  potential for the site/area to be used by bats and/or other protected species.'
must-include:
- item: A layout plan with beam orientation and a schedule of the equipment
  level: must
- item: Details of any directional hoods or other mitigation
  level: must
- item: Proposed hours of operation and the time of any automatic cut-off
  level: must
- item: 'Where outdoor floodlighting is proposed: a lighting impact assessment showing conformity with
    the ILP Obtrusive Light Limitations for the relevant Environmental Zone'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: Outdoor floodlighting is proposed.
- item: Any possible effects on light-sensitive wildlife, e.g. bats
  level: must
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 40-41. The
  amenity trigger is discretionary.
review-status: unverified
field-status: {}
