reference: lighting-assessment
local-authority: YOR
required-if:
  condition:
    field: floodlighting
    value: true
    description: Outdoor floodlighting is proposed.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-for-planning-and-other-applications
source-text: For areas where outdoor floodlighting is proposed a lighting impact assessment must be provided
  that demonstrates lighting to the development will conform to requirements to meet the Obtrusive Light
  Limitations for Exterior Lighting Installations for the relevant Environmental Zone as set out in the
  Institute of Light Professionals Guidance Notes for the Reduction of Obtrusive Lighting; and Any possible
  effects on wildlife that is sensitive to lighting e.g. bats.
must-include:
- item: Conformity with the Obtrusive Light Limitations for Exterior Lighting Installations for the relevant
    Environmental Zone (ILP Guidance Notes for the Reduction of Obtrusive Lighting)
  level: must
- item: Any possible effects on wildlife sensitive to lighting, e.g. bats
  level: must
