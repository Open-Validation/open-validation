reference: location-plan
local-authority: YOR
required-if:
  always: true
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Required on all applications.
must-include:
- item: At a recognisable scale, normally 1:1250
  level: must
- item: Application site outlined in red, with a blue line around any other land owned by the applicant
    close to or adjoining the site
  level: must
- item: Direction of North
  level: must
- item: At least two named roads where possible
  level: must
- item: The street number/name of the application property and its neighbours
  level: must
- item: All buildings, roads and footpaths on land adjoining the site
  level: must
- item: The single continuous red line includes all land needed to carry out the development (access from
    a public highway, visibility splays, landscaping, car parking, open land around the building)
  level: must
- item: Where the site contains more than one building, the building(s) subject to the application identified
  level: must
  required-if:
    condition:
      field: multiple-buildings
      value: true
      description: The site contains more than one building.
- item: Public rights of way crossing or adjoining the site, unless they would not influence or be affected
    by the development
  level: should
- item: Position of all trees on the site and on adjacent land, unless they would not influence or be
    affected by the development
  level: should
confidence: medium
notes: From the council's list (published December 2025), National Validation Requirements, page 11-12.
review-status: unverified
field-status: {}
