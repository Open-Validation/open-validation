reference: recreation-facilities-assessment
local-authority: YOR
required-if:
  any:
  - condition:
      field: loss-of-use
      value: true
      description: The application involves the loss of built sports facilities currently or last used
        for sport.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
    - site:
        in:
        - strategic-allocation
        description: Site is a Strategic Site in the Local Plan.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy HW3
source-text: Applications involving the loss of built sports facilities* either currently or last used
  for sports activities; and • Residential development on Strategic Sites.
must-include:
- item: Relevant national and local policy around sports facilities
  level: should
- item: The capacity, quantity, quality and accessibility of existing provision
  level: should
- item: Any mitigation to compensate for the loss of facilities
  level: should
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 26-27. 'Built
  sports facilities needs assessment'. The list says assessments 'should typically address' these.
review-status: unverified
field-status: {}
