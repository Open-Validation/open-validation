submission-standards:
- item: Plans show a title and drawing number (with the relevant revision number as necessary)
  level: must
- item: A scale bar of 10 metres highlighting each metre (5m is acceptable for householder and minor applications)
  level: must
- item: All plans to a recognisable metric scale (i.e. 1:50, 1:100, 1:200, 1:1250)
  level: must
- item: Plans marked "do not scale" or any similar phrase will be returned
  level: must
