validation-list:
  url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
  date: 2025-12
  date-basis: 'Cover: ''Validation Requirements List December 2025'' (no day given; PDF created 12 February
    2026). The council''s ''Make a planning application'' page (https://www.york.gov.uk/planning-applications/make-planning-application)
    says ''Following a public consultation, we have now produced a validation list'' and links this file,
    which is also the only file on the ''Validation requirements for Planning and other applications''
    download page (https://www.york.gov.uk/downloads/download/807/validation-requirements-for-planning-and-other-applications).
    Checked 2026-11-06: no newer list is linked; the council''s committee site (democracy.york.gov.uk)
    is refused by the egress proxy, so the adoption decision could not be checked.'
  status: current
submission-standards:
- item: Every drawing includes a title and drawing number (with the revision number as necessary)
  level: must
- item: Every drawing states the print (paper) size and the scale at that print size (e.g. 1:50 at A3)
  level: must
- item: A scale bar of 10 metres highlighting each metre (5 m acceptable for householder and minor applications)
  level: must
- item: All plans to a recognisable metric scale (e.g. 1:50, 1:100, 1:200, 1:1250)
  level: must
- item: Plans marked 'do not scale' or any similar phrase will be returned
  level: must
- item: 'Major applications: existing and proposed plans on separate drawings (householder and minor applications
    may combine them)'
  level: must
- item: Wherever possible, no plans larger than A3; drawings of A2 or above submitted electronically
  level: should
- item: All drawings and documents logged with drawing number, plan name and description when submitting
    via the Planning Portal
  level: should
- item: Householder and lawful development certificate drawings include measurements (depth, width and
    height)
  level: should
- item: 'Paper submissions: the original and one copy of all documents and forms, unless more copies have
    been requested'
  level: must
- item: Large volumes of documents on CD or file transfer (Dropbox, WeTransfer) accompanied by a covering
    letter or email with a full schedule of the documents
  level: must
- item: All documents of a quality that is easily readable in digital form, whether scanned or submitted
    digitally
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s York link is the current December 2025 list, but it dated the list 2026-02-01 from
    PDF metadata. About 19 local requirements are missing (e.g. Accessibility, Housing, Sustainability/Energy,
    Foul Sewage, HRA, Masterplan), many triggers belong to the next requirement in the PDF, and the source''s
    type-specific checklists (LDC, adverts, S73/NMA, prior notification) were ignored. Fixed 2026-11-05:
    every file was rewritten from the council''s latest list.'
