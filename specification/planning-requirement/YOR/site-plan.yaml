reference: site-plan
local-authority: YOR
required-if:
  any:
  - condition:
      field: footprint-increase
      value: true
      description: The application involves an extension to the building.
  - condition:
      field: new-build
      value: true
      description: A new building is being constructed.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change of use is proposed.
  - application-type:
      in:
      - pa-extension
  - all:
    - application-type:
        in:
        - lbc
    - any:
      - condition:
          field: footprint-change
          value: true
          description: The building footprint is altering.
      - condition:
          field: landscaping-works
          value: true
          description: Changes to the landscaping are proposed.
  - application-type:
      in:
      - non-material-amendment
      - s73
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications involving extensions to the building, where a new building is being constructed,
  or a change of use is proposed.
must-include:
- item: At a scale of at least 1:200 or 1:500
  level: must
- item: Direction of North
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on site
  level: must
- item: All buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: must
- item: Position of all trees and street furniture on, and adjacent to, the site
  level: must
- item: Extent and type of any hard surfacing and boundaries on site
  level: must
- item: Proposed cycle and car parking, and waste storage, where appropriate
  level: must
  required-if: discretionary
- item: Anything to be demolished or relocated
  level: must
- item: Where the site contains more than one building, the building(s) subject to the application identified
  level: must
  required-if:
    condition:
      field: multiple-buildings
      value: true
      description: The site contains more than one building.
- item: 'Listed building consent: block plan at 1:100 or 1:200 showing site boundaries'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Block plan at 1:100 or 1:200 showing site boundaries (if building footprint is altering
    or changes to the landscaping are proposed)
- item: 'Larger home extension prior notification: a plan indicating the site and showing the proposed
    development and any existing enlargement of the original dwellinghouse to which the enlarged part
    will be joined'
  level: must
  required-if:
    application-type:
      in:
      - pa-extension
  source-text: A plan indicating the site and showing the proposed development and any existing enlargement
    of the original dwellinghouse to which the enlarged part will be joined
confidence: medium
notes: From the council's list (published December 2025), National Validation Requirements, page 12. The
  quick lists (pages 53-55) add a block plan for listed building consent (if the footprint alters or landscaping
  changes), a site plan for a larger home extension prior notification, and a block plan for section 96a
  non-material and section 73 minor material amendments.
review-status: unverified
field-status: {}
