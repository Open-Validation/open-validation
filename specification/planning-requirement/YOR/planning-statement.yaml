reference: planning-statement
local-authority: YOR
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - lbc
      - ldc
      - s73
      - change-of-use
      - demolition-con-area
  - condition:
      field: departure-from-development-plan
      value: true
      description: The development is a departure from the development plan.
  - all:
    - application-type:
        in:
        - non-material-amendment
        - s73
    - ref: major-development
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy DM1
source-text: All applications except householders, extensions to flats, Advertisement Consent, Prior Approvals,
  Discharge of Conditions; • Any development which is a departure from the development plan; and • All
  applications for non-material and minor material amendments where the originally approved scheme was
  a major development.
must-include:
- item: The context and need for the development, and an assessment of how it accords with national and
    local policies, with commentary rather than just a list of policies
  level: must
- item: 'Non-material and minor material amendments: how the proposals have changed; a list of the approved
    plans and what each is replaced with; a schedule of the works; and justification for any loss of community
    facilities'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: 'From the council''s list (published December 2025), Local validation requirements, page 42-43.
  ''All applications except householders, extensions to flats, Advertisement Consent, Prior Approvals,
  Discharge of Conditions'': the type list here is the main types not excepted. Full applications for
  extensions to flats are excepted too. For amendments, ''major'' means the originally approved scheme
  was major development.'
review-status: unverified
field-status: {}
