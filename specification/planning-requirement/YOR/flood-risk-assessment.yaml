reference: flood-risk-assessment
local-authority: YOR
required-if:
  any:
  - all:
    - site:
        in:
        - flood-risk-zone
        description: Site is in Flood Zone 1.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or greater.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or greater.
      - discretionary
  - site:
      in:
      - flood-risk-zone
      description: Site is in Flood Zone 2 or 3 (including domestic extensions and change of use to residential).
  - all:
    - condition:
        field: more-vulnerable-use-change
        value: true
        description: Development or change of use to a more vulnerable use.
    - discretionary
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy ENV4
source-text: All developments on sites of 1 hectare or greater in Flood Zone 1; • Development in Flood
  Zone 1 which could be affected by flooding from sources other than rivers and the sea; • All developments
  located in Flood Zones 2 and 3, including domestic extensions and change of use to residential; and
  • Where development or change of use to a more vulnerable use may be subject to other sources of flooding.
must-include:
- item: The sources of flooding and the risks to and from the development, and how they will be managed
    and mitigated, taking climate change into account
  level: must
- item: The design of surface water management systems, including Sustainable Drainage Systems (SUDS)
  level: must
- item: 'Where a safe and dry means of escape cannot be provided: a Flood Evacuation Management Plan'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 34-35. The
  Flood Zone 1 'other sources' trigger is discretionary.
review-status: unverified
field-status: {}
