reference: heritage-statement
local-authority: YOR
required-if:
  any:
  - site:
      in:
      - conservation-area
      - listed-building
      - scheduled-monument
      - park-and-garden
      description: The application involves a designated heritage asset (Conservation Area, Listed Building,
        Scheduled Monument, Registered Park and Garden).
  - site:
      in:
      - locally-listed-building
      description: The application involves a non-designated heritage asset.
  - site:
      in:
      - listed-building-setting
      description: The application affects the setting of a heritage asset.
  - site:
      in:
      - archaeological-priority-area
      description: The application involves archaeological heritage assets.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policies D4, D5, D6, D7
source-text: 'All applications involving: ... • designated heritage assets: Conservation Areas, Listed
  Buildings, Scheduled Monuments and/or Registered Parks and Gardens; • non-designated heritage assets;
  • the setting of all the above; • Archaeological Heritage Assets.'
must-include:
- item: A description of the significance of any heritage assets affected, including any contribution
    made by their setting
  level: must
- item: An assessment of the impact of the proposals on the asset's significance
  level: must
- item: How the proposal will preserve and enhance the heritage asset and its setting
  level: must
- item: Evidence that the Historic Environment Record (HER) has been consulted
  level: must
- item: 'In especially sensitive locations: 3D visualisations/CGI/renders or verified views (AVR levels
    0-3), as agreed with officers'
  level: must
  required-if: discretionary
- item: 'Where works are major and/or there are a number of alterations to a listed building: a full schedule
    of works with a method statement'
  level: must
  required-if:
    all:
    - site:
        in:
        - listed-building
        description: Listed building.
    - discretionary
- item: Photographs, dated and numbered and cross-referenced to the drawings, for applications affecting
    Conservation Areas and Listed Buildings
  level: should
  required-if:
    site:
      in:
      - conservation-area
      - listed-building
      description: The application affects a Conservation Area or Listed Building.
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 38-39. Applications
  will not be validated where the impact on heritage significance cannot be adequately understood. It
  can be part of the Design and Access Statement if clearly titled. Also listed in the quick lists for
  householder, listed building consent and advertisement consent applications.
review-status: unverified
field-status: {}
