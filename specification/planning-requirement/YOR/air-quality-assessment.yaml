reference: air-quality-assessment
local-authority: YOR
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - all:
    - site:
        in:
        - air-quality-management-area
        description: Site is in an Air Quality Management Area (AQMA).
    - discretionary
  - discretionary
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policies EC3, GI2, ENV1 and ENV2
source-text: 'Major applications where there is potential to generate significant air quality impacts;
  ... • Any application within AQMAs where there is potential to generate significant air quality ...
  impacts or which introduce air quality sensitive uses into areas of current, known poor air ... quality
  ... Developments which may lead to an air quality impact on nationally or internationally designated
  sites (SPA, SAC, Ramsar and SSSI) as detailed in Natural England standing advice ‘Air Pollution and
  Development: Advice for Local Authorities’.'
must-include:
- item: Scope as set out in the Council's Low Emissions Planning Guidance (updated 2022)
  level: must
- item: 'Where relevant (e.g. drive-through food retail or click-and-collect): a written idling management
    plan'
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 20-21. Shown
  as discretionary because each trigger depends on the 'potential to generate significant air quality
  impacts' or a possible impact on designated sites.
review-status: unverified
field-status: {}
