reference: land-contamination-assessment
local-authority: YOR
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: The site has evidence of land contamination.
  - condition:
      field: industrial-site
      value: true
      description: The site has a past industrial use.
  - condition:
      field: sensitive-end-use
      value: true
      description: A vulnerable end use (e.g. residential) is introduced.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy ENV3
source-text: All sites with evidence of land contamination; • All sites with a past industrial use; •
  Any applications where a vulnerable end use is introduced (eg. Residential uses)
must-include:
- item: 'A Phase 1 investigation: desk study, site walkover survey and preliminary risk assessment'
  level: must
- item: 'If significant contamination is anticipated: more detailed information such as a Phase 2 investigation
    and a remediation strategy'
  level: must
  required-if: discretionary
- item: A single residential property on a site with no past industrial use may instead submit the council's
    Screening Assessment form
  level: should
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 30. Must
  be undertaken by a competent person.
review-status: unverified
field-status: {}
