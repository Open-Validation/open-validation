reference: environmental-statement
local-authority: YOR
required-if:
  condition:
    field: eia-development
    value: true
    description: Schedule 1 development, or Schedule 2 development likely to have a significant effect
      on the environment.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017 (as amended)
source-text: 'Developments that: • are listed within Schedule 1 of the Town and Country Planning (Environmental
  Impact Regulations) 2017 (as amended); or • are listed within Schedule 2 of the Regulations and are
  likely to have a significant effect on the environment.'
must-include:
- item: Clear that the information is intended to constitute an Environmental Statement
  level: must
- item: 'Non-material (s96a) and minor material (s73) amendments to EIA development: evidence the changes
    have been screened and their impacts assessed (likely an addendum to the Environmental Statement)'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 33-34.
