reference: floor-plan-proposed
local-authority: YOR
required-if:
  application-type:
    in:
    - hh
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-for-planning-and-other-applications
source-text: be included for all elevations, including blank elevations, except for householder applications
  where a statement 12 confirming that they will remain unchanged will be required; show the full elevation
  of a building (i.e. applications involving flats which form part of a larger converted property must
  provide plans showing the entire elevation of the building and not just the flat in question);
must-include:
- item: Scale of 1:50 or 1:100
  level: must
- item: For change of use, floor plans indicating the extent of the use and its relationship to adjacent
    development, for example where part of a floor or building changes use
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: A change of use is proposed.
- item: Each room size and overall unit sizes, for new residential accommodation including conversions
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates new residential accommodation.
confidence: medium
review-status: unverified
field-status: {}
