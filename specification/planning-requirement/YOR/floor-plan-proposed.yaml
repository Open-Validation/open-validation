reference: floor-plan-proposed
local-authority: YOR
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: The application creates new floorspace.
  - condition:
      field: internal-works
      value: true
      description: The application proposes changes to existing floors of a property.
  - condition:
      field: roof-alteration
      value: true
      description: The application proposes changes to the roof of a property.
  - application-type:
      in:
      - lbc
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications that involve the creation of new floorspace or that propose changes to existing
  floors or roof of a property
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Direction of North
  level: must
- item: Site boundary and the outline of any existing neighbouring buildings
  level: must
- item: The proposed building, including proposed room uses if known, each floor and the roof
  level: must
- item: All floors, including floors with no changes (for householder applications a statement confirming
    unchanged floors will remain unchanged)
  level: must
- item: 'Change of use: the extent of the use and its relationship to adjacent development, where needed
    (for example where part of a floor or building changes use)'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: The proposal is a change of use.
  source-text: Applications for change of use will need to be accompanied by floor plans where it is necessary
    to indicate the extent of the use and its relationship to adjacent development
- item: 'New residential accommodation (including conversions): each room size and overall unit sizes
    stated on the plans'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates new residential accommodation, including conversions.
  source-text: applications proposing new residential accommodation, including conversions, must state
    each room size and overall unit sizes on the plans.
confidence: medium
notes: From the council's list (published December 2025), National Validation Requirements and Requirements
  for common application types, page 13, 53.
review-status: unverified
field-status: {}
