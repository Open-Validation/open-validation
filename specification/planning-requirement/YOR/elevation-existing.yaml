reference: elevation-existing
local-authority: YOR
required-if:
  any:
  - condition:
      field: external-alterations
      value: true
      description: The application involves changes to any external part of the building.
  - application-type:
      in:
      - lbc
  - application-type:
      in:
      - advertising
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications that involve changes to any external part of the building
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: All elevations, including blank elevations (for householder applications a statement confirming
    unchanged elevations will remain unchanged)
  level: must
- item: The full elevation of the building (for flats in a larger converted property, the entire elevation
    of the building, not just the flat)
  level: must
- item: Relationship to neighbouring buildings and the positions of windows and doors on all buildings
  level: must
- item: Proposed materials
  level: must
- item: No other proposed work that has not been carried out and is not part of the application
  level: should
- item: No existing or proposed trees, hedges or boundary fences shown on the elevations
  level: should
- item: 'Advertisement consent: existing elevation(s) at no less than 1:100, or a clear photograph of
    the existing building(s)'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Existing elevation/s (no less than a scale of 1:100) or a clear photograph of existing
    building/s
- item: 'Listed building consent: existing internal elevations as necessary at 1:10 or 1:20'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Existing and proposed internal elevations as necessary to a scale of 1:10 or 1:20 clearly
    showing any
confidence: medium
notes: From the council's list (published December 2025), National Validation Requirements, page 12-13.
  The quick lists (pages 53-54) also ask for existing external elevations at 1:50 or 1:100 for listed
  building consent and existing elevations (or a photograph) for advertisement consent.
review-status: unverified
field-status: {}
