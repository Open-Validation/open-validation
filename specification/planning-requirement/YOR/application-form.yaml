reference: application-form
local-authority: YOR
required-if:
  always: true
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Required on all applications.
must-include:
- item: Completed in full, signed and dated
  level: must
- item: A concise, clear description of the development that accurately reflects all aspects of the proposal
    requiring planning permission
  level: must
- item: Applications relating to flats made on the full 'Application for Planning Permission' form, not
    the householder form
  level: must
  required-if:
    condition:
      field: housing-type
      value: flat
      description: The application relates to a flat.
  source-text: N.B. Applications relating to flats need to be made on the full ‘Application for Planning
    Permission’ form (NOT householder forms).
confidence: medium
notes: From the council's list (published December 2025), National Validation Requirements, page 9.
review-status: unverified
field-status: {}
