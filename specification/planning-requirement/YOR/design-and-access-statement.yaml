reference: design-and-access-statement
local-authority: YOR
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Site is in a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings where the floorspace created is 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: major developments (those which involve the creation of 10 or more residential units; residential
  development on a site of 0.5 hectares or more; development on a site of at least 1 hectare; or the provision
  of a building or buildings where the floor space to be created by the development is 1,000 square metres
  or more); • one or more dwellings or a building or buildings where the floorspace created is 100sq.m
  or more within a Conservation Area; and • all applications for listed building consent.
must-include:
- item: Proportionate to the scale of the development; visual, using diagrams, sketches, plans and photographs
    where possible
  level: should
- item: 'Listed building consent: how the design principles take account of the special architectural
    or historic importance of the building, the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published December 2025), National Validation Requirements, page 14-15.
  The list says designing out crime, accessibility, healthy places, landscaping and lighting information
  can be included in the Design and Access Statement.
review-status: unverified
field-status: {}
