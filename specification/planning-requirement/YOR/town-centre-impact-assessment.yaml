reference: town-centre-impact-assessment
local-authority: YOR
required-if:
  any:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use outside the major, district and local centres and neighbourhood
        parades.
  - all:
    - site:
        in:
        - shopping-frontage
        description: Site is within a primary, secondary or local shopping frontage (ground floor).
    - condition:
        field: loss-of-use
        value: true
        description: A non-retail use is proposed.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-list
policy: City of York Local Plan policy R1
source-text: Applications for main town centre uses (Class E commercial, business and service and Class
  Sui ... Generis) located outside of the major, district and local centres and neighbourhood parades;
  ... and ... Applications for non-retail uses with within primary, secondary or local shopping frontages
  ... (ground floor only).
must-include:
- item: 'Out of centre locations: a sequential test of alternative sites in town centres, local centres,
    neighbourhood parades and edge-of-centre locations'
  level: must
  required-if:
    condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Out of centre location.
- item: 'Out of centre proposals of 2,500 sq m gross floorspace and above: an impact assessment on the
    vitality and viability of town and local centres'
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 2500
      description: 2,500 sq m gross floorspace and above, out of centre.
confidence: medium
notes: From the council's list (published December 2025), Local validation requirements, page 43-44. 'Retail
  Statement / Retail Impact Assessment'.
review-status: unverified
field-status: {}
