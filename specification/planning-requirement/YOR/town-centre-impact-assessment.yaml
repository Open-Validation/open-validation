reference: town-centre-impact-assessment
local-authority: YOR
required-if:
  all:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: An out of centre proposal.
  - condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 2500
      description: 2500 sqm gross floorspace and above.
source-url: https://www.york.gov.uk/downloads/file/2748/validation-requirements-for-planning-and-other-applications
source-text: For out of centre proposals of 2500sqm gross floorspace and above, an impact assessment is
  also required to demonstrate that the development would not individually or cumulatively have a detrimental
  impact on the vitality and viability of town and local centres.
confidence: medium
notes: The workbook's retail row quoted Planning Statement text; this wording was in its 'Self-build'
  row (audit wrong_trigger). The Retail Statement's own trigger for smaller schemes isn't in the extract.
review-status: unverified
