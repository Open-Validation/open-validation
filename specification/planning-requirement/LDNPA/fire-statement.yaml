reference: fire-statement
local-authority: LDNPA
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building over 18m in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: Seven or more storeys.
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9A
source-text: One or more buildings over 18m in height or 7 or more storeys, and which contain two or more
  dwellings or for the purposes of educational accommodation Development of an existing building over
  18m in height or 7 or more storeys, and which contains two or more dwellings or for the purposes of
  educational accommodation Development within the curtilage of an existing building over 18m in height
  or 7 or more storeys, and which contains two or more dwellings or for the purposes of educational accommodation
  Change of use of one or more buildings over 18m in height or 7 or more storeys, to use as two or more
  dwellings or for the purposes of educational accommodation If the answer is yes a Fire Safety Statement
  is required
confidence: medium
notes: From the authority's list (reviewed 6 August 2026), page 7. Fire Safety Statement, following the
  national rule (new buildings, works to, within the curtilage of, or change of use of a relevant building).
  The per-type checklists on the 'Applying for planning permission' page (https://lakedistrict.gov.uk/planning/applying-for-planning-permission/)
  list it as 'sometimes' needed for full, outline and reserved matters applications.
review-status: unverified
field-status: {}
