reference: sustainable-drainage-strategy
local-authority: LDNPA
required-if:
  ref: major-development
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
policy: National planning policy (sustainable drainage in major development)
source-text: A planning application for major development? If the answer is yes to the above, a Major
  Development SUDS statement is required.
must-include:
- item: Evidence that the national standards for sustainable drainage systems can be met, or that SuDS
    are demonstrably inappropriate having regard to those standards
  level: must
- item: Ideally a standalone statement addressing the Government's sustainable drainage technical standards
    one by one and in order
  level: should
confidence: medium
notes: From the authority's list (reviewed 6 August 2026), page 1. Major Development SUDS statement. The
  guidance spells out major development (1,000 sq m, 10 or more houses, outline housing on 0.5ha, other
  sites of 1ha, waste development, minerals). The per-type checklists on the 'Applying for planning permission'
  page (https://lakedistrict.gov.uk/planning/applying-for-planning-permission/) list it as 'sometimes'
  needed for full, outline and reserved matters applications. Contents from the authority's sustainable
  drainage systems validation guidance (https://lakedistrict.gov.uk/planning/planning-permission/planning-advice/planning-guides/sustainable-drainage-system-statement-validation-guidance/),
  which 'form part of our validation checklists'.
