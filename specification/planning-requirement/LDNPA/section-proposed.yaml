reference: section-proposed
local-authority: LDNPA
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline-all
      - outline-some
      - reserved-matters
      - lbc
      - non-material-amendment
  - all:
    - application-type:
        in:
        - s73
        - ldc-existing-use
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - discretionary
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
source-text: 'Section drawings yes (existing and proposed) ... Ground levels (existing and proposed) Shown
  on Elevation or Section drawings Will be required if: • Changes to ground levels are proposed (infill
  or excavation) • The proposed development will yes not be built on the existing ground level • The existing
  ground level is not flat • Below ground works are proposed (e.g. basements or trenched services)'
must-include:
- item: Existing and proposed ground levels (on elevation or section drawings) where ground levels change
    (infill or excavation), the development will not be built on existing ground level, the ground is
    not flat, or below-ground works (e.g. basements or trenched services) are proposed
  level: must
  required-if:
    any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: Changes to ground levels are proposed, the development is not built on existing ground
          level, or the existing ground is not flat.
    - condition:
        field: basement
        value: true
        description: Below ground works are proposed (e.g. basements or trenched services).
  source-text: 'Will be required if: • Changes to ground levels are proposed (infill or excavation) •
    The proposed development will yes not be built on the existing ground level • The existing ground
    level is not flat • Below ground works are proposed (e.g. basements or trenched services)'
confidence: medium
notes: From the authority's list (reviewed 6 August 2026), page 1. The per-type checklists list 'Existing
  and proposed plans' as always needed for householder, full, outline, reserved matters, listed building
  consent and non-material amendment applications, and 'sometimes' for section 73 and lawful development
  certificates (so those show as 'check').
review-status: unverified
field-status: {}
