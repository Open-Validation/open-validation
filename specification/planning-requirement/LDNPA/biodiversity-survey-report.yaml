reference: biodiversity-survey-report
local-authority: LDNPA
required-if:
  any:
  - condition:
      field: hydro-scheme
      value: true
      description: A hydro scheme.
  - condition:
      field: near-watercourse
      value: true
      description: Within or next to a lake.
  - site:
      in:
      - ancient-woodland
      description: In, or within 15m of, ancient semi-natural woodland.
  - condition:
      field: potential-roost-features
      value: true
      description: Works to the roof, eaves, stone faced walls, weather boarding or vertically hung slate
        of traditional agricultural buildings, buildings with slate roofs, stone walls, hanging slates
        or tiles or weather boarding (in particular within 400m of woodland or water), or any building
        in or next to woodland or next to water; or works to tunnels, mines, kilns, ice-houses, adits,
        fortifications, air raid shelters, cellars, unlined industrial chimneys, bridges, aqueducts or
        viaducts over water.
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting churches, listed buildings or green space (including sports pitches)
        within 50m of woodland, water, field hedgerows or connected lines of trees, or floodlighting the
        kinds of building above.
  - condition:
      field: tree-removal
      value: true
      description: Felling, removal or lopping of woodland, connected field hedgerows or lines of trees,
        old and veteran trees over 100 years old, or mature trees with holes, cracks, cavities or ivy
        (and large dead trees).
  - condition:
      field: wind-turbine
      value: true
      description: Development of wind turbines.
  - discretionary
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
source-text: A hydro scheme? Within or next to a lake? In, or within 15m of, ancient semi-natural woodland
  If the answer is yes to any of the above, an Ecological Assessment is required… ... If the answer is
  yes to any of the above, a bat survey is required…
confidence: medium
notes: From the authority's list (reviewed 6 August 2026), page 6. Covers the list's Ecological Assessment
  (item 13b) and Bat surveys (item 15, page 6). The per-type checklists also list a 'Protected species
  survey' as sometimes needed, with no trigger, which shows as 'check'. Uses the new field hydro-scheme.
  The per-type checklists on the 'Applying for planning permission' page (https://lakedistrict.gov.uk/planning/applying-for-planning-permission/)
  list it as 'sometimes' needed for householder, full, outline, section 73, reserved matters and listed
  building consent applications ('Bat survey').
review-status: unverified
field-status: {}
