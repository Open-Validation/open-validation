reference: construction-management-plan
local-authority: LDNPA
required-if:
  any:
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolishing an existing building.
    - condition:
        field: demolition-volume
        operator: '>'
        value: 50
        description: The building is over 50 cubic metres in volume.
  - all:
    - condition:
        field: building-works
        value: true
        description: Development other than change of use.
    - site:
        in:
        - special-area-of-conservation
        - site-of-special-scientific-interest
        - local-wildlife-site
        - ramsar
        - ancient-woodland
        description: Within a Special Area of Conservation or SSSI (non-riverine), or within 25m of a
          riverine SAC or SSSI; a County Wildlife Site; a Ramsar Site; a Local Geological and Geomorphological
          Site (not garden areas); a Limestone Pavement Area; or within 15m of ancient semi-natural woodland.
  - all:
    - condition:
        field: building-works
        value: true
        description: Development other than change of use.
    - condition:
        field: near-watercourse
        value: true
        description: In, or on the banks of, a watercourse or lake.
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
source-text: Demolishing an existing building which is over 50 cubic metres in volume? Development (other
  than change of use) within any of the following areas? • A Special Area of Conservation (non-riverine)
  • 25m of an Special Area of Conservation (riverine) • A Site of Special Scientific Interest (non-riverine)
  • 25m of a Site of Special Scientific Interest (riverine) • A County Wildlife Site • A Ramsar Site •
  A Local Geological and Geomorphological Site (LGS formerly RIGS, consult Cumbria GeoConservation) –
  Not required in garden areas • A Limestone Pavement Area • 15m of, ancient semi-natural woodland Development
  (other than change of use) in, or on the banks of, a watercourse or lake? If the answer is yes to any
  of the above, a construction method statement is
must-include:
- item: 'Proportionate details such as: timing and schedule of works; hours of working; sediment and pollution
    control; parking for site operatives and visitors; loading, unloading and storage areas; security
    hoarding; wheel washing; dust and dirt control; recycling or disposal of demolition and construction
    waste; access and haul routes'
  level: should
confidence: medium
notes: From the authority's list (reviewed 6 August 2026), page 6. Construction Method Statement. Uses
  the new field demolition-volume. The per-type checklists on the 'Applying for planning permission' page
  (https://lakedistrict.gov.uk/planning/applying-for-planning-permission/) list it as 'sometimes' needed
  for householder, full, outline, section 73, reserved matters and listed building consent applications.
  Contents from the authority's construction method statement validation guidance (https://lakedistrict.gov.uk/planning/planning-permission/planning-advice/planning-guides/construction-method-statement-validation-guidance/),
  which 'form part of our validation checklists'.
review-status: unverified
field-status: {}
