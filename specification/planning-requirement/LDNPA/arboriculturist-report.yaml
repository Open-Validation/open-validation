reference: arboriculturist-report
local-authority: LDNPA
required-if:
  any:
  - all:
    - condition:
        field: building-works
        value: true
        description: Development other than change of use.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Development (other than change of use) at or below ground level within 15m of trees.
  - site:
      in:
      - ancient-woodland
      description: Development within Ancient Semi Natural Woodland.
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
source-text: Development (other than change of use) at or below ground level within 15m of trees? If yes,
  a tree constraints plan is required… ... Development in the root protection area or beneath the canopy
  of trees as shown on the tree constraints plan (above)? Development within Ancient Semi Natural Woodland?
  If yes, a full tree survey is required…
must-include:
- item: 'A Tree Constraints Plan: a scaled site layout plan showing existing buildings, the proposed development
    and the trees on or next to the site, with each tree''s stem, canopy spread and root protection area
    (RPA capped at 707 m2)'
  level: must
- item: A full tree survey by a suitably qualified person where the development is in the root protection
    area or beneath the canopy of trees on the constraints plan, or within Ancient Semi Natural Woodland
  level: must
  required-if:
    any:
    - condition:
        field: tree-rpa-encroachment
        value: true
        description: Development in the root protection area or beneath the canopy of trees shown on the
          tree constraints plan.
    - site:
        in:
        - ancient-woodland
        description: Within Ancient Semi Natural Woodland.
  source-text: No. A full tree survey will need to be done by a suitably qualified person.
confidence: medium
notes: 'From the authority''s list (reviewed 6 August 2026), page 3. Covers the list''s Tree Constraints
  Plans (item 9) and Tree Surveys (item 10). Uses the new field tree-rpa-encroachment. The per-type checklists
  on the ''Applying for planning permission'' page (https://lakedistrict.gov.uk/planning/applying-for-planning-permission/)
  list it as ''sometimes'' needed for householder, full, outline, section 73 and reserved matters applications.
  Contents from the authority''s tree information validation guidance (Trees: What drawings do I need
  to include) (https://lakedistrict.gov.uk/wp-content/uploads/2025/12/Tree-information-validation-guidance.pdf),
  which ''form part of our validation checklists''.'
review-status: unverified
field-status: {}
