reference: arboriculturist-report
local-authority: LDNPA
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Development (other than change of use at or below ground level) within 15m of trees.
  - site:
      in:
      - ancient-woodland
      description: The development is in Ancient Semi-Natural Woodland.
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
source-text: Tree Surveys … If yes, a full tree survey is required…
must-include:
- item: Tree Constraints Plan
  level: must
- item: A full tree survey, where development is in the root protection area or under the canopy of trees
    on the tree constraints plan, or in Ancient Semi-Natural Woodland
  level: must
confidence: medium
notes: 'Audit (wrong_trigger, missing_requirement): sections 9 and 10. A Tree Constraints Plan is needed
  for development other than change of use at or below ground level within 15m of trees; a full tree survey
  where development is in the root protection area or under the canopy of those trees, or in Ancient Semi-Natural
  Woodland.'
review-status: unverified
field-status: {}
