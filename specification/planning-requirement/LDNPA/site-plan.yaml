reference: site-plan
local-authority: LDNPA
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline-all
      - outline-some
      - reserved-matters
      - lbc
      - non-material-amendment
  - all:
    - application-type:
        in:
        - s73
        - ldc-existing-use
        - ldc-prospective-use
        - ldc-proposed-work-lb
    - discretionary
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
source-text: Site layout drawings yes (existing and proposed)
must-include:
- item: Drawn at a metric scale, showing the direction of North
  level: must
  source-text: 'The site layout plan (also known as a block plan) should be drawn at a metric scale and
    should accurately show:'
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site
  level: should
- item: All buildings, roads and footpaths on adjoining land, including access arrangements, and all public
    rights of way crossing or adjoining the site
  level: should
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: should
- item: The extent and type of any hard surfacing, and proposed boundary treatment
  level: should
confidence: medium
notes: From the authority's list (reviewed 6 August 2026), page 1. Site layout drawings (existing and
  proposed). The per-type checklists list 'Existing and proposed plans' as always needed for householder,
  full, outline, reserved matters, listed building consent and non-material amendment applications, and
  'sometimes' for section 73 and lawful development certificates (so those show as 'check'). Contents
  from the authority's plans validation guidance (https://lakedistrict.gov.uk/planning/planning-permission/planning-advice/planning-guides/plans-validation-guidance/),
  which 'form part of our validation checklists'.
review-status: unverified
field-status: {}
