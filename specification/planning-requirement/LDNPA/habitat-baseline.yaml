reference: habitat-baseline
local-authority: LDNPA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition (not exempt).
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
policy: Environment Act 2021; Biodiversity Gain Requirements regulations
source-text: Is the development subject to BNG? ... If none of the above checked, then invalid without
  all of the following.
must-include:
- item: A plan drawn to an identified scale, showing the direction of North, of the onsite habitat existing
    on the date of application (or an agreed earlier date; for retrospective applications, before development),
    including any irreplaceable habitat
  level: must
- item: A description of any irreplaceable habitat (column 1 of the Schedule to the Biodiversity Gain
    Requirements (Irreplaceable Habitat) Regulations 2024) on the land
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: Irreplaceable habitat is on the land.
confidence: medium
notes: From the authority's list (reviewed 6 August 2026), page 4. Required by law for development subject
  to the biodiversity gain condition; the list names the exemptions it accepts (householder; no priority
  habitat impact on a site of no more than 0.2ha; no current biodiversity value; under 25m2 of habitat
  or 5m of linear habitat; some section 73 cases; development for another site's gain; retrospective non-householder
  applications go to 13a). Self-build and custom-build no longer exempt after 6 August 2026. The statement
  on how 10% BNG will be achieved has no id (unmapped).
review-status: unverified
field-status: {}
