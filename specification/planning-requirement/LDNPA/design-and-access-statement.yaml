reference: design-and-access-statement
local-authority: LDNPA
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates one or more houses.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: The proposal creates 100 square metres or more of floorspace.
  - site:
      in:
      - listed-building
      - conservation-area
      - scheduled-monument
      - park-and-garden
      description: The site is in the curtilage of a listed building, in a conservation area, or affects
        a scheduled monument or registered park.
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
source-text: Access and Heritage Statement is required.
confidence: medium
notes: 'Section 6 asks for one combined Design, Access and Heritage Statement; the same rule is under
  heritage-statement. From the audit: major development, 1+ houses, 100 sq m+, listed building consent,
  listed curtilage, conservation area, scheduled monument, registered park. Householder works in a conservation
  area or listed curtilage also trigger it.'
review-status: unverified
field-status: {}
