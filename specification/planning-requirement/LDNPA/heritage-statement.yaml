reference: heritage-statement
local-authority: LDNPA
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: The proposal creates one or more houses.
  - condition:
      field: floorspace
      operator: '>='
      value: 100
      description: The proposal creates 100 square metres or more of floorspace.
  - site:
      in:
      - listed-building
      - conservation-area
      - scheduled-monument
      - park-and-garden
      description: The site is in the curtilage of a listed building, in a conservation area, or affects
        a scheduled monument or registered park.
  - condition:
      field: eia-development
      value: true
      description: EIA development (Heritage Impact Assessment).
  - discretionary
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
source-text: Access and Heritage Statement is required.
must-include:
- item: A Heritage Impact Assessment (Appendix 3)
  level: must
  required-if:
    any:
    - condition:
        field: eia-development
        value: true
        description: EIA development.
    - discretionary
  source-text: applications for environmental impact assessment development and / or any application which
    we have screened at pre-application stage and have concluded that the development could significantly
    impact the significance of the attributes of Outstanding Universal Value of the Lake District World
    Heritage Site.
confidence: medium
notes: 'Audit (wrong_trigger, wrong_document): the Design, Access and Heritage Statement (section 6; the
  same rule is under design-and-access-statement) plus the Heritage Impact Assessment for the World Heritage
  Site (section 7), which the workbook had filed as an Environmental Statement. Schemes screened at pre-application
  stage as affecting the World Heritage Site are shown as officer discretion.'
review-status: unverified
field-status: {}
