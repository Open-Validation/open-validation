reference: heritage-statement
local-authority: LDNPA
required-if:
  any:
  - all:
    - any:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Providing one or more houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Providing buildings where the floor space created is 100 square metres or more.
      - site:
          in:
          - locally-listed-building
          description: Affecting unlisted buildings or structures identified as heritage assets in the
            Local Development Framework, Neighbourhood Plans or the Lake District Historic Environment
            Record.
      - application-type:
          in:
          - lbc
      - all:
        - site:
            in:
            - listed-building
            - conservation-area
            description: In the curtilage of a listed building, or in a Conservation Area.
        - condition:
            field: building-works
            value: true
            description: Development other than change of use.
      - site:
          in:
          - scheduled-monument
          - park-and-garden
          description: Affecting a Scheduled Ancient Monument or a Registered Park or Garden of Special
            Historic Interest.
    - condition:
        field: engineering-operations
        value: false
        description: Not engineering or mining operations, a change of use only, waste development or
          a section 73 application.
  - condition:
      field: eia-development
      value: true
      description: Environmental impact assessment development (Heritage Impact Assessment).
  - all:
    - site:
        in:
        - world-heritage-site
        description: In the Lake District World Heritage Site.
    - condition:
        field: pre-application-screening-whs
        value: true
        description: Screened at pre-application stage as possibly significantly impacting the attributes
          of Outstanding Universal Value of the World Heritage Site.
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
source-text: 'A planning application for major development? (if in Conservation Area and over 1000sq m
  consult Historic England) A planning application providing one or more houses? A planning application
  i providing buildings where the floor space created is 100 square metres or more? Development affecting
  unlisted buildings or structures identified as heritage assets in the Local Development Framework, by
  Neighbourhood Plans as locally important heritage assets, or by the Lake District Historic Environment
  Record? An application for listed building consent? (if Grade I or II* consult Historic England) In
  the curtilage of a listed building and development other than change of use? In a Conservation Area
  and development other than change of use? Affecting a Scheduled Ancient Monument? (consult Historic
  England) Affecting a Registered Park or Garden of Special Historic Interest? Consult the Gardens Trust
  (consult@thegardenstrust.org) If Grade I or II* consult Historic England If the answer is yes to any
  of the above, a Design, Access and Heritage Statement is required. ... This does not apply to: • S73
  applications • Engineering or mining operations • Change of use only • Waste development ... You must
  submit a Heritage Impact Assessment (Appendix 3) for all applications for environmental impact assessment
  development and / or any application which we have screened at pre-application stage and have concluded
  that the development could significantly impact the significance of the attributes of Outstanding Universal
  Value of the Lake District World Heritage Site.'
must-include:
- item: 'For EIA development or a screened World Heritage Site case: a Heritage Impact Assessment (Appendix
    3)'
  level: must
  required-if:
    any:
    - condition:
        field: eia-development
        value: true
        description: EIA development.
    - condition:
        field: pre-application-screening-whs
        value: true
        description: Screened as possibly significantly impacting the World Heritage Site's Outstanding
          Universal Value.
confidence: medium
notes: From the authority's list (reviewed 6 August 2026), page 2. The list asks for one combined 'Design,
  Access and Heritage Statement'. Not needed for section 73 applications, engineering or mining operations,
  a change of use only or waste development (the 'engineering-operations' condition and the application
  types stand for these). Includes the list's Heritage Impact Assessment (item 7, page 2). The per-type
  checklists list a heritage statement as always needed for listed building consent (and, oddly, both
  'always' and 'sometimes' for outline applications with all matters reserved). Uses the new field pre-application-screening-whs.
review-status: unverified
field-status: {}
