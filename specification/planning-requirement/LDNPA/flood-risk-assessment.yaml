reference: flood-risk-assessment
local-authority: LDNPA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Risk Zone 2 or 3.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Flood Zone 1 and one hectare or more in site area.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Flood Zone 1 and one hectare or more in site area.
  - condition:
      field: near-watercourse
      value: true
      description: Within the buffer zone of a Main River.
  - site:
      in:
      - surface-water-flood-risk
      description: On land at risk of surface water flooding.
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
policy: NPPF Annex F
source-text: In Flood Risk Zone 3? In Flood Risk Zone 2? In Flood Risk Zone 1 and one hectare or more
  in site area? Within buffer zone of Main River? On land at risk of surface water flooding? If the answer
  is yes to any of the above, a Flood Risk Assessment is required.
must-include:
- item: How flood risk will be managed now and over the development's lifetime, taking climate change
    into account, and with regard to the vulnerability of its users
  level: must
  source-text: Your site specific flood risk assessment should demonstrate how flood risk will be managed
    now and over the development’s lifetime, taking climate change into account, and with regard to the
    vulnerability of the development’s users.
confidence: medium
notes: From the authority's list (reviewed 6 August 2026), page 3. The flood risk guidance also names
  Flood Zone 1 land with critical drainage problems or at risk from any source now or in future. Contents
  from the authority's flood risk assessment validation guidance (https://lakedistrict.gov.uk/planning/planning-permission/planning-advice/planning-guides/flood-risk-assessment-validation-guidance/),
  which 'form part of our validation checklists'.
review-status: unverified
field-status: {}
