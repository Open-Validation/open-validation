reference: water-impact-assessment
local-authority: LDNPA
required-if:
  all:
  - site:
      in:
      - nutrient-neutrality-area
      description: The site is within Natural England's Nutrient Neutrality Catchment Areas.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New overnight accommodation (including new dwellings, camping, glamping or caravan
          pitches served by on-site toilet or washing facilities, or new hotel bedrooms).
    - discretionary
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/02/Validation-Checklist-August-2025.pdf
source-text: Nutrient Neutrality Is the proposal… Within Natural England’s Nutrient Neutrality Catchment
  Areas? … If yes, is the proposal for… New overnight accommodation (including new dwellings, new camping,
  glamping or caravan pitches served by on-site toilet or washing facilities, or new hotel bedroom accommodation)
  New tourism development which is likely to increase the number of day visitors to a premises Agricultural
  development which will resu…
must-include:
- item: Completed Natural England nutrient neutrality budget calculator for the relevant catchment
  level: must
- item: Nutrient neutrality mitigation strategy
  level: must
- item: Evidence that all proposed thresholds for small discharges to ground as set out in Natural England
    Nutrient Neutrality Advice are met
  level: must
- item: A shadow Habitats Regulations Assessment (Option 1)
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): nutrient neutrality applies only within the catchments, and only to new
  overnight accommodation, tourism development increasing day visitors, or agricultural development increasing
  stock (the last two are shown as officer discretion). Householder, B2/B8, Class E and most F uses are
  excepted (section 19).'
review-status: unverified
field-status: {}
