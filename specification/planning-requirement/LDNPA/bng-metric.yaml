reference: bng-metric
local-authority: LDNPA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition (not exempt).
source-url: https://lakedistrict.gov.uk/wp-content/uploads/2026/08/Validation-Checklist-Post-6-August-2026-updated-BNG.pdf
policy: Environment Act 2021; Biodiversity Gain Requirements regulations
source-text: Is the development subject to BNG? ... If none of the above checked, then invalid without
  all of the following.
must-include:
- item: The pre-development biodiversity value of the onsite habitat on the date of application (or an
    earlier date), with the completed official metric calculation tool showing the calculations, the publication
    date and the version used
  level: must
- item: The metric as an Excel file (screenshots or PDFs are not enough without the original Excel file)
  level: must
  source-text: NB The metric must be an Excel file. Screenshots or pdfs are insufficient unless the original
    Excel file is provided
- item: Who completed the metric and why they are competent to do so to a professional standard
  level: must
- item: 'Where an earlier date is used: the proposed date and the reasons'
  level: must
  required-if:
    condition:
      field: earlier-baseline-date
      value: true
      description: The applicant wishes to use an earlier date.
- item: A statement on whether the onsite habitat value is lower because of degradation, with supporting
    evidence if so
  level: must
- item: 'Retrospective applications: the pre-development value at January 2020 and the post-development
    value, each with the completed metric'
  level: must
  required-if:
    condition:
      field: retrospective
      value: true
      description: A retrospective (section 73A) application.
confidence: medium
notes: From the authority's list (reviewed 6 August 2026), page 4. 'Applies to All Applications received
  from 6 August 2026 onwards.' Required by law for development subject to the biodiversity gain condition;
  the list names the exemptions it accepts (householder; no priority habitat impact on a site of no more
  than 0.2ha; no current biodiversity value; under 25m2 of habitat or 5m of linear habitat; some section
  73 cases; development for another site's gain; retrospective non-householder applications go to 13a).
  Self-build and custom-build no longer exempt after 6 August 2026. The statement on how 10% BNG will
  be achieved has no id (unmapped). The per-type checklists on the 'Applying for planning permission'
  page (https://lakedistrict.gov.uk/planning/applying-for-planning-permission/) list it as 'sometimes'
  needed for full, outline and section 73 applications ('Biodiversity net gain information').
review-status: unverified
field-status: {}
