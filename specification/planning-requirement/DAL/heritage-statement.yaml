reference: heritage-statement
local-authority: DAL
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - scheduled-monument
      - listed-building
      description: Planning permission that impacts Scheduled Monuments or Listed Buildings.
  - site:
      in:
      - conservation-area
      description: Developments in Conservation Areas.
source-url: https://www.darlington.gov.uk/planning-and-building-regs/planning/planning-application-and-permission/validating-your-application/
source-text: Supporting applications for Listed Building Consent and Conservation Area Consent. For planning
  permission that impacts Scheduled Monuments or Listed Buildings and for developments in Conservation
  Areas.
must-include:
- item: Proportionate to the scale of work and the significance of the heritage asset; for minor development
    this can be a letter
  level: should
- item: As a minimum, the relevant Historic Environment Record consulted
  level: must
- item: 'Description of the heritage asset''s significance: the reason it is designated, its age, character
    and appearance'
  level: must
- item: Description of the change proposed, with justification why it is needed and how it will take place
  level: must
- item: Assessment of the impact on significance
  level: must
- item: The sources considered and the expertise consulted
  level: must
confidence: medium
notes: 'From the council''s validation web pages (no dated local list is published: the council''s checklists
  are marked ''Currently being updated''), ''Validating your application'' page; ''Preparing Heritage
  Statements and Design and Access Statements'' guidance (v3.6, February 2025), page 1. Contents come
  from the council''s heritage statement guidance, which says applications without this information will
  be invalidated. ''Conservation Area Consent'' is now planning permission for relevant demolition in
  a conservation area.'
review-status: unverified
field-status: {}
