reference: sketch-plan
local-authority: DAL
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
    - advertising
source-url: https://www.darlington.gov.uk/planning-and-building-regs/planning/planning-application-and-permission/validating-your-application/
source-text: Your plan needs to show the precise location of the tree(s) in relation to nearby property/roads/boundaries.
  … With some types of applications (tree pruning, tree felling or advertising signs) a separate plan
  is not needed as long as the site is not difficult to identify. A clear sketch is enough
must-include:
- item: Surrounding roads marked and named; buildings, including adjoining properties, sketched in with
    house numbers or names
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Position of each tree to be worked on, identified by its Tree Preservation Order number where
    possible (or a number matching the description)
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: 'Where there are many trees: all trees marked but only the application trees numbered'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Approximate distance between the application trees and buildings; other relevant features such
    as greenhouses and paths
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Size and position of the advertisement sign
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: For an advertisement sign we will need the size and its position.
confidence: medium
notes: 'From the council''s validation web pages (no dated local list is published: the council''s checklists
  are marked ''Currently being updated''), ''Validating your application'' page; ''Site location plan''
  page. Uses MHCLG''s retired sketch-plan id. The sketch need not be to scale, and can go on the back
  of the form, as long as the site is not difficult to identify.'
review-status: unverified
field-status: {}
