reference: condition-of-trees
local-authority: DAL
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - condition:
      field: tree-condition-reasons
      value: true
      description: Trees are thought to be dead, dying or diseased.
source-url: https://www.darlington.gov.uk/planning-and-building-regs/planning/planning-application-and-permission/validating-your-application/
source-text: Where trees are thought be to dead, dying or diseased, appropriate arboricultural advice
  should be sought from by a qualified arborist and their report submitted for the council to consider.
must-include:
- item: Report from a qualified arborist
  level: should
confidence: medium
notes: 'From the council''s validation web pages (no dated local list is published: the council''s checklists
  are marked ''Currently being updated''), ''Validating your application'' page. The page says the advice
  ''should be sought'' and requests without qualified evidence are unlikely to be supported.'
review-status: unverified
field-status: {}
