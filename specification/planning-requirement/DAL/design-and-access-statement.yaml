reference: design-and-access-statement
local-authority: DAL
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is within a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: The proposal provides one or more new dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: The proposal creates a building with 100 square metres or more of floorspace.
source-url: https://www.darlington.gov.uk/planning-and-building-regs/planning/planning-application-and-permission/validating-your-application/design-and-access-statements/
source-text: 'Design and Access Statements (DAS) are required for: major developments (full and outline)
  listed building applications developments within a conservation area for the provision of new dwelling(s),
  or a building where the floor space created is 100m 2 or more.'
confidence: medium
notes: 'Audit (wrong_trigger): the excerpt began with page-title noise, and the new-dwelling and 100m2
  tests apply only within conservation areas.'
