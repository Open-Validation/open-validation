reference: design-and-access-statement
local-authority: DAL
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: Within a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Provision of new dwelling(s).
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building where the floor space created is 100m2 or more.
source-url: https://www.darlington.gov.uk/planning-and-building-regs/planning/planning-application-and-permission/validating-your-application/design-and-access-statements/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Design and Access Statements (DAS) are required for: major developments (full and outline)
  listed building applications developments within a conservation area for the provision of new dwelling(s),
  or a building where the floor space created is 100m2 or more.'
must-include:
- item: 'Design component: assessment, involvement, evaluation and design for land use, amount, layout,
    scale, landscaping and appearance'
  level: must
- item: 'Access component: transport links, integration with public transport and provision for inclusive
    access regardless of age, disability, ethnicity or social grouping'
  level: must
- item: 'Sustainability component: how the appropriate Code for Sustainable Homes or BREEAM standard is
    met (reuse of land and buildings, natural systems, conserving energy, materials and water, noise,
    pollution and microclimate, comfort and security, natural environment and biodiversity, sustainable
    waste and construction)'
  level: must
- item: Provision for vehicles and inclusive access
  level: must
- item: The completed renewable energy matrix, for major developments (10 dwellings or 1000m2 of non-residential
    floorspace)
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>='
        value: 1000
        description: 1000m2 of non-residential floorspace.
- item: 'Where a planning application goes in alongside listed building consent: a single combined statement
    covering design, access and impact on heritage assets'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: 'NB: where a planning application is submitted in parallel with an application for Listed
    Building consent, a single, combined statement should address the requirements of design, access and
    impact on Heritage Assets.'
confidence: medium
notes: 'From the council''s validation web pages (no dated local list is published: the council''s checklists
  are marked ''Currently being updated''), ''Design and Access Statements'' page (last updated 21 February
  2025); ''Preparing Heritage Statements and Design and Access Statements'' guidance (v3.6, February 2025),
  page 2. The guidance lists cases where no statement is needed: house extensions, changes of use with
  no works, non-domestic extensions under 100 m2, means of enclosure, non-material amendments, engineering
  or mining operations, advertisements, waste development, tree works, certificates of lawfulness and
  prior notifications.'
review-status: unverified
field-status: {}
