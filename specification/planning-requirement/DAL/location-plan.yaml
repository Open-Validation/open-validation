reference: location-plan
local-authority: DAL
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - s73
      - change-of-use
      - demolition-con-area
      - ldc
      - prior-approval
  - discretionary
source-url: https://www.darlington.gov.uk/planning-and-building-regs/planning/planning-application-and-permission/validating-your-application/site-location-plan/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Most applications require a site location plan. It needs to be an Ordnance Survey map (usually
  A4 size and 1:1250 or 1:2500 scale) with the boundary marked in red. … With some types of applications
  (tree pruning, tree felling or advertising signs) a separate plan is not needed as long as the site
  is not difficult to identify.
must-include:
- item: Up-to-date Ordnance Survey base map where possible; not a photocopied map or a Land Registry plan,
    and not reused from another application
  level: must
- item: Usually A4 (A3 for bigger sites) at 1:1250 (1:2500 for bigger sites)
  level: should
- item: Site boundary drawn in red, enclosing the whole development area (usually the property boundary,
    including new access paths)
  level: must
- item: Any adjacent land owned by the applicant outlined in blue
  level: must
- item: The site in the centre of the plan rather than near the edge
  level: should
confidence: medium
notes: 'From the council''s validation web pages (no dated local list is published: the council''s checklists
  are marked ''Currently being updated''), ''Validating your application'' page; ''Site location plan''
  page. ''Most applications'' need one, so the main application types are listed; tree and advertisement
  applications can use a clear sketch instead (see sketch-plan). Other types are discretionary.'
review-status: unverified
field-status: {}
