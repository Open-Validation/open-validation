reference: energy-statement
local-authority: DAL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 dwellings.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 1000
      description: 1000m2 of non-residential floorspace.
source-url: https://www.darlington.gov.uk/planning-and-building-regs/planning/planning-application-and-permission/validating-your-application/design-and-access-statements/
source-text: The renewable energy matrix [pdf document] should be completed for major developments. These
  developments include 10 dwellings or 1000m2 of non-residential floorspace. It needs to explain the chosen
  technologies that will be used and how they will be included into the design.
must-include:
- item: 'Predicted energy supply: total baseline energy (electrical and heating) built to current Part
    L minimum, plus 20% for unregulated energy'
  level: must
- item: Measures proposed for energy efficiency, to meet the appropriate Code for Sustainable Homes/BREEAM
    level
  level: must
- item: Actual predicted annual energy demand after efficiency measures, for heating (and cooling), hot
    water, lighting and electrical appliances, in kWh/year
  level: must
- item: 'Amount of renewable energy to be generated: at least 10% for major developments (contributing
    to 20% targets in named strategic locations)'
  level: must
- item: The renewable energy measures chosen, with the range of options considered to show the chosen
    solution is viable
  level: must
- item: The completed renewable energy matrix, submitted with the Design and Access Statement
  level: must
confidence: medium
notes: 'From the council''s validation web pages (no dated local list is published: the council''s checklists
  are marked ''Currently being updated''), ''Design and Access Statements'' page (last updated 21 February
  2025); Renewable Energy Matrix. The Renewable Energy Matrix (2011) sets out the method and the table
  to complete.'
review-status: unverified
field-status: {}
