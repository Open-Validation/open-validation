reference: structural-damage
local-authority: DAL
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - condition:
      field: structural-damage-alleged
      value: true
      description: The works to protected trees involve damage to structures.
source-url: https://www.darlington.gov.uk/planning-and-building-regs/planning/planning-application-and-permission/validating-your-application/
source-text: If you are applying for work to trees that are the subject to Tree Preservation Orders, or
  within a designated Conservation Area, which involve damage to structures, we insist that a structural
  report to accompany the application is submitted by a qualified person, e.g. a structural engineer.
must-include:
- item: Professional report by a qualified person, e.g. a structural engineer
  level: must
confidence: medium
notes: 'From the council''s validation web pages (no dated local list is published: the council''s checklists
  are marked ''Currently being updated''), ''Validating your application'' page. Without a professional
  report the application will not be valid.'
review-status: unverified
field-status: {}
