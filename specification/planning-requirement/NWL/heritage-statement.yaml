reference: heritage-statement
local-authority: NWL
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - any:
      - ref: major-development
      - site:
          in:
          - historic-environment-record
          description: The site has an entry in the Leicestershire and Rutland Historic Environment Record.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: NPPF (2012) paragraph 128
source-text: All Major applications and any site with an entry in the Leicestershire and Rutland Historic
  Environment Record. … All applications - may be included in Design and Access Statement (Should be clearly
  identified)
must-include:
- item: Describes the significance of the heritage assets affected, including any contribution of their
    setting
  level: must
- item: Photos of the parts of the building affected by the works
  level: should
- item: 'Listed building consent: a schedule of works, an analysis of the significance of archaeology,
    history and character of the building, the principles of and justification for the works, and their
    impact on the building, its setting and the setting of adjacent listed buildings'
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: 'Conservation area consent: a structural survey, an analysis of the character and appearance of
    the building, and the principles of and justification for the demolition and its impact on the area'
  level: should
  required-if:
    application-type:
      in:
      - demolition-con-area
- item: 'Where ground is disturbed in an Area of Archaeological Significance or for major development:
    an assessment of existing archaeological information'
  level: should
  required-if:
    any:
    - site:
        in:
        - archaeological-priority-area
        description: An Area of Archaeological Significance.
    - ref: major-development
- item: Clearly identified if included in the Design and Access Statement
  level: must
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 10-25, 27, 48-49. Called Heritage Statement
  (including historical, archaeological features and Scheduled Ancient Monuments). 'All applications'
  for listed building consent and conservation area consent (alone or combined with householder or planning
  applications).
review-status: unverified
field-status: {}
