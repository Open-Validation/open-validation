reference: heritage-statement
local-authority: NWL
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - ref: major-development
      - site:
          in:
          - historic-environment-record
          description: The site has an entry in the Leicestershire and Rutland HER.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
must-include:
- item: A schedule of works to the listed building(s), an analysis of the significance of its archaeology,
    history and character, and the principles of and justification for the works and their impact on its
    special character and setting
  level: should
  required-if:
    application-type:
      in:
      - lbc
  source-text: that includes a schedule of works to the Listed Building(s), an analysis of the significance
    of archaeology, history and character of the building/structure, the principles of and justification
    for the proposed works and their impact on the special character of the Listed Building or structure,
    its setting and the setting of adjacent Listed Buildings may be required.
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): from the audit, all major applications and any site with
  an entry in the Leicestershire and Rutland HER; all applications for CA consent and LBC types (including
  householder + CA/LBC).'
review-status: unverified
field-status: {}
