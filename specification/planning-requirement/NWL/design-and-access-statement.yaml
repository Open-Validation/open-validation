reference: design-and-access-statement
local-authority: NWL
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Over 100 square metres of floor space.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
confidence: medium
notes: 'Audit (wrong_trigger): the workbook gave the Householder threshold (''Development creating over
  100 square metres of floor space in a conservation area''). From the audit, Full: major development,
  or in a CA one or more dwellings or 100 sq m.'
review-status: unverified
field-status: {}
