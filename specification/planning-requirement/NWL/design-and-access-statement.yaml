reference: design-and-access-statement
local-authority: NWL
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
        - hh
    - site:
        in:
        - conservation-area
        description: Development in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Creating one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: Creating over 100 square metres of floor space.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: Town and Country Planning (Development Management Procedure) (England) Order (as amended June
  2013)
source-text: Major development. Development in a conservation area creating, one or more dwellinghouses
  or over 100 square metres of floor space. … Development creating over 100 square metres of floor space
  in a conservation area. … All applications
must-include:
- item: Explains the design principles and concepts applied to the development
  level: should
- item: Demonstrates the steps taken to appraise the context of the development and how the design takes
    it into account
  level: should
- item: Explains the policy adopted as to access, and how access policies in relevant local development
    documents have been taken into account
  level: should
- item: States what consultation has been undertaken on access and what account has been taken of it
  level: should
- item: Explains how any specific issues which might affect access have been addressed
  level: should
- item: The special architectural or historic interest of the building and how it is to be preserved or
    enhanced
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: The particular physical features of the building that justify its listing
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: The building's setting
  level: should
  required-if:
    application-type:
      in:
      - lbc
- item: Where appropriate, how the approach to access balances disability duties and the building's historic/architectural
    significance
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 9-25, 27, 44. 'All applications' for listed
  building consent (alone or combined). Not needed for s73 applications, renewals, engineering or mining
  operations, material changes of use or waste development (Appendix I).
review-status: unverified
field-status: {}
