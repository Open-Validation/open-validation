reference: viability-assessment
local-authority: NWL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - condition:
        field: affordable-housing-below-target
        value: true
        description: The applicant seeks an exception to affordable housing policy on the basis of a financial
          case.
    - discretionary
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: NPPF (2012) paragraphs 50 and 205
source-text: Where this is based on a financial case a Viability Assessment shall be carried out by a
  suitably qualified valuer. … Where viability is an issue.
must-include:
- item: Carried out by a suitably qualified valuer
  level: must
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 12, 14, 16, 18, 20, 22, 46-48. From the affordable
  housing statement guidance (Appendix II, 14). The list's 'Economic statement' row ('Where viability
  is an issue', shown as discretionary) asks for viability information too; its regeneration-benefits
  part is in the scratchpad unmapped list.
review-status: unverified
field-status: {}
