reference: elevation-existing
local-authority: NWL
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - ldc-prospective-use
      - reserved-matters
      - advertising
  - all:
    - application-type:
        in:
        - ldc-existing-use
    - condition:
        field: external-alterations
        value: true
        description: The development included alterations to elevations.
  - all:
    - application-type:
        in:
        - outline-some
    - discretionary
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
source-text: As necessary to clearly show the proposed works in relation to what is already there. Scale
  1:50 or 1:100 … If development included alterations to elevations
must-include:
- item: At a standardised metric scale, preferably 1:50 or 1:100
  level: should
- item: Critical dimensions
  level: must
- item: Clearly shows the proposed works in relation to what is already there
  level: must
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 9-13, 14, 19-29, 37, 46. The list's threshold
  is 'As necessary to clearly show the proposed works in relation to what is already there', which describes
  what the drawings must show; they are treated as needed for these application types. For outline applications
  with some matters reserved, the plans are needed only if the matters they show (appearance or scale;
  for sections also layout or landscaping) are not reserved, so outline is shown as discretionary.
review-status: unverified
field-status: {}
