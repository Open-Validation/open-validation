reference: land-contamination-assessment
local-authority: NWL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: NPPF (2012) paragraph 121
source-text: Where contamination is known or suspected
must-include:
- item: Enough information to determine whether contamination exists, its nature and the risks it may
    pose
  level: must
- item: Whether the risks can be satisfactorily reduced to an acceptable level
  level: must
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 13, 15, 17, 19, 21, 23, 49.
review-status: unverified
field-status: {}
