  notes: Grokbot links to and dates the right document (the joint Leicestershire and Rutland list, adopted
    July 2013, still current for NWL), but its extraction is poor. It misses the River Mease SAC report,
    which is specific to NWL, along with Building for Life 12, land contamination, noise, open space,
    aviation and birdstrike. It files Coal Mining only under Householder, the one type it excludes, and
    leaves Outline, Reserved matters, Advertisement, CA demolition and LDC empty even though each has
    its own proforma. Many of its Full planning rows are glossary items, boilerplate or misattributed
    excerpts, including a Rutland-only SPA requirement and a Householder FRA trigger that does not apply
    to Full planning.
notes: 'Reorganisation: LGR: July 2026 decision for Leicestershire, Leicester and Rutland paused 7 Sep
