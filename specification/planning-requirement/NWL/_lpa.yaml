submission-standards:
- item: All plans include critical dimensions
  level: must
- item: Plans drawn to a standardised metric scale (site/block plan preferably 1:100 or 1:200; elevations,
    floor plans, sections and roof plans preferably 1:50 or 1:100)
  level: should
- item: Electronic submission encouraged; no paper copies needed if submitted electronically
  level: should
- item: Plans larger than A3 are not accepted by post or by hand at the Customer Service Centre
  level: must
- item: Revised details submitted after validation are accompanied by a schedule clearly setting out the
    changes
  level: must
