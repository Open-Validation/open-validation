reference: photos
local-authority: NWL
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
      - pa-demo-building
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-hoarding
        value: true
        description: Hoardings are proposed.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: NPPF (2012) paragraphs 58 and 141
source-text: All applications … When hoardings are proposed … All applications - to record development
  proposed to be demolished
must-include:
- item: The whole building and its setting and/or the particular section of the building affected by the
    proposals
  level: must
- item: 'Prior notification of demolition: records the development proposed to be demolished'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 10, 11, 19, 21, 23-27, 36, 50. Called Photographs/photomontages.
  'All applications' in the conservation area consent and listed building consent proformas (alone or
  combined with householder or planning applications).
