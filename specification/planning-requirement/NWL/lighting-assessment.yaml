reference: lighting-assessment
local-authority: NWL
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated advertisements are proposed.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
source-text: countryside, where external lighting would be provided or made necessary by the development,
  should be accompanied by details of the proposed external lighting and the hours when the lighting would
  be switched on.
must-include:
- item: Details of the proposed external lighting
  level: must
- item: The hours when the lighting would be switched on
  level: must
- item: An 'isolux' or similar drawing showing luminance at specified heights above ground
  level: should
  required-if: discretionary
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The excerpt starts
  mid-sentence ('countryside, where external lighting ...'), so the location part of the trigger is cut
  off. Isolux drawings 'may also be requested' for sensitive proposals such as sports floodlighting in
  rural or residential areas.
review-status: unverified
field-status: {}
