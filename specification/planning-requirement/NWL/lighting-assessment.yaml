reference: lighting-assessment
local-authority: NWL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - any:
      - condition:
          field: floodlighting
          value: true
          description: The proposal includes floodlighting.
      - all:
        - condition:
            field: external-lighting
            value: true
            description: Illumination is proposed for particularly sensitive proposals (e.g. illumination
              of car parks).
        - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated advertisements are proposed.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: NPPF (2012) paragraph 125
source-text: Where proposal includes floodlighting or where illumination is proposed for particularly
  sensitive proposals (e.g. illumination of car parks) … When illuminated advertisements are proposed
must-include:
- item: Details of the proposed external lighting and the hours when it would be switched on
  level: should
- item: A layout plan with beam orientation
  level: should
- item: A schedule of the equipment in the design
  level: should
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 13, 15, 17, 19, 21, 22, 26, 27, 50. 'Particularly
  sensitive proposals' is shown as discretionary. An isolux drawing may also be requested for particularly
  sensitive proposals or sites.
review-status: unverified
field-status: {}
