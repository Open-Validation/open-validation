policy: Town and Country Planning (Development Management Procedure) (England) Order
source-text: All applications – include North Point and suggested scale is 1:1250 or 1:2500 … All applications
  must include copies of a location plan based on an up-to-date map.
must-include:
- item: North point
  level: must
- item: At a standardised metric scale, preferably 1:1250 or 1:2500
  level: should
- item: Based on an up-to-date map
  level: must
- item: At least two named roads and surrounding buildings, wherever possible
  level: should
- item: Properties shown numbered or named so the exact location of the site is clear
  level: should
- item: Application site edged clearly in red, including all land needed for the development (e.g. access
    from a public highway, visibility splays, landscaping, car parking and open areas around buildings)
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 9-36, 44.
