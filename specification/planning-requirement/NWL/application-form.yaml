reference: application-form
local-authority: NWL
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - demolition-con-area
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-fish-struct
      - pa-ecomms-network
      - pa-demo-building
      - hedgerow-removal
      - reserved-matters
      - s73
      - consent-under-tpo
      - non-material-amendment
  - all:
    - application-type:
        in:
        - notice-trees-in-con-area
    - discretionary
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: Town and Country Planning (Development Management Procedure) (England) Order
source-text: All applications … Written description of development and proposed materials. Standard application
  form preferred on all applications … In writing identifying the outline planning permission and the
  matters approval is sought. Standard application form preferred on all submissions … All TPO applications
  (desirable for works to trees in Conservation Area)
must-include:
- item: Ownership certificate (A, B, C or D) completed
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - demolition-con-area
      - lbc
      - s73
      - non-material-amendment
- item: Notices served on owners, as required depending on ownership of the site
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - demolition-con-area
      - lbc
      - s73
      - non-material-amendment
- item: Agricultural land declaration completed and signed
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - s73
- item: 'Prior notifications: a written description of the development and the proposed materials'
  level: must
  required-if:
    application-type:
      in:
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-excavate-agri
      - pa-fish-struct
      - pa-ecomms-network
      - pa-demo-building
- item: 'Reserved matters: identifies the outline planning permission and the matters for which approval
    is sought'
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
- item: 'Non-material amendment: identifies the original planning permission and the proposed amendments'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 9-42, 44-45. Called the Standard application
  form. For works to trees in a conservation area the form is only 'desirable' (shown as discretionary).
  A fee is needed for all applications unless exempt (no requirement id for the fee).
review-status: unverified
field-status: {}
