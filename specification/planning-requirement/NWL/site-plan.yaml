reference: site-plan
local-authority: NWL
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - demolition-con-area
      - lbc
      - advertising
      - ldc-existing-use
      - ldc-prospective-use
      - hedgerow-removal
  - all:
    - application-type:
        in:
        - pa-build-agri-forest
        - pa-road-agri-forest
        - pa-excavate-agri
        - pa-fish-struct
        - pa-ecomms-network
        - pa-demo-building
    - discretionary
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - condition:
        field: amends-approved-plans
        value: true
        description: The revised scheme affects the originally submitted plan.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: Town and Country Planning (Development Management Procedure) (England) Order
source-text: All applications – suggested scale 1:100, 1:200 or 1:500 (except where the information is
  only a duplication of that clearly visible and identifiable on the location plan) … All applications
  if location plan does not clearly identify the site – preferred scale 1:100, 1:200 or 1:500 … Where
  scheme revised affects originally submitted plan
must-include:
- item: Suggested scale 1:100, 1:200 or 1:500 (on larger sites a master plan at 1:500 or similar)
  level: should
- item: Both existing and proposed development
  level: must
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with written dimensions including those to the boundaries
  level: must
- item: All buildings, roads and footpaths on adjoining land, including access arrangements, unless they
    would not influence or be affected by the development
  level: must
- item: All public rights of way crossing or adjoining the site, unless they would not influence or be
    affected by the development
  level: must
- item: The position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: must
- item: The extent and type of any hard surfacing, unless it would not influence or be affected by the
    development
  level: must
- item: Boundary treatment, including the type and height of walls or fencing, where proposed
  level: must
- item: The position of any river, pond or other water feature on or adjacent to the site, unless it would
    not influence or be affected by the development
  level: must
- item: Existing and proposed signage
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: All existing development, indicating the part of the land each use, operation or matter relates
    to
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 9-38, 44-45. Not needed where it would only
  duplicate what the location plan clearly shows. For prior notifications it is needed only if the location
  plan does not clearly identify the site, and for reserved matters 'as necessary' (both shown as discretionary).
review-status: unverified
field-status: {}
