reference: affordable-housing-statement
local-authority: NWL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - discretionary
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: NPPF (2012) paragraph 50
source-text: If development meets Local Planning Authority threshold as specified in LPA’s Development
  Plan.
must-include:
- item: The numbers of residential units and the mix of units, with numbers of habitable rooms and/or
    bedrooms, or the floor space of habitable areas
  level: should
- item: Plans showing the location of units and their number of habitable rooms and/or bedrooms and/or
    floor space
  level: should
- item: A clear and full explanation of any different levels or types of affordability or tenure for different
    units
  level: should
- item: Details of any Registered Social Landlords acting as partners in the development
  level: should
- item: Full justification of any exception to affordable housing policy
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: The applicant seeks an exception to affordable housing policy.
confidence: medium
notes: 'From the council''s list (adopted 1 July 2013), pages 12, 14, 16, 18, 20, 22, 46-47. Shown as
  discretionary: the threshold is in the council''s Development Plan, not in the list.'
review-status: unverified
field-status: {}
