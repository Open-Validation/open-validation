reference: section-proposed
local-authority: NWL
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - lbc
        - ldc-prospective-use
        - reserved-matters
    - any:
      - condition:
          field: new-build
          value: true
          description: The application involves new buildings.
      - condition:
          field: change-in-ground-levels
          value: true
          description: The proposal involves a change in ground levels.
      - discretionary
  - all:
    - application-type:
        in:
        - outline-some
        - advertising
    - discretionary
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
source-text: As necessary to clearly show the proposed works in relation to what is already there. Scale
  1:50 or 1:100 … This will be required for all applications involving new buildings.
must-include:
- item: At a standardised metric scale, preferably 1:50 or 1:100
  level: should
- item: Critical dimensions
  level: must
- item: A cross section(s) through the proposed building(s)
  level: must
- item: Existing and finished levels, including details of foundations and eaves and how encroachment
    onto adjoining land is avoided
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
- item: Existing site levels and finished floor levels, related to a fixed datum point off site
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The application involves new buildings.
- item: The proposals in relation to adjoining buildings
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: The application involves new buildings.
- item: The advertisement's projection/depth in relation to what is already there
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 9-13, 14, 19-26, 29, 37, 46. Called Existing
  and Proposed Site Sections, Finished Floor and Site Levels. Appendix II says they are required for all
  applications involving new buildings and wherever ground levels change; for extensions the levels may
  be evident from the floor plans and elevations, so other cases are discretionary. For outline applications
  with some matters reserved, the plans are needed only if the matters they show (appearance or scale;
  for sections also layout or landscaping) are not reserved, so outline is shown as discretionary. For
  advertisements, sections are needed 'as necessary' to show projection/depth.
review-status: unverified
field-status: {}
