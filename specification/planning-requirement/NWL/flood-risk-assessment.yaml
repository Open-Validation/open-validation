reference: flood-risk-assessment
local-authority: NWL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: near-watercourse
        value: true
        description: Within Main river bye-law distance.
    - site:
        in:
        - flood-risk-zone
        description: Within flood zones 2 and 3.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: A site greater than 1 hectare in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: A site greater than 1 hectare in Flood Zone 1.
    - all:
      - ref: major-development
      - site:
          in:
          - critical-drainage-area
          description: Non-minor development in a critical drainage area.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
source-text: Where the development is proposed within Main river bye-law distance or where the development
  is within flood zones 2 & 3 or the site is greater than 1 hectare within Flood Zone 1
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the Householder proforma, where a standard form replaces
  the FRA (listed as unmapped). The critical drainage area branch is from the list''s explanation.'
review-status: unverified
field-status: {}
