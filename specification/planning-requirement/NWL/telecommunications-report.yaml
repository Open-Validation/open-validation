reference: telecommunications-report
local-authority: NWL
required-if:
  any:
  - application-type:
      in:
      - pa-ecomms-network
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - condition:
        field: telecommunications-development
        value: true
        description: Telecommunications development is proposed.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: NPPF (2012) paragraphs 44 and 45; Code of Best Practice on Mobile Phone Network Development (Annex
  F)
source-text: All developments proposing telecommunications development (see Prior notification application)
  … All applications to include ICNIRP statement … Supplementary Information … Template (as set out in
  Annex F of the Code of Best Practice on Mobile Phone Network Development) … All notifications
must-include:
- item: The area of search, details of any consultation undertaken, details of the proposed structure
    and technical justification
  level: should
- item: A signed declaration (ICNIRP statement) that the equipment and installation comply with the ICNIRP
    radio-frequency public exposure guidelines
  level: must
- item: The Supplementary Information Template (Annex F of the Code of Best Practice)
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: 'Depending on location: confirmation that the CAA, MoD or aerodrome operator has been notified'
  level: must
  required-if: discretionary
- item: 'If sited on a building: evidence of how the siting minimises the effect on the building''s external
    appearance'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 13, 15, 17, 19, 21, 34, 52.
review-status: unverified
field-status: {}
