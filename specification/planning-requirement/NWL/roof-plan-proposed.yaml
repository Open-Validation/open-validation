reference: roof-plan-proposed
local-authority: NWL
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - lbc
        - reserved-matters
    - condition:
        field: complex-roof-design
        value: true
        description: The roof design is not simple single dual or mono pitches.
  - all:
    - application-type:
        in:
        - outline-some
    - condition:
        field: complex-roof-design
        value: true
        description: The roof design is not simple single dual or mono pitches.
    - discretionary
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
source-text: Where the roof design is not simple single dual or mono pitches, to clearly show the proposed
  works in relation to what is already there. Scale 1:50 or 1:100
must-include:
- item: At a standardised metric scale, preferably 1:50 or 1:100
  level: should
- item: Critical dimensions
  level: must
- item: The shape of the roof
  level: must
- item: Roofing material, vents and their location
  level: should
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 9-13, 14, 19-21, 25, 27, 37, 46. Called Roof
  Plan. For outline applications with some matters reserved, the plans are needed only if the matters
  they show (appearance or scale; for sections also layout or landscaping) are not reserved, so outline
  is shown as discretionary.
review-status: unverified
field-status: {}
