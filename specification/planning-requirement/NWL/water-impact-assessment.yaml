reference: water-impact-assessment
local-authority: NWL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - lbc
      - demolition-con-area
  - site:
      in:
      - special-area-of-conservation
      description: The site is in the catchment area of the River Mease Special Area of Conservation.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
source-text: SAC report - Any proposal located in catchment area of the River Mease Special Area of Conservation
  (SAC) North West Leicestershire District.
must-include:
- item: No adverse effect on the integrity of the SAC, alone or in combination with other proposals
  level: must
- item: Water quality
  level: must
- item: Water volumes
  level: must
confidence: medium
notes: 'Audit (missing_requirement): the River Mease SAC report is the main NWL-specific item and is in
  every Householder, Full, Outline, CA consent and LBC proforma. The must-include items are the audit''s
  summary.'
