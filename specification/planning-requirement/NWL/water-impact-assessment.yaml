reference: water-impact-assessment
local-authority: NWL
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - outline-all
      - demolition-con-area
      - lbc
  - site:
      in:
      - special-area-of-conservation
      description: The proposal is in the catchment area of the River Mease Special Area of Conservation.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: Conservation of Habitats and Species Regulations 2010, regulation 48(2); NPPF (2012) paragraph
  118
source-text: Any proposal located in catchment area of the River Mease Special Area of Conservation (SAC)
  North West Leicestershire District.
must-include:
- item: Demonstrates that the development would have no adverse impact on the integrity of the River Mease
    SAC, alone or in combination with other proposals
  level: must
- item: Water quality, in relation to the relevant targets in the site's conservation objectives
  level: should
- item: Water volumes, in relation to the relevant targets in the site's conservation objectives
  level: should
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 9-25, 27, 51. Called the SAC report (River
  Mease catchment area); North West Leicestershire only. The council uses it to prepare its Appropriate
  Assessment.
review-status: unverified
field-status: {}
