reference: biodiversity-survey-report
local-authority: NWL
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline-some
        - outline-all
    - any:
      - condition:
          field: protected-species
          value: true
          description: The site contains or is close to a known location for a protected species, or there
            is a high probability that a protected species will be present.
      - site:
          in:
          - special-protection-area
          - special-area-of-conservation
          - ramsar
          - site-of-special-scientific-interest
          - national-nature-reserve
          - local-wildlife-site
          - local-nature-reserve
          - priority-habitat
          description: The development may have impacts on designated sites and priority habitats (Table
            2).
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: protected-species
        value: true
        description: A protected species may be affected (advice only).
    - discretionary
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: ODPM Circular 06/2005; Wildlife and Countryside Act 1981; Conservation of Habitats and Species
  Regulations 2010
source-text: Where the proposed development may have possible impacts on designated sites and important
  habitats, a full biodiversity survey and report may be needed. … Some proposed development may need
  a protected species survey if a) the site contains or is close to a known location for a species, or
  b) there is a high probability that a protected species will be present.
must-include:
- item: Undertaken by competent persons at an appropriate time of year, in suitable weather and using
    recognised survey methods
  level: must
- item: 'Protected species: records which species are present and their numbers (may be approximate)'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species may be affected.
- item: 'Protected species: maps their distribution and use of the area, site, structure or feature'
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species may be affected.
- item: 'Designated sites and priority habitats: records the habitats and features present, their extent/area/length
    and their distribution on an appropriate scale plan'
  level: must
  required-if:
    site:
      in:
      - special-protection-area
      - special-area-of-conservation
      - ramsar
      - site-of-special-scientific-interest
      - national-nature-reserve
      - local-wildlife-site
      - local-nature-reserve
      - priority-habitat
      description: Designated sites or priority habitats may be affected.
- item: Identifies and describes potential impacts, direct and indirect, during construction and afterwards
  level: must
- item: 'Where harm is likely: how alternative designs or locations have been considered'
  level: must
  required-if: discretionary
- item: 'Where harm is likely: how adverse effects will be avoided wherever possible'
  level: must
  required-if: discretionary
- item: 'Where harm is likely: how unavoidable impacts will be mitigated or reduced'
  level: must
  required-if: discretionary
- item: 'Where harm is likely: how impacts that cannot be avoided or mitigated will be compensated'
  level: must
  required-if: discretionary
- item: 'Where harm is likely: how species numbers or priority habitat area are likely to change after
    development'
  level: must
  required-if: discretionary
- item: 'Where harm is likely: how features, sites or habitats can be enhanced, restored or added to'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 9-23, 47, 56-59. Appendix III gives trigger
  lists (Table 1 for protected species, Table 2 for designated sites and priority habitats, Table 3 for
  geodiversity sites) and says a survey is not needed where Natural England or the council's ecologist
  confirms in writing that sites will not be affected. For householder applications it is 'ADVICE' only
  (shown as discretionary).
review-status: unverified
field-status: {}
