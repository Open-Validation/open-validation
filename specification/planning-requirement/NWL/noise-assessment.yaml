reference: noise-assessment
local-authority: NWL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive developments close to existing sources of noise.
    - condition:
        field: noise-generating-use
        value: true
        description: The proposal will generate significant noise levels.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: NPPF (2012) paragraph 123
source-text: Where developments are close to existing sources of noise or proposal will generate significant
  noise levels.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 13, 15, 17, 19, 21, 23, 50.
review-status: unverified
field-status: {}
