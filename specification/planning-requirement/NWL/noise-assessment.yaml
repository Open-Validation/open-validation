reference: noise-assessment
local-authority: NWL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise-sensitive development close to existing sources of noise.
    - condition:
        field: noise-generating-use
        value: true
        description: The proposal will generate significant noise levels.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
source-text: Noise impact assessment - Where noise sensitive developments are close to existing sources
  of noise or the proposal will generate significant noise levels.
must-include:
- item: Prepared by a qualified acoustician
  level: must
confidence: medium
review-status: unverified
field-status: {}
