reference: recreation-facilities-assessment
local-authority: NWL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development.
    - condition:
        field: loss-of-open-space
        value: true
        description: There would be a loss of open space.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
source-text: Open Space assessment - All major residential developments and applications where there would
  be a loss of open space.
confidence: medium
review-status: unverified
field-status: {}
