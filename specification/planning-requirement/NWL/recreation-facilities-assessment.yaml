reference: recreation-facilities-assessment
local-authority: NWL
required-if:
  all:
  - application-type:
      in:
      - full
      - outline-some
      - outline-all
  - any:
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
    - condition:
        field: loss-of-open-space
        value: true
        description: There would be a loss of open space.
source-url: https://www.nwleics.gov.uk/files/documents/national_and_local_requirements_for_planning_applications_july_2013/Adopted%20PAR%20list%20of%20requirements%20July%202013.doc
policy: NPPF (2012) paragraphs 73 and 74
source-text: All major residential developments and applications where there would be a loss of open space.
must-include:
- item: Plans showing any areas of existing or proposed open space within or adjoining the site
  level: must
- item: Any evidence that the land or buildings are surplus to local requirements
  level: should
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: There would be a loss of open space.
- item: Clearly identified if included in the Design and Access Statement
  level: must
confidence: medium
notes: From the council's list (adopted 1 July 2013), pages 13, 15, 17, 19, 21, 23, 50. Called Open Space
  assessment.
review-status: unverified
field-status: {}
