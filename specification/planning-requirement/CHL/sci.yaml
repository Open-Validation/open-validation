reference: sci
local-authority: CHL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: Schemes for 50 or more houses.
  - all:
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Non-residential development.
    - discretionary
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036
source-text: When do I need to provide a statement of community involvement? • Schemes for 50 or more
  houses • Non-residential developments, where the threshold for transport assessments is met
must-include:
- item: Measures taken to consult and involve the local community before submission
  level: must
- item: How residents' views have been incorporated into the development
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 105. The non-residential test uses the
  transport assessment thresholds in appendix 4 (page 123), which are by use class, so it is shown as
  discretionary.
review-status: unverified
field-status: {}
