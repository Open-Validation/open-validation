reference: proposed-habitat-plan
local-authority: CHL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Environment Act 2021; Town and Country Planning Act 1990 Schedule 7A; Town and Country Planning
  (Development Management Procedure) (England) Order 2015, articles 30C(2) and 30C(4)
source-text: A draft version of the plan is required to be submitted with your planning application. A
  finalised version is then required prior to the commencement of the development.
must-include:
- item: Steps to minimise adverse effects on the biodiversity of on-site and other habitat
  level: must
- item: Pre-development and post-development biodiversity value of on-site habitat
  level: must
- item: Any registered off-site gain allocated and any biodiversity credits purchased
  level: must
- item: Pre-development and post-development plans showing onsite habitat, to an identified scale with
    North
  level: must
- item: Arrangements for maintaining and monitoring habitat enhancement for at least 30 years
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 81-82. Biodiversity Net Gain Plan (Draft).
  Shown with the biodiversity gain condition as the law sets out. The full list of matters follows Schedule
  7A and DMPO article 30C; a standard template is available.
review-status: unverified
field-status: {}
