reference: location-plan
local-authority: CHL
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - ldc
    - change-of-use
    - advertising
    - s73
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When do I need to provide a site location plan? All applications, except non-material amendments
  and discharge of conditions applications
must-include:
- item: Red line around the whole development site (unshaded, no other colour), including new dropped
    kerbs and accesses and all land needed for the development, such as access from a public highway
  level: must
- item: Other land in the applicant's ownership outlined in blue
  level: must
- item: Scale of 1:1250 or 1:2500
  level: must
- item: Two named roads (one may be acceptable in isolated rural locations)
  level: must
- item: Arrow indicating true north
  level: must
- item: Up to date
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 61. The discharge of conditions checklist
  on page 55 does list a site location plan, but the document page excludes it, so it is not shown here.
review-status: unverified
field-status: {}
