reference: elevation-existing
local-authority: CHL
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - advertising
      - reserved-matters
  - all:
    - application-type:
        in:
        - change-of-use
        - s73
        - non-material-amendment
        - lbc
        - ldc-prospective-use
    - condition:
        field: external-alterations
        value: true
        description: Changes are proposed to the exterior of the building or structure.
  - all:
    - application-type:
        in:
        - approval-condition
        - outline-some
    - discretionary
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'When do I need to provide elevations? You will need to provide elevations with all applications,
  apart from: • Discharge of conditions applications, unless elevations are specifically required as part
  of the condition • Applications to vary or remove a condition, unless there would be an impact on the
  exterior of the building or structure • Applications for changes of use, where there are no changes
  proposed to the exterior of the building (in this case, you will need to provide a statement, confirming
  that there are no changes proposed to the exterior) • Outline applications, with all matters reserved
  • Non-material or material amendments applications, where no changes are proposed to the exterior of
  the building.'
must-include:
- item: Written dimensions in metric (including heights)
  level: must
  required-if: discretionary
- item: Scale of 1:50 or 1:100
  level: must
- item: Proposed materials and finishes
  level: must
- item: Where the new building or extension attaches to another building; extensions shown with the existing
    building
  level: must
- item: Position of any openings
  level: must
- item: Elevations match the floor and roof plans
  level: must
- item: All proposed extensions on one plan (always for householder applications)
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Not masked with extra details (cars, people, landscaping, boundary treatments) and not 3D style
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 84. Discharge of conditions needs them
  only if the condition asks, and outline applications with some matters reserved only for scale or appearance
  (page 52), so those are discretionary. Lawful development certificates for an existing use do not list
  them (page 40); for listed building consent they are needed for alterations to the external appearance
  (page 38). For walls, gates and fences only proposed elevations are needed (brochure images may be acceptable).
review-status: unverified
field-status: {}
