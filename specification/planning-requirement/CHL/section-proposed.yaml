reference: section-proposed
local-authority: CHL
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: Substantial level changes on the site.
  - discretionary
  - application-type:
      in:
      - advertising
  - all:
    - condition:
        field: shopfront
        value: true
        description: Shop front.
    - site:
        in:
        - listed-building
        - conservation-area
        description: A listed building or curtilage listed, or within a Conservation Area.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When do I need to provide site sections and levels? • Where there are substantial levels
  changes on the site • Where the proposal cannot be shown by traditional elevations (e.g. if it is partially
  screened by a neighbour’s wall) … Advert sections … Shop front sections
must-include:
- item: Sections at a scale of 1:50 or 1:100
  level: must
- item: Existing and proposed ground levels
  level: must
- item: Proposed site levels in relation to existing buildings and neighbouring development
  level: must
- item: A datum point off site from which all floor heights are measured
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 103, 49-50. Finished floor and site levels
  and sections. Whether a proposal 'cannot be shown by traditional elevations' is a judgement, so discretionary.
  Advertisement applications always need advert sections (page 50); shop fronts need sections for listed
  buildings or in conservation areas (page 49).
review-status: unverified
field-status: {}
