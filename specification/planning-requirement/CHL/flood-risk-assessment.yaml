reference: flood-risk-assessment
local-authority: CHL
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Any part of the development is within flood zones 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Site area larger than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Site area larger than 1 hectare in flood zone 1.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: National Planning Policy Framework
source-text: When do I need a flood risk assessment? • If any part of the development is located within
  flood zones 2 or 3 • If the site area is larger than 1 hectare and is located within flood zone 1.
confidence: medium
notes: From the council's list (published February 2024), page 88-89. Detail follows the Environment Agency's
  standing advice. The change of use, conversion and outline checklists word the flood zone 1 test as
  over 1ha 'and is changing to a more vulnerable use'.
review-status: unverified
field-status: {}
