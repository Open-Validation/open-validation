reference: cil-form
local-authority: CHL
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - ldc
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Householder extensions, outbuildings and annexes over 100m².
  - all:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 100
        description: New or extended retail buildings (Use Class E or retail sui generis) over 100m².
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New and replacement residential units, including conversions to residential.
  - all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Prior approval to convert offices or agricultural buildings into homes.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Community Infrastructure Levy Regulations 2010 (as amended)
source-text: 'You will need to submit a CIL Additional Questions Form if your proposal is for any of the
  following: • Planning applications or certificates of lawfulness for householder extensions, outbuildings
  and annexes where the floor area exceeds 100m² • Planning applications for new retail buildings or extensions
  to existing retail buildings (Use classes E, and sui generis which include sales) where the floor area
  exceeds 100m2 • Planning applications for new and replacement residential units • Planning applications
  for the change of use of an existing building into residential units (including the subdivision of an
  existing dwelling where there is an extension) • Prior approval applications for the conversion of either
  office or agricultural buildings into residential units'
confidence: medium
notes: From the council's list (published February 2024), page 83. CIL Additional Questions Form. CIL
  in Chelmsford is charged on new retail and residential floorspace.
review-status: unverified
field-status: {}
