reference: cil-form
local-authority: CHL
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 100
      description: Householder extensions, outbuildings and annexes where the floor area exceeds 100 square
        metres.
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 100
      description: New retail buildings or extensions (Use classes E, and sui generis which include sales)
        where the floor area exceeds 100 square metres.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New and replacement residential units.
