reference: affordable-housing-statement
local-authority: CHL
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 11
    description: The development consists of or has capacity for 11 residential units or more.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036 policies DM2 and DM1; Planning Obligations SPD (2020)
source-text: When do I need an Affordable housing statement? • The development consists of or has capacity
  for 11 residential units or more
must-include:
- item: Overall level of affordable housing proposed (policy DM2 requires 35%)
  level: must
- item: Number, size, type and tenure of the units
  level: must
- item: Plans showing the location of the affordable housing
  level: must
- item: Plans and drawings showing the affordable dwellings built to Building Regulations M4(3), and how
    they meet policy DM1 (B)
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 69.
review-status: unverified
field-status: {}
