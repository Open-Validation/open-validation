reference: roof-plan-existing
local-authority: CHL
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: storey-count
          operator: '>'
          value: 1
          description: Extensions of more than a single storey.
      - condition:
          field: complex-roof-design
          value: true
          description: Outbuildings with a complex roof form.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - change-of-use
        - ldc-prospective-use
        - lbc
    - condition:
        field: floorspace
        operator: '>'
        value: 0
        description: Creates additional covered floor space.
  - all:
    - application-type:
        in:
        - change-of-use
        - ldc-prospective-use
        - lbc
        - full
    - condition:
        field: roof-alteration
        value: true
        description: New roofs or alterations and extensions to existing roofs.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: When do I need to provide roof plans? • All householder applications for extensions more
  than single storey • Householder outbuildings which have a complex roof form • All other planning applications
  which create additional covered floor space.
must-include:
- item: Scale of 1:100 or 1:200
  level: must
- item: Written dimensions in metric
  level: must
  required-if: discretionary
- item: Location of any chimney, rooflight or dormer window
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 101. The section 2 checklists add new roofs
  or roof alterations for changes of use and proposed-use LDCs, alterations to the roof for listed building
  consent, and plant that affects an existing roof (such as solar panels). Roof plans can sometimes be
  included with the block plan.
review-status: unverified
field-status: {}
