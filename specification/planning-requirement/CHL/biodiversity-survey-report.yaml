reference: biodiversity-survey-report
local-authority: CHL
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Protected habitats and species are likely to be present on or adjacent to the site.
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New or replacement residential units.
  - application-type:
      in:
      - outline
  - condition:
      field: agricultural-building-reuse
      value: true
      description: Conversion of rural buildings such as barns.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036
source-text: Biodiversity information needs to be provided if protected species and habitats are likely
  to be present on or adjacent to your site. … If you believe you have protected habitats or protected
  species on, adjacent or using your site, you must carry out ecological surveys and submit an ecological
  report completed by a competent and qualified ecological consultant. You will also need to complete
  and submit the Council’s biodiversity checklist.
must-include:
- item: The Council's biodiversity checklist, completed
  level: must
- item: Ecological baseline with an up-to-date desktop search of protected habitats and species on and
    adjacent to the site
  level: must
- item: Evaluation of ecological features and the significance of effects of the development (including
    cumulative impacts for major development)
  level: must
- item: Explanation and justification of methods
  level: must
- item: Any further survey work needed to establish presence or absence
  level: must
- item: Likely impacts on each ecological feature and the significance of the overall effects
  level: must
- item: Avoidance, mitigation, compensation and enhancement measures
  level: must
- item: Prepared by a competent and qualified ecological consultant
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 74-79. Biodiversity checklist and report
  (householder/minor, non-householder and major versions). The section 2 checklists list it among the
  documents that must be submitted for major non-residential development, replacement houses, all new
  residential schemes, rural conversions and outline applications; for other types it is needed when protected
  habitats or species are likely to be present.
review-status: unverified
field-status: {}
