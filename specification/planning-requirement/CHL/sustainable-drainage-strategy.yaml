reference: sustainable-drainage-strategy
local-authority: CHL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more residential units.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: Residential site of 0.5ha or more where the number of houses is unknown.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 1000
      description: Non-residential floor space greater than 1000sqm.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Non-residential site of 1ha or more.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Essex County Council SuDS guidance
source-text: When do I need to provide Sustainable Drainage Systems information? • Developments of 10
  or more residential units • Residential developments with a site area of 0.5ha or more and the number
  of houses is unknown • Developments for non-residential floor space greater than 1000sqm • Non- residential
  developments with a site area of 1ha or more
must-include:
- item: Statement on Essex County Council's SuDS Proforma
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 108. The checklist for fewer than 10 homes
  (page 30) also asks for it where the site area exceeds 0.5ha.
review-status: unverified
field-status: {}
