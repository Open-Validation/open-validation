reference: design-and-access-statement
local-authority: CHL
required-if:
  any:
  - application-type:
      in:
      - lbc
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: Within a Conservation Area.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: New floor space would exceed 100m².
  - all:
    - site:
        in:
        - conservation-area
        description: Within a Conservation Area.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more residential units.
  - site:
      in:
      - listed-building
      description: The property is a listed building.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: When do I need a design and access statement? • Listed building consent applications • Major
  Applications • Applications within a Conservation Area, where the new floor space would exceed 100m²
  • Applications for one or more residential units within a Conservation Area. … If your property is a
  listed building
must-include:
- item: 'Use: the purpose of the proposal'
  level: should
- item: 'Quantity: what would be built on the site'
  level: should
- item: Layout, and how buildings and spaces relate to surrounding development
  level: should
- item: Scale compared with nearby structures and spaces
  level: should
- item: 'Landscaping: how open spaces would be used and relate to the site'
  level: should
- item: Appearance and materials
  level: should
- item: Vehicular access points, why they were chosen and how they relate to the local area
  level: should
- item: 'Pedestrian access: how people would access and use the building'
  level: should
confidence: medium
notes: From the council's list (published February 2024), page 64. The section 2 checklists add 'If your
  property is a listed building' for householder, non-residential, residential, change of use, conversion,
  shop front and advert applications (page 9 onwards). The contents list is 'an indication of what is
  likely to be required', so items are 'should'.
review-status: unverified
field-status: {}
