reference: site-plan
local-authority: CHL
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - change-of-use
      - advertising
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: Any external works.
  - all:
    - application-type:
        in:
        - ldc-prospective-use
        - outline
    - discretionary
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The National Validation Requirements are: • Application Form • Site Location Plan • Block
  Plan … Any external works'
must-include:
- item: Scale of 1:100, 1:200 or 1:500
  level: must
- item: Arrow indicating north
  level: must
- item: All properties adjoining the site
  level: must
- item: The development which is the subject of the application
  level: must
- item: Written dimensions in metric from the proposed development to the site boundaries
  level: must
  required-if: discretionary
- item: Any red line matches the red line on the site location plan
  level: must
- item: Any public rights of way affected by the development
  level: must
- item: Parking and access arrangements
  level: must
- item: Location of all trees and hedges on the site
  level: must
- item: 'Walls, gates and fences: the location of the wall, gate or fence'
  level: must
  required-if:
    condition:
      field: new-boundary-treatment
      value: true
      description: The application is for a wall, gate or fence.
confidence: medium
notes: From the council's list (published February 2024), page 6, 63. Block plan. The development-type
  checklists (section 2) list it as always needed for householder, non-residential, plant, residential,
  change of use, rural conversion, shop front and advertisement applications; for listed building consent
  'Any external works' (page 38); for proposed-use LDCs (extensions, outbuildings, fences, pools, driveways,
  new windows) and outline applications (layout, scale, access, landscaping) it depends on the proposal,
  so those are discretionary. Dimensions to boundaries are 'where required'.
review-status: unverified
field-status: {}
