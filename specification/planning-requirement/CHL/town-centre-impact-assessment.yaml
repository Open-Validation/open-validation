reference: town-centre-impact-assessment
local-authority: CHL
required-if:
  any:
  - all:
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Retail and leisure development exceeding 2500m².
    - condition:
        field: departure-from-development-plan
        value: true
        description: Not in accordance with up to date plan policies.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Located outside existing town centres.
  - discretionary
  - all:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 500
        description: Retail proposals above 500 sq m gross.
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside of Designated Centres.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036
source-text: When do I need to produce a retail and leisure impact statement? • All developments for retail
  and leisure developments exceeding 2500m2 of floorspace which are not in accordance with up to date
  plan policies and which will be located outside existing town centres • When developments are under
  2,500m2 of floorspace and there are concerns over the cumulative impact of the proposals and/or the
  role of designated centres • Retail proposals above 500sqm gross floorspace outside of Designated Centres.
must-include:
- item: State of existing centres and current shopping patterns
  level: must
- item: Turnover and trade draw of the proposal
  level: must
- item: Impact on existing and planned investment in the centre(s)
  level: must
- item: Impact on the vitality and viability of existing centres
  level: must
- item: Impact on allocated sites outside centres
  level: must
- item: Impact on trade/turnover in centres and the wider area
  level: must
- item: Whether an edge-of-centre or in-centre scheme is of appropriate scale
  level: must
  required-if: discretionary
- item: Impact on important parts of local centres
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 100. Smaller schemes with 'concerns over
  the cumulative impact' are a judgement, so discretionary. The major non-residential checklist (page
  23) words it as over 2,500m² for retail, leisure or office uses.
review-status: unverified
field-status: {}
