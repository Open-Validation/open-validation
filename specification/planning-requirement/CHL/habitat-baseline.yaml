reference: habitat-baseline
local-authority: CHL
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Environment Act 2021; Town and Country Planning Act 1990 Schedule 7A
source-text: When do I need a BNG statement? Major applications from 12th February 2024. Applications
  for ‘small sites’ from 2nd April 2024.
must-include:
- item: Statement of whether the applicant believes permission would be subject to the biodiversity gain
    condition
  level: must
- item: Pre-development biodiversity value of the onsite habitat on the date of application (or an earlier
    date), with the completed metric and its version
  level: must
- item: Any proposed earlier date and the reasons for it
  level: must
  required-if: discretionary
- item: Statement on whether onsite habitat value is lower because of degradation, with supporting evidence
    if so
  level: must
- item: Description of any irreplaceable habitat on the land
  level: must
- item: Plan to an identified scale, with North, showing onsite habitat existing on the date of application,
    including any irreplaceable habitat
  level: must
- item: Completed by a suitably qualified and competent person (ideally a CIEEM member)
  level: should
confidence: medium
notes: 'From the council''s list (published February 2024), page 66. Biodiversity Net Gain (BNG) Statement,
  on the council''s form. Shown with the biodiversity gain condition as the law sets out: householder
  and other exempt applications are exempt even though the list says ''Major applications'' and ''small
  sites''.'
review-status: unverified
field-status: {}
