reference: viability-assessment
local-authority: CHL
required-if:
  any:
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The Council's affordable housing policy requirements cannot be met.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant asks the Council to accept a reduced level of planning obligations.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036 policy DM2; Planning Obligations SPD (2020)
source-text: There may be exceptional circumstances where the Council’s affordable housing policy requirements
  cannot be met. In this case it will be necessary for a Viability Assessment to be submitted with the
  application. … Where an applicant formally requests the Council to consider a reduced level of planning
  obligations for a scheme it will need to demonstrate
must-include:
- item: Based on, and referring to, the Viability Study that informed the Local Plan, with evidence of
    what has changed
  level: must
- item: Full viability report with every item in the Economic Viability Appraisal Checklist (appendix
    5)
  level: must
- item: 'Scheme details: OS plan, description, site layout and unit drawings, floor areas and accommodation
    schedule'
  level: must
- item: 'Gross development value: sales and other revenue, affordable housing revenue, ground rents and
    service charges, supported by comparable evidence'
  level: must
- item: 'Gross development costs: build, abnormal, contingency, other and off-site costs, S106/CIL, finance,
    profit, residual land value and land acquisition terms, with evidence'
  level: must
- item: Financial appraisal using an economic appraisal tool/model
  level: must
- item: Existing use value and alternative use values, with professional evidence
  level: must
- item: Electronic format where possible, otherwise two hard copies
  level: should
confidence: medium
notes: From the council's list (published February 2024), page 69, 125-128. Appendix 5, Chelmsford City
  Council's economic viability appraisal checklist.
review-status: unverified
field-status: {}
