reference: transport-assessment
local-authority: CHL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: 'C3 residential: 50 units or more.'
  - condition:
      field: office-floorspace
      operator: '>='
      value: 2500
      description: 'B1 business and light industrial: 2500 sq m or more.'
  - condition:
      field: industrial-floorspace
      operator: '>='
      value: 4000
      description: 'B2 general industrial: 4000 sq m or more.'
  - condition:
      field: warehousing-floorspace
      operator: '>='
      value: 5000
      description: 'B8 storage and distribution: 5000 sq m or more.'
  - discretionary
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036
source-text: Please see the thresholds for transport assessments, which are set out in appendix 4 Generally
  speaking you will only need a transport assessment for large scale residential and commercial developments
  or new educational premises.
confidence: medium
notes: From the council's list (published February 2024), page 109, 123. Appendix 4 also sets thresholds
  for food retail (800 sq m), non-food retail (1500), financial and professional services and restaurants
  (2500), drinking establishments (600), hot food takeaways (500), non-residential institutions (1000),
  leisure (1500), hotels (100 bedrooms), hospitals and nursing homes (50 bedrooms), residential education
  (150 students), hostels (400 residents), any new school and higher/further education (50 pcus). These
  have no matching fields, so they are covered by 'discretionary'. Essex County Council Highway Authority
  advises on whether a statement or assessment is needed.
review-status: unverified
field-status: {}
