reference: air-quality-assessment
local-authority: CHL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: The proposal is for 50 or more residential units (core requirement).
  - all:
    - site:
        in:
        - air-quality-management-area
        description: The development is within or adjacent to an Air Quality Management Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more residential units.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 500
          description: 500 square metres or more of non-residential floorspace.
      - discretionary
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
source-text: Air quality impact assessment When do I need this document? Where development is within or
  adjacent to an Air Quality Management Area and will generate an increase in traffic or pollutants, would
  consist of 10 or more residential units or, create 500 sq. m or more of non-residential floorspace.
confidence: medium
notes: 'Audit (wrong_app_type): core for 50+ units. The AQMA rule is the list''s own wording; ''will generate
  an increase in traffic or pollutants'' has no field, so it is shown as officer discretion.'
review-status: unverified
field-status: {}
