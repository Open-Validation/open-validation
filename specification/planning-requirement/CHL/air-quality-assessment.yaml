reference: air-quality-assessment
local-authority: CHL
required-if:
  any:
  - all:
    - site:
        in:
        - air-quality-management-area
        description: Within or adjacent to an Air Quality Management Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more residential units.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 500
          description: 500 sq m or more of non-residential floorspace.
      - discretionary
  - condition:
      field: dwelling-count
      operator: '>='
      value: 50
      description: 50 or more residential units.
  - discretionary
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036; Chelmsford Air Quality Action Plan
source-text: Where development is within or adjacent to an Air Quality Management Area and will generate
  an increase in traffic or pollutants, would consist of 10 or more residential units or, create 500 sq.
  m or more of non-residential floorspace. • Where development could significantly affect air quality
  during the construction and/or operational phases - you should seek pre-application officer advice whether
  these circumstances apply and an air quality impact assessment will be required;
must-include:
- item: Assessment of the increase in air pollutants from the development itself and from the extra traffic
    it causes
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 72. An increase in traffic or pollutants,
  and development that 'could significantly affect air quality', are judgements, so those parts are discretionary.
  The checklist for 50+ residential units (page 35) lists it among the documents that must be submitted.
review-status: unverified
field-status: {}
