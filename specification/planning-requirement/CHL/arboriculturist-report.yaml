reference: arboriculturist-report
local-authority: CHL
required-if:
  any:
  - all:
    - site:
        in:
        - tree-preservation-zone
        description: Preserved trees on or adjacent to the site.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees that would be affected by the development.
  - all:
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on or adjacent to the site that would be affected by the development.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036
source-text: When do I need to provide tree information? • If there are preserved trees on or adjacent
  to your site which would be affected by the development • In a Conservation Area, where there are trees
  on or adjacent to your site, which would be affected by the development
must-include:
- item: Completed by a competent and qualified arboriculturist, following BS5837:2012
  level: must
- item: Tree survey with a schedule of species, height, stem diameter, root area, branch spread, life
    stage, observations, remaining years and category
  level: should
- item: Arboricultural impact assessment
  level: should
- item: Arboricultural method statement
  level: should
- item: Tree protection plan
  level: should
confidence: medium
notes: From the council's list (published February 2024), page 110-111. Tree information (tree surveys,
  reports and protection plans). The report 'may include' the survey, AIA, AMS and TPP depending on the
  development, so those are 'should'. Every application must show trees on the block plan.
review-status: unverified
field-status: {}
