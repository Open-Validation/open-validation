reference: noise-assessment
local-authority: CHL
required-if:
  any:
  - all:
    - condition:
        field: noise-generating-use
        value: true
        description: New industrial or commercial premises.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Close to residential properties.
  - condition:
      field: noise-sensitive-use
      value: true
      description: New residential property near transport noise or existing industrial, commercial or
        entertainment premises.
  - all:
    - condition:
        field: entertainment-leisure-use
        value: true
        description: New entertainment premises.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: Near residential property.
  - condition:
      field: plant-equipment
      value: true
      description: New extraction or ventilation equipment, or air conditioning units.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036
source-text: 'A noise impact assessment will be required in the following cases: • New industrial or commercial
  premises close to residential properties • New residential property near to transportation noise sources.
  • New residential property near to existing industrial or commercial premises (including drinking establishments)
  where noise is the dominant source. • New entertainment premises near to residential property and new
  residential property near to places of entertainment. • New extraction or ventilation equipment • Air
  condition units'
must-include:
- item: Description of the building's use and location, and the people or wildlife affected
  level: must
- item: Description of the noises produced and where they originate
  level: must
- item: Noise survey and report by a competent professional, to BS4142, with a method statement
  level: must
- item: Mitigation measures
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 96-97.
review-status: unverified
field-status: {}
