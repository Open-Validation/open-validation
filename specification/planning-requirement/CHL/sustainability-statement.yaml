reference: sustainability-statement
local-authority: CHL
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential units, including replacement dwellings.
  - all:
    - condition:
        field: new-build
        value: true
        description: New commercial buildings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Non-residential floorspace.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036
source-text: When do I need to provide a sustainable development checklist? • All applications for new
  residential units • Replacement dwelling proposals • Applications for new commercial buildings
must-include:
- item: The council's Sustainable Development Checklist, completed (electric vehicle charging, water efficiency,
    BREEAM and so on)
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 107. Sustainable Development Checklist.
  For outline applications it is needed only if matters other than access and/or landscaping are sought
  (page 54).
review-status: unverified
field-status: {}
