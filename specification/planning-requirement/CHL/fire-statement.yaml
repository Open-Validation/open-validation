reference: fire-statement
local-authority: CHL
required-if:
  any:
  - condition:
      field: building-height
      operator: '>='
      value: 18
      description: A residential building with a storey at least 18 metres above the lowest ground level.
  - condition:
      field: storey-count
      operator: '>='
      value: 7
      description: A residential building of seven or more storeys.
  - discretionary
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: It applies to any building of residential use and having a storey at least 18 metres above
  the lowest ground level or of seven or more storeys, or development within the curtilage of a relevant
  building.
must-include:
- item: How fire and rescue services will access the building and that water supplies are available
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 87. Development within the curtilage of
  a relevant building has no matching field, so that part is discretionary.
review-status: unverified
field-status: {}
