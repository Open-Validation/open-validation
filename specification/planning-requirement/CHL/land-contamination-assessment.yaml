reference: land-contamination-assessment
local-authority: CHL
required-if:
  any:
  - all:
    - ref: major-development
    - condition:
        field: previously-developed-land
        value: true
        description: On a brownfield site.
  - condition:
      field: eia-development
      value: true
      description: Subject to Environmental Impact Assessment.
  - site:
      in:
      - contaminated-land
      description: Known contamination issues (for example a former industrial use).
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036
source-text: When do I need to provide a land contamination assessment? • Major planning applications
  on Brownfield Sites • Planning applications subject to Environmental Impact Assessment • Planning applications
  where there are known contamination issues associated with the site (i.e. if the site had a former industrial
  use)
must-include:
- item: Phase 1 desktop survey
  level: must
- item: Phase 2 intrusive site investigation
  level: must
  required-if: discretionary
- item: Remediation scheme where unacceptable risks to human health are identified
  level: must
  required-if:
    condition:
      field: contaminated-land
      value: true
      description: Unacceptable risks to human health are identified.
confidence: medium
notes: From the council's list (published February 2024), page 94. The council describes a two-stage process;
  when phase 2 is needed at validation is not said, so it is discretionary.
review-status: unverified
field-status: {}
