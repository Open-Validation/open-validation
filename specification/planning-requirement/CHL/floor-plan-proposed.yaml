reference: floor-plan-proposed
local-authority: CHL
required-if:
  any:
  - application-type:
      in:
      - full
      - reserved-matters
  - all:
    - application-type:
        in:
        - hh
        - change-of-use
        - s73
        - non-material-amendment
        - lbc
        - ldc-prospective-use
    - any:
      - condition:
          field: floor-layout-change
          value: true
          description: Changes to the internal layout (including extensions and new windows).
      - condition:
          field: external-alterations
          value: true
          description: Changes to the external appearance.
  - all:
    - application-type:
        in:
        - approval-condition
        - outline-some
    - discretionary
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'When do I need to provide floor plans? You will need to provide floor plans with all applications,
  apart from: • Discharge of conditions applications, unless floor plans are specifically required as
  part of the condition • Applications to vary or remove a condition, unless there would be an impact
  on the internal layout or external appearance of the building or structure • Applications for changes
  of use, where there are no changes proposed to the internal layout or the external appearance of the
  building (in this case, you will need to provide a statement, confirming that there are no changes proposed)
  • Outline applications, with all matters reserved • Non-material or material amendments applications,
  where no changes are proposed to the internal layout or the external appearance of the building.'
must-include:
- item: Written dimensions in metric
  level: must
- item: Scale of 1:50 or 1:100
  level: must
- item: Walls or existing buildings to be demolished
  level: must
- item: Openings such as windows and doors
  level: must
- item: The whole floor plan, not just the extension
  level: should
- item: Floor plans match the elevations
  level: must
- item: All proposed extensions on one plan (always for householder applications)
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: 'From the council''s list (published February 2024), page 90. The section 2 checklists narrow this:
  householder walls, gates, fences and dropped kerbs need none; householder external alterations need
  them only for new windows; plant needs them only where it is inside; shop fronts only for listed buildings;
  advertisements none. Discharge of conditions and outline (some matters reserved) depend on the condition
  or the matters, so they are discretionary.'
review-status: unverified
field-status: {}
