reference: lighting-assessment
local-authority: CHL
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: The application includes external lighting.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: The proposed signs are illuminated.
  - all:
    - condition:
        field: shopfront
        value: true
        description: Shop front.
    - condition:
        field: illuminated
        value: true
        description: The proposal includes illumination.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: Chelmsford Local Plan 2013-2036
source-text: When do I need to provide a lighting assessment? • All planning applications, which include
  external lighting … If the proposed signs are illuminated
must-include:
- item: Layout plan with the position and direction of the lights
  level: must
- item: 'Manufacturer''s information: luminance levels, security sensors, timers and switches'
  level: must
- item: Mitigation to reduce the impact of the lighting
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 95, 49-50. Shop fronts and advertisements
  need 'lighting details' when illuminated.
review-status: unverified
field-status: {}
