reference: heritage-statement
local-authority: CHL
required-if:
  site:
    in:
    - listed-building
    - listed-building-setting
    - conservation-area
    - scheduled-monument
    - locally-listed-building
    - park-and-garden
    description: A listed building or its curtilage or setting, a conservation area, a scheduled monument
      (or its setting), a locally listed or non-designated heritage asset (or its setting), or a registered
      park and garden.
source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
policy: National Planning Policy Framework
source-text: When do I need a heritage statement? • Listed building or any land/buildings within the curtilage
  of a listed building. (Find out if your building is a listed building) • Any building within a Conservation
  Area • Scheduled monument • Locally listed building • The site is or is part of a Registered Park and
  Garden.
must-include:
- item: Assessment of the heritage significance, with evidence such as maps, photos or documents, and
    the asset's history and role in the local area
  level: must
- item: Assessment of the impact of the works on the heritage asset and its setting, with drawings, photos
    and maps
  level: must
- item: 'Mitigation: measures to preserve the asset and its setting, including materials and construction
    techniques'
  level: must
confidence: medium
notes: From the council's list (published February 2024), page 65. Listed building consent applications
  always need one (page 38). The section 2 checklists also list the setting of a listed building or scheduled
  monument and non-designated heritage assets or their setting.
review-status: unverified
field-status: {}
