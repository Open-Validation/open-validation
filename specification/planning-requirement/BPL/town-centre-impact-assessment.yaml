reference: town-centre-impact-assessment
local-authority: BPL
required-if:
  any:
  - all:
    - condition:
        field: use-class
        value: retail
        description: Retail development (Class E(a)).
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Outside a designated centre (district and local centres and the primary shopping
          area of the town centre).
  - all:
    - ref: major-development
    - condition:
        field: entertainment-leisure-use
        value: true
        description: A leisure scheme other than sports/fitness.
    - condition:
        field: outside-resort-core
        value: true
        description: Outside the defined resort core.
source-url: https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-applications/Local-validation-checklist.aspx
policy: 'Blackpool Local Plan Part 1: Core Strategy 2012-2027 policy CS4; Blackpool Local Plan Part 2:
  Site Allocations and Development Management Policies 2012-2027 policy DM15'
source-text: 'All retail proposals that fall outside of a designated centre must be accompanied by a sequential
  appraisal and an assessment of impact to meet the requirements of Policy CS4 of the Blackpool Local
  Plan Part 1: Core Strategy 2012-2027 and Policy DM15 of the Blackpool Local Plan Part 2: Site Allocations
  and Development Management Policies 2012 to 2027. … All major-scale proposals for non-sports/fitness
  leisure schemes outside of the resort core must be accompanied by a leisure impact assessment.'
must-include:
- item: 'For retail outside a designated centre: an assessment of impact (with a sequential appraisal,
    see the unmapped list)'
  level: must
  required-if:
    condition:
      field: use-class
      value: retail
      description: Retail development (Class E(a)).
- item: 'For major leisure schemes outside the resort core: a leisure impact assessment'
  level: must
  required-if:
    condition:
      field: entertainment-leisure-use
      value: true
      description: A leisure scheme.
confidence: medium
notes: From the council's list (Local validation checklist web page, last modified 17 October 2025), page
  1, 'Main town centre uses development outside of a defined centre; Leisure uses outside of the defined
  resort core and town centre'. 'Retail development' means Class E(a); 'a defined centre' includes the
  district and local centres and the primary shopping area of the town centre on the Policies Map. The
  council's guidance 'Requirements for sequential and impact assessments for main town centre uses' gives
  more detail.
review-status: unverified
field-status: {}
