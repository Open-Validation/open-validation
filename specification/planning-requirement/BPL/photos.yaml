reference: photos
local-authority: BPL
required-if:
  all:
  - condition:
      field: new-build
      value: true
      description: New-build development.
  - any:
    - site:
        in:
        - key-promenade-frontage
        description: Within the defined key promenade frontage.
    - site:
        in:
        - town-centre
        description: Within the defined town centre boundary.
source-url: https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-applications/Local-validation-checklist.aspx
source-text: Key promenade frontage – all proposals for new-build developments within the defined key
  promenade frontage must be accompanied by a streetscene drawing and computer-generated image showing
  the proposed building within the context of the promenade. … Town centre - all proposals for new-build
  developments within the defined town centre boundary must be accompanied by a streetscene drawing and
  computer-generated image showing the proposed building within the context of the site.
must-include:
- item: A computer-generated image showing the proposed building within the context of the promenade (key
    promenade frontage) or of the site (town centre)
  level: must
confidence: medium
notes: 'From the council''s list (Local validation checklist web page, last modified 17 October 2025),
  page 1, ''By area: Key promenade frontage; Town centre''. The required computer-generated image is filed
  under MHCLG''s photos id; the streetscene drawing has no id (see the unmapped list). Photographs, photo-montages
  and computer-generated images are also among the council''s ''Recommendations'' for new-build proposals
  or sensitive locations, which are not needed for validation.'
review-status: unverified
field-status: {}
