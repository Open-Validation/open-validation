reference: habitat-baseline
local-authority: BPL
required-if:
  all:
  - ref: major-development
  - condition:
      field: involves-change-of-use
      value: false
      description: Not a change of use.
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: The development is subject to the statutory biodiversity gain condition.
source-url: https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-applications/Local-validation-checklist.aspx
policy: Environment Act 2021, Schedule 7A to the Town and Country Planning Act 1990
source-text: 'All major scale residential proposals other than change of use must be accompanied by: …
  Biodiversity matrix assessment of the existing site … Biodiversity matrix assessment of the proposed
  finished development'
must-include:
- item: Biodiversity matrix assessment of the existing site
  level: must
confidence: medium
notes: From the council's list (Local validation checklist web page, last modified 17 October 2025), page
  1, 'Major scale proposals (residential); Major scale proposals (non-residential)'. The list asks for
  both for all major proposals (residential and non-residential) other than change of use; shown with
  the statutory biodiversity gain condition, since exempt development (e.g. de minimis or self-build)
  is exempt by law.
review-status: unverified
field-status: {}
