source-url: https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-applications/Local-validation-checklist.aspx
source-text: 'Ecologically sensitive locations – if your site includes or is within 500m of a pond, Biological
  Heritage Site, a Site of Special Scientific Interest, or ‘habitats’ site as defined by the NPPF, or
  if your site is a greenfield site including trees, hedgerows or shrubs, an appropriate ecological appraisal
  will be required or confirmation from a suitably qualified and experienced ecologist that no such is
  needed. … All applications that involve full or partial demolition of a building must be accompanied
  by: A bat survey or a statement from a suitably qualified and experienced ecologist to confirm that
  no such survey is required'
