reference: biodiversity-survey-report
local-authority: BPL
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - special-protection-area
      - special-area-of-conservation
      description: The site includes or is within 500m of a pond, Biological Heritage Site, SSSI or habitats
        site.
  - all:
    - condition:
        field: greenfield-site
        value: true
        description: A greenfield site.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The site has trees, hedgerows or shrubs.
  - condition:
      field: demolition
      value: true
      description: The proposal involves demolition (bat survey or ecologist's statement).
source-url: https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-applications/Local-validation-checklist.aspx
confidence: medium
notes: 'From the audit (missing_requirement): in ecologically sensitive locations, an ecological appraisal
  or an ecologist''s confirmation; for proposals involving demolition, a bat survey or ecologist statement.
  Ponds have no designation id, so they are named in the description.'
review-status: unverified
field-status: {}
