reference: viability-assessment
local-authority: BPL
required-if:
  any:
  - all:
    - site:
        in:
        - holiday-accommodation-area
        description: Within a holiday accommodation area.
    - condition:
        field: loss-of-use
        value: true
        description: Change of use from holiday accommodation to another use.
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant considers that the planning obligations would make the proposal financially
        unviable.
source-url: https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-applications/Local-validation-checklist.aspx
policy: 'Blackpool Local Plan Part 1: Core Strategy 2012-2027 policies CS11, CS14 and CS15; Blackpool
  Local Plan Part 2: Site Allocations and Development Management Policies 2012-2027 policies DM21 and
  DM25'
source-text: Holiday accommodation areas – proposals for change-of-use from holiday accommodation to other
  uses must be accompanied by a viability study to demonstrate that the property has no realistic future
  in holiday accommodation use. … If you consider that the imposition of planning obligations would render
  your proposal financially unviable, your planning application must be accompanied by a viability assessment
  including detailed costings to demonstrate this.
must-include:
- item: 'For loss of holiday accommodation: demonstrates that the property has no realistic future in
    holiday accommodation use'
  level: must
  required-if:
    all:
    - site:
        in:
        - holiday-accommodation-area
        description: Within a holiday accommodation area.
    - condition:
        field: loss-of-use
        value: true
        description: Change of use from holiday accommodation to another use.
- item: 'For planning obligations: detailed costings showing the obligations would make the proposal financially
    unviable'
  level: must
  required-if:
    condition:
      field: planning-obligations-shortfall
      value: true
      description: Viability is argued against planning obligations.
confidence: medium
notes: 'From the council''s list (Local validation checklist web page, last modified 17 October 2025),
  page 1, ''By area: Holiday accommodation areas; By application/proposal type: General - planning obligations''.
  The council adds that viability arguments on planning obligations will only be considered where exceptional
  circumstances can be demonstrated, as the Local Plan policies have already been viability tested.'
review-status: unverified
field-status: {}
