reference: sustainability-statement
local-authority: BPL
required-if:
  all:
  - condition:
      field: minor-development
      value: true
      description: Minor scale development.
  - condition:
      field: floorspace-non-residential
      operator: '>'
      value: 0
      description: Non-residential development.
  - condition:
      field: involves-change-of-use
      value: false
      description: Not a change of use.
source-url: https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-applications/Local-validation-checklist.aspx
source-text: 'All minor scale non-residential proposals other than change of use must be accompanied by:
  … A sustainability statement explaining how the scheme would minimise energy and water use and waste'
must-include:
- item: How the scheme would minimise energy use, water use and waste
  level: must
confidence: medium
notes: From the council's list (Local validation checklist web page, last modified 17 October 2025), page
  1, 'Minor scale proposals (non-residential)'. Major non-residential proposals instead need a BREEAM
  design-stage interim certificate (see the unmapped list).
review-status: unverified
field-status: {}
