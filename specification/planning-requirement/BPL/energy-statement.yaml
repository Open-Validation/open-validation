reference: energy-statement
local-authority: BPL
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: A residential proposal (major or minor scale).
  - condition:
      field: new-build
      value: true
      description: The proposal is not a change of use.
source-url: https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-applications/Local-validation-checklist.aspx
source-text: 'All minor scale residential proposals other than change of use must be accompanied by: A
  statement explaining what renewable energy generation options have been considered to serve the development,
  including building orientation etc, and a justification if no such measures are proposed'
must-include:
- item: What renewable energy generation options have been considered, including building orientation
  level: must
- item: A justification if no such measures are proposed
  level: must
confidence: medium
notes: 'From the audit (missing_requirement): a renewable energy statement for major and minor residential
  proposals. The wording was in the workbook''s prior approval transport row.'
review-status: unverified
field-status: {}
