reference: energy-statement
local-authority: BPL
required-if:
  all:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development (new dwellings).
  - condition:
      field: involves-change-of-use
      value: false
      description: Not a change of use.
source-url: https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-applications/Local-validation-checklist.aspx
source-text: 'All major scale residential proposals other than change of use must be accompanied by: …
  a statement explaining what renewable energy generation options have been considered to serve the development,
  including building orientation etc, and a justification if no such measures are proposed … All minor
  scale residential proposals other than change of use must be accompanied by: A statement explaining
  what renewable energy generation options have been considered to serve the development, including building
  orientation etc, and a justification if no such measures are proposed'
must-include:
- item: What renewable energy generation options have been considered to serve the development, including
    building orientation
  level: must
- item: A justification if no such measures are proposed
  level: must
confidence: medium
notes: From the council's list (Local validation checklist web page, last modified 17 October 2025), page
  1, 'Major scale proposals (residential); Minor scale proposals (residential)'. Required for major and
  minor residential proposals other than change of use.
review-status: unverified
field-status: {}
