reference: affordable-housing-statement
local-authority: BPL
required-if:
  any:
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 15
        description: 15 dwellings or more.
    - condition:
        field: affordable-housing-proposed
        value: true
        description: Includes on-site affordable housing provision.
  - all:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Proposals that would require affordable housing provision or a financial contribution
          in lieu under policy CS14.
    - discretionary
source-url: https://www.blackpool.gov.uk/Residents/Planning-environment-and-community/Planning/Planning-applications/Local-validation-checklist.aspx
policy: 'Blackpool Local Plan Part 1: Core Strategy 2012-2027 policy CS14'
source-text: All residential proposals for 15 dwellings or more that include on-site affordable housing
  provision must be accompanied by an affordable housing statement to set out the proposed housing types,
  how the properties would be managed and how their affordable status would be maintained
must-include:
- item: The proposed affordable housing types
  level: must
- item: How the properties would be managed
  level: must
- item: How their affordable status would be maintained
  level: must
confidence: medium
notes: From the council's list (Local validation checklist web page, last modified 17 October 2025), page
  1, 'Affordable housing'. Also, all proposals that need affordable housing or a payment in lieu under
  policy CS14 must include 'any information required by any affordable housing supplementary planning
  document adopted by the council at the time of submission'; the list does not say what that is, so that
  part is discretionary.
review-status: unverified
field-status: {}
