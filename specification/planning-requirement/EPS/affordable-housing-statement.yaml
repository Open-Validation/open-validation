reference: affordable-housing-statement
local-authority: EPS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - pip
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: A net increase of 10 or more dwellings.
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 5 of the NPPF; Policy CS9 of the Core Strategy 2007; Policy DM21 of the Development Management
  Policies Document 2015 (DMPD); Revised Developer Contributions SPD 2014
source-text: For schemes where there is a net increase of 10 more dwellings
must-include:
- item: How the development will deliver a policy-compliant amount of affordable housing, on site or via
    a commuted sum
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 31 and 35-37. It can be part of the Planning
  Statement.
review-status: unverified
field-status: {}
