reference: land-contamination-assessment
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - pip
    - site:
        in:
        - contaminated-land
        description: The site is known to be contaminated or there is a reasonable possibility of contamination.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 15 of the NPPF; Policy DM17 of the Development Management Policies Document 2015 (DMPD)
source-text: When the site is known to be contaminated or there is a reasonable possibility of contamination
must-include:
- item: The existence and nature of contamination, the risks for construction and future occupants, and
    remediation
  level: must
- item: Carried out by a suitably qualified person (it can be desktop)
  level: must
confidence: medium
notes: 'From the council''s list (adopted 11 July 2024), pages 13, 28-29 and 35-37. Not needed if the
  works are well removed from the contamination. Typical sites: landfill, railway land, waste disposal
  sites, scrapyards and petrol stations. For prior approvals the list says the document ''may need to''
  be included depending on the class and the matters for prior approval (table, pages 58-60), so it shows
  as ''check''.'
review-status: unverified
field-status: {}
