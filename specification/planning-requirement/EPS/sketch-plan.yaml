reference: sketch-plan
local-authority: EPS
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Article 16 of the Town and Country Planning (Tree Preservation) (England) Regulations 2012; section
  211(3) of the Town and Country Planning Act 1990
source-text: Mandatory for all applications
must-include:
- item: Clearly identifies the trees in relation to other features such as boundaries, buildings or public
    rights of way (need not be to scale)
  level: must
- item: The entire site and the location of the tree(s) within it
  level: must
- item: A north point
  level: should
- item: Trees labelled T1, T2 etc. and cross-referenced to the application form, where works are proposed
    to more than one tree
  level: must
- item: The name of at least one nearby road and the names/numbers of adjoining properties
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 66 and 68. Photographs and a supporting letter
  are optional.
review-status: unverified
field-status: {}
