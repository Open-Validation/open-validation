reference: fire-statement
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - technical-details-consent
    - any:
      - condition:
          field: storey-count
          operator: '>'
          value: 7
          description: More than 7 storeys.
      - condition:
          field: building-height
          operator: '>'
          value: 18
          description: More than 18 m high.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: A net increase of 2 or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Building Safety Act 2022; Article 9A of the DMPO
source-text: All applications for buildings > 7 storeys/18m (or net increase of 2+ dwellings or educational
  accommodation within existing building), or development within the curtilage of such buildings
must-include:
- item: 'On the standard form published by the Secretary of State: the approach to fire safety, site layout,
    emergency vehicle access and water supplies for firefighting'
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 32 and 35-37. The list calls it a 'Fire Risk
  Assessment'. Development within the curtilage of such buildings is also covered. The thresholds are
  as the list writes them ('> 7 storeys/18m'). For outline and reserved matters the list gives a table
  (page 35-36) of documents by matter (appearance, access, landscaping, layout, scale); for reserved matters
  it applies only when that matter is applied for, with the full planning trigger. For prior approvals
  the list says the document 'may need to' be included depending on the class and the matters for prior
  approval (table, pages 58-60), so it shows as 'check'.
review-status: unverified
field-status: {}
