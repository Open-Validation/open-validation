reference: section-proposed
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - technical-details-consent
    - any:
      - condition:
          field: upper-floor-extension
          value: true
          description: A loft conversion.
      - condition:
          field: basement
          value: true
          description: A basement.
      - condition:
          field: change-in-ground-levels
          value: true
          description: Significant slopes between or within properties.
      - site:
          in:
          - listed-building
          description: Works affecting a listed building.
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - technical-details-consent
    - ref: major-development
  - all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: upper-floor-extension
        value: true
        description: Residential accommodation is proposed within a roof space.
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (DMPO)
source-text: Loft conversions and basements, where there are significant slopes between, major development
  and for works affecting Listed Buildings ... Loft conversions and basements, where there are significant
  slopes between or within properties and for works affecting Listed Buildings ... Where residential accommodation
  is proposed within a roof space
must-include:
- item: A metric scale bar at 1:50 or 1:100; not marked 'do not scale', 'approximate' or similar
  level: must
- item: Existing walls to be removed and retained, and proposed additions, differentiated by hatching,
    bolding, greying or colouring
  level: must
- item: The section point(s) shown on the site plan and floor plans
  level: must
- item: Foundations, existing site levels and neighbouring buildings, with levels related to a fixed datum
    point
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 8, 17 and 57. For outline and reserved matters
  the list gives a table (page 35-36) of documents by matter (appearance, access, landscaping, layout,
  scale); for reserved matters it applies only when that matter is applied for, with the full planning
  trigger.
review-status: unverified
field-status: {}
