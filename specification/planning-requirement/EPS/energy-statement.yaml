reference: energy-statement
local-authority: EPS
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - technical-details-consent
  - ref: major-development
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 15 of the NPPF; Policy CS6 of the Core Strategy 2007
source-text: For major development, or conditioned in any future permission
must-include:
- item: How energy efficiency was considered at each stage, and measures in construction and operation
    to reduce energy emissions
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 30 and 35-37. For outline and reserved matters
  the list gives a table (page 35-36) of documents by matter (appearance, access, landscaping, layout,
  scale); for reserved matters it applies only when that matter is applied for, with the full planning
  trigger.
