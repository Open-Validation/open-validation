reference: planning-statement
local-authority: EPS
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - pip
      - technical-details-consent
      - haz-substance-consent
  - all:
    - application-type:
        in:
        - ldc-existing-use
    - discretionary
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: NPPF, Core Strategy 2007 and Development Management Policies Document 2015 (DMPD)
source-text: All applications, consolidated into a Design and Access Statement if necessary ... Optional,
  depending on the description outlined in the application form
must-include:
- item: An assessment of how the development accords with relevant national, regional and local planning
    policies
  level: must
- item: 'For hazardous substances consent (cover letter): each hazardous substance and its maximum quantity,
    the main activities, how and where each substance is kept and used, how it is transported to and from
    the land, the vicinity where relevant to major-accident risks, and measures to limit the consequences
    of a major accident'
  level: must
  required-if:
    application-type:
      in:
      - haz-substance-consent
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 18, 35-37, 47, 58-60 and 71. For lawful development
  certificates (existing) a planning statement or cover letter is optional, depending on the description,
  so it shows as 'check'. Screening and scoping requests (page 69) need a cover letter or planning statement.
  For prior approvals the list says the document 'may need to' be included depending on the class and
  the matters for prior approval (table, pages 58-60), so it shows as 'check'.
review-status: unverified
field-status: {}
