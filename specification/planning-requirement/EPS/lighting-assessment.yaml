reference: lighting-assessment
local-authority: EPS
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - technical-details-consent
  - condition:
      field: external-lighting
      value: true
      description: External lighting (including sports floodlighting) next to homes or woodland.
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Sections 12 and 15 of the NPPF; Policies CS1 and CS3 of the Core Strategy 2007; Policies DM4,
  DM5, DM9 and DM10 of the Development Management Policies Document 2015 (DMPD)
source-text: Where the proposal includes external lighting (including sports floodlighting) that is adjacent
  to residential properties or woodland
must-include:
- item: Specifications of the external lighting levels and column heights
  level: must
- item: Hours of use and intended usage, including any community use
  level: must
- item: A scaled plan (including isolux levels) of the lighting layout with beam orientation and light
    spill
  level: must
- item: The expected impact on neighbouring properties and roads
  level: must
- item: Any measures to mitigate or compensate for the impacts
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 21-22 and 35-37. For outline and reserved
  matters the list gives a table (page 35-36) of documents by matter (appearance, access, landscaping,
  layout, scale); for reserved matters it applies only when that matter is applied for, with the full
  planning trigger.
review-status: unverified
field-status: {}
