reference: biodiversity-survey-report
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - pip
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - pip
    - any:
      - site:
          in:
          - site-of-special-scientific-interest
          description: The site is on, within or next to a SSSI.
      - site:
          in:
          - priority-habitat
          description: Priority habitat is affected.
      - condition:
          field: protected-species
          value: true
          description: 'Bats or great crested newts could be affected: works alter an unaltered roof,
            hanging tiles or eaves, remove trees, or are in places such as underground structures; or
            the site is in a great crested newt risk zone.'
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 15 of the NPPF; Policy CS3 of the Core Strategy 2007; Policy DM4 of the Development Management
  Policies Document 2015 (DMPD); Conservation of Habitats and Species Regulations 2017; Wildlife and Countryside
  Act 1981
source-text: For major development, and all development where priority habitat is affected or where the
  site is on, within or adjacent to a SSSI, or (Phase 1 Bat Survey) Where development will alter an unaltered
  roof, hanging tiles or under eaves, where trees are removed or in locations such as underground structures
  (GCNs) Where the development falls within a GCN risk zone
must-include:
- item: An up-to-date (no more than 12 months old) Preliminary Ecological Appraisal or Phase 1 Habitat
    Survey
  level: must
- item: Undertaken by competent persons at an appropriate time of year, in suitable weather and using
    nationally recognised survey methods
  level: must
- item: 'Where harm is likely: evidence of alternative designs considered, how adverse effects are avoided
    and how unavoidable impacts are mitigated and/or compensated'
  level: must
- item: Mitigation or compensation measures, including protection of habitats and provision of new habitats,
    where appropriate
  level: should
- item: A Phase II emergence/re-entry bat survey (or surveys) during the active season (May-September)
    where the Phase 1 bat survey finds roosting potential that the works would disturb; not conditioned
    to after consent
  level: must
  source-text: If the Phase I Survey identifies potential roosting potential and the proposed works would
    result in disturbance of these areas of the building, a Phase II Emergence/Re-entry Survey(s) must
    be undertaken during the active survey season (May - September).
confidence: medium
notes: 'From the council''s list (adopted 11 July 2024), pages 10-11, 20-21, 35-37. The list calls it
  a Preliminary Ecological Assessment (with Phase 1 bat and great crested newt surveys); the Phase 2 emergence
  survey row is in the householder table. Householder trigger: SSSI, priority habitat, bats or great crested
  newts (not major). For prior approvals the list says the document ''may need to'' be included depending
  on the class and the matters for prior approval (table, pages 58-60), so it shows as ''check''.'
review-status: unverified
field-status: {}
