reference: heritage-statement
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - pip
    - site:
        in:
        - listed-building
        - locally-listed-building
        - conservation-area
        description: Works to a listed or locally listed building, or in a conservation area.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - listed-building
        - locally-listed-building
        - conservation-area
        description: Signage or lighting fixed to a listed or locally listed building, or in a conservation
          area.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Sections 66 and 72 of the Planning (Listed Buildings and Conservation Areas) Act 1990; Section
  16 of the NPPF; Policy CS5 of the Core Strategy 2007; Policy DM8 of the Development Management Policies
  Document 2015 (DMPD)
source-text: Works to a Listed Building or Locally Listed Building or works within a Conservation Area
  (a conservation area is classified as a heritage asset) ... All applications ... Signage or lighting
  affixed to a Listed Building or Locally Listed Building or within a Conservation Area
must-include:
- item: The address, designation (grade, conservation area or local listing) and date of the building
  level: must
- item: A photograph of the front elevation and of all affected elements, including high quality photos
    of historic features to be altered, with explanations of the changes
  level: must
- item: A description of the heritage significance of the building, its character, architectural/historic
    interest and setting
  level: must
- item: An analysis of how the special character and fabric of the asset would be affected
  level: must
- item: The principles behind and justification for the proposal
  level: must
- item: The steps taken to avoid or minimise the loss of historic fabric and significance
  level: must
- item: Public and/or heritage benefits to mitigate harm or loss, if applicable
  level: must
- item: The sources considered and the expertise consulted
  level: must
- item: 'For listed buildings: a copy of the list description, dates of elements to be altered or removed,
    and dated plans if the building was extended at different dates'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - site:
        in:
        - listed-building
        description: A listed building.
- item: 'For full applications: a structural report on how retained elements would be supported, where
    substantial alterations are proposed'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
    - condition:
        field: structural-alteration
        value: true
        description: Substantial alterations are proposed.
- item: 'For full applications: heritage plans, including a schedule of works and detailed drawings of
    items such as ceilings, partitions, fixtures and fittings, service runs and external additions, and
    a specification of methods and materials including windows'
  level: must
  required-if:
    application-type:
      in:
      - full
- item: Completed by a heritage consultant, except for very small projects
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 11-12, 22, 35-38 and 43-44. The statement
  for listed building consent needs more detail, including a photographic survey of all affected elements.
  For prior approvals the list says the document 'may need to' be included depending on the class and
  the matters for prior approval (table, pages 58-60), so it shows as 'check'.
review-status: unverified
field-status: {}
