reference: sustainable-drainage-strategy
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - pip
        - reserved-matters
        - technical-details-consent
    - any:
      - ref: major-development
      - condition:
          field: new-build
          value: true
          description: New buildings (retail, residential, commercial, offices).
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 15 of the NPPF; Policy CS6 of the Core Strategy 2007; Policy DM19 of the Development Management
  Policies Document 2015 (DMPD); Surrey SuDS Guidance
source-text: For new buildings (retail, residential, commercial, offices) and tor major development
must-include:
- item: A drainage statement and drainage plan incorporating SuDS
  level: must
- item: Shows no unacceptable impact on the local area through no net change in infiltration or overland
    flows over the development's life
  level: must
- item: SuDS scheme in accordance with the DEFRA SuDS National Standards
  level: must
- item: The Surrey County Council SuDS Pro-forma completed
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 29 and 35-37. The list calls it a 'Drainage
  Statement (including SCC SuDS Pro-Forma)'. For outline and reserved matters the list gives a table (page
  35-36) of documents by matter (appearance, access, landscaping, layout, scale); for reserved matters
  it applies only when that matter is applied for, with the full planning trigger. For prior approvals
  the list says the document 'may need to' be included depending on the class and the matters for prior
  approval (table, pages 58-60), so it shows as 'check'.
review-status: unverified
field-status: {}
