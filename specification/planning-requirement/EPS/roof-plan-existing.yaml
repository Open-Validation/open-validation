reference: roof-plan-existing
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - technical-details-consent
        - ldc-prospective-use
    - any:
      - condition:
          field: upper-floor-extension
          value: true
          description: Alterations to above-ground floors.
      - condition:
          field: outbuilding
          value: true
          description: A new or altered outbuilding.
  - all:
    - application-type:
        in:
        - lbc
        - non-material-amendment
    - condition:
        field: roof-alteration
        value: true
        description: Proposals to alter a roof.
  - all:
    - application-type:
        in:
        - ldc-existing-use
    - condition:
        field: building-works
        value: true
        description: The certificate relates to operational development.
  - all:
    - application-type:
        in:
        - ldc-proposed-work-lb
    - condition:
        field: external-alterations
        value: true
        description: External works are proposed.
  - all:
    - application-type:
        in:
        - prior-approval
    - any:
      - condition:
          field: roof-alteration
          value: true
          description: Alterations to the roof.
      - condition:
          field: renewable-energy-development
          value: true
          description: Renewable energy development on the roof.
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Policies DM8 and DM10 of the Development Management Policies Document 2015 (DMPD)
source-text: All applications where alterations are proposed to above ground floors and for all outbuildings.
  Where there are ground floor works only, the roof can be shown on the first-floor plan ... All applications
  where alterations are proposed to the roof, including renewable energy development
must-include:
- item: A metric scale bar at 1:50 or 1:100 and a north point; not marked 'do not scale', 'approximate'
    or similar
  level: must
- item: Existing roof to be removed and retained, and proposed additions, differentiated by hatching,
    bolding, greying or colouring
  level: must
- item: Roof features such as eaves, rooflights, chimneys and pipes (and solar panels and green roofs
    for full applications; vents for listed buildings)
  level: must
- item: Matches the site plan and floor plans, including the orientation of the plan
  level: must
- item: 'For listed buildings: existing, demolition and proposed drawings with red and blue markings,
    annotated with the location and retention of historic features'
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - ldc-proposed-work-lb
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 7, 16, 40, 46, 49-50, 53, 56-57 and 63. For
  outline and reserved matters the list gives a table (page 35-36) of documents by matter (appearance,
  access, landscaping, layout, scale); for reserved matters it applies only when that matter is applied
  for, with the full planning trigger. Where there are ground floor works only, the roof can be shown
  on the first-floor plan.
review-status: unverified
field-status: {}
