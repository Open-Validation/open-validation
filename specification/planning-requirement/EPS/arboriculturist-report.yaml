reference: arboriculturist-report
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - pip
        - reserved-matters
        - technical-details-consent
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Works are likely to affect mature trees on or next to the site, including street
            trees, TPO and conservation area trees, veteran trees, hedges or orchards.
      - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: BS 5837:2012; Section 15 of the NPPF; Policy CS3 of the Core Strategy 2007; Policy DM5 of the
  Development Management Policies Document 2015 (DMPD)
source-text: For major development and where works are likely to affect mature trees on or adjacent to
  the site (including street trees, TPO and conservation area protected trees and veteran trees, hedges
  or orchards) or where the site has a sylvan character
must-include:
- item: Prepared by a qualified arboriculturist and in accordance with BS 5837:2012
  level: must
- item: Tree survey in table format with the tree quality assessment (species, size, age, condition, height,
    spread, life expectancy and category)
  level: must
- item: 'Tree Constraints Plan to a recognisable scale: root protection areas, canopy spread, canopy shading
    arcs across proposed gardens and habitable buildings, and trees to be removed, retained and pruned'
  level: must
- item: 'Tree Protection Plan to a recognisable scale: retained and removed trees, protection barriers,
    and construction and exclusion zones for demolition and construction'
  level: must
- item: Details of affected trees (including on adjacent sites) and how they will be protected during
    construction
  level: must
- item: Canopy cover loss assessment
  level: must
- item: Plans identify A, B and C category trees, at the same orientation and scale with the same tree
    numbering
  level: should
- item: An Arboricultural Method Statement where the impact assessment concludes one is needed and it
    is not included (tree protection plan with the final layout, specification of protection within root
    protection areas, and an arboricultural supervision programme); it can be provided after consent
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 9-10, 18-19, 35-37. A 'sylvan character'
  is not defined, so that part shows as 'check'. For reserved matters (landscaping) and technical details
  consent only the Arboricultural Method Statement is listed. For outline and reserved matters the list
  gives a table (page 35-36) of documents by matter (appearance, access, landscaping, layout, scale);
  for reserved matters it applies only when that matter is applied for, with the full planning trigger.
review-status: unverified
field-status: {}
