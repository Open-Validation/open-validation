reference: arboriculturist-report
local-authority: EPS
required-if:
  any:
  - ref: major-development
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Works are likely to affect mature trees on or adjacent to the site.
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
source-text: For major development and where works are likely to affect mature trees
must-include:
- item: Prepared by a qualified arboriculturist, in accordance with British Standard 5837:2012
  level: must
- item: Tree Protection Plan showing finalised layout proposals, tree retention and landscape protection
    measures
  level: must
confidence: medium
notes: 'Audit (wrong_trigger): the workbook had the D&AS trigger. The must-include items are the council''s
  wording, found in the workbook''s landscaping row.'
review-status: unverified
field-status: {}
