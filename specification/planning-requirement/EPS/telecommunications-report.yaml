reference: telecommunications-report
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: telecommunications-development
        value: true
        description: A telecommunications application.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Code of Practice for Wireless Network Development in England
source-text: All telecommunications applications
must-include:
- item: A declaration that the proposal, when operational, will meet the ICNIRP guidelines on health standards
  level: must
- item: An Alternative Sites Statement assessing the suitability of alternative sites for the mast
  level: must
confidence: medium
notes: 'From the council''s list (adopted 11 July 2024), pages 33 and 60. The list has two rows: ''ICPRN
  declaration'' and ''Alternative Sites Statement''. For prior approvals the list says the document ''may
  need to'' be included depending on the class and the matters for prior approval (table, pages 58-60),
  so it shows as ''check''.'
review-status: unverified
field-status: {}
