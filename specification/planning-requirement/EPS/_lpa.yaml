  status: outdated
submission-standards:
- item: Applications submitted via the Planning Portal (paper submissions accepted in person but slower)
  level: should
- item: All documents in PDF format, with all plans submitted as one single document
  level: should
- item: 'PDF files named consistently: plan type, plan number, revision number (e.g. ''Location Plan 0001
    Rev A'')'
  level: should
- item: All drawings include a plan number and date
  level: should
- item: Revised or amended plans carry a new revision number
  level: should
- item: Surveys (e.g. bat surveys, marketing reports, viability assessments) no older than 12 months at
    submission
  level: should
- item: Plans contain a metric scale bar; plans marked 'do not scale', 'approximate' or similar will not
    be accepted
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the current July 2024 list (adopted 11 July 2024), but it is dated April
    2015, and many rows come from the superseded 2015 list. The 2024 list is organised by application
    type, yet Grokbot dumped most items under Full planning with cross-wired triggers, misassigned S106
    to six consent types, and missed most Householder, LBC, Advert, Outline/RM and about 20 Full planning
    requirements. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: IN LAW, NOT YET IN FORCE: abolished from 1 Apr 2027 by the Surrey (Structural
