reference: daylight-sunlight-assessment
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: upper-floor-extension
        value: true
        description: An above-ground-floor extension.
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - technical-details-consent
    - any:
      - ref: major-development
      - discretionary
  - application-type:
      in:
      - pa-extension
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 15 of the NPPF; Policies DM9 and DM10 of the Development Management Policies Document
  2015 (DMPD); Householder Applications SPG
source-text: For major development or where there is potential adverse impact on nearby properties, including
  gardens or amenity space, or where there will be potentially low light levels for new dwellings ...
  Where there is an above ground floor extension
must-include:
- item: A site plan meeting the site plan requirements showing a 45-degree line from the corners of the
    extension to the centre of the nearest habitable window on the rear elevation of both adjoining properties
  level: must
- item: 'For major and some larger minor developments: a desk-based assessment of impacts on neighbours
    and future occupants, following the BRE guide ''Site Layout Planning for Daylight and Sunlight'''
  level: must
  required-if:
    any:
    - ref: major-development
    - discretionary
confidence: medium
notes: 'From the council''s list (adopted 11 July 2024), pages 12, 27, 35-37 and 58. Full planning: ''potential
  adverse impact'' and ''low light levels'' show as ''check''. For a larger home extension (prior approval,
  Class A of Part 1) it is the documentation required. For outline and reserved matters the list gives
  a table (page 35-36) of documents by matter (appearance, access, landscaping, layout, scale); for reserved
  matters it applies only when that matter is applied for, with the full planning trigger.'
review-status: unverified
field-status: {}
