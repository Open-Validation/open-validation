reference: landscaping-plan
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - technical-details-consent
    - any:
      - ref: major-development
      - site:
          in:
          - listed-building
          - conservation-area
          - scheduled-monument
          - park-and-garden
          description: Development will affect a designated heritage asset.
      - discretionary
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 15 of the NPPF; Policy CS3 of the Core Strategy 2007; Policies DM4, DM5 and DM9 of the
  Development Management Policies Document 2015 (DMPD)
source-text: For major development, where development will affect a designated heritage asset or sensitive
  landscape (such as the Area of Great Landscape Value) (or conditioned on some non-major development
  where the site constraints dictate)
must-include:
- item: Site survey and analysis
  level: must
- item: Planting plans, with a schedule of plants (species, plant size and numbers/densities)
  level: must
- item: Written specifications, including cultivation and establishment
  level: must
- item: Written and schematic plans of soft and hard landscaping
  level: must
- item: Existing vegetation to be retained and its protection during construction
  level: must
- item: Levels, gradients and any earthworks
  level: must
- item: Means of enclosure and hard surfacing materials
  level: must
- item: Structures and ancillary objects (refuse bins, lighting columns, cycle stores etc.)
  level: must
- item: Long-term maintenance and management (if not in a separate Landscape Management Plan)
  level: must
- item: Biodiversity enhancements and implementation timescales
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 19-20 and 35-37. The list calls it a 'Hard
  and Soft Landscape Plan'. A 'sensitive landscape (such as the Area of Great Landscape Value)' has no
  data field, so it shows as 'check'. For outline and reserved matters the list gives a table (page 35-36)
  of documents by matter (appearance, access, landscaping, layout, scale); for reserved matters it applies
  only when that matter is applied for, with the full planning trigger. For prior approval it is listed
  for demolition (Class B of Part 11).
review-status: unverified
field-status: {}
