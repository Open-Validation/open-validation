reference: elevation-existing
local-authority: EPS
required-if:
  any:
  - application-type:
      in:
      - full
      - reserved-matters
      - technical-details-consent
      - advertising
  - all:
    - application-type:
        in:
        - hh
        - ldc-prospective-use
    - any:
      - condition:
          field: residential-extension
          value: true
          description: Extensions to the dwelling (not needed for crossovers).
      - condition:
          field: new-boundary-treatment
          value: true
          description: Works to boundary treatments.
  - all:
    - application-type:
        in:
        - lbc
    - condition:
        field: building-works
        value: true
        description: Proposals to alter the (internal or external) elevations.
  - all:
    - application-type:
        in:
        - ldc-existing-use
    - condition:
        field: building-works
        value: true
        description: The certificate relates to operational development.
  - all:
    - application-type:
        in:
        - ldc-proposed-work-lb
    - condition:
        field: external-alterations
        value: true
        description: External works are proposed.
  - all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: external-alterations
        value: true
        description: External changes (not needed for Part 3 changes of use without external changes).
  - all:
    - application-type:
        in:
        - non-material-amendment
    - condition:
        field: external-alterations
        value: true
        description: Amendments are proposed to the elevations.
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Policies DM8 and DM10 of the Development Management Policies Document 2015 (DMPD)
source-text: All applications. Not required for crossovers ... All applications for extensions to dwellings
  and to boundary treatments. Not required for crossovers ... All applications except for changes of use
  under Part 3 not involving any external changes
must-include:
- item: A metric scale bar at 1:50 or 1:100; not marked 'do not scale', 'approximate' or similar
  level: must
- item: Existing walls to be removed and retained, and proposed additions, differentiated by hatching,
    bolding, greying or colouring
  level: must
- item: Window and door openings and the materials of walls
  level: must
- item: The height of boundary fencing
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
- item: Whole elevations rather than part of one
  level: must
- item: All elevations, including joined or party elevations (the front is not needed if the proposal
    is limited to the rear and not visible from the front, and vice versa)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - ldc-existing-use
      - ldc-prospective-use
      - prior-approval
- item: Matches the site plan and floor plans
  level: must
- item: 'For a proposed lawful development certificate: the floor and ceiling levels'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
- item: 'For adverts: the location, colour and lettering of the signage'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For telecommunications prior approval: the surrounding vegetation'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: telecommunications-development
        value: true
        description: Telecommunications development.
- item: 'For listed buildings: a north point; existing, demolition and proposed elevations with red and
    blue markings; annotated with historic features and materials; windows and doors shown accurately
    with opening methods; all proposed additions such as vents and pipework'
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - ldc-proposed-work-lb
- item: 'For listed buildings: details at a larger scale such as 1:20, 1:5 or 1:1 where needed to show
    them clearly'
  level: should
  required-if:
    application-type:
      in:
      - lbc
      - ldc-proposed-work-lb
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 8, 16-17, 40, 43, 46-47, 50, 53, 57 and 63-64.
  For outline and reserved matters the list gives a table (page 35-36) of documents by matter (appearance,
  access, landscaping, layout, scale); for reserved matters it applies only when that matter is applied
  for, with the full planning trigger.
review-status: unverified
field-status: {}
