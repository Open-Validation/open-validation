reference: viability-assessment
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - pip
    - condition:
        field: affordable-housing-below-target
        value: true
        description: Policy-compliant affordable housing cannot be delivered.
  - all:
    - application-type:
        in:
        - mod-discharge-s106
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 5 of the NPPF; Policy CS9 of the Core Strategy 2007; Policy DM21 of the Development Management
  Policies Document 2015 (DMPD); Revised Developer Contributions SPD 2014
source-text: When the viability of a scheme would suggest that the requirements for Affordable Housing
  cannot be met ... Depends on scope of changes sought
must-include:
- item: Executive summary
  level: must
- item: Basis on which S106 costs have been calculated
  level: must
- item: Build costs and cash flow projections
  level: must
- item: Market evidence
  level: must
- item: Benchmark Land Value or Alternative Use Value
  level: must
- item: Any other evidence
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 31 and 35-37, 72. The applicant pays for
  the council's independent review. For changes to planning obligations, amending affordable housing obligations
  'will usually require updated viability evidence', so it shows as 'check'.
review-status: unverified
field-status: {}
