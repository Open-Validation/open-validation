reference: sustainability-statement
local-authority: EPS
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - technical-details-consent
  - condition:
      field: minor-development
      value: true
      description: Non-major development.
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 15 of the NPPF; Policy CS6 of the Core Strategy 2007; Sustainable Design SPD
source-text: All non-major development
must-include:
- item: Measures to minimise waste, use recycled and secondary aggregates, alleviate flood risk and introduce
    renewable energy or carbon savings
  level: must
- item: Reference to EcoHomes, BREEAM and Code for Sustainable Homes guidance and council policy
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 30-31 and 35-37. For outline and reserved
  matters the list gives a table (page 35-36) of documents by matter (appearance, access, landscaping,
  layout, scale); for reserved matters it applies only when that matter is applied for, with the full
  planning trigger.
review-status: unverified
field-status: {}
