reference: construction-management-plan
local-authority: EPS
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
      - technical-details-consent
  - ref: major-development
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 9 of the NPPF; Policy CS16 of the Core Strategy 2007; Policy DM35 of the Development Management
  Policies Document 2015 (DMPD)
source-text: For major development where not provided in the Transport Assessment
must-include:
- item: A site plan and accompanying statement
  level: must
- item: Parking for site operatives and visitors; loading, unloading and storage of plant and materials;
    routing of deliveries
  level: must
- item: Hours of work and deliveries
  level: must
- item: Security hoarding, including decorative displays and public viewing facilities where appropriate
  level: must
- item: Tree protection measures and wheel washing facilities
  level: must
- item: Measures to control dust and dirt, and a scheme for recycling/disposing of demolition and construction
    waste
  level: must
- item: Forward movement of vehicles to and from the site unless unachievable, and banksmen where necessary
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 25 and 35-37. For outline and reserved matters
  the list gives a table (page 35-36) of documents by matter (appearance, access, landscaping, layout,
  scale); for reserved matters it applies only when that matter is applied for, with the full planning
  trigger.
review-status: unverified
field-status: {}
