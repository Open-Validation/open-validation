reference: floor-plan-existing
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - technical-details-consent
        - ldc-prospective-use
    - condition:
        field: building-works
        value: true
        description: Extensions or alterations are proposed, or a new outbuilding (not needed for crossovers).
  - application-type:
      in:
      - lbc
      - ldc-proposed-work-lb
  - all:
    - application-type:
        in:
        - ldc-existing-use
    - condition:
        field: building-works
        value: true
        description: The certificate relates to operational development.
  - all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: building-works
        value: true
        description: Extensions or alterations to a building (not telecommunications, demolition or renewable
          energy development).
  - all:
    - application-type:
        in:
        - non-material-amendment
    - condition:
        field: building-works
        value: true
        description: Amendments are proposed to the floor plans.
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Article 7(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (DMPO); Policies DM8 and DM10 of the Development Management Policies Document 2015 (DMPD)
source-text: All applications where extensions or alterations are proposed. Not required for crossovers
  ... All applications where extensions or alterations to a dwelling or outbuilding or a new outbuilding
  are proposed. Not required for crossovers ... All applications where alterations to planform are proposed
  or to show the location of the proposed works
must-include:
- item: A metric scale bar at 1:50 or 1:100; not marked 'do not scale', 'approximate' or similar
  level: must
- item: Existing and proposed (or pre-existing and current/proposed) walls and buildings differentiated
    by hatching, bolding, greying or colouring
  level: must
- item: The entire floor, and preferably all floors
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
      - prior-approval
- item: Openings, matching the elevations
  level: must
- item: Any decks, patios or terraces (for full applications, any external structures)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
      - prior-approval
- item: Matches the site plan and roof plan, including the orientation of the plan
  level: must
- item: 'For prior approval creating dwellings: the internal floor area'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates dwellings.
- item: 'For listed buildings: a north point; existing plans of all floors, openings and features (such
    as chimney breasts and fireplaces); proposed plans with new features in blue; all plans annotated
    with the location and retention of historic features'
  level: must
  required-if:
    application-type:
      in:
      - lbc
      - ldc-proposed-work-lb
- item: 'For listed building consent: separate demolition plans where needed, with demolitions hatched
    in red'
  level: should
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: 'From the council''s list (adopted 11 July 2024), pages 7, 16, 39-40, 46, 49, 53, 56 and 63. For
  outline and reserved matters the list gives a table (page 35-36) of documents by matter (appearance,
  access, landscaping, layout, scale); for reserved matters it applies only when that matter is applied
  for, with the full planning trigger. Listed building consent and listed building LDCs: always (to show
  the works).'
review-status: unverified
field-status: {}
