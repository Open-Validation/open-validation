reference: waste-management-plan
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - technical-details-consent
    - any:
      - condition:
          field: floorspace
          operator: '>'
          value: 0
          description: Additional floorspace.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: New dwellings.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Sections 12 and 15 of the NPPF; Policy CS6 of the Core Strategy 2007; Policy DM10 of the Development
  Management Policies Document 2015 (DMPD); Revised Sustainable Design SPD 2016
source-text: For all applications comprising of additional floorspace, and/or dwellings
must-include:
- item: A scaled plan (if not on the site plan) showing the location of refuse and recycling bins, with
    scaled elevations of any enclosure
  level: must
- item: All land up to and including the collection point
  level: must
- item: 'Meets Epsom''s guidance on household waste storage and collection: collection point no more than
    6 m from the public highway, and residents not moving bins more than 30 m from storage'
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 26 and 35-37. The list calls it a 'Refuse
  and Recycling Plan'. For outline and reserved matters the list gives a table (page 35-36) of documents
  by matter (appearance, access, landscaping, layout, scale); for reserved matters it applies only when
  that matter is applied for, with the full planning trigger. For prior approvals the list says the document
  'may need to' be included depending on the class and the matters for prior approval (table, pages 58-60),
  so it shows as 'check'.
review-status: unverified
field-status: {}
