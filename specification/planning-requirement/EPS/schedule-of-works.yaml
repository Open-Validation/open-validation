reference: schedule-of-works
local-authority: EPS
required-if:
  application-type:
    in:
    - lbc
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Policy DM8 of the Development Management Policies Document 2015 (DMPD)
source-text: All applications, relative to the proposed alterations
must-include:
- item: A conservation specification of methods and materials
  level: must
- item: Plans showing the location and retention of historic features, with photographs
  level: must
- item: Ceiling plans, where relevant
  level: must
- item: A door schedule (existing and proposed) with photographs
  level: must
- item: Detail drawings, including sections, of new fixtures (e.g. fireplaces, cornices, partitions, windows,
    external additions) at an appropriate scale
  level: must
- item: Window drawings at 1:5 with horns and glazing bar sections at 1:1, stating all materials and finishes
  level: must
- item: Service runs (internal and external), external additions such as alarms, ventilators and CCTV,
    and mechanical ventilation or air conditioning units
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 40-41. The list calls it 'Detailed Plans',
  'where applicable'; the items can be shown on the existing and proposed plans.
review-status: unverified
field-status: {}
