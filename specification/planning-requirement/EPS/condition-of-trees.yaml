reference: condition-of-trees
local-authority: EPS
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Article 16 of the Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: Where the works are because of the presence and impact of pests, diseases, or fungi or the
  tree has defects that may be of concern to the current or future safe retention of the tree or parts
  of the tree
must-include:
- item: An Arboricultural Statement by a qualified arboriculturist, in accordance with BS 5837:2012, giving
    the reasons for the works and how they will ensure the continued health of the tree
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 67. The list calls it an 'Arboricultural Statement'.
  It depends on the reason for the works, so it shows as 'check'.
review-status: unverified
field-status: {}
