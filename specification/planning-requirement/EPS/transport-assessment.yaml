reference: transport-assessment
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - pip
    - any:
      - ref: major-development
      - discretionary
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 9 of the NPPF; Policies DM35 and DM36 of the Development Management Policies Document
  2015 (DMPD)
source-text: For all major development and minor applications that will generate significant transport
  movements
must-include:
- item: The existing site characteristics and baseline transport data
  level: must
- item: The expected economic, environmental and social impact on the local transport system
  level: must
- item: The proposed approach to limit that impact, including highway works
  level: must
- item: Existing and proposed journeys to and from the site by all modes
  level: must
- item: A construction management plan
  level: must
- item: Justification of the parking proposed for cars, bicycles and delivery/service vehicles
  level: must
- item: A travel plan to improve access to public transport and reduce the need for parking
  level: must
- item: Proposed loading, manoeuvring, servicing and parking arrangements, cross-referenced to scale drawings
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 23-24 and 35-37. A Transport Statement is
  for smaller schemes and a Transport Assessment for larger minor and major schemes. 'Significant transport
  movements' is not defined, so minor schemes show as 'check'. For prior approvals the list says the document
  'may need to' be included depending on the class and the matters for prior approval (table, pages 58-60),
  so it shows as 'check'.
review-status: unverified
field-status: {}
