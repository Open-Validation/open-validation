reference: application-form
local-authority: EPS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - pip
    - technical-details-consent
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - ldc-proposed-work-lb
    - prior-approval
    - s73
    - non-material-amendment
    - approval-condition
    - consent-under-tpo
    - notice-trees-in-con-area
    - haz-substance-consent
    - mod-discharge-s106
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015 (DMPO)
source-text: All applications
must-include:
- item: All sections answered, and the declaration signed and dated
  level: must
- item: A concise description of the development that reflects all aspects of the proposal
  level: should
- item: Where there is a boundary encroachment or the development is across two properties, the address
    reflects both properties
  level: should
- item: Ownership certificate (A, B, C or D) and agricultural holdings declaration completed, signed and
    dated no more than 21 days before the application is received, with notice served on other owners
    and agricultural tenants
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - pip
      - haz-substance-consent
- item: Certificate B, C or D where the proposal involves demolition or construction of a boundary encroachment
    (such as guttering or foundations), access to the highway via a private road, or a crossover or dropped
    kerb on highway owned by Surrey County Council
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
- item: 'For adverts: specific details of the signage, including lighting levels and type, materials and
    colours, with each individual sign indicated'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For prior approval: the class under which prior approval is sought, and the developer''s address
    and email address'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
- item: 'For prior approval of a telecommunications mast (and cabinets) on highway land: evidence of giving
    notice to Surrey County Council'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: telecommunications-development
        value: true
        description: A telecommunications mast (and cabinets) on highway land.
- item: 'For tree works: clear identification of each tree and species, the full specification of the
    works (e.g. crown thin by percentage, crown reduction in linear measurements removed and remaining,
    crown lift height), the reasons, and replanting details (species and location) if felling'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: 'For tree works: full contact details if the ownership of the tree(s) is not specified'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: 'For hazardous substances: a description of each hazardous substance for which consent is sought
    and the maximum quantity of each proposed to be present'
  level: must
  required-if:
    application-type:
      in:
      - haz-substance-consent
- item: 'For changes to planning obligations: the name and address of the applicant, the site address
    and the applicant''s interest in the site'
  level: must
  required-if:
    application-type:
      in:
      - mod-discharge-s106
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 5, 14, 35-37, 42, 45, 48, 52, 55, 61-62,
  65, 66, 68, 70 and 72 (one 'Application Form' row in each table). The listed building consent table
  has no application form row. A fee row (with concessions) is in most tables; fees are not a requirement
  file. Section 73 applications use a separate form and the same documents as householder or full applications,
  but only those being amended, with plans showing the approved scheme alongside the existing and proposed
  (page 61). Approval of conditions needs the documentation the condition asks for, as in the Full list
  (page 65).
review-status: unverified
field-status: {}
