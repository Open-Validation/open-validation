reference: air-quality-assessment
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - technical-details-consent
    - any:
      - ref: major-development
      - site:
          in:
          - air-quality-management-area
          description: The site is in or next to an Air Quality Management Area.
      - discretionary
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 15 of the NPPF; Air Quality (England) (Amendment) Regulations 2002
source-text: For major development, sites adjacent to or within an Air Quality Management Area, where
  there would be a significant increase in vehicular traffic or emissions
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 27 and 35-37. A 'significant increase in
  vehicular traffic or emissions' is not defined, so that part shows as 'check'. For outline and reserved
  matters the list gives a table (page 35-36) of documents by matter (appearance, access, landscaping,
  layout, scale); for reserved matters it applies only when that matter is applied for, with the full
  planning trigger. For prior approvals the list says the document 'may need to' be included depending
  on the class and the matters for prior approval (table, pages 58-60), so it shows as 'check'.
review-status: unverified
field-status: {}
