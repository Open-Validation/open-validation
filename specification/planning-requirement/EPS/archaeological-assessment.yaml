reference: archaeological-assessment
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - pip
    - any:
      - site:
          in:
          - archaeological-priority-area
          description: The site is in an Area of High Archaeological Potential.
      - all:
        - any:
          - condition:
              field: site-area-residential
              operator: '>'
              value: 0.4
              description: A site of more than 0.4 hectares.
          - condition:
              field: site-area-non-residential
              operator: '>'
              value: 0.4
              description: A site of more than 0.4 hectares.
        - condition:
            field: ground-disturbance
            value: true
            description: The ground is disturbed.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 16 of the NPPF; Policy DM8 of the Development Management Policies Document 2015 (DMPD)
source-text: When the site is within an area of Archaeological Potential or the site is >0.4 hectares
  and the ground is disturbed
must-include:
- item: A desk-based assessment of the available information on the site's archaeological interest, assessing
    what further investigation or on-site evaluation is needed
  level: must
- item: A field evaluation where the desk-based assessment shows remains are likely or is inconclusive
  level: should
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 22-23 and 35-37. For prior approvals the
  list says the document 'may need to' be included depending on the class and the matters for prior approval
  (table, pages 58-60), so it shows as 'check'.
review-status: unverified
field-status: {}
