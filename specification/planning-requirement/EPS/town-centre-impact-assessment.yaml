reference: town-centre-impact-assessment
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - pip
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail and leisure development in an edge-of-centre or out-of-town-centre location.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 7 of the NPPF; Policies CS14 and CS15 of the Core Strategy 2007; Policies DM28-DM31 of
  the Development Management Policies Document 2015 (DMPD)
source-text: For retail and leisure development in edge or out of town centre locations
must-include:
- item: Retail impacts on the vitality and viability of existing centres in Epsom and Ewell, including
    the cumulative effect of recent permissions, developments under construction and completed developments
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 32 and 35-37. The list calls it a 'Retail
  Impact Statement'; whether a sequential test is needed depends on location and scale. For prior approvals
  the list says the document 'may need to' be included depending on the class and the matters for prior
  approval (table, pages 58-60), so it shows as 'check'.
review-status: unverified
field-status: {}
