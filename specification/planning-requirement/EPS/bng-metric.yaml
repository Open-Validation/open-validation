reference: bng-metric
local-authority: EPS
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - pip
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: 'Subject to the biodiversity gain condition: not householder, not de minimis (under
        25 sq m of habitat or 5 m of linear habitat) and not small self or custom build (under 10 dwellings
        on under 0.5 ha).'
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 15 of the NPPF; Policy CS3 of the Core Strategy 2007; Policy DM4 of the Development Management
  Policies Document 2015 (DMPD)
source-text: All development, except for householders, where the development affects <25m2 of on-site
  habitat or 5m of linear habitat and self and custom builds where it comprises <10 dwellings on a site
  of <0.5 hectares
must-include:
- item: Calculated using the statutory Biodiversity Metric, with a biodiversity gain plan and statement,
    to secure a 10% uplift
  level: must
- item: Where an exemption is sought, it is clearly stated on the application form
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), page 21 and pages 35-37. The list calls it a 'Biodiversity
  Net Gain Statement and Metric'.
review-status: unverified
field-status: {}
