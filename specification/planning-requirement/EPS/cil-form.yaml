reference: cil-form
local-authority: EPS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - pip
    - ldc-prospective-use
    - ldc-proposed-work-lb
    - prior-approval
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Community Infrastructure Levy (Amendment) (England) (No. 2) Regulations 2019
source-text: All applications ... Where there is >100m2 of additional floor space in the proposal ...
  Where the additional floorspace is >100m2
must-include:
- item: 'CIL Additional Information Form (Form 1): all questions answered, signed and dated on the same
    date as the application form'
  level: must
- item: 'CIL Assumption of Liability Form (Form 2): all questions answered, signed and dated on the same
    date as the application form; agents include an email address'
  level: must
  required-if:
    condition:
      field: floorspace
      operator: '>'
      value: 100
      description: More than 100 sq m of additional floorspace.
- item: 'For development under permitted development (lawful development certificate or prior approval):
    Form 5 Notice of Chargeable Development before commencement'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - ldc-prospective-use
        - ldc-proposed-work-lb
        - prior-approval
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: More than 100 sq m of additional floorspace.
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 13, 33-34, 36-37, 50, 54 and 57-58.
review-status: unverified
field-status: {}
