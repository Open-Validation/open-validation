reference: site-plan
local-authority: EPS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - pip
    - technical-details-consent
    - lbc
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - ldc-proposed-work-lb
    - prior-approval
    - non-material-amendment
    - haz-substance-consent
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Article 7(c)(ii) of the Town and Country Planning (Development Management Procedure) (England)
  Order 2015 (DMPO); Policy DM10 of the Development Management Policies Document 2015 (DMPD)
source-text: All applications
must-include:
- item: Existing and proposed layouts (or pre-existing and current/proposed for retrospective applications)
  level: must
- item: Based on an up-to-date map with the subject building, any outbuildings and trees on the site and
    buildings and trees on adjoining sites
  level: must
- item: A metric scale bar at 1:200 or 1:500 and a north point; not marked 'do not scale', 'approximate'
    or similar
  level: must
- item: The part of the site needed to carry out the development (including access and visibility splays)
    within a continuous, unbroken red line
  level: must
- item: Existing walls and/or buildings to be removed and retained, and proposed additions, differentiated
    by hatching, greying or colouring
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - ldc-existing-use
      - ldc-prospective-use
      - ldc-proposed-work-lb
      - prior-approval
      - non-material-amendment
- item: Existing and proposed car parking spaces, access and turning areas and visibility splays, where
    the access is changed
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - prior-approval
- item: Boundary treatments, where works to the boundary are proposed
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
- item: The materiality of any hardstanding
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
      - ldc-proposed-work-lb
- item: Any decks, patios or terraces (for full applications, any external structures)
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - ldc-prospective-use
      - ldc-proposed-work-lb
- item: 'For adverts: the part of the site for the signage within a continuous, unbroken red line'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For hazardous substances consent (substance location plan): a metric scale bar of not less than
    1:2500 and a north point, with the part of the site needed (including access) within a red line'
  level: must
  required-if:
    application-type:
      in:
      - haz-substance-consent
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 6-7, 15-16, 39, 43, 46, 49, 52-53, 56, 63
  and 70-71. The list calls it a 'Site or Block plan'; for hazardous substances consent it is the 'Substance
  Location Plan'.
review-status: unverified
field-status: {}
