reference: noise-assessment
local-authority: EPS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - reserved-matters
        - technical-details-consent
    - any:
      - ref: major-development
      - condition:
          field: noise-generating-use
          value: true
          description: The proposal will give rise to excess noise or vibration.
      - condition:
          field: noise-sensitive-use
          value: true
          description: The proposal will suffer from excess noise or vibration, such as in town centres
            or near major roads or railways.
  - all:
    - application-type:
        in:
        - prior-approval
    - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Section 15 of the NPPF; Policy DM10 of the Development Management Policies Document 2015 (DMPD)
source-text: For major development, and where the proposal will give rise to or suffer from excess noise
  and or vibration such as in town centres, major roadways or railway corridors
must-include:
- item: Existing background noise levels measured over 24 hours (including the cumulative levels of existing
    units)
  level: must
- item: Proposed noise levels (including cumulative levels of proposed units)
  level: must
- item: Any proposed measures to reduce noise
  level: must
- item: Manufacturers' specifications of equipment to be installed, altered or replaced
  level: must
- item: The method used, with examples of the calculations and assumptions
  level: must
- item: Odour or vibration assessed where there is potential impact (e.g. commercial kitchens, railway
    corridors)
  level: must
- item: Prepared by a suitably qualified person who is a member of the Institute of Acoustics or Association
    of Noise Consultants
  level: must
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 27-28 and 35-37. The list calls it a 'Noise,
  Odour and Vibration Assessment'. For outline and reserved matters the list gives a table (page 35-36)
  of documents by matter (appearance, access, landscaping, layout, scale); for reserved matters it applies
  only when that matter is applied for, with the full planning trigger. For prior approvals the list says
  the document 'may need to' be included depending on the class and the matters for prior approval (table,
  pages 58-60), so it shows as 'check'.
review-status: unverified
field-status: {}
