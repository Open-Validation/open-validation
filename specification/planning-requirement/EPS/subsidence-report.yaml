reference: subsidence-report
local-authority: EPS
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - discretionary
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Article 16(1)(c)(iv) of the Town and Country Planning (Tree Preservation) (England) Regulations
  2012
source-text: Where the works to the tree are required because of damage relating to subsidence or other
  structural damage
must-include:
- item: The existing and likely future damage to adjoining buildings from the tree
  level: must
- item: Prepared by a suitably qualified specialist, usually a structural engineer or chartered surveyor,
    with an arboricultural report supporting the tree work proposals and options for avoiding or remedying
    the damage
  level: must
- item: Details of any insurance claim submitted against a policy
  level: must
  source-text: If an insurance claim has been submitted against a policy, details of the claim should
    form part of the application.
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 66-67. The list calls it a 'Subsidence or
  Structural Report'. It depends on the reason for the works, so it shows as 'check'.
review-status: unverified
field-status: {}
