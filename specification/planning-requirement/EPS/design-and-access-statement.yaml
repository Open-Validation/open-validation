reference: design-and-access-statement
local-authority: EPS
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: The total floorspace being created is over 100 square metres.
    - site:
        in:
        - conservation-area
        description: The site is within a conservation area.
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
source-text: Design and Access Statement … When required Where the total floorspace being created is >100m2
  and the site is within a conservation area
confidence: medium
notes: 'From the audit (missing_requirement): also required for all listed building consent applications.
  The national rules still apply.'
review-status: unverified
field-status: {}
