reference: design-and-access-statement
local-authority: EPS
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - pip
      - technical-details-consent
      - lbc
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: The total floorspace created is more than 100 sq m.
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Article 9 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015 (DMPO); Policies DM8, DM9 and DM10 of the Development Management Policies Document 2015 (DMPD)
source-text: All applications, consolidated into a Planning Statement is necessary ... Where the total
  floorspace being created is >100m2 and the site is within a conservation area
must-include:
- item: The characteristics of the site and its wider setting, the steps taken to appraise the context
    and how the design takes it into account
  level: should
- item: The approach to access and how specific access issues have been addressed
  level: should
- item: 'For listed building consent: how access, including alternative means of access, has been addressed,
    how relevant Local Plan policies have been considered, and any consultation'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 9, 17-18, 36-37 and 39. It can be combined
  with the Planning Statement; for listed buildings it can be combined with the Heritage Statement, and
  a single statement should cover a parallel planning application.
review-status: unverified
field-status: {}
