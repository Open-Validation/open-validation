reference: location-plan
local-authority: EPS
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - pip
    - technical-details-consent
    - lbc
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - ldc-proposed-work-lb
    - prior-approval
    - non-material-amendment
    - haz-substance-consent
    - mod-discharge-s106
source-url: https://www.epsom-ewell.gov.uk/sites/default/files/documents/residents/planning/planning-advice/Applications%20Validation%20Requirements_0.pdf
policy: Article 7 of the Town and Country Planning (Development Management Procedure) (England) Order
  2015 (DMPO)
source-text: All applications
must-include:
- item: Based on an up-to-date map with surrounding buildings, roads and footpaths
  level: must
- item: Named roads and numbered properties sufficient to identify the site location
  level: must
- item: A metric scale bar at 1:1250 or 1:2500 and a north point
  level: must
- item: The entire site outlined with a continuous, unbroken red line around all land needed to carry
    out the development (including access from a public highway, visibility splays and car parking, if
    appropriate); the site not coloured in
  level: must
- item: A blue line around all other land owned or controlled by the applicant, if applicable
  level: must
- item: Based on a site survey or Ordnance Survey information; Ordnance Survey plans bear a valid licence
    number
  level: must
- item: For prior approval of telecommunications development the red line is not mandatory
  level: should
  required-if:
    all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: telecommunications-development
        value: true
        description: Telecommunications development.
- item: 'For hazardous substances consent (site map): an up-to-date Ordnance Survey map with National
    Grid lines and reference numbers, at a scale of not less than 1:10,000'
  level: must
  required-if:
    application-type:
      in:
      - haz-substance-consent
- item: 'For changes to planning obligations: matches the location plan submitted with the original application'
  level: must
  required-if:
    application-type:
      in:
      - mod-discharge-s106
confidence: medium
notes: From the council's list (adopted 11 July 2024), pages 6, 15, 39, 42, 45, 48, 52, 55-56, 62, 69,
  70 and 72. Screening and scoping requests (page 69) and pre-application requests (page 73) also need
  a location plan.
review-status: unverified
field-status: {}
