reference: archaeological-assessment
local-authority: SND
required-if:
  any:
  - site:
      in:
      - scheduled-monument
      - archaeological-priority-area
      description: The site is near a Scheduled Monument or a Historic Environment Record site.
  - all:
    - condition:
        field: greenfield-site
        value: true
        description: A greenfield site.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: The site is 1 hectare or more.
  - all:
    - site:
        in:
        - listed-building
        - locally-listed-building
        description: A historic building.
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition of the building.
      - condition:
          field: structural-alteration
          value: true
          description: Major alteration of the building.
source-url: https://www.sunderland.gov.uk/media/19622/Validation-Checklist/pdf/Validation_Checklist.pdf?m=1652111555597
