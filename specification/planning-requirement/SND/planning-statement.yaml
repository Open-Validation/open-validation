reference: planning-statement
local-authority: SND
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 100
      description: 100 dwellings or more.
  - condition:
      field: floorspace-non-residential
      operator: '>='
      value: 10000
      description: A minimum of 10,000 square metres of commercial/retail development.
  - all:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: The application would be a departure from the development plan.
source-url: https://www.sunderland.gov.uk/media/19622/Validation-Checklist/pdf/Validation_Checklist.pdf?m=1652111555597
source-text: Planning Statement When is this required? All planning applications for 100 dwellings or
  more or where a minimum of 10,000 sq. metres of commercial/retail development would be created, or major
  planning applications that would constitute a departure from the development plan.
must-include:
- item: A statement of need for waste facilities
  level: must
  required-if:
    application-type:
      in:
      - waste-dev
confidence: medium
notes: The workbook guessed the application type ('INFERRED'), so no type is given. The must-include item
  is from the audit (missing_requirement, item 24).
review-status: unverified
field-status: {}
