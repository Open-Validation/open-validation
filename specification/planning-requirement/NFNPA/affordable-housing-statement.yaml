reference: affordable-housing-statement
local-authority: NFNPA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 3
      description: New residential development of 3 or more units.
  - condition:
      field: housing-floorspace
      operator: '>'
      value: 1000
      description: The floor space of the proposed housing would exceed 1,000 square metres.
  - condition:
      field: rural-exception-housing
      value: true
      description: An application for a Rural Exceptions Site (Local Plan policy SP28).
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: New Forest National Park Local Plan (2023) policies SP27 and SP28; Development Standards SPD;
  National Planning Policy Framework section 5
source-text: Required for all new residential development of 3 or more units or where the floor space
  of the proposed housing would exceed 1,000 square metres and for all applications for Rural Exceptions
  Sites under Local Plan Policy SP28 and NPPF paragraph 78.
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 2. Affordable housing is as defined in
  Annex 2 of the NPPF (2024) or its later revision.
review-status: unverified
field-status: {}
