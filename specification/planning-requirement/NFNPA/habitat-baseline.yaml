reference: habitat-baseline
local-authority: NFNPA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development would be subject to the general biodiversity gain condition (not exempt).
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: Environment Act 2021; National Planning Policy Framework section 15
source-text: When a planning application is submitted, there are minimum national information requirements
  related to biodiversity net gain for those applications which, if planning permission was granted, would
  be subject to the general biodiversity gain condition. … The existing on-site habitat plan to be submitted
  under national requirements must also include an accurate scale bar and page size.
must-include:
- item: An accurate scale bar and page size
  level: must
confidence: medium
notes: 'From the council''s list (adopted 1 September 2026), page 4. Applies to applications that would
  be subject to the statutory biodiversity gain condition: householder and other exempt applications are
  exempt by law. The list adds that the Authority ''may also seek further information about the proposed
  strategy to meet the biodiversity gain objective''; that is listed as unmapped.'
