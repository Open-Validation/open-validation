reference: design-and-access-statement
local-authority: NFNPA
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Buildings of 100 square metres or more.
source-url: https://www.newforestnpa.gov.uk/document/local-requirements-01-september-2026/
source-text: Design and Access Statement Required for all applications for major development; applications
  in a conservation area consisting of 1 or more dwellings or buildings of 100+ square metres.
confidence: medium
notes: 'Audit (wrong_app_type): the list also says ''Required for applications for listed building consent.'''
review-status: unverified
field-status: {}
