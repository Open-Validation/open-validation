reference: design-and-access-statement
local-authority: NFNPA
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Buildings of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: National Planning Practice Guidance paragraph 030 ('Making an application')
source-text: Required for all applications for major development; applications in a conservation area
  consisting of 1 or more dwellings or buildings of 100+ square metres. Required for applications for
  listed building consent.
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 4.
review-status: unverified
field-status: {}
