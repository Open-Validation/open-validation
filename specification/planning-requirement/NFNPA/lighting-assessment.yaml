reference: lighting-assessment
local-authority: NFNPA
required-if:
  condition:
    field: external-lighting
    value: true
    description: 'The proposal involves external lighting: a full assessment for large areas of external
      lighting (lit car parks, floodlighting), lighting information for small-scale lighting.'
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: New Forest National Park Local Plan (2023) policy SP15; adopted Village Design Statements; National
  Planning Policy Framework section 15 paragraph 198
source-text: Required for all proposals involving large areas of external lighting (lit car parks, floodlighting
  of buildings, structures or areas). For small scale lighting/ development, lighting information including
  Lux levels, colour temperature (CCT), location and the design of the lighting units. For large scale
  lighting/ development, a full assessment should be provided including a full external lighting plan
  with Lux levels with a Lux contour map, colour temperature (CCT), location and the design of the lighting
  units and potential impact/ mitigation.
must-include:
- item: Lux levels
  level: must
- item: Colour temperature (CCT)
  level: must
- item: Location of the lighting units
  level: must
- item: Design of the lighting units
  level: must
- item: A full external lighting plan with a Lux contour map
  level: should
  required-if:
    any:
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting of buildings, structures or areas.
    - discretionary
- item: Potential impact and mitigation
  level: should
  required-if:
    any:
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting of buildings, structures or areas.
    - discretionary
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 7. The list calls it 'Lighting Assessment/
  Lighting Information'. Where 'large scale' starts is not defined, so the full-assessment items show
  as discretionary apart from floodlighting.
review-status: unverified
field-status: {}
