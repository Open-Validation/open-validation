  Framework section 15
source-text: Ecology Surveys required for all applications for development within, adjacent or within
  close proximity to international, national or local nature conservation sites unless the Authority advises
  otherwise. Preliminary Ecological Assessment (including Potential Bat Roost Assessment) required for
  any development involving demolition or changes of a structure or changes to roof and cladding structures
  including fascias, soffits, hanging tiles and weather boarding.
