reference: section-existing
local-authority: NFNPA
required-if:
  condition:
    field: change-in-ground-levels
    value: true
    description: The proposal involves a change in ground levels, or the site slopes.
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: New Forest National Park Local Plan (2023) policies DP2, SP16, SP17, DP34, DP35 and DP36; Design
  Guide; National Planning Policy Framework paragraphs 44 and 45
source-text: Existing and proposed site sections and finished floor and site levels (1:50 or 1:100) (in
  all cases where proposals involve a change in ground levels or is on a sloping site).
must-include:
- item: Drawn at 1:50 or 1:100
  level: must
- item: Finished floor and site levels
  level: must
