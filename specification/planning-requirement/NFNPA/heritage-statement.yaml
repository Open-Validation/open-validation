source-url: https://www.newforestnpa.gov.uk/document/local-requirements-01-september-2026/
source-text: Heritage Statement (including Historical, Archaeological features and Scheduled Ancient Monuments)
  Required for all applications affecting designated and non-designated heritage assets (including historic
  parks and gardens, battlefields and Scheduled Ancient Monuments, areas of significant archaeological
  potential and areas with the potential to impact on heritage assets with archaeological interest). …
  Required for all applications within and adjacent to Conservation Areas, including demolition of non-listed
  buildings within Conservation Areas.
