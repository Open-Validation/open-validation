reference: heritage-statement
local-authority: NFNPA
required-if:
  any:
  - site:
      in:
      - listed-building
      - locally-listed-building
      - park-and-garden
      - battlefield
      - scheduled-monument
      - archaeological-priority-area
      description: The application affects a designated or non-designated heritage asset (including historic
        parks and gardens, battlefields, Scheduled Ancient Monuments and areas of significant archaeological
        potential).
  - site:
      in:
      - conservation-area
      description: Within or adjacent to a conservation area, including demolition of non-listed buildings
        in a conservation area.
  - site:
      in:
      - listed-building
      description: Affecting a listed building, including works and buildings within its curtilage.
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: New Forest National Park Local Plan (2023) policies DP2, SP16, SP17 and DP18; Design Guide; relevant
  Conservation Area Appraisals; adopted Village Design Statements; National Planning Policy Framework
  section 16
source-text: Required for all applications affecting designated and non-designated heritage assets (including
  historic parks and gardens, battlefields and Scheduled Ancient Monuments, areas of significant archaeological
  potential and areas with the potential to impact on heritage assets with archaeological interest). …
  Required for all applications within and adjacent to Conservation Areas, including demolition of non-listed
  buildings within Conservation Areas. … Required for all applications affecting Listed Buildings including
  works and buildings within the curtilage of a listed building. … Required for all applications in Conservation
  Areas and within the curtilage of a listed building that include excavations.
must-include:
- item: Reference to the Historic Environment Record, as a minimum
  level: must
- item: An assessment of the heritage asset's significance
  level: should
- item: The impact of the proposal on the heritage asset and its significance
  level: should
- item: How harm has been avoided or minimised through design mitigation
  level: should
- item: Internal and external photographs
  level: must
- item: A construction method statement giving details of appropriate working methods and practices
  level: must
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 6. The list's heading also covers historical
  and archaeological features and Scheduled Ancient Monuments.
review-status: unverified
field-status: {}
