reference: water-impact-assessment
local-authority: NFNPA
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: A net increase in dwellings.
  - condition:
      field: overnight-accommodation
      value: true
      description: A net increase in other forms of overnight accommodation.
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: Habitats Regulations; National Planning Policy Framework section 15
source-text: Nutrient Mitigation Checklist and relevant Nutrient Budget calculation required (Solent or
  River Avon) for applications proposing a net increase in dwellings or other forms of overnight accommodation.
must-include:
- item: Nutrient Mitigation Checklist
  level: must
- item: Nutrient Budget calculation for the relevant catchment (Solent or River Avon)
  level: must
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 7. The list calls it 'Nutrient Mitigation
  Information'.
review-status: unverified
field-status: {}
