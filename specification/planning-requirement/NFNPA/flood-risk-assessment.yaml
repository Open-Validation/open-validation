reference: flood-risk-assessment
local-authority: NFNPA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All development in Flood Zones 2 and 3, including householder development, small non-residential
        extensions and changes of use.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: 'Flood Zone 1: a site of 1 hectare or more.'
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: 'Flood Zone 1: a site of 1 hectare or more.'
  - site:
      in:
      - critical-drainage-area
      description: 'Flood Zone 1: land identified by the Environment Agency as having critical drainage
        problems.'
  - site:
      in:
      - future-flood-risk
      description: 'Flood Zone 1: land identified in a strategic flood risk assessment as being at increased
        flood risk in future.'
  - all:
    - site:
        in:
        - surface-water-flood-risk
        - groundwater-flood-risk
        description: 'Flood Zone 1: land that may be subject to other sources of flooding.'
    - discretionary
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: New Forest National Park Local Plan (2023) policy DP12; National Planning Policy Framework section
  14
source-text: 'A site-specific flood risk assessment should be provided for all development in Flood Zones
  2 and 3. This includes householder development, small non-residential extensions (with a footprint of
  less than 250 sq. m) and changes of use; except for changes of use to a caravan, camping or chalet site,
  or to a mobile home or park home site, where the sequential and exception tests should be applied as
  appropriate. In Flood Zone 1, an assessment should accompany all proposals involving: sites of 1 hectare
  or more; land which has been identified by the Environment Agency as having critical drainage problems;
  land identified in a strategic flood risk assessment as being at increased flood risk in future; or
  land that may be subject to other sources of flooding, where its development would introduce a more
  vulnerable use.'
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 5. Land subject to other sources of flooding
  needs one only 'where its development would introduce a more vulnerable use'; there is no field for
  flood vulnerability classes, so that part shows as discretionary. Changes of use to a caravan, camping,
  chalet, mobile home or park home site in Flood Zones 2 and 3 apply the sequential and exception tests
  instead.
review-status: unverified
field-status: {}
