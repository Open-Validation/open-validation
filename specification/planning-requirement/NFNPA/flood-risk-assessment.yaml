reference: flood-risk-assessment
local-authority: NFNPA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: All development in Flood Zones 2 and 3, including householder development.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 sites of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 sites of 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
      description: Land with critical drainage problems.
  - discretionary
source-url: https://www.newforestnpa.gov.uk/document/local-requirements-01-september-2026/
source-text: 'A site-specific flood risk assessment should be provided for all development in Flood Zones
  2 and 3. … In Flood Zone 1, an assessment should accompany all proposals involving: sites of 1 hectare
  or more;'
confidence: medium
notes: 'Audit (wrong_trigger): the workbook quoted the Heritage Statement text. From the audit: also land
  the SFRA shows at increased future risk, and land at risk from other flood sources where a more vulnerable
  use is introduced (shown as officer discretion). ''This includes householder development, small non-residential
  extensions''.'
