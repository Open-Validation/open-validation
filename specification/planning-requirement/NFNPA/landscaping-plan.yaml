reference: landscaping-plan
local-authority: NFNPA
required-if:
  all:
  - any:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Existing trees will be affected by the proposals.
    - condition:
        field: hedgerows-affected
        value: true
        description: Existing hedges will be affected by the proposals.
    - condition:
        field: loss-of-habitat-features
        value: true
        description: Other landscape features will be affected by the proposals.
  - discretionary
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: New Forest National Park Local Plan (2023) policies SP7, DP2, SP6, SP9, SP16 and SP17; New Forest
  National Park Landscape Character Assessment and Landscape Action Plan; Design Guide; National Planning
  Policy Framework section 15
source-text: Required for development where existing trees, hedges and other landscape features will be
  affected by the proposals and landscape needs to be considered as an integral part of the development.
  Proposals should include details of proposed soft & hard landscape including boundary treatments and
  means of enclosure, and its long term maintenance.
must-include:
- item: Details of proposed soft and hard landscape, including boundary treatments and means of enclosure
  level: should
- item: Long-term maintenance of the landscape
  level: should
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 7. The list calls it a 'Landscape Statement'.
  Whether 'landscape needs to be considered as an integral part of the development' is a judgement, so
  it shows as discretionary. The Landscape Visual Impact Assessment (LVIA) asked for 'for larger applications
  and/ or applications in particularly sensitive locations' has no matching id and is listed as unmapped.
review-status: unverified
field-status: {}
