source-text: 'Required for all planning applications. The statement should include details of how the
  proposal is resilient and responsive to the impacts of climate change through: improved energy efficiency;
  making appropriate use of small-scale renewable energy; its use of sustainable building techniques,
  local materials and minimising energy use and waste; water efficiency; and enabling wildlife and habitats
  to adapt to climate change.'
