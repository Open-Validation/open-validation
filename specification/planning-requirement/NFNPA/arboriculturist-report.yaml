reference: arboriculturist-report
local-authority: NFNPA
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: Protected trees (Tree Preservation Order) are included or likely to be affected.
  - all:
    - site:
        in:
        - conservation-area
        description: Trees protected by being in a conservation area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees are proposed to be lost or would be affected (directly or indirectly) by the
          development.
  - condition:
      field: veteran-trees
      value: true
      description: Ancient or veteran trees are included or likely to be affected.
  - site:
      in:
      - ancient-woodland
      description: Ancient and Semi Natural Woodland is included or likely to be affected.
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees are proposed to be lost or would be affected (directly or indirectly) by the
        development.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedgerows are proposed to be lost or would be affected (directly or indirectly).
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: New Forest National Park Local Plan (2023) policies DP2, SP6 and SP9; National Planning Policy
  Framework section 15
source-text: Required for all applications that include or are likely to affect any protected trees (TPO
  and Conservation Area), ancient or veteran trees, or Ancient and Semi Natural Woodland … Required for
  all applications where trees or hedgerows are proposed to be lost or would be affected (directly or
  indirectly) by the development.
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 3, 9. Covers both the list's 'Arboricultural
  Implications Assessment' (page 3) and 'Tree Survey/Arboricultural Implications Assessment' (page 9).
review-status: unverified
field-status: {}
