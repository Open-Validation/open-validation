reference: land-contamination-assessment
local-authority: NFNPA
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected, or the proposed use is vulnerable and the site
        is on the list of contaminated sites.
  - site:
      in:
      - near-landfill-site
      description: Within 250 metres of a currently licensed or historic landfill site.
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: New Forest National Park Local Plan (2023) policy SP15; National Planning Policy Framework section
  15
source-text: Required where contamination is known or suspected to exist or the proposed use is vulnerable
  and is included on the list of contaminated sites. Within 250 metres of a currently licensed or historic
  landfill site.
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 6.
review-status: unverified
field-status: {}
