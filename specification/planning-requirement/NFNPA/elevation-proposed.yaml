reference: elevation-proposed
local-authority: NFNPA
required-if:
  any:
  - discretionary
  - application-type:
      in:
      - s73
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: New Forest National Park Local Plan (2023) policies DP2, SP16, SP17, DP34, DP35 and DP36; Design
  Guide; National Planning Policy Framework paragraphs 44 and 45
source-text: All complete existing and proposed inset elevations where applicable. Should no change be
  proposed and only a single drawing submitted, this should be titled appropriately to reflect this. …
  Existing and proposed inset elevations where applicable. … For listed building consent applications
  where windows and doors are to be replaced, details of all new fenestration at a scale of 1:5 section
  and 1:10 elevation. Elevation plans for all heritage assets should be annotated to clearly describe
  the proposed materials. … For Section 73 (variation of condition applications), additional, scalable
  elevations and floor plans clearly showing the previous proposals superimposed over current proposals.
must-include:
- item: Complete elevations (all elevations)
  level: must
- item: Where no change is proposed and only a single drawing is submitted, the drawing titled to reflect
    this
  level: should
- item: Details of all new fenestration at 1:5 (section) and 1:10 (elevation)
  level: must
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: listed-building-works
        value: window-and-door-replacement
        description: Windows and doors are to be replaced.
- item: Annotated to clearly describe the proposed materials
  level: should
  required-if:
    site:
      in:
      - listed-building
      - locally-listed-building
      - conservation-area
      - scheduled-monument
      description: The proposal affects a heritage asset.
- item: Additional scalable elevations showing the previous proposals superimposed over the current proposals
  level: must
  required-if:
    application-type:
      in:
      - s73
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 1. Listed under 'Additional Plans', the
  local requirements for the national list's 'others as necessary'; the list gives no application types
  for them. Shown as discretionary because the list says only 'where applicable'; for Section 73 applications
  superimposed elevations are always asked for.
review-status: unverified
field-status: {}
