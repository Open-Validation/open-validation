reference: archaeological-assessment
local-authority: NFNPA
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - archaeological-priority-area
      description: Minor applications in areas of recognised archaeology.
source-url: https://www.newforestnpa.gov.uk/wp-content/uploads/2026/03/Local-Requirement-01-Sept-2026.pdf
policy: New Forest National Park Local Plan (2023) policy SP16; National Planning Policy Framework section
  16
source-text: Required for all major planning applications and minor applications in areas of recognized
  archaeology and should include details of groundworks and foundation information. All statements and
  documents must meet industry standards.
must-include:
- item: Details of groundworks and foundation information
  level: should
- item: Meets industry standards
  level: must
confidence: medium
notes: From the council's list (adopted 1 September 2026), page 3. The list calls it an 'Archaeological
  Desk-Based Assessment'.
