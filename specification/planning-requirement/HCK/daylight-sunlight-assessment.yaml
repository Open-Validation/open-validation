reference: daylight-sunlight-assessment
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - ref: major-development
    - discretionary
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: 'Daylight / Sunlight Assessment including Climate Based Light and Overheating Assessment
  … Required for: i) all major planning applications ii) any development where the proposal may have an
  adverse impact on the daylight/ sunlight of the occupiers of the site and those of neighbouring properties.'
must-include:
- item: A climate based light assessment
  level: must
- item: An overheating assessment
  level: must
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. Possible adverse daylight/sunlight
  impact has no measure, so it shows as discretionary. The checklist applies to householder, full, outline
  and variation/removal of condition applications (and to listed building consent only where it says so).
review-status: unverified
field-status: {}
