reference: waste-management-plan
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates additional units.
    - condition:
        field: involves-change-of-use
        value: true
        description: A change of use.
    - discretionary
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: Refuse & Recycling Waste Details … Required for applications that propose additional units,
  a change of use, or where premises are changed to an extent to which would require amended waste storage
  arrangements. … Site Waste Management Plan … May be required to indicate the type and volume of materials
  to be demolished/ excavated, to identify opportunities for reuse of materials, and to demonstrate management
  of disposal.
must-include:
- item: 'Site Waste Management Plan: type and volume of materials to be demolished or excavated'
  level: must
  required-if: discretionary
- item: 'Site Waste Management Plan: opportunities for reuse of materials'
  level: must
  required-if: discretionary
- item: 'Site Waste Management Plan: how disposal will be managed'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (updated 16 July 2026), Local Requirements table. Two list items share
  this id: ''Refuse & Recycling Waste Details'' and ''Site Waste Management Plan''. ''Additional units''
  is read as new dwellings or units. Premises changed so that waste storage must change, and the Site
  Waste Management Plan (''May be required''), show as discretionary. The checklist applies to householder,
  full, outline and variation/removal of condition applications (and to listed building consent only where
  it says so).'
review-status: unverified
field-status: {}
