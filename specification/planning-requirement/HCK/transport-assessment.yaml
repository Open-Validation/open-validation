reference: transport-assessment
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - ref: major-development
    - discretionary
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: Transport Assessment (TA) … Required for all major planning applications and any planning
  application where the proposed development has significant transport implications. … Transport Statement
  … Required for developments of 9 or fewer residential units or less than 1000sqm where the proposed
  development has transport implications
must-include:
- item: A Transport Statement is enough for 9 or fewer residential units or under 1,000 sq m with transport
    implications
  level: must
  required-if:
    all:
    - any:
      - condition:
          field: dwelling-count
          operator: <=
          value: 9
          description: 9 or fewer residential units.
      - condition:
          field: floorspace
          operator: <
          value: 1000
          description: Less than 1,000 sq m.
    - discretionary
confidence: medium
notes: 'From the council''s list (updated 16 July 2026), Local Requirements table. Two list items share
  this id: ''Transport Assessment (TA)'' and ''Transport Statement''. Whether a scheme has (significant)
  transport implications is a judgement, so those parts show as discretionary. The checklist applies to
  householder, full, outline and variation/removal of condition applications (and to listed building consent
  only where it says so).'
review-status: unverified
field-status: {}
