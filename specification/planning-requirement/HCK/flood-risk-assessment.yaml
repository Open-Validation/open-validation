reference: flood-risk-assessment
local-authority: HCK
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare (Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: The site is over 1 hectare (Flood Zone 1).
  - all:
    - site:
        in:
        - critical-drainage-area
        description: The site is in a Critical Drainage Area.
    - any:
      - ref: major-development
      - condition:
          field: basement
          value: true
          description: The proposal includes a basement.
  - discretionary
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
confidence: medium
notes: 'From the audit (missing_requirement): Flood Zones 2/3; sites over 1 ha in FZ1; more vulnerable
  uses (shown as officer discretion); majors and basements in Critical Drainage Areas.'
review-status: unverified
field-status: {}
