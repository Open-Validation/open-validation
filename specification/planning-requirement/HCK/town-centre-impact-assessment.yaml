reference: town-centre-impact-assessment
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: New or extended edge or out-of-centre development.
      - condition:
          field: town-centre-use-floorspace
          operator: '>'
          value: 200
          description: Use Class E(a), E(b), or entertainment or leisure development over 200 sq m gross.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Another main town centre use in an edge or out-of-centre location.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with the development plan.
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: Sequential Test and Impact Assessment … Required for proposals for new, or extension to existing
  edge or out- of centre use class E(a), E(b), or entertainment or leisure development in excess of 200
  sqm gross floor space must submit a sequential test and an impact assessment to demonstrate that there
  will be no adverse impact on the vitality and viability of all designated town centres. Impact assessments
  should also be provided for applications for other main town centre uses when they are in an edge of
  centre or out of centre location and not in accordance with the development plan.
must-include:
- item: Shows there will be no adverse impact on the vitality and viability of all designated town centres
  level: must
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. The sequential test part
  of this item is in the unmapped list. The checklist applies to householder, full, outline and variation/removal
  of condition applications (and to listed building consent only where it says so).
review-status: unverified
field-status: {}
