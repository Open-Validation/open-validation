  status: current
submission-standards:
- item: Submitted electronically via the Planning Portal (recommended); otherwise postal applications
    with an original of all forms, plans and documents
  level: should
- item: All files, including drawings, attached as PDF files
  level: must
- item: Maximum file size 20 MB per file; larger files divided into parts and appropriately titled
  level: must
- item: All drawings scaled to print at a paper size of A3 or smaller
  level: must
- item: All drawings show the print (paper) size, the scale at that print size (such as 1:50, 1:100),
    a scale bar showing one metre and ten metres (at least 0-10 m), key dimensions and a north point
  level: must
- item: 'All files clearly named: descriptive, consistent naming format, version numbers or dates, concise
    names and no special characters'
  level: must
- item: Drawing names accompanied by their drawing numbers (e.g. Proposed Roof Plan - BK2024)
  level: must
