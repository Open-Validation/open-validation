reference: archaeological-assessment
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - all:
    - any:
      - condition:
          field: new-build
          value: true
          description: A new building.
      - condition:
          field: ground-disturbance
          value: true
          description: Ground disturbance.
    - site:
        in:
        - archaeological-priority-area
        description: On or adjoining a site of archaeological interest.
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: Heritage Statement (Archaeological Assessment) … Required when any proposed development includes
  new building or ground disturbance on or adjoining a site of archaeological interest.
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. The checklist applies
  to householder, full, outline and variation/removal of condition applications (and to listed building
  consent only where it says so).
review-status: unverified
field-status: {}
