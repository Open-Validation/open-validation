reference: sustainability-statement
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Buildings (new build or conversions) with a gross internal floorspace of 1,000 sq
          m or more.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new residential units.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: A residential site of 0.5 ha or more.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Any development on a site of 1 ha or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Any development on a site of 1 ha or more.
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: 'Sustainability Impact Assessment … Required with proposals for: ▪ Buildings (new build or
  conversions) with a gross internal floorspace of 1,000 sq.m or more, ▪ Residential developments providing
  1 or more residential units, ▪ Residential sites of 0.5ha or more, ▪ Any development on a site of 1ha
  or more.'
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. The list calls it 'Sustainability
  Impact Assessment'. The checklist applies to householder, full, outline and variation/removal of condition
  applications (and to listed building consent only where it says so).
review-status: unverified
field-status: {}
