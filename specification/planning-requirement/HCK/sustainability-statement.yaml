reference: sustainability-statement
local-authority: HCK
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: 1,000 square metres GIA or more.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: One or more residential units.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 0.5
      description: A site of 0.5 hectares or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or more.
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
must-include:
- item: BREEAM Pre-Assessment
  level: must
  required-if:
    condition:
      field: floorspace-non-residential
      operator: '>='
      value: 100
      description: Non-residential new units or extensions of 100 square metres or more.
confidence: low
notes: 'From the audit (missing_requirement): Sustainability Impact Assessment for 1,000 sq m GIA or more,
  1+ residential units, or sites of ''0.5 ha/1 ha'' or more (read here as 0.5 ha residential, 1 ha non-residential;
  check). BREEAM Pre-Assessment for non-residential new units or extensions of 100 sq m or more.'
review-status: unverified
field-status: {}
