reference: heritage-statement
local-authority: HCK
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - s73
    - site:
        in:
        - listed-building
        - listed-building-setting
        - locally-listed-building
        - scheduled-monument
        - park-and-garden
        - conservation-area
        description: Affects a statutory or locally listed building or its setting, a Scheduled Ancient
          Monument or its setting, a Registered Park or Garden or its setting, is in or affects the setting
          of a conservation area, or the site is an identified non-designated heritage asset.
  - application-type:
      in:
      - lbc
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: Heritage Statement / Heritage Impact Assessment (Listed Buildings, Scheduled Ancient Monuments,
  Registered Parks and Gardens) … Required when the development affects a locally or statutory listed
  building, the setting of a locally or statutory listed building, a Scheduled Ancient Monument or the
  setting of a Scheduled Ancient Monument, affects a Registered Park or Garden, affects the setting of
  a Registered Park or Garden, the development is within a conservation area or affects the setting of
  a conservation area, and where the application site has previously been identified as a non-designated
  heritage asset. Required for listed building consent applications
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. The list adds 'Required
  for listed building consent applications', so listed building consent is included. The checklist applies
  to householder, full, outline and variation/removal of condition applications (and to listed building
  consent only where it says so).
