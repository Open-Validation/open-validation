source-text: Fire Statement … Required for all planning applications for which the applicant does not
  consider a Fire Statement to be required.
must-include:
- item: 'Where the applicant does not consider a Fire Statement to be required: a Fire Safety Reasonable
    Exception Statement (RES) instead'
  level: must
  source-text: Fire Safety Reasonable Exception Statement (RES)
confidence: medium
notes: From the council's list (updated 16 July 2026), National Requirements and Local Requirements table.
  Every application needs either a Fire Statement or a Fire Safety Reasonable Exception Statement, so
  the file applies to all the checklist's types. The checklist applies to householder, full, outline and
  variation/removal of condition applications (and to listed building consent only where it says so).
