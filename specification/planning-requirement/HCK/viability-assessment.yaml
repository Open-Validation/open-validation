reference: viability-assessment
local-authority: HCK
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: The proposal is for 10 or more units.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 0.1
      description: The site is over 1,000 square metres (0.1 hectares).
  - discretionary
