reference: biodiversity-survey-report
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - ref: major-development
    - site:
        in:
        - local-wildlife-site
        - special-protection-area
        - site-of-special-scientific-interest
        description: On or adjacent to a Site of Importance for Nature Conservation (SINC), Walthamstow
          Reservoirs Special Protection Area or a Site of Special Scientific Interest (SSSI).
    - condition:
        field: near-watercourse
        value: true
        description: Alongside watercourses and wetlands.
    - discretionary
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: 'Required for: i) All Major planning applications ii) Development which is likely to have
  an impact on wildlife and/ or biodiversity and for development on or adjacent to Sites of Importance
  for Nature Conservation (SINC), alongside watercourses and wetlands, Walthamstow Reservoirs Special
  Protection Area and Sites of Special Scientific Interest (SSSI).'
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. 'Likely to have an impact
  on wildlife and/or biodiversity' shows as discretionary. The checklist applies to householder, full,
