reference: design-and-access-statement
local-authority: HCK
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - ref: major-development
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - all:
        - application-type:
            in:
            - full
            - outline
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more new residential units.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Creating floorspace of 100 sq m or more.
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: Design and Access Statement
confidence: medium
notes: 'From the council''s list (updated 16 July 2026), National Requirements. The list names it as a
  national requirement without saying when it is needed, so the statutory triggers (DMPO article 9: major
  development, or one or more dwellings or 100 sq m in a conservation area) are used. The council''s ''Submit
  your planning application'' page says a householder statement is ''only required if the property is
  within a conservation area''.'
