reference: noise-assessment
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Development that raises issues of disturbance by noise to occupants of nearby buildings.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development close to existing sources of noise.
    - condition:
        field: use-class
        value: shop
        description: Change of use to Use Class E(a).
    - condition:
        field: use-class
        value: restaurant-cafe
        description: Change of use to Use Class E(b).
    - condition:
        field: use-class
        value: hot-food-takeaway
        description: Change of use to a hot food takeaway.
    - condition:
        field: use-class
        value: drinking-establishment
        description: Change of use to a drinking establishment (including with expanded food provision).
    - condition:
        field: use-class
        value: nightclub
        description: A nightclub, live entertainment venue or equivalent use.
    - discretionary
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: Required on applications for developments that raise issues of disturbance by noise to the
  occupants of nearby existing buildings, and for developments that are considered to be noise sensitive
  and which are close to existing sources of noise should be supported by a noise assessment prepared
  by a suitably qualified acoustician.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Sound insulation details
  level: must
  required-if:
    any:
    - condition:
        field: use-class
        value: shop
        description: Change of use to Use Class E(a).
    - condition:
        field: use-class
        value: restaurant-cafe
        description: Change of use to Use Class E(b).
    - condition:
        field: use-class
        value: hot-food-takeaway
        description: Change of use to a hot food takeaway.
    - condition:
        field: use-class
        value: drinking-establishment
        description: Change of use to a drinking establishment (including with expanded food provision).
    - all:
      - condition:
          field: involves-change-of-use
          value: true
          description: Conversion of buildings to residential use.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new residential units.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new residential units.
      - condition:
          field: classified-road
          value: true
          description: New residential development sited on a classified road.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new residential units.
      - condition:
          field: near-licensed-premises
          value: true
          description: New residential development near licensed premises.
    - all:
      - any:
        - condition:
            field: use-class
            value: general-industrial
            description: New commercial development in Use Class B2.
        - condition:
            field: use-class
            value: storage-distribution
            description: New commercial development in Use Class B8.
      - condition:
          field: near-noise-sensitive-use
          value: true
          description: Near existing residential development.
    - condition:
        field: use-class
        value: nightclub
        description: A nightclub, live entertainment venue or equivalent use.
    - discretionary
  source-text: 'Sound insulation details will be required for the following types of applications: Change
    of use to use class E(a), E(b), hot food takeaways, drinking establishments, drinking establishments
    with expanded food provision, ; conversion of buildings to residential use; new residential development
    sited on classified roads; new residential nearby to licensed premises; new commercial development
    within Use Classes B2 or B8 nearby to existing residential development; any application for nightclub,
    live entertainment venue or equivalent use.'
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. The list calls it 'Noise
  Impact Assessment and Sound Insulation Details'. Day nurseries, play areas, smoking shelters and educational
  buildings or places of worship 'may warrant noise assessments/ sound insulation details but this will
  be determined on a site by site basis', so they show as discretionary. The checklist applies to householder,
  full, outline and variation/removal of condition applications (and to listed building consent only where
  it says so).
review-status: unverified
field-status: {}
