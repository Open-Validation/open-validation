reference: air-quality-assessment
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - ref: major-development
    - all:
      - condition:
          field: new-build
          value: true
          description: New build development.
      - site:
          in:
          - air-quality-management-area
          description: An area of sub-standard air quality.
    - condition:
        field: sensitive-end-use
        value: true
        description: A development of sensitive uses.
    - discretionary
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: 'Required for: i) all Major planning applications ii) New build developments in areas of
  sub-standard air quality. iii) Developments in close proximity to sensitive uses; iv) Developments of
  sensitive uses; v) Developments involving significant demolition and construction.'
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. 'Close proximity to sensitive
  uses' and 'significant demolition and construction' have no measure, so they show as discretionary.
  The checklist applies to householder, full, outline and variation/removal of condition applications
  (and to listed building consent only where it says so).
review-status: unverified
field-status: {}
