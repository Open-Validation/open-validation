reference: affordable-housing-statement
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - all:
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 10
            description: 10 or more residential units (conventional and non-conventional).
        - condition:
            field: site-area-residential
            operator: '>'
            value: 0.1
            description: A site of more than 1,000 sq m (0.1 ha).
      - condition:
          field: affordable-housing-below-target
          value: true
          description: The proposal does not provide a policy compliant quantum and mix (by tenure and
            unit size) of affordable housing.
    - all:
      - condition:
          field: existing-affordable-housing
          value: true
          description: A housing regeneration proposal.
      - condition:
          field: affordable-housing-not-reprovided
          value: true
          description: The existing affordable housing is not at least re-provided and/or the social rented
            accommodation does not meet or exceed the existing quantum.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: 1-9 residential units (conventional and non-conventional).
      - condition:
          field: dwelling-count
          operator: <=
          value: 9
          description: 1-9 residential units.
      - condition:
          field: planning-obligations-shortfall
          value: true
          description: A financial contribution in line with the Local Plan (LP33) and the S106 SPD is
            not being provided.
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
policy: Hackney Local Plan (LP33); S106 Supplementary Planning Document
source-text: 'Affordable Housing Statement and Affordable Housing Viability Report (electronic version
  by RICS registered surveyor using EUV+ methodology in Argus): i) full, un-redacted version, and ii)
  redacted version (where information is justified as being commercially sensitive) … Required where any
  of the following applies: i) Applications providing 10 or more residential units (conventional and non-conventional)
  or on sites with an area of more than 1000sq.m or 0.1ha, unless the proposal will provide a policy compliant
  quantum and mix (by tenure and unit size) of affordable housing. … ii) housing regeneration proposals
  where the total quantum of affordable housing is not at least re-provided and/or the quantum of social
  rented accommodation does not meet or exceed the existing quantum of social rented accommodation. …
  iii) Applications providing 1-9 residential units (conventional and non-conventional) where a financial
  contribution in line with the Hackney Local Plan (LP33) and the S106 Supplementary Planning Document
  (SPD) is not being provided.'
must-include:
- item: Viability report prepared by a RICS registered surveyor using the EUV+ methodology in Argus, in
    electronic form
  level: must
- item: A full, un-redacted version
  level: must
- item: A redacted version, where information is justified as being commercially sensitive
  level: must
- item: Appropriate justification for any information redacted as commercially sensitive (without a redacted
    version the full viability report may be published)
  level: must
  source-text: Applicants must provide appropriate justification for any redacted information that they
    deem to be commercially sensitive.
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. The list asks for the
  statement and the viability report as one item; the same rule is in viability-assessment. The checklist
  applies to householder, full, outline and variation/removal of condition applications (and to listed
  building consent only where it says so).
review-status: unverified
