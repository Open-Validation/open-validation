reference: photos
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - ref: major-development
    - all:
      - condition:
          field: new-build
          value: true
          description: A new building.
      - discretionary
    - site:
        in:
        - conservation-area
        - listed-building
        description: Development affecting a conservation area or a listed building.
    - condition:
        field: telecommunications-development
        value: true
        description: A telecommunication mast application.
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: 'Photographs and Photomontages … Required for: i) All Major applications- minimum of 2 3D
  visuals showing context. ii) Any new building which would impact on the surrounding streetscene iii)
  Development affecting a conservation area or a listed building iv) All telecommunication mast applications'
must-include:
- item: At least two 3D visuals showing context
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. Whether a new building
  'would impact on the surrounding streetscene' is a judgement, so that part shows as discretionary. The
  checklist applies to householder, full, outline and variation/removal of condition applications (and
  to listed building consent only where it says so).
review-status: unverified
