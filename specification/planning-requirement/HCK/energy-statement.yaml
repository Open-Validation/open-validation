reference: energy-statement
local-authority: HCK
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: One or more new residential units.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Non-residential development creating additional floorspace.
source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
source-text: 'Required for: i) all major planning applications ii) planning applications providing 1 or
  more residential units iii) all non-residential development creating additional floorspace'
confidence: medium
notes: From the council's list (updated 16 July 2026), Local Requirements table. The list calls it 'Energy
  Strategy Statement'. The checklist applies to householder, full, outline and variation/removal of condition
  applications (and to listed building consent only where it says so).
review-status: unverified
field-status: {}
