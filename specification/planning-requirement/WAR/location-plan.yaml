reference: location-plan
local-authority: WAR
required-if:
  application-type:
    in:
    - mineral-extraction
    - mineral-app
source-url: https://api.warwickshire.gov.uk/documents/WCCC-888-53
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: The application must be accompanied by TWO COPIES OF ALL plans showing the following:- …
  The location of the site (on OS base at scale no greater than 1:2500).
must-include:
- item: On an Ordnance Survey base at a scale no greater than 1:2500
  level: must
  source-text: The location of the site (on OS base at scale no greater than 1:2500).
- item: The site boundary edged in red
  level: must
  source-text: The boundary of the site, edged in red (preferably at 1:1250 scale)
- item: Site boundary preferably at 1:1250
  level: should
  source-text: The boundary of the site, edged in red (preferably at 1:1250 scale)
- item: Any adjoining land owned or controlled by the applicant edged in blue
  level: must
  source-text: Any adjoining land, owned by, or in control of, the applicant, edged in blue.
- item: Two copies of all plans
  level: must
  source-text: The application must be accompanied by TWO COPIES OF ALL plans
confidence: medium
notes: Warwickshire County Council publishes no local validation list (checked 2026-11-06); minerals,
  waste and Regulation 3 applications follow the national requirements. From the council's 'Notes on making
  a planning application for mineral working in Warwickshire' (dated 26 July 2017), linked from its 'Applying
  for planning permission' page, page 2. The notes are for mineral working applications only; waste and
  Regulation 3 applications go through the Planning Portal with the national requirements. The council's
  mineral working application form (2017) instead asks for five copies of the form and plans.
