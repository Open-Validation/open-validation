validation-list:
  url: https://www.warwickshire.gov.uk/planning/applying-planning-permission
  date: ''
  date-basis: 'Warwickshire County Council has no local validation list, so there is no list date. Checked
    2026-11-06: its ''Applying for planning permission'' page (this url, undated) sends district-type
    applications to the district and borough councils, takes waste and county council (Regulation 3) applications
    through the Planning Portal and gives its own form for mineral working; the only guidance it links
    is ''Notes on making a planning application for mineral working in Warwickshire'' (dated 26 July 2017,
    https://api.warwickshire.gov.uk/documents/WCCC-888-53), which lists plans to submit. The ''Guidance
    Notes for the Preparation of Mineral Assessment Reports'' (July 2025, https://api.warwickshire.gov.uk/documents/WCCC-772545854-1773)
    are for district local plans and non-mineral applications, where the county is a consultee. A site
    search for ''validation list'', ''local validation'' and ''validation checklist'' found only links
    to the district and borough checklists, and MHCLG''s register (planning.data.gov.uk) has no entry
    for the county. Minerals, waste and Regulation 3 applications therefore follow the national requirements'
  status: national-only
