reference: environmental-statement
local-authority: WAR
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
      - reg-3
  - condition:
      field: eia-development
      value: true
      description: Development judged to have significant environmental effects (EIA development).
source-url: https://www.warwickshire.gov.uk/planning/applying-planning-permission
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: You may also need to submit an Environmental Impact Assessment (EIA). An EIA is required
  in connection with planning applications for certain types of development which are judged to have significant
  environmental effects. Please contact us if you are unsure whether an EIA is necessary.
confidence: medium
notes: Warwickshire County Council publishes no local validation list (checked 2026-11-06); minerals,
  waste and Regulation 3 applications follow the national requirements. From the council's 'Applying for
  planning permission' page (read 2026-11-06), section 'Environmental Impact Assessment (EIA)'. This is
  the national EIA rule; the page applies it to the minerals, waste and Regulation 3 applications it handles.
