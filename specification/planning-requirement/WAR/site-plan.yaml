reference: site-plan
local-authority: WAR
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
  - discretionary
source-url: https://api.warwickshire.gov.uk/documents/WCCC-888-53
source-text: Where appropriate the following information should also be shown on the drawings:-
must-include:
- item: The existing surface levels over the site and immediately adjacent land
  level: should
  source-text: The existing surface levels over the site and immediately adjacent land.
- item: The method of working, including area of extraction, direction and phasing
  level: should
  source-text: The method of working, including area of extraction, direction and phasing.
- item: The proposed surface area, height and location of mineral stockpiles, topsoil, subsoil and overburden
    mounds
  level: should
  source-text: The proposed surface area, height and location of mineral stockpiles, topsoil, subsoil
    and overburden mounds.
- item: The sites and dimensions of existing and proposed buildings and fixed plant
  level: should
  source-text: The sites and dimensions of existing and proposed buildings and fixed plant.
- item: The sites of settling lagoons and means of drainage
  level: should
  source-text: The sites of settling lagoons and means of drainage.
- item: Access to the site, parking and loading areas
  level: should
  source-text: Details of the access to the site, parking, loading areas etc.
- item: Details and phasing of landscaping works for screening the site
  level: should
  source-text: Details and phasing of landscaping works proposed for the screening of the site.
- item: Existing vegetation and any trees and hedging to be removed
  level: should
  source-text: Details of existing vegetation and any trees and hedging to be removed.
- item: Landscaping and restoration, including final levels of the restored site
  level: should
  source-text: Details of landscaping and restoration, including final levels of the restored site.
- item: Any services crossing or adjacent to the site (e.g. gas or electricity)
  level: should
  source-text: Details of any services crossing or adjacent to the site, e.g. gas or electricity.
- item: Any public rights of way affected, with any proposals for their closure or diversion
  level: should
  source-text: Details of any public rights of way affected by the operations, together with any proposals
    for their closure or diversion.
- item: Land that will remain unworked within the application area
  level: should
  source-text: Land that will remain unworked within the application area.
- item: Results of any exploration or prospecting work, showing the mineral deposit in relation to the
    surface soil, the remainder of the overburden and the level of the water table
  level: should
  source-text: 'The results of any exploration or prospecting work, showing the mineral deposit in relation
    to:'
- item: Any exploration or prospecting work carried out on adjacent land
  level: should
  source-text: Details of any exploration or prospecting work carried out on adjacent land.
- item: Neighbouring properties, including their uses
  level: should
  source-text: Details of neighbouring properties, including uses.
confidence: medium
notes: Warwickshire County Council publishes no local validation list (checked 2026-11-06); minerals,
  waste and Regulation 3 applications follow the national requirements. From the council's 'Notes on making
  a planning application for mineral working in Warwickshire' (dated 26 July 2017), linked from its 'Applying
  for planning permission' page, page 2. The notes list what 'should also be shown on the drawings' 'where
  appropriate', without naming a drawing, so it is filed as the site plan and shown as discretionary,
  with every item at 'should'.
