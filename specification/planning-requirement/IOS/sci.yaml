reference: sci
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - ref: major-development
    - condition:
        field: departure-from-development-plan
        value: true
        description: Any departure from the development plan.
    - condition:
        field: eia-development
        value: true
        description: EIA development.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: Council of the Isles of Scilly Statement of Community Involvement (2024)
source-text: Required for ‘Significant Applications’ which for Scilly is any major development, any departure
  from the development plan, EIA development applications.
must-include:
- item: How and when consultation was carried out and how equality groups' needs were considered
  level: must
- item: The issues raised and whether the scheme changed as a result, and if not why not
  level: must
- item: Where there was no community involvement, a statement confirming 'Nil Involvement'
  level: must
  source-text: Where no Community Involvement has been conducted the Statement must still be provided
    and should confirm ‘Nil Involvement’
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 22, 23, 31. The list's 'Community Involvement
  Statement'; it may be included in a planning statement.
review-status: unverified
field-status: {}
