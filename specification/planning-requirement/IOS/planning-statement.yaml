reference: planning-statement
local-authority: IOS
required-if:
  application-type:
    in:
    - hh
    - full
    - s73
    - non-material-amendment
    - ldc-prospective-use
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraph 11; Planning and Compulsory Purchase Act 2004 section 38(6)
source-text: A Planning Statement is required for this application type, unless the information is submitted
  within the Design & Access / Heritage Statement.
must-include:
- item: The principles behind, and justification for, the development
  level: must
- item: How the development complies with national and local planning policies
  level: must
- item: Any pre-application consultation, including with the council
  level: must
- item: Where the proposal does not accord with policy, that is acknowledged with reasons why permission
    should be granted
  level: should
- item: 'Section 73 and non-material amendments: a description of the works and the reasons for them,
    unless in the application form'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
  source-text: information (a detailed description of works and the reason(s) for ☐ the works/removal)
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 8, 16, 17, 20, 36, 37, 48, 51, 55. Not
  needed where the information is in the Design and Access Statement or Heritage Statement (or, for section
  73 and non-material amendments, the application form). Proposed-use lawful development certificates
  need a planning statement (page 55).
review-status: unverified
field-status: {}
