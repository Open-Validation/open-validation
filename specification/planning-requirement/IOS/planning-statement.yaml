source-text: 'Full planning: Planning Statement [Guidance] LR (Local Requirement) a) A Planning Statement
  is included; ☐ b) A Planning Statement has not been included, as the information required is contained
  within the Design & Access Statement and/or Heritage Statement. ☐ 9.


  Variation of condition s73: Planning Statement LR (Local Requirement) a) A Planning Statement is included;
  or ☐ b) A Planning Statement has not been included because the information (a detailed description of
  works and the reason(s) for the works/removal) has been included in the application form. ☐ Explanation
  for not submitting any of the above information which will be taken into account when deciding whether
  your application can be registered: I am the applicant: ☐ I am acting on behalf of the applicant: ☐
  Page 48 of 5


  Non-material amendment: Planning Statement LR (Local Requirement) a) A Planning Statement is included;
  or ☐ b) A Planning Statement has not been included because the information (a description of works and
  the reason(s) for the works/removal) has been included in the application form. ☐ Explanation for not
  submitting any of the above information which will be taken into account when deciding whether your
  application can be registered: I am the applicant: ☐ I am acting on behalf of the applicant: ☐ Page
  51 of 59 Nationa'
