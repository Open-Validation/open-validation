reference: archaeological-assessment
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: Works include trenching or foundations.
      - site:
          in:
          - archaeological-priority-area
          - listed-building
          - scheduled-monument
          description: On or adjoining a site of known or suspected archaeological interest, such as Archaeological
            Constraint Areas, listed buildings or scheduled monuments.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings.
    - all:
      - condition:
          field: new-build
          value: true
          description: New employment buildings.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 0
          description: Employment floorspace.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraphs 202-221; Isles of Scilly Local Plan 2015-2030 Policy OE7
source-text: Development proposals where works include trenching or foundations on or adjoining a site
  of known or suspected archaeological interest, such as sites within Archaeological Constraint Areas,
  listed buildings or scheduled monuments. All development proposals for new dwellings and new employment
  buildings.
must-include:
- item: The likelihood and possible nature of any archaeology present and the risk the development poses
    to it, drawing on historic maps, aerial photographs, journals and databases
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 22, 30. The list's 'Archaeological Assessment
  (Written Scheme of Investigation)' / 'Archaeological Monitoring Brief'.
review-status: unverified
field-status: {}
