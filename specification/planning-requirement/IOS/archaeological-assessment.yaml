reference: archaeological-assessment
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: Trenching or foundations.
      - site:
          in:
          - archaeological-priority-area
          description: Near known archaeology.
    - all:
      - condition:
          field: new-build
          value: true
          description: New-build development.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: All new dwellings.
    - all:
      - condition:
          field: new-build
          value: true
          description: New-build development.
      - condition:
          field: floorspace-non-residential
          operator: '>='
          value: 1
          description: New employment buildings.
source-url: https://www.scilly.gov.uk/sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf
confidence: medium
notes: 'From the audit (wrong_app_type): the 2025 list asks for it for Full applications only, for trenching/foundations
  near known archaeology, all new dwellings and new employment buildings. The workbook''s rows quoted
  the 2021 checklists.'
review-status: unverified
field-status: {}
