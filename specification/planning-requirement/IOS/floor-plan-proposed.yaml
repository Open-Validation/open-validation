  Full planning, Variation of condition s73, Non-material amendment: Portal Guidance] Floor Plans – The
  floor plan is a view from above and is used to show the layout of a building, it is likely you will
  need both existing and proposed plans.


  Listed building consent: include plans, elevations, and vertical and horizontal sections, must be to
  a scale of 1:20, and should include all details of the work to be carried out (for example all new doors,
  windows, window or door furniture, shop fronts, panelling, fireplaces, plaster moulding and other decorative
  details) and must also indicate the relationship of the proposed works to adjacent existing structures/details.
