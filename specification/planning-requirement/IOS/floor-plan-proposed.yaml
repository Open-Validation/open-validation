reference: floor-plan-proposed
local-authority: IOS
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - discretionary
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The floor plan is a view from above and is used to show the layout of a building, it is
  likely you will need both existing and proposed plans. The floor plan should be drawn to a scale of
  1:50 or 1:100 and include: a scale bar; new and existing storeys affected by the proposal with clear
  labels annotating the floor it represents; the use of each room and any windows, doors and walls; the
  area of an extension or additional floors; and show any walls to be demolished.'
must-include:
- item: Scale of 1:50 or 1:100 with a scale bar
  level: must
- item: New and existing storeys affected, each clearly labelled
  level: must
- item: The use of each room and any windows, doors and walls; the area of an extension or additional
    floors; any walls to be demolished
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 13, 28, 43, 49, 52, 55, 57. Part of 'Metric
  Scale Plans and Drawings' (NR); the list says 'it is likely you will need both existing and proposed
  plans'. Section 73 and non-material amendment applications need 'Metric Scale Plans and Drawings' that
  clearly show the amendments; the list asks applicants to check with the council which plans will be
  replaced, so those types are discretionary (pages 48, 51).
review-status: unverified
field-status: {}
