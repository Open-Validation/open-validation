reference: roof-plan-existing
local-authority: IOS
required-if:
  all:
  - any:
    - application-type:
        in:
        - hh
        - full
        - lbc
        - ldc-prospective-use
    - all:
      - application-type:
          in:
          - s73
          - non-material-amendment
      - discretionary
  - condition:
      field: roof-alteration
      value: true
      description: Changes to the appearance, shape or position of a roof.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Roof plans are required when changes are made to the appearance, shape or position of a roof
  within a development. Both the existing and proposed
must-include:
- item: Scale of 1:50 or 1:100
  level: must
- item: 'All roof features: ridges, valleys, dormer windows, roof lights and other features such as chimneys'
  level: must
- item: Existing and proposed materials and colours
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 14, 28, 43, 50, 53, 57.
review-status: unverified
field-status: {}
