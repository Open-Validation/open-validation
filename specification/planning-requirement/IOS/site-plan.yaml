policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A site plan (also known as a block plan) should show the proposed development in relation
  to the site boundaries and other existing buildings on the site, with dimensions specified including
  those to the boundaries. It should be draw at an identified standard metric scale, typically 1:100,
  1:200 or 1:500 and must have a north point. The inclusion of a linear scale bar is recommended. It should
  also include the following, unless they would not influence or be affected by the proposed development:
  (a) all buildings, roads and footpaths on land adjoining the site including access arrangements; (b)
  all public rights of way crossing or adjoining the site; (c) the position of all trees on the site,
  and those on adjacent land; (d) the extent and the type of any hard surfacing; (e) the boundary treatment
  including walls or fencing where this is proposed; (f) any buildings to be demolished; (g) details of
  recycling and waste storage.'
