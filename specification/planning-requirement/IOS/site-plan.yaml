source-text: 'Householder: Block plan of the site, showing: site boundaries; the type and height of boundary
  treatment (e.g. walls, fences), where a change is proposed; the position of any building or structure
  on the other side of such boundaries, where these could influence or be affected by the proposed development.


  Full planning: proposed elevations, site plan (block plan), existing and proposed floor plans, and a
  Planning Statement. ☐ Explanation for not submitting any of the above information which will be taken
  into account when deciding whether your application can be registered: I am the applicant: ☐ I am acting
  on behalf of the applicant: ☐ Page 55 of 59 National Requirements Application Form All sections need
  to be completed using the relevant form from the Planning Portal.


  Listed building consent: Site Plan [Guidance] NR ☐ 4.


  Variation of condition s73, Non-material amendment: Site (Block) Plan – Please see the Site Plan guidance
  above.'
must-include:
- item: The proposed development in relation to the site boundaries and other existing buildings on the
    site, with dimensions including those to the boundaries
  level: must
- item: An identified standard metric scale, typically 1:100, 1:200 or 1:500
  level: must
- item: A north point
  level: must
