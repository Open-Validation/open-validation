reference: elevation-existing
local-authority: IOS
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - ldc-prospective-use
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - discretionary
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'You will need to provide existing and proposed drawings with your application to a scale
  of 1:50 or 1:100 and include a scale bar. Elevations should be clearly identified as North, South, East,
  West. They must show every side affected by the proposal, with the following details: the relevant face
  of the building; fittings such as doors or windows; dimensions of the building; wall and roof materials,
  colours and finishes; the boundaries of the property; any additional features.'
must-include:
- item: Scale of 1:50 or 1:100 with a scale bar
  level: must
- item: Identified as North, South, East, West
  level: should
- item: Every side affected by the proposal, showing the relevant face, doors and windows, dimensions,
    wall and roof materials, colours and finishes, the property boundaries and any additional features
  level: must
- item: A unique drawing number for use in the decision notice
  level: should
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 13, 28, 43, 49, 52, 55, 57. Part of 'Metric
  Scale Plans and Drawings' (NR). Section 73 and non-material amendment applications need 'Metric Scale
  Plans and Drawings' that clearly show the amendments; the list asks applicants to check with the council
  which plans will be replaced, so those types are discretionary (pages 48, 51).
