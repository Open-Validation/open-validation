reference: flood-risk-assessment
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: 1 hectare or greater (in Flood Zone 1).
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: 1 hectare or greater (in Flood Zone 1).
    - site:
        in:
        - flood-risk-zone
        description: New development in Flood Zones 2 and 3 (Environment Agency), including changes of
          use to a more vulnerable use.
    - condition:
        field: low-lying-land
        value: true
        description: Low-lying land below 5 m datum, where there is a potential risk of flooding.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraphs 44, 171, 178; Isles of Scilly Local Plan 2015-2030 Policy SS7
source-text: Development proposals of 1 hectare or greater in Flood Zone 1 and for all proposals for new
  development located in Flood Zones 2 and 3 as designated by the Environment Agency. This includes changes
  of use applications where the proposed use is more vulnerable. ... A Flood Risk Assessment (FRA) will
  be required for development on a site where there is a potential risk of flooding, including areas below
  5m datum.
must-include:
- item: Identifies and assesses the risks of all forms of flooding to and from the development
  level: must
- item: How the flood risks will be managed, taking climate change into account
  level: must
- item: 'The estimated flood level: the depth of flooding expected on the site in a 1 in 200 annual probability
    tidal flood plus a climate change allowance'
  level: should
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 10, 15, 16, 22, 33, 34. The checklists
  say an FRA can be left out only if the property is not in Flood Zones 2 or 3 or on low-lying land below
  5 m datum and the plans show how surface water will be dealt with.
review-status: unverified
field-status: {}
