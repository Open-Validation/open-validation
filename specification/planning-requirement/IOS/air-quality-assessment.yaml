reference: air-quality-assessment
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: use-class
        value: industrial
        description: New industrial uses.
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development.
      - site:
          in:
          - contaminated-land
          description: On a site suspected to be contaminated.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: Residential developments of 5 or more homes.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraph 199; Isles of Scilly Local Plan 2015-2030 Policy OE3
source-text: Development proposals that involve new industrial uses, residential development proposals
  on sites suspected to be contaminated or residential developments of 5 or more homes.
must-include:
- item: The change in air quality from the development and appropriate mitigation
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), page 30.
review-status: unverified
field-status: {}
