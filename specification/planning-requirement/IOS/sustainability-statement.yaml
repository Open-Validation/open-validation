reference: sustainability-statement
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
  - any:
    - condition:
        field: new-build
        value: true
        description: Any new buildings.
    - condition:
        field: involves-change-of-use
        value: true
        description: Conversions.
    - condition:
        field: residential-extension
        value: true
        description: Domestic extensions.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraphs 7, 16, 39, 125; Isles of Scilly Local Plan 2015-2030 Policies SS1, SS2, SS6
source-text: Development proposals for any new buildings and conversions as well as for domestic extensions.
must-include:
- item: On-site solutions to reduce energy and water consumption, including water harvesting and micro-generation
  level: must
- item: How the water consumption standard of 110 litres per person per day is met, with existing and
    proposed figures
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New homes.
    - condition:
        field: residential-intensification
        value: true
        description: An intensification in residential accommodation or enlargement of an existing building
          or use.
  source-text: All new residential units will be required to meet higher water consumption standards of
    110 litres of water per person per day.
- item: 'Renewable energy: siting, specification, power output and battery storage location'
  level: must
  required-if:
    condition:
      field: renewable-energy-development
      value: true
      description: The proposal includes renewable energy generation.
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 9, 17, 20, 21, 37, 38. The list's 'Statement
  of Sustainable Design Methods' / 'Scheme of Sustainable Design Measures'. It can be left out where the
  site already has adequate energy and water saving measures shown on the plans, or dealt with by a pre-commencement
  condition (extra fee).
review-status: unverified
field-status: {}
