reference: biodiversity-survey-report
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
  - any:
    - condition:
        field: demolition
        value: true
        description: Demolition of any building.
    - condition:
        field: roof-alteration
        value: true
        description: Alterations to any roof of a building.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development of 1 or more new dwellings.
    - condition:
        field: protected-species
        value: true
        description: Protected species are known to be present.
    - site:
        in:
        - special-area-of-conservation
        - special-protection-area
        - site-of-special-scientific-interest
        - local-nature-reserve
        description: Within or adjacent to a designated nature conservation site (SAC, SPA, SSSI, LNR
          and biodiversity network).
    - condition:
        field: veteran-trees
        value: true
        description: Tree works to aged or veteran trees.
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting green space, or lighting churches or listed buildings.
    - condition:
        field: intertidal-development
        value: true
        description: Development on or over intertidal habitats.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraphs 187, 192; Isles of Scilly Local Plan 2015-2030 Policies SS2, SS3, OE2; Isles
  of Scilly Biodiversity and Geodiversity SPD
source-text: Development proposals for any demolition of a building, alterations to any roof of a building,
  for residential development of 1 or more new dwellings, development proposed where protected species
  are known to be present, if the proposal is within or adjacent to a designated nature conservation site
  (SAC, SPA, SSSI, LNR and biodiversity network), for any proposed tree works of aged or veteran trees,
  floodlighting green space or lighting churches/listed buildings; development on or over intertidal habitats
must-include:
- item: An assessment of the impact on bats or other protected species, such as a Preliminary Ecological
    Appraisal / Preliminary Roost Assessment / bat presence-absence survey
  level: must
- item: Further bat emergence surveys where the initial survey shows they are needed
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: The initial survey recommends further surveys.
confidence: medium
notes: 'From the council''s list (adopted 18 November 2025), pages 10, 15, 22, 32. The list''s ''Ecological
  Assessment / Bat Survey'' (full: ''... Mitigation and Enhancement Strategy'').'
review-status: unverified
field-status: {}
