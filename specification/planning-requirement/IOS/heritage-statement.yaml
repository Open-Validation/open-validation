reference: heritage-statement
local-authority: IOS
required-if:
  any:
  - site:
      in:
      - listed-building
      - park-and-garden
      - scheduled-monument
      - conservation-area
      description: Affects a designated heritage asset or its setting (listed buildings, registered historic
        parks and gardens, scheduled monuments), or the special character or appearance of the conservation
        area.
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - locally-listed-building
        description: The council identifies a non-designated heritage asset.
    - discretionary
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraphs 202-221; Isles of Scilly Local Plan 2015-2030 Policy OE7
source-text: Any application which affects a ‘designated heritage asset’ or its setting. Designated Heritage
  Assets on the Isles of Scilly include Listed Buildings, Registered Historic Parks and Gardens and Scheduled
  Monuments. A Heritage Statement may also be requested if the Council identifies a building or site as
  a ‘non- designated heritage asset’ of architectural, historic, archaeological or artistic interest during
  the pre-application or application process.
must-include:
- item: The significance of the building, site or area (the heritage asset), in proportionate detail
  level: must
- item: The extent and nature of the proposed development and its impact on the heritage asset
  level: must
- item: The justification for the works and any mitigation proposed
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 8, 14, 19, 23, 34, 41, 44. A heritage
  statement may also be requested for a building or site the council identifies as a non-designated heritage
  asset, so that part is discretionary. The whole of the Isles of Scilly is a conservation area.
review-status: unverified
field-status: {}
