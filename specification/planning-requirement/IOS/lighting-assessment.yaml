reference: lighting-assessment
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - notice-trees-in-con-area
      - consent-under-tpo
  - any:
    - condition:
        field: external-lighting
        value: true
        description: Outdoor lighting is proposed.
    - all:
      - condition:
          field: dark-sky-impact
          value: true
          description: The proposal could have an adverse impact on the islands' dark night skies.
      - discretionary
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraph 198(c); Isles of Scilly Local Plan 2015-2030 Policies OE1, OE4
source-text: Householder, planning permission, listed building consent and tree works where outdoor lighting
  is proposed. Proposals that have the potential to have an adverse impact on the islands dark night skies.
must-include:
- item: How adverse impacts on amenity (including highway safety), wildlife and sky glare for adjoining
    properties will be reduced
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 10, 15, 23, 33. The list's 'External
  Illumination Statement/Assessment'. 'Proposals that have the potential to have an adverse impact on
  the islands dark night skies' is a judgement, so discretionary.
review-status: unverified
field-status: {}
