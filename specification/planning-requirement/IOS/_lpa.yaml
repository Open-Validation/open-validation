local-authority: IOS
name: Council of the Isles of Scilly
region: South West
type: Unitary
review-status: unverified
validation-list:
  url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
  date: 2025-11-18
  date-basis: 'Cover: ''Adopted | 18/11/2025'' (consultation 22/08/2025 - 03/10/2025); page 4: ''it was
    adopted on 18th November 2025'' and ''This Checklist will operate until 18th November 2027''. The
    council''s Planning Application Process page says Members adopted the updated checklist in November
    2025 and links the same PDF (identical file at /sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf).
    No newer list found.'
  status: current
submission-standards:
- item: Drawings to a recognised metric scale; existing and proposed elevations and floor plans at 1:50
    or 1:100 with a scale bar
  level: must
- item: Location plan typically at 1:1250 or 1:2500, scaled to fit A4 or A3 wherever possible
  level: should
- item: Location and site plans have a north point; plans based on Ordnance Survey maps carry the Ordnance
    Survey copyright notice
  level: must
- item: A linear scale bar on location and site plans
  level: should
- item: Every plan and drawing has a unique number for use in the decision notice
  level: should
- item: Plans, elevations and sections match one another
  level: must
- item: Where a local requirement is not provided, a written statement justifying why accompanies the
    application
  level: must
- item: The biodiversity metric submitted as an Excel file and the Biodiversity Gain Plan as a PDF
  level: must
- item: Applications via the Planning Portal (encouraged), by email to planning@scilly.gov.uk or by post,
    with the fee paid by phone for email and post submissions
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the current November 2025 Local Validation Checklist (adopted 18/11/2025),
    though robots.txt blocks automated fetching from that path. Much of the extraction is drawn from superseded
    2021 checklists: LBC rows are mostly Full-planning requirements, ''HIA'' was misread as Health Impact
    Assessment, and new 2025 local requirements and separate checklists (advert, LDC, discharge, tree
    works) were missed. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
