reference: waste-management-plan
local-authority: IOS
required-if:
  application-type:
    in:
    - hh
    - full
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraph 223; Isles of Scilly Local Plan 2015-2030 Policies SS1, SS2, OE5
source-text: A Site Waste Management Plan is needed for all types of proposed development and should demonstrate
  the efficient use of construction materials and methods so that waste is minimised and any waste that
  is produced can be re‐used, recycled or recovered in other ways before disposal options are explored.
must-include:
- item: The amount and type of construction waste and how it will be reused, recycled or disposed of
  level: must
- item: Space for daily storage of waste and recycling, and a suitable, accessible, secure, vermin-proof
    presentation area for collection vehicles
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 8, 9, 17, 20, 37. The checklist allows
  it to be left out where the development produces no waste or the plans show full reuse of waste materials,
  or to be dealt with by a pre-commencement condition (extra fee).
review-status: unverified
field-status: {}
