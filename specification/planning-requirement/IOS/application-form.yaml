reference: application-form
local-authority: IOS
required-if:
  always: true
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All sections need to be completed using the relevant form from the Planning Portal.
must-include:
- item: Ownership and agricultural holdings certificate (A, B, C or D) completed, where it is part of
    the form
  level: must
  source-text: If included in the application form, an ownership and agricultural holdings certificate
    (A, B, C or D) must be completed stating the ownership of the property and whether or not the site
    includes an agricultural holding.
- item: Notice served on owners of the application site (Article 14 of the DMPO and/or Regulation 6 of
    the Planning (Listed Buildings and Conservation Areas) Regulations 1990); all agricultural tenants
    notified before submission
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - lbc
      - advertising
      - s73
      - non-material-amendment
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 12, 26, 41, 46, 49, 52, 54, 56, 59. Each
  checklist starts with the application form (NR). A common reason for invalid applications is a form
  not signed or dated correctly, or the wrong ownership certificate (page 5).
review-status: unverified
field-status: {}
