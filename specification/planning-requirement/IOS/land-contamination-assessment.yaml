reference: land-contamination-assessment
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - full
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected on, or in the vicinity of, the site.
  - any:
    - condition:
        field: ground-disturbance
        value: true
        description: Groundworks are proposed.
    - condition:
        field: sensitive-end-use
        value: true
        description: A vulnerable or sensitive end user, i.e. new housing, schools, nurseries, hospitals
          and allotments.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraph 196; Isles of Scilly Local Plan 2015-2030 Policy OE3
source-text: Where contamination is known or suspected, or the development site is in the vicinity of
  such land, and groundworks are proposed; or, there is a vulnerable or sensitive end user i.e. new housing,
  schools, nurseries, hospitals and allotments.
must-include:
- item: The existence and nature of contamination, the risks to the development and whether remediation
    is feasible
  level: must
- item: A desk study of current and historic uses of the site and adjoining land, with a site reconnaissance
  level: must
confidence: medium
notes: 'From the council''s list (adopted 18 November 2025), pages 23, 31, 32. Read as: contamination
  known, suspected or nearby, and either groundworks or a sensitive end use (the checklist''s ''not included''
  box gives both conditions).'
review-status: unverified
field-status: {}
