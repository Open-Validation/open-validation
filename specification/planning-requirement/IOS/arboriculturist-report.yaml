reference: arboriculturist-report
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees within 15m of the proposed works or of areas where ground levels are
        proposed to be changed.
source-url: https://www.scilly.gov.uk/sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf
source-text: Tree Survey [Guidance] LR … a) There are no trees within 15m of the proposed works, or areas
  where ground levels are proposed to be changed; or ☐ b) The plans identify any trees within 15m of any
  development and the submission includes an assessment of the impact of the development on those trees,
  including tree protection measures in accordance with the British Standard.
must-include:
- item: Plans identify any trees within 15m of any development
  level: must
- item: An assessment of the impact of the development on those trees, including tree protection measures
    in accordance with the British Standard
  level: must
confidence: medium
notes: Rebuilt from the 2025 list (audit outdated_link). The 2021 rows (removal of trees in a conservation
  area) are superseded. The audit lists Tree Survey as a 2025 Householder local requirement.
review-status: unverified
field-status: {}
