reference: arboriculturist-report
local-authority: IOS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees within 15 m of the works or of areas where ground levels change, or trees
            to be removed in the conservation area.
  - application-type:
      in:
      - consent-under-tpo
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraph 136; Isles of Scilly Local Plan 2015-2030 Policies OE2, OE1, OE7, LC6; BS
  5837
source-text: Development proposals require the removal of trees in a conservation area. Where Tree Felling
  or Tree Works are proposed to a tree with a Tree Preservation Order ... The plans identify any trees
  within 15m of any development and the ☐ submission includes an assessment of the impact of the development
  on those trees, including tree protection measures in accordance with the British Standard.
must-include:
- item: A plan of the position of the trees and a schedule describing them
  level: must
- item: An assessment of the impact of the development on trees within 15 m, with tree protection measures
    to the British Standard
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
- item: A tree constraints plan and an arboricultural method statement
  level: should
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 10, 11, 18, 22, 38, 39, 58. The list's
  'Tree Survey / Assessment'. For works to TPO trees, the tree works checklist asks for 'a Tree Survey
  or Aboricultural Assessment' (page 58).
review-status: unverified
field-status: {}
