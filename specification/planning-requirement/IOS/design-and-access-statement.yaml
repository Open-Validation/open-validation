reference: design-and-access-statement
local-authority: IOS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Creating 100 square metres or more of floorspace.
  - all:
    - application-type:
        in:
        - full
    - any:
      - ref: major-development
      - all:
        - site:
            in:
            - conservation-area
            - world-heritage-site
            description: In a conservation area.
        - any:
          - condition:
              field: floorspace
              operator: '>='
              value: 100
              description: Creating 100 square metres or more of floorspace.
          - condition:
              field: dwelling-count
              operator: '>='
              value: 1
              description: One or more dwellings.
  - application-type:
      in:
      - lbc
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A Design & Access Statement is included because the proposed development ☐ is creating 100
  square meters or more of floorspace; or ... A Design & Access Statement has not been included as the
  type of development proposed does not require a Design & Access Statement to be submitted.
must-include:
- item: Explains and justifies the proposal in a structured way, proportionate to its scale and complexity
  level: should
- item: The design principles and concepts applied, and how access issues have been dealt with
  level: should
- item: 'Major development: a section on climate change and sustainability'
  level: must
  required-if:
    ref: major-development
  source-text: A section regarding Climate Change and Sustainability should also be included for major
    development proposals.
- item: Not a substitute for other national or local list requirements
  level: must
confidence: medium
notes: 'From the council''s list (adopted 18 November 2025), pages 8, 14, 19, 29, 40, 43. The full-application
  checklist only says a DAS is needed unless the type of development does not require one; the national
  triggers (major development; conservation area with 100 sq m or more or new dwellings) are shown. Listed
  building consent: a DAS, or the information in the heritage statement (page 40).'
review-status: unverified
field-status: {}
