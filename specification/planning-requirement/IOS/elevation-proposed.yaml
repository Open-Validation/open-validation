reference: elevation-proposed
local-authority: IOS
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - lbc
      - ldc-prospective-use
      - advertising
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - discretionary
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'You will need to provide existing and proposed drawings with your application to a scale
  of 1:50 or 1:100 and include a scale bar. Elevations should be clearly identified as North, South, East,
  West. They must show every side affected by the proposal, with the following details: the relevant face
  of the building; fittings such as doors or windows; dimensions of the building; wall and roof materials,
  colours and finishes; the boundaries of the property; any additional features.'
must-include:
- item: Scale of 1:50 or 1:100 with a scale bar
  level: must
- item: Identified as North, South, East, West
  level: should
- item: Every side affected by the proposal, showing the relevant face, doors and windows, dimensions,
    wall and roof materials, colours and finishes, the property boundaries and any additional features
  level: must
- item: A unique drawing number for use in the decision notice
  level: should
- item: 'Amendment applications: revised drawings clearly show the amendments applied for'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
- item: 'Listed building consent: detailed drawings at 1:20 (plans, elevations, vertical and horizontal
    sections) of all the works (e.g. new doors, windows, furniture, shop fronts, panelling, fireplaces,
    mouldings), showing their relationship to adjacent existing structures/details'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Detailed drawings, which may include plans, elevations, and vertical and horizontal sections,
    must be to a scale of 1:20, and should include all details of the work to be carried out (for example
    all new doors, windows, window or door furniture, shop fronts, panelling, fireplaces, plaster moulding
    and other decorative details) and must also indicate the relationship of the proposed works to adjacent
    existing structures/details
- item: 'Advertisements: drawings at 1:20 or 1:50 showing the size and position of the advertisement,
    how it is attached or stands, materials and colours, height above ground, any projection, and the
    method, colours and luminance of any illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: be at a scale of 1:20 or 1:50. b) show the size of the advertisement and its position on
    the land or the building in question. c) show how you propose to either attach the advertisement to
    the building or how it will stand within the site. d) indicate the materials and colours to be used.
    e) show the height above ground. f) where it would project from a building, the extent of projection
    and provide details of the method and colour(s) of illumination, including luminance level, if applicable.
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 11, 13, 25, 26, 28, 40, 43, 45, 49, 52,
  55, 57. Part of 'Metric Scale Plans and Drawings' (NR). Section 73 and non-material amendment applications
  need 'Metric Scale Plans and Drawings' that clearly show the amendments; the list asks applicants to
  check with the council which plans will be replaced, so those types are discretionary (pages 48, 51).
