reference: section-proposed
local-authority: IOS
required-if:
  all:
  - any:
    - application-type:
        in:
        - hh
        - full
        - lbc
        - ldc-prospective-use
    - all:
      - application-type:
          in:
          - s73
          - non-material-amendment
      - discretionary
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: The proposal involves a change in levels or is on a sloping site.
    - discretionary
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Section drawings are particularly important where any proposal involves a change in levels
  or is on a sloping site. Sections should be drawn to a scale of 1:50 or 1:100 when through a building,
  and 1:200 or 1:500 when through ... land. The drawing should include: a cut through of the key new parts
  of the development such as stairs; how the proposed works relate to neighbouring buildings; the floor
  levels of the building.'
must-include:
- item: Scale of 1:50 or 1:100 through a building, 1:200 or 1:500 through land
  level: must
- item: A cut through key new parts (such as stairs), how the works relate to neighbouring buildings,
    and the floor levels of the building
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 13, 14, 28, 43, 49, 52, 55, 57. Sections
  are 'particularly important' where levels change or the site slopes; otherwise the list gives no trigger,
  so that part is discretionary.
review-status: unverified
field-status: {}
