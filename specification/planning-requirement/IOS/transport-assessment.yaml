source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraph 118; Isles of Scilly Local Plan 2015-2030 Policies SS9, SS10
source-text: Development proposals that have significant transport implications. The assessment should
  reflect the scale of the development with a travel plan needed for large scale proposals.
must-include:
- item: Reflects the scale of development and its transport implications; for major proposals, accessibility
    by all modes and the likely modal split
  level: should
- item: Measures to improve access by public transport, walking and cycling, reduce parking need and mitigate
    transport impacts
  level: should
- item: A travel plan for large scale proposals
  level: must
  required-if: discretionary
