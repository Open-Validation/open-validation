reference: noise-assessment
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: Development raising issues of noise disturbance to occupants of nearby existing buildings.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise-sensitive development close to existing sources of noise.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraphs 187(e), 198, 223(g), 224(c); Isles of Scilly Local Plan 2015-2030 Policies
  SS8, OE3
source-text: Planning permission for applications for developments that raise issues of disturbance by
  noise to the occupants of nearby existing buildings, and for developments that are considered to be
  noise sensitive and which are close to existing sources of noise.
must-include:
- item: Appropriate noise mitigation measures
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 24, 36.
review-status: unverified
field-status: {}
