reference: location-plan
local-authority: IOS
required-if:
  application-type:
    in:
    - hh
    - full
    - lbc
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A location plan should be based on an up-to-date map. The scale should typically be 1:1250
  or 1:2500, but wherever possible the plan should be scaled to fit onto A4 or A3 paper. A location plan
  should identify sufficient roads and/or buildings on land adjoining the application site to ensure that
  the exact location of the application site is clear. The application site should be outlined clearly
  with a continuous red line on the location plan. It should include all land necessary to carry out the
  proposed development, including land required for access to the site from a public highway. A blue line
  should be drawn around any other land owned by the applicant, close to or ... adjoining the application
  site. A location plan must have a north point and those based upon Ordnance Survey maps must have the
  appropriate Ordnance Survey copyright notice. The inclusion of a linear scale bar is recommended.
must-include:
- item: Based on an up-to-date map, typically at 1:1250 or 1:2500, scaled to fit A4 or A3 where possible
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: Site outlined with a continuous red line, including all land needed for the development and access
    from a public highway
  level: should
- item: A blue line around any other land owned by the applicant close to or adjoining the site
  level: should
- item: A north point
  level: must
  source-text: A location plan must have a north point
- item: Ordnance Survey based plans carry the Ordnance Survey copyright notice
  level: must
- item: A linear scale bar
  level: should
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 12, 13, 27, 42, 46, 56. Listed for householder,
  full, listed building consent, advertisement and lawful use certificate applications.
