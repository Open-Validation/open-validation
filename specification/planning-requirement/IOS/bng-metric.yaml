reference: bng-metric
local-authority: IOS
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: Schedule 7A, Town and Country Planning Act 1990; article 7 of the Town and Country Planning (Development
  Management Procedure) (England) Order 2015; NPPF 2024 paragraphs 187, 192-195; Isles of Scilly Local
  Plan 2015-2030 Policies SS2, SS3, OE2
source-text: A completed Statutory Biodiversity Metric must be submitted with every major planning application.
  A completed Small Site Metric must be submitted with every minor planning application, unless the proposed
  development is exempt. A Biodiversity Gain Plan must be submitted with the Statutory or Small Site metric.
  The metric needs to be submitted as an Excel file, and the plan as a PDF.
must-include:
- item: 'Major development: the Statutory Biodiversity Metric (error free), completed by a competent ecologist'
  level: must
  required-if:
    ref: major-development
- item: 'Other development: the Small Sites Metric (error free), completed by a competent person; not
    for sites with irreplaceable or priority habitats, European Protected Species or needing off-site
    interventions'
  level: must
  required-if: discretionary
- item: A Biodiversity Gain Plan (statutory template), submitted as a PDF with the metric
  level: must
  source-text: A Biodiversity Gain Plan must be submitted with the Statutory or Small Site metric.
- item: The metric submitted as an Excel file
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 19, 29, 31. The list says all development
  must deliver at least 10% BNG unless exempt; the main exemptions it names are householder applications,
  self-build/custom build under 10 units/0.5 ha and under 25 sq m of habitat affected. By law exempt applications
  are outside it, so the rule is the biodiversity gain condition. The Small Sites Metric item is shown
  as discretionary because it applies to non-major development except the excluded sites.
review-status: unverified
field-status: {}
