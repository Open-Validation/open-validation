reference: landscaping-plan
local-authority: IOS
required-if:
  all:
  - application-type:
      in:
      - full
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: New residential development of five dwellings or more.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Buildings with a floor space of 1000 sq m or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Sites of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Sites of 1 hectare or more.
    - condition:
        field: renewable-energy-development
        value: true
        description: Renewable energy developments.
source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
policy: NPPF 2024 paragraphs 135, 166; Isles of Scilly Local Plan 2015-2030 Policies SS2, OE1, SS8; Isles
  of Scilly Design Guide
source-text: New residential development of five new dwellings or more; or buildings with a floor space
  of 1000 sqm or more, or sites of 1 hectare or more; and renewable energy developments.
must-include:
- item: Hard and soft landscaping layout and management approach
  level: must
- item: All existing trees and hedgerows, those to be retained and their protection during development
  level: must
- item: A schedule of proposed plant species, sizes, densities and planting locations
  level: must
- item: An implementation programme
  level: must
confidence: medium
notes: From the council's list (adopted 18 November 2025), pages 24, 35, 36. The list's 'Landscaping Scheme'.
  It can be left out where existing landscaping is shown and retained, or dealt with by a pre-commencement
  condition (extra fee).
review-status: unverified
field-status: {}
