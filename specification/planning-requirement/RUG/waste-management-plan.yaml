reference: waste-management-plan
local-authority: RUG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development (including changes of use).
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Commercial development (including changes of use).
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy SDC1
source-text: All applications for residential or commercial development (including changes of use) … All
  applications (including changes of use)
must-include:
- item: A plan showing the location of bin storage, the size of bins and the design and materials of any
    bin enclosure
  level: must
- item: Collection points
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (Version 2, February 2024), items 5.3 and 6.31. Called 'Bin Storage' for
  minor development and 'Site Waste Management Plan (inc bin storage)' for major development; its content
  is a bin storage plan. Sections 5 (minor development) and 6 (major development) apply to full, outline
  and reserved matters applications; for outline the list says detail may be more appropriate at reserved
  matters.
review-status: unverified
field-status: {}
