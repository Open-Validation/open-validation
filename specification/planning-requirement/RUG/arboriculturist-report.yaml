reference: arboriculturist-report
local-authority: RUG
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - tree-preservation-zone
          description: Protected trees within or adjacent to the site.
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Significant trees within or adjacent to the site.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within or adjacent to the site.
    - discretionary
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy SDC2; BS 5837:2012
source-text: Any development where there are significant or protected trees within or adjacent to the
  site. … A tree protection plan may be required where there are trees within or adjacent to the site.
must-include:
- item: Carried out by a qualified arboriculturalist
  level: must
- item: 'For outline applications: a Tree Survey and a Tree Constraints Plan / tree removal and retention
    plan'
  level: must
  required-if:
    application-type:
      in:
      - outline
- item: 'For full applications: a Tree Survey of on- and off-site trees and hedges whose root protection
    areas fall within the site, and a Tree Constraints Plan superimposed on the proposed block plan'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: 'For full applications: an Arboricultural Impact Assessment and Arboricultural Method Statement'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - reserved-matters
    - condition:
        field: minor-development
        value: true
        description: Minor development.
- item: 'For householder applications: a Tree Protection Plan showing tree locations, species, trunk diameters,
    root protection areas, crown spread and the type and anchoring of protective fencing'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (Version 2, February 2024), items 3.9, 5.13 and 6.34. The householder tree
  protection plan 'may be required', so it is discretionary. The Arboricultural Impact Assessment and
  Method Statement are listed under minor development (5.13); the major development entry (6.34) lists
  only the tree survey and constraints plan. Sections 5 (minor development) and 6 (major development)
  apply to full, outline and reserved matters applications; for outline the list says detail may be more
  appropriate at reserved matters.
review-status: unverified
field-status: {}
