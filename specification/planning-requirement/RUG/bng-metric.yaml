      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: Subject to the biodiversity gain condition.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy NE1; Environment Act 2021
source-text: Schemes that will impact on over 25 square metres or over 5 linear metres of existing habitat
  … Any loss of biodiversity must be measured and compensated for. A Biodiversity Impact Assessment/Biodiversity
  Matrix calculation should be submitted.
must-include:
- item: Calculated using the latest DEFRA metric
  level: should
- item: Ecological information to BS 42020:2013
  level: should
confidence: medium
notes: From the council's list (Version 2, February 2024), items 5.5 and 6.6. The list's 25 sq m / 5 linear
  metres threshold is the statutory de minimis exemption, so it is shown with the biodiversity gain condition
  (householder and other exempt applications are exempt by law).
