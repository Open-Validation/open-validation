reference: lighting-assessment
local-authority: RUG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: floodlighting
      value: true
      description: Proposals including floodlighting.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policies SDC1 and SDC2
source-text: Proposals that include floodlighting
must-include:
- item: Hours of operation, light levels, tilt/angle, off-site light spillage, column heights and equipment
    design
  level: must
- item: A layout plan with beam orientations and any mitigation measures
  level: must
confidence: medium
notes: From the council's list (Version 2, February 2024), items 5.9 and 6.20. Sections 5 (minor development)
  and 6 (major development) apply to full, outline and reserved matters applications; for outline the
  list says detail may be more appropriate at reserved matters.
review-status: unverified
field-status: {}
