reference: archaeological-assessment
local-authority: RUG
required-if:
  all:
  - condition:
      field: ground-disturbance
      value: true
      description: Groundworks.
  - discretionary
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy SDC3
source-text: Applications involving groundworks that may have an impact on archaeological deposits and/or
  the significance of the historic environment
must-include:
- item: A desk-based assessment from existing records of the nature, extent and significance of the historic
    environment within the site and the impact of the development on it
  level: must
confidence: medium
notes: From the council's list (Version 2, February 2024), item 4.4. Whether groundworks 'may have an
  impact' on archaeology is a judgement, so it is discretionary.
