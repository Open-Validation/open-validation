reference: town-centre-impact-assessment
local-authority: RUG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Falls outside a defined centre.
  - any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 500
        description: Retail in excess of 500 sq.m gross.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 500
        description: Other Main Town Centre uses in excess of 500 sq.m gross.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policies TC2 and TC3; NPPF paragraph 94
source-text: Any proposals for retail and other Main Town Centre uses in excess of 500 sq.m gross that
  fall outside a defined centre
must-include:
- item: The potential impact on the vitality, viability, role and character of defined centre(s)
  level: must
confidence: medium
notes: From the council's list (Version 2, February 2024), item 6.29. Retail Impact Assessment, listed
  under major development. The separate Sequential Test (items 5.12 and 6.30) is unmapped.
review-status: unverified
field-status: {}
