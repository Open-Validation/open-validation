reference: fire-statement
local-authority: RUG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Multi-occupied residential building (two or more dwellings).
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9A
source-text: Multi-occupied residential buildings of 18 metres or more in height, or 7 or more storeys.
must-include:
- item: Completed by an expert
  level: must
confidence: medium
notes: From the council's list (Version 2, February 2024), item 1.7. Shown with the national rule (two
  or more dwellings or educational accommodation, and 18 m or 7 storeys).
review-status: unverified
field-status: {}
