reference: design-and-access-statement
local-authority: RUG
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - conservation-area
        description: Development in a designated area (Conservation Area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'A design and access statement (DAS) is required for: - applications for major development;
  - applications for listed building consent; - applications for development in a designated area (Conservation
  Area) where the proposed development consists of: - one or more dwellings; or - a building or buildings
  with a floor space of 100 square meters or more.'
must-include:
- item: The design principles and concepts applied, and how the context influenced the design
  level: must
- item: The approach to access, how Local Plan policies were taken into account, consultation on access
    and how it informed the proposal, and how specific access issues were addressed
  level: must
confidence: medium
notes: From the council's list (Version 2, February 2024), item 1.5.
review-status: unverified
field-status: {}
