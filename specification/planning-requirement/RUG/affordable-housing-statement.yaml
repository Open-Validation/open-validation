reference: affordable-housing-statement
local-authority: RUG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 11
        description: 11 or more dwellings.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.36
        description: Sites more than 0.36ha.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policies H1 and H2
source-text: Planning applications for 11 or more dwellings or sites more than 0.36ha
must-include:
- item: The number and mix of residential units and the affordable housing provision
  level: must
confidence: medium
notes: From the council's list (Version 2, February 2024), item 6.2. Listed under major development; 0.36
  ha is the list's own threshold.
review-status: unverified
field-status: {}
