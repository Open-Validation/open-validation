source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy NE1; BS 42020:2013
source-text: 'All applications involving demolition or removal of trees, affecting a roofspace or where
  the development proposals are likely to impact upon bats which are a European protected species … A
  bat scoping survey may be required, with further surveys in some cases depending upon initial findings:
  … Any proposed schemes where the site appears to have ecological value. … All major development proposals
  where there is potential impact on biodiversity'
must-include:
- item: A bat scoping survey following Bat Conservation Trust good practice guidelines, with further surveys
    depending on initial findings
  level: must
  required-if:
    any:
    - condition:
        field: demolition
        value: true
        description: Demolition.
    - condition:
        field: roof-alteration
        value: true
        description: Proposals affecting a roofspace.
    - condition:
        field: tree-removal
        value: true
        description: Removal of trees.
    - condition:
        field: protected-species
        value: true
        description: Likely to impact upon bats (a European protected species).
- item: An Ecological Impact Assessment to CIEEM guidelines, informed by a Preliminary Ecological Appraisal
  level: should
- item: Surveys for protected and priority species and habitats identified as necessary by the PEA, with
    impacts and mitigation
  level: should
- item: 'For prior notification of demolition: a bat scoping report'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
confidence: medium
notes: From the council's list (Version 2, February 2024), items 3.8, 5.2, 5.4, 6.4, 6.5 and 7.6. For
  major development a bat scoping survey 'will be required'; for minor and householder applications it
  'may be required', so those are discretionary, as is 'where the site appears to have ecological value'.
  Sections 5 (minor development) and 6 (major development) apply to full, outline and reserved matters
  applications; for outline the list says detail may be more appropriate at reserved matters.
