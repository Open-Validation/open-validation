reference: elevation-proposed
local-authority: RUG
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - condition:
        field: building-works
        value: true
        description: Planning application for built development.
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - condition:
        field: involves-change-of-use
        value: true
        description: Change of use.
    - condition:
        field: external-alterations
        value: true
        description: External alterations are proposed.
  - application-type:
      in:
      - advertising
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications applications.
  - all:
    - application-type:
        in:
        - ldc-existing-use
        - ldc-prospective-use
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7;
  Rugby Borough Local Plan 2019 policy SDC1
source-text: All Planning applications for built development or change of use where external alterations
  are proposed; All advertisement consent applications; and Applications for
must-include:
- item: Drawn to scale (1:50 or 1:100) with title, drawing number and scale bar
  level: should
- item: The proposed works in relation to what is already there and any structures to be demolished
  level: should
- item: 'For external wall insulation: a photomontage or detailed scale drawing of the proposed cladding
    (including any dentil course, headers, cills), a section detail and the cladding finish'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'For a dropped kerb: existing and proposed elevational drawings of the dropped kerb'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: new-vehicle-access
        value: true
        description: A dropped kerb for vehicular access.
- item: 'For advertisements: full details of the proposed signage and its location on the site or building'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (Version 2, February 2024), items 2.3, 3.2-3.3, 7.2 and 7.8. The type cell
  continues 'existing/proposed certificate of lawful development (where relevant)', shown as discretionary.
review-status: unverified
field-status: {}
