reference: recreation-facilities-assessment
local-authority: RUG
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of green space of value for amenity, recreation, outdoor sports and/or community
        use.
  - condition:
      field: affects-playing-field
      value: true
      description: Loss of playing fields.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy HS4
source-text: Development proposals that involve the loss of green space that is of value for amenity,
  recreational, outdoor sports and/or community use
must-include:
- item: That there is no longer demand for the recreational use of the green space, or that its loss would
    not create a deficiency; any loss replaced by equivalent or better provision
  level: should
- item: Plans identifying existing or proposed green space to be lost
  level: should
- item: 'For playing fields: full details of the playing fields and facilities to be lost, the reason
    for the location and any changes in sports provision'
  level: should
  required-if:
    condition:
      field: affects-playing-field
      value: true
      description: Loss of playing fields.
confidence: medium
notes: From the council's list (Version 2, February 2024), item 6.15. Green space/playing fields assessment.
review-status: unverified
field-status: {}
