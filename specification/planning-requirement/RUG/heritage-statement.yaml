reference: heritage-statement
local-authority: RUG
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      description: The application affects a listed building.
  - all:
    - site:
        in:
        - conservation-area
        description: The proposal would have an impact on a Conservation Area.
    - discretionary
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy SDC3
source-text: Applications affecting a listed building or that would have an impact on a Conservation Area;
  listed building consent applications
must-include:
- item: The significance of any heritage assets affected, including the contribution of their setting,
    proportionate to their importance
  level: must
- item: The history and development of the asset, with a photographic record of the site context and the
    spaces and features affected
  level: should
- item: An assessment of the archaeological, architectural, historical or other significance and of the
    impact of the works on it
  level: should
- item: A statement of justification for the works and any mitigation measures
  level: should
confidence: medium
notes: From the council's list (Version 2, February 2024), item 4.2 (and 3.4-3.5). Whether a proposal
  'would have an impact on a Conservation Area' is a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
