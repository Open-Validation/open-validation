reference: land-contamination-assessment
local-authority: RUG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - contaminated-land
      description: The development is known or suspected to be affected by land contamination.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy SDC1
source-text: Any application where the development is known or suspected to be affected by land contamination
must-include:
- item: An environmental risk assessment reporting the site inspection scope, historical land use, environmental
    setting, consultation with regulators, a qualitative risk assessment and a review of existing reports
  level: should
confidence: medium
notes: From the council's list (Version 2, February 2024), items 5.6 and 6.8. Sections 5 (minor development)
  and 6 (major development) apply to full, outline and reserved matters applications; for outline the
  list says detail may be more appropriate at reserved matters.
review-status: unverified
field-status: {}
