reference: site-plan
local-authority: RUG
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - condition:
        field: building-works
        value: true
        description: Planning application for built development.
  - application-type:
      in:
      - advertising
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications applications.
  - application-type:
      in:
      - pa-extension
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7;
  Rugby Borough Local Plan 2019 policy SDC1
source-text: All planning applications for built development and applications for advertisement consent
  … A plan of the site showing the proposed development;
must-include:
- item: Drawn to scale (1:200 or 1:500)
  level: should
- item: The direction of north; the proposed development in relation to the site boundaries and other
    existing buildings on site, including those to the boundary
  level: should
- item: Car parking, hardstanding, boundary treatment, and the position of all trees on the site and on
    adjacent land
  level: should
- item: 'For external wall insulation: which elevations are to be insulated'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Block/Site plan indicating which elevations are to be insulated
- item: 'For a dropped kerb: details of any proposed driveway or hard surfacing, including drainage details'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: new-vehicle-access
        value: true
        description: A dropped kerb for vehicular access.
  source-text: Details of any proposed driveway/ hard surfacing including drainage details;
confidence: medium
notes: From the council's list (Version 2, February 2024), items 2.1, 3.2-3.3, 3.6, 7.2, 7.7 and 7.8.
  For s73 applications 'Where necessary plans should be provided in accordance with Section 2', so they
  are discretionary.
review-status: unverified
field-status: {}
