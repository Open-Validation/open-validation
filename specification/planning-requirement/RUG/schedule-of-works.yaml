reference: schedule-of-works
local-authority: RUG
required-if:
  all:
  - application-type:
      in:
      - lbc
  - any:
    - condition:
        field: structural-alteration
        value: true
        description: Structural alterations are proposed.
    - condition:
        field: demolition
        value: true
        description: Demolition is proposed.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy SDC3
source-text: Listed building consent applications where structural alterations or demolition is proposed
must-include:
- item: A schedule of works and method statement
  level: should
- item: Level 2 recording (Historic England, Understanding Historic Buildings, Part 5) where demolition
    or alterations result in a loss of historic fabric
  level: must
confidence: medium
notes: From the council's list (Version 2, February 2024), item 4.3.
