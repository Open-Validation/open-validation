reference: noise-assessment
local-authority: RUG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: The application raises issues of disturbance.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise sensitive development.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policies SDC1 and HS5; NPPF paragraph 180
source-text: Planning applications that raise issues of disturbance, or are considered to be noise sensitive
  developments
must-include:
- item: Prepared by a qualified acoustician
  level: must
- item: The potential noise sources quantified and their effect on local amenity
  level: should
- item: Mitigation so that internal and external noise levels meet national guidance criteria
  level: should
confidence: medium
notes: From the council's list (Version 2, February 2024), items 5.11 and 6.25. Sections 5 (minor development)
  and 6 (major development) apply to full, outline and reserved matters applications; for outline the
  list says detail may be more appropriate at reserved matters.
review-status: unverified
field-status: {}
