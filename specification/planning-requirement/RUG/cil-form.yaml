reference: cil-form
local-authority: RUG
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Householder applications of 100 sq m or more.
  - all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: residential-extension
        value: false
        description: Not a larger household extension.
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Planning Act 2008, Part 11; Community Infrastructure Levy Regulations 2010
source-text: Planning applications (except householder applications less than 100 sq m) Prior approval
  applications (except domestic extensions)
must-include:
- item: Form 1 for planning applications
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - s73
- item: Form 5 for prior approval applications
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
confidence: medium
notes: From the council's list (Version 2, February 2024), item 2.8. Required from 1 April 2024, when
  Rugby's CIL took effect.
review-status: unverified
field-status: {}
