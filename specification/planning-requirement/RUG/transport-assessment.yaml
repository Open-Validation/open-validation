reference: transport-assessment
local-authority: RUG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 50
          description: Residential development between 50 and 79 dwellings.
      - condition:
          field: dwelling-count
          operator: <=
          value: 79
          description: Residential development between 50 and 79 dwellings.
    - all:
      - ref: major-development
      - discretionary
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy D1
source-text: Residential development up to 49 dwellings may require a Transport Statement; Residential
  development between 50 and 79 dwelling will require a Transport Statement; Other major development may
  require a Transport Assessment based on DfT threshold criteria for Transport Assessment detailed at
  Thresholds for Transport Assessments
must-include:
- item: The trip generation of the site, covering all movement by people and vehicles
  level: should
- item: Scope and details agreed with the local highway authority
  level: should
confidence: medium
notes: From the council's list (Version 2, February 2024), item 6.32. Residential development of 50-79
  dwellings 'will require a Transport Statement'; other major development 'may require' a Transport Assessment
  on the DfT thresholds (not set out in the list), so that part is discretionary.
review-status: unverified
field-status: {}
