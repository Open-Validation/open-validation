reference: air-quality-assessment
local-authority: RUG
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: eia-development
        value: true
        description: Development requires an Environmental Statement (EIA).
    - discretionary
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Rugby Borough Local Plan 2019 policy HS5; Air Quality SPD 2021
source-text: All applications where there may be relevant exposure to pollutant concentrations above statutory
  limits (EU or UK); All major development proposals; Where the development meets DfT threshold criteria
  for Transport Assessment detailed at Thresholds for Transport Assessments ; and Where development requires
  an Environmental Statement (EIA).
must-include:
- item: Existing background air quality, cumulative background levels and the feasibility of mitigation
  level: should
- item: Reduction/mitigation measures in full where building or transport emissions increase or the area
    has poor air quality
  level: should
- item: Methodology agreed with the Council's Environmental Protection team
  level: should
confidence: medium
notes: From the council's list (Version 2, February 2024), items 5.1 and 6.3. Relevant exposure above
  statutory limits and the DfT Transport Assessment thresholds (not set out in the list) are discretionary.
  Sections 5 (minor development) and 6 (major development) apply to full, outline and reserved matters
  applications; for outline the list says detail may be more appropriate at reserved matters.
review-status: unverified
field-status: {}
