reference: floor-plan-existing
local-authority: RUG
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
    - condition:
        field: building-works
        value: true
        description: Planning application for built development.
  - all:
    - application-type:
        in:
        - ldc-existing-use
        - ldc-prospective-use
    - discretionary
  - all:
    - application-type:
        in:
        - s73
    - discretionary
source-url: https://www.rugby.gov.uk/documents/20124/6589626/Validation+Checklist+Feb+2024.pdf/0e5c8781-9b91-e1b7-1a18-f762bd430f97?t=1750866323611
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7;
  Rugby Borough Local Plan 2019 policy SDC1
source-text: All planning applications for built development; applications for existing/proposed certificate
  of lawful development (where relevant)
must-include:
- item: Drawn to scale (1:50 or 1:100) with title, drawing number and scale bar
  level: should
- item: The proposed works in relation to what is already there and any structures to be demolished
  level: should
confidence: medium
notes: From the council's list (Version 2, February 2024), item 2.2. Lawful development certificates 'where
  relevant' and s73 'where necessary' are discretionary.
review-status: unverified
field-status: {}
