reference: land-contamination-assessment
local-authority: RCC
required-if:
  any:
  - condition:
      field: sensitive-end-use
      value: true
      description: The application has a vulnerable end user.
  - ref: major-development
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected on the site or on land adjoining it.
source-url: https://www.redcar-cleveland.gov.uk/sites/default/files/2022-04/Redcar%20and%20Cleveland%20Local%20List%20-%202015.pdf
source-text: Where an application has been submitted which has a vulnerable end user / All major planning
  applications excluding change of use applications. Where contamination is known or suspected to exist
  on the application site or on land adjoining the application site a desktop study will be required,
  in accordance with DEFRA and the Environment Agency's 'Model Procedures for the Management of Land Contamination,
  CLR 11'.
