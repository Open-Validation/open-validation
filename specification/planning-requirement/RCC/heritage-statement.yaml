reference: heritage-statement
local-authority: RCC
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - listed-building
      description: Demolition related to a listed building.
  - all:
    - ref: major-development
    - site:
        in:
        - conservation-area
        description: The site is in a conservation area.
source-url: https://www.redcar-cleveland.gov.uk/sites/default/files/2022-04/Redcar%20and%20Cleveland%20Local%20List%20-%202015.pdf
source-text: Listed building consent / Demolition within a conservation area or related to a listed building
  / Major applications within a conservation area. Heritage Statement For applications that affect areas
  of significant archaeological remains and historic landscapes, the statement should include plans illustrating
  the historical features including listed buildings/structures, historic parks and gardens and historic
  battlefields.
must-include:
- item: Plans illustrating the historical features, including listed buildings/structures, historic parks
    and gardens and historic battlefields
  level: should
  required-if:
    site:
      in:
      - archaeological-priority-area
      - park-and-garden
      description: The application affects areas of significant archaeological remains or historic landscapes.
