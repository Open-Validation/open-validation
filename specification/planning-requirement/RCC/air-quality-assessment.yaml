reference: air-quality-assessment
local-authority: RCC
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 200
      description: The application is for 200 or more dwellings.
  - discretionary
source-url: https://www.redcar-cleveland.gov.uk/sites/default/files/2022-04/Redcar%20and%20Cleveland%20Local%20List%20-%202015.pdf
source-text: Applications for 200 or more dwellings / Applications with potentially air contamination
  uses. Air quality assessment The assessment should indicate the change in air quality resulting from
  the proposed development and outline appropriate mitigation measures as necessary.
must-include:
- item: The change in air quality resulting from the proposed development
  level: should
- item: Appropriate mitigation measures as necessary
  level: should
confidence: medium
notes: 'Audit (wrong_app_type): the workbook placed this under Outline only because of the verb ''outline''.
  ''Uses that could contaminate the air'' has no field, so it is shown as officer discretion.'
review-status: unverified
field-status: {}
