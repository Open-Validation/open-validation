reference: lighting-assessment
local-authority: RUN
required-if:
  any:
  - condition:
      field: floodlighting
      value: true
      description: Floodlighting.
  - condition:
      field: external-lighting
      value: true
      description: External lighting attached to buildings, in car parks or streets within new development,
        or within open land.
  - condition:
      field: illuminated
      value: true
      description: Illuminated advertisement applications.
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
source-text: Technical lighting details will be required for floodlighting, external lighting attached
  to buildings, located in car parks or in streets within new development, or within open land, and with
  all illuminated advertisement applications.
must-include:
- item: Height of mounting, wattage levels, spread of illumination and hours of use
  level: must
- item: Biodiversity implications, in particular avoiding disturbance to protected species or sites
  level: must
confidence: medium
notes: From the council's list (published July 2020), page 17 of the Validation Document.
review-status: unverified
field-status: {}
