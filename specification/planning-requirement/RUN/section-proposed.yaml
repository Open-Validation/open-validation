reference: section-proposed
local-authority: RUN
required-if:
  any:
  - site:
      in:
      - green-belt
      description: The property is in the Green Belt.
  - condition:
      field: change-in-ground-levels
      value: true
      description: Existing ground levels are to be altered, or the site is sloping or has variations
        in ground levels.
source-url: https://www.runnymede.gov.uk/downloads/file/713/householder-validation-checklist
must-include:
- item: Cross sections at 1:50 or 1:100 showing head height under the roof
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: Existing and proposed levels
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Existing ground levels are to be altered, or the site is sloping.
confidence: medium
notes: 'Audit (wrong_trigger): the householder checklist requires cross sections for ''Planning applications
  for properties within the Green Belt''; Appendix F items 11 (levels) and 12 (Green Belt cross-sections)
  cover other applications.'
review-status: unverified
field-status: {}
