reference: design-and-access-statement
local-authority: RUN
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Any part of the development is in a designated area (e.g. a Conservation Area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or extension creating 100 square metres or more of floorspace.
  - application-type:
      in:
      - lbc
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement (DAS) must accompany applications where: a) The proposed development
  is major development; b) Where any part of the development is in a designated area (e.g. Conservation
  Area) and the proposed development consists of: i) The provision of one or more dwellinghouses; or ii)
  The provision of a building (including an extension to an existing building) or buildings where the
  floor space created by the development is 100 square metres or more; c) The application is for listed
  building consent ... Planning applications over 100 square metres in floor area or more in a designated
  conservation area.'
must-include:
- item: A section on crime prevention measures
  level: must
  source-text: All planning applications requiring a Design and Access Statement (DAS) should include
    a section on Crime Prevention measures.
confidence: medium
notes: From the council's list (published July 2020), page 4, 16 of the Validation Document; page 3 of
  the Householder validation checklist (republished December 2024). The last sentence of the source text
  is the Householder checklist's trigger. Heritage statements for minor and householder schemes can be
  included in the DAS (page 13).
review-status: unverified
field-status: {}
