reference: sustainability-statement
local-authority: RUN
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Runnymede 2030 Local Plan policy SD8
source-text: Major development applications are required to submit an Energy and Sustainability Statement
  that shows how the energy hierarchy has been applied to the development
must-include:
- item: 'How the energy hierarchy has been applied: be lean (use less energy), be clean (supply energy
    efficiently), be green (use renewable energy)'
  level: must
- item: '1,000 sq m or more net additional floorspace: at least 10% of energy needs from renewable and/or
    low carbon technologies'
  level: must
  required-if:
    condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: 1,000 sq m or more of net additional floorspace.
- item: '10,000 to 50,000 sq m: evidence that decentralised sources of energy have been considered'
  level: must
  required-if:
    condition:
      field: floorspace
      operator: '>='
      value: 10000
      description: 10,000 sq m or more.
- item: 'Over 50,000 sq m: on-site decentralised low carbon or renewable networks beyond the 10% minimum'
  level: must
  required-if:
    condition:
      field: floorspace
      operator: '>'
      value: 50000
      description: Over 50,000 sq m.
- item: Analysis of potential energy sources and which are or are not feasible or viable
  level: must
- item: 'Sustainable design: sustainable travel, passive solar gain and cooling, sustainable construction
    and materials, recycling, biodiversity gains, EV charging, water efficiency (110 litres per person
    per day) and accessibility'
  level: should
confidence: medium
notes: From the council's list (published July 2020), page 14-15 of the Validation Document. Minor and
  householder applications must also show (proportionately) how energy and sustainable design have been
  addressed, but no separate statement is named, so they show as 'check'.
review-status: unverified
field-status: {}
