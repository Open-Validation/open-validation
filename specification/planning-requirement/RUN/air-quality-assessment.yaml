reference: air-quality-assessment
local-authority: RUN
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Within 70 metres of, or adjacent to, an Air Quality Management Area (M25 AQMA or Addlestone
        AQMA).
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
source-text: Application proposals within 70 metres of the AQMA, adjacent to the AQMA, or other proposals
  elsewhere that impact upon air quality or are potential pollutants, should be supported by an air quality
  assessment indicating the change in air quality resulting from the proposed development and outlining
  appropriate mitigation measures as necessary.
must-include:
- item: The change in air quality resulting from the development
  level: must
- item: Appropriate mitigation measures
  level: must
confidence: medium
notes: From the council's list (published July 2020), page 15-16 of the Validation Document. Proposals
  elsewhere that affect air quality or are potential pollutants show as 'check'.
review-status: unverified
field-status: {}
