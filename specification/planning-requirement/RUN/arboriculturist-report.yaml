reference: arboriculturist-report
local-authority: RUN
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees on the site, or on adjacent land (including street trees), that could influence
            or be affected by the development.
      - site:
          in:
          - tree-preservation-zone
          description: There is a Tree Preservation Order.
  - all:
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on the site, or on adjacent land (including street trees), that could influence
          or be affected by the development.
    - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: BS 5837:2012 Trees in Relation to Design, Demolition and Construction
source-text: Where there are trees within the application site, or on land adjacent to it that could influence
  or be affected by the development (including street trees), further information may be required. ...
  Planning applications that could affect trees within or outside of the site, or if there is a Tree Preservation
  Order (TPO).
must-include:
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: Prepared by a suitably qualified arboricultural consultant, in line with BS 5837:2012
  level: must
- item: Tree survey including root protection areas (RPAs)
  level: must
- item: Tree retention/removal plan
  level: must
- item: Tree protection plan
  level: must
- item: Retained trees with RPAs on the proposed layout
  level: must
- item: Arboricultural impact assessment
  level: must
- item: 'Depending on the site: existing and proposed finished levels; arboricultural method statement;
    details of development activities or specialist engineering within RPAs; strategic hard and soft landscape
    design with species and locations of new planting'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2020), page 12 of the Validation Document; page 3 of the
  Householder validation checklist (republished December 2024). The Householder checklist requires it
  where trees could be affected or there is a TPO; the Validation Document says the information 'may be
  required', so other applications show as 'check'.
review-status: unverified
field-status: {}
