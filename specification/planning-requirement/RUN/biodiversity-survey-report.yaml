reference: biodiversity-survey-report
local-authority: RUN
required-if:
  any:
  - condition:
      field: protected-species
      value: true
      description: Protected species are known to be present or likely to be affected (including householder
        applications).
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: The proposal is likely to affect a designated site (SSSI or Site of Nature Conservation
        Importance).
  - site:
      in:
      - priority-habitat
      - ancient-woodland
      description: Priority habitat inventory, or woodlands including veteran or ancient woodland.
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Natural Environment and Rural Communities Act 2006; Conservation of Habitats and Species Regulations
  2017; Protection of Badgers Act 1992
source-text: Where a proposed development, including householder applications, is likely to affect protected
  species, a Protected Species Survey and Assessment (Phase 1 Habitat Survey) should be submitted. ...
  Such assessments will be required in all cases where protected species are known to be present, and
  will normally be required for sites where bats, owls, breeding birds, dormice, badgers, reptiles and
  amphibians may be present ... If a proposal is likely to affect any designated site (e.g. SSSI or SNCI)
  an Ecological Survey and Assessment will be required.
must-include:
- item: Which species are present and their numbers, their distribution and use of the area
  level: must
- item: Alternative designs or sitings, avoidance of effects, mitigation, compensation for impacts that
    cannot be avoided, and long-term management
  level: must
- item: Plans showing significant wildlife habitats or features and the location of habitats of protected
    species
  level: must
- item: 'Where a Phase 1 survey finds potential for protected species: a detailed site survey before submission,
    with results and mitigation'
  level: must
  required-if: discretionary
- item: 'Designated sites: habitats and features present, avoidance of adverse effects, mitigation and
    compensation'
  level: must
  required-if:
    site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      description: A designated site is likely to be affected.
confidence: medium
notes: From the council's list (published July 2020), page 10-11 of the Validation Document. The other
  site types where a survey is 'normally required' (derelict land, agricultural buildings, older buildings
  near woodland or water, bridges and tunnels, lighting of churches or green spaces, works affecting hedgerows
  or old trees, within 200m of rivers) show as 'check'. The biodiversity enhancement statement is listed
  as unmapped.
review-status: unverified
field-status: {}
