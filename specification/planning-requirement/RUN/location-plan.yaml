reference: location-plan
local-authority: RUN
required-if:
  always: true
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: An application must be accompanied by a location plan which identifies the land to which
  it relates. ... Location Plan – must have two roads and house names/numbers with north arrow and scale
must-include:
- item: Based on an up-to-date map, typically at a scale of 1:1250 or 1:2500
  level: must
- item: At least two named roads and surrounding buildings, with properties numbered or named
  level: should
- item: Application site edged clearly in red, including all land needed for the development (access from
    a public highway, visibility splays, landscaping, car parking, open areas around buildings)
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: must
- item: 'Householder: two named roads, house names/numbers, a north arrow and a scale'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Location Plan – must have two roads and house names/numbers with north arrow and scale
confidence: medium
notes: From the council's list (published July 2020), page 3 of the Validation Document; page 1 of the
  Householder validation checklist (republished December 2024). The second part of the source text is
  from the Householder checklist ('All').
