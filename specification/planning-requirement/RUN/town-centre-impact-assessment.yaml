reference: town-centre-impact-assessment
local-authority: RUN
required-if:
  condition:
    field: out-of-centre-town-centre-use
    value: true
    description: Main town centre uses (retail, leisure, office) outside Addlestone, Chertsey and Egham
      town centres, and not in accordance with an up-to-date plan.
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: NPPF; Runnymede 2030 Local Plan centre hierarchy
source-text: Where applications are proposed for retail, leisure and office development outside of Addlestone,
  Chertsey and Egham town centres as defined in the Runnymede 2030 Local Plan centre hierarchy, an impact
  assessment will be required where retail development exceeds 500 sqm and where other such developments
  would be over 2,500sqm. ... Applicants should provide sufficient information to enable a sequential
  test to be carried out by the Local Planning Authority.
must-include:
- item: 'Impact assessment (retail over 500 sq m; leisure or office over 2,500 sq m): impact on existing,
    committed and planned investment in centres in the catchment, and on town centre vitality and viability,
    including consumer choice and trade'
  level: must
  required-if:
    any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 500
        description: Retail development over 500 sq m.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2500
        description: Leisure or office development over 2,500 sq m.
- item: 'Sequential test information: the assessed need for main town centre uses, whether it can be met
    on town centre sites, and the next sequentially preferable sites'
  level: must
confidence: medium
notes: From the council's list (published July 2020), page 13-14 of the Validation Document. Covers both
  the Retail/Leisure/Office Impact Assessment (section 27) and the Sequential Assessment (section 28).
  Neighbourhood Plans may set other thresholds.
review-status: unverified
field-status: {}
