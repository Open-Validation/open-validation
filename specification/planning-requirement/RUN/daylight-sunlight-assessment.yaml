reference: daylight-sunlight-assessment
local-authority: RUN
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: BRE standards
source-text: This will be required for major applications where there is a potential adverse impact upon
  the current levels of sunlight/daylight enjoyed by adjoining properties or building(s), including associated
  gardens or amenity space or for any application for development that may themselves be adversely affected
  by adjoining sites or where one part of the proposed development may be impacted upon by another part
  of the development.
must-include:
- item: An overshadowing study with shadow diagrams at different times of day and throughout the year,
    within the development and for neighbouring properties
  level: must
- item: Based on BRE best practice
  level: must
confidence: medium
notes: From the council's list (published July 2020), page 16 of the Validation Document. Depends on whether
  there is a potential adverse impact, so it shows as 'check'.
review-status: unverified
field-status: {}
