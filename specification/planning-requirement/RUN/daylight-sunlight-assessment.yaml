reference: daylight-sunlight-assessment
local-authority: RUN
required-if: discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
source-text: Sunlight and Daylight Assessment This will be required for major applications where there
  is a potential adverse impact upon the current levels of sunlight/daylight enjoyed by adjoining properties
  or building(s), including associated gardens or amenity space or for any application for development
  that may themselves be adversely affected by adjoining sites or where one part of the proposed development
  may be impacted upon by another part of the development.
confidence: medium
notes: Both limbs depend on a judgement of impact, so the rule is officer discretion.
