policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: The Town and Country Planning (Environmental Impact Assessment) Regulations 2017 (SI No.571,
  2017) require a developer to prepare an Environmental Statement (required for Schedule 1 projects and
  for some Schedule 2 projects)
must-include:
- item: Likely significant effects of the development on the environment, and proposed mitigation measures
  level: must
- item: Based on the most recent EIA Scoping Opinion, with any material changes since scoping clearly
    highlighted
  level: must
- item: Produced by competent experts
  level: must
- item: Submitted with a clearly stated weblink or CD/DVD for onward submission to the Secretary of State
  level: must
