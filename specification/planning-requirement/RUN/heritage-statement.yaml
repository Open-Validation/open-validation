reference: heritage-statement
local-authority: RUN
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - conservation-area
      - scheduled-monument
      - park-and-garden
      description: A heritage asset, or its setting, is affected (listed or locally listed building, conservation
        area, scheduled monument, historic park or garden).
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - archaeological-priority-area
        description: Householder applications within Areas of High Archaeological Potential.
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: NPPF
source-text: In accordance with the NPPF, a description of the significance of any heritage asset affected
  and any contribution made by their setting is required to be provided. ... Planning applications affecting
  a listed building or locally listed building, or within a Conservation Area or within Areas of High
  Archaeological Potential.
must-include:
- item: The significance of any heritage asset affected, including the contribution made by its setting,
    proportionate to the asset's importance
  level: must
- item: Where relevant, how the significance has informed the proposals
  level: must
- item: As a minimum, the Surrey Historic Environment Record consulted
  level: must
- item: 'Demolition in a conservation area: justification for the demolition and its impact on the special
    character of the area'
  level: must
  required-if:
    all:
    - condition:
        field: demolition
        value: true
        description: Demolition is proposed.
    - site:
        in:
        - conservation-area
        description: In a conservation area.
- item: Marketing evidence that a heritage asset has no viable use (NPPF paragraph 195b circumstances)
  level: must
  required-if: discretionary
- item: 'Works to a listed building: details of the works, analysis of the significance of its history,
    character and fabric, justification for the works and their impact on its special character, its setting
    and adjacent listed buildings'
  level: must
  required-if:
    site:
      in:
      - listed-building
      description: Works to a listed building.
- item: 'Applications next to a conservation area or listed building: assessment of the impact on the
    character and appearance of the area'
  level: must
  required-if: discretionary
- item: 'Major development: a separate Heritage Statement (not within the DAS)'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published July 2020), page 12-13 of the Validation Document; page 3 of
  the Householder validation checklist (republished December 2024). The last sentence of the source text
  is the Householder checklist's trigger ('Heritage statement and Archaeology study'). For minor and householder
  schemes the heritage statement can be part of the DAS.
review-status: unverified
field-status: {}
