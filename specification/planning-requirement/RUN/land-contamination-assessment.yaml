reference: land-contamination-assessment
local-authority: RUN
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Substances in, on or under the land mean significant harm is, or may be, caused by
        the development.
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use would be particularly vulnerable.
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Runnymede 2030 Local Plan policy EE2; BS 10175:2011
source-text: 'Planning applications will require a contaminated land report on sites in the following
  circumstances: sites which appear to be in a condition by reason of substances in, on or under the land
  that significant harm is being caused or there is a significant possibility of such harm being caused
  by the development process; sites where pollution of controlled waters is being or is likely to be caused;
  and where the proposed use would be particularly vulnerable'
must-include:
- item: Prepared having regard to BS 10175:2011
  level: must
- item: Whether contamination exists, its nature, the risks it may pose, and whether they can be reduced
    to an acceptable level by remediation
  level: must
- item: Remediation details at application stage, where the nature and extent of the risk require it
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2020), page 14 of the Validation Document. Sites where
  pollution of controlled waters is or is likely to be caused show as 'check' (no field for it).
review-status: unverified
field-status: {}
