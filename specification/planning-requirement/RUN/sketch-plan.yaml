reference: sketch-plan
local-authority: RUN
required-if:
  application-type:
    in:
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Town and Country Planning (Tree Preservation) (England) Regulations 2012
source-text: For applications relating to works to trees, a plan of the site is required.
must-include:
- item: Position of the tree(s), annotated T1, T2 etc., in relation to buildings and a named road
  level: must
- item: 'For large sites with numerous trees: only the trees subject to the proposed works'
  level: should
- item: 'Details of the proposed works: pruning in metres (crown thinning may be a percentage)'
  level: must
- item: 'Tree felling: details of replanting (species, size, location, schedule of planting) or reasons
    for not replanting'
  level: must
- item: 'TPO trees: the reasons for the works'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
confidence: medium
notes: From the council's list (published July 2020), page 18 of the Validation Document. The plan can
  be hand drawn for smaller sites. Photographs are 'beneficial'.
review-status: unverified
field-status: {}
