reference: recreation-facilities-assessment
local-authority: RUN
required-if:
  condition:
    field: loss-of-open-space
    value: true
    description: Loss of some or all of an open space area.
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Runnymede 2030 Local Plan policy SL25
source-text: Any application proposing the loss of some or all of an open space area should be accompanied
  by a statement providing robust evidence that there is a proven surplus of provision, the benefit for
  the community of its loss outweighs the harm caused by its loss or that an alternative can be provided
  in line with policy SL25 of the Runnymede Local Plan 2030
must-include:
- item: Robust evidence of a proven surplus, or that the community benefit of the loss outweighs the harm,
    or that an alternative can be provided
  level: must
- item: Plans showing existing or proposed open space within or adjoining the site
  level: should
confidence: medium
notes: From the council's list (published July 2020), page 13 of the Validation Document. The council
  calls it an Open Space Statement.
review-status: unverified
field-status: {}
