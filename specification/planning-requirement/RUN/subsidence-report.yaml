reference: subsidence-report
local-authority: RUN
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
source-text: If the reason for the works is based on alleged damage to the property by subsidence - A
  report by an engineer or surveyor, to include a description of damage, vegetation, monitoring data,
  soil, roots and repair proposals as well as a report from an arboriculturist to support the tree work
  proposals will be required
must-include:
- item: Description of damage, vegetation, monitoring data, soil, roots and repair proposals
  level: must
- item: A report from an arboriculturist supporting the tree work proposals
  level: must
confidence: medium
notes: From the council's list (published July 2020), page 18 of the Validation Document. Needed when
  subsidence is the reason for the works.
review-status: unverified
field-status: {}
