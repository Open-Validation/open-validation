reference: site-plan
local-authority: RUN
required-if:
  always: true
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'The list will apply in all cases, and sets out mandatory requirements for applications.
  ... This should be drawn at a scale of 1:500 or 1:200 and should accurately show: a) The direction of
  north; b) The proposed development in relation to the site boundaries and other existing buildings on
  the site, with written external dimensions showing the maximum width, depth, height (to ridge and eaves)
  and distance to boundaries.'
must-include:
- item: Drawn at a scale of 1:500 or 1:200
  level: must
- item: The direction of north
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings, with
    written external dimensions (maximum width, depth, height to ridge and eaves) and distances to boundaries
  level: must
- item: Buildings, roads and footpaths on adjoining land, including access arrangements
  level: should
- item: Public rights of way crossing or adjoining the site
  level: should
- item: Position of all trees on the site, and those on adjacent land that could influence or be affected
    by the development
  level: should
- item: Extent and type of any hard surfacing
  level: should
- item: Boundary treatment, including walls or fencing where proposed
  level: should
- item: Proposed site levels and finished floor levels, related to a fixed datum point off site (on a
    1:200 or 1:500 site plan)
  level: should
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Ground levels are to be altered, or the site slopes.
  source-text: A site plan (1:200 or 1:500 scale) should also be provided to show the proposed site levels
    and finished floor levels, again in relation to a fixed datum point off site.
- item: 'Householder: up-to-date site and neighbouring houses and specific site features, including different
    land levels, with written dimensions, north arrow and scale'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Site/ Block Plan showing up to date site and neighbouring houses and specific site features
    including different land levels, with written dimensions, ... north arrow, and scale
confidence: medium
notes: From the council's list (published July 2020), page 3-4, 6 of the Validation Document; page 1 of
  the Householder validation checklist (republished December 2024). The 'should' items c) to g) are needed
  'unless these would not influence or be affected by the proposed development'.
review-status: unverified
field-status: {}
