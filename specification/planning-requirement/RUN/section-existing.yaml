reference: section-existing
local-authority: RUN
required-if:
  any:
  - all:
    - site:
        in:
        - green-belt
        description: The site is in the Green Belt.
    - condition:
        field: building-works
        value: true
        description: Extensions to buildings, or replacement and new buildings.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - green-belt
        description: Householder applications for properties within the Green Belt.
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
  - condition:
      field: basement
      value: true
      description: The proposal provides a basement.
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Runnymede 2030 Local Plan policy EE14
source-text: Plans drawn at a scale of 1:50 or 1:100 showing a cross section(s) through the proposed building(s)
  should be submitted. In all cases where a proposal involves a change in ground levels or provision of
  a basement, illustrative drawings should be submitted to show both existing and finished levels to include
  details of foundations and eaves and how encroachment onto adjoining land is to be avoided. ... For
  applications in the Green Belt for extensions to buildings, for replacement and new buildings, existing
  and proposed cross-sections at a scale of 1:50/1:100 indicating the extent of the roofspace above 1.5
  metres in height. ... Planning applications for properties within the Green Belt.
must-include:
- item: Drawn at a scale of 1:50 or 1:100
  level: must
- item: Existing and finished levels, with details of foundations and eaves and how encroachment onto
    adjoining land is avoided
  level: must
  required-if:
    any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: A change in ground levels.
    - condition:
        field: basement
        value: true
        description: A basement.
- item: 'Green Belt: the extent of the roofspace above 1.5 metres in height (householder: head height
    under the roof)'
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: The site is in the Green Belt.
- item: 'Major development: site-wide cross sections on a North-South and East-West plane, showing the
    relationship with land-form, boundaries, vegetation and buildings'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published July 2020), page 6 of the Validation Document; page 2 of the
  Householder validation checklist (republished December 2024). The general request for cross sections
  through proposed buildings has no trigger, so it shows as 'check'. Householder schemes on sloping sites
  'may' need sections.
review-status: unverified
field-status: {}
