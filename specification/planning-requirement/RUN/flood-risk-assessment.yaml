reference: flood-risk-assessment
local-authority: RUN
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in flood zone 2 or 3, or on land surrounded by higher risk flood zones
        (a dry island).
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (flood zone 1).
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
source-text: Flood Risk Assessment A Flood Risk Assessment (FRA) will be required for new developments
  in Flood Zones 2 and 3, and for development proposals on sites of 1 hectare or greater in Flood Zone
  1 or otherwise if located on land surrounded by higher risk flood zones (known as a dry island).
must-include:
- item: Householder Flood Risk Assessment template
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: Flood Risk Assessment – householder template … Planning applications located within flood
    zones 2 and 3
confidence: medium
notes: 'Audit (wrong_trigger): the householder row quoted the web page (''a simple Flood Risk Assessment
  may be required''); the checklist trigger is flood zones 2 and 3.'
review-status: unverified
field-status: {}
