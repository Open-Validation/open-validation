reference: floor-plan-existing
local-authority: RUN
required-if:
  any:
  - application-type:
      in:
      - hh
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
source-text: These should be drawn to a scale of 1:50 or 1:100, including written dimensions, and should
  explain the proposal in detail. ... Existing and proposed floor plans scaled at 1:50 or 1:100 and with
  written dimensions
must-include:
- item: Drawn at a scale of 1:50 or 1:100, with written dimensions
  level: must
- item: Buildings or walls to be demolished clearly shown
  level: must
- item: 'Major development: a schedule of gross internal floor areas for each dwelling or house-type'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published July 2020), page 5 of the Validation Document; page 2 of the
  Householder validation checklist (republished December 2024). The Validation Document lists plans in
  its local list without saying when they are needed, and says not every local item is needed in every
  case, so applications other than householder show as 'check'. The Householder checklist requires them
  for all householder applications.
