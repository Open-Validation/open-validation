reference: transport-assessment
local-authority: RUN
required-if: discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: NPPF; Surrey County Council Transport Development Planning Good Practice Guide (2017)
source-text: Information should include all existing and proposed commercial and residential vehicular
  and ... upon those conditions and any measures proposed to mitigate impacts to an acceptable level,
  in particular with regard to highway safety.
must-include:
- item: All existing and proposed commercial and residential vehicular and pedestrian movements to and
    from the site
  level: must
- item: Existing transport conditions, the development's impact on them, and mitigation (particularly
    for highway safety)
  level: must
- item: Connectivity with sustainable modes (rail, bus, cycle and foot) and related enhancements
  level: must
- item: 'Major development: targeted traffic generation thresholds, with sustainable transport measures
    tied to any exceedances found by monitoring'
  level: should
  required-if:
    ref: major-development
- item: Loading areas and arrangements for manoeuvring, servicing and parking of vehicles
  level: must
confidence: medium
notes: From the council's list (published July 2020), page 9-10 of the Validation Document. The list gives
  no threshold for a Transport Assessment or Statement, so it shows as 'check'.
