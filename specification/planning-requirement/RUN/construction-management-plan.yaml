reference: construction-management-plan
local-authority: RUN
required-if:
  any:
  - ref: major-development
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
source-text: Proposed major developments should be supported by Construction Transport Management Plans
  to show how the demolition/construction processes will be managed in relation to constructor parking,
  deliveries, cleaning of the highway etc.
must-include:
- item: 'How demolition and construction will be managed: constructor parking, deliveries, cleaning of
    the highway'
  level: must
confidence: medium
notes: From the council's list (published July 2020), page 10, 15 of the Validation Document. A Construction
  (and) Environmental Management Plan may also be sought 'where necessary' for noise or air quality, which
  shows as 'check'.
review-status: unverified
field-status: {}
