source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Community Infrastructure Levy Regulations 2010 (as amended); Runnymede CIL Charging Schedule
source-text: Liable developments and associated planning applications must therefore specify the gross
  internal floorspace of buildings and those to be demolished or retained (in full or in part). Applications
  will need to be accompanied by an Additional CIL Information form
must-include:
- item: Gross internal floorspace of buildings, and of those to be demolished or retained (in full or
    in part)
  level: must
confidence: medium
notes: From the council's list (published July 2020), page 6 of the Validation Document; page 1 of the
  Householder validation checklist (republished December 2024). The Householder checklist asks for the
  CIL Additional Information form with all householder applications. The Validation Document asks for
  it from 'liable developments' without defining them (it was written before Runnymede adopted CIL), so
  other applications show as 'check'.
