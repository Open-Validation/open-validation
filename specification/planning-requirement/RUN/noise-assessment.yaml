reference: noise-assessment
local-authority: RUN
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development results in external noise impacts above the Lowest Observed Adverse
        Effect Level.
  - condition:
      field: noise-sensitive-use
      value: true
      description: The development is subject to external noise above the Lowest Observed Adverse Effect
        Level.
  - condition:
      field: plant-equipment
      value: true
      description: Related plant such as air conditioning units, air source heat pumps, refrigeration/condenser
        units.
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: NPPF (agent of change); BS 8233:2014
source-text: Application proposals that result in or being subject to external noise impacts above the
  Lowest Observed Adverse Effect Level will be expected to implement measures to mitigate these impacts.
  Applicants should be aware that it is not only the primary development/use that can require assessment,
  but in addition related plant such as air conditioning units, air source heat pumps, refrigeration/condenser
  units. Such developments must be supported by a Noise Impact Assessment carried out by a competent expert.
must-include:
- item: Carried out by a competent expert
  level: must
- item: Mitigation of noise impacts, including on existing properties, public open spaces and businesses
    (agent of change)
  level: must
confidence: medium
notes: From the council's list (published July 2020), page 15 of the Validation Document. The council's
  Environmental Health team advises on individual requirements, which shows as 'check'.
review-status: unverified
field-status: {}
