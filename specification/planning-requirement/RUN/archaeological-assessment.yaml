reference: archaeological-assessment
local-authority: RUN
required-if:
  any:
  - any:
    - condition:
        field: site-area-residential
        operator: '>'
        value: 0.4
        description: Sites in excess of 0.4 ha.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 0.4
        description: Sites in excess of 0.4 ha.
  - site:
      in:
      - archaeological-priority-area
      description: Areas of High Archaeological Potential (Runnymede Local Plan 2030).
  - site:
      in:
      - scheduled-monument
      description: Sites affecting a Scheduled Monument.
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Runnymede 2030 Local Plan
source-text: For sites in excess of 0.4ha and sites within Areas of High Archaeological Potential as defined
  in the Runnymede Local Plan 2030, an archaeological ... will be required and where appropriate the results
  of site evaluation and mitigation strategy (where archaeological assets have been identified).
must-include:
- item: Where appropriate, the results of site evaluation and a mitigation strategy
  level: must
  required-if: discretionary
- item: Plans showing historic features on or next to the site, including listed buildings and structures
    and historic parks and gardens
  level: should
- item: 'Scheduled Monuments: full details of the proposed impact on the monument, having regard to Historic
    England advice'
  level: must
  required-if:
    site:
      in:
      - scheduled-monument
      description: A Scheduled Monument is affected.
confidence: medium
notes: From the council's list (published July 2020), page 13 of the Validation Document; page 3 of the
  Householder validation checklist (republished December 2024). Householder applications in Areas of High
  Archaeological Potential need an archaeology study.
review-status: unverified
field-status: {}
