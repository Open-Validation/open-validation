reference: planning-statement
local-authority: RUN
required-if:
  ref: major-development
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
source-text: For major applications, it is recommended a planning statement should be submitted and should
  identify the context and need for a proposed development and includes an assessment of how the proposed
  development accords with policies
must-include:
- item: The context and need for the development
  level: must
- item: How the development accords with national policy, the development plan, SPDs and Interim Advice
    Notes
  level: must
- item: Cross-references to the other supporting documents
  level: should
- item: Draft Heads of Terms for affordable housing, where an agreed final draft S106 agreement is not
    submitted
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more (net) additional dwellings.
confidence: medium
notes: From the council's list (published July 2020), page 2 of the Validation Document. The council 'recommends'
  a planning statement for major applications. It also asks for a covering letter summarising the scheme
  with a schedule of drawings and documents, particularly for major schemes.
review-status: unverified
field-status: {}
