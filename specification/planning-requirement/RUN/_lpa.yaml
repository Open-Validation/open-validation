local-authority: RUN
name: Runnymede Borough Council
region: South East
type: District
review-status: unverified
validation-list:
  url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
  date: 2020-07
  date-basis: 'cover: ''July 2020''; para 1.3: ''This July 2020 document will be used in the validation
    of planning applications from July 2020'' (next review was due May 2022). Still the council''s ''Validation
    Document'' for all non-householder applications on its ''What do I need to submit?'' page on 2026-11-05.
    Householder applications use the separate Householder validation checklist (https://www.runnymede.gov.uk/downloads/file/713/householder-validation-checklist),
    ''initially published in May 2021, reviewed and republished in December 2024''.'
  status: outdated
submission-standards:
- item: Plans include details of their scale, with a scale bar and/or annotated measurements so they can
    be scaled electronically
  level: must
- item: Plans drawn to an identified standard metric scale, with a title and/or drawing number
  level: should
- item: Plans submitted in PDF format with a scale bar
  level: should
- item: Dimensions of extensions and new buildings, and distances to relevant boundaries, clearly marked
    on plans
  level: should
- item: A schedule of submitted drawing references and titles
  level: should
- item: Full applications for residential schemes state the number of dwellings in the description; generic
    'residential development' descriptions are not accepted
  level: must
- item: 'Householder: plans in PDF format, with a north arrow on site plans, a correct scale bar and written
    dimensions'
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the council''s current non-householder validation document, but it dates
    from July 2020 (not May 2022, which is the overdue review date). About a dozen local requirements
    are missing, including Green Belt statements, street scene, contaminated land, Green and Blue Infrastructure
    checklist, wind turbines, LDC and tree-works evidence. Many triggers are fragments that lose their
    thresholds, and several rows are mislabelled or put under the wrong application type. Fixed 2026-11-05:
    every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: IN LAW, NOT YET IN FORCE: abolished from 1 Apr 2027 by the Surrey (Structural
  Changes) Order 2026 (SI 2026/264); successor West Surrey Council (shadow authority elected 7 May 2026,
  no services until vesting). This council remains the LPA and its validation list applies until 31 Mar
  2027; expect a new West Surrey Council list from vesting day.'
