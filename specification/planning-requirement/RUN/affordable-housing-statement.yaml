reference: affordable-housing-statement
local-authority: RUN
required-if:
  condition:
    field: dwelling-count
    operator: '>='
    value: 10
    description: 10 or more (net) additional dwellings.
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
policy: Runnymede 2030 Local Plan policy SL20
source-text: For applications where affordable housing is required, applications will need to be accompanied
  by either draft Heads of Terms set out within the supporting Planning Statement or where possible, an
  agreed final draft S106 agreement to secure the affordable housing. ... The affordable housing requirements
  are set out in the Runnymede Local Plan 2030 (policy SL20) and NPPF 2019 and applies to developments
  of 10 or more (net) additional units.
must-include:
- item: Draft Heads of Terms (in the Planning Statement) or, where possible, an agreed final draft S106
    agreement
  level: must
- item: The number, type and tenure mix of the affordable housing
  level: must
- item: A nominations agreement, if relevant
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2020), page 8 of the Validation Document.
review-status: unverified
field-status: {}
