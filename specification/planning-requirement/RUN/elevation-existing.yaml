reference: elevation-existing
local-authority: RUN
required-if:
  any:
  - application-type:
      in:
      - hh
  - discretionary
source-url: https://www.runnymede.gov.uk/downloads/file/711/plannning-validation
source-text: These should be drawn to a scale of 1:50 to 1:100, including written dimensions, and show
  clearly the proposed works in relation to what is already there. All sides of the proposal must be shown
  ... Existing and proposed elevations scaled at 1:50 or 1:100 and with written dimensions
must-include:
- item: Drawn at a scale of 1:50 to 1:100, with written dimensions
  level: must
- item: All sides of the proposal, including blank elevations
  level: must
- item: Where possible, the proposed building materials and the style, materials and finish of windows
    and doors
  level: should
- item: 'Where the elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each property'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published July 2020), page 5 of the Validation Document; page 2 of the
  Householder validation checklist (republished December 2024). The Validation Document lists plans in
  its local list without saying when they are needed, and says not every local item is needed in every
  case, so applications other than householder show as 'check'. The Householder checklist requires them
  for all householder applications.
