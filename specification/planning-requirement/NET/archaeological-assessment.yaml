reference: archaeological-assessment
local-authority: NET
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - lbc
      - demolition-con-area
  - any:
    - site:
        in:
        - scheduled-monument
        description: On, near or affecting a Scheduled Monument.
    - site:
        in:
        - hadrians-wall-corridor
        description: Along the Hadrian's Wall corridor or within the vicus of the Roman Forts (Newcastle,
          Benwell, Wallsend and South Shields).
    - site:
        in:
        - historic-environment-record
        description: Affecting, on or adjacent to sites, buildings or structures on the Tyne and Wear
          Historic Environment Record.
    - all:
      - condition:
          field: greenfield-site
          value: true
          description: A greenfield site.
      - any:
        - condition:
            field: site-area-residential
            operator: '>='
            value: 1
            description: 1 hectare or more.
        - condition:
            field: site-area-non-residential
            operator: '>='
            value: 1
            description: 1 hectare or more.
    - all:
      - any:
        - condition:
            field: demolition
            value: true
            description: Demolition.
        - condition:
            field: structural-alteration
            value: true
            description: Substantial repair or alteration.
      - any:
        - condition:
            field: pre-1900-building
            value: true
            description: A historic building (19th century or earlier).
        - site:
            in:
            - listed-building
            - locally-listed-building
            - conservation-area
            description: A listed or locally listed building, or an unlisted building in a conservation
              area.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policies CS15, UC14; Newcastle Development
  and Allocations Plan DM17, DM18, DM19; Archaeology and Development SPD
source-text: 'Archaeological desk based assessment • Proposals on or near Scheduled Monuments; • Developments
  along the Hadrian''s Wall corridor or within the vicus (civilian settlement) of the Roman Forts (Newcastle,
  Benwell, Wallsend and South Shields); • Greenfield sites of 1 hectare or more. … Exceptions: Householder
  extensions and any development with no ground intrusion. … All applications involving new building work
  where one of the following would apply: … • Proposals affecting sites identified on the Tyne and Wear
  Historic Environment Record; … Archaeological Building Assessment and Recording • Proposals on or adjacent
  to sites identified on the Tyne and Wear Historic Environment Record; • Applications for the demolition,
  substantial repair or alteration of historic buildings (19th century or earlier), and other listed buildings,
  locally listed buildings and unlisted buildings within a Conservation Area.'
must-include:
- item: Title states the document is/includes an archaeological assessment
  level: must
confidence: medium
notes: 'From the council''s list (published January 2025), page 24. Note 14 of the list, which covers
  three documents: a desk-based assessment (excluding householder extensions and development with no ground
  intrusion), an evaluation report (new building work) and building assessment and recording. The checklists
  mark it ''No'' for change of use without building works and for reserved matters, and ''seek pre-application
  advice'' for listed building consent and relevant demolition.'
review-status: unverified
field-status: {}
