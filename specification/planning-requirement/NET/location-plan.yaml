reference: location-plan
local-authority: NET
required-if:
  always: true
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All applications must include copies of a location plan based on an up-to-date map.
must-include:
- item: Based on an up-to-date map at an identified standard metric scale (1:1250 or 1:2500)
  level: must
- item: Shows the direction north
  level: must
- item: Sufficient roads and/or buildings on adjoining land to make the exact location of the site clear
  level: should
- item: Application site edged clearly with a solid red line, including all land needed to carry out the
    development (access from a public highway, visibility splays, landscaping, drainage areas, car parking
    and open areas around buildings)
  level: should
- item: Any other land owned or controlled by the applicant, close to or adjoining the site, edged in
    blue
  level: should
- item: 'Householder applications: scale 1:1250, red line including any required visibility splays and
    access from the public highway'
  level: must
  required-if:
    application-type:
      in:
      - hh
  source-text: 'Scale: 1:1250'
confidence: medium
notes: From the council's list (published January 2025), page 9-10. Note 2 of the list; the householder
  checklist (Checklist 5, page 105) gives 1:1250, and the lawful development certificate checklist (Checklist
  7, page 110) asks for land outlined in red.
review-status: unverified
field-status: {}
