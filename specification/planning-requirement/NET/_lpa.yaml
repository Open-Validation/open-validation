submission-standards:
- item: All plans and drawings numbered or labelled; amended plans carry a revision number and date
  level: must
- item: Applications submitted online through the Planning Portal; post/email only if that is not feasible
    and agreed; paper copies not recommended
  level: should
- item: All relevant questions on the application form completed, or 'Not Applicable'/N/A inserted; the
    description of development accurately describes the proposal and matches the plans
  level: must
- item: Signatures and personal information redacted in supporting documents, or sensitive information
    put in a separate document marked 'Confidential - Not for Public Use'
  level: should
- item: 'Outline applications: indicative information not for determination clearly marked ''Indicative/For
    information only'''
  level: must
