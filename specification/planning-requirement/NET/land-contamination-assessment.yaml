reference: land-contamination-assessment
local-authority: NET
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: ground-disturbance
      value: true
      description: Groundworks are proposed.
  - any:
    - condition:
        field: sensitive-end-use
        value: true
        description: New development with a sensitive end use (dwellings, allotments, schools, nurseries,
          playgrounds, hospitals, care homes).
    - site:
        in:
        - contaminated-land
        description: On or adjacent to land on the public register as contaminated.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policy CS14; Newcastle Development
  and Allocations Plan DM24
source-text: All new development with a sensitive end use (including dwellings, allotments, schools, nurseries,
  playgrounds, hospitals and care homes) require a minimum of a Phase 1 Land Contamination Assessment
  (often referred to as a Preliminary Risk Assessment) to be submitted. Also new development on land that
  has been identified on the public register as being contaminated or land that is adjacent requires a
  Phase 1 Assessment will be required as a minimum. … Proposals where no groundworks are proposed.
must-include:
- item: Title states the document is/includes a Phase 1 Desktop Investigation and whether a Phase 2 Site
    Investigation and Ground Gas Risk Assessment Report is included
  level: must
- item: An executive summary setting out the findings of the investigations
  level: must
- item: 'Single dwellings on previously undeveloped land: a simple screening assessment (form on the council
    website)'
  level: must
  required-if:
    all:
    - condition:
        field: dwelling-count
        operator: ==
        value: 1
        description: A single dwelling.
    - condition:
        field: greenfield-site
        value: true
        description: On land identified as previously undeveloped.
  source-text: Within Gateshead, Newcastle and South Tyneside, in applications for single dwellings on
    land identified as previously undeveloped land, a simple screening assessment is required.
confidence: medium
notes: From the council's list (published January 2025), page 53. Note 21 of the list. Not required for
  householder applications, lawful development certificates, listed building consent, demolition in a
  conservation area, non-material amendments, variations of conditions (unless about ground contamination)
  or proposals with no groundworks; the full checklist marks it 'No' for change of use without building
  works and the outline checklist 'No' for reserved matters.
review-status: unverified
field-status: {}
