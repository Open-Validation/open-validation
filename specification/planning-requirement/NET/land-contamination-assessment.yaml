reference: land-contamination-assessment
local-authority: NET
required-if:
  any:
  - condition:
      field: sensitive-end-use
      value: true
      description: New development with a sensitive end use.
  - site:
      in:
      - contaminated-land
      description: The site is on the council's contaminated land register.
  - all:
    - condition:
        field: dwelling-count
        operator: ==
        value: 1
        description: The application is for a single dwelling.
    - condition:
        field: greenfield-site
        value: true
        description: The site is land identified as previously undeveloped.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
source-text: The title must state the document is/includes a Phase 1 Desktop Investigation and whether
  a Phase 2 Site Investigation and Ground Gas Risk Assessment Report is included An executive summary
  setting out the findings of the Investigations Within Gateshead, Newcastle and South Tyneside, in applications
  for single dwellings on land identified as previously undeveloped land, a simple screening assessment
  is required.
must-include:
- item: The title states that the document is or includes a Phase 1 Desktop Investigation, and whether
    a Phase 2 Site Investigation and Ground Gas Risk Assessment Report is included
  level: must
- item: An executive summary setting out the findings of the investigations
  level: must
confidence: medium
notes: 'From the audit (wrong_trigger): Note 21 applies to ''All new development with a sensitive end
  use'' and land on the contaminated land register; for a single dwelling on previously undeveloped land
  in Newcastle a simple screening assessment is enough.'
