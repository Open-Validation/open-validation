source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policies CS13, CS16; Newcastle Development
  and Allocations Plan DM10, DM11, DM12, DM13, DM14
source-text: 'The following table outlines the general thresholds for when a Transport Assessment/Statement
  and Travel Plan are required to be submitted with a planning application: … These thresholds are for
  guidance purposes only, for full requirements on all applications advice should be sought from the appropriate
  Local Planning Authority using the pre-application service.'
must-include:
- item: Title states the document is/includes a Travel Plan
  level: must
- item: Clear evidence the document is up to date and does not rely on data over 3 years old
  level: must
- item: An executive summary setting out the findings
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 77-80. Note 34 of the list. The conditions
  are the table's lower thresholds, at which a Transport Statement and Travel Plan are needed (a full
  Transport Assessment applies at the higher thresholds, e.g. over 80 dwellings or over 4,000 sq m of
  B2). Discretionary covers C4 houses in multiple occupation and other sui generis uses ('Refer to LPA')
  and the list's statement that the thresholds are 'for guidance purposes only'.
review-status: unverified
field-status: {}
