reference: affordable-housing-statement
local-authority: NET
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Housing development of 10 units or more.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policy CS11; Newcastle Development
  and Allocations Plan DM5; Planning Obligations SPD
source-text: 'Gateshead and Newcastle only: All applications for housing development of 10 units or more.'
must-include:
- item: Title states the document is/includes an affordable housing statement (it can be part of the Design
    and Access or Planning Statement)
  level: must
- item: 'Full and reserved matters applications: the location of the affordable units shown on the plans'
  level: should
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
confidence: medium
notes: From the council's list (published January 2025), page 19-20. Note 12 of the list; the thresholds
  differ for each Tyneside council.
review-status: unverified
