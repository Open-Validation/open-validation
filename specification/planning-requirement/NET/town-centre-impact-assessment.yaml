reference: town-centre-impact-assessment
local-authority: NET
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use not in an existing centre and not in accordance with an up-to-date
        Local Plan.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policies CS6, CS7, CS8, UC1, UC2;
  Newcastle Development and Allocations Plan DM3, DM4
source-text: Main town centre uses that are not in an existing centre and not in accordance with an up-to-date
  Local Plan.
must-include:
- item: Title states whether the documents is/includes a town centre use assessment and whether it includes
    an impact assessment and a sequential test
  level: must
- item: Impact assessment where 500 sq m (net) or more of retail and leisure floorspace is proposed edge
    or out of centre
  level: must
  required-if:
    condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 500
      description: 500 sq m (net) or more of retail and leisure floorspace.
- item: Sequential test for office use outside an allocated centre over 200 sq m (net)
  level: must
  required-if:
    condition:
      field: office-floorspace
      operator: '>'
      value: 200
      description: Office floorspace exceeding 200 sq m (net).
  source-text: In Newcastle and Gateshead only, a sequential test is required for office use outside of
    an allocated centre where the floor space proposed exceeds 200sqm (net).
confidence: medium
notes: From the council's list (published January 2025), page 75-76. Note 33 of the list (Town Centre
  Use Assessment); the impact assessment thresholds are in the table on page 75 and differ for each council.
  The reserved matters checklist marks it 'No'.
review-status: unverified
field-status: {}
