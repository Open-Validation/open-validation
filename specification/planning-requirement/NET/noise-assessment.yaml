reference: noise-assessment
local-authority: NET
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: The development may create additional noise (including Class B2 uses).
  - condition:
      field: noise-sensitive-use
      value: true
      description: The development would be sensitive to the prevailing acoustic environment.
  - condition:
      field: plant-equipment
      value: true
      description: New or replacement industrial plant or machinery is proposed.
  - discretionary
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
source-text: 'Acoustic and Vibration Assessment When is this required? Applications where development
  may create additional noise, or would be sensitive to the prevailing acoustic environment (including
  any anticipated changes to that environment from activities that are permitted but not yet commenced)
  including involving: development within Classes B2, and/or where new or replacement industrial plant/machinery
  is proposed that have the potential to result in increased noise levels outside of the application …'
