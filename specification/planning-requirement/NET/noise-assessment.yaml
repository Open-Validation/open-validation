reference: noise-assessment
local-authority: NET
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: 'Development that may create additional noise: Class B2 or new/replacement industrial
            plant, new outdoor sport facilities, Class E restaurants, cafes, indoor sport, health, nurseries;
            Class F1 places of worship; Class F2 outdoor sport, pools and rinks; listed sui generis uses.'
      - condition:
          field: noise-sensitive-use
          value: true
          description: New residential development next to the strategic road network, classified roads,
            railway or metro lines, airports, existing industrial uses or any of the noisy uses listed.
      - condition:
          field: renewable-energy-development
          value: true
          description: Energy generation development, including air source heat pumps.
  - application-type:
      in:
      - mineral-app
      - waste-dev
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: plant-equipment
        value: true
        description: Noise or vibration creating energy generation equipment (such as air source heat
          pumps) and/or air conditioning units.
  - discretionary
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policy CS14; Newcastle Development
  and Allocations Plan DM23, DM24
source-text: 'Applications where development may create additional noise, or would be sensitive to the
  prevailing acoustic environment (including any anticipated changes to that environment from activities
  that are permitted but not yet commenced) including involving: … Minerals and waste development; … Energy
  generation development, including the installation of air source heat pumps … A vibration survey may
  be required if a development is proposed adjacent to a railway or metro line (over or underground).
  … Applications for prior notification will require to be accompanied by an acoustic assessments where
  potential impacts upon residential amenity are identified as a material consideration in Checklist 8
  below.'
must-include:
- item: Title confirming the document is/includes a noise impact assessment and vibration assessment
  level: must
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 17-18, 108. Note 11 of the list; the householder
  checklist (page 108) asks for it only for energy generation equipment such as air source heat pumps
  and air conditioning units. Discretionary covers the vibration survey ('may be required') and prior
  approvals where amenity impacts are identified.
review-status: unverified
field-status: {}
