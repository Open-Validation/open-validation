reference: heritage-statement
local-authority: NET
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - conservation-area
      description: The proposal is in or affects a conservation area.
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: The proposal affects a designated or non-designated heritage asset.
