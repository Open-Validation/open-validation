reference: heritage-statement
local-authority: NET
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - ref: major-development
    - site:
        in:
        - conservation-area
        description: Within or otherwise affecting a conservation area.
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
        - demolition-con-area
    - site:
        in:
        - conservation-area
        description: Development within a conservation area, including demolition (not change of use).
    - discretionary
  - site:
      in:
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      - battlefield
      description: May affect the heritage significance of a heritage asset or its setting, including
        non-designated assets.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policies CS15, UC13, UC14; Newcastle
  Development and Allocations Plan DM15, DM16
source-text: 'A Heritage Statement is required for: • Listed Building Consent applications; • Major planning
  applications within or otherwise affecting conservation areas; • Planning applications for developments
  within conservation areas, including demolition, (except changes of use) where the proposal would materially
  affect character and appearance; • Planning applications that may affect the heritage significance of
  any heritage asset and its setting, including non-designated heritage assets.'
must-include:
- item: Title states the document is/includes a Heritage Statement (it can be part of the Design and Access
    Statement or Planning Statement)
  level: must
- item: Photographs of the heritage asset in context, its exterior and interior, within the document itself
  level: must
- item: 'Demolition in a conservation area: an assessment of the building''s contribution to the conservation
    area and a justification for demolition'
  level: should
  required-if:
    condition:
      field: demolition
      value: true
      description: The proposal includes demolition.
confidence: medium
notes: 'From the council''s list (published January 2025), page 47-48, 107. Note 19 of the list. Discretionary:
  in a conservation area it is needed only ''where the proposal would materially affect character and
  appearance'', which is a judgement.'
review-status: unverified
field-status: {}
