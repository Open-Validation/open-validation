reference: site-plan
local-authority: NET
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - hh
        - lbc
        - demolition-con-area
    - condition:
        field: building-works
        value: true
        description: The application includes extensions or external ground works (not change of use only,
          and not where no external building works are proposed).
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-count
        operator: '>='
        value: 2
        description: More than one advertisement is proposed.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: All planning applications that include extensions or external ground works (i.e. excluding
  applications for change of use only or where no external building works are proposed) shall include
  existing and proposed site plans at a standard metric scale (1:100 or 1:200), unless otherwise requested
  and agreed with the Local Planning Authority. … Where multiple adverts are proposed a site plan to a
  scale of either 1:100 or 1:200 showing the direction of north, all buildings on site, and the position
  of the advert(s) with written dimensions and distances to the site boundaries as a minimum;
must-include:
- item: Existing and proposed site plans at a standard metric scale (1:100 or 1:200), unless otherwise
    agreed
  level: must
- item: Direction north
  level: must
- item: Proposed footprint of the development in the context of all existing buildings within 10 metres
    of it
  level: must
- item: Written dimensions and distances from the elevations of the proposal to the existing site boundaries
    and to existing buildings within 10 metres
  level: should
- item: All buildings, roads and footpaths on adjoining land, including access arrangements, unless they
    would not influence or be affected by the development
  level: must
- item: All public rights of way crossing or adjoining the site, unless they would not influence or be
    affected by the development
  level: must
- item: Position of all existing trees on the site (including canopy spread) and on adjacent land, unless
    they would not influence or be affected by the development
  level: must
- item: Extent and type of any hard surfacing, unless it would not influence or be affected by the development
  level: must
- item: Boundary treatments, including the type and height of walls or fencing, unless they would not
    influence or be affected by the development
  level: must
- item: 'Advertisements: all buildings on site and the position of the advert(s), with written dimensions
    and distances to the site boundaries'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: From the council's list (published January 2025), page 10, 104. Note 3 of the list; the advertisement
  checklist (Checklist 4, page 104) asks for a site plan only where multiple adverts are proposed.
review-status: unverified
field-status: {}
