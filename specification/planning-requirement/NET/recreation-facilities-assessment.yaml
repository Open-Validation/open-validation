reference: recreation-facilities-assessment
local-authority: NET
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - site:
      in:
      - open-space
      description: Development on existing open space, sports and recreational buildings and land, including
        playing fields.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policy CS18; Newcastle Development
  and Allocations Plan DM30
source-text: All planning applications for development on existing open space, sports and recreational
  buildings and land, including playing fields.
must-include:
- item: Title states whether the documents is/includes an open space and/or playing pitch assessment (it
    can be part of the Design and Access Statement or Planning Statement)
  level: must
- item: Plans to scale, with area measurements, showing any existing or proposed open space within or
    adjoining the site
  level: should
confidence: medium
notes: From the council's list (published January 2025), page 62. Note 25 of the list (Open Space Assessment,
  including playing fields and recreational buildings).
review-status: unverified
field-status: {}
