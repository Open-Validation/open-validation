reference: cil-form
local-authority: NET
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: cil-liable
      value: true
      description: The development is liable for CIL.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policy DEL1
source-text: A Planning Application Additional Information Requirement Form is required to be competed
  for all relevant applications in Gateshead, North Tyneside and Newcastle to calculate CIL liability.
must-include:
- item: Floorspace proposed (sq m)
  level: must
- item: Whether a building on the site has been in use for a continuous period of at least six months
    within the past 3 years, and in what use(s)
  level: must
- item: Gross internal floorspace of that building to be demolished or changed in use
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 93. Note 39 of the list (Community Infrastructure
  Levy, Gateshead, North Tyneside and Newcastle only).
review-status: unverified
field-status: {}
