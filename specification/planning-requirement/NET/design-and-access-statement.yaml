reference: design-and-access-statement
local-authority: NET
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a World Heritage Site or a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: A building or extension of more than 100 sq m floor space.
  - application-type:
      in:
      - lbc
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: The provision of dwellinghouses where - (i) the number of dwellinghouses to be provided is
  10 or more; or (ii) the development is to be carried out on a site having an area of 0.5 hectares or
  more and it is not known whether the development falls within (i); … The provision of a building or
  buildings where the floor space to be created by the development is 1,000 square metres or more; … Development
  carried out on a site having an area of 1 hectare or more (excluding minerals, mining or waste development
  applications) … In World Heritage Sites or in a conservation area; (i) the provision of one or more
  dwellinghouse; or (ii) the provision of a building (or extension) where the proposed floor space is
  more than 100 square metres; … Applications for listed building consent
must-include:
- item: Title states the document is/includes a design and access statement
  level: must
- item: 'Listed building consent: explains how the design principles take account of the special architectural
    or historic importance of the building, its significant physical features, its setting, the approach
    to access (including alternatives considered) and any consultation undertaken'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (published January 2025), page 12-13. Note 7 of the list. The first three
  triggers are the major-development thresholds, so they are shown as major-development.
review-status: unverified
field-status: {}
