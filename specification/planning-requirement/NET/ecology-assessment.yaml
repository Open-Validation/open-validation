reference: ecology-assessment
local-authority: NET
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: semi-natural-habitat-impact
      value: true
      description: The application could impact upon semi-natural habitats within or outside the site.
source-url: https://www.newcastle.gov.uk/sites/default/files/planning/Tyneside%20Validation%20Checklist%20Jan%2025%20-Final%20with%20bookmarks.pdf
policy: Core Strategy and Urban Core Plan for Gateshead and Newcastle policy CS18; Newcastle Development
  and Allocations Plan DM24, DM29
source-text: An EcIA will be required for applications (excluding householder) which could impact upon
  semi-natural habitats, both within and external to the development site.
must-include:
- item: Title confirming the document is/includes an Ecological Impact Assessment
  level: must
- item: 'Or: written confirmation from the council ecologist (at pre-application stage) that it is not
    required, or a submitted preliminary ecological assessment confirming no further work is required'
  level: must
confidence: medium
notes: From the council's list (published January 2025), page 30-31. Note 16B of the list (Ecological
  Impact Assessment, EcIA). Not required if the council ecologist confirms in writing that it is not needed,
  or an approved preliminary ecological assessment concludes no further survey work is needed.
review-status: unverified
field-status: {}
