reference: noise-assessment
local-authority: BDG
required-if:
  any:
  - condition:
      field: plant-equipment
      value: true
      description: The proposal includes plant or extraction equipment.
  - condition:
      field: noise-generating-use
      value: true
      description: The proposal is for a noisy use.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise-sensitive use in a noisy area.
  - condition:
      field: traffic-aadt-increase
      operator: '>'
      value: 5
      description: Traffic increases of over 5% of Annual Average Daily Traffic.
source-url: https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
must-include:
- item: Prepared by a qualified acoustician
  level: must
confidence: medium
notes: 'From the audit (wrong_trigger): plant or extraction, noisy uses, noise-sensitive uses in noisy
  areas, and traffic increases over 5% of AADT. The council says it "must be prepared by a qualified acoustician".'
review-status: unverified
field-status: {}
