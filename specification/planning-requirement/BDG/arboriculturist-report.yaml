reference: arboriculturist-report
local-authority: BDG
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees on the site or on adjacent land (including street trees) that could
        influence or be affected by the development.
source-url: https://www.lbbd.gov.uk/sites/default/files/2026-07/Planning-Application-Householder-Validation-Checklist.pdf
source-text: Tree Survey / Aboricultural Implications Where there are trees within the application site,
  or on land adjacent to it that could influence or be affected by the development (including street trees),
  information will be required on which trees are to be retained and on the means of protecting these
  trees during construction works.
must-include:
- item: Which trees are to be retained
  level: must
- item: How the retained trees will be protected during construction works
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): not a tree works requirement. The 2026 Full Planning checklist asks for
  it for development affecting TPO trees, trees in a conservation area or nearby trees.'
review-status: unverified
field-status: {}
