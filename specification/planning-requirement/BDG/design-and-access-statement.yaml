reference: design-and-access-statement
local-authority: BDG
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      description: The site is in or affects a conservation area or a listed building.
source-url: https://www.lbbd.gov.uk/sites/default/files/2026-07/Planning-Application-Householder-Validation-Checklist.pdf
source-text: Design and Access Statement This is only required for a householder application where any
  part of the dwelling house or its curtilage falls within a conservation area.
must-include:
- item: An explanation of the design principles and concepts that have been applied to the development
  level: must
confidence: medium
notes: 'From the audit (wrong_trigger): major development, or development in or affecting a conservation
  area or listed building.'
review-status: unverified
field-status: {}
