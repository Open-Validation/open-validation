reference: archaeological-assessment
local-authority: BDG
required-if:
  all:
  - condition:
      field: ground-disturbance
      value: true
      description: The proposal involves groundworks.
  - site:
      in:
      - archaeological-priority-area
      description: The site is in an Archaeological Priority Area or is of archaeological significance.
source-url: https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
must-include:
- item: A written scheme of investigation for an archaeological evaluation (WSI), where necessary
  level: should
confidence: medium
notes: 'From the audit (wrong_trigger): groundworks on sites of archaeological significance or in an Archaeological
  Priority Area.'
review-status: unverified
field-status: {}
