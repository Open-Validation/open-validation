reference: site-plan
local-authority: NWA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - lbc
        - demolition-con-area
    - condition:
        field: building-works
        value: true
        description: Physical changes are proposed to the site and/or the buildings on it.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-on-existing-building
        value: false
        description: The proposed advertisements are not upon building elevations.
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: operational-development
        value: true
        description: The certificate is for a proposed operation (operational development).
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - condition:
        field: amends-approved-plans
        value: true
        description: The amendments relate to the site layout and/or buildings and structures.
  - all:
    - application-type:
        in:
        - outline
        - approval-condition
        - extend-duration-permission
    - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV4, ENV10 to ENV17, ECON9 and TPT6
source-text: Where there are physical changes proposed to the application site and/or buildings upon it,
  … A block plan where proposed advertisements are not upon building elevations; … In the case of an application
  for a proposed operation (i.e. operational development), Site layout, Elevational and Floor Plans, drawn
  to scale, MUST be provided;
must-include:
- item: At 1:200 or 1:500 scale, showing the site boundaries in detail, particularly in relation to neighbouring
    buildings, dwellings and land
  level: must
- item: Existing extensions and other structures within the site and at immediate neighbouring properties
  level: must
- item: 'Where they influence or would be affected by the proposal: all roads and public rights of way,
    trees, hard surfacing and boundary treatments'
  level: must
- item: The location of windows on neighbouring dwellings
  level: must
  required-if:
    condition:
      field: adjoins-residential-property
      value: true
      description: The site has neighbouring dwellings.
confidence: medium
notes: From the council's list (adopted July 2014), page 29 (Appendix B, a), with pages 11-12, 18-19 and
  22. The Appendix A matrix (page 25) marks it block plans 'Required' for householder, full, reserved
  matters, listed building and conservation area demolition applications and 'see page' for outline, s73,
  non-material amendments and time extensions. For s73 material minor amendments and non-material amendments
  the list requires 'relevant Block, Elevational, Floor and Site Level plans' where the amendments relate
  to the site layout or buildings. Approval of details and time extensions depend on the condition or
  circumstances, so they are discretionary.
review-status: unverified
field-status: {}
