reference: biodiversity-survey-report
local-authority: NWA
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - all:
    - application-type:
        in:
        - hedgerow-removal
    - discretionary
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policy ENV3; Wildlife and Countryside Act 1981; Conservation
  (Natural Habitats) Regulations
source-text: With all applications where an ecological interest is identified at pre-application or at
  consultation stage; … With all major applications affected by, and other applications identified to
  be affected by, saved policy ENV3 of the North Warwickshire Local Plan 2006;
must-include:
- item: Statutory or otherwise recognised sites of ecological interest, the significance of the site and
    the impacts of the development during and after construction
  level: must
- item: Measures to compensate for or mitigate adverse impacts, including long-term management
  level: must
- item: Survey work and mitigation where protected species or significant habitats are likely
  level: must
  required-if:
    condition:
      field: protected-species
      value: true
      description: Protected species or significant wildlife habitats are likely.
- item: How the biodiversity of the site will be enhanced
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 20 and 38-39 (Appendix B, r). Nature Conservation/Biodiversity
  Assessment (including Bat Survey & Ecology Report). Every trigger depends on an ecological interest
  being identified or on policy ENV3 applying, so it is discretionary. The list predates statutory biodiversity
  net gain.
review-status: unverified
field-status: {}
