reference: land-contamination-assessment
local-authority: NWA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Erection of new dwellings.
      - condition:
          field: sensitive-end-use
          value: true
          description: Buildings with a sensitive end use.
    - site:
        in:
        - contaminated-land
        description: An area of potential contamination or at risk of migrating land gas.
  - site:
      in:
      - contaminated-land
      description: The site, or adjoining land, is on the Council's Land Contamination Register.
  - all:
    - site:
        in:
        - coal-mining-high-risk-area
        description: Identified by the Coal Authority or local knowledge as having potential stability
          or gas migration concerns.
    - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policy ENV6
source-text: For proposals involving the erection of new dwellings or buildings with a sensitive end use,
  if the application falls within an area of potential contamination or at risk of migrating land gas,
  a Phase I Environmental Report MUST be submitted. … With all applications that involve any site, or
  land adjoining any site, that is recognised in the Council’s Land Contamination Register and Records,
  to allow assessment under saved policy ENV6 of the North Warwickshire Local Plan 2006. … With all applications
  that involve a site, or land adjoining a site that is identified by the Coal Authority, or by local
  knowledge, as being one with potential stability or gas migration concerns, in accordance with saved
  policy ENV6.
must-include:
- item: The ground conditions of the site, including structural stability where relevant
  level: must
- item: Measures needed to remediate or mitigate the findings
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 4, 6 and 42 (Appendix B, w). Phase I Environmental
  Report / Land Contamination/Stability Report. Stability or gas concerns 'by local knowledge' are a judgement,
  so that part is discretionary. The Coal Mining Risk Assessment is listed separately (unmapped).
review-status: unverified
field-status: {}
