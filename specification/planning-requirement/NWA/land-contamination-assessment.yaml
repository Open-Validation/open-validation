reference: land-contamination-assessment
local-authority: NWA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: new-build
        value: true
        description: The erection of new dwellings or buildings.
    - condition:
        field: sensitive-end-use
        value: true
        description: Buildings with a sensitive end use.
  - site:
      in:
      - contaminated-land
      description: An area of potential contamination or at risk of migrating land gas.
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
source-text: For proposals involving the erection of new dwellings or buildings with a sensitive end use,
  if the application falls within an area of potential contamination or at risk of migrating land gas,
  a Phase I Environmental Report MUST be submitted.
