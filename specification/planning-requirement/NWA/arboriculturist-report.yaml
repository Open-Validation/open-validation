reference: arboriculturist-report
local-authority: NWA
required-if:
  any:
  - site:
      in:
      - tree-preservation-zone
      description: Works to, or land carrying, trees protected by a Tree Preservation Order.
  - all:
    - ref: major-development
    - condition:
        field: trees-on-or-near-site
        value: true
        description: There is existing tree and hedgerow cover.
  - all:
    - application-type:
        in:
        - consent-under-tpo
    - condition:
        field: operational-development
        value: true
        description: The tree works are in conjunction with an application for operational development.
  - all:
    - application-type:
        in:
        - hedgerow-removal
    - discretionary
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV1, ENV2 and ENV4; BS 5837
source-text: With all applications involving works to, or land carrying, trees protected by a Tree Preservation
  Order; all major applications where there is existing tree and hedgerow cover; and other applications
  where there is a need for the survey, in order to allow assessment under ENV1, ENV2 and ENV4 of the
  North Warwickshire Local Plan 2006. … Where the proposed works are in conjunction with an application
  for operational development, a method statement illustrating compliance with BS 5837:2005 (Trees in
  Relation to Construction) is necessary.
must-include:
- item: 'A survey to BS 5837 of tree and hedgerow cover on the site and adjoining land: species, spread,
    roots, position, condition and amenity value'
  level: must
- item: Trees to be felled and those affected by the development
  level: must
- item: How the built form retains existing trees and hedgerows, and why alternatives could not be proposed
  level: should
- item: Measures to protect retained trees and hedgerows during construction
  level: must
- item: 'For tree works with operational development: a method statement showing compliance with BS 5837'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
confidence: medium
notes: From the council's list (adopted July 2014), page 13, 20 and 39 (Appendix B, q). Arboricultural
  Implications Assessment (Tree Survey). 'Other applications where there is a need for the survey' and
  hedgerow removal ('Dependent upon the circumstances') are discretionary. Appendix B heads each trigger
  'When may it be required?'; the bullets that name a clear case are shown as conditions and the policy-based
  or 'where appropriate' ones as discretionary.
review-status: unverified
field-status: {}
