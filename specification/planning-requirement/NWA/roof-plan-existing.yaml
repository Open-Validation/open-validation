reference: roof-plan-existing
local-authority: NWA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
    - condition:
        field: building-works
        value: true
        description: Physical changes are proposed to the site and/or the buildings on it.
    - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV4, ENV10 to ENV17, ECON9 and TPT6
source-text: 'Existing: Elevations, Floor Plans, Roof Plans, Site Sections and Ground Levels … Plans showing
  Existing Elevations and Floor Plans MUST show the existing layout of each floor, all external elevations
  and the roof plan.'
must-include:
- item: At 1:50 or 1:100 scale, including all existing buildings, extensions and areas of hardstanding
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 9 and 29. Appendix B (a) lists roof plans and
  site sections with the other plans, but the Appendix A matrix has no column for them, so outside listed
  building applications they are shown as discretionary.
review-status: unverified
field-status: {}
