reference: lighting-assessment
local-authority: NWA
required-if:
  any:
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: illuminated
        value: true
        description: Illuminated advertisements.
  - all:
    - any:
      - condition:
          field: illuminated
          value: true
          description: Illuminated advertisements.
      - condition:
          field: external-lighting
          value: true
          description: External lights.
    - site:
        in:
        - listed-building
        - conservation-area
        description: Listed buildings and conservation areas.
  - all:
    - condition:
        field: external-lighting
        value: true
        description: Lighting forms an essential or significant part of the proposal.
    - discretionary
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV1, ENV2, ENV11, ENV15 and ENV16
source-text: In the case of applications that involve illuminated advertisements, a lighting assessment
  MUST be included. This will identify any adverse light impacts, and mitigating measures proposed. …
  With all applications where lighting proposals form an essential or significant part of the proposal,
  especially proposals in the open countryside or Green Belt, in respect of saved policies ENV1 and ENV2
  of the North Warwickshire Local Plan 2006. … With any application that is identified at consultation
  stage, where lighting becomes a recognised issue, particularly in respect of saved policy ENV11. … With
  applications involving illumination either from advertisements or external lights, of Listed Buildings
  and in Conservation Areas, and in respect of saved policies ENV15 and ENV16.
must-include:
- item: Existing lighting levels, spillage and glow at, next to and at a distance from the site
  level: must
- item: Adverse light impacts of the proposed lights and measures to reduce them
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 12 and 40 (Appendix B, u). Whether lighting is
  'essential or significant', and issues raised at consultation, are judgements, so they are discretionary.
review-status: unverified
field-status: {}
