reference: location-plan
local-authority: NWA
required-if:
  always: true
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: This is an up to date Location Plan that identifies the land to which the application relates,
  drawn to an identified scale and showing the direction of North.
must-include:
- item: Drawn to an identified scale and showing the direction of North
  level: must
- item: On an Ordnance Survey base at 1:1250 (or 1:2500 if necessary)
  level: should
- item: Large enough to show surrounding property and roads
  level: must
- item: The application site clearly edged with a red line, including all land necessary to carry out
    the development (e.g. access, visibility splays, car parking and open areas around buildings)
  level: must
- item: A blue line around any other land owned by the applicant, close to or adjoining the site
  level: should
- item: 'For works to trees: the location of all trees subject of the application'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: 'For hedgerow removal: the location and length of the hedgerow(s) to be removed'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
- item: 'For prior notifications: the location of the proposed structure, works or buildings (or, for
    demolition, the buildings to be demolished)'
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
confidence: medium
notes: From the council's list (adopted July 2014), page 28 (Appendix B, B), with pages 13-15 and 19.
  The Appendix A matrix (page 25) marks it 'Required' for every application type except approval of details
  reserved by condition.
review-status: unverified
field-status: {}
