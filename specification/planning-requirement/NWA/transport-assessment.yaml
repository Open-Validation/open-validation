reference: transport-assessment
local-authority: NWA
required-if:
  any:
  - all:
    - condition:
        field: affects-trunk-road
        value: true
        description: The development affects a Highways Agency (trunk road) route.
    - condition:
        field: traffic-movements-peak-hour
        operator: '>'
        value: 30
        description: More than 30 two-way trips during any peak period.
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies TPT1 and ENV14; NPPF; DfT Circular 02/2007
source-text: 'With all applications that exceed the triggers outlined in saved policy TPT1 of the North
  Warwickshire Local Plan 2006; … In cases where the proposed traffic generation from the site could have
  an impact under the criteria of saved policy ENV14 of the North Warwickshire Local Plan 2006, particularly
  if they are for “major” applications. … The Highways Agency will require Assessments on their controlled
  routes where: … development generates more than 30 two-way trips during any peak period;'
must-include:
- item: 'For major proposals: accessibility of the site by all modes and the likely split of journey types'
  level: must
  required-if:
    ref: major-development
- item: Proposed measures to improve access by public transport, walking and cycling, reduce car parking
    needs and mitigate impacts
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 33-34 (Appendix B, h). The TPT1 triggers are
  not set out in the list, and ENV14 impact is a judgement, so both are discretionary; the 30 two-way
  peak trips threshold is the Highways Agency's for its own routes. Appendix B heads each trigger 'When
  may it be required?'; the bullets that name a clear case are shown as conditions and the policy-based
  or 'where appropriate' ones as discretionary.
review-status: unverified
field-status: {}
