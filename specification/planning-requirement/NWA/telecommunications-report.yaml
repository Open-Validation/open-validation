reference: telecommunications-report
local-authority: NWA
required-if:
  application-type:
    in:
    - pa-ecomms-network
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: Town and Country Planning (General Permitted Development) Order; Code of Best Practice on Mobile
  Phone Network Development
source-text: 'In the case of Telecommunications Development then:'
must-include:
- item: Evidence that notice of the development was given to affected landowners
  level: should
- item: 'For a mast within 3 km of an aerodrome: evidence that the Civil Aviation Authority, the Secretary
    of Defence or the aerodrome operator was notified'
  level: should
  required-if:
    condition:
      field: near-aerodrome
      value: true
      description: A mast within three kilometres of the perimeter of an aerodrome.
- item: The area of search, alternative sites rejected with justification (or why none were considered)
  level: should
- item: A map showing the site's relationship to existing schools and other educational establishments
  level: should
- item: An ICNIRP certificate
  level: should
- item: A technical justification for the site in relation to the existing network
  level: should
- item: The reasons for the choice of design
  level: should
confidence: medium
notes: From the council's list (adopted July 2014), page 15-16. The list says that for prior notifications
  'it is recommended that the following detail is submitted with the original application', so the contents
  are 'should'.
review-status: unverified
field-status: {}
