reference: noise-assessment
local-authority: NWA
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise sensitive development.
  - condition:
      field: near-noise-sensitive-use
      value: true
      description: New development adjoining a noise sensitive site.
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV9 and ENV11
source-text: With all applications involving noise sensitive development proposals; new development adjoining
  a noise sensitive site; and where noise disturbance could impact on residential amenity of existing
  and/or future occupants, in order to allow assessment under saved policies ENV9 and ENV11 of the North
  Warwickshire Local Plan 2006.
must-include:
- item: Prepared by a qualified acoustician
  level: must
- item: The existing noise environment and the impacts of and on the new development
  level: must
- item: Mitigation measures that can be incorporated into the development
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 39 (Appendix B, s). 'Where noise disturbance
  could impact on residential amenity' is a judgement, so it is discretionary.
review-status: unverified
field-status: {}
