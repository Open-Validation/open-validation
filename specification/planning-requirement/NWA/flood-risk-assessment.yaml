reference: flood-risk-assessment
local-authority: NWA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zones 2 and 3.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Sites of 1ha or more in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Sites of 1ha or more in Flood Zone 1.
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
confidence: medium
notes: 'From the audit (wrong_trigger, wrong_app_type): the workbook''s excerpt (''may be necessary'')
  lost the thresholds; full and outline applications. Prior approval change of use also asks for flood
  evidence.'
review-status: unverified
field-status: {}
