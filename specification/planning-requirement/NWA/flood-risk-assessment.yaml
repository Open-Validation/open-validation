reference: flood-risk-assessment
local-authority: NWA
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or more in Flood Zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development of 1 hectare or more in Flood Zone 1.
  - all:
    - site:
        in:
        - flood-risk-zone
        description: Flood Zone 2 or 3.
    - discretionary
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policy ENV8; NPPF
source-text: With all applications for development proposals of 1 hectare or more in Flood Zone 1, for
  some development proposals that are located within Flood Zones 2 and 3, or other areas where the Environment
  Agency or other bodies have indicated that there may be drainage problems. … For proposals within an
  area at risk of flooding, a Flood Risk Assessment (FRA) may be necessary. Advice on preparing a FRA
  can be found on the Standing Advice pages of the Environment Agency’s website at www.environment-agency.gov.uk.
  Where an FRA is required, this MUST be submitted.
must-include:
- item: The risks of all forms of flooding to and from the development and how they will be managed, taking
    climate change into account
  level: must
- item: How sustainable drainage methods have been introduced
  level: should
confidence: medium
notes: From the council's list (adopted July 2014), page 4, 7 and 40 (Appendix B, v). The list asks for
  an FRA for 'some' proposals in Flood Zones 2 and 3 and where drainage problems are indicated, so those
  parts are discretionary.
review-status: unverified
field-status: {}
