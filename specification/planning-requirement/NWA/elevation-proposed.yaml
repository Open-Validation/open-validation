reference: elevation-proposed
local-authority: NWA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - lbc
    - condition:
        field: building-works
        value: true
        description: Physical changes are proposed to the site and/or the buildings on it.
  - application-type:
      in:
      - pa-build-agri-forest
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-on-existing-building
        value: true
        description: The proposed advertisements are upon building elevations.
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: operational-development
        value: true
        description: The certificate is for a proposed operation (operational development).
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - condition:
        field: amends-approved-plans
        value: true
        description: The amendments relate to the site layout and/or buildings and structures.
  - all:
    - application-type:
        in:
        - outline
    - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV4, ENV10 to ENV17, ECON9 and TPT6
source-text: 'Proposed: Elevations, Floor Plans, Roof Plans, Site Sections and Finished Floor Levels …
  Where there are physical changes proposed to the application site and/or buildings upon it, … Existing
  and proposed elevations where proposed advertisements are upon building elevations, showing all existing
  and proposed advertisements;'
must-include:
- item: At 1:50 or 1:100 scale, showing the layout and elevations in detail
  level: must
- item: Any alterations to, or proposed, fences and walls, trees and hedgerows, access arrangements and
    parking, drainage arrangements and ground levels
  level: must
- item: All affected sides of the proposal
  level: must
- item: Proposed facing materials, including windows and doors, where possible
  level: should
- item: 'Where the elevation adjoins or is close to another building: the relationship between the buildings
    and the positions of openings on each property'
  level: should
  required-if:
    condition:
      field: adjoins-existing-building
      value: true
      description: The proposed elevation adjoins or is close to another building.
- item: 'For householder applications: the 45-degree line from windows on adjoining property'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'For listed buildings: clearly distinguish existing and new works and identify any structural
    alterations; show new rainwater goods, ventilation and extraction, meter boxes, ducting, security
    alarms and lighting, and how sound and thermal insulation and damp proofing will be installed'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Plans to show Proposed Elevations and Floor Plans MUST clearly distinguish between existing
    and new works, and identify quite clearly any structural alterations or changes. In addition these
    plans need to show details such as new rainwater goods, new ventilation and extraction details, positions
    of new meter boxes, any new ducting, security alarms and security lighting. Details of how sound and
    thermal installation, including new damp proofing to be installed must also be illustrated.
- item: 'For advertisements: drawings at 1:50 or 1:100 showing lettering and any images, materials and
    colours, extent of projection and the method and colour(s) of any illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Advertisement drawings at a scale of 1:50 or 1:100, showing lettering and any images, materials
    and colours to be used, extent of projection and details of the method and colour(s) of illumination
    (if applicable).
confidence: medium
notes: From the council's list (adopted July 2014), page 29 (Appendix B, a), with pages 9, 12, 15, 18
  and 19.
review-status: unverified
field-status: {}
