reference: landscaping-plan
local-authority: NWA
required-if:
  any:
  - condition:
      field: new-open-space
      value: true
      description: The proposals create areas of public open space.
  - condition:
      field: departure-from-development-plan
      value: true
      description: A departure from the Development Plan.
  - all:
    - site:
        in:
        - green-belt
        description: Inappropriate development in the Green Belt.
    - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV1, ENV2, ENV4 and ENV5
source-text: With all applications where the proposals create areas of public open space, involve inappropriate
  development within the Green Belt, and/or that are departures from the Development Plan in order to
  allow assessment under ENV1, ENV2, ENV4 and ENV5 of the North Warwickshire Local Plan 2006.
must-include:
- item: The landscaping proposals in full (soft and hard), showing how they were arrived at as part of
    the built form
  level: must
- item: How the landscaping will be maintained and managed in future
  level: must
- item: The reasons for the choice of species and the planting specification
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 38 (Appendix B, p). Landscaping Maintenance Statement.
  Whether development is 'inappropriate' in the Green Belt is a judgement, so that part is discretionary.
  Appendix B heads each trigger 'When may it be required?'; the bullets that name a clear case are shown
  as conditions and the policy-based or 'where appropriate' ones as discretionary.
review-status: unverified
field-status: {}
