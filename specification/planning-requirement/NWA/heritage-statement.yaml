reference: heritage-statement
local-authority: NWA
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - site:
      in:
      - conservation-area
      description: The site is within or adjoins a designated conservation area.
  - site:
      in:
      - listed-building
      - listed-building-setting
      description: The proposal affects the setting or curtilage of a listed building or structure.
  - site:
      in:
      - scheduled-monument
      - park-and-garden
      - battlefield
      description: The site includes or is adjacent to a Scheduled Ancient Monument, a recognised historic
        park or garden, or a battle site.
  - all:
    - application-type:
        in:
        - hedgerow-removal
    - discretionary
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV15 and ENV16; NPPF
source-text: If the application site is located within or adjoining a designated Conservation Area, then
  the Council will require a Conservation Area Statement. … A Listed Building Statement will be required
  with each application in addition to the above plans and drawings. … With all applications that adjoin
  or include land within a Designated Conservation Area, or where the character and appearance of a Conservation
  Area might be affected by a new development, in order to meet the requirements of saved policy ENV15
  of the North Warwickshire Local Plan 2006. … With all development proposals affecting the setting or
  curtilage of a Listed Building or Structure, in order to meet the requirements of saved policy ENV16
  of the North Warwickshire Local Plan 2006 and the NPPF. … With all applications that are adjacent to,
  or include a Scheduled Ancient Monument Site, a recognised Historic Park, Garden or Battle Site; and
  with some applications that affect the curtilage or the setting of a Listed Building (see Section 6)
  in order to allow it to be assessed against saved policies ENV15 and/or ENV16 of the North Warwickshire
  Local Plan 2006, and the NPPF. … With all proposals to demolish a building or protected structure within
  a Conservation Area in order to allow assessment under saved policy ENV15 of the North Warwickshire
  Local Plan 2006, and the NPPF.
must-include:
- item: 'Conservation Area Appraisal: the significance, special character and appearance of the conservation
    area and the site''s contribution to it'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: In or adjoining a conservation area.
- item: 'Conservation Area Appraisal: the impact on the area''s character and appearance, explicitly showing
    how the proposal preserves or enhances it, how alternatives were dismissed, and any adverse impacts
    and their mitigation'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: In or adjoining a conservation area.
- item: 'Listed Building Statement: the existing historic and architectural features, cross-referenced
    to the plans and drawings'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed Building Statement: the impact on those features, the layout, external elevations and
    internal detail, cross-referenced to the Schedule of Works, with alternative less intrusive options
    evaluated'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Listed Building Statement: the impact on the setting of the listed building and the significance
    of the heritage asset(s), individually and cumulatively'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Heritage Statement for a recognised historic site: an assessment of the scope and scale of the
    impacts, including mitigation and recording measures'
  level: must
  required-if:
    site:
      in:
      - scheduled-monument
      - park-and-garden
      - battlefield
      description: Affects a recognised historic site.
- item: 'Demolition Statement: a visual and written architectural and historic record of the building(s),
    their contribution to the conservation area, an assessment of the loss and whether any replacement
    is of greater heritage value'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - demolition-con-area
    - all:
      - site:
          in:
          - conservation-area
          description: In a conservation area.
      - condition:
          field: demolition
          value: true
          description: Demolition of a building or protected structure.
  source-text: A visual and written architectural and historic record of the building(s) concerned.
confidence: medium
notes: From the council's list (adopted July 2014), page 3, 9, 11-12, 30-33. Combines the list's Conservation
  Area Statement/Appraisal (c), Listed Building Statement (d), Heritage Statement (f) and Demolition Statement
  (g). Advertisements within or adjacent to a conservation area need 'a brief Conservation Area Statement'
  (page 12). Heritage statements for 'some applications that affect the curtilage or the setting of a
  Listed Building' and hedgerow removal ('potentially a report on the historical significance of that
  hedgerow') are discretionary. Appendix B heads each trigger 'When may it be required?'; the bullets
  that name a clear case are shown as conditions and the policy-based or 'where appropriate' ones as discretionary.
review-status: unverified
field-status: {}
