reference: schedule-of-works
local-authority: NWA
required-if:
  application-type:
    in:
    - lbc
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policy ENV16
source-text: A Detailed Schedule of Work or Repairs. Works that involve timber framed buildings and/or
  involve structural alterations need to be cross-referenced to the structural survey as outlined above.
must-include:
- item: How, where and why the work is to be undertaken (e.g. treatment of rot, joinery, brick or stone
    repairs, new brickwork bonding and mortar mixes, damp proof course, underpinning)
  level: must
- item: All full or partial demolition, with how propping and shoring is to be installed
  level: must
- item: Cross-referenced to the Structural Survey where the works involve timber framed buildings or structural
    alterations
  level: must
  required-if:
    condition:
      field: structural-alteration
      value: true
      description: Timber framed building or structural alterations.
confidence: medium
notes: From the council's list (adopted July 2014), page 10 and 31 (Appendix B, e).
