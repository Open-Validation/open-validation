reference: sustainability-statement
local-authority: NWA
required-if:
  any:
  - condition:
      field: departure-from-development-plan
      value: true
      description: A departure from the Development Plan.
  - condition:
      field: eia-development
      value: true
      description: An Environmental Statement is required.
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policy ECON2
source-text: With all applications that are departures from the Development Plan; … With all applications
  where an Environmental Statement is required (see (bb)); … With all applications involving saved policy
  ECON2 of the North Warwickshire Local Plan
must-include:
- item: The environmental, social and economic implications of the proposal, both benefits and disbenefits
  level: must
- item: Sequential testing, including alternative quantums of development at the site and alternative
    locations
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 42 (Appendix B, z). Whether policy ECON2 applies
  is a judgement, so that part is discretionary. Appendix B heads each trigger 'When may it be required?';
  the bullets that name a clear case are shown as conditions and the policy-based or 'where appropriate'
  ones as discretionary.
review-status: unverified
field-status: {}
