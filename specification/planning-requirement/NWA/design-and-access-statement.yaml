reference: design-and-access-statement
local-authority: NWA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: Any part of the development is in a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Provision of one or more dwellinghouses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings creating 100 square metres or more of floor space.
  - application-type:
      in:
      - demolition-con-area
  - all:
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: Town and Country Planning (Development Management Procedure) (England) (Amendment) Order 2013
  (SI 2013/1238)
source-text: Development which is defined as major development*. … Where any part of the development is
  in a designated area**, development consisting of— (i) the provision of one or more dwellinghouses;
  or (ii) the provision of a building or buildings where the floor space created by the development is
  100 square metres or more.
must-include:
- item: Covers design, access, layout, use and landscaping
  level: must
  source-text: 'Design and Access Statements must cover the following points:'
confidence: medium
notes: From the council's list (adopted July 2014), page 28 and 43-44 (Appendix B, C and Appendix C).
  The list (section 7) still names a Design and Access Statement for conservation area consent for demolition,
  a consent replaced by planning permission in 2013. For listed building consent it says 'A Design and
  Access Statement where required' and the matrix marks it 'see page', so it is shown as discretionary;
  Appendix C asks for a Listed Building Statement for all listed building applications (see heritage-statement).
review-status: unverified
field-status: {}
