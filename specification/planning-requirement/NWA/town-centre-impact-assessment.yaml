reference: town-centre-impact-assessment
local-authority: NWA
required-if:
  all:
  - condition:
      field: retail-floorspace
      operator: '>'
      value: 0
      description: A retail planning application.
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ECON5 and ECON12; NPPF
source-text: With all retail planning applications that trigger an assessment under the NPPF; … With all
  retail planning applications that are affected by saved policies ECON5 and ECON12 of the North Warwickshire
  Local Plan 2006.
must-include:
- item: The need for the development, whether it is of an appropriate scale and location, and any adverse
    impacts on existing service centres
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 35 (Appendix B, k). Retail Assessment. The list
  gives no floorspace threshold, so retail applications are shown as discretionary. Appendix B heads each
  trigger 'When may it be required?'; the bullets that name a clear case are shown as conditions and the
  policy-based or 'where appropriate' ones as discretionary.
