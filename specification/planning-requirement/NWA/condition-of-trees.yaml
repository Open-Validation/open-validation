reference: condition-of-trees
local-authority: NWA
required-if:
  all:
  - application-type:
      in:
      - consent-under-tpo
  - condition:
      field: tree-condition-reasons
      value: true
      description: The reasons for the works relate to the health and/or safety of the tree(s).
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policy ENV4
source-text: 'Evidence in support of the above Statement of Reasons. In particular you should provide:
  a report by a tree professional if your reasons relate to the health and/or safety of the tree(s),'
must-include:
- item: A report by a tree professional, completed and signed by a qualified professional
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 13. The Appendix A matrix (page 25) marks it
  'Required' for works to TPO trees.
review-status: unverified
field-status: {}
