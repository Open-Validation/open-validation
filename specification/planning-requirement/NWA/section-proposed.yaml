reference: section-proposed
local-authority: NWA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - condition:
      field: roof-space-room
      value: true
      description: The proposal includes the use of roof space.
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
    - condition:
        field: building-works
        value: true
        description: Physical changes are proposed to the site and/or the buildings on it.
    - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV4, ENV10 to ENV17, ECON9 and TPT6
source-text: Existing and Proposed Site Sections and Finished Floor and Site Levels; … Where proposals
  include the use of roof space, cross sections clearly indicating the position of any openings and finished
  floor heights MUST be included.
must-include:
- item: At 1:50 or 1:100 scale, showing the layout and elevations in detail
  level: must
- item: Finished floor levels
  level: must
- item: 'Where roof space is used: cross sections showing the position of any openings and finished floor
    heights'
  level: must
  required-if:
    condition:
      field: roof-space-room
      value: true
      description: The proposal includes the use of roof space.
confidence: medium
notes: From the council's list (adopted July 2014), page 9 and 29. Appendix B (a) lists roof plans and
  site sections with the other plans, but the Appendix A matrix has no column for them, so outside listed
  building applications they are shown as discretionary.
review-status: unverified
field-status: {}
