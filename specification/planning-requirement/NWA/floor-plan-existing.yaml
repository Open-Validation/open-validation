reference: floor-plan-existing
local-authority: NWA
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - reserved-matters
        - lbc
    - condition:
        field: building-works
        value: true
        description: Physical changes are proposed to the site and/or the buildings on it.
  - application-type:
      in:
      - demolition-con-area
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: operational-development
        value: true
        description: The certificate is for a proposed operation (operational development).
  - all:
    - application-type:
        in:
        - s73
        - non-material-amendment
    - condition:
        field: amends-approved-plans
        value: true
        description: The amendments relate to the site layout and/or buildings and structures.
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV4, ENV10 to ENV17, ECON9 and TPT6
source-text: 'Existing: Elevations, Floor Plans, Roof Plans, Site Sections and Ground Levels … Where there
  are physical changes proposed to the application site and/or buildings upon it,'
must-include:
- item: At 1:50 or 1:100 scale, including all existing buildings, extensions and areas of hardstanding
  level: must
- item: Existing fences, trees and hedgerows on or adjacent to the site, and existing drainage infrastructure
  level: must
- item: 'For listed buildings: the existing layout of each floor, all external elevations and the roof
    plan, with internal features identified and described or illustrated (e.g. original plaster work,
    staircases, fireplaces, cornices, architraves)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Plans showing Existing Elevations and Floor Plans MUST show the existing layout of each
    floor, all external elevations and the roof plan. Internal features should be identified and described
    or illustrated (e.g. original plaster work, staircases, fireplaces, cornices, architraves, etc);
confidence: medium
notes: From the council's list (adopted July 2014), page 29 (Appendix B, a), with pages 9, 11, 18 and
  19. The Appendix A matrix (page 25) marks it existing floor plans ('existing where relevant') 'Required'
  for householder, full, reserved matters and listed building applications, and as survey drawings of
  the buildings to be demolished for conservation area demolition.
review-status: unverified
field-status: {}
