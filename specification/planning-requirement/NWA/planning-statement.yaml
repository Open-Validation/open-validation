reference: planning-statement
local-authority: NWA
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - green-belt
        description: The site is in the Green Belt.
    - discretionary
  - application-type:
      in:
      - s73
      - pa-ecomms-network
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policies ENV5, ENV7, ENV17, HSG3, ECON3, ECON7, ECON8,
  ECON9, ECON10, ECON12, COM2 and COM3
source-text: With all “major” applications. … With all applications that are for “inappropriate” development
  in the Green Belt, setting out the applicant’s “very special circumstances“ of his case. … With all
  applications that will be assessed against the following saved policies ENV5, ENV7, ENV17, HSG3, ECON3,
  ECON7, ECON8, ECON9, ECON10, ECON12, COM2 and COM3 of the North Warwickshire Local Plan 2006. … With
  all applications which concern the loss of existing tourist accommodation. … Applications to vary or
  to remove a condition (including, where relevant, applications to seek material minor-amendments) MUST
  provide a full and reasoned justification for the applicant’s case.
must-include:
- item: How the proposal accords with national and development plan policies, supplementary planning documents
    and development briefs
  level: must
- item: Details of any consultation with statutory consultees before submission
  level: should
- item: 'For inappropriate development in the Green Belt: the applicant''s ''very special circumstances'''
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: Inappropriate development in the Green Belt.
- item: 'For s73 applications: a full and reasoned justification for the applicant''s case'
  level: must
  required-if:
    application-type:
      in:
      - s73
confidence: medium
notes: From the council's list (adopted July 2014), page 15-16, 19 and 30 (Appendix B, b). Whether development
  is 'inappropriate' in the Green Belt, which policies apply and the loss of tourist accommodation are
  judgements, so they are discretionary. For telecommunications prior notifications the list recommends
  'A planning statement' (page 16). Appendix B heads each trigger 'When may it be required?'; the bullets
  that name a clear case are shown as conditions and the policy-based or 'where appropriate' ones as discretionary.
review-status: unverified
field-status: {}
