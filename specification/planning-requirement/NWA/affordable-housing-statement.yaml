reference: affordable-housing-statement
local-authority: NWA
required-if: discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 Core Policy 8 and saved policies HSG1, HSG2 and HSG5; Affordable
  Housing SPD 2008
source-text: With all planning applications where locally affordable housing is required under Core Policy
  8 (Saved), saved policies HSG1, HSG2 and HSG5 of the North Warwickshire Local Plan 2006, and the Affordable
  Housing SPD 2008.
must-include:
- item: Number of units, tenure mix, size and specification, and location within the development
  level: must
- item: How the units are to be 'locally affordable', how affordability continues in perpetuity and how
    local people will benefit
  level: must
- item: How need has been assessed, how numbers have been arrived at and how the units will be managed
  level: must
- item: Details of any Registered Social Landlord acting as partner
  level: should
- item: 'If the policy provision is not proposed: the precise reasons, supported by factual evidence'
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Less affordable housing than policy requires.
confidence: medium
notes: From the council's list (adopted July 2014), page 37 (Appendix B, m). The list ties the requirement
  to Core Policy 8 and the Affordable Housing SPD without stating the threshold, so it is shown as discretionary.
review-status: unverified
field-status: {}
