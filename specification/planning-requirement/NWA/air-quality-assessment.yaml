reference: air-quality-assessment
local-authority: NWA
required-if:
  any:
  - site:
      in:
      - air-quality-management-area
      description: Development inside, or adjacent to, an Air Quality Management Area.
  - discretionary
source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
policy: North Warwickshire Local Plan 2006 saved policy ENV9
source-text: With all applications where development is proposed inside, or adjacent to an Air Quality
  Management Area (AQMA) as defined on the Local Plan Proposals Map; … With all applications that could
  in themselves result in the designation of an AQMA; … With all applications where the grant of a planning
  permission might render the Council’s Air Quality Action Plan unworkable; … With any application that
  would have the scope for affecting air quality in the immediate or adjoining area, in accordance with
  saved policy ENV9 of the North Warwickshire Local Plan 2006.
must-include:
- item: Existing conditions and the predicted impacts of the development on air quality
  level: must
confidence: medium
notes: From the council's list (adopted July 2014), page 39 (Appendix B, t). Applications that could cause
  an AQMA designation, undermine the Air Quality Action Plan or affect air quality are judgements, so
  they are discretionary.
review-status: unverified
field-status: {}
