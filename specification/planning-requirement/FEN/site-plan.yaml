source-url: https://fenland.gov.uk/media/19602/PF09-Planning-permission-and-advert-consent/pdf/PF09_Validation_requirements.pdf?m=638321982418970000
source-text: 'Householder, Listed building consent: o Existing Site plan (e.g. at a scale of 1:100 or
  1:200) o Proposed Site plan (e.g. at a scale of 1:100 or 1:200 showing the access, proposal, all site
  boundaries and position of all surrounding buildings o Existing and proposed elevations in full (e.g.
  at a scale of 1:50 or 1:100) o Existing and proposed floor plans in full (e.g. at a scale of 1:50 or
  1:100) o Proposed roof plans for all applications involving extensions and/or changes to roof forms
  (e.g. at a scale of 1:50 or 1:100) Please not


  Outline: o Existing Site plan (e.g. at a scale of 1:100 or 1:200) o Proposed Site plan (e.g. at a scale
  of 1:100 or 1:200 showing the indicative access, all site boundaries and position of all surrounding
  buildings Fenland District Council, Fenland Hall, County Road, March, PE15 8NQ Development Services
  • .


  Advertisement consent: o Existing Site plan (e.g. at a scale of 1:100 or 1:200) o Proposed Site plan
  (e.g. at a scale of 1:100 or 1:200 showing the access, proposal, all site boundaries and position of
  all surrounding buildings o Proposed site plan (Adverts) at a scale of 1:200 or 1:500 which identifies
  the proposed position of the advertisement/s on the land or building in question.


  Demolition in cons area: o Existing Site plan (e.g. at a scale of 1:100 or 1:200) o Proposed Site plan
  (e.g. at a scale of 1:100 or 1:200) showing the access, proposal, all site boundaries and position of
  all surrounding buildings o Existing and proposed elevations in full (e.g. at a scale of 1:50 or 1:100)
  o Existing and proposed floor plans in full (e.g. at a scale of 1:50 or 1:100) o Proposed roof plans
  for all applications involving extensions and/or changes to roof forms (e.g. at a scale of 1:50 or 1:100)
  Please no'
must-include:
- item: Existing and proposed site plans (e.g. at a scale of 1:100 or 1:200)
  level: must
- item: The access, the proposal, all site boundaries and the position of all surrounding buildings
  level: must
