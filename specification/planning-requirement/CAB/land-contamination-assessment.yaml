reference: land-contamination-assessment
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - contaminated-land
        description: On or adjacent to land where contamination is known or suspected.
    - condition:
        field: agricultural-land
        value: true
        description: All agricultural land.
    - condition:
        field: industrial-site
        value: true
        description: Land previously used for industrial purposes.
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed end use or users are sensitive and vulnerable to land contamination.
    - site:
        in:
        - near-landfill-site
        description: Within 250 metres of a currently licensed or historic landfill site.
    - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policy 33
source-text: Where development is on or adjacent to land where contamination is known or suspected to
  exist. All agricultural land and land previously used for industrial purposes. The proposed end use
  or users are sensitive and vulnerable to land contamination. The development is within 250 metres of
  a currently licensed or historic landfill site. The development could affect or cause the movement of
  contaminants within the ground.
must-include:
- item: Undertaken by a competent person
  level: must
- item: 'Preliminary risk assessment (Phase I): historical and current land uses, environmental setting,
    potential contaminants, initial risk assessment, Conceptual Site Model and proposals for intrusive
    investigation if necessary (the minimum to validate an application)'
  level: must
- item: Phase II investigation of ground conditions, if recommended following the Phase I
  level: must
- item: Updated risk assessment and Conceptual Site Model after Phase II, and a remediation or mitigation
    strategy if contamination is found above assessment criteria
  level: must
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Land contamination assessment'. The same section appears in the 'Outline planning permission'
  checklists. The discretionary part is 'The development could affect or cause the movement of contaminants
  within the ground.'
review-status: unverified
field-status: {}
