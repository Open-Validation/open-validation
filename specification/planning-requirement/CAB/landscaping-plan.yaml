reference: landscaping-plan
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policy 59
source-text: Major development and other development where landscape proposals will be necessary because
  the new development is likely to have an impact on the local or wider landscape. Development likely
  to have an impact as a result of its proposed location or height.
must-include:
- item: As a minimum, a landscape strategy or indicative planting scheme
  level: must
  required-if:
    ref: major-development
- item: Management and maintenance plans, showing hard paving to be adopted by Cambridgeshire County Council
    and SuDS and landscape features to be adopted by the city council
  level: must
- item: 'For large scale and complex sites: a masterplan and design code setting the overall site landscape
    vision and strategy'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published 11 February 2026), ''Full planning permission'' checklist
  web page, section ''Landscape details''. The same section appears in the ''Outline planning permission''
  checklists. Discretionary part: ''other development where landscape proposals will be necessary''. The
  list notes that ''Landscape management and maintenance plans can be conditioned.'''
review-status: unverified
field-status: {}
