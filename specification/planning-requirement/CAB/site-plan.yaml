reference: site-plan
local-authority: CAB
required-if:
  application-type:
    in:
    - full
    - hh
    - lbc
    - advertising
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
source-text: Always required.
must-include:
- item: Proposed site layout at a recognised scale (1:100, 1:200 or 1:500 as appropriate), with the direction
    of north and a scale bar or metric measurements
  level: must
- item: Buildings, roads and footpaths on land adjoining the site, including access arrangements
  level: should
- item: Public rights of way crossing or adjoining the site
  level: should
- item: Position of all trees on the site and on adjacent land
  level: should
- item: Extent and type of any hard surfacing; boundary treatment including walls or fencing
  level: should
- item: Existing car parking and turning arrangements; any existing bin and cycle stores
  level: should
- item: Existing site layout plan (same scale and content as the proposed site plan)
  level: must
  required-if:
    all:
    - application-type:
        in:
        - full
        - hh
        - lbc
    - discretionary
    - any:
      - condition:
          field: demolition
          value: true
          description: The development involves demolition of existing structures.
      - condition:
          field: trees-on-or-near-site
          value: true
          description: There are trees on site that may be impacted.
  source-text: 'May be required where: where the proposed development involves the demolition of any exiting
    structures where there are trees on site that may be impacted by the proposed development.'
- item: 'For advertisements: site plan at 1:200 or 1:500 with a scale bar, showing the proposed position
    of the advertisement in red and the direction of north'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Site plan (at a scale of 1:200 or 1:500 and with a scale bar) identifying the proposed
    position of the advertisement in red and showing the direction of north.
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Proposed site plan'. The same section appears in the 'Planning permission to alter a
  house', 'Listed building consent' checklists. The 'should' items are what the list asks for 'unless
  these would not influence or be affected by the proposed development'. The existing site plan 'May be
  required', so it shows as discretionary. The outline checklist instead asks for 'Plans, drawings and
  information' that 'will depend on which matters are reserved but may include' parameter plans and a
  proposed layout plan (sent to unmapped).
review-status: unverified
field-status: {}
