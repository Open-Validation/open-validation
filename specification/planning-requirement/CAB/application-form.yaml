reference: application-form
local-authority: CAB
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
    - lbc
    - s73
    - non-material-amendment
    - approval-condition
    - ldc
    - advertising
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
source-text: Always required. A completed form is always required (one copy of all application documents
  must be supplied if submitted by post).
must-include:
- item: Every section completed; where sections or questions are not relevant, this is stated on the form
  level: must
- item: The relevant ownership certificate (A, B, C or D) completed, signed and dated; only one certificate
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - s73
      - ldc
  source-text: The relevant certificate must be completed, signed and dated (part of application form).
    Only one certificate should be completed.
- item: A copy of the notice served on owners (or published, for unknown owners) sent with the application
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Ownership certificate B, C or D is completed.
  source-text: A copy of the notice must be sent with the application to the local authority.
confidence: medium
notes: 'From the council''s list (published 11 February 2026), ''Full planning permission'' checklist
  web page, section ''Application form''. The same section appears in the ''Outline planning permission'',
  ''Reserved matters approval'', ''Planning permission to alter a house'', ''Listed building consent'',
  ''Removal or variation of a planning condition'', ''Non-material amendment to planning permission'',
  ''Discharge of planning conditions'', ''Existing lawful development certificate'', ''Proposed lawful
  development certificate'', ''Consent to display an advertisement'' checklists. Ownership certificates
  are listed separately as ''Always required (part of application form)'' for full, outline, householder,
  listed building, section 73 and both lawful development certificate checklists. For discharge of conditions
  you can use the form or ''provide a full written description of the details required to discharge the
  condition(s)''. Prior approvals: the council refers only to the national requirements in the GPDO, so
  no local items are set for them.'
