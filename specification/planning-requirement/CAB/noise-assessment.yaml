reference: noise-assessment
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
  - any:
    - all:
      - condition:
          field: noise-generating-use
          value: true
          description: The development would generate noise or vibration (including deliveries, servicing
            and traffic).
      - discretionary
    - all:
      - condition:
          field: plant-equipment
          value: true
          description: Installation of building services plant or equipment (flues, air conditioning,
            extraction, air source heat pumps, combustion appliances).
      - discretionary
    - all:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Residential or other noise-sensitive development close to existing noise sources
            (agent of change).
      - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policy 35
source-text: Noise and vibration generation Where a proposed new development would generate noise or vibration
  including delivery and servicing and vehicle movements or traffic changes on local roads which may have
  an adverse impact on existing or planned uses (in particular noise sensitive uses such as residential,
  hospitals, nursing homes and schools). Applications which involve the installation of mechanical and
  electrical building services plant or equipment such as flues, air handling units / air conditioning,
  extraction, air source heat pumps and combustion appliances. New noise-sensitive premises Proposals
  for residential and other noise sensitive development close to existing sources of noise such as transport
  (road, rail and air) and industrial, commercial or business premises. Where the operation of an existing
  or established business or community facility generating noise could have an unacceptable significant
  adverse effect on proposed new development (including changes of use) in its vicinity such as the introduction
  of new noise sensitive premises into an area e.g. residential ('agent of change principle').
must-include:
- item: Undertaken by a suitably qualified and competent acoustician, following current guidance and British
    Standards
  level: must
- item: The existing noise environment and the noise sources or activities associated with, or affecting,
    the development
  level: must
- item: The number of deliveries and the times of deliveries and servicing
  level: must
confidence: medium
notes: 'From the council''s list (published 11 February 2026), ''Full planning permission'' checklist
  web page, section ''Noise and vibration assessment''. The same section appears in the ''Outline planning
  permission'', ''Planning permission to alter a house'' checklists. Each trigger is discretionary: the
  list says ''Where necessary an acoustic ... assessment will be undertaken'', and its guidance note says
  ''Not normally required but may be for heat pumps and similar.'''
review-status: unverified
field-status: {}
