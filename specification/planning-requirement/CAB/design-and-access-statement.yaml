reference: design-and-access-statement
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - lbc
  - any:
    - ref: major-development
    - all:
      - site:
          in:
          - world-heritage-site
          - conservation-area
          description: In a World Heritage Site or conservation area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: Building or buildings with floor space of 100 sq m or more.
    - application-type:
        in:
        - lbc
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
source-text: Major development (defined as development of 10 or more dwellings (or 0.5 hectares for residential
  development where the number of dwellings is unknown) for the creation of more than a 1,000 sq m of
  floor space and where the site is greater than 1 hectare). Development in a designated area (World Heritage
  Site or conservation area) where the proposed development consists of either one or more dwellings or
  a building or buildings with floor space of 100 sq m or more. Applications for listed building consent.
must-include:
- item: The design principles and concepts applied, and how the design takes the appraised context into
    account
  level: must
- item: The policy adopted as to access, how development plan access policies were taken into account,
    any consultation on access and how specific access issues have been addressed
  level: must
- item: How the special architectural or historic importance of the building, its particular physical
    features and its setting have been taken into account
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: 'Statements accompanying applications for Listed Building Consent should, in addition to
    the above, show how they have taken account of: The special architectural or historic importance of
    the building The particular physical features of the building that justify its designation as a listed
    building The building''s setting'
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Design and access statement'. The same section appears in the 'Outline planning permission',
  'Planning permission to alter a house', 'Listed building consent' checklists.
review-status: unverified
field-status: {}
