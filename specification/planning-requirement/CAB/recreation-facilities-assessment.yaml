reference: recreation-facilities-assessment
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development (conversions or new build) which will need to make provision
          for new open space.
    - condition:
        field: loss-of-open-space
        value: true
        description: Proposals adversely affecting or leading to the loss of existing open space.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policies 67, 68 and Appendix I
source-text: Proposals for new residential development (conversions or new build) which will need to make
  provision for new open space. Proposals adversely affecting or leading to the loss of existing open
  space.
must-include:
- item: How the proposal meets Policy 68 by providing open space and recreation facilities on site
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development.
- item: How the proposal meets Policy 67, having regard to the Open Space and Recreation Strategy, Playing
    Pitch Strategy and Indoor Sports Facility Strategy
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: Existing open space is affected or lost.
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Open space assessment'. The same section appears in the 'Outline planning permission',
  'Removal or variation of a planning condition' checklists.
review-status: unverified
field-status: {}
