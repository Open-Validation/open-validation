reference: telecommunications-report
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: telecommunications-development
      value: true
      description: Telecommunications proposals.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policy 84
source-text: For all telecommunications proposals.
must-include:
- item: Area of search, details of any consultation, details of the proposed structure and technical justification
  level: must
- item: A signed declaration that the equipment and installation comply with the ICNIRP radio frequency
    public exposure guidelines
  level: must
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Supplementary telecommunications information'. The same section appears in the 'Outline
  planning permission' checklists.
review-status: unverified
field-status: {}
