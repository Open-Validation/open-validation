reference: construction-management-plan
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - ref: major-development
    - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policies 28 and 35
source-text: All major developments or developments that are likely to result in noise, smells, dust,
  visual or other adverse effects during the course of demolition and or construction. Where a construction
  management plan is not submitted with the application, it is likely that specific details and mitigation
  measures will be required by planning condition.
must-include:
- item: Management of materials and wastes on site, including re-use and recycling
  level: must
- item: Siting and layout of construction compounds and contractor parking
  level: must
- item: Impact assessment and mitigation for noise, vibration, odour, dust, visual or other impacts, and
    environmental monitoring during construction and demolition
  level: must
- item: Temporary haul roads and accesses, management of vehicle movements and wheel washing
  level: must
- item: Working and delivery hours, methods of demolition and piling works
  level: must
- item: Protection measures for sensitive features such as water courses or neighbouring residences
  level: must
- item: Details and location of site lighting; external safety and information signage
  level: must
- item: Complaints procedures, including contact details and response procedures
  level: must
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Demolition and construction management plan'. The outline checklist has the same trigger
  under 'Construction management plan'. The discretionary part is 'developments that are likely to result
  in noise, smells, dust, visual or other adverse effects'.
review-status: unverified
field-status: {}
