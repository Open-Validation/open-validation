reference: affordable-housing-statement
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 dwellings or more.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: Site area of 0.5 hectares or more.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policy 45
source-text: 'All major developments of 10 dwellings or more, or if the site area is 0.5 hectares or more.
  Thresholds: 10-14 units: 25% affordable housing 15 or more units: 40% affordable housing'
must-include:
- item: 'Compliance with Policy 45 (10-14 units: 25% affordable; 15 or more units: 40%)'
  level: must
- item: The number of residential units
  level: must
- item: A balanced mix of dwelling sizes (bedrooms), types and tenures of the affordable homes, taking
    account of local housing needs evidence
  level: must
- item: The location of the affordable units
  level: must
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Affordable housing statement'. The same section appears in the 'Outline planning permission'
  checklists.
review-status: unverified
field-status: {}
