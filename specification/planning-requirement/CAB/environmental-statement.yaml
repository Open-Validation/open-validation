reference: environmental-statement
local-authority: CAB
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - s73
    - condition:
        field: eia-development
        value: true
        description: The development is EIA development (Schedule 1, or Schedule 2 with likely significant
          effects).
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: 'The Town and Country Planning (Environmental Impact Assessment) Regulations (2017) apply
  to two separate types of development: Schedule 1 development, for which EIA is required in every case
  Schedule 2 development, for which EIA is required only if the development in question is judged to give
  rise to significant environmental effects.'
must-include:
- item: Assessment of the likely significant environmental effects of the development
  level: must
- item: The information set out in Schedule 4 of the Regulations, with scope agreed by the council in
    a formal scoping opinion
  level: should
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Environmental impact assessment'. The same section appears in the 'Outline planning permission',
  'Removal or variation of a planning condition', 'Reserved matters approval' checklists. For reserved
  matters it is needed 'If the original EIA or part of it is out of date', so that part shows as discretionary.
review-status: unverified
field-status: {}
