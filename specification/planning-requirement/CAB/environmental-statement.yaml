source-text: 'Environmental impact assessment When required The Town and Country Planning (Environmental
  Impact Assessment) Regulations (2017) apply to two separate types of development: Schedule 1 development,
  for which EIA is required in every case Schedule 2 development, for which EIA is required only if the
  development in question is judged to give rise to significant environmental effects.'
