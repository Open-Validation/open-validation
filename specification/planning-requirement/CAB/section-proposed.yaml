reference: section-proposed
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
  - discretionary
  - any:
    - condition:
        field: change-in-ground-levels
        value: true
        description: The site, or the site and surrounding land, are at variable levels.
    - condition:
        field: roof-alteration
        value: true
        description: The proposal involves a roof extension or rooflights.
    - condition:
        field: external-alterations
        value: true
        description: The proposal involves installing windows.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
source-text: 'May be required where: a site or site and surrounding land are at variable levels the proposal
  involves a roof extension or installation of rooflights or windows'
must-include:
- item: How the proposals relate to existing ground levels, or where ground levels would be modified
  level: must
- item: Drawn to an identified scale or showing metric measurements
  level: must
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Proposed cross-section and site levels'. The same section appears in the 'Planning permission
  to alter a house' checklists. Shown as discretionary because the list says it 'May be required'.
review-status: unverified
field-status: {}
