reference: location-plan
local-authority: CAB
required-if:
  application-type:
    in:
    - full
    - outline
    - reserved-matters
    - hh
    - lbc
    - ldc
    - advertising
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
source-text: Always required.
must-include:
- item: Up-to-date Ordnance Survey-based plan at an appropriate scale, usually 1:1250 or 1:2500 (other
    scales may suit large sites)
  level: must
- item: At least two named roads and all surrounding buildings or land (unless this would need a plan
    greater than 1:2500)
  level: must
- item: The application site (the whole planning unit)
  level: must
- item: A north point and the scale clearly identified
  level: must
- item: OS Crown copyright and the correct licence number shown; not copied from existing OS mapping
  level: must
- item: Application site edged clearly in red, including all land needed to carry out the development
    (access from a public highway, visibility splays, landscape, car parking, open areas)
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: must
- item: 'For advertisements: the proposed position of the advertisement, the direction of north and a
    scale bar'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: 'A plan which identifies the land to which the application relates. This should be: drawn
    to an identified scale identify the proposed position of the advertisement show the direction of north
    include a scale bar'
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Location plan'. The same section appears in the 'Outline planning permission', 'Reserved
  matters approval', 'Planning permission to alter a house', 'Listed building consent', 'Existing lawful
  development certificate', 'Proposed lawful development certificate', 'Consent to display an advertisement'
  checklists. The council's 'Validation guide for agents and developers' (reviewed 10 February 2026) repeats
  these points (metric scale of 1:1250 or 1:2500, north arrow, named roads, red and blue lines).
review-status: unverified
field-status: {}
