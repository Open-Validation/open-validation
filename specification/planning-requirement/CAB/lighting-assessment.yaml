reference: lighting-assessment
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - ref: major-development
      - discretionary
    - all:
      - condition:
          field: external-lighting
          value: true
          description: New external artificial lighting or changes to existing lighting (including illuminated
            adverts and outdoor sports facilities).
      - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policy 34
source-text: Major sites at the edge of Cambridge and adjoining open countryside in South Cambridgeshire.
  Where other proposals for new external artificial lighting or changes to existing lighting may have
  an adverse impact on local residential amenity, wildlife or landscape character through light pollution,
  illuminated adverts, and outdoor sports facilities (including multi-use games areas) where external
  lighting is proposed. In some circumstances an assessment may be required if internal building lighting
  would significantly illuminate exterior areas.
must-include:
- item: Details of external lighting, including building, security, floodlighting, street or courtyard
    columns and bollards
  level: must
- item: 'For major sites: an artificial lighting assessment of the impact on sensitive residential premises
    on and off site'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (published 11 February 2026), ''Full planning permission'' checklist
  web page, section ''Artificial lighting assessment''. The same section appears in the ''Outline planning
  permission'' checklists. Discretionary: major sites ''at the edge of Cambridge and adjoining open countryside'',
  and other lighting that ''may have an adverse impact''.'
review-status: unverified
field-status: {}
