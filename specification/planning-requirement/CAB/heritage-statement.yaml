reference: heritage-statement
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
      - lbc
      - s73
      - reserved-matters
  - any:
    - site:
        in:
        - world-heritage-site
        - scheduled-monument
        - listed-building
        - park-and-garden
        - conservation-area
        description: Development affecting a designated heritage asset.
    - application-type:
        in:
        - lbc
    - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policies 61, 62, 63 and Appendix G
source-text: 'Development affecting a heritage asset. Heritage assets are buildings, monuments, sites,
  places, areas or landscapes which are significant because of their historic interest. Designated heritage
  assets include: World Heritage Site Scheduled Monument Listed Building Registered Park and Garden Conservation
  Area For new development, consideration should be given to the potential of archaeological assets.'
must-include:
- item: Identifies the heritage assets and shows how the proposals preserve or enhance their significance
  level: must
- item: 'For works to a heritage asset to address climate change: the information set out in Policy 63
    and its supporting text'
  level: should
  source-text: Applications for works to a heritage asset to address climate change should include the
    information set out in Policy 63 and its supporting text.
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Heritage statement'. The same section appears in the 'Outline planning permission', 'Planning
  permission to alter a house', 'Listed building consent', 'Removal or variation of a planning condition',
  'Reserved matters approval' checklists. Non-designated heritage assets and 'the potential of archaeological
  assets' for new development are covered by the discretionary part.
review-status: unverified
field-status: {}
