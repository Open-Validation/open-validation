must-include:
- item: All sides affected by the proposal, at an appropriate scale, usually 1:100, with a scale bar or
    metric measurements
  level: must
- item: The complete building (partial drawings are not acceptable)
  level: must
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Existing elevations'. The same section appears in the 'Planning permission to alter a
  house', 'Listed building consent', 'Consent to display an advertisement' checklists. For advertisement
  consent, 'Photographs of all existing elevation affected can be submitted instead of elevation drawings.'
