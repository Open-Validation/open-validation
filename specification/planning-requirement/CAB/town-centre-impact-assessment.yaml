reference: town-centre-impact-assessment
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Retail development proposed outside a centre.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policy 6
source-text: Any retail development proposed outside a centre should be accompanied by evidence of compliance
  with the sequential test. Any retail development proposed outside a centre where the proposed gross
  floorspace is greater than 2,500 sq. m, or where a proposal below this threshold could have a cumulative
  impact, should be accompanied by a retail impact assessment.
must-include:
- item: 'Sequential test: evidence that no sequentially preferable sites are available'
  level: must
- item: 'Retail impact assessment: impact on investment in centres in the catchment and on town centre
    vitality and viability, including consumer choice and trade'
  level: must
  required-if:
    any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 2500
        description: Gross retail floorspace greater than 2,500 sq m.
    - discretionary
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Retail statement'. The same section appears in the 'Outline planning permission' checklists.
  A smaller proposal 'could have a cumulative impact' (discretionary) and then also needs the impact assessment.
review-status: unverified
field-status: {}
