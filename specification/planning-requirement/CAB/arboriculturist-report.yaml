reference: arboriculturist-report
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - hh
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Demolition, building or engineering operations (including foundations, level changes
        and service runs) may affect trees on site or on adjoining land.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policies 71, 58 and 59
source-text: Sites carrying out demolition, building or engineering operations (including the excavation
  of foundations, any changes in level and service or utility runs) where these may affect trees both
  on-site, or on adjoining land.
must-include:
- item: As a minimum, a tree survey where trees are on or adjacent to the site
  level: must
- item: Full Arboricultural Impact Assessment to BS5837:2012 with full BS schedule information, mitigation
    and areas for replacement planting, where trees or hedges are to be removed or likely to be impacted
  level: must
- item: Arboricultural Method Statement to BS 5837 setting out how retained trees will be protected
  level: must
- item: Woodland management plan where blocks of trees may become integral to the landscape and character
    of the development
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Tree survey and arboricultural implications'. The same section appears in the 'Outline
  planning permission', 'Planning permission to alter a house' checklists.
review-status: unverified
field-status: {}
