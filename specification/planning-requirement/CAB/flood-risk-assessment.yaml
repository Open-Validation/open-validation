reference: flood-risk-assessment
local-authority: CAB
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in flood zone 2 or 3, including minor development and change of use.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: More than 1 hectare in flood zone 1.
  - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
source-text: 'Flood risk assessment When required A site specific Flood Risk Assessment (FRA) is required
  the site is: In flood zone 2 or 3 including minor development and change of use More than 1 hectare
  in flood zone 1 Less than 1 hectare in flood zone 1, including a change of use in development type to
  a more vulnerable class (for example from commercial to residential), where they could be affected by
  other sources of flooding such as surface water.'
confidence: medium
notes: The workbook also filed this under Change of use - prior approval. Sites under 1 hectare in flood
  zone 1 with a change to a more vulnerable use affected by other flood sources are shown as officer discretion.
  Include evidence that the Sequential Test and, where necessary, the Exception Test have been applied.
review-status: unverified
field-status: {}
