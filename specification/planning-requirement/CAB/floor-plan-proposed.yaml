reference: floor-plan-proposed
local-authority: CAB
required-if:
  application-type:
    in:
    - full
    - hh
    - lbc
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
source-text: Always required.
must-include:
- item: Full floor layout at an appropriate scale, usually 1:100, with a scale bar or metric measurements
  level: must
- item: The complete building (partial drawings are not acceptable)
  level: must
- item: Position of mechanical and electrical plant or equipment (flues, air handling or air conditioning
    units, extraction, air source heat pumps, combustion appliances)
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: The application involves installing building services plant or equipment.
  source-text: Where applications involve the installation of mechanical and electrical building services
    plant/equipment such as flues, air handling units/air conditioning, extraction, air source heat pumps,
    combustion appliances etc. the position of these should be indicated.
- item: Roof lights indicated on the floor plan
  level: should
  required-if:
    condition:
      field: roof-alteration
      value: true
      description: The proposal includes roof lights.
  source-text: Roof lights should be indicated on floor plan.
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Proposed floor plans'. The same section appears in the 'Planning permission to alter
  a house', 'Listed building consent' checklists. The roof-light item is from the 'Interpretation and
  guidance notes' under 'Proposed roof plans'.
review-status: unverified
field-status: {}
