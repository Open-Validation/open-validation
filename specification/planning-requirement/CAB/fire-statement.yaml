reference: fire-statement
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - reserved-matters
  - all:
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18m or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
source-text: 'Required where a building: contains two or more dwellings or educational accommodation AND
  has a height of 18m or more, or 7 or more storeys whichever is reached first'
must-include:
- item: On the form published by the Secretary of State (or a form to similar effect), with the particulars
    it specifies
  level: must
- item: Fire safety principles, concepts and approach for each building; site layout; emergency vehicle
    access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and how it was taken into account; how local fire safety policies
    were taken into account
  level: must
confidence: medium
notes: From the council's list (published 11 February 2026), 'Full planning permission' checklist web
  page, section 'Fire safety statement'. The same section appears in the 'Reserved matters approval' checklists.
review-status: unverified
field-status: {}
