reference: air-quality-assessment
local-authority: CAB
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - all:
      - site:
          in:
          - air-quality-management-area
          description: In or affecting an Air Quality Management Area.
      - discretionary
    - all:
      - condition:
          field: sensitive-end-use
          value: true
          description: A sensitive use (residential, for example) is proposed.
      - discretionary
source-url: https://www.greatercambridgeplanning.org/the-planning-application-process-and-advice/planning-application-validation-checklists/full-planning-permission-application-checklist
policy: Cambridge Local Plan Policy 5 (f), 29 and 36; Cambridge City Council Air Quality Action Plan 2018-2023
source-text: 'Where air quality is likely to be a significant issue. This will be either from: Where a
  development would adversely affect air quality in a designated Air Quality Management Area (AQMA), or
  lead to the declaration of a new AQMA, or render unworkable elements of the council''s Air Quality Action
  Plan or Air Quality Strategy. Proposed introduction of a sensitive use (residential, for example) into
  an area of poor air quality'
must-include:
- item: Assessment using guidance current at the time of the application
  level: must
- item: Measures to mitigate and minimise any impacts, with reference to the council's Air Quality Action
    Plan and Strategy
  level: must
confidence: medium
notes: 'From the council''s list (published 11 February 2026), ''Full planning permission'' checklist
  web page, section ''Air quality assessment''. The same section appears in the ''Outline planning permission''
  checklists. Discretionary: the list asks for it ''Where air quality is likely to be a significant issue''
  (a development that would adversely affect air quality in an AQMA, or a sensitive use in an area of
  poor air quality).'
review-status: unverified
field-status: {}
