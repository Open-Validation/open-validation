reference: bng-metric
local-authority: CAM
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the statutory biodiversity gain condition (not exempt).
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: Environment Act 2021 (biodiversity gain condition); NPPF (December 2024) section 15; Cambridgeshire
  and Peterborough Minerals and Waste Local Plan (July 2021) policies 19 and 20
source-text: 'Required for all applications except for BNG exempt developments. Further information can
  be within the Planning Practice Guidance: Biodiversity Net Gain.'
must-include:
- item: A draft full completed metric using the statutory template supplied by DEFRA
  level: must
- item: A draft Biodiversity Net Gain Plan using the statutory template supplied by DEFRA
  level: must
- item: The watercourse metric, for development within 10m of any watercourse (including ditches)
  level: must
  required-if:
    condition:
      field: near-watercourse
      value: true
      description: Development within 10m of a watercourse (including ditches).
  source-text: The watercourse metric should be completed for development within 10m of all watercourses
    (including ditches).
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements pages 6, 7; Local
  Validation Checklist page 3. The list applies to every planning application the county decides for waste
  and County Council (Regulation 3) development, including s73 and s73A applications; it does not apply
  to mineral development, so 'all' is shown as those types. Shown with the biodiversity gain condition,
  as the law sets which developments are exempt. The list adds that the council may ask for more, such
  as a draft Habitat Management and Monitoring Plan (significant BNG sites, at least 30 years) or a draft
  Landscape Environmental Management Plan (non-significant sites), but these are not validation requirements.
review-status: unverified
field-status: {}
