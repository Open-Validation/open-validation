reference: travel-plan
local-authority: CAM
required-if:
  any:
  - condition:
      field: pupil-increase
      operator: '>='
      value: 30
      description: School development with a net increase of one or more classrooms (30 pupils), temporary
        or permanent.
  - discretionary
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024); Cambridgeshire and Peterborough Minerals and Waste Local Plan (July 2021)
  policies 1 and 23; district local plan transport policies
source-text: • All developments, including waste development, which are likely to generate a significant
  increase in vehicle movements (other than for sites which can demonstrate very limited staffing levels
  and visitor numbers). • School development involving a net increase of one or more classrooms, temporary
  or permanent (30 pupils) or the addition of a facility such as a pre- school. For smaller school applications,
  for example where there is a one or two classroom increase, the need for a Travel Plan can be dealt
  with by way of a suitably worded prior to occupation condition. • Where the school has a Travel Plan,
  the application should be accompanied by an updated version that considers the school population when
  the proposed developed has been implemented. Where existing data is not available, for example in relation
  new school proposals, outline travel plans may be accepted. These should be linked to a transport assessment
  or statement.
must-include:
- item: How transport implications will be managed, by whom and over what timescale
  level: must
- item: How the plan will be promoted, implemented, monitored and maintained
  level: must
- item: How transport impacts can be minimised by encouraging maximum use of sustainable transport
  level: should
- item: 'School travel plans: safe cycle and walking routes, parking and car access restrictions, on-site
    changing and cycle storage, and use of (and commitment to) Modeshift Stars'
  level: should
  required-if:
    condition:
      field: school-expansion
      value: true
      description: School development.
- item: 'Where the school already has a Travel Plan: an updated version that considers the school population
    once the development is implemented'
  level: must
  required-if:
    condition:
      field: existing-travel-plan
      value: true
      description: The school has a Travel Plan.
  source-text: • Where the school has a Travel Plan, the application should be accompanied by an updated
    version that considers the school population when the proposed developed has been implemented.
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements pages 24, 25;
  Local Validation Checklist page 4. The list applies to every planning application the county decides
  for waste and County Council (Regulation 3) development, including s73 and s73A applications; it does
  not apply to mineral development, so 'all' is shown as those types. 'A significant increase in vehicle
  movements' and new facilities such as a pre-school are shown as discretionary; for one or two extra
  classrooms the list says a Travel Plan can be required by condition instead, and outline travel plans
  may be accepted for new schools.
review-status: unverified
field-status: {}
