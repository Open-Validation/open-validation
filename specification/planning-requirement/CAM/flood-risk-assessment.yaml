reference: flood-risk-assessment
local-authority: CAM
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
      - s73
  - any:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2 or 3.
    - condition:
        field: site-area-residential
        operator: '>'
        value: 1
        description: A Flood Zone 1 site over 1 hectare.
    - condition:
        field: site-area-non-residential
        operator: '>'
        value: 1
        description: A Flood Zone 1 site over 1 hectare.
    - site:
        in:
        - critical-drainage-area
        - surface-water-flood-risk
        description: A site with critical drainage problems or other sources of flooding.
    - discretionary
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
source-text: … include an FRA whether or not the development is likely to have an impact on flood risk
  (as set out in footnote 63 of the NPPF).
confidence: medium
notes: 'Audit (wrong_trigger): the workbook kept only the Flood Zone 2/3 clause. From the audit: also
  Flood Zone 1 sites over 1 ha, and smaller sites with other flood sources, a more vulnerable use, hardstanding
  changes, SFRA future-risk areas or critical drainage problems (the last few shown as officer judgement).'
review-status: unverified
field-status: {}
