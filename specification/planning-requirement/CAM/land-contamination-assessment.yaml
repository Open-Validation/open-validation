reference: land-contamination-assessment
local-authority: CAM
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected, or the site is in the vicinity of contaminated
        land.
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use would be particularly vulnerable or sensitive, e.g. residential care
        homes, schools.
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024); district local plan contaminated land policies (e.g. Huntingdonshire Local
  Plan to 2036 (May 2019) policies LP 14 and LP 37)
source-text: • Where contamination is known or suspected. • Where the development site is in the vicinity
  of contaminated land. • When the proposed use would be particularly vulnerable or sensitive e.g. residential
  care homes, schools.
must-include:
- item: A preliminary risk assessment identifying the sources, pathways and receptors
  level: must
- item: As a minimum, a land contamination assessment reporting the findings of a desk study and site
    reconnaissance (walk over)
  level: must
- item: Investigations carried out in line with established procedures such as BS10175
  level: must
- item: 'Where contamination is found: how any unacceptable risk will be addressed through remediation
    without undue environmental impact'
  level: must
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements page 29; Local
  Validation Checklist page 4. The list applies to every planning application the county decides for waste
  and County Council (Regulation 3) development, including s73 and s73A applications; it does not apply
  to mineral development, so 'all' is shown as those types.
review-status: unverified
field-status: {}
