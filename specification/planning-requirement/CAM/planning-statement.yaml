reference: planning-statement
local-authority: CAM
required-if:
  application-type:
    in:
    - waste-dev
    - reg-3
    - s73
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: Section 38(6), Planning and Compulsory Purchase Act 2004; South Cambridgeshire Local Plan (September
  2018) policy HQ/2 (public art)
source-text: All, except for very minor developments where there are no policy implications.
must-include:
- item: The context and need for the proposed development, where appropriate
  level: should
- item: An assessment of how the proposal accords with relevant national and development plan policies
  level: must
- item: 'Where the proposal does not accord with a policy or policies: an acknowledgement of this and
    the reasons why permission should be granted'
  level: must
- item: Consideration of the likely impacts of climate change
  level: should
- item: 'Within South Cambridgeshire, for new floor space of 1,000 square metres or more: a statement
    addressing the integration of public art into the design'
  level: should
  required-if:
    all:
    - condition:
        field: county-district
        value: south-cambridgeshire
        description: The site is in South Cambridgeshire District Council's area.
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: Development proposing new floor space of 1,000 square metres or more.
  source-text: 'For South Cambridgeshire District Council’s area: Developments proposing new floor space
    of 1,000 square metres or more, are encouraged to integrate public art into the design and so a statement
    addressing this policy requirement should be included.'
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements page 3; Local
  Validation Checklist page 3. The list applies to every planning application the county decides for waste
  and County Council (Regulation 3) development, including s73 and s73A applications; it does not apply
  to mineral development, so 'all' is shown as those types. The exception for 'very minor developments
  where there are no policy implications' is left to the council; it is not shown as a separate rule.
review-status: unverified
field-status: {}
