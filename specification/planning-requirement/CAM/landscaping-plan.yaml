reference: landscaping-plan
local-authority: CAM
required-if:
  any:
  - condition:
      field: tree-removal
      value: true
      description: Trees or hedgerow will be removed and compensatory planting will be required.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedgerow will be removed and compensatory planting will be required.
  - discretionary
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024); Cambridgeshire and Peterborough Minerals and Waste Local Plan (July 2021)
  policies 1 and 17; district local plan landscape and design policies; neighbourhood plan policy
source-text: Where trees or hedgerow will be removed and compensatory planting will be required. For development
  that will have a visual impact that could be mitigated by landscape planting.
must-include:
- item: Hard and soft landscape details, including existing and proposed levels, paving treatments and
    materials
  level: must
- item: The method of planting and long-term maintenance and management
  level: should
- item: Existing trees and other vegetation retained where practicable and protected during construction
  level: should
- item: Plans at an appropriate scale with schedules of planting species, densities, size and form of
    specimens at planting, and an implementation programme
  level: must
confidence: medium
notes: 'From the council''s list (published June 2025), Local Validation List Requirements pages 17, 18;
  Local Validation Checklist page 4. The list applies to every planning application the county decides
  for waste and County Council (Regulation 3) development, including s73 and s73A applications; it does
  not apply to mineral development, so ''all'' is shown as those types. ''Development that will have a
  visual impact that could be mitigated by landscape planting'' is shown as discretionary. Item 11 (landscape
  and biodiversity enhancement management scheme) has no matching id: see the unmapped list; its restoration
  and aftercare part is in site-restoration.'
review-status: unverified
