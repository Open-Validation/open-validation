reference: sustainable-drainage-strategy
local-authority: CAM
required-if:
  any:
  - ref: major-development
  - condition:
      field: floorspace
      operator: '>='
      value: 1000
      description: The provision of a building or buildings where the floorspace created is 1,000 square
        metres or more.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: A site area of 1 hectare or more, in any flood zone.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: A site area of 1 hectare or more, in any flood zone.
  - application-type:
      in:
      - waste-dev
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024) section 14; Written Ministerial Statement of 18 December 2014; Cambridgeshire
  and Peterborough Minerals and Waste Local Plan (July 2021) policies 1 and 22; district local plan drainage
  policies
source-text: • Major development as set out in Article 2(1) of the Town and Country Planning (Development
  Management Procedure) (England) Order 2015. • The provision of a building or buildings where the floorspace
  to be created by the development is 1,000 square metres or more, or • Development carried out on a site
  having an area of 1 hectare or more in all flood zones. • Waste planning applications.
must-include:
- item: Scope dependent on the nature, scale and location of the development, including any relevant impacts
    on local infrastructure
  level: must
- item: Sustainable Drainage Systems (SuDS) incorporated whenever possible
  level: should
- item: 'Considers contamination: avoids mobilising existing contamination and treats potentially contaminated
    runoff before discharge'
  level: should
- item: Follows the County Council Flood and Water Team's advice in developing SuDS
  level: must
- item: A foul drainage strategy proportionate to the development, including when connecting to a public
    sewer
  level: must
  source-text: A foul drainage strategy that is proportionate to the proposed development must be submitted
    when assessing the design implications of any new development, including when the development is being
    designed to connect to a public sewer as a means of disposing of treated effluent.
- item: 'Foul drainage strategy: location of connection points; means of conveyance (gravity/pumped);
    discharge rates; details of pre-application discussions with the relevant provider'
  level: should
  source-text: 'The foul drainage strategy should include, but not be limited to: - • the location of
    connection points • means of conveyance (gravity/pumped), • discharge rates • details of any pre-application
    discussions undertaken with the relevant provider.'
- item: An assessment of dry weather flows, unless (when connecting to the public foul sewer) it can be
    shown to be unnecessary
  level: must
  source-text: An appropriate assessment of dry weather flows is needed to avoid the risk of increased
    flooding elsewhere, because of additional flows into the receiving watercourse, unless in instances
    when development is being proposed to connect to the public foul sewer, it can be demonstrated that
    this is unnecessary for example if it is adequately controlled through a separate permitting regime
    e.g. Water Recycling Centre development.
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements page 13; Local
  Validation Checklist page 4. The list applies to every planning application the county decides for waste
  and County Council (Regulation 3) development, including s73 and s73A applications; it does not apply
  to mineral development, so 'all' is shown as those types. Uses MHCLG's retired 'sustainable-drainage-strategy'
  id; the list's item 7A combines the surface water and foul drainage strategies. The list also says applicants
  must ask Anglian Water about sewer and Water Recycling Centre capacity through its pre-application service.
