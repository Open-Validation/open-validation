reference: lighting-assessment
local-authority: CAM
required-if:
  any:
  - all:
    - condition:
        field: external-lighting
        value: true
        description: External lighting would be provided or made necessary by the development.
    - any:
      - site:
          in:
          - listed-building
          - conservation-area
          - neighbourhood-plan-area
          - dark-sky-area
          - rural-area
          description: In the vicinity of a listed building, conservation area, neighbourhood plan area,
            dark skies area or in the open countryside.
      - discretionary
  - all:
    - application-type:
        in:
        - reg-3
    - condition:
        field: floodlighting
        value: true
        description: Regulation 3 applications for floodlit sports pitches (comprehensive lighting assessment).
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: Cambridgeshire and Peterborough Minerals and Waste Local Plan (July 2021) policies 17 and 18;
  district local plan lighting and amenity policies
source-text: • Where external lighting would be provided or made necessary by development in the vicinity
  of residential property, a listed building, conservation area, neighbourhood plan area, dark skies area
  or in the open countryside. Where lighting could affect local wildlife. • Regulation 3 applications
  for floodlit sports pitches will need a comprehensive lighting assessment. • External security lights
  on buildings or in car parks should be described in the application documents.
must-include:
- item: A layout plan with beam orientation and light spill
  level: must
- item: Hours of use
  level: must
- item: Schedule of equipment (luminaire type, mounting height, aiming angles and luminaire profiles)
  level: must
- item: An isolux contour map showing light spill down to 1 lux
  level: must
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements pages 26, 27;
  Local Validation Checklist page 4. The list applies to every planning application the county decides
  for waste and County Council (Regulation 3) development, including s73 and s73A applications; it does
  not apply to mineral development, so 'all' is shown as those types. Lighting near residential property,
  or that could affect local wildlife, is shown as discretionary. External security lights only need to
  be described in the application documents.
review-status: unverified
field-status: {}
