reference: lighting-assessment
local-authority: CAM
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
      - s73
  - condition:
      field: external-lighting
      value: true
      description: External lighting is provided or made necessary, near residential property, a listed
        building or a conservation area.
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
source-text: Where external lighting would be provided or made necessary by development in the vicinity
  of residential property, a listed building, conservation area, …
must-include:
- item: An isolux contour map, including vertical illuminance and showing neighbouring buildings
  level: must
  source-text: and vertical illuminance and showing neighbouring buildings.
- item: A comprehensive lighting assessment for floodlit sports pitches
  level: must
  required-if:
    all:
    - application-type:
        in:
        - reg-3
    - condition:
        field: floodlighting
        value: true
        description: Floodlit sports pitches.
confidence: medium
notes: 'Audit (wrong_app_type): the workbook filed this under Listed building consent, which the County
  list does not cover; the trigger list is cut off.'
review-status: unverified
field-status: {}
