reference: recreation-facilities-assessment
local-authority: CAM
required-if:
  site:
    in:
    - open-space
    description: Development within designated open spaces, playing fields or allotments.
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024) section 8; Cambridge City Local Plan (October 2018) policies 67 and 73; Huntingdonshire
  Local Plan to 2036 (May 2019) policies LP 14, LP 29 and LP 32; other district plan policies
source-text: Development within designated open spaces/playing fields/allotments.
must-include:
- item: Plans showing existing or proposed open space within or adjoining the site, with access links,
    equipment, sports pitch size and layout, facilities and landscaping
  level: must
- item: 'Where playing fields are lost or provided: evidence from a district-wide Playing Pitch Strategy
    or an independent needs assessment'
  level: must
- item: 'For partial loss: enhancement of the remaining open space, or of other existing spaces or new
    provision serving the same community'
  level: should
- item: Replacement for lost sports or recreational open space in a form that best meets an identified
    existing need
  level: should
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements page 31; Local
  Validation Checklist page 5. The list applies to every planning application the county decides for waste
  and County Council (Regulation 3) development, including s73 and s73A applications; it does not apply
  to mineral development, so 'all' is shown as those types.
review-status: unverified
field-status: {}
