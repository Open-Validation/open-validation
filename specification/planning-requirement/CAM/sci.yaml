reference: sci
local-authority: CAM
required-if:
  any:
  - condition:
      field: eia-development
      value: true
      description: 'Category A (SCI section 3): development accompanied by an Environmental Statement.'
  - condition:
      field: departure-from-development-plan
      value: true
      description: 'Category A (SCI section 3): a major departure from the development plan.'
  - discretionary
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: Cambridgeshire Statement of Community Involvement (January 2019); NPPF (December 2024) paragraphs
  40-44
source-text: Category A development as defined in Section 3 of the Cambridgeshire Statement of Community
  Involvement (January 2019).
must-include:
- item: How the applicant has complied with the recommended pre-application consultation in the County
    Council's Statement of Community Involvement
  level: must
- item: How the views of the local community have been sought and considered in formulating the proposals
  level: must
confidence: medium
notes: 'From the council''s list (published June 2025), Local Validation List Requirements page 5. The
  list applies to every planning application the county decides for waste and County Council (Regulation
  3) development, including s73 and s73A applications; it does not apply to mineral development, so ''all''
  is shown as those types. The list points to ''Category A'' in the Statement of Community Involvement
  (2019), section 3: development with an Environmental Statement or a major departure from the plan, and
  proposals raising site-specific issues that will ''significantly'' affect neighbours, health, flooding,
  traffic, heritage, protected trees or rights of way, plus the County''s major transport infrastructure
  projects. The ''significant'' issues and infrastructure projects are shown as discretionary.'
