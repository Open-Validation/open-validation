reference: construction-management-plan
local-authority: CAM
required-if: discretionary
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: Cambridgeshire and Peterborough Minerals and Waste Local Plan (July 2021) policies 18 and 23;
  district local plan amenity and construction policies
source-text: • Applications, which if permitted, would give rise to HCV construction traffic in locations
  that may adversely affect highway safety or amenity of the occupiers of nearby properties will require
  a Traffic Management Plan. • For proposals where the construction would be likely to have impacts either
  for the occupiers of nearby properties or for the surrounding natural environment, or both, will require
  a Construction Environmental Management Plan.
must-include:
- item: 'CEMP: proposed construction methods, e.g. working hours, contractors'' cabins and their location,
    plant compounds, control of temporary access, dust mitigation'
  level: must
- item: 'Traffic Management Plan: identifying and mitigating construction traffic impacts on sensitive
    receptors (e.g. school opening/closing times, peak traffic)'
  level: must
- item: Proposals to reduce the number of vehicles visiting the site during construction
  level: must
- item: 'For HCV construction traffic: layout plan of the existing access; access width, junction radii
    and visibility splays (including temporary construction access); proposed daily construction traffic
    movements and vehicle types'
  level: must
  required-if:
    condition:
      field: hcv-movements
      value: true
      description: Heavy commercial vehicle construction traffic.
- item: 'For HCV construction traffic: swept path diagrams; contractors'' and delivery vehicle parking;
    delivery and dispatch hours; vehicle routes; arrangements for footpaths and cycleways; management
    and enforcement'
  level: must
  required-if:
    condition:
      field: hcv-movements
      value: true
      description: Heavy commercial vehicle construction traffic.
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements page 23; Local
  Validation Checklist page 4. The list applies to every planning application the county decides for waste
  and County Council (Regulation 3) development, including s73 and s73A applications; it does not apply
  to mineral development, so 'all' is shown as those types. Both triggers depend on whether construction
  traffic or works 'may adversely affect' highway safety, neighbours or the natural environment, so shown
  as discretionary.
review-status: unverified
field-status: {}
