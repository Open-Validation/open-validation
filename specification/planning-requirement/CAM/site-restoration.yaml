reference: site-restoration
local-authority: CAM
required-if:
  any:
  - condition:
      field: landfill-development
      value: true
      description: New landfill sites or their extension.
  - all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: temporary-development
        value: true
        description: Waste management proposals likely to be temporary in nature.
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024); Cambridgeshire and Peterborough Minerals and Waste Local Plan (July 2021)
  policies 17, 19 and 20
source-text: • Applications for new landfill sites or their extension will require aftercare of the restored
  land.
must-include:
- item: The proposed restoration, after-use and aftercare arrangements for waste management proposals
    likely to be temporary in nature
  level: must
  source-text: • Information to set out the proposed restoration, after-use and aftercare arrangements
    for all waste management proposals which are likely to be temporary in nature (and secured if necessary,
    by a legal agreement). The County Council will seek to ensure that the restoration of waste sites
    is done progressively to ensure that restoration can be achieved at the earliest opportunity. Agreement
    of the after use of restored temporary waste management sites will be undertaken on a case by case
    basis, as should the aftercare arrangements (with such aftercare potentially extending to 10 years
    or more).
confidence: medium
notes: 'From the council''s list (published June 2025), Local Validation List Requirements page 19; Local
  Validation Checklist page 4. The list applies to every planning application the county decides for waste
  and County Council (Regulation 3) development, including s73 and s73A applications; it does not apply
  to mineral development, so ''all'' is shown as those types. From item 11 (landscaping and biodiversity
  enhancement management scheme): the restoration and aftercare part. The list says restoration should
  be progressive and the after-use and aftercare (possibly 10 years or more) are agreed case by case.
  Item 21 also asks landfill proposals for restoration, after use and aftercare.'
review-status: unverified
