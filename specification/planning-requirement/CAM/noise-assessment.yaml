reference: noise-assessment
local-authority: CAM
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Development that would give rise to noise and/or vibration on and off site which could
        disturb occupants of nearby buildings (e.g. outdoor sports pitches, waste development).
  - condition:
      field: noise-sensitive-use
      value: true
      description: Noise-sensitive development close to existing sources of noise and/or vibration.
  - all:
    - condition:
        field: plant-equipment
        value: true
        description: Commercial applications including ventilation, extractor or cooling units, plant
          or equipment.
    - condition:
        field: near-noise-sensitive-use
        value: true
        description: In the vicinity of noise-sensitive uses.
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024); Cambridgeshire and Peterborough Minerals and Waste Local Plan (July 2021)
  policies 17 and 18; district local plan amenity and noise policies
source-text: 'Development proposals which: - • would give rise to noise and/or vibration both on and off
  site which could disturb occupants of nearby buildings (e.g. outdoor sports pitches, waste development);
  and • are noise-sensitive themselves and which are close to existing sources of noise and/or vibration.
  A noise impact assessment is likely to be required for the following: - • Developments that will potentially
  generate noise (e.g. waste development, outdoor sports pitches), particularly those in the vicinity
  of existing noise sensitive uses such as residential, offices, schools, and hospitals. • Noise sensitive
  development / uses in the vicinity of existing noise generating uses e.g., classified roads, railways,
  or in areas with an existing noisy environment such as a city or town centre. • Mixed use applications
  comprising both noise generating and noise sensitive uses; and • Commercial applications including ventilation,
  extractor, or cooling units / plant / equipment in the vicinity of noise sensitive uses.'
must-include:
- item: Undertaken by a person competent and qualified in acoustics and noise/vibration impact assessment
  level: must
- item: Identifies appropriate mitigation measures
  level: must
- item: Mitigation included in a Noise Management Scheme where necessary
  level: should
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements pages 25, 26;
  Local Validation Checklist page 4. The list applies to every planning application the county decides
  for waste and County Council (Regulation 3) development, including s73 and s73A applications; it does
  not apply to mineral development, so 'all' is shown as those types.
review-status: unverified
field-status: {}
