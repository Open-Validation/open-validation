reference: noise-assessment
local-authority: CAM
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
      - s73
  - condition:
      field: noise-generating-use
      value: true
      description: Development that will potentially generate noise (e.g. waste development, outdoor sports
        pitches), particularly near noise-sensitive uses.
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
source-text: 'A noise impact assessment is likely to be required for the following: Developments that
  will potentially generate noise (e.g. waste development, outdoor sports pitches), particularly those
  in the vicinity of existing noise sensitive uses such as residential, offices, schools, and hospitals.'
must-include:
- item: Appropriate mitigation measures, in a Noise Management Scheme where necessary
  level: must
  source-text: The noise/vibration assessment should identify appropriate mitigation measures and, where
    necessary, these should be included in a Noise Management Scheme.
confidence: medium
notes: 'Audit (wrong_app_type): applies to all applications under the list, not only Minerals & waste.'
review-status: unverified
field-status: {}
