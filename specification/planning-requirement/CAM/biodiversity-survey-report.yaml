notes: 'From the council''s list (published June 2025), Local Validation List Requirements page 5; Local
  Validation Checklist page 3. The list applies to every planning application the county decides for waste
  and County Council (Regulation 3) development, including s73 and s73A applications; it does not apply
  to mineral development, so ''all'' is shown as those types. Shown as discretionary: whether a survey
  is needed is set by the Standard Application Form questions and the Cambridgeshire Biodiversity Checklist
  (2014) and its guidance notes, linked from the council''s Submitting a planning application page. The
  list says the content should follow that checklist, its guidance notes and the Natural Cambridgeshire
  Developing with Nature Toolkit.'
