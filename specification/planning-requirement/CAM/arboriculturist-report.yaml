reference: arboriculturist-report
local-authority: CAM
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees on the site likely to be or could be impacted by the development, or trees on
        adjacent land that could influence the development or might be important as part of the local
        landscape.
  - condition:
      field: hedgerows-affected
      value: true
      description: Hedges on or adjacent to the site that are likely to be or could be impacted by, or
        could influence, the development.
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024); Cambridgeshire and Peterborough Minerals and Waste Local Plan (July 2021)
  policies 17, 19 and 20; Cambridge City Local Plan (October 2018) policy 71; Huntingdonshire Local Plan
  to 2036 (May 2019) policies LP 30 and LP 31; other district plan policies
source-text: When there are trees or hedges on the development site that are likely to be or could be
  impacted by the development. And/or • When there are trees or hedges on land adjacent to the development
  site that could influence the development or might be important as part of the local landscape. See
  Standard Application Form.
must-include:
- item: Species, size, canopy extent, condition, future management and projected future life of trees
    on or adjacent to the site
  level: must
- item: Which trees are to be retained or lost
  level: must
- item: Details of tree protection measures during development
  level: must
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements pages 10, 11;
  Local Validation Checklist page 4. The list applies to every planning application the county decides
  for waste and County Council (Regulation 3) development, including s73 and s73A applications; it does
  not apply to mineral development, so 'all' is shown as those types. The list points to BS5837 for method.
review-status: unverified
field-status: {}
