local-authority: CAM
name: Cambridgeshire County Council
region: East of England
type: County
review-status: unverified
validation-list:
  url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
  date: 2025-06
  date-basis: 'Title: ''Our Local Validation List Requirements (June 2025)''; companion checklist headed
    ''Local Validation Checklist (Revised June 2025)'' (https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-Checklist-2025.pdf).
    No adoption date is given (PDF files created 13 and 15 August 2025). Confirmed latest on 2026-11-06:
    the council''s Submitting a planning application page (https://www.cambridgeshire.gov.uk/business/planning-and-development/planning-applications/submitting-a-planning-application,
    modified 23 October 2026) still links these two documents under ''Local Validation List'', and no
    newer list or consultation was found. The list covers waste and County Council (Regulation 3) applications
    only; mineral applications are outside it. Page numbers in the requirement notes are PDF pages.'
  status: current
submission-standards:
- item: All scale plans and drawings to a recognisable scale with a scale bar, in addition to the national
    requirement of a north point
  level: must
- item: Plans and drawings accurate and up to date within reasonable tolerances, showing the proposals
    in their context with relevant on-site and off-site reference points
  level: must
- item: Drawings give dimensions of buildings or distances from key features (e.g. tree or ecological
    protection zones)
  level: must
- item: 'County Council development: Cambridgeshire County Council named as the applicant (or joint applicant);
    no council officer named on the form'
  level: must
- item: Waste and Regulation 3 applications submitted through the Planning Portal (or by post); mineral
    applications on the county's own Mineral Application Form, by email or post (council's Submitting
    a planning application page)
  level: must
- item: Hand-written signatures are not required; submissions are not redacted, so any signatures are
    published (council's Submitting a planning application page)
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot linked the correct, current list: the County''s June 2025 Local Validation List Requirements,
    with its June 2025 checklist. But it took the date from PDF metadata (August 2025), and the extraction
    is poor. It misses the Local Authority Development Letter, the sustainable design and construction
    statement and the waste storage/treatment/disposal information outright, and leaves the County own
    development (Reg 3) sheet empty. It spreads the 22 items unevenly between Full planning and s73, under
    several invented labels, with most triggers cut off or copied from other items. A re-extraction should
    apply all 22 items to every waste and County Council planning application (including s73/s73A) and
    exclude minerals. Fixed 2026-11-05: every file was rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: no decision yet for Cambridgeshire and Peterborough (awaiting decision, under
  programme review as at 29 Oct 2026). Not in force: council remains the LPA.'
