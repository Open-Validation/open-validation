notes: From the council's list (published June 2025), Local Validation List Requirements pages 33, 34;
  Local Validation Checklist page 5. The list applies to every planning application the county decides
  for waste and County Council (Regulation 3) development, including s73 and s73A applications; it does
  not apply to mineral development, so 'all' is shown as those types. The location plan itself is a national
  requirement; the list adds what the red line must include.
