    - waste-dev
    - reg-3
    - s73
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: Article 7(1)(c), Town and Country Planning (Development Management Procedure) (England) Order
  2015
source-text: All to which this guidance applies unless otherwise stated below.
must-include:
- item: Proposed site sections with finished floor and site levels (e.g. at 1:50 or 1:100)
  level: must
- item: Adequate cross-sections showing existing and proposed changes of level, for sloping sites and
    all proposals with changes in levels
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Sloping sites and proposals that include changes in levels.
  source-text: Adequate cross-sections showing existing and proposed changes of level are necessary for
    proposals on sloping sites and all applications which include proposed changes in levels.
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements pages 33, 34;
  Local Validation Checklist page 5. The list applies to every planning application the county decides
  for waste and County Council (Regulation 3) development, including s73 and s73A applications; it does
  not apply to mineral development, so 'all' is shown as those types.
