reference: transport-assessment
local-authority: CAM
required-if:
  any:
  - condition:
      field: new-school
      value: true
      description: New schools (Transport Assessment).
  - discretionary
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024) section 9; Cambridgeshire and Peterborough Minerals and Waste Local Plan
  (July 2021) policy 23; district local plan transport policies
source-text: • Transport Assessment – where the proposed development has significant transport implications
  including new schools. • Transport Statement – schemes where the proposed development has some transport
  implications.
must-include:
- item: A layout plan of the existing access onto the public highway
  level: must
  source-text: 'All applications which, if permitted, would lead to an increase in traffic, or a change
    in the type of traffic using the access to the site should be accompanied by the following information:'
- item: A layout plan showing access width, junction radii (if appropriate) and visibility splays at the
    existing and/or proposed access
  level: must
- item: Existing daily traffic movements (and type of vehicles) to the site; where more than one business
    uses the access, the total number of vehicle movements
  level: must
- item: Proposed daily traffic movements (and type of vehicles) to the site
  level: must
- item: Swept path diagrams for the largest vehicle to be generated, supporting the geometry of the proposed
    access
  level: must
  required-if:
    condition:
      field: hcv-movements
      value: true
      description: The site will generate heavy commercial vehicle (HCV) movements.
- item: The route HCVs will follow to reach the strategic routes on the Cambridgeshire Advisory Freight
    Map
  level: must
  required-if:
    condition:
      field: hcv-movements
      value: true
      description: The site will generate heavy commercial vehicle (HCV) movements.
- item: 'Transport Assessment: accessibility to the site by all modes and the modal split of journeys,
    considering significant impacts on local transport infrastructure'
  level: should
  required-if: discretionary
- item: 'Transport Statement: proposed measures to maximise access by public transport, walking and cycling,
    to reduce parking need and to mitigate transport impacts'
  level: should
  required-if: discretionary
- item: 'Within South Cambridgeshire and Huntingdonshire: a Low Emissions Strategy Statement, including
    justification of parking provision and of electric charging points'
  level: must
  required-if:
    any:
    - condition:
        field: county-district
        value: south-cambridgeshire
        description: The site is in South Cambridgeshire District Council's area.
    - condition:
        field: county-district
        value: huntingdonshire
        description: The site is in Huntingdonshire District Council's area.
  source-text: '(i) Within South Cambridgeshire and Huntingdonshire only, a Low Emissions Strategy Statement
    including: - • Consideration and justification of parking provision and of electrical charging points.'
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements pages 19, 20;
  Local Validation Checklist page 4. The list applies to every planning application the county decides
  for waste and County Council (Regulation 3) development, including s73 and s73A applications; it does
  not apply to mineral development, so 'all' is shown as those types. 'Significant' or 'some' transport
  implications are judgements, so shown as discretionary; the scope is agreed with the County's transport
  officers at pre-application stage. The access and traffic details apply to all applications that would
  increase traffic or change the type of traffic using the access.
review-status: unverified
field-status: {}
