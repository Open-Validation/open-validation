reference: sustainability-statement
local-authority: CAM
required-if:
  any:
  - condition:
      field: county-district
      value: south-cambridgeshire
      description: 'Within South Cambridgeshire District Council''s area: all applications.'
  - condition:
      field: new-school
      value: true
      description: 'Within all other districts and Cambridge City: a new school.'
  - condition:
      field: floorspace
      operator: '>'
      value: 1000
      description: 'Within all other districts and Cambridge City: development creating more than 1,000
        m² of floor space.'
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024); Cambridgeshire and Peterborough Minerals and Waste Local Plan (July 2021)
  policies 1 and 17; Cambridge City Local Plan (October 2018) policies 1, 28 and 57; East Cambridgeshire
  Local Plan (April 2015, as amended 2023) policies GROWTH 5, ENV 2, ENV 4-6; Fenland Local Plan (May
  2014) policy LP14; Huntingdonshire Local Plan to 2036 (May 2019) policy LP 12; South Cambridgeshire
  Local Plan (September 2018) policies S/3, CC/1, CC/3, CC/4, CC/7 and HQ/1
source-text: 'Within South Cambridgeshire District Council’s area: • For all applications. Within all
  other districts and Cambridge City Council: • For new schools and all developments creating more than
  1,000m² of floor space.'
must-include:
- item: 'Outside Cambridge City: a Statement of Sustainable Design and Construction that considers climate
    change'
  level: must
  required-if:
    any:
    - condition:
        field: county-district
        value: south-cambridgeshire
        description: The site is in South Cambridgeshire District Council's area.
    - condition:
        field: county-district
        value: huntingdonshire
        description: The site is in Huntingdonshire District Council's area.
    - condition:
        field: county-district
        value: fenland
        description: The site is in Fenland District Council's area.
    - condition:
        field: county-district
        value: east-cambridgeshire
        description: The site is in East Cambridgeshire District Council's area.
  source-text: Within all districts except Cambridge City, a Statement of Sustainable Design and Construction
    will be required which will need to consider climate change.
- item: 'Within Cambridge City: a completed Sustainable Development Checklist (Section 4 of the Sustainable
    Design and Construction SPD)'
  level: must
  required-if:
    condition:
      field: county-district
      value: cambridge
      description: The site is in Cambridge City District Council's area.
  source-text: 'Within Cambridge City Council’s area: A completed Sustainable Development Checklist (Section
    4 of Sustainable Design and Construction SPD) will need to be submitted.'
- item: 'Within South Cambridgeshire, for all non-residential development: a Water Conservation Strategy,
    unless shown not to be practicable (e.g. operational buildings without water supply or welfare facilities)'
  level: must
  required-if:
    condition:
      field: county-district
      value: south-cambridgeshire
      description: The site is in South Cambridgeshire District Council's area.
  source-text: A Water Conservation Strategy is to be submitted for all non-residential development, unless
    demonstrated not practicable e.g., for operational buildings that do not contain water supply or welfare
    facilities.
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements page 8; Local
  Validation Checklist page 3. The list applies to every planning application the county decides for waste
  and County Council (Regulation 3) development, including s73 and s73A applications; it does not apply
  to mineral development, so 'all' is shown as those types. The list also says new County Council buildings
  are expected to meet BREEAM 'Very Good' overall and achieve 'Excellent' credits in Energy and Water;
  that is a performance expectation, not a validation item. 'county-district' records which district or
  city council area of the county the site is in.
review-status: unverified
field-status: {}
