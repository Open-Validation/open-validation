reference: sustainability-statement
local-authority: CAM
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
      - s73
  - any:
    - condition:
        field: floorspace
        operator: '>'
        value: 1000
        description: Development creating more than 1,000 square metres of floorspace.
    - discretionary
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
source-text: For new schools and all developments creating more than 1,000m² of floor space.
must-include:
- item: How the proposal addresses climate change
  level: must
- item: New buildings expected to reach BREEAM Very Good overall, with Excellent credits for Energy and
    Water
  level: should
confidence: medium
notes: 'From the audit (missing_requirement): item 5, Statement of sustainable design and construction.
  In South Cambridgeshire it is needed for all applications; elsewhere for new schools and over 1,000
  sq m (new schools and the district case shown as officer judgement). Not needed in Cambridge City, which
  uses its own Sustainable Development Checklist (5(i)).'
review-status: unverified
field-status: {}
