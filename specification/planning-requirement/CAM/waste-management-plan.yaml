reference: waste-management-plan
local-authority: CAM
required-if:
  any:
  - condition:
      field: demolition
      value: true
      description: Development involving demolition of a building or part of a larger building.
  - all:
    - condition:
        field: previously-developed-land
        value: true
        description: The site is previously used (brownfield) land.
    - site:
        in:
        - contaminated-land
        description: Land that may be contaminated.
  - condition:
      field: earthworks
      value: true
      description: Development involving significant earthmoving (including greenfield sites).
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024); Cambridgeshire and Peterborough Minerals and Waste Local Plan (July 2021)
  policy 1; RECAP Waste Management Design Guide SPD (February 2012); district local plan policies
source-text: 'Development proposals: - • That involve demolition of a building or part of a larger building.
  • Where the development site is previously used (brownfield) land that may be contaminated. • That involve
  significant earthmoving (including greenfield sites).'
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements page 30; Local
  Validation Checklist page 4. The list applies to every planning application the county decides for waste
  and County Council (Regulation 3) development, including s73 and s73A applications; it does not apply
  to mineral development, so 'all' is shown as those types. The content is set out in the council's separate
  'Guidance on Waste Audit and Management Strategies' (June 2013), so no must-include items are listed
  here.
