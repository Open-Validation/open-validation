reference: heritage-statement
local-authority: CAM
required-if:
  any:
  - all:
    - condition:
        field: ground-disturbance
        value: true
        description: The ground will be disturbed.
    - site:
        in:
        - archaeological-priority-area
        description: Within an area of archaeological potential.
  - all:
    - ref: major-development
    - discretionary
  - site:
      in:
      - scheduled-monument
      - park-and-garden
      description: Affects a scheduled monument or registered park and garden, or its setting.
  - site:
      in:
      - listed-building
      - listed-building-setting
      description: Affects a listed building or its setting.
  - site:
      in:
      - conservation-area
      description: Within or will affect a conservation area or its setting.
source-url: https://www.cambridgeshire.gov.uk/asset-library/Local-Validation-List-requirements.pdf
policy: NPPF (December 2024) section 16; Cambridgeshire and Peterborough Minerals and Waste Local Plan
  (July 2021) policy 21; district local plan heritage policies (e.g. Huntingdonshire Local Plan to 2036
  (May 2019) policy LP 34)
source-text: • Where the ground will be disturbed within an area of archaeological potential or for major
  development proposals where archaeological remains may survive. • Which affect a scheduled monument
  or registered park and gardens or its setting. • Which affect a listed building or its setting. • Within
  or which will affect a conservation area or its setting. • Which will affect a registered park or garden
  or its setting.
must-include:
- item: Consideration of designated heritage assets (listed buildings and structures, conservation areas,
    registered parks and gardens, scheduled monuments), including potential impacts on their settings
  level: must
- item: Non-designated heritage assets, including locally listed buildings, other historic parks and gardens
    and the archaeological interest of the site
  level: must
- item: An assessment of the significance of all potential impacts on all heritage assets and their settings
    that might be affected
  level: must
- item: Measures to avoid, mitigate and/or compensate, if appropriate
  level: should
- item: 'Within or adjacent to a conservation area: an assessment of the impact on the character and appearance
    of the area'
  level: must
  required-if:
    site:
      in:
      - conservation-area
      description: Within or adjacent to a conservation area.
  source-text: For all applications within or adjacent to a conservation area, an assessment of the impact
    of the development upon the character and appearance of the area.
- item: 'For major development, significant infrastructure works, and ground disturbance in an area of
    potential archaeological significance: an assessment of existing archaeological information'
  level: must
  required-if:
    any:
    - ref: major-development
    - all:
      - condition:
          field: ground-disturbance
          value: true
          description: Ground disturbance.
      - site:
          in:
          - archaeological-priority-area
          description: In an area of potential archaeological significance.
    - discretionary
  source-text: For major development, significant infrastructure works, and for all applications involving
    ground disturbance within an area of potential archaeological significance, an assessment of existing
    archaeological information, and a program of fieldwork may be required.
confidence: medium
notes: From the council's list (published June 2025), Local Validation List Requirements pages 14, 15;
  Local Validation Checklist page 4. The list applies to every planning application the county decides
  for waste and County Council (Regulation 3) development, including s73 and s73A applications; it does
  not apply to mineral development, so 'all' is shown as those types. 'Major development proposals where
  archaeological remains may survive' is shown as major development plus the council's judgement. A programme
  of archaeological fieldwork 'may be required'.
review-status: unverified
field-status: {}
