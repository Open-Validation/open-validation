reference: heritage-statement
local-authority: CAM
required-if:
  all:
  - application-type:
      in:
      - waste-dev
      - reg-3
      - s73
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - scheduled-monument
      - park-and-garden
      - locally-listed-building
      - archaeological-priority-area
