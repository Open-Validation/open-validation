reference: town-centre-impact-assessment
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: town-centre-use-floorspace
      operator: '>='
      value: 350
      description: Main town centre uses of 350 sq m or more.
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: Not in an existing centre in accordance with an up-to-date plan.
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policy SP6
source-text: Developments which propose main town centre uses of 350sqm or more which are not in an existing
  centre in accordance with an up-to-date plan.
must-include:
- item: Scope agreed with officers
  level: should
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 57. Retail Impact Assessment. Application
  types follow the Table 1 matrix (pages 8-11), which ticks: full, outline.'
review-status: unverified
field-status: {}
