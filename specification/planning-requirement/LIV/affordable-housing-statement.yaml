reference: affordable-housing-statement
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - approval-condition
      - full
      - outline
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more new dwellings.
    - condition:
        field: student-units
        operator: '>='
        value: 10
        description: 10 or more student units.
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Affordable Housing Planning Practice Note
source-text: Development proposing 10 or more new dwellings, or 10 or more student units.
must-include:
- item: A schedule of the breakdown between market housing and the types of affordable housing (as defined
    in the NPPF), by units
  level: must
- item: Plans showing the location, layout and type of each affordable home
  level: should
- item: The types of affordable housing proposed, with rent levels and other costs (e.g. service charges)
  level: should
- item: Evidence of engagement with Registered Providers, where relevant
  level: should
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 29. Application types follow the Table
  1 matrix (pages 8-11), which ticks: approval of details (conditions), full, outline, removal or variation
  of conditions.'
review-status: unverified
field-status: {}
