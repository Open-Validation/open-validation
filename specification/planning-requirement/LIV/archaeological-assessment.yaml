reference: archaeological-assessment
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - full
      - hh
      - outline
  - any:
    - site:
        in:
        - scheduled-monument
        description: A Scheduled Monument.
    - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policy HD1
source-text: If proposals are on a site which has the potential to include heritage assets with archaeological
  interest (either above or below ground). These include Scheduled Monuments and may include historic
  buildings and non- designated heritage assets.
must-include:
- item: A desk-based assessment in line with the NPPF, and where necessary a field evaluation
  level: must
- item: Scope determined with the Planning Archaeologist; Merseyside Historic Environment Record consulted;
    relevant record office or local archives searched
  level: should
- item: Considers the North West Historic Environment Research Framework (2021); assesses survival potential,
    significance (local, regional, national) and the impact on significance
  level: should
- item: Suggests strategies for further evaluation and to conserve the significance of the archaeology
  level: should
- item: Illustrated with historic images and mapping
  level: should
- item: 'Major development sites: an impact assessment plan showing areas of disturbed archaeology and
    the proposed impact of the scheme'
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 33-34. Scheduled Monuments are a clear
  trigger; other sites with ''potential'' are a judgement, so discretionary. The matrix ticks householder
  only in conservation areas (''CA''). Application types follow the Table 1 matrix (pages 8-11), which
  ticks: full, householder, outline.'
review-status: unverified
field-status: {}
