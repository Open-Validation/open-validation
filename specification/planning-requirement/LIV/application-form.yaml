reference: application-form
local-authority: LIV
required-if:
  always: true
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Town and Country Planning Act 1990 section 65(5); Town and Country Planning (Development Management
  Procedure) (England) Order 2015 article 14
source-text: All applications
must-include:
- item: The council's relevant application form(s), signed and dated with all relevant sections completed
  level: must
- item: A completed, signed and dated ownership certificate A, B, C or D covering the whole site, including
    land giving access from the public highway
  level: must
- item: 'Where certificate B, C or D: notice served on every owner (21 days before submission) and the
    names and addresses on which notice was served'
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: The applicant is not the sole owner of the land.
  source-text: If the applicant is not the sole owner of the land, either certificate B, C or D is required.
- item: 'Where owners are unknown: the steps taken to find them (such as Land Registry enquiries and a
    newspaper advertisement at least 14 days before submission)'
  level: must
  required-if:
    condition:
      field: ownership-certificate-b-c-d
      value: true
      description: Some or all owners are unknown (certificate C or D).
- item: A completed, signed and dated agricultural holdings certificate, whether or not the site includes
    an agricultural holding (except reserved matters, renewal of temporary consent, discharge or variation
    of conditions, listed building consent and lawful development certificate applications)
  level: must
confidence: medium
notes: From the council's list (published 24 October 2025), page 12-13. Ownership certificates and the
  agricultural land declaration are listed as part of the form.
review-status: unverified
field-status: {}
