reference: section-proposed
local-authority: LIV
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Building works.
  - condition:
      field: external-alterations
      value: true
      description: Alterations to buildings.
  - application-type:
      in:
      - advertising
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Liverpool Local
  Plan policies UD1, UD2, UD4, UD8
source-text: All applications that involve building works, or alterations to buildings or display of advertisements.
must-include:
- item: At an appropriate scale, usually at a minimum of 1:50 or 1:100; cross and long sections proportionate
    to the proposal and annotated where appropriate
  level: must
- item: A wider street section, depending on the nature of the development
  level: must
  required-if: discretionary
- item: 'Works to publicly accessible buildings: a section demonstrating level access'
  level: must
  required-if:
    condition:
      field: external-alterations
      value: true
      description: Works in connection with publicly accessible buildings.
- item: 'For major developments: an existing site datum (e.g. Above Ordnance Datum) so all proposed levels
    can be identified against it'
  level: must
  required-if:
    ref: major-development
- item: Proposed works in relation to what is already there, demolition cross-hatched in red, relationship
    to neighbouring buildings including overall heights and finished levels
  level: should
- item: 'Changes to ground levels: existing and proposed finished floor and ground levels (relative to
    a fixed datum off site), foundations and eaves showing how encroachment onto adjoining land is avoided'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels.
- item: 'Sloping sites: how the proposal sits within the site, including relative existing and proposed
    levels and adjacent sites/buildings'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels.
- item: 'Rear extensions and conservatories: boundary walls with the adjoining properties and, where relevant,
    their relative levels'
  level: must
  required-if:
    condition:
      field: residential-extension
      value: true
      description: Rear extensions and conservatories.
- item: 'Roof extensions, terraces and dormers: existing and proposed sections through the roof where
    works are located, showing floor-to-ceiling headroom in the roof space and position of rooflights/openings'
  level: must
  required-if:
    condition:
      field: roof-alteration
      value: true
      description: Roof extensions, terraces or dormer windows.
- item: 'New or replacement windows in a conservation area or listed building: existing and proposed sections
    showing the frame-to-reveal relationship, and sectional details of the window system at 1:2 or 1:5'
  level: must
  required-if:
    all:
    - condition:
        field: external-alterations
        value: true
        description: New or replacement windows.
    - site:
        in:
        - conservation-area
        - listed-building
        description: In a conservation area or a listed building.
- item: 'Basements: existing and proposed sections, typically at 1:50, showing internal floor level and
    external ground level, lightwells and window dimensions, and the distance to the boundary where works
    extend front and rear'
  level: must
  required-if:
    condition:
      field: basement
      value: true
      description: Basement alterations, extensions or excavations.
  source-text: Basement alterations, extensions, or excavations
- item: 'External access ramp: drawing of handrails/balustrade at 1:20 or 1:50'
  level: must
  required-if:
    condition:
      field: external-alterations
      value: true
      description: Installation of an external access ramp.
- item: 'Shopfronts: existing and proposed sections through the shopfront at 1:50; sections of any security
    grilles, shutters or awning (with shutter box and canopy location) and of the canopy open, with height
    above kerb and depth over pavement'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: New shopfronts or alterations to shopfronts.
  source-text: New shopfronts or alterations to shopfronts.
- item: 'Plant, flues and extraction: equipment, ducting and acoustic enclosures shown on sections'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Installation of plant, flues, ventilation, extraction or air conditioning equipment.
- item: 'Advertisements: existing and proposed sections at 1:20 or 1:10 through all advertisements, any
    fascia or projecting sign'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Listed building consent: existing and proposed sections where floors or ceilings are removed
    or inserted, or staircases altered'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Lawful development certificate: sections at a minimum of 1:100 showing the full extent of the
    works'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
- item: 'Section 96a or section 73 amendments: submitted as a revision of the originally approved drawing
    (all original information, identical scale and size) with all current drawing requirements; partial
    drawings are not accepted'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: From the council's list (published 24 October 2025), page 19-25. Includes the 'details required
  for specific proposals' rows (pages 20-25). The street section 'may be required', so it is discretionary.
review-status: unverified
field-status: {}
