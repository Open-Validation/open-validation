  url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
  date: 2025-10-24
  date-basis: 'council page (https://liverpool.gov.uk/planning-and-building-control/applying-for-planning-permission/forms-and-checklists/):
    ''First published: 29/04/2024 Last updated: 24/10/2025''; PDF created 24 October 2025; the cover still
    reads ''April 2025''. On 2026-11-06 the council''s ''Planning application forms and checklists'' page
    linked only this validation guidance (plus a Biodiversity checklist and draft Biodiversity Gain Plan
    template); no newer list, consultation or adoption notice was found.'
  status: current
submission-standards:
- item: Drawings issued as separate PDFs, not a combined document
  level: should
- item: Drawings display a title box stating the drawing title, the nature of the proposed development
    and the site address, with a unique drawing number, a date and the scale
  level: should
- item: Revised drawings or documents include the word "revision" and the revision date in the file name,
    and a version control table (revision number, date, brief description) on the first page or title
    box
  level: must
- item: Drawn to a recognised metric scale and printable at 1:100 or 1:50, unless indicated otherwise
  level: must
- item: A scale bar showing at least 0-10 metres; the wording "do not scale" should not be used
  level: must
- item: All plans include a North point
  level: should
- item: Drawings show only the existing or proposed development, not other proposed works (e.g. permitted
    development not yet carried out)
  level: should
- item: Dimensioned drawings preferred where annotation does not compromise readability; all plans still
    to scale
  level: should
- item: Plans titled in the portal by content (e.g. proposed elevations, existing site plan) rather than
    drawing numbers
  level: should
- item: Files over 20 MB split into smaller components
  level: must
- item: For some major development, hard copies of plans and/or documents may be requested
  level: should
