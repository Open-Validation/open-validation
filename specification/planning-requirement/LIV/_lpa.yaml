  status: current
submission-standards:
- item: Drawings display a title box stating the drawing title, the nature of the proposed development
    and the site address, with a unique drawing number, a date and the scale
  level: should
- item: Revised drawings or documents include the word "revision" and the revision date in the file name,
    and a version control table (revision number, date, brief description) on the first page or title
    box
  level: must
- item: Drawn to a recognised metric scale and printable at 1:100 or 1:50, unless indicated otherwise
  level: must
- item: A scale bar showing at least 0-10 metres; the wording "do not scale" should not be used
  level: must
- item: All plans include a North point
  level: should
- item: Files over 20 MB split into smaller components
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: false
  workbook-link-current: true
  issues-open: 9
  notes: Grokbot's link is the current list (last updated 24/10/2025), but it took the date from PDF metadata
    and added rows from 2013 per-type checklists that contradict the current list. Many triggers taken
    from the 2025 PDF belong to neighbouring items (Heritage, Tree Survey, Sustainability, Structural,
    EIA), and the tab_items are mostly process text. The PDF itself could not be fetched (robots-disallowed),
    so missing items are only partly checked.
