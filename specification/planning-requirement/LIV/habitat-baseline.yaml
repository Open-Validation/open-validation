reference: habitat-baseline
local-authority: LIV
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Planning permission, if granted, would be subject to the biodiversity gain condition
      (not exempt).
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policies GI9, STP2, GI3, GI10; Environment Act 2021
source-text: All applications unless exempt under mandatory requirement or as detailed on the BNG Advice
  Note.
must-include:
- item: Ecological habitat survey including a habitat map and habitat descriptions in the UKHab survey
    method, with the survey date clearly marked
  level: must
- item: Baseline Habitats Plan
  level: must
- item: GIS layers of habitats, where available
  level: should
confidence: medium
notes: From the council's list (published 24 October 2025), page 16-17, 34-35. The list says 'All applications'
  unless exempt; by law householder and other exempt applications don't need it, so the rule is the biodiversity
  gain condition. Section 8 (national, page 16) asks whether the applicant believes the condition applies,
  with justification if exempt; a draft Biodiversity Gain Plan is in the unmapped list.
review-status: unverified
