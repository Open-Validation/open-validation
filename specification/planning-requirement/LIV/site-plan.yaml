reference: site-plan
local-authority: LIV
required-if:
  always: true
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications.
must-include:
- item: At a scale of 1:100, 1:200 or 1:500
  level: must
- item: All buildings, structures, roads, footpaths, gardens, open spaces, car parking, rivers, canals
    and culverts on adjoining land, including access arrangements
  level: must
- item: All properties named or numbered so the exact location of the site can be identified
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings, with
    written dimensions including those to the boundaries
  level: should
- item: Position of all trees on the site, and on adjacent land, that could influence or be affected by
    the development
  level: should
- item: Extent and type of any hard surfacing
  level: should
- item: Type and height of boundary treatment (walls, fences etc.)
  level: should
- item: Site outlined in red, including all land necessary for the development (access from a public highway,
    visibility splays, landscaping, car parking and open areas around buildings)
  level: must
- item: 'Parking layouts: existing and proposed layout plans showing hard and soft landscaping annotated
    with materials, location and type of boundary treatment, location, type and spread of trees on the
    site and adjoining land including pavement, and existing and proposed changes of levels'
  level: must
  required-if:
    condition:
      field: parking-change
      value: true
      description: The proposal involves a parking layout.
  source-text: Parking layouts
- item: 'Parking layouts: existing and proposed elevation of the front boundary showing context with neighbouring
    properties, location, height and materials of boundary treatment, and the existing and proposed cross
    over'
  level: must
  required-if:
    condition:
      field: parking-change
      value: true
      description: The proposal involves a parking layout.
- item: 'Development within or on open spaces: plans showing any areas of existing or proposed open space
    within or adjoining the site'
  level: must
  required-if:
    site:
      in:
      - open-space
      description: Development within or on 'open spaces'.
  source-text: Development within or on ‘open spaces’.
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 14-15, 21-22, 26. Policies cited for
  the parking and open-space drawings: UD1, UD4, CC26, GI4.'
review-status: unverified
field-status: {}
