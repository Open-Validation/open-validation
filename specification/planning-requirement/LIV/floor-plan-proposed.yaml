reference: floor-plan-proposed
local-authority: LIV
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: The application involves building works.
  - condition:
      field: involves-change-of-use
      value: true
      description: Change of use (existing and proposed floor plans).
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications, including Lawful Development Certificate applications, that involve building
  works.
must-include:
- item: At an appropriate scale, usually at a minimum of 1:50 or 1:100, annotated where appropriate (including
    extent and mix of uses)
  level: must
- item: 'For major developments: an existing site datum (e.g. Above Ordnance Datum) so all proposed levels
    can be identified against it'
  level: must
  required-if:
    ref: major-development
- item: Proposed works shown in relation to what is already there; any demolition highlighted (cross-hatched
    in red) or on separate drawings
  level: should
- item: Existing and proposed ground levels for any extensions or new builds
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: Extensions or new builds.
- item: 'New building: which parts are used for which purpose; for residential, external amenity spaces
    highlighted and linked to their accommodation'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: A new building.
- item: 'Extension: existing and proposed floor layout showing the relationship and what is new work'
  level: must
  required-if:
    condition:
      field: footprint-increase
      value: true
      description: An extension.
- item: Ground floor plans in context with the site plan, including location, type and spread of trees
    on the site and adjoining land including the footpath (all developments except householder)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
      - prior-approval
      - approval-condition
      - non-material-amendment
- item: Floor plans in the context of adjacent buildings, with positions of relevant openings on immediately
    adjacent land
  level: should
- item: 'New residential development: internal floor layouts with calculations for compliance with the
    Nationally Described Space Standards (NDSS) and amenity requirements'
  level: must
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: New residential development.
- item: 'Change of use: existing and proposed floor plans at a minimum of 1:50 or 1:100, annotated to
    show which parts are used for which purpose'
  level: must
  required-if:
    condition:
      field: involves-change-of-use
      value: true
      description: Change of use.
  source-text: Change of use
- item: 'Roof extensions, terraces and dormers: existing and proposed plans of floors where works are
    proposed'
  level: must
  required-if:
    condition:
      field: roof-alteration
      value: true
      description: Roof extensions, terraces or dormer windows.
- item: 'Roof terraces: the nearest windows on immediately adjoining properties shown on floor plans'
  level: must
  required-if:
    condition:
      field: raised-platform
      value: true
      description: A roof terrace.
- item: 'Basements: if works extend to the front and rear, the distance between basement and boundary
    on plans'
  level: must
  required-if:
    condition:
      field: basement
      value: true
      description: Basement alterations, extensions or excavations.
- item: 'External access ramp: ground floor plan at 1:50 or 1:100 showing position and gradient of the
    ramp'
  level: must
  required-if:
    condition:
      field: external-alterations
      value: true
      description: Installation of an external access ramp.
  source-text: Installation of external access ramp.
- item: 'Shopfronts: if access to the upper floors is affected, ground floor plans showing separate access
    to upper floors'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: New shopfronts or alterations to shopfronts.
- item: 'Plant, flues and extraction: equipment, ducting and acoustic enclosures or screening shown on
    plans'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Installation of plant, flues, ventilation, extraction or air conditioning equipment.
- item: 'Listed building, demolition: location and extent of demolition shown on the existing plan (cross-hatched
    in red, colour coded or labelled)'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Lawful development certificate: plans at a minimum of 1:100 showing the full extent of the use
    or building works, and how permitted development restrictions, conditions and limitations are met;
    floor areas noted where relevant'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
  source-text: Lawful Development Certificate
- item: 'Section 96a or section 73 amendments: submitted as a revision of the originally approved drawing
    (all original information, identical scale and size) with all current drawing requirements; partial
    drawings are not accepted'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: From the council's list (published 24 October 2025), page 17-18, 20-25. Includes the 'details required
  for specific proposals' rows (pages 20-25) that concern plans.
review-status: unverified
field-status: {}
