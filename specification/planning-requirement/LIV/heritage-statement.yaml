reference: heritage-statement
local-authority: LIV
required-if:
  any:
  - site:
      in:
      - listed-building
      - listed-building-setting
      - park-and-garden
      - conservation-area
      - scheduled-monument
      - locally-listed-building
      description: Directly or indirectly affects listed buildings, listed parkland, conservation areas,
        scheduled monuments or non-designated heritage assets, including their setting.
  - all:
    - application-type:
        in:
        - s73
    - site:
        in:
        - listed-building
        description: Removal or variation of a listed building consent condition.
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policy HD1; Planning (Listed Buildings and Conservation Areas) Act 1990
source-text: All development proposals that directly or indirectly affect listed buildings, listed parkland,
  conservation areas, scheduled ancient monument(s), and non-designated heritage assets, including their
  setting. Applications for removal or variation of a listed building consent condition.
must-include:
- item: The significance of the heritage asset affected, including any contribution made by its setting
  level: must
- item: The principles of and justification for the proposed works
  level: must
- item: The impact of the proposal on the significance of the asset (substantial harm or total loss)
  level: must
- item: The sources considered and expertise consulted; steps taken to avoid or minimise adverse impacts
  level: should
- item: 'Where reinstatement of lost features is proposed: historic evidence (plans or photographs)'
  level: should
- item: 'Significant changes to important interiors: an inventory of features'
  level: should
- item: Photographs, dated, numbered and cross-referenced to the drawings, showing where the works are
    proposed and the building's relationship to its surroundings
  level: should
- item: 'Tall buildings: a Heritage Impact Statement identifying the heritage assets considered, how the
    proposal responds to them and mitigates harm, cross-referenced to the visual impact assessment'
  level: must
  required-if:
    condition:
      field: tall-building
      value: true
      description: The application involves a tall building.
confidence: medium
notes: From the council's list (published 24 October 2025), page 42-43. The matrix also ticks advertisement
  and householder applications only in conservation areas ('CA').
review-status: unverified
field-status: {}
