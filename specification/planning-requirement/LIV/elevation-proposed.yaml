reference: elevation-proposed
local-authority: LIV
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Building works.
  - condition:
      field: external-alterations
      value: true
      description: Alterations to buildings.
  - application-type:
      in:
      - advertising
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Liverpool Local
  Plan policies UD1, UD2, UD8, HD1, CC12, R4
source-text: All applications that involve building works, alterations to buildings or display of advertisements.
must-include:
- item: All sides of the exterior at an appropriate scale, usually at a minimum of 1:50 or 1:100, annotated
    where appropriate (including extent and mix of uses)
  level: must
- item: A wider street elevation, depending on the nature of the development
  level: must
  required-if: discretionary
- item: 'New build: annotations and dimensions of proposed building heights, floor heights and floor depths'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New build development.
- item: 'For major developments: an existing site datum (e.g. Above Ordnance Datum) so proposed levels
    and building heights can be understood against it'
  level: must
  required-if:
    ref: major-development
- item: Proposed works in relation to what is already there, structures to be demolished cross-hatched
    in red, relationship to neighbouring buildings including relative heights and finished site levels
  level: should
- item: 'Extension: elevation of the existing building showing the relationship and what is new work'
  level: must
  required-if:
    condition:
      field: footprint-increase
      value: true
      description: An extension.
- item: Drawn in the context of adjacent buildings, showing the relationship between buildings and the
    openings on each property
  level: should
- item: Make, type, finish and colour of external materials (walls, roofs, windows, doors, rainwater goods
    etc.) annotated, including the method of window and door opening
  level: should
- item: 'Rear extensions and conservatories: boundary walls with the adjoining properties and, where relevant,
    their relative levels'
  level: must
  required-if:
    condition:
      field: residential-extension
      value: true
      description: Rear extensions and conservatories.
  source-text: Rear extensions and conservatories.
- item: 'Roof extensions, terraces, dormers, window and door replacement: elevations of the whole property'
  level: must
  required-if:
    condition:
      field: residential-extension
      value: true
      description: Roof extensions, terraces, dormer windows, window and door replacement.
- item: 'Roof terraces: nearest windows on immediately adjoining properties shown on elevations; proposed
    materials and measurements of means of enclosure and any privacy screens'
  level: must
  required-if:
    condition:
      field: raised-platform
      value: true
      description: A roof terrace.
- item: 'Major new build where land levels differ: Above Ordnance Datum details identifying existing site
    levels and the datum for proposed building height'
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: new-build
        value: true
        description: New build.
    - condition:
        field: change-in-ground-levels
        value: true
        description: The proposal changes ground levels.
- item: 'Shopfronts: detailed specification of any proposed roller shutters including colour, materials
    and degree of permeability'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: New shopfronts or alterations to shopfronts.
- item: 'Shopfronts with ATMs: details of height (for disabled access)'
  level: must
  required-if:
    condition:
      field: shopfront
      value: true
      description: New shopfronts or alterations to shopfronts.
- item: 'Plant, flues and extraction: equipment, ducting and acoustic enclosures shown; neighbouring windows
    shown, cross-referenced to the acoustic report; manufacturer''s specifications and mounting details'
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: Installation of plant, flues, ventilation, extraction or air conditioning equipment.
- item: 'Advertisements: size and direction, siting, materials and colours; height above ground; method
    and type of lighting, luminance level and colour(s) of illumination; for projecting signs, the projection
    and distance to pavement and kerb edge'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: For advertisement applications.
- item: 'Tall building: a survey plan and calculations of the heights of the proposed building (including
    roof plant) in its surrounding context, to determine the context height ratio'
  level: must
  required-if:
    condition:
      field: tall-building
      value: true
      description: The application involves a tall building.
  source-text: Applications that involve a Tall Building.
- item: 'Tall building: evidence that the viability and appropriateness of other forms of high-density
    development have been explored'
  level: must
  required-if:
    condition:
      field: tall-building
      value: true
      description: The application involves a tall building.
- item: 'Listed building consent, internal alterations: existing and proposed internal elevations affected
    by the works, usually at 1:50'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Applications for Listed Building Consent.
- item: 'Listed building consent: detailed drawings (1:20, 1:10, 1:5 or 1:2) of new, altered or replacement
    architectural features, and of all new doors and windows (1:2 or 1:5); cross-referenced to any schedule
    of works'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Façade design intent: elevations, plans and sections at 1:50 or 1:20 showing all façade variations,
    fenestration, window sections, entrances, balconies and ventilation; plus indicative 1:10 or 1:20
    annotated, dimensioned detail studies of external wall build-up, façade principles and key junctions'
  level: must
  required-if:
    any:
    - any:
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m or more of floorspace.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more new dwellings.
      - condition:
          field: student-units
          operator: '>='
          value: 10
          description: 10 or more student units.
    - all:
      - site:
          in:
          - listed-building
          - locally-listed-building
          - conservation-area
          description: Designated or non-designated heritage assets, or in a conservation area.
      - discretionary
- item: 'Lawful development certificate: elevations at a minimum of 1:100 showing the full extent of the
    works and compliance with permitted development limits; cladding annotated; rooflight projection and
    dormer distance from the eaves measured on the drawings'
  level: must
  required-if:
    application-type:
      in:
      - ldc-existing-use
      - ldc-prospective-use
- item: 'Section 96a or section 73 amendments: submitted as a revision of the originally approved drawing
    (all original information, identical scale and size) with all current drawing requirements; partial
    drawings are not accepted'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
      - s73
confidence: medium
notes: From the council's list (published 24 October 2025), page 18-25. Includes the 'details required
  for specific proposals' rows (pages 20-25). The street elevation 'may be required depending on the nature
  of the proposed development', so it is discretionary; the heritage part of the façade-design trigger
  ('substantial' works) is discretionary too. The list writes the size trigger as 'Development proposing
  1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more student units'; it is read as alternatives
  (the major-development thresholds), as the list itself sets them out with 'or' in its façade and materials
  rows.
review-status: unverified
field-status: {}
