reference: section-existing
local-authority: LIV
required-if:
  any:
  - condition:
      field: building-works
      value: true
      description: Building works.
  - condition:
      field: external-alterations
      value: true
      description: Alterations to buildings.
  - application-type:
      in:
      - advertising
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All applications that involve building works, or alterations to buildings or display of advertisements.
must-include:
- item: At an appropriate scale, usually at a minimum of 1:50 or 1:100; cross and long sections proportionate
    to the proposal and annotated where appropriate
  level: must
- item: Proposed works in relation to what is already there, demolition cross-hatched in red, relationship
    to neighbouring buildings including overall heights and finished levels
  level: should
confidence: medium
notes: From the council's list (published 24 October 2025), page 19-20. The street section 'may be required',
  so it is discretionary.
review-status: unverified
field-status: {}
