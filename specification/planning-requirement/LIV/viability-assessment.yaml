reference: viability-assessment
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - approval-condition
      - reserved-matters
      - full
      - outline
      - s73
  - condition:
      field: planning-obligations-shortfall
      value: true
      description: The applicant considers the development cannot support the policy-compliant planning
        obligations.
  - any:
    - any:
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m or more of floorspace.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more new dwellings.
      - condition:
          field: student-units
          operator: '>='
          value: 10
          description: 10 or more student units.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: s.106 Planning Obligations Advice Note
source-text: Development proposing 1000sq.m. of floorspace (including change of use over 1000sqm) and
  10 or more new dwellings, or 10 or more student units Residential developments that do not offer policy
  compliant planning obligations.
must-include:
- item: Provided in its entirety (it will be made public and independently assessed at the applicant's
    cost)
  level: must
- item: 'Onsite works in lieu of an off-site s.106 contribution: detailed plans of the spaces to be improved
    and materials, with the total area of onsite works fully accessible to the public'
  level: must
  required-if:
    condition:
      field: works-in-lieu-of-contribution
      value: true
      description: Onsite/off-site works are proposed in lieu of an off-site s.106 financial contribution.
- item: 'Onsite works in lieu of a contribution: detailed costings including all quantities and rates'
  level: must
  required-if:
    condition:
      field: works-in-lieu-of-contribution
      value: true
      description: Onsite/off-site works are proposed in lieu of an off-site s.106 financial contribution.
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 39-40. The list''s text says an FVA
  is required where the applicant considers the economics cannot support the contributions sought, so
  that is a condition of the size triggers too. The list writes the size trigger as ''Development proposing
  1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more student units''; it is read as alternatives
  (the major-development thresholds), as the list itself sets them out with ''or'' in its façade and materials
  rows. Application types follow the Table 1 matrix (pages 8-11), which ticks: approval of details (conditions),
  reserved matters, full, outline, removal or variation of conditions.'
review-status: unverified
field-status: {}
