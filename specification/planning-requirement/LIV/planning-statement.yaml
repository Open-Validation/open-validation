reference: planning-statement
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - advertising
      - approval-condition
      - reserved-matters
      - ldc-existing-use
      - ldc-prospective-use
      - full
      - lbc
      - outline
      - s73
  - any:
    - ref: major-development
    - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Major developments and proposals which raise a wide range of planning issues.
must-include:
- item: The context and need for the development and an assessment of how it accords with national, regional
    and local planning policies, proportionate to the proposal
  level: must
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 54-55. ''Proposals which raise a wide
  range of planning issues'' is a judgement, so discretionary. Application types follow the Table 1 matrix
  (pages 8-11), which ticks: advertisement, approval of details (conditions), reserved matters, lawful
  development (existing), lawful development (proposed), full, listed building consent, outline, removal
  or variation of conditions.'
review-status: unverified
field-status: {}
