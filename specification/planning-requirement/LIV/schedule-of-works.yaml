reference: schedule-of-works
local-authority: LIV
required-if:
  application-type:
    in:
    - lbc
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policy HD1
source-text: All Listed Building Consent applications.
must-include:
- item: A schedule listing all the works, internal and external
  level: must
- item: 'Removal of historically significant parts: location, extent and character of items, cross-referenced
    to existing elevations, plans and sections'
  level: must
- item: 'Major repair works: a supplementary schedule and a method statement explaining the principles'
  level: must
  required-if:
    condition:
      field: structural-alteration
      value: true
      description: Major repair works are proposed.
confidence: medium
notes: From the council's list (published 24 October 2025), page 58. The text says all listed building
  consent applications; the matrix also ticks approval of details, reserved matters, full, outline and
  removal/variation of conditions.
review-status: unverified
field-status: {}
