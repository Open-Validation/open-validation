reference: biodiversity-survey-report
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - approval-condition
      - reserved-matters
      - full
      - outline
      - s73
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - national-nature-reserve
        - local-nature-reserve
        - local-wildlife-site
        description: Within or adjacent to a designated site of nature conservation importance (e.g. SSSI,
          NNR, LNR, LWS).
    - site:
        in:
        - nature-improvement-area
        description: Within a Nature Improvement Area.
    - site:
        in:
        - priority-habitat
        description: Priority habitats known or likely to be present.
    - condition:
        field: protected-species
        value: true
        description: Protected species known or likely to be present.
    - condition:
        field: potential-roost-features
        value: true
        description: Works that would impact potential bat roosts (or swifts).
    - all:
      - site:
          in:
          - ramsar
          - special-protection-area
          - special-area-of-conservation
          description: An internationally important site (Ramsar, SPA or SAC).
      - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policies GI1, GI3, GI5, GI6, GI8, GI10
source-text: 'Any site: within or adjacent to a designated site of nature conservation importance (e.g.
  SSSI, NNR, LNR, and LWS); within a Nature Improvement Area; where priority habitats and/or protected
  species are known (or likely) to be present; if the proposal may result in a significant direct or indirect
  impact on an internationally important site (e.g. Ramsar, SPA or SAC).'
must-include:
- item: Existing biodiversity interests and protected species, impacts on them, and mitigation or compensation
    measures
  level: must
- item: A Preliminary Ecological Appraisal
  level: should
- item: 'Where further surveys are identified: an Ecological Impact Assessment compiling the survey results'
  level: must
- item: 'Works that would impact a potential bat roost: a Preliminary Roost Appraisal'
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Works that would impact a potential bat roost.
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 35-36. Independent of BNG. ''May result
  in a significant ... impact on an internationally important site'' is a judgement, so that part is discretionary.
  Protected species surveys are required before determination. Application types follow the Table 1 matrix
  (pages 8-11), which ticks: approval of details (conditions), reserved matters, full, outline, removal
  or variation of conditions.'
review-status: unverified
field-status: {}
