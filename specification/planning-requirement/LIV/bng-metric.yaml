reference: bng-metric
local-authority: LIV
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: Planning permission, if granted, would be subject to the biodiversity gain condition
      (not exempt).
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policies GI9, STP2, GI3, GI10; Environment Act 2021
source-text: All applications unless exempt under mandatory requirement or as detailed on the BNG Advice
  Note.
must-include:
- item: Completed statutory Defra metric or Small Sites Metric spreadsheet, including condition assessments,
    dated with the author(s)
  level: must
- item: Submitted as Excel with all sheets unhidden and macros disabled
  level: must
- item: 'Where an earlier date is proposed: the earlier date and the reasons for it'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: The applicant wishes to use an earlier date for the pre-development value.
- item: A statement as to whether the site has been degraded through clearance, tree/scrub removal etc.
    since January 2020
  level: must
- item: A statement/metric confirmation as to whether any irreplaceable habitat is present on site
  level: must
- item: Any supporting evidence of degraded habitat value
  level: should
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 16-17, 34-35. The list says ''All applications''
  unless exempt; by law householder and other exempt applications don''t need it, so the rule is the biodiversity
  gain condition. Section 8 (national, page 16) asks whether the applicant believes the condition applies,
  with justification if exempt; a draft Biodiversity Gain Plan is in the unmapped list. Application types
  follow the Table 1 matrix (pages 8-11), which ticks: approval of details (conditions), reserved matters,
  full, outline, removal or variation of conditions.'
review-status: unverified
field-status: {}
