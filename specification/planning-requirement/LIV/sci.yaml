reference: sci
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: floorspace
        operator: '>='
        value: 1000
        description: 1,000 sq m or more of floorspace.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more new dwellings.
    - condition:
        field: student-units
        operator: '>='
        value: 10
        description: 10 or more student units.
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
source-text: Development proposing 1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more
  student units (outline and full).
must-include:
- item: How the applicant complied with the requirements for pre-application consultation and how the
    community's views were sought and considered
  level: must
- item: If part of another document (e.g. the planning statement), this made clear in the covering letter
  level: must
confidence: medium
notes: From the council's list (published 24 October 2025), page 58-59. The list writes the size trigger
  as 'Development proposing 1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more student
  units'; it is read as alternatives (the major-development thresholds), as the list itself sets them
  out with 'or' in its façade and materials rows. The matrix also ticks approval of details, reserved
  matters and removal/variation of conditions.
review-status: unverified
field-status: {}
