reference: construction-management-plan
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - approval-condition
      - reserved-matters
      - full
      - outline
      - s73
  - any:
    - any:
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m or more of floorspace.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more new dwellings.
      - condition:
          field: student-units
          operator: '>='
          value: 10
          description: 10 or more student units.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: Applications for 5 or more dwellings.
    - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
source-text: Development proposing 1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more
  student units. Applications for 5+ dwellings and others likely to have a significant impact on traffic
  congestion or pedestrian safety and any application where loading activities associated with the construction
  phase of a development would cause congestion or obstruction on the highway.
must-include:
- item: A standalone document
  level: must
- item: 'Depending on scale and site: construction vehicle routing (swept paths), clean roads (wheel washing),
    security and access controls, waste management, delivery numbers and times, compound and staff parking
    locations, hours of operation, biodiversity protection'
  level: should
- item: 'A CEMP: measures to address demolition and construction noise and dust, and anticipated timescales
    for completion'
  level: must
- item: 'Planning matters only: no health and safety site-management detail'
  level: should
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 36-37. ''Others likely to have a significant
  impact'' is a judgement, so discretionary. The list writes the size trigger as ''Development proposing
  1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more student units''; it is read as alternatives
  (the major-development thresholds), as the list itself sets them out with ''or'' in its façade and materials
  rows. Application types follow the Table 1 matrix (pages 8-11), which ticks: approval of details (conditions),
  reserved matters, full, outline, removal or variation of conditions.'
review-status: unverified
field-status: {}
