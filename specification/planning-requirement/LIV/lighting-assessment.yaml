reference: lighting-assessment
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - advertising
      - approval-condition
      - reserved-matters
      - full
      - outline
      - s73
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Floodlights.
    - condition:
        field: external-lighting
        value: true
        description: Other external lights.
  - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
source-text: 'Where there are floodlights and other lights that may impact on: - visual or residential
  amenity, or - nature conservation interests on or adjacent to an application site.'
must-include:
- item: A layout plan with beam orientation, a schedule of the equipment, and a lighting diagram showing
    the intensity of illumination within and outside the site
  level: must
- item: Account taken of light-sensitive wildlife (e.g. bats), low-level security lighting, and BS5489
    for public and communal areas
  level: should
- item: Lux levels at any nearby habitable room window shown not to exceed 6 lux
  level: should
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 47. Required only where the lights
  ''may impact'' amenity or nature conservation, a judgement, so discretionary. Application types follow
  the Table 1 matrix (pages 8-11), which ticks: advertisement, approval of details (conditions), reserved
  matters, full, outline, removal or variation of conditions.'
review-status: unverified
field-status: {}
