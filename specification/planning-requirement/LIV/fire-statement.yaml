reference: fire-statement
local-authority: LIV
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 2
          description: Two or more dwellings.
      - condition:
          field: educational-accommodation
          value: true
          description: Educational accommodation.
    - any:
      - condition:
          field: building-height
          operator: '>='
          value: 18
          description: 18.0 m or more in height.
      - condition:
          field: storey-count
          operator: '>='
          value: 7
          description: 7 or more storeys.
  - all:
    - application-type:
        in:
        - reserved-matters
    - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Buildings which contain two or more dwellings or educational accommodation; and meet the
  height condition of 18.0m or more in height, or 7 or more storeys.
must-include:
- item: On the Secretary of State's form (or a form to similar effect) with the particulars it specifies,
    including fire safety principles, site layout, emergency vehicle access and water supplies, consultation
    undertaken and local policies considered
  level: must
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 41. Application types follow the Table
  1 matrix (pages 8-11), which ticks: full, outline. It marks reserved matters as ''D'' (discretionary).'
review-status: unverified
field-status: {}
