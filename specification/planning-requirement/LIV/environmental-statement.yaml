reference: environmental-statement
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: eia-development
      value: true
      description: Likely to have a significant effect on the environment by virtue of nature, size or
        location.
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Town and Country Planning (Environmental Impact Assessment) Regulations (the list cites the 1999
  Regulations, Schedule 4)
source-text: Developments that are likely to have a significant effect on the environment by virtue of
  their nature, size, or location.
must-include:
- item: The information in Schedule 4 of the EIA Regulations, including a description of the development,
    the main alternatives studied, the aspects of the environment likely to be significantly affected,
    the likely significant effects, mitigation measures and any difficulties encountered
  level: must
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 38. Application types follow the Table
  1 matrix (pages 8-11), which ticks: full, outline.'
review-status: unverified
field-status: {}
