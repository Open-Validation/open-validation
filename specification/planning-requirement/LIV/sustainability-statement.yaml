reference: sustainability-statement
local-authority: LIV
required-if:
  any:
  - all:
    - application-type:
        in:
        - approval-condition
        - reserved-matters
        - full
        - outline
        - s73
    - any:
      - any:
        - condition:
            field: floorspace
            operator: '>='
            value: 1000
            description: 1,000 sq m or more of floorspace.
        - condition:
            field: dwelling-count
            operator: '>='
            value: 10
            description: 10 or more new dwellings.
        - condition:
            field: student-units
            operator: '>='
            value: 10
            description: 10 or more student units.
      - condition:
          field: tall-building
          value: true
          description: The application involves a tall building.
      - site:
          in:
          - regeneration-area
          description: Developments within Paddington Village.
  - all:
    - application-type:
        in:
        - hh
    - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policies STP2, GI10, H4, H5, R1, R3, R7, R9, R10, UD1, UD2, UD5, UD6; Merseyside
  and Halton Waste Joint Local Plan WW8
source-text: Development proposing 1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more
  student units (outline and full). Applications that involve a tall building. Developments within Paddington
  Village.
must-include:
- item: How the development complies with sustainable design and construction policies, proportionate
    to the proposal; for major and complex applications completed by a suitably qualified contractor
  level: should
- item: 'Substantial demolition: why the existing building cannot be retained and improved'
  level: must
  required-if:
    condition:
      field: demolition
      value: true
      description: Substantial demolition of a building.
- item: Passive design, flexibility and future proofing, resource and materials use (waste minimisation,
    recycled and low-carbon materials), EV charging, and water efficiency with a predicted water use target
  level: should
- item: 'Sustainable drainage: how SuDS are appropriate, prioritised, designed for exceedance and climate
    change, reduce pollution, and a SuDS maintenance plan (may be in the FRA)'
  level: must
- item: 'An Energy Statement: energy efficiency measures and CO2 reduction through fabric, energy in use,
    district/low carbon heat and on-site renewables'
  level: must
- item: An Overheating Assessment and Mitigation Strategy with a Cooling Strategy; residential bedrooms
    modelled to CIBSE TM59 and communal areas to CIBSE TM52
  level: must
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 59-62. The list writes the size trigger
  as ''Development proposing 1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more student
  units''; it is read as alternatives (the major-development thresholds), as the list itself sets them
  out with ''or'' in its façade and materials rows. Application types follow the Table 1 matrix (pages
  8-11), which ticks: approval of details (conditions), reserved matters, full, outline, removal or variation
  of conditions. It marks householder as ''D'' (discretionary).'
review-status: unverified
field-status: {}
