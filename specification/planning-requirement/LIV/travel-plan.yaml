reference: travel-plan
local-authority: LIV
required-if:
  any:
  - all:
    - application-type:
        in:
        - approval-condition
        - reserved-matters
        - full
        - outline
        - s73
    - any:
      - any:
        - condition:
            field: floorspace
            operator: '>='
            value: 1000
            description: 1,000 sq m or more of floorspace.
        - condition:
            field: dwelling-count
            operator: '>='
            value: 10
            description: 10 or more new dwellings.
        - condition:
            field: student-units
            operator: '>='
            value: 10
            description: 10 or more student units.
      - condition:
          field: tall-building
          value: true
          description: The application involves a tall building.
      - discretionary
  - all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: involves-change-of-use
        value: true
        description: Prior approval for change of use.
    - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policies TP1, TP2, TP3, TP4, TP5, TP6, TP7, TP8, TP9; Ensuring a Choice of
  Travel SPD
source-text: Development proposing 1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more
  student units (outline and full). Applications that involve a tall building. Applications which would
  have an impact on the highway network (to be identified on a case-by- case basis) or generate a significant
  amount of movement. May include prior approval application in connection with permitted development
  rights for change of use as appropriate.
must-include:
- item: Worked up in consultation with the council and local transport providers
  level: should
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 64. Case-by-case highway impact and
  change-of-use prior approvals (''as appropriate'') are discretionary. The list writes the size trigger
  as ''Development proposing 1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more student
  units''; it is read as alternatives (the major-development thresholds), as the list itself sets them
  out with ''or'' in its façade and materials rows. Application types follow the Table 1 matrix (pages
  8-11), which ticks: approval of details (conditions), reserved matters, full, outline, removal or variation
  of conditions.'
review-status: unverified
field-status: {}
