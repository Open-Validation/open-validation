reference: daylight-sunlight-assessment
local-authority: LIV
required-if:
  any:
  - all:
    - application-type:
        in:
        - approval-condition
        - reserved-matters
        - full
        - outline
        - s73
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more new dwellings.
      - condition:
          field: student-units
          operator: '>='
          value: 10
          description: 10 or more student units.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
        - non-material-amendment
    - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Tall Buildings SPD; BRE 'Site Layout Planning for Daylight and Sunlight'
source-text: Development proposing 10 or more new dwellings, or 10 or more student units. Any application
  where there is potential adverse impact upon the current levels of sunlight/daylight enjoyed by adjoining
  properties or building(s) including associated gardens or amenity space or in the vicinity of a river
  or open space.
must-include:
- item: Carried out in accordance with the BRE guide 'Site Layout Planning for Daylight and Sunlight'
  level: must
- item: Final daylight and sunlight values achieved within the scheme
  level: should
- item: Impacts on existing properties, developments and sites with extant permissions around the development
  level: should
- item: Sunlight amenity to the main open/courtyard spaces within the scheme
  level: should
- item: Default surface reflectance values and maintenance factors strictly as BRE guidelines
  level: must
- item: 'Glazing transmittance and framing factors: specification data where BRE defaults are not appropriate'
  level: must
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 37-38. ''Potential adverse impact''
  is a judgement, so discretionary. Application types follow the Table 1 matrix (pages 8-11), which ticks:
  approval of details (conditions), reserved matters, full, outline, removal or variation of conditions.
  It marks householder, non-material amendment as ''D'' (discretionary).'
review-status: unverified
field-status: {}
