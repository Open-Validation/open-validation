reference: waste-management-plan
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - approval-condition
      - reserved-matters
      - full
      - outline
      - s73
  - condition:
      field: new-build
      value: true
      description: Residential or non-residential development, including new build, conversions and changes
        of use, of any size.
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
source-text: All residential and non-residential development proposals including new build development,
  conversions/ changes of use, regardless of the size of the proposal.
must-include:
- item: 'Major residential, commercial or mixed-use: a Waste Management Strategy if the council requires
    one'
  level: must
  required-if:
    all:
    - ref: major-development
    - discretionary
- item: 'Otherwise, in the Design and Access Statement and drawings: a plan showing the size and location
    of refuse and recycling storage, bulk waste storage, manoeuvring space, the collection point and how
    waste reaches the stores (for flats, distance from the furthest flat door)'
  level: must
- item: Anticipated collection frequency, estimated waste volumes, bins in line with LCC recommendations,
    and arrangements for transferring waste to the collection point
  level: must
- item: Swept path analysis for a refuse vehicle that must enter the site
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A refuse vehicle must enter the site to collect waste.
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 56-57. Refuse and Recycling Management.
  The list says all development of any size; the condition uses new-build with the list''s wording in
  its description. Application types follow the Table 1 matrix (pages 8-11), which ticks: approval of
  details (conditions), reserved matters, full, outline, removal or variation of conditions.'
review-status: unverified
field-status: {}
