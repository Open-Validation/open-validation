reference: land-contamination-assessment
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - approval-condition
      - reserved-matters
      - full
      - lbc
      - outline
      - s73
  - any:
    - site:
        in:
        - contaminated-land
        description: Potentially contaminated land, including where the previous use could give rise to
          contamination.
    - condition:
        field: sensitive-end-use
        value: true
        description: The proposed use is sensitive (e.g. residential, school).
    - site:
        in:
        - near-landfill-site
        description: On or near former landfill sites.
    - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Building Regulations Approved Document C
source-text: 'Proposals on potentially contaminated land. For example: - Where the proposed use is sensitive
  e.g., residential, school; - where the previous use of land could give rise to contamination; - on and
  near former landfill sites; and - sites that have a history of commercial use or where previous uses
  are unknown.'
must-include:
- item: A desktop study setting out the previous uses of the site
  level: must
- item: Enough information to determine whether contamination exists, its nature, the risks and whether
    they can be reduced to an acceptable level
  level: must
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 44-45. ''Sites that have a history
  of commercial use or where previous uses are unknown'' has no defined test, so it is discretionary.
  Application types follow the Table 1 matrix (pages 8-11), which ticks: approval of details (conditions),
  reserved matters, full, listed building consent, outline, removal or variation of conditions.'
review-status: unverified
field-status: {}
