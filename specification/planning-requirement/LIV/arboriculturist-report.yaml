reference: arboriculturist-report
local-authority: LIV
required-if:
  any:
  - all:
    - application-type:
        in:
        - approval-condition
        - reserved-matters
        - full
        - hh
        - lbc
        - outline
        - s73
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within 15 times their stem diameter (measured at 1.5 m) of the development
          footprint or working area, or a canopy within it.
  - all:
    - application-type:
        in:
        - consent-under-tpo
        - notice-trees-in-con-area
    - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policy GI9; BS 5837
source-text: Any application (including Pre- applications) where there are trees within proximity of the
  development footprint, defined as any tree within a distance 15 times the diameter of the tree stem
  (measured at 1.5m height) and/or where any tree canopy is within the footprint of the development.
must-include:
- item: 'Tree survey of all existing trees, including those on neighbouring land that may be affected:
    species, height, stem diameter (BS5837), canopy spread to four compass points, crown base height,
    age class, condition, management recommendations, retention category (A, B, C, U) and root protection
    area; all trees numbered'
  level: must
- item: Tree survey (constraints) plan based on a topographical survey, to a recognised scale, showing
    all trees, hedgerows and shrubs over 2 m or with a stem of 7.5 cm or more, spot heights, trees on
    adjoining land within 15 times stem diameter of the boundary, and each tree's location, stem diameter,
    canopy, RPA, reference and category
  level: must
- item: Prepared by a qualified/competent arboriculturist
  level: should
- item: 'Arboricultural impact assessment: which trees are retained, removed or retained with mitigation;
    impact on above and below ground parts; tree survey data and plan; tree impact plan (survey overlaid
    on the proposed layout, all changes within RPAs); draft tree protection plan'
  level: must
- item: 'Where works are within an RPA: proposed levels and cross sections'
  level: must
- item: Submitted as one document with appendices/plans included
  level: must
- item: Tree protection plan with the information in BS5837 section 5.5, trees to be retained in green
    and removed in red, ground protection product and fencing specification (BS5837 figure 2 as a minimum),
    dimensioned from trees or fixed features
  level: must
- item: 'New hard surfaces within RPAs: topographical survey with levels, a section of the surface construction,
    sections of existing and proposed levels, and a plan with existing and proposed spot levels'
  level: must
  required-if:
    condition:
      field: hard-surfacing
      value: true
      description: New hard surfaces within root protection areas.
- item: 'Arboricultural method statement: timing of site operations, tree work, mitigation and protection
    measures and site supervision during construction, with a tree protection plan (may instead be required
    by condition)'
  level: must
  required-if: discretionary
  source-text: If not provided up front as part of the submission this may be required as a Discharge
    of Condition application.
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 30-33. Combines the (Arboricultural)
  Tree Survey, Arboricultural Impact Assessment and Arboricultural Method Statement rows; the method statement''s
  trigger is trees near the working area of the site (haul roads, compounds, storage) and it may be left
  to a condition, so it is discretionary. Application types follow the Table 1 matrix (pages 8-11), which
  ticks: approval of details (conditions), reserved matters, full, householder, listed building consent,
  outline, removal or variation of conditions. It marks tree works as ''D'' (discretionary).'
review-status: unverified
field-status: {}
