reference: landscaping-plan
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - approval-condition
      - reserved-matters
      - full
      - outline
      - s73
  - any:
    - all:
      - condition:
          field: new-build
          value: true
          description: New build.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential development.
    - condition:
        field: external-space
        value: true
        description: Development that includes external amenity space/public realm.
    - condition:
        field: tree-removal
        value: true
        description: The scheme results in tree loss to be mitigated on site.
  - condition:
      field: landscaping-reserved-matter
      value: false
      description: Landscaping is not a reserved matter of an outline application.
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policies GI8, GI10, STP2
source-text: Required prior to determination (Unless a Reserved Matter as part of an Outline application)
  for all new build residential development, developments that include external amenity space/public realm,
  and any schemes resulting in tree loss to be mitigated on site.
must-include:
- item: Hard and soft landscaping proposals for all parts of the site where no buildings are proposed
  level: must
- item: A plan showing the landscape structure for the whole site and the detailed treatment of individual
    areas
  level: must
- item: 'Planting details: botanical name, number and stock size of all trees, shrubs and herbaceous plants,
    with total numbers on the plan'
  level: must
- item: 'Tree planting: soil volume of planting pits specified, sufficient for growth to maturity'
  level: must
- item: Retained trees shown on the planting plan
  level: must
- item: 'Hard landscape details: walls, fences, railings, paths and hard surfaced areas'
  level: must
- item: A maintenance schedule and, where appropriate, long-term management proposals
  level: must
- item: 'Soft landscaping in highway or public realm: photographic record of trial holes at each tree
    location, utility survey results within 10 m of each tree, and a Highway Safety Audit including visibility
    splays'
  level: must
  required-if:
    condition:
      field: external-space
      value: true
      description: Soft landscaping in the highway or public realm.
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 46-47. Application types follow the
  Table 1 matrix (pages 8-11), which ticks: approval of details (conditions), reserved matters, full,
  outline, removal or variation of conditions.'
review-status: unverified
field-status: {}
