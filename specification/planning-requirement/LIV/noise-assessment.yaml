reference: noise-assessment
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - approval-condition
      - reserved-matters
      - full
      - outline
      - s73
  - any:
    - condition:
        field: mixed-use
        value: true
        description: All mixed-use developments.
    - all:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Noise-sensitive development (including residential).
      - discretionary
    - condition:
        field: noise-generating-use
        value: true
        description: Proposals that include noise-generating activities.
    - condition:
        field: plant-equipment
        value: true
        description: Proposals that include noise-generating equipment/machinery (including building services
          and external plant).
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
source-text: All mixed-use developments and noise- sensitive development (including residential) close
  to noise generating activities and proposals that include noise generating activities & equipment /
  machinery.
must-include:
- item: Prepared by a suitably qualified acoustician
  level: should
- item: Noise control works detailed on the drawings; external attenuation equipment location, size and
    visual impact shown
  level: must
- item: Surveys in accordance with BS 7445-1:2003; details of assessments, predictions and calculations,
    and recommended noise control works
  level: must
- item: Vibration assessment in certain cases (e.g. housing next to railways, heavy machinery or mobile
    plant)
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 50-51. ''Close to noise generating
  activities'' has no defined distance, so the noise-sensitive part is discretionary. Application types
  follow the Table 1 matrix (pages 8-11), which ticks: approval of details (conditions), reserved matters,
  full, outline, removal or variation of conditions.'
review-status: unverified
field-status: {}
