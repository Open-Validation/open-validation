reference: recreation-facilities-assessment
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - site:
        in:
        - open-space
        description: Development within or on open spaces or play, sports and recreation facilities.
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: 'Major residential: more than 10 new dwellings.'
    - condition:
        field: student-units
        operator: '>='
        value: 10
        description: 10 or more student units.
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
policy: Liverpool Local Plan policies CC24, H4, H5, H13, H14, STP2, GI4, UD2, UD3, UD6; Public Realm Strategy
  SPD
source-text: Development within or on open spaces or play, sports and recreation facilities … Major residential
  developments i.e. more than 10 new dwellings, or 10 or more student units.
must-include:
- item: Plans showing existing or proposed open space, play, sports or recreation facilities within or
    adjoining the site
  level: must
- item: 'Loss of open space or facilities: an independent assessment showing the land/buildings are surplus'
  level: must
  required-if:
    condition:
      field: loss-of-open-space
      value: true
      description: The proposal would result in the loss of open space or play, sports or recreation facilities.
- item: 'Major residential: where public open space, private/communal amenity space and formal and play
    space are provided, how quality standards are met, their location and design, and maintenance arrangements'
  level: must
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 10
        description: More than 10 new dwellings.
    - condition:
        field: student-units
        operator: '>='
        value: 10
        description: 10 or more student units.
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 51-52. Matrix: no separate row; types
  follow the list''s application wording (full and outline).'
review-status: unverified
field-status: {}
