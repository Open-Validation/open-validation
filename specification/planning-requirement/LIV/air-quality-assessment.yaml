reference: air-quality-assessment
local-authority: LIV
required-if:
  all:
  - application-type:
      in:
      - approval-condition
      - reserved-matters
      - full
      - outline
      - s73
  - any:
    - any:
      - condition:
          field: floorspace
          operator: '>='
          value: 1000
          description: 1,000 sq m or more of floorspace.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more new dwellings.
      - condition:
          field: student-units
          operator: '>='
          value: 10
          description: 10 or more student units.
    - condition:
        field: tall-building
        value: true
        description: The application involves a tall building.
    - discretionary
source-url: https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
source-text: Development proposing 1000sqm of floorspace and 10 or more new dwellings, or 10 or more student
  units. Any application that involves a tall building.
must-include:
- item: Written in accordance with IAQM/EPUK guidance
  level: must
- item: 'Where increased building and/or transport emissions are likely: reduction/mitigation measures
    set out in a detailed emissions statement'
  level: should
- item: 'If the developer considers an assessment is not required: justification for that position'
  level: must
  source-text: If the developer considers that an air quality assessment is not required, then justification
    for this position must be provided to the Local Planning Authority.
confidence: medium
notes: 'From the council''s list (published 24 October 2025), page 29-30. ''An AQA may be required even
  if the criteria are not met'' where the public perceives a detrimental impact, so there is a discretionary
  part; the list also points to the IAQM/EPUK criteria. The list writes the size trigger as ''Development
  proposing 1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more student units''; it is
  read as alternatives (the major-development thresholds), as the list itself sets them out with ''or''
  in its façade and materials rows. Application types follow the Table 1 matrix (pages 8-11), which ticks:
  approval of details (conditions), reserved matters, full, outline, removal or variation of conditions.'
review-status: unverified
field-status: {}
