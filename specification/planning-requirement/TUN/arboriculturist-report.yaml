reference: arboriculturist-report
local-authority: TUN
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Development that affects any trees, particularly trees protected by a TPO, in a conservation
        area, in or affecting ancient woodland or veteran trees, or in a historic park and garden, Nature
        Conservation Site or Area of Landscape Importance.
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
source-url: https://tunbridgewells.gov.uk/planning/applications/national-planning-requirements-validation-guidance
source-text: 'Tree Survey or Arboricultural Assessment A Tree Survey or Arboricultural Assessment is required
  for all development that affects any trees, particularly: Protected by a Tree Preservation Order In
  a conservation area Within or affects ancient woodlands or ancient and veteran trees In a historic park
  and garden Within a Nature Conservation Site In an Area of Landscape Importance, Important Landscape
  Approach or Arcadian Area Considered to be important landscape or townsca…'
must-include:
- item: A description of proposed works
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: A plan (not an aerial image) showing the position of the trees listed in the description of works
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Reasons for the proposed work
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
- item: Where trees are felled, proposals for replacement planting (quantity, species, position, size)
    or reasons for not replanting
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
confidence: low
notes: 'Audit (wrong_trigger): the Full planning row quoted the tree works application content, and the
  replacement planting text was filed under the S106 row. The development trigger is from the council''s
  web page. The audit couldn''t read this council''s list, so its contents weren''t checked.'
review-status: unverified
field-status: {}
