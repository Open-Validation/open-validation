reference: elevation-existing
local-authority: BRM
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
  - condition:
      field: building-works
      value: true
      description: The application is for building works.
source-url: https://www.bromsgrove.gov.uk/residents/planning-building-control/planning-permission/submit-planning-application/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'As a general guide, a standard planning application requires all of the following to be
  valid: ... your plans and elevations for both existing and proposed work ... Where a proposal is to
  extend a building, existing and proposed elevations drawings are required to show the proposed extension.
  Any elevations where there are to be proposed changes must be shown and if the proposal is for a new
  building all elevations should be submitted. They must be accurate and sufficiently detailed to show
  windows and any overhang of the eaves.'
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
  source-text: Elevations - Scale 1:50 or 1:100
- item: Accurate and detailed enough to show windows and any overhang of the eaves
  level: must
confidence: medium
notes: 'Bromsgrove publishes no local validation list (checked 2026-11-06): its ''Submit planning application''
  page says the District Council uses the national validation criteria. From the council''s ''Submit planning
  application'' page (undated, read 2026-11-06). The page lists it for ''a standard planning application'',
  taken here as householder and full planning applications. The detail is from the guidance note ''Plans
  and Drawings to be submitted with a Planning Application'' (undated; file name dated 04-10-17), page
  1, section 3. Existing elevations only where there is an existing building.'
