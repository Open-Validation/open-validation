reference: location-plan
local-authority: BRM
required-if:
  always: true
source-url: https://www.bromsgrove.gov.uk/residents/planning-building-control/planning-permission/submit-planning-application/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'As a general guide, a standard planning application requires all of the following to be
  valid: ... your location plan to scale at either 1:1250 or 1:2500 (including: a North Point; at least
  one and preferably two road names; at least three properties identified by name or number; minimum A4
  sized).'
must-include:
- item: At a scale of either 1:1250 or 1:2500
  level: must
- item: A North point
  level: must
- item: At least one named road
  level: must
  source-text: at least one and preferably two road names
- item: A second named road
  level: should
  source-text: at least one and preferably two road names
- item: At least three properties identified by name or number
  level: must
- item: Minimum A4 size
  level: must
- item: An OS map showing enough of the surrounding area to easily and accurately identify the application
    site
  level: must
  source-text: This must be an OS Map and show enough of the surrounding area to easily and accurately
    identify the application site.
confidence: medium
notes: 'Bromsgrove publishes no local validation list (checked 2026-11-06): its ''Submit planning application''
  page says the District Council uses the national validation criteria. From the council''s ''Submit planning
  application'' page (undated, read 2026-11-06). The OS-map item is from the council''s guidance note
  ''Plans and Drawings to be submitted with a Planning Application'' (undated; file name dated 04-10-17),
  page 1, which also says the site ''should be outlined in red'' including access to the public highway
  and other land owned in blue, as the national rules require. The page lists it for a standard planning
  application; national rules require a location plan with every application.'
