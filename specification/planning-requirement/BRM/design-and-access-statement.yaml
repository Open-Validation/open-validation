reference: design-and-access-statement
local-authority: BRM
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a conservation area or World Heritage Site.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with 100 square metres or more of floorspace.
source-url: https://www.bromsgrove.gov.uk/residents/planning-building-control/planning-permission/submit-planning-application/
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'As a general guide, a standard planning application requires all of the following to be
  valid: ... your design and access statement if applicable'
confidence: medium
notes: 'Bromsgrove publishes no local validation list (checked 2026-11-06): its ''Submit planning application''
  page says the District Council uses the national validation criteria. From the council''s ''Submit planning
  application'' page (undated, read 2026-11-06). The page says only ''if applicable'', so the national
  rule (DMPO article 9) is shown: major development, listed building consent, and in a conservation area
  or World Heritage Site one or more dwellings or 100 square metres or more of floorspace.'
