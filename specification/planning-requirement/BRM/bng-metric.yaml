reference: bng-metric
local-authority: BRM
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.bromsgrove.gov.uk/residents/planning-building-control/planning-permission/submit-planning-application/
policy: Environment Act 2021 (Schedule 7A, Town and Country Planning Act 1990); Article 7, Town and Country
  Planning (Development Management Procedure) (England) Order 2015
source-text: Biodiversity Net Gain Statement (for some planning applications, applicants are required
  to demonstrate 10% Biodiversity Net Gain (BNG) and which fulfills the minimum national information requirements
  as set out in the Town and Country Planning (Development Management Procedure) (England) Order 2015
  as amended by the Biodiversity Gain (Town and Country Planning) (Modifications and Amendments) (England)
  Regulations 2024).
must-include:
- item: Enough information to show that the general biodiversity gain condition can be discharged, through
    conditions and section 106 obligations securing significant onsite gains and registered offsite gains
  level: must
  source-text: As well as the minimum national information requirements the developer will need to provide
    sufficient information to demonstrate that the general biodiversity gain condition is capable of being
    discharged successfully through the imposition of conditions and agreement of Section 106 planning
    obligations to secure significant onsite biodiversity gains and registered offsite biodiversity gains.
confidence: medium
notes: 'Bromsgrove publishes no local validation list (checked 2026-11-06): its ''Submit planning application''
  page says the District Council uses the national validation criteria. From the council''s ''Submit planning
  application'' page (undated, read 2026-11-06). The page says ''for some planning applications'', so
  the legal rule is shown: applications subject to the general biodiversity gain condition (householder
  and other exempt applications are exempt by law). The extra item is from the council''s ''Biodiversity
  Net Gain'' page (https://www.bromsgrove.gov.uk/residents/planning-building-control/planning-legislative-changes-and-guidance/biodiversity-net-gain/,
  undated), which also says a habitat management and monitoring plan ''will be required'' where significant
  onsite enhancements are proposed, to maintain the habitats for 30 years.'
