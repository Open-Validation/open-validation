reference: site-plan
local-authority: BRM
required-if:
  application-type:
    in:
    - hh
    - full
source-url: https://www.bromsgrove.gov.uk/residents/planning-building-control/planning-permission/submit-planning-application/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'As a general guide, a standard planning application requires all of the following to be
  valid: ... your block plan'
must-include:
- item: At a scale of 1:200 or 1:500
  level: must
  source-text: Block Plan - Scale 1:200/500
- item: North indicated
  level: must
  source-text: North must be indicated.
- item: At a smaller scale than the Location Plan, showing the position of the existing buildings and
    the proposed works
  level: should
  source-text: The Block Plan should be at a smaller scale than the Location Plan and should show the
    position of the existing buildings and indicate the proposed works.
- item: Any trees on site, and greater detail of the layout and landscaping
  level: should
  source-text: The Block Plan should include other details such as indicate any trees on site and provide
    greater detail relating to the layout and
confidence: medium
notes: 'Bromsgrove publishes no local validation list (checked 2026-11-06): its ''Submit planning application''
  page says the District Council uses the national validation criteria. From the council''s ''Submit planning
  application'' page (undated, read 2026-11-06). The page lists it for ''a standard planning application'',
  taken here as householder and full planning applications. The contents are from the guidance note ''Plans
  and Drawings to be submitted with a Planning Application'' (undated; file name dated 04-10-17), page
  1, section 2. (''a smaller scale than the Location Plan'' is the note''s own wording; it means a larger-scale,
  more detailed drawing.)'
