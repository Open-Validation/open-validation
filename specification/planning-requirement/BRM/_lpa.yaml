local-authority: BRM
name: Bromsgrove District Council
region: West Midlands
type: District
review-status: unverified
validation-list:
  url: https://www.bromsgrove.gov.uk/residents/planning-building-control/planning-permission/submit-planning-application/
  date: ''
  date-basis: 'Bromsgrove has no local validation list, so there is no list date. Checked 2026-11-06:
    the ''Submit planning application'' page (undated; it refers to fee and external-advice changes from
    1 April 2026) says the District Council uses the national validation criteria and lists what a standard
    planning application needs; it links a guidance note on plans and drawings (file name dated 04-10-17).
    A site search for ''validation'' and ''checklist'' found no local list, and the last formal local
    list (May 2012; planning.data.gov.uk entity 20292, https://moderngovwebpublic.bromsgrove.gov.uk/mgConvert2PDF.aspx?ID=12229)
    is no longer linked. Bromsgrove and Redditch share one planning service and publish matching pages'
  status: national-only
submission-standards:
- item: Plans and drawings of a professional standard, accurate and to scale, with all the information
    needed to describe the proposal in detail
  level: must
- item: 'Online submissions: plans clearly and correctly labelled, preferably as Plan Title followed by
    the Plan Reference Number (e.g. ''Front Elevation P-001'')'
  level: should
- item: 'Paper or emailed applications: two versions of the application form, one with the applicant''s
    personal information and contact details (internal use only) and one without them (published)'
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: false
  issues-open: 0
  notes: 'Grokbot''s link works but is a generic ''how to submit'' page, not a local list. The council
    says it uses national validation criteria, and the last adopted local checklist dates from May 2012,
    which Grokbot never found. The captured tab items are all process text, and the only real requirement
    guidance on the page (the plans and drawings note) was not extracted. Fixed 2026-11-05: every file
    was rewritten from the council''s latest list.'
notes: 'Reorganisation: LGR: government "minded to" implement the Worcestershire proposal (announced 29
  Oct 2026; final decision after >=3 weeks of representations). Not in force: council remains the LPA;
  new councils expected 2029 (shadow elections May 2028).'
