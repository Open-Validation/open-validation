reference: sci
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - mineral-extraction
  - condition:
      field: pre-application-community-consultation
      value: true
      description: Pre-submission consultation took place.
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Shropshire Statement of Community Involvement (adopted 30 June 2021)
source-text: A report outlining what and how pre-submission consultation has taken place.
must-include:
- item: The scale of notification, including a list of properties, businesses and organisations contacted
  level: must
- item: Location, date and duration of any events or activities, and a list of participants
  level: must
- item: Summary of comments received and issues raised
  level: must
- item: Which comments led to amendments and what they are, and which did not and why
  level: must
confidence: medium
notes: 'From the council''s list (2022), page 55. Listed in checklists 4-9, 19 and 22. Local requirement:
  the list (page 5) validates applications without formal pre-application advice on the national requirements
  only, and asks for local documents at validation only where the pre-application response listed them
  (otherwise the officer may ask during determination), so the rule ends with ''discretionary''. For smaller
  schemes it may be part of the Design and Access Statement.'
review-status: unverified
field-status: {}
