reference: land-contamination-assessment
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - s73
      - mineral-extraction
  - any:
    - site:
        in:
        - contaminated-land
        description: The site may be contaminated.
    - site:
        in:
        - near-landfill-site
        description: On or within 250 metres of a former landfill site.
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Core Strategy CS6; Part IIA Environmental Protection Act 1990
source-text: When considering planning applications local planning authorities are under a duty to take
  account of whether a site may be contaminated. … Applications involving development of sites located
  on or within 250 metres of a former landfill site will need to include a risk assessment of landfill
  gas migration.
must-include:
- item: Produced by appropriately qualified professionals
  level: must
- item: A risk assessment of landfill gas migration
  level: must
  required-if:
    site:
      in:
      - near-landfill-site
      description: On or within 250 metres of a former landfill site.
- item: Phase I desk based study (Phase II intrusive investigation may be submitted with it)
  level: should
confidence: medium
notes: 'From the council''s list (2022), page 74. Listed in checklists 2, 4-9, 19, 20 and 22. Local requirement:
  the list (page 5) validates applications without formal pre-application advice on the national requirements
  only, and asks for local documents at validation only where the pre-application response listed them
  (otherwise the officer may ask during determination), so the rule ends with ''discretionary''.'
review-status: unverified
field-status: {}
