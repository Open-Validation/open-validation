reference: land-contamination-assessment
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - hh
      - demolition-con-area
      - full
      - outline
      - reserved-matters
      - s73
  - any:
    - site:
        in:
        - contaminated-land
        - near-landfill-site
        description: The site is or may be contaminated, or is within 250m of a former landfill.
    - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
must-include:
- item: Landfill gas risk assessment
  level: must
  required-if:
    site:
      in:
      - near-landfill-site
      description: The site is within 250m of a former landfill.
confidence: medium
notes: 'From the audit (missing_requirement): listed in checklists 2, 4, 5, 6, 19 and 20, including landfill
  gas risk within 250m of a former landfill.'
review-status: unverified
field-status: {}
