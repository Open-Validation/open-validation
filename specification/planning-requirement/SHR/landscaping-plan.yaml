reference: landscaping-plan
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - pa-build-agri-forest
      - pa-road-agri-forest
      - mineral-extraction
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Shropshire Landscape Character Assessment
source-text: The developer should look at the effects of the proposed development on the Landscape character
  of the area by reference to the Shropshire Character Assessment (Landscape Description Unit information)
  and Shropshire Typology.
must-include:
- item: Effects on landscape character (Landscape Description Units and Shropshire Typology) and local
    character, including scale and field and hedge patterns
  level: must
- item: Visual effects from viewpoints agreed with Development Management officers
  level: must
- item: 'Site landscaping: a plan and species lists, with native species of local provenance in rural
    settings'
  level: must
confidence: medium
notes: 'From the council''s list (2022), pages 57-58. Listed in checklists 4-9, 14, 15, 19 and 22 (''Landscape
  Assessment and Landscaping Proposals''). Local requirement: the list (page 5) validates applications
  without formal pre-application advice on the national requirements only, and asks for local documents
  at validation only where the pre-application response listed them (otherwise the officer may ask during
  determination), so the rule ends with ''discretionary''.'
review-status: unverified
field-status: {}
