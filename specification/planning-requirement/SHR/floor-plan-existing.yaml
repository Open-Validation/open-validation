reference: floor-plan-existing
local-authority: SHR
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - demolition-con-area
      - lbc
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
      - mineral-extraction
  - all:
    - application-type:
        in:
        - outline-some
        - ldc-prospective-use
    - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor plans show the internal layout of the building.
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: Clearly annotated (existing and proposed), with each floor labelled
  level: must
- item: All relevant floor levels of the building(s) being built, altered or extended, in relation to
    the rest of the building
  level: must
- item: The use of each room and the position of windows and doors
  level: must
confidence: medium
notes: From the council's list (2022), page 49. Listed in checklists 1-4, 7-10, 19, 22 and 24 ('where
  applicable' in 5 and 13; local in 12, 20 and 23).
review-status: unverified
field-status: {}
