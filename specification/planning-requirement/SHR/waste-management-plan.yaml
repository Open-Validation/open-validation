reference: waste-management-plan
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - mineral-extraction
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development, of any size.
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Core Strategy CS19; Sustainable Design SPD
source-text: When submitting a planning application for residential development, irrelevant of the size
  of development, Shropshire Council will expect to see specific details of the proposed storage accommodation
  for waste and recyclable material.
must-include:
- item: Details of the proposed storage accommodation for waste and recyclable material
  level: must
confidence: medium
notes: 'From the council''s list (2022), page 75. Listed in checklists 4-9, 19 and 22 (''Site Waste Management
  Plan''). Local requirement: the list (page 5) validates applications without formal pre-application
  advice on the national requirements only, and asks for local documents at validation only where the
  pre-application response listed them (otherwise the officer may ask during determination), so the rule
  ends with ''discretionary''.'
review-status: unverified
field-status: {}
