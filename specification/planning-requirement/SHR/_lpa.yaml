  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'The link is the current 2022 Shropshire validation checklist, but Grokbot ignored its 24 application-type
    checklists. It marked Householder, Outline, Reserved matters, LBC, Advertisement, LDC, s73 and NMA
    as having no local requirements and dumped garbled or boilerplate excerpts under Full planning. It
    also missed key local items such as the River Clun checklist, Coal Mining Assessment, Affordable Housing
    statement/pro-forma, Noise, Land Contamination and Statement of Community Involvement. Fixed 2026-11-05:
    every file was rewritten from the council''s latest list.'
