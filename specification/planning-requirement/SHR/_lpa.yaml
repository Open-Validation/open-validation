  status: outdated
submission-standards:
- item: 'Email submissions: all documents and attachments saved in PDF format, one document per file,
    scanned at the correct orientation, files reduced/compressed; email size limit 15MB, file size 10MB;
    resolution under 100 pixels per inch'
  level: must
- item: 'Paper submissions: one copy of all documentation'
  level: must
- item: Plans, drawings and documents clearly legible (including after scanning), based on up-to-date
    information, owned by the applicant/agent, not previously used for another purpose, and showing the
    proposal clearly
  level: must
- item: Relevant scale clearly indicated, measurements in metric
  level: must
- item: Drawings clearly titled (e.g. existing front elevation, proposed site plan), and file names accurately
    reflect the content
  level: must
- item: Freehand sketches and pencil drawings are not acceptable; location and site plans not hand-drawn
  level: must
- item: Substandard-quality drawings are not accepted and make the application invalid
  level: must
