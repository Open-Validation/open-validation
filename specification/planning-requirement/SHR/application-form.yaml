reference: application-form
local-authority: SHR
required-if:
  always: true
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: All sections of the form should be completed.
must-include:
- item: Sections that do not apply crossed through or marked 'Not Applicable' / N/A
  level: must
- item: Hand-completed forms in BLOCK CAPITALS and legible
  level: must
- item: 'Open ground: a grid reference for the site address'
  level: must
  required-if: discretionary
- item: 'Formal pre-application advice: the reference number and officer''s name'
  level: must
  required-if: discretionary
- item: Any new vehicular access indicated on the form and shown on the plans
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: A new vehicular access is proposed.
- item: Site area in hectares, including all land needed for the development
  level: must
- item: Ownership Certificate completed and Declaration signed and dated
  level: must
confidence: medium
notes: From the council's list (2022), page 45. Listed in checklists 1-24 ('Completed Application Form').
review-status: unverified
field-status: {}
