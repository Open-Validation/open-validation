notes: 'From the council''s list (2022), page 67. Listed in checklists 4-9 and 19 (''Surface Water Management'';
  ''Drainage Assessment'' is also listed in 1, 2, 14, 15 and 22). Local requirement: the list (page 5)
  validates applications without formal pre-application advice on the national requirements only, and
  asks for local documents at validation only where the pre-application response listed them (otherwise
  the officer may ask during determination), so the rule ends with ''discretionary''. The list adds that
  an application may be validated without the SuDS Handbook checklist. The id is MHCLG''s retired SuDS
  id.'
