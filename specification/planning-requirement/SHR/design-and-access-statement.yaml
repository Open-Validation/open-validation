reference: design-and-access-statement
local-authority: SHR
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: A designated area (a Conservation Area or a World Heritage Site).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Creation of one or more houses.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Development of 100 square metres or more.
  - application-type:
      in:
      - lbc
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Shropshire
  Core Strategy 2006-2026
source-text: 'You’ll need to include a D&A if you’re applying for: • a major development (as defined in
  the article 2 of the Town and Country Planning (Development Management Procedure (England) Order 2015,
  whether it is an application for Full Planning Permission or Outline Planning Permission; • any development
  for the creation of one or more houses in a designated area*; • any development of 100 square metres
  or more in a designated area; • Listed Building Consent'
must-include:
- item: Scale, land use, amount, appearance, landscaping, layout and access
  level: should
- item: How relevant Core Strategy policies have been taken into account
  level: must
- item: 'Listed building consent / historic environment: the special architectural or historic interest
    of the building or site, the physical features affected, how its character and setting will be affected,
    and a justification of why the works are necessary'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (2022), pages 51-52. The headings are a suggested structure ('one suggested
  way').
review-status: unverified
field-status: {}
