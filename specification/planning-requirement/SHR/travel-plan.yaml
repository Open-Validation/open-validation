reference: travel-plan
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - mineral-extraction
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Core Strategy CS7
source-text: Travel plans are usually required for medium to large-scale developments involving uses other
  that just private housing.
must-include:
- item: Travel issues, how people travel to the site, an action plan, a car reduction target, and monitoring
    and reporting arrangements
  level: should
confidence: medium
notes: 'From the council''s list (2022), page 70. Listed in checklists 4-9, 19 and 22 (''Transport Assessment
  / Travel Plan''). Local requirement: the list (page 5) validates applications without formal pre-application
  advice on the national requirements only, and asks for local documents at validation only where the
  pre-application response listed them (otherwise the officer may ask during determination), so the rule
  ends with ''discretionary''.'
