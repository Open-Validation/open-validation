reference: planning-statement
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
      - pa-demo-building
      - mineral-extraction
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Shropshire Core Strategy 2006-2026; SAMDev
source-text: For more complex or larger proposals it may be helpful for a Planning Statement to be submitted
  with the application.
must-include:
- item: The context and need for the development, and how it accords with national and local planning
    policy
  level: must
- item: All material planning considerations in the SAMDev Plan and Core Strategy and national guidance,
    and conformity with any relevant supplementary guidance such as a development or planning brief
  level: must
- item: 'Where pre-application advice was received: a summary of it and how the proposal meets it'
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (2022), page 55. Listed in checklists 2-10, 12, 13, 18, 19 and 22. Local
  requirement: the list (page 5) validates applications without formal pre-application advice on the national
  requirements only, and asks for local documents at validation only where the pre-application response
  listed them (otherwise the officer may ask during determination), so the rule ends with ''discretionary''.'
review-status: unverified
field-status: {}
