reference: fire-statement
local-authority: SHR
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18m or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Relevant buildings are where there are two or more dwellings or educational accommodation
  in a building of 18m or more in height or more than 7 storeys.
confidence: medium
notes: From the council's list (2022), page 53. Listed in checklists 4-9 '(where applicable)'. The rule
  follows the national requirement (7 or more storeys).
review-status: unverified
field-status: {}
