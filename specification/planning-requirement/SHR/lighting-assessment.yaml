reference: lighting-assessment
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - advertising
      - mineral-extraction
  - any:
    - condition:
        field: external-lighting
        value: true
        description: External illumination is proposed.
    - condition:
        field: illuminated
        value: true
        description: An illuminated advertisement.
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Core Strategy CS6, CS17
source-text: Full details of any proposed external illumination should be included with the application.
must-include:
- item: Proposed hours of operation, light spillage, level of illumination and column heights
  level: must
- item: A layout plan showing beam orientation and spread
  level: must
- item: The type of light fixing (e.g. wall mounted or free-standing columns)
  level: must
- item: Proposed mitigation measures
  level: must
- item: 'Floodlighting, particularly for sports grounds or near homes: a lighting impact statement'
  level: must
  required-if:
    condition:
      field: floodlighting
      value: true
      description: Floodlighting.
confidence: medium
notes: 'From the council''s list (2022), pages 60-61. Listed in checklists 4-9, 11 (illuminated adverts),
  19 and 22. Local requirement: the list (page 5) validates applications without formal pre-application
  advice on the national requirements only, and asks for local documents at validation only where the
  pre-application response listed them (otherwise the officer may ask during determination), so the rule
  ends with ''discretionary''.'
review-status: unverified
field-status: {}
