reference: elevation-proposed
local-authority: SHR
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - reserved-matters
      - demolition-con-area
      - lbc
      - advertising
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-agri-to-flexcom
      - cho-agri-to-school
      - cho-comm-to-school
      - cho-amusements-to-dwh
      - mineral-extraction
      - pa-build-agri-forest
  - all:
    - application-type:
        in:
        - outline-some
        - ldc-prospective-use
    - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Elevation drawings show what a building will look like from the outside.
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: Clearly annotated (existing and proposed)
  level: must
- item: Every elevation affected, stating the direction each faces, e.g. rear (south)
  level: must
- item: 'For extensions: the proposal in relation to the whole of the existing property'
  level: must
- item: Outline elevations of other buildings close to the development
  level: must
- item: Position and size of all windows and doors (existing and proposed)
  level: must
- item: Not freehand sketches or pencil drawings
  level: must
- item: 'Advertisements: drawings showing size, siting, materials and colours, height above ground, projection
    and the method and colour(s) of illumination'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Advertisement drawing(s) showing advertisement size, siting, materials and colours to be
    used, height above ground, extent of projection and details of method and colour(s) of illumination
confidence: medium
notes: From the council's list (2022), page 49. Listed in checklists 1-4, 7-11, 14 (proposed only), 19,
  22 and 24 ('where applicable' in 5 and 13; local in 12, 20 and 23).
review-status: unverified
field-status: {}
