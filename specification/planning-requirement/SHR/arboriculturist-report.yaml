reference: arboriculturist-report
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - lbc
      - ldc-prospective-use
      - pa-ecomms-network
      - mineral-extraction
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees or hedges on or next to the development site.
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: BS5837:2012; Core Strategy CS5, CS6, CS17; SAMDev MD2, MD12
source-text: 'In summary, in support of a planning application Shropshire Council seeks the following
  minimum arboricultural information:'
must-include:
- item: Tree survey
  level: must
- item: Tree retention / removal plan
  level: must
- item: Retained trees and root protection areas shown on the proposed layout
  level: must
- item: Strategic hard and soft landscape design (BS8545:2014)
  level: must
- item: Arboricultural impact assessment
  level: must
- item: 'Where construction is proposed in an RPA: existing and finished levels, tree protection plan,
    arboricultural method statement and special engineering details'
  level: should
  required-if:
    condition:
      field: tree-rpa-encroachment
      value: true
      description: Construction within a root protection area.
- item: Prepared by a competent arborist
  level: must
confidence: medium
notes: 'From the council''s list (2022), pages 63-64. Listed in checklists 1-9, 13, 16, 19 and 22 (''Tree
  Survey/ Arboricultural Impact Assessment/ Tree Protection Plan/ Method Statement''). Local requirement:
  the list (page 5) validates applications without formal pre-application advice on the national requirements
  only, and asks for local documents at validation only where the pre-application response listed them
  (otherwise the officer may ask during determination), so the rule ends with ''discretionary''.'
review-status: unverified
field-status: {}
