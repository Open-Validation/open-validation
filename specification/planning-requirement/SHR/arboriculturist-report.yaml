reference: arboriculturist-report
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - ldc-prospective-use
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees or hedges on or near the site that could be affected.
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
source-text: Arboricultural Impact Assessment Evaluates the direct and indirect effects of the proposed
  development and, where necessary, recommends mitigation.
must-include:
- item: Arboricultural Method Statement, for operations within or affecting the canopy spread or root
    protection area of retained trees and hedges
  level: should
  source-text: Arboricultural Method Statement A Method Statement may be required for any operations (
    including demolition, site clearance and levelling, installation of utilities and construction activities)
    proposed within or that could affect, the canopy spread or root protection area of retained trees
    and hedges.
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (wrong_app_type):
  Tree Survey/AIA/TPP/AMS is listed in the householder, full, outline, reserved matters and proposed lawful
  development checklists.'
review-status: unverified
field-status: {}
