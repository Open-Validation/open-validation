reference: biodiversity-survey-report
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - lbc
      - ldc-existing-use
      - ldc-prospective-use
      - pa-build-agri-forest
      - pa-road-agri-forest
      - pa-ecomms-network
      - pa-demo-building
      - s73
      - mineral-extraction
  - any:
    - condition:
        field: protected-species
        value: true
        description: Legally protected or priority species may be present and affected.
    - site:
        in:
        - priority-habitat
        description: Priority habitats may be present and affected.
    - site:
        in:
        - sssi-impact-risk-zone
        - site-of-special-scientific-interest
        - special-area-of-conservation
        description: In, or within an Impact Risk Zone for, an internationally or nationally designated
          wildlife site.
    - condition:
        field: geodiversity-interest
        value: true
        description: A Natural Asset listed in SAMDev policy MD12.
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: SAMDev MD12; Core Strategy CS6, CS17
source-text: An Ecological Assessment will be needed where legally protected or priority animals, plants,
  fungi or habitats may be present and may be affected by the development.
must-include:
- item: Carried out by a qualified, experienced ecologist with the relevant licences, following nationally
    accepted guidance
  level: must
- item: Extended Phase 1 habitat survey, habitat map and target notes (including the Shropshire Environmental
    Network)
  level: must
- item: Desk study of historical species records and designated sites
  level: must
- item: Supplementary detailed (phase 2 / species) surveys as appropriate
  level: must
- item: Evaluation of importance, and analysis of direct and indirect impacts
  level: must
- item: Avoidance, mitigation or compensation measures, with method statements and site plans where appropriate
  level: must
- item: Losses or gains to priority habitats or the Environmental Network (hectares)
  level: must
- item: Legal implications, such as European Protected Species licences
  level: must
- item: Proposed biodiversity or geodiversity enhancement measures
  level: must
- item: Less than 3 years old (depending on species)
  level: must
confidence: medium
notes: 'From the council''s list (2022), pages 58-59. Listed in checklists 1-10, 12-16, 18-20 and 22.
  Local requirement: the list (page 5) validates applications without formal pre-application advice on
  the national requirements only, and asks for local documents at validation only where the pre-application
  response listed them (otherwise the officer may ask during determination), so the rule ends with ''discretionary''.
  The list says an assessment ''will always be required'' in or near an SSSI/SAC Impact Risk Zone or a
  Natural Asset; the Natural Asset part uses geodiversity-interest as the closest field.'
review-status: unverified
field-status: {}
