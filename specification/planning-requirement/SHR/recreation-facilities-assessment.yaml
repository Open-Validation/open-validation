reference: recreation-facilities-assessment
local-authority: SHR
required-if:
  all:
  - any:
    - site:
        in:
        - open-space
        description: Development within open spaces.
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of open space.
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: 'Core Strategy CS6; Planning Guidance: Open Space'
source-text: For development within open spaces, application proposals should be accompanied by plans
  showing any areas of existing or proposed open space within or adjoining the application site.
must-include:
- item: Plans of existing or proposed open space within or adjoining the site
  level: must
- item: An independent assessment that the land or buildings are surplus to requirements
  level: should
confidence: medium
notes: 'From the council''s list (2022), page 65. Local requirement: the list (page 5) validates applications
  without formal pre-application advice on the national requirements only, and asks for local documents
  at validation only where the pre-application response listed them (otherwise the officer may ask during
  determination), so the rule ends with ''discretionary''. Not named in any application-type checklist.'
review-status: unverified
field-status: {}
