reference: air-quality-assessment
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - s73
      - mineral-extraction
  - any:
    - site:
        in:
        - air-quality-management-area
        description: Adverse impact in a declared Air Quality Management Area.
    - condition:
        field: sensitive-end-use
        value: true
        description: Sensitive development (e.g. residential) near sources of air pollution.
    - condition:
        field: traffic-aadt-increase
        operator: '>'
        value: 5
        description: A change in AADT or peak traffic of more than 5% or 10% (typically on a road with
          more than 10,000 AADT).
    - condition:
        field: parking-spaces
        operator: '>'
        value: 300
        description: New parking of more than 300 spaces.
    - condition:
        field: direct-air-emissions
        value: true
        description: Activity regulated under Pollution Prevention and Control, or direct emissions to
          air.
    - condition:
        field: dust-generation
        value: true
        description: Significant dust emissions where people would be exposed.
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Core Strategy CS6
source-text: The decision as to whether an Air Quality Assessments is required requires judgement. … An
  Air Quality Assessment should be submitted where the proposal would result in an adverse impact in any
  declared Air Quality Management Area. In addition, an assessment should be made when sensitive development
  (e.g. residential use) is proposed close to land uses that may be a source of air pollution (e.g. highly
  trafficked roads or industrial uses).
confidence: medium
notes: 'From the council''s list (2022), pages 71-72. Listed in checklists 4-9, 19, 20 and 22. Local requirement:
  the list (page 5) validates applications without formal pre-application advice on the national requirements
  only, and asks for local documents at validation only where the pre-application response listed them
  (otherwise the officer may ask during determination), so the rule ends with ''discretionary''. The list''s
  other criteria (''may help define'') include traffic composition changes and development in sensitive
  areas.'
review-status: unverified
field-status: {}
