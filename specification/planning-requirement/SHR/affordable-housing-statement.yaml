reference: affordable-housing-statement
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more open market houses (market towns and other key centres).
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: 5 or more open market houses.
      - site:
          in:
          - designated-rural-area
          description: In a designated rural area.
  - condition:
      field: market-housing-proposed
      value: true
      description: Open market dwellings are proposed.
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Core Strategy CS11; Type and Affordability of Housing SPD
source-text: Applications for open market dwellings which aim to provide 10 or more houses in the market
  towns and other key centres and 5 or more houses in designated rural areas, must be accompanied by an
  Affordable Housing Contributions Statement.
must-include:
- item: The market housing proposed, including the number and size of units
  level: must
- item: The proposed number of affordable units and the type of affordability or tenure, or the off-site
    financial contribution where on-site delivery does not apply
  level: must
confidence: medium
notes: 'From the council''s list (2022), page 68. Listed in checklists 4-9 and 19 (''Affordable Housing
  Statement''). Local requirement: the list (page 5) validates applications without formal pre-application
  advice on the national requirements only, and asks for local documents at validation only where the
  pre-application response listed them (otherwise the officer may ask during determination), so the rule
  ends with ''discretionary''.'
review-status: unverified
field-status: {}
