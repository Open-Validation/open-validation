reference: affordable-housing-statement
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Open-market schemes of 10 or more houses in market towns and key centres.
    - all:
      - site:
          in:
          - designated-rural-area
          description: The site is in a designated rural area.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: Open-market schemes of 5 or more houses.
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
must-include:
- item: Affordable Housing S106 pro-forma
  level: must
confidence: medium
notes: 'From the audit (missing_requirement): open-market schemes of 10+ houses in market towns/key centres,
  5+ in designated rural areas (checklists 4, 5, 6 and 19).'
review-status: unverified
field-status: {}
