reference: site-plan
local-authority: SHR
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - demolition-con-area
    - lbc
    - advertising
    - ldc-prospective-use
    - pa-build-agri-forest
    - pa-road-agri-forest
    - cho-agri-to-dwh
    - cho-commercial-to-dwh
    - cho-commercial-to-mixed
    - cho-sui-to-dwh
    - cho-agri-to-flexcom
    - cho-agri-to-school
    - cho-comm-to-school
    - cho-amusements-to-dwh
    - mineral-extraction
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: a site, or block, plan shows the proposed development in context to the proposal site.
must-include:
- item: Based on an up-to-date map; not hand-drawn
  level: must
- item: At an identified standard metric scale (typically 1:500), with the scale and direction of north
    clearly marked, and a scale bar
  level: must
- item: Scaled to fit an A3 or A4 document
  level: must
- item: The proposed development in relation to the site boundaries and other existing buildings, with
    dimensions including those to the boundaries, all plotted to scale
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: Separate existing and proposed site plans
  level: should
- item: Buildings to be demolished identified and labelled
  level: must
- item: 'Outline with all matters reserved: the position of vehicular access'
  level: must
  required-if:
    application-type:
      in:
      - outline-all
  source-text: Block (Site) Plan showing the position of vehicular access
- item: 'Prior notification of an agricultural road: detailed drawings of the road layout and visibility
    splay'
  level: must
  required-if:
    application-type:
      in:
      - pa-road-agri-forest
  source-text: Detailed Drawings showing road layout and visibility splay
confidence: medium
notes: From the council's list (2022), page 47. Listed in checklists 1-11, 13-15, 19, 22 and 24 (also
  local in 20 and 23; an existing site survey plan is local in 12).
review-status: unverified
field-status: {}
