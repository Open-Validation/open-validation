reference: transport-assessment
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - mineral-extraction
  - ref: major-development
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Core Strategy CS7
source-text: A transport assessment identifies what measures will be taken to deal with the anticipated
  transport impacts of the development scheme in relation to all forms of travel and will be required
  for all major development.
must-include:
- item: All existing and proposed vehicular and pedestrian movements, the maximum daily movements, routes
    and vehicle types/sizes
  level: must
- item: Loading areas and arrangements for manoeuvring, servicing and parking
  level: must
confidence: medium
notes: 'From the council''s list (2022), page 70. Listed in checklists 4-9, 19 and 22 (''Transport Assessment
  / Travel Plan''). Local requirement: the list (page 5) validates applications without formal pre-application
  advice on the national requirements only, and asks for local documents at validation only where the
  pre-application response listed them (otherwise the officer may ask during determination), so the rule
  ends with ''discretionary''.'
review-status: unverified
field-status: {}
