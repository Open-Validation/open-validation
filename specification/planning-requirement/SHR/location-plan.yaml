reference: location-plan
local-authority: SHR
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - demolition-con-area
    - lbc
    - advertising
    - ldc-existing-use
    - ldc-prospective-use
    - prior-approval
    - hedgerow-removal
    - mineral-extraction
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A location plan shows the proposal site in context to the surrounding area, roads and buildings
must-include:
- item: Based on an up-to-date map; not hand-drawn; application site centred on the page
  level: must
- item: At an identified standard metric scale (typically 1:1250 town centre or 1:2500 rural), with the
    scale and direction of north clearly marked
  level: must
- item: Scaled to fit an A3 or A4 document, stating the paper size
  level: must
- item: Enough roads and/or buildings on adjoining land to make the exact location clear
  level: should
- item: All land needed for the development outlined in red, and other land owned by the applicant close
    to or adjacent to the site outlined in blue
  level: must
- item: All public rights of way crossing or adjoining the site
  level: must
- item: 'Ordnance Survey based: not a Land Registry document, not used for multiple applications, not
    a photocopy or screen grab; shows ''© Crown copyright and database right 20xx'', an OS licence number
    and OS or licensed partner branding'
  level: must
- item: 'Hedgerow removal: the location and length of the hedgerow(s) to be removed, preferably at 1:12500'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
confidence: medium
notes: From the council's list (2022), pages 8, 47-48. Listed in checklists 1-19, 22 and 24 (also a local
  requirement in 20 and 23).
review-status: unverified
field-status: {}
