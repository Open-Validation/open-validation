reference: noise-assessment
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - demolition-con-area
      - s73
      - pa-build-agri-forest
      - pa-ecomms-network
      - mineral-extraction
  - any:
    - condition:
        field: noise-generating-use
        value: true
        description: A scheme which generates significant noise.
    - condition:
        field: noise-sensitive-use
        value: true
        description: A sensitive development near a source of noise.
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Core Strategy CS6; BS4142; BS8233
source-text: If a scheme is proposed w h i c h generates significant noise or a sensitive development
  is proposed near a source of noise then a Noise Impact Assessment should be submitted.
confidence: medium
notes: 'From the council''s list (2022), page 73. Listed in checklists 4-9, 14, 16 (''Acoustic report''),
  19, 20 and 22. Local requirement: the list (page 5) validates applications without formal pre-application
  advice on the national requirements only, and asks for local documents at validation only where the
  pre-application response listed them (otherwise the officer may ask during determination), so the rule
  ends with ''discretionary''.'
review-status: unverified
field-status: {}
