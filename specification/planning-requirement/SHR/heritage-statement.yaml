reference: heritage-statement
local-authority: SHR
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - world-heritage-site
      - conservation-area
      - listed-building
      - listed-building-setting
      - scheduled-monument
      - park-and-garden
      - battlefield
      description: Proposals within or affecting a designated heritage asset, including effects on its
        setting.
  - site:
      in:
      - locally-listed-building
      - historic-environment-record
      description: Non-designated heritage assets, including sites in historic settlement cores with (potential)
        archaeological interest.
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: NPPF paragraph 189; SAMDev MD13; Core Strategy CS5, CS6, CS17
source-text: Situations in which a Heritage Assessment will be required include any proposals within or
  affecting a Designated Heritage Asset (see above) and Non-Designated Heritage Assets, including sites
  within the cores of historic settlements which are considered to have, or have the potential to have,
  archaeological interest.
must-include:
- item: The Shropshire Historic Environment Record consulted and the heritage assets assessed with appropriate
    expertise
  level: must
- item: The significance of the heritage assets, including the contribution made by their settings
  level: must
- item: A qualitative visual assessment of how the proposal affects the heritage significance of its surroundings
  level: must
  required-if: discretionary
- item: 'Sites with (potential) archaeological interest: a desk-based assessment and, where necessary,
    a field evaluation'
  level: must
  required-if:
    site:
      in:
      - historic-environment-record
      description: Heritage assets with archaeological interest.
confidence: medium
notes: From the council's list (2022), pages 8, 52-53. Listed in checklists 1-10 as a national requirement
  '(where applicable)' (always for listed building consent); local in 11-13 and 18, 22.
review-status: unverified
field-status: {}
