reference: site-restoration
local-authority: SHR
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
  - discretionary
source-url: https://next.shropshire.gov.uk/media/xsnj0cye/validation-checklist-2022.pdf
policy: Core Strategy CS20; SAMDev MD17
source-text: Applications for mineral working must be accompanied by a satisfactory reclamation scheme.
must-include:
- item: A reclamation scheme providing, where practicable, for progressive reclamation, with the proposed
    after use and how it will be achieved
  level: must
- item: 'Restoration to agriculture, forestry, amenity and/or nature conservation within 2 years of starting:
    the aftercare scheme (5-year aftercare)'
  level: must
  required-if: discretionary
- item: 'Otherwise: the commitment to aftercare and the main aftercare strategy'
  level: must
- item: A management plan for the long-term after use
  level: should
confidence: medium
notes: 'From the council''s list (2022), pages 78-79. Listed in checklists 22 (''Reclamation, Aftercare
  and Management Plans''). Local requirement: the list (page 5) validates applications without formal
  pre-application advice on the national requirements only, and asks for local documents at validation
  only where the pre-application response listed them (otherwise the officer may ask during determination),
  so the rule ends with ''discretionary''. The id is MHCLG''s retired site restoration id. As minerals
  planning authority the council lists this with the minerals notes.'
review-status: unverified
field-status: {}
