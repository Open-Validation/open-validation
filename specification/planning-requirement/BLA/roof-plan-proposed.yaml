reference: roof-plan-proposed
local-authority: BLA
required-if: discretionary
source-url: https://www.blaby.gov.uk/planning-and-building/planning-applications/validation/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Scaled plans should include elevations, floor, roof, sections or any other plans which demonstrate
  the proposed development. Any plans submitted should be provided as existing and proposed plans
must-include:
- item: Drawn at an identified metric scale (typically 1:50 or 1:100) on a recognised paper size (typically
    A4 or A3), with the scale and paper size noted on the plan (for example 'scale 1:100 @ A4')
  level: must
- item: A scale bar or critical dimensions
  level: must
- item: A title saying what the plan shows (for example 'Existing Ground Floor Plan')
  level: should
- item: The proposal in context of neighbouring structures, where applicable
  level: should
confidence: medium
notes: 'From the council''s list (published as its ''Validation'' web page, last updated 12 February 2026),
  section ''Scale Plans''. Shown as ''check'': the page says all applications should include scale plans,
  provided as existing and proposed, but it does not say which drawings (elevations, floor, roof, sections)
  a given proposal needs; that depends on what demonstrates the development.'
