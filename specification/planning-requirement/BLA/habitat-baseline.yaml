reference: habitat-baseline
local-authority: BLA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.blaby.gov.uk/planning-and-building/planning-applications/validation/
policy: Town and Country Planning Act 1990 Schedule 7A (inserted by the Environment Act 2021)
source-text: 'Except for some exempt applications BNG is required, and the following information will
  need to be submitted: ... Plan(s), drawn to an identified scale and showing the direction of North,
  showing onsite habitat existing on the date of application (or earlier proposed date), including any
  irreplaceable habitat (if applicable)'
must-include:
- item: Drawn to an identified scale, with the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or earlier proposed date)
  level: must
- item: Any irreplaceable habitat
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: There is irreplaceable habitat on the land.
confidence: medium
notes: From the council's list (published as its 'Validation' web page, last updated 12 February 2026),
  section 'Biodiversity Net Gain (BNG)'. Required by law where the biodiversity gain condition applies;
  householder and other exempt applications are exempt.
review-status: unverified
field-status: {}
