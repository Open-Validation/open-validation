  level: must
- item: Drawings to scale with a scale bar or critical dimensions
  level: must
- item: Each plan titled with what it shows (for example 'Existing Ground Floor Plan')
  level: should
- item: Plans provided as existing and proposed, understandable by third parties such as neighbours
  level: should
