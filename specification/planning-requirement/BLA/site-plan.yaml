reference: site-plan
local-authority: BLA
required-if:
  always: true
source-url: https://www.blaby.gov.uk/planning-and-building/planning-applications/validation/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'all applications should include: Application Form Location & Site Plans ... A Site Plan
  must additionally show any alterations or material information within the site such as parking provision
  or existing structures.'
must-include:
- item: Based on an up-to-date Ordnance Survey map, at an identified standard metric scale
  level: must
- item: Site boundary outlined in red, any additional land owned by the applicant in blue, and the direction
    of north
  level: must
- item: Any alterations or material information within the site, such as parking provision or existing
    structures
  level: must
confidence: medium
notes: From the council's list (published as its 'Validation' web page, last updated 12 February 2026),
  section 'Location and Site Plans'. The page gives the location plan's rules for 'the location and site
  plans' together, then adds what a site plan must show.
review-status: unverified
field-status: {}
