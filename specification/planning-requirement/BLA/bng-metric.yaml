reference: bng-metric
local-authority: BLA
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.blaby.gov.uk/planning-and-building/planning-applications/validation/
policy: Town and Country Planning Act 1990 Schedule 7A (inserted by the Environment Act 2021)
source-text: 'Except for some exempt applications BNG is required, and the following information will
  need to be submitted: ... The completed metric calculation tool showing the calculations of the pre-development
  biodiversity value of the onsite habitat on the date of application (or proposed earlier date) including
  the publication date of the biodiversity metric used to calculate that value'
must-include:
- item: Confirmation that the applicant believes the development would be subject to the biodiversity
    gain condition
  level: must
- item: The pre-development biodiversity value(s), on the date of application or an earlier proposed date
  level: must
- item: The earlier date and the reasons for proposing it
  level: must
  required-if: discretionary
  source-text: Where the applicant proposes to use an earlier date, this proposed earlier date and the
    reasons for proposing that date
- item: Completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat, with the publication date of the metric used
  level: must
- item: 'Statement whether activities before that date lost onsite biodiversity value (''degradation'');
    where they did: the date immediately before, the value on that date, the completed metric and any
    supporting evidence'
  level: must
- item: Description of any irreplaceable habitat on the land on the date of application (or earlier date)
  level: must
confidence: medium
notes: From the council's list (published as its 'Validation' web page, last updated 12 February 2026),
  section 'Biodiversity Net Gain (BNG)'. Required by law where the biodiversity gain condition applies;
  householder and other exempt applications are exempt.
review-status: unverified
field-status: {}
