reference: location-plan
local-authority: BLA
required-if:
  always: true
source-url: https://www.blaby.gov.uk/planning-and-building/planning-applications/validation/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'all applications should include: Application Form Location & Site Plans ... The location
  and site plans must be based on an up-to-date Ordnance Survey map using an identified standard metric
  scale (typically 1:1250 or 1:2500 for larger sites).'
must-include:
- item: Based on an up-to-date Ordnance Survey map
  level: must
- item: At an identified standard metric scale (typically 1:1250, or 1:2500 for larger sites)
  level: must
- item: Site boundary outlined in red
  level: must
- item: Any additional land owned by the applicant outlined in blue
  level: must
- item: Direction of north
  level: must
- item: Name or number of neighbouring sites
  level: must
- item: Two named roads, where possible
  level: must
confidence: medium
notes: From the council's list (published as its 'Validation' web page, last updated 12 February 2026),
  section 'Location and Site Plans'.
review-status: unverified
field-status: {}
