reference: landscaping-plan
local-authority: HYN
required-if:
  any:
  - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - outline-some
        - outline-all
        - reserved-matters
    - discretionary
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      description: Proposals with the potential to impact on heritage assets (e.g. listed buildings, conservation
        areas).
  - discretionary
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: 'Required for: • Major and Most Full Applications • Some outline/reserved matters applications
  • Other applications as identified during pre-application discussions or during the application process
  • Proposals which have the potential to impact on heritage assets (e.g. listed buildings/conservation
  areas)'
must-include:
- item: Proposed ground levels, means of enclosure, car parking layouts, vehicle and pedestrian access
    and circulation areas, hard surfacing materials and structures including street furniture
  level: should
- item: Proposed and existing functional services above and below ground (drainage, power/communication
    cables, manholes)
  level: should
- item: Planting plans and schedules noting species, plant sizes and proposed numbers/planting densities
  level: should
- item: Existing vegetation to be retained, with measures for its protection during construction
  level: should
- item: Long term maintenance and management
  level: should
- item: 'Phased major schemes: a landscape strategy'
  level: should
  required-if:
    all:
    - ref: major-development
    - discretionary
confidence: medium
notes: From the council's list (adopted June 2025), pages 28 and 29. 'Most' full applications, 'some'
  outline/reserved matters applications and others identified at pre-application stage show as 'check'.
  The Landscape and Visual Impact Assessment the list asks for on sensitive sites is in the unmapped list.
review-status: unverified
field-status: {}
