source-text: '42. Refuse storage facilities/recycling details Required for developments which include:
  • New dwellings • New retail and business development • New industrial developments Details of the proposed
  facilities for the storage & collection of refuse, as well as for the provision of recycling facilities,
  will be required for these developments'
must-include:
- item: Facilities for the storage and collection of refuse, and for recycling
  level: must
