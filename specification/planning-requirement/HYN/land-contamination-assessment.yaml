reference: land-contamination-assessment
local-authority: HYN
required-if:
  any:
  - site:
      in:
      - contaminated-land
      description: Contamination is known or suspected (e.g. landfill sites, or land with an industrial
        use history).
  - condition:
      field: sensitive-end-use
      value: true
      description: The proposed use would be particularly vulnerable to ground contaminants (e.g. allotments,
        residential use, schools).
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: Contamination is known or suspected (e.g. landfill sites, or land with an industrial use
  history) • The proposed use would be particularly vulnerable to ground contaminants (e.g. allotments,
  residential use, schools)
must-include:
- item: A Phase I Desk Study, normally, for a sensitive end use on a site that is or may be contaminated
    by previous uses
  level: should
  required-if:
    all:
    - condition:
        field: sensitive-end-use
        value: true
        description: Sensitive end use.
    - site:
        in:
        - contaminated-land
        description: Site is or may be contaminated.
- item: A Phase II intrusive investigation where the site is known to have high levels of contamination
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted June 2025), page 38. The Phase II investigation 'may also be required',
  so it shows as 'check'.
review-status: unverified
field-status: {}
