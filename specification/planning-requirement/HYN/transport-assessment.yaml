reference: transport-assessment
local-authority: HYN
required-if:
  any:
  - ref: major-development
  - discretionary
  - condition:
      field: level-crossing-impact
      value: true
      description: Development affecting or adjacent to a level crossing.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: All Major Residential or Commercial Developments • Wherever specified during pre-application
  discussions • Developments affecting or adjacent to a level crossing
must-include:
- item: Quantifies and assesses the impact on traffic movement and highway safety, with any proposals
    for access or transport improvements
  level: should
confidence: medium
notes: 'From the council''s list (adopted June 2025), pages 30 and 31. A table on page 31 (an image, keyed
  to the old use classes) gives floorspace thresholds: most are 1,000 sq m or more, or 100 dwellings,
  which major development already covers; the 250 sq m threshold for a residential college/school and
  ''Wherever specified during pre-application discussions'' show as ''check''. A lighter Transport Statement
  suits smaller schemes.'
