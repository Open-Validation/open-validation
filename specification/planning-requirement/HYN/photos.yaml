reference: photos
local-authority: HYN
required-if:
  any:
  - condition:
      field: demolition
      value: true
      description: The proposal involves the demolition of an existing building.
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - locally-listed-building
      description: The proposal affects a Conservation Area, Listed Building or other heritage asset or
        its setting.
  - condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
  - condition:
      field: building-height
      operator: '>'
      value: 18
      description: A building over 18m in height.
  - condition:
      field: tall-building
      value: true
      description: A building substantially taller than the surrounding buildings, or with a significant
        impact on the skyline.
  - discretionary
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: 'Photographs should be provided if: • The proposal involves the demolition of an existing
  building • The proposal affects a Conservation Area or Listed Building. • The proposal would affect
  a heritage asset or its setting • The application is for wind turbines. • They are requested during
  pre-application discussions • The proposal is for a building over 18m in height • The proposal is for
  a building of any height which is substantially taller than the predominant height if surrounding buildings
  • The proposal would make a significant impact on the skyline • The proposal would have a significant
  impact on the townscape or landscape'
confidence: medium
notes: From the council's list (adopted June 2025), page 42. Photomontages are covered too. Requests at
  pre-application stage and 'significant impact on the townscape or landscape' show as 'check'.
review-status: unverified
field-status: {}
