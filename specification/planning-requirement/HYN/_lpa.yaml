submission-standards:
- item: All drawings include a drawing reference number (stamped plans are not issued)
  level: should
- item: All scaled drawings include a linear scale bar and state the paper print size (e.g. 'print off
    at A3')
  level: should
- item: 'Paper applications: 1 copy of each document, plan and form, plus 1 copy of all application documents
    on a USB memory stick in PDF format'
  level: must
- item: Plans at A4/A3 where possible; avoid high definition colour, large file sizes, ring binding and
    password protection; include a document schedule
  level: should
- item: Documents with commercially sensitive or personal information submitted twice, one copy redacted
    for publication (with an executive summary where sections are exempt)
  level: should
- item: Plans submitted for illustrative purposes with outline applications clearly marked 'Illustrative'
  level: should
