reference: elevation-proposed
local-authority: HYN
required-if:
  any:
  - condition:
      field: demolition
      value: true
      description: Existing buildings are proposed to be demolished.
  - condition:
      field: external-alterations
      value: true
      description: Existing buildings are proposed to be altered.
  - condition:
      field: new-build
      value: true
      description: New buildings are proposed.
  - application-type:
      in:
      - advertising
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015; Town and Country
  Planning (Control of Advertisements) (England) Regulations 2007
source-text: '17. Existing and proposed elevations & roof plans Required for applications where: • Existing
  buildings are proposed to be demolished or altered • New buildings are proposed ... They are also required
  for Applications for Advertisement Consent to show:'
must-include:
- item: Drawn to a recognised metric scale, preferably 1:50 or 1:100
  level: should
- item: Annotated with dimensions, including height to eaves and ridge
  level: should
- item: Existing and proposed external materials
  level: should
- item: All sides of the proposal
  level: should
- item: The relationship with any adjoining building or building within 2 metres, with the positions of
    any openings on each property
  level: should
- item: 'Advertisements: size and position of the advertisement in relation to the site and buildings;
    height above ground; projection; sections; materials and colours; method of fixing'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Listed building consent with elevational changes: elevations typically at 1:20'
  level: should
  required-if:
    all:
    - application-type:
        in:
        - lbc
    - condition:
        field: external-alterations
        value: true
        description: Elevational changes are proposed.
  source-text: Elevation drawings for applications for Listed Building Consent should typically be provided
    at a scale of 1:20.
confidence: medium
notes: From the council's list (adopted June 2025), pages 18, 19 and 20. Includes section 22 (Listed building
  plans).
review-status: unverified
field-status: {}
