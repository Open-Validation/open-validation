reference: planning-statement
local-authority: HYN
required-if:
  any:
  - ref: major-development
  - condition:
      field: departure-from-development-plan
      value: true
      description: The development is not in accordance with the development plan.
  - discretionary
  - application-type:
      in:
      - advertising
  - condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: 'Required: • For all major developments • For developments not in accordance with the development
  plan • When requested in association with pre application advice • For applications for advertisement
  consent to address amenity & public safety • For wind turbines: o to address why the turbine is needed
  o to provide details of wind speeds o to provide evidence of the feasibility of energy generation o
  to include a shadow flicker report'
must-include:
- item: The need for the development and how it relates to national and local policy
  level: must
- item: 'Advertisements: amenity and public safety'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Wind turbines: why the turbine is needed, wind speeds, evidence of the feasibility of energy
    generation, and a shadow flicker report'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
confidence: medium
notes: From the council's list (adopted June 2025), page 22. 'When requested in association with pre application
  advice' shows as 'check'.
review-status: unverified
field-status: {}
