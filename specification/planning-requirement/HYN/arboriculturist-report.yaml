reference: arboriculturist-report
local-authority: HYN
required-if:
  any:
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Development affecting trees within or adjacent to the site.
  - all:
    - all:
      - condition:
          field: demolition
          value: true
          description: Demolition of a building or structure.
      - site:
          in:
          - conservation-area
          description: In a Conservation Area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Development affecting trees within or adjacent to the site.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: BS 5837:2012 Trees in relation to design, demolition and construction
source-text: '28. Tree survey Required for: • All developments affecting trees within or adjacent to the
  development site'
must-include:
- item: Arboricultural Impact Assessment incorporating a tree survey, by an appropriately qualified arboriculturalist,
    to BS 5837 (2012)
  level: must
- item: 'Survey of trees and hedgerows within or adjacent to the site: species, height and canopy diameter,
    located on a tree constraints plan'
  level: must
- item: Trees and hedgerows to be retained and removed, with a tree retention and removal plan
  level: must
- item: 'For retained trees and hedgerows: an Arboricultural Method Statement (site preparation and earthworks)
    and a Tree Protection Plan'
  level: must
- item: A tree shading analysis where retained or new trees could shade buildings or gardens of dwellings
  level: must
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Retained or newly planted trees could shade buildings or gardens of dwellings.
- item: Clear justification for trees and hedgerows to be removed
  level: must
- item: Trees within adjacent properties that may be affected shown
  level: should
confidence: medium
notes: From the council's list (adopted June 2025), pages 23 and 24. The list says the survey is essential
  where trees have a Tree Preservation Order or are in a Conservation Area; the trigger already covers
  them.
review-status: unverified
field-status: {}
