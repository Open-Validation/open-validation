reference: sustainable-drainage-strategy
local-authority: HYN
required-if:
  any:
  - ref: major-development
  - site:
      in:
      - flood-risk-zone
      - surface-water-flood-risk
      description: Development with surface water drainage in Flood Zone 2 or 3, or at risk of surface
        water flooding.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: '39. Drainage strategy Required for: • major development with surface water drainage • development
  with surface water drainage in an area at risk of flooding such as flood zones 2 or 3, or at risk of
  surface water flooding'
must-include:
- item: How the drainage hierarchy has been assessed (infiltration; surface water body; surface water
    sewer, highway drain or other system; combined sewer), with reasons for discounting higher options
  level: must
- item: 'Where connecting to the existing drainage system: the existing system and the proposed drainage
    within the site shown on the drawings'
  level: should
- item: 'Disposal of surface water run-off: location and ownership of existing drains used; for SuDS,
    enough engineering, geotechnical and hydrological information to show feasibility'
  level: should
- item: 'Major applications: the Lancashire Sustainable Drainage Systems (SuDS) pro-forma'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (adopted June 2025), pages 36 and 37. Uses MHCLG's retired 'sustainable-drainage-strategy'
  id for the drainage strategy.
review-status: unverified
field-status: {}
