reference: sci
local-authority: HYN
required-if:
  any:
  - all:
    - ref: major-development
    - discretionary
  - all:
    - condition:
        field: wind-turbine
        value: true
        description: Wind turbines for energy production.
    - any:
      - condition:
          field: wind-turbine-count
          operator: '>'
          value: 2
          description: More than 2 turbines.
      - condition:
          field: turbine-hub-height
          operator: '>'
          value: 15
          description: Hub height of any turbine over 15 metres.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: 'Required for: • Major development where there is likely to be significant public interest
  in the proposals. • Any development involving an installation for the harnessing of wind power for energy
  production where (a) the development involves the installation of more than 2 turbines; or (b) the hub
  height of any turbine exceeds 15 metres'
must-include:
- item: How the applicant has complied with the requirements for pre-application consultation
  level: must
- item: That the views of the local community have been sought and taken into account in formulating the
    proposals
  level: must
confidence: medium
notes: From the council's list (adopted June 2025), page 21. Major development shows as 'check' because
  it applies only 'where there is likely to be significant public interest'.
review-status: unverified
field-status: {}
