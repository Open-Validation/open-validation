reference: elevation-existing
local-authority: HYN
required-if:
  any:
  - condition:
      field: demolition
      value: true
      description: Existing buildings are proposed to be demolished.
  - condition:
      field: external-alterations
      value: true
      description: Existing buildings are proposed to be altered.
  - condition:
      field: new-build
      value: true
      description: New buildings are proposed.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: '17. Existing and proposed elevations & roof plans Required for applications where: • Existing
  buildings are proposed to be demolished or altered • New buildings are proposed'
must-include:
- item: Drawn to a recognised metric scale, preferably 1:50 or 1:100
  level: should
- item: Annotated with dimensions, including height to eaves and ridge
  level: should
- item: Existing and proposed external materials
  level: should
- item: All sides of the proposal
  level: should
- item: The relationship with any adjoining building or building within 2 metres, with the positions of
    any openings on each property
  level: should
confidence: medium
notes: From the council's list (adopted June 2025), pages 18 and 48. Existing elevations are for existing
  buildings; demolition in a Conservation Area also needs elevations of the building to be demolished
  (section 59).
review-status: unverified
field-status: {}
