reference: lighting-assessment
local-authority: HYN
required-if:
  any:
  - condition:
      field: external-lighting
      value: true
      description: New external lighting, including floodlighting near homes, a listed building, a conservation
        area or open countryside.
  - condition:
      field: illuminated
      value: true
      description: Illuminated advertisements.
  - condition:
      field: floodlighting
      value: true
      description: Lighting for riding arenas, sports pitches and buildings.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: '48. Lighting scheme including a light pollution assessment Required for all planning applications
  which include new external lighting including: • External floodlighting in the vicinity of residential
  property, a listed building, a conservation area or open countryside. • Illuminated advertisements.
  • Lighting for riding arenas, sports pitches and buildings.'
must-include:
- item: Prepared by a suitably qualified person or organisation
  level: should
- item: Plans showing the location of the lighting
  level: should
- item: Calculations of glare, intensity and spill, with recommendations to control them
  level: should
- item: Equipment design used to determine aim, glare and overspill
  level: should
- item: Measured luminance of the proposed scheme
  level: should
- item: Hours of illumination
  level: should
- item: How artificial lighting of important wildlife habitats is minimised or mitigated
  level: should
confidence: medium
notes: From the council's list (adopted June 2025), page 41.
review-status: unverified
field-status: {}
