reference: floor-plan-proposed
local-authority: HYN
required-if:
  any:
  - condition:
      field: floorspace
      operator: '>'
      value: 0
      description: New floorspace is proposed.
  - condition:
      field: involves-change-of-use
      value: true
      description: A change in the use of floorspace is proposed.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: '16. Existing and proposed floor plans Required for applications where: • New floor space
  is proposed, • A change in the use of floor space is proposed.'
must-include:
- item: Drawn to a recognised metric scale, preferably 1:50 or 1:100
  level: should
- item: Annotated with external dimensions
  level: should
- item: Shows the existing buildings and the proposed development, in context with any adjacent buildings
    (with property numbers where appropriate)
  level: should
confidence: medium
notes: From the council's list (adopted June 2025), page 18.
review-status: unverified
field-status: {}
