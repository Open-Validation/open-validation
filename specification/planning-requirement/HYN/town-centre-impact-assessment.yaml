reference: town-centre-impact-assessment
local-authority: HYN
required-if:
  any:
  - condition:
      field: out-of-centre-town-centre-use
      value: true
      description: A main town centre use not in an existing centre and not in accordance with an up-to-date
        plan.
  - discretionary
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: NPPF; Hyndburn Development Management DPD policy DM3
source-text: A sequential assessment is required for all planning applications for ‘main town centre uses’3
  which are neither in an existing centre nor in accordance with an up-to-date plan except for small scale
  rural offices or other small scale rural development. ... Proposals for new retail and leisure floorspace
  that are not located in defined Town Centres or Local Centres, are not in accordance with specific policies
  in the Site Allocations DPD and which are larger than the thresholds set out in Policy DM3 of the Hyndburn
  Development Management DPD, must also be supported by an Impact Assessment.
must-include:
- item: 'Sequential assessment: sites assessed for availability, suitability and viability; in-centre
    then edge-of-centre options assessed first; no town centre or sequentially preferable sites available'
  level: must
- item: 'Impact assessment: impact on existing, committed and planned public and private investment in
    centres in the catchment'
  level: must
  required-if: discretionary
- item: 'Impact assessment: impact on town centre vitality and viability, including consumer choice and
    trade, up to five years ahead (ten years for major schemes whose full impact takes longer)'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted June 2025), pages 32, 33 and 34. The impact assessment applies
  above thresholds set in Development Management DPD policy DM3, which the list does not give, and the
  council may ask for one below them, so it shows as 'check'. Small scale rural offices and other small
  scale rural development are exempt from the sequential assessment.
review-status: unverified
field-status: {}
