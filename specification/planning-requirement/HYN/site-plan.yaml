reference: site-plan
local-authority: HYN
required-if:
  always: true
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 15. Existing and proposed site plan Required for all applications
must-include:
- item: At a scale of 1:500 or 1:200, showing the direction of North
  level: should
- item: The proposed development in relation to the site boundaries and other existing buildings on site
  level: should
- item: Written dimensions, including those to the boundaries
  level: should
- item: Any buildings or other structures to be demolished
  level: should
- item: 'Unless they would not influence or affect the development: buildings, roads and footpaths on
    adjoining land including access arrangements; public rights of way; trees on the site and on adjacent
    land; extent and type of hard surfacing; boundary treatments'
  level: should
confidence: medium
notes: From the council's list (adopted June 2025), page 17. The list asks for existing and proposed site
  plans; the items are what it says the plan 'should' show.
review-status: unverified
field-status: {}
