reference: travel-plan
local-authority: HYN
required-if:
  any:
  - all:
    - ref: major-development
    - any:
      - condition:
          field: retail-floorspace
          operator: '>'
          value: 0
          description: Retail development.
      - condition:
          field: office-floorspace
          operator: '>'
          value: 0
          description: Employment (office) development.
      - condition:
          field: industrial-floorspace
          operator: '>'
          value: 0
          description: Employment (industrial) development.
      - condition:
          field: warehousing-floorspace
          operator: '>'
          value: 0
          description: Employment (storage and distribution) development.
      - condition:
          field: entertainment-leisure-use
          value: true
          description: Leisure development.
      - condition:
          field: new-school
          value: true
          description: Educational development.
  - discretionary
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: '35. Travel plan Required: • For major retail, employment, leisure and educational developments
  • Wherever specified during pre-application discussions'
must-include:
- item: How the transport implications will be managed, promoting sustainable transport other than the
    private car
  level: should
confidence: medium
notes: From the council's list (adopted June 2025), page 32. The thresholds table on page 31 (an image)
  also sets travel plan thresholds by old use class; a travel plan 'may also be requested for sites below
  the threshold', so that and pre-application requests show as 'check'.
review-status: unverified
field-status: {}
