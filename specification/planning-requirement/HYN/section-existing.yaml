reference: section-existing
local-authority: HYN
required-if:
  any:
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal changes ground levels, or the site slopes.
  - condition:
      field: adjoins-existing-building
      value: true
      description: The proposal adjoins an existing building or structure.
  - discretionary
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: '18. Existing and proposed section drawings Required for applications: • Where a proposal
  involves a change in ground levels – drawings should be submitted to show both existing and finished
  levels. • On sloping sites – full information is required concerning alterations to levels, the way
  in which a proposal sits within the site and in particular the relative levels between existing and
  proposed buildings within or in close proximity to the site. • Where a proposal adjoins an existing
  building or structure – drawing should be submitted to show how the development will relate to existing
  buildings or structures.'
must-include:
- item: Drawn to a recognised metric scale, preferably 1:50 or 1:100
  level: should
- item: A cross section through the proposed building(s) or site
  level: must
- item: 'Where levels change: existing and finished levels'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Ground levels change.
- item: Existing site levels and finished floor levels related to a fixed datum point off-site, and the
    proposal in relation to adjoining buildings, wherever possible
  level: should
confidence: medium
notes: From the council's list (adopted June 2025), pages 19 and 20. Shown as partly discretionary because
  'Section drawings may also be requested in other cases by the planning officer'.
review-status: unverified
field-status: {}
