reference: bng-metric
local-authority: HYN
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The permission would be subject to the general biodiversity gain condition.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: Schedule 7A, Town and Country Planning Act 1990 (Environment Act 2021); Biodiversity Gain Requirements
  (Exemptions) Regulations 2024
source-text: Where development would be subject to the general biodiversity gain condition, the application
  must be accompanied by minimum information
must-include:
- item: Completed metric calculation tool showing the pre-development biodiversity value of the onsite
    habitat on the date of application (or proposed earlier date), with the publication date of the metric
    used
  level: must
- item: 'Where activities have reduced onsite biodiversity value before that date: a statement saying
    so, the date immediately before, the pre-development value on that date, the completed metric and
    any supporting evidence'
  level: must
  required-if:
    condition:
      field: habitat-degraded
      value: true
      description: Onsite habitat has been degraded before the date of application.
confidence: medium
notes: From the council's list (adopted June 2025), page 13. Required by law where the biodiversity gain
  condition applies (Schedule 7A of the Town and Country Planning Act 1990); householder and other exempt
  applications are exempt. The council's extra local requirement (a draft Biodiversity Gain Plan and a
  draft Habitat Management and Monitoring Plan) is in the unmapped list.
review-status: unverified
field-status: {}
