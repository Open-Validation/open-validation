reference: noise-assessment
local-authority: HYN
required-if:
  any:
  - condition:
      field: noise-generating-use
      value: true
      description: Introduces a noise source which may cause loss of amenity.
  - condition:
      field: noise-sensitive-use
      value: true
      description: Introduces a noise sensitive development in a noisy environment (e.g. next to a railway
        line, motorway or noisy activity).
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: '44. Noise impact assessment Required for proposals which: • Introduce a noise source which
  may cause loss of amenity • Introduce a noise sensitive development in a noisy environment (e.g. adjacent
  to a railway line/motorway or existing noise generating activity)'
must-include:
- item: Prepared by a suitably qualified person or organisation
  level: must
- item: Measurements of existing and proposed noise levels
  level: must
- item: Mitigation measures recommended where appropriate
  level: should
confidence: medium
notes: From the council's list (adopted June 2025), page 39.
review-status: unverified
field-status: {}
