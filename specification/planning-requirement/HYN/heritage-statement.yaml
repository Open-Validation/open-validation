reference: heritage-statement
local-authority: HYN
required-if:
  any:
  - site:
      in:
      - listed-building
      - conservation-area
      - locally-listed-building
      - world-heritage-site
      - scheduled-monument
      description: Works or demolition to Listed Buildings, works within Conservation Areas, or works
        to other designated and non-designated heritage assets.
  - site:
      in:
      - listed-building-setting
      description: Development affecting the setting of a listed building or other heritage asset.
  - site:
      in:
      - park-and-garden
      description: Works to a Registered Park or Garden.
  - site:
      in:
      - archaeological-priority-area
      description: Works affecting an area of archaeological interest.
  - application-type:
      in:
      - lbc
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: NPPF
source-text: '41. Heritage statement Required for development involving: • Works or demolition to Listed
  Buildings, works within Conservation Areas or works or demolition to other designated and non-designated
  heritage assets. • Alterations or new development affecting the setting of Listed Buildings, Conservation
  Areas or other designated and non-designated heritage assets. • Works to a Registered Park or Garden.
  • Works affecting an area of archaeological interest'
must-include:
- item: The significance of the heritage asset(s) affected, including the contribution of their setting,
    in proportionate detail
  level: must
- item: The relevant historic environment record consulted as a minimum, with the sources considered and
    expertise consulted
  level: must
- item: An assessment of the impact of the proposal
  level: must
- item: 'Listed building consent: a schedule of proposed works; analysis of the significance of archaeology;
    history and character of the building; principles of and justification for the works; impact on significance'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'Setting of a listed building or conservation area: design principles (impact, scale, layout,
    appearance, character); understanding of its historical, archaeological and architectural interest;
    significance including setting'
  level: must
  required-if:
    site:
      in:
      - listed-building-setting
      - conservation-area
      description: Affects the setting of a listed building or a conservation area.
confidence: medium
notes: From the council's list (adopted June 2025), pages 37 and 38. It may be included in the Design
  and Access Statement.
review-status: unverified
field-status: {}
