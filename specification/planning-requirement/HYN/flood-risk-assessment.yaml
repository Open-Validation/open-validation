reference: flood-risk-assessment
local-authority: HYN
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: In Flood Zone 2, 3 or 3b.
  - any:
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Flood Zone 1 with a site area of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Flood Zone 1 with a site area of 1 hectare or more.
  - site:
      in:
      - critical-drainage-area
      description: In an area with critical drainage problems.
  - site:
      in:
      - future-flood-risk
      description: Flood Zone 1 where the strategic flood risk assessment shows increased risk of flooding
        during its lifetime.
  - condition:
      field: more-vulnerable-use-change
      value: true
      description: Increases the vulnerability classification and may be subject to sources of flooding
        other than rivers or sea.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: NPPF and Planning Practice Guidance (flood risk)
source-text: 'Required for all development proposed: • in flood zones 2, 3 or 3b • within flood zone 1
  with a site area of 1 hectare or more • in areas with critical drainage problems • within flood zone
  1 where the LPA’s strategic flood risk assessment (SFRA) shows it will be at increased risk of flooding
  during its lifetime • that increases the vulnerability classification and may be subject to sources
  of flooding other than rivers or sea'
must-include:
- item: Addresses flood risk to both property and people
  level: must
- item: 'Householder applications in a flood zone: the council''s simple flood risk assessment form'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - flood-risk-zone
        description: In a flood risk zone.
  source-text: For householder applications located within a Flood Risk Zone the planning application
    shall be accompanied by a simple flood risk assessment.
confidence: medium
notes: From the council's list (adopted June 2025), page 34. The Sequential and Exception Tests the list
  also describes are in the unmapped list.
review-status: unverified
field-status: {}
