reference: flood-risk-assessment
local-authority: HYN
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: The site is in Flood Zone 2, 3 or 3b (householder included).
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 sites of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Flood Zone 1 sites of 1 hectare or more.
