reference: location-plan
local-authority: HYN
required-if:
  always: true
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 8. Plans and drawings Required for all applications.
must-include:
- item: Up to date and of Ordnance Survey quality
  level: should
- item: At a scale of 1:1250 or 1:2500, with a North point
  level: should
- item: At least two named roads, and surrounding buildings named or numbered
  level: should
- item: Application site edged red, including all land needed to carry out the development
  level: should
- item: Any other land in the applicant's control or ownership close to or adjacent to the site edged
    blue
  level: should
confidence: medium
notes: From the council's list (adopted June 2025), page 10. The list says the plan 'should' do these
  things, so they show as 'should'.
review-status: unverified
field-status: {}
