reference: air-quality-assessment
local-authority: HYN
required-if:
  any:
  - all:
    - condition:
        field: parking-spaces
        operator: '>='
        value: 100
        description: 100 or more new parking spaces (outside an AQMA).
  - all:
    - condition:
        field: parking-spaces
        operator: '>='
        value: 50
        description: 50 or more new parking spaces.
    - site:
        in:
        - air-quality-management-area
        description: Inside an Air Quality Management Area.
  - all:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 0
        description: Retail development.
    - condition:
        field: parking-spaces
        operator: '>='
        value: 50
        description: 50 or more new retail parking spaces (outside an AQMA).
  - all:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 0
        description: Retail development.
    - condition:
        field: parking-spaces
        operator: '>='
        value: 20
        description: 20 or more new retail parking spaces.
    - site:
        in:
        - air-quality-management-area
        description: Inside an Air Quality Management Area.
  - all:
    - condition:
        field: sensitive-end-use
        value: true
        description: Dwellings, residential care facilities or schools.
    - site:
        in:
        - air-quality-management-area
        description: Inside an Air Quality Management Area.
  - all:
    - condition:
        field: direct-air-emissions
        value: true
        description: Commercial or industrial plant or equipment producing emissions.
    - site:
        in:
        - air-quality-management-area
        description: Inside an Air Quality Management Area.
  - discretionary
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: '45. Air quality assessment Required for proposals which: • When there would be increased
  congestion/traffic volumes/speed/HGV movements • For 100 + new parking spaces outside an AQMA 39 • For
  50+ new parking spaces inside an AQMA • For 50+ new retail parking spaces outside an AQMA • For 20+
  new retail parking spaces inside an AQMA • For Dwellings, Residential Care facilities or schools within
  an AQMA or within areas of poor air quality where there may be an exceedance of a National Air Quality
  Objective. • For Commercial or Industrial plant/ equipment producing emissions close to or within an
  AQMA'
must-include:
- item: Prepared by a suitably qualified person or organisation
  level: must
- item: Existing and proposed air quality, with mitigation measures where appropriate
  level: must
confidence: medium
notes: From the council's list (adopted June 2025), pages 39 and 40. Increased congestion, traffic volumes,
  speed or HGV movements; areas of poor air quality outside an AQMA; and plant 'close to' an AQMA show
  as 'check' because the list gives no threshold.
review-status: unverified
field-status: {}
