reference: biodiversity-survey-report
local-authority: HYN
required-if:
  any:
  - site:
      in:
      - site-of-special-scientific-interest
      - local-wildlife-site
      - priority-habitat
      description: Development impacting a Site of Special Scientific Interest, Biological Heritage Site,
        District Wildlife Site or Habitat of Principal Importance.
  - condition:
      field: geodiversity-interest
      value: true
      description: Geological heritage sites.
  - condition:
      field: protected-species
      value: true
      description: Development likely to affect the habitat of protected species, or where protected species
        are known to be present.
  - condition:
      field: potential-roost-features
      value: true
      description: Conversion, modification, demolition or removal of buildings or structures on the bat
        trigger list (agricultural buildings, pre-1914/pre-1960 buildings, tunnels, cellars, chimneys,
        bridges...).
  - all:
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting.
    - discretionary
  - condition:
      field: veteran-trees
      value: true
      description: Tree work or development affecting old and veteran trees.
  - condition:
      field: near-woodland
      value: true
      description: Tree work or development affecting woodland, or buildings within or next to woodland.
  - condition:
      field: hedgerows-affected
      value: true
      description: Development affecting field hedgerows or lines of trees connected to woodland or water.
  - condition:
      field: near-watercourse
      value: true
      description: Within 200m of rivers, streams, canals, lakes, reed beds or other aquatic habitats.
  - condition:
      field: wind-turbine
      value: true
      description: Wind farm developments of multiple wind turbines and single wind turbines.
  - all:
    - condition:
        field: demolition
        value: true
        description: Demolition of a building or structure.
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
  - discretionary
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: Wildlife and Countryside Act 1981; Conservation of Habitats and Species Regulations 2017
source-text: '29. Ecological assessments (including bat and nesting bird surveys) Required for developments
  which impact on: • Site of Special Scientific Interest • Biological Heritage Sites • District Wildlife
  Sites • Habitat of Principle Importance (priority habitats) • Sites meeting the standard set for BHS/DWS/HPI
  • Sites designated or shown to be important in the Local Nature Recovery Strategy • Sites containing
  ≥ 25m2 medium and above habitat distinctiveness types (DEFRA habitat distinctiveness classification).
  • Geological heritage sites • Wildlife Links or Corridors and • Development which is likely to affect
  the habitat of protected species,'
must-include:
- item: Preliminary Bat Roost Assessment incorporating a nesting bird survey, where the works are on the
    council's Planning Trigger List
  level: must
  required-if:
    condition:
      field: potential-roost-features
      value: true
      description: Works on the bat trigger list.
- item: Phase 2 presence/absence bat surveys submitted before validation where the Preliminary Bat Roost
    Survey recommends them
  level: must
  source-text: Please note that where the Preliminary Bat Roost Survey recommends further Phase 2 Presence
    Absence Bat surveys then such surveys must also be submitted prior to validation.
- item: Not more than 2 years old, unless agreed otherwise
  level: must
  source-text: Any assessments that are over 2 years old will be considered out-of-date and will need
    to be re-visited unless agreed otherwise.
- item: 'Wind turbines: a site specific assessment of potential impacts on biodiversity'
  level: must
  required-if:
    condition:
      field: wind-turbine
      value: true
      description: Wind turbines.
- item: The implications of the development for wildlife in the locality, including mitigation measures
  level: must
- item: 'Demolition in a Conservation Area: an ecological survey and report including, where necessary,
    a bat and nesting bird survey'
  level: must
  required-if:
    all:
    - condition:
        field: demolition
        value: true
        description: Demolition of a building or structure.
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
confidence: medium
notes: From the council's list (adopted June 2025), pages 24, 26 and 48. Sites meeting the standard for
  BHS/DWS/HPI, sites important in the Local Nature Recovery Strategy, sites with 25 sq m or more of medium
  or higher distinctiveness habitat, wildlife links and corridors, quarries and cliff faces, and floodlighting
  show as 'check' (they need an ecologist's view), as does 'Each case is individually assessed'. Householders
  affecting a roof space must give a statement on bats or owls (see the unmapped list); a survey is then
  needed if bats or owls are found.
review-status: unverified
field-status: {}
