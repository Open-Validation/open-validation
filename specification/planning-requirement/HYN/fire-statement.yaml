reference: fire-statement
local-authority: HYN
required-if:
  all:
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Two or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: Article 9A, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'They are required for applications for ‘relevant buildings’ which includes buildings that:
  • contain two or more dwellings or educational accommodation and • meet the height condition of 18m
  or more in height, or 7 or more storeys'
confidence: medium
notes: From the council's list (adopted June 2025), page 14.
review-status: unverified
field-status: {}
