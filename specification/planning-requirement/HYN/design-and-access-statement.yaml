reference: design-and-access-statement
local-authority: HYN
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - world-heritage-site
        - conservation-area
        description: In a World Heritage Site or a Conservation Area (a 'designated area').
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with floorspace of 100 sq m or more.
  - application-type:
      in:
      - lbc
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'They are required for: • Applications for Major Development1; 1 As defined in Article 2
  of the Town and Country Planning (Development Management Procedure (England) Order 2015 10 • Applications
  for development in a designated area2, where the proposed development consists of: o one or more dwellings;
  or o a building or buildings with a floor space of 100 square metres or more. • Applications for listed
  building consent.'
must-include:
- item: Explains the design principles and concepts applied to the proposed development
  level: must
- item: Demonstrates the steps taken to appraise the context of the development, and how the design takes
    that context into account
  level: must
- item: Covers the use or uses proposed, amount, layout, scale, landscaping, appearance, and access and
    parking
  level: should
- item: 'Outline applications: use(s) and any distinct development zones; amount for each use; indicative
    layout; upper and lower limits of height, width and length of each building; indicative access points'
  level: should
  required-if:
    application-type:
      in:
      - outline
      - outline-some
      - outline-all
- item: 'Listed building consent: how the design has taken account of the building''s special architectural
    or historic importance, the physical features that justify its listing, and its setting'
  level: must
  required-if:
    application-type:
      in:
      - lbc
confidence: medium
notes: From the council's list (adopted June 2025), pages 10 and 12.
review-status: unverified
field-status: {}
