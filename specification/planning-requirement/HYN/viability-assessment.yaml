reference: viability-assessment
local-authority: HYN
required-if:
  condition:
    field: planning-obligations-shortfall
    value: true
    description: The application would not provide the obligations, affordable housing, contributions
      or infrastructure that policy requires.
source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
source-text: Applications which would fail to provide the obligations, affordable housing or other contributions
  required by policy, or the necessary infrastructure provision (public open space, sport or leisure facilities/
  education contributions, off-site highway improvements if required).
must-include:
- item: Value of the land
  level: must
- item: Abnormal development costs and construction costs
  level: must
- item: Price a Registered Provider will pay for the units (for affordable housing)
  level: must
- item: Open market value of the dwellings or of the development
  level: must
- item: Developer return
  level: must
- item: Details of the proposed obligations or scheme elements to be included (e.g. open space)
  level: must
confidence: medium
notes: From the council's list (adopted June 2025), page 44. The applicant pays for the council's consultant
  to appraise it.
review-status: unverified
field-status: {}
