reference: photos
local-authority: CAS
required-if:
  application-type:
    in:
    - hh
    - ldc
    - full
    - technical-details-consent
    - outline
    - lbc
    - consent-under-tpo
    - notice-trees-in-con-area
    - advertising
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: Document of relevant photos of outside the property ... Photographs All applications ▪ Document
  of relevant photos of outside the property
must-include:
- item: Relevant photos of the outside of the property
  level: must
- item: 'Lawful development certificates: people who can be identified, children and car number plates
    redacted / not included'
  level: must
  required-if:
    application-type:
      in:
      - ldc
  source-text: Redact / do not include people who can be identified, children or car number plates
- item: 'Listed building consent: photos of the outside and inside of the property'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: Document of relevant photos of outside and inside of the property
- item: 'Tree works: photos of the tree from multiple angles / locations'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  source-text: Document of relevant photos of tree from multiple angles / locations
- item: 'Advertisements: photos of the location of the advertisements'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Document of relevant photos of location of advertisements
confidence: medium
notes: From the council's list (published 11 May 2026), page 8, 11, 17, 20, 29, 32, 33, 34. Listed for
  householder, lawful development certificate, full, major, outline, listed building consent, tree works
  and advertisement applications.
