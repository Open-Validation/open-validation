reference: affordable-housing-statement
local-authority: CAS
required-if:
  all:
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: 10 or more net residential units.
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: All development of 10 or more net residential units
must-include:
- item: Confirmation of policy compliant on-site affordable housing provision, details of off-site provision,
    or details of the 'exceptional circumstances'
  level: must
- item: 'Where financial contributions are sought: a high level initial viability appraisal and proposed
    contribution figure'
  level: must
  source-text: Confirmation of policy compliant provision of on-site affordable housing, details of off-site
    provision, or details of the ‘exceptional circumstances’, including high level initial viability appraisal
    and proposed contribution figure where financial contributions are sought to be made.
- item: Any private financial data in a clear, separately marked document (the statement itself is public)
  level: should
confidence: medium
notes: From the council's list (published 11 May 2026), page 22. Major checklist ('Documents required').
review-status: unverified
field-status: {}
