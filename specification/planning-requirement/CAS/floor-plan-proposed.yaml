reference: floor-plan-proposed
local-authority: CAS
required-if:
  any:
  - any:
    - all:
      - application-type:
          in:
          - hh
      - condition:
          field: building-works
          value: true
          description: Works other than alterations to hardstanding, ramps, decking or dropped kerbs.
    - all:
      - application-type:
          in:
          - full
          - technical-details-consent
      - any:
        - condition:
            field: building-works
            value: true
            description: Alterations and / or extensions to an existing building are proposed.
        - condition:
            field: new-build
            value: true
            description: A new dwelling or building (e.g. an annexe) is proposed.
        - condition:
            field: basement
            value: true
            description: Development below ground level is proposed.
    - ref: major-development
    - application-type:
        in:
        - lbc
    - application-type:
        in:
        - outline-some
    - all:
      - application-type:
          in:
          - ldc
      - discretionary
    - all:
      - application-type:
          in:
          - prior-approval
      - discretionary
  - application-type:
      in:
      - change-of-use
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: 'Full existing elevations and floor plans of property (Not required for: alterations to hardstanding,
  ramps, decking or dropped kerbs) ... Where alterations and / or extensions to an existing building(s)
  are proposed. When a new dwelling or building(s) are proposed e.g. annexe* Where the development proposed
  is below ground level. ... Floor Plans (Existing and Proposed) ... All applications'
must-include:
- item: Scale 1:50 or 1:100
  level: must
- item: Scale bar
  level: must
- item: Unique drawing reference(s)
  level: must
- item: Room labels
  level: must
- item: For multi-unit schemes, each unit numbered
  level: should
  required-if:
    condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: A multi-unit scheme.
  source-text: For multi-unit schemes, each unit should be numbered
- item: 'Lawful development certificates: floor levels (new windows or impact to roof)'
  level: must
  required-if:
    application-type:
      in:
      - ldc
  source-text: Floor levels (new windows or impact to roof)
- item: 'Green Belt development: full volume calculations of the proposed development'
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: Green Belt development.
  source-text: Green Belt development - full volume calculations of proposed development are required
confidence: medium
notes: 'From the council''s list (published 11 May 2026), page 7-8, 11-12, 16, 20, 26, 29, 31-32. Householder,
  full, major and listed building consent checklists list ''Full existing / proposed elevations and floor
  plans of property'' (householder and full: not needed for alterations to hardstanding, ramps, decking
  or dropped kerbs). Outline: ''Other drawings / details (e.g. elevations, floor plans, street scene,
  sections)'' for outline applications with some matters reserved. Discretionary for lawful development
  certificates (the list says the supporting plans ''would normally include'' them) and prior approvals
  (''where requested or as additional information''). Change of use: floor plans for all applications.'
review-status: unverified
field-status: {}
