reference: noise-assessment
local-authority: CAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: noise-generating-use
          value: true
          description: The proposal introduces a new noise source.
      - condition:
          field: noise-sensitive-use
          value: true
          description: The proposal introduces a noise-sensitive use.
      - discretionary
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
        - outline
    - condition:
        field: plant-equipment
        value: true
        description: A new mechanical noise source near residential properties.
  - all:
    - ref: major-development
    - any:
      - condition:
          field: noise-sensitive-use
          value: true
          description: Proposed residential uses near existing noise sources, such as roads, railways
            and commercial premises.
      - condition:
          field: noise-generating-use
          value: true
          description: Development likely to generate noise affecting existing noise-sensitive areas.
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: Noise Impact Assessment where the proposal introduces a new noise source or a noise-sensitive
  use; some changes of use ... Noise Impact Assessment where the proposal introduces a new mechanical
  noise source near residential properties ... Proposed residential uses near existing noise sources,
  such as roads, railways and commercial premises OR proposals for development likely to generate noise
  affecting existing noise-sensitive areas
must-include:
- item: Identifies and quantifies the potential sources of noise and how they may affect local amenity
  level: should
  required-if:
    ref: major-development
- item: Outlines how adverse issues will be mitigated so internal and external noise levels meet national
    guidance criteria, with details of any mitigation measures required
  level: should
  required-if:
    ref: major-development
- item: Prepared by a qualified acoustician
  level: must
  required-if:
    ref: major-development
  source-text: A noise impact assessment must be prepared by a qualified acoustician.
confidence: medium
notes: From the council's list (published 11 May 2026), page 9, 18, 24. Householder and full ('may be
  required') and major. 'Some changes of use' (householder) is discretionary.
review-status: unverified
field-status: {}
