reference: biodiversity-survey-report
local-authority: CAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: protected-species
        value: true
        description: The development may affect protected species.
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
        - outline
    - any:
      - condition:
          field: protected-species
          value: true
          description: The development may affect protected species.
      - discretionary
  - all:
    - ref: major-development
    - any:
      - condition:
          field: protected-species
          value: true
          description: The development may affect protected species.
      - discretionary
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: Biodiversity checklist and report any development where there is a potential impact on biodiversity
  - identify impacts on protected species. ... Any development where there is a potential impact on biodiversity
must-include:
- item: Ecological Impact Assessment (EcIA) in accordance with the CIEEM EcIA guidelines
  level: must
  required-if:
    ref: major-development
- item: Preliminary Ecological Appraisal (PEA), in accordance with the CIEEM PEA guidelines, informing
    or incorporated into the EcIA
  level: must
  required-if:
    ref: major-development
- item: Surveys for protected species and priority species / habitats identified as necessary through
    the PEA, identifying impacts and proposing mitigation
  level: should
  required-if:
    ref: major-development
- item: Submitted at the same time as the full or outline planning application
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 11 May 2026), page 9, 18, 22. Householder 'Biodiversity checklist
  and report' ('identify impacts on protected species'); full 'any development where there is a potential
  impact on biodiversity'; major 'Biodiversity and ecology surveys and reports' for any development with
  a potential impact on biodiversity. A potential impact on biodiversity is a judgement, so discretionary
  next to protected species. The list notes some survey work can only be done at certain times of year.
  The 'Bat survey declaration' is sent to unmapped.
review-status: unverified
field-status: {}
