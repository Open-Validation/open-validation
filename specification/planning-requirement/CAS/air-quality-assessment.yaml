reference: air-quality-assessment
local-authority: CAS
required-if:
  all:
  - ref: major-development
  - any:
    - all:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Includes housing.
      - site:
          in:
          - air-quality-management-area
          description: Within or adjoining an Air Quality Management Area.
    - condition:
        field: eia-development
        value: true
        description: Requires an Environmental Statement.
    - condition:
        field: parking-spaces
        operator: '>'
        value: 300
        description: New car parking of more than 300 spaces.
    - discretionary
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: 'May be required for proposals that would: ▪ Include housing and is within or adjoining an
  Air Quality Management Area ... Require an Environmental Statement Require a Transport Assessment Result
  in increased traffic congestion, or create a change in traffic volumes or vehicle speed Significantly
  alter the traffic composition in an area (i.e. bus stations, HGV Parks etc.) Include new car parking
  (>300 spaces) or coach / lorry parks Effect sensitive areas such as ecological sites, or areas previously
  defined as having poor air quality (including Air Quality Management Areas)'
must-include:
- item: Indicates the change in air quality resulting from the development, with appropriate mitigation
    measures as necessary
  level: must
confidence: medium
notes: From the council's list (published 11 May 2026), page 24-25. Major checklist only; the list says
  it 'May be required'. Needing a transport assessment, increased congestion or changed traffic volumes,
  speed or composition, coach / lorry parks and effects on sensitive areas have no clear threshold, so
  they are discretionary. The list refers to the Essex Air Quality Consortium and the Essex Air Quality
  Strategy (July 2025).
review-status: unverified
field-status: {}
