reference: sustainable-drainage-strategy
local-authority: CAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
        - outline
    - any:
      - site:
          in:
          - flood-risk-zone
          description: High risk flood zones 2 / 3.
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: 10 or more dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 1000
          description: Buildings over 1000 sq m.
      - condition:
          field: site-area-residential
          operator: '>'
          value: 1
          description: Site exceeding 1 ha.
      - condition:
          field: site-area-non-residential
          operator: '>'
          value: 1
          description: Site exceeding 1 ha.
  - ref: major-development
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: Sustainable Drainage Plan (for high risk flood zones 2 / 3; 10 or more dwellings, buildings
  over 1000 sqm; sites exceeding 1 ha ... All developments (evidence required where SuDS would be inappropriate)
must-include:
- item: Demonstrates how surface water will be managed to reduce flood risk
  level: must
  required-if:
    ref: major-development
- item: A detailed design scheme for a Sustainable Drainage System (SuDS)
  level: should
  required-if:
    ref: major-development
  source-text: A detailed design scheme for a Sustainable Drainage System (SuDS) should be submitted.
- item: Evidence where SuDS would be inappropriate
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (published 11 May 2026), page 17, 21. Full and outline ''Other documents'':
  ''Sustainable Drainage Plan'' and ''Sustainable Drainage Statement'' (for flood zone 2 / 3) with the
  same triggers. Major: ''Sustainable Drainage (SuDS) Strategy'' for all developments. The major checklist
  also asks for the Essex SuDS Water Quantity and Quality Proforma (sent to unmapped). The council''s
  Application Checklists page also still links an older ''Sustainable Drainage Systems (SuDS)'' page with
  Essex drainage checklists for major applications.'
review-status: unverified
field-status: {}
