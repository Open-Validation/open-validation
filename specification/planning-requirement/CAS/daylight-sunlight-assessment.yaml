reference: daylight-sunlight-assessment
local-authority: CAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
        - outline
    - discretionary
  - all:
    - ref: major-development
    - discretionary
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: 'Daylight / Sunlight Assessment where the development has the potential to significantly
  reduce natural light for existing neighbours or fail to provide adequate light for its own future occupants
  ... Required for the following: ▪ proposals where there is potential adverse impact upon current levels
  of daylight/sunlight enjoyed by adjoining properties or buildings including associated gardens or amenity
  space ▪ to determine the quality of light within new units'
must-include:
- item: Uses BRE (Building Research Establishment) guidelines
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 11 May 2026), page 9, 18, 25. Householder and full ('may be
  required') and major. Whether a development could significantly reduce light, or whether light within
  new units needs checking, is a judgement, so discretionary.
review-status: unverified
