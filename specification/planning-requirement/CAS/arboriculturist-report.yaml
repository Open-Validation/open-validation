reference: arboriculturist-report
local-authority: CAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
        - outline
    - condition:
        field: trees-on-or-near-site
        value: true
        description: The development may impact the health and longevity of trees (roots or canopy).
  - all:
    - ref: major-development
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Site is near or adjacent existing trees, or construction could affect roots, canopies
            or soil conditions.
      - site:
          in:
          - tree-preservation-zone
          - conservation-area
          description: Protected trees or conservation areas are involved.
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: 'where the development may impact the health and longevity of a trees, ensuring the preservation
  of the root network and canopy integrity ... All development where: ▪ Site is near or adjacent existing
  trees ▪ Protected trees or conservation areas are involved ▪ Construction could affect roots, canopies
  or soil conditions'
must-include:
- item: Tree survey
  level: must
  required-if:
    ref: major-development
- item: Tree Constraints Plan
  level: must
  required-if:
    ref: major-development
- item: Method Statement
  level: must
  required-if:
    ref: major-development
- item: Tree Protection Plan
  level: must
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (published 11 May 2026), page 9, 18, 23. Householder 'Tree Assessment'
  and full 'Arboricultural Impact Assessment' ('may be required where it would be relevant'); major 'Arboricultural
  Impact Assessment (AIA)'.
review-status: unverified
field-status: {}
