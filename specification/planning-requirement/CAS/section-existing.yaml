reference: section-existing
local-authority: CAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - any:
      - condition:
          field: change-in-ground-levels
          value: true
          description: Sloping site, or a change in ground / floor levels such as roof development and
            basements.
      - site:
          in:
          - conservation-area
          - listed-building
          description: Listed building or conservation area.
      - discretionary
  - all:
    - application-type:
        in:
        - ldc
    - discretionary
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
    - any:
      - condition:
          field: new-build
          value: true
          description: A new dwelling or building is proposed.
      - condition:
          field: upper-floor-extension
          value: true
          description: New floors are proposed.
      - condition:
          field: roof-alteration
          value: true
          description: Roof alterations are proposed.
      - condition:
          field: basement
          value: true
          description: New floors below ground level are proposed.
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          - locally-listed-building
          description: Works to a listed building, or works that would directly or indirectly affect a
            designated or non-designated heritage asset.
  - all:
    - application-type:
        in:
        - change-of-use
    - any:
      - condition:
          field: external-alterations
          value: true
          description: External building works are proposed.
      - condition:
          field: change-in-ground-levels
          value: true
          description: Changes to floor levels are proposed.
  - application-type:
      in:
      - lbc
  - application-type:
      in:
      - outline-some
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: 'Existing and Proposed Section Plans (Required for: sloping sites, change in ground / floor
  levels such as roof development and basements, hidden elevations, Listed Building and Conservation Area
  consents) ... When a new dwelling or building(s) are proposed New floors or roof alterations are proposed
  including below ground level Works to alter or replace existing features, or insert new features to
  listed buildings; or works would directly or indirectly affect a designated or nondesignated asset ...
  Where external building works are proposed or changes to floors'
must-include:
- item: 'Scale 1:50 or 1:100 (listed building consent: 1:20, 1:50 or 1:100)'
  level: must
- item: Scale bar
  level: must
- item: Unique drawing reference(s)
  level: must
- item: 'Listed building consent: detail including fixings / fittings'
  level: must
  required-if:
    application-type:
      in:
      - lbc
  source-text: (inc fixings / fittings detail)
confidence: medium
notes: 'From the council''s list (published 11 May 2026), page 8, 11, 16, 26, 29, 32. Householder (and,
  under ''would normally include'', lawful development certificates): sloping sites, changes in ground
  / floor levels such as roof development and basements, hidden elevations, listed building and conservation
  area consents; ''hidden elevations'' has no field, so that part is shown as discretionary. Full: new
  dwellings or buildings, new floors or roof alterations (including below ground), works to listed buildings
  or affecting a designated or non-designated asset. Change of use: external building works or changes
  to floors. Listed building consent: ''Existing and Proposed Detail / Section Plans (inc fixings / fittings
  detail)''. Outline: ''Other drawings / details'' (e.g. sections) where some matters are reserved. The
  major checklist asks only for proposed sections.'
review-status: unverified
field-status: {}
