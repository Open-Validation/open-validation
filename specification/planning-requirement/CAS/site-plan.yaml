reference: site-plan
local-authority: CAS
required-if:
  application-type:
    in:
    - hh
    - ldc
    - full
    - technical-details-consent
    - outline
    - lbc
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: Site Layout or Block All applications
must-include:
- item: Scale 1:200 (or 1:500 for larger sites)
  level: must
- item: North point
  level: must
- item: All existing buildings on the site
  level: must
- item: All proposed buildings or extensions
  level: must
- item: Roof plan (where roof is being altered)
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
        - outline
        - lbc
    - condition:
        field: roof-alteration
        value: true
        description: The roof is being altered.
- item: Site access details
  level: must
- item: Roads, footpaths, and / or any public rights of way crossing or adjoining the site
  level: must
- item: Parking spaces
  level: must
- item: Boundary treatments
  level: must
- item: Extent of any hard landscaping and drainage provision
  level: must
- item: Trees and significant landscaping features on or neighbouring land where the roots or canopy spread
    over the site area
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - technical-details-consent
      - outline
      - lbc
- item: Unique drawing reference(s)
  level: must
- item: 'Lawful development certificates: where the application specifies two or more uses, operations
    or other matters, the plan shows which part of the land each relates to'
  level: must
  required-if:
    application-type:
      in:
      - ldc
  source-text: Where the application specifies two or more uses, operations or other matters, the plan
    which accompanies the application must indicate to which part of the land each such use, operation
    or matter relates.
confidence: medium
notes: From the council's list (published 11 May 2026), page 7, 10, 15-16, 19, 28-29, 31. 'Site Layout
  or Block plan', listed for householder, lawful development certificate, full, major, outline and listed
  building consent applications. The full and outline checklists say 'All applications'.
review-status: unverified
field-status: {}
