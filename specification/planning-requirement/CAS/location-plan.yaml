reference: location-plan
local-authority: CAS
required-if:
  application-type:
    in:
    - hh
    - ldc
    - prior-approval
    - full
    - technical-details-consent
    - outline
    - change-of-use
    - pip
    - lbc
    - advertising
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: 'Location Plan: Scale 1:1250 or 1:2500 with the site outlined in red and other owned land
  in blue.'
must-include:
- item: Ordnance Survey based
  level: must
- item: Scale 1:1250 or 1:2500
  level: must
- item: Site clearly outlined with a red line
  level: must
- item: Any other land owned by the applicant outlined with a blue line
  level: must
- item: Two named public roads and surrounding buildings
  level: must
- item: North point
  level: must
- item: A scale bar
  level: must
- item: 'Advertisements: indicates / shows the siting of the adverts'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Indicate / show siting of adverts
confidence: medium
notes: From the council's list (published 11 May 2026), page 6-7, 10, 12, 15, 19, 26, 28, 30, 31, 34.
  Every checklist except tree works (which asks for a site location / sketch plan instead) lists a location
  plan with the same contents. The prior approval checklist does not list the blue line.
review-status: unverified
field-status: {}
