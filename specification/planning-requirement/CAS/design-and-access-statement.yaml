reference: design-and-access-statement
local-authority: CAS
required-if:
  any:
  - ref: major-development
  - application-type:
      in:
      - lbc
  - application-type:
      in:
      - outline
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        - world-heritage-site
        description: In a conservation area or World Heritage Site.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: A building with a floor space of 100 sq m or more.
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
    - all:
      - site:
          in:
          - conservation-area
          - world-heritage-site
          description: In a conservation area or World Heritage Site.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: One or more new dwellings.
        - condition:
            field: floorspace
            operator: '>='
            value: 100
            description: A building with a floor space of 100 sq m or more.
  - all:
    - application-type:
        in:
        - change-of-use
    - condition:
        field: external-alterations
        value: true
        description: External building works are proposed.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more new dwellings.
      - condition:
          field: floorspace
          operator: '>'
          value: 100
          description: A building with a floor space of more than 100 sq m.
      - site:
          in:
          - listed-building
          description: Listed building.
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015 (as
  amended)
source-text: applications for listed building consent, and / or in a designated area (e.g. World Heritage
  Site or a conservation area) where the proposal consists of a building with a floor space of 100 sqm
  or more ... Design and Access Statement applications for one or more new dwellings listed building consent,
  and / or in a designated area (e.g. World Heritage Site or a conservation area) or a building with a
  floor space of 100 sqm ... Proposal consists of one or more new dwellings, or A building with a floor
  space of more than 100sqm, or Listed building ... Design and Access All applications
must-include:
- item: Justifies the design approach and accessibility of the development
  level: must
  required-if:
    any:
    - ref: major-development
    - application-type:
        in:
        - outline
- item: Covers the site's context
  level: must
  required-if:
    any:
    - ref: major-development
    - application-type:
        in:
        - outline
- item: Covers the design principles (amount, layout, scale, landscaping, appearance)
  level: must
  required-if:
    any:
    - ref: major-development
    - application-type:
        in:
        - outline
- item: Covers access arrangements for all users
  level: must
  required-if:
    any:
    - ref: major-development
    - application-type:
        in:
        - outline
- item: Covers the policy context and how the proposal fits its surroundings
  level: must
  required-if:
    ref: major-development
  source-text: policy context and how the proposal fits its surroundings
confidence: medium
notes: 'From the council''s list (published 11 May 2026), page 9, 18, 20, 27, 29. Major and outline: required
  item (''All applications'' for outline). Householder and full: under ''may be required where it would
  be relevant''; the full checklist''s wording (''applications for one or more new dwellings listed building
  consent, and / or in a designated area ... or a building with a floor space of 100 sqm'') is read with
  the householder wording and Article 9 of the DMPO as dwellings or 100 sq m in a conservation area or
  World Heritage Site. Change of use: the checklist asks for a ''Planning Statement / Design and Access
  Statement'' where external building works are proposed and the proposal is one or more new dwellings,
  a building of more than 100 sq m or a listed building. Listed building consent is in the householder
  and full wording.'
