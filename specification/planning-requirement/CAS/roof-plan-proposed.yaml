reference: roof-plan-proposed
local-authority: CAS
required-if:
  any:
  - all:
    - application-type:
        in:
        - ldc
    - any:
      - condition:
          field: roof-alteration
          value: true
          description: A change to an existing roof is proposed.
      - condition:
          field: new-build
          value: true
          description: A new building is proposed.
  - all:
    - application-type:
        in:
        - full
        - technical-details-consent
    - condition:
        field: roof-alteration
        value: true
        description: The roof is being altered.
    - discretionary
  - ref: major-development
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: 'Roof plan (Required for: proposed change to an existing roof and on all new buildings) ...
  Roof is being altered and the change cannot adequately be shown on elevation plans'
must-include:
- item: Scale 1:50 or 1:100 (as appropriate)
  level: must
  required-if:
    application-type:
      in:
      - ldc
- item: Scale 1:100 or 1:200
  level: must
  required-if:
    any:
    - application-type:
        in:
        - full
        - technical-details-consent
    - ref: major-development
- item: Scale bar
  level: must
- item: Unique drawing reference(s)
  level: must
confidence: medium
notes: 'From the council''s list (published 11 May 2026), page 11, 17, 20. The list says ''Roof plan''
  without existing / proposed. Lawful development certificates (under ''would normally include''): proposed
  change to an existing roof and all new buildings. Full: where the roof is being altered and the change
  cannot adequately be shown on elevation plans (an officer''s judgement, so discretionary). Major: always.
  Householder, outline and listed building consent checklists ask for the roof plan on the site layout
  or block plan instead (see site-plan).'
review-status: unverified
field-status: {}
