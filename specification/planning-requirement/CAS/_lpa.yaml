submission-standards:
- item: A scale bar on all plans; plans at standard metric scales such as 1:50 or 1:100
  level: must
- item: Plans must be scalable; no notes such as "Do not scale from this drawing"
  level: must
- item: Electronic plans in PDF format, saved or scanned at "Actual Size" (not fit to page) so they can
    be accurately scaled
  level: must
- item: Information consistent across all documents and plans (red line, measurements, proposed development)
  level: must
- item: Each plan submitted as an individual PDF file
  level: should
- item: Files named logically (e.g. "Proposed South Elevation.pdf") rather than by drawing number
  level: should
