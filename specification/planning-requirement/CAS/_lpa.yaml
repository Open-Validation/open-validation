review-status: unverified
validation-list:
  url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
  date: 2026-05-11
  date-basis: 'cover: ''Version Number: 3.5, Published Date: 11.05.2026, Effective Date: 25.06.2026''
    (PDF created 23 June 2026). The council''s Application Checklists page (checked 2026-11-06) says a
    public consultation on the proposed amendments was held in May 2026 and links ''Validation Checklist
    V3.5 Final'' as ''the final version of the updated Castle Point Validation Checklist'', with the consultation
    responses Q&A; no newer version is linked. The page''s per-type checklist pages repeat the same V3.5
    wording. MHCLG''s register (planning.data.gov.uk, local-area-requirements) still points to an older
    download.cfm file (2023). Page numbers in the requirement notes are PDF pages.'
  status: current
submission-standards:
- item: All plans and documents clear, precise, legible and easy to understand
  level: must
- item: Electronic plans in .pdf format, saved or scanned at 'Actual Size' (not 'fit to page') so they
    can be accurately scaled; hard copies printed at their original size
  level: must
- item: A scale bar on all plans
  level: must
- item: Plans at standard metric scales (such as 1:50 or 1:100); the stated scale matches the written
    dimensions
  level: must
- item: 'Plans must be scalable: no notes such as ''Do not scale from this drawing'''
  level: must
- item: Information entirely consistent across all documents and plans (red line boundary, measurements,
    proposed development); elevations, block plans and floor plans correspond
  level: must
- item: Red line (application site) and blue line (other land owned by the applicant) complete and consistent;
    the location plan red line matches all other documents
  level: must
- item: Floor plans have clear room designations / labels
  level: must
- item: 'Plans show planning details only: no Building Control or structural details, references to other
    approved applications, fallback positions or alternative proposals, or other clutter'
  level: must
- item: Each plan submitted as an individual PDF file, correctly oriented and in a scalable format
  level: should
- item: Composite plans (existing on one sheet, proposed on another) for before-and-after comparison
  level: should
- item: Files named logically (e.g. 'Proposed South Elevation.pdf') rather than by drawing number
  level: should
- item: Applications submitted through the Planning Portal (email only where Portal limits prevent it)
  level: should
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is the current V3.5 list (published 11 May 2026, effective 25 June 2026), but
    the extraction is poor. Householder, LBC, advert, tree, LDC, PiP and prior approval are all wrongly
    marked as having no local requirements. Many items are missing, Major-only items are lumped under
