reference: elevation-proposed
local-authority: CAS
required-if:
  any:
  - any:
    - all:
      - application-type:
          in:
          - hh
      - condition:
          field: building-works
          value: true
          description: Works other than alterations to hardstanding, ramps, decking or dropped kerbs.
    - all:
      - application-type:
          in:
          - full
          - technical-details-consent
      - any:
        - condition:
            field: building-works
            value: true
            description: Alterations and / or extensions to an existing building are proposed.
        - condition:
            field: new-build
            value: true
            description: A new dwelling or building (e.g. an annexe) is proposed.
        - condition:
            field: basement
            value: true
            description: Development below ground level is proposed.
    - ref: major-development
    - application-type:
        in:
        - lbc
    - application-type:
        in:
        - outline-some
    - all:
      - application-type:
          in:
          - ldc
      - discretionary
    - all:
      - application-type:
          in:
          - prior-approval
      - discretionary
  - all:
    - application-type:
        in:
        - change-of-use
    - condition:
        field: external-alterations
        value: true
        description: External building works are proposed.
  - all:
    - application-type:
        in:
        - advertising
    - condition:
        field: advert-on-existing-building
        value: true
        description: The advertisements would be attached to / erected on a building.
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015 (as amended)
source-text: 'Full existing elevations and floor plans of property (Not required for: alterations to hardstanding,
  ramps, decking or dropped kerbs) ... Where alterations and / or extensions to an existing building(s)
  are proposed. When a new dwelling or building(s) are proposed e.g. annexe* Where the development proposed
  is below ground level. ... Elevations (Existing and Proposed) ... Where external building works are
  proposed ... Elevations (where advertisements would be attached / erected)'
must-include:
- item: Scale 1:50 or 1:100
  level: must
- item: Scale bar
  level: must
- item: Unique drawing reference(s)
  level: must
- item: 'Advertisements: existing and proposed, with a north point'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'Advertisements: show the projection where installed on a building'
  level: must
  required-if:
    application-type:
      in:
      - advertising
  source-text: Show projection where installed on building
- item: 'Green Belt development: full volume calculations of the proposed development'
  level: must
  required-if:
    site:
      in:
      - green-belt
      description: Green Belt development.
  source-text: Green Belt development - full volume calculations of proposed development are required
confidence: medium
notes: 'From the council''s list (published 11 May 2026), page 7-8, 11-12, 16, 20, 26, 29, 31-32, 34.
  Householder, full, major and listed building consent checklists list ''Full existing / proposed elevations
  and floor plans of property'' (householder and full: not needed for alterations to hardstanding, ramps,
  decking or dropped kerbs). Outline: ''Other drawings / details (e.g. elevations, floor plans, street
  scene, sections)'' for outline applications with some matters reserved. Discretionary for lawful development
  certificates (the list says the supporting plans ''would normally include'' them) and prior approvals
  (''where requested or as additional information''). Change of use: where external building works are
  proposed. Advertisement consent: where advertisements would be attached / erected.'
review-status: unverified
field-status: {}
