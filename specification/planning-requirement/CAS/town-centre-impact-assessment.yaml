reference: town-centre-impact-assessment
local-authority: CAS
required-if:
  all:
  - application-type:
      in:
      - full
      - technical-details-consent
      - outline
  - any:
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 2500
        description: Retail and leisure developments over 2,500 sq m.
    - all:
      - condition:
          field: out-of-centre-town-centre-use
          value: true
          description: Other main town centre uses outside defined town centres.
      - condition:
          field: departure-from-development-plan
          value: true
          description: Not in accordance with the development plan.
    - discretionary
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: Retail Assessment retail and leisure developments over 2500 square metres, or; smaller retail
  and leisure likely to have a significant impact on smaller centres, or; Applications for other main
  town centre uses when they are o outside of defined town centres; and o not in accordance with the development
  plan
confidence: medium
notes: From the council's list (published 11 May 2026), page 18. Full 'Other documents' ('Retail Assessment').
  'Smaller retail and leisure likely to have a significant impact on smaller centres' is a judgement,
  so discretionary.
review-status: unverified
field-status: {}
