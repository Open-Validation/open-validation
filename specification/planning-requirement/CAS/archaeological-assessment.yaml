reference: archaeological-assessment
local-authority: CAS
required-if:
  all:
  - ref: major-development
  - any:
    - site:
        in:
        - scheduled-monument
        description: Within the setting of ancient monuments.
    - discretionary
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: Developments within the setting of ancient monuments, or other archaeological constraints
must-include:
- item: Desk-based assessment, geophysical assessment or evaluation works assessing the extent and significance
    of archaeological deposits within the application site
  level: must
confidence: medium
notes: From the council's list (published 11 May 2026), page 24. Major checklist only. 'Other archaeological
  constraints' has no field, so it is discretionary.
review-status: unverified
field-status: {}
