reference: heritage-statement
local-authority: CAS
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - technical-details-consent
        - outline
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          description: The proposal would affect a heritage asset or its setting.
      - discretionary
  - all:
    - ref: major-development
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - conservation-area
          description: Affecting, or within the setting of, a conservation area or a listed building or
            structure.
      - discretionary
  - all:
    - application-type:
        in:
        - advertising
    - site:
        in:
        - listed-building
        - conservation-area
        description: Listed building or conservation area.
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: 'Heritage Statement where the proposal would have a detrimental impact on a ‘heritage asset’
  or its setting ... Applications affecting, or within the setting of a: ▪ conservation area ▪ listed
  building or structure ▪ other heritage asset ... Supporting information in designated areas (listed
  buildings, conservation areas) ... Heritage / Supporting Statement ▪ Explain and justify how the sign
  respects the building / area''s character and appearance'
must-include:
- item: Description of the heritage asset and its setting
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - ref: major-development
- item: Assessment of its significance, including any contribution made by its setting, proportionate
    to the asset's importance (maps, photos, documents and other historical details)
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - ref: major-development
- item: Evaluation of the impact of the proposed works on the asset and its setting
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - ref: major-development
- item: 'Mitigation: measures to preserve the asset and its setting, such as details of materials and
    construction techniques'
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - ref: major-development
- item: Statement of justification for the works
  level: must
  required-if:
    any:
    - application-type:
        in:
        - lbc
    - ref: major-development
- item: 'Advertisements: explains and justifies how the sign respects the building / area''s character
    and appearance'
  level: must
  required-if:
    application-type:
      in:
      - advertising
confidence: medium
notes: 'From the council''s list (published 11 May 2026), page 9, 18, 24, 32, 34. Listed building consent:
  required item. Householder and full (''may be required''): where the proposal would have a detrimental
  impact on a heritage asset or its setting. Major: applications affecting, or within the setting of,
  a conservation area, listed building or structure or ''other heritage asset'' (no field, so discretionary).
  Advertisements in designated areas (listed buildings, conservation areas): ''This would normally include''
  a Heritage / Supporting Statement.'
review-status: unverified
field-status: {}
