reference: planning-statement
local-authority: CAS
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - technical-details-consent
      - outline
  - any:
    - condition:
        field: outbuilding
        value: true
        description: Outbuildings, where justification for the development is required.
    - condition:
        field: residential-annexe
        value: true
        description: Annexes, where justification for the development is required.
    - discretionary
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: Planning / Supporting Statement where justification for the development is required e.g.
  *outbuildings and annexes, or where “very special circumstances” needs to be demonstrated
confidence: medium
notes: From the council's list (published 11 May 2026), page 9, 17. Householder and full 'Other documents'
  ('may be required where it would be relevant'). 'Very special circumstances' and other cases needing
  justification are discretionary. The lawful development certificate checklist lists a planning / support
  statement only as helpful evidence ('The application would not be made invalid if you do not submit
  the following information').
review-status: unverified
field-status: {}
