reference: travel-plan
local-authority: CAS
required-if:
  all:
  - ref: major-development
  - any:
    - discretionary
    - condition:
        field: staff-count
        operator: '>='
        value: 50
        description: Employment sites with 50 or more employees.
    - condition:
        field: school-expansion
        value: true
        description: Schools.
source-url: https://www.castlepoint.gov.uk/documents/d/guest/validation-checklist-v3-5-final-pdf
source-text: Travell Plans are also required for employment sites (50 employees+) and schools.
confidence: medium
notes: From the council's list (published 11 May 2026), page 23. Major checklist ('Draft Travel Plan').
  Otherwise the thresholds are those in section 5.8 of Essex County Council's Developers' Guide to Infrastructure
  Contributions (February 2026), which the list does not repeat, so discretionary. The travel plan is
  subject to an annual monitoring fee.
