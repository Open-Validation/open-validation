reference: daylight-sunlight-assessment
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: storey-count
        operator: '>'
        value: 1
        description: The proposal is greater than one storey in height.
    - all:
      - condition:
          field: residential-extension
          value: true
          description: A large single storey extension.
      - discretionary
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
source-text: Required to show the impact of the proposed development on a neighbouring property and garden
  if the proposal is greater than one storey in height or a large single storey extension.
confidence: medium
notes: From the council's list (published 23 May 2025), page 2 of the Full Planning Permission checklist;
  householder checklist page 2. 'Large' single storey extension isn't defined, so that part shows as discretionary.
review-status: unverified
field-status: {}
