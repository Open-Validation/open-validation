reference: floor-plan-proposed
local-authority: STO
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - outline-some
      - reserved-matters
      - lbc
      - ldc
      - non-material-amendment
  - all:
    - application-type:
        in:
        - prior-approval
    - condition:
        field: building-works
        value: true
        description: The proposal includes a building or structure.
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Floor plans (at a scale of 1:100 or 1:50) ... (Existing and proposed)
must-include:
- item: At a scale of 1:100 or 1:50
  level: must
- item: Any walls being demolished clearly shown
  level: should
  required-if:
    application-type:
      in:
      - full
      - outline-some
      - reserved-matters
      - ldc
- item: Dimensions and proposed use of each room, and the position and dimensions of windows, doors and
    walls, to assess natural light in all habitable rooms
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: Indicating the dimensions and proposed use of each room, the position and dimensions of
    windows, doors and walls; to assess the provision of natural light in all habitable rooms.
- item: The proposed internal layout and its proposed use
  level: must
  required-if:
    application-type:
      in:
      - pa-build-agri-forest
      - pa-road-agri-forest
  source-text: Showing the proposed internal layout and its proposed use.
- item: What was permitted and what is proposed
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
confidence: medium
notes: 'From the council''s list (published 23 May 2025), page 2 of the Full Planning Permission checklist.
  Prior approvals checklist page 1 and agricultural prior notification checklist page 1: ''(for building
  or structure only)''. Non-material amendment checklist page 1.'
review-status: unverified
field-status: {}
