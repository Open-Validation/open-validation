required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: Developments of 10 or more dwellings.
    - condition:
        field: retail-floorspace
        operator: '>='
        value: 1000
        description: Retail development of 1000sqm or more.
    - all:
      - condition:
          field: floorspace
          operator: '>'
          value: 1000
          description: Other developments in excess of 1000sqm.
      - discretionary
