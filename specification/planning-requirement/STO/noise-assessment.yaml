reference: noise-assessment
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: noise-sensitive-use
        value: true
        description: Noise affecting the proposed development (e.g. a trunk road next to new housing).
    - condition:
        field: noise-generating-use
        value: true
        description: Noise from the proposed development (e.g. new commercial or industrial development).
    - condition:
        field: plant-equipment
        value: true
        description: The proposal includes ventilation or extraction.
source-url: https://www.stroud.gov.uk/media/ij3g4c0x/local-validation-checklist-full-planning-permission-and-advertisement-consent-updated-23052025.pdf
source-text: Noise Impact Assessment Required for impacts of noise upon proposed developments (such as
  impact of trunk road on a proposed housing development) Required for impact of noise from proposed developments
  (such as impact arising from a new commercial/industrial development) Also required for proposals including
  ventilation or extraction which must also include exact details of proposed ventilation/extraction,
  acoustic noise characteristics and odour abatement measures.
must-include:
- item: Exact details of proposed ventilation/extraction, acoustic noise characteristics and odour abatement
    measures
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: The proposal includes ventilation or extraction.
confidence: medium
notes: 'Audit (wrong_app_type): not on the advert or LBC checklists.'
review-status: unverified
field-status: {}
