reference: noise-assessment
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - condition:
          field: noise-sensitive-use
          value: true
          description: A proposal affected by noise, such as housing near a trunk road.
      - discretionary
    - condition:
        field: noise-generating-use
        value: true
        description: A proposal that creates noise, such as new commercial or industrial development.
    - condition:
        field: plant-equipment
        value: true
        description: The proposal includes ventilation or extraction.
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
source-text: Required for impacts of noise upon proposed developments (such as impact of trunk road on
  a proposed housing development) ... Required for impact of noise from proposed developments (such as
  impact arising from a new commercial/industrial development) ... Also required for proposals including
  ventilation or extraction which must also include exact details of proposed ventilation/extraction,
  acoustic noise characteristics and odour abatement measures.
must-include:
- item: Exact details of the proposed ventilation or extraction, its acoustic noise characteristics and
    odour abatement measures
  level: must
  required-if:
    condition:
      field: plant-equipment
      value: true
      description: The proposal includes ventilation or extraction.
confidence: medium
notes: From the council's list (published 23 May 2025), page 3 of the Full Planning Permission checklist.
  'Noise Impact Assessment'. Noise affecting a new development has no clear test (the trunk road is only
  an example), so that part shows as discretionary.
review-status: unverified
field-status: {}
