reference: lighting-assessment
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - advertising
  - any:
    - condition:
        field: floodlighting
        value: true
        description: The development proposes floodlighting.
    - condition:
        field: external-lighting
        value: true
        description: The development proposes significant external lighting.
source-url: https://www.stroud.gov.uk/media/ij3g4c0x/local-validation-checklist-full-planning-permission-and-advertisement-consent-updated-23052025.pdf
source-text: Lighting Assessment For any development proposing floodlighting or significant external lighting.
must-include:
- item: Technical details of proposed lighting and hours of operation
  level: must
- item: A layout plan showing beam orientation
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): on the Full/Outline/RM and standalone advert checklists, not LBC.'
review-status: unverified
field-status: {}
