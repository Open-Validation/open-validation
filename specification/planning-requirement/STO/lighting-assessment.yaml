reference: lighting-assessment
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - advertising
  - any:
    - condition:
        field: floodlighting
        value: true
        description: Floodlighting is proposed.
    - condition:
        field: external-lighting
        value: true
        description: Significant external lighting is proposed.
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
source-text: For any development proposing floodlighting or significant external lighting.
must-include:
- item: Technical details of the proposed lighting and hours of operation
  level: must
- item: A layout plan showing beam orientation
  level: must
confidence: medium
notes: From the council's list (published 23 May 2025), page 3 of the Full Planning Permission checklist;
  advertisement checklist page 2.
review-status: unverified
field-status: {}
