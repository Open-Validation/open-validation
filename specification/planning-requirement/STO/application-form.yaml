reference: application-form
local-authority: STO
required-if:
  always: true
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Completed application form ... (including ownership certificate, either A, B, C or D)
must-include:
- item: Ownership certificate (A, B, C or D) completed
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - ldc
      - s73
- item: Developer's contact details (address and email or phone)
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: Must include developers contact details (address and email or phone)
- item: Written description of the proposed development, including any building or other operations for
    development under Class C, M, N or Q
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: Completed application form or written description of the proposed development (which in
    relation to development proposed under Class C, M, N or Q must include any building or other operations)
- item: Signed declaration form
  level: must
  required-if:
    application-type:
      in:
      - pa-build-agri-forest
      - pa-road-agri-forest
  source-text: Including a signed declaration form
confidence: medium
notes: From the council's list (published 23 May 2025), page 1 of the Full Planning Permission checklist.
  Every checklist starts with the completed application form; the householder, listed building, advertisement,
  lawful development and variation of condition checklists ask for the ownership certificate too. Prior
  approvals checklist page 1 and Agricultural Prior Notification checklist page 1 add the items for those
  types.
review-status: unverified
field-status: {}
