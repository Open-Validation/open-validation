reference: location-plan
local-authority: STO
required-if:
  application-type:
    in:
    - hh
    - full
    - outline
    - reserved-matters
    - lbc
    - advertising
    - ldc
    - prior-approval
    - s73
    - approval-condition
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: Site location plan (at a scale of 1:1000, 1:1250 or 1:2500)
must-include:
- item: At a scale of 1:1000, 1:1250 or 1:2500
  level: must
- item: Application site outlined in red
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - ldc
      - s73
      - approval-condition
      - pa-build-agri-forest
      - pa-road-agri-forest
- item: All other land in the applicant's ownership outlined in blue
  level: must
  required-if:
    application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - advertising
      - ldc
      - s73
      - approval-condition
      - pa-build-agri-forest
      - pa-road-agri-forest
- item: Names of surrounding roads; large enough to locate the site easily
  level: must
  source-text: Plan must detail names of surrounding roads and be large enough to easily locate the site
- item: Indicates the site and shows the proposed development
  level: must
  required-if:
    application-type:
      in:
      - prior-approval
  source-text: Plan indicating the site and showing the proposed development
confidence: medium
notes: From the council's list (published 23 May 2025), page 1 of the Full Planning Permission checklist.
  On every checklist except non-material amendments and tree works (which accept a site location plan
  or a block plan). The prior approvals checklist (page 1) asks for a plan indicating the site and the
  proposed development instead of the red and blue lines. The householder and listed building checklists
  leave out the road-names line, but the Drawing Standards (item 8) say any site location plan must include
  named roads.
review-status: unverified
