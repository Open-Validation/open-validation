reference: viability-assessment
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - condition:
      field: affordable-housing-below-target
      value: true
      description: Fewer affordable units are proposed than policy CP9 requires.
