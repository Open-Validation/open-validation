reference: flood-risk-assessment
local-authority: STO
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - reserved-matters
        - prior-approval
    - site:
        in:
        - flood-risk-zone
        description: Flood zone 2 or 3.
  - all:
    - application-type:
        in:
        - prior-approval
    - site:
        in:
        - critical-drainage-area
        description: A site with critical drainage problems identified by the Environment Agency.
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
source-text: Required if the proposed site is located in flood zones 2 or 3.
confidence: medium
notes: From the council's list (published 23 May 2025), page 2 of the Full Planning Permission checklist;
  householder checklist page 2. The prior approvals checklist (page 1) asks for a site specific flood
  risk assessment 'For site in flood zones 2 and 3, or for a site which has critical drainage problems
  identified by the Environment Agency'.
