reference: flood-risk-assessment
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - prior-approval
  - any:
    - site:
        in:
        - flood-risk-zone
        description: The site is in flood zone 2 or 3.
    - all:
      - application-type:
          in:
          - prior-approval
      - site:
          in:
          - critical-drainage-area
          description: A site with critical drainage problems identified by the Environment Agency.
