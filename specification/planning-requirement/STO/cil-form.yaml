reference: cil-form
local-authority: STO
required-if:
  any:
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: An extension over 100sqm.
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - prior-approval
source-url: https://www.stroud.gov.uk/media/ij3g4c0x/local-validation-checklist-full-planning-permission-and-advertisement-consent-updated-23052025.pdf
source-text: CIL Levy is applicable to extensions over 100sqm. Both Form 1 (Additional Information) and
  Form 2 (Assumption of Liability) must be submitted with the planning application in order to establish
  CIL liability.
must-include:
- item: Form 1 (Additional Information) and Form 2 (Assumption of Liability)
  level: must
confidence: medium
notes: 'Audit (wrong_app_type): not on the advert or LBC checklists.'
review-status: unverified
field-status: {}
