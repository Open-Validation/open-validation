reference: cil-form
local-authority: STO
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - all:
    - application-type:
        in:
        - hh
        - prior-approval
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: Extensions over 100 sq m.
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
policy: Community Infrastructure Levy Regulations 2010 (as amended); Stroud District CIL
source-text: Both Form 1 (Additional Information) and Form 2 (Assumption of Liability) must be submitted
  with the planning application in order to establish CIL liability. ... CIL Levy is applicable to extensions
  over 100sqm.
must-include:
- item: Form 1 (Additional Information)
  level: must
- item: Form 2 (Assumption of Liability)
  level: must
confidence: medium
notes: From the council's list (published 23 May 2025), page 3 of the Full Planning Permission checklist;
  householder checklist page 2; prior approvals checklist page 2. The full, outline and reserved matters
  checklists ask for both forms to establish CIL liability; the householder and prior approvals checklists
  say CIL applies to extensions over 100 sq m.
review-status: unverified
field-status: {}
