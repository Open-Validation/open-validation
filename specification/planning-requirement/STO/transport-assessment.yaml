source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
source-text: Required for proposals likely to have significant highway implications.
must-include:
- item: Accessibility to the site by all modes of transport
  level: must
- item: Likely modal split of journeys to and from the site
  level: must
- item: Measures to improve access to the site by sustainable methods
  level: must
- item: All existing and proposed movements to and from the site
  level: must
- item: Parking and manoeuvring areas on a plan
  level: must
