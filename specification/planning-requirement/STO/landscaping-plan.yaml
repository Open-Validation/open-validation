reference: landscaping-plan
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New residential development.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: New commercial development.
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
source-text: Required for any new residential or commercial development. ... Must show hard and soft boundary
  treatments. ... Must show position of trees and vegetation to be retained. ... Must clearly show any
  trees or vegetation to be removed. ... Must detail any new planting including a 5-year schedule of maintenance.
must-include:
- item: Hard and soft boundary treatments
  level: must
- item: Position of trees and vegetation to be retained
  level: must
- item: Any trees or vegetation to be removed
  level: must
- item: Any new planting, with a 5-year schedule of maintenance
  level: must
confidence: medium
notes: From the council's list (published 23 May 2025), page 3 of the Full Planning Permission checklist.
  'Landscape Scheme'. Listed under 'Local Requirement List' ('please note not all requirements may be
  applicable'); the outline and reserved matters checklists repeat it word for word.
review-status: unverified
field-status: {}
