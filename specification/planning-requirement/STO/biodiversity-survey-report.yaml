reference: biodiversity-survey-report
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
      - prior-approval
      - consent-under-tpo
      - notice-trees-in-con-area
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - ramsar
        - national-nature-reserve
        - local-wildlife-site
        description: The proposal (including any off-site works) will affect a designated site.
    - site:
        in:
        - priority-habitat
        description: The proposal will affect Priority Habitats.
    - condition:
        field: protected-species
        value: true
        description: The proposal will affect species protected by law or Priority Species.
    - discretionary
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
source-text: 'You should submit a biodiversity survey when the development proposal ... will affect: ...
  Designated sites ... Priority Habitats ... Other biodiversity features ... Species protected by law
  ... Priority Species'
confidence: medium
notes: From the council's list (published 23 May 2025), page 2 of the Full Planning Permission checklist.
  On every checklist for planning permission, listed building consent, prior approvals, agricultural prior
  notification and tree works, '(including any off-site works)'. 'Other biodiversity features' has no
  clear test, so that part shows as discretionary.
review-status: unverified
field-status: {}
