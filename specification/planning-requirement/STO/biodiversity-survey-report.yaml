reference: biodiversity-survey-report
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - hh
      - lbc
      - full
      - outline
      - reserved-matters
      - prior-approval
  - any:
    - site:
        in:
        - site-of-special-scientific-interest
        - special-area-of-conservation
        - special-protection-area
        - local-wildlife-site
        - priority-habitat
        description: The proposal (including offsite works) affects designated sites or priority habitats.
    - condition:
        field: protected-species
        value: true
        description: The proposal affects other biodiversity features, species protected by law or priority
          species.
source-url: https://www.stroud.gov.uk/media/eachhw1y/local-validation-checklist-prior-approvals-updated-23052025.pdf
source-text: 'Biodiversity Survey You should submit a biodiversity survey when the development proposal
  (including any offsite works) will affect: Designated sites Priority Habitats Other biodiversity features
  Species protected by law Priority Species'
confidence: medium
notes: 'From the audit (missing_requirement): on the Householder, LBC and Full/Outline/RM checklists;
  the council''s wording was in the workbook''s prior approval rows.'
