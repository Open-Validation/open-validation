reference: archaeological-assessment
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
      - lbc
  - any:
    - condition:
        field: new-build
        value: true
        description: The development includes new buildings.
    - condition:
        field: ground-disturbance
        value: true
        description: The development includes ground disturbance.
  - site:
      in:
      - archaeological-priority-area
      - scheduled-monument
      description: On or adjoining a heritage asset of archaeological importance.
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
source-text: For developments that includes new buildings or ground disturbance on or adjoining a heritage
  asset of archaeological importance.
confidence: medium
notes: From the council's list (published 23 May 2025), page 2 of the Full Planning Permission checklist;
  householder checklist page 2; listed building consent checklist page 2. Listed under 'Local Requirement
  List' ('please note not all requirements may be applicable'); the outline and reserved matters checklists
  repeat it word for word. Guidance is on Gloucestershire County Council's archaeology pages.
review-status: unverified
field-status: {}
