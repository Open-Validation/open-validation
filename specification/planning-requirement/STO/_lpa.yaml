local-authority: STO
name: Stroud District Council
region: South West
type: District
review-status: unverified
validation-list:
  url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
  date: 2025-05-23
  date-basis: 'File names and link titles on the council''s Validation checklists page: ''Updated 23.05.2025''
    (PDFs created 27 May 2025). Stroud publishes one checklist per application type; the Full Planning
    Permission checklist is used here, the others are cited per file'
  status: current
submission-standards:
- item: One copy of each document and plan
  level: must
- item: Plans drawn accurately to a conventional metric scale (such as 1:100 or 1:50), with the scale
    and paper size stated
  level: must
- item: Drawn on A3 or A4 paper
  level: should
- item: All plans and drawings except location plans include a scale bar and measured dimensions
  level: must
- item: No 'Not to scale' or 'Do not scale from this drawing' disclaimers
  level: must
- item: Elevations, floor plans and sections have a title box with the address, description of the proposal,
    drawing title, date drawn, scale, paper size, and drawing number and revisions
  level: must
- item: Revisions clearly labelled with the revised date
  level: must
- item: All site, block and floor plans show North
  level: must
- item: Plain white paper; no graph paper or pencil drawings; no overly faint drawings or text
  level: must
- item: Plans clearly annotated
  level: should
- item: File names say what each file shows (for example 'proposed elevations'); plans correctly orientated
  level: must
- item: Files normally submitted as PDF
  level: should
- item: 'Major developments: one full paper copy as well, for consultation and public examination'
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot''s link is current: Stroud''s checklists were updated 23.05.2025, though the workbook
    records 2025-05-01. But it points to one combined Full + Advert checklist rather than the 20-checklist
    set, and the tab holds only two process sentences. App-type rows taken from combined checklists put
    full-planning items (affordable housing, travel plan, CIL, etc.) under Advertisement consent and LBC.
    They also miss Biodiversity Survey, Surface Water Drainage Strategy, Transport Assessment, Air Quality,
    Sustainability Checklist and Agricultural Dwelling Justification. Fixed 2026-11-05: every file was
    rewritten from the council''s latest list.'
