source-text: 'Advertisement consent: the site Block Plan (at a scale of 1:200 or 1:500) (Existing and
  proposed) Block plan must show: • The proposed development in relation to the site boundaries and adjacent
  buildings. • Location of proposed signage Drawings (at a scale of 1:100 or 1:50) (Existing and proposed)
  Drawings required to detail proposed advertisement; position, size, materials, colours, height above
  ground, projection and illumination details.


  Lawful development cert: the site Block Plan (at a scale of 1:200 or 1:500) (Existing and proposed)
  Block plan must show: • Any existing structures on the site. • Any existing trees or public rights of
  way. • Parking areas.'
