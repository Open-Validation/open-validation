confidence: medium
notes: From the council's list (published 23 May 2025), page 1 of the Full Planning Permission checklist.
  Outline (all matters reserved) checklist page 1 asks only for the access points; the advertisement checklist
  page 1 for the signage; the householder and listed building checklists give no contents. The lawful
  development (existing) checklist asks for existing structures, trees, rights of way and parking areas.
