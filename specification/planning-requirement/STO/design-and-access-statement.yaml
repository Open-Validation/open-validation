reference: design-and-access-statement
local-authority: STO
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The development is in a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100 sq m of new floor space.
  - application-type:
      in:
      - lbc
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Required for development: ... that is major development ... of one or more dwelling in a
  Conservation Area ... of 100sqm new floor space to be created in a Conservation Area ... for applications
  for listed building consent'
confidence: medium
notes: From the council's list (published 23 May 2025), page 1 of the Full Planning Permission checklist.
  The same wording is on the householder, outline, reserved matters and listed building checklists.
review-status: unverified
field-status: {}
