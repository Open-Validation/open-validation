reference: design-and-access-statement
local-authority: STO
required-if:
  any:
  - application-type:
      in:
      - lbc
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: The development is in a Conservation Area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: 100sqm of new floor space.
source-url: https://www.stroud.gov.uk/media/30ig4z4o/local-validation-checklist-advertisement-listed-building-consent-updated-23052025.pdf
source-text: 'Design and Access Statement Required for development: that is major development of one or
  more dwelling in a Conservation Area of 100sqm new floor space to be created in a Conservation Area
  for applications for listed building consent'
confidence: medium
notes: 'Audit (wrong_trigger): the Householder and LBC rows were a fragment (''formulation of design and
  access statements.'').'
review-status: unverified
field-status: {}
