reference: affordable-housing-statement
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - discretionary
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
policy: Stroud District Local Plan policy CP9; Planning Obligations SPD
source-text: 'Required where a proposal should include the provision of affordable housing under Stroud
  District Local Plan (SDLP) Policy CP9:'
must-include:
- item: Number, mix and tenure of units
  level: must
- item: Gross internal floor area per unit in m2
  level: must
- item: A viability appraisal if fewer affordable units are proposed than required
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Fewer affordable units are proposed than policy requires.
confidence: medium
notes: From the council's list (published 23 May 2025), page 2 of the Full Planning Permission checklist.
  Listed under 'Local Requirement List' ('please note not all requirements may be applicable'); the outline
  and reserved matters checklists repeat it word for word. Shown as discretionary because the threshold
  is set by policy CP9, which the checklist doesn't repeat. Affordable housing is secured by a S106 agreement.
review-status: unverified
field-status: {}
