source-text: 'Full planning: Elevations (at a scale of 1:100 or 1:50) Tick when provided (Existing and
  proposed) Proposed elevations must show the proposed development in relation to any adjacent buildings.


  Outline, Reserved matters: Elevations (at a scale of 1:100 or 1:50) (Existing and proposed) Proposed
  elevations must show the proposed development in relation to any adjacent buildings.


  Listed building consent: Elevations (at a scale of 1:100 or 1:50) (Existing and proposed) Tick when
  provided Proposed elevations must show the proposed development in relation to any adjacent buildings.


  Lawful development cert: Elevations (at a scale of 1:100 or 1:50) Elevations must show the development
  in relation to any adjacent buildings.


  Change of use - prior approval: proposed development Floor plans (at a scale of 1:100 or 1:50) (for
  building or structure only) Indicating the dimensions and proposed use of each room, the position and
  dimensions of windows, doors and walls; to assess the provision of natural light in all habitable rooms.'
