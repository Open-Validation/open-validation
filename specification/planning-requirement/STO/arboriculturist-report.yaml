reference: arboriculturist-report
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Development (including hard surfaces, compounds, utilities, excavations or level changes)
        within 15m of a TPO tree or a tree in a conservation area, or within 10m of any other tree 5m
        or more tall or with a trunk diameter of 250mm or more.
source-url: https://www.stroud.gov.uk/media/ij3g4c0x/local-validation-checklist-full-planning-permission-and-advertisement-consent-updated-23052025.pdf
source-text: Tree Survey Required for any development (including the provision of hard surfaces, site
  construction compound areas, utilities, excavations or changes in ground levels) that would be within
  15m of any tree protected by a Tree Preservation Order or in a Conservation Area be within 10m of any
  other tree that is 5m or over in height or has a trunk diameter of 250mm or more Tree surveys must be
  written in accordance with the guidance in British Standard 5837
must-include:
- item: Written in accordance with BS 5837 'Trees in relation to design, demolition and construction'
  level: must
confidence: medium
notes: 'Audit (missing_requirement, wrong_app_type): also on the Householder checklist; not on the LBC
  or advert checklists.'
review-status: unverified
field-status: {}
