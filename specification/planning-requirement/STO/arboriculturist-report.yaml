reference: arboriculturist-report
local-authority: STO
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - any:
    - all:
      - site:
          in:
          - tree-preservation-zone
          - conservation-area
          description: A tree protected by a Tree Preservation Order or in a Conservation Area.
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Development (including hard surfaces, compounds, utilities, excavations or level
            changes) within 15 m of a tree protected by a TPO or in a Conservation Area.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Development within 10 m of any other tree that is 5 m or over in height or has a
          trunk diameter of 250 mm or more.
source-url: https://www.stroud.gov.uk/media/54zb02my/local-validation-checklist-full-planning-permission-updated-23052025.pdf
source-text: Required for any development (including the provision of hard surfaces, site construction
  compound areas, utilities, excavations or changes in ground levels) that would ... be within 15m of
  any tree protected by a Tree Preservation Order or in a Conservation Area ... be within 10m of any other
  tree that is 5m or over in height or has a trunk diameter of 250mm or more
must-include:
- item: Written in accordance with BS 5837 (Trees in relation to design, demolition and construction)
  level: must
confidence: medium
notes: From the council's list (published 23 May 2025), page 4 of the Full Planning Permission checklist;
  householder checklist page 2. 'Tree Survey'.
review-status: unverified
field-status: {}
