source-text: Where the development is proposed inside, or adjacent to an air quality management area (AQMA),
  where the development could in itself result in the designation of an AQMA or where it would conflict
  with, or render unworkable, elements of a local authority's air quality action plan, applications should
  be supported by such information as is necessary to allow a full consideration of the impact of the
  proposal on the air quality
confidence: low
