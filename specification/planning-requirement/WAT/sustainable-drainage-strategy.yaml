reference: sustainable-drainage-strategy
local-authority: WAT
required-if:
  any:
  - condition:
      field: dwelling-count
      operator: '>='
      value: 10
      description: Developments of 10 dwellings or more.
  - all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Major commercial development.
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Watford Local Plan 2021-2038, Chapter 9; Flood and Water Management Act 2010
source-text: 'Surface Water Drainage Scheme: With regard to surface water drainage, the Flood and Water
  Management Act (2010) introduced the requirement for Sustainable Drainage Systems (SuDs) in new developments.
  The Government’s Ministerial Statement of 18 December 2014 requires that all developments of 10 dwellings
  or more and all major commercial developments must incorporate SuDs, details of which must be submitted
  at the planning application stage. More information can be found in Chapter 9 of the Watford Local Plan
  (2021-2038) and detailed guidance on the Lead Local Flood Authority website.'
must-include:
- item: The County Council's flood validation list checked and a Surface Water Drainage Statement completed
  level: should
  source-text: Applicants are encouraged to check and comply with the County Council’s Flood validation
    list and complete a Surface Water Drainage Statement
confidence: medium
notes: From the council's list (revised June 2025), pages 9-10, 12. The list calls it a 'Surface Water
  Drainage Scheme'. The Part C matrix (page 12) marks it 'Required' for new residential development of
  10 or more dwellings and new commercial development of more than 1000 sq m, and 'where appropriate'
  for smaller residential and commercial development and outline applications (shown as discretionary).
