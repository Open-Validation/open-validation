reference: lighting-assessment
local-authority: WAT
required-if:
  all:
  - application-type:
      in:
      - full
  - condition:
      field: external-lighting
      value: true
      description: External lighting would be provided or made necessary by the development.
  - any:
    - site:
        in:
        - listed-building-setting
        - conservation-area
        description: In the vicinity of a listed building or a conservation area.
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
source-text: 'Light Impact Assessment: Proposals involving the provision of publicly accessible developments
  in the vicinity of residential property, a Listed Building or a Conservation Area where external lighting
  would be provided or made necessary by the development, are required to be accompanied by a Lighting
  Impact Assessment prepared by a lighting specialist. This must include details of any external lighting,
  the proposed hours when the lighting would be switched on, a layout plan with beam orientation and ground
  lux levels, and a schedule of equipment.'
must-include:
- item: Prepared by a lighting specialist
  level: must
- item: Details of any external lighting
  level: must
- item: The proposed hours when the lighting would be switched on
  level: must
- item: A layout plan with beam orientation and ground lux levels
  level: must
- item: A schedule of equipment
  level: must
confidence: medium
notes: From the council's list (revised June 2025), pages 8 and 12. 'Publicly accessible developments
  in the vicinity of residential property' has no distance, so that part shows as discretionary. The Part
  C matrix (page 12) marks it 'where appropriate' for new residential and new commercial development.
review-status: unverified
field-status: {}
