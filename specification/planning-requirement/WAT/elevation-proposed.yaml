reference: elevation-proposed
local-authority: WAT
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - ldc
      - lbc
      - advertising
      - s73
  - all:
    - application-type:
        in:
        - outline
        - non-material-amendment
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: existing and proposed elevations (at a scale of 1:50 or 1:100)
must-include:
- item: Drawn at a scale of 1:50 or 1:100
  level: must
confidence: medium
notes: From the council's list (revised June 2025), pages 3 and 12. The Part C matrix (page 12) marks
  elevations 'Required' for householder, full (all rows except commercial change of use, which is 'required
  in most circumstances'), lawful development certificate, listed building consent, advertisement consent
  and section 73 applications; 'required in most circumstances' for section 96 non-material amendments
  and 'where appropriate' for outline applications, so those parts show as discretionary. Existing elevations
  only where there is an existing building.
