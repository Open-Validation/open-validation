submission-standards:
- item: Plans marked "not to scale" or "do not scale" will not be registered
  level: must
- item: All plans and drawings state the paper size, key dimensions and a scale, and include a scale bar
  level: must
- item: All plans to a recognised metric scale, i.e. 1:100, 1:50
  level: must
- item: Where a required item is not submitted, a short written justification of why it is not appropriate
  level: should
- item: Mixed-use proposals meet the validation requirements for each element (e.g. residential and commercial)
    in the matrix
  level: must
- item: 'Major or complex applications: the Applicant Checklist, showing where each requirement is in
    the submission'
  level: should
