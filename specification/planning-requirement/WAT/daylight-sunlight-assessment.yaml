reference: daylight-sunlight-assessment
local-authority: WAT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: New residential development of 10 or more dwellings.
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
source-text: Applications including or near to residential development will require a Daylight, Sunlight
  and Overshadowing Assessment. The assessments should be undertaken in accordance with the relevant up
  to date British Research Establishment (BRE) Guidelines.
must-include:
- item: Undertaken in accordance with the relevant up to date BRE Guidelines
  level: must
confidence: medium
notes: From the council's list (revised June 2025), pages 8 and 12. Covers daylight, sunlight and overshadowing.
  The Part C matrix (page 12) marks it 'Required' for new residential development of 10 or more dwellings
  and 'where appropriate' for smaller residential, new commercial and outline applications (shown as discretionary),
  which is narrower than the text's 'including or near to residential development'.
review-status: unverified
field-status: {}
