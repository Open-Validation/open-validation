reference: sustainability-statement
local-authority: WAT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: new-build
        value: true
        description: New or replacement dwellings, or new commercial development (matrix rows 'Replacement
          Dwellings', 'New residential development' and 'New commercial development').
  - all:
    - application-type:
        in:
        - outline
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Watford Local Plan 2021-2038, Chapter 8
source-text: 'Energy and Sustainability Statements: A statement which sets out how proposals will meet
  policy requirements to mitigate the impact of climate change and contribute towards sustainable development.
  The statement should be a freestanding document supplied by a suitably qualified person. For major non-residential
  proposals this should include a BREEAM pre-assessment certificate. More information can be found in
  Chapter 8 of Watford Local Plan (2021-2038).'
must-include:
- item: A freestanding document supplied by a suitably qualified person
  level: must
- item: A BREEAM pre-assessment certificate
  level: must
  required-if:
    all:
    - ref: major-development
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: Non-residential floorspace.
confidence: medium
notes: From the council's list (revised June 2025), pages 6-7, 12. The Part C matrix (page 12) marks 'Energy
  and Sustainability Statements' 'Required' for replacement dwellings, new residential and new commercial
  development, and 'where appropriate' for outline applications (shown as discretionary). The list asks
  for one statement covering both, so the same rule is in energy-statement and sustainability-statement.
review-status: unverified
field-status: {}
