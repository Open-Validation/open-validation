reference: landscaping-plan
local-authority: WAT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: new-build
        value: true
        description: New residential development or new commercial development.
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
source-text: 'Landscaping Plan: A landscaping plan should set out the strategy for hard and soft landscaping
  for the development and an indication of the materials and plant species to be used. Plant species should,
  where appropriate, be native species that will contribute to biodiversity.'
must-include:
- item: The strategy for hard and soft landscaping
  level: must
- item: An indication of the materials and plant species to be used
  level: must
- item: Native plant species that will contribute to biodiversity, where appropriate
  level: should
confidence: medium
notes: From the council's list (revised June 2025), pages 7 and 12. The Part C matrix (page 12) marks
  it 'Required' for new residential development (any size) and new commercial development, 'required in
  most circumstances' for replacement dwellings and residential conversions, and 'where appropriate' for
  outline applications; those parts show as discretionary.
review-status: unverified
field-status: {}
