reference: viability-assessment
local-authority: WAT
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - condition:
      field: affordable-housing-below-target
      value: true
      description: The affordable housing requirements in Chapter 3 of the Watford Local Plan cannot be
        met.
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Watford Local Plan 2021-2038, Chapter 3
source-text: 'Financial Viability Appraisal: Where the affordable housing requirements as set out in Chapter
  3 of Watford Local Plan (2021-2038) cannot be met, a Financial Viability Appraisal will be required.
  The Financial Viability Appraisal is submitted as a public document and will be published on the Watford
  Borough Council’s website. Requests for Financial Viability Appraisals to be confidential will result
  in the invalidation of applications.'
must-include:
- item: Submitted as a public document for publication on the council's website; a request for it to be
    confidential will result in the application being invalid
  level: must
confidence: medium
notes: From the council's list (revised June 2025), pages 6 and 12. The Part C matrix (page 12) marks
  it 'required in most circumstances' for new residential development of 10 or more dwellings and 'where
  appropriate' for outline applications.
review-status: unverified
field-status: {}
