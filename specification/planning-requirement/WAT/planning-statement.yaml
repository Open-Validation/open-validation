reference: planning-statement
local-authority: WAT
required-if:
  any:
  - application-type:
      in:
      - outline
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 10
          description: New residential development of 10 or more dwellings.
      - condition:
          field: floorspace-non-residential
          operator: '>'
          value: 1000
          description: New commercial development of more than 1000 sq m.
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: new-build
        value: true
        description: New or replacement dwellings, or new commercial development (matrix rows 'Replacement
          Dwellings', 'New residential development' and 'New commercial development').
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
source-text: 'Planning Statement: A Planning Statement identifies the context and need for a proposed
  development and includes an assessment of how the proposed development accords with development plan
  policy and relevant material considerations such as national planning policy. The level of detail should
  be proportionate to the development proposal. Submissions which just list the policies without providing
  the required commentary will not be considered as valid. Submissions which do not address the current
  development plan will also not be considered as valid.'
must-include:
- item: The context and need for the proposed development
  level: must
- item: An assessment of how the development accords with development plan policy and relevant material
    considerations such as national planning policy, with commentary (not just a list of policies)
  level: must
- item: Addresses the current development plan
  level: must
confidence: medium
notes: From the council's list (revised June 2025), pages 6 and 12. The Part C matrix (page 12) marks
  it 'Required' for new residential development of 10 or more dwellings, new commercial development of
  more than 1000 sq m and outline applications, and 'required in most circumstances' for smaller new residential
  (9 or fewer) and commercial (less than 1000 sq m) development, shown as discretionary.
review-status: unverified
field-status: {}
