source-text: 'Land Contamination Assessment: Paragraph 184 of the National Planning Policy Framework (2021)
  makes it clear that the responsibility for providing information on whether a site is contaminated rests
  with the developer and that it is the responsibility of the developer to ensure that the development
  is safe and suitable for its intended use.'
