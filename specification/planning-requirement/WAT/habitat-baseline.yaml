reference: habitat-baseline
local-authority: WAT
required-if:
  condition:
    field: biodiversity-gain-condition
    value: true
    description: The development is subject to the biodiversity gain condition.
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Environment Act 2021; Article 7, Town and Country Planning (Development Management Procedure)
  (England) Order 2015
source-text: plan(s), drawn to an identified scale and showing the direction of North, showing onsite
  habitat existing on the date of application (or earlier proposed date), including any irreplaceable
  habitat (if applicable).
must-include:
- item: Drawn to an identified scale and showing the direction of North
  level: must
- item: Onsite habitat existing on the date of application (or earlier proposed date)
  level: must
- item: Any irreplaceable habitat
  level: must
  required-if:
    condition:
      field: irreplaceable-habitat
      value: true
      description: There is irreplaceable habitat on the land.
confidence: medium
notes: 'From the council''s list (revised June 2025), page 5. The file follows the law: it applies only
  where the biodiversity gain condition applies (householder and other exempt applications are exempt).
  The Part C matrix (page 12) marks the ''Statutory Biodiversity Metric (Excel format)'' ''required in
  most circumstances'' for replacement dwellings, new residential and new commercial development, and
  ''where appropriate'' for commercial changes of use, residential conversions, outline, section 73 and
  conservation area applications.'
review-status: unverified
field-status: {}
