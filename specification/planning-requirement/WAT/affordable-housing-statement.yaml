reference: affordable-housing-statement
local-authority: WAT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: New residential development of 10 or more dwellings.
  - all:
    - application-type:
        in:
        - outline
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Watford Local Plan 2021-2038, Chapter 3
source-text: 'Affordable Housing Statement: Proposals will be required to provide a mix of affordable
  housing tenures, including a minimum of 60% of new affordable homes as homes for social rent. More information
  can be found in Chapter 3 of Watford Local Plan (2021-2038).'
must-include:
- item: The mix of affordable housing tenures, including a minimum of 60% of new affordable homes as homes
    for social rent
  level: must
confidence: medium
notes: From the council's list (revised June 2025), pages 6 and 12. The Part C matrix (page 12) marks
  it 'Required' for new residential development of 10 or more dwellings and 'where appropriate' for outline
  applications (shown as discretionary).
review-status: unverified
field-status: {}
