reference: section-existing
local-authority: WAT
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - full
    - any:
      - condition:
          field: new-build
          value: true
          description: New or replacement dwellings, or new commercial development (matrix rows 'Replacement
            Dwellings', 'New residential development' and 'New commercial development').
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Residential conversion creating dwellings (matrix row 'Residential Conversion Applications
            (no extensions)').
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: existing and proposed site sections and finished floor and site levels (at a scale of 1:50
  or 1:100)
must-include:
- item: Existing and proposed site sections with finished floor and site levels, at a scale of 1:50 or
    1:100
  level: must
confidence: medium
notes: From the council's list (revised June 2025), pages 3 and 12. The Part C matrix (page 12) marks
  section drawings 'Required' for replacement dwellings, new residential development, residential conversions,
  new commercial development and listed building consent; 'required in most circumstances' for commercial
  changes of use and 'where appropriate' for outline applications (shown as discretionary). Not marked
  for householder applications.
review-status: unverified
field-status: {}
