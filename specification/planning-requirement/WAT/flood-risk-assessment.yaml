reference: flood-risk-assessment
local-authority: WAT
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or more (in Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: A site of 1 hectare or more (in Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3.
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Watford Local Plan 2021-2038, Chapter 9
source-text: 'Flood Risk Assessment (FRA): A Flood Risk Assessment is required for development proposals
  of 1 hectare or greater in Flood Zone 1 and for proposals for new development located in Flood Zones
  2 and 3 as designated by the Environment Agency. This is to ensure sites for development consider flood
  risk impact within and outside of the site and pass the sequential and exception tests. The Watford
  Local Plan (2021-2038) has designated sites for development (site allocations) which have already passes
  a sequential and exception test through the Level 2 Strategic Flood Risk Assessment (2020) and this
  may not be required again.'
must-include:
- item: Shows that the sequential and exception tests are passed (unless the site is allocated in the
    Local Plan and has already passed them through the Level 2 Strategic Flood Risk Assessment)
  level: must
confidence: medium
notes: From the council's list (revised June 2025), pages 9 and 12. The Part C matrix (page 12) marks
  it 'Required' for new residential development of 10 or more dwellings and 'where appropriate' for new
  commercial development and outline applications; the triggers here are the ones in the Part B text.
review-status: unverified
field-status: {}
