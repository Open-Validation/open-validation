reference: flood-risk-assessment
local-authority: WAT
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (in Flood Zone 1).
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more (in Flood Zone 1).
  - site:
      in:
      - flood-risk-zone
      description: New development in Flood Zone 2 or 3.
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
source-text: A Flood Risk Assessment is required for development proposals of 1 hectare or greater in
  Flood Zone 1 and for proposals for new development located in Flood Zones 2 and 3 as designated by the
  Environment Agency.
