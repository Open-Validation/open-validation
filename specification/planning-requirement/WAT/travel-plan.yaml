reference: travel-plan
local-authority: WAT
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 1000
        description: New commercial development of more than 1000 sq m.
  - all:
    - application-type:
        in:
        - full
        - outline
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Watford Local Plan 2021-2038, Chapter 11
source-text: In addition, developments generating a significant amount of movement should provide a Travel
  Plan.
confidence: medium
notes: From the council's list (revised June 2025), pages 7 and 12. The text's trigger ('developments
  that generate significant amounts of movement') has no threshold, so it shows as discretionary. The
  Part C matrix (page 12) marks 'Transport Assessment / Transport Statement / Travel Plan' 'Required'
  for new commercial development of more than 1000 sq m, 'required in most circumstances' for new residential
  development and 'where appropriate' for smaller commercial development and outline applications.
