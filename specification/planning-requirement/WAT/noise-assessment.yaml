reference: noise-assessment
local-authority: WAT
required-if:
  any:
  - condition:
      field: plant-equipment
      value: true
      description: Flues, vents, condensers, air conditioning units or air source heat pumps.
  - condition:
      field: noise-generating-use
      value: true
      description: The proposal raises issues of noise and/or disturbance to the occupants of nearby buildings.
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise-sensitive development, e.g. housing close to railway lines.
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Watford Local Plan 2021-2038, Chapter 8
source-text: 'Noise Impact Assessment: Proposals that raise issues of noise and / or disturbance to the
  occupants of nearby buildings, and for developments that are considered to be noise sensitive, e.g.
  residential developments in close proximity to railway lines, must be supported by a Noise Impact Assessment
  prepared by a suitably qualified acoustician.'
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
confidence: medium
notes: From the council's list (revised June 2025), pages 9 and 12. The Part C matrix (page 12) marks
  it 'Required' for flues, vents, condensers, air conditioning units and air source heat pumps, and 'where
  appropriate' for most other applications (householder, full, outline, s73).
review-status: unverified
field-status: {}
