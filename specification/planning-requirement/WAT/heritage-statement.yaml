reference: heritage-statement
local-authority: WAT
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: The application is for, or could affect, a heritage asset or its setting.
  - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Watford Local Plan 2021-2038, Chapter 7
source-text: Applications for, or that could impact upon, a heritage asset or its setting should be accompanied
  by a Heritage Statement.
must-include:
- item: An assessment/description of the significance of the heritage asset(s) which may be affected,
    including the contribution of their setting to that significance
  level: must
- item: The works proposed, and the principles behind and justification for the proposed development
  level: must
- item: The expected impact of the proposed works on the heritage asset and its setting
  level: must
- item: The steps taken to avoid or minimise any identified impacts
  level: must
- item: Detail proportionate to the importance of the heritage asset and the works; for significant large
    scale work to a listed building, a detailed statement by a suitably qualified professional
  level: should
confidence: medium
notes: From the council's list (revised June 2025), pages 7-8, 12. The Part C matrix (page 12) marks it
  'Required' for listed building consent and for works to buildings in conservation areas or locally listed
  buildings, and 'where appropriate' for most other applications (shown as discretionary). Part A also
  says listed building consent applications should include a heritage statement.
review-status: unverified
field-status: {}
