reference: arboriculturist-report
local-authority: WAT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
  - any:
    - site:
        in:
        - tree-preservation-zone
        description: The site is covered by a Tree Preservation Order.
    - all:
      - site:
          in:
          - conservation-area
          description: In a conservation area.
      - condition:
          field: trees-on-or-near-site
          value: true
          description: The site contains trees.
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees greater than 75mm in diameter within or adjacent to the site.
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
source-text: 'Tree Survey and Report: If the site is covered by a Tree Preservation Order or contains
  trees and is within a Conservation Area, or if the site has trees within or adjacent to it which are
  greater than 75mm in diameter, then the advice of a suitably qualified arboriculturalist should be sought
  to identify all relevant trees to be included in a Tree Survey. If it is acknowledged that significant
  trees on the site are likely to be affected by the proposals it will be necessary to provide an Arboricultural
  Impact Assessment (AIA), Arboricultural Method Statement (AMS) and Tree Protection Plan (TPP).'
must-include:
- item: A tree survey identifying all relevant trees, with the advice of a suitably qualified arboriculturalist
  level: must
- item: An Arboricultural Impact Assessment (AIA), Arboricultural Method Statement (AMS) and Tree Protection
    Plan (TPP)
  level: must
  required-if: discretionary
  source-text: If it is acknowledged that significant trees on the site are likely to be affected by the
    proposals it will be necessary to provide an Arboricultural Impact Assessment (AIA), Arboricultural
    Method Statement (AMS) and Tree Protection Plan (TPP).
confidence: medium
notes: From the council's list (revised June 2025), pages 7 and 12. The Part C matrix (page 12) marks
  the tree survey 'where appropriate' for householder, replacement dwelling, new residential, residential
  conversion, new commercial and outline applications; the triggers are the ones in the Part B text. Whether
  significant trees are 'likely to be affected' is a judgement, so the AIA/AMS/TPP item shows as discretionary.
review-status: unverified
