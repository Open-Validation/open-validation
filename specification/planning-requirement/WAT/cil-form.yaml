reference: cil-form
local-authority: WAT
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - s73
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings of any size.
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: The internal area of a new building, extension or change of use exceeds 100 sq m.
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Community Infrastructure Levy Regulations 2010; Watford CIL Charging Schedule
source-text: 'Community Infrastructure Levy Form: The Community Infrastructure Levy (CIL) is a planning
  charge for developers and landowners that supports the development of local infrastructure. It''s charged
  per square metre on new developments that include new dwellings of any size or any development where
  the internal area of a new building, extension or change of use exceeds 100 square metres.'
must-include:
- item: Floor space calculations where CIL liable
  level: must
  required-if:
    condition:
      field: cil-liable
      value: true
      description: The development is liable for CIL.
confidence: medium
notes: From the council's list (revised June 2025), pages 4 and 12. The Part C matrix (page 12) marks
  the 'CIL Additional Questions Form and floor space calculations where CIL liable' 'Required' for householder,
  full (except works in conservation areas and flues/heat pumps), outline and section 73 applications;
  the liability test is the one in Part A.
review-status: unverified
field-status: {}
