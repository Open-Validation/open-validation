reference: floor-plan-proposed
local-authority: WAT
required-if:
  any:
  - application-type:
      in:
      - hh
      - full
      - ldc
      - lbc
      - s73
  - all:
    - application-type:
        in:
        - outline
        - non-material-amendment
    - discretionary
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: existing and proposed floor plans (at a scale of 1:50 or 1:100)
must-include:
- item: Drawn at a scale of 1:50 or 1:100
  level: must
confidence: medium
notes: From the council's list (revised June 2025), pages 3 and 12. The Part C matrix (page 12) marks
  floor plans 'Required' for householder, full, lawful development certificate, listed building consent
  and section 73 applications ('required in most circumstances' for commercial changes of use, works to
  buildings in conservation areas or locally listed buildings, and flues, vents, air conditioning units
  and air source heat pumps, which are all full applications); 'required in most circumstances' for section
  96 non-material amendments and 'where appropriate' for outline applications, so those parts show as
  discretionary. Not marked for advertisement consent.
