policy: Watford Local Plan 2021-2038, Chapter 9
source-text: 'Protected species surveys may be required in certain instances including when development,
  demolition, extension or conversions happen to: - Buildings close to water, woodland, hedgerows or mature
  gardens and trees with; unconverted loft spaces, uneven loft tiles, hanging tiles, weather boarding,
  small openings into soffits or behind bargeboards, - timber framed or brick barns with predominantly
  intact tiled roofs, - land within 150m of a historical pond with no movement barriers between, - underground
  structures, and - trees with cracks, splits or cavities.'
confidence: medium
notes: From the council's list (revised June 2025), pages 10 and 12. Item 19, 'Biodiversity Assessment'.
  'May be required in certain instances' is a judgement, so it shows as discretionary. The Part C matrix
  (page 12) marks it 'where appropriate' for new residential and new commercial development and outline
  applications.
