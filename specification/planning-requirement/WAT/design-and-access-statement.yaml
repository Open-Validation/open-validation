reference: design-and-access-statement
local-authority: WAT
required-if:
  any:
  - ref: major-development
  - all:
    - site:
        in:
        - conservation-area
        description: In a conservation area.
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: Building(s) where the floorspace to be created is 100 sq m or more.
  - application-type:
      in:
      - lbc
      - outline
  - all:
    - application-type:
        in:
        - full
    - condition:
        field: new-build
        value: true
        description: New or replacement dwellings, or new commercial development (matrix rows 'Replacement
          Dwellings', 'New residential development' and 'New commercial development').
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Article 9, Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A Design and Access Statement for: a. all major developments, as defined in Article 2 of
  the Town and Country Planning (Development Management Procedure (England) Order 2015 b. applications
  within Conservation Areas which comprise provision of one or more dwellings or building(s) where the
  floorspace to be created is 100m2 or more c. Listed Building Consent (Listed Building Consent applications
  should also include a Heritage Statement). Details of what to include in a Design and Access Statement
  are set out in the validation requirements in the PPG (paragraph 29 onwards).'
confidence: medium
notes: From the council's list (revised June 2025), pages 3-4, 12. The Part C matrix (page 12) marks the
  statement 'Required' for replacement dwellings, all new residential and new commercial development,
  listed building consent and outline applications, which goes beyond the national rule in Part A; both
  are shown.
review-status: unverified
field-status: {}
