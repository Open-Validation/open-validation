reference: location-plan
local-authority: WAT
required-if:
  always: true
source-url: https://www.watford.gov.uk/downloads/file/1395/validation-checklist-local-list-
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'Location Plan: A plan which identifies the land to which the application relates drawn to
  an identified scale and showing the direction of north (at a scale of 1:1250). Application site (including
  access) to be outlined in red, any other land in which the applicant has an interest outlined in blue.
  Location Plans are available to purchase online via the Planning Portal.'
must-include:
- item: Drawn to an identified scale (1:1250) and showing the direction of north
  level: must
- item: Application site, including access, outlined in red
  level: must
- item: Any other land in which the applicant has an interest outlined in blue
  level: must
confidence: medium
notes: From the council's list (revised June 2025), page 3. The Part C matrix (page 12) marks it 'Required'
  for every type of application.
review-status: unverified
field-status: {}
