reference: heritage-statement
local-authority: RUH
required-if:
  any:
  - application-type:
      in:
      - lbc
      - demolition-con-area
  - all:
    - application-type:
        in:
        - reserved-matters
        - full
        - hh
        - outline-some
    - site:
        in:
        - conservation-area
        - listed-building
        - listed-building-setting
        - locally-listed-building
        - scheduled-monument
        - park-and-garden
        - archaeological-priority-area
        description: 'Affects a heritage asset or its setting: a conservation area, a listed building
          (or its curtilage or setting), scheduled monument, registered park and garden, locally listed
          building or area of archaeological importance.'
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: 'Required for: Planning applications affecting a conservation area or its setting Planning
  applications affecting a listed building, its curtilage or setting Planning applications affecting a
  heritage asset, including its setting Applications for Listed Building Consent'
must-include:
- item: A description of the heritage asset and its setting
  level: must
- item: An assessment of the asset's significance (exterior, and interior if relevant)
  level: must
- item: How the heritage asset and its setting informed the design proposals
  level: must
- item: An assessment of the impact of the proposal
  level: must
- item: A statement of justification for the works, with any mitigation proposed
  level: must
- item: Detail proportionate to the asset's importance and the scope of the works
  level: should
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Heritage
  statement''. The matrix marks it for: reserved matters, conservation area (including demolition), full,
  listed building consent and outline (some matters reserved). The matrix doesn''t mark it for householder
  applications, but the details say it is needed for planning applications affecting a heritage asset,
  so householder applications affecting one are included.'
review-status: unverified
field-status: {}
