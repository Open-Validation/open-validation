reference: heritage-statement
local-authority: RUH
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      description: The application affects a conservation area or its setting, or a listed building, its
        curtilage or setting.
  - discretionary
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
source-text: 'Heritage statement Required for: Planning applications affecting a conservation area or
  its setting Planning applications affecting a listed building, its curtilage or setting Planning applications
  affecting a heritage asset, including its setting Applications for Listed Building Consent The level
  of detail within the heritage statement should be proportionate to the asset''s importance and the scope
  of the proposed works.'
confidence: medium
notes: 'Audit (wrong_app_type): also required for planning applications (full or householder), not only
  LBC. Other heritage assets are shown as officer discretion.'
review-status: unverified
field-status: {}
