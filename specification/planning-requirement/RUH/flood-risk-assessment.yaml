reference: flood-risk-assessment
local-authority: RUH
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Minor development or change of use in flood zones 2 and 3.
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: Development or change of use in Zone 1 with a site area of 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: Development or change of use in Zone 1 with a site area of 1 hectare or more.
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
source-text: 'A flood risk assessment is required for: Minor development in flood zones 2 and 3 Change
  of use in flood zones 2 and 3 Development and change of use within Zone 1, with a site area of 1 hectare
  or more'
confidence: medium
notes: 'Audit (wrong_trigger, wrong_app_type): the excerpt ran into the heritage statement trigger and
  was wrongly filed under LBC and prior approval. Householders and other minor extensions in flood zones
  2 and 3 use a flood risk form ("required for all householders and other minor extensions in flood zones
  2 and 3").'
review-status: unverified
field-status: {}
