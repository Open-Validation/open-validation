reference: flood-risk-assessment
local-authority: RUH
required-if:
  all:
  - application-type:
      in:
      - reserved-matters
      - full
      - hh
      - outline-some
  - any:
    - site:
        in:
        - flood-risk-zone
        description: Flood zones 2 and 3.
    - any:
      - condition:
          field: site-area-residential
          operator: '>='
          value: 1
          description: Development and change of use within Zone 1, with a site area of 1 hectare or more.
      - condition:
          field: site-area-non-residential
          operator: '>='
          value: 1
          description: Development and change of use within Zone 1, with a site area of 1 hectare or more.
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: 'A flood risk form must be completed and submitted for all householders and other minor extensions
  in flood zones 2 and 3. A flood risk assessment is required for: Minor development in flood zones 2
  and 3 Change of use in flood zones 2 and 3 Development and change of use within Zone 1, with a site
  area of 1 hectare or more'
must-include:
- item: 'Householder and other minor extensions in flood zones 2 and 3: the Environment Agency flood risk
    form'
  level: must
  required-if:
    all:
    - site:
        in:
        - flood-risk-zone
        description: Flood zones 2 and 3.
    - any:
      - application-type:
          in:
          - hh
      - condition:
          field: residential-extension
          value: true
          description: Minor extensions.
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Flood risk
  form / assessment''. The matrix marks it for: reserved matters, full, householder and outline (some
  matters reserved).'
review-status: unverified
field-status: {}
