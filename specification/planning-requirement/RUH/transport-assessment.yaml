reference: transport-assessment
local-authority: RUH
required-if:
  application-type:
    in:
    - reserved-matters
    - full
    - outline-some
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: The detail contained within the transport assessment should reflect the scale of the development
  and the extent of the transport implications of the proposal.
must-include:
- item: Travel characteristics of the development by all modes of travel, quantified
  level: must
- item: Impacts on the existing transport infrastructure
  level: must
- item: Proposed transport infrastructure
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Transport
  assessment''. The matrix marks it for: reserved matters, full and outline (some matters reserved). The
  details give no further trigger; the council says that if you think a marked item isn''t needed, you
  must include a statement justifying its exclusion.'
