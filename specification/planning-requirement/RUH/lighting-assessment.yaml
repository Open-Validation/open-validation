source-text: 'Lighting assessment A lighting assessment should include: A description of the proposed
  hours of operation, light spillage, light levels and column heights A layout plan of the proposed development
  site showing beam orientation Details of the design and specification of the proposed equipment Details
  of the expected impact on neighbouring residential properties, roads, listed buildings, and conservation
  areas Impact on protected or priority species and proposed mitigation…'
