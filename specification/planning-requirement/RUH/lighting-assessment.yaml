reference: lighting-assessment
local-authority: RUH
required-if:
  application-type:
    in:
    - reserved-matters
    - full
    - outline-some
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: 'A lighting assessment should include:'
must-include:
- item: Proposed hours of operation, light spillage, light levels and column heights
  level: must
- item: A layout plan showing beam orientation
  level: must
- item: Design and specification of the proposed equipment
  level: must
- item: Expected impact on neighbouring homes, roads, listed buildings and conservation areas
  level: must
- item: Impact on protected or priority species and mitigation to maintain or enhance biodiversity
  level: must
- item: Measures to mitigate or compensate for the possible impacts
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Lighting
  assessment''. The matrix marks it for: reserved matters, full and outline (some matters reserved). The
  details give no further trigger; the council says that if you think a marked item isn''t needed, you
  must include a statement justifying its exclusion.'
review-status: unverified
field-status: {}
