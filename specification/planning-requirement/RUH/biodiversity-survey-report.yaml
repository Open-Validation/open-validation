reference: biodiversity-survey-report
local-authority: RUH
required-if:
  all:
  - application-type:
      in:
      - reserved-matters
      - demolition-con-area
      - full
      - hh
      - lbc
      - non-material-amendment
      - outline-all
      - outline-some
  - condition:
      field: protected-species
      value: true
      description: The application could adversely affect protected species or habitats (for example flagged
        by the biodiversity checklist).
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: Where an application has potential to adversely affect protected species or habitats, further
  ecological surveys are required to establish presence or likely absence of species and extent of impacts.
must-include:
- item: Presence or likely absence of species and the extent of impacts
  level: must
- item: Measures to avoid, reduce or mitigate impacts, taken into account in the application
  level: must
- item: Following best practice and prepared by a suitably qualified person
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Ecological
  and species survey / report''. The matrix marks it for: reserved matters, conservation area (including
  demolition), full, householder, listed building consent, non-material amendment and outline. The biodiversity
  wildlife checklist also requires species-specific surveys where it flags a potential impact on legally
  protected species.'
review-status: unverified
field-status: {}
