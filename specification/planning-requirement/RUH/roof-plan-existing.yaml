reference: roof-plan-existing
local-authority: RUH
required-if:
  any:
  - condition:
      field: new-build
      value: true
      description: New properties.
  - condition:
      field: roof-alteration
      value: true
      description: Complex integration of roof forms or dormer windows.
  - application-type:
      in:
      - ldc
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
source-text: 'Roof plan Required for: New properties and/or where there is complex integration of roof
  forms or dormer windows - the scale should be 1:50 or 1:100 and include details such as materials, vents,
  roof lights or lanterns Lawful development certificate for a roof extension - at least one of the plans
  submitted must include calculations to show the proposed increase in cubic meters'
confidence: medium
notes: 'Audit (wrong_app_type): also required for new properties and dormers or complex roof forms, not
  only LDCs. The LDC case is for roof extensions.'
