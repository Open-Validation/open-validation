reference: arboriculturist-report
local-authority: RUH
required-if:
  all:
  - any:
    - application-type:
        in:
        - reserved-matters
        - outline-some
    - all:
      - application-type:
          in:
          - full
      - ref: major-development
  - condition:
      field: trees-on-or-near-site
      value: true
      description: Trees within the site, on adjoining properties or within falling distance of the site,
        including trees with a TPO or in a conservation area.
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
policy: BS 5837
source-text: Where there are tree(s) within the application site, or on land adjacent to the application
  site that could influence or be affected by the development (including street trees), especially where
  the tree(s) are subject to a Tree Preservation Orders (TPO) and/or in a Conservation Area, the survey
  must include information on which trees are to be retained and the means of protecting these trees during
  construction works.
must-include:
- item: Which trees are to be retained and how they will be protected during construction
  level: must
- item: Prepared by a suitably qualified person
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Tree survey''.
  The matrix marks it for: reserved matters, full (major), outline (some matters reserved) and tree works.'
review-status: unverified
field-status: {}
