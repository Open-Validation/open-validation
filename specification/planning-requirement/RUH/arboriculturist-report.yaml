reference: arboriculturist-report
local-authority: RUH
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
      - outline
      - reserved-matters
  - condition:
      field: trees-on-or-near-site
      value: true
      description: There are trees within the site or on adjacent land (including street trees) that could
        influence or be affected by the development.
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
source-text: Tree survey To accompany a planning application Where there are tree(s) within the application
  site, or on land adjacent to the application site that could influence or be affected by the development
  (including street trees), especially where the tree(s) are subject to a Tree Preservation Orders (TPO)
  and/or in a Conservation Area, the survey must include information on which trees are to be retained
  and the means of protecting these trees during construction works.
must-include:
- item: Which trees are to be retained
  level: must
- item: The means of protecting the retained trees during construction works
  level: must
confidence: medium
notes: 'Audit (wrong_app_type, wrong_trigger): this is the planning application trigger, not a tree works
  one (see condition-of-trees and structural-damage).'
review-status: unverified
field-status: {}
