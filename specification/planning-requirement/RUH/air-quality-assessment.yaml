reference: air-quality-assessment
local-authority: RUH
required-if:
  all:
  - application-type:
      in:
      - reserved-matters
      - full
      - outline-some
  - discretionary
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: 'Proposals for development that: Introduces sensitive development close to significant sources
  of pollutants Or for development likely to result in significantly increased local emissions Will need
  to provide an air quality assessment, such as commercial kitchens, commercial development, industrial
  development and Farnborough Airport.'
must-include:
- item: Prepared by a suitably qualified person
  level: must
- item: Impacts on the existing air quality environment and/or future occupants
  level: must
- item: That all reasonable efforts will be made so odours don't affect local amenity
  level: must
- item: Details of adequate mitigation, showing emissions can be controlled or minimised
  level: must
- item: Construction management plan setting out how emissions from demolition and construction will be
    minimised
  level: must
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Air quality
  assessment''. The matrix marks it for: reserved matters, full and outline (some matters reserved). ''Close
  to significant sources of pollutants'' and ''significantly increased local emissions'' are not defined,
  so it shows as ''check''.'
review-status: unverified
field-status: {}
