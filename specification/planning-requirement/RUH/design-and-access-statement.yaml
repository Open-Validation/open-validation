reference: design-and-access-statement
local-authority: RUH
required-if:
  application-type:
    in:
    - reserved-matters
    - demolition-con-area
    - full
    - hh
    - lbc
    - outline-some
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: A design and access statement is a report to be included with certain applications for planning
  permission and applications for listed building consent.
must-include:
- item: The design principles and concepts applied to the development
  level: must
- item: The steps taken to appraise the characteristics of the site and its wider setting, and how the
    design takes that context into account
  level: must
- item: Detail proportionate to the complexity of the application
  level: should
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Design and
  access statement''. The matrix marks it for: reserved matters, conservation area (including demolition),
  full, householder, listed building consent and outline (some matters reserved). For minor development
  needing both, one document can cover the heritage statement and the DAS.'
