reference: location-plan
local-authority: RUH
required-if:
  application-type:
    in:
    - advertising
    - reserved-matters
    - demolition-con-area
    - full
    - hedgerow-removal
    - hh
    - ldc-existing-use
    - ldc-prospective-use
    - lbc
    - non-material-amendment
    - outline-all
    - outline-some
    - prior-approval
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A site location plan should: Be based on an up-to-date map The scale should be 1:1250 or
  1:2500'
must-include:
- item: Based on an up-to-date map
  level: must
- item: At a scale of 1:1250 or 1:2500
  level: must
- item: Scaled to fit onto A4 or A3 paper, wherever possible
  level: should
- item: Enough roads and/or buildings on adjoining land to make the exact location of the site clear
  level: must
- item: Application site edged clearly with a red line, including all land needed for the development
    (access from a public highway, visibility splays, landscaping, car parking, open areas around buildings)
  level: must
- item: Any other land owned by the applicant, close to or adjoining the site, edged in blue
  level: should
- item: The Ordnance Survey licence number, if the plan uses Ordnance Survey data
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Site location
  plan''. The matrix marks it for: every application type except approval of details reserved by a condition,
  removal/variation of a condition and tree works.'
review-status: unverified
field-status: {}
