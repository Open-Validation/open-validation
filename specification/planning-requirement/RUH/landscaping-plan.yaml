reference: landscaping-plan
local-authority: RUH
required-if:
  application-type:
    in:
    - reserved-matters
    - full
    - hedgerow-removal
    - outline-some
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: 'The information provided should be appropriate to the scale and nature of the proposed development
  and indicate: The extent of existing and proposed planting areas and the type of planting within them'
must-include:
- item: Extent of existing and proposed planting areas and the type of planting
  level: must
- item: Locations and types of new trees
  level: must
- item: Areas and type of hard surfacing
  level: must
- item: Location and nature of boundary treatments
  level: must
- item: Earthworks / ground level changes
  level: must
- item: 'Planting plans: species, size, density, numbers, and root condition for trees and some shrubs'
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Landscaping
  details''. The matrix marks it for: reserved matters, full, hedgerow removal notice and outline (some
  matters reserved). The details give no further trigger; the council says that if you think a marked
  item isn''t needed, you must include a statement justifying its exclusion.'
review-status: unverified
