reference: affordable-housing-statement
local-authority: RUH
required-if:
  any:
  - application-type:
      in:
      - reserved-matters
      - outline-some
  - all:
    - application-type:
        in:
        - full
    - ref: major-development
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
policy: Rushmoor Affordable Housing SPD
source-text: 'The statement should include: The total numbers of affordable housing The mix of affordable
  housing by house type The mix of affordable housing by tenure'
must-include:
- item: Total numbers of affordable housing
  level: must
- item: Mix of affordable housing by house type and by tenure
  level: must
- item: Plans showing the location of affordable housing, with a schedule of bedrooms, accessibility category
    and unit size (GEA and GIA) of each property
  level: must
- item: Basis of calculation of any service charges, ground rents or management fees
  level: must
- item: Summary of design, construction and equipping of the affordable housing, including curtilage design
    and access
  level: must
- item: Phasing of the development, including the affordable housing
  level: must
- item: How the affordable housing will be transferred, managed, allocated and let, and the registered
    provider where involved
  level: must
- item: 'Outline applications where detail isn''t possible: a statement of intent on how affordable housing
    will be provided and whether the site will comply with the Affordable Housing SPD'
  level: must
  required-if:
    application-type:
      in:
      - outline-some
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Affordable
  housing statement''. The matrix marks it for: reserved matters, full (major) and outline (some matters
  reserved). The details give no further trigger; the council says that if you think a marked item isn''t
  needed, you must include a statement justifying its exclusion.'
review-status: unverified
field-status: {}
