reference: roof-plan-proposed
local-authority: RUH
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - hh
        - outline-some
    - any:
      - condition:
          field: new-build
          value: true
          description: New properties.
      - condition:
          field: roof-alteration
          value: true
          description: Complex integration of roof forms, or dormer windows.
  - all:
    - application-type:
        in:
        - ldc-prospective-use
    - condition:
        field: roof-alteration
        value: true
        description: A roof extension.
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: 'Required for: New properties and/or where there is complex integration of roof forms or
  dormer windows - the scale should be 1:50 or 1:100 and include details such as materials, vents, roof
  lights or lanterns Lawful development certificate for a roof extension - at least one of the plans submitted
  must include calculations to show the proposed increase in cubic meters'
must-include:
- item: At a scale of 1:50 or 1:100, with details such as materials, vents, roof lights or lanterns
  level: must
- item: 'Lawful development certificate for a roof extension: calculations of the proposed increase in
    cubic metres on at least one plan'
  level: must
  required-if:
    application-type:
      in:
      - ldc-prospective-use
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Roof plan''.
  The matrix marks it for: full, householder and outline (some matters reserved).'
review-status: unverified
field-status: {}
