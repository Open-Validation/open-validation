reference: section-existing
local-authority: RUH
required-if:
  application-type:
    in:
    - reserved-matters
    - full
    - hh
    - lbc
    - outline-some
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: 'The scale should be 1:50 or 1:100 and show: A cross section(s) through the proposed building(s)
  Where a proposal involves a change in ground levels, illustrative drawings should be submitted to show
  both the existing and finished levels to include details of foundations and eaves'
must-include:
- item: At a scale of 1:50 or 1:100
  level: must
- item: Cross section(s) through the proposed building(s)
  level: must
- item: Existing and finished levels, with details of foundations and eaves
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: The proposal involves a change in ground levels.
- item: How proposed buildings relate to existing site levels and neighbouring development (site levels
    and finished floor levels related to a fixed reference point off-site)
  level: should
- item: Design and location of any retaining walls
  level: must
- item: Where no level changes are proposed, a clear statement saying so
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Sections''.
  The matrix marks it for: reserved matters, full, householder, listed building consent and outline (some
  matters reserved). The details give no further trigger; the council says that if you think a marked
  item isn''t needed, you must include a statement justifying its exclusion.'
