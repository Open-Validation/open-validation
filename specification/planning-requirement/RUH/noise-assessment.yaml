reference: noise-assessment
local-authority: RUH
required-if:
  any:
  - condition:
      field: noise-sensitive-use
      value: true
      description: Residential, medical, educational or day nursery development, or development next to
        major roads, rail or industrial noise sources.
  - condition:
      field: noise-generating-use
      value: true
      description: Pubs, nightclubs, places of worship, sports facilities, noisy industrial uses or wind
        turbines.
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
confidence: medium
notes: 'From the audit (missing_requirement): residential; medical/educational/day nurseries; pubs/nightclubs;
  places of worship; sports facilities; noisy industrial; wind turbines; development next to major roads/rail/industrial
  noise sources.'
review-status: unverified
field-status: {}
