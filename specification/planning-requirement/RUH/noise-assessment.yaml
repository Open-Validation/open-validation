reference: noise-assessment
local-authority: RUH
required-if:
  all:
  - application-type:
      in:
      - reserved-matters
      - full
      - outline-some
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential developments.
    - condition:
        field: noise-sensitive-use
        value: true
        description: Medical and educational developments and day nurseries, or developments adjacent
          to major sources of noise such as roads, railways, industrial and commercial uses.
    - condition:
        field: noise-generating-use
        value: true
        description: Drinking facilities, places of worship, indoor and outdoor sports facilities, industrial
          developments using noisy machinery, or any other use generating high levels of noise or vibration.
    - condition:
        field: wind-turbine
        value: true
        description: Wind turbines.
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: 'Required for: Residential developments Medical developments, educational developments and
  day nurseries Drinking facilities, such as public houses and nightclubs Places of worship Indoor and
  outdoor sports facilities Industrial developments using noisy machinery Wind turbines Developments adjacent
  major sources of noise, such as roads, railways, industrial and commercial Any other use that will generate
  high levels of noise or vibration'
must-include:
- item: Prepared by a suitably qualified acoustician
  level: must
- item: Potential sources of noise and how they may affect local amenity and environmental receptors
  level: must
- item: Mitigation, including sound insulation measures
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Noise impact
  assessment''. The matrix marks it for: reserved matters, full and outline (some matters reserved).'
review-status: unverified
field-status: {}
