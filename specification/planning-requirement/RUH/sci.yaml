reference: sci
local-authority: RUH
required-if:
  all:
  - any:
    - application-type:
        in:
        - reserved-matters
        - outline-some
    - all:
      - application-type:
          in:
          - full
      - ref: major-development
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 100
        description: Residential schemes over 100 units.
    - condition:
        field: office-floorspace
        operator: '>'
        value: 10000
        description: Employment schemes over 10,000 sq m.
    - condition:
        field: industrial-floorspace
        operator: '>'
        value: 10000
        description: Employment schemes over 10,000 sq m.
    - condition:
        field: warehousing-floorspace
        operator: '>'
        value: 10000
        description: Warehouse/distribution schemes over 10,000 sq m.
    - condition:
        field: retail-floorspace
        operator: '>'
        value: 5000
        description: Retail schemes totalling over 5,000 sq m.
    - condition:
        field: town-centre-use-floorspace
        operator: '>'
        value: 2000
        description: Leisure schemes totalling over 2,000 sq m.
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
policy: Rushmoor Statement of Community Involvement (2019), section 7
source-text: 'A community involvement statement is required for all major applications involving: Residential
  schemes over 100 units Employment and warehouse/distribution schemes over 10,000 sq. m Retail schemes
  totalling over 5,000 sq. m Leisure schemes totalling over 2,000 sq. m'
must-include:
- item: The techniques used to engage with stakeholders and the community
  level: must
- item: How the views of the local community have been considered
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Community
  involvement statement''. The matrix marks it for: reserved matters, full (major) and outline (some matters
  reserved).'
review-status: unverified
field-status: {}
