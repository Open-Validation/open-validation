reference: sci
local-authority: RUH
required-if:
  all:
  - ref: major-development
  - any:
    - condition:
        field: dwelling-count
        operator: '>'
        value: 100
        description: Residential schemes over 100 units.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 10000
        description: Employment and warehouse/distribution schemes over 10,000 sq m.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 5000
        description: Retail schemes totalling over 5,000 sq m.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 2000
        description: Leisure schemes totalling over 2,000 sq m.
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
source-text: 'Community involvement statement A community involvement statement is required for all major
  applications involving: Residential schemes over 100 units Employment and warehouse/distribution schemes
  over 10,000 sq. m Retail schemes totalling over 5,000 sq. m Leisure schemes totalling over 2,000 sq.
  m The statement should outline the techniques used to engage with stakeholders and the community, and
  demonstrate that the views of the local community have been considered.'
must-include:
- item: The techniques used to engage with stakeholders and the community
  level: should
- item: How the views of the local community have been considered
  level: should
confidence: medium
notes: The floorspace thresholds depend on the use (employment 10,000, retail 5,000, leisure 2,000 sq
  m); the rule can't tie each to its use.
review-status: unverified
field-status: {}
