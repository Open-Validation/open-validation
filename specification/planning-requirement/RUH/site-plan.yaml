reference: site-plan
local-authority: RUH
required-if:
  any:
  - application-type:
      in:
      - advertising
      - reserved-matters
      - demolition-con-area
      - full
      - hedgerow-removal
      - hh
      - ldc-prospective-use
      - lbc
      - outline-some
  - application-type:
      in:
      - pa-extension
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015
source-text: 'A plan with a scale that should be 1:500 or 1:200 and show: The proposed footprint of the
  development and/or Where the advertisement will be situated and/or Hedgerow or tree(s) to be removed
  ... Prior approval: larger home extension A detailed block plan showing the footprint of the proposal.'
must-include:
- item: At a scale of 1:500 or 1:200
  level: must
- item: The proposed footprint of the development
  level: must
- item: 'Advertisements: where the advertisement will be situated'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: Any hedgerow or tree(s) to be removed
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Block plan''.
  The matrix marks it for: advertisement consent, reserved matters, conservation area (including demolition),
  full, hedgerow removal notice, householder, lawful development (proposed use), listed building consent
  and outline (some matters reserved). The larger home extension prior approval needs a detailed block
  plan (''Evidence to support application'').'
