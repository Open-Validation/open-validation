reference: sketch-plan
local-authority: RUH
required-if:
  any:
  - application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
  - all:
    - application-type:
        in:
        - reserved-matters
        - demolition-con-area
        - full
        - hh
        - outline-some
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within the site, on adjoining properties or within falling distance of the
          site, including trees with a TPO or in a conservation area.
source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: Show clearly the location of tree(s) and their spread in relation to what is already there.
  This includes within the site area and adjoining properties Must include trees that are subject to a
  Tree Preservation Order (TPO) are within a Conservation Area or within falling distance of the site
  area
must-include:
- item: At a scale of 1:200 or 1:500
  level: must
- item: Location of the tree(s) and their spread, within the site and on adjoining properties
  level: must
- item: Trees with a TPO, in a conservation area, or within falling distance of the site
  level: must
- item: Trees clearly labelled (T1, T2 and so on)
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Tree plan''.
  The matrix marks it for: reserved matters, conservation area (including demolition), full, householder,
  outline (some matters reserved) and tree works. For planning applications it applies where there are
  trees to show.'
review-status: unverified
field-status: {}
