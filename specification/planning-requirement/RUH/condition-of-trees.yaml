source-url: https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-validation-list/
source-text: Where the tree(s) are covered by a Tree Preservation Order (TPO) and the application has
  been submitted due to disease, fears it may break or fall, subsidence or other structural damage, the
  survey must be written by an appropriate expert and include diagnostic information/technical evidence.
must-include:
- item: Written by an appropriate expert, with diagnostic information
  level: must
confidence: medium
notes: 'From the council''s list (published 10 April 2025), local validation list web page, ''Tree survey:
  application for tree works''. The matrix marks it for: tree works. Needed when the reason for works
  to a TPO tree is disease or fear it may break or fall.'
