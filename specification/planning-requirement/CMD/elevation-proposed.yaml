reference: elevation-proposed
local-authority: CMD
source-url: https://www.camden.gov.uk/documents/d/guest/nov-2026-local-application-requirements-2026
source-text: 'Full planning: All plans, elevations, and sections must be drawn to an identified scale.


  Listed building consent: and proposed floor plans All Applications All plans to be drawn at a minimum
  scale of 1:50, or 1:100 if outside of a conservation area and not a listed building.'
must-include:
- item: Internal elevations
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: Elevation from the neighbour's side where a conservatory or rear extension rises above the boundary
    wall
  level: must
  required-if:
    condition:
      field: residential-extension
      value: true
      description: The proposal extends or alters a house.
- item: Elevations of the whole property for roof extensions, terraces, dormers or window replacement
  level: must
  required-if:
    condition:
      field: residential-extension
      value: true
      description: The proposal extends or alters a house.
- item: Demolition shown on the existing elevations
  level: must
  required-if:
    application-type:
      in:
      - demolition-con-area
- item: Drawings labelled 'as existing', 'as approved' and 'as proposed'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
confidence: low
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Rows from Advertisement
