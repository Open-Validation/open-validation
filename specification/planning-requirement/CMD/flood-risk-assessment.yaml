reference: flood-risk-assessment
local-authority: CMD
required-if:
  any:
  - condition:
      field: site-area-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - condition:
      field: site-area-non-residential
      operator: '>='
      value: 1
      description: The site is 1 hectare or more.
  - all:
    - ref: major-development
    - site:
        in:
        - flood-risk-zone
        description: The site is in an area at risk of flooding.
  - all:
    - condition:
        field: basement
        value: true
        description: The proposal includes a new or enlarged basement.
    - site:
        in:
        - critical-drainage-area
        description: The site is on a street at risk of flooding.
source-url: https://prod-web-assets.camden.gov.uk/documents/d/guest/lars-2025
confidence: medium
notes: 'From the audit (missing_requirement): sites of 1ha+, majors in flood-risk areas, basements on
  flood-risk streets.'
review-status: unverified
field-status: {}
