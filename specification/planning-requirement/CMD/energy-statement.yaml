reference: energy-statement
local-authority: CMD
required-if:
  any:
  - all:
    - condition:
        field: new-build
        value: true
        description: The proposal includes new-build dwellings.
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: The proposal creates one or more dwellings.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 5
      description: The proposal creates 5 or more dwellings.
  - condition:
      field: floorspace
      operator: '>='
      value: 500
      description: The proposal creates 500 square metres or more of floorspace.
