reference: noise-assessment
local-authority: CMD
required-if:
  any:
  - condition:
      field: plant-equipment
      value: true
      description: The proposal includes plant, ventilation, air extraction or conditioning equipment,
        or flues.
  - condition:
      field: noise-generating-use
      value: true
      description: A use likely to create significant noise (food, drink, entertainment, leisure, industrial,
        nurseries, places of worship, schools and colleges).
  - condition:
      field: noise-sensitive-use
      value: true
      description: A noise-sensitive use in a noisy environment.
  - condition:
      field: traffic-aadt-increase
      operator: '>'
      value: 5
      description: Road traffic movements greater than 5% of Annual Average Daily Traffic.
  - discretionary
source-url: https://www.camden.gov.uk/documents/d/guest/nov-2026-local-application-requirements-2026
