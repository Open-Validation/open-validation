reference: fire-statement
local-authority: CMD
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: The building contains 2 or more dwellings.
    - condition:
        field: educational-accommodation
        value: true
        description: The building contains educational accommodation.
source-url: https://www.camden.gov.uk/documents/d/guest/nov-2026-local-application-requirements-2026
source-text: 'Fire statements must be submitted on a form published by the Secretary of State (or a form
  to similar effect) which includes information about: the principles, concepts and approach relating
  to fire safety that have been applied to each building in the development'
confidence: medium
notes: 'Audit (wrong_trigger): a Fire Statement is only needed for relevant buildings (18m+ or 7+ storeys
  with 2+ dwellings or educational accommodation).'
review-status: unverified
field-status: {}
