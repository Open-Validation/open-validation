reference: waste-management-plan
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - prior-approval
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development (including changes of use).
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Local Plans Part 2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local
  Plan, Northampton Local Plan)
source-text: All applications for residential development (including changes of use) that will have an
  impact on the generation of waste.
must-include:
- item: A plan showing that waste storage and collection arrangements can be accommodated
  level: must
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 8-10, 12, 15 and 18 (Site Waste Management
  Plan).
review-status: unverified
field-status: {}
