reference: affordable-housing-statement
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - ref: major-development
  - condition:
      field: dwelling-count
      operator: '>='
      value: 1
      description: Residential development.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policy H2; Local Plans Part 2 (Daventry Settlements
  and Countryside Local Plan, South Northamptonshire Local Plan, Northampton Local Plan) (Daventry H08,
  South Northamptonshire LH8, Northampton H02); Housing SPD
source-text: A statement detailing the overall mix of housing tenures and provision of accessible and
  adaptable homes.
must-include:
- item: Any arrangements with social housing providers
  level: must
- item: Justification for different proportions or mix of affordable or market tenures where deviating
    from policy
  level: must
  required-if:
    condition:
      field: affordable-housing-below-target
      value: true
      description: Deviating from policy.
- item: 'For full and reserved matters: a layout plan showing the location of market and affordable housing'
  level: must
  required-if:
    application-type:
      in:
      - full
      - reserved-matters
- item: Any innovative design and construction methods, and other material information on affordable housing
    provision or housing mix
  level: must
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 8, 12 and 18 (local requirements).
  Listed for major development only; its content is about housing tenures, so it is shown for residential
  major development.
review-status: unverified
field-status: {}
