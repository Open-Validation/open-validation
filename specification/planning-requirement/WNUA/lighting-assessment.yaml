reference: lighting-assessment
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
    - condition:
        field: external-lighting
        value: true
        description: External lighting.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: external-lighting
        value: true
        description: External lighting, temporary or permanent.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policy BN9; Local Plans Part 2 (Daventry Settlements
  and Countryside Local Plan, South Northamptonshire Local Plan, Northampton Local Plan)
source-text: Applications for external lighting must include a lighting assessment … Where proposal includes
  external lighting, e.g. floodlighting or security lighting, temporary or permanent.
must-include:
- item: Hours of operation, light levels, off-site light spillage, column heights, equipment design, a
    layout plan with beam orientations and any mitigation
  level: must
- item: 'Minerals and waste: Location, height, design, sensors, luminance and hours of use of external
    lighting'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8, 9 and 12. Minerals and waste:
  from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16 and 37.'
review-status: unverified
field-status: {}
