reference: noise-assessment
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - prior-approval
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential scheme.
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: noise-generating-use
        value: true
        description: Potential to increase or alter noise and disturb sensitive receptors.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policy BN9; Local Plans Part 2 (Daventry Settlements
  and Countryside Local Plan, South Northamptonshire Local Plan, Northampton Local Plan)
source-text: For residential schemes in close proximity to noise sources (such as roads, commercial premises)
  … Proposals that have the potential to increase noise levels or alter the characteristics of noise,
  and cause noise amenity disturbance to sensitive receptors.
must-include:
- item: Noise during construction, from the development in operation, and exposure of new residents to
    existing noise
  level: must
- item: Physical and design mitigation, including overheating and ventilation where enhanced glazing or
    closed windows are relied on
  level: must
- item: 'Minerals and waste: Existing ambient and background noise at the site and nearest sensitive receptors,
    predicted levels, and management and mitigation'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8-10, 12 and 15 and the Definitions
  (page 126). ''Close proximity'' to noise sources is not defined, so residential schemes are shown as
  discretionary. Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16 and 37.'
review-status: unverified
field-status: {}
