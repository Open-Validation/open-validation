reference: site-restoration
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
  - all:
    - application-type:
        in:
        - waste-dev
    - condition:
        field: landfill-development
        value: true
        description: Waste disposal (landfill).
source-url: https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf
policy: NPPF paragraphs 204-205; Minerals and Waste Local Plan for Northamptonshire (2017)
source-text: Although mineral extraction and waste disposal operations are time limited, what is left
  after they have been completed are much longer lasting. Where, therefore, application for these activities
  are submitted to the Council, they should be supported by proposals for restoring land to an acceptable
  condition and for ensuring that it can be used for an appropriate use thereafter.
must-include:
- item: Plans of the phasing of working and restoration, and final restoration plans showing final land
    form and landscaping
  level: must
- item: An aftercare scheme where land is to be reclaimed to a standard suitable for a beneficial use
  level: must
confidence: medium
notes: 'Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 41. Restoration and Aftercare Statement/Plans (MHCLG''s retired id for a site restoration plan),
  listed in the Appendix A checklist and the guidance but not in the requirement table.'
review-status: unverified
field-status: {}
