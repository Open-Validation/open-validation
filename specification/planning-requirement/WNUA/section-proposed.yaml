reference: section-proposed
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - lbc
      - pa-storey
  - all:
    - application-type:
        in:
        - hh
        - full
    - condition:
        field: building-works
        value: true
        description: The proposal involves building or altering a building.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: Sections show a vertical plane cut through a property and are most commonly used to describe
  the relationship between different levels of an existing/proposed building.
must-include:
- item: Normally at 1:50 or 1:100, with all existing and proposed works clearly identified
  level: should
- item: 'Where ground levels change: both existing and finished levels'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: A change in ground levels.
- item: 'On sloping sites or where adjoining levels differ: alterations to levels, how the development
    sits within the site and the relative levels of existing and proposed buildings'
  level: must
  required-if:
    condition:
      field: change-in-ground-levels
      value: true
      description: Sloping site or differences in levels on adjoining sites.
- item: 'For external wall insulation: a section detail of the proposed cladding'
  level: must
  required-if:
    application-type:
      in:
      - hh
confidence: medium
notes: From the council's list (adopted 25 February 2026), Plan and Drawing Requirements (pages 128-130),
  with the per-type tables. Listed for householder, listed building consent, major and minor development
  and additional-storey prior approvals (proposed sections). The major (section 8) and minor residential
  and commercial (sections 9-10) tables are for full applications.
review-status: unverified
field-status: {}
