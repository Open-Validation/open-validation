reference: environmental-statement
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
    - condition:
        field: eia-development
        value: true
        description: Schedule 1, or Schedule 2 development likely to have significant effects.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: eia-development
        value: true
        description: Schedule 1, or Schedule 2 requiring EIA.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Town and Country Planning (Environmental Impact Assessment) Regulations 2017
source-text: Developments that are likely to have a significant effect on the environment by virtue of
  their nature, size and location and are listed under Schedule 1 of the EIA regulations. … Environmental
  Impact Assessment is required for Schedule 1 developments and maybe required for Schedule 2 developments
  as specified by the Environmental Impact Assessment Regulations 2017.
must-include:
- item: 'For s73 on EIA development: an addendum to the original environmental statement where needed'
  level: must
  required-if:
    application-type:
      in:
      - s73
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8, 12, 18 and 19. Minerals and waste:
  from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15 and 32.'
review-status: unverified
field-status: {}
