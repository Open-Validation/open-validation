reference: floor-plan-existing
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - lbc
      - pa-extension
      - pa-storey
  - all:
    - application-type:
        in:
        - hh
        - full
        - ldc-existing-use
        - ldc-prospective-use
        - ldc-proposed-work-lb
        - prior-approval
        - s73
        - non-material-amendment
    - condition:
        field: building-works
        value: true
        description: The proposal involves building or altering a building.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings, structures or plant are proposed.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: These should show the existing and proposed elevations and floor plans of each storey to
  be built or altered. … For all buildings, structures, and plant to clearly show proposed design, appearance
  and materials in relation to what is already there.
must-include:
- item: Each storey built or altered in full (partial floor plans are not acceptable), normally at 1:50
    or 1:100
  level: must
- item: Door and window positions identical to the elevations
  level: must
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), Plan and Drawing Requirements (pages 128-130),
  with the per-type tables. Listed for householder, lawful development certificates, listed building consent,
  major and minor development, non-material amendments, prior approvals, enlargement of a dwelling and
  s73. The major (section 8) and minor residential and commercial (sections 9-10) tables are for full
  applications. Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15.'
review-status: unverified
field-status: {}
