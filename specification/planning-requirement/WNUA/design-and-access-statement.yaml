  proposed quantity of and facilities within each, given in hectares or square metres as appropriate.
  If provision is to be met through a financial contribution to enhance existing facilities nearby, justification
  for off-site provision must be provided along with relative walking distances, times and routes to such
  facilities. Policy INF1, INF2 of the Joint Core Strategy Retail Impact Assessment An assessment to establish
  whether the impact of certain out of centre and edge of centre proposals over time (up to 5 years or
  10 for major schemes) on existing town and local centres is or is not significantly adverse. The impact
  should be assessed in relation to all town and local centres that may be affected, which are not necessarily
  just those closest to the proposal and may be in neighbouring authority areas. The retail impact test
  checklist set out in the Planning Practice Guidance should be followed. Policy S9, of the Joint Core
