policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9
source-text: 'A design and access statement (DAS) is required for: - applications for major development;
  - applications for development in a designated area (Conservation Area) where the proposed development
  consists of: one or more dwellings; or - a building or buildings with a floor space of 100 square meters
  or more; The statutory requirements for design and access statements are set out in Article 9 of the
  Town and Country Planning (General Development Procedure) Order (England) 2015 - A Design and Access
  Statement (DAS) is a document that explains the design principles and concepts that have been applied
  to the development, and how issues related to access have been dealt with. See the Definition Section
  for full details on this requirement Environment Statement (EIA) Developments that are likely to have
  a significant effect on the environment by virtue of their nature, size and location and are listed
  under Schedule 1 of the EIA regulations. Those developments included in Schedule 2 of the EIA Regulations
  may also require and EIA. The Town & Country Planning (Environmental Impact Assessment) England and
  Wales Regulations 1999, as amended Town and Country Planning (Environmental Impact Assessment) (Amendment)
  Regulations 2015 77 Information What is required Justification Fee The application must be accompanied
  by the correct fee. Fees can be calculated using the Planning Portal fee calculator. Planning fees are
  set by the Town and Country Planning (Fees for Applications, Deemed Applications, Requests and Site
  Visits) (England) Regulations 2017 Fire statement Multi-occupied residential buildings of 18 metres
  or more in height, or 7 or more storeys. National Requirement The application must be accompanied by
  a fire statement, completed by an expert and submitted as part of the application for planning permission.
  The Fire Statement should include as a minimum: Parking and access arrangement Plan Plan: Elevation
  … the principles, concepts and approach relating to fire safety that have been applied to each building
  in the development; … the site layout; … emergency vehicle access and water supplies for firefighting
  purposes; … what, if any, consultation has been undertaken on issues relating to the fire safety of
  the development, and what account has been taken of this; … how any planning policies relating to fire
  safety have been taken into account. Where access and/or layout is to be considered details of existing
  and proposed cycle/car parking provision and pedestrian/cycle and car access arrangements. These details
  must be shown on a site layout plan and full details may be required for secure cycle parking. If the
  maximum parking standard is to be provided or exceeded a justification to support the reasoning for
  this should be submitted Please see Plans and Drawing Requirement Section Policies within Local Plans
  Part 2 … PolicyENV10 For Daventry District … Policy SS2, INF4 and SDP1 For South Northamptonshire Policy
  MO4 and HO3 of Northampton Article 7 of the Town and Country Planning (General Development 78 Information
