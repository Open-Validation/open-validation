reference: design-and-access-statement
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - site:
        in:
        - conservation-area
        description: Development in a designated area (Conservation Area).
    - any:
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: One or more dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 100
          description: A building or buildings with a floor space of 100 square metres or more.
  - all:
    - application-type:
        in:
        - hh
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
    - condition:
        field: floorspace
        operator: '>='
        value: 100
        description: Floor space created is 100 square metres or more.
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - pa-demo-building
    - site:
        in:
        - conservation-area
        description: In a Conservation Area.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: floorspace
        operator: '>'
        value: 100
        description: New buildings creating over 100m2 of floor space, ancillary or related to an after
          use.
