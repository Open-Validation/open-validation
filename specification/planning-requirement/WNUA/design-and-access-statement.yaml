  The Town and Country Planning (General Permitted Development) Order 2015 (‘the GPDO’) allows for the
  carrying out of development without the need for express planning permission from the local planning
  authority. This is known as ‘permitted development’. Some forms of permitted development require a notification
  to be submitted to the local planning authority so it may decide whether to grant or refuse prior approval,
  or allow the development to proceed on the basis of the information supplied. The restrictions and limitations,
  and the triggers for making an application are set out in the GPDO. Failure to adhere to these will
  result in the development being unauthorised. In some of the following allowances, it is possible to
  also apply for building operations reasonably necessary to carry out the change of use. Sufficient details
