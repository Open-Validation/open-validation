local-authority: WNUA
required-if: discretionary
source-url: https://cms.westnorthants.gov.uk/media/30003/download
source-text: In instances where developments that are located immediately adjacent to existing residential
  properties, a proposed site plan (Scale 1:100 or 1:200) showing a 45-degree line (60 degree in a case
  of single storey extensions within the former Daventry District) must be shown from the nearest habitable
  room within the neighbouring property.
must-include:
- item: A proposed site plan (1:100 or 1:200) showing a 45-degree line (60 degrees for single storey extensions
    in the former Daventry District) from the nearest habitable room of the neighbouring property
  level: must
