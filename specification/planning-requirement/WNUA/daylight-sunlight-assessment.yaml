reference: daylight-sunlight-assessment
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - hh
      - full
  - condition:
      field: adjoins-residential-property
      value: true
      description: Located immediately adjacent to existing residential properties.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Local Plans Part 2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local
  Plan, Northampton Local Plan) (Daventry ENV10; South Northamptonshire SS2, SDP1; Northampton Q1, Q2)
source-text: In instances where extensions are proposed to residential properties or to other developments
  that are located immediately adjacent to existing residential properties, a proposed site plan (Scale
  1:100 or 1:200) showing a 45 degree line
must-include:
- item: A proposed site plan (1:100 or 1:200) showing a 45-degree line from the centre of the nearest
    habitable room window on the neighbouring property
  level: must
- item: 'For single storey extensions in the former Daventry District: a 60-degree line instead'
  level: must
  required-if:
    condition:
      field: former-district
      value: daventry
      description: In the former Daventry District.
- item: 'Where the development breaches that line and may affect neighbours'' daylight or sunlight: a
    daylight/sunlight assessment'
  level: must
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 5 and 8-10. Where the 45-degree line
  is exceeded and neighbours' light 'may' be affected, a full assessment is needed, which is a judgement,
  so that part is discretionary.
review-status: unverified
field-status: {}
