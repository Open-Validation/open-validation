reference: water-impact-assessment
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - condition:
      field: dewatering-or-abstraction
      value: true
      description: Potential to impact hydrology and hydrogeology, including ground and surface water.
  - discretionary
source-url: https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf
policy: Minerals and Waste Local Plan for Northamptonshire (2017); NPPF
source-text: Where the development has the potential to impact upon hydrology and hydrogeology, including
  an impact on ground and surface water.
must-include:
- item: Geological conditions and the behaviour of surface and ground water for the site and surrounding
    area
  level: must
- item: The type, quantities and storage/disposal of surface water run-off, with scale plans of drainage
  level: must
- item: Mitigation proposals for any impacts
  level: must
confidence: medium
notes: 'Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  pages 16 and 35. Hydrological and Hydrogeological Assessment for mineral and waste applications. ''Potential
  to impact'' is partly a judgement, so it is shown with dewatering/abstraction and as discretionary.'
review-status: unverified
field-status: {}
