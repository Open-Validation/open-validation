reference: elevation-existing
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - advertising
      - lbc
      - pa-demo-building
      - pa-extension
      - pa-storey
      - pa-ecomms-network
      - reserved-matters
  - all:
    - application-type:
        in:
        - hh
        - full
        - ldc-existing-use
        - ldc-prospective-use
        - ldc-proposed-work-lb
        - prior-approval
        - s73
        - non-material-amendment
    - condition:
        field: building-works
        value: true
        description: The proposal involves building or altering a building.
  - all:
    - application-type:
        in:
        - outline
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings, structures or plant are proposed.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: These should show the existing and proposed elevations and floor plans of each storey to
  be built or altered. … For all buildings, structures and plant to clearly show proposed design, appearance
  and materials of the development in relation to what is already there.
must-include:
- item: Existing and proposed elevations of each storey built or altered; partial elevations are not acceptable
  level: must
- item: Normally at 1:50 or 1:100, with new works clearly identified and all openings shown
  level: should
- item: All faces of the building affected, including blank walls, each labelled with its compass orientation
  level: must
- item: 'Where the elevation adjoins or is near another building: the relationship and the openings on
    each property'
  level: should
  required-if:
    condition:
      field: adjoins-existing-building
      value: true
      description: The elevation adjoins or is near another building.
- item: 'For external wall insulation: a photograph or detailed scale drawing of the existing elevation(s)'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Minerals and waste: Proposed design, appearance and materials in relation to what is already
    there, scaled to fit A4 or A3 where legible'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings, structures or plant are proposed.
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), Plan and Drawing Requirements (pages 128-130),
  with the per-type tables. Listed in the tables for advertisements, demolition, householder, lawful development
  certificates, listed building consent, major and minor development, non-material amendments, outline,
  prior approvals (enlargement, telecommunications), reserved matters and s73. Outline is discretionary
  because appearance may be reserved; for s73 and non-material amendments the list asks for an overlay
  plan of the changes. The major (section 8) and minor residential and commercial (sections 9-10) tables
  are for full applications. Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15.'
review-status: unverified
field-status: {}
