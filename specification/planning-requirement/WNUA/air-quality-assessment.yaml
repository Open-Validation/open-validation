reference: air-quality-assessment
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - prior-approval
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: direct-air-emissions
          value: true
          description: Air emissions, including odour, bio-aerosols and pollutants.
      - condition:
          field: dust-generation
          value: true
          description: Dust emissions.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policy BN9; Local Plans Part 2 (Daventry Settlements
  and Countryside Local Plan, South Northamptonshire Local Plan, Northampton Local Plan)
source-text: Proposals for new development which are likely to cause pollution or likely to result in
  exposure to sources of pollution or risks to safety will need to demonstrate that they provide opportunities
  to minimise and where possible reduce pollution issues … All proposals that impact air quality through
  air emissions, including odour, dust, bio-aerosol and potential pollutants.
must-include:
- item: The air quality impact during construction (dust, mud, traffic, plant emissions) and in operation
  level: must
- item: Exposure of occupiers of proposed residential development in areas of poor air quality (usually
    AQMAs)
  level: must
  required-if:
    site:
      in:
      - air-quality-management-area
      description: In an area of poor air quality.
- item: Physical and design mitigation measures
  level: must
- item: 'Minerals and waste: The scale and nature of emissions, their impact on people and the environment
    with reference to air quality standards and AQMAs, and a management and mitigation scheme'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8-10, 12 and 15 and the Definitions
  (page 121). Whether a proposal is ''likely to cause pollution'' is a judgement, so it is discretionary;
  for prior approvals it is listed where ''constraints and/or consultation with third parties indicate
  an elevated level of concern''. Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15 and 31.'
review-status: unverified
field-status: {}
