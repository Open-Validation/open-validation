reference: air-quality-assessment
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - prior-approval
  - discretionary
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policy BN9; Local Plans Part 2 (Daventry Settlements
  and Countryside Local Plan, South Northamptonshire Local Plan, Northampton Local Plan)
source-text: Proposals for new development which are likely to cause pollution or likely to result in
  exposure to sources of pollution or risks to safety will need to demonstrate that they provide opportunities
  to minimise and where possible reduce pollution issues
must-include:
- item: The air quality impact during construction (dust, mud, traffic, plant emissions) and in operation
  level: must
- item: Exposure of occupiers of proposed residential development in areas of poor air quality (usually
    AQMAs)
  level: must
  required-if:
    site:
      in:
      - air-quality-management-area
      description: In an area of poor air quality.
- item: Physical and design mitigation measures
  level: must
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 8-10, 12 and 15 and the Definitions
  (page 121). Whether a proposal is 'likely to cause pollution' is a judgement, so it is discretionary;
  for prior approvals it is listed where 'constraints and/or consultation with third parties indicate
  an elevated level of concern'.
review-status: unverified
field-status: {}
