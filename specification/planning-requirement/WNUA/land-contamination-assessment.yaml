reference: land-contamination-assessment
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - prior-approval
    - any:
      - condition:
          field: previously-developed-land
          value: true
          description: Brownfield land.
      - site:
          in:
          - contaminated-land
          description: Known or suspected to be affected by land contamination.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - site:
          in:
          - contaminated-land
          description: Contamination is known or suspected.
      - condition:
          field: sensitive-end-use
          value: true
          description: The proposed use is particularly vulnerable to land contamination.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policy BN9; Local Plans Part 2 (Daventry Settlements
  and Countryside Local Plan, South Northamptonshire Local Plan, Northampton Local Plan)
source-text: A Phase 1 Site Investigation should be submitted with any application on brownfield land
  or where the development is known or suspected to be affected by land contamination. … Where contamination
  is known/suspected or proposed use particularly vulnerable to land contamination.
must-include:
- item: All previous uses and local environmental information (geology, aquifers, pollution incidents)
  level: must
- item: Potential contaminants associated with those uses
  level: must
- item: A conceptual model of sources, pathways and receptors
  level: must
- item: Potentially unacceptable risks from contamination at the site
  level: must
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8-10, 12 and 15 and the Definitions
  (page 122). Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16 and 36.'
review-status: unverified
field-status: {}
