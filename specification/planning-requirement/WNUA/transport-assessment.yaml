reference: transport-assessment
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - prior-approval
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policies C1-C5 and BN9
source-text: The PPG provides brief guidance on when a Transport Assessment or Transport Statement is
  required and the scope and level of details. … Where the proposed development has increased transport/traffic
  implications.
must-include:
- item: The trip generation of the site, covering all movement by people and vehicles, with scope agreed
    with the local highway authority
  level: should
- item: 'Minerals and waste: The maximum and average daily HGV movements generated by the development'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8, 9, 12 and 15. The list leaves
  the need to the PPG (''likely to have significant transport implications''), so it is discretionary;
  for prior approvals a transport statement is listed where concern is elevated. Minerals and waste: from
  the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 18 and 42. A Transport Assessment for significant increases in traffic, a Transport Statement otherwise;
  whether there are increased traffic implications is a judgement.'
review-status: unverified
field-status: {}
