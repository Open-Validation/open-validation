reference: recreation-facilities-assessment
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - any:
    - condition:
        field: loss-of-open-space
        value: true
        description: Loss of formal, public or amenity open space.
    - condition:
        field: affects-playing-field
        value: true
        description: Loss of playing fields.
    - all:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 1
          description: Major residential development.
      - discretionary
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Local Plans Part 2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local
  Plan, Northampton Local Plan) (Daventry CW2; South Northamptonshire GS1; Northampton CRC4)
source-text: For development leading to the loss of playing fields, formal open space, public open space
  or amenity open space (whether publicly adopted or not), and for major applications for residential
  development where the proximity to existing playing fields or public open space will need to be considered.
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 8 and 12 (Green space/playing field
  assessment). For major residential development the need depends on proximity to playing fields or open
  space, a judgement, so that part is discretionary.
review-status: unverified
field-status: {}
