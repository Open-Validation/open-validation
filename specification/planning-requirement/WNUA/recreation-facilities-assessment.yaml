reference: recreation-facilities-assessment
local-authority: WNUA
required-if:
  any:
  - condition:
      field: loss-of-open-space
      value: true
      description: Loss of playing fields, formal, public or amenity open space.
  - all:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: Residential development.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
source-text: loss of playing fields, formal open space, public open space or amenity open space (whether
  publicly adopted or not), and for major applications for residential development where the proximity
  to existing playing fields or public open space will need to be considered.
confidence: medium
