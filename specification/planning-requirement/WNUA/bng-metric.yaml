reference: bng-metric
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
      - s73
      - non-material-amendment
  - condition:
      field: biodiversity-gain-condition
      value: true
      description: Subject to the biodiversity gain condition (not exempt).
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policy BN2; Environment Act 2021
source-text: If the development is not exempt, detailed ecological information must be provided by a suitably
  qualified ecologist to demonstrate how measurable BNG will be delivered.
must-include:
- item: A copy of the Statutory Metric assessment (baseline habitats), in Excel and as a 'fit to page'
    PDF
