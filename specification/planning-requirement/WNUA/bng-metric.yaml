- item: A habitat condition assessment, in Excel and as a 'fit to page' PDF
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: A draft post-development metric, in Excel and as a 'fit to page' PDF
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
- item: 'For reserved matters: more detail added to the metric based on the finalised layout'
  level: must
  required-if:
    application-type:
      in:
      - reserved-matters
- item: 'For s73 and non-material amendments: an updated BNG statement and metric'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8-12, 18 and 19. Shown with the
