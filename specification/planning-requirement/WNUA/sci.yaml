reference: sci
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - ref: major-development
  - condition:
      field: wind-turbine-count
      operator: '>='
      value: 2
      description: Installation of 2 or more wind turbines.
  - condition:
      field: turbine-hub-height
      operator: '>'
      value: 15
      description: A single turbine where the hub height exceeds 15 metres.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - ref: major-development
    - condition:
        field: eia-development
        value: true
        description: Accompanied by an Environmental Impact Assessment.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Statements of Community Involvement (Daventry 2017, Northampton 2018, South Northamptonshire 2020)
source-text: A Community Engagement Statement is required to set out how the developer has complied with
  the requirements for pre-application consultation in the Council’s Statement of Community Involvement
  (SCI). … For applications for the installation of 2 or more wind turbines or a single turbine where
  the hub height exceeds 15 metres … All major applications that are accompanied by an Environmental Impact
  Assessment.
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), section 8 (pages 32 and 44). Minerals and
  waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 17 and 41.'
review-status: unverified
field-status: {}
