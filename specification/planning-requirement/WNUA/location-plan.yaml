reference: location-plan
local-authority: WNUA
required-if:
  application-type:
    in:
    - advertising
    - pa-demo-building
    - hedgerow-removal
    - hh
    - ldc-existing-use
    - ldc-prospective-use
    - ldc-proposed-work-lb
    - lbc
    - full
    - outline
    - pip
    - prior-approval
    - pa-extension
    - pa-storey
    - pa-ecomms-network
    - reserved-matters
    - s73
    - consent-under-tpo
    - notice-trees-in-con-area
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: This is needed to identify the property so that everyone knows which house is applying for
  planning permission.
must-include:
- item: Not a Land Registry plan; Ordnance Survey data must carry an OS copyright statement
  level: must
- item: 'The application site (including access to the adopted highway) edged in red, including all land
    needed for the development: access from a public highway, visibility splays, landscaping, car parking
    and open areas around buildings'
  level: must
- item: 'For new or altered access: all the area needing work, including the dropped kerb, within the
    red line'
  level: must
  required-if:
    condition:
      field: new-vehicle-access
      value: true
      description: New or altered access.
- item: Any adjoining land in which the applicant has an interest edged in blue
  level: should
- item: At a scale that identifies the site, in most cases an OS-based map at 1:1250 or 1:2500
  level: should
- item: A4 (A3 for larger sites), based on an up-to-date map, with a north point and surrounding buildings,
    ideally showing two named roads
  level: should
- item: 'For hedgerow removal: the location and length of the hedgerow(s)'
  level: must
  required-if:
    application-type:
      in:
      - hedgerow-removal
- item: 'For tree works: the site and the tree(s) on which work is proposed'
  level: must
  required-if:
    application-type:
      in:
      - consent-under-tpo
      - notice-trees-in-con-area
confidence: medium
notes: From the council's list (adopted 25 February 2026), Plan and Drawing Requirements (pages 128-130),
  with sections 4 and 20. Every application type's national table lists a site location plan except details
  required by conditions and non-material amendments.
review-status: unverified
field-status: {}
