reference: sustainable-drainage-strategy
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - ref: major-development
      - condition:
          field: dwelling-count
          operator: '>='
          value: 5
          description: 5-9 dwellings.
      - condition:
          field: floorspace
          operator: '>='
          value: 500
          description: Creation or change of use of 500-999 sq m floor space.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - ref: major-development
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policies BN7 and BN9; Local Plans Part 2 (Daventry
  Settlements and Countryside Local Plan, South Northamptonshire Local Plan, Northampton Local Plan)
source-text: Details of Sustainable Urban Drainage Systems (SuDS) being provided onsite or within close
  proximity to assist with the management of surface water … For 5 - 9 dwellings or creation or change
  of use of 500-999sqm floor space … All major applications should also be accompanied by a Surface Water
  Drainage Assessment (which may form part of an FRA where required)
must-include:
- item: SuDS on site or close by to manage surface water during and after construction
  level: must
- item: Foul drainage details (mains or private)
  level: should
  required-if: discretionary
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8-10, 12 and 18. Drainage Strategy
  (MHCLG''s retired id for a drainage strategy). Foul drainage details ''may also be required''. Minerals
  and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 34. Mineral working and waste development are major development by definition.'
review-status: unverified
field-status: {}
