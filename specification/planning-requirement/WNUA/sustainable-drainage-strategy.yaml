reference: sustainable-drainage-strategy
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - ref: major-development
    - condition:
        field: dwelling-count
        operator: '>='
        value: 5
        description: 5-9 dwellings.
    - condition:
        field: floorspace
        operator: '>='
        value: 500
        description: Creation or change of use of 500-999 sq m floor space.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policies BN7 and BN9; Local Plans Part 2 (Daventry
  Settlements and Countryside Local Plan, South Northamptonshire Local Plan, Northampton Local Plan)
source-text: Details of Sustainable Urban Drainage Systems (SuDS) being provided onsite or within close
  proximity to assist with the management of surface water … For 5 - 9 dwellings or creation or change
  of use of 500-999sqm floor space
must-include:
- item: SuDS on site or close by to manage surface water during and after construction
  level: must
- item: Foul drainage details (mains or private)
  level: should
  required-if: discretionary
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 8-10, 12 and 18. Drainage Strategy
  (MHCLG's retired id for a drainage strategy). Foul drainage details 'may also be required'.
review-status: unverified
field-status: {}
