  notes: 'Grokbot links the current West Northamptonshire list, Planning Application Validation Requirements
    2026-2028, adopted 25 Feb 2026. Its list date comes from PDF metadata. The extraction is poor. The
    document has a local table for each of 21 application types, but Grokbot put about 47 requirements
    under Full planning as INFERRED. It leaves Householder, Reserved matters, LBC, s73, NMA, LDC, adverts,
    prior approvals and discharge of conditions empty, gives Outline only a Travel Plan, and misses requirements
    such as Air Quality, Sustainability Statement and Housing Quality Statement. Many triggers come from
    the wrong row; for example, the FRA uses the bat-roost text and the Drainage Strategy uses the daylight
    text. The list should be re-extracted section by section. Fixed 2026-11-05: every file was rewritten
    from the council''s latest list.'
