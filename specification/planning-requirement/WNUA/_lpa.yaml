submission-standards:
- item: All plans and drawings to an appropriate metric scale, with key dimensions written (height, length,
    width and distance from the site boundary)
  level: must
- item: Scale stated with the sheet size (e.g. 1:100 at A1 or 1:200 at A3)
  level: should
- item: Vertical and horizontal scale bars
  level: should
- item: Drawings marked 'Do not scale' or 'Not to scale' are not accepted
  level: must
- item: All sections of the application form completed in full, dated and signed
  level: must
- item: Photographs in a separate document without confidential or personally identifying content
  level: should
