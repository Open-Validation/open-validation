submission-standards:
- item: All plans and drawings to an appropriate metric scale, with key dimensions written (height, length,
    width and distance from the site boundary)
  level: must
- item: Scale stated with the sheet size (e.g. 1:100 at A1 or 1:200 at A3)
  level: should
- item: Vertical and horizontal scale bars
  level: should
- item: Drawings marked 'Do not scale' or 'Not to scale' are not accepted
  level: must
- item: All sections of the application form completed in full, dated and signed
  level: must
- item: Photographs in a separate document without confidential or personally identifying content
  level: should
- item: 'Minerals and waste applications: supporting documents and plans in PDF, named appropriately with
    revision dates and numbers, and plans scaled to a maximum of A3 where possible'
  level: should
- item: 'Minerals and waste applications: hard copies for major and more complex applications (number
    to be agreed with Development Control)'
  level: must
audit:
  status: audited
  checked: '2026-11-05'
  contents-checked: true
  workbook-link-current: true
  issues-open: 0
  notes: 'Grokbot links the current West Northamptonshire list, Planning Application Validation Requirements
    2026-2028, adopted 25 Feb 2026. Its list date comes from PDF metadata. The extraction is poor. The
    document has a local table for each of 21 application types, but Grokbot put about 47 requirements
    under Full planning as INFERRED. It leaves Householder, Reserved matters, LBC, s73, NMA, LDC, adverts,
    prior approvals and discharge of conditions empty, gives Outline only a Travel Plan, and misses requirements
    such as Air Quality, Sustainability Statement and Housing Quality Statement. Many triggers come from
    the wrong row; for example, the FRA uses the bat-roost text and the Drainage Strategy uses the daylight
    text. The list should be re-extracted section by section. Fixed 2026-11-05: every file was rewritten
    from the council''s latest list.'
