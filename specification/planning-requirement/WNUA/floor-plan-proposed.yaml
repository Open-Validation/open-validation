reference: floor-plan-proposed
local-authority: WNUA
required-if:
  any:
  - any:
    - application-type:
        in:
        - lbc
        - pa-extension
        - pa-storey
    - all:
      - application-type:
          in:
          - hh
          - full
          - ldc-existing-use
          - ldc-prospective-use
          - ldc-proposed-work-lb
          - prior-approval
          - s73
          - non-material-amendment
      - condition:
          field: building-works
          value: true
          description: The proposal involves building or altering a building.
  - application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-amusements-to-dwh
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: building-works
        value: true
        description: Buildings, structures or plant are proposed.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: These should show the existing and proposed elevations and floor plans of each storey to
  be built or altered. … In relation to development proposed under Class G, M, MA, N, O, PA or Q of this
  Part, a floor plan indicating the total floor space in square metres of each dwellinghouse, … For all
  buildings, structures, and plant to clearly show proposed design, appearance and materials in relation
  to what is already there.
must-include:
- item: Each storey built or altered in full (partial floor plans are not acceptable), normally at 1:50
    or 1:100, with new works clearly identified
  level: must
- item: Door and window positions identical to the elevations
  level: must
- item: 'For prior approval under Class G, M, MA, N, O, PA or Q: the total floor space of each dwellinghouse,
    the dimensions and use of each room, the position and dimensions of windows, doors and walls, and
    the elevations'
  level: must
  required-if:
    application-type:
      in:
      - cho-agri-to-dwh
      - cho-commercial-to-dwh
      - cho-commercial-to-mixed
      - cho-sui-to-dwh
      - cho-amusements-to-dwh
- item: 'For s73 and non-material amendments: an overlay plan showing existing and proposed changes'
  level: must
  required-if:
    application-type:
      in:
      - s73
      - non-material-amendment
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), Plan and Drawing Requirements (pages 128-130),
  with the per-type tables. Listed for householder, lawful development certificates, listed building consent,
  major and minor development, non-material amendments, prior approvals, enlargement of a dwelling and
  s73. The major (section 8) and minor residential and commercial (sections 9-10) tables are for full
  applications. The Class G-Q floor plan comes from the prior approval table (page 98). Minerals and waste:
  from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15.'
review-status: unverified
field-status: {}
