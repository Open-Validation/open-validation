reference: biodiversity-survey-report
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - prior-approval
    - any:
      - condition:
          field: protected-species
          value: true
          description: Likely to affect protected or important species, habitats or geological features.
      - discretionary
  - all:
    - application-type:
        in:
        - hh
        - lbc
        - pa-demo-building
        - full
    - any:
      - condition:
          field: vacant-building
          value: true
          description: A vacant building is converted.
      - condition:
          field: demolition
          value: true
          description: A building is demolished.
      - condition:
          field: potential-roost-features
          value: true
          description: The building has potential roost features.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: protected-species
          value: true
          description: Likely impacts on wildlife and biodiversity.
      - discretionary
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policy BN2; Local Plans Part 2 (Daventry Settlements
  and Countryside Local Plan, South Northamptonshire Local Plan, Northampton Local Plan)
source-text: All applications which are likely to affect a protected or nationally, regionally or locally
  important species and /or protected or nationally, regionally or locally important habitats or geological
  features, will require a Preliminary Ecological Appraisal Report (PEAR) and any predetermination surveys
  generated from this initial appraisal. … A Preliminary Roost Assessment (PRA) is required where a vacant
  building is converted, a building is demolished, or where a building has potential roost features. …
  Where there is a reasonable likelihood that a proposed development would have impacts on wildlife and
  biodiversity
must-include:
- item: A Preliminary Ecological Appraisal Report and any pre-determination surveys, presented as an Ecological
    Impact Assessment
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
      - prior-approval
- item: Biodiversity enhancements for priority species and habitats outside BNG (e.g. bird and bat boxes,
    native planting)
  level: must
  required-if:
    application-type:
      in:
      - full
      - outline
      - reserved-matters
- item: Badger sett locations only in a separate report marked Sensitive/Confidential
  level: must
- item: Great Crested Newt District Licensing reports or certificate where used
  level: should
- item: 'Preliminary Roost Assessment: up-to-date surveys at the appropriate time of year by a suitably
    qualified ecologist, with full mitigation details'
  level: must
  required-if:
    any:
    - condition:
        field: vacant-building
        value: true
        description: Conversion of a vacant building.
    - condition:
        field: demolition
        value: true
        description: Demolition.
    - condition:
        field: potential-roost-features
        value: true
        description: Potential roost features.
- item: 'Minerals and waste: Surveys by a suitably qualified ecologist where protected species are likely
    to be present, and mitigation, compensation and long-term management proposals'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: protected-species
        value: true
        description: Protected species likely.
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 2, 5, 7-10, 12 and 15. ''Likely
  to affect'' important species or habitats is a judgement, so that part is discretionary. Minerals and
  waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15 and 33.'
review-status: unverified
field-status: {}
