reference: travel-plan
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
  - discretionary
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policies C1-C5
source-text: A travel plan should be submitted alongside planning applications, which are likely to have
  significant transport implications.
must-include:
- item: A strategy for implementation, the travel plan coordinator, management arrangements, timetable,
    and marketing to occupiers, users, visitors and residents
  level: should
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 8, 9, 12 and 15. The list leaves the
  need to the PPG ('likely to have significant transport implications'), so it is discretionary; for prior
  approvals a transport statement is listed where concern is elevated.
