source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policies C1-C5
source-text: A travel plan should be submitted alongside planning applications, which are likely to have
  significant transport implications. … Where the proposal has significant transport implications for
  employees and/or users of the facility.
must-include:
- item: A strategy for implementation, the travel plan coordinator, management arrangements, timetable,
    and marketing to occupiers, users, visitors and residents
  level: should
