reference: arboriculturist-report
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
    - any:
      - site:
          in:
          - tree-preservation-zone
          description: Protected trees within or adjacent to the site.
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Significant trees within or adjacent to the site.
  - all:
    - application-type:
        in:
        - hh
    - condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within or adjacent to the site.
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: trees-on-or-near-site
          value: true
          description: Trees within or next to the site that could influence or be affected by the development.
      - condition:
          field: hedgerows-affected
          value: true
          description: Hedgerows within or next to the site that could be affected.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Local Plans Part 2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local
  Plan, Northampton Local Plan); BS 5837:2012
source-text: Any development where there are significant or protected trees within or adjacent to the
  site. … A tree protection plan may be required where there are trees within or adjacent to the site.
  … Where there are trees and hedgerows within the application site or on land adjacent to it that could
  influence or be affected by the development.
must-include:
- item: Carried out by a qualified arboriculturalist
  level: must
- item: 'For householder applications: a Tree Protection Plan (tree locations, species, trunk diameters,
    Root Protection Areas, crown spread, fence type and anchoring) superimposed on the block plan, with
    a statement that protection will be in place before any site activity'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'Minerals and waste: Trees and hedgerows to be lost or retained and their protection during works
    (BS 5837:2012), by a suitably qualified person'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 5, 8-10, 12 and 18. The householder
  tree protection plan ''may be required'', so it is discretionary. Minerals and waste: from the county
  matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16 and 35.'
review-status: unverified
field-status: {}
