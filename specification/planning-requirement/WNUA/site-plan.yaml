reference: site-plan
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - advertising
      - pa-demo-building
      - hh
      - ldc-existing-use
      - ldc-prospective-use
      - ldc-proposed-work-lb
      - lbc
      - full
      - outline
      - prior-approval
      - pa-extension
      - pa-storey
      - pa-ecomms-network
      - reserved-matters
      - s73
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: 'A block plan (or site plan) is required if you are extending your house or erecting buildings
  within your garden curtilage: … The plan should be at an appropriate scale (1:100 or 1:200) showing
  any site boundaries.'
must-include:
- item: At a scale appropriate to the site (normally 1:500 or 1:200), with a north point
  level: must
- item: The new works in relation to the site boundaries, neighbouring properties, other buildings and
    features such as trees
  level: should
- item: New buildings in context with adjacent buildings, including property numbers or names, roads and
    footpaths
  level: should
- item: On-site access, parking, turning and cycle parking, and vehicle access visibility splays
  level: should
- item: The species, position and spread of all trees within 12 metres of any proposed building works
  level: should
- item: The extent and type of hard surfacing, and boundary treatment (heights and materials)
  level: should
- item: 'For new developments: provision for the storage and collection of waste and recyclables'
  level: must
  required-if:
    condition:
      field: new-build
      value: true
      description: New development.
- item: 'For advertisements and demolition: a layout plan showing the location of all proposed signage,
    or identifying the building(s)/structures to be demolished'
  level: must
  required-if:
    application-type:
      in:
      - advertising
      - pa-demo-building
- item: 'For a new or altered vehicular access: the position of the lowered kerb and hard surfaces in
    the highway, and the materials and drainage of any driveway, at 1:50 or 1:100'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - hh
    - condition:
        field: new-vehicle-access
        value: true
        description: Provision or alteration of a vehicular access.
  source-text: For proposals involving the provision or alteration of a vehicular access, a block plan
    showing the position for the lowered kerb and hard surfaces in the public highway, along with details
    of the materials and drainage to any driveway created.
- item: 'For external wall insulation: which elevations are to be insulated'
  level: must
  required-if:
    application-type:
      in:
      - hh
- item: 'For telecommunications: a proposed site plan at 1:50 or 1:100 identifying existing buildings,
    structures, hardstandings, boundary treatments, trees within and next to the site with their Root
    Protection Areas, and parking spaces'
  level: must
  required-if:
    application-type:
      in:
      - pa-ecomms-network
- item: 'Minerals and waste: At 1:100 or 1:200 showing site boundaries and all major dimensions (heights,
    distances to boundaries or key features), with a scale, north point and drawing title and revision
    number'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), Plan and Drawing Requirements (pages 128-130),
  with sections 1, 2, 5 and 17. Covers the block/site plan, the layout plan (advertisements, demolition,
  outline) and the site layout plan (major development). Minerals and waste: from the county matter list
  (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 14. The table asks for a block plan for full applications and some s73a applications.'
review-status: unverified
field-status: {}
