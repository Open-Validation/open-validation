reference: planning-statement
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - full
      - outline
      - pip
      - reserved-matters
      - s73
      - non-material-amendment
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: 'Whole Development Plan: West Northamptonshire Joint Core Strategy (Part 1) and Local Plans Part
  2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local Plan, Northampton Local
  Plan)'
source-text: A statement which identifies the context and need (if relevant) for a proposed development.
  … This should set out the reasons why the variation/removal is sought, … Written statement setting out
  clearly the changes proposed from the previously approved application, … Planning Statement All applications
must-include:
- item: Compliance with planning policies, including neighbourhood plans, SPDs, the NPPF and PPG, and
    emerging policy
  level: must
- item: Details of any pre-application advice or consultation
  level: must
- item: 'For s73: the reasons for the variation/removal, with revised plans and technical reports'
  level: must
  required-if:
    application-type:
      in:
      - s73
- item: 'For non-material amendments: the changes from the approved application and why they are non-material'
  level: must
  required-if:
    application-type:
      in:
      - non-material-amendment
- item: 'Minerals and waste: How the development accords with the NPPF, the National Planning Policy for
    Waste and the Minerals and Waste Local Plan for Northamptonshire, with a description, facts and figures
    and a summary of the technical reports'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
- item: 'Minerals and waste: For large temporary developments (e.g. mineral workings, landfilling): a
    Working Scheme for the phased restoration and working of the site'
  level: must
  required-if:
    all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8-12, 14, 18 and 19. The major (section
  8) and minor residential and commercial (sections 9-10) tables are for full applications. Minerals and
  waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15 and 30.'
review-status: unverified
