reference: flood-risk-assessment
local-authority: WNUA
required-if:
  any:
  - site:
      in:
      - flood-risk-zone
      description: Within flood zone 2 or 3.
  - condition:
      field: site-area-residential
      operator: '>'
      value: 1
      description: Over 1 hectare in flood zone 1.
  - condition:
      field: site-area-non-residential
      operator: '>'
      value: 1
      description: Over 1 hectare in flood zone 1.
  - condition:
      field: near-watercourse
      value: true
      description: Within 10m of a watercourse.
  - condition:
      field: change-in-ground-levels
      value: true
      description: The proposal raises land levels.
  - discretionary
source-url: https://cms.westnorthants.gov.uk/media/30003/download
source-text: 'Flood Risk Assessment Any development falling into the following categories: - within flood
  zone 2 or 3...'
confidence: medium
notes: 'Audit (wrong_trigger): the workbook used the bat roost text. From the audit, the trigger also
  covers a change to a more vulnerable use and sites next to a flood defence (shown as officer discretion).
  For householder and minor extensions up to 250sqm in Flood Zones 2 and 3 it sets out floor levels or
  flood-proofing.'
review-status: unverified
field-status: {}
