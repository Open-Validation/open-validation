reference: archaeological-assessment
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - prior-approval
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - discretionary
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Local Plans Part 2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local
  Plan, Northampton Local Plan) (Daventry ENV7, ENV10; South Northamptonshire HE1, HE5, HE6; Northampton
  ENV6, Q1, Q2)
source-text: An assessment designed to provide baseline data on the potential archaeological and heritage
  assets that may be affected by a proposed development. … Please contact the Council’s Planning Archaeology
  to ascertain is a Desk Based Assessment is required. … All developments which could affect archaeological
  remains.
must-include:
- item: Analysis of the Historic Environment Record and areas of archaeological potential in Conservation
    Area Appraisals
  level: must
- item: The nature and extent of any further pre-determination works needed, such as geophysical survey
    or field evaluation
  level: must
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8-10, 12, 15 and 18. The council''s
  Planning Archaeology advises whether it is needed, so it is discretionary. Minerals and waste: from
  the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15 and 31. ''Could affect'' archaeological remains is a judgement, so it is discretionary.'
