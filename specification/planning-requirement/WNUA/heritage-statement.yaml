reference: heritage-statement
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - site:
      in:
      - conservation-area
      - listed-building
      - listed-building-setting
      - locally-listed-building
      - scheduled-monument
      - park-and-garden
      description: The site is in a conservation area or the proposal affects a heritage asset.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
source-text: Heritage Statement Only if in a Conservation Area or affecting a heritage asset.
must-include:
