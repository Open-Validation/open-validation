reference: heritage-statement
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - pa-demo-building
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - locally-listed-building
        - world-heritage-site
        - battlefield
        description: In a Conservation Area or affecting a heritage asset, including its setting.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - site:
          in:
          - listed-building
          - listed-building-setting
          - scheduled-monument
          - battlefield
          - park-and-garden
          description: Impacting listed buildings, Scheduled Ancient Monuments, registered battlefields,
            historic parks and gardens, or their settings.
      - all:
        - site:
            in:
            - archaeological-priority-area
            description: An area of archaeological interest.
        - condition:
            field: ground-disturbance
            value: true
            description: Disturbance of ground.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Local Plans Part 2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local
  Plan, Northampton Local Plan) (Daventry ENV7, ENV10; South Northamptonshire HE1, HE5, HE6, SS2, SDP1;
  Northampton ENV6, Q1, Q2)
source-text: Only if in a Conservation Area or affecting a heritage asset. … Unless any Design and Access
  statement includes the necessary information, a separate heritage impact assessment should be provided.
  … Proposals impacting upon listed buildings and their settings, Scheduled Ancient Monuments and their
  settings, registered battlefields, historic parks and gardens and their settings ,and the disturbance
  of ground within an area of archaeological interest.
must-include:
- item: Documents on the asset (listing entry or conservation area appraisal, HER, historical maps and
    photographs)
  level: must
- item: A description of the asset(s) and setting, including important views
  level: must
- item: A summary of significance (architectural, archaeological, artistic or historical interest)
  level: must
- item: 'A justification for the development: need, alternatives, public benefits, harm and mitigation,
    and appropriateness of scale, design and materials'
  level: must
- item: 'For listed buildings: whether the works also accord with other regulatory requirements'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For demolition in a Conservation Area: the building volume, or the height of gates, fences, walls
    or railings'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
- item: 'Where enabling development is proposed: a viability appraisal'
  level: must
  required-if:
    condition:
      field: enabling-development
      value: true
      description: Enabling development.
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 2, 5, 7-10 and 12 and the Definitions
  (page 124). Heritage Statement / Heritage Impact Assessment; it may be included in the Design and Access
  Statement. Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16 and 35.'
review-status: unverified
field-status: {}
