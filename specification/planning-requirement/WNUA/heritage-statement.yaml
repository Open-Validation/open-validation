reference: heritage-statement
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - lbc
  - all:
    - application-type:
        in:
        - hh
        - full
        - outline
        - pa-demo-building
    - site:
        in:
        - listed-building
        - listed-building-setting
        - conservation-area
        - scheduled-monument
        - park-and-garden
        - locally-listed-building
        - world-heritage-site
        - battlefield
        description: In a Conservation Area or affecting a heritage asset, including its setting.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Local Plans Part 2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local
  Plan, Northampton Local Plan) (Daventry ENV7, ENV10; South Northamptonshire HE1, HE5, HE6, SS2, SDP1;
  Northampton ENV6, Q1, Q2)
source-text: Only if in a Conservation Area or affecting a heritage asset. … Unless any Design and Access
  statement includes the necessary information, a separate heritage impact assessment should be provided.
must-include:
- item: Documents on the asset (listing entry or conservation area appraisal, HER, historical maps and
    photographs)
  level: must
- item: A description of the asset(s) and setting, including important views
  level: must
- item: A summary of significance (architectural, archaeological, artistic or historical interest)
  level: must
- item: 'A justification for the development: need, alternatives, public benefits, harm and mitigation,
    and appropriateness of scale, design and materials'
  level: must
- item: 'For listed buildings: whether the works also accord with other regulatory requirements'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For demolition in a Conservation Area: the building volume, or the height of gates, fences, walls
    or railings'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
- item: 'Where enabling development is proposed: a viability appraisal'
  level: must
  required-if:
    condition:
      field: enabling-development
      value: true
      description: Enabling development.
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 2, 5, 7-10 and 12 and the Definitions
  (page 124). Heritage Statement / Heritage Impact Assessment; it may be included in the Design and Access
  Statement.
review-status: unverified
field-status: {}
