reference: viability-assessment
local-authority: WNUA
required-if:
  any:
  - all:
    - application-type:
        in:
        - full
        - outline
        - reserved-matters
        - s73
        - non-material-amendment
    - any:
      - condition:
          field: affordable-housing-below-target
          value: true
          description: Affordable housing below Development Plan policy.
      - condition:
          field: planning-obligations-shortfall
          value: true
          description: Financial contributions below Development Plan policy.
  - condition:
      field: enabling-development
      value: true
      description: Enabling works related to a heritage asset.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: West Northamptonshire Joint Core Strategy (Part 1) policies INF1 and INF2
source-text: Where the level of affordable housing or financial contributions fall below that required
  by Development Plan policies, … For enabling works related to a heritage asset, the Local Planning Authority
  (LPA) typically requires a viability assessment.
must-include:
- item: A full unredacted FVA, to be published
  level: must
- item: An undertaking to cover the reasonable costs of independent assessment
  level: must
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 8, 11, 12 and 19.
review-status: unverified
field-status: {}
