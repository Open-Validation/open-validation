reference: fire-statement
local-authority: WNUA
required-if:
  all:
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: A building is 18 metres or more tall.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: A building has 7 or more storeys.
  - condition:
      field: dwelling-count
      operator: '>='
      value: 2
      description: A multi-occupied residential building.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
source-text: 'The Fire Statement should include as a minimum: the principles, concepts and approach relating
  to fire safety that have been applied to each building in the development; the site layout; emergency
  vehicle access and water supplies for firefighting purposes; what, if any, consultation has been undertaken
  on issues relating to the fire safety of the development, and what account has been taken of this; how
  any planning policies relating to fire safety have been taken into account. 31 Information W'
must-include:
- item: The principles, concepts and approach to fire safety applied to each building
  level: must
- item: The site layout
  level: must
- item: Emergency vehicle access and water supplies for firefighting
  level: must
- item: Any consultation on fire safety and what account has been taken of it
  level: must
- item: How planning policies on fire safety have been taken into account
  level: must
confidence: medium
notes: 'The workbook guessed the application type (''INFERRED''), so no type is given. Audit (other):
  a national requirement (multi-occupied residential buildings of 18m+ or 7+ storeys).'
