reference: fire-statement
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - full
      - outline
      - reserved-matters
  - any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 2
        description: Multi-occupied residential (two or more dwellings).
    - condition:
        field: educational-accommodation
        value: true
        description: Educational accommodation.
  - any:
    - condition:
        field: building-height
        operator: '>='
        value: 18
        description: 18 metres or more in height.
    - condition:
        field: storey-count
        operator: '>='
        value: 7
        description: 7 or more storeys.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 9A
source-text: Multi-occupied residential buildings of 18 metres or more in height, or 7 or more storeys.
must-include:
- item: Completed by an expert
  level: must
- item: Fire safety principles for each building, the site layout, emergency vehicle access and firefighting
    water supplies, consultation undertaken, and how fire safety policies were taken into account
  level: must
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 8-10, 12 and 18. Shown with the national
  rule.
review-status: unverified
field-status: {}
