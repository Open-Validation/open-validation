reference: roof-plan-proposed
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - lbc
      - pa-storey
  - all:
    - application-type:
        in:
        - hh
        - full
        - ldc-existing-use
        - ldc-prospective-use
        - ldc-proposed-work-lb
        - prior-approval
        - s73
        - non-material-amendment
    - condition:
        field: building-works
        value: true
        description: The proposal involves building or altering a building.
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - condition:
        field: complex-roof-design
        value: true
        description: The roof design is not a simple single, dual or mono pitch.
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Town and Country Planning (Development Management Procedure) (England) Order 2015, article 7
source-text: Roof plans show the outline of a building from above and display existing/proposed features
  such as valleys, ridges, hips, slopes, drainage, chimneys, vents and roof lights. … Where the roof design
  is not simple single dual or mono pitches, to clearly show proposed works in relation to what is already
  there.
must-include:
- item: Existing/proposed features such as valleys, ridges, hips, slopes, drainage, chimneys, vents and
    roof lights, normally at 1:50 or 1:100, with all works clearly identified
  level: must
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), Plan and Drawing Requirements (pages 128-130),
  with the per-type tables. Listed for householder, lawful development certificates, listed building consent,
  major and minor development, non-material amendments, prior approvals (additional storeys) and s73.
  The major (section 8) and minor residential and commercial (sections 9-10) tables are for full applications.
  Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 15.'
review-status: unverified
field-status: {}
