reference: photos
local-authority: WNUA
required-if:
  application-type:
    in:
    - advertising
    - pa-demo-building
    - lbc
    - full
    - outline
    - reserved-matters
    - prior-approval
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Local Plans Part 2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local
  Plan, Northampton Local Plan)
source-text: All applications should include photographs within a separate (confidential) document to
  aid the Council’s assessment of the application.
must-include:
- item: Clearly labelled to explain what each image shows
  level: must
- item: In a separate document, without personal or identifying information (e.g. children, views through
    neighbouring windows, number plates)
  level: should
- item: 'For advertisements: the existing signage'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For demolition: the building to be demolished'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
- item: 'For listed buildings: the building and its features as existing'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For major development: contextual elevations and 3D visualisations'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: From the council's list (adopted 25 February 2026), sections 1, 2, 7-10, 12, 15 and 18 (Site Photos).
review-status: unverified
