reference: photos
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - advertising
      - pa-demo-building
      - lbc
      - full
      - outline
      - reserved-matters
      - prior-approval
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: demolition
          value: true
          description: Demolition of any building.
      - discretionary
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Local Plans Part 2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local
  Plan, Northampton Local Plan)
source-text: All applications should include photographs within a separate (confidential) document to
  aid the Council’s assessment of the application. … To provide useful background information and show
  how large developments can be satisfactorily integrated within the landscape or street scene. Required
  for the demolition of any building to show what the buildings currently look like.
must-include:
- item: Clearly labelled to explain what each image shows
  level: must
- item: In a separate document, without personal or identifying information (e.g. children, views through
    neighbouring windows, number plates)
  level: should
- item: 'For advertisements: the existing signage'
  level: must
  required-if:
    application-type:
      in:
      - advertising
- item: 'For demolition: the building to be demolished'
  level: must
  required-if:
    application-type:
      in:
      - pa-demo-building
- item: 'For listed buildings: the building and its features as existing'
  level: must
  required-if:
    application-type:
      in:
      - lbc
- item: 'For major development: contextual elevations and 3D visualisations'
  level: should
  required-if:
    ref: major-development
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 1, 2, 7-10, 12, 15 and 18 (Site
  Photos). Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 17 and 38. Photographs for ''large developments'' are discretionary.'
review-status: unverified
field-status: {}
