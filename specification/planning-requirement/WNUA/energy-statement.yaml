reference: energy-statement
local-authority: WNUA
required-if:
  all:
  - application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
  - ref: major-development
  - discretionary
source-url: https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf
policy: NPPF section 14
source-text: All major applications which are likely to have impact upon the environment through the generation
  of greenhouse gases or have the potential to utilise renewable energy sources.
must-include:
- item: How the proposal addresses renewable energy and climate change, reduces the use of non-renewable
    resources and generates carbon savings
  level: must
confidence: medium
notes: 'Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  pages 17 and 40. Renewable Energy and Climate Change Assessment for mineral and waste applications.
  Whether a proposal is ''likely to have impact'' through greenhouse gases or could use renewables is
  a judgement, so it is discretionary.'
