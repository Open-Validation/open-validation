reference: landscaping-plan
local-authority: WNUA
required-if:
  any:
  - application-type:
      in:
      - full
      - reserved-matters
  - all:
    - application-type:
        in:
        - outline
    - discretionary
  - all:
    - application-type:
        in:
        - mineral-extraction
        - mineral-app
        - waste-dev
    - any:
      - condition:
          field: landscaping-works
          value: true
          description: Development includes landscaping, such as screening bunds or planting.
      - discretionary
source-url: https://cms.westnorthants.gov.uk/media/30003/download
policy: Local Plans Part 2 (Daventry Settlements and Countryside Local Plan, South Northamptonshire Local
  Plan, Northampton Local Plan) (Daventry ENV1; South Northamptonshire SS2; Northampton Q1, Q2)
source-text: 'Landscaping schemes should include: … To show the approach to hard surfacing, boundary treatments,
  above ground earthworks and planting proposals across the site … Where development includes landscaping
  or would benefit from landscaping including screening bunds and, tree, hedgerow and shrub planting.'
must-include:
- item: Planting plans, written specifications and a plant schedule (species, sizes, numbers/densities)
  level: must
  required-if:
    ref: major-development
- item: Existing vegetation retained (with protection) and removed
  level: must
  required-if:
    ref: major-development
- item: Means of enclosure, hard surfacing, structures and ancillary objects, public open space, and green
    and blue infrastructure
  level: must
  required-if:
    ref: major-development
- item: 'For minor development: hard surfacing, boundary treatments, above-ground earthworks and planting'
  level: must
- item: 'Minerals and waste: Ground contours, screening mounds, grass mixtures and the number, species,
    planting heights and positions of trees and shrubs, with long-term maintenance (5 years minimum)'
  level: must
  required-if:
    application-type:
      in:
      - mineral-extraction
      - mineral-app
      - waste-dev
confidence: medium
notes: 'From the council''s list (adopted 25 February 2026), sections 8-10, 12 and 18. Landscaping Scheme
  (major) and Landscaping Plan (minor). Outline is discretionary because landscaping may be reserved.
  Minerals and waste: from the county matter list (https://minerals-waste-planning.westnorthants.digital/councilservices/environment-and-planning/planning/planning-applications/making-a-planning-application/Documents/Local%20Validation%20List%20-%20Minerals%20and%20Waste%20Applications.pdf),
  page 16 and 36. ''Would benefit from landscaping'' is a judgement, so that part is discretionary.'
review-status: unverified
field-status: {}
