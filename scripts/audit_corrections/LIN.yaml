# Corrections for Lincolnshire County Council, from the council's audit.
# Grokbot recorded the council's page as unreadable and captured nothing. The audit read it: there
# is no formal local list. The 'Make a planning application - Validation requirements' page points
# to the national requirements and lists a few local 'if required' items, which apply to the
# county's minerals, waste and Regulation 3 applications. They are added below.
local-authority: LIN

validation-list:
  url: https://www.lincolnshire.gov.uk/planning/submit-application/2
  date: 2019-06
  date-basis: >-
    audit: the page shows no adoption date; its metadata says created/modified 2019-06-26. No
    separate local list document was found.

submission-standards:
  - item: Plans submitted as PDFs of 10 MB or less
    level: must
  - item: Plans state the print paper size and the scale, and show key dimensions
    level: must
  - item: Plans at A3 or A4 where appropriate, in the correct orientation
    level: should

requirements:
  - id: bng-metric
    action: add
    required-if:
      application-type:
        in: [mineral-app, waste-dev, reg-3]
    source-text: Provide details of how a minimum of 10% Biodiversity Net Gain will be delivered
    source-url: https://www.lincolnshire.gov.uk/planning/submit-application/2
    confidence: medium
    notes: >-
      Audit (missing_requirement): the page's local items were not captured. They apply to the
      county's minerals, waste and Regulation 3 applications.

  - id: land-contamination-assessment
    action: add
    required-if:
      all:
        - application-type:
            in: [mineral-app, waste-dev, reg-3]
        - discretionary
    source-text: Provide an up-to-date Contaminated Land Survey, if required
    source-url: https://www.lincolnshire.gov.uk/planning/submit-application/2
    confidence: medium
    notes: "Audit (missing_requirement): 'if required' gives no trigger, so it is shown as officer discretion."

  - id: flood-risk-assessment
    action: add
    required-if:
      all:
        - application-type:
            in: [mineral-app, waste-dev, reg-3]
        - discretionary
    source-url: https://www.lincolnshire.gov.uk/planning/submit-application/2
    confidence: medium
    notes: "From the audit (missing_requirement): an up-to-date Flood Risk Assessment, if required."

  - id: environmental-statement
    action: add
    required-if:
      all:
        - application-type:
            in: [mineral-app, waste-dev, reg-3]
        - condition:
            field: eia-development
            value: true
            description: The development needs an Environmental Impact Assessment.
    source-url: https://www.lincolnshire.gov.uk/planning/submit-application/2
    confidence: medium
    notes: "From the audit (missing_requirement): an EIA, if required."

  - id: arboriculturist-report
    action: add
    required-if:
      all:
        - application-type:
            in: [mineral-app, waste-dev, reg-3]
        - discretionary
    source-url: https://www.lincolnshire.gov.uk/planning/submit-application/2
    confidence: medium
    notes: "From the audit (missing_requirement): a tree survey, if required. No trigger is given."
