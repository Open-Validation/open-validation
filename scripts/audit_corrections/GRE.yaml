low-confidence:
  - id: construction-management-plan
    note: "Audit (wrong_trigger): the excerpt is the Daylight/Sunlight heading; the audit gives no trigger for the plan."
  - id: travel-plan
    note: "Audit (wrong_trigger): the excerpt is only a heading ('Travel Plan When Required'); no trigger captured."
  - id: viability-assessment
    note: "Audit (wrong_trigger): the excerpt is only a heading ('Viability Assessment When Required'); no trigger captured."

new-fields:
  - field: scheduled-monument
    kind: designation
    label: Scheduled monument
    description: Site is in, contains or is near a scheduled monument (dataset scheduled-monument).
  - field: park-and-garden
    kind: designation
    label: Registered park and garden
    description: Site is in or near a registered historic park and garden (dataset park-and-garden).
  - field: out-of-centre-town-centre-use
    kind: boolean
    label: Main town centre use outside a centre
    description: >-
      The proposal is for a main town centre use (retail, leisure, offices and similar) at an
      edge-of-centre or out-of-centre location, outside a defined town centre or primary shopping area.
  - field: telecommunications-development
    kind: boolean
    label: Telecommunications development
    description: The proposal is for telecommunications development, such as a mast or antennae.
