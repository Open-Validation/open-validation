    note: >-
      Audit (other): the list was agreed in June 2021 and is over 2 years old, so under DMPO 2015
      art. 11(3)(c) the council may not be able to rely on it (a December 2022 draft joint list
      with Eastbourne exists; adoption unconfirmed).
  - id: affordable-housing-statement
    note: "Audit (wrong_trigger): the excerpt is a run of policy references; the list's 'when required' column was not captured."
