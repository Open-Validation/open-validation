    source-url: https://www.cumberland.gov.uk/sites/default/files/2026-10/Local%20validation%20list.pdf
    suggested-id: public-rights-of-way-statement
  - local-name: Utilities Assessment
    source-text: "From the audit: major schemes (minerals, waste and Reg 3 list)"
