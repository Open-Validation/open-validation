    confidence: medium

  - id: section-existing
    action: replace
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: New or replacement buildings.
        - condition:
            field: site-level-change
            operator: ">="
            value: 1000
            description: Level changes of 1m or more.
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    source-text: level changes of 1m or more
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted drawing-standards text. From the audit: item 47 Section Drawings, for new or replacement buildings, or level changes of 1m or more."

  - id: section-proposed
    action: replace
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: New or replacement buildings.
        - condition:
            field: site-level-change
            operator: ">="
            value: 1000
            description: Level changes of 1m or more.
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    source-text: level changes of 1m or more
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted drawing-standards text. From the audit: item 47 Section Drawings, for new or replacement buildings, or level changes of 1m or more."

  - id: fire-statement
    action: replace
    required-if:
      all:
        - any:
            - condition:
                field: building-height
                operator: ">="
                value: 18
                description: A building is 18 metres or more tall.
            - condition:
