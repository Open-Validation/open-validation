    confidence: low
    notes: "Audit (wrong_trigger): content text, running into the item 56 Viability trigger; the travel plan trigger was not captured."

  - id: viability-assessment
    action: replace
    required-if: discretionary
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
