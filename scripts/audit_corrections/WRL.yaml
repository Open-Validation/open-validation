            - condition:
                field: new-build
                value: true
                description: The proposal includes new buildings.
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    source-text: Listed Building Consent applications … new buildings in conservation areas
    confidence: medium
    notes: >-
      Audit (not_a_requirement, wrong_app_type): the workbook's row was PEA screening text. From the
      audit: item 42 Photographic Survey for listed buildings, LBC, local-list assets and new
      buildings in conservation areas.

