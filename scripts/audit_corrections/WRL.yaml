        - application-type:
            in: [lbc]
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    source-text: >-
      Design and Access Statements accompanying applications for listed building consent must
      include an explanation of the design principles and concepts that have been applied to the
      proposed works, and how they have taken account of: (a) the special architectural or historic
      importance of the building; (b) the particular physical features of the building that justify
      its designation as a listed building; and (c) the building’s setting.
    confidence: medium
    notes: "Audit (missing_requirement): item 11 also covers all majors, and dwellings or 100 sqm+ in a conservation area or World Heritage Site; the workbook had it under Listed building consent only."

