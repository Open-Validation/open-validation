        field: eia-development
        value: true
        description: The project is listed in Schedule 1 of the EIA Regulations 2017.
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    source-text: >-
      Environmental Statement (EIA) … All applications for development where the proposed project
