                operator: ">="
                value: 2
                description: The building contains 2 or more dwellings.
            - condition:
                field: educational-accommodation
                value: true
                description: The building contains student accommodation.
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    confidence: medium
    notes: >-
      Audit (wrong_trigger, duplicate): the workbook quoted the EIA Schedule 1 trigger. From the
      audit: item 21, relevant buildings 18m+ or 7+ storeys with 2+ dwellings or student
      accommodation; outline and s73 applications are exempt (not expressible here).

  - id: floor-plan-existing
    action: replace
    required-if:
      always: true
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    confidence: medium
