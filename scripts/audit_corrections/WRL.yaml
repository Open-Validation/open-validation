# Corrections for Wirral Borough Council, from inputs/audit/wirral-borough-council.json.
# The workbook link is the current 'Development Management Validation Checklist', adopted May 2025
# (57 numbered items); the build reads 'May 2025' from the audit. Grokbot's tab items came from the
# forms-and-checklists web page, not the checklist; about 25 items were missed, many excerpts
# belong to the neighbouring item, and the three Householder rows explicitly exclude householder
# applications. "Except householder applications" is shown here as full, outline and reserved
# matters. Items marked "From the audit" use its paraphrase of the checklist.
local-authority: WRL

drop:
  - id: daylight-sunlight-assessment
    reason: "not_a_requirement: not a separate item; part of the item 37 Microclimate Assessment content for tall buildings"

drop-unmapped:
  - local-name: Agricultural / rural workers' dwelling appraisal
    reason: "duplicate: quotes the item 5 Agricultural Land Classification trigger; re-added below"
  - local-name: Crime prevention / Secured by Design statement
    reason: "wrong_trigger: content text; re-added below with the trigger"
  - local-name: Design Code / Masterplan / Parameter plans
    reason: "wrong_trigger: merges the item 13 heading and drops the thresholds; re-added below"
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: quotes the item 14 Digital Connectivity trigger; both re-added below"
  - local-name: Gypsy & Traveller information
    reason: "excerpt runs on into item 26; re-added below without it"
  - local-name: Health Impact Assessment
    reason: "wrong_trigger: web page text; re-added below"
  - local-name: Landscape and Visual Impact Assessment
    reason: "wrong_trigger: competence sentence; re-added below with the trigger"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: garbled mix of items 2 and 3; the checklist has no pre-application requirement"

requirements:
  - id: land-contamination-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline, reserved-matters]
        - any:
            - site:
                in: [contaminated-land]
                description: >-
                  The site is known to be, or suspected to be, affected by land contamination (such
                  as previously developed land).
            - condition:
                field: sensitive-end-use
                value: true
                description: >-
                  An end use vulnerable to land contamination, such as residential or nursery/school
                  development.
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    source-text: >-
      29 Land Contamination Assessment Any application (except householder applications) where the
      application site is known to be, or suspected to be, affected by land contamination (such as
      previously developed land), or where the application proposes an end use vulnerable to land
      contamination such as residential development or nursery/school development. … A preliminary
      risk assessment (PRA) must be undertaken and prepared by a suitably qualified and experienced
      person
    must-include:
      - item: A preliminary risk assessment (PRA), prepared by a suitably qualified and experienced
          person
        level: must
    confidence: medium
    notes: "Audit (wrong_app_type): item 29 excludes householder applications. The excerpt's two columns are separated above without changing the words."

  - id: waste-management-plan
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline, reserved-matters]
        - discretionary
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    source-text: >-
      45 Refuse and Recycling Management Strategy All applications (except householder
      applications) where refuse and recycling storage will be required on site and/or where refuse
      and recycling vehicle access will be required to the site.
    confidence: medium
    notes: >-
      Audit (wrong_app_type): item 45 excludes householder applications. 'Where refuse and recycling
      storage or vehicle access will be required' can't be expressed with existing fields, so it is
      shown as officer discretion. From the audit: item 57 Waste Management Assessment is also
      missing; its trigger is not given.

  - id: roof-plan-existing
    action: replace
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    confidence: low
    notes: >-
      Audit (wrong_app_type, duplicate): the workbook's excerpt ('...and proposed roof plans in
      accordance with the above requirements') ran on into the item 45 refuse text, which excludes
      householder applications. The roof plan trigger was not captured.

  - id: roof-plan-proposed
    action: replace
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    confidence: low
    notes: >-
      Audit (wrong_app_type, duplicate): the workbook's excerpt ran on into the item 45 refuse text.
      The roof plan trigger was not captured.

  - id: affordable-housing-statement
    action: update
    required-if: discretionary
    confidence: medium
    notes: "Needed where affordable housing is proposed or is otherwise required under national or local policy (council's wording); this can't be expressed with existing fields."

  - id: arboriculturist-report
    action: replace
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: The works could affect trees.
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt was the fragment 'requirement for Arboricultural
      1.' From the audit: needed for works where trees could be affected; the site plan is used to
      screen applications (householder included) for this.

  - id: archaeological-assessment
    action: replace
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    source-text: >-
      Archaeological desk-based assessments must be carried out by a suitably qualified historic
      environment consultant.
    must-include:
      - item: Carried out by a suitably qualified historic environment consultant
        level: must
    confidence: low
    notes: "Audit (wrong_trigger): the excerpt ran into the item 10 BNG trigger; the archaeology trigger was not captured."

  - id: bng-metric
    action: replace
    required-if:
      condition:
        field: biodiversity-gain-condition
        value: true
        description: The application is subject to the biodiversity gain condition.
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    source-text: 10 Biodiversity Net Gain (BNG) All applications subject to the biodiversity gain condition.
    confidence: medium

  - id: site-plan
    action: replace
    required-if:
      always: true
    source-url: https://www.wirral.gov.uk/files/adopted-local-validation-checklist.pdf/download?inline
    source-text: >-
      the site plan provided will be used to screen the application for a requirement for
      Arboricultural …
    confidence: medium
    notes: "Audit (wrong_trigger): from the audit, site plans are needed for all applications."

