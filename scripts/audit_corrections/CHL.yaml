  - local-name: Agricultural appraisal
    source-text: "From the audit: agricultural workers' dwellings or removal of an agricultural occupancy condition"
    source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
    suggested-id: agricultural-worker-dwelling-statement
  - local-name: Agricultural Land Classification survey
    source-text: "From the audit: major development on agricultural land"
    source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
    suggested-id: agricultural-land-classification
  - local-name: SuDS information
    source-text: "From the audit: 10+ dwellings / >0.5-1 ha"
    source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
    suggested-id: drainage-strategy
  - local-name: Parameter plans
    source-text: "From the audit: allocated Strategic Growth Sites"
