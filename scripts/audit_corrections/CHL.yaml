    source-text: "Biodiversity checklist and report"
    source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
    suggested-id: biodiversity-checklist
  - local-name: Accommodation Schedule
    source-text: "From the audit: Accommodation Schedule: 10 or more residential units"
    source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
    suggested-id: accommodation-schedule
  - local-name: Health Impact Assessment
    source-text: "From the audit: core for 50+ residential units. The level of detail required within the HIA will depend on the scale and nature of the development."
    source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
