    suggested-id: parameter-plans
  - local-name: Amendment statement
    source-text: "From the audit: S73 and s96A (non-material amendment) applications need an amendment statement"
    source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
    suggested-id: amendment-statement
  - local-name: Statement of existing agricultural activity
    source-text: "Proposed agricultural buildings/hard surfaces/access tracks … Statement of existing agricultural activity/uses at the site"
    source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
    suggested-id: ""
  - local-name: Manufacturer's specification (plant/machinery)
    source-text: "From the audit: Manufacturer's specification for plant/machinery"
    source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
    suggested-id: plant-specification
  - local-name: Indicative access details (outline)
    source-text: "From the audit: outline applications need indicative access details"
    source-url: https://www.chelmsford.gov.uk/media/gdyak1jg/local-validation-list-february-2024.pdf
    suggested-id: ""

low-confidence:
  - id: bng-metric
    note: >-
      Audit (wrong_app_type): the workbook's excerpt is a run of table headings; the list sets
      documents by kind of project (Section 2), so check which tables list the BNG statement and
      metric.
  - id: roof-plan-existing
    note: "Audit (wrong_app_type): the excerpt is a run of table headings. From the audit: householder roof plans are needed for more than single storey works; other project tables also list roof plans."
  - id: roof-plan-proposed
    note: "Audit (wrong_app_type): the excerpt is a run of table headings. From the audit: householder roof plans are needed for more than single storey works; other project tables also list roof plans."
