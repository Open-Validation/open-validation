# Corrections for Calderdale Metropolitan Borough Council, from inputs/audit/calderdale-metropolitan-borough-council.json.
# The workbook captured nothing for Calderdale (every sheet 'Not covered'). Grokbot's link is the
# 'Validation Requirements for Planning Applications' landing page ('Updated: 25th June 2026'),
# which says the National and Local Validation Requirements list is adopted and links to it on
# the Objective consultation portal (event 38284). The audit could not open that portal page, so
# the list's contents and date were not checked (contents_checked: false). The build already uses
# the portal url. No list date is set: the landing page's update date is not the list's date, and
# planning.data.gov.uk's period start (2023-12-14) is register data, not document text.
# The landing page also says a Construction Management Plan and a Utilities Statement are no longer
# needed at validation stage; the workbook has no rows for them, so there is nothing to drop.
local-authority: CLD

requirements:
  - id: sustainability-statement
    action: add
    source-text: A Climate Change Statement Proforma has been created
    source-url: https://new.calderdale.gov.uk/planning-and-building-control/apply-planning-permission/local-list
    confidence: low
    notes: >-
      From the audit (missing_requirement): the landing page names a Climate Change Statement
      Proforma as new to the list. The audit could not read the list itself, so no trigger is
      known; mapped to sustainability-statement as the nearest MHCLG id.

unmapped:
  - local-name: Supporting statement for residential annexe proposals
    source-text: >-
      From the audit: a supporting statement is strongly advised for residential annexe proposals,
      explaining the occupancy, the relationship to the host dwelling and which rooms are shared.
    source-url: https://new.calderdale.gov.uk/planning-and-building-control/apply-planning-permission/local-list
    suggested-id: planning-statement

low-confidence:
  - id: "*"
    note: >-
      Audit (other/missing_requirement): the adopted list on the Objective portal (event 38284)
      could not be read, so Calderdale's local requirements are largely missing.
