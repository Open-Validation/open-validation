  - id: land-contamination-assessment
    action: add
    required-if:
      all:
        - application-type:
            in: [full, hh]
        - discretionary
    source-url: https://www.tameside.gov.uk/planning/local-list-full-applications
    confidence: low
    notes: >-
      From the audit (missing_requirement): a Land Contamination assessment may be required on the
      Full-applications list. The Householder list's mandatory items include land contamination
      measures such as gas protection membranes or garden cover systems; the audit does not say
      when they apply.

  - id: landscaping-plan
    action: add
    required-if:
      all:
