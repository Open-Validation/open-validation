            in: [hh]
        - discretionary
    source-url: https://tameside.gov.uk/planning/consultation/householderapplication
    confidence: medium
    notes: "From the audit (wrong_app_type): hard and soft landscaping details may be required on the Householder list."

  - id: lighting-assessment
