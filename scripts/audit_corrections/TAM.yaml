    source-url: https://www.tameside.gov.uk/planning/local-list-full-applications
    confidence: medium
    notes: "From the audit (missing_requirement): 'may be required depending on the proposal' on the Full-applications list; the audit gives no trigger."

  - id: heritage-statement
    action: add
    required-if:
