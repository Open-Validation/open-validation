# Corrections for Central Bedfordshire Council, from inputs/audit/central-bedfordshire-council.json.
# Grokbot captured no requirements. The audit found the council's revised Validation Guide and
# per-type checklists on its consultation portal (all titled 'Draft'), consulted on from 29 July to
# 13 September 2024, but could not confirm an adopted version or read the triggers. It confirmed
# that Section 8.0 ('Supporting documents - Local list requirements') names nine local items; they
# are added below without triggers (confidence low), so the explorer shows them as "Check".
