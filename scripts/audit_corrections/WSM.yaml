    suggested-id: whole-life-carbon-assessment
  - local-name: Electromagnetic Field survey
    source-text: "From the audit: L20 - EMF sources near sensitive occupiers"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    suggested-id: emf-survey
  - local-name: Marketing and Viability Assessment
    source-text: "From the audit: L28 - loss of protected uses"
