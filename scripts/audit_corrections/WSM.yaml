# Corrections for City of Westminster, from the Westminster audit.
# The audit compared the workbook with the "Local List of Planning Application Validation
# Requirements - July 2026" (one list for all application types). Some workbook rows came from
# the superseded October 2021 list; where the 2026 trigger differs, the 2026 one is used.
# Items marked "From the audit" use the audit's summary of the 2026 list, not its exact words.
local-authority: WSM

submission-standards:
  - item: Drawings labelled appropriately, with a linear scale bar on each drawing
    level: should

drop:
  - id: noise-assessment
    sheets: [Advertisement consent]
    reason: "wrong_app_type: the excerpt is the L27 Lighting Assessment wording; the list doesn't ask for a noise assessment for adverts"

drop-unmapped:
  - local-name: Health Impact Assessment
    reason: "wrong_trigger: these rows are the Heritage Impact Assessment for the Westminster World Heritage Site (now in heritage-statement)"
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: an unrelated ecology sentence was appended; re-added below"
  - local-name: Advertisement drawings / illumination details
    reason: "wrong_app_type: L4 applies to advertisement consent (now an elevation-proposed must-include item)"
  - local-name: Highways / access details (visibility splays)
    reason: "wrong_app_type / wrong_trigger: garbled fragment about demolition in a conservation area"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: this is Delivery and Servicing Plan text (re-added below)"
  - local-name: Sequential / Exception Test (flood)
    reason: "not_a_requirement: fragment ('proposed following sequential tests set out in Part D of policy 43')"

requirements:
  - id: affordable-housing-statement
    action: replace
    required-if:
      condition:
        field: dwelling-count
        operator: ">="
        value: 1
        description: The proposal creates a new home.
    source-text: Required if proposal creates a new home
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "Audit (wrong_document, wrong_trigger): the workbook used the 2021 trigger; this is the 2026 L8 trigger (which the workbook had put under Viability Assessment)."

  - id: viability-assessment
    action: replace
    required-if: discretionary
    source-text: >-
      Required for all residential development where this generates a requirement to provide
      affordable housing, does not include the necessary policy compliant provision ... and this is
      being justified on viability grounds.
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): L9. The workbook's excerpt was the L8 Affordable Housing Statement trigger."

  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - application-type:
            in: [lbc]
        - all:
            - site:
                in: [conservation-area, world-heritage-site]
                description: Development in a designated area.
            - any:
                - condition:
                    field: dwelling-count
                    operator: ">="
                    value: 1
                    description: One or more dwellings.
                - condition:
                    field: floorspace
                    operator: ">="
                    value: 100
                    description: 100 square metres or more of new floorspace.
        - all:
            - application-type:
                in: [hh]
            - site:
                in: [listed-building, conservation-area]
                description: The house is a listed building or in a conservation area.
    source-text: >-
      major development; development in a designated area ... 100m2 or more of new floorspace; all
      applications for listed building consent … Design and Access Statement and/or Heritage
      Statement Required where you live in a listed building or if your property is located within
      a conservation area .
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the Full planning row carried the Foul Sewage and Utilities trigger. The householder wording (Design and Access Statement and/or Heritage Statement) is from the council's householder page."

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building, listed-building-setting, conservation-area, locally-listed-building, world-heritage-site]
            description: The proposal affects heritage assets or their settings.
    source-text: >-
      Required if proposal affects heritage assets … Design and Access Statement and/or Heritage
      Statement Required where you live in a listed building or if your property is located within
      a conservation area .
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    must-include:
      - item: A Heritage Impact Assessment where the proposal may affect the Westminster World Heritage Site
        level: must
        required-if:
          site:
            in: [world-heritage-site]
            description: The proposal may affect the Westminster World Heritage Site.
        source-text: HIA required where proposals may affect the Westminster World Heritage Site.
    confidence: medium
    notes: "Audit (wrong_trigger): the Full planning row carried the Foul Sewage and Utilities trigger; the rows labelled 'Health Impact Assessment' were the World Heritage Site HIA (L25). It may be combined with the Design and Access Statement."

  - id: land-contamination-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: basement
            value: true
            description: Basement development.
        - site:
            in: [contaminated-land]
            description: The site is known to be or is suspected of being contaminated.
    source-text: >-
      Required for all applications for basement development ... if application site is known to
      be or is suspected of being contaminated
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt ended 'Required for'."

  - id: planning-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-text: Recommended for minor development including changes of use, certificates of lawfulness.
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger, missing_requirement): L32 - required for all majors and where planning obligations are required (shown as officer discretion); recommended for minor development and certificates of lawfulness."

  - id: fire-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - all:
            - any:
                - condition:
                    field: building-height
                    operator: ">="
                    value: 18
                    description: A building is 18 metres or more tall.
                - condition:
                    field: storey-count
                    operator: ">="
                    value: 7
                    description: A building has 7 or more storeys.
            - any:
                - condition:
                    field: dwelling-count
                    operator: ">="
                    value: 2
                    description: The building contains 2 or more dwellings.
                - condition:
                    field: educational-accommodation
                    value: true
                    description: The building contains educational accommodation.
    source-text: "Fire Statement Gateway One Required for all applications which involve: provision of one or more relevant buildings5, or"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger, missing_requirement): the Gateway One trigger was cut off ('relevant
      buildings' as defined nationally); from the audit, a London Plan Fire Statement (L22) is also
      required for all major development.

  - id: lighting-assessment
    action: replace
    required-if:
      all:
        - any:
            - condition:
                field: external-lighting
                value: true
                description: The proposal includes the installation of external lighting.
            - application-type:
                in: [advertising]
        - discretionary
    source-text: May be required if proposal includes the installation of external lighting or for large-scale advertisements/digital screens
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): L27. The Full planning row merged it with the landscaping trigger (now landscaping-plan). Large-scale advertisements/digital screens are shown as advert applications at officer discretion."

  - id: landscaping-plan
    action: replace
    required-if:
      any:
        - ref: major-development
        - condition:
            field: basement
            value: true
            description: Basement development extending below garden land.
    source-text: Landscaping Strategy and details required for major development and basement development extending below garden land.
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "This trigger was in the workbook's Lighting Assessment row; the landscaping row was a fragment."

  - id: noise-assessment
    action: update
    required-if:
      any:
        - condition:
            field: plant-equipment
            value: true
            description: The proposal installs external air conditioning or plant.
        - condition:
            field: noise-generating-use
            value: true
            description: Development that could affect noise sensitive receptors or cause nearby uses to curtail their activities (agent of change).
        - condition:
            field: noise-sensitive-use
            value: true
            description: New noise sensitive development (e.g. residential) in areas with high noise levels.
    confidence: low
    notes: "Audit (wrong_document): the Full planning trigger is from the superseded 2021 list; the householder trigger (external air conditioning or plant) is from the council's current householder page."

  - id: flood-risk-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: site-area-residential
            operator: ">="
            value: 1
            description: Development of 1 hectare or greater.
        - condition:
            field: site-area-non-residential
            operator: ">="
            value: 1
            description: Development of 1 hectare or greater.
        - condition:
            field: basement
            value: true
            description: Basement development.
        - site:
            in: [flood-risk-zone]
            description: Development in Flood Zones 2 and 3.
        - site:
            in: [critical-drainage-area]
            description: Development within a Surface Water Flood Risk Management Zone.
    source-text: >-
      Flood Risk Assessment (FRA) 20 (Including Sustainable Drainage where not covered by separate
      Sustainable Drainage Strategy) Required for: 1. all development of 1 hectare or greater; 2.
      all basement development; 3. all development in Flood Zones 2 and 3 as defined by the
      Environment Agency; and 4. all development within a Surface Water Flood Risk Management Zone
      where there may be…
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "Applies to householder applications too (the householder page: basement excavation, Flood Zones 2 and 3, or a Surface Water Flood Risk Management Zone)."

  - id: arboriculturist-report
    action: update
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: The proposal is likely to affect trees within or next to the site (including street trees).
    must-include:
      - item: Prepared by a qualified arboriculturist following BS5837:2012 (or any subsequent version)
        level: must
    confidence: medium

  - id: archaeological-assessment
    action: update
    required-if:
      all:
        - site:
            in: [archaeological-priority-area]
            description: The site is in an Archaeological Priority Area (Tiers 1-2).
        - condition:
            field: ground-disturbance
            value: true
            description: The application involves excavation.
    notes: "The council's text: may be required for applications involving excavation within an Archaeological Priority Area (APA) Tiers 1-2."

  - id: biodiversity-survey-report
    action: update
    required-if:
      any:
        - site:
            in: [local-wildlife-site]
            description: The development is on or close to a Site of Importance for Nature Conservation (SINC).
        - discretionary
    notes: "Other development that may impact on biodiversity (protected or priority species or habitats, local green space, waterbodies) is shown as officer discretion."

  - id: daylight-sunlight-assessment
    action: update
    required-if: discretionary
    notes: "The council's text: required if the proposal is likely to have an adverse effect on light to adjoining sensitive land uses, and may be required where it creates a new home."

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.

  - id: roof-plan-proposed
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: Works to the roof.
    notes: "The council's text: you will need to provide roof plans if you are doing works to the roof."

  - id: roof-plan-existing
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: Works to the roof.
    notes: "The council's text: you will need to provide roof plans if you are doing works to the roof."

  - id: sci
    action: update
    required-if: discretionary
    notes: "The council's text: required where community involvement has been undertaken prior to making an application."

  - id: telecommunications-report
    action: update
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: Mast and antenna development by mobile phone network operators.

  - id: town-centre-impact-assessment
    action: update
    required-if:
      condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Main town centre uses proposed outside of the CAZ and the town centre hierarchy.

  - id: travel-plan
    action: update
    required-if: discretionary
    notes: "The council's text: required for applications referrable to the Mayor and in other limited circumstances (e.g. new and expanded education facilities)."

  - id: sustainability-statement
    action: replace
    required-if:
      condition:
        field: floorspace
        operator: ">"
        value: 0
        description: The proposal creates any new floorspace.
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): L40 Sustainable Design Statement and Sustainability & Retrofit First Checklist for any new floorspace. The workbook's excerpt was energy statement text (now energy-statement)."

  - id: energy-statement
    action: add
    source-text: >-
      Required to demonstrate how development will be net zero carbon, following the principles of
      the Mayor of London’s energy hierarchy, and set out how any residual emissions are to be
      offset.
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: low
    notes: "The workbook filed this under the Sustainability Statement; the trigger wasn't captured."

  - id: air-quality-assessment
    action: add
    required-if:
      any:
        - ref: major-development
        - condition:
            field: biomass-or-chp
            value: true
            description: The proposal includes combustion plant.
        - discretionary
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): L10 Air Quality Assessment and Air Quality Positive/Neutral statements - all majors, polluting uses or combustion plant, sensitive uses, new homes in Air Quality Focus Areas (the last three partly shown as officer discretion)."

  - id: construction-management-plan
    action: add
    required-if:
      any:
        - condition:
            field: basement
            value: true
            description: The proposal involves basement excavation (Checklist B).
        - discretionary
    source-text: Code of Construction Practice Signed DRAFT Appendix A checklist form ( Checklist B ) Only provide where your proposals involve basement excavation.
    source-url: https://www.westminster.gov.uk/planning-building-control-and-environmental-regulations/planning-applications/make-application/application-types-and-checklists/householder-application
    confidence: medium
    notes: "Audit (missing_requirement): L15 Code of Construction Practice Appendix A checklist - Checklist B for basements, Checklist A for other Level 1/2 development (shown as officer discretion)."

  - id: photos
    action: replace
    required-if:
      application-type:
        in: [lbc, ldc-existing-use, consent-under-tpo, notice-trees-in-con-area]
    source-text: Photographs/ AVR Required
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    confidence: medium
    notes: "Audit (missing_requirement): L2 also asks for photographs for LDCs for existing use, works to TPO trees and tree notifications in conservation areas."

  - id: elevation-proposed
    action: update
    must-include:
      - item: Size, siting, illumination, materials and fixings of the advertisements, with a cross-section through all signs
        level: must
        required-if:
          application-type:
            in: [advertising]
        source-text: size, siting, illumination, materials and fixings and provide a crosssection through all signs.
    notes: "Audit (wrong_app_type): L4 Advertisements additional drawings apply to advertisement consent applications; the workbook filed them under Full planning."

unmapped:
  - local-name: Sustainable Drainage (SuDS) Design Strategy
    source-text: "Sustainable Drainage (SuDs) Design Strategy Required for major development"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    suggested-id: drainage-strategy
  - local-name: Delivery and Servicing Plan
    source-text: "From the audit: L19 'Required for development referrable' to the Mayor and may be required for 'nonresidential development' that 'generates new or additional servicing, collections and/or deliveries'"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    suggested-id: delivery-servicing-plan
  - local-name: BREEAM pre-assessment
    source-text: "From the audit: L13 - non-domestic 500m2 GIA or more, or conversions creating 500m2+ or 5+ homes"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    suggested-id: breeam-assessment
  - local-name: Circular Economy Statement
    source-text: "From the audit: L14 - referrable schemes, over 50% demolition of a multi-storey building, deep retrofit with 10-50% demolition"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
