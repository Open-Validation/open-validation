    suggested-id: marketing-evidence
  - local-name: Parking Design and Management Plan
    source-text: "From the audit: L31 - any on-site car parking"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    suggested-id: parking-management-plan
  - local-name: Purpose-built Shared Living Management Plan
    source-text: "From the audit: L34 - all purpose-built shared living proposals"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    suggested-id: shared-living-management-plan
  - local-name: Shisha Smoking Management Plan
    source-text: "From the audit: L37 - all shisha premises"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    suggested-id: shisha-management-plan
  - local-name: Tables and chairs drawings
    source-text: "Where planning permission is required, you should provide existing and proposed plans with footway dimensions clearly annotated and showing all street furniture, streetlights, street trees, service hatches, loading pads etc. indicated on plans; and drawings or example images demonstrating the design and appearance of all furniture and associated equipment to be placed on the public highway"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    suggested-id: tables-and-chairs-plan
  - local-name: Listed buildings additional drawings
    source-text: "From the audit: L3 - listed in the 2026 list without a captured trigger"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    suggested-id: ""
  - local-name: Information to support lawful development certificate applications
    source-text: "Information to be provided where possible to support the application"
    source-url: https://www.westminster.gov.uk/sites/default/files/media/documents/wcc-local-list-of-validation-requirements-2026.pdf
    suggested-id: lawful-development-evidence

low-confidence:
  - id: cil-form
    note: "Audit (wrong_trigger): the excerpt is a fragment ('GIA), and a CIL Statement as set out in our website guidance.') and the audit gives no trigger."
  - id: transport-assessment
    note: "Audit (not_a_requirement): the excerpt is generic NPPG guidance with no trigger; the 2026 list's trigger wasn't captured."
  - id: waste-management-plan
    note: "Audit (not_a_requirement): the excerpt is only a list of policies; the 2026 list's trigger wasn't captured."

new-fields:
  - field: telecommunications-development
    kind: boolean
    label: Telecommunications equipment
    description: The proposal is for telecommunications equipment such as masts or base stations.
  - field: out-of-centre-town-centre-use
    kind: boolean
    label: Main town centre use outside a centre
    description: A main town centre use proposed in an edge-of-centre or out-of-centre location.
  - field: roof-alteration
    kind: boolean
    label: New or altered roof
    description: The proposal creates a new roof or alters an existing one.
