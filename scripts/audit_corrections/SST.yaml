low-confidence:
  - id: bng-metric
    note: "Audit (wrong_trigger): the excerpt is only '(see 24b Biodiversity Net Gain)'; the item is 25b and
      applies to any net loss of habitat."
  - id: archaeological-assessment
    note: "The excerpt describes the assessment but gives no trigger."
