# Corrections for South Staffordshire Council, from inputs/audit/south-staffordshire-council.json.
# Grokbot's link is the FULL validation guidance the council still links ('Guidance Notes for
# Validation of Planning Applications March 2022'; the build takes March 2022 from the audit). The
# householder rows come from a separate 'Validation Guidance (Householder) 2026 Update', which
# Grokbot also copied, wrongly, under Change of use - prior approval; those copies are dropped. The
# FULL guidance's items say which applications they apply to, so the INFERRED 'Full planning' type
# is replaced where the trigger is structured. Items marked "From the audit" use its paraphrase.
local-authority: SST

submission-standards:
  - item: All elevations and plans clearly and logically labelled (for example 'front' or 'rear
      elevation') and given titles which refer to their content
    level: must
  - item: Drawings include a linear scale bar to assist with electronic scaling / measuring, with written
      dimensions of the proposed works
    level: should

