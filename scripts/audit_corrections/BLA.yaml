# Corrections for Blaby District Council, from inputs/audit/blaby-district-council.json.
# Grokbot captured no rows: it wrongly marked the council's validation page as unreadable. The page
# (last updated 12 February 2026, which the build already takes) sets one local item. It refers to
# 'our checklist' but links no separate local list.
local-authority: BLA

requirements:
  - id: heritage-statement
    action: add
    required-if:
      site:
        in: [conservation-area, listed-building]
        description: The site is in a conservation area or involves a listed building.
    source-text: Heritage Impact Assessment (if in a Conservation Area or Listed Building)
    source-url: https://www.blaby.gov.uk/planning-and-building/planning-applications/validation/
    confidence: medium
    notes: >-
      Audit (missing_requirement): the validation page's one local item. The audit says it applies
      to householder, full, listed building consent and demolition in a conservation area
      applications as applicable, so no application type is set. The page mentions 'our checklist',
      which is not published, so other local items may exist.
