- id: noise-assessment
  action: add
  required-if: *id001
  source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
  confidence: low
  notes: 'From the audit (missing_requirement): Noise Assessment is listed; the audit gives no trigger.'
- id: planning-statement
  action: replace
  required-if:
    application-type:
      in:
      - mineral-app
      - waste-dev
      - reg-3
      - s73
      - lbc
      - non-material-amendment
  source-text: Full Planning Applications, Variation of Conditions, Listed Building Consent and Non-Material
    Amendments.
  source-url: https://www.suffolk.gov.uk/asset-library/suffolk-county-council-local-validation-list-2025.pdf
  confidence: medium
  notes: 'Audit (wrong_trigger, wrong_app_type): Planning Statement (all developments) is mandatory for
    full applications, variations of condition, listed building consent and non-material amendments within
    the county''s remit. From the audit: separate minerals and waste planning statements add further content
    for full, variation of condition and NMA applications.'
