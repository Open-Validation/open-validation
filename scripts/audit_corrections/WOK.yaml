    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): known or suspected contamination; for full applications
      this includes greenfield sites."

  - id: photos
    action: add
    required-if:
      any:
        - condition:
            field: demolition
            value: true
            description: The proposal involves demolition.
        - site:
            in: [conservation-area, listed-building, listed-building-setting]
            description: The proposal impacts on a conservation area or listed building.
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): demolition, or impact on a conservation area or listed
      building."

  - id: sci
    action: add
    required-if:
      ref: major-development
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): major development."

  - id: transport-assessment
    action: add
    required-if: discretionary
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): impact on the strategic network."

  - id: travel-plan
    action: add
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): major development, or impact on the strategic network."

  - id: noise-assessment
    action: add
    required-if: discretionary
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: low
    notes: "From the audit (missing_requirement): a Noise Impact Assessment is listed for full applications;
