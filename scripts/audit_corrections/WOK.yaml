# Corrections for Wokingham Borough Council, from the Wokingham audit.
# The audit compared the workbook with Wokingham's Local List of Requirements for Planning
# Applications (re-adopted 5 September 2025, amended April 2026 to add Technical Details
# Consent). The list has a local requirements table for each application type; the workbook
# captured only a few Full planning rows, several with change-log text. Items marked "From the
# audit" use the audit's summary of those tables, not the council's exact words.
local-authority: WOK

submission-standards:
  - item: Plans drawn to a metric scale, indicated in writing or by a scale bar (a scale bar is 
      preferable)
    level: must
  - item: Plans should not include "Do Not Scale" or any signatures
    level: should
  - item: Electronic plans in PDF format, each with a plan description title
    level: should
  - item: Each plan individually numbered, with a revision number if altered
    level: should
  - item: All documents in single layer PDF format with the correct orientation
    level: should
  - item: Individual file size not greater than 10 Mb
    level: should

drop-unmapped:
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: only a policy reference; re-added below with the trigger"
  - local-name: Parking provision / Parking plan
    reason: "wrong_trigger: run-on cell mixing parking, site plan and FRA text; re-added below"
  - local-name: Structural Survey
    reason: "wrong_trigger: works-to-trees subsidence note running into the affordable housing text; re-added
      below"
  - local-name: Highways / access details (visibility splays)
    reason: "wrong_app_type: the Outline/Reserved matters intro text, not a highways requirement"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: promotional sentence"

requirements:
  - id: affordable-housing-statement
    action: replace
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 5
            description: A net increase of 5 or more dwellings.
        - condition:
            field: site-area-residential
            operator: ">"
            value: 0.16
            description: A site over 0.16 hectares with residential development proposed.
    source-text: "Net increase of 5+ dwellings, or site over 0.16 ha"
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook gave no threshold."

  - id: cil-form
    action: replace
    required-if:
      any:
        - application-type:
            in: [hh, full, outline]
        - all:
            - application-type:
                in: [s73]
            - condition:
                field: floorspace
                operator: ">"
                value: 0
                description: The variation creates new floorspace.
        - all:
            - application-type:
                in: [ldc-prospective-use]
            - condition:
                field: floorspace
                operator: ">"
                value: 100
                description: Over 100 square metres.
        - application-type:
            in: [pa-extension, pa-storey, cho-commercial-to-dwh, pa-flats-de-blocks, 
                  pa-flats-de-comm, pa-flats-terr-comm, pa-flats-de-dwh, pa-flats-terr-dwh]
    source-text: All applications
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger, wrong_app_type, missing_requirement): the workbook quoted the change log.
      Required for all householder and full applications (outline as per full); for s73 if new
      floorspace; for proposed LDCs over 100 m2; and for prior approvals under Class A, MA, AA and
      the new-storey classes. The prior approval types are mapped from those class names.

  - id: flood-risk-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: site-area-residential
            operator: ">="
            value: 1
            description: A site of 1 hectare or greater in Flood Zone 1.
        - condition:
            field: site-area-non-residential
            operator: ">="
            value: 1
            description: A site of 1 hectare or greater in Flood Zone 1.
        - site:
            in: [flood-risk-zone]
            description: New development, including household or small commercial extensions, in 
              Flood Zones 2, 3a or 3b.
        - site:
            in: [critical-drainage-area]
            description: Land in a designated critical drainage area.
    source-text: >-
      Site Specific Flood Risk Assessment Required for development proposals of 1 hectare or
      greater area in Flood Zone 1 and for all proposals for new development, including household or
      small commercial extensions (under 250 sq.m), in Flood Zones 2, 3a and 3b as designated by the
      Environment Agency; land in a desi…
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's FRA row quoted the change log; the trigger was in its
      site plan row. Applies to householder applications too."

  - id: site-plan
    action: replace
    required-if:
      application-type:
        in: [hh, full, outline, lbc, advertising, ldc, s73, non-material-amendment]
    source-text: "Plan – Site All applications"
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    must-include:
      - item: Drawn at 1:500 (or 1:200 if necessary), with the scale indicated in writing or by a 
          scale bar
        level: must
        source-text: A site plan should be drawn at a scale of 1:500 (or 1:200 if necessary) and 
          this scale must be indicated in writing or through the use of a scale bar.
    confidence: medium
    notes: "Audit (wrong_trigger, wrong_app_type): the workbook row was a run-on cell. The list asks for
      a site plan for householder, full, LBC, advert, LDC and NMA applications, and for s73 where altered."

  - id: planning-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [full, outline, s73]
        - all:
            - application-type:
                in: [advertising]
            - site:
                in: [listed-building, conservation-area]
                description: The advert affects a listed building or is in a Conservation Area.
    source-text: "Planning Statement All applications – to explain the reasoning for removing or varying
      condition"
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the s73 wording; the Full trigger is simply 'All
      applications'. Also for adverts affecting a listed building or in a Conservation Area."

  - id: town-centre-impact-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Retail use outside town or village centres.
        - condition:
            field: involves-change-of-use
            value: true
            description: A change of use within a town or village centre.
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the loss-of-town-centre-use test. From the audit:
      retail use outside town/village centres, or change of use within centres."

  - id: section-existing
    action: update
    required-if:
      ref: major-development
    confidence: medium
    notes: "Audit (wrong_trigger): the table says major development (the description text says major residential
      schemes)."

  - id: section-proposed
    action: update
    required-if:
      ref: major-development
    confidence: medium
    notes: "Audit (wrong_trigger): the table says major development (the description text says major residential
      schemes)."

  - id: design-and-access-statement
    action: replace
    required-if:
      all:
        - application-type:
            in: [outline]
        - any:
            - condition:
                field: dwelling-count
                operator: ">"
                value: 10
                description: Residential development of over 10 dwellings (including conversions).
            - condition:
                field: floorspace-non-residential
                operator: ">"
                value: 100
                description: Non-residential development over 100 square metres.
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: >-
      Audit (wrong_app_type): for Full applications the Design and Access Statement appears only
      among the national requirements. Outline applications need a Design and Access Statement or
      Sustainability Statement for residential over 10 dwellings (incl. conversions) or
      non-residential over 100 m2.

  - id: sustainability-statement
    action: replace
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: New dwellings, including replacements.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 100
            description: Non-residential development over 100 square metres.
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): Sustainability Statement for new dwellings (incl. replacements)
      and non-residential over 100 m2. The workbook's excerpt was the Energy Statement (now energy-statement)."

  - id: energy-statement
    action: add
    required-if:
      all:
        - application-type:
            in: [full]
        - ref: major-development
    source-text: Energy Statement required for Full applications that are designated "Major 
      Developments".
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "The workbook filed this under the Sustainability Statement."

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.
    confidence: medium

  - id: biodiversity-survey-report
    action: replace
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the change log. From the audit: Biodiversity Report
      for major development, or minor development affecting protected species (shown as officer discretion).
      Bat, badger and great crested newt surveys are listed separately (unmapped)."

  - id: bng-metric
    action: replace
    required-if:
      any:
        - application-type:
            in: [full, outline]
        - all:
            - application-type:
                in: [s73]
            - discretionary
    source-text: >-
      If your original application was not exempt from Biodiversity Net Gain (BNG) any variation
      may affect this and updated BNG details may be required as a result.
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): the workbook's LBC row is from the s73 section. From the audit: BNG
      information for major or minor full applications and all outline applications."

  - id: roof-plan-proposed
    action: update
    required-if:
      any:
        - condition:
            field: roof-alteration
            value: true
            description: Complex roof forms would be created, or roof works are proposed.
        - condition:
            field: new-build
            value: true
            description: New buildings.
    must-include:
      - item: Scale of 1:50 or 1:100 (or 1:200 if necessary)
        level: must
    confidence: medium
    notes: "The council's text: roof plans for any complex roof forms that would be created or new buildings;
      the audit adds roof works for listed building consent."

  - id: roof-plan-existing
    action: update
    required-if:
      any:
        - condition:
            field: roof-alteration
            value: true
            description: Complex roof forms would be created, or roof works are proposed.
        - condition:
            field: new-build
            value: true
            description: New buildings.
    confidence: medium
    notes: "The council's text: roof plans for any complex roof forms that would be created or new buildings."

  - id: floor-plan-proposed
    action: update
    must-include:
      - item: Show the whole building (e.g. the full length of a terrace, the full pair of 
          semi-detached dwellings or the full block of flats or commercial floorspace)
        level: must
      - item: Not 'handed' plans
        level: must
        source-text: '"Handed" plans are not acceptable'
    confidence: medium
    notes: "From the audit: floor plans are required for all householder, full and LBC applications, and
      for proposed LDCs, NMAs and altered s73 schemes."

  - id: floor-plan-existing
    action: update
    must-include:
      - item: Show the whole building (e.g. the full length of a terrace, the full pair of 
          semi-detached dwellings or the full block of flats or commercial floorspace)
        level: must
    confidence: medium

  - id: elevation-proposed
    action: update
    must-include:
      - item: Each advert shown, with its luminance and wattage
        level: must
        required-if:
          application-type:
            in: [advertising]
    confidence: medium
    notes: "From the audit: elevations are required for all householder, full, LBC and advert applications,
      and for proposed LDCs, NMAs and altered s73 schemes."

  - id: location-plan
    action: add
    required-if:
      application-type:
        in: [s73]
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    must-include:
