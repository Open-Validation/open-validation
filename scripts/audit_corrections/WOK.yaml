    confidence: medium
    notes: "From the audit (wrong_app_type, missing_requirement): householder and full applications within
      or including a designated heritage asset; all LBC applications."

  - id: air-quality-assessment
    action: add
    required-if:
      site:
        in: [air-quality-management-area]
        description: The site is in or adjacent to an Air Quality Management Area.
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): in or adjacent to an AQMA."

  - id: arboriculturist-report
    action: add
    required-if:
      any:
        - all:
            - application-type:
                in: [hh]
            - site:
                in: [tree-preservation-zone]
                description: Trees protected by a TPO in or adjacent to the site.
        - all:
            - application-type:
                in: [full, outline]
            - condition:
                field: trees-on-or-near-site
                value: true
                description: The development would impact on trees.
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): householder - trees protected by TPO in or adjacent
      to the site; full - impact on trees."

  - id: daylight-sunlight-assessment
    action: add
    required-if: discretionary
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): where the proposal affects adjoining properties (householder
      and full)."

  - id: land-contamination-assessment
    action: add
    required-if:
      site:
        in: [contaminated-land]
        description: Known or suspected contamination (including greenfield sites for full 
