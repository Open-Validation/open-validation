  - id: viability-assessment
    action: add
    required-if: discretionary
    source-url: 
      https://www.wokingham.gov.uk/sites/wokingham/files/2026-05/Local%20Validation%20List%20-%2005.09.2025%20%281%29.pdf
    confidence: low
    notes: "From the audit (missing_requirement): an Economic Viability Appraisal is listed for full applications;
      the audit gives no trigger."

