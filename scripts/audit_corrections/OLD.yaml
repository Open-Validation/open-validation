    source-url: https://www.oldham.gov.uk/download/downloads/id/8273/planning_validation_checklist.pdf
    suggested-id: crime-prevention-statement
  - local-name: Employment & Skills Statement
    source-text: "From the audit: major schemes of 100+ dwellings or 2,500 sqm+ of commercial floorspace,
