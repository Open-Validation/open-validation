# Corrections for Stevenage Borough Council, from the council's audit.
# The workbook has no requirement rows. The audit read the council's 'Submitting a Planning
# Application' page (posted 19 Oct 2026) and found no local validation list linked anywhere;
# MHCLG's planning.data.gov.uk record says the same ("Couldn't find any sort of checklist").
# So only the national requirements apply. The workbook's 'not readable' status was wrong.
# The page's £120 service charge for emailed or paper applications is a fee point, not a
# submission standard, so it is not recorded here.
local-authority: STV

validation-list:
  url: https://www.stevenage.gov.uk/planning-and-building-control/planning/development-management/submitting-a-planning-application
  status: national-only
  date-basis: >-
    audit: no local validation list published; the url is the council's general submission page
    (posted 19 Oct 2026), which links no local list or checklist
