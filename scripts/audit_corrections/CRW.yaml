# Corrections for Crawley Borough Council, from inputs/audit/crawley-borough-council.json.
# The audit checked the current list (adopted 3 November 2025), the same PDF Grokbot used. Many
# of the workbook's excerpts were swapped between neighbouring table rows or cut off; items
# marked "From the audit" use the audit's paraphrase of the list, not the council's exact words.
local-authority: CRW

validation-list:
  url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
  date: 2025-11-03
  date-basis: "audit: cover text 'Adopted 3 November 2025'"

submission-standards:
  - item: Plans and drawings drawn to a recognised standard metric scale
    level: must
  - item: Every drawing marked with a scale bar, key dimensions, the direction of North, the original paper size and scale (e.g. 1:50 at A3), a drawing number and a description
    level: should
  - item: The wording "do not scale" is not acceptable
    level: must
  - item: Documents in PDF format (JPEG acceptable for photographs, not plans)
    level: should
  - item: No individual file larger than 5MB
    level: must

drop:
  - id: fire-statement
    reason: "wrong_app_type: placed under Advertisement consent because 'Advertisement Applications' sat next to it in the PDF table; the excerpt is EIA text"

drop-unmapped:
  - local-name: "Agricultural / rural workers' dwelling appraisal"
    reason: "wrong_trigger: no such requirement in the Crawley list; the excerpt is a garbled run of reference links"
  - local-name: Agricultural Land Classification / Soils
    reason: "wrong_trigger: garbled reference links; the ALC Statement is only part of the Gatwick Green outline pack (added below)"
  - local-name: Gypsy & Traveller information
    reason: "not_a_requirement: the source says it is not a strict validation requirement"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: a fragment ('established through pre-application engagement discussions')"
  - local-name: Housing mix / dwelling standards (NDSS, accessible homes)
    reason: "wrong_trigger: the source requirement is proposed floor plans showing Category 2 compliance (now in floor-plan-proposed)"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: the excerpt is Air Quality / Emissions Mitigation Statement text; the real trigger is added below"
  - local-name: Employment / Economic Statement
    reason: "wrong_trigger: the excerpt is the Employment and Skills Plan, which the label merged with the separate Economic Statement; both added below"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: the excerpt is BNG off-site gains and Urban Greening Factor text; the Planning Obligations Instruction Form is added below"

requirements:
  - id: affordable-housing-statement
    action: update
    required-if:
      all:
        - application-type:
            in: [full]
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: Residential development resulting in one or more additional units.
    confidence: medium
    notes: "The excerpt says: 'Required for all Full applications for residential development which result in one or more additional units.'"

  - id: air-quality-assessment
    action: update
    required-if:
      any:
        - ref: major-development
        - site:
            in: [air-quality-management-area]
            description: The development is in or likely to affect an Air Quality Management Area.
        - discretionary
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the excerpt stops after 'major development;'. The audit quotes the list:
      "Major development; development in or likely to affect an AQMA; B8 of 500 sqm or more...", and
      says it also covers plant emissions and the 800m odour zone around Crawley STW. The B8, plant
      and odour-zone cases are shown as officer discretion.

  - id: arboriculturist-report
    action: update
    required-if:
      any:
        - all:
            - condition:
                field: trees-on-or-near-site
                value: true
                description: There are trees on or near the site.
            - site:
                in: [tree-preservation-zone, conservation-area]
                description: The trees have a tree preservation order or are in a conservation area.
        - site:
            in: [ancient-woodland, local-character-area]
            description: The site is in or near ancient woodland, or in an Area of Special Local Character.
        - condition:
            field: veteran-trees
            value: true
            description: There are veteran trees on or next to the site.
    must-include:
      - item: Copies of the Tree Survey and Tree Retention/Removal Plan
        level: should
      - item: Details of any required facilitation pruning
        level: should
    confidence: medium
    notes: "From the audit (missing_requirement): Tree Information covers trees with a TPO or in a conservation area, ancient woodland, veteran trees and Areas of Special Local Character, including householder applications."

  - id: archaeological-assessment
    action: replace
    required-if:
      all:
        - condition:
            field: ground-disturbance
            value: true
            description: The proposal involves groundworks.
        - site:
            in: [archaeological-priority-area]
            description: The site is near heritage assets or in an Archaeological Notification Area.
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    confidence: low
    notes: "Audit (wrong_app_type): the workbook placed it under listed building consent, but the source ties the Archaeological Desk-based Assessment to groundworks near heritage assets and Archaeological Notification Area thresholds. The thresholds were not given."

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building, listed-building-setting]
            description: The development affects a listed building or structure, or its setting.
        - discretionary
    source-text: >-
      Heritage Impact Assessment (HIA) and Archaeologica l Desk-based Assessment A HIA will be
      required with applications for Listed Building Consent and with all applications for
      development affecting heritage assets or the setting of a heritage asset, including the
      following: Listed Buildings and Structures; …
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    confidence: medium
    notes: >-
      Audit (missing_requirement, wrong_app_type): needed for all development affecting heritage
      assets or their setting, including householder work. The excerpt's list of heritage assets is
      cut off after listed buildings, so the other assets are shown as officer discretion.

  - id: environmental-statement
    action: replace
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development is likely to have significant effects on the environment (EIA Regulations 2017).
    source-text: >-
      Environmental … Statement … Required for development which … is likely to have significant
      effects on the environment according to criteria set out in the Town and Country Planning …
      (Environmental Impact Assessment) Regulations 2017
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): the workbook placed it under Advertisement consent. The source text was split across the BNG and advert rows of the PDF table."

  - id: telecommunications-report
    action: replace
    required-if:
      all:
        - application-type:
            in: [pa-ecomms-network, full]
        - condition:
            field: telecommunications-development
            value: true
            description: The proposal is for telecommunications equipment.
    source-text: >-
      Gatwick Airport Safeguarding should be consulted regarding masts/mast extensions and the
      installation of any antennas, aerials and dishes within 3 km of the airport, even where prior
      approval or planning permission are not required, in accordance with Appendix A of the Code of
      Best Practice on Mobile Network Development in England.
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): it relates to telecoms prior approval and full applications, not change-of-use prior approvals."

  - id: site-plan
    action: replace
    required-if:
      application-type:
        in: [pa-extension]
    source-text: >-
      In addition, a site plan drawn at an identified scale, must show the proposed development and
      any existing enlargement of the original house that the proposal will join onto.
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    must-include:
      - item: Drawn at an identified scale
        level: must
      - item: The proposed development and any existing enlargement of the original house that it will join onto
        level: must
    confidence: medium
    notes: "Audit (wrong_app_type): the excerpt is the Larger Home Extension (Class A4) prior approval requirement. A block plan for other applications is a national requirement."

  - id: design-and-access-statement
    action: update
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - ref: major-development
    confidence: medium
    notes: "Audit (other): the council marks this as a 'National Requirement' for major development."

  - id: biodiversity-survey-report
    action: update
    required-if:
      condition:
        field: protected-species
        value: true
        description: Protected species or species of principal importance are likely to be present.
    confidence: medium
    notes: "The excerpt is cut off at the start but gives the trigger: 'where protected species or species of principle importance are likely to be present (see Table 9 of the Green Infrastructure SPD)'."

  - id: sustainability-statement
    action: replace
    required-if:
      any:
        - all:
            - condition:
                field: new-build
                value: true
                description: The proposal includes new-build floorspace.
            - condition:
                field: floorspace
                operator: ">"
                value: 100
                description: Over 100 square metres of new floorspace.
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: One or more new dwellings.
        - all:
            - condition:
                field: involves-change-of-use
                value: true
                description: The proposal changes the use of a building.
            - condition:
                field: floorspace
                operator: ">="
                value: 100
                description: The change of use covers 100 square metres or more.
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the excerpt stops mid-sentence and runs into Statement of Community
      Involvement text. From the audit: over 100 sqm new build, one or more new dwellings, extensions
      to buildings of 1,000 sqm or more, and changes of use of 100 sqm or more. The extension case is
      not encoded (it is unclear whether 1,000 sqm is the extension or the existing building).

  - id: flood-risk-assessment
    action: update
    required-if:
      any:
        - site:
            in: [flood-risk-zone]
            description: Any development in flood zone 2 or 3 (including householder development).
        - all:
            - ref: major-development
            - any:
                - condition:
                    field: site-area-residential
                    operator: ">"
                    value: 1
                    description: The site is over 1 hectare.
                - condition:
                    field: site-area-non-residential
                    operator: ">"
                    value: 1
                    description: The site is over 1 hectare.
        - discretionary
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the excerpt is only the Flood Zone 1 non-fluvial line (shown as officer
      discretion). From the audit: major development over 1ha in Flood Zone 1 and any development in
      Flood Zones 2 or 3. A "Flood Risk and Resilience Statement" covers "householder development,
      minor non-residential extensions under 250 sqm and minor alterations in Flood Zones 2, 3a or 3b"
      (audit quote).

  - id: floor-plan-proposed
    action: update
    must-include:
      - item: Compliance with Category 2 (accessible and adaptable dwellings)
        level: must
        required-if:
          condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: The proposal creates one or more new dwellings.
        source-text: "Category 2 – accessible and adaptable dwellings, unless there are exceptional circumstances which mean this standard cannot be met."
    notes: "Audit (wrong_trigger): the M4(2) text belongs to the 'Floorplans (Proposed)' requirement for one or more new dwellings. Floor plans are also a national requirement."

  - id: planning-statement
    action: replace
    required-if:
      ref: major-development
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the Gypsy & Traveller H8 note. From the audit: all major residential and commercial applications."

  - id: town-centre-impact-assessment
    action: replace
    required-if:
      all:
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: A main town centre use in an out-of-centre location.
        - any:
            - condition:
                field: floorspace-non-residential
                operator: ">="
                value: 500
                description: 500 square metres or more of retail floorspace.
            - condition:
                field: floorspace-non-residential
                operator: ">="
                value: 2500
                description: 2,500 square metres or more of leisure floorspace.
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt omits the out-of-centre location and the 500 sqm retail / 2,500 sqm leisure thresholds."

  - id: roof-plan-existing
    action: update
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: The proposal includes new buildings.
        - condition:
            field: roof-alteration
            value: true
            description: The development is attached to or changes an existing roof structure, or forms a new roof.
    notes: "The excerpt: 'Required for new buildings and where a development is attached to or changes an existing roof structure or forms a new roof.'"

  - id: roof-plan-proposed
    action: update
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: The proposal includes new buildings.
        - condition:
            field: roof-alteration
            value: true
            description: The development is attached to or changes an existing roof structure, or forms a new roof.
    notes: "The excerpt: 'Required for new buildings and where a development is attached to or changes an existing roof structure or forms a new roof.'"

  - id: transport-assessment
    action: update
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 80
            description: 80 or more dwellings.
        - discretionary
    confidence: low
    notes: "Audit (wrong_trigger): the excerpt gives no threshold. From the audit: the source has separate TA thresholds (e.g. 80+ dwellings) and Transport Statement thresholds (50-80 dwellings); the other TA thresholds weren't given."

  - id: viability-assessment
    action: replace
    required-if: discretionary
    source-text: "Required where an application is seeking on grounds of financial viability to justify non-compliance …"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's row carried the Ventilation/Extraction trigger. Needed where an application seeks to justify non-compliance with policy on viability grounds."

  - id: noise-assessment
    action: add
    required-if:
      any:
        - all:
            - ref: major-development
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The major development is residential.
        - condition:
            field: noise-sensitive-use
            value: true
            description: >-
              A noise-sensitive use, including dwellings near the London-Brighton or Three
              Bridges-Horsham railways, major roads or aviation noise contours.
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): major residential, noise-sensitive uses, and dwellings near the London-Brighton and Three Bridges-Horsham railways, major roads or aviation noise contours."

  - id: sci
    action: add
    required-if: discretionary
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    confidence: low
    notes: "From the audit (missing_requirement): required where the developer has consulted, and mandatory for wind schemes of more than 2 turbines or a hub height over 15m (not encoded: no field for wind turbines)."

unmapped:
  - local-name: Ventilation / Extraction Statement
    source-text: >-
      Ventilation/ Extraction Statement … Required for applications within Use Classes E(b), E(g), B2
      along with Pubs, Bars, entertainment establishments , hot food takeaways and any other
      applications where ventilation or extraction equipment is proposed to be installed.
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: ventilation-extraction-details
  - local-name: Employment and Skills Plan
    source-text: >-
      Employment An Employment and Skills plan is and Skills Plan required to accompany all major
      planning applications - full and outline (and where applicable at reserved matters stage).
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: employment-skills-plan
  - local-name: Economic Statement
    source-text: "From the audit: net loss of employment floorspace in Main Employment Areas or Neighbourhood Centres, or non-business uses in the Manor Royal Main Employment Area"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: employment-statement
  - local-name: Building Height Information
    source-text: "From the audit: new structures, except householder"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: building-height-information
  - local-name: Minerals Infrastructure Statement
    source-text: "From the audit: within 250m of a Minerals Infrastructure Consultation Area"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: minerals-waste-statement
  - local-name: Minerals Resource Assessment
    source-text: "From the audit: Brick Clay Resource Consultation Area, sites of 3ha or more outside urban areas"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: minerals-waste-statement
  - local-name: Waste Infrastructure Statement
    source-text: "From the audit: on or within 250m of a waste site"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: minerals-waste-statement
  - local-name: Public Art
    source-text: "From the audit: all major applications, 1% of build costs"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: public-art-statement
  - local-name: Road Safety Audit
    source-text: "From the audit: 20+ dwellings or 2,000 sqm+ commercial with access or highway works"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: road-safety-audit
  - local-name: Utilities Infrastructure Statement
    source-text: "Required for major development or development on a site without mains drainage"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: foul-sewage-utilities-statement
  - local-name: Local BNG Statement / Urban Greening Factor
    source-text: >-
      From the audit: major and minor applications. The council's wording: "The Urban Greening
      Factor will be required for sites with low (or zero) existing biodiversity baseline."
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: urban-greening-factor
  - local-name: Planning Obligations Instruction Form (Appendix B)
    source-text: "From the audit: where a legal agreement is needed"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: planning-obligations-heads-of-terms
  - local-name: Gatwick Green Strategic Employment Location outline pack
    source-text: >-
      From the audit: outline applications at Gatwick Green need an agreed masterplan, a mobility
      strategy, an Agricultural Land Classification Statement, a construction and phasing plan, air
      quality modelling and an impact assessment
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: ""
  - local-name: Master Plans and Design Codes (threshold)
    source-text: "From the audit: significant development of more than 150 dwellings or 6,000 sqm commercial floorspace"
    source-url: https://crawley.gov.uk/sites/default/files/2025-11/National%20and%20local%20list%20of%20validation%20requirements%203%20November%202025.pdf
    suggested-id: parameter-plans

low-confidence:
  - id: bng-metric
    note: "Audit (wrong_trigger): the excerpt mixes Design and Access Statement and EIA text; re-read the council's list."
  - id: land-contamination-assessment
    note: "Audit (wrong_trigger): the excerpt ('with the Land Contamination Risk Management Process (see web link).') gives no trigger."
  - id: section-existing
    note: "Audit (wrong_trigger): the excerpt ('on changing ground levels.') is a fragment."
  - id: section-proposed
    note: "Audit (wrong_trigger): the excerpt ('on changing ground levels.') is a fragment."
  - id: travel-plan
    note: "Audit (wrong_trigger): the excerpt is a garbled run with no threshold; the Transport Statement (including a Travel Plan Statement) thresholds were cut off."
  - id: recreation-facilities-assessment
    note: "The excerpt ('and recreational / play spaces, allotments without suitable replacement.') is a fragment with no clear trigger."
  - id: cil-form
    note: "The excerpt is cut off at the start and gives no trigger."

new-fields:
  - field: protected-species
    kind: boolean
    label: Protected or priority species affected
    description: The proposal is likely to affect protected or priority species or their habitats.
  - field: ancient-woodland
    kind: designation
    label: In or near Ancient Woodland
    description: Site is in Ancient Woodland or its buffer zone.
  - field: veteran-trees
    kind: boolean
    label: Ancient or veteran trees
    description: There are ancient or veteran trees on or next to the site.
  - field: local-character-area
    kind: designation
    label: Local character area
    description: Site is in a locally designated character area, such as an Area of Special Local Character or Area of Townscape Character.
  - field: roof-alteration
    kind: boolean
    label: Roof alteration or new roof
    description: The proposal changes the shape of an existing roof or adds a new roof.
  - field: telecommunications-development
    kind: boolean
    label: Telecommunications development
    description: The proposal is for telecommunications equipment (masts, antennas, cabinets and similar).
  - field: out-of-centre-town-centre-use
    kind: boolean
    label: Main town centre use outside a centre
    description: >-
      The proposal is for a main town centre use (retail, leisure, offices and similar) at an
      edge-of-centre or out-of-centre location, outside a defined town centre or primary shopping area.
