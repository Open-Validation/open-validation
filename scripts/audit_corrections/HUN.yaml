# Corrections for Huntingdonshire District Council, from the council's audit.
# The council publishes per-application-type 'Validation Checklist and Guidance' documents on its
# 'Guidance, checklists and advice notes' page, plus a 'Local Validation Summary' (Version 0.1)
# that maps each local requirement to application types (PP, OPP, RM, HH, LBC, LDC, AC). Grokbot
# used the checklists but copied the Outline items into Reserved matters; here those items are
# limited to full and outline (PP, OPP) as the Summary says. No source states an adoption date
# (the 2024-02-01 list date is PDF metadata only). The removal/variation (s73) checklist was not
# itemised by the workbook or the audit. Items marked "From the audit" use its paraphrase.
local-authority: HUN

drop:
  - id: sci
    reason: "not_a_requirement: 'a separate statement of community involvement may be appropriate' for majors"
  - id: photos
    sheets: [Listed building consent, Advertisement consent]
    reason: "not_a_requirement: photographs are optional supplementary information, or an alternative to elevation drawings"
  - id: floor-plan-existing
    sheets: [Advertisement consent]
    reason: "wrong_app_type: the advert checklist asks for elevations, not floor plans"
  - id: floor-plan-proposed
    sheets: [Advertisement consent]
    reason: "wrong_app_type: the advert checklist asks for elevations, not floor plans"

drop-unmapped:
  - local-name: Highways / access details (visibility splays)
    reason: "wrong_trigger: fragments ('site including access arrangements'); the Access Plan is re-added below"
  - local-name: Health Impact Assessment
    reason: "wrong_trigger: the excerpt is the Heritage Statement trigger; re-added below"
  - local-name: Advertisement drawings / illumination details
    reason: "duplicate: same text as the lighting-assessment advert row"
  - local-name: Crime prevention / Secured by Design statement
    reason: "wrong_trigger: the excerpt is Design and Access Statement text"
  - local-name: Validation checklist form (completed)
    reason: "not_a_requirement: process text from the householder PDF, filed under LBC"

requirements:
  - id: affordable-housing-statement
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - discretionary
    source-text: Affordable Housing Statement Where a proposal for residential development exceeds the 
      relevant thresholds for affordable housing in local planning policies.
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): PP and OPP only, not reserved matters. The threshold is in local policy,
      not the checklist."

  - id: air-quality-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - any:
            - condition:
                field: dwelling-count
                operator: ">="
                value: 200
                description: Proposals for 200 or more dwellings.
            - site:
                in: [air-quality-management-area]
                description: The site is in or within 50m of an AQMA or Clean Air Zone.
    source-text: Air Quality Statements Proposals for 200 or more dwellings
    source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
    confidence: medium
    notes: "Audit (wrong_trigger, wrong_app_type): the Full excerpt was form text; PP and OPP only."

  - id: arboriculturist-report
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, outline]
        - condition:
            field: trees-on-or-near-site
            value: true
            description: There are existing or proposed trees on or next to the site.
    source-text: >-
      Trees, Woodland, Hedges and Hedgerows Assessment and Protection Plan Where there will be any
      existing/ proposed trees on/adjacent the site A Tree Protection Plan Where there will be any
      adverse impact on trees An Arboricultural Assessment and Tree Protection Plan produced by a
      suitably qualified and experienced arboricultural expert which conforms to the BS5837:2012
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    must-include:
      - item: A Tree Protection Plan
        level: must
        required-if:
          discretionary
      - item: Conforms to BS5837:2012
        level: must
    confidence: medium
    notes: "The Tree Protection Plan is needed where there will be any adverse impact on trees. From the audit
      (missing_requirement): also on the Householder checklist."

  - id: archaeological-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - any:
            - site:
                in: [archaeological-priority-area]
                description: The site has potential archaeological significance.
            - discretionary
    source-text: Archaeological Assessment If the site has potential archaeological significance.
    source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): PP and OPP only, not reserved matters."

  - id: biodiversity-survey-report
    action: replace
    required-if: discretionary
    source-text: All Applications Complete HDC Biodiversity checklist and if you have answered yes to any 
      of the questions a Preliminary Ecological Appraisal will be required.
    source-url: https://www.huntingdonshire.gov.uk/media/5517/application-householder.pdf
    confidence: medium
    notes: "A Preliminary Ecological Appraisal depends on the answers to the Biodiversity checklist, so it is
      shown as officer judgement."

  - id: bng-metric
    action: replace
    required-if:
      application-type:
        in: [full, outline]
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    confidence: medium
    notes: "Audit (wrong_app_type, missing_requirement): a Biodiversity Net Gain Assessment for PP and OPP
      (statutory exemptions apply); the excerpt was a fragment."

  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - all:
            - application-type:
                in: [hh]
            - site:
                in: [conservation-area]
                description: The site is in a conservation area.
            - any:
                - condition:
                    field: dwelling-count
                    operator: ">="
                    value: 1
                    description: One or more dwellings.
                - condition:
                    field: floorspace
                    operator: ">="
                    value: 100
                    description: 100 square metres or more of floorspace.
        - all:
            - application-type:
                in: [full, outline, reserved-matters]
            - discretionary
    source-text: All applications Design and Access Statement All applications
    source-url: https://www.huntingdonshire.gov.uk/media/5512/application-for-lb.pdf
    confidence: low
    notes: >-
      LBC: all applications. From the audit: householder in a conservation area with 1+ dwelling or
      100m2+. The full, outline and reserved matters excerpts describe the statement but not when it
      is needed, so they are shown as officer judgement.

  - id: environmental-statement
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - condition:
            field: eia-development
            value: true
            description: The development needs EIA under the 2017 Regulations.
    source-text: Environmental Statement As required by The Town and Country Planning (Environmental 
      Impact Assessment) Regulations 2017.
    source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): PP and OPP only, not reserved matters."

  - id: flood-risk-assessment
    action: replace
    required-if:
      any:
        - all:
            - application-type:
                in: [hh]
            - site:
                in: [flood-risk-zone]
                description: The site is in Flood Zone 2 or 3.
        - all:
            - application-type:
                in: [full, outline]
            - any:
                - site:
                    in: [flood-risk-zone]
                    description: New development in Flood Zone 2 or 3.
                - condition:
                    field: site-area-residential
                    operator: ">="
                    value: 1
                    description: Development of 1 hectare or more in Flood Zone 1.
                - condition:
                    field: site-area-non-residential
                    operator: ">="
                    value: 1
                    description: Development of 1 hectare or more in Flood Zone 1.
    source-text: >-
      Flood Risk Assessment Planning applications for development proposals of 1ha or greater in Flood
      Zone 1 and all proposals for new development located in Flood Zones 2 and 3 to be accompanied by a
      … Flood Risk Assessment for householders is only required in Flood Zones 2 and 3. (A tick box form
      can be used and is available here) Please also include mitigation measures.
    source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
    must-include:
      - item: Mitigation measures
        level: must
        required-if:
          application-type:
            in: [hh]
    confidence: medium
    notes: "Audit (missing_requirement, wrong_app_type): also on the Full checklist; not reserved matters. A
      tick-box form can be used for householder development and non-domestic extensions up to 250sqm."

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - all:
            - application-type:
                in: [advertising]
            - site:
                in: [listed-building]
                description: The property is a listed building.
        - all:
            - application-type:
                in: [hh, full, outline]
            - site:
                in: [listed-building, listed-building-setting, conservation-area, locally-listed-building,
                  scheduled-monument, park-and-garden]
                description: The significance of a heritage asset (including its setting) is affected.
    source-text: >-
      Heritage Statement Where the significance of any heritage asset is affected by the proposal, a
      statement that describes the significance of any heritage assets affected, including any
      contribution made by their setting, is required.
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    must-include:
      - item: The significance of any heritage assets affected, including any contribution made by their
          setting
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): also on the Householder (including conservation areas) and
      LBC checklists. Advertisement consent: 'Only required when the property is a Listed Building'."

  - id: land-contamination-assessment
    action: add
    required-if:
      application-type:
        in: [full, outline]
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    confidence: low
    notes: "From the audit (missing_requirement): Ground Contamination / Groundwater Pollution Investigation on
      the Full checklist; the audit gives no trigger."

  - id: landscaping-plan
    action: replace
    required-if:
      application-type:
        in: [full, reserved-matters]
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    confidence: low
    notes: "The reserved matters excerpt was roof-plan text. From the audit (missing_requirement): Landscaping
      Details on the Full checklist; no trigger given."

  - id: lighting-assessment
    action: replace
    required-if:
      any:
        - all:
            - condition:
                field: external-lighting
                value: true
                description: External lighting would be provided or made necessary by the development.
            - any:
                - site:
                    in: [listed-building, conservation-area, rural-area]
                    description: Near a listed building or a conservation area, or in open countryside.
                - discretionary
        - all:
            - application-type:
                in: [advertising]
            - condition:
                field: illuminated
                value: true
                description: Externally illuminated signage.
    source-text: >-
      … listed building or a conservation area, or open countryside, where external lighting would be
      provided or made necessary by the development … Lighting Assessment For any external illuminated
      signage Must provide details of external lighting and the proposed hours when the lighting would
      be switched on.
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    must-include:
      - item: Details of the external lighting and the hours when it would be switched on
        level: must
        required-if:
          application-type:
            in: [advertising]
    confidence: medium
    notes: "The start of the full-planning trigger is cut off (it likely also covers residential property),
      so other cases are shown as officer judgement."

  - id: noise-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline, reserved-matters]
        - discretionary
    source-text: Applications that raise issues of … disturbance by noise to occupants of … A Noise 
      Impact Assessment prepared by a suitably qualified acoustician.
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    confidence: medium
    notes: "Audit (wrong_app_type, wrong_trigger): the Local Validation Summary gives PP, OPP, RM (not LBC);
      the outline excerpt was HIA text."

  - id: planning-statement
    action: replace
    required-if:
      application-type:
        in: [full, outline, ldc]
    source-text: >-
      A Planning Statement gives an opportunity to explain the proposal and it should identify the
      context and need for a proposed development and how the proposed development accords with
      relevant national and local planning policies.
    source-url: https://www.huntingdonshire.gov.uk/media/5509/application-for-a-lawful-development-document-checklist.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): a Planning/Supporting Statement for all full applications.
      The LDC checklist lists it too; whether the outline checklist requires it for all is not stated."

  - id: recreation-facilities-assessment
    action: replace
    required-if:
      application-type:
        in: [full, outline]
    source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
    confidence: low
    notes: "Audit (wrong_app_type, missing_requirement): an Open Space Assessment for PP/OPP; the excerpt is
      garbled and the trigger is cut off."

  - id: roof-plan-existing
    action: update
    required-if:
      all:
        - application-type:
            in: [hh, lbc]
        - condition:
            field: external-alterations
            value: true
            description: The proposal changes the existing building(s).
    source-text: >-
      Roof plans as existing and proposed (1:50 or 1:100 scale measured drawings) All applications
      except where there are no changes to the existing building(s) Plan to show the shape of the roof
      particularly when development includes changes to its appearance and shape.
    source-url: https://www.huntingdonshire.gov.uk/media/5512/application-for-lb.pdf
    must-include:
      - item: At a scale of 1:50 or 1:100
        level: must
      - item: The shape of the roof
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): also on the Householder checklist."

  - id: roof-plan-proposed
    action: update
    required-if:
      any:
        - application-type:
            in: [reserved-matters]
        - all:
            - application-type:
                in: [hh, lbc]
            - condition:
                field: external-alterations
                value: true
                description: The proposal changes the existing building(s).
    source-text: >-
      Roof plans as existing and proposed (1:50 or 1:100 scale measured drawings) All applications
      except where there are no changes to the existing building(s) Plan to show the shape of the roof
      particularly when development includes changes to its appearance and shape.
    source-url: https://www.huntingdonshire.gov.uk/media/5512/application-for-lb.pdf
    must-include:
      - item: At a scale of 1:50 or 1:100
        level: must
      - item: The shape of the roof, including ridges, valleys, dormer windows, roof lights and other
          features such as chimneys or raised parapets
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): also on the Householder checklist. Reserved matters asks for
      proposed roof plans."

  - id: schedule-of-works
    action: add
    required-if:
      application-type:
        in: [lbc]
    source-url: https://huntingdonshire.gov.uk/media/4floiins/local-validation-summary.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): Schedule of Works and/or Specification of Repairs for listed
      building consent (Local Validation Summary)."

  - id: section-existing
    action: replace
    required-if:
      any:
        - condition:
            field: change-in-ground-levels
            value: true
            description: Ground levels differ (or will differ) across the site or with adjoining land.
        - discretionary
    source-text: >-
      Site Sections as existing and proposed and finished floor and site levels (1:50 or1:100 scale)
      with written dimensions Where there is (or proposes to be) a difference in ground levels across the
      site and/or with adjoining land Or Where the development is within 300mm of the site boundary
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    must-include:
      - item: At a scale of 1:50 or 1:100, with written dimensions
        level: must
      - item: Finished floor and site levels
        level: must
      - item: How encroachment of foundations and eaves is to be avoided
        level: should
        required-if:
          application-type:
            in: [lbc]
    confidence: medium
    notes: "Development within 300mm of the site boundary has no field, so it is shown as officer judgement.
      From the audit: also on the Householder checklist."

  - id: section-proposed
    action: replace
    required-if:
      any:
        - condition:
            field: change-in-ground-levels
            value: true
            description: Ground levels differ (or will differ) across the site or with adjoining land.
        - discretionary
    source-text: >-
      Site Sections as existing and proposed and finished floor and site levels (1:50 or1:100 scale)
      with written dimensions Where there is (or proposes to be) a difference in ground levels across the
      site and/or with adjoining land Or Where the development is within 300mm of the site boundary
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    must-include:
      - item: At a scale of 1:50 or 1:100, with written dimensions
        level: must
      - item: Finished floor and site levels
        level: must
      - item: Cross sections through the building, particularly where common boundaries are involved
        level: should
      - item: How encroachment of foundations and eaves is to be avoided
        level: should
        required-if:
          application-type:
            in: [lbc]
    confidence: medium
    notes: "Development within 300mm of the site boundary has no field, so it is shown as officer judgement.
      From the audit: also on the Householder checklist."

  - id: site-plan
    action: update
    must-include:
      - item: At a scale of 1:200 or 1:500 (flexible, depending on the nature and scale of the development)
        level: should
    confidence: medium

  - id: sustainability-statement
    action: add
    required-if:
      ref: major-development
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): Sustainability Statement for all major development."

  - id: telecommunications-report
    action: add
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: The proposal is for telecommunications development.
    source-url: https://www.huntingdonshire.gov.uk/media/h3hl1orl/application-for-planning-permission-including-change-of-use.pdf
    confidence: low
    notes: "From the audit (missing_requirement): telecommunications information is on the Full checklist; no
      trigger given."

  - id: town-centre-impact-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Main town centre uses outside defined town centres.
        - condition:
            field: town-centre-use-floorspace
            operator: ">"
            value: 600
            description: More than 600m2 net internal floorspace.
    source-text: A proposal for main town centre uses of more than 600m2 net internal floor space that are
      outside of defined town centres.
    source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): PP and OPP only. Covers the sequential test and impact assessment."

  - id: transport-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - any:
            - condition:
                field: dwelling-count
                operator: ">="
                value: 50
                description: 50 or more residential dwellings.
            - condition:
                field: retail-floorspace
                operator: ">="
                value: 1000
                description: 1000m2 or more of retail.
            - discretionary
    source-text: >-
      Transport Assessment & Travel Plan … A proposal that includes: 1000m2 or more for retail OR 2500m2
      for employment OR 50 rooms + for hotels OR 100+bedrooms for residential homes OR 50 residential
      dwellings OR all leisure and 2500m2 or more for Health care and education.
    source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger, wrong_app_type): the workbook's trigger was the Structural Survey text and it
      was copied into reserved matters. Employment, hotel, care home, leisure, health and education
      thresholds have no fields, so they are shown as officer judgement. From the audit: also high HGV
      movements; a Transport Statement is on the Full checklist.

  - id: travel-plan
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - any:
            - condition:
                field: dwelling-count
                operator: ">="
                value: 80
                description: 80 or more dwellings (Residential Travel Plan).
            - condition:
                field: retail-floorspace
                operator: ">="
                value: 1000
                description: 1000m2 or more of retail.
            - discretionary
    source-text: >-
      Transport Assessment & Travel Plan … A proposal that includes: 1000m2 or more for retail OR 2500m2
      for employment OR 50 rooms + for hotels OR 100+bedrooms for residential homes OR 50 residential
      dwellings OR all leisure and 2500m2 or more for Health care and education.
    source-url: https://www.huntingdonshire.gov.uk/media/xezhqajy/application-for-outline-planning.pdf
    confidence: low
    notes: "Audit (wrong_trigger): from the audit, 80+ dwellings for a Residential Travel Plan; the checklist
      groups the Travel Plan with the Transport Assessment thresholds. Check which applies."

  - id: floor-plan-existing
    action: update
    must-include:
      - item: At a scale of 1:50 or 1:100, with written dimensions
        level: must
    confidence: medium
    notes: "From the audit: the Householder checklist also asks for floor plans and elevations (the workbook
      filed the householder text under Full planning)."

  - id: floor-plan-proposed
    action: update
    must-include:
      - item: At a scale of 1:50 or 1:100, with written dimensions
        level: must
    confidence: medium
    notes: "From the audit: the Householder checklist also asks for floor plans and elevations (the workbook
      filed the householder text under Full planning)."

  - id: elevation-existing
    action: update
    must-include:
      - item: At a scale of 1:50 or 1:100, with written dimensions
        level: must
    confidence: medium
    notes: "From the audit: the Householder checklist also asks for floor plans and elevations (the workbook
      filed the householder text under Full planning)."

  - id: elevation-proposed
    action: update
    must-include:
      - item: At a scale of 1:50 or 1:100, with written dimensions
        level: must
    confidence: medium
    notes: "From the audit: the Householder checklist also asks for floor plans and elevations (the workbook
      filed the householder text under Full planning)."

