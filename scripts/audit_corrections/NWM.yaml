# Corrections for London Borough of Newham, from inputs/audit/london-borough-of-newham.json.
# Grokbot's link is the current Planning Application Requirements (PAR), December 2024. The
# capture is poor: about 20 local requirements are missing, many triggers are fragments or text
# from another requirement, and the PAR's own 'applies to' application types were not used.
# Items marked "From the audit" use the audit's paraphrase of the PAR.
local-authority: NWM

submission-standards:
  - item: All drawings in PDF (not jpeg, TIF, doc, xls or CAD files)
    level: should
  - item: Maximum file size of any single attachment is 10MB; larger documents broken into parts and
      labelled appropriately
    level: must
  - item: Drawings must be scalable; drawings annotated 'Do not scale' (or similar) will not be 
      accepted
    level: must

drop:
  - id: flood-risk-assessment
    sheets: [Householder]
    reason: "wrong_app_type: 'householder' appears in the text as an exemption"
  - id: schedule-of-works
    reason: "wrong_trigger: the row holds BS5837 tree text and the start of the SCI; the PAR has no such
      requirement"
  - id: recreation-facilities-assessment
    reason: "wrong_trigger: the excerpt is fragments of the housing statement triggers (now affordable-housing-statement
      and unmapped housing statements)"

drop-unmapped:
  - local-name: Cycle parking details
    reason: "wrong_trigger: a fragment ('and proposed cycle parking.'); replaced by Parking & Service
      Details below"
  - local-name: Habitats Regulations Assessment information / SPA mitigation
    reason: "wrong_trigger: a fragment ('of the SAMMS contribution.'); replaced by SAMMS below"
  - local-name: Pre-application advice / engagement details
    reason: "wrong_trigger: a fragment ('way of pre-application advice.')"
  - local-name: Tall buildings / Wind microclimate assessment
    reason: "wrong_trigger: a fragment; replaced below with the PAR's trigger"
  - local-name: Biodiversity Checklist / Questionnaire
    reason: "the excerpt is the Biodiversity Statement trigger, now in biodiversity-survey-report"

requirements:
  - id: flood-risk-assessment
    action: update
    required-if:
      all:
        - application-type:
            in: [full, outline, change-of-use]
        - site:
            in: [flood-risk-zone]
            description: The development is in Flood Zone 2 or 3.
    source-text: >-
      A Flood Risk Assessment is required for: All development in Flood Zone 2 or 3 (including minor
      development and changes of use) unless the development is a householder; or does not increase
      the size of buildings (eg.
    confidence: medium
    notes: >-
      Audit (wrong_app_type): the PAR does not require an FRA for householder development. Not
      needed where the development does not increase the size of buildings (the excerpt is cut off
      there).

  - id: arboriculturist-report
    action: replace
    required-if:
      any:
        - condition:
            field: trees-on-or-near-site
            value: true
            description: Works near mature trees.
        - site:
            in: [tree-preservation-zone]
            description: Works near trees protected by a TPO.
        - discretionary
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    must-include:
      - item: A tree survey with details of the potential impact of the construction project on 
          affected trees and the issues an Arboricultural Method Statement needs to address
        level: must
      - item: Prepared by a suitably qualified and experienced arboriculturist in accordance with 
          BS5837
        level: should
    confidence: medium
    notes: >-
      Audit (wrong_trigger): should follow the Landscaping Statement trigger, outdoor space within
      the red line (shown as officer discretion) or works near mature or TPO trees.

  - id: biodiversity-survey-report
    action: add
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: New residential housing proposals.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 500
            description: Non-residential development above 500 square metres GIA.
    source-text: >-
      Biodiversity Statement: required for all new residential housing proposals; non-residential
      above 500sq. m GIA (mostly FUL or OUT);
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: low
    notes: "The workbook filed this under 'Biodiversity Checklist / Questionnaire' (unmapped); it is the
      PAR's Biodiversity Statement."

  - id: bng-metric
    action: update
    must-include:
      - item: Completed Statutory Biodiversity Metric or Small Site Metric calculation tool, unless 
          the application is exempt
        level: must
        source-text: >-
          If the applicant believes or you are advised by the Validation Team that the application
          is not exempt you must submit the following National Mandatory Requirements at application
          stage: Completed Statutory Biodiversity Metric or Small Site Metric Calculation Tool.

  - id: cil-form
    action: replace
    required-if:
      any:
        - condition:
            field: floorspace
            operator: ">="
            value: 100
            description: New buildings or extensions of 100 square metres GIA or more.
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: Any new dwelling.
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook gave policy references only. From the audit: new buildings
      or extensions of 100 sq m+ GIA, or any new dwelling."

  - id: daylight-sunlight-assessment
    action: update
    must-include:
      - item: Diagrams and calculations of Vertical Sky Component and Average Daylight Factor, where
          relevant
        level: must

  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - all:
            - site:
                in: [conservation-area, world-heritage-site]
                description: The scheme is in a designated area.
            - any:
                - condition:
                    field: dwelling-count
                    operator: ">="
                    value: 1
                    description: The scheme creates a dwelling.
                - condition:
                    field: floorspace-non-residential
                    operator: ">="
                    value: 100
                    description: The scheme creates 100 square metres or more of non-residential 
                      floorspace.
    source-text: >-
      All major development (except a material change of use, waste development, engineering or
      mining operations)
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: >-
      Audit (wrong_trigger, amended): the 'applies to' thresholds were missing. Major development
      excludes material change of use, waste development, engineering or mining operations. The PAR
      also says "it is considered necessary in relation to Development Plan requirements
      irrespective of scheme size; the length and detail of a DAS can be tailored accordingly."

  - id: sustainability-statement
    action: replace
    required-if:
      any:
        - all:
            - ref: major-development
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: Major residential development.
        - condition:
            field: floorspace-non-residential
            operator: ">="
            value: 500
            description: Non-residential development of 500 square metres or more.
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: >-
      Audit (wrong_trigger, amended): the Sustainability Statement trigger is major residential and
      non-residential 500 sq m+. The workbook's row merged it with the Energy Statement.

  - id: energy-statement
    action: add
    source-text: >-
      Carbon reductions should be made on site as far as possible; alternatively, carbon off-setting
      contributions will be required where targets are not met.
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    policy: Local Plan SC1, SC2
    confidence: low
    notes: "Audit (wrong_trigger): the Energy Statement applies at the Local Plan SC1/SC2 thresholds,
      which the audit does not give."

  - id: environmental-statement
    action: replace
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development falls within Schedule 1 or 2 of the EIA Regulations.
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook gave policy references only. EIA 'may apply to REM and
      discharge of conditions', so no application type is given.

  - id: fire-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - all:
            - any:
                - condition:
                    field: building-height
                    operator: ">="
                    value: 18
                    description: A building is 18 metres or more tall.
                - condition:
                    field: storey-count
                    operator: ">="
                    value: 7
                    description: A building has 7 or more storeys.
            - condition:
                field: dwelling-count
                operator: ">="
                value: 2
                description: The building contains 2 or more dwellings (Planning Gateway One).
    policy: London Plan D12
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook gave policy references only. From the audit: all majors
      plus Planning Gateway One schemes (shown with the national relevant-building thresholds).

  - id: elevation-proposed
    action: update
    must-include:
      - item: Details of materials and finishes for all proposed elevations (not needed for major 
          development, where materials are often approved later)
        level: must
      - item: Where an elevation adjoins or is close to another building, the relationship between 
          the buildings and the position of openings on each property
        level: should

  - id: lighting-assessment
    action: replace
    required-if:
      condition:
        field: external-lighting
        value: true
        description: The proposal (including changes to open space) includes or makes necessary 
          external lighting.
    source-text: All proposals (including changes to open space) that include or make necessary 
      external lighting.
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook used the Airport Safeguarding content bullets as the trigger."

  - id: affordable-housing-statement
    action: add
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 10
            description: Housing on a site with capacity for 10 or more residential units.
        - condition:
            field: housing-type
            value: student
            description: Student housing.
    source-text: >-
      Applications for housing on sites with the capacity for 10 or more residential units
      (includes FUL/OUT/COU/REM applications); and All student housing proposals
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: "From the audit (missing_requirement): housing sites with capacity for 10+ units, and all student
      housing. The text was inside the workbook's open space row."

  - id: photos
    action: update
    required-if:
      any:
        - ref: major-development
        - discretionary
    confidence: medium
    notes: "Expected as part of a DAS for major development, or where the development will significantly
      affect the appearance of an area (shown as officer discretion)."

  - id: planning-statement
    action: replace
    required-if:
      application-type:
        in: [full, outline, reserved-matters, change-of-use]
    source-text: All FUL, OUT, REM and COU applications
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    must-include:
      - item: >-
          A Managed Release / Transition Statement, cross-referencing the Employment Strategy as
          necessary, where industrial or employment land or floorspace would be released or lost
        level: must
        required-if:
          condition:
            field: loss-of-use
            value: true
            description: >-
              Release of SIL/industrial land under Policy J2, or loss of employment floorspace in
              LMUAs, non-released LILs/SILs, or non-designated employment sites over 0.1ha or 1,000 sq
              m.
        source-text: Managed Release/Transition Statement Within the Planning Statement, 
          cross-referencing Employment Strategy as necessary
    confidence: medium
    notes: "Audit (wrong_trigger / wrong_app_type): the workbook used the Managed Release text as the
      trigger and placed it under Full planning only."

  - id: roof-plan-existing
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: New roofs or roof alterations are proposed.
    must-include:
      - item: Scale of 1:100 unless otherwise agreed
        level: must
    confidence: medium

  - id: roof-plan-proposed
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: New roofs or roof alterations are proposed.
    must-include:
      - item: Scale of 1:100 unless otherwise agreed
        level: must
    confidence: medium

  - id: sci
    action: add
    required-if:
      application-type:
        in: [full, outline, reserved-matters, change-of-use]
    source-text: All FUL , OUT, REM and COU applications
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: >-
      From the audit (missing_requirement): Statement of Community Involvement / Consultation
      Statement, within the Design and Access Statement (demonstrating how consultation has informed
      outcomes).

  - id: heritage-statement
    action: add
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building, locally-listed-building, conservation-area]
            description: Works to listed, locally listed or non-designated heritage assets, or in or
              next to a Conservation Area.
        - all:
            - site:
                in: [archaeological-priority-area]
                description: The site is in an Archaeological Priority Area.
            - condition:
                field: ground-disturbance
                value: true
                description: The proposal involves ground disturbance.
        - discretionary
    source-text: Planning applications in Conservation Areas or adjacent to them
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: >-
      From the audit (missing_requirement): Heritage / Character / Place-making Asset Statement for
      LBC; works to listed, locally listed or identified non-designated heritage assets; ground
      disturbance in Archaeological Priority Areas or significant ground disturbance elsewhere
      (shown as officer discretion); applications in or next to Conservation Areas. Applies to
      householder schemes too.

  - id: town-centre-impact-assessment
    action: add
    required-if:
      all:
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Retail or leisure outside centres, not in accordance with the Development 
              Plan.
        - any:
            - condition:
                field: floorspace-non-residential
                operator: ">"
                value: 300
                description: Retail floorspace over 300 square metres.
            - condition:
                field: floorspace-non-residential
                operator: ">"
                value: 2500
                description: Leisure floorspace over 2,500 square metres.
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: "From the audit (missing_requirement): Retail / Leisure Impact Assessment for retail over 300
      sq m or leisure over 2,500 sq m outside centres where not in accordance with the Development Plan."

  - id: transport-assessment
    action: update
    required-if: discretionary
    notes: >-
      The excerpt says a Transport Statement "is required for smaller schemes where the proposal
      generates relatively lower levels of transport implications"; the full trigger was not captured.

  - id: travel-plan
    action: replace
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook reused the Transport Statement text. From the audit: all
      majors, sites in or next to a Sustainable Transport Opportunity Area or Congestion Zone, F1
      and E(e)/E(f) uses, and minors with significant transport implications (the last three shown
      as officer discretion).

  - id: viability-assessment
    action: replace
    required-if: discretionary
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    must-include:
      - item: An independent assessment conforming to the principles of the London Borough Viability
          Protocol
        level: must
      - item: In 'Argus Developer' format or a certified bespoke model
        level: should
      - item: Submitted in both PDF and editable electronic format
        level: should
    confidence: medium
    notes: >-
      Audit (wrong_trigger): from the audit, needed where affordable or family housing is below
      policy, or for non-residential 500 sq m+ with non-compliant BREEAM. The GLA fast-track route
      does not apply in Newham, and appraisals are published without redaction. Must-include items
      are from the council's Viability text.

  - id: waste-management-plan
    action: update
    required-if:
      always: true
    confidence: medium
    notes: "\"All proposals must confirm how waste (refuse and recycling) will be managed on site.\""

unmapped:
  - local-name: Airport Safeguarding Information (London City Airport)
    source-text: >-
      All applications and prior approvals … Details of external lighting. Details of any potential
      bird attractors such as outdoor eateries and habitat. Details of proposed cranes or other
      elevated construction equipment. In the PSZ, details of likely numbers of people on site at
      any one time relative to the current position.
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: airport-safeguarding
  - local-name: Strategic Access Management and Monitoring Strategy (SAMMS)
    source-text: "applications for planning permission and prior approval applications"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: habitats-regulations-assessment
  - local-name: Tall Buildings Study
    source-text: "in excess of 6 storeys or 17.05 metres above ground level"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: tall-buildings-statement
  - local-name: Parking & Service Details
    source-text: "From the audit: COU and FUL applications unless parking or servicing is unaffected"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: parking-plan
  - local-name: Housing Quality Statement
    source-text: "From the audit: all new housing, plus play space information where 10 or more children
      are expected"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: housing-quality-statement
  - local-name: Family Housing Statement
    source-text: "Applications for housing on sites with the capacity for 10 or more residential units
      (includes FUL/OUT/COU/REM applications)"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: family-housing-statement
  - local-name: Specialist Housing Statement
    source-text: "All proposals for new non-conventional housing, including nightly-stay hostels, student
      accommodation and C2 care-bas…"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: specialist-housing-statement
  - local-name: Infrastructure Sufficiency Statement
    source-text: "From the audit: all major development"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: infrastructure-statement
  - local-name: Economic Development Statement
    source-text: "From the audit: applications proposing employment-generating floorspace"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: economic-statement
  - local-name: Employment Strategy
    source-text: "From the audit: all major development"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: employment-statement
  - local-name: Community Facilities Statement
    source-text: "From the audit: creation, intensification or loss of community facilities such as education,
      healthcare, leisure, places of worship, pubs, public toilets"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: community-facilities-statement
  - local-name: Town Centre Sequential Test
    source-text: "From the audit: main town centre uses outside existing centres or Strategic Site allocations"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: sequential-test
  - local-name: Health Impact Assessment
    source-text: "All major residential developments and mixed use proposals"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: health-impact-assessment
  - local-name: Cumulative Impact Statement
    source-text: "From the audit: development in an identified cumulative impact zone"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: cumulative-impact-statement
  - local-name: Surface Water Drainage Strategy (with LLFA pro-forma)
    source-text: "From the audit: all major development, any application needing an FRA, and any development
      in a Critical Drainage Area"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: drainage-strategy
  - local-name: Pollution Management Statement
    source-text: "From the audit: covers air quality (all development), noise, ventilation/extraction,
      land contamination, radiation and interference"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: pollution-management-statement
  - local-name: Demolition Method Statement
    source-text: "Prior Notification of Proposed Demolition applications"
    source-url: https://www.newham.gov.uk/downloads/file/8275/newham-par-december-2024-final
    suggested-id: demolition-method-statement

low-confidence:
  - id: section-existing
    note: "The workbook's excerpt ('sections and site levels will be required') runs into the BNG text,
      so the application types (FUL, OUT, s73) come from the BNG item, not from sections."
  - id: section-proposed
    note: "The workbook's excerpt ('sections and site levels will be required') runs into the BNG text,
      so the application types (FUL, OUT, s73) come from the BNG item, not from sections."

