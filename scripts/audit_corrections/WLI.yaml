low-confidence:
  - id: archaeological-assessment
    note: >-
      Audit (wrong_trigger): the excerpt starts mid-sentence ('an appropriate desk-based assessment
      and, where necessary, a field evaluation'); the list's Archaeological Assessment row (CLLP
      S57) gives the trigger, which the audit doesn't quote.
