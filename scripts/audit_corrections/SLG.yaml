# Corrections for Slough Borough Council, from the audit.
# The workbook captured nothing: Slough's list (adopted 1 January 2026) is a public web directory
# with one record per requirement, grouped by application type into 'Always required' and 'Often
# required'. The audit read the Householder and Major categories but not each record's trigger,
# so most items below say only which category lists them. The Minor, Change of use, Listed
# building, Demolition, LDC, Advertisement and Other categories were not captured at all.
local-authority: SLG

requirements:
  - id: arboriculturist-report
    action: add
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees or hedges on the site or on adjacent land, with trees over 75mm diameter within influencing distance.
    source-text: >-
      When there are trees or hedges either on the proposed development site or on land adjacent …
      For trees with a diameter greater than 75 mm within influencing distance ... a Tree
      Survey/Report will be required
    source-url: https://www.slough.gov.uk/directory/27/local-validation-list-directory/category/61
    must-include:
      - item: Arboricultural Impact Assessment (AIA)
        level: must
      - item: Arboricultural Method Statement (AMS)
        level: must
      - item: Tree Protection Plan
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): 'Often required' for householder applications (record 35528); also listed in the Major category."

  - id: cil-form
    action: add
    source-url: https://www.slough.gov.uk/directory/27/local-validation-list-directory/category/59
    confidence: low
    notes: "From the audit (missing_requirement): CIL Form 1 is listed for householder applications; the trigger wasn't captured."

