  - local-name: Additional Plans and Drawings
    source-text: "From the audit: Additional Plans and Drawings - 'All planning applications.'"
    source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
    suggested-id: ""
  - local-name: Parking Provision
    source-text: "From the audit: all full applications, with existing and proposed block plans at 1:200"
    source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
    suggested-id: parking-plan
  - local-name: Space Standards Matrix
    source-text: "From the audit: all new dwellings including conversions; M4(2), and 3% M4(3) for affordable housing"
    source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
    suggested-id: housing-standards-statement
  - local-name: Self-build and Custom Build Statement
    source-text: "From the audit: all self-build and custom-build dwellings"
    source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
