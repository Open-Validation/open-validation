  - local-name: Foul Sewerage Assessment
    source-text: "From the audit: major development; new or changed foul systems"
    source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
    suggested-id: foul-sewage-utilities-statement
  - local-name: Health Impact Assessment and Screening
    source-text: "From the audit: major development"
    source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
    suggested-id: health-impact-assessment
  - local-name: Road Safety Audit
    source-text: "From the audit: 20+ homes or 2,000+ m2 with highway changes"
