    suggested-id: planning-obligations-heads-of-terms
  - local-name: Community Facilities Statement
    source-text: "From the audit: loss of, or new, community facilities"
    source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
    suggested-id: community-facilities-statement
  - local-name: Economic Statement
    source-text: "From the audit: net loss of employment floorspace or visitor facilities"
    source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
    suggested-id: employment-statement
  - local-name: Structural Survey
    source-text: "From the audit: refurbishment or re-use of listed or historic buildings; refurbishment of non-designated heritage assets in conservation areas; substantial or total demolition of heritage assets"
    source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
    suggested-id: structural-survey
  - local-name: Advertisement details
    source-text: "From the audit: details of each advertisement including lighting levels, and sections showing how adverts are fixed and illuminated (advertisement consent)"
    source-url: https://www.adur-worthing.gov.uk/media/Media,173952,smxx.pdf
    suggested-id: advertisement-drawings

new-fields:
  - field: scheduled-monument
    kind: designation
    label: Scheduled monument
    description: Site is in, contains or is near a scheduled monument (dataset scheduled-monument).
  - field: park-and-garden
    kind: designation
    label: Registered park and garden
    description: Site is in or near a registered historic park and garden (dataset park-and-garden).
  - field: minor-development
    kind: boolean
    label: Minor development
    description: >-
      The proposal is minor development: it creates dwellings or floorspace below the major
      development thresholds (or falls within the council's own 'minor' size band).
  - field: telecommunications-development
    kind: boolean
    label: Telecommunications development
    description: The proposal is for telecommunications development, such as a mast or antennae.
  - field: out-of-centre-town-centre-use
    kind: boolean
    label: Main town centre use outside a centre
    description: >-
      The proposal is for a main town centre use (retail, leisure, offices and similar) at an
      edge-of-centre or out-of-centre location, outside a defined town centre or primary shopping area.
