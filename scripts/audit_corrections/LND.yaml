  # wrong_app_type: the Non-material amendment rows are an old copy of the full-application list.
  - id: affordable-housing-statement
    sheets: [Non-material amendment]
    reason: "wrong_app_type: full-application list filed under Non-material amendment"
  - id: arboriculturist-report
    sheets: [Non-material amendment]
    reason: "wrong_app_type: as above"
  - id: archaeological-assessment
    sheets: [Non-material amendment]
    reason: "wrong_app_type: as above"
  - id: site-plan
