drop-unmapped:
  - local-name: Sequential / Exception Test (flood)
    reason: "duplicate: part of the 'Flood Risk Assessment and sequential test evidence' item (now in flood-risk-assessment)"
  - local-name: Biodiversity Checklist / Questionnaire
    reason: "mislabelled: the item is 'Biodiversity survey and report' (now in biodiversity-survey-report)"
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: no trigger in the excerpt; re-added below with the audit's trigger"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: a fragment of the office viability item"

requirements:
  - id: affordable-housing-statement
    action: replace
    required-if:
      condition:
        field: dwelling-count
        operator: ">="
        value: 10
        description: The proposal creates 10 or more new residential units.
    source-text: "Planning applications proposing 10 or more new residential units."
    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
    policy: "London Plan policy 3.11; Local Plan policy CS21"
    confidence: medium
    notes: "Audit (missing_requirement): the item ('Affordable Housing and Viability Statement') appeared only under Non-material amendment; it belongs to Full planning."

  - id: viability-assessment
    action: replace
    required-if:
      condition:
        field: dwelling-count
        operator: ">="
        value: 10
        description: The proposal creates 10 or more new residential units.
    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
    policy: "London Plan policy 3.11; Local Plan policy CS21"
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the Acoustic Report trigger. The checklist's 'Affordable Housing and Viability Statement' is for 10 or more new residential units."

  - id: heritage-statement
    action: add
    required-if:
      any:
        - site:
            in: [listed-building, listed-building-setting]
            description: The proposal affects a listed building or its setting.
        - site:
            in: [conservation-area]
            description: The proposal affects a conservation area or its setting.
        - site:
            in: [world-heritage-site]
            description: New buildings or major extensions that could affect the Tower of London World Heritage Site.
        - site:
            in: [park-and-garden]
            description: The proposal affects a registered park and garden.
        - all:
            - site:
                in: [locally-listed-building]
                description: The proposal affects a non-designated heritage asset.
            - condition:
                field: new-build
                value: true
                description: The proposal includes new buildings or extensions (including minor extensions).
    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
    confidence: medium
    notes: >-
      From the audit (missing_requirement): the Full and Householder checklists have heritage items
      for Listed Buildings, Conservation Areas, the Tower of London World Heritage Site, St Paul's
      Heights, Registered Parks and Gardens and Non-designated Assets; Grokbot captured none.
      St Paul's Heights is listed separately as unmapped.

  - id: flood-risk-assessment
    action: replace
    required-if:
      any:
        - site:
            in: [critical-drainage-area]
            description: The site is in the Flood Risk Area shown on the Core Strategy Proposals Map B.
        - ref: major-development
    source-text: >-
      Required for all planning applications in the Flood Risk Area shown on the Core Strategy
      Proposals Map B … and for Major development elsewhere.
    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-householder-applications-february-2016.pdf
    policy: "NPPF; Local Plan policy CS18"
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the Full planning row had only policy codes and the next heading, and
      the householder 'sequential test' row said 'all planning applications'. The item is 'Flood
      Risk Assessment and sequential test evidence'.

  - id: arboriculturist-report
    action: replace
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: The proposal is likely to affect trees within or next to the site, including street trees.
    source-text: "Required if proposal is likely to affect trees within the application site or adjacent to the site"
    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-householder-applications-february-2016.pdf
    policy: "Local Plan policy CS19"
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the householder row said 'All applications' and the Full row had the
      town centre trigger. For works to trees the checklist asks for a report on the condition of
      the trees and an arboricultural method statement.

  - id: travel-plan
    action: replace
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: The proposal includes new buildings.
        - application-type:
            in: [s73]
        - discretionary
    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
    policy: "NPPF; London Plan policy 6.3; Local Plan policy CS16"
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the town centre trigger. From the audit: new buildings, major extensions (shown as officer discretion) and s73 applications."

  - id: sustainability-statement
    action: replace
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: The proposal includes new buildings.
        - application-type:
            in: [s73]
        - discretionary
    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
    must-include:
      - item: >-
          A comprehensive assessment of the energy demand of the proposed building, the energy
          efficiency measures and low and zero carbon technologies, and carbon offsetting where
          targets cannot be met
        level: must
        source-text: >-
          The energy strategy must include a comprehensive assessment of the energy demand of the
          proposed building, all relevant proposed energy efficiency measures and low and zero
          carbon technologies to be incorporated and proposals for carbon offsetting where relevant
          targets cannot be met.
    confidence: medium
    notes: >-
      Audit (missing_requirement): the checklist's 'Sustainable development and climate change
      report' (new buildings, major extensions shown as officer discretion, and s73) was captured
      only through an Energy Statement row from the council's sustainable development web page,
      which supplies the must-include item.

  - id: biodiversity-survey-report
    action: add
    required-if:
      any:
        - condition:
            field: demolition
            value: true
            description: The proposal demolishes existing buildings.
        - condition:
            field: new-build
            value: true
            description: The proposal constructs new buildings.
    source-text: >-
      Biodiversity survey and report NPPF London Plan Policy 7.19 Local Plan policy DM19.2
      Planning permission for the demolition of existing buildings or construction of new
      buildings.
    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/validation-checklist-non-material-amendment-february-2016.pdf
    confidence: low
    notes: >-
      Audit (wrong_trigger): the Full planning row (filed as 'Biodiversity Checklist') had the
      Daylight/Sunlight trigger merged in. The trigger above is from the copy of the full list in
      the NMA file, which may be older.

  - id: noise-assessment
    action: update
    required-if:
      any:
        - condition:
            field: plant-equipment
            value: true
            description: The proposal involves new plant.
        - condition:
            field: noise-generating-use
            value: true
            description: A use that may create noise disturbance.
    notes: "Acoustic Report: 'Planning applications involving new plant or uses that may create noise disturbance' (council's wording). The audit says s73 applications are also named."

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.

  - id: sci
    action: replace
    required-if: discretionary
    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
    policy: "NPPF; Localism Act"
    confidence: medium
    notes: "Audit (not_a_requirement): the workbook quoted SPD download text. From the audit: required where community involvement was arranged before applying."

  - id: planning-statement
    action: update
    required-if:
      always: true
    notes: "Planning Statement / Supporting Information: 'All applications.' (council's wording)."

  - id: site-plan
    action: update
    required-if:
      always: true
    notes: "'A location plan and a site plan are required.' (council's wording), in every checklist."

  - id: daylight-sunlight-assessment
    action: update
    required-if:
      condition:
        field: new-build
        value: true
        description: The proposal constructs a new building or extension.

  - id: waste-management-plan
    action: update
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: The proposal includes new buildings.
        - condition:
            field: involves-change-of-use
            value: true
            description: The proposal changes the use of a building.
        - discretionary
    notes: "Waste storage and recycling facilities: 'Planning permission for new buildings, changes of use or major extensions' (council's wording); major extensions are shown as officer discretion."

  - id: section-existing
    action: update
    required-if:
      application-type:
        in: [hh, full, lbc, s73]
    notes: "Audit (wrong_app_type): the Full checklist also names s73 removal or variation of a condition for sections."

  - id: section-proposed
    action: update
    required-if:
      application-type:
        in: [hh, full, lbc, s73]
    notes: "Audit (wrong_app_type): the Full checklist also names s73 removal or variation of a condition for sections."

  - id: elevation-existing
    action: update
    required-if:
      application-type:
        in: [hh, full, lbc, advertising, demolition-con-area, s73]
    notes: "Audit (wrong_app_type): the Full checklist also names s73 removal or variation of a condition for elevations."

  - id: elevation-proposed
    action: update
    required-if:
      application-type:
        in: [hh, full, lbc, advertising, s73]
    notes: "Audit (wrong_app_type): the Full checklist also names s73 removal or variation of a condition for elevations."

