# Corrections for the City of London Corporation, from the council's audit.
# The City's forms page still links the February 2016 checklist set (Full, Householder, LBC,
# Advert, Demolition, Trees, LDC, NMA), so the build's url and date are right, though the list is
# badly outdated (a 2023 committee report suggests a review). Grokbot put an old copy of the
# full-application list under Non-material amendment, and many Full planning triggers come from
# the neighbouring table row. Items marked 'From the audit' use the audit's summary of the 2016
# checklists, not the council's exact words.
local-authority: LND

submission-standards:
  - item: Plans proportionate to the nature and size of the proposal, drawn at an identified standard metric scale, and titled and numbered
    level: should
  - item: Drawings dimensioned, drawn to an accurate metric scale and including a scale bar
    level: must
  - item: Maximum file size 2 MB (exceptionally 5 MB for long reports)
    level: must

