    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
    suggested-id: housing-standards-statement
  - local-name: Sustainable Urban Drainage Systems (SuDS) / Drainage Plan
    source-text: "From the audit: SuDS/Drainage Plan - 'Major applications'"
    source-url: https://www.cityoflondon.gov.uk/assets/Services-Environment/Validation-checklist-full-february-2016.pdf
    suggested-id: drainage-strategy

low-confidence:
  - id: transport-assessment
    note: "The Full planning excerpt ends with the town centre trigger ('major shopping proposals'), the same error the audit found in the Travel Plan row; re-check the trigger."

new-fields:
  - field: park-and-garden
    kind: designation
    label: Registered park and garden
    description: Site is in or near a registered historic park and garden (dataset park-and-garden).
