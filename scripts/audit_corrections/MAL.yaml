# Corrections for Maldon District Council, from inputs/audit/ (Maldon audit).
# Grokbot's link is still the current 'Planning Validation Requirements List' (June 2022). The
# audit found about 18 local items missing (heritage, drawings and more) and several garbled
# triggers and misplaced application types. Items marked 'From the audit' use the audit's summary
# of the list, not the council's wording.
local-authority: MAL

submission-standards:
  - item: All drawings suitable for scanning and display electronically
    level: must
  - item: Drawings show a written scale and/or a scale bar
    level: must

drop-unmapped:
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: a fragment of the Flood Risk Assessment text; SuDS Checklist re-added below"
  - local-name: Highways / access details (visibility splays)
    reason: "not_a_requirement: a fragment of the block plan contents"
  - local-name: Tall buildings / Wind microclimate assessment
    reason: "duplicate: the Daylight/Sunlight Assessment trigger; the list has no wind assessment"
  - local-name: Structural Survey
    reason: "wrong_trigger: the excerpt is Land Contamination text; re-added below"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: S106 legal-costs text; re-added below"
  - local-name: Biodiversity Checklist / Questionnaire
    reason: "wrong_trigger: garbled; re-added below with its scope"

requirements:
  - id: affordable-housing-statement
    action: replace
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">"
            value: 10
            description: More than 10 dwellings.
        - condition:
            field: housing-floorspace
            operator: ">="
            value: 1000
            description: 1,000 square metres or more of housing floorspace.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt was interleaved column text; the threshold is
      'more than 10 dwellings or 1,000 sqm+' (audit's summary).

  - id: air-quality-assessment
    action: replace
    required-if:
      any:
        - site:
            in: [air-quality-management-area]
            description: Development within a designated Air Quality Management Area.
        - condition:
            field: dwelling-count
            operator: ">"
            value: 50
            description: More than 50 dwellings.
        - condition:
            field: biomass-or-chp
            value: true
            description: The proposal includes biomass burners.
        - discretionary
    source-text: >-
      Developments that may introduce a significant impact on air quality i.e. >50 dwellings,
      industrial emissions, bio mass burners or major construction projects
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    must-include:
      - item: An assessment of the potential impacts of the development on local air quality
        level: must
      - item: The proposed mitigation measures, where necessary
        level: should
    confidence: medium
    notes: >-
      Audit (wrong_app_type): the workbook put this under Outline only; the trigger is location and
      scale based. Industrial emissions and major construction projects are shown as officer
      discretion.

  - id: arboriculturist-report
    action: update
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees or hedges within or adjacent to the site that could influence or
          be affected by the development.
    confidence: medium

  - id: biodiversity-survey-report
    action: update
    required-if:
      any:
        - condition:
            field: protected-species
            value: true
            description: Protected and priority species are known or have the potential to be present.
        - discretionary
    confidence: low
    notes: >-
      The trigger is from a garbled tab item ('Where protected and priority species are known or have
      the potential to be present an Extended … Phase 1 Habitat Survey should be carried out'). The
      audit says it also applies to householder applications.

  - id: daylight-sunlight-assessment
    action: update
    required-if: discretionary
    must-include:
      - item: Diagrams of how the shadows of the building will impact on neighbours for all four
          quarters of the year
        level: should
    confidence: medium
    notes: >-
      'All applications for tall buildings and proposals that break the established building grain
      and street pattern or there will be an effect on light sensitive buildings' (no field for these,
      so shown as officer discretion).

  - id: design-and-access-statement
    action: update
    confidence: low
    notes: >-
      The workbook's excerpt is run-on text from other items. National rules apply; the audit notes
      the list asks for a DAS for householder works in a Conservation Area.

  - id: elevation-existing
    action: add
    required-if:
      condition:
        field: building-works
        value: true
        description: The proposal involves operational development.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    must-include:
      - item: Scale 1:50 or 1:100 (metric), with a unique drawing number and a written scale and/or
          scale bar
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): Full Elevations for operational development, including
      householder. The scale item is from the council's drawing notes."

  - id: elevation-proposed
    action: add
    required-if:
      condition:
        field: building-works
        value: true
        description: The proposal involves operational development.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    must-include:
      - item: Scale 1:50 or 1:100 (metric), with a unique drawing number and a written scale and/or
          scale bar
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): Full Elevations for operational development, including
      householder. The scale item is from the council's drawing notes."

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: Development in Schedule 1 or 2 of the EIA Regulations that would constitute EIA
          development.
    source-text: >-
      Environmental Impact Statement Required in connection with all development identified within
      Schedule 1 or 2 of the Regulations and which in accordance with Schedule 3 would constitute EIA
      development
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt was a fragment; the full sentence was in the
      Economic Statement row."

  - id: flood-risk-assessment
    action: update
    required-if:
      any:
        - site:
            in: [flood-risk-zone]
            description: The site is in a flood zone (householders in Zones 2/3 complete the EA
              matrix).
        - site:
            in: [critical-drainage-area]
            description: The site is in a critical drainage area.
    must-include:
      - item: The design of surface water management systems, including Sustainable Drainage (SuDS)
        level: should
      - item: Safe access to and from the development in areas at risk of flooding
        level: should
    confidence: medium
    notes: >-
      'Flood risk assessment in flood zone 1 and critical drainage areas'; the audit adds
      'Householders in Zones 2/3 complete the EA matrix'. The Flood Zone 1 size test was not
      extracted.

  - id: floor-plan-existing
    action: add
    required-if:
      condition:
        field: building-works
        value: true
        description: The proposal involves operational development.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: "From the audit (missing_requirement): Floor Plans for operational development, including
      householder."

  - id: floor-plan-proposed
    action: add
    required-if:
      condition:
        field: building-works
        value: true
        description: The proposal involves operational development.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: "From the audit (missing_requirement): Floor Plans for operational development, including
      householder."

  - id: heritage-statement
    action: add
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building, listed-building-setting, conservation-area,
              locally-listed-building]
            description: The proposal affects a designated or non-designated heritage asset.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: "From the audit (missing_requirement): affects designated/non-designated heritage assets;
      all LBC. Also for householder, advertisement and demolition in a conservation area."

  - id: land-contamination-assessment
    action: replace
    required-if:
      site:
        in: [contaminated-land]
        description: Contamination is known or suspected (potentially contaminative former use such
          as industrial, commercial or agricultural).
    source-text: >-
      Where contamination is known or suspected, i.e. potentially contaminative former use such as
      industrial/commercial/agricultural If the applicant does not consider a Contaminated Land
      Assessment is necessary for the site a full justification of reasons should be submitted i.e.
      site has only ever been a residential garden
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    must-include:
      - item: Carried out by or under the direction of a suitably qualified competent person, in line
          with relevant guidance including BS10175:2011
        level: should
    confidence: medium
    notes: >-
      Audit (wrong_app_type): the workbook filed this under listed building consent from adjacent
      text. The must-include item was in the workbook's structural survey row.

  - id: landscaping-plan
    action: update
    required-if:
      ref: major-development
    must-include:
      - item: All public and private spaces, including open space, sports pitches and play
          facilities, green infrastructure, biodiversity habitats, water bodies and landscape
          buffers
        level: must
      - item: Hard surfaces, boundary treatment and all soft landscaping proposed
        level: must
    confidence: medium
    notes: "Audit (wrong_app_type): the Landscape Strategy is for major residential/commercial schemes."

  - id: lighting-assessment
    action: add
    required-if:
      condition:
        field: floodlighting
        value: true
        description: The proposal includes external floodlighting.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: "From the audit (missing_requirement): Lighting Assessment for external floodlighting."

  - id: noise-assessment
    action: add
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: low
    notes: "From the audit (missing_requirement): Noise Impact Assessment/Acoustic Report is listed; the
      audit gives no trigger."

  - id: roof-plan-existing
    action: add
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: The roof is altered.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: "From the audit (missing_requirement): Roof Plans where the roof is altered."

  - id: roof-plan-proposed
    action: add
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: The roof is altered.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: "From the audit (missing_requirement): Roof Plans where the roof is altered."

  - id: section-existing
    action: add
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: There are level changes or the site slopes.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: "From the audit (missing_requirement): Site Sections for level changes or sloping sites."

  - id: section-proposed
    action: add
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: There are level changes or the site slopes.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: "From the audit (missing_requirement): Site Sections for level changes or sloping sites."

  - id: site-plan
    action: update
    confidence: medium
    notes: >-
      Block Plan: 'All applications'. The audit notes this covers householder, advertisement,
      reserved matters and demolition in a conservation area as well as full applications.

  - id: telecommunications-report
    action: add
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: Telecommunications development.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    must-include:
      - item: A signed radio-frequency declaration
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): Telecommunications Development, with a signed
      radio-frequency declaration."

  - id: town-centre-impact-assessment
    action: add
    required-if:
      any:
        - condition:
            field: town-centre-use-floorspace
            operator: ">"
            value: 2500
            description: Retail or leisure floorspace over 2,500 square metres.
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Retail or leisure development out of centre.
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: "From the audit (missing_requirement): Retail or Leisure Impact Assessment, >2,500 sqm or
      out-of-centre."

  - id: transport-assessment
    action: add
    required-if:
      ref: major-development
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: medium
    notes: "From the audit (missing_requirement): Transport Assessment for major development."

  - id: waste-management-plan
    action: add
    required-if: discretionary
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    confidence: low
    notes: >-
      From the audit (missing_requirement): Recycling/Waste Strategy for new flats or HMOs. No field
      captures flats or HMOs, so it is shown as officer discretion.

unmapped:
  - local-name: Biodiversity Check List
    source-text: "Biodiversity Check List All Major Applications – (Once published)"
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    suggested-id: biodiversity-checklist
  - local-name: Structural Survey
    source-text: "Barn conversions or re-use of rural buildings; demolition of part of a heritage
      building"
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    suggested-id: structural-survey
  - local-name: Heads of Terms (S106)
    source-text: "From the audit: all major developments"
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    suggested-id: heads-of-terms
  - local-name: SuDS Checklist
    source-text: "From the audit: major development or sites in a Critical Drainage Area"
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    suggested-id: drainage-strategy
  - local-name: Street Scene Elevation
    source-text: "From the audit: operational development fronting a highway; at a recognised scale
      (e.g. 1:100 or 1:200), covering at least 30 metres or two dwellings either side, whichever is
      less"
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    suggested-id: street-scene-elevation
  - local-name: Amendment Statement
    source-text: "From the audit: revised applications after a previous approval, refusal or withdrawal"
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    suggested-id: amendment-statement
  - local-name: Loss of Employment Land Justification
    source-text: "From the audit: listed; no trigger given"
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    suggested-id: marketing-evidence
  - local-name: Renewable Energy Statement
    source-text: "From the audit: air source heat pumps, solar PV/thermal, biomass, CHP"
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    suggested-id: renewable-energy-statement
  - local-name: Ventilation / Extraction details
    source-text: "From the audit: A3/A4/A5 uses and non-householder extraction"
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    suggested-id: ventilation-extraction-details
  - local-name: Wind Turbine Statement
    source-text: "From the audit: listed; no trigger given"
    source-url: https://www.maldon.gov.uk/downloads/file/18194/planning_validation_list_2022
    suggested-id: wind-turbine-statement

low-confidence:
  - id: planning-statement
    note: "The excerpt is a fragment ('Access or Planning Statement.'); no trigger given."
  - id: travel-plan
    note: "The excerpt is run-on text from other items; no trigger given."
