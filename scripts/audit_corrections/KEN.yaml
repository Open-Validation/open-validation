low-confidence:
  - id: bng-metric
    note: >-
      The excerpt is the national statutory BNG text. From the audit: the Reg 3 note (4.2) also asks
      for a draft Biodiversity Gain Plan (listed as unmapped).
  - id: photos
    note: "Audit (wrong_trigger): the excerpt is BNG exemption text ('site photographs demonstrating the exemption should apply'), not a photographs trigger."
  - id: section-existing
    note: "Audit (wrong_trigger, wrong_app_type): the excerpt is a fragment from the minerals and waste note ('should include topographic surveys and cross-section drawings.')."
  - id: section-proposed
    note: "Audit (wrong_trigger, wrong_app_type): the excerpt is a fragment from the minerals and waste note ('should include topographic surveys and cross-section drawings.')."

