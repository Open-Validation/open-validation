# Corrections for Portsmouth City Council, from the council's audit.
# The audit could not fetch the live page (fetch budget ran out), so its findings come from
# Grokbot's own extracts of the 'Validation Checklist for Planning Applications - 2024' PDF.
# Many rows were guessed into Full planning; location-based triggers apply to all types.
local-authority: POR

validation-list:
  url: 
    https://www.portsmouth.gov.uk/wp-content/uploads/2024/07/VALIDATION-CHECKLIST-FOR-PLANNING-APPLICATIONS-2024.pdf
  date: 2024-07-23
  date-basis: "audit summary: list date 'should be 23 July 2024'; the live page could not be checked"

submission-standards:
  - item: Plans marked 'Do Not Scale', or similar, cannot be accepted
    level: must
  - item: All plans must have a scale bar
    level: must
  - item: Plans show the original paper size
    level: should

drop:
  - id: section-existing
    reason: "wrong_trigger: the excerpt is floor-area / headroom text, not site levels or sections"
  - id: section-proposed
    reason: "wrong_trigger: as above"
  - id: planning-statement
    reason: "wrong_trigger: the excerpt is the tail of the retail sequential-test requirement (now in
      town-centre-impact-assessment)"

drop-unmapped:
  - local-name: Habitats Regulations Assessment information / SPA mitigation
    reason: "wrong_trigger: a tail fragment; re-added below with the council's trigger"
  - local-name: Parking provision / Parking plan
    reason: "wrong_trigger: a fragment ('SPD on Parking Standards and Transport Assessments.') with no
      requirement"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: the excerpt is the viability assessment sentence (now in viability-assessment)"
  - local-name: Advertisement drawings / illumination details
    reason: "duplicate: a fragment of the elevations annotation rule (now a must-include of elevation-proposed)"

requirements:
  - id: air-quality-assessment
    action: update
    required-if:
      any:
        - site:
            in: [air-quality-management-area]
            description: The development is inside or adjacent to an Air Quality Management Area.
        - discretionary
    source-text: >-
      Air Quality Impact Assessment – Where a development is proposed inside, or adjacent to an air
      quality management area (AQMA), or where the development could in itself result in the
      designation of an AQMA or where the grant of planning permission would conflict with, or
      render unworkable, elements of a local authority’s air quality action plan…
    confidence: medium
    notes: "Developments that could cause an AQMA designation or conflict with the action plan are shown
      as officer discretion."

  - id: arboriculturist-report
    action: update
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees on or adjacent to the site that the development would affect.
    confidence: medium
    notes: "Audit (wrong_app_type): location-based, so it applies to householder and other types too."

  - id: construction-management-plan
    action: update
    required-if: discretionary
    confidence: medium
    notes: "'In respect of larger or complex sites where the development work itself will have likely
      adverse environmental effects a CEMP may be required.'"

  - id: land-contamination-assessment
    action: update
    required-if:
      all:
        - site:
            in: [contaminated-land]
            description: The risk of contamination or gassing is known to be present on site.
        - any:
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The proposal creates a new dwellinghouse.
            - condition:
                field: residential-extension
                value: true
                description: The proposal extends a residential property.
            - condition:
                field: floorspace-non-residential
                operator: ">"
                value: 250
                description: Commercial redevelopment with an area greater than 250 square metres.
    must-include:
      - item: A desk-top study outlining historical uses
        level: must
    confidence: medium
    notes: "Audit (wrong_app_type): the trigger includes extensions to residential properties, so it also
      applies to householder applications."

  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: The development provides one or more dwellinghouses.
        - condition:
            field: floorspace
            operator: ">="
            value: 100
            description: The development provides a building of 100 square metres or more.
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building]
            description: The development affects a listed building.
    source-text: >-
      Design and Access Statement (required for all Major development, development providing one or
      more dwelling-house, development providing a building creating a floorspace of 100 square
      metres or more, or developments effecting listed buildings)
    source-url: 
      https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
    confidence: medium
    notes: "Audit (wrong_app_type): the trigger is not tied to Full planning; it also covers outline applications."

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development falls within Schedule 1 or 2 of the EIA Regulations.
    confidence: medium

  - id: flood-risk-assessment
    action: update
    required-if:
      site:
        in: [flood-risk-zone]
        description: Any part of the development is in flood zone 2 or 3.
    confidence: medium
    notes: "Audit (wrong_app_type): location-based, so it applies to householder and other types too."

  - id: floor-plan-existing
    action: update
    source-text: Floor plans – Existing and proposed floor plans of all floors drawn to a metric 
      scale of 1:50 or 100 and showing the direction of North.
    must-include:
      - item: All floors
        level: must
      - item: Metric scale of 1:50 or 1:100
        level: must
      - item: Direction of north
        level: must
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the HMO rule; the contents are from the council's
      drawing standards."

  - id: floor-plan-proposed
    action: update
    source-text: Floor plans – Existing and proposed floor plans of all floors drawn to a metric 
      scale of 1:50 or 100 and showing the direction of North.
    must-include:
      - item: All floors
        level: must
      - item: Metric scale of 1:50 or 1:100
        level: must
      - item: Direction of north
        level: must
      - item: Internal layout of the accommodation and every room within it, with a schedule of 
          gross internal floor areas
        level: must
        required-if:
          condition:
            field: housing-type
            value: hmo
            description: The proposal is for a House in Multiple Occupancy.
        source-text: "Multiple Occupancy, floor plans must show the internal layout of that accommodation
          and every room within it, accompanied by a schedule of the gross internal floor areas of the
          proposed accommodation."
    confidence: medium
    notes: "Audit (wrong_trigger): the HMO rule applies only to HMO proposals, so it is an item with its
      own rule."

  - id: elevation-existing
    action: update
    source-text: Elevations – Existing and proposed elevations of all elevations drawn to a metric 
      scale of 1:50 or 1:100.
    must-include:
      - item: All elevations
        level: must
      - item: Metric scale of 1:50 or 1:100
        level: must
      - item: Annotated with their orientation (north/south and/or front/rear)
        level: should
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the HMO floor-plan rule; the contents are from
      the council's drawing standards."

  - id: elevation-proposed
    action: update
    source-text: Elevations – Existing and proposed elevations of all elevations drawn to a metric 
      scale of 1:50 or 1:100.
    must-include:
      - item: All elevations
        level: must
      - item: Metric scale of 1:50 or 1:100
        level: must
      - item: Annotated with their orientation (north/south and/or front/rear)
        level: should
      - item: Annotations for the location of proposed materials
        level: should
      - item: Details of colour, and method and colour of illumination
        level: should
        required-if:
          application-type:
            in: [advertising]
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the HMO floor-plan rule; the contents are from
      the council's drawing standards."

  - id: site-plan
    action: add
    source-text: >-
      Block Plan (or Site Plan) - showing the full application site, including all land associated
      with the site (e.g. front and rear gardens), drawn to a metric scale of 1:500 and showing at
      least immediately adjoining neighbouring buildings and features.
    source-url: 
      https://www.portsmouth.gov.uk/wp-content/uploads/2024/07/VALIDATION-CHECKLIST-FOR-PLANNING-APPLICATIONS-2024.pdf
    must-include:
      - item: The full application site, including all land associated with it (e.g. front and rear 
          gardens)
        level: must
      - item: Metric scale of 1:500
        level: must
      - item: At least the immediately adjoining neighbouring buildings and features
        level: must
    confidence: medium
    notes: "From the council's drawing standards; the audit says these apply to every application type."

  - id: town-centre-impact-assessment
    action: update
    required-if:
      all:
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Located outside designated town centres.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 2500
            description: Town centre uses with a floorspace larger than 2,500 square metres.
    must-include:
      - item: A sequential assessment
        level: should
      - item: An assessment of likely impacts
        level: should
    confidence: medium

  - id: viability-assessment
    action: update
    required-if: discretionary
    source-text: for certain planning obligations, they will normally be requested to supply a 
      viability assessment produced by a suitably qualified expert.
    must-include:
      - item: Produced by a suitably qualified expert
        level: must
    confidence: medium
    notes: "The trigger sentence is cut off at the start in the workbook; shown as officer discretion."

unmapped:
  - local-name: Habitat Regulations Assessment
    source-text: "Habitat Regulations Assessment – For any development creating new dwellinghouses, hotel
      bedspaces, or other use that increases overnight stays an assessment of the Likely Significant Effect
      on the Special Protection Areas surrounding Portsmouth should be submitted. This will need to include
      the applications response to the Council’s Revised Interim Nutrient Neutral Strategy and the Solent
      Recreation Mitigation Strategy."
    source-url: 
      https://www.portsmouth.gov.uk/services/development-and-planning/planning-applications/planning-application-validation-checklists
    suggested-id: habitats-regulations-assessment

low-confidence:
  - id: archaeological-assessment
    note: "Audit (wrong_trigger): the excerpt starts mid-sentence; the trigger was not captured."
  - id: transport-assessment
    note: "Audit (wrong_trigger): the excerpt is a fragment ('Standards and Transport Assessments.');
      the trigger was not captured."
  - id: cil-form
    note: "Audit (wrong_trigger): no trigger was captured. Portsmouth does charge CIL; the audit expects
      new dwellings or the relevant floorspace threshold."

