low-confidence:
  - id: waste-management-plan
    note: >-
      The workbook row is 3d Bin Stores / Recycling Facilities ("Required for all new development
      which would result in the need for new or additional bin storage or recycling facilities"),
      not a site waste management plan (List 1 item 30, see unmapped). Check the mapping.
  - id: viability-assessment
    note: "The workbook's excerpt is a fragment ('policy compliant, a viability statement will need to be
      submitted'); re-read item 3a in List 1."
