# Corrections for Herefordshire Council, from inputs/audit/herefordshire-council.json.
# Grokbot captured only the Biodiversity and Ecology compliance checklist (Core Strategy SS6/LD2).
# The council's validation guidance is the 'What to submit with your planning application' page,
# with its drawing rules and two "submit if relevant" checklists (biodiversity and climate change).
# The PDF itself is robots-blocked, so its contents were not re-read. Items marked "From the
# audit" use the audit's paraphrase of the page, not the council's exact words.
# Not covered: the 'Common reasons why a planning application is invalid' PDF linked from the page
# was not read (robots-blocked); the garbled HRA tab item is left out (not_a_requirement).
local-authority: HEF

validation-list:
  url: https://www.herefordshire.gov.uk/planning-and-building-control/planning-services/apply-for-planning-permission/what-to-submit-with-your-planning-application/
  date: ""
  date-basis: >-
    audit: the 'What to submit' page text gives no adoption or publication date (page metadata
    only: created/modified 30 Jun 2025). The workbook's 2020-11-01 was the biodiversity
    checklist PDF's creation date

submission-standards:
  - item: A bar scale on all plans
    level: must
  - item: The paper size and scale stated on each plan (e.g. 1:50 at A1)
    level: must
  - item: A north point on plans
    level: must
  - item: A unique reference and date on each plan
    level: must
  - item: Documents not bound or stapled; one copy only
    level: must
  - item: Submit either electronically or on paper, not both; electronic submissions via the
      Planning Portal, with no A0 drawings submitted electronically
    level: must
  - item: No photographs of drawings
    level: must

drop:
  - id: photos
    reason: >-
      not_a_requirement: the excerpt is the evidence an applicant gives instead of an ecological
      survey (part of the biodiversity checklist), not a standalone requirement

requirements:
  - id: biodiversity-survey-report
    action: replace
    required-if: discretionary
    policy: "Herefordshire Core Strategy SS6, LD2"
    source-text: >-
      This will need to include a preliminary ecological appraisal (PEA) and/ or preliminary roost
      appraisal (PRA) where bats may be affected, together with further survey, impact assessment
      and details of ecology protection, avoidance or mitigation measures where appropriate (Refer
      to guidance below*).
    source-url: https://www.herefordshire.gov.uk/media/4j5badjm/ss6_ld2_biodiversity_ecology_compliance_checklist.pdf
    confidence: medium
    notes: >-
      Audit (wrong_app_type): the workbook placed this under Full planning only, by inference. The
      council's Biodiversity and ecology compliance checklist is to be submitted 'if relevant to
      your application', with no application types stated, so it is shown as officer discretion
      for any type. Where there is no likely ecological impact, photographs and/or other evidence
      showing this may be given instead.

  - id: sustainability-statement
    action: add
    required-if: discretionary
    policy: "Herefordshire Core Strategy SS1, SD1"
    source-url: https://www.herefordshire.gov.uk/media/kxcca3ky/ss_sd1_climate_change_compliance_checklist.pdf
    confidence: medium
    notes: >-
      From the audit (missing_requirement): the council asks for a 'Climate change compliance
      checklist' alongside the biodiversity checklist, to be submitted if relevant to the
      application.

  - id: location-plan
    action: add
    source-url: https://www.herefordshire.gov.uk/planning-and-building-control/planning-services/apply-for-planning-permission/what-to-submit-with-your-planning-application/
    must-include:
      - item: Based on recent Ordnance Survey or equivalent mapping, not Land Registry plans
        level: must
      - item: Not reused from an earlier application
        level: must
      - item: Crown copyright and licence number shown
        level: must
      - item: Not a photocopy or screen grab
        level: must
    confidence: medium
    notes: >-
      From the audit (missing_requirement): the 'What to submit' page's local rules for location
      plans. These items are the audit's summary of the page.

