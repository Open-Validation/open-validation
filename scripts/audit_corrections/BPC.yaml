# Corrections for Bournemouth, Christchurch and Poole Council, from the council's audit.
# The audit found the current list (Local validation checklist, revised checklist adopted by
# Cabinet on 4 February 2026) but could not fetch the PDF or the 'Requirements matrix'
# (contents_checked: false). These corrections rest on Grokbot's excerpts and the errors the audit
# found in them: many rows were filed under the wrong application type (they came from combined or
# unrelated type-specific checklists), and many excerpts are tick-list bleed. Where an excerpt
# states clearly when the document is needed, the trigger is structured. The type-specific
# checklists are not linked from the current validation page and may predate the 2026 list.
local-authority: BPC

submission-standards:
  - item: All plans and documents submitted in PDF format
    level: must

drop:
  # Advertisement consent: rows from the combined 'Planning Permission and Consent to display
  # advertisements' checklist; they belong to the planning permission element.
  - id: arboriculturist-report
    sheets: [Advertisement consent]
    reason: "wrong_app_type: from the combined planning permission and advert checklist"
  - id: biodiversity-survey-report
    sheets: [Advertisement consent]
    reason: "wrong_app_type: as above"
  - id: environmental-statement
    sheets: [Advertisement consent]
    reason: "wrong_app_type: as above"
  - id: fire-statement
    sheets: [Advertisement consent]
    reason: "wrong_app_type: as above"
  - id: flood-risk-assessment
    sheets: [Advertisement consent]
    reason: "wrong_app_type: as above"
  - id: design-and-access-statement
    sheets: [Advertisement consent]
    reason: "wrong_app_type: as above"
  # Listed building consent: FRA row from the 'Householder and Listed Building' checklist.
  - id: flood-risk-assessment
    sheets: [Listed building consent]
    reason: "wrong_app_type: from the combined householder and listed building checklist"
  # Permission in principle: every row came from the Technical Details Consent checklist.
  - id: arboriculturist-report
    sheets: [Permission in principle]
    reason: "wrong_app_type: from the Technical Details Consent (stage 2) checklist, not PiP"
  - id: site-plan
    sheets: [Permission in principle]
    reason: "wrong_app_type: as above"
  - id: design-and-access-statement
    sheets: [Permission in principle]
    reason: "wrong_app_type: as above"
  - id: biodiversity-survey-report
    sheets: [Permission in principle]
    reason: "wrong_app_type: as above"
  - id: environmental-statement
    sheets: [Permission in principle]
    reason: "wrong_app_type: as above"
  - id: fire-statement
    sheets: [Permission in principle]
    reason: "wrong_app_type: as above"
  - id: flood-risk-assessment
    sheets: [Permission in principle]
    reason: "wrong_app_type: as above"
  - id: floor-plan-existing
    sheets: [Permission in principle]
    reason: "wrong_app_type: as above"
  - id: floor-plan-proposed
    sheets: [Permission in principle]
    reason: "wrong_app_type: as above"
  - id: elevation-existing
    sheets: [Permission in principle]
    reason: "wrong_app_type: as above"
  - id: elevation-proposed
    sheets: [Permission in principle]
    reason: "wrong_app_type: as above"
  # Change of use - prior approval: rows came from the demolition, 'new dwellinghouses on detached
  # blocks of flats', agricultural building and demolition-and-rebuild checklists.
  - id: arboriculturist-report
    sheets: [Change of use - prior approval]
    reason: "wrong_app_type: from the demolition prior approval checklist, not a change of use"
  - id: biodiversity-survey-report
    sheets: [Change of use - prior approval]
    reason: "wrong_app_type: as above"
  - id: site-plan
    sheets: [Change of use - prior approval]
    reason: "wrong_app_type: from the agricultural building prior approval checklist"
  - id: land-contamination-assessment
    sheets: [Change of use - prior approval, Full planning]
    reason: "wrong_app_type: from the 'new dwellinghouses on detached blocks of flats' prior approval
      checklist (a tick-list of prior approval matters)"
  - id: flood-risk-assessment
    sheets: [Change of use - prior approval]
    reason: "wrong_app_type: as above"
  - id: planning-statement
    sheets: [Change of use - prior approval, Full planning]
    reason: "wrong_app_type: as above; the local list's own Planning Statement item is for minerals and
      waste schemes"
  - id: floor-plan-existing
    sheets: [Change of use - prior approval]
    reason: "wrong_app_type: from the demolition and new dwellinghouses prior approval checklist"
  - id: floor-plan-proposed
    sheets: [Change of use - prior approval]
    reason: "wrong_app_type: as above"
  - id: elevation-existing
    sheets: [Change of use - prior approval]
    reason: "wrong_app_type: as above"
  - id: elevation-proposed
    sheets: [Change of use - prior approval]
    reason: "wrong_app_type: as above"
  # Outline: EIA and Fire Statement rows came from the Reserved Matters checklist.
  - id: environmental-statement
    sheets: [Outline]
    reason: "wrong_app_type / duplicate: from the Reserved Matters checklist"
  - id: fire-statement
    sheets: [Outline]
    reason: "wrong_app_type / duplicate: from the Reserved Matters checklist"
  # Full planning rows carrying another item's text.
  - id: schedule-of-works
    reason: "wrong_trigger / duplicate: the excerpt is the Arboricultural Method Statement text"
  - id: floor-plan-existing
    sheets: [Full planning]
    reason: "wrong_trigger: the excerpt is cycle store text (kept as the cycle parking item)"
  - id: floor-plan-proposed
    sheets: [Full planning]
    reason: "wrong_trigger: as above"
  - id: elevation-existing
    sheets: [Full planning]
    reason: "wrong_trigger: as above"
  - id: elevation-proposed
    sheets: [Full planning]
    reason: "wrong_trigger: as above"

drop-unmapped:
  - local-name: Sequential / Exception Test (flood)
    reason: "wrong_app_type: filed under Householder and change of use prior approval, which the text
      exempts; re-added below without a type"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: a cut-off fragment running into the appendices, filed under Householder;
      re-added below"
  - local-name: Ground investigation / Geotechnical / Basement Impact Assessment
    reason: "wrong_trigger: runs into the Lighting Assessment trigger; re-added below as the geotechnical
      report only"
  - local-name: Highways / access details (visibility splays)
    reason: "wrong_trigger: a block plan content list (now must-include items on site-plan)"
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: a fragment of the Flood Risk Assessment text"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: fragments ('will require a S106 agreement.'; tick-list text on the LDC
      checklist)"

requirements:
  - id: bng-metric
    action: update
    required-if:
      condition:
        field: biodiversity-gain-condition
        value: true
        description: The development is subject to the statutory biodiversity gain condition (unless
          exempt).

  - id: environmental-statement
    action: replace
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development falls within Part 1 or Part 2 of the EIA Regulations.
    source-text: >-
      Developments Requiring Environmental Impact Assessment (EIA) Environment Statement When Required
      Will be required for all developments falling within Part 1 or Part 2 of the EIA Regulations.
    source-url:
      https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the type-specific checklist rows only repeated tick-list text."

  - id: heritage-statement
    action: add
    required-if:
      application-type:
        in: [lbc, demolition-con-area]
    source-text: Design and Access Statement Heritage Asset Statement Tick Local Requirements
    source-url:
      https://www.bcpcouncil.gov.uk/documents/planning-and-building-control/Listed-Building-Consent-Checklist.pdf
    confidence: low
    notes: >-
      From the audit (missing_requirement): a Heritage Asset Statement appears in the Householder,
      listed building, demolition in a conservation area and advert checklist excerpts, but the
      workbook had no row. Its trigger in the current list (and whether householder works affecting
      heritage assets need one) could not be checked.

  - id: coastal-change-assessment
    action: add
    source-url:
      https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
    confidence: low
    notes: >-
      From the audit (missing_requirement): the validation page links a 'Coastal vulnerability
      assessment template, including geotechnical appraisal report template', but the list could
      not be read, so no trigger is given.

  - id: lighting-assessment
    action: replace
    required-if:
      any:
        - ref: major-development
        - condition:
            field: floodlighting
            value: true
            description: The scheme involves the provision of floodlighting.
        - all:
            - application-type:
                in: [advertising]
            - condition:
                field: illuminated
                value: true
                description: Illuminated advertisements are proposed.
        - discretionary
    source-text: >-
      Lighting Assessment For major developments; or schemes involving the provision of
      floodlighting; or where the lighting from the proposal would result in a material impact.
    source-url:
      https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
    must-include:
      - item: A layout plan with beam orientation
        level: must
        required-if:
          application-type:
            in: [advertising]
        source-text: >-
          Where illuminated advertisements are proposed, we will need layout plan with beam
          orientation and a schedule of the equipment in the design of the sign and will also need
          to know when the sign is switched on.
      - item: A schedule of the equipment in the design of the sign
        level: must
        required-if:
          application-type:
            in: [advertising]
      - item: When the sign is switched on
        level: must
        required-if:
          application-type:
            in: [advertising]
    confidence: medium
    notes: >-
      "Where the lighting from the proposal would result in a material impact" is shown as officer
      discretion. The advert items are from the advertisement consent checklist.

  - id: roof-plan-existing
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: A roof would be created or altered by the proposal.
    source-text: Roof Plans If any roof would be created or altered by the proposal.
    notes: "Audit (wrong_trigger): the workbook excerpt began with the PDF format rule; trimmed."

  - id: roof-plan-proposed
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: A roof would be created or altered by the proposal.
    source-text: Roof Plans If any roof would be created or altered by the proposal.
    notes: "Audit (wrong_trigger): the workbook excerpt began with the PDF format rule; trimmed."

  - id: section-existing
    action: update
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: Excavation is proposed (beyond that required for foundations).
    must-include:
      - item: Ground levels, existing and proposed (as datum points)
        level: must

  - id: section-proposed
    action: update
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: Excavation is proposed (beyond that required for foundations).
    must-include:
      - item: Ground levels, existing and proposed (as datum points)
        level: must

  - id: site-plan
    action: update
    must-include:
      - item: Scale of 1:200 or 1:500
        level: must
      - item: The proposed development, neighbouring properties, site boundaries, any hardstanding
          and/or car park
        level: must
      - item: All public rights of way crossing or adjoining the site
        level: must
        source-text: >-
          e) All public rights of way crossing or adjoining the site f) The position of all trees on
          the site, and those on adjacent land g) The extent and type of any hard surfacing h)
          Boundary treatment including walls or fencing where this is proposed
      - item: The position of all trees on the site, and those on adjacent land
        level: must
      - item: The extent and type of any hard surfacing
        level: must
      - item: Boundary treatment including walls or fencing, where this is proposed
        level: must
    notes: >-
      The content items are from the local checklist's block plan text, which the workbook had filed
      as a separate 'Highways / access details' row.

  - id: planning-statement
    action: replace
    required-if:
      application-type:
        in: [mineral-app, waste-dev]
    source-text: >-
      Minerals & Waste Developments Planning Statement Whilst this is only a validation requirement
      for Mineral and Waste schemes, they are a helpful tool for officers in the assessment of
      planning applications more generally.
    source-url:
      https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
    confidence: medium
    notes: "The other workbook rows came from a prior approval checklist (wrong_app_type)."

unmapped:
  - local-name: Sequential / Exception Test (flood)
    source-text: >-
      Flooding Sequential Test The Sequential Test is required for all sites in Flood Zones 2 & 3,
      except where: is a householder development like residential extensions, conservatories or loft
      conversions is a small non-domestic extensions with a footprint of less than 250 square metres
      is a change of use (except changes of use to a caravan, camping or chalet site, or to a mobile
      home or park home site) …
    source-url:
      https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
    suggested-id: flood-sequential-exception-test
  - local-name: Ventilation / Extraction details (odour)
    source-text: where substantial ventilation/extraction equipment is proposed to be installed.
    source-url:
      https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
    suggested-id: ventilation-extraction-details
  - local-name: Geotechnical Appraisal Report
    source-text: >-
      Geotechnical report Details of what is expected to be included within a Geotechnical Appraisal
      Report can be found on page 65 (Annex A1) of TCC9 FCERM Background Paper June 2024
    source-url:
      https://www.bcpcouncil.gov.uk/Assets/Planning-and-building-control/Local-validation-checklist.pdf
    suggested-id: geotechnical-report

low-confidence:
  - id: design-and-access-statement
    note: "Audit (wrong_trigger): the excerpt is cut off ('A Design and Access Statement is required for
      the below applications;') with no list; the national rules still apply."
  - id: biodiversity-survey-report
    note: "Audit (wrong_trigger): the excerpt is a fragment ('by it Bat survey if meet criteria Based on
      Development Type'); the checklists say it is needed if answered yes on the application form."
  - id: flood-risk-assessment
    note: "Audit (wrong_trigger): the excerpts are tick-list text; the list's own trigger ('When required If
      the site is in the;') is cut off."
  - id: transport-assessment
    note: "Audit (wrong_trigger): the excerpt is purpose text with no threshold."
  - id: town-centre-impact-assessment
    note: "Audit (wrong_trigger): the excerpt is NPPF town-centre-first policy text with no floorspace
      threshold."
  - id: fire-statement
    note: "Audit (wrong_trigger): tick-list text only ('for some applications made on or after 1st August
      2021'); the national rules apply."
