low-confidence:
  - id: recreation-facilities-assessment
    note: "Audit (wrong_trigger): the excerpt is Planning Statement text, not the Play Space Strategy
      trigger; re-read the list."
  - id: environmental-statement
    note: "The excerpt ('scale or EIA development).') is a fragment of the paper-copy submission text, not a
      trigger."
