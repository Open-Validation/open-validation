low-confidence:
  - id: bng-metric
    note: "Audit (wrong_trigger): the excerpt is a fragment ('…may need to be submitted. 23.'); Appendix
      F (2020) predates statutory BNG."
  - id: telecommunications-report
    note: "Audit (wrong_trigger, wrong_app_type): the excerpt is a fragment; item 40 is for mast/antenna
      applications by operators, often prior approval."
  - id: noise-assessment
    note: "The excerpt ('Such developments must be supported by a Noise Impact Assessment') lost the description
      of which developments."
  - id: cil-form
    note: "Audit (wrong_trigger): the householder excerpt has fee-schedule and Planning Portal text spliced
      in; no clear trigger was captured."

