  - local-name: Biodiversity Self-Assessment
    source-text: "Biodiversity Self-Assessment - All new applications, unless a Biodiversity Report is submitted (Full, Outline, LBC, Permission in Principle)"
    source-url: https://www.cotswold.gov.uk/media/5cwjexsa/full-planning-permission-validation-checklist-cdc-20-07-26-af.pdf
