low-confidence:
  - id: planning-statement
    note: "Audit (wrong_trigger): the excerpts are fragments ('countryside Supporting Planning Statement', 'Form Supporting Planning Statement') with no trigger."
  - id: floor-plan-existing
    note: "Audit (wrong_trigger): the Full planning excerpt is 1:5/1:1 joinery detail text; the checklist trigger is 'extends floorspace / alterations / new building'."
  - id: floor-plan-proposed
    note: "Audit (wrong_trigger): the Full planning excerpt is 1:5/1:1 joinery detail text; the checklist trigger is 'extends floorspace / alterations / new building'."
  - id: elevation-existing
    note: "Audit (wrong_trigger): the Full planning excerpt is 1:5/1:1 joinery detail text; the checklist trigger is 'extends floorspace / alterations / new building'."
  - id: elevation-proposed
    note: "Audit (wrong_trigger): the Full planning excerpt is 1:5/1:1 joinery detail text; the checklist trigger is 'extends floorspace / alterations / new building'."
  - id: bng-metric
    note: "Audit (wrong_trigger, outdated_link): the excerpts are generic metric text and headings; superseded 2022 checklists were mixed in."
