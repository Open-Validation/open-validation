low-confidence:
  - id: arboriculturist-report
    note: "Audit (wrong_trigger): the excerpt is a fragment ('such as arboriculturist, drainage engineer or structural engineer is required.')."
  - id: elevation-existing
    note: "The excerpt is the floor plan trigger; the elevation trigger was not captured."
  - id: elevation-proposed
    note: "The excerpt is the floor plan trigger; the elevation trigger was not captured."
