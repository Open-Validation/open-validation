  - local-name: Dartmoor Wildlife Trigger Table
    source-text: "From the audit: mandatory for Householder, Full (major and minor), Outline and Listed
      Building Consent; for s73 where relevant"
    source-url: &dnpa-u https://www.dartmoor.gov.uk/__data/assets/pdf_file/0026/571805/2025-Local-Validation-Checklist-final.pdf
    suggested-id: biodiversity-checklist
  - local-name: Sustainable Drainage Strategy
    source-text: "all planning applications which could affect drainage on or around the site"
    source-url: *dnpa-u
    suggested-id: drainage-strategy
  - local-name: Equestrian Development Information
    source-text: "grazing and waste management regime how all buildings/land will be used and any required
