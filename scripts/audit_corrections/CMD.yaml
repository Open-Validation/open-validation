    source-url: https://www.camden.gov.uk/local-area-requirements
    suggested-id: lawful-development-evidence
  - local-name: Mini cab use plan, Community use plan, Artwork Management Plan
    source-text: "From the audit: listed in LARs 2025 without triggers"
    source-url: https://prod-web-assets.camden.gov.uk/documents/d/guest/lars-2025
    suggested-id: ""

