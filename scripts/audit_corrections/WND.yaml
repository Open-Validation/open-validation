    source-text: "5.Section Plans … Proposals for new and altered buildings and/or changes in ground levels"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: low
    notes: "Audit (wrong_trigger): the excerpt was national-requirements table text. Sections are for new and altered buildings and/or changes in ground levels."

  - id: sustainability-statement
    action: replace
    source-text: >-
      Council’s Sustainability Checklist Developments are expected to achieve carbon reduction beyond
      Part L (of the Regulations) from energy efficiency measures alone to reduce energy demand as far
      as possible.
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    must-include:
      - item: BREEAM Pre-Assessment
        level: must
        required-if:
          condition:
            field: floorspace-non-residential
            operator: ">"
            value: 100
            description: Non-residential applications over 100 square metres.
        source-text: All non-residential planning applications over 100sqm
      - item: BREEAM Domestic Refurbishment assessment
        level: must
        required-if:
          condition:
            field: involves-change-of-use
            value: true
            description: A change of use to residential.
        source-text: Where proposals are for a change of use to residential
    confidence: low
    notes: >-
      The Sustainability Checklist's own trigger wasn't captured; the Energy Statement text is now
      in energy-statement. The BREEAM items are separate checklist items (7 and 8) per the audit.

  - id: town-centre-impact-assessment
    action: update
    required-if:
      condition:
        field: floorspace-non-residential
        operator: ">"
        value: 400
        description: Retail and leisure development exceeding 400 sqm (gross) outside existing town centres and other appropriate areas.
    confidence: medium

  - id: transport-assessment
    action: replace
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-text: All non-major applications that could give rise to transport impacts such as the loss or increase of parking provision
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: medium
    notes: >-
      Audit (duplicate, wrong_trigger): the checklist has a Transport Assessment (major/TfL
      thresholds) and a Transport Statement (the non-major trigger quoted above); the workbook gave
      both rows the same Healthy Streets fragment.

  - id: travel-plan
    action: replace
    required-if: discretionary
    source-text: "a full transport assessment and travel plan are required (TFL thresholds)"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: low
    notes: "Audit (duplicate): the Travel Plan's own trigger was lost; the excerpt refers to TfL thresholds without stating them."

  - id: viability-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: Developments comprising or capable of delivering 1 or more gross residential dwellings.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 1000
            description: More than 1,000 square metres of economic floorspace.
    source-text: Developments comprising or capable of delivering 1 or more gross residential dwellings
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    must-include:
      - item: A full unredacted version of the viability report, for the council's independent viability assessors (at the applicant's cost)
        level: must
      - item: An unredacted executive summary
        level: must
      - item: A redacted version for publication, with each redaction justified against the public interest test
        level: should
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt was a fragment. The must-include items are the council's viability submission rules (audit issue 9)."

