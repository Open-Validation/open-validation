  - id: roof-plan-proposed
    action: replace
    required-if:
      application-type:
        in: [hh, full, change-of-use]
    source-text: "4.Floor and Roof Plans … Applications that involve building works and applications for change of use"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: low
    notes: "Audit (wrong_app_type): from the checklist's national requirements table; not a prior approval item."

  - id: schedule-of-works
    action: replace
    required-if:
      all:
        - site:
            in: [listed-building, listed-building-setting]
            description: Works to or adjacent to a listed building.
        - any:
