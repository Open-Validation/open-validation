# Corrections for London Borough of Wandsworth, from inputs/audit/london-borough-of-wandsworth.json.
# The audit compared the workbook with Wandsworth's Local Validation Checklist (cover dated
# July 2026; the build already takes that date from the audit). Every Full planning row was
# 'INFERRED', so no application type was given; most triggers are scale- or location-based and
# apply to all types, including householder. Items marked "From the audit" use the audit's
# paraphrase; quotes in source-text are the audit's quotes from the checklist.
local-authority: WND

submission-standards:
  - item: Plans show the direction of north
    level: must
  - item: A linear scale bar, particularly for electronic submissions
    level: should

drop-unmapped:
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: the excerpt is the Affordable Workspace Management Plan sentence (re-added below)"
  - local-name: Health Impact Assessment
    reason: "wrong_trigger: the excerpt is guidance, not the trigger (re-added below with the 50+ units trigger)"
  - local-name: Tall buildings / Wind microclimate assessment
    reason: "wrong_trigger: a modelling sentence instead of the trigger (re-added below)"
  - local-name: Structural Survey
    reason: "not_a_requirement: fragment ('or Chartered Structural Engineer (MI Struct.')"
  - local-name: Crime prevention / Secured by Design statement
    reason: "wrong_trigger: a fragment of the Student Housing Management and Maintenance Plan, mislabelled (re-added below)"

requirements:
  - id: affordable-housing-statement
    action: add
    required-if:
      all:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: The scheme proposes at least 1 residential unit (gross).
        - condition:
            field: dwelling-count
            operator: "<="
            value: 9
            description: The scheme proposes no more than 9 residential units (gross).
    source-text: Small site schemes proposing 1-9 residential units (gross)
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): Small Sites Affordable Housing Statement (item 49)."

  - id: air-quality-assessment
    action: update
    required-if:
      any:
        - ref: major-development
        - discretionary
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook omitted the trigger, which begins 'Major or large-scale applications...'; the rest of it wasn't quoted."

  - id: arboriculturist-report
    action: replace
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees within the application site or on land adjacent to it.
    source-text: Where there are trees within a proposed application site, or on land adjacent to an application site
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    must-include:
      - item: A tree survey with a plan showing the location of trees and Root Protection Areas
        level: must
    confidence: medium
    notes: "Audit (wrong_app_type): item 44 applies to all applications, including householder."

  - id: archaeological-assessment
    action: update
    required-if:
      all:
        - site:
            in: [archaeological-priority-area]
            description: The site is in an Archaeological Priority Area.
        - condition:
            field: ground-disturbance
            value: true
            description: The proposal involves ground disturbance.
    confidence: medium
    notes: "From the audit (wrong_app_type): ground disturbance in APAs, including householder schemes."

  - id: bng-metric
    action: replace
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: low
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt was Affordable Workspace text (now unmapped) and
      the checklist's stale note that BNG 'will come into force later this year (2023)'. BNG is
      the national requirement.

  - id: cil-form
    action: replace
    required-if:
      any:
        - condition:
            field: floorspace
            operator: ">="
            value: 100
            description: The proposal creates 100 square metres or more of floorspace.
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: The proposal creates a dwelling (even where below 100 square metres).
    source-text: "...creation of 100 square metres or more ... or involve creation of a dwelling (even where below 100 square metres)"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt was a fragment ('in determining CIL liability.')."

  - id: construction-management-plan
    action: replace
    required-if:
      any:
        - ref: major-development
        - condition:
            field: basement
            value: true
            description: Development in a confined location, including basements and subterranean development.
        - condition:
            field: earthworks
            value: true
            description: Substantial demolition or excavation.
        - discretionary
    source-text: "All major planning applications ... Developments of sites in confined locations (including basements and subterranean developments) or near sensitive receptors"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: medium
    notes: >-
      Audit (other, duplicate): the workbook quoted the basement Construction Method Statement text
      (see unmapped). Sites near sensitive receptors are shown as officer discretion.

  - id: daylight-sunlight-assessment
    action: add
    required-if: discretionary
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: medium
    notes: "From the audit (wrong_app_type): Daylight and Sunlight where there is an impact on host or adjoining properties, including householder schemes."

  - id: elevation-existing
    action: replace
    required-if:
      application-type:
        in: [hh, full]
    source-text: "4.Floor and Roof Plans 5.Section Plans 6.Elevations Applications that involve building works and applications for change of use Proposals for new and altered buildings and/or changes in ground levels Applications that involve building works"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: low
    notes: "Audit (wrong_app_type): from the checklist's national requirements table (elevations: applications that involve building works); not a prior approval item."

  - id: elevation-proposed
    action: replace
    required-if:
      application-type:
        in: [hh, full]
    source-text: "4.Floor and Roof Plans 5.Section Plans 6.Elevations Applications that involve building works and applications for change of use Proposals for new and altered buildings and/or changes in ground levels Applications that involve building works"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: low
    notes: "Audit (wrong_app_type): from the checklist's national requirements table (elevations: applications that involve building works); not a prior approval item."

  - id: energy-statement
    action: add
    required-if:
      any:
        - all:
            - condition:
                field: new-build
                value: true
                description: New residential development.
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The proposal creates one or more dwellings.
        - all:
            - ref: major-development
            - condition:
                field: floorspace-non-residential
                operator: ">"
                value: 0
                description: Major non-residential development.
    source-text: The Energy Statement must demonstrate how the energy requirements will be met in line with the Energy Hierarchy.
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    must-include:
      - item: How the energy requirements will be met in line with the Energy Hierarchy
        level: must
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook filed the Energy Statement under sustainability-statement
      and omitted its trigger, 'All new residential development and major non-residential
      development'.

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.
    confidence: medium

  - id: fire-statement
    action: update
    notes: >-
      The excerpt is the London Plan Fire Safety Strategy ('All developments', with exemption
      statements for smaller schemes). From the audit: the checklist also asks for a separate Fire
      Safety Statement for all major applications.

  - id: flood-risk-assessment
    action: replace
    required-if:
      any:
        - site:
            in: [flood-risk-zone, critical-drainage-area]
            description: The site falls within a Flood Risk Area.
        - condition:
            field: site-area-residential
            operator: ">="
            value: 1
            description: Sites of 1 hectare or more in Flood Zone 1.
        - condition:
            field: site-area-non-residential
            operator: ">="
            value: 1
            description: Sites of 1 hectare or more in Flood Zone 1.
    source-text: All applications that fall within a Flood Risk Area should submit a Flood Risk Assessment
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt was a fragment. From the audit: also 1ha+ in Flood Zone 1."

  - id: floor-plan-existing
    action: replace
    required-if:
      application-type:
        in: [hh, full, change-of-use]
    source-text: "4.Floor and Roof Plans … Applications that involve building works and applications for change of use"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: low
    notes: "Audit (wrong_app_type): from the checklist's national requirements table; 'applications for change of use' are planning applications, not prior approvals."

  - id: floor-plan-proposed
    action: replace
    required-if:
      application-type:
        in: [hh, full, change-of-use]
    source-text: "4.Floor and Roof Plans … Applications that involve building works and applications for change of use"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: low
    notes: "Audit (wrong_app_type): from the checklist's national requirements table; 'applications for change of use' are planning applications, not prior approvals."

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building, listed-building-setting, conservation-area, locally-listed-building]
            description: The application affects a heritage asset and/or its setting.
    source-text: >-
      All applications affecting a heritage asset and or its setting must be accompanied by a
      Statement of Heritage Significance and Impact (Heritage Statement), either as a separate
      document or as part of a Design and Access Statement.
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: medium
    notes: "Audit (wrong_trigger, wrong_app_type): the workbook glued the Heliport zone text to the front (see unmapped); it applies to all types, including householder and LBC."

  - id: landscaping-plan
    action: add
    required-if: discretionary
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: medium
    notes: "From the audit (wrong_app_type): Landscaping where there are changes to landscaping, including householder schemes."

  - id: land-contamination-assessment
    action: update
    required-if:
      any:
        - site:
            in: [contaminated-land]
            description: The site is known or suspected to be contaminated.
        - discretionary
    confidence: medium
    notes: "All new development with a sensitive end use needs at least a Preliminary Risk Assessment, regardless of the site's history (council's wording)."

  - id: lighting-assessment
    action: update
    required-if:
      any:
        - condition:
            field: external-lighting
            value: true
            description: External lighting would be provided or made necessary by the development.
        - condition:
            field: illuminated
            value: true
            description: The advertisement is illuminated.
    confidence: low
    notes: "The excerpt ('advertisements, where external lighting would be provided or made necessary by the development') is cut off at the start, so the full list of application types wasn't captured."

  - id: noise-assessment
    action: update
    must-include:
      - item: Prepared by a qualified acoustician
        level: must

  - id: planning-statement
    action: update
    required-if:
      application-type:
        in: [full, outline]
    confidence: medium
    notes: "Audit (wrong_trigger, wrong_app_type): the checklist's trigger is 'All applications for full and outline planning permission.'"

  - id: recreation-facilities-assessment
    action: add
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: low
    notes: "From the audit (missing_requirement): an Open Space, Sport, Recreation and Green Infrastructure Assessment is listed, but the audit gives no trigger."

  - id: roof-plan-existing
    action: replace
    required-if:
      application-type:
        in: [hh, full, change-of-use]
    source-text: "4.Floor and Roof Plans … Applications that involve building works and applications for change of use"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
