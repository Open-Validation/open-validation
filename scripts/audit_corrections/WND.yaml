    source-text: Where an application seeks to add a basement/significantly alters structure to or adjacent to Listed Buildings
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: medium
    notes: >-
      Audit (other): the checklist's 'Schedule of Works Affecting Listed Buildings and Structural
      Impact Assessment' (item 28); the workbook quoted the basement Construction Method Statement.

  - id: sci
    action: update
    required-if:
      ref: major-development
    confidence: medium

  - id: section-existing
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full]
        - discretionary
    source-text: "5.Section Plans … Proposals for new and altered buildings and/or changes in ground levels"
    source-url: https://www.wandsworth.gov.uk/media/d1jhsd5t/wandsworth_local_planning_application_requirements.pdf
    confidence: low
    notes: "Audit (wrong_trigger): the excerpt was national-requirements table text. Sections are for new and altered buildings and/or changes in ground levels."

  - id: section-proposed
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full]
