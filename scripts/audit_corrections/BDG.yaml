# Corrections for London Borough of Barking and Dagenham, from
# inputs/audit/london-borough-of-barking-and-dagenham.json. The audit compared the workbook with the
# February 2026 Full Planning checklist and the July 2026 Householder checklist. Items marked
# "From the audit" use the audit's paraphrase, not the council's exact words.
# Not actionable here (audit missing_requirement): LBBD's separate 2026-07 checklists for adverts,
# LDCs, NMAs and prior approval (larger home extension) were not read, so nothing is recorded for
# those types; the workbook's '(none)' entries for them are unsupported.
local-authority: BDG

submission-standards:
  - item: Plans and drawings at an identified standard metric scale, with a scale bar and north 
      arrow
    level: should

drop:
  - id: arboriculturist-report
    sheets: [Works to trees]
    reason: "wrong_app_type: the Full planning tree survey rule, not a tree works requirement"

drop-unmapped:
  - local-name: Biodiversity Checklist / Questionnaire
    reason: "outdated_link: 2022 Phase 1 Habitat Survey rule; replaced by biodiversity-survey-report below"
  - local-name: Electric vehicle charging details
    reason: "wrong_trigger: quotes the Parking Stress Survey trigger; EV charging is not a separate 2026
      item"
  - local-name: Health Impact Assessment
    reason: "outdated_link: 2022 trigger; re-added below with the 2026 trigger"
  - local-name: Tall buildings / Wind microclimate assessment
    reason: "outdated_link / wrong_trigger: 2022 fragment; replaced by Wind and Microclimate Study below"
  - local-name: Marketing / vacancy evidence (loss of use)
    reason: "wrong_trigger: this is the Community Facility Need Statement, re-added below"
  - local-name: Crime prevention / Secured by Design statement
    reason: "wrong_trigger / wrong_app_type: the excerpt runs into Construction Logistics Plan text; re-added
      below"
  - local-name: Highways / access details (visibility splays)
    reason: "wrong_trigger: quotes the site plan content list; the householder item is Parking and access
      arrangements, added below"

requirements:
  - id: affordable-housing-statement
    action: replace
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 10
            description: The proposal is for 10 or more residential units.
        - condition:
            field: housing-floorspace
            operator: ">"
            value: 1000
            description: The proposal includes over 1,000 square metres of residential floorspace.
        - discretionary
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    confidence: medium
    notes: >-
      From the audit (outdated_link): the 2026 list requires it for 10 or more units, schemes under
      10 with capacity for 10 or more, over 1,000 sqm of residential floorspace, or linked sites. The
      capacity and linked-site cases are shown as officer discretion.

  - id: air-quality-assessment
    action: replace
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    policy: London Plan 2021 SI 1; Local Plan DMSI 4
    confidence: medium
    notes: >-
      From the audit (wrong_trigger): all major development, some minor development in Air Quality
      Focus Areas, or where impacts are likely (the minor cases shown as officer discretion). The
      council says it "must be prepared in accordance with the requirements of Policy SI 1 of the
      London Plan 2021 (Improving air quality) and Policy DMSI 4 (Air quality) of the Local Plan."

  - id: arboriculturist-report
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full]
        - condition:
            field: trees-on-or-near-site
            value: true
            description: There are trees on the site or on adjacent land (including street trees) 
              that could influence or be affected by the development.
    source-text: >-
      Tree Survey / Aboricultural Implications Where there are trees within the application site, or
      on land adjacent to it that could influence or be affected by the development (including street
      trees), information will be required on which trees are to be retained and on the means of
      protecting these trees during construction works.
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-07/Planning-Application-Householder-Validation-Checklist.pdf
    must-include:
      - item: Which trees are to be retained
        level: must
      - item: How the retained trees will be protected during construction works
        level: must
    confidence: medium
    notes: >-
      Audit (wrong_app_type): not a tree works requirement. The 2026 Full Planning checklist asks for
      it for development affecting TPO trees, trees in a conservation area or nearby trees.

  - id: archaeological-assessment
    action: replace
    required-if:
      all:
        - condition:
            field: ground-disturbance
            value: true
            description: The proposal involves groundworks.
        - site:
            in: [archaeological-priority-area]
            description: The site is in an Archaeological Priority Area or is of archaeological 
              significance.
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    must-include:
      - item: A written scheme of investigation for an archaeological evaluation (WSI), where 
          necessary
        level: should
    confidence: medium
    notes: "From the audit (wrong_trigger): groundworks on sites of archaeological significance or in
      an Archaeological Priority Area."

  - id: biodiversity-survey-report
    action: add
    required-if:
      any:
        - ref: major-development
        - site:
            in: [local-wildlife-site]
            description: The site is in or next to a Site of Importance for Nature Conservation 
              (SINC).
        - discretionary
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    confidence: medium
    notes: >-
      From the audit (outdated_link, missing_requirement): an Ecological Assessment for all major
      development and sites in or next to a SINC; and a Bat Survey for development likely to affect
      bat roosts or foraging and commuting habitat (shown as officer discretion).

  - id: bng-metric
    action: update
    required-if:
      application-type:
        in: [full]
    confidence: medium
    notes: "Audit (wrong_app_type): the row is from the Full Planning checklist, so Full planning is right,
      not 'INFERRED'."

  - id: cil-form
    action: replace
    required-if:
      any:
        - application-type:
            in: [full]
        - all:
            - application-type:
                in: [hh]
            - condition:
                field: floorspace
                operator: ">="
                value: 100
                description: The householder proposal creates 100 square metres or more of new 
                  floorspace.
    source-text: >-
      A householder application for 100 square metres or more of new floor space MUST be accompanied
      by the following documents: … Planning Application - Additional Information Requirement form;
      and Community Infrastructure Levy (CIL) Form 1: Assumption of Liability.
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-07/Planning-Application-Householder-Validation-Checklist.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the Full planning row quoted the self-build Form 7 text; CIL Form 1
      (Additional Information) is required for every full application."

  - id: construction-management-plan
    action: update
    required-if:
      all:
        - ref: major-development
        - discretionary
    confidence: low
    notes: >-
      "May be required for a major development which is likely to result in significant environmental
      impacts during construction." Audit (outdated_link): this is from the superseded 2022 checklist.

  - id: daylight-sunlight-assessment
    action: update
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-text: >-
      Daylight / Sunlight Assessment Major development … Or other development where there is a
      potential adverse impact upon the current levels of daylight / sunlight enjoyed by adjoining
      properties or building(s)
    confidence: medium

  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - site:
            in: [conservation-area, listed-building, listed-building-setting]
            description: The site is in or affects a conservation area or a listed building.
    source-text: >-
      Design and Access Statement This is only required for a householder application where any part
      of the dwelling house or its curtilage falls within a conservation area.
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-07/Planning-Application-Householder-Validation-Checklist.pdf
    must-include:
      - item: An explanation of the design principles and concepts that have been applied to the 
          development
        level: must
    confidence: medium
    notes: "From the audit (wrong_trigger): major development, or development in or affecting a conservation
      area or listed building."

  - id: environmental-statement
    action: replace
    required-if:
      condition:
        field: eia-development
        value: true
        description: A Screening Opinion has confirmed the need for an EIA.
    source-text: >-
      Development falling within Schedule 2 of The Town and Country Planning (Environmental Impact
      Assessment) Regulations 2017 (as amended), where a Screening Opinion has confirmed the need to
      submit an EIA.
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the excerpt was scrambled; this sentence was split between the ES and
      town centre rows."

  - id: flood-risk-assessment
    action: update
    required-if:
      any:
        - condition:
            field: site-area-residential
            operator: ">="
            value: 1
            description: The site is one hectare or greater.
        - condition:
            field: site-area-non-residential
            operator: ">="
            value: 1
            description: The site is one hectare or greater.
        - site:
            in: [flood-risk-zone]
            description: The site is in Flood Zone 2 or 3.
    confidence: low
    notes: "Audit (outdated_link): the trigger is from the superseded 2022 checklist."

  - id: heritage-statement
    action: replace
    required-if:
      site:
        in: [conservation-area, listed-building, listed-building-setting, locally-listed-building, 
              scheduled-monument]
        description: The proposal affects a conservation area, listed building, scheduled ancient 
          monument, locally listed building or other heritage asset, or their setting.
    source-text: >-
      Heritage Statement All development proposals which affect a conservation area, listed building,
      scheduled ancient monument, locally listed building, nondesignated heritage asset or other
      heritage asset, or the setting thereof
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): from the Full Planning checklist; LBBD has no LBC checklist, so it
      was wrongly filed under listed building consent."

  - id: land-contamination-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: previously-developed-land
            value: true
            description: The site is brownfield (previously developed) land.
        - site:
            in: [contaminated-land]
            description: The site is in an area of natural contamination risk.
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    confidence: medium
    notes: "From the audit (wrong_trigger): all brownfield development and areas of natural risk."

  - id: landscaping-plan
    action: replace
    required-if:
      any:
        - ref: major-development
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: The proposal is residential development (including minor residential).
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    confidence: medium
    notes: "From the audit (wrong_trigger): major development and minor residential."

  - id: lighting-assessment
    action: update
    required-if:
      condition:
        field: external-lighting
        value: true
        description: The application includes external lighting or will make external lighting 
          necessary.
    source-text: Lighting Assessment Where application includes the installation of external 
      lighting or will make external lighting necessary
    confidence: medium

  - id: noise-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: plant-equipment
            value: true
            description: The proposal includes plant or extraction equipment.
        - condition:
            field: noise-generating-use
            value: true
            description: The proposal is for a noisy use.
        - condition:
            field: noise-sensitive-use
            value: true
            description: A noise-sensitive use in a noisy area.
        - condition:
            field: traffic-aadt-increase
            operator: ">"
            value: 5
            description: Traffic increases of over 5% of Annual Average Daily Traffic.
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    must-include:
      - item: Prepared by a qualified acoustician
        level: must
    confidence: medium
    notes: "From the audit (wrong_trigger): plant or extraction, noisy uses, noise-sensitive uses in noisy
      areas, and traffic increases over 5% of AADT. The council says it \"must be prepared by a qualified
      acoustician\"."

  - id: photos
    action: replace
    required-if:
      any:
        - discretionary
        - condition:
            field: demolition
            value: true
            description: The proposal involves the demolition of an existing building.
        - site:
            in: [conservation-area, listed-building]
            description: The development affects a conservation area or a listed building.
    source-text: >-
      Photographs and Photomontages Required to support large redevelopment schemes, or if the
      proposal involves the demolition of an existing building or the development affects a
      conservation area or a listed building.
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2022-08/Application-for-Planning-Permission-validation-checklist_0.pdf
    confidence: low
    notes: >-
      Audit (outdated_link, wrong_app_type): from the superseded 2022 full planning checklist, and
      wrongly filed under listed building consent. "Large redevelopment schemes" is shown as officer
      discretion.

  - id: planning-statement
    action: update
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-text: >-
      Planning Statement Major development Any other proposal that will result in the need for a
      legal agreement (e.g. carfree development, or BNG monitoring) Development which does not accord
      with the adopted Development Plan
    confidence: medium

  - id: roof-plan-existing
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: A roof would be created or altered by the proposal.
    confidence: medium

  - id: roof-plan-proposed
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: A roof would be created or altered by the proposal.
    must-include:
      - item: The shape of the roof and its location
        level: should
      - item: The roofing material to be used
        level: should
    confidence: medium
    notes: "Council's wording: \"Roof plans should be provided for any roof that would be created or altered
      by the proposed development, showing the shape of the roof, its location, and specifying the roofing
      material to be used.\""

  - id: sci
    action: replace
    required-if:
      ref: major-development
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    confidence: medium
    notes: "Audit (outdated_link): the 2022 list said 'May be required for large scale developments';
      the 2026 list says major development."

  - id: section-existing
    action: update
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: A change to site or finished floor levels is proposed.
    confidence: medium
    notes: "Council's wording: \"Existing and proposed site sections and finished floor and site levels
      should be provided where a change is proposed.\""

  - id: section-proposed
    action: update
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: A change to site or finished floor levels is proposed.
    confidence: medium
    notes: "Council's wording: \"Existing and proposed site sections and finished floor and site levels
      should be provided where a change is proposed.\""

  - id: site-plan
    action: update
    required-if:
      application-type:
        in: [hh, full]
    must-include:
      - item: Written dimensions, including those to the boundaries
        level: must
        required-if:
          application-type:
            in: [hh]
      - item: Typically at a scale of 1:100 or 1:200
        level: should
        required-if:
          application-type:
            in: [hh]
    confidence: medium
    notes: "Audit (wrong_app_type): the Full planning row is from the Full Planning checklist, so Full
      planning is right, not 'INFERRED'."

  - id: sustainability-statement
    action: replace
    required-if:
      application-type:
        in: [full]
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    confidence: medium
    notes: >-
      From the audit (outdated_link, missing_requirement): the 2026 list requires an Energy and
      Sustainability Statement for all development (combined for minor, expanded for major); the
      workbook quoted the 2022 'Required for all major developments'.

  - id: telecommunications-report
    action: replace
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: Mast and antenna development by mobile operators.
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    confidence: medium
    notes: "Audit (wrong_trigger, duplicate): the workbook quoted the Transport Assessment trigger. From
      the audit: mast and antenna development by mobile operators."

  - id: town-centre-impact-assessment
    action: replace
    required-if:
      condition:
        field: floorspace-non-residential
        operator: ">"
        value: 2500
        description: Over 2,500 square metres of retail, leisure or office floorspace outside a town
          centre, not in line with an up-to-date Local Plan.
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted EIA text. From the audit: 'Evidence for Town Centre
      Uses' for over 2,500 sqm of retail, leisure or office outside town centres not in line with an up-to-date
      Local Plan."

  - id: transport-assessment
    action: update
    required-if: discretionary
    source-text: Transport Assessment / Transport Statement All development with significant 
      transport implications Must include accessibility and modal split details.
    must-include:
      - item: Accessibility and modal split details
        level: must
    confidence: medium

unmapped:
  - local-name: Sustainable Drainage Strategy (SuDS) and Proforma
    source-text: "From the audit: major development; minor development affecting surface water run-off
      or in a critical drainage area"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: drainage-strategy
  - local-name: Whole Life Carbon Assessment
    source-text: "From the audit: all development"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: whole-life-carbon-assessment
  - local-name: Circular Economy Statement
    source-text: "From the audit: all development"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: circular-economy-statement
  - local-name: Overheating Assessment
    source-text: "From the audit: major development"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: overheating-assessment
  - local-name: Urban Greening Factor
    source-text: "From the audit: major development"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: urban-greening-factor
  - local-name: Construction Logistics Plan (Outline)
    source-text: "From the audit: major development with significant construction vehicle movements, and
