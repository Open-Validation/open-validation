    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: delivery-servicing-plan
  - local-name: Access Statement
    source-text: "From the audit: new residential, mixed-use, or residential change of use or conversion"
    source-url: 
