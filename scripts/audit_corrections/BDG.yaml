    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: construction-logistics-plan
  - local-name: Site Waste Management Plan (Construction Waste)
    source-text: "From the audit: major development"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: waste-management-plan
  - local-name: Delivery and Servicing Plan
    source-text: "From the audit: major or minor development with regular commercial deliveries, or in
