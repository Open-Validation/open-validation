    suggested-id: access-statement
  - local-name: Basement Impact Assessment
    source-text: "From the audit: certain new or extended basements"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: basement-impact-assessment
  - local-name: Green Belt / Grey Belt Assessment
    source-text: "From the audit: Green Belt development with external alterations"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: green-belt-assessment
  - local-name: Materials
    source-text: "From the audit: indicative details for all development, full details for major development
      and heritage settings"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: materials-schedule
  - local-name: Odour Assessment
    source-text: "From the audit: major development, or sensitive uses near an odour source"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: odour-assessment
  - local-name: Vibration Study
    source-text: "From the audit: near a vibration source or likely to cause vibration"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: noise-assessment
  - local-name: Operational Management Plan
    source-text: "From the audit: supported housing and care homes, community facilities, places of worship,
      high-occupancy uses"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: operational-management-plan
  - local-name: Wind and Microclimate Study
    source-text: "From the audit: large-scale development, tall buildings, exposed or sensitive sites"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: wind-microclimate-assessment
  - local-name: Health Impact Assessment
    source-text: "From the audit: major residential development, and new hot food takeaways, betting shops,
      casinos, amusement arcades and payday loan shops"
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
    suggested-id: health-impact-assessment
  - local-name: Community Facility Need Statement
    source-text: "or the loss of community facilities The Community Facility Need Statement must demonstrate
      a need for relevant Community Facilities."
    source-url: 
      https://www.lbbd.gov.uk/sites/default/files/2026-02/LBBD%20Validation%20Checklist%20-%20FULL%20Planning%20Permission%20%28February%202026%29.pdf
