# Corrections for London Borough of Hackney, from inputs/audit/london-borough-of-hackney.json.
# Grokbot read the general 'Submit a planning application' page, not the validation checklist
# (Google Doc) it links. The audit read the checklist; almost all items below are the audit's
# paraphrase of it ("From the audit"), so they carry its triggers but not the council's wording.
# The checklist applies to householder, full, outline and variation/removal of conditions
# applications (LBC documents where stated); a separate householder checklist and a majors
# supporting-documents PDF also exist. The checklist is undated.
local-authority: HCK

requirements:
  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - application-type:
            in: [lbc]
        - site:
            in: [conservation-area]
            description: The property is within a conservation area.
    source-text: a design and access statement (only required if the property is within a conservation area)
    source-url: https://hackney.gov.uk/submit-planning-application
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the conservation area line is from the how-to page. The checklist lists
      the DAS under national requirements, so it is also needed for all major development and LBC.

  - id: site-plan
    action: update
    required-if:
      application-type:
        in: [hh, full, outline, s73]
    confidence: low
    notes: "Audit (wrong_trigger, wrong_app_type): the excerpt is the how-to page's basic document list; the checklist covers householder, full, outline and s73 applications."

  - id: floor-plan-existing
    action: update
    required-if:
      application-type:
        in: [hh, full, outline, s73]
    confidence: low
    notes: "Audit (wrong_trigger, wrong_app_type): the excerpt is the how-to page's basic document list; the checklist covers householder, full, outline and s73 applications."

  - id: floor-plan-proposed
    action: update
    required-if:
      application-type:
        in: [hh, full, outline, s73]
    confidence: low
    notes: "Audit (wrong_trigger, wrong_app_type): the excerpt is the how-to page's basic document list; the checklist covers householder, full, outline and s73 applications."

  - id: elevation-existing
    action: update
    required-if:
      application-type:
        in: [hh, full, outline, s73]
    confidence: low
    notes: "Audit (wrong_trigger, wrong_app_type): the excerpt is the how-to page's basic document list; the checklist covers householder, full, outline and s73 applications."

  - id: elevation-proposed
    action: update
    required-if:
      application-type:
        in: [hh, full, outline, s73]
    confidence: low
    notes: "Audit (wrong_trigger, wrong_app_type): the excerpt is the how-to page's basic document list; the checklist covers householder, full, outline and s73 applications."

  - id: section-existing
    action: add
    required-if:
      application-type:
        in: [hh, full, outline, s73]
    must-include:
      - item: Finished floor and site levels
        level: must
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: low
    notes: "From the audit (missing_requirement): site sections with finished floor and site levels are a local drawing requirement; the audit gives no trigger."

  - id: section-proposed
    action: add
    required-if:
      application-type:
        in: [hh, full, outline, s73]
    must-include:
      - item: Finished floor and site levels
        level: must
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: low
    notes: "From the audit (missing_requirement): site sections with finished floor and site levels are a local drawing requirement; the audit gives no trigger."

  - id: roof-plan-existing
    action: add
    required-if:
      application-type:
        in: [hh, full, outline, s73]
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: low
    notes: "From the audit (missing_requirement): roof plans are a local drawing requirement; the audit gives no trigger."

  - id: roof-plan-proposed
    action: add
    required-if:
      application-type:
        in: [hh, full, outline, s73]
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: low
    notes: "From the audit (missing_requirement): roof plans are a local drawing requirement; the audit gives no trigger."

  - id: photos
    action: add
    required-if:
      any:
        - ref: major-development
        - site:
            in: [conservation-area, listed-building]
            description: The proposal affects a conservation area or listed building.
        - condition:
            field: telecommunications-development
            value: true
            description: The proposal is for a telecoms mast.
        - discretionary
    must-include:
      - item: At least 2 3D visuals
        level: must
        required-if:
          ref: major-development
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): photographs/photomontages for all majors (with at least 2 3D visuals), new buildings affecting the streetscene (shown as officer discretion), conservation areas or listed buildings, and telecoms masts."

  - id: landscaping-plan
    action: add
    required-if:
      ref: major-development
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): landscaping scheme for all majors."

  - id: waste-management-plan
    action: add
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: The proposal creates additional units.
        - condition:
            field: involves-change-of-use
            value: true
            description: The proposal involves a change of use.
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): refuse and recycling details for additional units or change of use."

  - id: affordable-housing-statement
    action: add
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 10
            description: The proposal is for 10 or more units.
        - condition:
            field: site-area-residential
            operator: ">"
            value: 0.1
            description: The site is over 1,000 square metres (0.1 hectares).
        - discretionary
    policy: Local Plan LP33
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: >-
      From the audit (missing_requirement): Affordable Housing Statement and Viability Report for 10+
      units or sites over 1,000 sq m or 0.1 ha, housing regeneration, or 1-9 units with no financial
      contribution under LP33 (the last two shown as officer discretion).

  - id: viability-assessment
    action: add
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 10
            description: The proposal is for 10 or more units.
        - condition:
            field: site-area-residential
            operator: ">"
            value: 0.1
            description: The site is over 1,000 square metres (0.1 hectares).
        - discretionary
    policy: Local Plan LP33
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): the Viability Report goes with the Affordable Housing Statement and has the same triggers."

  - id: sustainability-statement
    action: add
    required-if:
      any:
        - condition:
            field: floorspace
            operator: ">="
            value: 1000
            description: 1,000 square metres GIA or more.
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: One or more residential units.
        - condition:
            field: site-area-residential
            operator: ">="
            value: 0.5
            description: A site of 0.5 hectares or more.
        - condition:
            field: site-area-non-residential
            operator: ">="
            value: 1
            description: A site of 1 hectare or more.
    must-include:
      - item: BREEAM Pre-Assessment
        level: must
        required-if:
          condition:
            field: floorspace-non-residential
            operator: ">="
            value: 100
            description: Non-residential new units or extensions of 100 square metres or more.
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: low
    notes: >-
      From the audit (missing_requirement): Sustainability Impact Assessment for 1,000 sq m GIA or
      more, 1+ residential units, or sites of '0.5 ha/1 ha' or more (read here as 0.5 ha residential,
      1 ha non-residential; check). BREEAM Pre-Assessment for non-residential new units or extensions
      of 100 sq m or more.

  - id: town-centre-impact-assessment
    action: add
    required-if:
      all:
        - condition:
            field: out-of-town-centre
            value: true
            description: The site is edge- or out-of-centre.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 200
            description: Over 200 square metres GFA of E(a), E(b) or leisure use.
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): Sequential Test and Impact Assessment for edge- or out-of-centre E(a)/E(b)/leisure over 200 sq m GFA."

  - id: energy-statement
    action: add
    required-if:
      any:
        - ref: major-development
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: One or more residential units.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 0
            description: Any new non-residential floorspace.
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): Energy Strategy Statement for all majors, 1+ residential units and any non-residential new floorspace."

  - id: daylight-sunlight-assessment
    action: add
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): majors, or where neighbours are affected."

  - id: air-quality-assessment
    action: add
    required-if:
      any:
        - ref: major-development
        - site:
            in: [air-quality-management-area]
            description: The site is in an area of poor air quality.
        - condition:
            field: structural-demolition
            value: true
            description: The proposal involves significant demolition.
        - discretionary
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): majors, areas of poor air quality, sensitive uses (shown as officer discretion), significant demolition."

  - id: noise-assessment
    action: add
    required-if:
      any:
        - condition:
            field: noise-generating-use
            value: true
            description: E(a)/E(b) uses, takeaways and pubs.
        - condition:
            field: noise-sensitive-use
            value: true
            description: Residential development near noise.
        - condition:
            field: involves-change-of-use
            value: true
            description: Conversions.
    must-include:
      - item: Sound insulation details
        level: must
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): Noise Impact Assessment and sound insulation details for E(a)/E(b), takeaways, pubs, conversions, and residential near noise."

  - id: land-contamination-assessment
    action: add
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: low
    notes: "From the audit (missing_requirement): a Contaminated Land Assessment is listed, but the audit gives no trigger."

  - id: environmental-statement
    action: add
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): Environmental Statement for EIA development."

  - id: flood-risk-assessment
    action: add
    required-if:
      any:
        - site:
            in: [flood-risk-zone]
            description: The site is in Flood Zone 2 or 3.
        - condition:
            field: site-area-residential
            operator: ">"
            value: 1
            description: The site is over 1 hectare (Flood Zone 1).
        - condition:
            field: site-area-non-residential
            operator: ">"
            value: 1
            description: The site is over 1 hectare (Flood Zone 1).
        - all:
            - site:
                in: [critical-drainage-area]
                description: The site is in a Critical Drainage Area.
            - any:
                - ref: major-development
                - condition:
                    field: basement
                    value: true
                    description: The proposal includes a basement.
        - discretionary
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): Flood Zones 2/3; sites over 1 ha in FZ1; more vulnerable uses (shown as officer discretion); majors and basements in Critical Drainage Areas."

  - id: bng-metric
    action: add
    required-if:
      application-type:
        in: [full, outline]
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: low
    notes: "From the audit (missing_requirement): a Draft Biodiversity Gain Plan for all non-exempt applications (householder applications are exempt)."

  - id: biodiversity-survey-report
    action: add
    required-if:
      any:
        - ref: major-development
        - site:
            in: [local-wildlife-site, special-protection-area, site-of-special-scientific-interest]
            description: The site is near a SINC, the Walthamstow Reservoirs SPA or a SSSI.
        - discretionary
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): majors, and sites near SINCs, watercourses (shown as officer discretion), Walthamstow Reservoirs SPA or SSSIs."

  - id: archaeological-assessment
    action: add
    required-if:
      all:
        - condition:
            field: ground-disturbance
            value: true
            description: The proposal involves ground disturbance.
        - site:
            in: [archaeological-priority-area]
            description: The site is on or adjoining an archaeological site.
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): ground disturbance on or adjoining an archaeological site."

  - id: heritage-statement
    action: add
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building, locally-listed-building, conservation-area, scheduled-monument, park-and-garden]
            description: Listed or locally listed buildings, conservation areas, Scheduled Monuments or Registered Parks.
        - discretionary
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): listed or locally listed buildings, conservation areas, Scheduled Monuments, Registered Parks, non-designated heritage assets (shown as officer discretion), LBC."

  - id: arboriculturist-report
    action: add
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: The works affect trees on or off the site.
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): Tree Survey for works affecting trees on or off site."

  - id: transport-assessment
    action: add
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): Transport Assessment for majors; Transport Statement for up to 9 units or under 1,000 sq m with transport implications (shown as officer discretion)."

  - id: travel-plan
    action: add
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: low
    notes: "From the audit (missing_requirement): a Travel Plan is listed, but the audit gives no trigger."

  - id: telecommunications-report
    action: add
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: The proposal is for telecommunications development.
    must-include:
      - item: ICNIRP statement
        level: must
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): ICNIRP statement for telecoms."

  - id: planning-statement
    action: add
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-url: https://docs.google.com/document/d/1T-STYwCkzNnVqOCE8Lyx-jm-nvbBBsqi2XkgJkRjAHY/edit?usp=sharing
    confidence: medium
    notes: "From the audit (missing_requirement): majors and where planning obligations apply."

