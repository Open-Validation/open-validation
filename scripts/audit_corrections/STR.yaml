  - id: noise-assessment
    note: "Audit (wrong_trigger): the excerpt is BS 4142 method text with a page header; no trigger was
      captured (it can apply to householder proposals, e.g. air-conditioning units)."
  - id: transport-assessment
    note: "Audit (wrong_trigger): the excerpt is a fragment ending in 'click here'; no trigger was captured."
