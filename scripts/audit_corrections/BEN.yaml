# Corrections for London Borough of Brent, from inputs/audit/london-borough-of-brent.json.
# The audit read Brent's adopted Full/Outline/Technical Details Consent list and its separate
# Householder list. About a dozen workbook rows came from a haveyoursay.brent.gov.uk
# consultation draft, not the adopted list; those are dropped or flagged. Items marked
# "From the audit" use the audit's paraphrase, not the council's exact words.
local-authority: BEN

validation-list:
  url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
  date: "2024"
  date-basis: >-
    audit: the list text has no adoption date (the 2025-09-01 date was PDF metadata); it
    includes the February/April 2024 BNG wording and planning.data.gov.uk records Brent's
    Local List from 2024-01-01

submission-standards:
  - item: Plans and drawings include a scale bar and an indication of North (indicative drawings for outline applications where the relevant matters are reserved)
    level: must

drop-unmapped:
  - local-name: Advertisement drawings / illumination details
    reason: "wrong_document: text from the haveyoursay consultation draft, not the adopted list"
  - local-name: Employment / Economic Statement
    reason: "wrong_document: Employment Land Assessment text from the consultation draft"
  - local-name: Highways / access details (visibility splays)
    reason: "wrong_document: fragment from the consultation draft"
  - local-name: Marketing / vacancy evidence (loss of use)
    reason: "wrong_document: 24-month marketing test from the consultation draft"
  - local-name: Water efficiency / water usage statement
    reason: "wrong_document: text from the consultation draft"
  - local-name: Design Code / Masterplan / Parameter plans
    reason: "wrong_trigger: the source has no design code requirement; the excerpt is the UGF, ventilation, water quality and WLC rows (added below)"
  - local-name: Ground investigation / Geotechnical / Basement Impact Assessment
    reason: "wrong_trigger: the excerpt is the archaeology trigger; replaced by archaeological-assessment and a Basement impact assessment item"
  - local-name: Sunlight to gardens/amenity space / outdoor amenity
    reason: "wrong_trigger: the excerpt is the air pollution trigger; replaced by the Amenity space quality statement below"
  - local-name: Tall buildings / Wind microclimate assessment
    reason: "wrong_trigger: the excerpt is the TV/Radio reception trigger; both are added below"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: the excerpt is the Odour Management Plan trigger; both are added below"

requirements:
  - id: affordable-housing-statement
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - any:
            - all:
                - ref: major-development
                - condition:
                    field: dwelling-count
                    operator: ">="
                    value: 1
                    description: The major development includes new homes.
            - condition:
                field: housing-type
                value: shared
                description: The proposal is large-scale purpose-built shared living.
            - condition:
                field: housing-type
                value: student
                description: The proposal is purpose-built student accommodation.
    source-text: "Affordable Housing Statement: major residential schemes, large-scale purpose-built shared living, and purpose-built student accommodation"
    source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook quoted the shared-facilities management plan trigger.
      "Large-scale" shared living has no threshold in the audit.

  - id: air-quality-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - any:
            - ref: major-development
            - discretionary
    source-text: >-
      Air Quality Assessment Air Quality Neutral Assessment Air Quality Positive Assessment … Where
      the proposed development includes new uses or buildings that have the potential to generate
      air pollution or where a sensitive use is proposed in close proximity to an existing source of
      air pollution All major developments outside of Growth Areas and Air Quality Focus Areas All
      major developments within Growth Areas and Air Quality Focus Areas
    source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
    must-include:
      - item: Air Quality Neutral Assessment (major developments outside Growth Areas and Air Quality Focus Areas)
        level: must
        required-if:
          ref: major-development
      - item: Air Quality Positive Assessment (major developments within Growth Areas and Air Quality Focus Areas)
        level: must
        required-if:
          ref: major-development
    confidence: medium
    notes: >-
      The workbook's excerpt runs the AQA, Air Quality Neutral and Air Quality Positive rows
      together. From the audit (missing_requirement): Air Quality Neutral for majors outside Growth
      Areas/AQFAs, Air Quality Positive for majors in them. The AQA itself is needed where new uses
      could generate air pollution or a sensitive use is near an existing source (officer judgement).

  - id: arboriculturist-report
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh]
        - condition:
            field: trees-on-or-near-site
            value: true
            description: The works affect trees.
    source-url: https://www.brent.gov.uk/media/16421113/applications-for-householder-planning-permission.pdf
    confidence: low
    notes: >-
      From the audit (wrong_document): the Householder list asks for a Tree survey for works
      affecting trees. The workbook's tree survey text came from the consultation draft, so whether
      the adopted Full/Outline list has the same item needs checking.

  - id: archaeological-assessment
    action: add
    required-if:
      all:
        - application-type:
            in: [full, outline, hh]
        - any:
            - site:
                in: [archaeological-priority-area]
                description: The site is in an Archaeological Priority Area or Site of Archaeological Importance.
            - discretionary
    source-text: >-
      Archaeological impact statement … Sites which include or have the potential to include
      heritage assets with archaeological interest, including Archaeological Priority Areas and
      Sites of Archaeological Importance.
    source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
    confidence: medium
    notes: >-
      From the audit (missing_requirement): Archaeological impact statement for APAs, on both the
      Full/Outline and Householder lists. The wording was in the workbook's 'Basement Impact
      Assessment' row.

  - id: biodiversity-survey-report
    action: update
    required-if:
      all:
        - application-type:
            in: [full, outline, hh]
        - any:
            - site:
                in: [site-of-special-scientific-interest, local-wildlife-site]
                description: The development could affect a designated environmentally important site.
            - discretionary
    confidence: medium
    notes: >-
      A reasonable likelihood of protected species being present is officer judgement. The audit
      says the Householder list also has an Ecological assessment.

  - id: cil-form
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline, hh]
        - any:
            - condition:
                field: floorspace
                operator: ">="
                value: 100
                description: 100 square metres or more of new floorspace, including extensions.
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The proposal creates a new dwelling.
    source-text: >-
      Community Infrastructure Levy (CIL) additional information form … For all CIL liable
      applications including: 100 sqm or more of new floorspace, including extensions;
    source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
    confidence: medium
    notes: "From the audit: the Householder list also asks for the CIL form for 100 sq m+ or a new dwelling."

  - id: construction-management-plan
    action: add
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - ref: major-development
    source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
    confidence: medium
    notes: "From the audit (missing_requirement): Construction Logistics Plan for all majors."

  - id: daylight-sunlight-assessment
    action: replace
    required-if:
      application-type:
        in: [full, outline]
    source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
    confidence: low
    notes: >-
      Audit (wrong_trigger): the workbook quoted the CIL trigger. The list's own trigger for the
      Daylight / sunlight assessment wasn't given by the audit.

  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - application-type:
            in: [lbc]
        - all:
            - site:
                in: [conservation-area]
                description: The site is in a conservation area.
            - any:
                - condition:
                    field: dwelling-count
                    operator: ">="
                    value: 1
                    description: The proposal creates one or more dwellings.
                - condition:
                    field: floorspace
                    operator: ">="
                    value: 100
                    description: The proposal creates 100 square metres or more of floorspace.
    source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt was garbled. From the audit: majors, listed
      building consent, and dwellings or 100 sq m+ in conservation areas; not required for
      Section 73 applications.

  - id: elevation-existing
    action: update
    must-include:
      - item: Normally at a scale of 1:50 or 1:100
        level: should
    notes: "For outline applications where the relevant matters are reserved, the list accepts indicative drawings."

  - id: elevation-proposed
    action: update
    must-include:
      - item: Normally at a scale of 1:50 or 1:100
        level: should
    notes: "For outline applications where the relevant matters are reserved, the list accepts indicative drawings."

  - id: energy-statement
    action: add
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - ref: major-development
    source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
    confidence: medium
    notes: "From the audit (missing_requirement): Energy strategy for all majors."

  - id: environmental-statement
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - condition:
            field: eia-development
            value: true
            description: The development is subject to Environmental Impact Assessment.
    source-text: >-
      Environmental Statement and non-technical summary … Applications that are subject to
      Environmental Impact Assessment in circumstances set out in the Town and Country Planning
      (Environmental Impact Assessment) Regulations 2017.
    source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
    confidence: medium
    notes: "The workbook's excerpt ran several rows together; the EIA trigger is the last sentence."

  - id: fire-statement
    action: replace
    required-if:
      all:
        - application-type:
            in: [full]
        - discretionary
    source-url: https://www.brent.gov.uk/-/media/files/resident-documents/planning-and-bc-documents/full-planning-applications-outline-planning-applications-technical-details-consent.pdf?rev=4baabcf651dd4c8c96266c7a7481d4b5
    confidence: low
    notes: >-
      Audit (wrong_trigger): the workbook quoted the EIA trigger. The list refers to the national
      Gateway One fire statement, which it says is not required for outline applications; the
      audit gives no local trigger. Brent's local Planning Fire Safety Statement is listed under
      unmapped items.

  - id: flood-risk-assessment
    action: update
    required-if:
      all:
        - application-type:
            in: [full, outline, hh]
        - any:
            - site:
                in: [flood-risk-zone]
                description: Proposals in Flood Zone 2 or 3, including minor development and change of use.
            - discretionary
    confidence: medium
    notes: >-
      The excerpt lists Flood Zone 2 or 3 as the first of several circumstances; the rest were cut
      off, so they are shown as officer discretion. The audit says the Householder list asks for a
      flood risk assessment in Flood Zones 2/3.

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - all:
            - application-type:
                in: [hh, full, outline]
            - site:
                in: [listed-building, conservation-area, article-4-direction-area, locally-listed-building]
                description: The proposal affects a listed building, conservation area, Article 4 area or locally listed building.
