# Corrections for Rushmoor Borough Council, from inputs/audit/rushmoor-borough-council.json.
# The audit read the current list (published 10 April 2025; the build takes the date from the
# audit). The council's requirements-by-application-type matrix (an image) could not be read, so
# application types below come from the list text. Items marked "From the audit" use the audit's
# paraphrase.
local-authority: RUH

submission-standards:
  - item: All plans show the direction of north, an individual reference and a version number
    level: must
  - item: Plans using Ordnance Survey data show the Ordnance Survey licence number
    level: must

drop:
  - id: construction-management-plan
    reason: "not_a_requirement: a sentence from inside the air quality assessment item (now a must-include
      there)"
  - id: design-and-access-statement
    reason: "not_a_requirement: the statutory DMPO description; the council lists the DAS under national
      requirements"

drop-unmapped:
  - local-name: Highways / access details (visibility splays)
    reason: "not_a_requirement: national site location / block plan guidance"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: the excerpt starts mid-sentence and drops the triggering uses; re-added below"

requirements:
  - id: affordable-housing-statement
    action: update
    required-if:
      application-type:
        in: [full, outline]
    must-include:
      - item: The total numbers of affordable housing
        level: should
      - item: The mix of affordable housing by house type and by tenure
        level: should
      - item: Plans showing the location of affordable housing, with a schedule of the bedrooms, 
          accessibility category and unit size (GEA and GIA) of each property
        level: should
      - item: The basis of calculation of any service charges, ground rents or management fees for 
          the affordable housing
        level: should
    confidence: low
    notes: "Audit (wrong_app_type): affordable housing also applies to outline applications. The council's
      matrix couldn't be read, so its trigger isn't confirmed."

  - id: air-quality-assessment
    action: add
    required-if: discretionary
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    must-include:
      - item: A construction management plan setting out measures to minimise emissions, where 
          deemed necessary
        level: should
        source-text: >-
          Adequate controls will need to be considered, and construction management plans, where
          deemed necessary, will be required to set out what measures will be employed to minimise
          emissions from any associated activities.
    confidence: medium
    notes: >-
      From the audit (missing_requirement, not_a_requirement): sensitive development close to
      significant pollutant sources, or development likely to significantly increase emissions (e.g.
      commercial kitchens, near Farnborough Airport). Shown as officer discretion.

  - id: arboriculturist-report
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, outline, reserved-matters]
        - condition:
            field: trees-on-or-near-site
            value: true
            description: There are trees within the site or on adjacent land (including street 
              trees) that could influence or be affected by the development.
    source-text: >-
      Tree survey To accompany a planning application Where there are tree(s) within the application
      site, or on land adjacent to the application site that could influence or be affected by the
      development (including street trees), especially where the tree(s) are subject to a Tree
      Preservation Orders (TPO) and/or in a Conservation Area, the survey must include information on
      which trees are to be retained and the means of protecting these trees during construction
      works.
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    must-include:
      - item: Which trees are to be retained
        level: must
      - item: The means of protecting the retained trees during construction works
        level: must
    confidence: medium
    notes: "Audit (wrong_app_type, wrong_trigger): this is the planning application trigger, not a tree
      works one (see condition-of-trees and structural-damage)."

  - id: biodiversity-survey-report
    action: update
    required-if: discretionary
    source-text: >-
      Where the checklist flags a potential impact to legally protected species, you are required to
      submit species specific ecological surveys to identify species presence or absence and to make
      sure your development will not adversely affect protected species.
    confidence: medium
    notes: "Needed where the Hampshire biodiversity wildlife checklist flags a potential impact on protected
      species."

  - id: condition-of-trees
    action: add
    required-if:
      all:
        - application-type:
            in: [consent-under-tpo]
        - discretionary
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    confidence: medium
    notes: "From the audit (wrong_trigger): for works to TPO trees on grounds of disease or fear of failure,
      supported by diagnostic or technical evidence."

  - id: flood-risk-assessment
    action: replace
    required-if:
      any:
        - site:
            in: [flood-risk-zone]
            description: Minor development or change of use in flood zones 2 and 3.
        - condition:
            field: site-area-residential
            operator: ">="
            value: 1
            description: Development or change of use in Zone 1 with a site area of 1 hectare or 
              more.
        - condition:
            field: site-area-non-residential
            operator: ">="
            value: 1
            description: Development or change of use in Zone 1 with a site area of 1 hectare or 
              more.
    source-text: >-
      A flood risk assessment is required for: Minor development in flood zones 2 and 3 Change of use
      in flood zones 2 and 3 Development and change of use within Zone 1, with a site area of 1
      hectare or more
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    confidence: medium
    notes: >-
      Audit (wrong_trigger, wrong_app_type): the excerpt ran into the heritage statement trigger and
      was wrongly filed under LBC and prior approval. Householders and other minor extensions in
      flood zones 2 and 3 use a flood risk form ("required for all householders and other minor
      extensions in flood zones 2 and 3").

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [conservation-area, listed-building, listed-building-setting]
            description: The application affects a conservation area or its setting, or a listed 
              building, its curtilage or setting.
        - discretionary
    source-text: >-
      Heritage statement Required for: Planning applications affecting a conservation area or its
      setting Planning applications affecting a listed building, its curtilage or setting Planning
      applications affecting a heritage asset, including its setting Applications for Listed Building
      Consent The level of detail within the heritage statement should be proportionate to the asset's
      importance and the scope of the proposed works.
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    confidence: medium
    notes: "Audit (wrong_app_type): also required for planning applications (full or householder), not
      only LBC. Other heritage assets are shown as officer discretion."

  - id: landscaping-plan
    action: add
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    confidence: low
    notes: "From the audit (missing_requirement): 'Landscaping details' is a local heading; the audit
      gives no trigger."

  - id: lighting-assessment
    action: replace
    source-text: >-
      Lighting assessment A lighting assessment should include: A description of the proposed hours
      of operation, light spillage, light levels and column heights A layout plan of the proposed
      development site showing beam orientation Details of the design and specification of the
      proposed equipment Details of the expected impact on neighbouring residential properties, roads,
      listed buildings, and conservation areas Impact on protected or priority species and proposed
      mitigation…
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    must-include:
      - item: Proposed hours of operation, light spillage, light levels and column heights
        level: should
      - item: A layout plan showing beam orientation
        level: should
      - item: Design and specification of the proposed equipment
        level: should
      - item: Expected impact on neighbouring residential properties, roads, listed buildings and 
          conservation areas
        level: should
      - item: Impact on protected or priority species and proposed mitigation
        level: should
    confidence: low
    notes: "Audit (wrong_app_type): not tied to LBC; 'listed buildings' is part of the content. The excerpt
      gives no trigger."

  - id: noise-assessment
    action: add
    required-if:
      any:
        - condition:
            field: noise-sensitive-use
            value: true
            description: Residential, medical, educational or day nursery development, or 
              development next to major roads, rail or industrial noise sources.
        - condition:
            field: noise-generating-use
            value: true
            description: Pubs, nightclubs, places of worship, sports facilities, noisy industrial 
              uses or wind turbines.
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    confidence: medium
    notes: "From the audit (missing_requirement): residential; medical/educational/day nurseries; pubs/nightclubs;
      places of worship; sports facilities; noisy industrial; wind turbines; development next to major
      roads/rail/industrial noise sources."

  - id: planning-statement
    action: add
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    confidence: low
    notes: "From the audit (missing_requirement): listed as a local requirement; the audit gives no trigger."

  - id: roof-plan-existing
    action: replace
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: New properties.
        - condition:
            field: roof-alteration
            value: true
            description: Complex integration of roof forms or dormer windows.
        - application-type:
            in: [ldc]
    source-text: >-
      Roof plan Required for: New properties and/or where there is complex integration of roof forms
      or dormer windows - the scale should be 1:50 or 1:100 and include details such as materials,
      vents, roof lights or lanterns Lawful development certificate for a roof extension - at least
      one of the plans submitted must include calculations to show the proposed increase in cubic
      meters
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    confidence: medium
    notes: "Audit (wrong_app_type): also required for new properties and dormers or complex roof forms,
      not only LDCs. The LDC case is for roof extensions."

  - id: roof-plan-proposed
    action: replace
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: New properties.
        - condition:
            field: roof-alteration
            value: true
            description: Complex integration of roof forms or dormer windows.
        - application-type:
            in: [ldc]
    source-text: >-
      Roof plan Required for: New properties and/or where there is complex integration of roof forms
      or dormer windows - the scale should be 1:50 or 1:100 and include details such as materials,
      vents, roof lights or lanterns Lawful development certificate for a roof extension - at least
      one of the plans submitted must include calculations to show the proposed increase in cubic
      meters
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    must-include:
      - item: Scale of 1:50 or 1:100
        level: should
      - item: Details such as materials, vents, roof lights or lanterns
        level: should
      - item: Calculations showing the proposed increase in cubic metres (on at least one plan)
        level: must
        required-if:
          application-type:
            in: [ldc]
    confidence: medium
    notes: "Audit (wrong_app_type): also required for new properties and dormers or complex roof forms,
      not only LDCs. The LDC case is for roof extensions."

  - id: sci
    action: update
    required-if:
      all:
        - ref: major-development
        - any:
            - condition:
                field: dwelling-count
                operator: ">"
                value: 100
                description: Residential schemes over 100 units.
            - condition:
                field: floorspace-non-residential
                operator: ">"
                value: 10000
                description: Employment and warehouse/distribution schemes over 10,000 sq m.
            - condition:
                field: floorspace-non-residential
                operator: ">"
                value: 5000
                description: Retail schemes totalling over 5,000 sq m.
            - condition:
                field: floorspace-non-residential
                operator: ">"
                value: 2000
                description: Leisure schemes totalling over 2,000 sq m.
    must-include:
      - item: The techniques used to engage with stakeholders and the community
        level: should
      - item: How the views of the local community have been considered
        level: should
    confidence: medium
    notes: "The floorspace thresholds depend on the use (employment 10,000, retail 5,000, leisure 2,000
      sq m); the rule can't tie each to its use."

  - id: section-existing
    action: update
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: The proposal involves a change in ground levels.
    confidence: medium

  - id: section-proposed
    action: update
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: The proposal involves a change in ground levels.
    must-include:
      - item: Existing and finished levels, including details of foundations and eaves
        level: should
      - item: Levels related to a fixed reference point off-site
        level: should
    confidence: medium
    notes: "Council's wording: \"Where a proposal involves a change in ground levels, illustrative drawings
      should be submitted to show both the existing and finished levels to include details of foundations
      and eaves\"."

  - id: structural-damage
    action: add
    required-if:
      all:
        - application-type:
            in: [consent-under-tpo]
        - discretionary
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    confidence: medium
    notes: "From the audit (wrong_trigger): for works to TPO trees on grounds of subsidence or structural
      damage, supported by technical evidence."

  - id: transport-assessment
    action: add
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    confidence: low
    notes: "From the audit (missing_requirement): a local heading; the audit gives no trigger."

unmapped:
  - local-name: Ventilation / extraction statement
    source-text: "Required for: New restaurants and cafés; New pubs or drinking establishments; New hot
      food takeaways; New laundrettes … where substantial ventilation or extraction equipment is proposed
      The ventilation/extraction statement must include the details (elevational drawings showing size,
      location, and external appearance), position and design of the equipment, include an acoustic assessment
      and noise mitigation measures."
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: plant-specification
  - local-name: Measured site survey
    source-text: "Sites of irregular or complex shape Infill developments Applications covering a large
      area Any development involving a substantial change in ground levels The scale should be 1:200 or
      a topographical drawing showing key dimensions."
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: topographical-survey
  - local-name: Street scene
    source-text: "From the audit: infill properties including replacement dwellings; extensions that increase
      ridgeline height where there are immediately adjacent neighbours"
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: street-scene-elevation
  - local-name: Tree plan
    source-text: "From the audit: TPO / conservation area trees or trees within falling distance"
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: tree-plan
  - local-name: Employment and skills plan
    source-text: "From the audit: local heading (no trigger given)"
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: employment-statement
  - local-name: Specification of works
    source-text: "From the audit: local heading (no trigger given)"
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: schedule-of-works
  - local-name: Biodiversity wildlife checklist
    source-text: "From the audit: Hampshire biodiversity checklist, including for householder applications"
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: biodiversity-checklist
  - local-name: Amended plans
    source-text: "From the audit: local heading (no trigger given)"
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: ""
  - local-name: Details relevant to each condition
    source-text: "From the audit: enough detail for each condition being discharged (approval of details
      reserved by a condition); plans or documents showing the change (removal / variation of a condition)"
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: conditions-schedule
  - local-name: Evidence to support application
    source-text: "From the audit: relevant, detailed evidence for lawful development certificates; a detailed
      block plan for prior approval of a larger home extension; a supporting statement for all other prior
      approvals"
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: lawful-development-evidence
  - local-name: Evidence of date of planting
    source-text: "From the audit: hedgerow removal notices"
    source-url: 
      https://www.rushmoor.gov.uk/planning-and-building-control/planning-permission-and-applications/planning-applications/apply-for-planning-permission/local-requirements-for-planning-applications/
    suggested-id: ""

