# Corrections for Broxbourne Borough Council, from the audit of Broxbourne.
# The workbook captured nothing (it marked the page unreadable). The list is on the 'Make a planning
# application' page as Appendices A-D: A national, B Householder Local Validation List (image only;
# not read), C Local Validation List depending on development type (26 items), D Sustainability
# Checklist. The requirements below are the audit's summary of Appendix C; no verbatim wording was
# available, so there is no source-text. Items the audit lists without a trigger are low confidence.
local-authority: BRX
validation-list:
  url: https://www.broxbourne.gov.uk/planning/planning-application-forms/3
  date: '2024'
  date-basis: 'Undated: the appendices show no date and the page metadata says March 2020, but Appendix
    C cites the Biodiversity Gain Requirements (Irreplaceable Habitat) Regulations 2024, so the content
    is 2024 or later'
requirements:
- id: affordable-housing-statement
  action: add
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 10
        description: 10 or more dwellings.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 0.5
        description: The site is 0.5 hectares or more.
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): 10+ dwellings or 0.5ha+.'
- id: air-quality-assessment
  action: add
  required-if:
    any:
    - all:
      - site:
          in:
          - air-quality-management-area
          description: The site is in an Air Quality Management Area.
      - any:
        - condition:
            field: dwelling-count
            operator: '>='
            value: 10
            description: 10 or more units.
        - condition:
            field: floorspace
            operator: '>='
            value: 500
            description: 500 square metres or more.
    - discretionary
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): Air Quality Impact Assessment for 10+ units or 500 sq
    m+ in AQMAs, and industrial uses with emissions (no field, so officer discretion).'
- id: arboriculturist-report
  action: add
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: low
  notes: 'From the audit (missing_requirement): Tree Survey/AIA is listed; the audit gives no trigger.'
- id: archaeological-assessment
  action: add
  required-if:
    all:
    - condition:
        field: ground-disturbance
        value: true
        description: Groundworks are proposed.
    - site:
        in:
        - archaeological-priority-area
        description: The groundworks affect the historic environment.
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): groundworks affecting the historic environment.'
- id: biodiversity-survey-report
  action: add
  required-if:
    any:
    - condition:
        field: protected-species
        value: true
        description: Significant impacts on species.
    - site:
        in:
        - priority-habitat
        description: Significant impacts on habitats.
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): Biodiversity/Ecology report for significant habitat or
    species impacts.'
- id: bng-metric
  action: add
  required-if:
    condition:
      field: biodiversity-gain-condition
      value: true
      description: The biodiversity gain condition applies.
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): BNG information where the biodiversity gain condition
    applies.'
- id: daylight-sunlight-assessment
  action: add
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: low
  notes: 'From the audit (missing_requirement): Daylight/Sunlight Assessment is listed; the audit gives
    no trigger.'
- id: flood-risk-assessment
  action: add
  required-if:
    any:
    - site:
        in:
        - flood-risk-zone
        description: All development in Flood Zone 2 or 3.
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or more in Flood Zone 1.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: The site is 1 hectare or more in Flood Zone 1.
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): FZ1 1ha+; all FZ2/3.'
- id: heritage-statement
  action: add
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: low
  notes: 'From the audit (missing_requirement): Heritage Statement is listed; the audit gives no trigger.'
- id: land-contamination-assessment
  action: add
  required-if:
    condition:
      field: previously-developed-land
      value: true
      description: The site is previously developed land.
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): Land Contamination Assessment for previously developed
    land.'
- id: lighting-assessment
  action: add
  required-if:
    condition:
      field: external-lighting
      value: true
      description: The proposal includes external lighting.
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): external lighting.'
- id: noise-assessment
  action: add
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: low
  notes: 'From the audit (missing_requirement): Noise Impact Assessment is listed; the audit gives no
    trigger.'
- id: planning-statement
  action: add
  required-if:
    ref: major-development
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): Supporting Planning Statement for major development.'
- id: sci
  action: add
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: low
  notes: 'From the audit (missing_requirement): Statement of Community Involvement is listed; the audit
    gives no trigger.'
- id: sustainability-statement
  action: add
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 1
        description: New dwellings, including conversions creating dwellings.
    - condition:
        field: floorspace-non-residential
        operator: '>'
        value: 0
        description: New non-residential floorspace.
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): the Sustainability Checklist (Appendix D) for new dwellings,
    conversions creating dwellings and new non-residential floorspace.'
- id: town-centre-impact-assessment
  action: add
  required-if:
    all:
    - condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Retail or leisure development out of centre.
    - condition:
        field: town-centre-use-floorspace
        operator: '>='
        value: 2500
        description: 2,500 square metres or more.
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): Retail/Leisure Impact for 2,500 sq m+ out of centre.'
- id: transport-assessment
  action: add
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50 or more C3 dwellings (Transport Statement; a Transport Assessment from 80).
    - discretionary
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: low
  notes: 'From the audit (missing_requirement): TA/TS by use-class thresholds, e.g. C3 TS 50 / TA 80 units.
    Only the C3 thresholds are known; others are officer discretion.'
- id: travel-plan
  action: add
  required-if:
    any:
    - condition:
        field: dwelling-count
        operator: '>='
        value: 50
        description: 50 or more C3 dwellings (where a Transport Statement or Assessment is required).
    - discretionary
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: low
  notes: 'From the audit (missing_requirement): a Travel Plan where a TA/TS is required (see transport-assessment).'
- id: viability-assessment
  action: add
  required-if: discretionary
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): Viability Assessment for policy departures on viability
    grounds.'
- id: waste-management-plan
  action: add
  required-if:
    ref: major-development
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  confidence: medium
  notes: 'From the audit (missing_requirement): Recycling/Waste Strategy for all major development.'
unmapped:
- local-name: Agricultural Appraisal
  source-text: 'From the audit: agricultural workers'' dwellings, or removal of occupancy conditions'
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  suggested-id: agricultural-appraisal
- local-name: Agricultural Land Survey
  source-text: 'From the audit: loss of agricultural land'
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  suggested-id: agricultural-land-classification
- local-name: Draft s106 Heads of Terms
  source-text: 'From the audit: major development'
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  suggested-id: heads-of-terms
- local-name: Drainage Strategy
  source-text: 'From the audit: all applications'
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  suggested-id: drainage-strategy
- local-name: Health Impact Assessment
  source-text: 'From the audit: 50+ units or 2,500 sq m+'
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  suggested-id: health-impact-assessment
- local-name: Structural Survey
  source-text: 'From the audit: agricultural building conversions; partial demolition of heritage buildings'
  source-url: https://www.broxbourne.gov.uk/downloads/file/4492/appendix-c
  suggested-id: structural-survey
