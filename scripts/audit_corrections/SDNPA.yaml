      https://www.southdowns.gov.uk/app/uploads/2023/05/Local-Validation-List-BNG-version-2024-002.pdf
    suggested-id: marketing-evidence
  - local-name: Needs or Site Selection Assessment
    source-text: "From the audit: Gypsy/Traveller sites, rural exception sites, loss of community facilities,
      rural worker dwellings"
    source-url: 
