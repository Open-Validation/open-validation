    source-text: "Photomontages and / or 3D visuals For all Major developments."
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: computer-visualisations
  - local-name: Town Centre Uses - Sequential Test
    source-text: "Sequential Test Applications for retail, leisure or office development or other town centre uses, of over 350sqm that will be situated outside of existing centres."
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
