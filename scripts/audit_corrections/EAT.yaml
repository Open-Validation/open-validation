    suggested-id: drainage-strategy
  - local-name: Marketing Report
    source-text: "From the audit: loss of Class E, community or leisure uses in Eastleigh town or district centres, non-boat uses at River Hamble boatyards/marinas, or loss of employment use. The council: 'The Marketing Report should provide details of marketing efforts made to let or sell the property in its current use, covering a period of at least 6 months.'"
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: marketing-evidence
  - local-name: Odour Assessment
    source-text: "From the audit: food-preparation uses and odorous industrial/commercial uses. The council: 'An odour assessment for cooking / kitchens should follow the approach given in the EMAQ guide, Control of Odour and Noise from Commercial Kitchen Exhaust Systems 2018.'"
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: ventilation-extraction-details
  - local-name: Structural Survey
    source-text: "For development proposals that could affect the stability of, or involve the substantial demolition of a listed building, locally listed building, heritage asset..."
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: structural-survey
  - local-name: Volume Calculations (Old Bursledon Special Policy Area)
    source-text: "All residential extensions or replacement dwellings in the Old Bursledon Special Policy Area"
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: volume-calculations
  - local-name: Access standards for new dwellings
    source-text: "From the audit: item 1, any proposal creating new dwellings (Policy DM29)"
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: accessible-housing-statement
  - local-name: Agricultural Development and Diversification Statement
    source-text: "Agricultural Development and Diversification Statement Proposals for new buildings for agricultural purposes or farm diversification."
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: agricultural-statement
  - local-name: Bird Hazard Assessment / Management Plan
    source-text: "From the audit: item 9, where needed to limit bird attraction affecting Southampton Airport"
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: bird-hazard-assessment
  - local-name: Gypsies, Travellers and Travelling Showpeople supporting statement
    source-text: "From the audit: item 16, new pitches/plots"
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: gypsy-traveller-statement
  - local-name: Open Space Plan
    source-text: "From the audit: item 29, all major residential development"
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: open-space-plan
  - local-name: Public Art Statement
    source-text: "From the audit: item 34, majors identified in the Planning Obligations SPD"
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: public-art-statement
  - local-name: Site Survey
    source-text: "From the audit: item 38, all new dwellings and all majors; less than 12 months old"
    source-url: https://www.eastleigh.gov.uk/media/16280/1375261-local-validation-list-2026.pdf
    suggested-id: topographical-survey

low-confidence:
  - id: landscaping-plan
    note: "Audit (wrong_trigger): the excerpt stops at 'Required for applications whereby:' and the audit doesn't give the conditions. Item 20 accepts indicative landscaping plans for Outline."
  - id: transport-assessment
    note: "Audit (wrong_trigger): the excerpt is the parking item 30 text; the Transport Assessment trigger needs re-reading in the list."
  - id: noise-assessment
    note: "Audit (wrong_trigger): the excerpt starts with an NDSS URL and gives no trigger; re-read the Noise item in the list."

new-fields:
  - field: out-of-centre
    kind: boolean
    label: Outside a town centre
    description: The site is outside an existing town, district or local centre.
  - field: telecommunications-equipment
    kind: boolean
    label: Telecommunications mast or antenna
    description: The proposal includes a telecommunications mast, antenna or base station.
