low-confidence:
  - id: fire-statement
    note: "The Outline excerpt is the DMPO outline access rule, not a Fire Statement trigger; the national
      rules apply."
  - id: recreation-facilities-assessment
    note: "Audit (wrong_trigger): the excerpt under the Open Space Assessment heading is odour assessment
      text; the list's trigger wasn't captured."
  - id: town-centre-impact-assessment
    note: "Audit (wrong_trigger): the excerpt is only the item heading; the list's trigger wasn't captured."
  - id: flood-risk-assessment
    note: "Audit (wrong_trigger): the excerpt is a list of sources and a page header; the list's trigger
      wasn't captured."
