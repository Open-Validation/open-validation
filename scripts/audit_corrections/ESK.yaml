    note: "Audit (wrong_trigger): fragment ('by and Affordable Housing Statement.'); no trigger captured."
  - id: planning-statement
    note: "The workbook's excerpt is a fragment about where to put personal reasoning; no trigger captured."
  - id: section-existing
