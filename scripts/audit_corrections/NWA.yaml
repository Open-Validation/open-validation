# Corrections for North Warwickshire Borough Council, from the council's audit.
# The audit read the only published list, the Planning Application Validation Requirements (cover
# dated July 2014; published by the council as 'validation document 2017', June 2017). It is
# organised by application type (sections 2-17) with Appendix B describing each local item. It still
# cites saved 2006 Local Plan policies and BS 5837:2005. Grokbot's extraction is thin: most types
# show no local requirements and about 15 Appendix B items are missing. Items marked "From the
# audit" use the audit's paraphrase; quoted words are the council's.
local-authority: NWA

drop:
  - id: schedule-of-works
    reason: "wrong_trigger: the excerpt is the BS 5837 tree method statement text (re-added below for listed
      building works)"
  - id: photos
    reason: "wrong_trigger: the photographic record is part of the Structural Survey item, not a separate
      requirement"

drop-unmapped:
  - local-name: Highways / access details (visibility splays)
    reason: "wrong_trigger: the excerpt is the Phase I Environmental Report requirement (now in
      land-contamination-assessment)"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: advice, not a validation requirement"
  - local-name: Coal Mining / Land Stability Risk Assessment
    reason: "wrong_trigger: cut off, losing the referral area condition; re-added below"
  - local-name: Advertisement drawings / illumination details
    reason: "duplicate: the same lighting assessment text as lighting-assessment"

requirements:
  - id: affordable-housing-statement
    action: add
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: low
    notes: "From the audit (missing_requirement): an Appendix B item; the audit gives no trigger."

  - id: air-quality-assessment
    action: add
    required-if:
      site:
        in: [air-quality-management-area]
        description: Development in or next to an Air Quality Management Area.
    source-text: Air Quality Assessment - development in or next to an Air Quality Management Area
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: medium
    notes: "Audit (missing_requirement): Appendix B."

  - id: elevation-existing
    action: update
    must-include:
      - item: All external elevations
        level: must
    notes: "Existing Elevations and Floor Plans 'MUST show the existing layout of each floor, all external
      elevations and the roof plan'."

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: An Environmental Statement is required.

  - id: flood-risk-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - any:
            - site:
                in: [flood-risk-zone]
                description: Flood Zones 2 and 3.
            - condition:
                field: site-area-residential
                operator: ">="
                value: 1
                description: Sites of 1ha or more in Flood Zone 1.
            - condition:
                field: site-area-non-residential
                operator: ">="
                value: 1
                description: Sites of 1ha or more in Flood Zone 1.
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: medium
    notes: "From the audit (wrong_trigger, wrong_app_type): the workbook's excerpt ('may be necessary') lost
      the thresholds; full and outline applications. Prior approval change of use also asks for flood
      evidence."

  - id: floor-plan-existing
    action: update
    must-include:
      - item: The existing layout of each floor
        level: must
      - item: The roof plan
        level: must

  - id: heritage-statement
    action: add
    required-if:
      any:
        - site:
            in: [conservation-area]
            description: The site is within or adjoining a designated Conservation Area (a Conservation
              Area Statement).
        - site:
            in: [scheduled-monument, park-and-garden]
            description: Next to a Scheduled Ancient Monument, Historic Park/Garden or battlefield.
    source-text: >-
      If the application site is located within or adjoining a designated Conservation Area, then the
      Council will require a Conservation Area Statement.
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: medium
    notes: "From the audit (missing_requirement): the Conservation Area Statement applies to householder and
      other applications; a Heritage Statement is needed next to a Scheduled Ancient Monument, Historic
      Park/Garden or battlefield (Appendix B). Battlefields can't be expressed in the rule."

  - id: land-contamination-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - any:
            - condition:
                field: new-build
                value: true
                description: The erection of new dwellings or buildings.
            - condition:
                field: sensitive-end-use
                value: true
                description: Buildings with a sensitive end use.
        - site:
            in: [contaminated-land]
            description: An area of potential contamination or at risk of migrating land gas.
    source-text: >-
      For proposals involving the erection of new dwellings or buildings with a sensitive end use, if
      the application falls within an area of potential contamination or at risk of migrating land
      gas, a Phase I Environmental Report MUST be submitted.
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: medium
    notes: "The trigger was in the workbook's highways row (wrong_trigger). Full and outline sections (audit,
      missing_requirement); prior approval change of use asks for a Phase One report if requested."

  - id: lighting-assessment
    action: update
    required-if:
      all:
        - application-type:
            in: [advertising]
        - condition:
            field: illuminated
            value: true
            description: The application involves illuminated advertisements.
    source-text: In the case of applications that involve illuminated advertisements, a lighting
      assessment MUST be included.
    confidence: medium

  - id: noise-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: noise-sensitive-use
            value: true
            description: Noise-sensitive development.
        - condition:
            field: noise-generating-use
            value: true
            description: Proposals next to noise-sensitive sites.
        - discretionary
    source-text: A noise Impact Assessment if requested by the Council
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: medium
    notes: "From the audit (wrong_trigger): noise-sensitive development or proposals next to noise-sensitive
      sites; the list also says 'if requested by the Council'."

  - id: planning-statement
    action: add
    required-if:
      any:
        - ref: major-development
        - site:
            in: [green-belt]
            description: Inappropriate development in the Green Belt.
        - condition:
            field: loss-of-use
            value: true
            description: Loss of tourist accommodation.
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: low
    notes: "From the audit (missing_requirement): a Supporting Planning Statement for major applications,
      inappropriate development in the Green Belt and loss of tourist accommodation. The rule can't limit
      the Green Belt branch to inappropriate development or the loss branch to tourist accommodation."

  - id: recreation-facilities-assessment
    action: add
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: low
    notes: "From the audit (missing_requirement): an Open Space Statement is an Appendix B item; no trigger
      given."

  - id: schedule-of-works
    action: add
    required-if:
      application-type:
        in: [lbc]
    source-text: Listed Building applications with structural or repair works
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    must-include:
      - item: How, where and why certain work is to be undertaken
        level: must
        source-text: >-
          Where a Detailed Schedule of Work/Repairs is necessary, this will describe how, where and why
          certain work is to be undertaken.
    confidence: medium
    notes: "From the audit (missing_requirement): a Detailed Schedule of Work for listed building
      applications with structural or repair works."

  - id: section-existing
    action: update
    must-include:
      - item: Neighbouring property identified
        level: must
    notes: "'For Site Sections and Ground Levels, neighbouring property should be identified.'"

  - id: section-proposed
    action: update
    must-include:
      - item: Neighbouring property identified
        level: must
    notes: "'For Site Sections and Ground Levels, neighbouring property should be identified.'"

  - id: site-plan
    action: update
    must-include:
      - item: Scale of 1:200 or 1:500
        level: must
      - item: The site boundaries in detail, particularly in relation to neighbouring buildings,
          dwellings and land
        level: must
      - item: Existing extensions and other structures within the site and at immediate neighbouring
          properties
        level: must
      - item: Roads and public rights of way, trees, hard surfacing and boundary treatments, where they
          influence or would be affected by the proposal
        level: must

  - id: sustainability-statement
    action: replace
    required-if:
      any:
        - condition:
            field: departure-from-development-plan
            value: true
            description: A departure from the Plan.
        - condition:
            field: eia-development
            value: true
            description: An EIA application.
        - discretionary
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: medium
    notes: "From the audit (wrong_trigger): departures from the Plan, EIA applications and applications under
      policy ECON2 (shown as officer discretion). The workbook quoted a generic time-extension paragraph."

  - id: transport-assessment
    action: update
    required-if: discretionary
    notes: "The excerpt is cut off ('… transport implications, Transport Assessments must be prepared')."

  - id: travel-plan
    action: add
    required-if:
      ref: major-development
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: medium
    notes: "From the audit (missing_requirement): a Green Travel Plan for major applications."

  - id: waste-management-plan
    action: add
    required-if:
      ref: major-development
    source-text: Site Waste Management Plan - All major applications
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    confidence: medium
    notes: "Audit (missing_requirement): Appendix B."

unmapped:
  - local-name: Coal Mining Risk Assessment
    source-text: "use application, a Coal Mining Risk Assessment MUST be submitted. (From the audit: full and
      outline applications in a Coal Mining Development Referral Area, other than change of use)"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: coal-mining-risk-assessment
  - local-name: Draft S106/CIL heads of terms
    source-text: "From the audit: major applications, departures and affordable housing"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: planning-obligations-heads-of-terms
  - local-name: Landscape Appraisal
    source-text: "From the audit: major applications at or beyond settlement edges"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: landscape-visual-impact-assessment
  - local-name: Landscaping Maintenance Statement
    source-text: "From the audit: an Appendix B item; no trigger given"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: ""
  - local-name: Local Services/Community Facilities Statement
    source-text: "From the audit: loss of services or facilities"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: community-facilities-statement
  - local-name: Agricultural/Rural Economy Statement
    source-text: "From the audit: new dwellings outside development boundaries, agricultural buildings, farm
      diversification"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: agricultural-appraisal
  - local-name: Hedgerow historical report
    source-text: "From the audit: hedgerow removal"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: ""
  - local-name: Demolition Statement
    source-text: "From the audit: demolition in a conservation area"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: demolition-statement
  - local-name: Tree reports for works to trees
    source-text: "From the audit: a tree professional's report (health/safety reasons), and engineer and
      arborist reports (subsidence)"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: ""
  - local-name: Justification for variation of condition
    source-text: "From the audit: full justification for s73 applications"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: ""
  - local-name: Evidence for certificates of lawfulness
    source-text: "From the audit: dated evidence of use and scaled plans"
    source-url: https://www.northwarks.gov.uk/downloads/file/370/validation-document-2017
    suggested-id: lawful-development-evidence

low-confidence:
  - id: biodiversity-survey-report
    note: "Audit (wrong_trigger): the excerpt is a generic time-extension paragraph; the trigger wasn't
      captured."
  - id: roof-plan-existing
    note: "Audit (wrong_trigger): the excerpt is only 'and the roof plan.'; the roof plan is part of the
      existing elevations and floor plans."
  - id: roof-plan-proposed
    note: "Audit (wrong_trigger): the excerpt is only 'and the roof plan.'."
  - id: design-and-access-statement
    note: "The excerpt says only 'if necessary' (Appendix C gives the national cases) and runs into the
      Conservation Area Statement (now in heritage-statement)."
  - id: arboriculturist-report
    note: "The excerpt is a BS 5837 fragment with no trigger (the list cites the 2005 standard)."
  - id: town-centre-impact-assessment
    note: "The excerpt says what a Retail Assessment is, not when it is needed."
