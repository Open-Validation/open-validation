# Corrections for Boston Borough Council, from the council's audit.
# Boston reverted to the national requirements from 1 April 2021 ('the Council has determined to
# revert to National Requirements, with effect from 1st April 2021'). Its Validation Guidance PDF is
# guidance only, not a formal local list, so nothing is added from it. The audit notes that the
# guidance mentions a Habitats Regulations Assessment for major housing within 10km of The Wash and
# North Norfolk Coast, and a Retail Impact Assessment for 500m2+ outside Boston town centre; these are
# not local validation requirements. The council's planning page calls the guidance 'adopted in early
# 2019', but the PDF itself is dated April 2021.
local-authority: BOT

validation-list:
  status: national-only
  date-basis: "audit: guidance PDF dated April 2021; national requirements apply from 1 April 2021"
