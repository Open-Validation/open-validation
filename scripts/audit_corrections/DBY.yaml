  - local-name: Cumulative Impact Assessment (LR33)
    source-text: "From the audit: listed in the county list; no trigger given"
    source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
    suggested-id: ""
  - local-name: Completed validation checklist (LR35)
    source-text: "PLANNING SERVICES LOCAL LIST OF INFORMATION REQUIREMENTS 3.250 A completed checklist relevant to
