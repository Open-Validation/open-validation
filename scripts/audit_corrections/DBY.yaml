    source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
    suggested-id: public-rights-of-way-statement
  - local-name: Dust Assessment (LR18)
    source-text: "From the audit: listed in the county list; no trigger given"
    source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
    suggested-id: dust-assessment
  - local-name: Odour Assessment (LR20)
    source-text: "From the audit: waste, composting, anaerobic digestion, MBT and remediation proposals"
    source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
    suggested-id: odour-assessment
  - local-name: Bioaerosol Assessment (LR21)
    source-text: "From the audit: composting and anaerobic digestion proposals"
    source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
    suggested-id: bioaerosol-assessment
  - local-name: Community Use Statement (LR26)
    source-text: "From the audit: mainly schools"
    source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
    suggested-id: community-use-statement
  - local-name: Ground Stability / Mining Risk Assessment (LR28)
    source-text: "From the audit: sites in a Coal Authority Development High Risk Area"
    source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
    suggested-id: coal-mining-risk-assessment
  - local-name: Soil Assessment (LR29)
    source-text: "From the audit: significant loss of agricultural land"
    source-url: https://www.derbyshire.gov.uk/site-elements/documents/pdf/environment/planning/planning-applications/making-a-planning-application/planappforms/local-list-of-information-requirements-and-validation-checklists.pdf
