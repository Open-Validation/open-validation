    source-text: "From the audit: item 53, for all development"
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
    suggested-id: air-quality-neutral-assessment
  - local-name: Residential Standards Statement
    source-text: "From the audit: item 55, for 1+ dwellings"
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
    suggested-id: housing-standards-statement
  - local-name: Health Impact Assessment
    source-text: "From the audit: item 60, for 100+ homes or 10,000m2+"
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
    suggested-id: health-impact-assessment
  - local-name: Outbuildings / Granny Annexes Statement
    source-text: "Outbuildings / Granny Annexes Statement - Applications proposing outbuildings"
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
    suggested-id: outbuildings-statement
  - local-name: Section 96A and Section 73 Documents
    source-text: "Section 96A and Section 73 Documents - All s96A and s73 applications"
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
    suggested-id: amendment-documents

low-confidence:
  - id: arboriculturist-report
    note: "Audit (wrong_trigger): the excerpt is column-interleaved ('BS5837 comprising a dwelling or dwellings, or other a. a tree survey; ...'); the trigger is unclear."
  - id: cil-form
    note: "Audit (wrong_trigger): the excerpt 'of the CIL Regulations 2010 (as amended) 2.' is a fragment."
  - id: daylight-sunlight-assessment
    note: "Audit (wrong_trigger): the excerpt 'and Average Daylight Factor (ADF) is required.' is a fragment with no threshold."
  - id: sustainability-statement
    note: "Audit (wrong_trigger): the excerpt is EIA screening text, not an energy or sustainability trigger."
  - id: section-existing
    note: "Audit (wrong_trigger): the excerpt is tree survey text."
  - id: section-proposed
    note: "Audit (wrong_trigger): the excerpt is tree survey text."

new-fields:
  - field: scheduled-monument
    kind: designation
    label: Scheduled monument
    description: Site is in, contains or is near a scheduled monument (dataset scheduled-monument).
  - field: main-town-centre-use-out-of-centre
    kind: boolean
    label: Town centre use outside a centre
    description: The proposal is for a main town centre use in an edge-of-centre or out-of-centre location.
  - field: staff-count
    kind: number
    label: Staff
    description: Number of staff (employees) the development will accommodate.
  - field: car-free
    kind: boolean
    label: Car-free development
    description: The proposal is car-free (no general car parking is provided).
  - field: affects-open-space
    kind: boolean
    label: Affects open space or playing fields
    description: The proposal affects existing open space, Metropolitan Open Land, sports or recreation land, or playing fields.
