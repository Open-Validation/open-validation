  - local-name: Urban Greening Factor
    source-text: "From the audit: item 10, for major development"
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
    suggested-id: urban-greening-factor
  - local-name: Structural Impact Assessment
    source-text: "From the audit: item 14, a listed building consent item"
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
