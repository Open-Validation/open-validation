    suggested-id: water-efficiency-statement
  - local-name: Play Strategy
    source-text: "From the audit: item 47, for major development"
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
    suggested-id: play-strategy
  - local-name: Ventilation/Extraction Statement
    source-text: "From the audit: item 51, for commercial kitchen extraction"
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
