  - local-name: Planning Fire Safety Strategy / Reasonable Exception Statement
    source-text: >-
      Householder & Non-major developments must submit a Planning Fire Safety Strategy (PFSS) or a
      Reasonable Exception Statement, if it is considered that parts or all of policy D12A of the
      London Plan are not relevant.
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
    suggested-id: planning-fire-safety-strategy
  - local-name: Waste management applications information
    source-text: "All waste management applications Refer to the Schedule: 'Information which may be required for a planning application list of documents', within the South London Waste Plan 2022."
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
    suggested-id: minerals-waste-statement
  - local-name: Biodiversity Enhancement Statement
    source-text: "From the audit: item 8, for BNG-exempt applications"
    source-url: https://www.merton.gov.uk/sites/default/files/2026-06/260610%20Local%20Validation%20Checklist%202025%20%28Updated%29.pdf
