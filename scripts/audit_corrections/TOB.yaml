low-confidence:
  - id: town-centre-impact-assessment
    note: "The excerpt ('all main town centre uses.') is a fragment with no trigger; re-read the list."
  - id: planning-statement
    note: >-
      Only the application statements for s73 (3.1.3), discharge of conditions (3.1.4) and
      non-material amendments (3.1.5) are captured. The 3.1.1 Planning Statement for other
      applications is on the checklists, but its trigger wasn't captured.
