  - id: daylight-sunlight-assessment
    action: add
    required-if: discretionary
    source-url: https://www.salford.gov.uk/planning-building-and-regeneration/planning-applications/apply-for-planning-permission/validation-checklist/
    confidence: low
    notes: >-
      From the audit (other): the validation checklist page warns that further documents not on
      the list may be requested, naming daylight/sunlight assessments (also agricultural land use
