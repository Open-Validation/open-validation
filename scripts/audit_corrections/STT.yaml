low-confidence:
  - id: biodiversity-survey-report
    note: "Audit (wrong_trigger): fragment ('of any protected species.'); no trigger captured."
  - id: section-existing
    note: "Audit (wrong_trigger): the excerpt runs items 12 (site sections and levels) and 13 (roof plans)
      together; item 12's trigger was not captured."
  - id: section-proposed
