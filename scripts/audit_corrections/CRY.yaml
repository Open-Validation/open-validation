# Corrections for London Borough of Croydon, from the council's audit.
# The audit compared the workbook with Croydon's Local Validation List, published May 2026 after
# consultation (the build already takes that url and date). Croydon keys its requirements to size
# bands ('All applications', 'Minors+', 'Large Minors+', 'Majors', 'GLA referable') and to
# development types, not to application types; it has no separate householder table. 'Minors+'
# is shown as major or minor development, and 'Large Minors+' as major or large minor
# development (the band definitions are in the list's Definitions chapter, not in the extract).
# Items marked 'From the audit' use the audit's summary, not the council's exact words.
local-authority: CRY

submission-standards:
  - item: Documents in PDF or Open Document Format; plans state the paper size and scale and are 
      scalable
    level: should
  - item: All plans and drawings at a standard metric scale, with a scale bar, drawing number, 
      title, and a north arrow on plans
    level: must
  - item: Individual documents no larger than 5MB; larger documents split into sensibly labelled 
      chapters
    level: should
  - item: Where personal or sensitive information is unavoidable, a suitably redacted version also 
      provided for publication
    level: should

drop:
  - id: sustainability-statement
    reason: "wrong_trigger: the excerpt is Energy Assessment content; moved to energy-statement below"

drop-unmapped:
  - local-name: Sunlight to gardens/amenity space / outdoor amenity
    reason: "other: not a separate requirement; a fragment of the Housing Quality Statement text"
  - local-name: Marketing / vacancy evidence (loss of use)
    reason: "duplicate: quotes the same Employment Assessment entry as 'Employment / Economic Statement'"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: the excerpt is Affordable Housing Statement text; re-added below"
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: the excerpt is flood risk assessment text; re-added below"
  - local-name: Pre-application advice / engagement details
    reason: "wrong_trigger: the council's service description, not a trigger; re-added below"
  - local-name: Housing mix / dwelling standards (NDSS, accessible homes)
    reason: "wrong_trigger: fragment with no trigger; re-added below as Housing Quality Statement"

requirements:
  - id: environmental-statement
    action: replace
    required-if:
      condition:
        field: eia-development
        value: true
        description: EIA development.
    source-text: "Environmental Statement - EIA development"
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the Preliminary Roost Assessment text (now in biodiversity-survey-report)."

  - id: biodiversity-survey-report
    action: replace
    required-if:
      any:
        - site:
            in: [local-wildlife-site, site-of-special-scientific-interest]
            description: The site is within or next to a SINC, SSSI, NNR and/or LNR.
        - condition:
            field: demolition
            value: true
            description: A building is demolished (Preliminary Roost Assessment).
        - condition:
            field: involves-change-of-use
            value: true
            description: A vacant building is converted (Preliminary Roost Assessment).
        - discretionary
    source-text: >-
      Preliminary Ecological Assessment All applications where the site is within or adjacent to
      a SINC, SSSI NNR and/or LNR … A Preliminary Roost Assessment (PRA) is required where a
      vacant building is converted, a building is demolished, or where a building or tree has
      potential roost features.
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: >-
      Built from the Preliminary Ecological Assessment row and the Preliminary Roost Assessment
      text the workbook had under Environmental Statement. Buildings or trees with potential roost
      features are shown as officer discretion.

  - id: planning-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - condition:
            field: minor-development
            value: true
            description: Minor development (Croydon's 'Minors' band).
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted bin and cycle store drawing text. From the audit:
      Minors+."

  - id: section-existing
    action: replace
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: Extensions and new buildings.
        - condition:
            field: basement
            value: true
            description: The proposal includes a basement.
        - discretionary
    source-text: >-
      Section Drawings For extensions and new buildings, long and short section(s) through the
      building(s) and access routes should show existing and finished levels and gradients of
      slopes.
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    must-include:
      - item: Long and short sections through the building(s) and access routes, showing existing 
          and finished levels and gradients of slopes
        level: should
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook quoted landscaping and definitions text. From the audit:
      topographical drawings for new buildings, significant level changes (shown as officer
      discretion) and/or basements. The council's wording is from its drawing standards.

  - id: section-proposed
    action: replace
    required-if:
      any:
        - condition:
            field: new-build
            value: true
            description: Extensions and new buildings.
        - condition:
            field: basement
            value: true
            description: The proposal includes a basement.
        - discretionary
    source-text: >-
      Section Drawings For extensions and new buildings, long and short section(s) through the
      building(s) and access routes should show existing and finished levels and gradients of
      slopes.
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    must-include:
      - item: Long and short sections through the building(s) and access routes, showing existing 
          and finished levels and gradients of slopes
        level: should
    confidence: medium
    notes: "As section-existing."

  - id: sci
    action: replace
    required-if:
      any:
        - ref: major-development
        - condition:
            field: large-minor-development
            value: true
            description: Large minor development (Croydon's 'Large Minors' band).
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt was a fragment. From the audit: a Community
      Engagement Statement for Large Minors+."

  - id: recreation-facilities-assessment
    action: replace
    required-if:
      site:
        in: [open-space]
        description: Open space, sports or recreation land, or playing fields are affected.
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the excerpt 'communal and play space).' is a fragment. From the audit:
      an Open Space and Recreation Assessment where open space, sports/recreation land or playing fields
      are affected."

  - id: waste-management-plan
    action: replace
    required-if:
      any:
        - ref: major-development
        - condition:
            field: minor-development
            value: true
            description: Minor development (Croydon's 'Minors' band).
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    must-include:
      - item: 1:50 drawings showing the dimensions of bin storage and the access to and from it
        level: should
        source-text: "1:50 drawings should be provided, showing the dimensions of cycle storage, bin storage,
          and the access to and from those facilities."
    confidence: medium
    notes: "Audit (wrong_trigger, missing_requirement): the excerpt was a drawing fragment. From the audit:
      Refuse and Recycling Strategy for Minors+."

  - id: daylight-sunlight-assessment
    action: replace
    required-if:
      ref: major-development
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the excerpt left out the threshold. From the audit: Majors."

  - id: land-contamination-assessment
    action: replace
    required-if:
      any:
        - ref: major-development
        - site:
            in: [contaminated-land]
            description: The site has previous polluting uses.
    source-text: "Majors; sites with previous polluting uses"
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted only the exemption ('will not be required if there
      is no evidence or likelihood of contamination')."

  - id: archaeological-assessment
    action: replace
    required-if:
      all:
        - ref: major-development
        - any:
            - site:
                in: [archaeological-priority-area]
                description: The site is in an Archaeological Priority Area.
            - condition:
                field: site-area-residential
                operator: ">"
                value: 0.5
                description: The site is over 0.5 hectares.
            - condition:
                field: site-area-non-residential
                operator: ">"
                value: 0.5
                description: The site is over 0.5 hectares.
    source-text: "Archaeological Assessment - Majors within an Archaeological Priority Area; Majors over
      0.5Ha"
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    must-include:
      - item: A desk-based assessment of previous uses on the site and any previous ground 
          disturbance
        level: must
        source-text: "At the very least, a desk-based assessment of previous uses on the site and any
          previous ground disturbance must accompany an application."
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt left out the threshold."

  - id: energy-statement
    action: add
    required-if:
      any:
        - ref: major-development
        - all:
            - condition:
                field: minor-development
                value: true
                description: Minor development (Croydon's 'Minors' band).
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The development is residential.
    source-text: "Energy Assessment - Majors / Energy Design Statement - residential Minors"
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    must-include:
      - item: Any necessary carbon offset contribution calculation
        level: should
        required-if:
          ref: major-development
        source-text: "The Energy Assessment should also include any necessary carbon offset contribution
          calculation in line with policy."
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted carbon-offset content (mapped to sustainability-statement)
      rather than the triggers: an Energy Assessment for Majors and an Energy Design Statement for residential
      Minors."

  - id: viability-assessment
    action: replace
    required-if:
      all:
        - ref: major-development
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: Major residential development that does not meet the fast-track criteria.
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    must-include:
      - item: A full unredacted Financial Viability Assessment, for publication online
        level: must
        source-text: "A full unredacted FVA is required (which will be published online for transparency)."
    confidence: medium
    notes: "Audit (wrong_trigger): the excerpt gave no trigger. From the audit: major residential schemes
      not meeting the fast-track criteria (only then is it needed)."

  - id: town-centre-impact-assessment
    action: replace
    required-if:
      condition:
        field: out-of-centre-town-centre-use
        value: true
        description: Town centre uses in edge-of-centre or out-of-centre locations.
    source-text: "A Retail Impact Assessment is required where floorspace is 2,500sqm and over."
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook had only the 2,500sqm Retail Impact Assessment threshold.
      From the audit: a sequential test and impact assessment for town centre uses in edge-of-centre or
      out-of-centre locations."

  - id: transport-assessment
    action: replace
    required-if:
      any:
        - ref: major-development
        - condition:
            field: minor-development
            value: true
            description: Minor development (Transport Statement).
    source-text: "Transport Assessment/Statement - Minors+ (full Transport Assessment for Majors)"
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    must-include:
      - item: A full Transport Assessment referring to TfL's Healthy Streets and Active Travel Zone 
          assessment guidance
        level: must
        required-if:
          ref: major-development
        source-text: "For major applications a full Transport Assessment (TA) will be required, which
          should refer to TfL's healthy streets and Active Travel Zone assessment guidance."
    confidence: medium
    notes: "Audit (wrong_trigger): described as majors only, but a Transport Statement is required for
      Minors+."

  - id: affordable-housing-statement
    action: replace
    required-if:
      all:
        - ref: major-development
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: Major residential development.
    source-text: >-
      The affordable housing statement must include: a schedule setting out the market and
      affordable housing proposed, including a breakdown by units, habitable rooms, and floor area
      (both GIA and GEA)
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    policy: "London Plan 2021 policies H4-H8"
    must-include:
      - item: A schedule of the market and affordable housing proposed, by units, habitable rooms 
          and floor area (GIA and GEA)
        level: must
    confidence: medium
    notes: "Audit (wrong_trigger, wrong_app_type): the excerpt merged in the next table row; the item
      is for Major Residential schemes only."

  - id: design-and-access-statement
    action: add
    required-if:
      any:
        - condition:
            field: floorspace
            operator: ">="
            value: 100
            description: 100 sqm or more of new floorspace (including householder extensions).
        - all:
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: One or more homes.
            - site:
                in: [conservation-area, world-heritage-site]
                description: The site is in a designated area.
        - application-type:
            in: [lbc]
        - ref: major-development
        - condition:
            field: large-minor-development
            value: true
            description: Large minor development (Croydon's 'Large Minors' band).
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): 100sqm+, 1+ home in a designated area, listed building
      consent, and Large Minors+."

  - id: construction-management-plan
    action: add
    required-if:
      any:
        - ref: major-development
        - condition:
            field: large-minor-development
            value: true
            description: Large minor development (Croydon's 'Large Minors' band).
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): a Construction Management/Logistics Plan scoping note
      for Large Minors+."

  - id: air-quality-assessment
    action: add
    required-if:
      ref: major-development
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): all Majors."

  - id: travel-plan
    action: add
    required-if:
      ref: major-development
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): a Draft Travel Plan for all Majors."

  - id: noise-assessment
    action: add
    required-if:
      ref: major-development
    source-url: 
      https://www.croydon.gov.uk/sites/default/files/2026-04/croydon-local-validation-list-may-2026.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): a Noise and Vibration Impact Assessment for all Majors."

  - id: fire-statement
    action: update
    required-if:
      always: true
    notes: "'All applications need a supporting statement setting out the fire strategy for the site,
      or an Exception Statement explaining why one is not needed' (council's wording), householder included."

  - id: photos
    action: update
    required-if:
      always: true

  - id: bng-metric
    action: update
    required-if:
      always: true
    notes: "All applications should explain whether they are exempt from BNG, and if not, how it will
      be delivered (council's wording); householder included."

  - id: cil-form
    action: update
    required-if:
      always: true

  - id: site-plan
    action: update
    required-if:
      always: true

  - id: arboriculturist-report
    action: update
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: Trees are present on or next to the development site.

  - id: heritage-statement
    action: update
    required-if:
      site:
        in: [scheduled-monument, listed-building, conservation-area, park-and-garden, 
              locally-listed-building, listed-building-setting]
        description: The application affects a heritage asset (designated or non-designated) or the 
          setting of one.
    notes: "Not limited to listed building consent: 'Required for all applications that affect a heritage
      asset' (council's wording), householder included."

  - id: telecommunications-report
    action: update
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: Telecommunications masts.

  - id: elevation-proposed
    action: update
    must-include:
      - item: Existing and proposed elevations of all sides of the building or structure, with 
          materials annotated
        level: must
        source-text: >-
          Elevations For external alterations, extensions, or new buildings, detailed existing and
          proposed elevations of all sides of the exterior of the building/structure with materials
          annotated.
      - item: Street elevations showing the proposal in relation to neighbouring buildings, with 
          heights annotated
        level: must
        required-if:
          condition:
            field: new-build
            value: true
            description: The proposal includes new buildings.
        source-text: "Street elevations are required for new buildings, accurately showing the proposal
          in relation to neighbouring buildings with heights annotated"

