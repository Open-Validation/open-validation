    suggested-id: ""

new-fields:
  - field: change-in-ground-levels
    kind: boolean
    label: Change in ground levels
    description: The proposal changes ground levels, or is proposed next to changing ground levels.
  - field: special-area-of-conservation
    kind: designation
    label: Special Area of Conservation
    description: Site is in or near a Special Area of Conservation (dataset special-area-of-conservation).
  - field: scheduled-monument
    kind: designation
    label: Scheduled monument
    description: The proposal affects a scheduled monument (dataset scheduled-monument).
  - field: outside-urban-area
    kind: boolean
    label: Outside the main urban area
    description: The site is outside the main urban area or settlement boundary defined in the local plan.
