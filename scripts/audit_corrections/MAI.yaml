    suggested-id: ""
  - local-name: Drawings for offsite highway works
    source-text: "From the audit: B18, listed; no trigger given"
    source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
    suggested-id: ""
