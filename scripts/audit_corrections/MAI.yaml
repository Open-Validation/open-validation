  - local-name: Shadow habitat regulation assessment (nutrient neutrality)
    source-text: "If the development results “in a net increase in population served by a wastewater system” – see the Natural England advice letter (March 2022) on the council website and falls within the catchment of the River Stour, then the applicant will be expected to show how they will achieve nutrient neutrality as part of their application."
    source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
    suggested-id: habitats-regulations-assessment
  - local-name: Minerals assessment
    source-text: "Site in a Minerals Safeguarding Area, unless exempt"
    source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
    suggested-id: minerals-assessment
  - local-name: Structural survey or statement
    source-text: "B7 Structural survey or statement Open conversions of buildings in the countryside where applicant is relying on the building being structurally sound proposed works to a listed building that involve demolition or affect the structural integrity of the building (this includes works to remove, or reinforce elements of an existing listed building)"
