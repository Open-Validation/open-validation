    suggested-id: ""
  - local-name: Active transport statement
    source-text: "From the audit: B13, 10+ dwellings or 0.5 ha, 1,000 sqm+, sites of 1 ha+, change of use of 1,000 sqm+"
    source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
    suggested-id: ""
  - local-name: Statement of social value
    source-text: "From the audit: B14, 20+ units or commercial over 500 sqm"
    source-url: https://maidstone.gov.uk/home/primary-services/planning-and-building/planning/apply-for-planning-permission/validation-checklist
    suggested-id: ""
  - local-name: Housing intensification planning statement
    source-text: "From the audit: B16, HMOs over 6 occupants, or a single dwelling converted to 2+ flats"
