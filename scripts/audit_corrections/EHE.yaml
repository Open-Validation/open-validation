low-confidence:
  - id: transport-assessment
    note: >-
      The excerpt's trigger ('All applications for new development for 1 or more residential dwellings
      or an increase in non-residential floorspace') follows sustainability policies (CC1-CC3, WAT4,
      Sustainability SPD) and matches the audit's L48 Carbon Reduction Template trigger, so it may
      belong to that item rather than to the Transport Assessment.
  - id: flood-risk-assessment
    note: "From the audit: L12 Flood Risk Assessment is conditional and also applies to householder
      applications; the excerpt gives contents, not the trigger."
  - id: elevation-existing
    note: "The workbook excerpt was Fire Statement text; the drawing is national."
  - id: elevation-proposed
    note: "The workbook excerpt was Fire Statement text; the drawing is national."
