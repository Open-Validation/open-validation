  - local-name: Business case (item 7)
    source-text: "From the audit: new visitor accommodation"
    source-url: https://www.staffordbc.gov.uk/planning-application-validation-criteria
    suggested-id: ""
  - local-name: Cannock Chase SAC statement of willingness (item 8)
    source-text: "From the audit: within 15km with a net increase in dwellings, HMO units or Gypsy/Traveller
