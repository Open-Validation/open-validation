# Corrections for North Northamptonshire Council, from inputs/audit/north-northamptonshire-council.json.
# The audit found no unified North Northamptonshire local validation list. Grokbot's link is the
# general 'Supporting documents and reports' guidance page (last updated 19 May 2023), which gives
# triggers only for the Design and Access Statement, Heritage Impact Assessment and Tree Survey and
# lists other documents as needed "depending on the application". Legacy area lists (e.g. Corby's
# 2018 'Validation Check List For Planning Applications') may still apply but were not checked.
local-authority: NNUA

validation-list:
  url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
  status: not-found
  date-basis: >-
    audit: no unified local validation list found; the url is a general 'Supporting documents and
    reports' guidance page (last updated 19 May 2023). Legacy predecessor-area lists (e.g. Corby
    2018) appear to apply

drop:
  - id: bng-metric
    sheets: [Householder]
    reason: "wrong_app_type: the excerpt says householder applications are excepted"

drop-unmapped:
  - local-name: Biodiversity Checklist / Questionnaire
    reason: "wrong_trigger: quotes SPD guidance ('can be used to detect features'), no requirement or trigger"

requirements:
  - id: bng-metric
    action: replace
    required-if:
      condition:
        field: biodiversity-gain-condition
        value: true
        description: The development is subject to the statutory biodiversity gain condition (not
          householder applications or de minimis habitats).
    source-text: >-
      All applications (except householder applications such as extensions, and de minimis
      habitats) will need to complete a Biodiversity Net Gain metric There's a mandatory requirement
      of 10% Biodiversity Net Gain for: major applications from 12 February 2024 small sites through
      the Environment Act from 2 April 2024
    source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application
    confidence: medium
    notes: "Audit (wrong_app_type): the workbook placed this under Householder, which the excerpt excepts."

  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - application-type:
            in: [lbc]
        - all:
            - site:
                in: [conservation-area]
                description: The site is in a conservation area.
            - any:
                - condition:
                    field: dwelling-count
                    operator: ">="
                    value: 1
                    description: The application is for one or more dwellings.
                - condition:
                    field: floorspace
                    operator: ">="
                    value: 100
                    description: The application is for building(s) with a floor space of 100 square
                      metres or more.
    source-text: >-
      A Design and Access Statement is required if you are making an application for a 'major'
      development or listed building consent or the site is in a conservation area and the
      application is for one or more dwellings, or building(s) with a floor space of 100sqm or more
    source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
    confidence: medium
    notes: "Audit (wrong_app_type): the workbook placed this only under Listed building consent."

  - id: heritage-statement
    action: replace
    required-if:
      site:
        in: [conservation-area, listed-building, listed-building-setting]
        description: The property is in, or adjacent to, a conservation area, or is, or is adjacent to,
          a listed building.
    source-text: >-
      Heritage Impact Assessment : This is needed if your property is in, or adjacent to, a
      conservation area or your property is, or adjacent to, a listed building
    source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt ran on into the Tree Survey text and was placed
      only under Listed building consent. 'Adjacent to a conservation area' has no designation of
      its own; it is in the description.

  - id: arboriculturist-report
    action: add
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: The property has trees.
    source-text: "Tree Survey : If your property has any trees"
    source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
    confidence: medium
    notes: "From the audit (missing_requirement): Tree survey / arboricultural implications."

  - id: site-plan
    action: replace
    source-text: location and block plans
    source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
    confidence: low
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt was page navigation text. The page lists
      location and block plans under plan and drawing requirements but gives no trigger.

  - id: air-quality-assessment
    action: add
    required-if: discretionary
    source-text: "Other documents you may need to provide, depending on the application:"
    source-url: https://www.northnorthants.gov.uk/applications-appeals-and-enforcement/make-planning-application/supporting-documents-and-reports
    confidence: low
    notes: "From the audit (missing_requirement): listed on the guidance page with no trigger."

