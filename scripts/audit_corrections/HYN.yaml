# Corrections for Hyndburn Borough Council, from the council's audit.
# Grokbot linked a guidance page about personal data, not the list, and captured no requirements. The
# current list is the 'Validation checklist for planning and other applications' (June 2025), with 47
# local requirements (sections 15-61). Everything below comes from the audit's summary of that list
# ("From the audit"); items whose trigger the audit does not give are added with confidence: low.
local-authority: HYN
submission-standards:
- item: Maps show the appropriate OS or other provider's licence number
  level: must
- item: All drawings have a scale bar and show the paper size
  level: must
- item: The Agricultural Holdings section of the form completed in all cases
  level: must
requirements:
- id: air-quality-assessment
  action: add
  required-if:
    any:
    - condition:
        field: parking-spaces
        operator: '>='
        value: 100
        description: 100 or more new parking spaces outside an AQMA.
    - all:
      - site:
          in:
          - air-quality-management-area
          description: The site is inside an Air Quality Management Area.
      - any:
        - condition:
            field: parking-spaces
            operator: '>='
            value: 50
            description: 50 or more new parking spaces.
        - condition:
            field: dwelling-count
            operator: '>='
            value: 1
            description: New dwellings.
        - condition:
            field: educational-accommodation
            value: true
            description: A school.
  source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
  source-text: 50+ new parking spaces inside an AQMA
  confidence: medium
  notes: 'From the audit (missing_requirement): item 45. The ''20+ retail inside an AQMA'' clause is not
    expressed.'
- id: arboriculturist-report
  action: add
  required-if:
    condition:
      field: trees-on-or-near-site
      value: true
      description: Development affecting trees on or adjacent to the site.
  source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
  confidence: medium
  notes: 'From the audit (missing_requirement): tree survey.'
- id: biodiversity-survey-report
  action: add
  required-if:
    any:
    - condition:
        field: protected-species
        value: true
        description: Protected species such as bats or birds may be affected.
    - condition:
        field: roof-alteration
        value: true
        description: Roof works, householder included.
    - discretionary
  source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
  confidence: medium
  notes: 'From the audit (missing_requirement): ecological, bat and bird surveys, including householder
    roof works.'
- id: bng-metric
  action: add
  required-if:
    any:
    - &id001
      ref: major-development
    - condition:
        field: minor-development
        value: true
        description: Non-major development.
  source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
  confidence: medium
  notes: 'From the audit (missing_requirement): major development from 12 Feb 2024, non-major from 2 Apr
    2024.'
- id: flood-risk-assessment
  action: add
  required-if:
    any:
    - site:
        in:
        - flood-risk-zone
        description: The site is in Flood Zone 2, 3 or 3b (householder included).
    - condition:
        field: site-area-residential
        operator: '>='
        value: 1
        description: Flood Zone 1 sites of 1 hectare or more.
    - condition:
        field: site-area-non-residential
        operator: '>='
        value: 1
        description: Flood Zone 1 sites of 1 hectare or more.
  source-url: https://www.hyndburnbc.gov.uk/download/validation-checklists-for-planning-and-other-applications/?wpdmdl=64762&ind=1751959480949&refresh=ec4428f5&filename=Validation-Checklist-For-Planning-and-other-Applications.pdf
  confidence: medium
  notes: 'From the audit (missing_requirement): FZ2/3/3b; FZ1 at 1ha or more; householder in a flood zone.'
- id: heritage-statement
  action: add
  required-if:
    site:
      in:
      - listed-building
      - listed-building-setting
      - conservation-area
