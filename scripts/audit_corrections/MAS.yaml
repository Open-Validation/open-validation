    source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
    suggested-id: design-code-compliance
  - local-name: Secured by Design Assessment
    source-text: "2.24 Secured by Design Assessment All Major Applications."
    source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
    suggested-id: crime-prevention-statement
  - local-name: School Site Suitability Checklist
    source-text: "Any planning application for a residential or mixed use development that includes a site
