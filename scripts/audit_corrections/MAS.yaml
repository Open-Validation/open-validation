      checklist should be submitted demonstrating that the proposed school site is suitable for
      the construction of high quality education buildings."
    source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
    suggested-id: school-site-suitability-checklist
  - local-name: Structural Survey
    source-text: "The demolition, or partial demolition of a Listed building(s), or The conversion of a
      Listed building. Conversion of Agricultural Buildings."
    source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
    suggested-id: structural-survey
  - local-name: Vehicle Parking, Cycle Storage and Electric Charging Points
    source-text: "Vehicle Parking, Cycle Storage and Electric Charging Points | Proposals for new dwellings
      and/or new or changes to employment premises."
    source-url: https://www.mansfield.gov.uk/downloads/file/3149/scheme-of-validation
    suggested-id: parking-plan

new-fields:
  - field: renewable-energy-development
    kind: boolean
    label: Renewable energy development
    description: The proposal is for renewable or low carbon energy generation (for example solar
      or wind) or electricity grid infrastructure.
