# Corrections for London Borough of Hammersmith & Fulham, from
# inputs/audit/london-borough-of-hammersmith-fulham.json.
# H&F publishes 12 type-specific checklists (2017-2018). The workbook used the majors checklist
# for Full planning and the LBC checklist, and its trigger excerpts are offset by one question:
# each row quotes "If yes, [this document]" followed by the NEXT question. The triggers below
# pair each document with its own question. The 'Minor, householder and full' checklist asks
# the same questions for householder and non-major applications (audit issue 5).
local-authority: HMF

validation-list:
  url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
  date: 2018-04-10
  date-basis: "audit: filename '10.04.2018'; no date in the PDF text or on the council page"

drop:
  - id: photos
    reason: "duplicate: the excerpt is 'A heritage statement including photographs'; now a must-include item of heritage-statement"
  - id: schedule-of-works
    reason: "wrong_app_type: 'Demolition method statement' from the prior notification for demolition checklist, mislabelled; see unmapped"

drop-unmapped:
  - local-name: Biodiversity Checklist / Questionnaire
    reason: "duplicate: the same Q3 'biodiversity survey and report' as biodiversity-survey-report"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: advice to seek pre-application advice"
  - local-name: Equality / accessibility statement
    reason: "wrong_trigger: offset excerpt; re-added below with its own question"
  - local-name: Marketing / vacancy evidence (loss of use)
    reason: "wrong_trigger: offset excerpt; re-added below with its own question"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: offset excerpt; re-added below as the odour management system with its own question"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: offset excerpt; re-added below with its own question"

requirements:
  - id: air-quality-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, lbc]
        - discretionary
    source-text: "Will the proposal affect or be affected by air pollution? If yes, an air quality assessment should be provided"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the next question (loss of Class B1)."

  - id: arboriculturist-report
    action: replace
    required-if:
      any:
        - all:
            - application-type:
                in: [hh, full, lbc]
            - condition:
                field: trees-on-or-near-site
                value: true
                description: Building works within five metres of the crown spread of a tree, including street trees and trees on neighbouring property.
        - all:
            - application-type:
                in: [consent-under-tpo, notice-trees-in-con-area]
            - discretionary
    source-text: >-
      Will the building works be within five metres of the crown spread of tree, including street
      trees and trees on neighbouring property? If yes, a tree survey should be provided
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger, wrong_app_type): the workbook quoted the next question (contamination)
      and put the tree-works checklist's item under Outline. The tree-works checklist asks for a
      report from a tree professional (arboriculturalist) "to support application for more than
      very minor works including felling".

  - id: biodiversity-survey-report
    action: replace
    required-if:
      any:
        - all:
            - application-type:
                in: [full]
            - ref: major-development
            - discretionary
        - all:
            - application-type:
                in: [lbc]
            - discretionary
    source-text: "Will the development impact on open space or natural habitats/protected species? If yes, a biodiversity survey and report should be provided"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger, wrong_app_type): from the majors checklist (Q3 and Part 3) and the LBC
      checklist; it isn't among the minor/householder checklist's questions.

  - id: construction-management-plan
    action: add
    required-if:
      all:
        - application-type:
            in: [full]
        - ref: major-development
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    must-include:
      - item: Draft construction plan
        level: must
      - item: Draft logistics plan
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): majors Part 3 lists a 'Draft construction plan' and a 'Draft logistics plan'."

  - id: daylight-sunlight-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, lbc]
        - discretionary
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook quoted the next question (trees). From the audit: needed
      where the proposal would affect light to a neighbouring property.

  - id: design-and-access-statement
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, lbc]
        - any:
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The proposal creates one or more dwellings.
            - condition:
                field: floorspace
                operator: ">="
                value: 100
                description: The proposal creates 100 square metres or more of floorspace.
            - site:
                in: [listed-building, conservation-area]
                description: The proposal affects a listed building or a conservation area.
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the next question (flood zone). From the audit: 1+ dwellings, 100 sqm+, or affecting a listed building or conservation area."

  - id: elevation-existing
    action: update
    must-include:
      - item: Scale 1:50 or 1:100
        level: must

  - id: elevation-proposed
    action: update
    must-include:
      - item: Scale 1:50 or 1:100
        level: must

  - id: flood-risk-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, lbc]
        - site:
            in: [flood-risk-zone, critical-drainage-area]
            description: The site is in Environment Agency Flood Zone 2 or 3, or a surface water flooding hotspot.
        - condition:
            field: ground-floor-or-basement
            value: true
            description: The proposal relates to a basement and/or ground floor level.
    source-text: >-
      Is your proposal within the Environmental Agency Flood zone 2 or 3 and relate to a basement
      and/or ground floor level? If yes, please provide the flood risk assessment (including all
      sources of surface water and sewer flooding).
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    must-include:
      - item: All sources of flooding, including surface water and sewer flooding
        level: must
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook gave no trigger. The minor/householder checklist adds surface water flooding hotspots."

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - all:
            - application-type:
                in: [hh, full]
            - any:
                - site:
                    in: [archaeological-priority-area, listed-building, listed-building-setting, locally-listed-building, conservation-area]
                    description: The development is within an archaeological priority area or would affect a heritage asset such as a listed building.
                - all:
                    - condition:
                        field: demolition
                        value: true
                        description: The building works involve demolition.
                    - site:
                        in: [conservation-area]
                        description: The site is in a conservation area.
    source-text: >-
      Is the development within an archaeological priority area or would it affect a heritage
      asset such as a listed building? If yes, a heritage statement should be provided … Does the
      building works involve demolition? If yes: A heritage statement including photographs (if in
      a conservation area or where justification is required for the loss of a building in a
      conservation area)
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    must-include:
      - item: Photographs
        level: must
        required-if:
          any:
            - application-type:
                in: [lbc]
            - condition:
                field: demolition
                value: true
                description: The building works involve demolition in a conservation area.
    confidence: medium
    notes: >-
      Audit (wrong_trigger, duplicate): the workbook quoted the demolition question and counted
      'heritage statement including photographs' twice (also as photos). The LBC checklist asks for
      a 'Heritage statement including photographs'.

  - id: land-contamination-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, lbc]
        - site:
            in: [contaminated-land]
            description: The site is contaminated or near to past or present contamination sources.
    source-text: "Is the site contaminated or near to past or present contamination sources? If yes, a land contamination assessment should be provided"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the next question (pedestrian/vehicle trips)."

  - id: lighting-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, lbc]
        - any:
            - condition:
                field: external-lighting
                value: true
                description: Neighbours may be affected by light pollution from the proposal.
            - discretionary
    source-text: >-
      Will neighbours be affected by light pollution by the proposal or are dwellings being created
      that may have obstructed access to daylight? If yes, an external/internal lighting assessment
      should be provided
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the next question (odour). Dwellings with obstructed access to daylight are officer judgement."

  - id: noise-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, lbc]
        - condition:
            field: plant-equipment
            value: true
            description: New plant or machinery that could be audible to neighbouring occupiers.
    source-text: >-
      Will the proposal involve new plant or machinery being installed that has the potential to be
      audible by neighbouring occupiers? If yes, a noise assessment should be provided
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the next question (refuse)."

  - id: roof-plan-existing
    action: update
    must-include:
      - item: Scale 1:50 or 1:100
        level: must

  - id: roof-plan-proposed
    action: update
    must-include:
      - item: Scale 1:50 or 1:100
        level: must

  - id: sci
    action: update
    required-if:
      all:
        - application-type:
            in: [full, lbc]
        - ref: major-development
    confidence: medium
    notes: "Audit (wrong_app_type): a Part 3 'Major Developments' item (10+ dwellings, or non-residential buildings/extensions of 1,000 sqm+)."

  - id: section-existing
    action: update
    must-include:
      - item: Scale 1:50 or 1:100
        level: must

  - id: section-proposed
    action: update
    must-include:
      - item: Finished floor and site levels
        level: must
      - item: Scale 1:50 or 1:100
        level: must

  - id: site-plan
    action: update
    must-include:
      - item: Scale 1:100 or 1:200
        level: must

  - id: sustainability-statement
    action: update
    required-if:
      all:
        - application-type:
            in: [full, lbc]
        - ref: major-development
    must-include:
      - item: Energy assessment
        level: must
    confidence: medium
    notes: "Audit (wrong_app_type): 'Sustainability statement incorporating energy assessment' is a Part 3 'Major Developments' item."

  - id: transport-assessment
    action: replace
    required-if:
      any:
        - all:
            - application-type:
                in: [full, lbc]
            - ref: major-development
        - all:
            - application-type:
                in: [hh, full]
            - discretionary
    source-text: "Transport statement (including refuse and recycling requirements and servicing/delivery management)"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    must-include:
      - item: Refuse and recycling requirements
        level: must
        required-if:
          ref: major-development
      - item: Servicing and delivery management
        level: must
        required-if:
          ref: major-development
    confidence: medium
    notes: >-
      Audit (wrong_app_type, missing_requirement): the Transport statement is a majors Part 3 item;
      the minor/householder checklist (Q7) also asks for a transport assessment where the proposal
      changes vehicle movements to, from or around the site.

  - id: travel-plan
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, lbc]
        - discretionary
    source-text: "Will the proposal result in a substantial increase in pedestrian/vehicle trips to the site? If yes, a travel plan should be provided"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the next question (plant/noise)."

  - id: viability-assessment
    action: update
    required-if:
      all:
        - application-type:
            in: [full]
        - ref: major-development
    must-include:
      - item: Financial viability declaration form
        level: must
    confidence: medium
    notes: >-
      Audit (wrong_app_type, missing_requirement): a majors Part 3 item. The council's planning page
      requires a financial viability declaration form with any financial viability report. The
      appraisal is published with the other application documents.

  - id: waste-management-plan
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, lbc]
        - discretionary
    source-text: "Will the proposal increase refuse or recycling capacity or change existing refuse arrangements? If yes, a refuse and recycling management plan should be provided"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the next question (light pollution)."

unmapped:
  - local-name: Accessibility statement
    source-text: "Is the development residential or will it require public access? If yes, an accessibility statement should be provided"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    suggested-id: accessibility-statement
  - local-name: Marketing report and justification statement
    source-text: "Will the proposal involve a change of use or redevelopment that will lose Class B1 or other employment generating used? If yes, a marketing report and justification statement should be provided"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    suggested-id: marketing-report
  - local-name: Odour management system
    source-text: "Will the proposal need ventilation to remove odour? If yes, an odour management system should be provided"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    suggested-id: odour-management-plan
  - local-name: Planning obligations draft heads of terms
    source-text: "Will a planning obligation be required? If yes, a planning obligations, draft head of terms should be provided"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_major_applications_10.04.2018.pdf
    suggested-id: planning-obligations-heads-of-terms
  - local-name: Construction statement for basements
    source-text: "Does your proposal involve the construction of a new basement..."
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_minor_householder_and_full_applications_21.06.17_1.pdf
    suggested-id: basement-impact-assessment
  - local-name: Demolition management plan
    source-text: "A demolition management plan – for any demolition work"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_minor_householder_and_full_applications_21.06.17_1.pdf
    suggested-id: demolition-management-plan
  - local-name: Demolition plans / demolition logistics plan
    source-text: "Demolition plans – annotated plans for demolition showing the extent of demolition in red … Demolition logistics plan – for substantial demolition with annotated plans for demolition showing the extent of demolition in red"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_minor_householder_and_full_applications_21.06.17_1.pdf
    suggested-id: demolition-plan
  - local-name: Demolition method statement (prior notification for demolition)
    source-text: "… Demolition method statement"
    source-url: https://www.lbhf.gov.uk/sites/default/files/section_attachments/validation_checklist_prior_notification_for_demolition_updated_october_2018.pdf
    suggested-id: demolition-method-statement

low-confidence:
  - id: floor-plan-existing
    note: "Audit (duplicate): the workbook's 'Floor plans / Elevations' row cites only the elevations line."
  - id: floor-plan-proposed
    note: "Audit (duplicate): the workbook's 'Floor plans / Elevations' row cites only the elevations line."

new-fields:
  - field: ground-floor-or-basement
    kind: boolean
    label: Works at ground floor or basement level
    description: The proposal relates to a basement and/or ground floor level (used with flood risk triggers).
