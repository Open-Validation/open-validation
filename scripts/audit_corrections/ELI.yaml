# Corrections for East Lindsey District Council, from inputs/audit/east-lindsey-district-council.json.
# The council has no separate, dated local list: its Validation page lists the national items and
# then 21 kinds of 'additional information' that may be needed "depending on the proposal", while
# saying they are "not a formal validation requirement". Grokbot captured only two national items.
# The audit names the 21 items but gives no trigger for any of them, so they are shown as officer
# discretion with that caveat.
local-authority: ELI

drop:
  - id: site-plan
    reason: >-
      wrong_trigger / wrong_app_type: the excerpt is a run-on list of national requirements
      (location plan, ownership certificate, fee), not a local requirement; type was guessed
  - id: design-and-access-statement
    reason: >-
      wrong_trigger / wrong_app_type: national requirement ('if required') quoted from the same
      run-on list; type was guessed

requirements:
  - id: affordable-housing-statement
    action: add
    required-if: discretionary
    source-text: &eli-additional >-
      Additionally, although not a formal validation requirement, your application may need to be
      supported by additional information.
    source-url: &eli-url https://www.e-lindsey.gov.uk/article/6078/Validation
    confidence: low
    notes: &eli-note >-
      From the audit (missing_requirement): listed among 21 kinds of 'additional information' needed
      depending on the proposal. The council says these are not a formal validation requirement, and
      the page gives no trigger.

