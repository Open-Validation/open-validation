# Corrections for Stockport Metropolitan Borough Council, from the audit of Stockport.
# The current list is the Validation Checklist Explanatory Notes 2024, adopted 19 June 2024, with a
# companion Validation Checklist 2024 that says which local items apply to which application type.
# The workbook ignored the checklist and put ~40 rows under Full planning ('INFERRED'). Where the
# audit names the types from the checklist (F, RM, O, H, LB, PN, RC), they are used below.
# Type codes: F=full, RM=reserved-matters, O=outline, H=hh, LB=lbc, PN=prior-approval, RC=s73.
local-authority: SKP

submission-standards:
  - item: Drawings annotated with 'do not scale from this drawing' will not be accepted
    level: must
  - item: Drawing file names prefixed with a maximum eight character alpha/numeric reference, followed
      by a brief description of the drawing
    level: should

drop:
  - id: floor-plan-existing
    sheets: [Works to trees]
    reason: "wrong_app_type: text from DCLG's 2010 national guidance; Stockport's list does not cover tree
      works"
  - id: floor-plan-proposed
    sheets: [Works to trees]
    reason: "wrong_app_type: as above"
  - id: elevation-existing
    sheets: [Works to trees]
    reason: "wrong_app_type: as above"
  - id: elevation-proposed
    sheets: [Works to trees]
    reason: "wrong_app_type: as above"
  - id: waste-management-plan
    reason: "wrong_trigger: the excerpt is the Landfill Applications item, not refuse storage (kept as
      unmapped below)"
  - id: schedule-of-works
    reason: "wrong_trigger: a bullet from the Heritage Statement content list (now a heritage-statement
      must-include item)"
  - id: archaeological-assessment
    reason: "wrong_trigger: a bullet from the Heritage Statement content list, cut off at the start"

drop-unmapped:
  - local-name: Character / Conservation area appraisal reference
    reason: "not_a_requirement: a cross-reference inside another entry"
  - local-name: Marketing / vacancy evidence (loss of use)
    reason: "wrong_trigger: a bare cross-reference ('Viability Appraisal/ Marketing Exercise/ Business
      Plan')"
  - local-name: Pre-application advice / engagement details
    reason: "wrong_trigger: a bullet from the Affordable Housing Statement content list (now a must-include
      item)"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: a bullet from the Affordable Housing Statement content list (now a must-include
      item)"
  - local-name: Drainage Strategy / SuDS
    reason: "duplicate: same Foul Drainage Assessment text as Foul Sewage / Utilities Statement"
  - local-name: Advertisement drawings / illumination details
    reason: "wrong_trigger: the Lighting Impact Assessment trigger (now in lighting-assessment)"
  - local-name: Coal Mining / Land Stability Risk Assessment
    reason: "wrong_trigger: the Coal Authority preamble, not the trigger; replaced by two items below"

requirements:
  - id: affordable-housing-statement
    action: update
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 15
            description: The site provides 15 dwellings (gross) or more, including changes of use.
        - condition:
            field: site-area-residential
            operator: ">="
            value: 0.5
            description: The site is 0.5 hectares or more.
    must-include:
      - item: Details of pre-application discussions with partner Registered Providers, where applicable
        level: must
      - item: A statement of intended conformity with up to date design and accessibility standards
        level: must
      - item: A draft legal agreement where the affordable housing requirement is to be addressed in this
          way
        level: must
      - item: Evidence to justify why the Council's normal affordable housing requirement cannot be met,
          where relevant (e.g. a viability appraisal)
        level: must
    confidence: medium
    notes: "The content items are from the bullets the workbook filed under pre-application advice and
      planning obligations."

  - id: air-quality-assessment
    action: update
    required-if:
      any:
        - ref: major-development
        - discretionary
    confidence: medium
    notes: "All major development, and other proposals that may have a significant impact on air quality."

  - id: arboriculturist-report
    action: update
    required-if:
      all:
        - application-type:
            in: [full, reserved-matters, outline, hh, lbc, prior-approval, s73]
        - condition:
            field: trees-on-or-near-site
            value: true
            description: The development is near to trees, or proposes the removal of trees.
    confidence: medium
    notes: "Audit (wrong_app_type): the 2024 checklist applies the Tree Survey to F, RM, O, H, LB, PN and RC."

  - id: biodiversity-survey-report
    action: update
    required-if:
      any:
        - condition:
            field: protected-species
            value: true
            description: The development is likely to affect protected or priority species.
        - site:
            in: [priority-habitat]
            description: The development is likely to affect protected or priority habitats.
    confidence: medium
    notes: "The audit says the Ecological Assessment is also on the Householder and Prior Notification
      lists."

  - id: daylight-sunlight-assessment
    action: update
    required-if:
      all:
        - application-type:
            in: [full, reserved-matters, outline, hh, s73]
        - discretionary
    confidence: medium
    notes: "Audit (wrong_app_type): F, RM, O, H and RC. Needed where a proposal is likely to have an adverse
      effect on light to adjoining sensitive land uses."

  - id: elevation-proposed
    action: update
    must-include:
      - item: The proposed building materials and the style, materials and finish of windows and doors,
          where possible
        level: should

  - id: energy-statement
    action: add
    source-text: "a comprehensive Energy Statement that includes: A summary of the strategy to reduce energy
      consumption and minimise CO2 emissions;"
    source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
    must-include:
      - item: A summary of the strategy to reduce energy consumption and minimise CO2 emissions
        level: must
    confidence: low
    notes: "The workbook filed this Energy Statement excerpt under sustainability-statement. The audit says
      the Listed Building Consent list includes an Energy Statement; the trigger was not captured."

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development falls within Schedule 1 (or needs EIA under Schedule 2) of the EIA
          Regulations 2017.
    confidence: medium

  - id: fire-statement
    action: update
    required-if:
      all:
        - any:
            - condition:
                field: building-height
                operator: ">="
                value: 18
                description: A building is 18 metres or more in height.
            - condition:
                field: storey-count
                operator: ">="
                value: 7
                description: A building has 7 or more storeys.
        - condition:
            field: dwelling-count
            operator: ">="
            value: 2
            description: The building is multi-occupied residential.
    confidence: medium

  - id: flood-risk-assessment
    action: update
    required-if:
      all:
        - application-type:
            in: [full, reserved-matters, outline, hh, lbc, prior-approval, s73]
        - any:
            - site:
                in: [flood-risk-zone, surface-water-flood-risk]
                description: The development may be at risk of flooding from any source.
            - discretionary
    confidence: medium
    notes: "Audit (wrong_app_type): F, RM, O, H, LB, PN and RC. 'Increase flooding elsewhere' is shown as
      officer discretion."

  - id: heritage-statement
    action: update
    required-if:
      all:
        - application-type:
            in: [full, reserved-matters, outline, hh, lbc, s73]
        - site:
            in: [listed-building, listed-building-setting, conservation-area, locally-listed-building,
              scheduled-monument, park-and-garden]
            description: The application affects any heritage asset.
    must-include:
      - item: A schedule of works affecting the building, site or area
        level: must
      - item: An assessment of the impact of the proposals on the special interest and character of the
          building, site or area and that of any adjacent heritage assets
        level: must
      - item: A justification for the proposals, in terms of the principles applied, together with any
          mitigation measures proposed
        level: must
    confidence: medium
    notes: "Audit (wrong_app_type): F, RM, O, H, LB and RC. The content items are from the bullets the
      workbook filed under schedule of works and archaeology. The list also asks for 'an appropriate
      desk-based assessment and, where necessary, a field evaluation', but its lead-in condition was cut
      off."

  - id: land-contamination-assessment
    action: update
    required-if:
      all:
        - application-type:
            in: [full, reserved-matters, outline, hh, prior-approval, s73]
        - condition:
            field: sensitive-end-use
            value: true
            description: A sensitive end use (including residential, nursing/care home, schools and
              hospitals).
    confidence: medium
    notes: "Audit (wrong_app_type): the workbook placed it under Outline only; the checklist applies it to
      F, RM, O, H, PN and RC."

  - id: landscaping-plan
    action: replace
    source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/5OsHmHp7hxs9wLgC1POywU/f0ae22d4c97d9304d58a3f9b370134a4/Validation_Checklist_2024.pdf
    confidence: low
    notes: "Audit (wrong_trigger): the workbook quoted Airport Safeguarding text about bird-strike. From the
      audit: Landscaping is on the Prior Notification list and Landscaping Details on the Removal/Variation
      of Condition list; no trigger was captured."

  - id: lighting-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: external-lighting
            value: true
            description: A new external illumination or floodlighting installation, e.g. floodlighting to
              sports pitches, tennis courts, golf driving ranges, recreational and entertainment facilities.
        - condition:
            field: illuminated
            value: true
            description: Illuminated advertisements.
        - discretionary
    source-text: "new external illumination/floodlighting installation is proposed: illuminated
      advertisements, floodlighting to sports pitches, tennis courts, golf driving ranges, recreational and
      entertainment facilities. b) For the introduction of new sensitive receptors close to an existing
      external lighting scheme (as per (a)) It must show how the lighting installation will visually
      impact the area and the living conditions of residents, and how it will be mitigated to overcome
      impact."
    source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
    must-include:
      - item: How the lighting installation will visually impact the area and the living conditions of
          residents
        level: must
      - item: How the impact will be mitigated
        level: must
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's lighting row quoted 'pilots (see ...)'; the real trigger was
      filed under Advertisement consent. New sensitive receptors close to an existing lighting scheme are
      shown as officer discretion."

  - id: noise-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: noise-sensitive-use
            value: true
            description: New sensitive receptors exposed to existing noise or vibration sources.
        - condition:
            field: noise-generating-use
            value: true
            description: New noise sources.
    source-text: "NOISE AND VIBRATION IMPACT ASSESSMENT When Required: new sensitive receptors exposed to
      existing noise/vibration sources… or new noise sources"
    source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
    must-include:
      - item: "Internal ambient noise levels for dwellings and design criteria for external noise to BS
          8233:2014 (desirable external noise level of 50dB LAeq,16hr)"
        level: must
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the BS 8233 design criteria instead of the trigger.
      The audit says the Householder and Prior Notification lists include it too."

  - id: photos
    action: update
    required-if: discretionary
    confidence: medium
    notes: "Needed where proposals will have a significant impact on their setting. The audit says
      Photographs are on the Householder, Listed Building and Lawful Development Certificate lists too."

  - id: planning-statement
    action: update
    required-if:
      application-type:
        in: [full, hh, lbc, ldc, approval-condition]
    confidence: medium
    notes: "'Normally expected with all applications for full planning permission'. From the audit
      (wrong_app_type): the checklist also lists it for Householder, Listed Building, Lawful Development
      Certificate and Approval of Details."

  - id: recreation-facilities-assessment
    action: update
    required-if:
      condition:
        field: loss-of-open-space
        value: true
        description: The proposal involves the loss of open space or sport/recreation land.
    must-include:
      - item: An open space assessment including the extent of current usage, needs and opportunities for
          the use of the land for open space and sport/recreation
        level: must
      - item: The implications of the loss, including any mitigation measures
        level: must
      - item: A draft agreement, where the assessment would involve entering into a legal agreement (such
          as providing an equivalent area of replacement open space)
        level: must
    confidence: low
    notes: "The excerpt is the content list; its heading and trigger weren't captured, but the items refer
      to the loss of open space."

  - id: sci
    action: update
    required-if: discretionary
    confidence: medium
    notes: "Where a proposal is of a scale and/or nature likely to generate significant levels of public
      interest."

  - id: sustainability-statement
    action: replace
    required-if:
      ref: major-development
    source-text: SUSTAINABILITY CHECKLIST When Required Applications for major development should be
      accompanied by a completed Council Sustainability Checklist.
    source-url: https://assets.ctfassets.net/ii3xdrqc6nfw/232qQtBo9Tuy7K5c6NqFqJ/f2043c57a8df84406dc8df67cf1792d4/Validation_Checklist_Explanatory_Notes_2024.pdf
    confidence: medium
    notes: "The Energy Statement excerpt the workbook also mapped here is now in energy-statement."

  - id: telecommunications-report
    action: update
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: A telecommunications application.
    must-include:
      - item: A statement of compliance with International Commission on Non-Ionizing Radiation Protection
          (ICNIRP) guidelines
        level: must
      - item: Evidence of assessment of alternative sites and/or mast sharing
        level: must
      - item: A justification for why the installation is needed, including existing and proposed coverage
          plots
        level: must
      - item: Photomontages of the development, where it would have a significant impact
        level: must
    confidence: medium

