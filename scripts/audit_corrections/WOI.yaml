# Corrections for Woking Borough Council, from inputs/audit/woking-borough-council.json.
# The workbook linked the generic step-by-step page and captured no requirements. The audit
# could not read the Planning Validation Checklist PDF (robots-blocked), so only the CIL form,
# which the council's "Submit a planning application" page names, is added here.
local-authority: WOI

validation-list:
  url: https://www.woking.gov.uk/sites/default/files/2025-02/Planning%20-%20Validation%20Checklist%20-%20Feb%202024.pdf
  date: 2024-03
  date-basis: "audit review: PDF cover reads 'Updated: March 2024' (file name says Feb 2024)"

requirements:
  - id: cil-form
    action: add
    required-if:
      application-type:
        in: [full, hh, outline]
    source-text: >-
      a compulsory requirement for all applications for full planning permission, householder and
      outline applications.
    source-url: https://www.woking.gov.uk/sites/default/files/2025-02/Planning%20-%20Validation%20Checklist%20-%20Feb%202024.pdf
    confidence: medium
    notes: >-
      Audit (missing_requirement): the council's "Submit a planning application" page says the CIL
      Additional Information form is compulsory for full, householder and outline applications.
      The rest of the checklist still needs a manual read.
