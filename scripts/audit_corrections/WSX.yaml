  - local-name: Stage 1 Road Safety Audit
    source-text: "From the audit: major applications with highway alterations, new or intensified access,
      or off-site works"
    source-url: https://www.westsussex.gov.uk/media/e2clz34k/local_list.pdf
    suggested-id: road-safety-audit

