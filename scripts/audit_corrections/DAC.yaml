# Corrections for Dacorum Borough Council, from inputs/audit/dacorum-borough-council.json.
# The workbook has no requirement rows. The audit read Dacorum's planning applications page,
# which says the council has no local validation list of its own (national requirements only,
# plus the CIL forms). The quote was corrected in review to "We do not currently have any
# additional local validation requirements."
local-authority: DAC

validation-list:
  url: https://www.dacorum.gov.uk/home/planning-development/planning-applications
  date: ""
  status: national-only
  date-basis: >-
    audit: Dacorum has no local validation list ("We do not currently have any additional local
    validation requirements"), so there is no list date. The page-edit date (4 Nov 2026) and the
    audit's 2 Aug 2024 footer date are not list dates

requirements:
  - id: cil-form
    action: add
    required-if: discretionary
    source-url: https://www.dacorum.gov.uk/home/planning-development/planning-applications
    confidence: low
    notes: >-
      From the audit (missing_requirement, Confirmed): the planning applications page says
      applications will not be validated without the CIL additional information forms, for
      CIL-liable development (see the council's CIL page). "CIL-liable" can't be expressed as a
      rule, so it is shown as officer discretion.
