# Corrections for Surrey County Council, from inputs/audit/surrey-county-council.json.
# Surrey's Local List (adopted 3 January 2024) has four parts: Introduction, Annex 1 Minerals,
# Annex 2 Waste and Annex 3 County Development (Regulation 3). The workbook filed most Annex 3
# items under Full planning and mixed up the annexes. Below, Annex 3 items use reg-3, Annex 1
# items mineral-app, Annex 2 items waste-dev, and the Introduction's generic drawing checklist
# all three. Items marked "From the audit" use the audit's paraphrase.
local-authority: SRY

submission-standards:
  - item: Drawings scaled to fit A3 or A4 paper
    level: must
  - item: Drawings show a drawing reference number and date
    level: must
  - item: Plans show a north point (except elevations)
    level: must
  - item: Drawings at an appropriate scale, with a scale bar and calibration scale
    level: must
  - item: Each file below 10 MB, in an unlocked format (not password protected)
    level: should

drop:
  - id: site-plan
    sheets: [Full planning]
    reason: "wrong_trigger: the Full planning row carries BNG text"
  - id: waste-management-plan
    reason: "wrong_trigger: the Full planning row is the Sustainable Design and Construction Statement
      trigger (now in sustainability-statement); the Minerals row is a fragment of the Landfill and Landraising
      Statement (see unmapped)"

drop-unmapped:
  - local-name: "Agricultural / rural workers' dwelling appraisal"
    reason: "wrong_trigger: no workers' dwelling requirement exists; the excerpt is the Agricultural Land
      Classification trigger (re-added below)"
  - local-name: Agricultural Land Classification / Soils
    reason: "wrong_trigger: only the soil management sentence; merged into the Agricultural Land Classification
      item below"
  - local-name: Coal Mining / Land Stability Risk Assessment
    reason: "wrong_trigger: Surrey has no coal-mining requirement; the excerpt is site-description text
      (Stability Assessment added below)"
  - local-name: Cycle parking details
    reason: "wrong_trigger: Transport Assessment 5.4.2 text (now in transport-assessment)"
  - local-name: Electric vehicle charging details
    reason: "wrong_trigger: Transport Assessment 5.4.2 text (now in transport-assessment)"
  - local-name: Parking provision / Parking plan
    reason: "Transport Assessment 'What you must provide' text (now in transport-assessment)"
  - local-name: Minerals / Waste specific statements (county matters)
    reason: "Annex 3 Landscape Scheme 4.3 content (now in landscaping-plan)"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: the source only encourages pre-application advice"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: mislabelled Annex 2 odour assessment (re-added below)"
  - local-name: Water efficiency / water usage statement
    reason: "Drainage and Water Supply Report text (now in water-impact-assessment)"
  - local-name: Character / Conservation area appraisal reference
    reason: "wrong_app_type: LVIA 4.2 guidance text, not an LBC requirement"

requirements:
  - id: air-quality-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - any:
            - condition:
                field: floorspace
                operator: ">"
                value: 1000
                description: Major developments (over 1000 square metres).
            - site:
                in: [air-quality-management-area]
                description: Sensitive development in or near an Air Quality Management Area.
            - discretionary
    source-text: "Air Quality Assessment Required for the following applications: Major Developments (over
      1000sqm)"
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger, wrong_app_type): an Annex 3 item; the workbook shortened the trigger.
      From the audit: 9.1 also covers significant pollution, sensitive development in or near an
      AQMA, odour and new chimney stacks.

  - id: arboriculturist-report
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - condition:
            field: trees-on-or-near-site
            value: true
            description: Trees, woodland or hedgerows on or adjacent to the site that could be 
              affected by the development.
    source-text: >-
      4.5 Trees and Arboricultural Implications Required for the following applications: 4.5.1 All
      development proposals where there are trees, woodland or hedgerows (protected by a tree
      preservation order or not) either on, or adjacent to, the application site and which could be
      influenced or be affected by the development.
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    must-include:
      - item: Tree survey in accordance with BS 5837:2012 'Trees in relation to demolition, design 
          and development'
        level: should
    confidence: medium
    notes: >-
      Audit (wrong_app_type): an Annex 3 development requirement, not a works-to-trees item (the
      county doesn't determine works-to-trees applications). From the audit: Annex 3 also asks for
      a Tree Constraints Plan (4.6) and Tree Protection Plan (4.7).

  - id: biodiversity-survey-report
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - any:
            - site:
                in: [site-of-special-scientific-interest, special-protection-area, 
                      local-wildlife-site]
                description: The development is likely to affect a designated site.
            - discretionary
    source-text: "Preliminary Ecological Assessment (PEA) Required for the following applications: 3.1.1
      Where the development is: likely to affect a designated site;"
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: >-
      Audit (wrong_app_type, missing_requirement): an Annex 3 item. From the audit: an Ecological
      Impact Assessment (3.2) is also needed for natural/semi-natural habitat, protected species or
      bat roof works.

  - id: bng-metric
    action: update
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    notes: "Annex 3 3.4.1: all applications except those exempt from BNG requirements."

  - id: construction-management-plan
    action: replace
    required-if:
      any:
        - application-type:
            in: [reg-3]
        - all:
            - application-type:
                in: [mineral-app]
            - discretionary
    source-text: >-
      5.2 Construction Traffic Management Plan Required for the following applications: 5.2.1 All
      developments except very minor proposals such as canopies, fences, change of use.
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: >-
      Audit (wrong_app_type): the workbook put the Annex 3 trigger under prior approval, which it
      excludes. Annex 1 (Minerals) 7.1 asks for one "Where it is proposed to bring large plant ...
      onto the site or where the access ... is considered sensitive".

  - id: elevation-existing
    action: update
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    must-include:
      - item: Scale 1:50 or 1:100
        level: must
    notes: "From the Introduction's generic drawing checklist (audit issue 2)."

  - id: elevation-proposed
    action: update
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    must-include:
      - item: Scale 1:50 or 1:100
        level: must
    notes: "From the Introduction's generic drawing checklist (audit issue 2)."

  - id: environmental-statement
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3, mineral-app, waste-dev]
        - condition:
            field: eia-development
            value: true
            description: The development needs an Environmental Impact Assessment.
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0004/359977/Local-List-for-the-Validation-2024.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the LVIA trigger and a cut-off heading."

  - id: flood-risk-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - any:
            - site:
                in: [flood-risk-zone]
                description: All development proposals located within Flood Zones 2 and/or 3.
            - all:
                - any:
                    - condition:
                        field: site-area-non-residential
                        operator: ">"
                        value: 1
                        description: The site area is greater than 1 hectare.
                    - condition:
                        field: site-area-residential
                        operator: ">"
                        value: 1
                        description: The site area is greater than 1 hectare.
                - discretionary
            - discretionary
    source-text: >-
      6.1 Flood Risk Assessment Required for the following applications: 6.1.1 All development
      proposals located within Flood Zones 2 and/or 3. 6.1.2 Where the development is to be located
      within Flood Zone 1 and the site area is greater than 1 hectare in size and where the
      Environment Agency or Local Drainage Engineer has indicated that there may be a land drainage
      problem. 6.1.3 All proposals for new development (including minor development and changes of
      use) in an area within Flo…
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): an Annex 3 (Reg 3) item. 6.1.3 is cut off, so it is shown as officer
      discretion."

  - id: floor-plan-existing
    action: update
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    notes: "From the Introduction's generic drawing checklist (audit issue 2); the workbook's excerpt
      is the elevations line."

  - id: floor-plan-proposed
    action: update
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    notes: "From the Introduction's generic drawing checklist (audit issue 2); the workbook's excerpt
      is the elevations line."

  - id: heritage-statement
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - any:
            - site:
                in: [listed-building, listed-building-setting, conservation-area, 
                      locally-listed-building, archaeological-priority-area]
                description: Heritage assets or features, or their settings, may be affected.
            - discretionary
    source-text: "7.1 Heritage Statement Required for the following applications: 7.1.1 Where Heritage
      Assets or features, and their respective settings, may be affected by the proposal."
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): an Annex 3 (Reg 3) item, not Full planning."

  - id: land-contamination-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3, mineral-app]
        - site:
            in: [contaminated-land]
            description: Contamination is known or suspected on or near the site, from previous uses
              or natural hazards.
    source-text: >-
      Contaminated Land Assessment Required for the following applications: 8.1.1 When contamination
      of soil, groundwater, or from hazardous soil gas is known or suspected, on or in the vicinity
      of the site, based on present or previous uses of the site or its surroundings. 8.1.2 Where the
      land has been designated ‘contaminated’ by the Borough/District Council.
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
    confidence: medium
    notes: >-
      Audit (wrong_app_type): the workbook swapped the annexes. The wording above is Annex 1
      (Minerals) 8.1; Annex 3 15.1 asks for one "Where previous uses of the site, or adjacent land,
      could have caused contamination".

  - id: landscaping-plan
    action: replace
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    source-text: >-
      4.3.4 Where relevant it should include landscape/habitat restoration and enhancement and new
      landscape features to compensate for those lost to development. 4.3.5 Where new planting is
      proposed [this should be native species of local provenance and that species such as Ash and
      Elm should be avoided where possible] the application should provide as a minimum, a schedule
      of plants,
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    must-include:
      - item: Where relevant, landscape/habitat restoration and enhancement and new landscape 
          features to compensate for those lost
        level: should
      - item: A schedule of plants where new planting is proposed (native species of local 
          provenance)
        level: must
    confidence: low
    notes: >-
      The Annex 3 Landscape Scheme (4.3) trigger is cut off in the workbook ('Required for the
      following app…'); its contents were in the row named 'Minerals / Waste specific statements'.
      The Introduction also lists 'Landscape details'.

  - id: lighting-assessment
    action: replace
    required-if:
      any:
        - all:
            - application-type:
                in: [reg-3]
            - condition:
                field: external-lighting
                value: true
                description: Significant external lighting, including temporary construction and 
                  security lighting.
        - all:
            - application-type:
                in: [mineral-app]
            - condition:
                field: external-lighting
                value: true
                description: Any external lighting, including temporary, construction and security 
                  lighting.
    source-text: >-
      9.2 Lighting Assessment Required for the following applications: 9.2.1 Developments involving
      significant external lighting, including temporary construction and security lighting.
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: "Annex 1 (Minerals) 11.1.1: 'All minerals developments involving any external lighting, including
      temporary, construction and security lighting.'"

  - id: noise-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - any:
            - condition:
                field: noise-sensitive-use
                value: true
                description: Development close to an existing major noise source (motorway, trunk 
                  road, airport, railway, minerals or waste operations).
            - condition:
                field: noise-generating-use
                value: true
                description: The development itself is likely to generate significant noise levels 
                  (e.g. outdoor sports).
    source-text: >-
      9.3 Noise Assessment Required for the following applications: 9.3.1 Proposed development close
      to existing major noise source e.g. motorways or trunk road, airports and possibly railway,
      industrial activities such as minerals or waste operations. 9.3.2 When the development itself
      is likely to generate significant noise levels e.g. outdoors sports activities.
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): an Annex 3 (Reg 3) item."

  - id: photos
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - discretionary
    source-text: "4.2.6 Photographs, visualisations and photomontages to be provided as appropriate."
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: low
    notes: >-
      Part of the Landscape and Visual Impact Assessment (4.2) contents, not a stand-alone item. The
      Minerals & waste row was a cut-off Introduction fragment ('statement and photographs ... 67.').

  - id: planning-statement
    action: replace
    required-if:
      application-type:
        in: [reg-3]
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt stops at '1.1.'; the source says it is
      'mandatory for all planning applications'. Whether the Minerals and Waste annexes say the
      same wasn't checked.

  - id: protected-landscape-assessment
    action: add
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - ref: major-development
        - site:
            in: [area-of-outstanding-natural-beauty]
            description: The site is in an AONB (National Landscape).
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): AONB Exceptional Circumstances Test (4.1) for major
      development in an AONB."

  - id: recreation-facilities-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - any:
            - condition:
                field: loss-of-use
                value: true
                description: The proposal would result in the loss of open space.
            - discretionary
    source-text: >-
      9.4 Open Space Assessment including Rights of Way Required for the following applications:
      9.4.1 Any development proposals that would result in the loss of open space, or have
      implications for Public Rights of Way.
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): an Annex 3 (Reg 3) item. Implications for Public Rights of Way are
      shown as officer judgement."

  - id: roof-plan-existing
    action: update
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    must-include:
      - item: Scale 1:50 or 1:100
        level: must
    notes: "From the Introduction's generic drawing checklist (audit issue 2)."

  - id: roof-plan-proposed
    action: update
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    must-include:
      - item: Scale 1:50 or 1:100
        level: must
    notes: "From the Introduction's generic drawing checklist (audit issue 2)."

  - id: sci
    action: replace
    required-if:
      all:
        - application-type:
            in: [mineral-app]
        - discretionary
    source-text: >-
      15.1 Statement of Community Involvement Required for the following applications: 15.1.1 For
      any proposals with substantial community interest.
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): an Annex 1 (Minerals) item. 15.1.2 adds proposals where the Localism
      Act section 61W requirement applies."

  - id: section-existing
    action: update
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    must-include:
      - item: Sections and/or site levels at a scale of 1:50 or 1:100
        level: must
    notes: "From the Introduction's generic drawing checklist (audit issue 2)."

  - id: section-proposed
    action: update
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    must-include:
      - item: Sections and/or site levels at a scale of 1:50 or 1:100
        level: must
    notes: "From the Introduction's generic drawing checklist (audit issue 2)."

  - id: site-plan
    action: update
    required-if:
      application-type:
        in: [reg-3, mineral-app, waste-dev]
    must-include:
      - item: Scale such as 1:100 or 1:200
        level: should
      - item: Any site boundaries
        level: must
    notes: "From the Introduction's generic drawing checklist (audit issue 2)."

  - id: sustainability-statement
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - any:
            - condition:
                field: school-expansion
                value: true
                description: Large school expansions.
            - condition:
                field: floorspace
                operator: ">"
                value: 1000
                description: Major developments (over 1000 square metres).
            - discretionary
    source-text: >-
      11.1 Sustainable Design and Construction Statement Required for the following applications:
      11.1.1 Large school expansions, major developments (over 1000sqm) or where Borough or District
      stipulate specific thresholds.
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook filed this trigger under waste storage and gave the
      sustainability row a fragment. "Large" school expansion has no threshold; borough or district
      thresholds are shown as officer discretion.

  - id: transport-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - discretionary
    source-text: >-
      5.3 Transport Statement Required for the following applications: 5.3.1 Small scale developments
      and minor school expansions (not required for temporary / bulge applications unless advised
      otherwise by the County Planning Authority).
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    must-include:
      - item: For a Transport Assessment, an illustration of accessibility to the site by all modes 
          of transport and the likely modal split of journeys
        level: must
        source-text: "5.4.2 As for Transport Statement plus an illustration of accessibility to the site
          by all modes of transport, and the likely modal split of journeys to and from the site."
      - item: Justification of the level of parking provision proposed
        level: should
      - item: Proposals to reduce the transportation impact of the development, and adequate 
          mitigation
        level: should
      - item: Where traffic is to be restricted to certain routes, details of how this will be 
          achieved with certainty
        level: must
        source-text: "5.4.4 Where traffic is intended to be restricted to certain routes, the proposal
          must include details of how this is to be accomplished with certainty."
    confidence: medium
    notes: >-
      Audit (wrong_app_type, wrong_trigger): an Annex 3 item; the Transport Assessment (5.4) text
      was spread over the workbook's cycle parking, EV charging and parking rows. The Transport
      Assessment's own trigger wasn't captured.

  - id: travel-plan
    action: replace
    required-if:
      all:
        - application-type:
            in: [reg-3]
        - condition:
            field: school-expansion
            value: true
            description: School development increasing pupil and/or staff numbers, including 
              temporary and bulge permissions.
    source-text: >-
      5.1 Travel Plan Required for the following applications: 5.1.1 All school developments
      resulting in an increase in pupil and/or staff numbers, including temporary and bulge
      permissions.
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): an Annex 3 (Reg 3) item, not Full planning."

  - id: water-impact-assessment
    action: add
    required-if:
      any:
        - all:
            - application-type:
                in: [reg-3]
            - discretionary
        - all:
            - application-type:
                in: [mineral-app, waste-dev]
            - discretionary
    source-text: "Calculations of the mains water consumption for the development proposed and sewage
      demand and whether any upgrades are needed."
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0007/359989/Annex-3-CountyDevelopment-Reg3-2024.pdf
    must-include:
      - item: Calculations of mains water consumption and sewage demand, and whether any upgrades 
          are needed
        level: must
        required-if:
          application-type:
            in: [reg-3]
    confidence: low
    notes: >-
      From the audit (missing_requirement): Annex 3 Drainage and Water Supply Report (6.3) where
      there is a net increase in water/wastewater demand (the workbook's 'Water efficiency' row);
      and a Hydrogeological/Hydrological Report (Annex 1 9.3) for significant ground works,
      dewatering, abstraction or infilling.

unmapped:
  - local-name: Agricultural Land Classification and Soils
    source-text: "8.3 Agricultural Land Classification and Soils Required for the following applications:
      8.3.1 Where proposal affects the best and versatile agricultural land classified as Grade 1, 2 or
      3a and can also include applications involving land filling for the purposes of restoration. … A
      soil management strategy where significant earthworks are required."
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
    suggested-id: agricultural-land-classification
  - local-name: Odour assessment
    source-text: "3.4.3 An assessment of the impact of odour on surrounding sensitive receptors based
      on the accepted source-pathway-receptor conceptual model including: Existing baseline odour conditions
      (also including complaints history)."
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0004/359986/Annex-2-Waste-2024.pdf
    suggested-id: odour-assessment
  - local-name: Stability Assessment
    source-text: "From the audit: Annex 1 8.2, substantial engineering works or unstable ground"
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
    suggested-id: stability-assessment
  - local-name: Restoration, Aftercare and Enhancement statements
    source-text: "From the audit: Annex 1 6.1-6.3, all mineral proposals except condition variations that
      do not affect restoration"
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
    suggested-id: restoration-aftercare-scheme
  - local-name: Operational Dust Assessment
    source-text: "From the audit: Annex 1 3.3, any minerals or waste development likely to create dust"
    source-url: 
      https://www.surreycc.gov.uk/__data/assets/pdf_file/0006/359979/Annex-1-Minerals-2024.pdf
    suggested-id: dust-assessment
