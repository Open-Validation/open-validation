# Corrections for Royal Borough of Kingston upon Thames, from the council's audit.
# The audit compared the workbook with the Validation Local List (February 2024, adopted
# 1 May 2024) and the separate Householder Local List. Many workbook triggers came from
# neighbouring entries; items marked "From the audit" use the audit's paraphrase.
local-authority: KTT

submission-standards:
  - item: All plans and drawings accurately drawn to a conventional metric scale (such as 1:1250, 
      1:500, 1:200, 1:100) and true to the stated scale
    level: must
  - item: A scale bar that refers to the paper size (for example 1:100 on A3); no 'not to scale' or 
      'do not scale' disclaimers, except on perspective drawings or images
    level: must
  - item: Key dimensions annotated on floor plans, site plans, elevations and section / level plans
    level: must
  - item: Plans fully annotated (for example boundary fences labelled) with distances from 
      boundaries
    level: must
  - item: All plans include a north arrow
    level: must
  - item: All plans on the same paper size
    level: should
  - item: Each drawing in a separate PDF, titled accordingly with its drawing number; not one 
      combined PDF
    level: should
  - item: Title box on each drawing with the address and proposal, drawing title, date, scale and 
      drawing number, with revisions clearly identified
    level: should
  - item: Drawings attached as PDF files (other documents may be .jpg, .doc or .xls)
    level: must
  - item: Maximum 5MB per attachment and 25MB per application
    level: must

drop:
  - id: waste-management-plan
    sheets: [Householder]
    reason: "wrong_app_type: reuses the basement CEMP trigger; the Householder list has no waste storage
      requirement"

drop-unmapped:
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: matches no requirement in the list"
  - local-name: Habitats Regulations Assessment information / SPA mitigation
    reason: "not_a_requirement: a glossary of designations from the Biodiversity Checklist"
  - local-name: Validation checklist form (completed)
    reason: "wrong_trigger: the Full planning row is Biodiversity Checklist purpose text; re-added below
      with the council's wording"
  - local-name: Biodiversity Checklist / Questionnaire
    reason: "not_a_requirement: the Full planning row is purpose text; re-added below with the council's
      wording"
  - local-name: Street scene elevations / Contextual drawings
    reason: "wrong_app_type: advisory only on the Householder list; the Full planning wording is re-added
      below"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: the excerpt is Archaeological Assessment text; re-added below"
  - local-name: Health Impact Assessment
    reason: "wrong_trigger: excerpt cut off; re-added below"
  - local-name: Structural Survey
    reason: "wrong_trigger: excerpt cut off; re-added below"
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: excerpt has no trigger; re-added below with the trigger from the council tab"

requirements:
  - id: affordable-housing-statement
    action: update
    required-if:
      any:
        - all:
            - ref: major-development
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The proposal is for residential development.
        - discretionary
    source-text: >-
      Affordable Housing Statement All major applications for residential development And / or
      (This can be included within the Planning Statement) In other cases where the proposal
      includes affordable housing
    must-include:
      - item: A schedule of all units proposed, including tenure and percentage split, bedrooms and 
          bedspaces, size, storeys, habitable rooms and accessibility standard
        level: must
    confidence: medium
    notes: "'In other cases where the proposal includes affordable housing' is shown as officer discretion."

  - id: air-quality-assessment
    action: update
    required-if:
      ref: major-development
    confidence: medium
    notes: "The council's list: AQA and Air Quality Neutral Assessment for all major applications."

  - id: archaeological-assessment
    action: update
    required-if:
      any:
        - all:
            - ref: major-development
            - site:
                in: [archaeological-priority-area]
                description: The site is in an Archaeological Priority Area.
        - condition:
            field: site-area-residential
            operator: ">"
            value: 0.5
            description: The site is greater than 0.5 hectares.
        - condition:
            field: site-area-non-residential
            operator: ">"
            value: 0.5
            description: The site is greater than 0.5 hectares.
    source-text: >-
      Archaeological Assessment All major applications in any Archaeological Priority Area (APA),
      and all sites that are greater than 0.5ha whether in an APA or not.
    confidence: medium

  - id: bng-metric
    action: update
    required-if:
      ref: major-development
    source-text: Biodiversity Gain Plan All major applications
    confidence: medium

  - id: site-plan
    action: update
    required-if:
      always: true
    source-text: "Existing Site Plan All applications A plan at a scale of either 1:200 or 1:500 accurately
      showing:"
    must-include:
      - item: Scale of 1:200 or 1:500
        level: must
    confidence: medium

  - id: cil-form
    action: update
    required-if:
      all:
        - condition:
            field: new-build
            value: true
            description: The proposal includes new build development (including residential 
              extensions and annexes).
        - condition:
            field: floorspace
            operator: ">"
            value: 100
            description: Over 100 square metres (internal) of new floorspace.
    confidence: medium

  - id: construction-management-plan
    action: update
    required-if:
      all:
        - application-type:
            in: [hh]
        - condition:
            field: basement
            value: true
            description: The householder proposal includes a basement or subterranean development.
    source-text: >-
      Construction Management Plan (including site waste management plan) (CEMP) All Householder
      applications that include any basement and / or subterranean development
    source-url: 
      https://www.kingston.gov.uk/sites/default/files/2025-04/Householder_Local_List__2__0.pdf
    confidence: low
    notes: >-
      Only the Householder list's trigger was captured; the main list's trigger for other
      applications is not in the workbook excerpt.

  - id: daylight-sunlight-assessment
    action: replace
    required-if:
      any:
        - all:
            - ref: major-development
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The major application is residential.
        - discretionary
    source-url: 
      https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook quoted Biodiversity Checklist text. From the audit:
      proposals likely to affect light to adjoining land, and all major residential. On the
      Householder list it is needed if the 45/25-degree tests fail.

  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - application-type:
            in: [lbc]
        - all:
            - site:
                in: [conservation-area, world-heritage-site]
                description: The site is in a conservation area or World Heritage Site.
            - any:
                - condition:
                    field: dwelling-count
                    operator: ">="
                    value: 1
                    description: The proposal creates one or more dwellings.
                - condition:
                    field: floorspace
                    operator: ">="
                    value: 100
                    description: The proposal creates 100 square metres or more of floorspace.
    source-url: 
      https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook quoted drawing guidance. From the audit: majors, 1+
      dwellings or 100 sqm+ in a conservation area or World Heritage Site, and listed building consent.

  - id: environmental-statement
    action: replace
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.
    source-url: 
      https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt ('normally only necessary for a small proportion')
      was guidance, not a trigger."

  - id: section-existing
    action: update
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: The proposal changes ground levels or is next to changing ground levels.
    source-text: >-
      Site Levels and Sections (Existing and Proposed) All applications that involve a change in
      the ground levels or where development is proposed next to changing ground levels These
      should be drawn at a scale of 1:50 or 1:100 and include the following: Details of floor
      levels, building height and relationship to site boundaries
    must-include:
      - item: Scale of 1:50 or 1:100
        level: should
      - item: Floor levels, building height and relationship to site boundaries
        level: must
    confidence: medium

  - id: section-proposed
    action: update
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: The proposal changes ground levels or is next to changing ground levels.
    source-text: >-
      Site Levels and Sections (Existing and Proposed) All applications that involve a change in
      the ground levels or where development is proposed next to changing ground levels These
      should be drawn at a scale of 1:50 or 1:100 and include the following: Details of floor
      levels, building height and relationship to site boundaries
    must-include:
      - item: Scale of 1:50 or 1:100
        level: should
      - item: Floor levels, building height and relationship to site boundaries
        level: must
    confidence: medium

  - id: fire-statement
    action: replace
    required-if:
      always: true
    source-url: 
      https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
    must-include:
      - item: Gateway One fire statement on the Secretary of State's form
        level: must
        required-if:
          all:
            - any:
                - condition:
                    field: building-height
                    operator: ">="
                    value: 18
                    description: A building is 18 metres or more tall.
                - condition:
                    field: storey-count
                    operator: ">="
                    value: 7
                    description: A building has 7 or more storeys.
            - condition:
                field: dwelling-count
                operator: ">="
                value: 2
                description: The building contains 2 or more dwellings.
        source-text: >-
          Fire statements must be submitted on a form published by the Secretary of State (or a
          form to similar effect) and contain the particulars specified or referred to in the form
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook quoted form contents. From the audit: a London Plan
      fire statement for all applications (also on the Householder list), and a Gateway One
      statement for buildings of 18m+ or 7+ storeys with 2+ dwellings.

  - id: flood-risk-assessment
    action: replace
    required-if:
      any:
        - site:
            in: [flood-risk-zone]
            description: The site is in flood zone 2 or 3.
        - condition:
            field: site-area-residential
            operator: ">="
            value: 1
            description: The site is 1 hectare or more (flood zone 1).
        - condition:
            field: site-area-non-residential
            operator: ">="
            value: 1
            description: The site is 1 hectare or more (flood zone 1).
        - site:
            in: [critical-drainage-area]
            description: The site is at risk of surface water flooding or in a Critical Drainage 
              Area.
    source-url: 
      https://www.kingston.gov.uk/sites/default/files/2025-04/Validation___Local_List___1__0.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt was cut off. From the audit: 1ha+ in flood
      zone 1, all of flood zones 2/3, and surface water flood risk. Householders in these areas
      complete a Flood Risk Assessment Form (Householder list).

  - id: floor-plan-existing
    action: update
    required-if:
      always: true
    source-text: >-
      Floor Plans (Existing and Proposed) All applications These should be drawn at a scale of
      1:50 or 1:100 and include the following: Annotations to show key dimensions including
      distance from boundaries, depth and width of extension etc.
    must-include:
