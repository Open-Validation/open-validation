# Corrections for the Council of the Isles of Scilly, from the council's audit.
# The workbook links the current Local Validation Checklist (adopted 18 November 2025), but much
# of the extraction comes from superseded 2021 checklists (old Householder, Full and LBC lists
# under /planning-apps/, citing NPPF 2019). The Listed building consent sheet was filled with
# Full-planning items; the November 2025 LBC checklist asks only for the application form,
# location plan, site plan, 1:20 detailed drawings, Design & Access Statement, Heritage
# Statement/HIA and a Structural Survey. The 2025 checklists for advertisement consent, lawful
# development certificates, discharge of conditions and tree works were not read by Grokbot.
local-authority: IOS

validation-list:
  date: 2025-11-18
  date-basis: "audit: document cover 'Adopted | 18/11/2025'"

submission-standards:
  - item: Location plan typically at 1:1250 or 1:2500, scaled to fit onto A4 or A3 paper wherever
      possible
    level: should
  - item: Location plan has a north point; plans based on Ordnance Survey maps carry the Ordnance
      Survey copyright notice
    level: must
  - item: Existing and proposed drawings at a scale of 1:50 or 1:100, with a scale bar
    level: must
  - item: A linear scale bar is recommended on plans
    level: should

drop:
  - id: affordable-housing-statement
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist (copied from the old Full checklist)"
  - id: air-quality-assessment
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: arboriculturist-report
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: archaeological-assessment
    sheets: [Listed building consent, Householder]
    reason: "wrong_app_type: the 2025 list asks for it for Full applications only"
  - id: land-contamination-assessment
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: daylight-sunlight-assessment
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: biodiversity-survey-report
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: environmental-statement
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: section-existing
    sheets: [Listed building consent]
    reason: "wrong_app_type: the LBC checklist asks for 1:20 detailed drawings instead (in elevation-proposed)"
  - id: section-proposed
    sheets: [Listed building consent]
    reason: "wrong_app_type: the LBC checklist asks for 1:20 detailed drawings instead (in elevation-proposed)"
  - id: flood-risk-assessment
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: landscaping-plan
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: noise-assessment
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: photos
    sheets: [Listed building consent, Householder]
    reason: "wrong_trigger: the excerpt is archaeology guidance ('maps, aerial photographs, archaeological journals')"
  - id: planning-statement
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: roof-plan-existing
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: roof-plan-proposed
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: schedule-of-works
    reason: "wrong_trigger: every row (Householder, Full, LBC, Works to trees) is arboricultural method statement text"
  - id: sci
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: transport-assessment
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: travel-plan
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: viability-assessment
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: waste-management-plan
    sheets: [Listed building consent]
    reason: "wrong_app_type: not on the November 2025 LBC checklist"
  - id: sustainability-statement
    reason: "wrong_trigger: the excerpt is Structural Survey text; replaced by the Scheme of Sustainable Design Measures below"

drop-unmapped:
  - local-name: Health Impact Assessment
    reason: "wrong_document: 'HIA' here is the Heritage Impact Assessment; the 2025 list has no Health Impact Assessment"
  - local-name: Highways / access details (visibility splays)
    reason: "not_a_requirement: part of the site plan content list"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: a pointer to the pre-application advice service"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: a BNG fragment about securing off-site gains"
  - local-name: Advertisement drawings / illumination details
    reason: "other: these rows are the External Illumination Statement (now lighting-assessment), not an advert item"
  - local-name: Structural Survey
    reason: "wrong_trigger: the Householder and Full rows are garbled headings; re-added once below with the LBC wording"
  - local-name: Housing mix / dwelling standards (NDSS, accessible homes)
    reason: >-
      outdated_link: 2021 NDSS '+30%/+10%' wording; the 2025 list asks for a Statement of Existing
      and Proposed Internal Floorspace (added below)

requirements:
  - id: arboriculturist-report
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full]
        - condition:
            field: trees-on-or-near-site
            value: true
            description: There are trees within 15m of the proposed works or of areas where ground
              levels are proposed to be changed.
    source-text: >-
      Tree Survey [Guidance] LR … a) There are no trees within 15m of the proposed works, or areas
      where ground levels are proposed to be changed; or ☐ b) The plans identify any trees within 15m
      of any development and the submission includes an assessment of the impact of the development
      on those trees, including tree protection measures in accordance with the British Standard.
    source-url: https://www.scilly.gov.uk/sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf
    must-include:
      - item: Plans identify any trees within 15m of any development
        level: must
      - item: An assessment of the impact of the development on those trees, including tree
          protection measures in accordance with the British Standard
        level: must
    confidence: medium
    notes: >-
      Rebuilt from the 2025 list (audit outdated_link). The 2021 rows (removal of trees in a
      conservation area) are superseded. The audit lists Tree Survey as a 2025 Householder local
      requirement.

  - id: archaeological-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full]
        - any:
            - all:
                - condition:
                    field: ground-disturbance
                    value: true
                    description: Trenching or foundations.
                - site:
                    in: [archaeological-priority-area]
                    description: Near known archaeology.
            - all:
                - condition:
                    field: new-build
                    value: true
                    description: New-build development.
                - condition:
                    field: dwelling-count
                    operator: ">="
                    value: 1
                    description: All new dwellings.
            - all:
                - condition:
                    field: new-build
                    value: true
                    description: New-build development.
                - condition:
                    field: floorspace-non-residential
                    operator: ">="
                    value: 1
                    description: New employment buildings.
    source-url: https://www.scilly.gov.uk/sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf
    confidence: medium
    notes: >-
      From the audit (wrong_app_type): the 2025 list asks for it for Full applications only, for
      trenching/foundations near known archaeology, all new dwellings and new employment buildings.
      The workbook's rows quoted the 2021 checklists.

  - id: bng-metric
    action: update
    must-include:
      - item: The metric submitted as an Excel file, and the plan as a PDF
        level: must
        source-text: The metric needs to be submitted as an Excel file, and the plan as a PDF.

  - id: biodiversity-survey-report
    action: update
    required-if:
      all:
        - application-type:
            in: [hh, full]
        - condition:
            field: protected-species
            value: true
            description: Bats or other protected species may be affected.
    notes: "The 2025 list has an Ecology/Bat survey local requirement for Householder and Full applications (audit)."

  - id: daylight-sunlight-assessment
    action: update
    required-if:
      all:
        - application-type:
            in: [hh, full]
        - discretionary
    notes: >-
      Where proposals potentially have an adverse impact on the daylight/sunlight enjoyed by
      adjoining properties (council's 2021 wording; the 2025 Householder list has a Light Assessment).

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: EIA development.
    notes: "Audit (wrong_trigger): the excerpt ('development plan, EIA development applications.') was a fragment."

  - id: elevation-proposed
    action: update
    must-include:
      - item: Detailed drawings (plans, elevations and vertical and horizontal sections) at 1:20,
          including all details of the work (e.g. new doors, windows, window or door furniture, shop
          fronts, panelling, fireplaces, plaster moulding and other decorative details) and the
          relationship of the works to adjacent existing structures/details
        level: must
        required-if:
          application-type:
            in: [lbc]
        source-text: >-
          Detailed drawings, which may include plans, elevations, and vertical and horizontal
          sections, must be to a scale of 1:20, and should include all details of the work to be
          carried out (for example all new doors, windows, window or door furniture, shop fronts,
          panelling, fireplaces, plaster moulding and other decorative details) and must also
          indicate the relationship of the proposed works to adjacent existing structures/details.
    notes: "The 1:20 detailed drawings are on the November 2025 LBC checklist."

  - id: floor-plan-proposed
    action: update
    must-include:
      - item: Scale of 1:50 or 1:100, with a scale bar
        level: must
      - item: New and existing storeys affected by the proposal, clearly labelled
        level: must
      - item: The use of each room and any windows, doors and walls
        level: must
      - item: The area of an extension or additional floors
        level: must
      - item: Any walls to be demolished
        level: must
    notes: "Contents from the November 2025 Householder checklist."

  - id: flood-risk-assessment
    action: update
    required-if:
      any:
        - site:
            in: [flood-risk-zone]
            description: All new development in Flood Zones 2 and 3.
        - condition:
            field: site-area-residential
            operator: ">="
            value: 1
            description: Sites of 1ha or more in Flood Zone 1.
        - condition:
            field: site-area-non-residential
            operator: ">="
            value: 1
            description: Sites of 1ha or more in Flood Zone 1.
        - discretionary
    source-text: >-
      Policy SS7 Description A Flood Risk Assessment (FRA) will be required for development on a
      site where there is a potential risk of flooding, including areas below 5m datum.
    source-url: https://www.scilly.gov.uk/sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the excerpt was cut off before the local trigger. From the audit: land
      below 5m datum (no field, so officer discretion), 1ha+ in Flood Zone 1, and all new
      development in Flood Zones 2 and 3. It is a 2025 Householder local requirement too.

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [conservation-area, listed-building, listed-building-setting, scheduled-monument]
            description: The proposal could affect the character or appearance of the Conservation
              Area, the setting of a Listed Building, a Scheduled Monument or another designated
              heritage asset.
    source-text: >-
      Heritage Statement / Impact Assessment (HIA) [Guidance] National Planning Policy Framework
      (NPPF) Requirement c) My proposal has the potential to impact upon the special character or
      appearance of the Conservation Area / setting of a Listed Building / Scheduled Monument or other
      Designated Heritage Asset and a HIA is included.
    source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Local%20Validation%20Checklist%20%28November%202025%29.pdf
    confidence: medium
    notes: "Built from the 2025 HIA wording (the workbook's LBC 'Health Impact Assessment' row); the other rows
      quoted 2021 checklists."

  - id: lighting-assessment
    action: add
    required-if:
      condition:
        field: external-lighting
        value: true
        description: The proposal includes outdoor lighting.
    policy: Local Plan 2015-2030 Policies OE1, OE4
    source-text: >-
      External Illumination Statement … The statement should include information detailing how
      adverse impact on amenity, including highway safety, wildlife impacts as well as the impact of
      sky glare enjoyed by adjoining properties may be reduced
    source-url: https://www.scilly.gov.uk/sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf
    must-include:
      - item: How adverse impacts on amenity, highway safety and wildlife, and sky glare, may be reduced
        level: should
    confidence: medium
    notes: >-
      Audit (other): the External Illumination Statement (a dark-skies local requirement for
      householder, full, LBC and tree works with outdoor lighting) was mislabelled as an
      advertisement item. The wording is from the 2021 Householder checklist.

  - id: photos
    action: update
    required-if:
      application-type:
        in: [full, advertising]
    confidence: low
    notes: >-
      Audit (wrong_app_type): Photos and Photomontages (existing premises, street scene, proposed
      sign) are a local requirement for 'Full + Advertisement Consent (additional)'; it may apply only
      to full applications that include advertisements.

  - id: planning-statement
    action: update
    required-if:
      application-type:
        in: [hh, full, s73, non-material-amendment]
    must-include:
      - item: Not needed where the information is contained within the Design & Access Statement and/or
          Heritage Statement
        level: should
    confidence: low
    notes: >-
      Audit (missing_requirement): a local requirement for Householder and Full unless the content is
      in the DAS/Heritage Statement. The s73 and non-material amendment rows refer to 'a description
      of works and the reason(s) for the works/removal', which may be tree works checklist text.

  - id: roof-plan-existing
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: Changes are made to the appearance, shape or position of a roof.

  - id: roof-plan-proposed
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: Changes are made to the appearance, shape or position of a roof.

  - id: section-existing
    action: update
    required-if:
      any:
        - condition:
            field: change-in-ground-levels
            value: true
            description: The proposal involves a change in levels or is on a sloping site.
        - discretionary
    source-text: Section drawings are particularly important where any proposal involves a change in
      levels or is on a sloping site.

  - id: section-proposed
    action: update
    required-if:
      any:
        - condition:
            field: change-in-ground-levels
            value: true
            description: The proposal involves a change in levels or is on a sloping site.
        - discretionary
    source-text: Section drawings are particularly important where any proposal involves a change in
      levels or is on a sloping site.

  - id: site-plan
    action: update
    must-include:
      - item: The proposed development in relation to the site boundaries and other existing buildings
          on the site, with dimensions including those to the boundaries
        level: must
      - item: An identified standard metric scale, typically 1:100, 1:200 or 1:500
        level: must
      - item: A north point
        level: must

  - id: sustainability-statement
    action: add
    required-if:
      all:
        - application-type:
            in: [hh, full]
        - any:
            - condition:
                field: new-build
                value: true
                description: New buildings.
            - condition:
                field: involves-change-of-use
                value: true
                description: Conversions.
            - condition:
                field: residential-extension
                value: true
                description: Domestic extensions.
    source-url: https://www.scilly.gov.uk/sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf
    confidence: medium
    notes: >-
      From the audit (missing_requirement): Scheme of Sustainable Design Measures (Householder and
      Full: new buildings, conversions, domestic extensions). Its description ('reduce energy and
      water consumption, including water harvesting measures') appears in the water efficiency rows.

  - id: travel-plan
    action: update
    required-if: discretionary
    notes: "'A travel plan needed for large scale proposals' (council's wording); no threshold is given."

  - id: waste-management-plan
    action: update
    required-if:
      application-type:
        in: [hh, full]
    source-text: >-
      A Site Waste Management Plan is needed for all types of proposed development and should
      demonstrate the efficient use of construction materials and methods so that waste is minimised
      and any waste that is produced can be re‐used, recycled or recovered in other ways before
      disposal options are explored.
    notes: "The audit lists the Site Waste Management Plan as a 2025 Householder local requirement."

unmapped:
  - local-name: Structural Survey (listed buildings)
    source-text: "For applications to demolish a listed building, a Structural Survey must be submitted."
    source-url: https://www.scilly.gov.uk/sites/default/files/document/planning/Listed%20Building%20Consent%20Checklist%20%28November%202025%29.pdf
    suggested-id: structural-survey
  - local-name: Statement of Existing and Proposed Internal Floorspace
    source-text: "From the audit: Householder and Full, for new dwellings, extensions, conversions and
      replacement dwellings"
    source-url: https://www.scilly.gov.uk/sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf
    suggested-id: floorspace-calculation
  - local-name: Infrastructure Impact Assessment
    source-text: "From the audit: Full applications with a significant increase in infrastructure use; new
      dwellings or conversions; new buildings or conversions needing new drainage or water connections"
    source-url: https://www.scilly.gov.uk/sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf
    suggested-id: infrastructure-statement
  - local-name: Specific Local Need application
    source-text: "From the audit: Full applications for homes intended to meet a Specific Local Need"
    source-url: https://www.scilly.gov.uk/sites/default/files/Local%20Validation%20Checklist%20%28November%202025%29.pdf
    suggested-id: ""

low-confidence:
  - id: affordable-housing-statement
    note: "Audit (outdated_link): the row is a heading from the superseded 2021 Full checklist; no trigger."
  - id: air-quality-assessment
    note: "Audit (wrong_trigger): the excerpt is a fragment with no trigger."
  - id: land-contamination-assessment
    note: "Audit (outdated_link): the row is a heading from the superseded 2021 Full checklist; no trigger."
  - id: landscaping-plan
    note: "Audit (outdated_link): the row is a heading from the superseded 2021 Full checklist; no trigger."
  - id: noise-assessment
    note: "Audit (wrong_trigger): the excerpt is a heading run on from 'Right of Light Fact Sheets'; no trigger."
  - id: transport-assessment
    note: "Audit (wrong_trigger): the excerpt is a heading run on from 'Flood repairable house guidance'; no trigger."
  - id: viability-assessment
    note: "Audit (wrong_trigger): the excerpt is a 2021 heading run on from 'Dark Skies Handbook'; no trigger."
  - id: sci
    note: "Audit (outdated_link): 2021 wording; larger developments are only 'encouraged' to consult."
  - id: design-and-access-statement
    note: "A national requirement (NR); the list refers to the Planning Portal for which applications need one."
