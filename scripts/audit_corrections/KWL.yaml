    suggested-id: ""

low-confidence:
  - id: noise-assessment
    note: "Audit (wrong_trigger): the workbook quoted a mixed-use note ('should include an analysis of each
      use that has been applied for'), not the trigger; re-read the list."
  - id: transport-assessment
    note: "Audit (wrong_trigger): the workbook quoted a mixed-use note, not the trigger; re-read the list.
      It is not limited to full applications."
  - id: section-existing
    note: "Audit (wrong_trigger): the workbook quoted content ('spot levels, cross sections and a cut and
      fill plan'), not the trigger for the levels item."
  - id: section-proposed
    note: "Audit (wrong_trigger): the workbook quoted content ('spot levels, cross sections and a cut and
      fill plan'), not the trigger for the levels item."
