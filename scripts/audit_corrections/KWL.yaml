  - local-name: Parking, Access, Deliveries and Refuse Details
    source-text: "All applications where parking/access are required to be part of the proposal"
    source-url:
      https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
    suggested-id: parking-plan
  - local-name: Health Impact Assessment (item 12)
    source-text: "From the audit: residential over 50 units; commercial/industrial over 1,000 sq m; all new
      major public buildings and community facilities"
    source-url:
      https://www.knowsley.gov.uk/sites/default/files/2025-07/Validation%20Checklist%20-%20Adopted%20July%202025.pdf
