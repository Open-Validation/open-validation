    suggested-id: highways-access-details
  - local-name: Tree works plan and statement of reasons
    source-text: "From the audit: Section 7 Tree Applications - a dimensioned plan with each tree numbered,
      and a supporting statement of reasons"
    source-url: https://middlesbrough.gov.uk/media/nbafjkb1/planning-application-validation_checklist.pdf
    suggested-id: ""
