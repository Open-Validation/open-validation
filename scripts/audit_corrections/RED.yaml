# Corrections for Redditch Borough Council, from the council's audit.
# The council's 'Submit a planning application' page says "The Borough Council uses the national
# validation criteria for planning applications", so there is no current local list. The 2009
# Local Validation Checklist is still online (and in planning.data.gov.uk) but predates the NPPF
# and has lapsed, so it is not used. The page links an undated guidance note, 'Plans and Drawings
# to be submitted with a Planning Application' (rbc-plans-and-drawings-04-10-17-1.pdf); its items
# below are the audit's summary of that note, not the council's exact words.
local-authority: RED

validation-list:
  url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
  status: national-only
  date-basis: >-
    audit: the page says the council uses the national validation criteria; the only formal local
    list (Revised and Adopted 1 September 2009) has lapsed

submission-standards:
  - item: Location plan at 1:1250, with the site edged red (including access to the highway) and other
      land owned by the applicant edged blue
    level: must
  - item: Block plan at 1:200 or 1:500, showing trees
    level: must
  - item: Existing and proposed elevations and floor plans at 1:50 or 1:100
    level: must

requirements:
  - id: archaeological-assessment
    action: update
    confidence: low
    notes: >-
      Audit (wrong_trigger): the excerpt gives no trigger, and the council uses the national
      validation criteria, so it is unclear when this is asked for.

  - id: bng-metric
    action: update
    confidence: low
    notes: >-
      Audit (wrong_trigger): this is the statutory national Biodiversity Net Gain requirement, not a
      local one, and the excerpt is cut off. Statutory BNG applies to all non-exempt applications,
      not only Full planning.

  - id: roof-plan-proposed
    action: add
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: The proposal alters the roof.
    source-text: "Other drawings (as needed): Tree protection plans, roof plans, cross-sections for land
      level changes, street scene..."
    source-url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
    confidence: medium
    notes: "From the audit (missing_requirement): roof plans for roof alterations (Plans and Drawings guidance
      note)."

  - id: section-proposed
    action: add
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: The proposal changes land levels.
    source-text: "Other drawings (as needed): Tree protection plans, roof plans, cross-sections for land
      level changes, street scene..."
    source-url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
    confidence: medium
    notes: "From the audit (missing_requirement): cross-sections for land level changes (Plans and Drawings
      guidance note)."

  - id: arboriculturist-report
    action: add
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: Trees are affected by the proposal.
    source-text: "Other drawings (as needed): Tree protection plans, roof plans, cross-sections for land
      level changes, street scene..."
    source-url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
    must-include:
      - item: Tree protection plan
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): tree protection plans where trees are affected (Plans and
      Drawings guidance note)."

  - id: heritage-statement
    action: add
    required-if: discretionary
    source-url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
    confidence: low
    notes: "From the audit (missing_requirement): a Heritage Statement for buildings of historic significance
      (Plans and Drawings guidance note). The audit does not say which designations count."

  - id: biodiversity-survey-report
    action: add
    required-if:
      condition:
        field: protected-species
        value: true
        description: Protected species may be present on the site.
    source-url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
    confidence: medium
    notes: "From the audit (missing_requirement): a Preliminary Ecological Survey where protected species may
      be present (Plans and Drawings guidance note)."

unmapped:
  - local-name: Street scene drawings
    source-text: "Other drawings (as needed): Tree protection plans, roof plans, cross-sections for land
      level changes, street scene..."
    source-url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
    suggested-id: street-scene-elevations
  - local-name: Joinery details
    source-text: "From the audit: joinery details for conservation areas and listed buildings"
    source-url: https://www.redditchbc.gov.uk/residents/planning-and-building-control/planning-permission/submit-a-planning-application/
    suggested-id: joinery-details
