# Corrections for Horsham District Council, from inputs/audit/horsham-district-council.json.
# The audit compared the workbook with Horsham's Local Information Requirements for Validation:
# the January 2024 PDF (the workbook's source) and the council's undated, more recent HTML
# version of the same list (now the list URL). The PDF sets triggers by scale and site
# conditions, not by application type (audit issue 6).
local-authority: HOR

submission-standards:
  - item: Drawings to a recognised metric scale, with a north figure and a scale bar
    level: must
  - item: The wording 'do not scale' must not be used on drawings
    level: must

drop:
  - id: planning-statement
    sheets: [Householder]
    reason: "wrong_app_type: the source excludes householder applications"
  - id: sustainability-statement
    reason: "wrong mapping: the row is the Energy Statement (re-added as energy-statement)"

drop-unmapped:
  - local-name: Advertisement drawings / illumination details
    reason: "wrong_app_type: the excerpt is the Lighting Assessment trigger; Advert Details Plans re-added below"
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: the excerpt is the Telecommunications text (Surface Water Drainage Statement re-added below)"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: the excerpt is viability text"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: the excerpt runs into the CIL appendix (re-added below with the council's trigger fragment)"
  - local-name: Water efficiency / water usage statement
    reason: "not_a_requirement: a sentence describing the content of the Water Neutrality Statement"
  - local-name: Water Neutrality Statement
    reason: "wrong_trigger: the trigger leaves out that it applies to all applications except householder schemes (re-added below)"

requirements:
  - id: affordable-housing-statement
    action: update
    required-if:
      condition:
        field: dwelling-count
        operator: ">="
        value: 10
        description: A conversion or new build proposal resulting in 10 dwellings or more.
    source-text: Affordable Housing Statement Required for conversion or new build proposal resulting in 10 dwellings or more.

  - id: air-quality-assessment
    action: replace
    required-if:
      any:
        - ref: major-development
        - site:
            in: [air-quality-management-area]
            description: The site is in or near the Cowfold or Storrington Air Quality Management Area.
        - condition:
            field: floorspace-non-residential
            operator: ">="
            value: 500
            description: B8 (storage or distribution) development of 500 square metres or more.
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt was vague. From the audit (PDF row 2): major development, sites in or near the Cowfold or Storrington AQMA, or B8 of 500 sqm+."

  - id: archaeological-assessment
    action: update
    required-if:
      site:
        in: [archaeological-priority-area]
        description: The site is within a red or amber Archaeological Notification Area.
    confidence: low
    notes: >-
      Audit (wrong_trigger): the excerpt ends at 'within the following boundaries' and omits the
      red/amber Archaeological Notification Area thresholds (e.g. over 0.2ha, over 0.5ha, 10+
      units). Which threshold applies to which area needs checking in the list.

  - id: arboriculturist-report
    action: add
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees on or adjacent to the site, including trees in a Conservation Area or under a TPO.
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    must-include:
      - item: BS5837 tree survey
        level: must
        required-if:
          application-type:
            in: [full, outline]
    confidence: medium
    notes: >-
      From the audit (missing_requirement): Arboricultural Statement / Tree Survey for trees on or
      adjacent to the site, in a Conservation Area or under a TPO; a BS5837 survey for minor and
      major applications. It covers householder work too.

  - id: biodiversity-survey-report
    action: replace
    required-if:
      any:
        - condition:
            field: demolition
            value: true
            description: The proposal involves demolition of buildings.
        - discretionary
    source-text: >-
      species including protected species, such as (but not limited to) demolition of buildings,
      development of open land, development involving loss of trees and/or hedgerows, development
      involving or in close proximity to waterways/ponds
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt ran into the CIL form text (cut here). Open
      land, loss of trees or hedgerows and waterways/ponds have no field, so they are shown as
      officer discretion. It covers householder work too.

  - id: cil-form
    action: update
    required-if: discretionary
    notes: >-
      'Where relevant and in order to calculate CIL liability' (council's wording). The audit
      (wrong_app_type) notes it covers householder extensions creating floorspace; the council asks
      for the form even where there is no CIL liability.

  - id: daylight-sunlight-assessment
    action: add
    required-if: discretionary
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): increased height with potential significant impact on neighbours; householders included."

  - id: design-and-access-statement
    action: update
    required-if:
      any:
        - ref: major-development
        - all:
            - site:
                in: [conservation-area]
                description: The development is within a Conservation Area.
            - any:
                - condition:
                    field: dwelling-count
                    operator: ">="
                    value: 1
                    description: The development provides one or more dwelling houses.
                - condition:
                    field: floorspace
                    operator: ">="
                    value: 100
                    description: The floor space created is 100 square metres or more.

  - id: energy-statement
    action: add
    required-if:
      any:
        - all:
            - condition:
                field: new-build
                value: true
                description: The proposal erects new buildings.
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The proposal erects one or more dwellings.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 0
            description: The proposal is commercial development.
    source-text: Energy Statement Required for all applications for the erection of one or more dwellings and for all commercial development.
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "The workbook mapped this Energy Statement row to sustainability-statement."

  - id: environmental-statement
    action: add
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): Environmental Impact Assessment."

  - id: flood-risk-assessment
    action: update
    required-if:
      any:
        - site:
            in: [flood-risk-zone]
            description: All or part of the site is in Flood Zone 2 or 3.
        - discretionary
    confidence: medium
    notes: >-
      Audit (wrong_app_type): Flood Zones 2/3 including householder work. Land identified as at
      increased future flood risk or subject to other sources of flooding is shown as officer
      discretion. The excerpt also carries the Sequential Test text.

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building, listed-building-setting, conservation-area, locally-listed-building]
            description: The works would directly or indirectly impact a designated or non-designated heritage asset.
    source-text: Heritage Statement … Required when proposed works would directly or indirectly impact a heritage asset, designated and non-designated.
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "Audit (wrong_app_type, duplicate): it applies to listed building consent and householder work too. The workbook shared this excerpt with the contamination row."

  - id: land-contamination-assessment
    action: replace
    required-if:
      site:
        in: [contaminated-land]
        description: The site is known or suspected to be contaminated, or is near such land.
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted the Heritage Statement trigger."

  - id: lighting-assessment
    action: update
    required-if:
      condition:
        field: external-lighting
        value: true
        description: Any sort of illumination is to be installed, including commercial uses, recreational uses, security lighting and floodlighting.
    confidence: medium
    notes: "Applies to householder work too (audit wrong_app_type)."

  - id: noise-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: noise-generating-use
            value: true
            description: The development is likely to be a noise generator.
        - condition:
            field: noise-sensitive-use
            value: true
            description: The development is likely to be sensitive to noise from nearby sites and uses, including main 'A' road and rail traffic.
    source-text: >-
      Noise Assessment For developments, which are likely to be noise generators, or are likely to
      be sensitive to noise from nearby sites and uses including main ‘A’ road and rail traffic
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt ran into the Open Space row (cut here)."

  - id: planning-statement
    action: replace
    required-if:
      application-type:
        in: [full, outline]
    source-text: Planning Statement Required for all major development and for all minor development excluding householder applications.
    source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
    confidence: medium
    notes: "Audit (wrong_app_type, wrong_trigger): not for householder applications; the Full-planning row quoted the Minerals Resource Assessment text."

  - id: recreation-facilities-assessment
    action: update
    required-if:
      any:
        - condition:
            field: loss-of-use
            value: true
            description: The proposal involves the loss of open space, playing fields, bowling greens etc.
        - discretionary
    source-text: Open Space Assessment Required for applications within or affecting open spaces, including the loss of openspace, playing fields, bowling green’s etc.

  - id: roof-plan-existing
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: A loft conversion, or the erection of a dormer window.
    source-text: Roof plans (Existing andProposed) Required for all loft conversions, or applications including the erection of a dormer window.
    must-include:
      - item: Scale 1:50 or 1:100
        level: must
    confidence: medium
    notes: "Applies to householder work too (audit wrong_app_type)."

  - id: roof-plan-proposed
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: A loft conversion, or the erection of a dormer window.
    source-text: Roof plans (Existing andProposed) Required for all loft conversions, or applications including the erection of a dormer window.
    must-include:
      - item: Scale 1:50 or 1:100
        level: must
    confidence: medium
    notes: "Applies to householder work too (audit wrong_app_type)."

  - id: sci
    action: replace
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 10
            description: Major development of 10 or more dwellings.
        - condition:
            field: floorspace
            operator: ">="
            value: 1000
            description: Major development of 1,000 square metres or more.
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook quoted a policy citation. From the audit: major development of 10+ dwellings or 1,000 sqm+."

  - id: section-existing
    action: add
    required-if:
      any:
        - condition:
            field: ground-level-change
            value: true
            description: The proposal changes floor levels or is on sloping ground.
        - discretionary
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): section plans for floor level changes, sloping ground, infill or driveways (infill and driveways shown as officer discretion)."

  - id: section-proposed
    action: add
    required-if:
      any:
        - condition:
            field: ground-level-change
            value: true
            description: The proposal changes floor levels or is on sloping ground.
        - discretionary
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): section plans for floor level changes, sloping ground, infill or driveways (infill and driveways shown as officer discretion)."

  - id: site-plan
    action: update
    must-include:
      - item: Metric scale of 1:200 or 1:500
        level: must
      - item: Direction of north
        level: must
      - item: Existing buildings, boundaries, adjacent properties and trees
        level: must
      - item: Any Public Rights of Way, footpaths, cycle paths and highways
        level: must
      - item: Trees clearly identified and measured
        level: must
        required-if:
          all:
            - application-type:
                in: [hh]
            - condition:
                field: trees-on-or-near-site
                value: true
                description: There are trees on or next to the site.
        source-text: For Householder applications a block plan with the trees clearly identified and measured would be a requirement.

  - id: telecommunications-report
    action: update
    required-if:
      condition:
        field: telecommunications-equipment
        value: true
        description: Mast and antennae development by mobile phone network operators.
    source-text: >-
      Telecommunication Development – Supplementary Information Required for mast and antennae
      development by mobile phone network operators.Should include a range of supplementary
      information including the area of search,alternative sites considered, details of any
      consultation undertaken, details of the proposed structure and technical justification
      including other sites considered and reasons for their rejection by the operator and
      information about the proposed development.
    must-include:
      - item: The area of search
        level: should
      - item: Alternative sites considered, and the reasons for their rejection
        level: should
      - item: Details of any consultation undertaken
        level: should
      - item: Details of the proposed structure
        level: should
      - item: Technical justification
        level: should

  - id: town-centre-impact-assessment
    action: add
    required-if:
      all:
        - condition:
            field: out-of-centre
            value: true
            description: The site is out of centre.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 1000
            description: Retail or other town centre uses over 1,000 square metres.
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): Retail Impact Statement for out-of-centre retail or town centre uses over 1,000 sqm."

  - id: transport-assessment
    action: update
    required-if: discretionary
    notes: "Required where the proposed development has significant transport implications (council's wording)."

  - id: travel-plan
    action: update
    required-if: discretionary
    notes: "Required for commercial and residential developments that require a Transport Assessment (council's wording)."

  - id: viability-assessment
    action: replace
    required-if:
      all:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 10
            description: Major residential development of 10 or more dwellings.
        - discretionary
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger): from the audit, major residential (10+ dwellings) where full S106
      contributions are claimed to be unviable. The council says all viability assessments must be
      published for public scrutiny.

unmapped:
  - local-name: Advert Details Plans
    source-text: "Advert Details Plans Required for all advertisement consent applications."
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    suggested-id: advertisement-details
  - local-name: Surface Water Drainage Statement
    source-text: "All buildings, hard surfacing, and extensions"
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    suggested-id: drainage-strategy
  - local-name: Ventilation / Extraction Statement
    source-text: "… conditioning or extraction equipment is required"
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    suggested-id: ventilation-extraction-details
  - local-name: Water Neutrality Statement
    source-text: "(with the exception of a householder scheme) … There is a requirement for a Water Neutrality Statement to support planning applications. From the audit: the HTML version now says only 'where necessary'."
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    suggested-id: water-neutrality-statement
  - local-name: Essential Rural Workers Statement
    source-text: "From the audit: new rural worker dwellings"
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    suggested-id: rural-worker-statement
  - local-name: Marketing Information
    source-text: "From the audit: loss of employment, retail or community uses; at least 12 months' marketing"
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    suggested-id: marketing-evidence
  - local-name: Minerals Resource Assessment
    source-text: "From the audit: major and minor development above thresholds in Minerals Consultation Zones, outline or full only (Policy M9 of the West Sussex …)"
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    suggested-id: minerals-resource-assessment
  - local-name: Structural Statement and Survey
    source-text: "From the audit: especially barn conversions"
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    suggested-id: structural-survey
  - local-name: Utilities / Services Strategy
    source-text: "From the audit: 100+ dwellings or 10,000 sqm+"
    source-url: https://www.horsham.gov.uk/__data/assets/pdf_file/0004/79159/Local-Validation-List.pdf
    suggested-id: utilities-statement
  - local-name: Outline fire strategy / safety report (Battery Energy Storage Systems)
    source-text: "From the audit: large-scale (non-domestic) Battery Energy Storage Systems (HTML version of the list)"
    source-url: https://www.horsham.gov.uk/planning/planning-applications/local-and-national-requirements/development-management-local-information-requirements-for-validation
    suggested-id: bess-fire-strategy

low-confidence:
  - id: bng-metric
    note: "Audit (outdated_link): the PDF's BNG wording ('unless excluded by forthcoming guidance and secondary legislation') is out of date; the HTML version says BNG for major development 'from February 2024'. The application types need checking."

new-fields:
  - field: roof-alteration
    kind: boolean
    label: Alters the roof
    description: The proposal alters the roof form, coverings or roof features (dormers, rooflights, solar panels, chimneys, parapets, gutters).
  - field: ground-level-change
    kind: boolean
    label: Changes ground levels
    description: The proposal changes ground levels, or is next to changing ground levels.
  - field: out-of-centre
    kind: boolean
    label: Outside a town centre
    description: The site is outside an existing town, district or local centre.
  - field: telecommunications-equipment
    kind: boolean
    label: Telecommunications mast or antenna
    description: The proposal includes a telecommunications mast, antenna or base station.
