# Corrections for Chichester District Council, from inputs/audit/chichester-district-council.json.
# The audit checked the November 2023 Local List (the latest adopted list found). A revised draft
# list was approved for consultation on 6 August 2025; if it has since been adopted, these files
# describe the older list. Grokbot also mixed in rows from the superseded July 2017 list
# (CDC_Local_List.pdf); those rows are dropped or flagged below. Items marked "From the audit"
# use the audit's paraphrase of the Nov 2023 list, not the council's exact words.
local-authority: CHI

submission-standards:
  - item: Plans from or based on Ordnance Survey data annotated with the licence number, or marked as surveyed if drawn from a survey of the site
    level: must

drop:
  - id: schedule-of-works
    reason: >-
      wrong_trigger / wrong_app_type: the Full planning row is the Structural Survey and Conversion
      Method Statement (from the superseded 2017 list) and the Works to trees row is the tree survey
      text; neither is a schedule of works
  - id: lighting-assessment
    sheets: [Listed building consent]
    reason: "wrong_document: the LBC row comes from the superseded July 2017 list"
  - id: land-contamination-assessment
    sheets: [Change of use - prior approval]
    reason: "wrong_document: the prior approval row comes from the superseded July 2017 list"

drop-unmapped:
  - local-name: Cycle parking details
    reason: "wrong_document: from the superseded July 2017 list"
  - local-name: Parking provision / Parking plan
    reason: "wrong_trigger: reuses the EV charging excerpt; the council's own Parking Assessment section was not captured"
  - local-name: Pre-application advice / engagement details
    reason: "wrong_trigger: the excerpt is the Planning Statement trigger"
  - local-name: Ground investigation / Geotechnical / Basement Impact Assessment
    reason: "wrong_trigger: the excerpt is water neutrality borehole-yield text, not a ground investigation"
  - local-name: Water efficiency / water usage statement
    reason: "wrong_trigger: the excerpt is water neutrality evidence about agricultural water use (covered by the Water Neutrality item)"
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: quotes the foul/non-mains drainage text instead of the 8B threshold; replaced below"
  - local-name: Habitats Regulations Assessment information / SPA mitigation
    reason: "wrong_trigger: starts mid-sentence and drops the dwellings/holiday accommodation trigger; replaced below"
  - local-name: Water Neutrality Statement
    reason: "wrong_trigger: the excerpt is a fragment with no Sussex North trigger; replaced below"

requirements:
  - id: affordable-housing-statement
    action: add
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 11
            description: The proposal is a net increase of 11 or more homes.
        - all:
            - condition:
                field: dwelling-count
                operator: ">="
                value: 6
                description: The proposal is a net increase of 6 or more homes.
            - site:
                in: [designated-rural-area]
                description: The site is in the designated rural area.
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    confidence: medium
    notes: >-
      From the audit (missing_requirement): Nov 2023 list s.1, a net increase of 11+ units (6+ in
      the designated rural area). It also applies to reserved matters, except "reserved matters with
      no change to amount, mix, or tenure" (audit quote).

  - id: protected-landscape-assessment
    action: add
    required-if:
      site:
        in: [area-of-outstanding-natural-beauty]
        description: >-
          The site is within the Chichester Harbour AONB (all development except listed building
          consent and lawful development certificates), or major or minor development is outside
          settlement boundaries within 500m of the AONB.
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    confidence: medium
    notes: >-
      From the audit (missing_requirement): an AONB / Chichester Harbour Statement (s.2) for all
      development within the AONB except LBC/LDC, and for major/minor development outside settlement
      boundaries within 500m of the AONB. The workbook had it only as tab fragments ("Statements
      should be informed by the policies and principles set out in the Chichester Harbour Management
      Plan ...").

  - id: sustainability-statement
    action: add
    required-if:
      condition:
        field: new-build
        value: true
        description: New residential or commercial development, including replacement dwellings.
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    confidence: medium
    notes: "From the audit (missing_requirement): a Sustainable Construction and Design Statement for all new residential and commercial development, including replacement dwellings."

  - id: heritage-statement
    action: replace
    required-if:
      site:
        in: [listed-building, archaeological-priority-area, conservation-area, scheduled-monument, park-and-garden]
        description: >-
          The development is within the curtilage of or directly affects a listed building; is within
          an area of recognised archaeological importance; is within or in the setting of a
          conservation area; or directly affects or is within the setting of a scheduled monument or
          a Registered Historic Park or Garden.
    source-text: >-
      A Heritage statement is required for the following development which would: 1) be within the
      curtilage of, or directly affecting, a Listed Building 2) be within an area of recognised
      archaeological importance 3) be within a Conservation Area 4) be within the setting of a
      Conservation Area, 5) directly affect or be within the setting of a scheduled monument, and 6)
      directly affect or be within the setting of a Registered Historic Park or Garden.
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    confidence: medium
    notes: >-
      Audit (wrong_app_type, missing_requirement): the workbook had this only under listed building
      consent, but it applies to planning applications too, including householder work.

  - id: arboriculturist-report
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, outline]
        - condition:
            field: trees-on-or-near-site
            value: true
            description: >-
              New building work (including access drives, patios and drains or services) comes within
              15 metres of a tree.
        - site:
            in: [tree-preservation-zone, conservation-area]
            description: >-
              The tree has a tree preservation order (on the site or on adjoining land) or lies within
              a conservation area.
    source-text: >-
      TREE SURVEY/ARBORICULTURAL IMPLICATIONS & METHOD STATEMENT When required An arboricultural
      impact appraisal (AIA) is required for any new building work (including construction of access
      drive, patios and the laying of drains/services) that comes within 15 metres of: 1) A tree the
      subject of a tree preservation order, either within the application site or on adjoining land,
      or 2) A tree that lies within a conservation area.
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    confidence: medium
    notes: >-
      Audit (wrong_app_type): triggered by new building work near trees, not by tree works
      applications. The audit names householder and full planning; most Part II items also apply to
      outline.

  - id: biodiversity-survey-report
    action: update
    required-if:
      condition:
        field: protected-species
        value: true
        description: The proposed development is likely to affect protected or priority species.
    must-include:
      - item: Preliminary Ecological Appraisal, including an ecological data search from the Sussex Biodiversity Record Centre
        level: must
      - item: All secondary surveys identified as necessary within the PEA
        level: must
      - item: Completed Protected Species Survey Checklist
        level: must
      - item: Any mitigation strategies
        level: must
    confidence: medium
    notes: "The excerpt gives the trigger ('Where a proposed development is likely to affect protected or priority species'). The audit notes protected species surveys also apply to householder work."

  - id: cil-form
    action: update
    required-if:
      any:
        - condition:
            field: floorspace
            operator: ">="
            value: 100
            description: The proposal creates 100 square metres or more of floorspace (including householder extensions).
        - condition:
            field: residential-annexe
            value: true
            description: The proposal includes a residential annexe.
    confidence: low
    notes: >-
      The council's wording is "where required". From the audit (wrong_app_type): CIL forms apply to
      householder extensions of 100 sqm+ and annexes. The full CIL liability rules (e.g. new
      dwellings) aren't spelled out in the extract.

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.
    confidence: medium
    notes: "The excerpt says EIA 'is needed for certain types of development; these are usually but not always major developments'."

  - id: flood-risk-assessment
    action: update
    required-if:
      site:
        in: [flood-risk-zone]
        description: All development (including extensions) in flood zone 2 or 3.
    must-include:
      - item: Identify and assess the risks of all forms of flooding to and from the development
        level: must
      - item: How these flood risks will be managed, taking climate change into account
        level: must
    confidence: medium
    notes: "From the audit (wrong_app_type): Nov 2023 list s.6 requires an FRA for 'all development (including extensions)' in Flood Zones 2/3. The must-include items are the council's 'Information required' wording."

  - id: land-contamination-assessment
    action: replace
    required-if:
      site:
        in: [contaminated-land]
        description: >-
          A previous use may have introduced land contamination to the soil or water environment, or a
          sensitive land use is proposed on a site where a previous use may have left a legacy of
          contamination.
    source-text: >-
      … have introduced land contamination to the soil and/or water environment, 2) a sensitive land
      use is proposed on a site where a previous use may have left a legacy of contamination.
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    confidence: low
    notes: "The Nov 2023 excerpt is cut off at the start. The 2017 list's prior approval row (sensitive uses including change of use or prior notification; potentially polluting uses) was dropped as superseded."

  - id: planning-statement
    action: update
    required-if:
      any:
        - ref: major-development
        - discretionary
    must-include:
      - item: The context and need for the proposed development
        level: should
    confidence: medium
    notes: "Required for all major development and 'when otherwise advised via pre-application advice provided by the Council'. The excerpt's list of contents is cut off after the first item."

  - id: town-centre-impact-assessment
    action: update
    required-if:
      all:
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 2500
            description: Over 2,500 square metres of retail, leisure and/or office development.
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Outside town centres, and not in accordance with an up-to-date Local Plan.
    confidence: medium
    notes: "The excerpt also covers the sequential test for main town centre uses not in an existing centre and not in accordance with an up-to-date Local Plan."

  - id: floor-plan-proposed
    action: update
    must-include:
      - item: Existing and proposed floor plans at 1:100 or 1:50, as necessary to clearly show the proposed works in relation to what is already there
        level: must
    confidence: medium
    notes: "From the audit (wrong_app_type): the Nov 2023 list's Plans and Drawings section (s.17) 'applies to all applications'."

  - id: roof-plan-proposed
    action: update
    must-include:
      - item: Position of any rooflights, solar panels or flues
        level: should
    notes: "The council's wording: 'The roof plans should include the position of any rooflights/solar panels/flues as appropriate.'"

unmapped:
  - local-name: Surface water drainage strategy / statement
    source-text: >-
      From the audit: Drainage Strategy (8B) for 5+ dwellings or 1,000 sqm+; Surface Water Drainage
      Statement (8C) for 1-4 dwellings or commercial under 1,000 sqm
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    suggested-id: drainage-strategy
  - local-name: Recreational disturbance (SPA) mitigation statement
    source-text: >-
      When required All development resulting in a net increase in dwellings or holiday
      accommodation within: 1) 5.6km of the Chichester and Langstone Harbours SPA, or 2) 3.5km of the
      Pagham Harbour SPA.
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    suggested-id: habitats-regulations-assessment
  - local-name: Water Neutrality Statement
    source-text: >-
      From the audit: development in the Sussex North Water Resource Zone, "excluding householder
      works other than pools and annexes" (s.4C)
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    suggested-id: water-neutrality-statement
  - local-name: Road Safety Audit (21B)
    source-text: >-
      21B Road Safety Audit When required For all ‘major’ planning applications that include any of
      the following: 1) Alteration to an existing highway, 2) Intensification of use of an existing
      access.
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    suggested-id: road-safety-audit
  - local-name: Interim Position Statement Justification
    source-text: "From the audit: residential development outside settlement boundaries"
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    suggested-id: interim-position-statement-justification
  - local-name: Odour Assessment (s.16)
    source-text: "From the audit: an Odour Assessment, separate from Ventilation/Extraction (no trigger given)"
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    suggested-id: odour-dust-vibration-assessment
  - local-name: Overheating / Ventilation Statement (s.15)
    source-text: "From the audit: an Overheating/Ventilation Statement (no trigger given)"
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    suggested-id: overheating-statement
  - local-name: Coastal squeeze and Medmerry compensatory habitat statements
    source-text: "From the audit: coastal squeeze and Medmerry compensatory habitat statements (no trigger given)"
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    suggested-id: compensatory-habitat-statement
  - local-name: Exception Test (7B)
    source-text: "From the audit: Exception Test (7B), alongside the Sequential Test (no trigger given)"
    source-url: https://www.chichester.gov.uk/media/39077/CDC-Local-Validation-List-November-2023/doc/CDC_Local_Validation_List_November_2023.docx?m=638358065654700000
    suggested-id: flood-sequential-exception-test

low-confidence:
  - id: site-plan
    note: "Audit (wrong_document): the block plan excerpt (1:500 or 1:200, footprint, boundary treatment) comes from the superseded July 2017 list. The Nov 2023 list's Plans and Drawings section applies to all applications."
  - id: elevation-existing
    note: "The workbook's excerpt is the floor plan wording, not an elevation requirement."
  - id: elevation-proposed
    note: "The workbook's excerpt is the floor plan wording, not an elevation requirement."
  - id: bng-metric
    note: "Audit (wrong_trigger): the excerpt ('to deliver BNG on that site.') is a fragment; BNG applied to major development from Nov 2023 and small sites from Apr 2024."
  - id: transport-assessment
    note: "Audit (wrong_trigger): the excerpt is the Road Safety Audit trigger (now an unmapped item); the council's 21A unit/floorspace thresholds were not captured."
  - id: viability-assessment
    note: "Audit (wrong_trigger): the excerpt gives no trigger."
  - id: air-quality-assessment
    note: "Audit (wrong_app_type): the type was guessed and the excerpt (odour) gives no trigger."
  - id: noise-assessment
    note: "Audit (wrong_app_type): the type was guessed and the excerpt describes content, not a trigger."
  - id: lighting-assessment
    note: "The excerpt is cut off at the start (bat SAC buffers: 12km of Singleton and Cocking Tunnels SAC, 200m of a bat flight-line from The Mens or Ebernoe Common SAC); re-read the council's list."

new-fields:
  - field: protected-species
    kind: boolean
    label: Protected or priority species affected
    description: The proposal is likely to affect protected or priority species or their habitats.
  - field: scheduled-monument
    kind: designation
    label: Scheduled monument
    description: Site contains, or is in the setting of, a scheduled monument.
  - field: park-and-garden
    kind: designation
    label: Registered park or garden
    description: Site is in, or in the setting of, a registered historic park or garden (dataset park-and-garden).
  - field: designated-rural-area
    kind: designation
    label: Designated Rural Area
    description: Site is in a Designated Rural Area (Housing Act 1985 s157), where lower affordable housing thresholds apply.
  - field: residential-annexe
    kind: boolean
    label: Residential annexe
    description: The proposal includes a residential annexe.
  - field: out-of-centre-town-centre-use
    kind: boolean
    label: Main town centre use outside a centre
    description: >-
      The proposal is for a main town centre use (retail, leisure, offices and similar) at an
      edge-of-centre or out-of-centre location, outside a defined town centre or primary shopping area.
