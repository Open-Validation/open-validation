new-fields:
  - field: biodiversity-gain-condition
    kind: boolean
    label: Subject to the biodiversity gain condition
    description: >-
      The development is subject to the statutory biodiversity gain condition (Schedule 7A, Town and
      Country Planning Act 1990), i.e. it is not exempt.
  - field: ancient-woodland
    kind: designation
    label: Ancient woodland or veteran trees nearby
    description: Site is in or near ancient woodland or veteran trees (dataset ancient-woodland).
  - field: scheduled-monument
    kind: designation
    label: Scheduled monument
    description: Site is, contains or affects the setting of a scheduled monument (dataset scheduled-monument).
  - field: out-of-centre-town-centre-use
    kind: boolean
    label: Main town centre use outside a centre
    description: >-
      The proposal is for a main town centre use (retail, leisure, offices and similar) at an
      edge-of-centre or out-of-centre location, outside a defined town centre or primary shopping area.
