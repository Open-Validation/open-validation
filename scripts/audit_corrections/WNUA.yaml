  - local-name: Rural Enterprise Statement
    source-text: "Rural Enterprise Statement for creation of a rural worker's dwelling"
    source-url: https://cms.westnorthants.gov.uk/media/30003/download
    suggested-id: rural-workers-dwelling-appraisal
  - local-name: Independent Design Review Panel report
    source-text: "From the audit: homes justified under NPPF para 84(e)"
    source-url: https://cms.westnorthants.gov.uk/media/30003/download
    suggested-id: design-review-report
  - local-name: Design Code
    source-text: "Design Code Outline applications for large-scale major development (200+ houses, 10,000 square metres..."
    source-url: https://cms.westnorthants.gov.uk/media/30003/download
    suggested-id: design-code
  - local-name: Illustrative Masterplan
    source-text: "From the audit: outline applications where access, layout and/or scale is reserved, showing access points, layout and maximum ridge and eaves heights"
    source-url: https://cms.westnorthants.gov.uk/media/30003/download
    suggested-id: illustrative-masterplan
  - local-name: Dropped Kerb Plan
    source-text: "From the audit: householder applications providing or altering a vehicular access"
    source-url: https://cms.westnorthants.gov.uk/media/30003/download
    suggested-id: access-drawing
  - local-name: External Wall Insulation details
    source-text: "Photograph or detailed scale drawing of existing elevation(s) to be changed;"
