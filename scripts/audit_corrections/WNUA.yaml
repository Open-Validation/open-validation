    source-text: "From the audit: where constraints or consultees raise concern: transport statement, FRA, land contamination, noise, odour, air quality, site waste management plan and archaeological DBA"
    source-url: https://cms.westnorthants.gov.uk/media/30003/download
    suggested-id: ""
  - local-name: Advertisement layout plan
    source-text: "Plan: Layout Plan Showing the location within the site of all proposed signage"
    source-url: https://cms.westnorthants.gov.uk/media/30003/download
