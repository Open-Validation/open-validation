  - local-name: Evidence (lawful development certificates)
    source-text: "Evidence ... for applications made under section 191; any statement(s) of fact to be in the form of a statutory declaration"
    source-url: https://cms.westnorthants.gov.uk/media/30003/download
    suggested-id: lawful-development-evidence
  - local-name: Rural Building Questionnaire
    source-text: "Rural Building Questionnaire For Agricultural Prior Approval"
    source-url: https://cms.westnorthants.gov.uk/media/30003/download
    suggested-id: rural-building-questionnaire
  - local-name: SAMM Payment
