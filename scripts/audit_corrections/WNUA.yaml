  - local-name: Schedule of development / Schedule of plans and drawings
    source-text: "From the audit: new dwellings or residential/commercial floorspace; schedule of plans for new dwellings or change of use, majors (s73/NMA) and PiP"
    source-url: https://cms.westnorthants.gov.uk/media/30003/download
