      https://www.lambeth.gov.uk/sites/default/files/2025-12/Local_Information_Requirements_2024.pdf
    suggested-id: breeam-pre-assessment
  - local-name: Circular Economy Statement (LIR 19)
    source-text: "From the audit: GLA referable applications"
    source-url: 
      https://www.lambeth.gov.uk/sites/default/files/2025-12/Local_Information_Requirements_2024.pdf
    suggested-id: circular-economy-statement
  - local-name: Navigational / Riverside Risk Assessment (LIR 53)
    source-text: "From the audit: sites in the Port of London Authority area"
