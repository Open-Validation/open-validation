    suggested-id: navigational-risk-assessment
  - local-name: Other LIRs listed without triggers
    source-text: >-
      From the audit: LIR 10 Workspace Strategy/Management Plan; 18 Build to Rent Statement; 20
      Community Use Management Plan; 30 Evening economy/food and drink management plan; 35 Foul
      Water and Water Supply Capacity Assessment; 38 Hostel and HMO Statement; 40 Housing Quality
      Statement; 42 Industrial Intensification and Co-location Statement; 43 Infrastructure
      Assessment; 46 Large-scale Purpose-built Shared Living Management Plan; 49 Loss of Existing
      Housing and Estate Redevelopment Statement; 55 Parking Design and Management Plan; 62 Public
      Realm Statement; 64 Safety, Security and Emergency Strategy; 65 Servicing and Delivery Plan;
      66-68 Social Infrastructure Impact Assessment / Management Plan / Statement; 71 Student
      Housing Statement and Management Plan; 79 Urban Greening Factor Assessment; 80 Ventilation or
      Extraction Statement; 82 Visitor Accommodation Impact Assessment; 83 Visitor Management Plan;
      84 Whole Life Cycle Carbon Assessment
    source-url: 
      https://www.lambeth.gov.uk/sites/default/files/2025-12/Local_Information_Requirements_2024.pdf
    suggested-id: ""

low-confidence:
  - id: fire-statement
    note: >-
      Audit (wrong_trigger): the excerpt merges the high-rise trigger (cut off) with 'All
      applications for minor developments should be accompanied by a Fire Statement that meets the
      requirements of Part A of Policy D12 of the London Plan (2021)'. The full trigger needs
      checking in the list.

