# Corrections for Torridge District Council, from inputs/audit/torridge-district-council.json.
# Torridge shares a joint local list with North Devon Council (published as web pages on the
# Torridge site, with a Local List Matrix as a supporting download). The audit could not read the
# matrix PDF or most of the glossary pages, so contents were only partly checked. Grokbot's three
# rows came from an S106 Heads of Terms template, not the local list. The items the audit could
# confirm from the joint list are added below.
local-authority: TOR

validation-list:
  date-basis: >-
    'Version 1.4 November 2023' is the Local List Matrix version, not the date of the joint local
    list, which the audit could not confirm (its introduction cites the NPPF 2021, suggesting the
    2022 joint list; North Devon names its matrix 'September 2023')

drop-unmapped:
  - local-name: Pre-application advice / engagement details
    reason: >-
      not_a_requirement: a note that the pre-application service can be used to work out open
      space contributions, not a document to submit

requirements:
  - id: viability-assessment
    action: update
    required-if: discretionary
    confidence: low
    notes: >-
      Audit (wrong_trigger): the excerpt comes from the S106 Heads of Terms template and gives no
      trigger beyond "in the event a viability assessment is required".

unmapped:
  - local-name: Wildlife trigger list
    source-text: "a wildlife trigger list must accompany every application"
    source-url: https://www.torridge.gov.uk:443/article/21240/The-Local-List
    suggested-id: wildlife-trigger-list
  - local-name: Foul drainage assessment form
    source-text: >-
      where connection to a public sewer is not feasible, a foul drainage assessment form must
      accompany the application
    source-url: https://www.torridge.gov.uk:443/article/21240/The-Local-List
    suggested-id: foul-drainage-assessment
  - local-name: Community Services and Facilities - Justification for Loss
    source-text: "Community Services and Facilities - Justification for Loss"
    source-url: https://www.torridge.gov.uk/article/21189
    suggested-id: loss-of-community-facility-statement

low-confidence:
  - id: "*"
    note: >-
      Audit (missing_requirement / wrong_app_type): the joint North Devon and Torridge local list has
      many more requirement pages (articles roughly 21181-21240) that the audit could not read, so
      this council's requirements are incomplete.
