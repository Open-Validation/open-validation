  - local-name: Fire Safety (non-major) - Planning Fire Safety Strategy or Reasonable Exception 
      Statement
    source-text: Non-major developments, including householder applications
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: fire-statement
  - local-name: Basement Impact Assessment / Construction Method Statement for Basements
    source-text: All applications that involve basement development
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: basement-impact-assessment
  - local-name: Flues and Vents Assessment
    source-text: "From the audit: any application proposing plant, flues, ventilation, extraction or air
      conditioning in detail"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: ventilation-extraction-details
  - local-name: HMO Management Plan
    source-text: "From the audit: conversions or changes of use to HMOs"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: hmo-management-plan
  - local-name: Community Use Statement
    source-text: "From the audit: loss of a community use"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: community-use-statement
  - local-name: Student Housing Report
    source-text: "From the audit: student accommodation"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: student-housing-management-plan
  - local-name: Affordable and Managed Workspace Management Plan
    source-text: "From the audit: major office or commercial mixed use"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: affordable-workspace-plan
  - local-name: Air Quality Positive Statement
    source-text: "From the audit: GLA-referable EIA-category majors"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: air-quality-positive-statement
  - local-name: Circular Economy Statement
    source-text: "From the audit: GLA-referable majors"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: circular-economy-statement
  - local-name: Whole Life-Cycle Carbon Assessment
    source-text: "From the audit: GLA-referable majors"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: whole-life-carbon-assessment
  - local-name: Green Infrastructure / Urban Greening Factor
    source-text: "From the audit: all majors"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: urban-greening-factor
  - local-name: Health Impact Assessment
    source-text: "From the audit: majors of 150+ dwellings"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: health-impact-assessment
  - local-name: Sequential Test (Town Centre)
    source-text: "From the audit: main town centre uses"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: sequential-test
  - local-name: Sustainable Drainage / Drainage Strategy
    source-text: "From the audit: all majors plus smaller schemes meeting flood-risk criteria"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: drainage-strategy
  - local-name: S106 Heads of Terms
    source-text: "From the audit: all majors"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: heads-of-terms
  - local-name: Tall Buildings Assessment
    source-text: "From the audit: majors of 18m+ and/or over 6 storeys"
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: tall-buildings-assessment
  - local-name: Habitats Regulations Assessment / Unilateral Undertaking (SAMMS and SANGS 
      contributions)
    source-text: >-
      All non-major residential proposals within 0-6.2km Zone of Influence of Epping Forest Special
      Area of Conservation (SAC) … Prior approval change of use to residential units
    source-url: https://www.redbridge.gov.uk/media/htrnwuzu/validation-list_aug-2026.pdf
    suggested-id: habitats-regulations-assessment

low-confidence:
  - id: bng-metric
    note: "Audit (wrong_trigger): the excerpt is Environment Act text and link fragments, not the LPAR's
      trigger."
  - id: noise-assessment
    note: "Audit (wrong_trigger): the excerpt is content text; the LPAR's trigger was not captured."
  - id: flood-risk-assessment
    note: "Audit (wrong_trigger): the excerpt is content text; the LPAR's trigger was not captured."

