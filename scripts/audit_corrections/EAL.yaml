# Corrections for London Borough of Ealing, from inputs/audit/london-borough-of-ealing.json.
# The workbook has no rows for Ealing, and the audit couldn't fetch a local list
# (contents_checked: false). Items marked "From the audit" use the audit's paraphrase of
# Ealing's planning application process page 2, not the council's exact words.
local-authority: EAL

validation-list:
  url: https://www.ealing.gov.uk/downloads/download/1383/full_planning_application_checklist
  status: not-found
  date-basis: >-
    audit: the workbook link is a generic process page, not a list. This candidate 'Planning
    Application Requirements' checklist is recorded on planning.data.gov.uk (entity 20065, start
    date 2024-01-01) but returned an error, so no current list was confirmed

requirements:
  - id: viability-assessment
    action: add
    required-if: discretionary
    source-url: https://www.ealing.gov.uk/info/201159/making_a_planning_application/2234/planning_application_process/2
    must-include:
      - item: Supplied unredacted, in a form that can be published, at validation
        level: must
    confidence: low
    notes: >-
      From the audit (missing_requirement): the process page says viability statements are
      published unredacted and must be supplied in publishable form at validation. No trigger is
      given.

  - id: cil-form
    action: add
    required-if: discretionary
    source-url: https://www.ealing.gov.uk/info/201159/making_a_planning_application/2234/planning_application_process/2
    confidence: low
    notes: "From the audit (missing_requirement): the process page asks for CIL information 'where applicable'."

