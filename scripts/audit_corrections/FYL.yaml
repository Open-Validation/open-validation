# Corrections for Fylde Borough Council, from the council's audit.
# The audit read the current, undated validation checklist web page. Its 'Local Requirements' section
# says 'The Council may also require that one or more of the documents set out in the following...'
# and then names 27 items without thresholds; only the Heritage Statement has a trigger (works to a
# listed building or in a conservation area). Grokbot captured none of them. The named items are
# added below with no trigger (shown as "Check"), as the list gives none. The page also sets plan
# expectations (location plan at 1:1250, block plan, elevations, floor plans, sections and levels
# for sloping sites, roof plans), mostly national.
local-authority: FYL

submission-standards:
  - item: All drawings and plans include a drawing reference number, with a schedule of the drawings
      submitted on the application form
    level: should

drop:
  - id: design-and-access-statement
    reason: "wrong_trigger: a garbled run of checklist lines ('Design and Access Statement, if required');
      a national requirement, not a local one"

requirements:
  - id: heritage-statement
    action: add
    required-if:
      any:
        - application-type:
            in: [lbc, demolition-con-area]
        - site:
            in: [listed-building, conservation-area]
            description: Works to a listed building or in a conservation area.
    source-url: https://new.fylde.gov.uk/validation-checklist/
    confidence: medium
    notes: "From the audit (missing_requirement): needed for works to a listed building or in a conservation
      area (including historical and archaeological features and Scheduled Ancient Monuments)."

  - id: environmental-statement
    action: add
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.
    source-url: https://new.fylde.gov.uk/validation-checklist/
    confidence: low
    notes: "From the audit (missing_requirement): named in the Local Requirements list."

  - id: section-existing
    action: add
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: A sloping site.
    source-url: https://new.fylde.gov.uk/validation-checklist/
    confidence: low
    notes: "From the audit (missing_requirement): site sections and levels for sloping sites."

  - id: section-proposed
    action: add
