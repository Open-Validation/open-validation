  - local-name: Tall buildings impact assessment
    source-text: "From the audit: listed without a trigger"
    source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
    suggested-id: tall-buildings-assessment
  - local-name: Townscape and visual impact assessment
    source-text: "From the audit: major development"
    source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
    suggested-id: townscape-visual-impact-assessment
  - local-name: Ventilation / extraction details
    source-text: "From the audit: cafes, restaurants, pubs, takeaways and other commercial cooking"
    source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
    suggested-id: ventilation-extraction-details
