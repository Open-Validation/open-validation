  - local-name: Parking and access arrangements
    source-text: "From the audit: listed without a trigger"
    source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
    suggested-id: parking-details
  - local-name: Planning obligations / draft heads of terms
    source-text: "From the audit: listed without a trigger"
    source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
    suggested-id: heads-of-terms
  - local-name: Servicing management plan
    source-text: "From the audit: listed without a trigger"
    source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
    suggested-id: delivery-servicing-plan
  - local-name: Waste storage and collection details
    source-text: "From the audit: listed without a trigger"
    source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
    suggested-id: refuse-storage-details
  - local-name: Sustainable drainage (SuDS) strategy
    source-text: "From the audit: all applications"
    source-url: https://www.rbkc.gov.uk/media/document/rbkc-local-validation-list
