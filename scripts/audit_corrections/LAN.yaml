  - local-name: Public Rights of Way
    source-text: "From the audit: s32 Public Rights of Way (no trigger given)"
    source-url: https://www.lancashire.gov.uk/media/h5lfrp5b/validation-information-guide-december-2012.pdf
    suggested-id: public-rights-of-way-statement
