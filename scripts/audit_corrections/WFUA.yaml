low-confidence:
  - id: noise-assessment
    note: "Audit (wrong_trigger): the excerpt is cut off before the trigger ('should accompany applications
      for: whether the')."
  - id: transport-assessment
    note: "The excerpt is about the Green Travel Plan and gives no Transport Assessment threshold; re-read the
      list."
