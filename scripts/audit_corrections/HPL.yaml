# Corrections for Hartlepool Borough Council, from inputs/audit/hartlepool-borough-council.json.
# The audit read Hartlepool's 'Local Validation Requirements' Appendix 1 (Updated December 2025,
# with a February 2026 typo correction to the HIA requirements; the file title still says August
# 2025). Appendix 2 has checklists for Full, Outline/Reserved Matters, Listed Building /
# Conservation Area Consent, Advertisement and Householder applications, so local items apply
# beyond Full planning. Grokbot's 'Full planning' (INFERRED) guesses carry no type; triggers the
# audit quotes are used below, and fragments or text from the wrong section are dropped or
# flagged.
local-authority: HPL

submission-standards:
  - item: "'Do not scale' removed from drawings and replaced with wording allowing the LPA to scale
    from the drawing"
    level: must
  - item: Plans provided at the paper size and scale indicated on the plan (e.g. a plan stating
      1:200 @A3 provided at A3)
    level: must

drop:
  - id: design-and-access-statement
    reason: >-
      wrong_trigger: the excerpt is a contents-page fragment ('Design and Access Statement (where
      required) …'); the national rules for a Design and Access Statement still apply

drop-unmapped:
  - local-name: Agricultural / rural workers' dwelling appraisal
    reason: "wrong_trigger / duplicate: reuses the Agricultural Land Classification trigger"
  - local-name: Employment / Economic Statement
    reason: "not_a_requirement: optional and 'not be required for validation purposes'"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: encouragement to seek pre-application advice"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: the excerpt is sustainability text ('natural ventilation… green infrastructure')"
  - local-name: Sequential / Exception Test (flood)
    reason: "wrong_trigger: 'a robust sequential test' comes from the Town Centre Uses section, not flood risk"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: self-build principal-residence text; re-added below with the s25 trigger"
  - local-name: Landscape and Visual Impact Assessment
    reason: "wrong_trigger: the excerpt inverts the source ('… is not necessary'); re-added below"
  - local-name: Nutrient Neutrality statement / calculator
    reason: "wrong_trigger: only the calculator sentence; re-added below with the in-scope uses"
  - local-name: Minerals / Waste specific statements (county matters)
    reason: "the Waste Audit for major development; now the waste-management-plan requirement"

requirements:
  - id: air-quality-assessment
    action: replace
    required-if:
      any:
        - all:
            - site:
                in: [air-quality-management-area]
                description: The site is in an Air Quality Management Area.
            - condition:
                field: traffic-aadt-increase
                operator: ">="
                value: 5
                description: The development would lead to a minimum 5% increase in traffic within
                  the AQMA.
        - condition:
            field: biomass-or-chp
            value: true
            description: The proposal includes biomass boilers or CHP plant.
    source-text: Where a development would lead to a minimum 5% increase in traffic within an Air
      Quality Management Area (AQMA)
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook gave contact details. From the audit: s9 also covers biomass
      boilers or CHP plant."

  - id: archaeological-assessment
    action: replace
    required-if:
      any:
        - site:
            in: [listed-building, listed-building-setting, conservation-area, scheduled-monument,
              park-and-garden, locally-listed-building, archaeological-priority-area]
            description: The application may affect the significance of a heritage asset, including
              its setting.
        - discretionary
    source-text: Planning applications that may affect the significance of any heritage asset,
      including its setting
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    must-include:
      - item: Desk Based Assessment and, if required, Archaeological Evaluation and/or Archaeological
          Building Assessment
        level: must
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook gave a fragment. Non-designated assets are shown as
      officer discretion. Appendix 2 lists archaeology for householder, full, outline/RM and
      LBC/CAC applications.

  - id: arboriculturist-report
    action: update
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: There are trees on or close to the development that may be affected.
    notes: "Appendix 2 lists the tree survey for householder, full, outline/RM and LBC/CAC applications (audit)."

  - id: environmental-statement
    action: replace
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    confidence: low
    notes: "Audit (wrong_trigger): the workbook's excerpt ('of an Environmental Impact Assessment is not necessary.')
      was a fragment; the EIA Regulations' own test is used."

  - id: fire-statement
    action: replace
    required-if:
      all:
        - any:
            - condition:
                field: dwelling-count
                operator: ">="
                value: 2
                description: The building contains two or more dwellings.
            - condition:
                field: educational-accommodation
                value: true
                description: The building contains educational accommodation.
        - any:
            - condition:
                field: building-height
                operator: ">="
                value: 18
                description: The building is 18m or more in height.
            - condition:
                field: storey-count
                operator: ">="
                value: 7
                description: The building has 7 or more storeys.
    source-text: Contain two or more dwelling or educational accommodation; and Meet the height
      condition of 18m or more in height, or 7 or more storeys.
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook's excerpt was a contents-page fragment (s13 trigger used)."

  - id: flood-risk-assessment
    action: replace
    required-if:
      site:
        in: [flood-risk-zone, critical-drainage-area]
        description: Development in Flood Zone 2 or 3, or in the council's own identified critical
          drainage area.
    source-text: Development within a local authority's own identified critical drainage area, Flood
      Zones 2 & 3
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    confidence: medium
    notes: >-
      Audit (wrong_trigger, wrong_app_type): s14; the workbook's excerpt had no location or size
      condition. It names residential extensions under 250 sqm in Flood Zones 2/3 or a critical
      drainage area, so it applies to householder applications too.

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc, demolition-con-area]
        - discretionary
    source-text: "Listed Building Consent applications;"
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    confidence: medium
    notes: >-
      Audit (wrong_trigger, wrong_app_type): s16 requires a Heritage Statement for all Listed
      Building Consent applications; conservation-area demolition also triggers one, and the
      Advertisement checklist lists it. The other s16 triggers aren't quoted by the audit, so they
      are shown as officer discretion.

  - id: landscaping-plan
    action: replace
    required-if:
      all:
        - application-type:
            in: [hh, full, outline, reserved-matters]
        - discretionary
    source-text: >-
      Landscaping Details When is this required? Planning applications (except those for the change
      of use or alteration to an existing building), where landscaping would be a significant
      consideration in the assessment of the application.
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    confidence: medium
    notes: >-
      Audit (wrong_app_type): not prior approval; the source excludes changes of use and applies it
      to Full and Householder applications (Appendix 2 also lists it for LBC/CAC). 'Where landscaping
      would be a significant consideration' is a judgement.

  - id: lighting-assessment
    action: update
    required-if: discretionary
    notes: "'Applications that raise issues of disturbance, or are considered to be light sensitive developments'
      is a judgement. Appendix 2 lists it for advertisement applications too (audit)."

  - id: noise-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: noise-generating-use
            value: true
            description: The application raises issues of disturbance.
        - condition:
            field: noise-sensitive-use
            value: true
            description: The proposal is a noise sensitive development.
    source-text: applications that raise issues of disturbance, or are considered to be noise
      sensitive developments
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    confidence: medium
    notes: "Audit (wrong_trigger): s22; the workbook quoted kitchen extraction text."

  - id: planning-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [full, outline, reserved-matters]
        - all:
            - application-type:
                in: [lbc, demolition-con-area, advertising]
            - discretionary
    source-text: >-
      A Planning Statement is required for all Major and Non-Major planning applications (except
      those for trees and householder applications) including small dwelling sites, changes of use,
      proposals in sensitive locations (for example beyond the development limits) to assist in
      allowing the applicant to explain/justify the proposals in further detail.
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    confidence: medium
    notes: >-
      Audit (wrong_app_type): householder applications are excluded. Appendix 2 lists the planning
      statement as a conditional item on the LBC/CAC and Advertisement checklists.

  - id: recreation-facilities-assessment
    action: update
    required-if:
      site:
        in: [open-space]
        description: Development on existing open space.

  - id: roof-plan-existing
    action: update
    required-if:
      any:
        - condition:
            field: roof-alteration
            value: true
            description: There is an alteration to an existing roof.
        - discretionary
  - id: roof-plan-proposed
    action: update
    required-if:
      any:
        - condition:
            field: roof-alteration
            value: true
            description: There is an alteration to an existing roof.
        - discretionary

  - id: sci
    action: update
    required-if:
      all:
        - ref: major-development
        - discretionary
    notes: "Required for some major applications, as advised at pre-application stage."

  - id: site-plan
    action: update
    must-include:
      - item: Both existing and proposed site or block plans
        level: should
      - item: A standard metric scale (typically 1:200 or 1:500), based on an up-to-date map
        level: should
      - item: The direction of north
        level: must
    notes: "Must-include items from the council's drawing standards ('All applications should include existing
      and proposed site or block plans …')."

  - id: sustainability-statement
    action: update
    required-if:
      any:
        - ref: major-development
        - discretionary
    notes: "All major applications, and where appropriate other types (section 26)."

  - id: telecommunications-report
    action: update
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: Mast and antenna development by mobile phone network operators.
    notes: "Audit (wrong_app_type): not a general Full planning item."

  - id: town-centre-impact-assessment
    action: replace
    required-if:
      all:
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Retail, leisure or office development not in the Town Centre or a local
              centre.
        - condition:
            field: town-centre-use-floorspace
            operator: ">="
            value: 200
            description: A floor area of 200 square metres or more.
    source-text: retail, leisure and office development with a floor area of 200m² or above, not
      located in the Town Centre or a local centre
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    confidence: medium
    notes: >-
      Audit (wrong_trigger): s31 impact assessment; over 300 sqm applies in local centres. The
      sequential test (main town centre uses outside designated centres, 300 sqm+ in local
      centres, and edge-of-centre uses under 250 sqm) is recorded as unmapped.

  - id: waste-management-plan
    action: replace
    required-if:
      ref: major-development
    source-text: >-
      Waste Audit When is this required? Applications for major development as defined in article 2
      of the Town and Country Planning (Development Management Procedure (England) Order 2015;
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the workbook's Waste row quoted a transport servicing-plan bullet. The
      Waste Audit (filed by Grokbot as a minerals/waste statement) is used instead.

unmapped:
  - local-name: Planning Obligations / S106 draft Heads of Terms
    source-text: "where the local authority have indicated at pre-application stage that a Section 106 agreement
      would be necessary"
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    suggested-id: heads-of-terms
  - local-name: Landscape and Visual Impact Assessment
    source-text: "From the audit: s20, needed where location is a significant consideration"
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    suggested-id: landscape-visual-impact-assessment
  - local-name: Residential Visual Amenity Assessment
    source-text: "developments such as solar farms, on shore wind proposals and other large scale developments"
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    suggested-id: residential-visual-amenity-assessment
  - local-name: Nutrient Neutrality assessment
    source-text: "A Nutrient Neutrality assessment should be prepared by a competent person, with the relevant
      experience for applications that are likely to increase the input of nitrate and/or phosphate into
      the River Tees catchment area. … New dwellings, student accommodation, care homes, tourism attractions
      and tourist accommodation"
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    suggested-id: nutrient-neutrality-statement
  - local-name: Sequential test (main town centre uses)
    source-text: "Proposals for main town centre uses, within an edge of centre or retail and leisure parks,
      with a floor area of below 250m2 Will be required to provide a robust sequential test"
    source-url: https://www.hartlepool.gov.uk/downloads/file/356/local-validation-requirements-august-2025-appendix-1
    suggested-id: retail-sequential-test

low-confidence:
  - id: biodiversity-survey-report
    note: >-
      Audit (wrong_trigger): the excerpt is cut off at 'unless an exception applies: 23', so the
      list of triggers is missing. Appendix 2 lists the ecological survey for householder, full and
      outline/RM applications.
  - id: bng-metric
    note: "Audit (wrong_trigger): the excerpt is a contents-page fragment and doesn't say when BNG applies
      (see section 12)."
  - id: schedule-of-works
    note: "Audit (wrong_app_type): a listed building schedule of works is not a general Full planning item;
      the excerpt gives no trigger."
