low-confidence:
  - id: cil-form
    note: "Audit (wrong_trigger): the workbook's excerpt is a fragment ('of the Community Infrastructure
      Levy Regulations 2010.'); the trigger needs checking."
  - id: photos
    note: "The advert row (details of the advertisements and their locations) is from the advert-only
      checklist; the site-condition photographs are an ecology/BNG item. Check which application types
      each applies to."

