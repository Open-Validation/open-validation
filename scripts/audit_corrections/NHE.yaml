# Corrections for North Hertfordshire District Council, from the council's audit.
# The workbook links the current validation matrix (April 2026), but Grokbot captured only three
# web-page fragments from the 'Submit a planning application' page. The audit lists the matrix's
# 22 local requirements and the local items in Validation checklist V11 (March 2025). The audit
# names the matrix columns (Householder, listed buildings, conservation area, residential 1-9 /
# 10+ / 50+, commercial, infrastructure, EIA, telecoms) but not which column each item falls in,
# so items without a stated trigger are added with no trigger and confidence low ("Check").
local-authority: NHE

drop-unmapped:
  - local-name: Self-build / custom build information
    reason: >-
      wrong_trigger: the excerpt is link text for the Self Build and Custom Build BNG exemption
      form run into the Design and Access Statement text; recorded below as BNG exemption
      justification

requirements:
  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - all:
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The proposal provides one or more dwellinghouses.
            - site:
                in: [conservation-area, world-heritage-site]
                description: Any part of the development is in a designated area (a conservation
                  area or World Heritage Site).
    source-text: >-
      Design and access statements Design and Access Statements are required for: major
      developments the provision of one or more dwellinghouses where any part of the development is
      in a designated area, i.e.
    source-url: https://www.north-herts.gov.uk/submit-planning-application
    confidence: medium
    notes: >-
      Audit (wrong_trigger): the excerpt started with a file size and is cut off at 'designated
      area, i.e.'. 'Designated area' is read as the national definition (conservation area or
      World Heritage Site); the rest of the council's list of cases is not captured.

  - id: bng-metric
    action: replace
    required-if:
      any:
        - ref: major-development
        - condition:
            field: minor-development
            value: true
            description: The proposal is minor development.
    source-url: https://www.north-herts.gov.uk/submit-planning-application
    must-include:
      - item: The statutory biodiversity metric in Excel format
        level: must
      - item: The statutory biodiversity metric in PDF format
        level: must
    confidence: medium
    notes: >-
      Audit (wrong_app_type, missing_requirement): the workbook filed BNG under Full planning as
      'INFERRED' and quoted web-page text. From the audit: Validation checklist V11 asks for the
      statutory BNG metric for major or minor development, in Excel and PDF; the matrix also lists
      a Statutory Biodiversity Metric (item 20).

  - id: site-plan
    action: add
    required-if:
      always: true
    source-text: 1:500 block plan ... All applications
    source-url: https://www.north-herts.gov.uk/submit-planning-application
    must-include:
      - item: Scale 1:500
        level: must
      - item: Window positions
        level: must
      - item: Trees
        level: must
      - item: Materials
        level: must
      - item: Access and parking
        level: must
      - item: Boundary treatment
        level: must
      - item: Street scene
        level: must
    confidence: medium
    notes: >-
      From the audit (missing_requirement): Validation checklist V11 asks for a 1:500 block plan
      showing window positions, trees, materials, access/parking, boundary treatment and street
      scene, for all applications. The items are the audit's summary.

  - id: roof-plan-existing
    action: add
    required-if:
      always: true
    source-text: Roof plan - existing and proposed
    source-url: https://www.north-herts.gov.uk/submit-planning-application
    confidence: medium
    notes: "From the audit (missing_requirement): Validation checklist V11 asks for existing and proposed roof
      plans for all applications."

  - id: roof-plan-proposed
    action: add
    required-if:
      always: true
    source-text: Roof plan - existing and proposed
    source-url: https://www.north-herts.gov.uk/submit-planning-application
    confidence: medium
    notes: "From the audit (missing_requirement): Validation checklist V11 asks for existing and proposed roof
      plans for all applications."

  - id: affordable-housing-statement
    action: add
    required-if:
      condition:
        field: dwelling-count
        operator: ">="
        value: 20
        description: The proposal creates 20 or more dwellings.
    source-url:
      https://www.north-herts.gov.uk/sites/default/files/2026-04/Matrix%20North%20Herts%20Council%20validation%20requirements%20April%202026%282%29.pdf
