    confidence: low
    notes: "Audit (wrong_app_type): a county list, so moved from Full planning to minerals, waste and
      Regulation 3. Audit (wrong_trigger): the excerpt is a fragment."

  - id: daylight-sunlight-assessment
    action: update
    required-if:
      application-type:
        in: [mineral-app, waste-dev, reg-3]
    confidence: low
    notes: "Audit (wrong_app_type): a county list, so moved from Full planning to minerals, waste and
      Regulation 3. Audit (wrong_trigger): the excerpt is a fragment ('no undue overshadowing to the waterway.')."

  - id: flood-risk-assessment
    action: update
    required-if:
      application-type:
        in: [mineral-app, waste-dev, reg-3]
    confidence: low
    notes: "Audit (wrong_app_type): a county list, so moved from Full planning to minerals, waste and
      Regulation 3. The excerpt says only that all developments must consider flood risk in line with PPG."

  - id: recreation-facilities-assessment
    action: update
    required-if:
      application-type:
        in: [mineral-app, waste-dev, reg-3]
    confidence: low
    notes: "Audit (wrong_app_type): a county list, so moved from Full planning to minerals, waste and
      Regulation 3. Audit (wrong_trigger): the excerpt is a fragment."

  - id: design-and-access-statement
    action: update
    required-if:
      application-type:
        in: [mineral-app, waste-dev, reg-3]
    confidence: low
    notes: "Audit (wrong_app_type): a county list, so moved from Full planning to minerals, waste and
      Regulation 3. Listed in the waste checklist, without a trigger."

  - id: transport-assessment
    action: update
    required-if:
      application-type:
        in: [mineral-app, waste-dev, reg-3]
    confidence: low
    notes: "Audit (wrong_app_type): a county list, so moved from Full planning to minerals, waste and
      Regulation 3. Listed in the waste checklist, without a trigger."

  - id: travel-plan
    action: update
    required-if:
      application-type:
        in: [mineral-app, waste-dev, reg-3]
    confidence: low
    notes: "Audit (wrong_app_type): a county list, so moved from Full planning to minerals, waste and
