  - id: water-impact-assessment
    action: add
    required-if:
      all:
        - application-type:
            in: [mineral-app, waste-dev, reg-3]
        - discretionary
    source-text: "Hydrological or Hydrogeological Assessment Any development: involving materials or
      processes that could result in pollution of the water environment; and"
    source-url: https://www.gloucestershire.gov.uk/media/g4xd5wbh/updated-revised-gcc-local-validation-checklist-incorporating-addendum-bng-requirements-feb-2024.pdf
    confidence: low
    notes: >-
      From the audit (missing_requirement): a Hydrological or Hydrogeological Assessment; the trigger
      is cut off after its first condition, and pollution risk has no field, so it is shown as officer
      judgement. The waste checklist also lists a Water Framework Directive compliance assessment.

