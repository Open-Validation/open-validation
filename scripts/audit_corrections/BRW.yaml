# Corrections for Brentwood Borough Council, from the audit of Brentwood.
# The workbook's link (media/829) is the current list, version December 2024 (an update is being
# prepared). Most of its items apply to 'All applications' meeting a trigger, but the workbook put
# them under Full planning ('INFERRED'); the triggers are structured below and apply to every type that
# meets them, except where the list itself excludes householder applications.
local-authority: BRW

submission-standards:
  - item: Electronic files no larger than 10MB each; larger documents split into smaller files
    level: must
  - item: "Accepted file formats: .pdf .doc .docx .xls .xlsx .rtf .txt .avi .mov .mp4 .mpg .mpeg .wmv .gml
      .plt .bmp .gif .jpg .jpeg .png .tif"
    level: must
  - item: Drawings identify the original paper size and scale (e.g. 1:200 at A3), with a linear scale bar,
      key dimensions, and a drawing number and revision; clearly drawn to a recognised scale
    level: must
  - item: Plans include a North point
    level: must
  - item: Personal information and signatures omitted from the submission (GDPR)
    level: should
  - item: Supporting statements include an executive summary and are clear, easy to read and jargon free
    level: should

drop:
  - id: design-and-access-statement
    reason: "other: national validation boilerplate, not a local requirement"
  - id: environmental-statement
    reason: "other: national boilerplate ('might form part of an Environmental Statement')"

drop-unmapped:
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_app_type / outdated_link: the Householder row is excluded by the source and the Full row
      is from the superseded 2022 list; re-added once below"
  - local-name: Biodiversity Checklist / Questionnaire
    reason: "duplicate: same item as biodiversity-survey-report"
  - local-name: Parking provision / Parking plan
    reason: "wrong_trigger: site plan contents and the Floor Plans requirement (now in floor plans and site
      plan)"
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: a fragment; re-added below with the major development trigger"
  - local-name: Street scene elevations / Contextual drawings
    reason: "wrong_trigger: a fragment ('may be required.'); re-added below"
  - local-name: Structural Survey
    reason: "wrong_trigger: misses the main local trigger; re-added below"

requirements:
  - id: affordable-housing-statement
    action: update
    required-if: discretionary
    must-include:
      - item: The numbers of residential units
        level: must
      - item: The mix of units with numbers of bedrooms
        level: must
      - item: Plans showing the location of units and their number of habitable rooms and/or bedrooms
        level: must
    confidence: medium
    notes: "Needed where local plan policies require affordable housing; covers both the affordable and any
      market housing."

  - id: air-quality-assessment
    action: update
    required-if:
      site:
        in: [air-quality-management-area]
        description: The development is within an Air Quality Management Area.
    confidence: medium
    notes: "Audit (wrong_trigger): the excerpt was a fragment; the actual trigger is development within Air
      Quality Management Areas."

  - id: arboriculturist-report
    action: update
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within or adjacent to the site, including street trees.
    confidence: medium
    notes: "Audit (wrong_trigger): the excerpt was 'British Standard BS5837.'; trigger from the audit."

  - id: biodiversity-survey-report
    action: update
    required-if:
      any:
        - condition:
            field: protected-species
            value: true
            description: A likely impact on a protected species.
        - discretionary
    confidence: medium
    notes: "Also where there is a likely impact on wildlife in general and biodiversity, or on land or a
      building that has not been used for a period of time (officer discretion)."

  - id: flood-risk-assessment
    action: update
    required-if:
      any:
        - site:
            in: [flood-risk-zone]
            description: New development in Flood Zone 2 or 3.
        - condition:
            field: site-area-residential
            operator: ">="
            value: 1
            description: The site is 1 hectare or greater in Flood Zone 1.
        - condition:
            field: site-area-non-residential
            operator: ">="
            value: 1
            description: The site is 1 hectare or greater in Flood Zone 1.
    confidence: medium

  - id: floor-plan-existing
    action: update
    required-if:
      condition:
        field: building-works
        value: true
        description: The proposal creates new or amended floorspace, or alters existing buildings.
    source-text: "Floor Plans – Requirement: All applications, proposing new or amended floorspace and or
      proposals to alter existing buildings Existing and proposed floor plans at a scale of 1:50 or 1:100,
      with written dimensions to show overall size of any new buildings or extensions."
    must-include:
      - item: Scale of 1:50 or 1:100
        level: must
      - item: Written dimensions showing the overall size of any new buildings or extensions
        level: must
    confidence: medium
    notes: "The workbook's floor plan row quoted the invalidity reasons; this text was in its parking row."

  - id: floor-plan-proposed
    action: update
    required-if:
      condition:
        field: building-works
        value: true
        description: The proposal creates new or amended floorspace, or alters existing buildings.
    source-text: "Floor Plans – Requirement: All applications, proposing new or amended floorspace and or
      proposals to alter existing buildings Existing and proposed floor plans at a scale of 1:50 or 1:100,
      with written dimensions to show overall size of any new buildings or extensions."
    must-include:
      - item: Scale of 1:50 or 1:100
        level: must
      - item: Written dimensions showing the overall size of any new buildings or extensions
        level: must
    confidence: medium
    notes: "As floor-plan-existing."

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building, listed-building-setting, conservation-area, locally-listed-building,
              scheduled-monument, park-and-garden]
            description: The application affects heritage assets or their settings.
    source-text: "All applications, affecting heritage assets or their settings"
    source-url: https://www.brentwood.gov.uk/media/829
    confidence: medium
    notes: "Audit (other, wrong_app_type): the workbook recorded it under Listed building consent only."

  - id: land-contamination-assessment
    action: add
    required-if:
      any:
        - all:
            - ref: major-development
            - condition:
                field: previously-developed-land
                value: true
                description: A brownfield site.
        - condition:
            field: eia-development
            value: true
            description: EIA development.
        - site:
            in: [contaminated-land]
            description: Known contamination.
    source-url: https://www.brentwood.gov.uk/media/829
    confidence: medium
    notes: "From the audit (missing_requirement): Contaminated Land Investigation for majors on brownfield
      sites, EIA development, or known contamination."

  - id: lighting-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [full, outline, reserved-matters, s73, change-of-use]
        - condition:
            field: floodlighting
            value: true
            description: The proposal incorporates external flood lighting.
    source-text: "Lighting Assessment – Requirement: All applications, except householder, where it is
      proposed to incorporate external flood lighting"
    source-url: https://www.brentwood.gov.uk/media/829
    must-include:
      - item: Proposed hours when the lighting would be switched on
        level: must
      - item: Layout plan with beam orientation
        level: must
      - item: Schedule of the equipment in the design
        level: must
    confidence: low
    notes: "Audit (wrong_app_type): the workbook placed it under Householder, which the list excludes.
      'Except householder' is shown as a list of application types."

  - id: noise-assessment
    action: add
    required-if:
      condition:
        field: noise-sensitive-use
        value: true
        description: New housing next to major noise sources such as roads, rail and industry.
    source-url: https://www.brentwood.gov.uk/media/829
    confidence: medium
    notes: "From the audit (missing_requirement)."

  - id: planning-statement
    action: add
    required-if:
      application-type:
        in: [s73, non-material-amendment]
    source-url: https://www.brentwood.gov.uk/media/829
    confidence: medium
    notes: "From the audit (missing_requirement): an Amendment Statement for revisions to approved
      applications and variation or removal of conditions."

  - id: roof-plan-existing
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: A roof would be created or altered by the proposed development.
    must-include:
      - item: Scale of 1:100 or 1:200
        level: must
      - item: The shape of the roof
        level: must
    confidence: medium

  - id: roof-plan-proposed
    action: update
    required-if:
      condition:
        field: roof-alteration
        value: true
        description: A roof would be created or altered by the proposed development.
    must-include:
      - item: Scale of 1:100 or 1:200
        level: must
      - item: The shape of the roof
        level: must
      - item: Details of the roofing materials and any features such as chimney positions or windows
        level: must
    confidence: medium

  - id: section-existing
    action: update
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: A change in ground levels, or development next to changing ground levels.
    must-include:
      - item: Existing and proposed site levels and sections at a scale of 1:50 or 1:100
        level: must
    confidence: medium

  - id: section-proposed
    action: update
    required-if:
      condition:
        field: change-in-ground-levels
        value: true
        description: A change in ground levels, or development next to changing ground levels.
    must-include:
      - item: Existing and proposed site levels and sections at a scale of 1:50 or 1:100
        level: must
    confidence: medium

  - id: site-plan
    action: update
    source-text: adjacent land, parking layout (existing and proposed if relevant), the extent and type of
      any hard surfacing, the type and height of boundary treatment (e.g., walls, fences etc.)
    must-include:
      - item: Parking layout (existing and proposed if relevant)
        level: must
      - item: The extent and type of any hard surfacing
        level: must
      - item: The type and height of boundary treatment (e.g. walls, fences)
        level: must
    confidence: low
    notes: "The workbook's site plan row quoted the invalidity reasons; these contents were in its parking
      row. The site plan's trigger wasn't captured."

  - id: sustainability-statement
    action: update
    required-if: discretionary
    confidence: low
    notes: "The excerpt is a Renewable Energy Assessment for applications such as air source heat pumps,
      hydropower, solar PV or thermal, biomass and wind turbines; no field fits, so it is shown as officer
      discretion."

  - id: town-centre-impact-assessment
    action: add
    required-if:
      any:
        - condition:
            field: town-centre-use-floorspace
            operator: ">"
            value: 2500
            description: Retail or leisure development over 2,500 square metres.
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Out-of-centre or edge-of-centre town centre uses not in line with the plan.
        - discretionary
    source-url: https://www.brentwood.gov.uk/media/829
    confidence: medium
    notes: "From the audit (missing_requirement): Retail or Leisure Impact Assessment for retail/leisure over
      2,500 sqm, smaller schemes affecting small centres (officer discretion), or out-of-centre and
      edge-of-centre town centre uses not in line with the plan."

  - id: transport-assessment
    action: update
    required-if: discretionary
    confidence: medium
    notes: "The guideline thresholds are in appendix B of Essex County Council's Development Management
      Policies, not in the list; the Highway Authority can ask for a TA if circumstances demand it."

unmapped:
  - local-name: Ventilation / Extraction details (odour)
    source-text: Applications which will incorporate a ventilation/extraction system, with the exception of
      Householder applications Details of the position and design of ventilation and extraction equipment,
      including odour abatement techniques and acoustic noise characteristics, will be required
    source-url: https://www.brentwood.gov.uk/media/829
    suggested-id: ventilation-extraction-details
  - local-name: Sustainable Drainage Systems (SuDS)
    source-text: All major development proposals
    source-url: https://www.brentwood.gov.uk/media/829
    suggested-id: drainage-strategy
  - local-name: Street scene elevations
    source-text: "From the audit: new dwellings or new buildings visible from the highway (existing and
      proposed street scenes at 1:100 or 1:200)"
    source-url: https://www.brentwood.gov.uk/media/829
    suggested-id: street-scene
  - local-name: Structural Survey
    source-text: "Applications involving barn conversions or re-use of existing rural buildings … A structural
      survey will be required in support of an application if the proposal involves substantial
      demolition, reconstruction or alteration."
    source-url: https://www.brentwood.gov.uk/media/829
    suggested-id: structural-survey

low-confidence:
  - id: bng-metric
    note: "Audit (wrong_trigger): the excerpt is a fragment ('of mandatory Biodiversity Net Gain.')."
  - id: cil-form
    note: "Audit (wrong_trigger): the excerpt is about the council becoming a CIL charging authority."
  - id: viability-assessment
    note: "Audit (wrong_trigger): the excerpt is a fragment ('...paid for by the applicant.')."
  - id: elevation-existing
    note: "The excerpt is the list of invalidity reasons. From the audit: elevation plans are a local item
      with a trigger the workbook didn't capture."
  - id: elevation-proposed
    note: "As elevation-existing."
