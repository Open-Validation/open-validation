    suggested-id: refuse-storage-details
  - local-name: Floor Space / Accommodation Schedule
    source-text: "Floor Space/ Accommodation Schedule | Applications for residential use."
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: accommodation-schedule
  - local-name: Legal Documentation (BNG self-build exemption)
    source-text: "Legal Documentation | BNG Self Build Exemption Applications."
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: ""
  - local-name: Self Build Statement
    source-text: "Self Build Statement | Self Build applications"
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: self-build-statement
  - local-name: Marketing Information
    source-text: "Marketing Information | Any development that results in the loss of employment space."
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: marketing-evidence
  - local-name: Material Details & Materials Plan
    source-text: "Material Details & Materials Plan | All applications where new buildings are proposed"
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: materials-details
  - local-name: Renewable Energy Statement
    source-text: "Renewable Energy Statement | Applications for renewable energy production."
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: renewable-energy-statement
  - local-name: Ventilation/Extraction Statement and Design
    source-text: "For any retail, business, industrial, leisure or other developments where ventilation
      or extraction equipment is proposed."
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: ventilation-extraction-details
  - local-name: Building for a Healthy Life Assessment
    source-text: "Building for a Healthy Life Assessment | All major residential applications."
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: building-for-healthy-life
  - local-name: Glint/Glare Assessment
    source-text: "Glint/Glare Assessment | Major development for solar (photovoltaic) panels."
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: glint-glare-assessment
  - local-name: Heads of Terms (S106 Agreements)
    source-text: "Heads of Terms (S106 Agreements) | All major applications"
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: heads-of-terms
  - local-name: Utilities Assessment
    source-text: "Utilities Assessment | All major developments"
    source-url: https://www.ashfield.gov.uk/media/uvofnrse/validation-list-full-and-major-2025.docx
    suggested-id: utilities-statement
  - local-name: Visual Impact Assessment
