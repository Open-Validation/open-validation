# Corrections for Liverpool City Council, from the council's audit.
# The current list is 'Validation guidance and local information requirements for planning
# applications' (validation-checklist-oct-25.pdf), first published 29 April 2024 and last
# updated 24 October 2025. The audit could not fetch the PDF (robots disallowed), so contents
# were not checked. Grokbot also used the council's old per-type form checklists (July/December
# 2013), whose triggers clash with the current list; where the current list's wording is in the
# workbook it is preferred below, and 2013-only rows are flagged.
local-authority: LIV

validation-list:
  date: "2025-10-24"
  date-basis: "council page: 'First published 29/04/2024; last updated 24/10/2025'; the earlier
    2025-10-01 came from PDF metadata"

submission-standards:
  - item: Drawings display a title box stating the drawing title, the nature of the proposed
      development and the site address, with a unique drawing number, a date and the scale
    level: should
  - item: Revised drawings or documents include the word "revision" and the revision date in the
      file name, and a version control table (revision number, date, brief description) on the
      first page or title box
    level: must
  - item: Drawn to a recognised metric scale and printable at 1:100 or 1:50, unless indicated
      otherwise
    level: must
  - item: A scale bar showing at least 0-10 metres; the wording "do not scale" should not be used
    level: must
  - item: All plans include a North point
    level: should
  - item: Files over 20 MB split into smaller components
    level: must

drop:
  - id: schedule-of-works
    reason: "wrong_trigger: the excerpt is item 19 Arboricultural Method Statement (now in arboriculturist-report)"
  - id: photos
    sheets: [Full planning]
    reason: "wrong_trigger: the excerpt is the item 8 BNG text"
  - id: environmental-statement
    sheets: [Full planning]
    reason: "wrong_trigger: the excerpt is daylight/sunlight wording"
  - id: town-centre-impact-assessment
    sheets: [Outline]
    reason: "wrong_document: the 2013 outline checklist's 2,500 sq m threshold contradicts the current 350 sq m"
  - id: waste-management-plan
    sheets: [Minerals & waste (county)]
    reason: "wrong_app_type: a fragment filed under county matters; Liverpool is a unitary authority"

drop-unmapped:
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: 'you seek pre-application advice although you are not required to do so'"
  - local-name: Equality / accessibility statement
    reason: "wrong_app_type: filed under prior approval; re-added below"
  - local-name: Structural Survey
    reason: "wrong_trigger: the fragment 'units (outline and full)'; re-added below with the Structural Report
      trigger"

requirements:
  - id: arboriculturist-report
    action: replace
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: Trees within proximity of the working area of the site (within 15 times the
          stem diameter, or a canopy within the working area).
    source-text: >-
      19 Arboricultural Method Statement Any application where there are trees within proximity of
      the working area of the site, defined as any tree within a distance 15 times the diameter of
      the tree stem (measured at 1.5m height) and/or where any tree canopy is within the working
      area of the site.
    source-url: &list https://liverpool.gov.uk/media/yrwlyaiw/validation-checklist-oct-25.pdf
    confidence: low
    notes: >-
      Audit (wrong_trigger, wrong_document): the workbook's item 17 Tree Survey row carried the
      air-quality criteria, and its other rows came from the 2013 checklists (TPO sites or
      development within 3 metres of a canopy, to BS 5837:2012). The trigger here is item 19,
      Arboricultural Method Statement; item 17's own trigger wasn't captured.

  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building, conservation-area, scheduled-monument, locally-listed-building,
              archaeological-priority-area]
            description: The proposal affects the historic environment, including historical and
              archaeological features, or a Scheduled Ancient Monument.
    source-text: Heritage Statement/National Planning Policy Framework Statement (Para 128) for all
      developments when proposals affect the historic environment, including historical,
      archaeological features and for development affecting a Scheduled Ancient Monument.
    source-url: https://liverpool.gov.uk/media/03qcrbku/outline-with-all-matters-reserved.pdf
    confidence: low
    notes: >-
      Audit (wrong_trigger, wrong_document): the current list's item 35 row carried another item's
      '1000sq.m … 10 or more new dwellings' trigger. The trigger here is from the 2013 outline
      checklist and needs checking against item 35.

  - id: sustainability-statement
    action: replace
    source-url: *list
    confidence: low
    notes: "Audit (wrong_trigger): the workbook's item 60 row carried the Structural Report trigger; the sustainability
      trigger wasn't captured."

  - id: environmental-statement
    action: replace
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.
    source-text: Where EIA is required, an Environmental Statement in the form set out in Schedule 4
      to the regulations must be provided.
    source-url: https://liverpool.gov.uk/media/03qcrbku/outline-with-all-matters-reserved.pdf
    confidence: low
    notes: "Audit (wrong_trigger): the Full planning row carried daylight/sunlight wording and was dropped."

  - id: daylight-sunlight-assessment
    action: replace
    required-if: discretionary
    source-text: adjoining properties or building(s) including associated gardens or amenity space
      or in the vicinity of a river or open space.
    source-url: *list
    confidence: low
    notes: >-
      Audit (wrong_trigger): the workbook's daylight row carried Highways pre-app help text; the
      daylight wording above was filed under the EIA row. It is a fragment, so shown as officer
      discretion.

  - id: air-quality-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: eia-development
            value: true
            description: All development requiring an Environmental Impact Assessment.
        - condition:
            field: parking-spaces
            operator: ">"
            value: 300
            description: New car parking of more than 300 spaces, or coach/lorry parks.
        - discretionary
    source-text: Air Quality Assessment for All development requiring an Environmental Impact
      Assessment All development significantly altering the traffic composition in an area (ie. bus
      stations, HGV Parks etc), All development include proposals for new car parking (>300 spaces)
      or coach/lorry parks.
    source-url: https://liverpool.gov.uk/media/03qcrbku/outline-with-all-matters-reserved.pdf
    confidence: low
    notes: >-
      Audit (wrong_trigger, wrong_document): the current list's row was a fragment; this trigger is
      from the 2013 outline checklist. Development significantly altering traffic composition is
      shown as officer discretion.

  - id: flood-risk-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: near-watercourse
            value: true
            description: Development adjacent to brooks, ditches or canals.
        - site:
            in: [flood-risk-zone]
            description: Development within Flood Zones 2 and 3.
        - condition:
            field: site-area-residential
            operator: ">"
            value: 1
            description: A site of over 1.0 hectare in Flood Zone 1.
        - condition:
            field: site-area-non-residential
            operator: ">"
            value: 1
            description: A site of over 1.0 hectare in Flood Zone 1.
    source-text: Flood Risk Assessment for all development adjacent to brooks, ditches or canals, and
      for all development on sites of over 1.0 hectare within Zone 1 and all development within
      Zones 2 & 3 on the Environment Agency Flood Plain.
    source-url: https://liverpool.gov.uk/media/03qcrbku/outline-with-all-matters-reserved.pdf
    confidence: low
    notes: "Audit (wrong_document): this trigger is from the 2013 checklists; the current list's FRA trigger
      wasn't captured."

  - id: design-and-access-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - application-type:
            in: [lbc]
        - all:
            - site:
                in: [conservation-area, world-heritage-site]
                description: The property is in a Designated Area.
            - condition:
                field: floorspace
                operator: ">"
                value: 100
                description: The floor area to be created would exceed 100 sqm.
    source-text: Design and Access Statement Required for all householder planning applications
      relating to properties in a Designated Area for the provision of a building or buildings where
      the floor area to be created would exceed 100 sqm.
    source-url: https://liverpool.gov.uk/media/mcel4e4y/household-planning-permission.pdf
    confidence: low
    notes: >-
      Audit (wrong_trigger, wrong_document): the current list's row carried the item 8 BNG text. The
      triggers here are from the 2013 householder, outline and listed building checklists (majors
      under the 2010/2012 Order, listed building consent, Designated Areas over 100 sqm).

  - id: bng-metric
    action: update
    source-text: >-
      8 Mandatory Biodiversity Net Gain (BNG) All applications … a statement must be submitted to
      clarify whether the applicant believes that planning permission, if granted, would be subject
      to the biodiversity gain condition.
    must-include:
      - item: A statement of whether the applicant believes the permission would be subject to the
          biodiversity gain condition
        level: must
    confidence: low
    notes: "Audit (wrong_app_type): item 8 applies to all applications, not only Full planning."

  - id: town-centre-impact-assessment
    action: update
    required-if:
      all:
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: Main town centre uses not in an existing centre in accordance with an
              up-to-date plan.
        - condition:
            field: town-centre-use-floorspace
            operator: ">="
            value: 350
            description: 350 sqm or more of main town centre uses.
    confidence: low

  - id: affordable-housing-statement
    action: update
    required-if:
      condition:
        field: dwelling-count
        operator: ">="
        value: 10
        description: 10 or more new dwellings.
    confidence: low
    notes: "Item 15 also covers 10 or more student units, which the rules can't count."

  - id: fire-statement
    action: update
    required-if:
      all:
        - any:
            - condition:
                field: building-height
                operator: ">="
                value: 18
                description: The building is 18.0m or more in height.
            - condition:
                field: storey-count
                operator: ">="
                value: 7
                description: The building has 7 or more storeys.
        - any:
            - condition:
                field: dwelling-count
                operator: ">="
                value: 2
                description: The building contains two or more dwellings.
            - condition:
                field: educational-accommodation
                value: true
                description: The building contains educational accommodation.
    confidence: low

  - id: lighting-assessment
    action: replace
    required-if:
      all:
        - any:
            - condition:
                field: floodlighting
                value: true
                description: Floodlights.
            - condition:
                field: external-lighting
                value: true
                description: Other external lights.
        - discretionary
    source-text: >-
      requirement 40 Lighting Assessment / Lux Contour Diagram Type of application and when required
      Where there are floodlights and other lights that may impact on: - visual or residential
      amenity, or - nature conservation interests on or adjacent to an application site.
    source-url: *list
    must-include:
      - item: Lux contour diagram showing lux levels to adjacent sites
        level: must
    confidence: low
    notes: "The impact on amenity or nature conservation is shown as officer discretion. The lux contour item
      is also in the 2013 checklists."

  - id: landscaping-plan
    action: replace
    required-if:
      any:
        - all:
            - condition:
                field: new-build
                value: true
                description: New build residential development.
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The development is residential.
        - discretionary
    source-text: >-
      39 Landscaping Scheme Required prior to determination (Unless a Reserved Matter as part of an
      Outline application) for all new build residential development, developments that include
      external amenity space/public realm, and any schemes resulting in tree loss to be mitigated
      on site.
    source-url: *list
    confidence: low
    notes: >-
      From the current list (item 39). External amenity space / public realm and on-site
      mitigation of tree loss are shown as officer discretion. The 2013 checklists asked for a
      1:200 plan showing size, species, density and position of trees and all hardstanding/parking.

  - id: sci
    action: update
    required-if: &major-local
      any:
        - condition:
            field: floorspace
            operator: ">="
            value: 1000
            description: 1000 sq m of floorspace.
        - condition:
            field: dwelling-count
            operator: ">="
            value: 10
            description: 10 or more new dwellings (or 10 or more student units).
    confidence: low
    notes: "The council's wording is '1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more student
      units'; read here as alternatives, which needs checking."

  - id: travel-plan
    action: update
    required-if: *major-local
    confidence: low
    notes: "The council's wording is '1000sq.m. of floorspace and 10 or more new dwellings, or 10 or more student
      units (outline and full)'; read here as alternatives, which needs checking."

  - id: telecommunications-report
    action: update
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: Mast and antenna development by mobile phone network operators.
    must-include:
      - item: The area of search
        level: must
      - item: Details of any consultation undertaken
        level: must
      - item: Details of the proposed structure
        level: must
      - item: Technical justification and information about the proposed development
        level: must
    confidence: low

  - id: roof-plan-existing
    action: update
    required-if: &building-works
      condition:
        field: building-works
        value: true
        description: All applications, including Lawful Development Certificate applications, that
          involve building works.
    confidence: low

  - id: roof-plan-proposed
    action: update
    required-if: *building-works
    confidence: low

  - id: floor-plan-existing
    action: update
    required-if: *building-works
    confidence: low

  - id: floor-plan-proposed
    action: update
    required-if: *building-works
    confidence: low

  - id: land-contamination-assessment
    action: update
    required-if:
      any:
        - condition:
            field: eia-development
            value: true
            description: Applications subject to Environmental Assessment.
        - site:
            in: [contaminated-land]
            description: Sites where contamination is known to exist.
        - condition:
            field: sensitive-end-use
            value: true
            description: Development particularly vulnerable to the effects of contamination.
    confidence: low
    notes: "Audit (wrong_document): this trigger is from the 2013 outline checklist."

  - id: archaeological-assessment
    action: update
    required-if:
      all:
        - condition:
            field: ground-disturbance
            value: true
            description: New building or ground disturbance.
        - site:
            in: [archaeological-priority-area]
            description: On or adjoining a site of archaeological interest.
    confidence: low
    notes: "Audit (wrong_document): this trigger is from the 2013 checklists."

unmapped:
  - local-name: Accessibility Statement
    source-text: "13 Accessibility Statement Type of application and when required All applications that involve
      the creation of any new residential accommodation, including new build, change of use and conversions."
    source-url: *list
    suggested-id: accessibility-statement
  - local-name: Structural Report
    source-text: "substantial demolition of a nondesignated heritage asset, where planning permission is required.
      (From the audit: this is item 59's trigger, found in the Sustainability Statement row)"
    source-url: *list
    suggested-id: structural-survey
  - local-name: External Wall Construction Report
    source-text: "From the audit: item 30 in the current list; its trigger wasn't captured (only a fragment in the
      Employment row)"
    source-url: *list
    suggested-id: ""
  - local-name: Habitats Regulations Assessment
    source-text: "Developments within or adjacent to the Mersey Estuary SPA and Ramsar sites may require HRA or any
      site that has potential to disturb qualifying bird species e.g., sites that are close to dock waters
      or intertidal areas."
    source-url: *list
    suggested-id: habitats-regulations-assessment

low-confidence:
  - id: site-plan
    note: "Audit (wrong_document): every site plan row comes from the 2013 per-type checklists."
  - id: photos
    note: "Audit (wrong_document): the remaining rows come from the 2013 listed building and tree works forms."
  - id: waste-management-plan
    note: "Audit (wrong_document, missing_requirement): the rows use 2013 checklist wording; the current list's
      item 54 Refuse and Recycling Management wasn't captured."
  - id: transport-assessment
    note: "Audit (wrong_trigger, wrong_document): the current list's row is a fragment ('see also Transport Assessment;');
      the other row cites the old Ensuring a Choice of Travel SPD."
  - id: elevation-existing
    note: "Audit (wrong_document): most elevation rows come from the 2013 per-type checklists."
  - id: elevation-proposed
    note: "Audit (wrong_document): most elevation rows come from the 2013 per-type checklists."
