low-confidence:
  - id: land-contamination-assessment
    note: "Audit (wrong_trigger): the excerpt is HIA and policy text; the trigger wasn't captured."
  - id: section-existing
    note: "Audit (wrong_trigger): the excerpt is lighting text, not a sections requirement."
  - id: section-proposed
    note: "Audit (wrong_trigger): the excerpt is lighting text, not a sections requirement."
  - id: waste-management-plan
    note: "Audit (wrong_trigger): the excerpt is use-class floorspace text; the Outline Site Waste Management
      Plan (item 31) trigger wasn't given."
  - id: noise-assessment
    note: "Audit (wrong_trigger): the excerpt is only the air source heat pump MCS 020 exemption."
  - id: archaeological-assessment
    note: "Audit (wrong_trigger): the excerpt is only a heading ('Archaeological Assessment WHAT IS REQUIRED
      1.')."
  - id: affordable-housing-statement
    note: "The excerpt is cut off ('gross, the Affordable Housing Statement should include, as a minimum:
      1.') and gives no threshold."
  - id: flood-risk-assessment
    note: "The excerpt is a run of policy references with no trigger; the householder quick guide mentions
      an FRA declaration form."
  - id: transport-assessment
    note: "The thresholds are in the checklist's Appendix 2, which wasn't captured."
  - id: travel-plan
    note: "The thresholds are in the checklist's Appendix 2, which wasn't captured."
  - id: site-plan
    note: "Audit (not_a_requirement): the excerpt ('In some cases, an annotated Site Plan and accompanying
      paragraph can meet this requirement.') is an advisory fragment."
  - id: biodiversity-survey-report
    note: "The excerpt is a run of policy references with no trigger."

