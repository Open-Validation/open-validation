# Corrections for London Borough of Richmond upon Thames, from inputs/audit/london-borough-of-richmond-upon-thames.json.
# The audit checked the Local Validation Checklist for All Applications, Version 1, in effect from
# 20 February 2026 (83 items). Grokbot captured about 40 rows, almost all guessed into Full
# planning, and many excerpts belong to other items. Items marked "From the audit" use the
# audit's paraphrase of the checklist (item numbers in brackets), not the council's exact words.
local-authority: RIC

validation-list:
  url: 
    https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
  date: 2026-02-20
  date-basis: "audit: Version 1, agreed for adoption 19 February 2026, in effect from 20 February 2026"

submission-standards:
  - item: Documents in PDF format, unless the checklist accepts another format (e.g. Excel 
      proformas)
    level: must
  - item: Individual files kept under 10MB; large files broken into numbered sections
    level: should
  - item: No .EXE files and no ZIP utilities
    level: must
  - item: Drawings to a recognised scale (no "Do Not Scale" notes), showing North and key metric 
      dimensions (width, height, length)
    level: must
  - item: Drawing titles, numbers and a full drawing list; revised drawings keep the same numbers, 
      with updated title blocks
    level: should

drop:
  - id: schedule-of-works
    reason: "wrong_trigger: the excerpt is 'draft Arboricultural Method Statement (AMS) must be submitted'
      (now in arboriculturist-report)"
  - id: photos
    reason: "not_a_requirement: advice that photographs and CGI are useful but must not replace scaled
      drawings"
  - id: sustainability-statement
    sheets: [Change of use - prior approval]
    reason: "wrong_app_type: item 49 Energy Statement applies to planning applications, not prior approvals
      (re-added below)"
  - id: landscaping-plan
    sheets: [Outline]
    reason: "wrong_app_type: 'A full landscaping scheme is not required for outline applications' is an
      exemption (re-added below)"

drop-unmapped:
  - local-name: Sunlight to gardens/amenity space / outdoor amenity
    reason: "wrong_trigger: the excerpt is basement cross-section text"
  - local-name: Character / Conservation area appraisal reference
    reason: "not_a_requirement: a cross-reference to the Conservation Area Appraisals inside another item"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: a content fragment ('Must be bespoke and, where relevant, informed by
      any pre-application advice')"
  - local-name: Health Impact Assessment
    reason: "wrong_trigger: the excerpt is the Takeaway Statement's 400m school buffer text; both re-added
      below"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: the excerpt is the Air Quality Neutral text (now in air-quality-assessment)"
  - local-name: Advertisement drawings / illumination details
    reason: "wrong_app_type: item 22 applies to advertisement consent; re-added below"

requirements:
  - id: air-quality-assessment
    action: add
    required-if:
      ref: major-development
    source-text: "Developers of all major developments will need to commission an AQN assessment and this
      should be included within the AQA."
    source-url: 
      https://www.richmond.gov.uk/media/18491/local_validation_checklist_for_all_applications.pdf
    policy: Local Plan Policy 19, Policy 53
    must-include:
      - item: Air Quality Neutral assessment
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): items 74 to 76, Air Quality Assessment, Air Quality
      Neutral and Air Quality Positive (major / EIA major). The council's wording was in the workbook's
      ventilation row."

  - id: daylight-sunlight-assessment
    action: add
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-url: 
      https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): item 77, major development or where light could be affected."

  - id: sci
    action: add
    required-if:
      ref: major-development
    source-text: "The SCI must report factually on the engagement approach and outcomes, including information
      as set out at section 6.5 of Raising the Bar guidance."
    source-url: 
      https://www.richmond.gov.uk/media/18491/local_validation_checklist_for_all_applications.pdf
    must-include:
      - item: The engagement approach and outcomes, including the information in section 6.5 of the 
          Raising the Bar guidance
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): item 11, Statement of Community Involvement for major
      development. The council's wording was in the workbook's Planning Statement row."

  - id: energy-statement
    action: add
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: New residential (1+ units), including by change of use.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 100
            description: Non-residential new build or extensions over 100 sqm.
    source-text: "New residential (1+ units); non-residential new build or extensions over 100 sqm"
    source-url: 
      https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): item 49, Energy Statement setting out the proposed Energy Strategy;
      the workbook placed it under prior approval."

  - id: sustainability-statement
    action: replace
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: One or more new dwellings.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 100
            description: Non-residential floorspace over 100 sqm.
    source-url: 
      https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): item 48, Sustainable Construction Checklist (1+ new
      dwellings; non-residential over 100 sqm). The workbook's prior approval row was the Energy Statement
      (now energy-statement)."

  - id: town-centre-impact-assessment
    action: add
    required-if:
      all:
        - condition:
            field: out-of-centre-town-centre-use
            value: true
            description: A town centre use outside a centre.
        - condition:
            field: floorspace-non-residential
            operator: ">"
            value: 500
            description: Over 500 sqm.
    source-url: 
      https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): items 46/47, Town Centre Uses Sequential Test and Retail-Leisure
      Impact Assessment (over 500 sqm outside centres)."

  - id: telecommunications-report
    action: add
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: All telecommunications development, including Part 16 GPDO prior approvals.
    source-text: "All telecommunications development, including permitted development and prior-approval
      applications under Part 16 of the GPDO 2015"
    source-url: 
      https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
    confidence: medium
    notes: "Audit (missing_requirement, wrong_app_type): item 83 Telecommunications Statement."

  - id: landscaping-plan
    action: add
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-url: 
      https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): item 61, Landscaping Scheme for major development and
      minor development with significant landscaping (shown as officer discretion). 'A full landscaping
      scheme is not required for outline applications.'"

  - id: fire-statement
    action: replace
    required-if:
      ref: major-development
    source-text: "Fire Statement - Major"
    source-url: 
      https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
    confidence: medium
    notes: "Audit (wrong_trigger): the workbook merged item 32 (Fire Safety Strategy or Reasonable Exception
      Statement, all development; now an unmapped item) with item 33 (Fire Statement, major only)."

  - id: planning-statement
    action: replace
    required-if:
      any:
        - ref: major-development
        - discretionary
    source-text: "Major (encouraged for other development)"
    source-url: 
      https://www.richmond.gov.uk/media/nkwku4in/local_validation_checklist_for_all_applications.pdf
    confidence: medium
    notes: "Audit (wrong_trigger, wrong_app_type): item 10; the workbook's excerpt was SCI text (now in
      sci)."

  - id: heritage-statement
    action: replace
    required-if:
      site:
        in: [listed-building, conservation-area, world-heritage-site, park-and-garden, 
              scheduled-monument]
        description: The proposal affects a listed building, conservation area, World Heritage Site,
          registered park and garden or scheduled monument.
    source-text: >-
      Heritage Statements … THRESHOLD WHAT IS REQUIRED Listed Buildings Conservation Areas World
      Heritage Sites Registered Parks and Gardens Scheduled Monuments
    source-url: 
      https://www.richmond.gov.uk/media/18491/local_validation_checklist_for_all_applications.pdf
    confidence: medium
    notes: "Audit (wrong_app_type): the workbook placed it under listed building consent only; the householder
      quick guide includes heritage, so it applies to the heritage assets listed whatever the application
      type."

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: The LPA determines, through EIA screening, that the development needs an 
          Environmental Statement.
    confidence: medium
    notes: "The excerpt: 'the Local Planning Authority (LPA) will determine whether a proposed development
      requires an Environmental Statement under the terms of the EIA Regulations 2017.'"

  - id: arboriculturist-report
    action: update
    must-include:
      - item: Tree Protection Plan, where required
        level: must
      - item: Draft Arboricultural Method Statement (AMS)
        level: must
        source-text: "draft Arboricultural Method Statement (AMS) must be submitted at the planning stage."
    confidence: low
    notes: "Audit (missing_requirement, claude_response): items 63/64 (Tree Protection Plan and AMS) are
      partly captured here and in the row the workbook mislabelled 'Schedule of works'. The trigger wasn't
      captured; the householder quick guide includes AIA/TPP/AMS."

  - id: lighting-assessment
    action: update
    required-if:
      any:
        - condition:
            field: external-lighting
            value: true
            description: The proposal includes external lighting.
        - condition:
            field: illuminated
            value: true
            description: An advertisement with external lighting.
    confidence: low
    notes: "Audit (wrong_app_type): item 71 Lighting Assessment covers adverts with external lighting.
      The workbook's excerpt is the lighting detail for advertisement drawings (item 22; now an unmapped
      item), so the full item 71 trigger needs checking."

