# Corrections for Braintree District Council, from the council's audit.
# Braintree publishes its local list as an online 'Planning validation requirements' directory
# (no PDF), one page per application category, last updated February 2020 according to the
# council. Grokbot recorded the link as unreadable and captured no rows, so everything below
# comes from the audit's summary of the Householder (directory-record/6425) and Residential new
# build (directory-record/6475) pages. The audit says the other 20 category pages (listed
# building consent, adverts, prior approvals, commercial, change of use, conversions, PiP,
# discharge of conditions, TDC) were not captured either: their requirements are still missing.
local-authority: BRA

requirements:
  - id: biodiversity-survey-report
    action: add
    required-if:
      any:
        - application-type:
            in: [full, outline]
        - site:
            in: [site-of-special-scientific-interest, local-wildlife-site, priority-habitat]
            description: The site is in or within 100m of an SSSI, nature reserve, local wildlife
              site or priority habitat, or in an SSSI Impact Risk Zone.
        - condition:
            field: protected-species
            value: true
            description: Protected species may be affected.
        - discretionary
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: low
    notes: >-
      From the audit (missing_requirement): a Biodiversity checklist for householder works where
      the site is in an Impact Risk Zone, in an SSSI, within 100m of a nature reserve, local
      wildlife site or priority habitat, triggers RAMS, affects protected species, or involves
      works to buildings; and a Biodiversity pro forma always for residential new build. Full and
      outline stand in for Braintree's 'Residential new build' category; 'works to buildings' and
      the RAMS case are shown as officer discretion.

  - id: arboriculturist-report
    action: add
    required-if:
      site:
        in: [tree-preservation-zone]
        description: The proposal involves works to protected trees.
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: medium
    notes: "From the audit (missing_requirement): a Tree assessment for householder works to protected
      trees."

  - id: section-proposed
    action: add
    required-if:
      site:
        in: [listed-building]
        description: The proposal creates upper-floor accommodation in, or puts signage on, a listed
          building.
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: low
    notes: >-
      From the audit (missing_requirement): Listed building section drawings where the proposal
      involves upper-floor accommodation or signage on a listed building. The rules can't express
      the upper-floor or signage part, so only the listed building is shown.

  - id: affordable-housing-statement
    action: add
    required-if:
      all:
        - ref: major-development
        - condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: The proposal includes housing.
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: medium
    notes: "From the audit (missing_requirement): an Affordable housing statement for residential majors."

  - id: sci
    action: add
    required-if:
      ref: major-development
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: medium
    notes: "From the audit (missing_requirement): a Statement of community involvement for all majors."

  - id: waste-management-plan
    action: add
    required-if:
      condition:
        field: dwelling-count
        operator: ">="
        value: 1
        description: The proposal creates one or more new dwellings.
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: medium
    notes: "From the audit (missing_requirement): a Refuse strategy for all new dwellings."

  - id: land-contamination-assessment
    action: add
    required-if:
      condition:
        field: sensitive-end-use
        value: true
        description: The proposal introduces a sensitive end use.
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: medium
    notes: "From the audit (missing_requirement): a Contamination risk assessment for sensitive end uses."

  - id: viability-assessment
    action: add
    required-if:
      any:
        - all:
            - condition:
                field: loss-of-use
                value: true
                description: The proposal involves the loss of rural commercial premises.
            - site:
                in: [rural-area]
                description: The site is in the rural area.
        - discretionary
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: low
    notes: >-
      From the audit (missing_requirement): a Viability appraisal for the loss of rural commercial
      premises or where a reduced S106 offer is made (shown as officer discretion).

  - id: telecommunications-report
    action: add
    required-if:
      condition:
        field: telecommunications-development
        value: true
        description: The proposal is for telecommunications development.
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: medium
    notes: "From the audit (missing_requirement): the Telecommunications page asks for Telecommunications
      supporting information."

  - id: noise-assessment
    action: add
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: low
    notes: "From the audit (missing_requirement): listed as 'sometimes required' for residential new build;
      the audit gives no trigger."

  - id: air-quality-assessment
    action: add
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: low
    notes: "From the audit (missing_requirement): listed as 'sometimes required' for residential new build;
      the audit gives no trigger."

  - id: lighting-assessment
    action: add
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: low
    notes: "From the audit (missing_requirement): listed as 'sometimes required' for residential new build;
      the audit gives no trigger."

  - id: transport-assessment
    action: add
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: low
    notes: "From the audit (missing_requirement): a Transport assessment/travel plan is listed as 'sometimes
      required' for residential new build; the audit gives no trigger."

  - id: travel-plan
    action: add
    source-url:
      https://www.braintree.gov.uk/directory/50/planning-validation-requirements/category/294
    confidence: low
    notes: "From the audit (missing_requirement): a Transport assessment/travel plan is listed as 'sometimes
      required' for residential new build; the audit gives no trigger."

