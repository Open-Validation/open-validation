      https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
    suggested-id: agricultural-statement
  - local-name: Air Source Heat Pump Calculation
    source-text: "From the audit: an MCS calculation for 'All new single air-source heat pumps within
      a defined settlement' (householder and non-householder lists)"
    source-url: 
      https://www.hart.gov.uk/sites/default/files/2025-02/Householder-Validation-requirements-published-Feb-2025-version.pdf
    suggested-id: heat-pump-noise-calculation
  - local-name: Flood Risk Management Statement and Flood Impact Form (Causal Areas)
    source-text: "From the audit: non-major development in Causal Areas (Policy NBE5)"
    source-url: 
      https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
    suggested-id: flood-risk-assessment
  - local-name: Shop Front Details
    source-text: Shop Front Details - All applications for new shop fronts
    source-url: 
      https://www.hart.gov.uk/sites/default/files/2025-02/General-Non-householder-Validation-requirements-pubished-Feb-2025-version_0.pdf
    suggested-id: shopfront-details

low-confidence:
  - id: site-plan
    note: "Audit (wrong_trigger): the remaining excerpt is general text ('site/block plans, elevations,
      sections are required to describe the subject of your application')."
  - id: bng-metric
    note: "The excerpt is a heading fragment ('Statutory Biodiversity Metric. 11 PART 2 – Local Requirements...');
      BNG is a national requirement."

