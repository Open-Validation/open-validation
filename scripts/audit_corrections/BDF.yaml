    source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
    confidence: low
    notes: "From the audit (missing_requirement): Lighting Statement listed; no trigger given."

  - id: noise-assessment
    action: add
    source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
    confidence: low
    notes: "From the audit (missing_requirement): Noise Impact Assessment listed; no trigger given."

  - id: recreation-facilities-assessment
    action: add
    source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
    confidence: low
    notes: "From the audit (missing_requirement): Open Space Assessment listed; no trigger given."

  - id: viability-assessment
    action: add
    source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
    confidence: low
    notes: "From the audit (missing_requirement): Viability listed; no trigger given."

  - id: transport-assessment
    action: add
    source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
    confidence: low
    notes: "From the audit (missing_requirement): Transport Assessment/Statement listed; no trigger given."

  - id: travel-plan
    action: add
    source-url: https://www.bedford.gov.uk/files/local-validation-document-checklist-and-guidance-28-september.pdf/download?inline
    confidence: low
