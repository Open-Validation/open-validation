  - local-name: Neighbourhood Plan submission requirements
    source-text: "From the audit: where the parish's Neighbourhood Plan sets them"
    source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
    suggested-id: ""

low-confidence:
  - id: flood-risk-assessment
    note: "The excerpts list what to submit (a full FRA, or the SFRA proforma for sequential and exception
      tests) but not when; the Householder rows came from the combined Householder and LBC checklist (audit
      wrong_document)."
  - id: land-contamination-assessment
    note: "Audit (wrong_trigger): the excerpts are column-merged with GIRAMS and heritage text; no trigger."
  - id: landscaping-plan
    note: "Audit (wrong_trigger): the excerpt is column-merged retail text; no trigger."
  - id: recreation-facilities-assessment
    note: "Audit (wrong_trigger): the excerpts are column-merged retail and heritage text; no trigger."
