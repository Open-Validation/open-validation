  - local-name: Advertisement drawings
    source-text: "Advertisement Drawings – 1:50 or 1:100 showing size, siting, materials and colours to be
      used, height above ground, details of method and colour(s) of illumination … Section Through – 1:50 or
      1:100 showing extent of projection"
    source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9942/checklist_-_advertisement_consent.pdf
    suggested-id: advertisement-drawings
  - local-name: BNG Heads of Terms and monitoring fee
    source-text: "S106 heads of terms will be required at validation for any delivery of net gain within blue
      line land. **A monitoring fee will be required where the Council is responsible for monitoring progress
      towards Biodiveristy Net Gain delivery over the statutory 30 year period."
    source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
    suggested-id: heads-of-terms
  - local-name: Custom and self-build Heads of Terms
    source-text: "From the audit: listed in the Full Application checklist's local requirements"
    source-url: https://www.west-norfolk.gov.uk/download/downloads/id/9951/checklist_-_full_application.pdf
    suggested-id: self-build-statement
  - local-name: Odour Assessment
    source-text: "From the audit: commercial kitchens, takeaways and other odour sources"
