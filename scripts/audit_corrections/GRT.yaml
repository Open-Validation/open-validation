    source-text: "existing and proposed floor plans roof plans (if needed) All plans need to show key dimensions of all new works."
    source-url: https://www.guildford.gov.uk/article/22710/Planning-permission-for-works-or-extension-to-a-dwelling
    confidence: medium
    notes: "Audit (wrong_app_type): this is the householder page's 'roof plans (if needed)', not a Full planning item."

  - id: section-existing
    action: add
    required-if:
      all:
        - application-type:
            in: [full]
        - condition:
            field: involves-change-of-use
            value: true
            description: Full planning permission for a change of use only.
    source-text: >-
      You must submit drawings and information which describe the project, including: existing and
      proposed elevations existing and proposed floor plans existing and proposed site sections
      finished floor and site levels All plans need to show key dimensions of all new works.
    source-url: https://www.guildford.gov.uk/article/22699/Full-planning-permission-change-of-use-only
    confidence: medium
    notes: "Audit (missing_requirement): the change-of-use page's site sections weren't in any workbook row."

  - id: section-proposed
    action: add
    required-if:
      all:
        - application-type:
            in: [full]
        - condition:
            field: involves-change-of-use
            value: true
            description: Full planning permission for a change of use only.
    source-text: >-
      You must submit drawings and information which describe the project, including: existing and
      proposed elevations existing and proposed floor plans existing and proposed site sections
      finished floor and site levels All plans need to show key dimensions of all new works.
    source-url: https://www.guildford.gov.uk/article/22699/Full-planning-permission-change-of-use-only
    must-include:
      - item: Finished floor and site levels
        level: must
    confidence: medium
    notes: "Audit (missing_requirement): the change-of-use page's site sections and levels weren't in any workbook row."

