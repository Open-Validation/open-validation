# Corrections for St Helens Council, from the council's audit.
# Grokbot's link is a generic 'Your guide to planning & building Control' page, not a validation list.
# The audit found no St Helens local validation list: the 'Apply for planning permission' page (last
# modified 29 March 2022) lists only basic plans (elevations at 1:50 or 1:100, a 1:1250 location plan
# edged red, a 1:500 block plan) and the fee, and MHCLG's planning.data.gov.uk record notes
# "Couldn't find any sort of checklist". National requirements only.
local-authority: SHN

validation-list:
  url: https://www.sthelens.gov.uk/article/1917/Apply-for-planning-permission
  date: ""
  status: national-only
