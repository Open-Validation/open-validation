# Corrections for Havant Borough Council, from the council's audit.
# The list in force is 'Local Information Requirements - 03.04.23' (media/9115, effective
# 12 December 2022, minor updates 3 April 2023). Grokbot took most triggers from the 2024
# consultation draft (media/10122), which the council has not said was adopted. The audit could
# not compare contents (fetch budget ran out), so every file stays low confidence.
local-authority: HAA

validation-list:
  url: https://www.havant.gov.uk/media/9115/download?inline
  date: 2023-04-03
  date-basis: "audit: Local List page; in force from 12 December 2022, minor corrective updates 3 April
    2023"

submission-standards:
  - item: All plans must have a scale bar and show the original paper size
    level: must

drop:
  - id: schedule-of-works
    reason: "wrong_trigger: the excerpt is the Arboricultural Method Statement sentence"
  - id: travel-plan
    reason: "wrong_trigger: a reference list and page footer running into the Tree Survey text; no Travel
      Plan trigger"

drop-unmapped:
  - local-name: Self-build / custom build information
    reason: "wrong_trigger: BNG Self Build Exemption Claim Form wording, not a self-build requirement"
  - local-name: Ground investigation / Geotechnical / Basement Impact Assessment
    reason: "wrong_trigger: a list of SuDS content items"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: a recommendation to use the pre-application service"
  - local-name: Cycle parking details
    reason: "duplicate: repeats the Parking Provision trigger"
  - local-name: Foul Sewage / Utilities Statement
    reason: "duplicate: same entry as 'Drainage Strategy / SuDS' (Surface Water and SuDS and Foul Sewage
      Assessment)"
  - local-name: Marketing / vacancy evidence (loss of use)
    reason: "wrong_app_type / wrong_trigger: filed under prior approval and a page footer; re-added below"

requirements:
  - id: land-contamination-assessment
    action: replace
    required-if:
      any:
        - condition:
            field: dwelling-count
            operator: ">"
            value: 10
            description: New development of more than 10 dwellings.
        - site:
            in: [contaminated-land]
            description: Contamination is known to exist on the site.
        - all:
            - application-type:
                in: [full, outline]
            - site:
                in: [near-landfill-site]
                description: The site is within 250 metres of an existing or former landfill site 
                  listed by the Environment Agency (not householder applications).
    source-text: >-
      A Land Contamination Assessment will be required for: Any new development of dwellings,
      greater than 10 units Any site where contamination is known to exist Excluding householder
      application, any site situated within 250 metres of existing or former landfill site listed
      by the Environment Agency (see ‘Further Guidance’).
    source-url: https://www.havant.gov.uk/media/10122/download?inline
    confidence: medium
    notes: >-
      Audit (wrong_app_type): the workbook placed this under Householder and Minerals & waste
      (county); the trigger is about new dwellings, known contamination and landfill proximity.
      The landfill branch excludes householder applications; full and outline are shown as the
      main other types.

  - id: arboriculturist-report
    action: update
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: Trees are on the site, or off-site trees are in close proximity (including for 
          access drives, patios and drains/services).
    notes: "Audit (wrong_app_type): the AIA is required 'for any development' where trees are on or near
      the site, not just full planning."

  - id: heritage-statement
    action: update
    required-if:
      site:
        in: [listed-building, conservation-area, locally-listed-building, listed-building-setting]
        description: The application affects a heritage asset (a listed building, an unlisted 
          building in a conservation area or a locally listed building) or its setting.
    notes: "Audit (wrong_app_type): the trigger covers all applications affecting heritage assets, not
      only listed building consent."

  - id: environmental-statement
    action: update
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.

  - id: transport-assessment
    action: update
    required-if:
      any:
        - ref: major-development
        - discretionary
    notes: "Required for major development or where the proposal would lead to significant transport implications
      (council's wording)."

  - id: noise-assessment
    action: update
    required-if:
      condition:
        field: noise-sensitive-use
        value: true
        description: The development is noise sensitive and/or close to existing sources of noise or
          vibration (e.g. major roads, national railway lines, industry, wind turbines).

  - id: recreation-facilities-assessment
    action: update
    required-if:
      condition:
        field: loss-of-use
        value: true
        description: The development involves the loss of playing fields or sporting facilities.

  - id: viability-assessment
    action: update
    required-if: discretionary
    notes: "Required where applicants intend to make submissions about the viability of the development
      (council's wording)."

  - id: biodiversity-survey-report
    action: update
    required-if: discretionary
    notes: >-
      The excerpt says all applications must provide a Biodiversity Checklist 'as a minimum'
      (kept as the unmapped Biodiversity Checklist item); a fuller ecological assessment depends on
      the site. Audit (duplicate): the two rows shared one trigger.

  - id: site-plan
    action: update
    must-include:
      - item: Written dimensions to the boundaries
        level: must
        source-text: "Formerly optional, the requirement to provide written dimensions to boundaries is
          now required."
    notes: "From the council's Local List page; it may be a change introduced with the 2024 consultation."

  - id: elevation-existing
    action: update
    must-include:
      - item: Scale 1:100 or 1:50
        level: must
        source-text: "Existing and proposed elevations (scale 1:100 or 1:50)"

  - id: elevation-proposed
    action: update
    must-include:
      - item: Scale 1:100 or 1:50
        level: must
        source-text: "Existing and proposed elevations (scale 1:100 or 1:50)"

  - id: flood-risk-assessment
    action: update
    required-if:
      site:
        in: [flood-risk-zone]
        description: The site is in an area at risk of flooding.
    confidence: low
    notes: >-
      Audit (wrong_trigger, wrong_app_type): the excerpt is cut off at 'will be required for'; the
      audit says the FRA applies to all development in flood risk areas. Other national cases
      (such as large sites in flood zone 1) may also apply.

unmapped:
  - local-name: Marketing Statement
    source-text: >-
      A marketing statement is normally required for the following developments: Loss or change of
      use of a community facility or shop to a non-community use in line with Local Plan (Core
      Strategy) policy DM2
    source-url: https://www.havant.gov.uk/media/10122/download?inline
    suggested-id: marketing-evidence

low-confidence:
  - id: "*"
    note: >-
      Audit (wrong_document): most excerpts come from the 2024 consultation draft (media/10122), not
      the adopted list (media/9115, 3 April 2023); draft-only changes may not be in force.
  - id: air-quality-assessment
    note: "Audit (wrong_trigger): the excerpt is background on Part IV of the Environment Act 1995, not
      a trigger."
  - id: cil-form
    note: "Audit (wrong_trigger): the excerpt is the fragment 'of the CIL Regulations 2010 (as amended).'"
  - id: design-and-access-statement
    note: "Audit (wrong_trigger): the excerpt is cut off at 'outline and full planning permission for';
      national rules apply."
  - id: sustainability-statement
    note: "Audit (wrong_trigger): the excerpt is a sentence fragment with no trigger."
  - id: section-existing
    note: "Audit (wrong_trigger): 'Section drawings may also be requested in other cases.' - the main
      cases are not captured."
  - id: section-proposed
    note: "Audit (wrong_trigger): 'Section drawings may also be requested in other cases.' - the main
      cases are not captured."
  - id: lighting-assessment
    note: "Audit (wrong_trigger): the excerpt has empty bullets, so some cases are missing."
  - id: bng-metric
    note: "Audit (wrong_document): BNG wording may be a draft-only change from the 2024 consultation;
      the excerpt is background text."

