# Corrections for Oxfordshire County Council, from inputs/audit/oxfordshire-county-council.json.
# The audit could not fetch the county's pages (web budget exhausted), so contents were not
# checked. The workbook link is a 'ProposedLocalList' PDF, so whether it was adopted is unknown.
# This is a county authority (minerals, waste and its own Regulation 3 development): the
# workbook's householder, advert, LDC and PiP '(none)' rows don't apply to it.
local-authority: OXF

submission-standards:
  - item: All drawings include a scale bar and key dimensions
    level: must
  - item: Plans not marked 'Do not scale'; plans not drawn to scale are not accepted unless clearly 
      stated to be solely illustrative
    level: must
  - item: Plans scaled to fit A4 or A3 paper (unless agreed otherwise), each with a title, scale, 
      legend, units of measurement, north arrow if relevant and a unique reference number
    level: must
  - item: Maximum single file size 10MB; maximum 25MB in total
    level: must
  - item: PDF is the recommended file format
    level: should
  - item: Documents and drawings named in accordance with RIBA naming conventions
    level: must
  - item: Scanned documents at least 200 dpi (black and white) or 100 dpi (colour)
    level: must
  - item: Photographs in PDF format and no larger than 15 cm x 10 cm
    level: must

drop:
  - id: schedule-of-works
    reason: "wrong_trigger: the excerpt is the Arboricultural Method Statement / Tree Protection Plan
      (pre-commencement) text"
  - id: waste-management-plan
    reason: "wrong_trigger: the excerpt is the minerals and waste planning statement contents (now under
      planning-statement)"

drop-unmapped:
  - local-name: Advertisement drawings / illumination details
    reason: "wrong_trigger: lighting assessment text, now in lighting-assessment"
  - local-name: Agricultural / rural workers' dwelling appraisal
    reason: "duplicate: the Agricultural Land Classification text"
  - local-name: Coal Mining / Land Stability Risk Assessment
    reason: "wrong_trigger: the Ventilation/Extraction Statement text (kept under that row)"
  - local-name: Design Code / Masterplan / Parameter plans
    reason: "wrong_trigger: the Landscape Masterplan / Planting Plan text, now in landscaping-plan"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: BNG 30-year legal agreement text"
  - local-name: Drainage Strategy / SuDS
    reason: "duplicate: foul drainage text, kept under Foul Sewage / Utilities Statement"
  - local-name: Validation checklist form (completed)
    reason: "not_a_requirement: pre-application process text"
  - local-name: Pre-application advice / engagement details
    reason: "not_a_requirement: pre-application process text"

requirements:
  - id: archaeological-assessment
    action: replace
    required-if:
      site:
        in: [archaeological-priority-area, scheduled-monument, listed-building, conservation-area, 
              park-and-garden, world-heritage-site, locally-listed-building]
        description: The development affects the historic environment, including designated and 
          non-designated heritage and archaeological assets.
    source-text: >-
      Heritage and Archaeological Statements A heritage statement and/or archaeological statement will
      be required for developments affecting the historic environment (which includes designated
      heritage assets such as Listed Buildings, Conservation Areas, Scheduled Monuments, Registered
      Parks and Gardens, Registered Battlefields and World Heritage Sites (Blenheim Palace),
      non-designated heritage assets such as locally listed buildings and non-designated
      archaeological assets, and other areas…
    source-url: 
      https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
    policy: Policy 9
    confidence: low
    notes: "Audit (wrong_app_type): filed under listed building consent, which the county doesn't normally
      determine; the trigger is development affecting the historic environment."

  - id: heritage-statement
    action: replace
    required-if:
      site:
        in: [listed-building, conservation-area, scheduled-monument, park-and-garden, 
              world-heritage-site, locally-listed-building, archaeological-priority-area]
        description: The development affects the historic environment, including designated and 
          non-designated heritage assets.
    source-text: >-
      Heritage and Archaeological Statements A heritage statement and/or archaeological statement will
      be required for developments affecting the historic environment (which includes designated
      heritage assets such as Listed Buildings, Conservation Areas, Scheduled Monuments, Registered
      Parks and Gardens, Registered Battlefields and World Heritage Sites (Blenheim Palace),
      non-designated heritage assets such as locally listed buildings and non-designated
      archaeological assets, and other areas…
    source-url: 
      https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
    policy: Policy 9
    confidence: low
    notes: "Audit (wrong_app_type): filed under listed building consent, which the county doesn't normally
      determine; the trigger is development affecting the historic environment."

  - id: arboriculturist-report
    action: update
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: Trees or hedges are present within or around the application site.
    confidence: low

  - id: biodiversity-survey-report
    action: update
    must-include:
      - item: A data search from the Thames Valley Environmental Records Centre (TVERC), not the NBN
          Gateway or Magic, unless agreed otherwise with a planning officer
        level: must
    confidence: low

  - id: design-and-access-statement
    action: update
    required-if:
      any:
        - ref: major-development
        - all:
            - site:
                in: [conservation-area, world-heritage-site]
                description: Any part of the development is in a Conservation Area or World Heritage
                  Site.
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The provision of one or more dwelling houses.
    confidence: low
    notes: "The excerpt's second designated-area case (a building whose floorspace exceeds a threshold)
      is cut off, so it is not shown."

  - id: elevation-proposed
    action: update
    must-include:
      - item: Blank elevations included, if only to show that they are blank
        level: must
    confidence: low

  - id: environmental-statement
    action: replace
    required-if:
      condition:
        field: eia-development
        value: true
        description: The development needs an Environmental Impact Assessment.
    source-url: 
      https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
    confidence: low
    notes: "Audit (wrong_trigger): the workbook quoted the LVIA trigger."

  - id: land-contamination-assessment
    action: update
    required-if:
      site:
        in: [contaminated-land]
        description: Land thought possibly to be contaminated through earlier development.
    confidence: low

  - id: landscaping-plan
    action: replace
    required-if: discretionary
    source-text: >-
      A Landscape Masterplan/Landscape Strategy drawing will be required for most applications, a
      detailed Planting Plan is required where new planting is proposed.
    source-url: 
      https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
    must-include:
      - item: A detailed Planting Plan, where new planting is proposed
        level: must
    confidence: low
    notes: "Audit (wrong_trigger): the landscaping row quoted geodiversity policy references; this text
      was in the 'Design Code / Masterplan' row. 'Most applications' is shown as officer discretion."

  - id: lighting-assessment
    action: add
    source-text: >-
      hours of illumination), beam angles/geometry, the drawings/lighting calculations to demonstrate
      the spread of the light and the means of ensuring that the light does not extend beyond the site
      boundaries to the detriment of the amenity.
    source-url: 
      https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
    must-include:
      - item: Hours of illumination
        level: must
      - item: Beam angles/geometry
        level: must
      - item: Drawings/lighting calculations showing the spread of light and how it is kept within 
          the site boundaries
        level: must
    confidence: low
    notes: "Audit (missing_requirement, wrong_trigger): the lighting assessment content was filed under
      'Advertisement drawings'. The trigger is cut off."

  - id: planning-statement
    action: update
    must-include:
      - item: Description of the site and its context, including any designations
        level: should
        required-if:
          application-type:
            in: [mineral-app, waste-dev]
    confidence: low
    notes: "Council's wording: \"mineral and waste management applications, the supporting planning statement
      should also include: Description of the site and its context, including any designations\" (the
      rest of the list was lost)."

unmapped:
  - local-name: Bioaerosol Assessment
    source-text: "Bioaerosol Assessment Applications that involve the handling, storage or treatment of
      biodegradable waste, particularly composting applications, will need to be accompanied by a bioaerosol
      Assessment."
    source-url: 
      https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
    suggested-id: bioaerosol-assessment
  - local-name: Green Belt Statement
    source-text: "Green Belt Statement For applications in the Oxford Green Belt, where a development
      is inappropriate within the Green Belt, a statement will be required including an explanation of
      how th…"
    source-url: 
      https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
    suggested-id: green-belt-assessment
  - local-name: Habitats Regulations / Appropriate Assessment
    source-text: "Appropriate Assessment tests whether a proposal either alone or in combination with
      other plans or projects in proximity of the following sites is likely to have a significant negative
      impact on: Designated or potential Special Protection Areas … Designated or candidate Special Areas
      of Conservation … Ramsar or proposed Ramsar sites"
    source-url: 
      https://www.oxfordshire.gov.uk/sites/default/files/file/planning-planning-policy/ProposedLocalListSPBMH.pdf
    suggested-id: habitats-regulations-assessment

low-confidence:
  - id: "*"
    note: >-
      Audit (wrong_document, wrong_app_type): the link is a 'Proposed' (consultation draft) local
      list; check whether an adopted version exists. The county list applies to minerals, waste and
      Regulation 3 applications, but the workbook filed these rows under Full planning as 'INFERRED'.
  - id: air-quality-assessment
    note: "Audit (wrong_trigger): the excerpt is the Bioaerosol Assessment trigger (now unmapped); the
      air quality trigger is cut off."
  - id: transport-assessment
    note: "Audit (wrong_trigger): the excerpt is the tree/hedgerow survey trigger; no transport trigger
      is given."
  - id: site-plan
    note: "Audit (wrong_trigger): the excerpt is a fragment with no trigger."
  - id: sci
    note: "Audit (wrong_trigger): the excerpt is garbled ('of way Statement of Community Involvement Supporting
      Planning Statement All planning applications which meet the definition set out in the section')."

