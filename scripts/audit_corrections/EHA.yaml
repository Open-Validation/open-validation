  - id: noise-assessment
    note: "Audit (wrong_trigger): the excerpts stop at 'When required i.' and give no threshold."
  - id: travel-plan
    note: "Audit (wrong_trigger): the excerpts stop at 'All planning applications for: i.' and give no threshold."
  - id: affordable-housing-statement
