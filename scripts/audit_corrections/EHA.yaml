new-fields:
  - field: near-landfill-site
    kind: designation
    label: Near a landfill site
    description: Site is within the council's buffer distance (often 250m) of an existing or former landfill site.
  - field: parking-spaces
    kind: number
    label: New parking spaces
    description: Number of new parking spaces proposed.
  - field: open-space
    kind: designation
    label: Open space or playing fields
    description: Site is existing open space, playing fields or sports and recreational land or buildings.
  - field: out-of-centre-town-centre-use
    kind: boolean
    label: Main town centre use outside a centre
    description: The proposal is for a main town centre use (as defined in the NPPF) on a site outside a designated town centre.
  - field: telecommunications-development
    kind: boolean
    label: Telecommunications development
    description: The proposal is for telecommunications equipment such as a mast or antenna.
  - field: retail-floorspace
    kind: number
    label: Retail floorspace (sqm)
    description: Gross new or additional retail floorspace proposed, in square metres.
