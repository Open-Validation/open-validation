# Corrections for North York Moors National Park Authority, from the authority's audit.
# There is no separate local list: the 'Standard Local Validation Requirements' are built into
# each application form pack (the householder pack is marked ECAB 2024). Grokbot read only the
# forms-and-guidance hub page, so its three rows are link text. The requirements below are the
# audit's summary of the householder pack; the audit expects the other form packs (listed
# building consent, adverts, prior notifications) to carry the same checklist but did not read
# them, so no application type is given.
local-authority: NYMNPA

validation-list:
  url:
    https://www.northyorkmoors.org.uk/planning/planning-applications-and-planning-advice/planning-applications/forms-and-guidance/Householder-Planning-Application-Form.pdf
  date: "2024"
  date-basis: "audit: 'ECAB 2024' form version on the householder pack's pages; the 01 April 2026 date on
    the hub page is the fee schedule's"

requirements:
  - id: heritage-statement
    action: replace
    required-if:
      any:
        - application-type:
            in: [lbc]
        - site:
            in: [listed-building, conservation-area, park-and-garden, scheduled-monument,
              locally-listed-building]
            description: The works affect a listed building, conservation area, registered park or
              garden, scheduled monument or non-designated heritage asset.
    source-text: Required for Listed Building consent and for planning applications affecting a
      Listed Building…
    source-url:
      https://www.northyorkmoors.org.uk/planning/planning-applications-and-planning-advice/planning-applications/forms-and-guidance/Householder-Planning-Application-Form.pdf
    confidence: medium
    notes: >-
      Audit (wrong_trigger, missing_requirement): the workbook's excerpt was guidance-note link
      text and the row was placed under Full planning only. From the audit: required for listed
      building consent and for works affecting a listed building, conservation area, registered
      park or garden, scheduled monument or non-designated heritage asset (shown as locally listed
      building).

  - id: design-and-access-statement
    action: replace
    source-url:
      https://www.northyorkmoors.org.uk/planning/planning-applications-and-planning-advice/planning-applications/forms-and-guidance
    confidence: low
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt is only link text for a Design and Access
      Statement guidance note, and the type was guessed ('INFERRED'). The authority's own trigger
      was not captured; the national rules for a Design and Access Statement apply.

  - id: bng-metric
    action: replace
    required-if:
      condition:
        field: biodiversity-gain-condition
        value: true
        description: The development is subject to the biodiversity gain condition.
    source-text: Biodiversity Net Gain Under the Environment Act 2021 , new development in England
      must deliver at least 10% Biodiversity Net Gain, otherwise planning permission cannot be
      granted.
    source-url:
      https://www.northyorkmoors.org.uk/planning/planning-applications-and-planning-advice/planning-applications/forms-and-guidance
    confidence: low
    notes: >-
      Audit (wrong_trigger): the workbook's excerpt runs on from guidance-note link text and the
      type was guessed ('INFERRED'). The authority's wording is the national 10% rule, so it is
      shown against the biodiversity gain condition.

  - id: biodiversity-survey-report
    action: add
    required-if:
      any:
        - condition:
            field: protected-species
            value: true
            description: There is evidence of bats.
        - discretionary
    source-url:
      https://www.northyorkmoors.org.uk/planning/planning-applications-and-planning-advice/planning-applications/forms-and-guidance/Householder-Planning-Application-Form.pdf
    confidence: low
    notes: >-
      From the audit (missing_requirement): a Bat Scoping Survey for barn conversions with the roof
      substantially intact; demolition of pre-WW1 houses or barns; works to bridges, kilns, caves or
      tunnels; wind turbines within 50 m of a building, woodland or linear feature; or where there
      is evidence of bats. The rules can't express most of these cases, so they are shown as
      officer discretion.

  - id: flood-risk-assessment
    action: add
    required-if: discretionary
    source-url:
      https://www.northyorkmoors.org.uk/planning/planning-applications-and-planning-advice/planning-applications/forms-and-guidance/Householder-Planning-Application-Form.pdf
    confidence: medium
    notes: "From the audit (missing_requirement): a Flood Risk Assessment / Sequential Test where flooding
      implications arise."

  - id: arboriculturist-report
    action: add
    required-if:
      condition:
        field: trees-on-or-near-site
        value: true
        description: Trees on or next to the site could affect or be affected by the development.
    source-url:
      https://www.northyorkmoors.org.uk/planning/planning-applications-and-planning-advice/planning-applications/forms-and-guidance/Householder-Planning-Application-Form.pdf
    must-include:
      - item: Survey prepared to BS 5837:2012
        level: must
    confidence: medium
    notes: "From the audit (missing_requirement): a Tree Survey / Arboricultural Assessment to BS 5837:2012
      where trees on or next to the site could affect or be affected by the development."

unmapped:
  - local-name: Structural Survey
    source-text: "From the audit: conversion of traditional buildings"
    source-url:
      https://www.northyorkmoors.org.uk/planning/planning-applications-and-planning-advice/planning-applications/forms-and-guidance/Householder-Planning-Application-Form.pdf
    suggested-id: structural-survey
