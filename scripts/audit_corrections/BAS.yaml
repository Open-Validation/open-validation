# Corrections for Bath and North East Somerset Council, from inputs/audit/bath-and-north-east-somerset-council.json.
# B&NES has no downloadable local list: its 'Local requirements for planning applications' page
# indexes a separate, undated web checklist for each application type. Grokbot linked only the
# outline (all matters reserved) checklist and mostly extracted fragments of the Sustainable
# Construction Checklist SPD. The full planning checklist lists 32 documents that applications
# "may need to include", each with its own guidance page; the audit gives no item-by-item
# triggers, so they are shown as officer discretion for the types whose checklist lists them.
# Items marked "From the audit" use the audit's paraphrase, not the council's exact words.
# Not covered: the checklists for the other application types (adverts, demolition in a
# conservation area, s73, NMA, LDCs, discharge of conditions, PiP, prior approvals, trees) were
# not mapped by Grokbot and their contents weren't listed by the audit (issue 10).
local-authority: BAS

validation-list:
  url: https://www.bathnes.gov.uk/local-requirements-planning-applications
  date: ""
  date-basis: >-
    audit: the local requirements index page and its checklists show no adoption or update date
    (only 'Copyright 2026')

drop-unmapped:
  - local-name: Design Code / Masterplan / Parameter plans
    reason: "wrong_trigger: jumbled two-column text about policy SCR6 from the Sustainable Construction Checklist"
  - local-name: Drainage Strategy / SuDS
    reason: "wrong_trigger: Table 8 (Water) of the Sustainable Construction Checklist, not a drainage strategy"
  - local-name: Planning Obligations / S106 draft Heads of Terms
    reason: "wrong_trigger: Table 2.2 of the Sustainable Construction Checklist; heads of terms re-added below"
  - local-name: Water efficiency / water usage statement
    reason: "wrong_trigger: the Sustainable Construction Checklist's 110 l/p/d tick-box"
  - local-name: Ventilation / Extraction details (odour)
    reason: "wrong_trigger: the checklist's indoor-air-quality section; the real ventilation and extraction statement is re-added below"
  - local-name: Validation checklist form (completed)
    reason: "not_a_requirement: the fragment 'Type of application required to submit the Checklist 2'"

requirements:
  - id: sustainability-statement
    action: replace
    required-if:
      any:
        - all:
            - condition:
                field: new-build
                value: true
                description: The proposal includes new-build residential development.
            - condition:
                field: dwelling-count
                operator: ">="
                value: 1
                description: The proposal creates one or more dwellings (including replacements,
                  co-living, student accommodation, holiday lets and HMOs).
        - all:
            - condition:
                field: new-build
                value: true
                description: The proposal includes new-build non-residential development.
            - condition:
                field: floorspace-non-residential
                operator: ">="
                value: 1000
                description: 1,000 square metres or more of non-residential floorspace.
        - condition:
            field: dwelling-count
            operator: ">="
            value: 5
            description: Medium-scale or larger works to existing buildings (5 or more dwellings).
        - condition:
            field: floorspace
            operator: ">="
            value: 500
            description: Medium-scale or larger works to existing buildings (500 square metres or
              more).
        - discretionary
    policy: "Sustainable Construction Checklist SPD; Local Plan SCR6"
    source-url: https://www.bathnes.gov.uk/policy-and-documents-library/sustainable-construction-checklist
    must-include:
      - item: Energy Summary Tool
        level: must
        required-if:
          condition:
            field: dwelling-count
            operator: ">="
            value: 1
            description: The proposal is residential.
    confidence: medium
    notes: >-
      From the audit (wrong_trigger): the Sustainable Construction Checklist is required for new-build
      residential of 1+ dwellings (including replacements, co-living, student accommodation, holiday
      lets and HMOs), major non-residential new build of 1,000 m2+, medium-scale or larger works to
      existing buildings (5+ dwellings / 500 m2) and district heating proposals (shown as officer
      discretion). There is no exemption for listed buildings. It should accompany Sustainability
      Statements or Energy Strategies. The workbook's excerpt was scrambled table text.

  - id: archaeological-assessment
    action: replace
    required-if:
      all:
        - application-type:
            in: [mineral-app]
        - site:
            in: [scheduled-monument, archaeological-priority-area]
            description: The proposal might affect ancient monuments or sites of archaeological
              importance.
    source-text: >-
      Archaeological assessment If your proposal might affect ancient monuments or sites of
      archaeological importance you will be required to undertake an archaeological assessment as
      part of the application.
    source-url: https://www.bathnes.gov.uk/planning-permission-mineral-extraction-or-associated-development
    confidence: medium
    notes: >-
      Audit (wrong_app_type): this text is from the mineral extraction checklist, not full
      planning. For full planning the council covers archaeology through the Heritage Statement.

  - id: biodiversity-survey-report
    action: replace
    required-if:
      any:
        - all:
            - application-type:
                in: [full, outline, hh, lbc]
            - discretionary
        - all:
            - application-type:
                in: [mineral-app]
            - condition:
                field: protected-species
                value: true
                description: The site is known or suspected to have protected species (e.g. badgers,
                  bats, certain reptiles and breeding birds).
    source-text: >-
      Householder applications may need to include: Biodiversity and Geological Conservation
      Assessment; Flood risk assessment; Parking and Access Arrangements, as part of a Design and
      Access Statement
    source-url: https://www.bathnes.gov.uk/householder-application-checklist
    confidence: medium
    notes: >-
      Audit (wrong_app_type, missing_requirement): the workbook's text came from the mineral
      extraction checklist (it cites the superseded 1994 Habitats Regulations). The council's
      'Biodiversity and Geological Conservation Assessment' is listed on the full, outline,
      householder and listed building consent checklists; for listed building consent, where work
      affects areas such as vaults or roof space.

  - id: affordable-housing-statement
    action: add
    required-if:
      all:
        - application-type:
            in: [full, outline]
        - discretionary
    source-text: "full planning applications may need to include the following supporting documents"
    source-url: https://www.bathnes.gov.uk/full-planning-application
    confidence: medium
    notes: "From the audit (missing_requirement): listed on the full and outline checklists."

  - id: air-quality-assessment
