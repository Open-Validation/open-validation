low-confidence:
  - id: biodiversity-survey-report
    note: "The workbook's trigger stops at 'When Required' (the audit's wrong_trigger issue on truncated triggers); no replacement trigger is given."
  - id: recreation-facilities-assessment
    note: "The workbook's excerpt is a fragment about a play space strategy; no trigger is given."

new-fields:
  - field: height-change
    kind: boolean
    label: Change in building height
    description: The proposal raises a roof or changes the height of a building, including floor-to-ceiling heights.
  - field: footprint-increase
    kind: boolean
    label: Increase in built footprint
    description: The proposal increases the built footprint on the site.
  - field: new-boundary-treatment
    kind: boolean
    label: New boundary treatment
    description: The proposal includes new or altered boundary walls, fences or gates.
  - field: scheduled-monument
    kind: designation
    label: Scheduled monument
    description: Site is, contains or affects a scheduled monument (dataset scheduled-monument).
  - field: roof-works
    kind: boolean
    label: Roof works
    description: The proposal alters or disturbs a roof or the roof structure (for example roof extensions, dormers, loft conversions or raised roofs).
