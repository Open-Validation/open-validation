  - local-name: Fire Statement (London Plan)
    source-text: "From the audit: all major development, new dwellings including conversions, commercial development and changes of use"
    source-url: https://www.bromley.gov.uk/downloads/file/35/validation-guidance-and-local-information-requirements-for-planning-applications
    suggested-id: london-plan-fire-statement
